- id: sapling-height
  what: >-
    The sapling is about 40 cm, ALWAYS SHORTER THAN HE IS, in every beat of 002b.
    Ruled 2026-08-16 ("has a set height ... just dont make it double in size
    suddenly"); the figure is the 002a/b/c row of the canonical growth ladder and
    is stated outright by the show's own voiced VO on beat 03, "I am forty
    centimeters tall".
    CORRECTED 2026-08-16, AND THE OLD WORDING IS QUOTED SO NOBODY RESTORES IT:
    this entry read "The sapling is knee-high on the goblin -- about 40 cm" until
    today. `knee-high` is wrong here because the growth ladder in
    genomes/sapling/style.md already assigns it to NODE 004 AT ~90 CM -- the same
    word at two heights 2.25x apart in one document family, and read literally it
    puts the goblin at ~1.4 m and makes 004's own row label ("knee-high") false
    for 004's own plant. The FIGURE and the RELATION are both sourced and both
    stay; only the body-part metaphor goes, and nothing replaces it, so the canon
    now speaks in the ladder's own 002a/b/c height cell and can no longer collide
    with a row label.
    AND THE PREMISE UNDER IT, corrected in the same pass: the VO is THE SAPLING
    (node.md:30, "I used to be an engineer. Now I'm a tree."); the goblin's
    speaker label is SCAVENGER. "I am forty centimeters tall" is therefore the
    PLANT stating its own height -- direct evidence, not corroboration -- and THE
    GOBLIN'S HEIGHT IS STATED NOWHERE IN THIS REPO. "Knee-high on the goblin"
    converted the plant's own line into a measurement of the goblin's body and so
    invented a number for him. This entry now says nothing about how tall he is,
    deliberately: that question is live and it is the founder's (R4).
    TWO THINGS THIS ENTRY DELIBERATELY DOES NOT FORBID, both verified against the
    corpus first: `standing tall` (nine drafts) is POSTURE, not height -- ledgered
    in taste/steward-model.v1.md A7, "'Reads tall' is about how the subject sits in
    the FRAME, not about the character's stated size", and beat 02 writes both at
    once ("a tiny 40cm mascot-simple sapling standing tall"). `no taller than the
    grass around it` (beats 01, 12) is compatible with 40 cm in summer grass.
    Forbidding either would fire on ten drafts for no defect.
    WHAT THIS ENTRY CANNOT SEE TODAY, said plainly rather than left to be
    discovered: `taller than he is` is NOT in wave-drafts.yaml. It lives in the
    `payload:` prompt text of six beat-15 job specs, and check_canon_drift.py does
    not read job-spec payloads -- it reads wave-drafts drafts and `--variant` argv
