# THE CANON REGISTER — the input to `pipeline/check_canon_drift.py`.
#
# WHAT THIS FILE IS FOR. Three times in two days a decision moved and the thing
# that actually RUNS did not:
#
#   1. 2026-08-14/15 the founder cast both guards. The approval was written into
#      review/inbox.yaml and NOWHERE ELSE. STATE.md, done-definitions.yaml,
#      steward-picks-0815.yaml and gate-evidence.yaml all still said "unapproved",
#      and four beats (05, 09, 10, 11) stayed blocked for a day on a decision that
#      already existed. Fixed in 740e6212 / 2cff145d.
#   2. 2026-08-12 the guard reference sheets moved off `bald` (charref r4/r5:
#      "`bald` comes out, `short hair` and `visible face` go in"). The change never
#      reached one staged beat plate: 22 of the 57 guard-beat prompts in
#      wave-drafts.yaml still ask for `bald`. Beat 11's logged "identity collapse -
#      the bald scalp fills in with dark hair" was the render drifting TOWARD the
#      correct cast, recorded as a defect. Found in e4279ce5.
#   3. 2026-08-13/14 the fig became PURPLE and was written into three beat-20
#      drafts. No render has ever produced a purple frame: 56 rendered fig prompts
#      across beats 19 and 20, zero containing the word. The colour sheet built on
#      08-15 therefore asked the founder to rule on 08-12 frames whose prompt
#      contains no colour word at all, and he rejected a colour the beat was never
#      asked for.
#
# WHY A REGISTER AND NOT A HEURISTIC. Both were measured against this repo before
# this file existed:
#
#   * FOR DECISIONS. Matching resolved inbox cards to records by shared content
#     words (the originally sketched design) produces 47 hits on today's repo and
#     the great majority pair the wrong card with the wrong line — "guard cast
#     unapproved" in gate-evidence.yaml gets matched to a card about publishing
#     episode 1. A check at that precision gets switched off in a week, the way the
#     runner watchdog was after 60 false restarts in five hours.
#   * FOR PROMPTS. `bald` appears in 272 rendered goblin prompts and 84 guard ones.
#     For the goblin it is CANON; for the guards it is the defect. No word-level
#     heuristic can tell those apart, because the difference is not in the word, it
#     is in who the sentence is about. A rule with no notion of subject either
#     misses instance 2 or fires on every goblin prompt in the repo.
#
# So the subject is declared once, here, and the checker does the cross-product.
#
# HOW YOU ARE MEANT TO USE IT. Register a subject WHEN YOU WRITE THE BLOCK, not
# when it clears. The moment the founder answers in review/inbox.yaml, the checker
# starts failing on every record that still says the subject is open — which is
# exactly the day of silence that instance 1 cost.
#
# THIS FILE CANNOT GO STALE QUIETLY. Every entry names `evidence:` — a file and a
# literal string that must still be in it. If the canon moves and this register is
# not updated, the evidence stops matching and the checker FAILS on the register
# itself rather than on the repo. Same for `acknowledged:` entries: one that no
# longer matches anything fails as `stale_acknowledgement`, so the suppression list
# prunes itself instead of accumulating into a blindfold.
#
# $0, no GPU, no network, pure text. Run: python3 pipeline/check_canon_drift.py

# ---------------------------------------------------------------------------
# Record files a founder-decision subject is checked against. YAML files are
# adjudicated structurally (key path + dated `*_CORRECTION_*` sibling) and can
# FAIL. Markdown logs are append-only prose and are reported at REVIEW only —
# see check_canon_drift.py's module docstring for the measurement behind that.
records:
  structured:
  - review/ep2-picks/done-definitions.yaml
  - review/ep2-picks/steward-picks-0815.yaml
  - review/ep2-picks/gate-evidence.yaml
  - review/ep2-picks/wave2-faults-fixer.yaml
  - cuts/cuts.yaml
  # ADDED 2026-08-16, and it is the record instance 5 was hiding in. This file is
  # measured 2026-08-14 09:40Z and pipeline/queue_history.py copies every beat's
  # `state` and `note` into the run ledger's per-row verdict, which /queue
  # publishes — so a state that a decision moved past does not sit quietly in one
  # measured file, it reprints on the board once per job row. 352 rows did.
  - pipeline/measured/episode-progress.yaml
  prose:
  - STATE.md
  - DECISIONS.md
  - STEWARDSHIP.md

