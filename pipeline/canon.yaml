# THE SAPLING, ruled 2026-08-16. Three subjects, because he ruled on three
# things and they fail in different places:
#
#   sapling-two-leaves       the count. His word, no inference in it.
#   sapling-cotyledon-shape  the shape. STEWARD INFERENCE from the count.
#   sapling-height           the size. His word; today the checker cannot see
#                            where it is broken, and the entry says so.
#
# All three are backed by genomes/sapling/THE-SAPLING.md, which is the prose
# canon. It is a NEW file rather than a section of genomes/sapling/style.md
# because style.md disclaims itself on its own third line ("STALE (2026-07-27)
# ... Do not render from this") and a canon kept in a file that says not to use
# it is not a canon.
#
# A NOTE ON THE FORBID PATTERNS, because this is a real sharp edge. The checker
# reads each draft as ONE string: the positive clause and the `No ...` negative
# tail are concatenated, and nothing in it distinguishes them. So a forbid on a
# bare term fires on the drafts that BAN that term -- the corrected drafts say
# `no green fig` and `no lobed leaves`, and a naive /green fig/ or /lobed/ would
# report every one of them as a violation. That is the cry-wolf failure that got
# the runner watchdog disabled, arriving by a different door. Every pattern below
# is therefore written so the negatives cannot match it: `(?<!no )` where the term
# is one we also ban, and the exact positive phrasing (`deeply lobed`, `five
# fingers` with a space) where the ban uses a different form (`no lobed leaves`,
# `five-fingered`). Verified by running the sweep against the corrected file, not
# assumed. If you add a term here, run it and read the ACK/FAIL lines.

- id: sapling-two-leaves
  what: >-
    The sapling has TWO leaves. Ruled by the founder 2026-08-16: "make sure it has
    2 leafs and has a set height". Supersedes his 2026-08-08 "dont overthink the
    leafs on it", which taste/steward-model.v1.md A1 had recorded as a standing
    rule that leaf count is NOT to be scored. Both dates are in THE-SAPLING.md §5
    so nobody applies the older rule and skips scoring the leaves.
  kind: prompt_canon
  since: '2026-08-16'
  evidence:
    file: genomes/sapling/THE-SAPLING.md
    contains: 'Every prompt that puts the plant in frame asks for **exactly two leaves**'
  scope:
    beats: [1, 2, 3, 4, 12, 13, 15, 16, 18, 19, 20, 21]
    prompt_mentions: \bsapling\b|\bseedling\b|\bleaf\b|\bleaves\b
  forbids:
  - three or four leaves
  # WHY THE BARE KEY `authored` IS SAFE TO ACKNOWLEDGE HERE AND ALMOST NOWHERE ELSE.
  # The ack list matches on variant NAME with no beat filter, so acknowledging
  # `authored` would normally be a blindfold: every beat has an `authored` key. It
  # is safe for THIS subject only because the forbidden phrase `three or four
  # leaves` occurs on exactly one beat's drafts in the whole corpus (beat 01), so
  # the suppression cannot reach a second beat even in principle. DO NOT COPY THIS
  # LINE to a subject whose forbid appears widely -- there it would switch the
  # check off for twenty-one beats at once.
  acknowledged:
    recorded_in: genomes/sapling/THE-SAPLING.md
    recorded_contains: sapling_drafts_ACK_0816
    variants:
    - authored
    - authored_b01_t2i_fig

