    anything. It is written correctly ANYWAY, so it starts working the moment the
    reader is widened to payloads. Until then the payload sweep is
    pipeline/check_sapling_scale.py.
  kind: prompt_canon
  since: '2026-08-16'
  # Retires the `sapling-height` axis in `axes:` below: writing the canon down is
