# refs-goblin-d1-margin-0815 — the same four tiles, half the size, more air.
#
# WHY THIS SET EXISTS. On 2026-08-15 refs-goblin-d1-0815 was rendered on beat 04
# as a controlled A/B (job ep2-b04-d1refs-0815, byte-identical to
# ep2-goblin-freeze-w015-0814 except --refs) and the sixteen frames split by
# SLOT, not by seed:
#
#   slot s0  crouch tile   -> 3 to 3.5 heads tall, oversized bald cranium, pink
#   slot s1  crouch tile      cheeks on three of eight. Babies. The founder's
#                             exact complaint, unchanged by the swap.
#   slot s2  standing tile -> 4.5 to 5 heads, longer robe, no blush, dour. The
#                             best round of the four and the only one arguably
#                             inside the brief.
#   slot s3  bust tile     -> busts.
#
# NONE of the sixteen was crouching, though two of four references were. So the
# reference is not carrying POSE. The reading the previous lane wrote down is
# that it carries FRAMING, and that the model converts framing into PROPORTION:
# in a crouch tile the head fills a third of the frame, and the model draws a
# full-body figure whose head fills a third of the figure — a toddler.
#
# THAT READING IS A STORY UNTIL THE CROP IS THE ONLY THING THAT MOVES. This set
# is the one-variable version of it.
#
# ------------------------------------------------------------ WHAT CHANGED
# Nothing but scale. Each 832x832 tile of refs-goblin-d1-0815 is resampled to
# 416x416 (LANCZOS) and pasted dead centre on an 832x832 white field. No new
# crop is taken out of the source sheet, so no neighbouring figure, no new
# content and no new colour enters the set; every figure pixel is the frozen
# tile's own pixel, at half the linear size. The tiles' background is already
# pure white on all four corners (verified at staging), so the added field is
# continuous with what was there.
#
# The staging script is pipeline/refs/stage_margin_refs.py. It refuses to run if
# any source tile's sha256 is not the frozen one — which it already did once,
# on a mistyped hash in its own first draft.
#
# The consequence, and the whole point: the fraction of the tile the HEAD
# occupies halves.
#
#   slot  source tile   head height / tile height   ->  margined
#   s0    crouch        ~33%                            ~17%
#   s1    crouch        ~34%                            ~17%
#   s2    standing      ~19%                            ~9.5%
#   s3    bust          ~65%                            ~33%
#
# Read that table against the verdict table above and the mechanism's claim is
# arithmetic rather than adjectival: 33% drew 3-3.5 heads, 19% drew 4.5-5 heads,
# 65% drew a portrait. If head-fraction is the driver, the margined set moves
# every slot one rung DOWN that same ladder, and margined s3 (33%) should land
# where the ORIGINAL crouch slots landed. That is a replication inside a single
# sixteen-frame run, not an extrapolation.
#
# --------------------------------------------------------- STILL NOT A POSE FIX
# This set does not and cannot make a plate start crouched. Pose does not
# transfer through IP-Adapter at this window; it has to come from the prompt or
# from a real pose conditioner (ControlNet, or img2img off a posed plate). Beat
# 08's pending two-figure reference cannot deliver a crouched, belly-occluded
# start this way, and commissioning it crouched would only make the scavenger
# smaller and rounder. Nothing here revises that.

