# All four are distinct sha256, verified at staging, so the sampler's dedup drops
# no cell and an arm draws all sixteen frames rather than silently fewer. That is
# the specific blocker this set was built to clear.
distinct_slots: 4

not_scored:
- slot: s3
  why: >-
    OFF-DESIGN, and it is a drift in the CHARACTER rather than in the picture
    quality. Its ears came back small and rounded instead of long and pointed and
    its skin reads grey rather than green, so it is a bald old man rather than the
    design-#1 goblin. It fills the fourth slot because the sampler builds slots as
    `{prefix}-s{i}` for i in 0..3 and refuses outright on a missing file.
- slot: s1
  why: >-
    DEMOTED AFTER THE PLATE SAMPLE, on a measurement rather than a look. Border
    blankness (fraction of the outer 12% of the tile that is near-white) is 0.387
    on this tile against 0.000 and 0.002 on s0 and s2 — its sky is a pale glow and
    its lower corners are white paper. The plate sample then showed that number is
    not cosmetic: see blankness_transfer below.

# THE SET IS USABLE IN TWO SLOTS, NOT FOUR, AND THAT IS MEASURED. Use s0 and s2.
# s1 and s3 must be REPLACED before this set is pointed at any beat — the material
# to replace them with is more frames off the UNPADDED anchor, which is what the
# seed-extension jobs are producing.
use_slots: [s0, s2]
replace_before_use: [s1, s3]

# Recorded so a later lane does not have to re-find it: the leanest and tallest
# figure of the sixteen is NOT in this set.
alternate_if_proportion_is_wanted_over_location: >-
  04-the-footnote-ipa-r1-w015-s2.png, sha256
  3627f58d159b97cb438be46be489b0af331f08e50adc04755f65c072f6963dd2 — roughly 6
  heads, lean and wiry, excellent pointed ears, dour. It is excluded because it
  stands on blank white with one tuft of grass, and blank paper in the reference
  is the defect this set exists to avoid.

# ---------------------------------------------------- WHAT THIS SET IS NOT
# It teaches the adapter ONE ANGLE, well. All four tiles are frontal standing
# figures: the generation run produced no three-quarter, no profile and no back
# view in sixteen frames, because a round varies the REFERENCE and every round
# shares one prompt, so the four views a turnaround wants cannot be commissioned
# one per round. Seeds varied the face and the ground, not the camera.
#
# AND IT IS NOT A POSE FIX. Nothing here makes a plate start crouched or folded.
# Across forty-eight frames on three jobs, pose transferred neither from the
# reference nor from the prompt — including a draft that named the pose as a
# STATE with every rule the wording audit produced. Two of the three staged poses
# the episode needs, CROUCHED (beats 03 04 07 08 12) and FOLDED (beats 13-end 14
# 15 16 17-start), remain unreachable by this mechanism and need a real
# conditioner: ControlNet openpose, or img2img off a hand-staged posed plate.
# STANDING (beats 17-end 18 19 20) is the one pose this set serves, and it is the
# one pose the mechanism reliably produces.

# ---------------------------------------------------------------- THE SAMPLE
# ONE SAMPLE: ep2-b04-d1stand-0815, beat 04, arm window4, draft key
# `authored_goblin_approved_recipe` — byte-identical to ep2-b04-d1margin-0815
# except --refs, --ref-prefix and --out. rc=0, 16 frames, ~4 min, $0 local GPU.
# All sixteen opened by the lane that fired it, 2026-08-15.
#
# 1. THE LOCATION PREDICTION HELD, AND IT IS THE RESULT THIS SET WAS BUILT FOR.
#    Fifteen of sixteen plates came back OUTDOORS — grass fields, clouded skies,
#    a sunset treeline, distant hills, a lake. The stated falsifier ("blank or
#    near-blank backgrounds anyway") did NOT fire.
#
# 2. BLANKNESS TRANSFERS FROM THE TILE, ONE FOR ONE. This is the sharpest number
#    the lane has produced and it is what demoted two slots. Border blankness of
#    the REFERENCE tile against the mean border blankness of the four PLATES that
#    tile drew:
#
#      tile s0  0.000  ->  plates 0.004     located
#      tile s2  0.002  ->  plates 0.004     located
#      tile s3  0.218  ->  plates 0.204     part paper
#      tile s1  0.387  ->  plates 0.493     half paper, some with a white border
#
#    Monotone, and near enough to the identity line to read as a transfer rather
#    than a correlation. THE REFERENCE DECIDES THE LOCATION — confirmed a third
#    time, now with a number instead of an adjective. The corollary is the useful
#    half: a tile that is clean gives plates that are clean, which is why this set
#    is usable in s0 and s2 and must not be used in s1 and s3.
#
# 3. BLUSH CAME BACK, AND THE REFERENCE DID NOT STOP IT. Roughly fourteen of the
#    sixteen carry pink cheek patches, some with blush whisker-lines, soft round
#    cheeks and large red eyes. This is NOT a regression in the set and it is not
#    in tension with the generation run — it is the DRAFT. This sample deliberately
#    ran `authored_goblin_approved_recipe`, which says "A small goblin boy" and
#    carries no anti-blush term at all, because holding the draft fixed is what
#    made the reference the only variable. The generation run
#    (ep2-b04-standing-views-0815) drew ZERO blush in sixteen off these same
#    references, using adult wording plus `blush, red cheeks, chibi, big head, baby
#    face, toddler, child` in the negative.
#
#    SO THE TWO CARRY DIFFERENT THINGS, and this is the load-bearing conclusion
#    for whoever re-points a beat:
#        the REFERENCE carries the LOCATION and the build.
#        the DRAFT carries whether he is a blushing child or a dour adult.
#    Pointing a beat at this set WITHOUT also giving it the adult wording and the
#    anti-blush negative buys a better background and hands back the baby.
#
# 4. PROPORTION HELD at roughly 5 to 5.5 heads, measured on the full-resolution
#    frame (r2-s0: skull-to-chin 200 px against skull-to-sole 1065 px = 5.3). That
#    is inside the band the standing references were chosen to produce and it did
#    not collapse under the "small goblin boy" wording — so the wording's damage
#    here is to the FACE, not to the height.
#
# 5. ONE ARTEFACT worth recording: r3-s1 drew two faded GHOST FIGURES flanking
#    him. It is the off-design slot and one frame in sixteen, but a second figure
#    appearing unbidden on a `solo` prompt is the kind of thing that becomes a
#    wave-wide defect if it is not written down.
sample:
  job: ep2-b04-d1stand-0815
  control: ep2-b04-d1margin-0815
  beat: 4
  arm: window4
  draft_key: authored_goblin_approved_recipe
  rc: 0
  frames: 16
  out: C:\banyan-farm\goblin-ipa-0812\out-b04-d1stand-0815
  blankness_transfer: {s0: 0.000 -> 0.004, s2: 0.002 -> 0.004, s3: 0.218 -> 0.204,
    s1: 0.387 -> 0.493}
  verdict: >-
    SPLIT, and it splits by SLOT exactly as the tile blankness predicts. The two
    clean tiles (s0, s2) drew eight plates in a real location — that is the result
    the set was built for and the blank-paper falsifier did not fire. The two dirty
    tiles (s1, s3) drew paper in proportion to their own, so they are demoted rather
    than defended. Blush returned in ~14 of 16 because the control draft carries no
    anti-blush term; the same references with the adult draft drew zero blush in
    sixteen. No beat re-pointed, no wave fired, nothing published.

