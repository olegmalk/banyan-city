# refs-goblin-d1stand-0815 — four STANDING FULL BODIES, all on real ground.
#
# WHY THIS SET EXISTS, and it is a blocker rather than a hypothesis. The two
# scored experiments of 2026-08-15 agreed on what to build next and then ran out
# of material to build it from:
#
#   ep2-b04-d1refs-0815    the two CROUCH slots drew 3-to-3.5-head babies; the
#                          STANDING slot drew 4.9 heads and was the only round
#                          inside the brief.
#   ep2-b04-d1margin-0815  re-cropping the same tiles wider moved the crouch
#                          rounds by a third of a head and left them babies. The
#                          decisive pair: margined crouch tiles at head fraction
#                          .17 and the control's standing tile at .19 sit on the
#                          same rung and drew 3.3 heads against 4.9. Head
#                          fraction is not the driver; the CROUCHED BODY is. Its
#                          own closing line: "the standing slot is the only one
#                          worth building on, and building on it needs MORE
#                          standing tiles rather than more crops of this one."
#
# And d1 seed s1 holds exactly ONE sound standing tile. Four copies of one
# picture is ONE distinct reference: the content dedup shipped that morning
# would have drawn four frames instead of sixteen while the job returned a code
# that reads like success. So the standing tiles had to be GENERATED.
#
# ------------------------------------------------------------------ PROVENANCE
# Every tile in this set comes from ROUND r0 of ep2-b04-standing-views-0815, a
# generation job whose IP-Adapter anchor was that one sound standing tile:
#
#   anchor:        goblin-d1std-s0.png
#   anchor_sha256: 9526882ef5d6653b22a79d632e7aca6840fc8ea55b88bba207c350f932525b69
#   which is byte-identical to refs-goblin-d1-0815 slot s2, itself cut from
#   farm-out/ep2-goblin-design-d1-0814/04-the-footnote-wave1-s1.png
#   sha256 389c763783efdb1057f56ac8116200519427b4da2aff28f44ce23838868f5910
#   on origin/farm-results-rtx5090 — the founder's design #1, seed s1, the only
#   sound seed of the four (s0 melted midfaces, s2 a beaked profile and Japanese
#   onomatopoeia, s3 a pelican jowl).
#
# So the design carries by conditioning, not by re-cropping, and the chain from
# the founder's pick to these four tiles is unbroken and hashed at every hop.
#
# ------------------------------------------------- WHY ONLY ROUND r0, AND IT IS
#                                                    THE RUN'S MAIN FINDING
# The generation job swept the anchor at four margins — 1.00, 0.75, 0.55, 0.40 —
# one per round. r0 (UNPADDED) returned four frames in a PLACE: sky, cloud,
# meadow, flowers, distant trees. r1, r2 and r3 (the same tile WHITE-PADDED)
# returned blank paper in 11 of 12 frames, with at most a tuft of grass under
# the boots.
#
# The prompt those twelve frames were drawn from says "standing in sunlit grass,
# pale sky above him" and its negative carries `white background, simple
# background` — measured present in the sent string. THE WORDING DID NOT
# OVERRIDE THE REFERENCE. Blank paper is imposed by the reference's white field,
# and no draft reaches it. That is why re-cropping and re-padding are abandoned
# here rather than tuned, and why a tile from r1/r2/r3 would have carried the
# defect straight into the next set.
#
# THE SECOND FINDING, which retires the margin lever for this purpose: r0's
# frames came back at ~5.5 heads off an UNPADDED anchor. The margin sweep's
# whole promise was that padding buys head-to-body ratio. Once the ask is
# STANDING and the wording is ADULT, the proportion is already there and the
# padding only costs the location.

set: refs-goblin-d1stand-0815
frozen_on: '2026-08-15'
box_path: C:\banyan-farm\wave-goblin-prep\refs-goblin-d1stand-0815
ref_prefix: goblin-d1stand
character: goblin
generated_by: ep2-b04-standing-views-0815 (round r0 only)
staged_by: pipeline/refs/stage_standing_refs.py
anchor_reference: goblin-d1std-s0.png
anchor_reference_sha256: 9526882ef5d6653b22a79d632e7aca6840fc8ea55b88bba207c350f932525b69
source_design: farm-out/ep2-goblin-design-d1-0814/04-the-footnote-wave1-s1.png
source_design_sha256: 389c763783efdb1057f56ac8116200519427b4da2aff28f44ce23838868f5910
source_branch: origin/farm-results-rtx5090

# THE SQUARING, and there is no white in it anywhere. The harness centre-crops
# its reference to a square before the CLIP image processor sees it, which on an
# 832x1216 portrait would silently eat the skull and the boots — the figure
# spans about 92% of the frame height. So the square is made at staging and the
# harness's own crop becomes a no-op:
#
#   832x1216 frame -> resample to 569x832 (PIL LANCZOS)
#                  -> paste centred on an 832x832 canvas
#                  -> fill the remaining band on each side by stretching that
#                     frame's own outermost COLUMN sideways
#
# Every pixel is its own frame's pixel and the tile is sky-over-grass edge to
# edge. TWO DEFECTS WERE CAUGHT DOING THIS AND BOTH ARE RECORDED, because both
# would have been invisible downstream:
#   * The first revision pasted symmetric side bands. 832*832/1216 rounds to
#     569, so band*2 + 569 is 831 and the last column stayed unpainted — a BLACK
#     stripe down the right edge of all four tiles. The corner assertion caught
#     it; the eye had not.
#   * The second revision MIRRORED the outer strip instead of stretching a
#     column, and on two tiles that strip contained his SLEEVE — so the finished
#     reference showed a detached fragment of arm floating at the frame edge. A
#     duplicated limb is exactly what `extra limbs` sits in the negative to
#     prevent, and putting one in the reference would be asking for it. Caught by
#     eye, replaced with column extension, which cannot duplicate any figure part.
transform: >-
  resample the 832x1216 frame to 569x832 (PIL LANCZOS), paste centred on an
  832x832 canvas, and fill the 131 px / 132 px band on each side by stretching
  that frame's own outermost column. No white padding and no invented content.

# Mapping is by CONTENT HASH in both directions — the frame it came from and the
# bytes it is now — because a slot POSITION is not evidence and a lane already
# lost a day to an s0/s1 position mix-up.
