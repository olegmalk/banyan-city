replaces: refs-goblin-approved-0814

# ---------------------------------------------------------------- THE SAMPLE
# ONE SAMPLE, ONE VARIABLE: job ep2-b04-d1refs-0815, beat 04, arm window4, the
# same draft key, arm and seeds as ep2-goblin-freeze-w015-0814, which used
# refs-goblin-approved-0814. rc=0, 16 frames, ~4 min, $0 local GPU. Opened by
# the lane that fired it, 2026-08-15.
#
# THE VERDICT IS SPLIT BY SLOT, and that is the whole finding:
#
#   r0 (s0, crouch A)   FAIL. 3 to 3.5 heads tall. Oversized bald cranium,
#   r1 (s1, crouch B)   FAIL. stubby limbs, tiny hands. Pink cheek patches on
#                       three of eight frames. r0-s2 has large blue-green eyes
#                       and reads outright CUTE. These are babies. This is the
#                       founder's exact complaint, unchanged by the swap.
#
#   r2 (s2, standing)   BEST OF FOUR. Roughly 4.5 to 5 heads, longer robe, no
#                       blush, dour half-lidded expression, red eyes. Reads as a
#                       lanky adolescent rather than a toddler. Still short-
#                       limbed and large-craniumed; not an adult, but it is the
#                       only round that is arguably inside the brief — "a young
#                       dumb goblin, but not cute", not old, not a baby.
#
#   r3 (s3, bust)       Busts, as asked. Adolescent-to-young-adult faces, dour,
#                       red eyes; faint blush on two of four. Good faces, but a
#                       portrait is not a beat plate.
#
# WHAT THIS MEASURES, and it is the opposite of what the set was weighted for:
# at this 15% window the reference transfers FRAMING and PROPORTION, NOT POSE.
# NONE of the sixteen frames is crouching. A bust reference produced busts; a
# standing full-body reference produced standing full-body; the two crouch
# references produced standing full-body too — but chibi, because in a crouch
# tile the head fills a large fraction of the frame and the model reads that as
# "big head relative to body". The tighter the reference crops to the head, the
# more infantile the output.
#
# CONSEQUENCE FOR THE POSES-NOT-PORTRAITS PLAN: staging a crouched reference
# will NOT make a plate start crouched. Pose has to come from the prompt or from
# an actual pose conditioner (ControlNet / img2img off a posed plate). Beat 08's
# pending two-figure reference cannot deliver a crouched, belly-occluded start
# through this mechanism, and commissioning it crouched will only make the
# scavenger smaller and rounder.
#
# NEXT SAMPLE THIS ARGUES FOR (not run — budget, and the founder is awake): the
# same beat and arm on a set whose four slots are the SAME tiles re-cropped with
# generous margin, so the head is small in every frame. If margin is what carries
# proportion, that is a one-variable test of it and it costs four minutes.
sample:
  job: ep2-b04-d1refs-0815
  control: ep2-goblin-freeze-w015-0814
  beat: 4
  arm: window4
  rc: 0
  frames: 16
  out: C:\banyan-farm\goblin-ipa-0812\out-b04-d1refs-0815
  verdict: HELD. r0/r1 (crouch slots) fail the brief outright; r2 (standing slot)
    is the only round arguably inside it. No wave fired, no beat re-pointed.
