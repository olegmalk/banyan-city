# What this set is NOT to be confused with. All 2026-08-12, all carrying the
# blush the founder rejected, all retired:
retired_predecessors:
- refs-goblin-frozen-0812
- refs-goblin-head-0812          # one file duplicated four times
- refs-charref-goblin-0812
- refs-charref-goblin-scope-0812
