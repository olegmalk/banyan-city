# then padded with white to a square and resampled to 832x832, so the harness's
# own centre-crop-to-square is a no-op and cannot silently eat a head or a foot.
# `isolation` records how the tile was separated from its neighbours: the sheet's
# figures touch, so a white-halo connected-component split works for three of
# them and the standing figure needed a hand-placed cut.
