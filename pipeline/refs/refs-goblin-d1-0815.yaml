# refs-goblin-d1-0815 — the frozen goblin reference set, 2026-08-15.
#
# WHY THIS FILE EXISTS. A reference set on the box is four PNGs in a directory
# whose names the harness fixes (`<ref-prefix>-s0..s3.png`), so the filename can
# say nothing true about what is inside. On 2026-08-15 a lane found
# refs-b07-mixed-0815 holding four files all still named
# `04-the-footnote-wave1-sN.png` from a goblin wave, two of which were guards —
# the sidecars that run writes therefore record a reference filename that is
# WRONG. Before that, a lane lost a day to an s0/s1 position mix-up. So the
# standing rule: POSITION IS NOT EVIDENCE, the mapping is by CONTENT HASH, and
# it is written down here rather than in a job comment that only one job reads.
#
# This set uses an honest --ref-prefix (`goblin-d1s1`) instead of inheriting the
# beat-04 wave names, so the sidecars it produces name their own source.
#
# ------------------------------------------------------------------ PROVENANCE
# The founder picked goblin design #1 on 2026-08-14, with a warning: "some of
# the heads in the reference are dismorphed or something, so just, beware."
#
# Of the four d1 seeds only s1 is sound. The other three are REJECTED and no
# tile from any of them is in this set:
#   s0  dd73eb20..  roughly four of nine heads have a melted midface
#   s2  516a3651..  a faceless egg-head, a beaked profile, and Japanese
#                   onomatopoeia text that would leak into any conditioned render
#   s3  dacdef09..  a drooping pelican jowl on every head
#
# Every image below is a crop of ONE file:
#   source:        farm-out/ep2-goblin-design-d1-0814/04-the-footnote-wave1-s1.png
#   source_sha256: 389c763783efdb1057f56ac8116200519427b4da2aff28f44ce23838868f5910
#   source_branch: origin/farm-results-rtx5090   (NOT on main)
#   source_size:   832x1216
#
# The one bad tile in s1 — the mid-centre profile head, whose mouth floats as a
# red dot on the cheek, source box roughly (340,370)-(573,670) — is EXCLUDED.
#
# ------------------------------------------------------------- POSES, NOT FACES
# Body-position ruling, 2026-08-15: a reference must answer WHERE IS HIS BODY at
# the start of the beat, not only what the character looks like. Nine of nine
# beats whose plate must hold the scavenger's body were failing their required
# starting pose, most often to a standing "default idle". So this set is
# weighted to the CROUCH — two of four slots — and every slot's pose is named,
# so a later lane picks the right one per beat instead of taking whatever is
# first.
#
# The three staged poses the chain needs:
#   crouched behind the sapling   beats 03 04 07 08 12   -> slots s0, s1
#   folded on the ground knees up beats 13-end 14 15 16 17-start -> slots s0, s1
#   standing beside the sapling   beats 17-end 18 19 20  -> slot  s2
#
# NOTE FOR THE TWO-FIGURE SET beat 08 is waiting on: commission it CROUCHED.
# Beat 08 points at his belly, which a knees-up crouch occludes, so the pose is
# load-bearing twice over.

set: refs-goblin-d1-0815
frozen_on: '2026-08-15'
box_path: C:\banyan-farm\wave-goblin-prep\refs-goblin-d1-0815
ref_prefix: goblin-d1s1
character: goblin
source_file: farm-out/ep2-goblin-design-d1-0814/04-the-footnote-wave1-s1.png
source_sha256: 389c763783efdb1057f56ac8116200519427b4da2aff28f44ce23838868f5910
source_branch: origin/farm-results-rtx5090

