# refs-goblin-d1std-0815 — the margin sweep, 2026-08-15.
#
# WHY THIS SET EXISTS, and it is the opposite of what its predecessor was built
# for. refs-goblin-d1-0815 weighted itself to the CROUCH — two of four slots —
# on the body-position ruling that a reference must answer WHERE IS HIS BODY.
# Its one sample, ep2-b04-d1refs-0815, measured the reverse:
#
#   r0, r1  the two knees-up CROUCH slots   3 to 3.5 heads tall, oversized bald
#           cranium, no neck, stubby limbs, pink cheek patches. Babies.
#   r2      the STANDING full-body slot     4.5 to 5 heads, longer robe, NO
#           blush, dour and half-lidded. The only round inside the brief.
#   r3      the BUST slot                   good adolescent faces; a portrait is
#           not a plate.
#
# NOT ONE OF THE SIXTEEN IS CROUCHING. At the 15% window the reference carries
# FRAMING and PROPORTION, not POSE — and the two crouch tiles, in which the head
# fills much of the frame, produced the ROUNDEST goblins. That is the hypothesis
# this set exists to test in one variable: is HEAD MARGIN what carries the
# infantile proportion?
#
# ------------------------------------------------------------------- THE SWEEP
# Four copies of the one slot that worked, at four margins. No new tile is cut,
# no new figure is introduced, and the isolation work that separated the
# standing figure from the tiles it overlaps is preserved rather than redone —
# expanding the crop box in the source would pull the neighbouring figures back
# in, because the sheet's figures touch.
#
#   s0  the standing tile BYTE-IDENTICAL (sha256 9526882e...), 100% of canvas
#   s1  the same figure at 75% of the 832x832 canvas, centred, on white
#   s2  the same figure at 55%
#   s3  the same figure at 40%
#
# s0 being byte-identical is the point: round r0 of ep2-b04-crouchplate-0815 is
# a TRUE ONE-VARIABLE A/B against round r2 of ep2-b04-d1refs-0815 — same beat,
# same arm, same seeds, same reference bytes — and the only difference is the
# draft. Everything the margin does shows up as the difference between r0 and
# r1/r2/r3 within the SAME job. If proportion moves monotonically with margin,
# the crop is the lever; if it does not, that hypothesis is dead and the next
# lever is the model, not the crop.
#
# POSITION IS NOT EVIDENCE — the mapping below is by CONTENT HASH, as
# refs-goblin-d1-0815 established after a lane lost a day to an s0/s1 mix-up.

set: refs-goblin-d1std-0815
