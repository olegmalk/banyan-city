# ---------------------------------------------------------------- THE SAMPLE
# ONE SAMPLE: ep2-b04-crouchplate-0815, beat 04, arm window4, draft key
# authored_b04_crouch_plate. $0, local GPU. Nothing is published and no beat is
# re-pointed at this set until the sixteen frames have been opened.
#
# The draft is the OTHER half of the change and it is deliberate: pose has to
# come from the prompt because this sample proved it cannot come from the
# reference. It names the pose as a STATE ("crouched on his heels", never
# "crouches"), gives the plant a body (a thin stem rising from the grass with
# exactly two oversized leaves, base in shot), leaves headroom above the skull
# for a rise, says "a lean wiry adult goblin man" rather than "a small goblin
# boy", and negates blush and red cheeks — the founder's own diagnosis of why
# the goblin reads infantile. Measured before sending: positive 75/77 with the
# style anchor surviving, negative 70/77 with `photorealistic` and `3d render`
# still the first two terms.
sample:
  job: ep2-b04-crouchplate-0815
  control: ep2-b04-d1refs-0815 (round r2)
  beat: 4
  arm: window4
  draft_key: authored_b04_crouch_plate
