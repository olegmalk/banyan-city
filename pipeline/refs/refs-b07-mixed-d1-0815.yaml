# lane, held four files all named `04-the-footnote-wave1-sN.png` — names that lie
# about their contents — and two of the four were wrong for this beat:
#
#   old s0  582e5ab5..  refs-goblin-approved-0814/s0   the INFANTILE goblin
#   old s1  466b18bb..  refs-goblin-approved-0814/s1   the INFANTILE goblin
