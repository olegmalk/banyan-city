#   old s3  9b4a0a14..  refs-guards-chosen-0814/s1     guard A, BACK view    (dropped)
#
# THE BACK VIEW IS THE FOUNDER'S "FLOATING CLIPBOARD". Opened and confirmed
# 2026-08-15: the guard's white waist sash is drawn as a rigid rectangular slab,
# and in the BACK view (9b4a0a14..) it reads as a board strapped across his lower
# back. Worse for this beat than the artefact itself: beat 07's action is
# POINTING AT SOMEONE, and a quarter of its conditioning was a man turned fully
# away from camera. That slot is gone.
#
# ALSO DROPPED: refs-guards-chosen-0814/s3 (955c75f4..) was never in the old set
# and must not be added — it is a TWO-PANEL turnaround, front and back side by
# side in one image, so conditioning on it risks imposing two guards on a beat
# that wants one guard and one goblin. Beat 10 already measured that a
# single-figure reference imposes a single figure; this is the same law read
# backwards.
#
# NOT FIXED HERE, AND SAY IT OUT LOUD: refs-guards-chosen-0814 is on
# box_enqueue.py's CARD_REFS_DENYLIST — 20 of its 24 downstream plates scored as
# costume identity cards. Every tile in it is a DEFAULT IDLE on a flat pale-grey
# studio void: arms at sides, no location, no action. Swapping the back view for
# the head view removes a turned-away guard; it does not give beat 07 a guard
# who is doing anything. A guard reference that answers "where is his body when
# he points" does not exist yet and has to be commissioned.
#
# AND A COSTUME FACT NO JOB FILE HAS EVER MENTIONED: the reference guard wears
# WIRE-RIM GLASSES. They are plainly there in s0, s2 and s3. Nothing in
# wave-drafts or any beat prompt says so, so every render either invents them or
# drops them at random.

