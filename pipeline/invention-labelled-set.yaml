# check_invention.py's FIRST LABELLED SET — ground truth, not recollection.
#
# Every threshold in check_invention.py before 2026-08-09 was tuned against
# remembered viewings of beats 11 and 01. This file is the first set where the
# label is KNOWN, and it is known because the clips were made one variable apart
# on purpose (task 002b-b16-drift-0809, commit ea62f69): same plate bytes, same
# recipe, same four seeds, two prompts differing by 38 bytes — the clause
# "; the scavenger sits blurred behind it" and nothing else. Three of the four
# control seeds drew a full anime human into a plant-only plate; none of the four
# treatment seeds did.
#
# WHAT "INVENTED" MEANS HERE, precisely: the clip contains a person who is not in
# the conditioning frame. It does NOT mean the clip is bad, and it does not mean
# every other kind of invention (a morphing rock, a second sprout) looks like
# this. A detector validated on this set is validated on ONE failure mode.
#
# THE SET IS SPENT IF IT IS FITTED. It is nine clips. A rule tuned until these
# nine come out right has learned these nine, which is the mistake
# check_invention.py's own churn note (check_invention.py:171) was written to
# prevent. Evaluate against it, report the statistics honestly, and read
# pipeline/eval_invention.py's family-wise correction before believing anything.
#
# THE CLIPS ARE NOT IN GIT. review/ is untracked by gate G5 — no candidate pixel
# is committed — so the sha256 below is the whole of the provenance a future
# reader gets. eval_invention.py verifies it and refuses a clip whose bytes have
# changed rather than quietly measuring a different file.

