# DATASET — the adult goblin (THE SCAVENGER / Jerry), SDXL character LoRA
#
# 2026-08-20. $0. This file is the CURATION, made by opening the pixels: a
# 51-frame contact sheet plus a 26-frame face-crop sheet of the beat-20 seeds.
# Every include and every reject below has a reason a later lane can check.
#
# WHY THIS CHARACTER. Founder ruling 2026-08-20: one-episode characters get no
# consistency infrastructure. Jerry is on screen in 8 nodes across ep2-ep7; the
# sapling is in 16/16. Those two are the recurring cast that earns a LoRA, and
# ep3 (`003b-one-leaf-for-yes`) has exactly those two on screen and nobody else.
# The guards are ep2-only and are explicitly out of scope. See
# `pipeline/research/character-lora-sdxl-0820.md` §0.
#
# THE POOL. 51 frames in farm-out/ carry the RATIFIED adult wording
# (`lean wiry adult goblin man, green skin, bald head, patchwork cloak`) in
# their own sidecar `prompt:`. That string is the 2026-08-19 B-group wording the
# founder chose; frames drawn from the older child/bald-gremlin wordings are not
# in the pool at all, which is why the pool is 51 and not several hundred.
#
# ── THE FINDING THAT CHANGED THE CURATION, and it is not a small one.
# NINE OF THE TWENTY-SIX beat-20 seeds draw the goblin in WIRE-RIM GLASSES.
# Glasses are not in his prompt, are not in his canon, and ARE the canon of
# guard A, who is rendered from the same harness on adjacent beats. 35% of the
# highest-volume dir in the pool carries another character's signature feature.
# Trained unfiltered, the LoRA would have learned glasses as part of Jerry --
# and it would have learned it from the one dir big enough to dominate the set.
# Every one is rejected below by name. This is exactly the defect a dataset
# manifest exists to catch, and it is invisible in a filename.
#
# ── THE SECOND FINDING, recorded but NOT acted on, because it is R4.
# Ear shape is not stable across the pool: some frames give long pointed elf
# ears, some small rounded near-human ears. The ratified wording says nothing
# about ears, so nothing is wrong with any of these frames -- but a LoRA will
# average whatever we feed it. `genomes/sapling/nodes/002b-first-citizen/node.md`
# also describes "one broken tusk", and NO frame in the pool has a tusk at all.
# Both are taste calls (R4) and both are put to the founder with pixels rather
# than settled here. Until he rules, the set is deliberately mixed on ears, so
# the LoRA averages rather than commits to a reading he did not make.
#
# ── FRAMING MONOCULTURE, stated because it caps what this LoRA can be.
# Almost every frame is a crouched or seated figure in grass at eye level or
# above. There is one true close-up (beat 04) and no standing figure, no walking
# figure, no back view, no night. 25 of the 51 are one prompt at 25 seeds. The
# variety axis is thin and no amount of curation thickens it; the honest fix is
# a purpose-rendered variety batch, named in `pipeline/lora/README.md` as the
# next rung and NOT fired here.

subject: jerry
character: THE SCAVENGER (Jerry) -- the adult goblin
trigger: bnyjerry
canon_wording: lean wiry adult goblin man, green skin, bald head, patchwork cloak
base_model: cagliostrolab/animagine-xl-3.1
native_size: 832x1216

# ── CAPTIONING RULE (research doc §4). Tags naming a PERMANENT attribute are
# deleted so they get absorbed into the trigger; tags naming a VARIABLE stay, so
# they stay promptable. `prune` is applied to the sidecar's own prompt text --
# these frames were rendered from prompts already written in our booru dialect,
# so the prompt is a better caption source than a tagger would be, and it is
# ground truth about what was asked rather than a guess about what was drawn.
prune:
  # The identity run itself. Order matters: longest first.
  - 'a lean wiry adult goblin man, green skin, bald head, dusty patchwork cloak'
  - 'a lean wiry adult goblin man, green skin, bald head, patchwork cloak'
  - 'lean wiry adult goblin man, green skin, bald head, dusty patchwork cloak'
  - 'lean wiry adult goblin man, green skin, bald head, patchwork cloak'
# Identity ADJECTIVES on an otherwise-variable phrase. The pose survives, the
# permanent attribute does not: "both green clawed hands resting flat" is a
# pose we want to keep steering, "green" and "clawed" are Jerry.
rewrite:
  'both green clawed hands': 'both hands'
  'both clawed hands': 'both hands'
  'green clawed hand and forearm': 'one hand and forearm'

