  A v3 score is therefore attributable.
founder_ratified:
  the_21: CARRIED. The founder read all 21 at 1:1 against his own image on 2026-08-22 and
    ruled `all ok`. Their bytes are unchanged and re-asserted at build time.
  the_posed_frames: NOT RATIFIED, AND NOT PRESENTED AS RATIFIED. They are steward-made training
    frames whose HEAD is byte-identical to the ratified canon by arithmetic (rows 0..883 pasted
    back and asserted) and whose LEGS are generated. Ratifying the input was never ratifying
    what is made from it, and a trained v3 still has to pass the bars at 1:1.
the_diagnosis: The standing prior is ONE FRAME DEEP, not 21. Of the 21 ratified frames, 11
  are upper-body crops and 8 are cowboy shots; the only two that show a lower body are the
  canon and its mirror, verified byte-identical to taste/refs/goblin-canon-founder-0821.png
  and to its mirror. Every knob that failed -- round seven's weight ladder, the two-pass's
  six cells -- was hunting for a competing lower-body configuration to fade toward. There
  is one picture to fade from.
the_caption_law: A caption tag keeps an attribute steerable ONLY WHERE THE ATTRIBUTE VARIES
  IN THE DATASET. v2 named `standing` on all 21 and pose stayed unpromptable (B5 fails), while
  the SETTING generalised cleanly out of one meadow -- because the base checkpoint varies
  backgrounds for any subject and `hazy meadow` had somewhere to attach outside the LoRA,
  and nothing outside the LoRA knows what this creature's legs look like. v3 is the first
  set in which the pose token varies in PIXELS.
