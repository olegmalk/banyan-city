not_admitted:
  cell: posed-oneknee
  draws:
    20260823: asymmetry 81.4 (highest in the set); right thigh 80 RGB units off the canon's
      sage as a pink slab at mid-limb, which no crop reaches.
    20260824: the pink slab is gone and the asymmetry with it -- both legs do the same thing.
      Passes P1 by failing A1, which the spec ruled in advance is the seat with extra steps.
    20260825: 'the same trade a second time: symmetric, both knees up, hands on the knees,
      thighs pale and boots real. TWO OF THREE DRAWS ON THIS HINT SYMMETRISED HIM, which is
      what makes this a measured property of the stance rather than one unlucky frame.'
  ruling: 'NOT ADMITTED, ON THREE DRAWS, AND THE FINDING IS WORTH MORE THAN THE FRAME WOULD
    HAVE BEEN. The reseed budget was two draws, declared before either ran, and both were
    spent; with the original cell that is three noise draws on one hint. The pattern across
    them is not noise: when the hint forces the two legs apart the material pays (a pink slab
    at mid-limb), and when the material comes back clean the net has symmetrised him. An anime
    checkpoint''s prior for a small frontal figure is strongly bilateral, and on this route
    THE HINT REACHES THE POSE AND DOES NOT REACH THE PAINT -- so on the one stance that fights
    that prior, the two cannot presently be had together. The asymmetry axis stays unrepresented
    in v3 and that is recorded as a known gap, not papered over: if v3 poses but poses symmetrically,
    this is the first place to look.'
  evidence:
  - farm-out/ep2-goblin-lowerbody-0822/jerry-posed-oneknee-0822.png
  - farm-out/ep2-goblin-lowerbody-0822/jerry-posed-oneknee-r2-0822.png
  - farm-out/ep2-goblin-lowerbody-0822/jerry-posed-oneknee-r3-0822.png
known_gap: NO ASYMMETRIC FRAME. All three posed frames are mirror-symmetric, as are all 21
  carried ones, so the trigger still has never seen this creature's left leg do something
  its right leg is not doing. The one-knee cell was built for exactly that axis and both budgeted
  draws traded pose against paint (see not_admitted). If v3 poses but poses symmetrically,
  this is the first place to look and the fix is a third draw or a re-authored asymmetric
  hint, neither of which is a research question.
known_defect_carried_into_training: PALE THIGHS ON THE LIT SIDE, ON ALL THREE POSED FRAMES.
  This is the route's standing P3 clause and it is being trained on deliberately rather than
  overlooked. It sits at MID-LIMB, so unlike the paw feet no crop reaches it; the stopping
  rule against a fourth wording rung was filed before ep2-b13-lowerbody-w3-0822 rendered and
  two cells that moved this clause both traded something else away. The licensed $0 fix is
  a palette-transfer compositor off the canon's own bare shin (RGB 120.4 / 130.0 / 110.4,
  sampled at 355..385 x 925..945), which has no sampler in it and is the house tradition --
  beat20_fig_recolor.py. It is NOT applied here because that would be a second variable against
  v2 and the whole point of this set is that there is one. If v3 poses correctly but paints
  his legs pale, that compositor is the next step and it costs no card time.
shared_torso_risk: 'ALL THREE POSED FRAMES SHARE ONE UPPER BODY, BYTE FOR BYTE -- the canon''s,
  moved by the same integer DROP of 150. That is three copies of one torso, one pair of arms
  and one light. If v3''s identity bar FALLS relative to v2, this is the first suspect, and
  the answer is cheap: re-crop, or re-run the masked pass at more than one DROP so the torso
  sits at a different height in each.'
