# SAPLING LoRA — THE SAMPLES, RE-FILED. The weights already exist.
#
# 2026-08-22. $0 (local card). ~6 GPU-minutes.
#
# ══════════════════════════════════════════════════════════════════════════
# WHY THIS EXISTS AS A SEPARATE JOB AND WHY IT DOES NOT RE-TRAIN.
#
# `lora-sapling-0822-1787380176` TRAINED CLEANLY: 660 optimizer steps in 20m02s
# at 1.82 s/it, avr_loss 0.105, "model saved", step `train` END rc=0 at
# 06:50:52Z. FIVE checkpoints are on the box, 228,453,516 bytes each:
#
#   C:\banyan-farm\lora-sapling-0822\out\bnysapling-sdxl-v1-000002.safetensors
#   ...-000004 / -000006 / -000008
#   C:\banyan-farm\lora-sapling-0822\out\bnysapling-sdxl-v1.safetensors  (final)
#
# The job was then marked FAILED by its `sample` step, nine seconds later, for a
# reason that has nothing to do with the training:
#
#   File "...\sample_lora.py", line 76, in main
#     pipe.load_lora_weights(...)
#   ValueError: PEFT backend is required for this method.
#
# diffusers 0.29.2 gates ALL LoRA loading behind `USE_PEFT_BACKEND`, which is
# False unless `peft` is importable. It was absent from BOTH venvs on the box --
# render venv AND venv-lora -- because `sample_lora.py` was written on 2026-08-20
# and committed without ever being run. RE-TRAINING WOULD FIX NOTHING AND WOULD
# BURN THE CARD FOR TWENTY MINUTES TO REPRODUCE A FILE THAT IS ALREADY CORRECT.
# So this spec is the three sample steps and the publish step, pointed at the
# weights that already exist.
#
# THE ENVIRONMENT FIX, AND WHAT WAS DONE TO MAKE IT SAFE. `peft==0.12.0` was
# installed into `C:\banyan-farm\venv` with `--no-deps`, at 06:53Z, with the
# queue empty and no job running. `--no-deps` is the whole safety argument:
# SETUP.md's standing warning is that a careless pip resolve on this sm_120 card
# silently replaces torch with a build that has no Blackwell kernels and breaks
# EVERY render on the box. peft's own requirements were all already present.
# Verified rather than asserted, immediately after:
#   * `pip freeze` before vs after differs by EXACTLY ONE LINE, `peft==0.12.0`
#   * torch still 2.11.0+cu128, transformers still 4.44.2, diffusers still 0.29.2
#   * a bf16 matmul on the card returns: "cuda ok NVIDIA GeForce RTX 5090 Laptop GPU"
#   * `USE_PEFT_BACKEND` is now True
# `sample_lora.py` now refuses up front when the backend is missing, with the
# `--no-deps` command in the message, so this cannot cost another run.
#
# WHICH CHECKPOINT: the FINAL one, which is what the original spec's sample step
# named. Grading an earlier epoch is a separate job and a separate verdict; the
# five are on disk precisely so that choice stays open, and picking one now
# because it is convenient would be picking before looking.
# ══════════════════════════════════════════════════════════════════════════

id: lora-sapling-sample-0822
task: lora-sapling-sample-0822
node: 003b-one-leaf-for-yes
runner: box
needs_gpu: true
priority: 70
max_attempts: 1
owner: the sapling-LoRA lane, 2026-08-22

script_authority: 'Not a render of a script and not an episode assembly. Three
  test stills from a weight file that already exists; nothing enters an episode,
  a leaf or a shot board, and sample_lora.py writes approved: false /
  provisional: true into every sidecar itself.'

consumer: 'Step 0 of train-sapling-0822.yaml BARS — the ONE SAMPLE that gates
  whether the 15-frame grid (pipeline/lora/bars-sapling-0822.yaml, written and
  deliberately unfiled) is ever rendered. Without these three frames the LoRA is
  909 MB of weights nobody can rule on, and the founder has nothing to look at.'

success: 'Three PNGs and their sidecars in farm-out. The tilled-earth frame is
  looked at by eye at 1:1 before anything else is filed; the no-regression pair
  is judged side by side. A bad sample is a full result and stops the ladder.'

why: 'The card is idle, the founder is asleep, and every beat rung in flight is
  founder-gated. Six GPU-minutes turns a finished training run into a decision.'

est_minutes: 8

