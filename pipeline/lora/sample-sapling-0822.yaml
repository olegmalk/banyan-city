# ── 4. PUBLISH.
#
# THE .safetensors ARE DELIBERATELY NOT COPIED, and this is the one place this
# spec differs from the original in intent rather than in scope. Each checkpoint
# is 228,453,516 bytes; GitHub hard-rejects any blob over 100 MiB; and
# box_runner.Courier._publish runs `git add -A -- farm-out` and then pushes, so
# ONE oversized file would leave a permanently unpushable commit at the head of
# farm-results-rtx5090 and every other lane's results would stop reaching the
# tree behind it. That is a repo-wide outage caused by one lane's publish step.
# Three guards now block it (repo .gitignore, a farm-out/.gitignore on the box's
# courier worktree, and a per-job one), all verified with `git check-ignore`, but
# the honest thing is for the glob not to reach for them in the first place.
#
# The sha256 manifest DOES travel and it names the weights, so any sample here
# remains traceable to the exact bytes that drew it — that is the property the
# checkpoint copy was there to provide, and it survives.
- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv-lora\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = r"C:\banyan-farm\courier-box\farm-out\lora-sapling-0822"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob(r"C:\banyan-farm\lora-sapling-0822\out\SAMPLE-*.png")
                 + glob.glob(r"C:\banyan-farm\lora-sapling-0822\out\SAMPLE-*.meta.yaml"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        with open(os.path.join(dst, os.path.basename(f)), "rb") as fh:
            lines.append(hashlib.sha256(fh.read()).hexdigest() + "  " + os.path.basename(f))
    # The weights stay on the box, but their hashes travel -- otherwise a sample
    # is traceable only to a filename, and a filename is not bytes.
    for w in sorted(glob.glob(r"C:\banyan-farm\lora-sapling-0822\out\*.safetensors")):
        with open(w, "rb") as fh:
            lines.append(hashlib.sha256(fh.read()).hexdigest()
                         + "  ON-BOX-ONLY " + os.path.basename(w))
    with open(os.path.join(dst, "lora-sapling-0822.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) ->", dst)
    raise SystemExit(0 if len(src) >= 6 else 1)

artifacts:
- C:\banyan-farm\lora-sapling-0822\out\SAMPLE-bnysapling-tilled-overcast.png
- C:\banyan-farm\lora-sapling-0822\out\SAMPLE-noregress-A-lora.png
- C:\banyan-farm\lora-sapling-0822\out\SAMPLE-noregress-B-base.png

