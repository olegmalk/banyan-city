# byte-for-byte from the sample step of train-sapling-0822.yaml, which was
# committed at 9a4042299 BEFORE any pixel of this LoRA existed. Re-typing them
# would be re-picking a bar after the weights exist.
#
# It asks for BARE TILLED EARTH because all 44 training frames stand on green
# ground — the set's sharpest monoculture and the likeliest thing for the trigger
