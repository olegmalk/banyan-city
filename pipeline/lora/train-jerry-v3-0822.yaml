success: A JUDGED ANSWER, NOT A PASSING ONE. The bars in `## BARS` were committed before a
  single training frame was admitted. A run that fails B2 and says so, with the epoch and
  weight ladders measured, is a success; a run that reports a score without the ladders is
  not.
why: 'THE DIAGNOSIS EVERYONE WAS CARRYING WAS UNDERSTATED, AND THE CORRECTION MAKES THE FIX
  SMALLER THAN A REBUILD. Every document in this tree said the pose is locked because `21
  of 21 training frames are standing`. Measured on the v2 manifest: 11 are upper-body crops,
  8 are cowboy shots, and only TWO show a lower body -- the canon and its mirror, verified
  byte-identical to taste/refs/goblin-canon-founder-0821.png. THE STANDING PRIOR IS ONE FRAME
  DEEP. Round seven''s weight ladder and the two-pass''s six cells were both hunting for a
  competing lower-body configuration to fade toward, and there is no second configuration
  in the weights to fade to.


  SO v3 ADDS THREE POSED FRAMES AND CHANGES NOTHING ELSE. That makes posed the MAJORITY of
  every leg the trigger has ever seen -- 3 against 2 -- in a dataset whose other 21 frames
  are carried with their own sha256s and their own caption strings, both asserted at build
  time. The 19 crops carry no lower-body signal at all, so they cannot fight a new one.


  AND IT IS THE FIRST SET IN WHICH THE POSE TAG HAS ANYWHERE TO ATTACH. v2 named `standing`
  on all 21 and pose stayed unpromptable, while the SETTING generalised cleanly out of one
  meadow -- a controlled experiment inside one training run, whose clause is that a caption
  tag keeps an attribute steerable only where the attribute VARIES in the dataset. `hazy meadow`
  had somewhere to attach outside the LoRA; nothing outside the LoRA knows what this creature''s
  legs look like.


  THE HISTORY THIS REPLACES. Sixteen rounds of prompt-side face work were vetoed four times,
  and canon.yaml route_closure_2026_08_22 closed that route by rule. The replacement put his
  pixels in as PIXELS and worked -- his eye reached an output for the first time -- but only
  at strengths that cannot move a pose, because the face surviving and the pose not moving
  are ONE MECHANISM read twice: at strength <= 0.40 the pass never runs the high-noise steps
  where structure is decided.


  A LoRA acts in those steps. That is the entire argument, and it is the last one available.


  THE DATASET IS 24 FRAMES AND EVERY ONE OF THEM CARRIES HIS FACE AS PIXELS, by one of two
  mechanisms and NOT by resemblance. The 21 carried from v2 are his drawing re-lit by an img2img
  pass at strength <= 0.40, which cannot invent a face because it never runs the steps that
  would. The 3 posed frames are his head held OUTSIDE an SDXL inpaint mask -- base weights,
  unet.in_channels 4, so the unmasked latent is restored at EVERY timestep and cannot drift
  at any strength -- with the legs generated inside at 0.95 against an openpose skeleton and
  NO LoRA in the pass, then rows 0..883 pasted back byte for byte and asserted. Their legs
  are generated and the manifest says so. v1''s 15 frames were animagine''s guess at his face,
  curated for an age read the founder superseded; they are not used and manifest-jerry-0821.yaml
  stays on disk as evidence.'
