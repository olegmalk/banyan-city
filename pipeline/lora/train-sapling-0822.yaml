- name: noregress-base
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\lora-sapling-0822\sample_lora.py
  - --no-lora
  - --lora
  - C:\banyan-farm\lora-sapling-0822\out\bnysapling-sdxl-v1.safetensors
  - --lora-weight
  - '0.8'
