# Behind the beat work, ahead of nothing — the queue is empty. Kept at the same
# rung the Jerry spec sits on so the two enabler jobs do not fight each other if
# both are ever live.
priority: 70
max_attempts: 1
owner: the sapling-LoRA lane, 2026-08-22

script_authority: 'Not a render of a script and not an episode assembly — this
  trains a weight file from frames that already exist. STEWARDSHIP.md §6 governs
  "no voice synthesis, no footage render, no episode assembly from a script the
  founder has not read"; no new footage is produced here and no script is read.
  The 44 input frames are not derived from any script at all: the plates were
  drawn from scene text with no character and no dialogue in them, and the plant
  was composited on by a deterministic numpy tool. The node named above,
  003b-one-leaf-for-yes, is the CONSUMER of the output and carries approved_by:
  founder in its T0 leaf; it is named so the box approval gate has something true
  to check, not to claim its script was read.'

consumer: 'The ep3 plate step, and specifically the compositing step it retires.
  Today every sapling shot in the show is drawn by running
  beat16_sapling_composite.py by hand onto a plate and then inpainting over it —
  a per-beat manual cost paid on beats 01, 03, 13, 16, 19 and 21 already. ep3
  (003b-one-leaf-for-yes) has exactly two characters on screen, Jerry and the
  sapling, so a working sapling LoRA is half of what unblocks a one-day episode.
  If the bars below fail, the consumer is the failure record and the next rung —
  which is named in advance: a leaf-count tool that can draw three, five and six
  blades, without which no v2 can serve 004 and later.'

success: 'A judged answer, not a passing one. The bars in `## BARS` are
  pre-registered and written before any pixel exists. A FAIL on any of them is a
  full result: it would mean 44 composited frames over 17 plates is still too
  monocultural to carry a subject, which is a fact worth one card-hour to learn
  before ep3 is scheduled around it.'

why: 'STATE.md, founder, 2026-08-20: one day per episode from ep3 on, and the
  enablers are character LoRAs on the recurring cast so identity stops being
  re-fought per frame. The sapling is the show''s recurring protagonist and the
  only cast member the checkpoint has never once drawn correctly from words.'

