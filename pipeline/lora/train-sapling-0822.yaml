# ── 5. PUBLISH. farm-out is not gitignored and the courier commits + pushes it
# on job_done, so publishing is a copy. allow_fail so a failed copy never marks a
# good training run failed.
#
# The .safetensors go too, not just the samples: a LoRA that passes and was not
# kept is a card-hour thrown away, and five checkpoints at ~35MB is ~175MB.
- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv-lora\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = r"C:\banyan-farm\courier-box\farm-out\lora-sapling-0822"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob(r"C:\banyan-farm\lora-sapling-0822\out\*.safetensors")
                 + glob.glob(r"C:\banyan-farm\lora-sapling-0822\out\SAMPLE-*.png")
                 + glob.glob(r"C:\banyan-farm\lora-sapling-0822\out\SAMPLE-*.meta.yaml"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        with open(os.path.join(dst, os.path.basename(f)), "rb") as fh:
            lines.append(hashlib.sha256(fh.read()).hexdigest() + "  " + os.path.basename(f))
    with open(os.path.join(dst, "lora-sapling-0822.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) ->", dst)
    raise SystemExit(0 if len(src) >= 4 else 1)

artifacts:
- C:\banyan-farm\lora-sapling-0822\out\bnysapling-sdxl-v1.safetensors
