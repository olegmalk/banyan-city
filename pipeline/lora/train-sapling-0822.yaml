- C:\banyan-farm\lora-sapling-0822\out\SAMPLE-noregress-A-lora.png
- C:\banyan-farm\lora-sapling-0822\out\SAMPLE-noregress-B-base.png

# ══════════════════════════════════════════════════════════════════════════
# BARS — pre-registered, written before any pixel exists.
#
# Judged on the FIVE saved checkpoints, not just the last. Picking the epoch is
# part of the job; overfitting past the sweet spot is the standard failure and
# the cheap insurance is having epochs 2/4/6/8/10 on disk.
#
# THE RULERS ARE COMMITTED AND ARE NOT NEW. `pipeline/leaf-count-bar-0817.md` §3
# is the counting instrument, verbatim, including its own tie-breaks (an apical
# blade counts, a drooping lower blade counts, an ILLEGIBLE plant is a FAILURE
# and not an excluded frame). `genomes/sapling/THE-SAPLING.md` and
# `pipeline/canon.yaml` are the canon. Nothing here is a bar invented to be
# passed by this lane.
#
# ALL 15 GRID FRAMES ARE JUDGED AT 1:1, FULL RESOLUTION, AND REPORTED AS `X of
# N`. Never impressions, never a contact sheet as the evidence — the contact
# sheet is how the founder LOOKS, the 1:1 read is how it is SCORED.
#
# ── STEP 0 — THE ONE SAMPLE, AND IT GATES EVERYTHING ELSE.
# Step 3 above draws exactly one frame. If it is not a recognisable canon
# two-leaf sapling on bare tilled earth, no grid gets rendered and the next rung
# is dataset work, not more training. A metric agreeing with the steward is not
# a sample; the frame is looked at.
#
# ── THE FIVE PROMPTS, FIXED NOW. 5 prompts x 3 seeds = 15 frames. Seeds
# 20260822 / 20260823 / 20260824. None of the five appears in any caption in the
# dataset, and each is chosen to leave the set on a named axis:
#
#   P1  SCENE (ground).  bare tilled earth field, a low stone wall behind,
#       overcast. 25 cm, medium shot. All 44 frames stand on GREEN ground.
#   P2  LIGHTING + SETTING.  in a clay pot on a windowsill, warm lamplight,
#       indoor. 15 cm, close-up. The set has 26 daylit and 18 non-daylit frames
#       and every one of them is OUTDOORS under natural light.
#   P3  SCALE.  90 cm tall, wide shot, green meadow, distant hills, flat
#       daylight. The set's story heights are 15/25/40 cm only; 90 cm is the 004
#       rung of the growth ladder (genomes/sapling/style.md:150-158). Scene and
#       light are held at the set's most common values ON PURPOSE so this prompt
#       moves one axis.
#   P4  A FIGURE IN FRAME.  a goblin crouching beside it, 40 cm, medium shot,
#       green meadow, flat daylight. NO frame in the set contains a figure, and
#       ep3's entire on-screen cast is this plant and that goblin. This is also
#       the two-subject case research §6 flagged as the known cost of separate
#       LoRAs; here only the sapling LoRA is loaded, so it tests one half of it.
#   P5  PALETTE.  dry autumn grassland, brown grass, low sun, 25 cm, medium
#       shot. Every frame in the set was passed by a palette sampler that
#       requires green-dominant pixels. If the trigger cannot survive brown
#       ground, it absorbed the palette.
#
# Each prompt terminates in the shipping style tail (`anime style, cel shading,
# detailed background, masterpiece, best quality, very aesthetic`) because
# leaf-count-bar-0817.md §Backend discipline binds this subject to NOT cutting
# the style tail — cutting it confounds the comparison.
#
# THE GRID'S NEGATIVE IS THE SAMPLE STEP'S NEGATIVE, UNCHANGED, and carries no
# leaf-count and no leaf-shape word. See step 3 for why.
#
# ── B1  TRIGGER DRAWS THE CANON SAPLING.
#   A BLIND COLD READER -- a fresh agent given one frame and the canon clause
#   from THE-SAPLING.md, no context, no prompt text, no mention of this lane --
#   must call it the same plant as the canon description in >= 13/15. This is
#   the instrument beat 20 already used for the fig colour
#   (pipeline/jobs/ep2-b20-canonword-0816.yaml); it is the standing house
#   method, not a new one invented to be passed. 13/15 is the Jerry threshold,
#   carried so the two enabler LoRAs are comparable on the identity axis.
#
# ── B2  SCENE, SCALE AND LIGHTING GENERALISE.
#   Scored per axis, not pooled, because pooling would let three easy prompts
#   carry two hard ones:
#     - GROUND (P1, P5): the plant is present and legible on non-green ground in
#       >= 5/6. A frame where the ground silently reverts to green meadow is a
#       FAIL on this axis even if the plant is perfect -- that is the backdrop
#       leaking out of the trigger, and it is the failure this set is most at
#       risk of.
#     - LIGHT/SETTING (P2): present and legible indoors under lamplight in
#       >= 2/3.
#     - SCALE (P3): the plant reads as substantially taller relative to its
#       surroundings than the 15-25 cm frames, in >= 2/3. Judged relative to the
#       grass line per leaf-count-bar-0817.md AXIS B, which is the committed
#       height instrument. NOT judged as "is it exactly 90 cm" -- the founder's
#       own ruling is "height might be a bit hard for the ai to make exact, so
#       dont go crazy on it, just dont make it double in size suddenly."
#     - FIGURE (P4): the goblin and the plant both present, the plant not fused
#       into him, in >= 2/3. Jerry's IDENTITY is explicitly NOT scored here --
#       his LoRA is a separate file and is not loaded.
#   A FAIL on GROUND is the one that stops the ladder; a FAIL on any other axis
#   is recorded and the LoRA can still be useful for the beats that axis does
#   not touch. Saying which failures are fatal BEFORE the pixels is the point.
#
# ── B3  NO-REGRESSION ON A NON-SAPLING PROMPT.
#   Steps 4 and 5 above are the pair: identical prompt, identical seed, LoRA at
#   the shipping weight vs LoRA unloaded. Judged at 1:1 side by side. FAIL on
#   any of: a plant appearing where none was asked for; a visible shift in
#   palette, line weight or shading style; the composition collapsing. This is
#   the test that catches a LoRA that learned "our look" instead of "this
#   subject", and the pair is the evidence -- either frame alone proves nothing.
#
# ── B4  STYLE PRESERVATION.
#   The 15 grid frames must be indistinguishable in look from the shipped ep2
#   plates. Any drift toward photoreal, 3D, or a different line weight is a FAIL
#   EVEN IF IDENTITY IS PERFECT. The founder killed v2 for unreadability on
#   2026-07-27; a LoRA that quietly moves the look is the same defect arriving by
#   a new route. B3 and B4 are not the same bar: B3 asks whether the LoRA touches
#   frames it was not invoked on, B4 asks whether the frames it WAS invoked on
#   still look like the show.
#
# ── B5  LEAF COUNT = 2, ON THE COMMITTED RULER.
#   Scored with pipeline/leaf-count-bar-0817.md §3 AXIS A verbatim: count
#   distinct expanded green laminae ON THE PLANT; cotyledons count; grass and
#   background foliage do not; an illegible plant is FAIL-COUNT-ILLEGIBLE and
#   stays in the denominator.
#   RATE: >= 14/15. That is not the 13/15 used for B1, and the difference is
#   deliberate: the committed AXIS A RATE floor is 87.5% (>= 7 of 8), 13/15 is
#   86.7% and would sit below a floor this project already ratified, so the bar
#   rounds UP to the committed floor rather than down to the neighbouring bar.
#   Bars tighten forward only.
#   AXIS B (height) and AXIS C (shape -- ordinary average blades, not round
#   cotyledon buttons, not fig-lobed) are REPORTED as X of N alongside, per that
#   file, and a shape miss alone does not fail a run whose question is count.
#
#   THE HALF THAT IS RECORDED AND NOT GRADED, declared here so it cannot be
#   reached for later: leaf-count PROMPTABILITY. `leaf_count_values: 1` -- every
#   training frame is two-leaf -- so a sixth prompt asking for four leaves is
#   rendered at one seed and its result is written into the ship page as a
#   MEASUREMENT of where v1 stands, with no pass or fail attached. Grading it
#   would be scoring an axis the set could not teach. It is also the exact
#   evidence the v2 rung needs: a tool that can draw three, five and six blades
#   is only worth writing if the trigger has in fact fused on two.
#
# NOT BARS, and deliberately so: shippability, framing, composition, and whether
# this look is the sapling the founder wants. All four are R4 and his alone. They
# go to him with pixels on the ship page, never settled here.
# ══════════════════════════════════════════════════════════════════════════
