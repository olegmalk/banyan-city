steps:

# ── 1. STAGE. kohya wants `<image>.txt` beside `<image>`, and our captions live
# in pipeline/lora/captions/sapling-0821/ instead, on purpose: farm-out/ is
# evidence and the trainer must not write into it. This builds a flat throwaway
# dir from the manifest and copies both halves in.
#
# THE DIR NAME ENCODES THE REPEAT COUNT, AND THE ARITHMETIC IS THE ONE THING
# THAT MOVED FROM THE JERRY SPEC. sd-scripts reads `<N>_<name>` and repeats each
# image N times per epoch. Research §5 argues for ~1200 image passes; Jerry hit
# that at 15 frames x 8 repeats x 10 epochs = 1200 (600 optimizer steps at batch
# 2). THIS SET IS 44, so the repeat is 3: 44 x 3 = 132 images/epoch, /2 at batch
# 2 = 66 optimizer steps/epoch, x10 epochs = 660 optimizer steps / 1320 image
# passes. Carrying Jerry's 8 across would have run 3520 image passes — nearly
# triple, straight into the overfit half of the 250-1000 vs 1500-2400 split the
# sources disagree on, on a set whose whole risk is learning the backdrop.
#
# IT VERIFIES EVERY SHA256 AGAINST THE MANIFEST BEFORE COPYING. This is also the
# item-18 gate in code: a frame edited, re-rendered or substituted since
# 23515112 stops the run here rather than silently changing what the LoRA
# trained on.
#
# TWO ROOTS, AND THE ORDER IS DELIBERATE AND INVERTED FROM THE JERRY SPEC. The
# transferred tree is tried FIRST. The box's repo checkout is at 9e7206e2, six
# hundred-odd commits behind, and does not contain this dataset at all; the 44
# frames + 44 captions + the manifest + the sampler were moved directly on
# 2026-08-22 (tar, scp, sha256 of the archive verified end to end at
# 5d553179d3ce1ec5c6c232de5c8d417e32bec1c9fb583ec91e34c5077de75ce8, then 44 PNGs
# confirmed on the far side). Pinning to the verified tree also means a `git
# pull` landing mid-flight cannot change the dataset under a running job. The
# checkout stays as the second candidate so this file keeps working once the box
# is current. NOTHING IS TRUSTED BECAUSE OF HOW IT ARRIVED: every frame is still
# verified byte-for-byte below, which is the same guard either root passes
# through. The step prints which root it used.
- name: stage
  argv:
  - C:\banyan-farm\venv-lora\Scripts\python.exe
  - -c
  - |
    import hashlib, os, shutil, yaml
    CANDIDATES = [r"C:\banyan-farm\lora-sapling-0822\src",
                  r"C:\banyan-farm\banyan-city"]
    REL = "pipeline/lora/manifest-sapling.yaml"
    repo = next((c for c in CANDIDATES if os.path.exists(os.path.join(c, REL))), None)
    if repo is None:
        raise SystemExit("NO DATASET ROOT. Tried:\n  " + "\n  ".join(CANDIDATES))
    print("dataset root:", repo)
    man  = yaml.safe_load(open(os.path.join(repo, REL), encoding="utf-8"))
    if man.get("trigger") != "bnysapling":
        raise SystemExit("manifest trigger is %r, not bnysapling" % man.get("trigger"))
    dst  = r"C:\banyan-farm\lora-sapling-0822\img\3_bnysapling"
    os.makedirs(dst, exist_ok=True)
    os.makedirs(r"C:\banyan-farm\lora-sapling-0822\out", exist_ok=True)
    n = 0
    for f in man["frames"]:
        src = os.path.join(repo, f["image"])
        got = hashlib.sha256(open(src, "rb").read()).hexdigest()
        if got != f["sha256"]:
            raise SystemExit("SHA MISMATCH %s\n  manifest %s\n  on disk  %s"
                             % (f["image"], f["sha256"], got))
        # The item-18 scope check, per frame and in code rather than in prose:
        # the manifest must assert an SDXL chain for this exact frame. An LTX
        # still cannot claim it, and a frame with no provenance line stops here.
        if "animagine-xl-3.1" not in (f.get("render") or ""):
            raise SystemExit("NO SDXL PROVENANCE on %s: render=%r"
                             % (f["image"], f.get("render")))
        stem = os.path.basename(f["caption_file"])[:-4]
        shutil.copy2(src, os.path.join(dst, stem + ".png"))
        shutil.copy2(os.path.join(repo, f["caption_file"]), os.path.join(dst, stem + ".txt"))
        n += 1
    # The sampler travels with the dataset, from the SAME root, so step 3 cannot
    # end up running a different revision of it than this step verified.
    shutil.copy2(os.path.join(repo, "pipeline/lora/sample_lora.py"),
                 r"C:\banyan-farm\lora-sapling-0822\sample_lora.py")
    print("staged", n, "image+caption pairs ->", dst)
    print("repeat 3 x %d frames = %d images/epoch" % (n, 3 * n))
    raise SystemExit(0 if n == man["count"] else 1)

# ── 2. TRAIN.
#
# Every hyperparameter is carried UNCHANGED from train-jerry-0820.yaml, which
# carried them from pipeline/research/character-lora-sdxl-0820.md §5. Carrying
# them is the point: the two runs then differ on the dataset and nothing else,
# so a difference in outcome is attributable. The short version of §5:
#
#   network_dim 32 / alpha 16 -- 16/8 is the Civitai default for a photoreal
#     person on a photoreal base. A two-leaf sapling with a specific cotyledon
#     silhouette is nearer the "complex" case. 32 is the conservative step up,
#     still ~35MB, still inside VRAM. Alpha below rank scales the update down
#     and is the current preference for STYLE-PRESERVING transfer, which is B4.
#   unet_lr 1e-4 -- the documented SDXL baseline. 5e-4 is the SD1.5-era number
#     carried forward. We take the slower rate and buy the difference back with
#     checkpoints.
#   text_encoder_lr 5e-5 -- half the unet rate. It matters more here than it did
#     for Jerry: the captions carry two variables (leaf count, story height) that
#     MUST stay promptable, and those live in the text encoder.
#   --sdpa and NOT xformers -- SETUP.md's whole warning. xformers on this card
#     silently downgrades torch below sm_120 and breaks every render on the box.
#   --enable_bucket at 1024/2048 -- our frames are 832x1216 9:16. Bucketing
#     handles that natively; cropping to square would throw away the framing
#     variety the scale tiers were built to supply.
#   no regularization images -- optional in kohya, and the practitioner report is
#     they either overfit hard or dampen to nothing.
#
# THE SEED IS THE ONLY OTHER MOVED VALUE: 20260822, this run's date, so a
# checkpoint can never be confused with a Jerry one by its seed.
#
# SAVE EVERY 2 EPOCHS AND JUDGE THE CHECKPOINTS. Nobody knows the right step
# count for OUR 44 frames. Sampling the axis is honest; asserting a point on it
# is not. Five checkpoints land and BARS picks among them.
- name: train
  argv:
  - C:\banyan-farm\venv-lora\Scripts\python.exe
  - C:\banyan-farm\sd-scripts\sdxl_train_network.py
  - --pretrained_model_name_or_path
  - C:\Users\artvn\.cache\huggingface\hub\models--cagliostrolab--animagine-xl-3.1\snapshots\483f0c322568ed13697ed01dd0be07204746d12b
  - --train_data_dir
  - C:\banyan-farm\lora-sapling-0822\img
  - --output_dir
  - C:\banyan-farm\lora-sapling-0822\out
  - --output_name
  - bnysapling-sdxl-v1
  - --network_module
  - networks.lora
  - --network_dim
  - '32'
  - --network_alpha
  - '16'
  - --learning_rate
  - '1e-4'
  - --unet_lr
  - '1e-4'
  - --text_encoder_lr
  - '5e-5'
  - --lr_scheduler
  - cosine
  - --lr_warmup_steps
  - '33'
  - --optimizer_type
  - AdamW8bit
  - --max_train_epochs
  - '10'
  - --save_every_n_epochs
  - '2'
  - --train_batch_size
  - '2'
  - --resolution
  - 832,1216
  - --enable_bucket
  - --min_bucket_reso
  - '1024'
  - --max_bucket_reso
  - '2048'
  - --mixed_precision
  - bf16
  - --save_precision
  - bf16
  - --gradient_checkpointing
  - --cache_latents
  - --cache_latents_to_disk
  - --sdpa
  - --seed
  - '20260822'
  - --save_model_as
  - safetensors
  - --logging_dir
  - C:\banyan-farm\lora-sapling-0822\log

# ── 3. ONE SAMPLE. Not fifteen.
#
# CLAUDE.md, founder 2026-08-03: before rendering a SET of anything, produce ONE
# and have the founder look at it. So this step draws exactly ONE frame from the
# FINAL checkpoint, and the 15-frame grid the bars call for is a SEPARATE job
# that gets filed only if this one frame is worth grading.
#
# THE PROMPT IS BAR PROMPT P1 AT SEED A, and it deliberately asks for something
# the set does not contain: BARE TILLED EARTH. All 44 frames stand on green
# ground — that is the set's sharpest monoculture and the likeliest thing for the
# trigger to have swallowed. If `bnysapling` only works over grass, the LoRA
# learned the field.
#
# THE NEGATIVE DELIBERATELY OMITS EVERY LEAF-COUNT AND LEAF-SHAPE WORD, and this
# is a correction to the Jerry spec rather than an oversight. That spec put
# `glasses` in its sample negative AND made "zero of the 15 wear glasses" a bar —
# a bar the negative is doing the work for, so a pass there proves less than it
# reads. Here the whole question is whether the LoRA itself carries two ordinary
# blades. The dataset's own negative (`three leaves, four leaves, many leaves,
# extra stalk, branching stem, pointed lance leaves, lobed leaves, ...`) would
# answer B5 on the negative's behalf, so none of it is used. What is left is
# figures, text and the two style escapes.
#
# NOTE THE VENV: the RENDER venv, not venv-lora. The plates we ship are drawn by
# C:\banyan-farm\venv at bfloat16 on CUDA, so that is where a LoRA has to be
# measured -- and it is the backend discipline pipeline/leaf-count-bar-0817.md
# already binds this subject to. bf16/CUDA renders red where MPS renders purple
# (MAE 60-61 on byte-identical inputs, measured 2026-08-16), so a sample drawn
# anywhere else is not comparable to the frames it is judged against.
- name: sample
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\lora-sapling-0822\sample_lora.py
  - --lora
  - C:\banyan-farm\lora-sapling-0822\out\bnysapling-sdxl-v1.safetensors
  - --lora-weight
  - '0.8'
  - --prompt
  - bnysapling, a young sapling, two leaves, 25 cm tall, medium shot, bare tilled earth
    field, a low stone wall behind, overcast, anime style, cel shading, detailed background,
    masterpiece, best quality, very aesthetic
  - --negative
  - 1boy, 1girl, people, goblin, text, watermark, signature, photorealism, 3d render,
    low quality, worst quality, blurry
  - --width
  - '832'
  - --height
  - '1216'
  - --steps
  - '40'
  - --guidance
  - '7.5'
  - --seed
  - '20260822'
  - --out
  - C:\banyan-farm\lora-sapling-0822\out\SAMPLE-bnysapling-tilled-overcast.png

# ── 4. THE B SIDE OF THE NO-REGRESSION BAR, DRAWN IN THE SAME JOB.
#
# B3 needs a pair: the identical prompt and seed with the LoRA loaded and with it
# unloaded. Drawing the two sides in different jobs, hours apart, on a checkpoint
# that may have been re-pulled, would make the pair uncomparable — and the pair
# IS the evidence, either frame alone proves nothing (sample_lora.py:55-57 says
# so in its own help text). Two frames is ~90 seconds on this card, so both sides
# land here.
#
# THE PROMPT CARRIES NO TRIGGER AND NO PLANT. If a stone bridge over a river
# comes back with a sapling in it, or comes back visibly greener, flatter or
# differently drawn than the no-LoRA side, the LoRA learned "our green field"
# instead of "this plant" — which is the likeliest failure given all 44 frames
# share one compositor, one inpaint recipe and one seed.
- name: noregress-lora
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\lora-sapling-0822\sample_lora.py
  - --lora
  - C:\banyan-farm\lora-sapling-0822\out\bnysapling-sdxl-v1.safetensors
  - --lora-weight
  - '0.8'
  - --prompt
  - a stone bridge over a river, forest, afternoon light, anime style, cel shading,
    detailed background, masterpiece, best quality, very aesthetic
  - --negative
  - text, watermark, signature, photorealism, 3d render, low quality, worst quality,
    blurry
  - --width
  - '832'
  - --height
  - '1216'
  - --steps
  - '40'
  - --guidance
  - '7.5'
  - --seed
