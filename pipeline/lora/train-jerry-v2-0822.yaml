    \        png_sha = hashlib.sha256(fh.read()).hexdigest()\n    with open(args.out + \"\
    .meta.yaml\", \"w\", encoding=\"utf-8\", newline=\"\\n\") as fh:\n        fh.write(\n\
    \            'platform: \"local-gpu (rtx5090, CUDA, bfloat16)\"\\n'\n            'model:\
    \ \"%s\"\\n'\n            'model_licence: \"CreativeML Open RAIL++-M (use restrictions\
    \ travel; D15)\"\\n'\n            'lora: \"%s\"\\n'\n            'lora_sha256: \"%s\"\\\
    n'\n            'lora_weight: %s\\n'\n            'cost_usd: 0.0\\n'\n            'size:\
    \ \"%dx%d\"\\n'\n            'steps: %d\\n'\n            'guidance: %s\\n'\n         \
    \   'seed: %d\\n'\n            'png_sha256: \"%s\"\\n'\n            'prompt: \"%s\"\\\
    n'\n            'negative_prompt: \"%s\"\\n'\n            'approved: false\\n'\n     \
    \       'provisional: true\\n'\n            'founder_verdict: null\\n'\n            'scored:\
    \ false\\n'\n            % (BASE,\n               \"none\" if args.no_lora else os.path.basename(args.lora),\n\
    \               lora_sha, args.lora_weight,\n               args.width, args.height, args.steps,\
    \ args.guidance, args.seed,\n               png_sha,\n               args.prompt.replace('\"\
    ', \"'\"),\n               args.negative.replace('\"', \"'\")))\n\n    print(\"wrote\"\
    , args.out)\n    print(\"  lora=%s weight=%s seed=%d\" %\n          (\"none\" if args.no_lora\
