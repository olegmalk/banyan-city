why: 'SIXTEEN ROUNDS OF PROMPT-SIDE FACE WORK WERE VETOED FOUR TIMES, and canon.yaml route_closure_2026_08_22
  closed that route by rule. The replacement put his pixels in as PIXELS and worked -- his
  eye reached an output for the first time -- but only at strengths that cannot move a pose,
  because the face surviving and the pose not moving are ONE MECHANISM read twice: at strength
  <= 0.40 the pass never runs the high-noise steps where structure is decided.


  A LoRA acts in those steps. That is the entire argument, and it is the last one available.


  THE DATASET IS 21 FRAMES AND EVERY ONE OF THEM IS HIS DRAWING, re-lit and re-grounded by
  that same img2img route at strength <= 0.40 -- which cannot invent a face precisely because
  it never runs the steps that would. v1''s 15 frames were animagine''s guess at his face,
  curated for an age read the founder superseded; they are not used and manifest-jerry-0821.yaml
  stays on disk as evidence.'
