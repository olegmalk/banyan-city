    \ `genome node --beat N` -- it resolves a prompt out of a beat's shot board and\nis wired\
    \ to MPS/float32 for the Mac loop. Nothing in it takes a free prompt, a\nLoRA, or an output\
    \ path, and bending it into taking all three would put a\ntraining-only concern into the\
    \ path that renders episodes. This is ~90 lines\nthat does the one thing.\n\nIT RUNS IN\
    \ THE RENDER VENV, NOT venv-lora, and that is deliberate. The plates we\nship are drawn\
    \ by `C:\\\\banyan-farm\\\\venv` (torch 2.11.0+cu128, diffusers 0.29.2)\nat bfloat16 on\
    \ CUDA. Sampling anywhere else measures a LoRA in an environment\nthat will never draw\
