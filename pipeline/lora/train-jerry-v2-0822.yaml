  eye reached an output for the first time -- but only at strengths that cannot move a pose,
  because the face surviving and the pose not moving are ONE MECHANISM read twice: at strength
  <= 0.40 the pass never runs the high-noise steps where structure is decided.


  A LoRA acts in those steps. That is the entire argument, and it is the last one available.


  THE DATASET IS 21 FRAMES AND EVERY ONE OF THEM IS HIS DRAWING, re-lit and re-grounded by
