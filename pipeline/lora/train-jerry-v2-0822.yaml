    \ -- whatever diffusers version sd-scripts pins\nis irrelevant to whether the weights\
    \ work where we need them to.\n\nbfloat16 and a CPU-seeded generator match render_wave_sample.py\
    \ exactly\n(pipeline/render_wave_sample.py:236,243). This matters more than it looks:\
    \ the\nMac and this box were measured on 2026-08-16 to disagree by MAE 61 of 255 on\n\
    byte-identical inputs at an identical seed, so a sample drawn under different\ndtype or\
    \ device conventions is not comparable to the plates it is judged\nagainst.\n\nWrites\
    \ a §7.2 sidecar beside the PNG naming the LoRA file and its sha256, so a\nframe can always\
