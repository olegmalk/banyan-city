  status: MEASURED, WORSE THAN v1, NOT SHIPPABLE
  base: cagliostrolab/animagine-xl-3.1
  trained_by: pipeline/lora/train-sapling-v2-0822.yaml
  trained_on: '2026-08-22'
  dataset: pipeline/lora/manifest-sapling-v2.yaml   # 59 frames, all SDXL


  # WHY IT EXISTS, IN ONE LINE: v1's three failing bars all trace to two facts
  # about its 44 frames, and this run changes those two facts and NOTHING ELSE.
  what_changed_from_v1:
    dataset: 44 -> 59 frames
    figure_frames: 0 -> 15   # eight harvested from ep2, seven newly built
    ground_materials_named: 0 -> 11 distinct, 17 non-grass frames
    caption_scheme: >-
      TWO NEW VARIABLES, both named in BOTH directions so the trigger is
      excused from carrying either: figure presence (`alone in the frame` on
      44, `with a small green goblin <where>` on 15) and ground material
      (`rooted in <material>`). This is the mechanism v1 used to keep leaf
      count and story height out of the trigger, pointed at the axes that
      actually failed.
    hyperparameters: >-
      NONE MOVED. Same rank 32 / alpha 16, same unet_lr 1e-4, te_lr 5e-5,
      cosine, AdamW8bit, batch 2, bf16, seed 20260822, same base. The ONLY
      moved number is the repeat, 3 -> 2, which holds the image-pass count
      near v1's: 59 x 2 x 10 = 1180 against v1's 1320, within 11%. Holding
      repeat at 3 would have run a third more training on a third more data
      and a better score would then have had two explanations.
    lr_warmup_steps: >-
      NOT retuned, deliberately. Stays 33 -- 5.0% of v1's 660 steps, 5.6% of
      v2's 590. Correct to change in isolation, wrong to change in a run whose
      whole claim is that only the dataset moved.

