# THE LoRA REGISTRY — where a trained character LoRA lives, and on what terms.
#
# ══════════════════════════════════════════════════════════════════════════
# READ THIS FIRST: NOTHING IN THE PIPELINE READS THIS FILE YET, AND THAT IS THE
# HONEST STATE RATHER THAN AN OVERSIGHT.
#
# `pipeline/research/character-lora-sdxl-0820.md` §7 settles where a character
# LoRA belongs: the STILL side and only the still side — "it loads in whatever
# draws the 832x1216 SDXL still (render_wave_sample.py / still_local.py /
# controlnet_plate.py) and nothing in ltx_i2v.py changes."
#
# Grepped 2026-08-22: NONE OF THOSE THREE FILES CONTAINS THE STRING "lora".
# There is no load point. `render_wave_sample.py:236` is where one would go —
#
#     pipe = StableDiffusionXLPipeline.from_pretrained(
#         wg.BASE, torch_dtype=torch.bfloat16, use_safetensors=True)
#     pipe.to("cuda")
#
# — and the change is about eight lines: two argparse flags, a
# `load_lora_weights` + `fuse_lora` pair behind an `if`, and the lora name +
# sha256 + weight added to `sidecar()` so §7.2 provenance survives. It is not
# written, deliberately: the standing rule is no work without a consumer, and
# the consumer for a plate-step LoRA loader is a LoRA THAT PASSED ITS BARS. As
# of this file that has not happened — see `verdict` below. Wiring a loader for
# weights that contaminate every frame they touch would be building the delivery
# truck before the thing it delivers.
#
# WHAT THIS FILE IS FOR IN THE MEANTIME. Trained weights were sitting in a
# scratch directory named after the day that made them, next to five checkpoints
# and a staging tree, with nothing recording which one is which or what was
# measured about it. This is the one place that answers "where is it, what drew
# it, what is it allowed to be used at". When the loader is written, this is what
# it reads.
#
# WEIGHTS ARE NOT IN GIT AND CANNOT BE. Each checkpoint is 228,453,516 bytes and
# GitHub hard-rejects any blob over 100 MiB; `box_runner.Courier._publish` does
# `git add -A -- farm-out` and pushes, so one of these in farm-out/ would leave a
# permanently unpushable commit and stop EVERY lane's results reaching this tree.
# Three .gitignore guards now block it. The sha256s below are the durable half:
# a frame's sidecar names the LoRA and its hash, and this file says where those
# bytes live, so provenance survives the blob staying on one machine.
# ══════════════════════════════════════════════════════════════════════════

