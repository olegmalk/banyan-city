  77-token CLIP budget restating `lean wiry adult goblin man, green skin, bald
  head, patchwork cloak` and still drifts -- pipeline/sd_prompt.py exists
  because we overrun that budget and lose the ACTION off the end. A working
  LoRA replaces that clause with a ~3-token trigger. If the bars below fail,
