owner: the character-LoRA lane, 2026-08-20

script_authority: 'Not a render of a script and not an episode assembly -- this
  trains a weight file from frames that were ALREADY rendered from approved
  nodes. STEWARDSHIP.md §6 governs "no voice synthesis, no footage render, no
