# THE JERRY v2 ADMISSIONS — every rendered cell, judged at 1:1 against
# taste/refs/goblin-canon-founder-0821.png, one frame at a time, full size.
#
# ══════════════════════════════════════════════════════════════════════════
# THE ADMISSION BAR IS HIS FACE AND NOTHING ELSE, which is the brief's own
# wording: "face-intact is the only admission bar; drop mercilessly."
#
#   E1 narrow almond eye, off-white field, TINY DARK PUPIL, heavy upper lid
#   E2 broad low dome; smallish pointed ears NEAR HORIZONTAL
#   E3 smooth face -- no furrows, no folds, no jowls
#   E4 desaturated sage, washed and high-key
#   E5 shirt with a placket, dark shorts, dark boots (where in frame)
#   D2 clean -- no second figure, no melted hand, no artifact
#
# THE PUPIL IS SCORED HARD AND HERE IS WHY. Canon's pupil is a tiny DARK dot.
# Five of the seven drops below are frames where E2-E5 are perfect and the pupil
# came back yellow, red or green. In a PLATE that would be a minor miss; in a
# TRAINING SET it is the thing the trigger learns, and it sits on the exact axis
# `route_closure_2026_08_22` records four founder vetoes against. A tiny coloured
# pupil is still a colour that is not his.
#
# THE SETTING IS *NOT* AN ADMISSION CLAUSE, AND THAT IS A FINDING RATHER THAN A
# RELAXATION. Every cell asked for a named background and almost none arrived --
# see `the_setting_axis_is_dead` below. Judging frames out for that would have
# emptied the set over a defect of the ROUTE, not of the frame. It is recorded as
# a route finding and the captions name what actually arrived.
# ══════════════════════════════════════════════════════════════════════════

judged_on: '2026-08-22'

result:
  rendered: 32          # 3 sample + 8 sweep-1 + 5 sweep-2 + 19 batch (n18 never fired) + 4 backfill
  admitted: 21          # 19 rendered + the 2 zero-strength canon frames
  target: '>= 20 across all three framings'
  by_framing: {upper body: 11, cowboy shot: 8, full body: 2}
  the_pupil_rule: >-
    THE ONE CLAUSE THAT DECIDED MOST OF THE DROPS, stated so it is applied the
    same way twice: the pupil must read as DARK at 1:1 -- near-black, as canon's
    is. Any saturated hue is a drop, whether it is yellow (j01, k01, k02, m01,
    m02, n10), red (n03, n07, n09, n17), green (n02, n08) or teal (k07, p17). A
    very dark navy that reads black at full size is admitted (n14, n16, n20,
    p18) and that boundary is named here rather than left to the eye.
judged_by: >-
  the goblin-LoRA lane steward, at 1:1, one frame at a time at full resolution,
  each against the founder's own image and nothing else. Not a contact sheet,
  not a metric, not a diff against another cell.

the_setting_axis_is_dead: >-
  MEASURED ACROSS ALL 19 BATCH CELLS AND IT IS THE THIRD READING OF THE ROUTE'S
  ONE MECHANISM. Twelve distinct backgrounds were asked for -- a stone wall, a
  dark forest, a barn wall, a ploughed field, a sand horizon, a wall of ferns --
  and the frames came back on the init's own hazy meadow in all but two (n10
  produced blurred barn-like structures, n06 and n20 produced rain). j01 had
  already measured the same thing for the GROUND underfoot: it asked for dry
  cracked earth at 0.40 and got the init's grass.

  WHY: a background is GLOBAL STRUCTURE. It is decided in the high-noise steps,
  and an img2img pass at 0.20-0.30 never runs them. This is the same sentence as
  "the pose cannot move" and "the face survives" -- one mechanism, now read three
  ways. `goblin-i2i-route-0822.md` section 3 called this route a re-lighting AND
  re-grounding route; the re-grounding half is wrong, and the doc should be
  corrected. What the route actually delivers is LIGHT, PALETTE and FRAMING.

  CONSEQUENCE FOR THE CAPTIONS, AND IT IS THE v1 SAPLING LESSON APPLIED RATHER
  THAN IGNORED. The set IS a monoculture of one hazy meadow and cannot be made
  otherwise on this route. v1's ground failure was not that 44 frames shared a
  ground -- it was that 44 frames shared a ground AND NO CAPTION NAMED IT, so the
  trigger swallowed the field. The mitigation for a monoculture you cannot avoid
  is to NAME it on every frame, which excuses the trigger from carrying it. The
  captions therefore say `a hazy meadow` where that is what arrived.

