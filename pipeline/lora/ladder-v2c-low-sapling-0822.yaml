# and it moves to the three rungs the gate did not draw. Together with the gate
# the four rungs are exactly ladder-sapling-0822.yaml's, so the v2c curve is
# comparable to v1's rung for rung.
#
# THIS RE-GRADES NOTHING. B3 was pre-registered and scored at 0.8 and stays
# scored at 0.8. Bars tighten forward only.
#
# PRIORITY 141: low, one behind the gate. The goblin/jerry lane owns the card.

