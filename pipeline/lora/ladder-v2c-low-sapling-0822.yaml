payload:
  C:\banyan-farm\lora-sapling-v2c-0822\run_ladder.py: "#!/usr/bin/env python3\nr\"\"\"The LoRA-WEIGHT ladder:\
    \ find the scale where the subject still draws and the\nno-regression contamination stops.\n\n    <render-venv>/python.exe\
    \ pipeline/lora/run_ladder.py \\\n        --lora out/bnysapling-sdxl-v1.safetensors \\\n        --sampler\
    \ pipeline/lora/sample_lora.py --out-dir ladder\n\nWHY THIS EXISTS, AND IT IS A FINDING AND NOT A GUESS. The\
    \ 2026-08-22 one sample\nanswered the expensive question — `bnysapling` DRAWS the canon two-leaf sapling,\n\
    which five closed wording ladders never could. The no-regression pair drawn in\nthe same session answered\
    \ a cheaper one badly. At the shipping weight 0.8, the\nidentical prompt and seed (\"a stone bridge over a\
    \ river, forest, afternoon\nlight\") came back:\n\n  * WITHOUT the small figure that stands on the bridge\
    \ in the no-LoRA frame --\n    an OBJECT DELETED, not a tone shift, and the sharpest single piece of\n   \
    \ evidence here. Every one of the 44 training frames is figure-free.\n  * darker and flatter, deeper blues,\
    \ less sky light\n  * recomposed lower and tighter\n\nNo sapling appeared, which is the failure this bar was\
    \ most afraid of and it did\nnot happen. But `train-sapling-0822.yaml` bar B3 fails on \"a visible shift in\n\
    palette, line weight or shading style\", and this is visible without effort.\n\nA FAIL AT ONE WEIGHT IS NOT\
    \ A FAIL AT EVERY WEIGHT, and 0.8 was picked before any\npixel existed by copying the Jerry spec. Research\
    \ section 6 already records 0.65\nas the community working point when LoRAs are stacked. So the question this\n\
    answers is a two-sided one that a single number cannot: as the scale comes down,\ncontamination should fade\
    \ AND the sapling should get worse. Where those two\ncurves cross is the shipping weight, and it is a measurement,\
    \ not a taste call.\n\nWHAT IT DELIBERATELY DOES NOT DO: change any pre-registered bar. B3 was scored at\n\
    0.8 and stays scored at 0.8. This ladder is a SEPARATE, later measurement whose\nresult is a recommended weight\
    \ for the NEXT run, not a re-grade of this one.\nBars tighten forward only.\n\n$0, no provider. Both halves\
    \ of every rung share one seed with the 0.8 pair\nalready on disk, so the whole ladder is comparable frame\
    \ to frame.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport subprocess\nimport sys\n\
    from pathlib import Path\n\nTAIL = (\"anime style, cel shading, detailed background, \"\n        \"masterpiece,\
    \ best quality, very aesthetic\")\n\n# THE SUBJECT SIDE. P1 verbatim from train-sapling-0822.yaml BARS --\
    \ the same\n# prompt the one sample used, so its 0.8 frame is already the top rung of this\n# ladder and does\
    \ not need redrawing.\nSUBJECT = (\"bnysapling, a young sapling, two leaves, 25 cm tall, medium shot, \"\n\
    \           \"bare tilled earth field, a low stone wall behind, overcast, \" + TAIL)\nSUBJECT_NEG = (\"1boy,\
    \ 1girl, people, goblin, text, watermark, signature, \"\n               \"photorealism, 3d render, low quality,\
    \ worst quality, blurry\")\n\n# THE CONTAMINATION SIDE. Verbatim from the no-regression pair, so the 0.8 frame\n\
    # and the no-LoRA frame already on disk are this ladder's two endpoints.\nCLEAN = (\"a stone bridge over a\
    \ river, forest, afternoon light, \" + TAIL)\nCLEAN_NEG = (\"text, watermark, signature, photorealism, 3d\
    \ render, \"\n             \"low quality, worst quality, blurry\")\n\nSEED = 20260822\n\n# 0.8 is omitted\
    \ on purpose: both its frames exist already and redrawing them\n# would spend card time to reproduce bytes\
    \ we can read. 0.0 is the no-LoRA frame,\n# which also exists already.\nWEIGHTS = (0.65, 0.5, 0.35, 0.2)\n\
    \n\n# --------------------------------------------------------------------------\n# --weights IS ADDITIVE\
    \ AND THE DEFAULT IS THE FROZEN LADDER. Added 2026-08-22\n# when the spec was re-pointed at v2c: the standing\
    \ rule is one sample before a\n# SET, and this file could only ever draw all four rungs, so the gate in front\n\
    # of an eight-cell sweep had no way to spend two cells. `--weights 0.65` draws\n# exactly one rung, and the\
    \ sweep that follows it is the same script with the\n# flag left off.\n#\n# WITHOUT THE FLAG NOTHING MOVES.\
    \ The default is the WEIGHTS tuple above, by\n# identity and not by re-parsing a string, so the argv this\
    \ builds for an\n# un-flagged run is byte-for-byte the argv it built before the flag existed --\n# `--selftest`\
    \ asserts that against a frozen copy of the eight-cell list. The\n# ladder's comparability rests on the rungs,\
    \ prompts and seeds not being\n# re-picked; this flag lets a rung be DEFERRED, never redefined.\n\ndef parse_weights(values)\
    \ -> tuple:\n    \"\"\"None -> the frozen ladder. A list -> a validated subset/superset of it.\"\"\"\n   \
    \ if values is None:\n        return WEIGHTS\n    if not values:\n        raise ValueError(\"--weights given\
    \ with no value\")\n    out = []\n    for v in values:\n        w = float(v)\n        if not 0.0 < w <= 1.0:\n\
    \            raise ValueError(\"weight %r out of range (0, 1]\" % (v,))\n        if w in out:\n          \
    \  raise ValueError(\"weight %r given twice\" % (v,))\n        out.append(w)\n    return tuple(out)\n\n\n\
    def build_cells(weights) -> list:\n    cells = []\n    for w in weights:\n        tag = (\"%0.2f\" % w).replace(\"\
    .\", \"\")\n        cells.append((f\"SUBJECT-w{tag}\", SUBJECT, SUBJECT_NEG, w))\n        cells.append((f\"\
    CLEAN-w{tag}\", CLEAN, CLEAN_NEG, w))\n    return cells\n\n\ndef selftest() -> int:\n    # 1. The un-flagged\
    \ run is the old run. Frozen by hand from the pre-flag\n    #    file: four rungs, two sides each, in this\
    \ order, with these tags.\n    frozen = [\n        (\"SUBJECT-w065\", 0.65), (\"CLEAN-w065\", 0.65),\n   \
    \     (\"SUBJECT-w050\", 0.5), (\"CLEAN-w050\", 0.5),\n        (\"SUBJECT-w035\", 0.35), (\"CLEAN-w035\",\
    \ 0.35),\n        (\"SUBJECT-w020\", 0.2), (\"CLEAN-w020\", 0.2),\n    ]\n    default = build_cells(parse_weights(None))\n\
    \    assert [(c[0], c[3]) for c in default] == frozen, default\n    # and the weight strings that reach the\
    \ sampler are unchanged too\n    assert [str(c[3]) for c in default] == [\"0.65\", \"0.65\", \"0.5\", \"0.5\"\
    ,\n                                            \"0.35\", \"0.35\", \"0.2\", \"0.2\"]\n    # 2. Prompts are\
    \ per-side constants, not per-rung -- a subset run must draw\n    #    the SAME two prompts the full sweep\
    \ would draw at that rung.\n    one = build_cells(parse_weights([\"0.65\"]))\n    assert len(one) == 2, one\n\
    \    assert one == default[:2], one\n    # 3. Order is the caller's order, and a rung off the frozen ladder\
    \ is legal\n    #    (the flag defers rungs; it does not police them).\n    assert [c[0] for c in build_cells(parse_weights([\"\
    0.9\", \"0.45\"]))] == [\n        \"SUBJECT-w090\", \"CLEAN-w090\", \"SUBJECT-w045\", \"CLEAN-w045\"]\n  \
    \  # 4. Refusals.\n    for bad in ([], [\"0\"], [\"1.4\"], [\"-0.5\"], [\"0.65\", \"0.65\"]):\n        try:\n\
    \            parse_weights(bad)\n        except ValueError:\n            continue\n        raise AssertionError(\"\
    parse_weights(%r) should have refused\" % (bad,))\n    print(\"run_ladder selftest OK: default ladder unchanged\
    \ (%d cells), \"\n          \"--weights subsets and refusals behave\" % len(default))\n    return 0\n\n\n\
    def main() -> int:\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--lora\")\n    ap.add_argument(\"\
    --sampler\")\n    ap.add_argument(\"--out-dir\")\n    ap.add_argument(\"--dry-run\", action=\"store_true\"\
    )\n    ap.add_argument(\"--selftest\", action=\"store_true\")\n    # ADDITIVE. Omit it and the ladder is the\
    \ frozen four rungs, unchanged.\n    ap.add_argument(\"--weights\", nargs=\"+\", default=None,\n         \
    \           help=\"rungs to draw (default: %s)\" % (WEIGHTS,))\n    # Same reason as run_grid.py: box_enqueue\
    \ refuses a spec whose artifacts are\n    # named by no step's argv, and these filenames are derived from\
    \ the weight.\n    ap.add_argument(\"--require\", nargs=\"*\", default=[])\n    a = ap.parse_args()\n\n  \
    \  if a.selftest:\n        return selftest()\n    for req in (\"lora\", \"sampler\", \"out_dir\"):\n     \
    \   if not getattr(a, req):\n            ap.error(\"--%s is required\" % req.replace(\"_\", \"-\"))\n\n  \
    \  try:\n        weights = parse_weights(a.weights)\n    except ValueError as exc:\n        ap.error(str(exc))\n\
    \    cells = build_cells(weights)\n\n    if a.dry_run:\n        for name, pos, _n, w in cells:\n         \
    \   print(f\"{name}  weight={w}  {pos[:64]}...\")\n        print(f\"{len(cells)} cells\")\n        return\
    \ 0\n\n    out = Path(a.out_dir)\n    out.mkdir(parents=True, exist_ok=True)\n    failed = []\n    for i,\
    \ (name, pos, neg, w) in enumerate(cells, 1):\n        dest = out / f\"{name}.png\"\n        print(f\"[{i}/{len(cells)}]\
    \ {name}\", flush=True)\n        rc = subprocess.call([sys.executable, a.sampler,\n                      \
    \        \"--lora\", a.lora, \"--lora-weight\", str(w),\n                              \"--prompt\", pos,\
    \ \"--negative\", neg,\n                              \"--width\", \"832\", \"--height\", \"1216\",\n    \
    \                          \"--steps\", \"40\", \"--guidance\", \"7.5\",\n                              \"\
    --seed\", str(SEED), \"--out\", str(dest)])\n        if rc != 0 or not dest.exists():\n            failed.append(name)\n\
    \            print(f\"   !! {name} did not render (rc={rc})\", flush=True)\n\n    print(f\"\\n{len(cells)\
    \ - len(failed)} of {len(cells)} cells drawn -> {out}\")\n    absent = [r for r in a.require if not (out /\
    \ r).exists()]\n    if failed:\n        print(\"MISSING: \" + \", \".join(failed))\n    if absent:\n     \
    \   print(\"REQUIRED CELL ABSENT: \" + \", \".join(absent))\n    return 0 if not failed and not absent else\
    \ 1\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"
