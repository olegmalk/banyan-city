script_authority: 'Not a render of a script and not an episode assembly. Eight test stills from a weight
  file that already exists; nothing enters an episode, a leaf or a shot board, and sample_lora.py writes
  approved: false / provisional: true itself.'
consumer: The shipping-weight decision for bnysapling, and through it the ep3 plate step. B3 failed at
  0.8, which makes the LoRA unusable AS CONFIGURED; whether it is unusable at all is exactly what this
  measures. If no rung holds both sides, that is the finding and the next rung is dataset work — a variety
  batch with figures and non-green ground — not more weight tuning.
success: Eight frames on disk in farm-out, read at 1:1 against the 0.8 and no-LoRA frames already published.
  A ladder with no crossing point is a full result.
why: The card is idle and the founder is asleep. Ten GPU-minutes turns "the LoRA contaminates" into "the
  LoRA contaminates above X", which is the difference between a dead lane and a configured one.
