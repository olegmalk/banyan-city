# SAPLING LoRA — THE WEIGHT LADDER. Filed 2026-08-22, behind the bar grid.
#
# $0 (local card). ~10 GPU-minutes, 8 cells.
#
# WHY IT EXISTS: a measured finding, not a hunch. The one sample proved the
# expensive thing — `bnysapling` DRAWS the canon two-leaf sapling, the object
# five closed wording ladders never produced. The no-regression pair drawn in the
# same session then failed bar B3 at the shipping weight 0.8: identical prompt
# and seed, and the LoRA side came back with the small figure on the bridge
# DELETED, the palette darker and flatter, and the composition retightened. An
# object removed is not a tone shift; it is the clearest evidence in the run.
#
# 0.8 was never measured — it was copied from train-jerry-0820.yaml before any
# pixel existed. Research section 6 already records 0.65 as the community working
# point. This walks 0.65 / 0.5 / 0.35 / 0.2 and draws BOTH sides at each rung, so
# the two curves that matter can be read against each other: contamination should
# fade as the scale drops, and the sapling should get worse. Where they cross is
# the shipping weight.
#
# 0.8 and 0.0 are NOT redrawn — both frames are already on disk from
# lora-sapling-sample-0822, at the same seed, so the ladder has its endpoints for
# free and spends card time only on the rungs that do not exist.
#
# THIS DOES NOT RE-GRADE ANYTHING. B3 was pre-registered and scored at 0.8 and
# stays scored at 0.8. This is a later, separate measurement whose output is a
# recommended weight for the NEXT run. Bars tighten forward only.
#
# ══════════════════════════════════════════════════════════════════════════
# ███ 2026-08-22, AFTER v2c: THIS SPEC HAS RUN, AND IT RAN ON THE WRONG   ███
# ███ CHECKPOINT. DO NOT RE-FILE IT AS IT STANDS.                          ███
#
# Every path below names `lora-sapling-0822\out\bnysapling-sdxl-v1.safetensors`.
# That was correct when it was written -- v1 was the only checkpoint that
# existed -- and the job ran to completion against it. It is no longer the
# checkpoint anyone would ship.
#
# v2c (registry.yaml, THE REPEAT CUT) is the first run to pass BOTH subject
# bars: identity 14/15 against v1's 11/15, and leaf count 14/15, tying v1 and
# beating v2/v2b's 11/15. It gives nothing back -- every control held and no
# bar sits below where v1 left it. It supersedes v1 as the reference.
#
# AND THE LADDER IS NOW THE ONLY LEVER LEFT. The dataset ladder is finished: v2
# asked whether more frames fix the scene bars (no), v2b asked which half of
# the cost was captions (the identity half, all of it), v2c asked whether the
# rest was training volume (yes, all of it). Both regressions are explained and
# closed and the new frames are exonerated. B3 has now failed at weight 0.8
# across FOUR runs, three datasets, two caption schemes and two training
# volumes, which is the fourth independent confirmation of v2b's ruling that B3
# is not a dataset bar. A rung sweep is what is left.
#
# TO RE-POINT IT: swap `lora-sapling-0822` -> `lora-sapling-v2c-0822` and
# `bnysapling-sdxl-v1` -> `bnysapling-sdxl-v2c` throughout, exactly as
# bars-v2c-sapling-0822.yaml was derived from bars-v2b by string swap and
# nothing else -- the rungs, prompts and seeds must not be re-picked or the
# curve stops being comparable to this one. Note the free-endpoint trick in the
# paragraph above does NOT carry: v2c's 0.8 and 0.0 frames exist (the training
# job's own no-regression pair, same seed), so check they match this spec's
# seed before assuming the endpoints are free.
#
# NOT DONE HERE, DELIBERATELY. This is a SET of eight cells, the standing rule
# is one sample before any batch, and re-pointing a spent spec at a new
# checkpoint is a recipe change. Its gate is a single rung drawn and looked at.
#
# DONE ELSEWHERE, 2026-08-22: `ladder-v2c-sapling-0822.yaml` is that string
# swap, cut to the single gate rung (0.65, both sides). The endpoint check this
# header asked for was made and PASSED -- v2c's own 0.8 subject frame, 0.8 clean
# frame and no-LoRA frame were all drawn at seed 20260822 / 832x1216 / 40 / 7.5,
# the same as this spec, so the endpoints are free after all. `run_ladder.py`
# grew an additive `--weights` so a single rung could be drawn at all; with the
# flag omitted it is byte-for-byte this spec's eight cells.
# ══════════════════════════════════════════════════════════════════════════

id: lora-sapling-ladder-0822
task: lora-sapling-ladder-0822
node: 003b-one-leaf-for-yes
runner: box
