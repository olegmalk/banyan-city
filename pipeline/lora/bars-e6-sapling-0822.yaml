script_authority: 'Not a render of a script and not an episode assembly. This draws 16 test stills from
  a weight file to score pre-registered bars; nothing it produces enters an episode, a leaf, or a shot
  board, and every frame is written with approved: false / provisional: true by sample_lora.py itself.'
consumer: The checkpoint choice for bnysapling. Five epochs are on the box and only epoch 10 has been
  graded; picking the epoch is part of the job and overfitting past the sweet spot is the standard character-LoRA
  failure. registry.yaml carries all five sha256s and no sanctioned weight, so this is the measurement
  that could give it one.
success: Sixteen frames from epoch 6, judged at 1:1 against the SAME bars and compared cell for cell with
  the epoch-10 grid. Both verdicts are kept; neither is edited.
why: The card is idle, the founder is asleep, and the epoch-10 verdict named this as ladder rung 3. Eighteen
  GPU-minutes either finds a better checkpoint or closes the axis.
