# SAPLING LoRA — THE SAME BAR GRID ON EPOCH 6. Filed 2026-08-22.
#
# $0. ~18 GPU-minutes. Card measured idle when this was filed.
#
# THIS IS THE MOVE `bars-sapling-0822.yaml` PRE-DECLARED, in its own words and
# before any pixel existed: "If the final checkpoint reads overfit by eye, the
# correct move is a SECOND grid on an earlier epoch, filed as its own job, and
# both verdicts kept. It is not an edit to this file after the pixels."
#
# THE FINAL CHECKPOINT DOES READ OVERFIT, and the defect has a shape. Epoch 10
# scored B4 style 15/15 and B5 leaf count 14/15 — it has the plant — but it
# FAILED identity at 11/15, the figure bar at 0/3, and no-regression, and the
# same artifact runs through all three: THE LoRA REFUSES FIGURES. Asked for a
# goblin it drew none twice and, once, a creature with the sapling fused into its
# body; in the no-regression pair it deleted a person from a prompt it was not
# invited to. That is what overfitting to "plant alone on grass" looks like, and
# 44 of 44 training frames are exactly that.
#
# SO THE QUESTION THIS ANSWERS IS NARROW AND WORTH EIGHTEEN MINUTES: does an
# EARLIER checkpoint still draw the canon sapling while leaving room for the rest
# of the frame? Epoch 6 is 396 optimizer steps against the final's 660. If the
# fusion is weaker there and the plant still holds, the shipping checkpoint is
# epoch 6 and the dataset rung gets cheaper. If the plant is gone, the finding is
# that this LoRA needs all ten epochs to beat the base checkpoint's mascot prior,
# and the ONLY fix left is the figure batch.
#
# EVERYTHING ELSE IS BYTE-IDENTICAL TO THE EPOCH-10 GRID: the same run_grid.py
# payload, the same five prompts, the same three seeds, the same negatives, the
# same probe, the same weight 0.8. Two checkpoints, one instrument — that is the
# whole point, and changing any cell would make the two grids uncomparable.
#
# WHAT MOVED: --lora (epoch 6, sha256
# 202c7c539e0e5943c074fb92f40a28224c2400d6d1dea37eeb41abeabd241965), --out-dir,
# and the publish destination. Nothing else.

