steps:

# ── 1. STAGE. kohya wants `<image>.txt` beside `<image>`, and our captions live
# in pipeline/lora/captions/sapling-0821/ instead, on purpose: farm-out/ is
# evidence and the trainer must not write into it. This builds a flat throwaway
# dir from the manifest and copies both halves in.
#
# THE DIR NAME ENCODES THE REPEAT COUNT, AND IT IS THE ONLY NUMBER THAT MOVED
# BETWEEN v1 AND v2. sd-scripts reads `<N>_<name>` and repeats each image N
# times per epoch. Research §5 argues for ~1200 image passes; Jerry hit that at
# 15 x 8 x 10 = 1200 (600 optimizer steps at batch 2), and v1 hit 1320 at 44 x 3
# x 10 = 660 optimizer steps.
#
# v2'S SET IS 59, SO THE REPEAT IS 2: 59 x 2 = 118 images/epoch, /2 at batch 2 =
# 59 optimizer steps/epoch, x10 epochs = 590 optimizer steps / 1180 image
# passes. That is deliberately the CLOSEST reachable match to v1's 660/1320 —
# within 11% on both counts — because the whole design of this run is that the
# dataset is the only variable. Holding repeat at 3 would have run 1770 image
# passes, a third more training on a set that is a third bigger, and a better
# score would then have two explanations instead of one.
#
# WHAT DID NOT MOVE, AND IT IS A DELIBERATE NON-CHANGE: lr_warmup_steps stays
# 33. It was 5.0% of v1's 660 steps and is 5.6% of v2's 590. Retuning it to 30
# would be the correct thing to do in isolation and the wrong thing to do here,
# because it is a second moved value in a run whose entire claim is that only
# the dataset moved. The 0.6 percentage points are named rather than silently
# absorbed.
#
# IT VERIFIES EVERY SHA256 AGAINST THE MANIFEST BEFORE COPYING. This is also the
# item-18 gate in code: a frame edited, re-rendered or substituted since
# 23515112 stops the run here rather than silently changing what the LoRA
# trained on.
#
# TWO ROOTS, AND THE ORDER IS DELIBERATE AND INVERTED FROM THE JERRY SPEC. The
# transferred tree is tried FIRST. The box's repo checkout is at 9e7206e2, six
# hundred-odd commits behind, and does not contain this dataset at all; the 44
# frames + 44 captions + the manifest + the sampler were moved directly on
# 2026-08-22 (tar, scp, sha256 of the archive verified end to end at
# 5d553179d3ce1ec5c6c232de5c8d417e32bec1c9fb583ec91e34c5077de75ce8, then 44 PNGs
# confirmed on the far side). Pinning to the verified tree also means a `git
# pull` landing mid-flight cannot change the dataset under a running job. The
# checkout stays as the second candidate so this file keeps working once the box
# is current. NOTHING IS TRUSTED BECAUSE OF HOW IT ARRIVED: every frame is still
# verified byte-for-byte below, which is the same guard either root passes
# through. The step prints which root it used.
- name: stage
  argv:
  - C:\banyan-farm\venv-lora\Scripts\python.exe
  - -c
  - |
    import hashlib, os, shutil, yaml
    CANDIDATES = [r"C:\banyan-farm\lora-sapling-v2c-0822\src",
                  r"C:\banyan-farm\banyan-city"]
    REL = "pipeline/lora/manifest-sapling-v2b.yaml"
    repo = next((c for c in CANDIDATES if os.path.exists(os.path.join(c, REL))), None)
    if repo is None:
        raise SystemExit("NO DATASET ROOT. Tried:\n  " + "\n  ".join(CANDIDATES))
    print("dataset root:", repo)
    man  = yaml.safe_load(open(os.path.join(repo, REL), encoding="utf-8"))
    if man.get("trigger") != "bnysapling":
        raise SystemExit("manifest trigger is %r, not bnysapling" % man.get("trigger"))
    dst  = r"C:\banyan-farm\lora-sapling-v2c-0822\img\3_bnysapling"
    os.makedirs(dst, exist_ok=True)
    os.makedirs(r"C:\banyan-farm\lora-sapling-v2c-0822\out", exist_ok=True)
    n = 0
    for f in man["frames"]:
        src = os.path.join(repo, f["image"])
        got = hashlib.sha256(open(src, "rb").read()).hexdigest()
        if got != f["sha256"]:
            raise SystemExit("SHA MISMATCH %s\n  manifest %s\n  on disk  %s"
                             % (f["image"], f["sha256"], got))
        # The item-18 scope check, per frame and in code rather than in prose:
        # the manifest must assert an SDXL chain for this exact frame. An LTX
        # still cannot claim it, and a frame with no provenance line stops here.
        if "animagine-xl-3.1" not in (f.get("render") or ""):
            raise SystemExit("NO SDXL PROVENANCE on %s: render=%r"
                             % (f["image"], f.get("render")))
        stem = os.path.basename(f["caption_file"])[:-4]
        shutil.copy2(src, os.path.join(dst, stem + ".png"))
        shutil.copy2(os.path.join(repo, f["caption_file"]), os.path.join(dst, stem + ".txt"))
        n += 1
    # The sampler travels with the dataset, from the SAME root, so step 3 cannot
    # end up running a different revision of it than this step verified.
    shutil.copy2(os.path.join(repo, "pipeline/lora/sample_lora.py"),
                 r"C:\banyan-farm\lora-sapling-v2c-0822\sample_lora.py")
    print("staged", n, "image+caption pairs ->", dst)
    print("repeat 3 x %d frames = %d images/epoch" % (n, 3 * n))
    raise SystemExit(0 if n == man["count"] else 1)

# ── 2. TRAIN.
#
# Every hyperparameter is carried UNCHANGED from train-jerry-0820.yaml, which
# carried them from pipeline/research/character-lora-sdxl-0820.md §5. Carrying
# them is the point: the two runs then differ on the dataset and nothing else,
# so a difference in outcome is attributable. The short version of §5:
#
#   network_dim 32 / alpha 16 -- 16/8 is the Civitai default for a photoreal
#     person on a photoreal base. A two-leaf sapling with a specific cotyledon
#     silhouette is nearer the "complex" case. 32 is the conservative step up,
#     still ~35MB, still inside VRAM. Alpha below rank scales the update down
#     and is the current preference for STYLE-PRESERVING transfer, which is B4.
#   unet_lr 1e-4 -- the documented SDXL baseline. 5e-4 is the SD1.5-era number
#     carried forward. We take the slower rate and buy the difference back with
#     checkpoints.
#   text_encoder_lr 5e-5 -- half the unet rate. It matters more here than it did
#     for Jerry: the captions carry two variables (leaf count, story height) that
#     MUST stay promptable, and those live in the text encoder.
#   --sdpa and NOT xformers -- SETUP.md's whole warning. xformers on this card
#     silently downgrades torch below sm_120 and breaks every render on the box.
#   --enable_bucket at 832/2048 -- our frames are 832x1216 9:16. Bucketing
#     handles that natively; cropping to square would throw away the framing
#     variety the scale tiers were built to supply. THE MIN WAS 1024 AND THAT
#     WAS WRONG -- see the block immediately below, which is the one value in
#     this file that is NOT carried from the Jerry spec.
#
# ── ATTEMPT 1 FAILED IN FIFTEEN SECONDS AND THIS IS WHY, recorded rather than
