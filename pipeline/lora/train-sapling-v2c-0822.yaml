#
# `pipeline/research/character-lora-sdxl-0820.md` §8 pre-registers five bars, and
# two of them are sapling-specific in a way this run cannot honour as written:
#
#   §8.4 BOTH-IN-FRAME (both LoRAs loaded at 0.65) IS NOT RUN, because the Jerry
