# ══════════════════════════════════════════════════════════════════════════
# v2c — THE REPEAT CUT. ONE VARIABLE AGAINST v2b, AND IT IS THE REPEAT COUNT.
#
# v2b answered half the v2 regression and left half open. B1 identity went
# 11 -> 9 -> 11: restoring v1's captions on the 44 unchanged frames recovered it
# EXACTLY, so the identity loss was caption dilution and that is closed. B5 leaf
# count is 11/15 in BOTH v2 and v2b against v1's 14/15 -- the caption change did
# not move it by one frame, so the count loss is NOT dilution.
#
# TWO CANDIDATES REMAIN AND v2b COULD NOT SEPARATE THEM: the 15 new frames, or
# the repeat drop 3 -> 2. This run moves the repeat and nothing else.
#
# THE ONE VARIABLE: repeat 2 -> 3. Same 59 pixels, same captions as v2b, same
# recipe, same seed. 59 x 3 = 177 images/epoch, 88 optimizer steps/epoch, 880
# steps and 1770 image passes -- a third more training than v2b's 1180 and a
# third more than v1's 1320.
#
# HOW TO READ IT, WRITTEN BEFORE THE RUN:
#   * B5 back near 14/15 -> the count loss was TRAINING VOLUME. v2's repeat 2
#     was chosen to hold total image passes near v1's for attribution, and that
#     choice, not the frames, cost the count. The fix is free: train longer.
#   * B5 stays near 11/15 -> volume is cleared and THE FRAMES are the cause.
#     The suspicion is already on record: several of the 15 put the plant small,
#     at the frame edge, or overlapping a figure, and two harvested frames carry
#     866 px and 760 px stems against v1's 150-660 range. The fix would then be
#     to drop or re-geometry those frames, not to train differently.
#   * WATCH B1 TOO. More passes on the same frames is also the classic overfit
#     direction, and if B1 falls back toward 9/15 while B5 rises, the two bars
#     are trading and the sweet spot is between v2b and v2c.
# ══════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════
# v2b — THE DILUTION CUT. ONE VARIABLE AGAINST v2, AND IT IS THE CAPTIONS.
#
# v2 was scored and LOST. Against v1: B1 9/15 (was 11/15), B5 11/15 (was
# 14/15), B2_ground 3/6 (was 4/6), while B2_figure -- the bar the whole set was
# rebuilt to move -- went 0/3 to 1/3. Fifteen figure frames bought one frame and
# cost six. Full table: review/ep3-sapling-lora-0822/SHIP-V2-0822.md.
#
# THE HYPOTHESIS THIS RUN TESTS, AND IT IS ONE OF FOUR NAMED IN THAT VERDICT.
# v2 lengthened EVERY caption in the set by two clauses -- including all 44
# frames that were already producing a working trigger -- so `bnysapling` became
# a smaller share of every caption. The damage landed on the SUBJECT (identity,
# leaf count) and on frames the dataset did not otherwise change, which is what
# dilution predicts and is not what "harder frames" predicts.
#
# THE ONE VARIABLE. The 44 original frames get v1's EXACT captions back --
# verified byte-identical to captions/sapling-0821/, 44 of 44 -- and the two new
# clauses go ONLY to the 15 new frames, where the figure and the ground actually
# vary. THE PIXELS ARE v2'S, UNCHANGED, all 59 of them. The recipe is v2's,
# unchanged. Only the caption strings on 44 frames move.
#
# HOW TO READ IT, WRITTEN BEFORE THE RUN SO IT CANNOT BE RE-READ AFTER:
#   * B1 back near 11/15 AND B5 back near 14/15 -> CAPTION DILUTION IS THE
#     CAUSE. Every future LoRA in this tree gets a short caption scheme, and
#     the figure axis needs a different lever than naming it in all 59.
#   * B1 and B5 stay near 9/15 and 11/15 -> DILUTION IS CLEARED. The cause is
#     the frames themselves or the repeat count, both more expensive to fix,
#     and that is worth knowing before a third dataset is built.
#   * Either way B2_figure is expected to stay low, because this run does
#     nothing new for it. It is not the bar this cut is about.
#
# THE ASYMMETRIC SCHEME IS WEAKER IN THEORY AND THAT IS ACCEPTED. Naming a
# figure only when present is exactly the shape v1 used for leaf count and
# height and it is a worse instrument than naming both directions. The point of
# this run is not to be the best scheme; it is to move ONE thing.
# ══════════════════════════════════════════════════════════════════════════

# SAPLING SUBJECT LoRA — SDXL / animagine-xl-3.1 — the training run
#
# 2026-08-22. $0 (local card, no provider). ~60 GPU-minutes.
#
# ══════════════════════════════════════════════════════════════════════════
# WHAT THIS IS, AND WHY IT IS THE INVERSE OF THE JERRY JOB
#
# Jerry's dataset exists because the checkpoint CAN already draw him; harvesting
# verdicted frames was enough. The sapling is the opposite case and it is the
# reason this LoRA matters more. Per `pipeline/work-ladder-0819.md` the wording
# ladders for the canon two-leaf sapling are CLOSED — five rungs, all failing the
# same way: bead-strung vines, faceted crystals on bare twigs, leaf counts of 4
# and 8 and 3 but never 2. THERE IS NO POOL OF CORRECT MODEL-DRAWN SAPLINGS TO
# CURATE, BECAUSE THE MODEL HAS NEVER DRAWN ONE.
#
# So this trains on COMPOSITES, to teach the checkpoint the thing it cannot draw.
# That is standard bootstrapping practice, and here it also retires a per-beat
# manual cost: `beat16_sapling_composite.py` is run by hand on every sapling shot
# in the show. THAT retirement is the consumer, named below.
# ══════════════════════════════════════════════════════════════════════════
#
# ── THE DATASET, AND ITS GATE. `pipeline/lora/manifest-sapling-v2b.yaml`,
# 2026-08-22: 59 frames, scale tiers l=18 m=15 s=14 xl=12. It is the v1 set of
# 44 plus 15 frames that carry A FIGURE — eight harvested from ep2 plates this
# tree already owns and judged, seven newly built — and it re-captions all 59
# on TWO NEW VARIABLES. That is the whole change and it is the whole reason the
# run exists; see `why` for the score it is aimed at.
#
# THE TWO NEW CAPTION VARIABLES, because they matter more than the frame count:
#   FIGURE PRESENCE, named in BOTH directions. `alone in the frame` on 44,
#     `with a small green goblin <where>` on 15. v1 was figure-free 44/44 and
#     the trigger absorbed it: at weight 0.8 it DELETES a figure the base draws.
#   GROUND MATERIAL, named at all for the first time. 11 materials, 17
#     non-grass frames. AND THE v1 VERDICT WAS WRONG ABOUT THIS SET: the ship
#     page says 44 of 44 stand on grass, and measured at the root point on the
#     plates, TEN DO NOT — s14/s15/s16 and s19/s20/s21 root on a bare dirt
#     path, s12/s13 on forest floor, s36/s37 on wet rock. The set already had
#     four non-grass materials and no caption had ever said so, because v1's
#     scheme has no ground token. So the ground bar failed partly on a CAPTION
#     gap, not only a pixel gap, and ten frames were fixed for zero render cost.
#
# ONE FRAME WAS BUILT AND DROPPED. g7 (forest floor) failed D4 — its palette
# sampled ONE green-dominant pixel, the drawn plant was a single flat olive,
# and the 0.30 pass did not shade it. It was named as the at-risk frame in the
# naturalize spec BEFORE the render and dropped after it. 8 built, 7 kept.
#
# (The v1 line this replaces, for a reader tracing the diff: "44 frames over 17
# distinct plates, scale tiers l=11 m=13 s=11 xl=9, and — the axis v2 bought —
# eighteen non-daylit frames against v1's zero.")
# README.md's gate is ">=20 composited saplings spanning distinct scenes, scales
# and lighting". All three clauses are met and the lighting clause is met by
# measurement rather than by assertion: `review/ep3-sapling-dataset-0821/
# plates-0821.yaml` carries the verdict on all fourteen round-5 cells including
# the one that failed, and round 6's four-cell word probe is the rule that bought
# the last two plates.
#
# ── THE ONE AXIS THE SET DOES NOT COVER, RECORDED RATHER THAN PAPERED OVER:
# `leaf_count_values: 1`. Every frame is TWO-leaf, because
# `beat16_sapling_composite.py` draws the canon two, `leaf_count_composite.py`
# can only REMOVE leaves, and inventing a third would break canon
# `sapling-two-leaves` to satisfy a dataset axis. The leaf-count TOKEN is
# explicit in all 44 captions — that is the mechanism that keeps it out of the
# trigger — but its VALUE is constant. Bar B5 below is written so that this cap
# cannot be mistaken for a pass: the count bar is scored, and the PROMPTABILITY
# of a different count is RECORDED AND NOT GRADED, because the set cannot teach
# it and grading it would be scoring an axis we did not train.
#
# ── DECISIONS.md ITEM 18, AND WHY THIS IS NOT IT. Item 18 reads "Never train on
# the output... No LoRA, no finetune, no distillation FROM LTX FRAMES. Named
# because training on our own footage is a plausible thing to want later, and
# this forecloses it FOR LTX MATERIAL SPECIFICALLY" (DECISIONS.md:685-687). The
# ban is LTX-scoped by its own text, and it is scoped that way because its source
# is the LTX-2 licence, not a house rule about self-training.
#
# ZERO LTX PIXELS ENTER THIS RUN, and the gate is code rather than a promise.
# Every one of the 44 frames is: an SDXL text plate (animagine-xl-3.1) -> a numpy
# composite drawn by `beat16_sapling_composite.py` -> ONE 0.30 SDXL inpaint
# (animagine-xl-3.1, 40 steps, cfg 7.5, seed 20260820). The manifest asserts that
# chain per frame in its `render:` field, and the STAGE step below refuses to
# proceed unless every frame's sha256 matches the manifest — so a frame swapped
# for an LTX still stops the job rather than entering the weights.
#
# THE GOVERNANCE NOTE IS NOT DISCHARGED BY THAT AND IS NOT THE STEWARD'S TO
# DISCHARGE. Item 18 is open in DECISIONS.md; what is argued here is that this
# run falls outside its scope, not that the item is closed. The note travels with
# the sample sheet to the founder on the ship page, with the licence text quoted,
# so the ruling is his to make against pixels.
#
# ── THE TRAINER IS INSTALLED AND VERIFIED. Unlike the Jerry spec, which was
# written against an installer that had never run, `pipeline/lora/SETUP.md` ran
# end to end on the box 2026-08-20: sd-scripts v0.11.1 (6721028c),
# `C:\banyan-farm\venv-lora` on torch 2.11.0+cu128 at sm_120, bitsandbytes 0.50.1
# with AdamW8bit smoke-tested on the card. Re-verified present 2026-08-22 before
# this file was written: `venv-lora\Scripts\python.exe` and
# `sd-scripts\sdxl_train_network.py` both on disk, 250 GB free.
#
# ── WHAT IT COSTS IF IT IS WRONG. One card-hour and nothing else. No spend, no
# publish, no canon change, no leaf touched, no node edited. The card was
# measured IDLE with an EMPTY backlog at 06:18Z on 2026-08-22, which is the
# condition under which this job is the right one to fire (CLAUDE.md, Oleg
# 2026-08-05: the GPU is never idle while a runnable job exists). Every beat rung
# in flight is founder-gated and he is asleep; this one needs no human present.

