script_authority: 'Not a render of a script and not an episode assembly — this
  trains a weight file from frames that already exist. STEWARDSHIP.md §6 governs
  "no voice synthesis, no footage render, no episode assembly from a script the
  founder has not read"; no new footage is produced here and no script is read.
  The 44 input frames are not derived from any script at all: the plates were
  drawn from scene text with no character and no dialogue in them, and the plant
  was composited on by a deterministic numpy tool. The node named above,
  003b-one-leaf-for-yes, is the CONSUMER of the output and carries approved_by:
  founder in its T0 leaf; it is named so the box approval gate has something true
  to check, not to claim its script was read.'

consumer: 'The ep3 plate step, and specifically the compositing step it retires.
  Today every sapling shot is drawn by running beat16_sapling_composite.py by
  hand onto a plate and inpainting over it — a per-beat manual cost paid on
  beats 01, 03, 13, 16, 19 and 21 already, and paid EIGHT MORE TIMES to build
  this very dataset. A working sapling LoRA is half of what unblocks a one-day
  episode.


  IF THE BARS FAIL AGAIN, THE CONSUMER IS THE FAILURE RECORD AND THE NEXT RUNG
  IS ALREADY NAMED, which is the same discipline v1 was filed under. A
  B2_figure fail whose frames draw a SITTING goblin when asked for a crouching
  one is a pose-generalisation gap and the rung is more poses. A B2_figure fail
  that draws no figure at all, on a set where 15 of 59 frames have one, would
  mean caption-naming does not make an axis promptable — and that finding
  invalidates the caption-variable strategy this whole dataset is built on,
  which is worth a card-hour to learn before ep3 is scheduled around it.'

success: 'A judged answer, not a passing one. The bars in `## BARS` are
  pre-registered, are byte-identical to v1''s, and are written before any pixel
  exists. THE THREE DECISIVE CELLS ARE NAMED THERE IN ADVANCE — B2_figure,
  B2_ground and B3 — so the verdict cannot be written around them afterwards.
  A FAIL on any of them is a full result: it would mean that naming an axis in
  the caption and adding frames on it is not enough to make it promptable,
  which is a fact about this whole method and not about this lane.'

why: 'THE v1 SCORE, AND IT IS THE ONLY ARGUMENT THIS RUN NEEDS.
  `pipeline/lora/registry.yaml` records what the first sapling LoRA did:
  `bnysapling` DRAWS THE CANON TWO-LEAF SAPLING — a first, after five closed
  wording ladders in pipeline/work-ladder-0819.md — and three of five
  pre-registered bars FAIL. B2_figure 0/3 (no goblin, or one with the plant
  fused into its body); B2_ground 4/6 (brown autumn grassland 3/3, bare tilled
  earth 1/3); B3 no-regression FAIL, where at weight 0.8 a figure the base
  checkpoint draws is DELETED. The weight ladder was then measured on both
  sides at five weights and THE TWO CURVES NEVER CROSS — below 0.65 the plant
  collapses back into the base checkpoint''s green mascot — so turning the LoRA
  down is not the fix and no shipping weight is sanctioned.


  ALL THREE FAILURES TRACE TO THE DATASET AND TO NOTHING ELSE, and both causes
  were named in pipeline/lora/README.md BEFORE v1 trained: 44 of 44 frames were
  figure-free and the ground was never named in a caption. That is a variety
  problem, so the fix is frames and captions — not a hyperparameter, not a
  weight, and not another wording ladder. This run changes the dataset and
  holds every other value, so the score is attributable.


  AND IT COSTS ONE CARD-HOUR ON A CARD THAT IS OTHERWISE IDLE. STATE.md,
  founder, 2026-08-20: one day per episode from ep3 on, and the enablers are
  character LoRAs on the recurring cast. ep3 (003b-one-leaf-for-yes) has two
  characters on screen and the sapling is one of them.'

