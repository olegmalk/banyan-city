# The founder's inbox — decisions only the founder can make. The status board
# renders these publicly, so write them for a STRANGER: no filenames, no
# internal jargon, and a public link whenever the thing can be looked at.
#
# The rule that outranks all of that, and it is not optional (2026-08-07):
# `link_text:` must name what is actually behind `public:`. On 2026-08-06 this
# item sent the author to the published July cut of episode 1 while asking him to
# pass the August remake, and he watched the wrong film. A link that is not the
# thing is worse than none. Where a decision is about something UNPUBLISHED, say
# so and say where his own copy is, even if that means naming a local file.
#
# What changed on 2026-08-07 (D17): working cuts may now publish to the unlisted
# review area, so "the only copy is on the author's laptop" is no longer the
# default answer for footage he has not passed — /review/ is. Media he has not
# passed still never becomes THE episode without his verdict.
#
# HOW AN ITEM LEAVES: it is deleted. There is no `retired:` list and there never
# has been — the board renders `pending:` and nothing else, so a "retired" entry
# would either be invisible or be a second inbox. The reason goes in the commit
# message and in STATE.md, where a reader can find it; the deletion goes here.
#
# Removed 2026-08-07, both in the same commit as the founder's "r3-s3 and retire":
#   002b-b01-frame  ANSWERED. He picked r3-s3 for episode 2's opening frame; it is
#                   promoted to 002b-first-citizen/stills/01-cold-open.png and four
#                   queue entries lost their founder gate with it.
#   hires-review    RETIRED UNANSWERED, and it should never have been asked. Opened
#                   13:32 on 2026-07-30 (c999476) off a plan, not artifacts; the plan
#                   was cancelled by his own pushback nine hours later ("are we just
#                   doing unnecessary work?", 284bbdf). What exists is 20 PNGs on
#                   origin/farm-results-msi covering beats 11-15 only — new pictures
#                   at a bigger size, not sharper versions of the 15 approved shots
#                   the item described — none with a provenance sidecar (8d7ceed:
#                   farm_worker.py:430 writes none), so none publishable. The episode
#                   ships at 720x1280 and the canon stills are already 832x1216, so
#                   there is no consumer for the resolution either. Full trace in
#                   STATE.md 2026-08-07.
#
# Removed 2026-08-08:
#   ep2-beat16-line ANSWERED, and the answer was to change nothing: "for beat 16's
#                   line, lets keep 'I can't even wave.'" The replacement we
#                   proposed is declined and the line stands, which also releases
#                   the approval condition he set on 2026-08-03 asking for it to be
#                   rewritten. Recorded in the script's approval leaf
#                   (002b-t0-c.yaml revisions) and on review item 09, which stays
#                   published as the record. Beat 16's voice take stopped being a
#                   question for him with it.
pending:
  - id: v6-verdict
    title: "Say yes or no on episode 1 — the next cut, built from the notes you gave"
    detail: "Answered once and the answer was no. On the evening of 2026-08-07 the author watched the assembled remake and turned it down with a specific list rather than a shrug: the camera moves are far too slow; one scene reads as a laboratory when it is supposed to be inside a house; another shows a leaf in a shot where the character is looking at the sky, which cannot be what he is seeing; one shot drains the colour out of the show; three consecutive shots are the same picture; two more change the setting and the look entirely; one he could not identify at all; one earlier change he asked to be undone, because it was fixing a fault that was never there. Every one of those is now work in hand — new drawings for the shots he named, a faster camera move, three shots reworked as a wide-medium-close progression, and the wrong fix reverted. A rebuilt cut goes back on the review page for the same yes or no. That yes is still the only thing that unblocks posting, and nothing goes out until a cut has one."
    public: "review/index.html#checklist"
    link_text: "your morning checklist — the questions the next cut needs answered, above the cut you turned down"
    since: 2026-07-29
  - id: ep1-frame-picks
    title: "Choose the replacement drawings for the shots you turned down"
    detail: "Seven of the fifteen shots in episode 1 were refused on the drawing itself rather than on the movement — one that reads as a laboratory instead of a house, one showing a leaf in a shot of the sky, three consecutive shots that are the same picture, two that change the setting and the look, one that could not be identified at all. New drawings for all of them were rendered overnight, several candidates each, and they need one pass of the author's eye: pick one per shot or reject the set. This is separate from the yes-or-no on the finished cut above, and it comes first — the cut cannot be rebuilt out of frames nobody has chosen. Two related calls were already made and are not being re-asked: the camera speed, and the decision to shoot three of the shots as one scene at three distances."
    public: "review/index.html#checklist"
    link_text: "the same morning checklist — items 02 and 03, which say plainly if the drawings have not finished rendering yet"
    since: 2026-08-07
  - id: ep2-beat01-line
    title: "Listen to the first line of episode 2, recorded again on the words you chose"
    detail: "The author refused the recording of the narrator's opening line on 2026-08-08, on two grounds at once: the delivery made it sound like an ironic comparison with some other tree instead of a plain report, and the word itself looked wrong, since a later line in the same episode has him saying he is forty centimetres tall. He settled the words the same day by picking a version where the narrator corrects himself out loud, so he is a tree and then, on second thought, a sapling. One new recording has been made on those words and on his note about the delivery, and it is the only thing this decision is still waiting for: a listen, and either yes or another note about the read. Nothing else in the narration was re-recorded — the sixteen takes he did not query are untouched. The refused recording is kept beside the new one as the record of what he turned down."
    public: "review/index.html#checklist"
    link_text: "the morning checklist — item 08 plays the new take first, then the one he refused, then the one he passed"
    since: 2026-08-08
