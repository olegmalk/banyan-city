# internal jargon, and a public link whenever the thing can be looked at.
#
# The rule that outranks all of that, and it is not optional (2026-08-07):
# `link_text:` must name what is actually behind `public:`. On 2026-08-06 this
# item sent the author to the published July cut of episode 1 while asking him to
# pass the August remake, and he watched the wrong film. A link that is not the
# thing is worse than none. Where a decision is about something UNPUBLISHED, say
# so and say where his own copy is, even if that means naming a local file.
