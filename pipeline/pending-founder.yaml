    detail: "The model that draws the show in anime style has a companion file that makes it about thirteen times faster — roughly nine minutes per shot instead of nearly two hours, measured on our own card. The people who made it did publish their licence, and it is the permissive kind, but they published it alongside their code and not on the download page the show actually pulls the file from. The show's standing rule is that nothing gets published unless every part of it has a licence we can quote, so today the fast version is used for tests only and every releasable anime shot takes the slow path. The evidence has been read and written up on both pages. What is missing is the author saying that a licence verified in the makers' own repository counts as proof for footage that goes out."
