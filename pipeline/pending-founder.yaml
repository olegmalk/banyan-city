- id: ep2-guard-register
  title: Say what the guards ARE — the drawings are correct and the tone is wrong
  detail: 'Every fact you set for the guards now lands in the picture, and what comes out is two solemn
    men doing paperwork rather than the silly harmless pair you wrote. Bald, tunic, clipboard, two men
    you can tell apart — all of it correct, and the tone wrong. The written brief calls for a silly harmless
    bureaucrat, and that phrase has now scored nothing in four rounds — it was sent word for word into
    a round and still drew a hard, muscular man. So the wording is known not to bind, and a fifth sheet
    is not the fix. This is a taste call and it is yours by rule: either the solemn version is fine and
    we stop chasing the word silly, or the tone matters more than the facts do, in which case the casting
    is wrong and needs your own words for who these two are — the way you fixed the goblin by describing
    him rather than by rejecting drawings.'
  public: review/ep2-picks/morning-0812-wave2.html
  link_text: this morning's sheets, the guards among them, with what each round was testing
  since: 2026-08-12
  resolved:
    date: '2026-08-14'
    verdict: i haven't seen the guards characters yet, i need to know how they should look like and also
      make some of my own changes perhaps
    why: Not dropped, superseded and made bigger. This asked him to say what the guards ARE in words;
      he has since said the real gap is that no guard REFERENCE exists and he has never seen one. plate-drafts
      is paging a guard sheet for his approval and that sheet carries this question, so re-filing it here
      would be the same decision asked twice.
- id: ep2-beat04-length
  title: Choose how to shorten the six-second beat, because six seconds breaks the face
  detail: 'One of episode 2''s beats is written for six seconds on a close-up, and six seconds is measured
    to destroy the character''s face where three seconds comes out clean. The two takes were rendered
    against each other this morning: the long one has both eyes gone, and not only at the end — frame
    for frame it is already coming apart a third of the way in, so it cannot be rescued by trimming afterwards.
    The shorter clip has to be asked for. That makes this a writing and editing call rather than a machine
    setting, and it is yours: the beat can become two shots, or be written shorter, or keep its length
    by re-timing the narration under it. Nothing else in the episode turns on it — the other beats'' trouble
    is staging, and no clip length fixes that. The two takes are on the render machine and not published
    anywhere you can click; say the word and they go on the review page beside each other.'
  since: 2026-08-12
  resolved:
    date: '2026-08-14'
    verdict: beat 04 has the cute goblin, needs to be changed
    why: Superseded. The 3s-vs-6s length question was about a face that survives three seconds and breaks
      at six - but beat 04 is now in the goblin remake and its plate has failed twice, so the length question
      cannot be answered until there is a face to time. Already resolved under the same reasoning in the
      inbox.
- id: ep1-frame-picks
  title: Choose the last drawing in episode 1 — the one shot you have never passed
  detail: 'Fourteen of episode 1''s fifteen shots stand on a drawing you chose and one does not — scene
    6, the shot you refused every candidate for, which went out in the published episode anyway. You turned
    that round down flat — "none of the beat 6 images will work" — and named two ways out, tall grass
    or no ground at all. Both are now drawn, twice over, sixteen frames on one sheet, and none of them
    puts flat ground or a city in the picture. What changed on 2026-08-11 is the stake: the episode went
    out. It is canon and playing on the site, running scene 6 on a provisional frame you never passed.
    So this is no longer the thing standing between you and a finished film — it is the one shot in a
    published episode that is not yours, and picking a frame replaces it. Name a frame, or name an arm,
    or say neither and why. Twenty more sheets for episode 2 sit on the same page; any order is fine,
    and a sheet you skip simply stays a set of candidates.'
  public: review/cuts.html#item-10
  link_text: the sheet itself — sixteen frames, one row per option, on your morning checklist
  since: 2026-08-07
  resolved:
    date: '2026-08-13'
    verdict: we have already published it dude, we are done
    why: Episode 1 is CLOSED by his own words. Asking him to choose a drawing for a shot in a published
      episode is asking him to re-open something he shut.
- id: ep3-scripts
  title: Read episode 3 — the script that grows out of the episode 2 you approved
  detail: 'Episode 3''s script is written and unread, and nothing may be filmed from it until the author
    has read it. This item used to say it was waiting on the episode 2 choice; that is no longer true
    — he read the first-citizen script and approved it on 2026-08-03, and episode 2 has been made from
    it ever since. What follows it is one script rather than three — the other two episode 3 candidates
    grow out of the episode 2 branches he did not take, and they stay on the tree unread, which is how
    a branching story is supposed to work. The page below is the whole node: the script, its state change,
    and the silent storyboard reel already built from it, so the read and the look are the same click.
    Nothing may be filmed from it until he has read it, and with episode 1 published and episode 2 in
    the machine, this read is what keeps a third episode possible at all.'
  public: sapling/003b-one-leaf-for-yes.html
  link_text: the episode 3 script on the tree, with the storyboard reel built from it
  since: 2026-07-30
  resolved:
    date: '2026-08-13'
    verdict: the best way for me to review something is by seeing the full video of it... lets not waste
      time by having me read the entire script of each episode, lets remove that task, you can review
      it yourself if you'd like, but im fine with it.
    why: Removed by ruling, not by neglect. Script reads are off his plate permanently; his review artifact
      per episode is the assembled video. This item is the exact task he abolished.
