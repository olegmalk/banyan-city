# The render box's own on-disk queue, as last measured by a supervisor tick.
# Read by build_sim.py (read_box_queue / box_queue_eta) for the status page's
# "Queued for a machine" section and the queue cell in the glance at the top.
#
# THIS FILE IS NOW THE FALLBACK, NOT THE LIVE PATH (2026-08-13). Roman: "why is
# the banyan.city/status only updating when i freaking remind you about it??" —
# and the answer was this file, which changes only when a supervisor session
# hand-commits it, so `measured_at` was in practice a record of the last time
# somebody was nagged. The box now publishes its own queue every five minutes as
# a `queue` block inside telemetry.json on farm-telemetry-rtx5090
# (pipeline/telemetry.py), and the reader's browser fetches that and rewrites
# both the tile and the section (build_sim.LIVE_JS, readBoxQueue). Freshness
# costs no session, no commit and no deploy.
#
# What is still read from HERE, and why it belongs here rather than on the box:
#   kind_medians / kind_median_fallback — the minutes-per-kind the live counts
#   are multiplied by. They are measured across days of finished jobs and do not
#   move in five minutes, so baking them into the page is correct; the browser
#   does live count x baked median, which is the same arithmetic box_queue_eta()
#   does at build time so the two can never disagree.
# The counts below remain the no-JS floor and the reading the page falls back to
# whenever the fetch fails. A tick updating them is still useful — it is just no
# longer the only thing standing between the founder and a fresh number.
#
# WHAT A TICK REWRITES, and it is only these:
#   measured_at   UTC stamp of the reading. NO STAMP, NO CLAIM — the page says
#                 "not read" rather than print a zero it did not measure.
#   ready         jobs sitting in the box's queue directory, unclaimed
#   running       jobs the box is rendering right now
#   done_today    finished since local midnight, for the tick's own reporting
#   source        how the reading was taken, in one line
#   queued_kinds  OPTIONAL, and the difference between a good estimate and a
#                 rough one. A map of kind → how many of that kind are queued,
#                 counting ready AND running. The kinds are the ones
#                 box_job_minutes.py names, read the same way: off the scripts
#                 a job's steps actually run, not off its id —
#                   ltx      a step runs ltx_i2v.py            (a motion take)
#                   still    render_wave_sample.py / runpod_render.py
#                   charref  goblin_ipa_beat.py                (character refs)
#                   inpaint  inpaint_fruit.py
#                   other    anything else
#                 The counts must add up to ready + running. If they do not,
#                 build_sim ignores the whole mix and falls back — a mix that
#                 does not account for every job is a reading of a queue that
#                 has since moved. Leave the key out entirely when the tick
#                 cannot tell; the fallback is honest and says it is rough.
#
# WHAT A TICK MUST LEAVE ALONE unless it has actually re-measured it:
#   kind_medians          median wall-clock minutes per kind
#   kind_median_fallback  the pooled median, for a queue of unknown kinds
#   median_from           plain-English provenance, printed on the page
#   median_measured_at    when those medians were last computed
#
# There is deliberately NO est_queue_minutes field. The estimate is the kind
# mix multiplied by the medians (or, failing that, the job count times the
# fallback) and build_sim derives it at BUILD time, so a tick that moves the
# counts and leaves the medians alone still moves the estimate. A stored total
# would keep printing last night's depth against this morning's counts — the
# stale-meter failure the infra tile exists to prevent, one file over. Delete
# the medians and the page says it cannot time the queue; it never guesses.
#
# Known bias, stated because the page rounds and a reader cannot see it: a
# RUNNING job is counted whole, so the estimate is long by however much of it
# has already rendered — at most one job. It is an upper bound on the wait,
# which is the direction to be wrong in.
#
# HOW THE MEDIANS WERE MEASURED (2026-08-13, `python3 pipeline/box_job_minutes.py`):
# from the per-job sidecars farm-out/box/<id>.json on origin/farm-results-rtx5090,
# which carry `started_at` and `finished_at` written by the runner — 350 of 350
# jobs have both. NOT from the step logs: the courier tail-truncates those at
# 200 lines and 135 of 252 have lost the start line they open with, and the
# jobs that overflow 200 lines are the long chatty ones, so a median off what
# survives is biased fast. Pooled, "the median job" is not a real quantity — it
# moves between ~1 and ~5 min on window choice alone. Per kind it is steady,
# which is why the page multiplies per kind: ltx n=178 (3.9–44.9), still n=115,
# charref n=26, inpaint n=4, other n=27.
#
# NOTHING REFRESHES THESE ON ITS OWN, and on 2026-08-13 that showed. The counts
# above went live five-minutely via telemetry.json the moment Roman asked why the
# page only updated when he reminded us; the MEDIANS underneath them stayed on
# their 12 Aug reading, and by the 13th the ltx figure was 4.8 against a measured
# 5.7 — so every hour this page published for episode 2 was ~19% short, and the
# pooled fallback was 2.9 against 4.3. Re-run the command above whenever the
# record grows a day; it takes four seconds and it is the only thing that moves
# these numbers.
measured_at: 2026-08-13 08:19Z
ready: 1
running: 1
done_today: 51
source: ssh rtx5090 dir C:\banyan-queue (supervisor tick)
queued_kinds:
  ltx: 2
kind_medians:
  charref: 2.9
  inpaint: 2.0
  ltx: 5.7
  other: 0.9
  still: 0.9
kind_median_fallback: 4.3
median_from: the 350 jobs the box finished 10 – 13 Aug
median_measured_at: 2026-08-13
