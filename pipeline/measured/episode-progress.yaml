      - {n: 15, state: candidate-awaiting-founder,  note: "already finished — the sapling clip contains the full action and it passed the check; still unwatched by him"}
      - {n: 16, state: blocked-decision,            note: "outside this lane by standing instruction — waits on the goblin being drawn into the plate, which is his call. A provisional still pick (r3-s2) exists, so this is not never-rendered"}
      - {n: 17, state: candidate-awaiting-founder,  note: "does its whole beat but will not render the same way twice — four takes to pick from (with 03 and 21)"}
