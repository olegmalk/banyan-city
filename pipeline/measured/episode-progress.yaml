      - {n: 4,  state: blocked-decision,            note: "script length: faces survive 3s of motion, the beat is written 6s. Also an unresolved head-balloon diagnosis — 'honestly stuck rather than queued'; ep2-b04-balloon-pair-0813 is the discriminating render"}
      - {n: 5,  state: fix-known,                   note: "the jog/uniform fix came back and he ratified 2026-08-13 - 'and yes, keep going in that direction for the guards' (arm B: action as the dominant clause, official read, second guard named where the script stages two). Six-clip wave queued on it; ep2-b05twin-wave-0813 renders the twin. The sash is the steward's invention, not his words, and that flag stays live"}
      - {n: 6,  state: fix-known,                   note: "guard block UNBLOCKED - ratified 2026-08-13 - 'and yes, keep going in that direction for the guards' (arm B: action as the dominant clause, official read, second guard named where the script stages two). Six-clip wave queued on it; ep2-b06-wave-0813 queued (guard 2 turns the bark clipboard over and reads off it)"}
      - {n: 7,  state: fix-known,                   note: "guard block unblocked by the same ratification; ep2-b07-wave-0813 queued"}
      - {n: 8,  state: blocked-decision,            note: "a model limit — a one-character reference suppresses the second character, so nothing puts the guard in. Not fixed and not attempted"}
      - {n: 9,  state: fix-known,                   note: "guard block unblocked by the same ratification; ep2-b09-wave-0813 queued"}
      - {n: 10, state: fix-known,                   note: "guard block unblocked by the same ratification; ep2-b10-wave-0813 queued - the floating head should go with a whole-figure init"}
      - {n: 11, state: fix-known,                   note: "guard block unblocked by the same ratification; ep2-b11-wave-0813 queued. Identity and costume were already clean here - this was always the staging nudge"}
      - {n: 12, state: candidate-awaiting-founder,  note: "has a PASSING plate he has never been shown, b12-r4-s2 (supersedes the older 'no plate at all' row)"}
