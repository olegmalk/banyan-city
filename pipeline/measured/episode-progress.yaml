remeasured_0819:
  measured_at: 2026-08-19 12:20Z
  scope: |-
    EPISODE 2 ONLY. Every one of its 21 rows below was rewritten in this pass. Episode 1 is untouched: its fifteen rows and its own `ep1_publication_CORRECTION_0819` are byte-identical, because episode 1 is closed on the founder's word and R4 says a lane does not reopen it.
  why: |-
    The rows were measured 2026-08-14 09:40Z and were five days and roughly forty written verdicts stale. The founder asked, 2026-08-19: "hows the progress with episode 2? i should be able to see it on the website but y'know.. its not projected very well." He was right twice over. FIRST, the states: nothing on file reflected that beats 01, 07, 17 and 18 now hold takes that PASS a pre-registered bar, that two demo cuts had shipped, or that the character gate twelve rows still named had been open since ninety minutes after the measurement. SECOND, and worse, /status was publishing NO ETA AT ALL: read_progress() emitted `stale-gate-closed` for those twelve rows, episode_eta.episode_row() counted over STATES which by design excludes it, and the KeyError was swallowed whole by build_sim.episode_eta_rows()'s bare except, so both ETA cards and the glance cell had been silently absent for days while the sapling tree beside them drew fine. Fixed in the same commit as this measurement (episode_eta.py, counts over EMITTED_STATES).
  states_read_from:
  - |-
      review/ep2-demo-0819/sources/picks-0819.yaml -- the latest cut's manifest: one line per beat, which take is in the cut and WHY (new / carry-forward / slate), with each take's verdict named. This is the durable record of what he would actually watch.
  - |-
      pipeline/jobs/ep2-b*-08{18,19}.yaml -- the specs' own appended verdict, verdict_clauses, verdict_fail_modes_all_reported and pick blocks. A bar registered before the pixels existed, scored after.
  - |-
      pipeline/work-ladder-0819.md -- the standing ladder: the four slates and their routes, the crf-10 per-beat table, the beat-14 parking ruling, the beat-07 judging lane's appendix, and the owner map.
  - |-
      review/ep2-picks/done-definitions.yaml -- each beat's done_when, its rounds, its recorded status (SHIP WITH FAULT NAMED / THIRD ROUND EARNED / NO VERDICT YET), and the founder rulings quoted verbatim inside it.
  - |-
      review/inbox.yaml -- READ FOR OPEN ENTRIES ONLY, and there are exactly two: one taste decision (the guards, beats 05/06/10/11) and one veto-only pick. That count is the whole authority for `blocked-decision` in this pass.
  - |-
      genomes/sapling/nodes/002b-first-citizen/node.md and leaves/002b-t0-c.yaml -- the STEWARDSHIP.md §6 record, which changed on 2026-08-19: he read all five rewritten lines (beats 12, 13, 15, 19, 20) and answered "all approved", so §6 no longer holds footage on any of them. Beat 17's 08-18 restage is the one line he has not been shown and §6 still gates it.
  state_rule: |-
    THE RULE APPLIED, WRITTEN DOWN SO THE NEXT REMEASURE CAN DISAGREE WITH THIS ONE ON PURPOSE RATHER THAN BY DRIFT.
      done                        -- only where the FOUNDER passed it. Episode 2: none. Not one beat of it carries a founder pass, and the two shipped cuts are bench assemblies (--out), with no leaf and nothing in lineage.yaml.
      candidate-awaiting-founder  -- the beat's slot holds footage carrying a WRITTEN pass or ship verdict against a bar registered before the pixels existed, and he has not ruled on it. What moves the beat is his eyes.
      fix-known                   -- the beat's own record names a route the CARD can run, and the footage in its slot carries no pass. Green: the machine's clock.
      blocked-decision            -- an entry OPEN in review/inbox.yaml is what the beat waits on, and no route the card can run reaches past it. Three beats, one question, and it is a taste question (R4).
      never-rendered              -- nothing rendered. Episode 2: none; every beat has footage or a judged sample somewhere.
    TWO TIE-BREAKS, both live in this pass. (a) A beat carrying BOTH a ship verdict and a named unfired route follows the ROUTE (green) when that route was filed to fix a defect the ship verdict itself records as outstanding -- beat 21, whose banded sky is exactly that. Beats 03, 04, 12 and 13 have no rung filed, so they follow the verdict (amber). (b) Where a beat is named in the open taste entry AND its slot holds a passing take, it counts as awaiting his LOOK -- beat 11, whose cast half was separately discharged on 2026-08-16 and whose note says so.
  counts_before:
    candidate-awaiting-founder: 6
    stale-gate-closed: 12
    fix-known: 3
  counts_after:
    candidate-awaiting-founder: 9
    fix-known: 9
    blocked-decision: 3
    done: 0
    never-rendered: 0
  states_before:
    1: candidate-awaiting-founder
    2: blocked-decision
    3: blocked-decision
    4: blocked-decision
    5: candidate-awaiting-founder
    6: candidate-awaiting-founder
    7: blocked-decision
    8: blocked-decision
    9: fix-known
    10: candidate-awaiting-founder
    11: candidate-awaiting-founder
    12: candidate-awaiting-founder
    13: blocked-decision
    14: blocked-decision
    15: blocked-decision
    16: blocked-decision
    17: blocked-decision
    18: fix-known
    19: blocked-decision
    20: blocked-decision
    21: fix-known
  what_this_retires: |-
    THE TWELVE HOLLOW LEAVES. `goblin_gate_CORRECTION_0816` below is left standing and is not edited -- it is the record of the audit that caught the dead gate -- but its closing sentence said the correction "does NOT re-score any beat" and left that to the motion and taste lanes. This pass IS that re-scoring, three days later, and every one of the twelve now carries a fresh state read off records that postdate the gate. The per-row `state_CORRECTION_0816` keys are gone WITH their rows rather than stripped from them: a correction of a superseded state has nothing left to correct, and queue_history.carry_correction would otherwise stamp the NEW state SUPERSEDED and republish the retracted reading into /queue for another week. The old readings are preserved in `states_before` above, which is where ep1's own correction put them.
  what_is_not_claimed: |-
    NO FOUNDER VERDICT IS INVENTED ANYWHERE IN THIS PASS. Nine beats move to `candidate-awaiting-founder`, which asserts only that a written pass exists and that he has not looked -- it is the amber state, his clock, and it is not a pass. Beat 13's 2026-08-18 board ruling and beat 16's 2026-08-16 leaf ruling are recorded at exactly the scope he gave them and no wider. `done` stays at zero for episode 2. Nor is any bar re-scored here: every state cites the lane verdict it was read from, and where two records disagree (beat 11's BROKEN-TAKE override against its newest take, beat 15's §6 hold against the same-day discharge) the row says so in its own note rather than picking a winner silently.
