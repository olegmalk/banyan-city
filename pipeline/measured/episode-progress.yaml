goblin_gate_CORRECTION_0816: >-
  CORRECTION, 2026-08-16 (provenance audit). READ THIS BEFORE ANY `state: blocked-decision` CARRYING THE
  WORDS "character gate" BELOW. The twelve episode-2 beats 2, 3, 4, 7, 8, 13, 14, 15, 16, 17, 19 and 20
  are all recorded here as `blocked-decision -- goblin beat, character gate`. THAT GATE IS OPEN AND HAS
  BEEN SINCE THE HOUR AFTER THIS FILE WAS MEASURED. `measured_at` is 2026-08-14 09:40Z; the founder
  answered the numbered goblin picker at 2026-08-14T11:09:07Z with "seed s0 is the goblin. also update
  the review page", and re-sent the same approval 12.5 seconds later at 11:09:19Z prefixed "anyways focus
  on continuing the queue!". The canonical repo record of that answer is the picker card in
  review/inbox.yaml ("Gate open. ... Twelve beats unblocked."), and commit 78007cc7 fired the wave off it.
  A SECOND, LATER ROUND ON THE SAME QUESTION IS ALSO RESOLVED: the 08-14 reference was judged infantile
  and re-picked on 2026-08-15 -- "ill take 1 for the goblin, although some of the heads in the reference
  are dismorphed or something, so just, beware" -- and that card names beats 07, 08, 15, 17, 19 and 20 as
  "unblocked on the design". So no beat in this file is held by the CHARACTER question today.
  THE STATE STRINGS AND NOTES BELOW ARE LEFT STANDING, NOT ERASED: they were true when the motion lane
  wrote them, and house style is that a superseded line stays and a dated sibling is written beside it.
  Each of the twelve carries a `state_CORRECTION_0816` naming its own evidence -- a successful (rc=0)
  ltx_i2v motion run, read from the box sidecars on origin/farm-results-rtx5090, which is the only
  complete corpus (pipeline/measured/queue-history.json is itself behind and is missing beat 07's
  post-gate motion entirely). All twelve have shipped motion; eleven of the twelve have motion rendered
  AFTER the gate opened, and beat 08 is the single exception and says so in its own correction.
  WHY THIS MATTERED ENOUGH TO CORRECT: pipeline/queue_history.py READS THIS FILE and copies `state` and
  `note` into every job row's `verdict` in pipeline/measured/queue-history.json, which /queue publishes.
  248 ledger rows across these twelve beats carried `beat_state: blocked-decision`, and beat 20's rows
  printed it directly beside `gate: "rendering now (2 jobs)"` -- a record contradicting itself on one
  line. WHAT IS NOT BEING CLAIMED HERE: this correction retires the CHARACTER GATE as a reason and
  nothing else. It does NOT re-score any beat, does NOT move any beat to `candidate-awaiting-founder`,
  and does NOT invent a founder verdict -- that is the motion and taste lanes' call, on their evidence.
  Some of these beats are still blocked on other, real grounds (beat 08 needs a two-figure guard+goblin
  reference that nothing on disk has; beat 19 is not renderable until a plate exists with the fruit ON
  THE STEM). Those grounds are simply not this one.
ep1_publication_CORRECTION_0819:
  correction: >-
    CORRECTION, 2026-08-19 (resolved-but-open drift audit; third of its class, after the goblin gate
    above and the sapling review card). READ THIS BEFORE ANY EPISODE-1 BEAT ROW BELOW. All fifteen of
    episode 1's beats now read `state: done`. Eleven were changed on this date; four already were.
    THE RULING IS THE AUTHORITY AND IT IS OLDER THAN THE MEASUREMENT: the founder closed episode 1 on
    2026-08-13, recorded three separate times in the `resolved:` entries of review/inbox.yaml -- the
    beat-02 rerun sheet, the sixteen-frame arm sheet, and the v42 provisional-cut card -- each
    carrying the same verbatim words, quoted in `ruling_verbatim` below. Episode 1 has been PUBLISHED
    and live for over a week. This file was measured 2026-08-14 09:40Z, a day AFTER that ruling, off
    review/ep1-audit-0812/index.html, an audit table written before it; the per-beat states were
    never reconciled with the whole-episode publication, so the status page kept publishing an
    open episode.
    THE TWO KINDS OF PASS, KEPT DISTINCT RATHER THAN BLENDED: beats 8, 9, 12 and 15 hold an
    INDIVIDUAL verdict on their own motion -- beat 8 on "beat 8 looks good", and 9, 12 and 15 on
    "yeah keep em still" -- and their notes are untouched by this correction. The other eleven (1, 2,
    3, 4, 5, 6, 7, 10, 11, 13, 14) were never screened one at a time and are PASSED BY WHOLE-EPISODE
    PUBLICATION: shipping the cut passed everything in the cut. Each of the eleven now says so in its
    own note, in those words, so a reader of one row never has to come back up here to learn which
    kind of pass it is holding.
    WHY THIS MATTERED ENOUGH TO CORRECT: pipeline/episode_eta.py `read_progress()` feeds the sapling
    tree in pipeline/charts.py, which published "EP 1 · 4/15 passed" on /status for six days after
    the episode went live -- ten leaves drawn "waiting for your look" and one "waiting on a decision",
    aimed at an author who had already ruled and moved on. A page that asks a man to re-decide what he
    closed is the same defect as one that tells him he is blocking work he unblocked; that was
    goblin_gate_CORRECTION_0816, and this is the same class one episode over.
    WHAT IS NOT BEING CLAIMED. This records a WHOLE-EPISODE pass, not fifteen individual taste
    verdicts, and it does not pretend the open per-beat questions were answered -- they were closed
    UNREAD, which each note says: beat 02's loop, beat 05's sapling reveal, beat 06's sixteen-frame
    sheet and its unscreened v42 zoom-out, beat 07's discarded half of its footage. It does not touch
    the licence gate either: beats 6, 9, 12 and 15 remain licence-gated for REDISTRIBUTION of their
    stills (the standing D15 debt), which is a rights question and never was a taste one. And it
    invents no verdict the founder did not give -- the pass is his sentence, applied at the scope he
    said it at.
    BEAT-LEVEL TASTE RE-OPENS ONLY IF HE REOPENS IT (R4 -- taste belongs to the author). No lane may
    re-file any of these fifteen as `candidate-awaiting-founder` or `blocked-decision` on its own
    initiative. If he asks to look at episode 1 again, that request is the authority, and a dated
    sibling correction is written here beside this one rather than erasing it.
