# Where every beat of every episode actually stands. Read by episode_eta.py and,
# through it, by the ETA section at the top of banyan.city/status.
#
# Founder, 2026-08-13: "lets start working on ETA, basically the estimated time
# we finish something, so we have a good idea of for example when we will
# finished episode 2".
#
# THE CONTRACT, and it is the whole reason this file can be trusted:
# A LANE THAT SCORES A BEAT UPDATES THAT BEAT'S LINE IN THE SAME COMMIT AS THE
# SCORING. Not at the end of a wave, not when someone next touches the page — at
# scoring time, beside the verdict, the way an inbox entry travels with its
# artifact (SITE.md). This file is the ONLY input that says how far an episode
# has got; a lane that renders a fix and leaves the line saying `fix-known` has
# published a wrong ETA, and nothing else in the repo will catch it.
#
# THE FIVE STATES. Every beat carries exactly one. They are exhaustive so that a
# beat can never fall out of the arithmetic by being unlabelled, and a value
# outside this set is DROPPED rather than guessed at — the beat stops being
# counted and the page's total stops matching, which is deliberate and visible.
#
#   done                        the author has passed it. His word, never the
#                               steward's read of it (R4 — taste is his).
#   candidate-awaiting-founder  a take exists and is in front of him. The CARD
#                               is finished with this beat; a person is not.
#   fix-known                   we know what is wrong and what to do about it.
#                               Costed as firm machine work.
#   blocked-decision            it cannot proceed until a human decides. Costed
#                               SEPARATELY, because a beat that gets cut or
#                               restaged costs nothing like a beat that does not.
#   never-rendered              no candidate has ever been produced.
#
# WHAT IS NOT IN HERE, on purpose: hours. The hours are multiplied at build time
# from this file x pipeline/measured/eta.yaml x pipeline/measured/box-queue.yaml,
# so flipping one beat below moves the published estimate on the next build with
# nothing re-run. A stored total would keep printing last night's backlog against
# this morning's states — see box-queue.yaml's header for that argument in full.
#
# HOW THIS SEEDING WAS DONE (2026-08-13). Every line below was read off the
# founder-facing review pages, not inferred from what is on disk, and the source
# is named per episode. One ordering trap is worth recording because it will
# catch the next person: review/ep2-picks/motion-0812.html is NOT chronological.
# Its `#where-ep2-stands` table landed 08-11 22:54; the `#read-this-first`
# summary above it landed 08-12 05:23; and review/inbox.yaml entries from 08-12
# 10:40 and 11:32 are later than both. Several rows of the pretty table are
# already stale and the later sources win.
measured_at: 2026-08-13 09:20Z
source: >-
  read off the founder-facing review pages named per episode below, cross-checked
  against review/inbox.yaml (which is later than both review pages)

episodes:
  - number: 2
    node: 002b-first-citizen
    title: First Citizen
    # Where the takes waiting on him actually live — the /status card links its
    # "waiting for your look" count straight here, so the number and the thing
    # it counts are one click apart.
    review_url: /review/ep2-picks/motion-0812
    total_beats: 21
    states_read_from: >-
      review/ep2-picks/motion-0812.html (#read-this-first, later than its own
      #where-ep2-stands table), review/ep2-picks/morning-0812-wave2.html,
      review/ep2-picks/wave2-needs-founder.md, review/inbox.yaml
    # NOT ONE BEAT OF EPISODE 2 IS `done`. That is not an oversight in this file,
    # it is the finding: the strongest claim anywhere on the review pages is the
    # steward's own hedge — "All four are my read, not a verdict. None of them
    # has your eye on it yet." Nine beats have a take sitting in front of the
    # author. The card is not what episode 2 is waiting for.
    beats:
