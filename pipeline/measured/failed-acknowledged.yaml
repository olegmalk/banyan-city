# The box's `failed/` pile, entry by entry, with the reason each one is there.
# Read by build_queue.py and build_sim.py so the public chip can tell a KNOWN
# failure from a NEW one.
#
# WHY THIS FILE EXISTS. The box publishes `queue.failed` as a bare integer —
# `len(os.listdir(failed/))`, telemetry.py:711-712 — and both pages rendered it
# as a red chip reading "39 sitting failed". That number is true and the chip
# was still dishonest, because a red count with no denominator says "39 things
# are wrong and nobody has looked", and every one of the 39 had been looked at:
# 33 in pipeline/queue-failure-triage-0817.md (six cause groups, 25 of them
# never drew a pixel) and 6 in the compseed specs' own SUPERSEDED headers, whose
# frames were recovered the same day. The founder screenshotted the chip on
# 2026-08-18 and he was right to: the page was alarming him about work that was
# already closed, which is the fastest way to teach someone to ignore a red
# chip.
#
# WHAT IT IS NOT. It is not a fix and it does not retire anything. Nothing in
# `failed/` was moved, re-fired or deleted to write this — the pile on the box is
# byte-for-byte what it was. Acknowledged means "diagnosed and written down",
# NOT "resolved": group 1's eight are fake failures whose frames are on disk,
# group 5's five are real jobs blocked by a stale box clone and are worth
# re-firing, and both facts live in the triage doc, not here. This file only
# carries the count the pages subtract, so a 40th failure turns the chip red on
# its own.
#
# THE LIMIT, STATED BECAUSE IT IS A REAL ONE. The pages compare COUNTS, not ids
# — telemetry publishes no id list, and adding one is a box-side change that
# would not reach a page until the box's clone pulls (which, per the triage doc,
# is exactly the thing that has been two days stale). So if one acknowledged
# entry were removed from `failed/` in the same window a new job failed, the
# total would stay 39 and the chip would stay neutral. That is the one blind
# spot, it is documented here rather than papered over, and it closes the moment
# telemetry publishes `failed_ids`. The chip is still strictly more honest than
# a permanent red number nobody can act on: any NET increase shows.
#
# HOW TO UPDATE IT. When a failure is triaged, add its id and its one line here
# and the chip goes quiet again. When one is genuinely new and untriaged, LEAVE
# IT OUT — the red chip is the point. `count` below must equal the length of
# `acknowledged:`; the builders derive the number they subtract from the list,
# never from `count`, so a stale `count` cannot mislead a page (it is here for a
# human reading the file).

