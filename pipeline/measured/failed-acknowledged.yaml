- id: ep2-b04-tileread-v0-0820-1787248550
  group: publish-glob-armname
  why: 'LIVE DEFECT, PIXELS STRANDED — NOT superseded and NOT retried. `hintskel` ran rc=0 at 17:56:19Z and
    wrote C:\banyan-farm\b04tileread-v0-0820\out\ep2-b04-tileread-v0-0820-nocontrol.png (+ .meta.yaml), which
    is still sitting there. The job then died rc=1 at step `publish` because that step globs
    `<out>/ep2-b04-tileread-v0-0820-hintskel.png*` — it names the artifact after the STEP while
    controlnet_plate.py names it after the `--arm` (`nocontrol`). The glob matched zero PNGs, so the copy
    carried only prompt.txt and negative.txt, the manifest was written over 2 files, and the spec''s own
    `raise SystemExit(0 if len(files) >= 4 else 1)` correctly caught it. farm-out/ep2-b04-tileread-v0-0820
    holds prompt.txt, negative.txt and the .sha256 and no image; the courier therefore pushed no pixels. The
    wrong name is committed in the spec twice — in the publish body AND in its declared `artifacts:` list —
    so a re-enqueue unchanged reproduces it. Recoverable without the GPU: copy the eight
    b04tileread-v*-0820\out\*-nocontrol.png into farm-out and re-write the manifests. Left for the b04
    tileread lane, which owns those specs; flagged to the founder-facing report 2026-08-21.'
  doc: pipeline/jobs/ep2-b04-tileread-v0-0820.yaml (publish step glob + artifacts list)
