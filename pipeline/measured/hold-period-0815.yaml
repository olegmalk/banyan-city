# Hold period, measured on every clip that carried a `cadence` verdict.
#
# WRITTEN BY pipeline/hold_period.py ON 2026-08-15. Do not hand-edit — re-run
#   python3 pipeline/hold_period.py <clip.mp4>
# or the file publishes a number nothing measured.
#
# THIS FILE IS A MEASUREMENT, NOT A VERDICT, AND NOTHING HERE RE-JUDGES ANY
# TAKE. `period: 3` is a FACT about the frames — a picture changes every third
# frame and the two between it differ by ~0.2 MAD where the change frame is
# ~2.7. Whether that is a defect is taste, and taste is the founder's (R4).
# The owning lanes decide what to do with their own beats. A metric errs in
# both directions and is a filter, never a verdict: THE COLD READ DECIDES.
#
# WHY IT EXISTS. `cadence` — the parity-2 ratio these clips were scored on —
# reads exactly 1.00x on EVERY ODD hold period by construction (period 2 =
# 26.67x, period 3 = 1.00x, period 4 = 14.12x, period 5 = 1.00x). It called
# ep2-b13-shade-cycle-s2-0815 "1.06x — every frame is new" while that clip
# changes its picture once every three frames. Proof:
# pipeline/research/ltx23-motion-source.md §4.1 (commit dfa87c27), and the
# aliasing table is pinned as a regression test in pipeline/test_pipeline.py.
#
# HOW TO READ A ROW.
#   period    frames each distinct picture is held for = peak autocorrelation
#             lag of the per-pair luma difference series. 1 = no frame hold.
#   strength  that peak's autocorrelation, 0..1. >=0.50 dominant, >=0.30 partial.
#   eff_fps   fps / period — the rate a viewer actually experiences.
#   was_cadence  what the retired metric said, so the discrepancy is one line.
# Read at 1/8 scale (suppresses anime line-work churn; the reading is
# scale-stable, 0.97 -> 0.96 from 352x640 to 88x160).

