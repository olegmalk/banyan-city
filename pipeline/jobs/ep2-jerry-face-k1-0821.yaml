  CONTAINMENT BREAK -- the frame comes back seated, or cowled in purple, or standing in the tile''s open
  field. IPA leaks composition and the ref is a crop of a seated figure. Then the mask is the next variable,
  not the scale, and the tightest available mask is the head box itself (330,145,502,330) with the ref
  repainted onto flat ground.


  ATTRIBUTE MISS -- the containment holds and the face is still j2''s. That would mean 0.7 is too weak
  against a controlnet running at scale 1.0 for the full denoise, and the next rung is an ip-scale ladder,
  NOT a second reference and NOT a wording edit.


  AND THE THIRD OUTCOME IS THE ONE TO WATCH FOR: the brow and slit arrive AND T1 regresses to pupils,
  because the tile''s slits sit in a modelled socket and IPA carries what it is shown. That is a partial
  win and it is scored as a FAIL of this rung, because a LoRA trained on a pupilled face teaches pupils.'
