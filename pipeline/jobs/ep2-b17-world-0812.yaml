# 2026-08-12. HIS NOTE ON THE SET: "they're not bad. its just that pretty much all the
# beats you made have a blank background."
#
# ARCHAEOLOGY FIRST, AND IT DID NOT SAY WHAT I EXPECTED. The sapling was missing because
# the WORD was missing, so the obvious guess was that the environment word is missing too.
# It is not. I grepped every goblin motion prompt this lane has written: 19 of 21 say
# "field", several add grass, dirt or soil. The only two without are the beat-04 extreme
# close-ups. The environment has been named in essentially every prompt.
#
# SO THE DIAGNOSIS IS THE FIG, NOT THE SAPLING. When I asked for "one small ROUND green
# fig" I got a sphere, because that is what the words said. When I asked for "a field" I
# got a field: flat grass, flat sky, nothing in it. The model has been giving me exactly
# what I specified, and what I specified was one generic noun. Everything I named appeared;
# everything I never named -- depth, midground, wildflowers, a treeline, haze, raking light
# -- never did. His "blank" is not an empty background, it is an UNDESCRIBED one.
#
# THE SAMPLE: beat 17, because it already PASSES on action (brushes off, turns to go) so
# nothing about the performance is in question and only the world changes. The positive
# swaps one clause -- "standing in a field under morning light" -- for the world the script
# actually describes: deep summer meadow, seed-headed grass running back into distance,
# wildflowers, treeline on the horizon, haze on the far grass, one sapling near him, low
# amber afternoon light raking across and throwing long shadows. Beat 17's own fence in
# shots.md asks for "afternoon light warming toward amber" and "the tiny sapling standing
# tall toward the open field", so none of this is invented.
#
# ONE DECLARED SECOND CHANGE: the tripod phrase is out. Strictly that is a second variable
# against the passing b17, but it is not an UNCONTROLLED one -- it has its own evidence
# (3-of-5 drew a tripod with it, 0-of-6 without) and it is now the standing recipe on every
# job. I would rather not hand him another tripod to look at.
