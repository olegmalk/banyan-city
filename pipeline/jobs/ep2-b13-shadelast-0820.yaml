  says the beat-15 6 gate is LIVE. It was, when that spec was written on the morning of 08-19; the approval
  landed later the same day.'
script_line: 'Beat 13 THE SHADE (1:00-1:04), node.md:88 as rewritten 2026-08-17 and RATIFIED BY THE FOUNDER
  2026-08-18 by his own board ruling -- "the shipped version stands (no slide, he sits down beside it,
  thin shade)": "The scavenger''s legs give out and he drops to sit in the grass at the base of the stem,
  then tips his head sideways into the sapling''s hand-sized patch of shade -- the only part of him it
  will cover -- knees up around his ears." THE PLATE IS ALREADY THE SEATED END STATE, so the only action
  left in the beat is the head tipping into the shade. Rendering a slide would be re-opening a question
  the founder closed.'
bar:
  G3_he_is_still_seated_knees_up_in_the_last_frame: 'THE CLAUSE THIS RUNG EXISTS FOR, and it is a FOUNDER
    ruling and not a steward preference: `the shipped version stands (no slide, he sits down beside it,
    thin shade)`, 2026-08-18. At f120 he is seated with his knees up. Rung 1 was out of frame by f114.'
  G7_the_tilt_is_SIDEWAYS_and_the_face_stays_readable: 'His head goes over to one side and his face is
    still visible at f120. Rung 1''s tilt was real and pointed the wrong way: by f024 the head was a bald
    dome seen from above with the cloak''s shadow where the face had been, and it stayed that way for
    fifty frames. A beat with no face in it cannot carry a reaction.'
  G8_the_shade_lands_on_his_eyes: Weakest clause of the three and said so in advance. The plate's shade
    is thin and its frame is the green gloom beat 13's plate verdict already recorded as CARRIED, NOT
    FIXED. If G3 and G7 pass and only G8 fails, this beat's next rung is a PLATE exposure rung and not
    another wording.
  G2_the_pre_registered_cost: 'G2 THE PRE-REGISTERED COST OF THIS SHAPE, and it is named because the precedent
    paid it. ep2-b04-headlock-0820 moved one clause from an instruction into a placement and cut head
    travel 64.7 px -> 4.7 px, fourteenfold -- AND IT TOOK THE EYES WITH IT: eye-band interframe fell 0.356
    -> 0.126 and the gaze stopped travelling, which its own spec had pre-registered as a degenerate pass
    and reported as a FAIL. The same trade is the likeliest failure here. A clip that holds the last frame
    by holding EVERY frame is a FAIL of this rung, not a pass, and the finding would be that terminal
    placement buys position at the cost of performance -- after which the next rung places the MIDDLE
    of the shot as well as its end, rather than reaching for a flag.'
not_done_on_purpose: 'NO recipe change: size, frames, fps, guidance, distilled sigmas, two-stage, offload,
  mode and --image-crf 10 are rung 1''s, which are the b14 crf-10 parent''s. NO new init -- the same composited
  plate, the same sha, the same anchor and the same pre-registered framing bbox. NO new seed: 20260820
  again, so rung 1 is a true control. NO change to the NEGATIVE, which is the point -- it already named
  `standing up` and `walking out of frame` and did not hold, and leaving it in place is what makes this
  a test of the positive. No pick, no plate_ack, no cut, no publication.'
pre_registered_fail_modes:
- F-DEGENERATE-STILL -- the last frame is held by holding every frame. The precedent's own cost; see G2.
  A FAIL, not a safe outcome.
- F-STANDS-UP-ANYWAY -- the placement does no better than the negative did, in which case the finding
  is that words will not hold this engine in place on these inits and the next rung is mechanical rather
  than verbal.
- F-PLANT-PICKED-UP -- rung 1 held the plant on beats 03 and 13 and lost it to a hand on beat 15. Re-checked
  on all three.
- F-IDENTITY-DRIFT -- rung 1 held on all three; a regression here would be attributable to the sentence.
rung_1_the_control: 'ep2-b13-shademotion-0820: FAIL twice. The head tipped -- continuously from f004,
  so the predicted F-NOTHING-MOVES did not fire -- but it tipped FORWARD AND DOWN into his own knees,
  taking his face out of view from f024 to f078, and then he rose at f084 and was out of frame by f114.
  The plant held all 121 frames on the lowest-contrast plate here.'
the_one_variable: 'The action clause. `tips his head slowly sideways ... and does not stand up, does not
  slide` becomes a placement of the last frame that does two jobs in one sentence: still seated, knees
  up, head tilted SIDEWAYS with the face still toward camera. `his face still turned toward the camera`
  is the new half and it is aimed at rung 1''s specific miss -- a sideways tilt that keeps the face readable,
  rather than the forward fold the init already afforded.'
