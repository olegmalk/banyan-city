  written in rung 1's own verdict, the precedent is measured -- 64.7 px -> 4.7 px on ep2-b04-headlock-0820
  from one clause moved out of an instruction and into a placement -- and firing the same sentence shape
  on THREE beats at one seed tests the MECHANISM rather than the beat. Nothing else changes, so a bad
  result is attributable to the sentence.
