# ep1 beat 07 "zero-0-moving-parts" — a SECOND DRAW of the r2 wording on the
# prepared plate. One variable against ep1-b07-v34-plate-twin-r2: the seed.
#
# WHY BEAT 07 AND WHY NOW. Beat 07 has been drawn five times and every one of
# them used the same seed, 20260738. Measured today on the box with
# collect_farm.measure()'s definition (median mean-|Δ| per frame pair, and the
# share of pairs under 0.2), all five plate twins:
#
#     07-ltx-plate      (r1/wave) 0.291  47% frozen
#     07-ltx-r2-plate             1.088  39% frozen
#     07-ltx-r3-plate             0.411  48% frozen
#     07-ltx-r4-plate             0.627  39% frozen
#     07-ltx-r5-g20-plate         0.617  47% frozen   <- the one in the v35 cut
#
# So the clip beat 07 currently ships in the v35 provisional is 47% frozen, and
# no arm of this beat has ever got below 39%. Five rounds of rewording moved the
# median around and never moved the frozen share. That is the signature of a
# beat where the WORDING has been explored and the DRAW has not — five samples
# of one seed is one sample of the seed.
#
# WHY THE r2 WORDING SPECIFICALLY, and not the round that is in the cut. r2 is
# the strongest mover on this beat by a wide margin — median 1.088 against
# 0.627 for the next best, nearly double — and it ties for the lowest frozen
# share. Reseeding the round that is in the cut (r5-g20) would also change
# guidance, which is two variables. Nothing here says r2 is the round the cut
# should use: WHICH round beat 07 ships is R4's open call and this job does not
# touch it. It makes a second draw of the best-moving wording exist, so that
# call has something to be made between.
#
# WHY NOT A SIXTH WORDING. 879820f and 655d2c6 both record later rounds of a
# beat measuring worse than earlier ones on this exact series; "reword again"
# has been tried five times here and the frozen share never left the 39-48%
# band. A new seed asks a question the five existing clips cannot answer:
# whether beat 07's stubbornness lives in the text or in the draw.
#
# THIS IS THE SAME SHAPE AS ep1-b08-v34-plate-r3-reseed / -r4-reseed2, which the
# frozen-beats lane queued for beat 08 on the same reasoning. Read those first.
# Note the caution their results now carry: beat 08's reseeds have NOT rescued
# it (r3 at seed 20260851 came back 0.172 median / 66% frozen), and beat 08's
# raw r1 moves at 1.076/0% while its own plate twin freezes at 0.121/62% —
# which is evidence that on THAT beat the freeze travels with the plate rather
# than the seed. Beat 07 is not in that situation: its plate twins move (1.088
# at r2), so the reseed hypothesis has not been falsified here. If both beat-07
# reseeds also come back at 39-48% frozen, that is the finding, and the next
# question stops being the seed.
#
# SETTLED RECIPE, NO GATE. Guidance 1.0, distilled sigmas, two-stage, and the
# cover-centre crop the founder ratified today ("the crop -- yes"). This job
# introduces no recipe change, so it needs no sample ahead of it.
#
# WHAT THIS IS NOT: no pick, no ranking, no promotion into any cut, no taste
# verdict. A frozen result is reported as a frozen result.

