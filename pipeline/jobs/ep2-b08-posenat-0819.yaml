# BEAT 08 RUNG B2 -- WAS THE FOREARM FLIP OUR ANATOMY, OR THE NET'S PRIOR?
# ONE SAMPLE. ONE ARM. ONE VARIABLE, AND IT IS THE GUARD'S ELBOW.
#
# ============================================================================
# THE ONE VARIABLE
# ============================================================================
# ep2-b08-posenet-sample-0819 (verdict appended to its own spec, 2026-08-19)
# answered all three of the research's questions YES -- pose binds on
# animagine-xl-3.1, two skeletons give two distinct whole figures, and the stated
# stature ratio survives (1.161 against 1.100 authored) -- and then failed the
# beat's own gesture in a very specific way:
#
#   THE NET BOUND THE UPPER ARM TO THE PIXEL AND MIRRORED THE FOREARM ABOUT THE
#   ELBOW. The hint authored Rsho (512,491) -> Relb (360,485) -> Rwri (257,657):
#   out horizontally, then steeply DOWN toward the belly. The render put a hand
#   with a raised index finger at about (320,420) -- roughly 230 px ABOVE the
#   authored wrist -- and drew NOTHING at the authored wrist at all. The
#   forearm's length and attachment bound; its DIRECTION did not.
#
# That verdict named two candidate causes and ruled the cheaper one testable
# first. THIS JOB TESTS IT, and the variable is one number:
#
#   held: the net (xinsir openpose), the scale (1.0), the base, the seed
#     (20260819), the size, the steps, the guidance, the prompt and negative word
#     for word, the driver file BYTE-IDENTICAL (d6df250d...), both figures'
#     positions, both statures, the shared foot line, the guard's shoulder, the
#     belly target, the total reach and the 0.847 extension -- all asserted key
#     for key in author_b08_openpose_hint.py --selftest against the filed hint's
#     own metadata, and the FILED hint itself asserted byte-identical on sha
#     3fe4eacc so that the parent verdict still rests on the bytes it measured.
#   changed: the guard's ELBOW, from `solved` to `natural`.
#
# ============================================================================
# WHY THE ELBOW, AND WHY THIS IS NOT A GUESS
# ============================================================================
# `solved` lets the two-link triangle pick the elbow, and at this separation the
# triangle puts it 6 px from SHOULDER HEIGHT and laterally out -- a CHICKEN-WING.
# Nobody points at somebody's belly that way. A person's elbow hangs LOW AND NEAR
# THE RIBS and the forearm reaches forward and down. `natural` places the elbow by
# anatomy instead -- one upper-arm length from the shoulder, 15 degrees off
# straight-down, opening toward the target, so it hangs 147.3 px below the
# shoulder -- and then puts the wrist one forearm along elbow->belly, so the
# forearm still aims: ray miss 0.0 px, and the wrist stops 57.6 px clear of the
# torso rather than prodding it.
#
# BUT THE REASON TO EXPECT THIS TO HELP IS ASSERTED IN CODE, NOT HOPED FOR, AND IT
# IS THE WHOLE ARGUMENT OF THIS RUNG. Reflect each forearm about its own elbow --
# the exact transformation the net applied -- and ask where the hand lands:
#
#   solved,  mirrored: hand at y=312.5, ABOVE the shoulder at y=491.0. That is a
#     perfectly plausible raised-finger point, and it is what the net drew.
#   natural, mirrored: hand at y=581.5, BELOW the shoulder. It reads as nothing
#     in particular.
#
# So the new staging does not merely ask for the right pose -- IT STOPS OFFERING
# THE NET AN ATTRACTIVE WRONG ANSWER. If the flip was our anatomy, this fixes it.
# If the flip was the net's prior, it will flip this one too, and the hand will
# appear near y=581 with nothing at the authored wrist -- WHICH IS A CLEAN,
# READABLE NEGATIVE and is why this sample is worth 14 seconds either way.
#
# ============================================================================
# WHAT IS STILL EXPECTED TO FAIL, PRE-REGISTERED SO IT IS NOT REDISCOVERED
# ============================================================================
# The parent's four costs are UNTOUCHED by this variable and are all expected to
# recur: the frame will be NIGHT (parent mean luma 32.5, with `dark, night` in the
# negative -- scale 1.0 is the suspect and it is not this rung's variable), the
# board will be a prop at the wrong height (no rectangle is in a pose hint, on
# purpose), the guard may read female, and `plump` may broadcast to the guard.
# NONE OF THOSE COUNT AGAINST THIS RUNG. Each has its own named sample after this
# one, in the order the parent's verdict set.
#
# NO SPEND, NO PROVIDER, NO DOWNLOAD, NO NEW WEIGHTS, NO CANON FILENAME, NO PICK,
# NO PUBLISH TO THE SITE, NO POST, NO ASSEMBLY. No video is encoded on this path.

