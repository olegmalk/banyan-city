  It sits beside the committed composite as the second half of answer B: the composite shows the geometry,
  this shows what the sampler makes of it. The card owner stages it; this lane does not touch review/.
  If the author rules A, these pixels are archived evidence of a road not taken and cost $0. If he rules
  B, the exception is written into pipeline/canon.yaml AS an exception so it cannot drift, and a NEW plate
  is authored under it -- this still does not become that plate.'
success: 'ONE 832x1216 png, its mask and its provenance sidecar, published into courier-box with a sha256
  manifest naming every file in full. LANDING IS A LOOKED-AT ANSWER, NOT A PASS: the honest outcome of
  this rung may well be `the tall plant does not survive the sampler` or `it survives and reads as a lollipop`,
  and either of those is a delivered result because it answers the card''s question with pixels. What
  would NOT be success is a frame nobody opened, a glob that published nothing, or a verdict written from
  a metric instead of an eye. THE CLAUSE THIS CANNOT SETTLE IS NAMED IN ADVANCE: it is a STILL, so it
  cannot show the head tipping into the shade. It shows whether a believable tall plant exists in this
  frame at all, which is the necessary condition for the motion rung that would follow a B ruling.'
why: 'ANSWER B OF A TASTE QUESTION NEEDS PIXELS, AND SO FAR ONLY ANSWER A HAS THEM. The card /review/ep2-b13-shade-0820
  asks the author whether the plant may be drawn taller than canon in this one shot so its shade can reach
  his face. Four b13 motion rungs have now failed the shade clause, and the closing note on ep2-b13-shadelit-0820
  says why the route is closed at the plate: `there are only two ways to put them in one register: raise
  the plant, or lower his head`, and raising the plant is refused by the composite tool itself. That refusal
  was opened once under --founder-option and drew the taller plant. A DRAWN COMPOSITE IS FLAT VECTOR ART,
  NOT A FRAME -- the tallcomp parent is the only evidence that a 0.30 inpaint converts it into this plate''s
  line quality, and that evidence was earned on a 4.10 percent mask over grass. This rung asks whether
  the same recipe holds over 7.97 percent against sky and foliage. Asking the author to rule on vector
  art when a $0 five-minute sample can show him the real frame would be putting the question badly.'
