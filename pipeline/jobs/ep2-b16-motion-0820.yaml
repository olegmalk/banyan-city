not_done_on_purpose: 'No crop change. No crf, guidance or sigma change. No second seed. No goblin-design
  change -- the plate carries the superseded adult and that is a separate re-render. No cut swap and no
  plate_ack: beat 16 stays a slate until the founder screens something, and his /review/ep2-b16-leaf-0820
  card is still open with `licence` still available to him.'
pre_registered_fail_modes: M-WAVE the leaves swing, which loses the beat in the funniest available way
  and is the likeliest outcome, because the composited plant is the largest high-contrast object in frame
  and i2v moves exactly that. M-THIRDLEAF the plant grows a leaf or a branch across 121 frames; unmeasured,
  because no i2v run in this tree has animated a composited plant as the SUBJECT. M-FROZEN the plant holds
  and takes the man with it -- beat 04 measured that holding the head holds the eyes on this engine, and
  if stillness is similarly contagious here the beat needs two renders rather than one prompt. M-MOUTH
  the deleted mouth negatives were also holding the face together and it drifts. M-INVERT the pass pulls
  focus to him and the plant stops being the subject.
the_one_variable: 'THE INIT AND THE WORDS -- there is no earlier rung on this beat to hold a variable
  against, because this is its first animation of any kind. Every generative flag is the parent''s: 704x1280,
  121 frames, 24 fps, guidance 2.0, distilled sigmas, two-stage, --image-crf 10, sequential offload. THE
  NEGATIVE''S MOUTH BLOCK IS DELETED and the plant-count words added; both are forced by the beat -- b04''s
  negative bans `open mouth`, `talking` and `lip sync` and this man is speaking. Nothing else in it moved.'
the_plate_reservation_carried_forward: 'S1 PASSED WITH A CAVEAT AND IT IS CARRIED HERE RATHER THAN DROPPED.
  The relation is unambiguous -- the plant is in front, large, and occludes him -- but the eye still goes
  to his FACE first, because he is a face and the plant is a shape. The plate spec pre-registered this
  and named the lever: a tighter crop, which beat 09 proved this week survives i2v at 105% of frame 1''s
  high-frequency energy. That lever is NOT taken here, because cropping and animating in the same job
  would leave two candidate causes for anything that happens.'
why_the_word_wave_is_not_in_the_prompt: 'The joke is `I can''t even wave` and the obvious sentence is
  `the leaves do not wave`. THAT IS THE BEAT-15 TRAP AND THIS TREE HAS PAID FOR IT TWICE: a negation inside
  the POSITIVE is not a prohibition, it is the noun phrase, placed. `Nobody touches the plant` closed
  a fist on the plant at f105 and the sapling was uprooted by f120. So the leaves are given something
  to do that is not waving -- they hang, they hold, the daylight slides across them -- and the word never
  appears in either file.'
