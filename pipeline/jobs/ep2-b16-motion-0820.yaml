  camera locked, top-corner mean abs luma under ~3 against f001. Then M1 two leaves on one stem in the
  same place at f121 as at f001 -- this beat''s joke is that it cannot wave, so a waving plant is the
  wrong shot, not a lively one; M2 still exactly two leaves, canon sapling-two-leaves, which a composited
  plant under 121 frames of i2v has never been asked to survive before; M3 he is visibly talking, mouth
  and shoulders; M4 still moving inside the last twenty frames; M5 one man, seated, no melt; M6 the plant
  is still the subject and still in front.'
why: $0, ~7 minutes, one seed, and it is the last step between beat 16 and a footage candidate it has
  never had. The recipe is the crf-10 i2v family that has run clean eight times this week; only the init
  and the words change, so a bad result is attributable to this beat rather than to the recipe. One sample
  before any batch -- and this init has never been animated.
