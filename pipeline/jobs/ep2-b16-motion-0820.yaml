  \ of the two TOP corner patches against f001,\n     under ~3. Bought on beat 04 the hard way: s5 was\
  \ the best-looking clip in\n     its batch, would have been picked by eye, and read 49.4 and 52.2. A\
  \ clip\n     that fails T0 is not scored further.\n  M1 THE PLANT HOLDS. Two leaves, one stem, in the\
  \ same place at f121 as at\n     f001. This beat's whole joke is that it cannot wave, so a waving plant\
  \ is\n     not a lively take, it is the wrong shot.\n  M2 STILL TWO LEAVES at f121. Canon `sapling-two-leaves`.\
  \ i2v growing a third\n     is the named risk of animating a composited plant and it is the one thing\n\
  \     no amount of good motion redeems.\n  M3 HE IS TALKING. Mouth opening and closing, some head and\
  \ shoulder movement.\n     A frozen man behind a still plant is a photograph, and the beat is a\n  \
  \   conversation.\n  M4 STILL GOING AT f121 -- visible movement in the last twenty frames. b03 and\n\
  \     b13 both bought their hold by killing the clip; the placement here names an\n     ongoing action\
  \ for exactly that reason.\n  M5 THE FIGURE SURVIVES -- one man, seated, no melt, no second goblin,\
  \ no drift\n     into the plant.\n  M6 THE PLANT IS STILL THE SUBJECT. It is in front and it stays in\
  \ front; if\n     the pass pulls focus to him the shot has inverted.\nNOT SCORED: which goblin design\
  \ he is. The plate carries the superseded adult\nand the creature ruling is a separate re-render for\
  \ a separate day."
failure_predicted_in_advance: "M1 IS THE RISK AND IT IS THE OPPOSITE OF THE USUAL ONE. Every\nother beat\
  \ this week fought to get MOTION out of this engine; here the composited\nplant is the largest, highest-contrast\
  \ object in the frame and i2v likes to move\nexactly that. If the leaves swing, the beat is lost in\
  \ the funniest possible way\n\u2014 an engine waving the plant that says it cannot wave \u2014 and the\
  \ next lever is a\nterminal placement of the leaves' position, not a negative.\nSECOND, AND SPECIFIC\
  \ TO A COMPOSITED INIT: M2. The plant is drawn geometry that\nsurvived one 0.30 pass; 121 frames of\
  \ i2v is a much longer argument with it, and\na third leaf or a branching stem is how it would lose.\
  \ No i2v run in this tree\nhas ever animated a composited plant AS THE SUBJECT -- b19, b15, b03 and\
  \ b13 all\ncarried theirs as small set dressing -- so this is genuinely unmeasured.\nTHIRD: M3 AND M1\
  \ MAY BE COUPLED. Beat 04 measured that holding the head holds\nthe eyes on this engine; if holding\
  \ the plant also holds HIM, this beat needs\nits stillness and its performance to come from different\
  \ places and the honest\nnext instrument is a composite of two renders rather than one prompt.\nNOT\
  \ PREDICTED, WATCHED ANYWAY: the mouth. b04 and b09 spent the week keeping\nmouths SHUT and their negatives\
  \ are full of `open mouth`, `talking`, `lip sync`.\nThose words are deleted here because this man speaks\
  \ -- if the deletion also\nremoves something that was holding the face together, that is a finding about\n\
  the negative and not about the beat."
init_provenance: 'farm-out/ep2-b16-sapcomp-r2-0820/b16-sapcomp-s20260820.png, sha256 8f4e9ba3...bc71,
