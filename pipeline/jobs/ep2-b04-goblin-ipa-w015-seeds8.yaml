  artifact of having only looked at four. This is the load-bearing half of the
  goblin finding — the colour half is already measured — and it decides whether
  the sentence the founder eventually gets is "this gives you one goblin" or
  "this gives you the green back and the identity is still unreliable". It also
  decides whether the fourteen staged wave jobs are ever worth proposing.

