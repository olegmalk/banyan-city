# allow_fail on purpose, and doubly so here: out5 is written by
# ep2-b04-goblin-ipa-window4, which sits ahead of this job in the queue. If that
# job has not landed, the s0..s3 groups glob to nothing and the table is partial
# — which must not retire sixteen rendered frames.
- name: green
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\wave-goblin-prep\green_share.py
  - baseline-tags-only|C:\banyan-farm\wave-goblin-prep\out\04-the-footnote-wave1-s*.png|sq
  - w015-r0-seeds0to3|C:\banyan-farm\goblin-ipa-0810\out5\04-the-footnote-ipa-r0-w015-s*.png|sq
  - w015-r1-seeds0to3|C:\banyan-farm\goblin-ipa-0810\out5\04-the-footnote-ipa-r1-w015-s*.png|sq
  - w015-r2-seeds0to3|C:\banyan-farm\goblin-ipa-0810\out5\04-the-footnote-ipa-r2-w015-s*.png|sq
