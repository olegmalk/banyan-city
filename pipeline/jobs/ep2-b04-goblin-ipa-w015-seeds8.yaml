# 002b beat 04 — ARM 5 EXTENDED. The same 15% window on the same four
# references, drawn at four MORE seeds. Nothing else changes.
#
# THE VERDICT THIS ANSWERS TO. Roman, 2026-08-10 ~15:00: "the goblin needs abit
# more regeneration." Nothing here picks, ranks or promotes a frame, and nothing
# here decides what the goblin looks like.
#
# THE CLAIM THIS IS TESTING IS OUR OWN. a1dcd32 reports that at a 15% window the
# four seeds are still ONE creature where the tags-only baseline gives four
# species. That is the whole reason the window is interesting — the green came
# back at 0.335 against the baseline's 0.363 AND the identity held. But it rests
# on n=4, by eye, and four is small enough that "one creature" can be luck: four
# draws agreeing is not a rare event when the thing they agree on is a face at a
# fixed composition. Before anyone tells the founder that this mechanism gives
# him one goblin per beat, the claim should survive being handed twice the
# evidence that produced it.
#
# ONE VARIABLE, AND IT IS THE SEED INDEX. Window fixed at 15% of 40 steps,
# scale fixed at 0.6, all four references, prompt and negative byte-identical.
# Seeds s4..s7 on the wave-1 arithmetic (SEED + BEAT + i*1000), so they are the
# seeds a single run of eight would have drawn and they cannot collide with the
# s0..s3 already on disk. This is why goblin_ipa_sample.py grew --seeds and
# --seed-start rather than a second copy of the sampler: the defaults reproduce
# every earlier run byte for byte.
#
# WHY IT IS A CHEAP QUESTION WITH AN EXPENSIVE WRONG ANSWER. Sixteen frames,
# about eight minutes, no new recipe, no new tokens. The wrong answer — scaling
# a consistency mechanism across fifteen beats on an n=4 impression — is exactly
# the failure the ONE SAMPLE rule was written after.
#
# READ BY EYE, and the read is a COMPARISON: s0..s7 of one reference laid out
# together. If eight seeds are one creature, the finding is a finding. If the new
# four wander, the honest report is that the window holds colour and does not
# hold identity, and that is a materially different sentence to give him.
#
# THE IDENTITY METRIC IS DELIBERATELY NOT RUN. DINOv2 seed agreement failed twice
# on this beat (724b616: it could not tell one creature from four; 93356b1: it
# scored arm 2 as keeping the character while four different faces said
# otherwise). Running it here would produce a number for precisely the question
# it is known to get wrong. green_share IS run, because it answers only the
# colour question and its discrimination on this footage is recorded.
#
# CARRY THE KNOWN COST FORWARD: tusks return only partially at short windows
# (1-2 of 4 at w015 against 3 of 4 in the baseline). Eight seeds gives a better
# estimate of that rate than four; report it as a count out of eight per
# reference rather than as a pass or a fail.
#
# ZERO PROMPT TOKENS ADDED — the founder's "nothing complex" is untouched.
#
# LICENCES, nothing new: animagine-xl-3.1 (CreativeML Open RAIL++-M, D15 open),
# h94/IP-Adapter Plus SDXL (Apache-2.0), ViT-H image encoder (MIT-derived),
# diffusers 0.29.2 (Apache-2.0). All cached on the box. $0.

