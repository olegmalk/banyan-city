  - w015-r1-seeds4to7|C:\banyan-farm\goblin-ipa-0810\out7\04-the-footnote-ipa-r1-w015-s*.png|sq
  - w015-r2-seeds4to7|C:\banyan-farm\goblin-ipa-0810\out7\04-the-footnote-ipa-r2-w015-s*.png|sq
  - w015-r3-seeds4to7|C:\banyan-farm\goblin-ipa-0810\out7\04-the-footnote-ipa-r3-w015-s*.png|sq

- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b04-goblin-ipa-w015-seeds8"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/goblin-ipa-0810/out7/*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b04-goblin-ipa-w015-seeds8.sha256"), "w") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    # 16 stills + 16 sidecars.
    raise SystemExit(0 if len(src) == 32 else 1)

