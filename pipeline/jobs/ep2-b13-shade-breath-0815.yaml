#           the face loses its features to a blank pale dome.
#           window 5.2% | head 2.898 | body 3.661 | tail 0.898 | cadence 1.53x
#
#    ARM 4  ep2-b13-shade-cycle-0815 and its two replication seeds -- that state
#           tag plus a CYCLICAL clause with no end state, "He rocks slowly forward
#           and back." Run at three seeds because roughly one take in three fails
#           to perform its action.
#             s 20260806: window 8.3%  | body 1.201 | tail 0.758 | cadence 2.33x
#             s 20260815: window 17.7% | body 4.191 | tail 3.702 | cadence 1.06x
#             s 20260731: window 99%   | body 1.961 | tail None  | cadence 5.68x
#           IT DID NOT ROCK. On every seed the body reached a pose early and held
#           it; what kept changing was the SCALE OF THE WHOLE PICTURE, background
#           and grass and shadow included -- a smooth enlargement on 20260815, a
#           swell-and-shrink on 20260731. The cyclical instruction was answered by
#           the camera, in a render whose negative says "zoom, dolly, push in,
#           pull back". Its one clean gain, on all three seeds, is that THE FACE
#           STAYS READABLE TO FRAME 96 instead of being buried behind the knees by
#           frame 26 -- the terminal clause was what was destroying the face.
#
# 3. WHAT IS BEING TESTED HERE, AND WHY IT IS ONE VARIABLE.
#    Arm 4 proved a cyclical clause survives to the end of the clip and disproved
#    that the FIGURE is what performs it. The hypothesis now is that "rocks
#    forward and back" describes a translation of the whole subject, which is the
#    one thing an i2v model can satisfy by moving the frame instead -- and that
#    naming a SMALL PART OF THE BODY gives the cycle somewhere to live that the
#    camera cannot impersonate. Shoulders cannot be simulated by a zoom.
#
#      arm 4:  "... He rocks slowly forward and back."
#      arm 5:  "... His shoulders rise and fall as he breathes."
#
#    The leading state tag is carried over word for word. The recipe is closed and
#    untouched: 704x1280, 97 frames, 24fps, two-stage, distilled sigmas,
#    image-crf 33, guidance 2.0, sequential offload.
#
# 4. THE PREDICTION, WRITTEN BEFORE THE FRAMES ARE LOOKED AT.
#    If it is right, the shoulders sit differently at frame 90 than at frame 70
#    and the scale is quieter than arm 4's. IF THE SCALE DRIFTS AGAIN AND THE
#    SHOULDERS DO NOT MOVE, the cyclical clause is answered by the camera whatever
#    body part it names, and beat 13's duration is not reachable by action wording
#    -- a bigger finding than a win, reported as loudly. Third outcome, live: a
#    breathing shoulder on a figure this small may be below the resolution of the
#    line work and read as shimmer.
#
#    ONE RENDER. Its replication seeds do not go in until it has been looked at.
#
# 5. SCORING. OPEN THE FRAMES. Where are the shoulders at 0, 32, 64, 96; does the
#    BACKGROUND change scale; and is the face still readable at 96. Report window,
#    body, tail and cadence beside arms 1-4 above and beside a BLIND cold read.
#    The comparison is the result and a bare figure is not.
#
# 6. THE INIT, HELD CONSTANT AND ASSERTED RATHER THAN TRUSTED BY NAME.
#    13-the-shade-ipa-r0-w015-s0.png from ep2-b13-plate-0814, sha 1745a491db3c95c7...
