#           Onset at frame 0, bigger move, face gone by 26, dead 26-96.
#           window 5.2% | body 2.931 | tail 1.616 | cadence 1.39x
#
#    ARM 3  ep2-b13-shade-chain-0815, seed 20260806 -- that state tag plus three
