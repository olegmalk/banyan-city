    reported with the region-consistency check the beat-19 lane added: a shift that appears on a low-contrast
    band but not on a high-contrast one is the field re-inking, not a camera move, and filing a camera
    fault that does not exist is its own defect.'
  M5_THE_PLANT_DOES_NOT_CHANGE: no leaf appears, disappears, wilts or grows across the 121 frames. This
