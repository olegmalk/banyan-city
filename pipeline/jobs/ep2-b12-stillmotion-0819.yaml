  margin on a beat whose action is irreversible. Beat 12 is near-still, so a palindrome would be nearly
  invisible here -- which is worse, not better: it means nobody would catch it. Whoever assembles should
  check beat 12''s slot length against 5.0417 s rather than assume.'
