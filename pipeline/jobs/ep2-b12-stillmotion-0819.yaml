  M1_THE_PALETTE_HOLDS_ACROSS_THE_FIRST_SECOND: THE CLAUSE THIS RUNG EXISTS FOR. Mean hue and mean luminance
    of the whole frame at f000, f012 and f024, against the 704x1280 init the clip was conditioned on.
    PASS = the warm-to-cool swing the shipped take was shipped with is materially smaller here. Reported
    as numbers against the shipped clip measured the same way, so the comparison is on the same instrument.
  M2_NEAR_STILL_BUT_NOT_DEAD: 'The leaves hold position and shape; the grass stirs. MEASURED ON REGIONS,
    NOT ON THE FRAME, per the beat-19 lane''s finding that a whole-frame interframe floor is the wrong
    instrument on a near-still beat (a perfect 32px fall over a frozen background moves whole-frame interframe
    by 0.056 and would fail the floor). So: interframe median inside the leaf mask, and interframe median
    inside the grass band, reported separately. PASS = leaf band near zero AND grass band non-zero.'
  M3_NOBODY_ENTERS_FRAME: no goblin, no hand, no face, no figure at any edge in any of the 121 frames.
    His own line puts the scavenger OUT OF FRAME, crouched behind the leaves, so a figure arriving is
    a fail even if it is beautiful.
