failure_predicted_in_advance: 'FAIL-DEAD IS THE MOST LIKELY OUTCOME AND IT IS NAMED SO THAT A PASS MEANS
  SOMETHING. Beat 18 is the closest beat in the repo to this one by shot class -- a macro whose content
  is fine high-frequency movement -- and at crf 10 it went from an interframe median of 5.956 to 0.570
  and was scored FAIL-FROZEN. If that happens here the clip is a still image with a file extension, and
  ''perfectly still'' does not mean ''a still'': the line''s own ''only the grass stirs'' is what separates
  the two, which is why M2 measures the grass band separately rather than measuring the frame. If FAIL-DEAD
  fires, the lever is NOT another crf value -- it is this beat''s own prompt, which currently asks for
  stillness with the whole of its first sentence, and the shipped take''s crf-33 clip remains in the cut
  untouched meanwhile.'
pre_registered_fail_modes:
  FAIL-DEAD: no movement anywhere, grass included. Named as most likely.
  FAIL-PALETTE: 'the warm-to-cool shift survives at crf 10, i.e. the shipped fault is not the flag''s.
    A real and useful negative result: it would move the cause to the prompt or the plate.'
  FAIL-INTRUDER: a goblin, hand, face or figure enters frame. His line forbids it.
  FAIL-PLANT-CHANGE: a leaf appears, vanishes, wilts or grows.
  FAIL-CAMERA: a real, region-consistent camera move.
  FAIL-BLOOM: luminance climbs across the clip the way beat 01's crf-33 take did (85 -> 148.4). The flag
    is supposed to prevent this; if it arrives anyway the finding is about the flag, not the beat.
  reporting_rule: every mode above is reported BY NAME whether or not it fired, and the near-duplicate
    share is reported on the TRACKED REGIONS rather than the frame, per the beat-19 finding.
