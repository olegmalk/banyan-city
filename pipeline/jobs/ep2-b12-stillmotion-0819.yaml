  FAIL-PALETTE: DID NOT FIRE. The opposite happened -- see M1.
  FAIL-INTRUDER: FIRED. A bird, not a goblin, but the clause says any figure and it is the only mover.
  FAIL-PLANT-CHANGE: DID NOT FIRE.
  FAIL-CAMERA: NOT ESTABLISHED -- the instrument was invalidated by the fade, so nothing is filed.
  FAIL-BLOOM: DID NOT FIRE, and its mirror image did -- see the unpredicted mode below.
fail_mode_I_DID_NOT_PRE_REGISTER: 'DUSK COLLAPSE. Mean luminance walks 125.47 (f000) -> 125.33 (f024) -> 113.63
  (f060) -> 34.37 (f120): -91.1 levels, a 73% drop, over five seconds, with hue almost unmoved (58.56 -> 60.52
  deg). The pre-registered list had FAIL-BLOOM, a luminance CLIMB, because that is what beat 01''s crf-33
  take did (85 -> 148.4). I wrote the fail modes as a list of the ways brightness had already gone wrong rather
  than as the axis brightness moves on, and the sign flipped on me. It is recorded here rather than quietly
  folded into ''FAIL-BLOOM fired'' -- a fail mode found after the fact is not a fail mode predicted, and saying
  otherwise would make every future prediction cheaper than it looks.'
what_the_next_rung_should_be: 'NOT another crf value: crf 10 already delivered the thing it was asked for.
  The fade is progressive and roughly monotone -- it has lost only 12 levels by f060 and 91 by f120 -- so
  the honest next rung is the SAME recipe at a shorter frame count (49 or 73 frames), which may never reach
  the collapse, and would also cut the bird''s arrival. Second lever, independent of that: the beat''s own
  prompt still spends its whole first sentence asking for stillness and the render obliged completely. A route
  decision, filed as one, and no plate change is implied -- the plate held its palette perfectly.'
the_duplicate_run: 'THIS SPEC RAN TWICE TONIGHT AND BOTH RUNS WERE CLEAN: 1787134461 finished rc=0 at 10:20:48Z
  and 1787134971 rc=0 at 10:29:18Z, same seed 20260819, same settings, both publishing into the same farm-out
  directory, and bench-b12-stillmotion.jsonl carries both rows (265.5 s and 263.8 s of sample time). It was
  filed once by this lane and once by the lead at the tick. No provenance harm -- the seed is fixed and the
  second render is the same picture -- but it is about nine minutes of card time spent twice, and it is recorded
