bar:
  the_approved_line_this_is_staged_TO: 'Verbatim, and it is the first sentence of the motion prompt: "Tight
    on the sapling''s two leaves, perfectly still -- the scavenger crouched behind them, out of frame."
    Approved by the founder on 2026-08-19 (5d6eb792), one of five restaged beats whose STEWARDSHIP.md
    6 block came off the same day. beats.''12''.done_when, written 2026-08-15, is the other half: ''tight
    on the sapling''s TWO leaves against the sky; exactly two cotyledons and one bare side-branch, per
    the growth ladder; no bush, no crown; the goblin NOT in frame.'''
  M1_THE_PALETTE_HOLDS_ACROSS_THE_FIRST_SECOND: THE CLAUSE THIS RUNG EXISTS FOR. Mean hue and mean luminance
    of the whole frame at f000, f012 and f024, against the 704x1280 init the clip was conditioned on.
    PASS = the warm-to-cool swing the shipped take was shipped with is materially smaller here. Reported
    as numbers against the shipped clip measured the same way, so the comparison is on the same instrument.
  M2_NEAR_STILL_BUT_NOT_DEAD: 'The leaves hold position and shape; the grass stirs. MEASURED ON REGIONS,
    NOT ON THE FRAME, per the beat-19 lane''s finding that a whole-frame interframe floor is the wrong
    instrument on a near-still beat (a perfect 32px fall over a frozen background moves whole-frame interframe
    by 0.056 and would fail the floor). So: interframe median inside the leaf mask, and interframe median
    inside the grass band, reported separately. PASS = leaf band near zero AND grass band non-zero.'
  M3_NOBODY_ENTERS_FRAME: no goblin, no hand, no face, no figure at any edge in any of the 121 frames.
    His own line puts the scavenger OUT OF FRAME, crouched behind the leaves, so a figure arriving is
    a fail even if it is beautiful.
  M4_CAMERA_LOCKED: 'no pan, tilt, dolly or zoom. Measured as a global fit on a high-contrast edge, and
    reported with the region-consistency check the beat-19 lane added: a shift that appears on a low-contrast
    band but not on a high-contrast one is the field re-inking, not a camera move, and filing a camera
    fault that does not exist is its own defect.'
  M5_THE_PLANT_DOES_NOT_CHANGE: no leaf appears, disappears, wilts or grows across the 121 frames. This
    is the clause the b19 motion take failed hardest (two leaves -> four+, one fig -> two, upright stem
    -> runner, in 90 frames), and it is the clause a near-still beat is most likely to pass.
  THE_COUNT_IS_NOT_SCORED_AGAINST_THIS_TAKE: 'beats.''12''.done_when asks for EXACTLY TWO cotyledons and
    one bare side-branch. THE PLATE DOES NOT CARRY THAT and no i2v render can add it, because the init
    is frame one. Measured on the plate itself: four blade-sized components, major axes 619/772/607/591
    px, aspects 2.85/3.11/3.38 against composite-init-pattern.md 8''s pre-registered 1.6-2.6 band -- lance-shaped,
    and more than two. It is recorded here as a PLATE FAULT with a named route (the composite instrument
    that solved beats 15 and 19 tonight, which is a build and not a wording) and it is NOT charged to
    this take. Scoring it here would let a real colour result be buried under a fault the render could
    not have avoided.'
  how_scored: Every one of the 121 frames opened, not sampled -- the beat-07 lane's standard tonight.
    Numbers are FILTERS; the verdict is the read.
failure_predicted_in_advance: 'FAIL-DEAD IS THE MOST LIKELY OUTCOME AND IT IS NAMED SO THAT A PASS MEANS
  SOMETHING. Beat 18 is the closest beat in the repo to this one by shot class -- a macro whose content
  is fine high-frequency movement -- and at crf 10 it went from an interframe median of 5.956 to 0.570
  and was scored FAIL-FROZEN. If that happens here the clip is a still image with a file extension, and
  ''perfectly still'' does not mean ''a still'': the line''s own ''only the grass stirs'' is what separates
  the two, which is why M2 measures the grass band separately rather than measuring the frame. If FAIL-DEAD
  fires, the lever is NOT another crf value -- it is this beat''s own prompt, which currently asks for
  stillness with the whole of its first sentence, and the shipped take''s crf-33 clip remains in the cut
  untouched meanwhile.'
pre_registered_fail_modes:
  FAIL-DEAD: no movement anywhere, grass included. Named as most likely.
  FAIL-PALETTE: 'the warm-to-cool shift survives at crf 10, i.e. the shipped fault is not the flag''s.
    A real and useful negative result: it would move the cause to the prompt or the plate.'
  FAIL-INTRUDER: a goblin, hand, face or figure enters frame. His line forbids it.
  FAIL-PLANT-CHANGE: a leaf appears, vanishes, wilts or grows.
  FAIL-CAMERA: a real, region-consistent camera move.
  FAIL-BLOOM: luminance climbs across the clip the way beat 01's crf-33 take did (85 -> 148.4). The flag
    is supposed to prevent this; if it arrives anyway the finding is about the flag, not the beat.
  reporting_rule: every mode above is reported BY NAME whether or not it fired, and the near-duplicate
    share is reported on the TRACKED REGIONS rather than the frame, per the beat-19 finding.
