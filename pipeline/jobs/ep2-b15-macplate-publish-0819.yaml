payload:
  C:\banyan-farm\ep2-b15-macplate-publish-0819\fetch_plate.py: |-
    #!/usr/bin/env python3
    """Fetch the Mac-drawn beat-15 plates and REFUSE on any sha mismatch.

    No model, no GPU, no spend. Every sha256 below is the hash of a file
    committed to origin/main, so anyone who clones the repo can verify this
    script's assertions without running it.
    """
    import hashlib, os, sys, urllib.request

    OUT = r"C:\banyan-farm\ep2-b15-macplate-publish-0819-out"
    RAW = ("https://raw.githubusercontent.com/olegmalk/banyan-city/main/"
           "farm-out/ep2-b15-mac-plate-0819/")
    UA = {"User-Agent": "banyan-city-b15-plate/1.0 (albert.numbro@gmail.com)"}
    WANT = [
        ("15-good-listener-mac-plate-r1s1.png",
         "8a9bd14b00c45ff50d0996b75cb4023bfbf8022f393b9e62c31f89f20fbf4ebe"),
        ("15-good-listener-mac-plate-r1s1.yaml",
         "58a19d731f0c29744c0c905e607e665940ac1e47c4adb489b85dd22109ed5c87"),
        ("15-good-listener-mac-plate-r2s1.png",
         "b4b28ab54f0ca7dace0b50f302a101fd085cc2f4fcdbfc45f13bd92446d9a103"),
        ("15-good-listener-mac-plate-r2s1.yaml",
         "6a7c60e79fb212a3a1449a6ee16a6ee1ddc88c458ac22b7ae38d929f3b30bf57"),
    ]
    os.makedirs(OUT, exist_ok=True)
    for name, want in WANT:
        raw = urllib.request.urlopen(
            urllib.request.Request(RAW + name, headers=UA), timeout=120).read()
        have = hashlib.sha256(raw).hexdigest()
        if have != want:
            sys.exit("!! SHA MISMATCH for %s -- refusing.\n   want %s\n   have %s"
                     % (name, want, have))
        with open(os.path.join(OUT, name), "wb") as fh:
            fh.write(raw)
        print("fetched %-40s %7d bytes  sha %s  OK" % (name, len(raw), have),
              flush=True)
    print("every file matches its asserted sha256.", flush=True)
steps:
- name: fetch
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\ep2-b15-macplate-publish-0819\fetch_plate.py
- name: publish
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |-
    # EVERY FILE IS NAMED IN FULL, not matched by a glob -- both halves of that
    # are scars this repo has already paid for. A glob that misses publishes
    # nothing while returning a code that reads like a fetch failure, and
    # box_enqueue.output_path_problems refuses a spec whose declared artifacts
    # are never named by any step, which a wildcard defeats. Missing ONE file
    # is a FAIL of this job, not a partial success.
    import hashlib, os, shutil
    from_dir = "C:/banyan-farm/ep2-b15-macplate-publish-0819-out"
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b15-macplate-publish-0819"
    NAMES = [
        "15-good-listener-mac-plate-r1s1.png",
        "15-good-listener-mac-plate-r1s1.yaml",
        "15-good-listener-mac-plate-r2s1.png",
        "15-good-listener-mac-plate-r2s1.yaml",
    ]
    os.makedirs(dst, exist_ok=True)
    lines = []
    for name in NAMES:
        src = os.path.join(from_dir, name)
        if not os.path.isfile(src):
            raise SystemExit("!! missing %s -- publishing nothing." % name)
        shutil.copy2(src, dst)
        with open(os.path.join(dst, name), "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + name)
    with open(os.path.join(dst, "ep2-b15-macplate-publish-0819.sha256"),
              "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(NAMES), "file(s) + manifest ->", dst)
    raise SystemExit(0)
