  G1_THE_PLANT_STAYS_IN_THE_GROUND: THE CLAUSE THIS RUNG EXISTS FOR. At f000, f030, f060, f090 and f120
    the sapling's stem rises out of the grass and no hand is on it. Rung 1's exact failure -- a raised
    hand holding the leaf pair with the forearm where the stem was -- is a FAIL here however well the
