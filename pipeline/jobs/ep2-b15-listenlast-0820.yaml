the_one_variable: 'The action clause. `talks to them FROM A HAND''S WIDTH AWAY` becomes `his face is a
  few centimetres from the two leaves`, which says the same distance with NO BODY-PART NOUN IN IT, and
  the clause now places the last frame instead of describing a movement. The plant clause gains the two
  sentences the failure names: rooted in the ground in the last frame, and nobody picks it up.'
