  again, so rung 1 is a true control. NO change to the NEGATIVE, which is the point -- it already named
  `standing up` and `walking out of frame` and did not hold, and leaving it in place is what makes this
  a test of the positive. No pick, no plate_ack, no cut, no publication.'
pre_registered_fail_modes:
- F-DEGENERATE-STILL -- the last frame is held by holding every frame. The precedent's own cost; see G2.
  A FAIL, not a safe outcome.
- F-STANDS-UP-ANYWAY -- the placement does no better than the negative did, in which case the finding
