    five went unscored.
  G3_he_is_still_seated_in_the_last_frame: At f120 he is sitting in the grass, not standing and not out
    of frame. Rung 1 stood him up at f100 against a negative that named `standing up` in its first clause.
  G4_the_beat_still_reads: His head is tilted down toward the leaves and his mouth moves. If G1 and G3
    pass and G4 fails -- a seated, plant-respecting clip in which nothing happens -- that is the G2 cost
    below and the finding is about the placement shape, not about this beat.
  G2_the_pre_registered_cost: 'G2 THE PRE-REGISTERED COST OF THIS SHAPE, and it is named because the precedent
    paid it. ep2-b04-headlock-0820 moved one clause from an instruction into a placement and cut head
    travel 64.7 px -> 4.7 px, fourteenfold -- AND IT TOOK THE EYES WITH IT: eye-band interframe fell 0.356
    -> 0.126 and the gaze stopped travelling, which its own spec had pre-registered as a degenerate pass
    and reported as a FAIL. The same trade is the likeliest failure here. A clip that holds the last frame
    by holding EVERY frame is a FAIL of this rung, not a pass, and the finding would be that terminal
    placement buys position at the cost of performance -- after which the next rung places the MIDDLE
    of the shot as well as its end, rather than reaching for a flag.'
