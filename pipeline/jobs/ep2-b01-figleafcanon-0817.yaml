# half of the sapling canon, on the beat where the plant IS the shot.
# 2026-08-17, overnight queue lane. $0, sixteen stills, ~14 GPU-minutes.
#
# THE RULING THIS SERVES. The founder, 2026-08-16: "make sure it has 2 leafs and
# has a set height... dont make it double in size suddenly." Canon:
# genomes/sapling/THE-SAPLING.md.
#
# WHAT THIS DRAFT CORRECTS, and it is a straight inversion of four live drafts.
# `authored_b01_figleaf`, `_figleaf2`, `_figleaf3` and `_figlit` all ask
# POSITIVELY for `deeply lobed fig leaves with five fingers` and ban `no simple
# oval leaves`. That is the exact opposite of what he ruled: a two-leaf plant is a
# cotyledon-stage seedling, and lobed five-fingered leaves are mature-tree
# foliage. `authored_b01_figleaf_canon_0816` swaps the leaf clauses to `exactly
# two wide oval cotyledon leaves with soft round tips` and moves the old positive
# into the negative, and NOTHING ELSE MOVES: the fruit wording and the front-lit
# fix that `_figlit` bought (backlight, silhouette and contre-jour banned by name,
# after nine rounds were judged on silhouettes) are carried across byte-for-byte.
# So this job is close to a single-variable arm against `authored_b01_figlit`,
# which has been drawn -- the leaf clauses are the difference.
#
# IT HAS NEVER BEEN DRAWN. This lane listed the box's published output
# directories under C:\banyan-farm\courier-box\farm-out before filing; there is no
# beat-01 canon directory there. The box's queue-history file was deliberately NOT
# used to establish that -- it was caught on 2026-08-16 listing finished jobs as
# unrun and it caused twelve duplicate filings. Absence from farm-out proves
# nothing on its own (farm-out is pruned), so the second check was the repo: no
# spec in pipeline/jobs names this draft key.
#
# THE LEAF SHAPE INFERENCE IS THE STEWARD'S, NOT HIS, and this file says so
# because the frames will be read against it. He ruled the COUNT (two) and that
# the height must not double. `wide oval cotyledon leaves with soft round tips` is
# the steward's reading of what a two-leaf seedling looks like, recorded as
# vetoable in one line at THE-SAPLING.md 2.2. Nothing in this job depends on that
# inference being right; if he vetoes the shape, the count clause survives it.
#
# MEASURED BEFORE FILING, ON THE REAL CLIP TOKENIZER, ON THIS BOX:
#
#     positive tokens (real CLIP): 76/77   headroom: 1
#     STYLE ANCHOR PRESENT: True
#     drafts sha256: dd644905c2eb...  (byte-identical to the repo's HEAD copy)
#
# 76/77 IS ONE TOKEN OF HEADROOM AND THAT IS RECORDED AS A RISK, NOT HIDDEN. The
# draft fits, the style anchor survives compression, and the `--dry` step re-runs
# that measurement on the box before anything is drawn -- but this wording has no
# room for another clause, and whoever edits it next must re-measure or it will
# lose its style tail silently. That is the trap that refused
# ep2-b20-canonword-0816 twice: compress() drops whole TRAILING SENTENCES to fit
# 77 tokens and `very aesthetic` lives in the trailing sentence, so a draft can
# sit at 54/77 with 23 tokens of headroom and still have had its entire style tail
# deleted.
#
# NINE SIBLING DRAFTS FAIL THAT MEASUREMENT AND ARE NOT FILED: b01_scale,
# b01_canon, b02_scale, b02_plate_scale, b03_scale, b03_plate_scale, b17_scale,
# b17_plate_scale and b18_figleaf_canon all lose their style sentence to
# compress() and the guard refuses to draw them. The refusal is correct, is not
# waived, and is reported rather than worked around.
#
# HARNESS CHOICE IS DELIBERATE. `--harness C:\banyan-farm\wave-goblin-prep`, not
# `wave-scale-0816`. goblin_ipa_sample reads `wave-drafts.yaml` OUT OF THE HARNESS
# DIRECTORY, and both copies were hashed on the box before filing:
# wave-goblin-prep is dd644905c2eb (byte-identical to the repo's HEAD) while
# wave-scale-0816 is 0017402c4aa0, a stale copy predating the 2026-08-16 canon
# corrections. Filing against the stale harness would have drawn superseded words
# and reported them as the canon.
#
# GUARDS. $0, local card, no provider, no spend. No `gate:`, no `gate_ref:`, no
# `plate_ack:` waiver. There is no payload dir at all, so payload and out cannot
# collide. The publish glob carries the beat slug (`01-cold-open-`) and the publish
# step stamps every sidecar `approved: false` / `provisional: true` /
# `cost_usd: 0.00`.
# ---------------------------------------------------------------------------
