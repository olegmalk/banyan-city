failure_predicted_in_advance: 'THE SILHOUETTE WORDS COST MOTION. This beat''s whole content is one small
  growth and the shipped take already reaches 90% of it late (f108). A long shape clause competes for
  the same budget as the growth verb, and the plausible failure is a correctly-shaped fig that barely
  changes size. S3 is what catches it. SECOND: the ban list contains ''sphere'' and ''perfect circle''
  -- if the model reads those as a ban on roundness generally, the fruit can come back lumpy.'
next_rung_if_this_fails: THE COMPOSITE, not more words. pipeline/nub_composite.py draws the frame-1 nub
  as an ELLIPSE (--radii 10,13) and the 0.30 naturalise then shades whatever shape it finds. If the silhouette
  clause does not bind, the fix is a fig-shaped alpha in that tool -- broad at the bottom, necked at the
  top -- on the ep2-b01-compseed-s3-g5-0818 plate, which is the same structural-first pattern that had
  to be used for the fruit's COLOUR when the prompt route failed there. It is written here and NOT fired
  alongside this one, because two levers in one round cannot tell you which one worked.
the_one_variable: THE WORDING, and nothing else. Same init plate (b01-nubcomp-s20260826.png, sha 1b6d3492..),
  same 704x1280, same 121 frames at 24fps, same guidance 2.0, same distilled sigmas, same two-stage, same
