# 2026-08-16, THE MOTION LANE. THE TEST FIXTURES, PUBLISHED RATHER THAN WAIVED.
#
# box_enqueue.py refuses a motion job twice over when it cannot check the picture
# being animated: once because the --src is not fetchable from the results
# branch, and again because the job that produced it has no spec in
# pipeline/jobs. Both refusals are waivable with plate_ack: and NEITHER IS
# WAIVED HERE. This spec is the producing job the second guard looks for, and
# farm-out/motion-poscontrol-plates-0816 is what the first one reads.
#
# The two photographs are engine test fixtures for motion-poscontrol-0816, which
# asks whether LTX-2.3 distilled can move a body at all from a still under
# conditions rigged for it to succeed. Their bytes are the unmodified Commons
# originals, so the sha256s asserted in fetch_plates.py are the sha256s of the
# public files and are independently verifiable; the fetch step EXITS NONZERO on
# any mismatch instead of continuing with whatever it got.
#
# THEY ARE NOT SHOW CONTENT. Not canon, not style reference, never published as
# Sapling footage, never imitated. 001's photoreal Veo clips are archived v1
# evidence for the same reason and the same rule applies here.
id: motion-poscontrol-plates-0816
task: motion-poscontrol-plates-0816
runner: box
priority: 20
needs_gpu: false
max_attempts: 1
sample: true
owner: motion lane (can the engine act a body at all), 2026-08-16
consumer: The two init plates for motion-poscontrol-0816, published as farm-out artifacts so the enqueue guards can
  fetch and measure them like any other plate. box_enqueue refuses a motion job whose --src it cannot fetch, and separately
  refuses one whose producing job has no spec in pipeline/jobs -- this IS that spec, and no plate_ack waiver is used
  anywhere in this lane.
success: 'Two third-party still photographs on farm-out/motion-poscontrol-plates-0816, each byte-identical to the
  public Wikimedia Commons original (the fetch step REFUSES on any sha256 mismatch rather than continuing), with a
  SOURCES.md carrying file page, direct URL, author, licence, dimensions and sha256 for each, and a sha256 manifest.
  TEST FIXTURES, NOT SHOW CONTENT: never published as Sapling footage, never imitated as style, and the clips made
  from them are engine probes that can never be cut into an episode.'
why: 'motion-poscontrol-0816 asks whether LTX-2.3 distilled can move a body AT ALL from a still, under conditions
  chosen to make it succeed. That needs plates our own pipeline cannot make: photoreal (in-distribution for a video
  model, unlike anime line art), one clear subject, uncluttered ground, and an action that is the commonest motion
  in any video corpus. A runner already mid-stride with both feet off the ground is the easiest possible ask of an
  i2v model; a waterfall is the easiest ask that involves no body at all. $0, no GPU, seconds.'
est_minutes: 2
needs: []
