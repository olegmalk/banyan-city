  - "import glob, hashlib, os, shutil\ndst = \"C:/banyan-farm/courier-box/farm-out/motion-poscontrol-plates-0816\"\
    \nos.makedirs(dst, exist_ok=True)\nshutil.copy2(r\"C:\\banyan-farm\\motion-poscontrol-plates-0816\\\\SOURCES.md\"\
    , dst)\nsrc = sorted(glob.glob(\"C:/banyan-farm/motion-poscontrol-plates-0816-out/poscontrol-*-src.jpg\")) + [os.path.join(dst,\
