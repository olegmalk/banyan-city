    \ originals, so the\nsha256 asserted here is the sha256 of the public file and anyone can verify it\nagainst Wikimedia\
    \ directly.\n\"\"\"\nimport hashlib, os, sys, urllib.request\n\nOUT = r\"C:\\banyan-farm\\motion-poscontrol-plates-0816-out\"\
    \nUA = {\"User-Agent\": \"banyan-city-motion-test/1.0 (albert.numbro@gmail.com)\"}\nWANT = [\n    (\"poscontrol-runner-src.jpg\"\
    ,\n     \"https://upload.wikimedia.org/wikipedia/commons/9/9a/Woman_running_barefoot_on_beach.jpg\",\n     \"\
    ddcce4226969735fc273389b95fb698cb5341f6856f94ddb524363f03c6e06ac\"),\n    (\"poscontrol-waterfall-src.jpg\",\n\
    \     \"https://upload.wikimedia.org/wikipedia/commons/0/0c/Waterfall_in_Kerala.jpg\",\n     \"2461151104444cf1f8c48f0bb2e7a27b00f483ef051ad62a708b6a1ec0e614f3\"\
    ),\n]\nos.makedirs(OUT, exist_ok=True)\nfor name, url, want in WANT:\n    raw = urllib.request.urlopen(urllib.request.Request(url,\
