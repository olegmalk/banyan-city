# 2026-08-18, BEAT 14 MOTION LANE. THE PLATE, PUBLISHED RATHER THAN WAIVED.
#
# WHY THIS JOB EXISTS AT ALL, and it renders nothing. box_enqueue refuses a
# motion job twice over when it cannot check the picture being animated: once
# because the --src is not fetchable from origin/farm-results-rtx5090, and again
# because the job that produced it has no spec in pipeline/jobs. Both refusals
# are waivable with `plate_ack:` and NEITHER IS WAIVED HERE. A 2026-08-14 job
# that took that shortcut turned out to be cropping the WRONG BEAT'S PLATE.
# This spec is the producing job the second guard looks for, and
# farm-out/ep2-b14-mac-plate-0818 is what the first one reads. Same shape as
# ep2-b17-insert-plate-0816, deliberately, because that pair worked.
#
# WHAT THE PICTURE IS. One 832x1216 plate drawn $0 on macbook1 (Apple Silicon,
# MPS, animagine-xl-3.1, 40 steps, guidance 7.5, seed 20260814, 70.6 s) by
# `pipeline/plate_scratch.py --beat 14`. An adult green goblin in a red and
# dark patchwork scarf kneels low in grass, head bowed, both clawed hands
# together at his knees, the ground filling the bottom third of the frame.
#
# WHY THIS SEED AND NOT THE OTHER TWO. The 2026-08-18 board asked the founder
# one question about this beat -- ship r1s1, or re-stage the whole beat -- and
# the steward's ruling of 2026-08-18 is SHIP r1s1 AND HAND IT TO MOTION. The
# fault behind the question is a PALE LIMB-LIKE MASS, a flesh-coloured rounded
# shape at frame bottom-right that is not part of him and is not anything else
# either. It recurs at roughly 1 in 3 seeds on this beat: r1s2 has it, r1s1 and
# r1s3 do not. All three seeds are published here, not just the pick, so the
# fault is readable next to the frame that does not carry it and nobody has to
# take the pick on trust.
#
# MEASURED BEFORE FILING with box_enqueue's own functions, on the exact
# 704x1280 cover-crop the box will make: border_flatness 0.158 against the 0.62
# refuse line, border_colour_flatness 0.0001. Nowhere near a blank-paper card,
# so no `card:` ack is needed and none is used.
#
# WHY IT IS FETCHED OVER HTTP RATHER THAN COPIED. It was drawn on a Mac, so it
# is on origin/main, not on the box's courier worktree -- the courier only ever
# contains what the box itself produced. The Mac farm has no queue and nothing
# collects its output, which is why this plate sat unreadable on one laptop
# from 16:41 until it was pulled and committed for this job. The bytes are
# asserted by sha256 BEFORE anything is written and the fetch step EXITS
# NONZERO on any mismatch, so "the file moved between machines" cannot quietly
# become "the file changed".
#
# NO GPU, NO MODEL, NO SPEND, seconds. It does not compete for the card.
