payload:
  C:\banyan-farm\ep2-b14-mac-plate-0818\fetch_plate.py: |-
    #!/usr/bin/env python3
    """Fetch the Mac-drawn beat-14 plates and REFUSE on any sha mismatch.

    No model, no GPU, no spend. The bytes are the ones committed to origin/main
    in 5d872ac3, so every sha256 asserted here is verifiable against the repo by
    anyone who clones it.
    """
    import hashlib, os, sys, urllib.request

    OUT = r"C:\banyan-farm\ep2-b14-mac-plate-0818-out"
    RAW = "https://raw.githubusercontent.com/olegmalk/banyan-city/main/farm-out/ep2-b14-mac-plate-0818/"
    UA = {"User-Agent": "banyan-city-b14-motion/1.0 (albert.numbro@gmail.com)"}
    WANT = [
        ("14-the-defense-mac-plate-r1s1.png",
         "df877b7bec5ad56c65638f66e32b934df9910dc0024e210ec1f66a05db021bdc"),
        ("14-the-defense-mac-plate-r1s1.yaml",
         "d36f31c2c55ebb290facda625273fb77ce32acb38412ba0b37bbfcae944f1a55"),
        ("14-the-defense-mac-plate-r1s2.png",
         "0f5a771da0e201ffee6a80ef7e066ade108111b5107b3f6879fc508697cb1c8e"),
        ("14-the-defense-mac-plate-r1s2.yaml",
         "ea9b4146044454363172509facf72fc87555c8ddc9c6bbf4e2e9291dc24f0400"),
        ("14-the-defense-mac-plate-r1s3.png",
         "5f67ec0bcd58cc6c28d7505f4934c2951392f4b23b6c99db99c2d1dcc4b94ead"),
        ("14-the-defense-mac-plate-r1s3.yaml",
         "2dcf6fd624ef22350fbacfbda7d60d3971306ba463ff0f3255c2f6f6f2379ba6"),
    ]
    os.makedirs(OUT, exist_ok=True)
    for name, want in WANT:
        raw = urllib.request.urlopen(
            urllib.request.Request(RAW + name, headers=UA), timeout=120).read()
        have = hashlib.sha256(raw).hexdigest()
        if have != want:
            sys.exit("!! SHA MISMATCH for %s -- refusing.\n   want %s\n   have %s"
                     % (name, want, have))
        with open(os.path.join(OUT, name), "wb") as fh:
            fh.write(raw)
        print("fetched %-42s %7d bytes  sha %s  OK" % (name, len(raw), have), flush=True)
    print("every file matches its asserted sha256.", flush=True)
steps:
- name: fetch
