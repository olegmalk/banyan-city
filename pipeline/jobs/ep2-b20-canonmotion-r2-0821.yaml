success: 'ONE 704x1280 105-frame 24fps mp4 in which THE FRAME DOES NOT PULL BACK and the action completes
  inside the trim. R1 the goblin''s height at f104 is within a few percent of his height at f000 -- that
  is the whole hypothesis and it is measurable, not a matter of taste; R2 the sapling that is in the init
  is still there at f104 and has not been replaced by a large tree; R3 the action named in THE ACTION
  completes by f096, the last frame a 97-frame trim keeps; R4 face, ears, skin colour and clothes are
  the canon plate''s in every frame, with no dissolve and no new appendage. The named degenerate outcome
  is A STILL WITH A RUNTIME: an init that now contains everything the prompt names gives the model less
  reason to move at all, which is exactly how beat 20 failed in round 1. R3 is what catches it.'
why: 'BEAT 20 FAILED ROUND 1 PLATE-SIDE, AND THIS IS THE SAME RECIPE ON A PLATE THAT NOW HOLDS WHAT THE
  PROMPT NAMES.


  ROUND 1, IN ITS OWN VERDICT: he never looked up, the pose barely changed between f000 and f104 -- ''close
  to a still with a runtime'' -- a branch entered by itself at top right from ~f048, and the fig was yellow-green
  where canon has it purple.


  That is one of four identical failures. The other three beats in the wave -- 04, 08 and 13 -- asked
  only for motion their plates had a body for, and all three held the frame. So the generalisation the
  wave supports is that a prompt naming an object ABSENT from the init makes the model build it and pull
  the camera back hunting for it, and the lever is the init.


  WHAT CHANGED: the init, and one clause of wording that follows from it. The plate is the naturalised
  composite from ep2-b20-sapnat-0821, judged before this spec was written -- mean absolute delta inside
  the drawn region 10-14, outside it 0.02-0.06, centroid moved under 6 px, so the object is genuinely
  drawn and the goblin is genuinely untouched. The object moves out of THE ACTION and into the ''Subject
  already in frame'' inventory, because it now is. The identity clause is carried byte-for-byte from round
  1, which held the face for 105 frames on all seven beats.


  WHAT DID NOT CHANGE: size, frame count, fps, seed, guidance, sampler, sigmas, two-stage, crf, offload,
  the cover-crop sha assert and the trim plan. Round 1 already proved the recipe; it did not prove the
  plate.'
