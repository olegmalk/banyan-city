bar: "FOURTEEN PLATES, JUDGED AS ONE CONTACT SHEET, BY EYE AT 1:1. THERE IS NO\nPLANT AND NO FIGURE IN\
  \ ANY OF THESE PICTURES AND BOTH ABSENCES ARE CORRECT.\n  D1 CEL, NOT PHOTO, NOT PAINTING. Flat fills,\
  \ clean ink linework, the\n     episode's dialect. This is the clause the ep2-b16-field batch lost all\n\
  \     four on, and it is the first one read. Bokeh, painterly rendering or a\n     photographic ground\
  \ plane REJECTS the plate -- you cannot draw a sharp\n     cel seedling into a soft foreground without\
  \ it reading as a decal.\n  D2 A CLEAN DRAWABLE GROUND PLANE in the lower centre, wide and tall enough\n\
  \     to root a sapling at plate scale. Blades of grass crossing it are fine.\n     A rock, a flower,\
  \ a shrub, a drawn plant or any structure is NOT: the\n     0.30 pass PRESERVES a structure it finds\
  \ in the init (12 of 40 steps from\n     a latent that still carries it), so the composite would have\
  \ to fight it.\n  D3 ZERO FIGURES. Not a goblin, not a human, not an animal, not a silhouette\n    \
  \ on the horizon. A plate with any figure in it is REJECTED AND DELETED,\n     not cropped -- this lane\
  \ may not render the scavenger and a frame that\n     contains him is not curated into a training set.\n\
  \  D4 THE LIGHT HAS A DIRECTION. beat16_sapling_composite.py measures the\n     plate's own low-pass\
  \ luminance gradient and carries it into the drawn\n     plant. A flat, directionless plate makes that\
  \ measurement a no-op and\n     the composite reads as pasted.\n  D5 THE PALETTE IS THIS SHOW'S. The\
  \ composite samples its greens FROM THE\n     PLATE, so an off-palette plate produces an off-palette\
  \ sapling and the\n     frame teaches the LoRA the wrong colour.\nNOT SCORED: whether the picture is\
  \ a good shot. None of these is a shot, none\nenters a cut, and none goes near review/ep2-ship-0821.\
  \ They are ground planes\nfor an instrument.\nNOT SCORED: variety WITHIN a cell. The variety this batch\
  \ is bought for is\nBETWEEN cells and it is measured at the manifest, not here."
the_one_variable: THE SCENE-AND-LIGHTING CLAUSE ('beside a shallow creek, green banks, distant hills,
  early morning light'). Every value names something in the distance (round 2's lever) and keeps a green
  ground plane (D5, which is what dropped u05 from v1). `wide shot` with NO `low angle` is round 4's settled
  framing and is frozen; so are the quality prefix, `no humans`, the negative, the checkpoint, the size,
  the steps, the cfg, the staging steps, the nocontrol arm and its 0.45 scale.
this_cell: 'r06''s exact scene, which PASSED in round 2 and then never made it into v1 because step 2
  ran on the eleven plates and this was not one of them. Cheapest breadth in the batch: a known-good cell
  the dataset lacks.'
what_the_v1_manifest_says_it_is_missing: '26 frames, 11 distinct scenes, scale tiers l=7 m=8 s=6 xl=5,
  and leaf_count_values: 1 -- the manifest names two caps out loud. The leaf-count cap needs a tool that
  can draw three, five and six leaves and that tool does not exist, so it is NOT what this round attacks.
  The other cap is legible in the captions rather than in a field: the lighting values are flat daylight,
  sunset backlight, dawn mist, heavy overcast, alpine midday, forest dapple, even daylight, pale dawn,
  strong backlight, hard midday sun and bright daylight. All eleven are DAY. A subject LoRA whose every
  frame shares a time of day learns the time of day into the trigger, which is the same defect as the
  shared backdrop the plates file was written to kill.'
failure_predicted_in_advance: 'FIRST, AND IT IS THE ONE I EXPECT: THE DARK CELLS COME BACK GREEN-STARVED.
  v02 (night) and v03 (storm) are asking for a plate whose greens survive a blue or near-black key. u05
  already proved the consequence -- no green-dominant pixel in the lower half and beat16_sapling_composite
  REFUSES the plate -- so if these two fail they fail at step 2, not at the eye, and the dataset''s dark
  end has to come from v01/v12 (dusk, breaking cloud) instead of true night.

  SECOND: THE WATER CELLS PUT THE PLANE IN THE WRONG PLACE. v06, v07 and v11 all hand the frame a horizontal
  band of water; if it lands in the lower centre it has eaten the rootable strip and the cue that bought
  depth has cost the plane -- the same failure shape round 3 pre-registered for treelines. r06 passed
  in round 2 with banks in the near field, which is why the words say `green banks` first.

  THIRD: THE LIGHT IS NAMED AND NOT DRAWN. `golden hour`, `alpenglow` and `hazy heat` are painter''s words,
  not objects; this checkpoint may return the same clear-day plate for all three. That is a real result
  and it is scored as one -- the cells are cheap, and a lighting word that does nothing is worth knowing
  before v2 curation counts on it.'
clip77_measured_not_estimated: prompt 30 of 77, counted offline on animagine's own vocab before this file
  was written; negative inherited from the round-4 control at 71 of 77. Ten specs died rc=9 on box_preflight's
  clip77 guard on 2026-08-21 with the card idle, which is why this is a hard refusal in the deriver and
  not a check at the queue.
