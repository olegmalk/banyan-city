consumer: 'V2 CURATION of the sapling LoRA dataset. v1 is pipeline/lora/manifest-sapling.yaml -- 26 frames,
  11 scenes, and by its own gate (pipeline/lora/README.md: variety, not count) it is capped on lighting:
  all eleven plates are DAYLIT. These plates are the missing half of that axis, and what eats them is
  step 2 (beat16_sapling_composite.py, which draws a vertical stem at a measured root point and samples
  its greens from the plate) and then step 3 (the 0.30 inpaint, pipeline/derive_sapling_lora_naturalize_0821.py).
  NOTHING here is a shot: no cut, no beat, no promotion, and DECISIONS.md item 18 (''never train on the
  output'') is still open and is not touched by building the set the question is about.'
success: 'One 832x1216 png at seed 20260957, cel dialect, of beside a shallow creek, green banks, distant
  hills, early morning light at ''wide shot'': STRAIGHT horizon, clean drawable ground plane in the lower
  centre, no plant, no figure, AND a green-dominant region in the lower half for the composite to sample
  its palette from. The lighting must be READABLE as the named one -- a cell that comes back as generic
  daylight has failed even with a perfect plane, because the light is the only thing this round is buying.
  Judged by eye at 1:1 against the v1 contact sheet, not against its own siblings.'
why: 'r06''s exact scene, which PASSED in round 2 and then never made it into v1 because step 2 ran on
  the eleven plates and this was not one of them. Cheapest breadth in the batch: a known-good cell the
  dataset lacks.


  THE RECIPE IS NOT UNDER TEST HERE. Rounds 1-4 settled it: a ground-cover noun alone returns a macro
  of itself (round 1); a named DISTANT feature and not the framing word is what buys depth (round 2, proved
  by deleting four words from the only passing cell); the cue generalises across scenes (round 3); `low
  angle` was cargo and was drawing the fisheye (round 4, 8 of 8 after dropping it). This round spends
  that recipe on the axis v1''s own manifest is thinnest on -- every one of its eleven plates is lit by
  DAY.'
