success: 'TWO SCORES, KEPT SEPARATE, AND THE PICTURE OUTRANKS THE NUMBER. (A) THE MEASUREMENT: mean absolute
  interframe difference at 176x320 over all 104 pairs, reported as the share under 0.5 and as each ten-frame
  block''s mean. A pass is a clear fall in the share against this beat''s own parent AND no single block
  carrying the clip. (B) THE PERFORMANCE, by eye: the counted move must read as that move, done twice.
  A figure that vibrates through the runtime scores well on (A) and is a FAIL -- interframe difference
  is not motion, it is change, and this is the failure mode the b17 sample was checked against before
  it was called a pass. CARRIED FROM THE PARENT BAR: the CORRECTED face -- small off-white almond eyes
  with tiny dark pupils, broad dome, near-horizontal ears, sage mandarin collar -- drawn in EVERY frame
  including the LAST, not only the first. PER BEAT: b03 must not topple and must not name or grow an object
  the plate does not have; b13 must still reach the folded-small end state with the knees up and HE MUST
  NOT RISE, which is the founder''s ruling and outranks any improvement in the numbers. PRE-REGISTERED
  FAIL MODES: the null, in which the share does not move and the b17 result was beat-specific rather than
  general -- publishable, and it closes the rung rather than sending anyone to a third wording; a jitter
  passing (A) and failing (B); the two repeats collapsing into one long slow move, which is what b17 itself
  did and which would still be a partial pass if the runtime is filled; and on b13, a repeat that makes
  him bob back UP, which breaks the ruling and is an outright DROP however well it moves.'
why: 'BEAT 13''s CURL TAKE OBEYED ITS OWN SENTENCE AND THAT IS THE PROBLEM. Its action reads ''settle,
  sink, still'' and the clip moves for 58 frames and is then still for 40 -- block means 4.01 1.18 0.07
  0.15 0.11 0.03 across the tail. The word ''still'' is the best-evidenced cause of a frozen tail in this
  entire wave and it is out; the selftest refuses it. THE FOUNDER''S POSE RULING IS CARRIED WORD FOR WORD
  -- he curls down small and HE NEVER RISES -- because that is R4''s and not this rung''s. Only the timing
  changes. ep2-b17-repeat-0822, rendered and judged 2026-08-22, is the sample this rung rests on: 52 of
  104 frame pairs under 0.5 against its one-shot parent''s 89, block means 1.49 1.35 1.90 1.80 1.75 1.53
  0.76 0.22 3.56 3.69 4.03 against 0.29 0.07 0.14 0.37 0.23 0.20 0.22 0.24 5.44 4.89 6.28, and a brush
  that reads as a brush rather than a jitter. The COUNT carried it; the ''unbroken over the whole clip''
  half of that edit moved nothing.'
