# EPISODE 2, BEAT 01 — THE LEAF COUNT, BY MASK INSTEAD OF BY WORDS. One round,
# four seeds, $0, 2026-08-11.
#
# HIS VERDICT, VERBATIM (~16:15 today, on the whole beat-01 picking sheet):
# "none of them have figs and all of them have too many leafs". Two faults and
# both are COUNTS. This job attacks the second one; the first is already solved
# and the record below says how.
#
# WHY THIS IS NOT THE PROMPT ROUND THE BRIEF ASKED FOR, AND THE REPO SAID SO
# FIRST. The obvious move is a fifth wording that states TWO LEAVES and ONE FIG
# affirmatively and counts them. shots.md's beat-01 section rules that out in its
# own words, written 2026-08-06 after four such wordings were drawn and measured:
#   | `a single pair of oversized leaves`      | rounds 1-2 | 4-6 leaves, 8 of 8 |
#   | `exactly two oversized cotyledon leaves` | round 3    | 4-6 leaves, 4 of 4 |
#   | `sprout with only two oversized leaves`  | round 4    | 3 at best, 1 of 4, and 3 of 4 lost the composition |
# followed by: "Do not spend a fifth round on synonyms for 'two': treat the
# two-leaf character as something this model will not draw on request... The
# levers that are left are all outside the prompt." Rounds 5 through 9 then spent
# img2img, a control arm and a three-arm depth-ControlNet sweep on it and the
# count never came down. A fifth wording is the one experiment this beat has
# already run four times.
#
# THE FIG IS ALREADY SOLVED AND WAS NEVER APPLIED. `review/b01-fig-inpaint/
# b01-fig-inpaint-s1.png` (2026-08-10, `approved: false`, one sample on HIS OWN
# word `inpaint`) carries one small round green fruit on the stem, legible, in
# the right place — the thing four prompt rounds could not produce in 0 of 12
# frames. It has never been used as anything but that sample: no leaf, no
# `stills/` sidecar, no later round takes it as an init. The mechanism is what
# worked: a mask FORCES a location, so the model never has to be asked for a
# count or a placement it will not honour.
#
# SO THIS ROUND ASKS THE SAME MECHANISM FOR THE SAME KIND OF WIN, AND ASKS THE
# MODEL TO COUNT NOTHING. The founder-approved plate has THREE leaves — measured,
# not eyeballed: bright-edge blobs at x[445,496] y[658,672] (the right blade),
# x[299,366] y[708,726] (the left blade) and a fainter run from (365,628) to
# (395,656) (the upper-middle blade), found by thresholding luminance at the 99th
# percentile inside the plant region of the 832x1216 plate. The script wants two.
# One ellipse over the UPPER-MIDDLE blade, filled with the blurred tall grass
# that surrounds it, leaves a two-blade sprout — and the count then comes from
# geometry, not from a counting word. The left and right blades are an opposed
# pair and read as the script's two leaves; that pairing is the one aesthetic
# judgement in this job and it is the steward's, named as such below.
#
# THE MASK GEOMETRY IS THE STEWARD'S AND IS THE FIRST THING HIS CORRECTION SHOULD
# MOVE — the same sentence the fig inpaint's own sidecar carries, for the same
# reason: he approved a METHOD ("inpaint") and named no size, no position and no
# leaf. `378,655,48,54` was chosen to clear both blades it must not touch: at
# y=665 the ellipse spans x[332,424] and the right blade starts at x=445 (22px
# clear); its bottom edge stops at y=707 and the left blade's bright edge begins
# at y=708. If a blade tip survives at the upper-left it is a geometry miss, not
# a method failure, and the fix is one number.
#
# FOUR SEEDS, ONE VARIABLE. Same init, same ellipse, same strength, steps,
# guidance, padding and blur as the fig inpaint that worked; only the seed moves.
# The question this answers is whether the fill is reliable or lucky. `blurry` is
# deliberately ABSENT from the negative — this fill is supposed to be soft blurred
# grass, and the fig negative's `blurry` would fight the thing being asked for.
#
# WHAT THIS ROUND DOES NOT SETTLE, STATED SO THE RESULT CANNOT BE OVERSOLD. The
# only G1-legal init for beat 01 is 001's `15-something-s-coming.png` — a DUSK
# close-up in tall grass with a light shaft, because it is the sole
# founder-approved sapling-in-grass frame in the tree. Beat 01's script is a
# SUNRISE field with the whole 40cm plant in frame. Even a perfect two-leaf,
# one-fig result here is a fixed dusk plate, not the cold open as written, and
# whether that is acceptable is R4's call and nobody else's. That question goes
# to him with these four frames; it is not assumed by this job.

