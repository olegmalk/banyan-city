consumer: motion-wave, which re-animates this beat off the plate.
success: Sixteen frames, and the strip must be read along the SEED axis, not the reference axis. Cold
  read again with no context. Pass is a majority calling it a FIG rather than an eggplant or plum, with
  the star-shaped eye visible at the base and a matte surface. The lobed leaf is the variable most likely
  to carry it; if the leaf lands and the fruit still reads as an aubergine, the fruit is not the problem
  and the leaf should simply be in every fig shot from here.
why: 'THE COLD READ CALLED IT AN EGGPLANT, fairly confident, second guess a dark plum. Four faults named
  and all four fixed in this round: no ostiole (the most diagnostic fig feature, still missing after the
  purple ruling, five wording fixes and a reference - now named at the base in words AND given a reference
  crop tight on the base), too dark (near-black is the aubergine tell; pulled back to purple with a green
  shoulder, which is what the 1839 plate actually shows), too glossy (the dusty bloom came back as speculars;
  gloss banned by name, bloom described as dust), and a green stripe artifact the reader flagged unprompted,
  now banned. PLUS THE LEVER THE READ FOUND BY ACCIDENT: a FIG LEAF in frame. It is deeply lobed and instantly
  identifying, where nothing done to the fruit itself has worked in seven rounds - a fig beside a fig
  leaf is a fig, the same fruit alone is an aubergine. Never tried, costs four tokens. AND THE REFERENCE
  SET IS FIXED: the previous one was the SAME CROP SAVED FOUR TIMES, so the reference axis was degenerate
  - identical refs at one seed produce identical frames, which is why the reader correctly reported four
  pixel-identical images. My bug, twice: I staged duplicates and then sampled that axis for the strip.
  Four distinct crops now, one of them tight on the base.'
