bar: 'THE FACE GATE, and f4 is the incumbent to beat.

  T1 blank eyes -- f4 PASSES (no pupils) and must keep passing.

  T1b EYE SHAPE, NEW AND THE POINT OF THIS RUNG: narrow, upward-slanting slits, not round white ovals.
  NOTHING has scored this.

  T2 no human nose -- f4''s only outright miss, one small drawn tip. g1 put `nose` in the NEGATIVE and
  it did not move, so this rung does not expect to fix it and does not try.

  T3 no age modelling. T8 4.5+ heads -- f4 measured 5.67.

  PRESENCES: P1 brow bar (nothing has scored it), P2 muzzle, P3 mouth, P4 shading -- f4 has P3 and P4.

  PASS is T1 + T1b + T3 + T8 with P3 and P4 held. T2 is explicitly NOT required here: a nose tip on an
  otherwise tile-faithful face is a smaller defect than round mascot eyes, and that is a defect-rate call
  this lane is making out loud rather than burying.'
failure_predicted_in_advance: 'h1 FIXES THE EYES AND CHANGES NOTHING ELSE, on the evidence that `blank
  eyes` composed cleanly with this wording while `no nose` destroyed it -- the eye tags describe a SHAPE
  and the nose tag demands an ABSENCE, and only the second one has ever collapsed a face here.

  h2 IS THE RISK: `expressionless` is the closest of the four to a subtractive tag, and if the face flattens
  between h1 and h2 that is the boundary of the mixed dialect drawn exactly, which is worth the rung even
  though I expect h1 to be the keeper.

  IF BOTH FLATTEN, the mixed dialect is a two-tag affordance and no more, and the face route is IP-Adapter
  off the tile -- an ATTRIBUTE instrument for an attribute problem, which is what Sec 11 measured it to
  be.'
one_sample_rule: Two rungs, one variable each, filed to BACKLOG. This lane has judged five batches tonight
  and is handing the face gate on with a named lever rather than firing a sixth it will not be awake to
  read.
