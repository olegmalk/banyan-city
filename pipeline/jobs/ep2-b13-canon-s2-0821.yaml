why: 'BEAT 13 OF THE CANON PATCH WAVE, ROUND s2.


  THE SHADE -- ''The scavenger''s legs give out and he drops to sit in the grass at the base of the stem,
  then tips his head sideways into the sapling''s hand-sized patch of shade''. Line: ''...Thanks for the
  shade.'' EXHAUSTED, and the first moment he is not being chased.


  THE RECIPE CHANGED WHOLESALE AT 16:54 TODAY. The founder supplied a picture -- taste/refs/goblin-canon-founder-0821.png,
  commit b93a70da -- with "dude, this is how the goblin should look", and it contradicts tile B on the
  ears, the eyes, the proportion, the skin and the clothes. Every frame rendered before it is the wrong
  character. They are kept as evidence, not deleted.


  WHAT MOVED, all of it measured and all of it in canon.yaml `founder_ruling_2026_08_21`: head_frac 0.190
  -> 0.370 (2.71 heads); the IP-Adapter reference re-cropped off the founder''s image on a square canvas;
  `blank eyes` struck and `slit pupils` in its place; `pointy ears` moved from the NEGATIVE to the POSITIVE;
  the patchwork cloak replaced by the drawn costume; the head mask re-derived from the skeleton because
  k6a''s box would sit inside this head''s forehead.'
