bar: "THE CANON BAR. Read at 1:1 against taste/refs/goblin-canon-founder-0821.png\n-- THE FOUNDER'S OWN\
  \ IMAGE -- and against nothing else. Tile B\n(adult-b19-0819.jpg) is SUPERSEDED and is no longer the\
  \ thing to match; a frame\nthat looks like the tile now FAILS.\n\n  IDENTITY -- five clauses, and three\
  \ of them invert a bar that stood this\n  morning. Every number is measured off the founder's image.\n\
  \  F1  EARS: LARGE, LATERAL, POINTED, projecting clear of the skull on both\n      sides and dominating\
  \ the silhouette. Measured target: ear span about 1.5x\n      the skull width. SHORT LOW FLANGES NOW\
  \ FAIL -- that was the tile's ear and\n      it is struck. So does a bare skull with no ear read at\
  \ all.\n  F2  EYES: a large open almond with an off-white sclera AND A VISIBLE PUPIL --\n      small,\
  \ dark, a narrow VERTICAL slit. BLANK PUPIL-LESS EYES NOW FAIL. A\n      round black anime pupil filling\
  \ the eye also fails; the target is ~10% of\n      the eye's width.\n  F3  BALD, smooth unbroken dome,\
  \ no hair, no hairline, no horns, no cowl.\n  F4  SKIN: a muted desaturated grey-olive over the whole\
  \ body, one tone. A\n      saturated kelly green fails. A human complexion fails. Measured #7C806D.\n\
  \  F5  NO AGE MODELLING: no brow furrows, no nasolabial folds, no jowls, no\n      cheekbone shadow.\
  \ The face is smooth. He is not an adult man.\n\n  PROPORTION\n  P1  ABOUT 2.7 HEADS TALL, head roughly\
  \ 37% of the standing figure. This is the\n      founder's own drawing and it is deliberately large-headed.\
  \ A 5-heads\n      figure fails; so does a head so large the body cannot act.\n  P2  NOT A MASCOT. Round-bellied,\
  \ squat, or super-deformed still fails -- the\n      killed chibi design is still killed. Large head,\
  \ ordinary child body.\n\n  COSTUME -- new today, and the cloak is dead.\n  W1  MANDARIN / BAND COLLAR\
  \ SHIRT in muted sage, dark shorts above the knee,\n      bare shins, dark ankle boots.\n  W2  NO CLOAK,\
  \ NO HOOD, NO COWL, NO PATCHES, NO STITCH LINES. A patchwork\n      cloak is the single most likely\
  \ regression: it was in the frozen positive\n      until today and it is still in four script lines.\n\
  \n  THE BEAT\n  B1  THE POSE IS THE ONE ASKED FOR.\n  B2  THE WORLD IS PRESENT AT FRAME ONE -- this\
  \ beat's own location, in focus\n      enough to read. An empty studio background fails.\n  B3  THE\
  \ BEAT'S EMOTION IS LEGIBLE WITH THE CAPTION COVERED, judged against\n      the stage direction recorded\
  \ in this spec.\n\n  PALETTE\n  L1  MUTED, HIGH-KEY, LOW SATURATION, soft ink linework. The founder's\
  \ image\n      is watercolour-adjacent and its background is genuinely out of focus.\n\nA frame failing\
  \ ANY of F1-F5, P1-P2 or W2 is REJECTED and is not a candidate.\nNear-misses are what made the 31-frame\
  \ LoRA set untrainable."
