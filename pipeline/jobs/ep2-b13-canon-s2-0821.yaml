one_sample_rule: 'ONE FRAME, AND IT IS BEAT 13, for the two reasons the age-B wave spent its sample there:
  it is the frame the founder pointed at when he said the goblin reads as an adult, and it was the best
  pass of the adult wave''s round one, so a break here is attributable to the new recipe and not to a
  marginal beat. NOTHING SCALES OFF IT UNTIL IT IS JUDGED BY EYE AT 1:1.'
post_ship_patch: review/ep2-ship-0821 IS NOT TOUCHED BY THIS JOB. A plate here is a candidate; a candidate
  becomes a pick, a pick becomes a motion spec, and only a passing motion take is swapped -- four judgements,
  none of them this job's.
round_2_lever: "NAMED BEFORE THE RENDER so round two is a decision and not a brainstorm, in the order\
  \ they will be reached for:\n  1. SKIN GOES HUMAN -> put `pale skin, grey skin` back in the negative.\
  \ They were struck today and it is the weakest of the strikes.\n  2. PUPIL COMES BACK TOO LARGE -> add\
  \ `constricted pupils` to the positive. It was drafted in and cut by the CLIP-77 budget; there are 3\
  \ spare tokens.\n  3. FIGURE COMES BACK TOO TALL -> drop `child, chibi` from the negative. They are\
  \ kept under protest and are in tension with a 2.71-head brief.\n  4. EARS COME BACK SMALL -> raise\
  \ IP_SCALE from 0.7, or rebuild the reference at head-frac 0.25 (already on disk, sha in the module).\
  \ The ear is geometry the adapter carries, not a word.\nOne at a time, in that order, and each is one\
  \ spec."
stage_direction: 'THE SHADE -- ''The scavenger''s legs give out and he drops to sit in the grass at the
  base of the stem, then tips his head sideways into the sapling''s hand-sized patch of shade''. Line:
  ''...Thanks for the shade.'' EXHAUSTED, and the first moment he is not being chased.'
supersedes: ep2-b13-ageb-{p1,r2}-0821 on the DESIGN axis. Those frames are the wrong character as of 16:54
