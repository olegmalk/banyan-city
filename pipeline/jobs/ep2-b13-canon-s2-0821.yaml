ip_adapter:
  ruling: 'FOUNDER RULING, 2026-08-21 16:54, and it is an IMAGE, not a sentence: taste/refs/goblin-canon-founder-0821.png,
    committed b93a70da, with "dude, this is how the goblin should look". It supersedes tile B and the
    08-21 age-B recipe on every axis it shows. See canon.yaml `ep2-goblin-design-adult` -> `founder_ruling_2026_08_21`
    and pipeline/jerry_canon_0821.py.'
  ref: farm-out/jerry-canon-assets-0821/jerry-canon-sq22-0821.png
  ref_sha256: bb10bbb269f07849365693a2f277c05624f6cc0fbe4f4dffe8adbe9fb205416e
  ref_provenance: 'goblin-canon-founder-0821.png cropped (187,110)-(677,483) -- the measured head box
    plus 18 px, WIDE because the ears project 27% of a skull width on each side -- background flood-filled
    with the image''s own field median (187,195,149), pasted CENTRED at 22% head-of-frame on a 448x448
    SQUARE canvas. Square is load-bearing: diffusers builds CLIPImageProcessor() with no arguments, which
    resizes the SHORT edge to 224 and CENTRE CROPS to a square, so only on a square canvas is the authored
    head ratio the ratio the encoder receives. Encoder coverage here is 6.7% and the subject touches no
    encoder edge (asserted by the builder, which returns 1 if it does). Rebuild with `pipeline/author_jerry_canonref_0821.py
    --head-frac 0.22`; assert with `--check bb10bbb269f07849365693a2f277c05624f6cc0fbe4f4dffe8adbe9fb205416e`.'
  mask: 0,0,832,655
  mask_frame: RENDER pixels, 832x1216
  mask_rule: DERIVED FROM THE SKELETON, not scaled from k6a's box. k6a's 315,130,515,350 was authored
    around a head_frac 0.190 skull whose ears 'barely break the silhouette'. At head_frac 0.370 the head
    alone is 360 px tall and the ears reach 449/300 of a skull width, so that box would sit inside the
    forehead and the adapter would never touch the loudest thing in the new design. This box is the crown-to-chin
    span at this pose, widened by the MEASURED ear-span ratio 449/300 and 20 px of margin. Derived by
    pipeline/jerry_canon_0821.head_box('sit').
  scale: '0.7'
  weights: h94/IP-Adapter sdxl_models/ip-adapter-plus-face_sdxl_vit-h.safetensors, apache-2.0, sha256
    677ad8860204f7d0bfba12d29e6c31ded9beefdf3e4bbd102518357d31a292c1, 847517512 bytes. THE GENERAL ADAPTER
    ip-adapter-plus_sdxl_vit-h.safetensors IS THE SAME NUMBER OF BYTES, so only the digest separates them;
    controlnet_plate.py carries an allowlist keyed by name and carrying the digest.
  skeleton: farm-out/jerry-canon-assets-0821/jerry-canon-h37fsit-0821.png
  skeleton_sha256: 3db75427b2696b3beafd3c665281bfcfaa84ae03d7e35d51ee1257abbcd77b0e
