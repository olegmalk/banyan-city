  controlnet: xinsir/controlnet-openpose-sdxl-1.0 at scale 1.0
  proportion_ruling: 'head_frac 0.370 = 2.71 heads, MEASURED off the founder''s image (head 337 px, figure
    912 px). The tile measured 5.2 and the frozen standard holds 0.190. Recorded caveat: the image''s
    camera is ABOVE the subject, which foreshortens the legs more than the head, so 2.71 is the ratio
    at THAT camera and a level-camera full body will measure taller. Proportion is carried here by GEOMETRY
