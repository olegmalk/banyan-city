  - "# Required by box_enqueue.courier_problems: the courier pushes from\n# farm-out and from nowhere\
    \ else, and ep2-cnet-probe-0817 rendered\n# perfectly and was invisible for two days for want of exactly\
    \ this step.\nimport glob, hashlib, os, shutil\nout_dir = \"C:/banyan-farm/jerryskel-n3-0820/out\"\
    \npay_dir = \"C:/banyan-farm/jerryskel-n3-0820\"\nctl_dir = \"C:/banyan-farm/jerryskel-n3-0820/src/pipeline/control\"\
    \ndst = \"C:/banyan-farm/courier-box/farm-out/ep2-jerry-skel-n3-0820\"\nos.makedirs(dst, exist_ok=True)\n\
    # The HINT travels with the frame: it is the frame's condition, and a\n# reader scoring whether the\
    \ net read it needs to see it at the same\n# pixel columns.\nfiles = sorted(glob.glob(out_dir + \"\
    /ep2-jerry-skel-n3-0820-posehint.png*\")\n               + glob.glob(pay_dir + \"/prompt.txt\")\n\
    \               + glob.glob(pay_dir + \"/negative.txt\")\n               + glob.glob(ctl_dir + \"\
    /jerry-skel-h19-0820.png\"))\nlines = []\nfor f in files:\n    shutil.copy2(f, dst)\n    c = os.path.join(dst,\
    \ os.path.basename(f))\n    with open(c, \"rb\") as fh:\n        h = hashlib.sha256(fh.read()).hexdigest()\n\
    \    lines.append(h + \"  \" + os.path.basename(f))\nwith open(os.path.join(dst, \"ep2-jerry-skel-n3-0820.sha256\"\
    ), \"w\",\n          newline=\"\\n\") as fh:\n    fh.write(\"\\n\".join(sorted(lines)) + \"\\n\")\n\
    print(\"published\", len(files), \"file(s) + manifest ->\", dst)\nraise SystemExit(0 if len(files)\
