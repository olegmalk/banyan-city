owner: beat-16 restage lane, 2026-08-20 night
consumer: BEAT 16'S SLATE IN THE EPISODE 2 CUT -- one of the last two empty slots, and the beat with no
  footage candidate of any kind. Three wordings, one big-leaf composite and a four-plate field batch have
  all failed it. This is the first init the beat has ever had that puts the canon sapling in front of
  a seated figure in the episode's own dialect. If it comes out, the next step is ONE i2v motion sample
  off it and beat 16 has a candidate; if it does not, the finding is about the composite route's ceiling
  and not about beat 16.
success: 'One 832x1216 png in which THE SAPLING IS THE SUBJECT AND THE SCAVENGER IS DEPTH BEHIND IT, judged
  by eye at 1:1 and not by a metric. S1 the eye lands on the plant, not on him; S2 exactly two leaves
  on one stem (canon sapling-two-leaves); S3 they are AVERAGE leaves -- ordinary, no lobes, no lance,
  no exaggerated silhouette (canon sapling-cotyledon-shape); S4 the pass has actually DRAWN them -- line
  weight and cel shading in the plate''s dialect, not the flat shapes it was handed; S5 ONE plant in frame,
  the erased weed does not come back; S6 he survives unchanged, seated and single. The named degenerate
  outcome is the big-leaf one: two pictures that are the same picture. That is a FAIL and it has a number
  -- detail inside the region fell 10.45 to 9.41 when it happened.'
why: $0, ~5 minutes, one seed, and it is the only unspent route on a beat that has failed at everything
  else. The recipe is untouched from a family that has now worked four times (b19/b15/b03/b13); THE ONE
  VARIABLE IS THE INIT, which is why this is a sample and not a batch. The mask is 9.84% of the frame
  -- the big-leaf composite that measurably did nothing asked the same pass to work across eight times
  a working mask, and that difference is the whole bet.
script_line: 'Beat 16 WHY (1:15-1:22), node.md verbatim: "Close on the sapling''s leaf; the scavenger
  sits blurred behind it." RESTAGED 2026-08-20 to CLOSE ON THE WHOLE CANON SAPLING with the scavenger
  behind it -- the brief''s own relation with the leaf-as-feature clause dropped, which is what canon.yaml
  sapling-cotyledon-shape requires. The VO line is UNCHANGED and is the founder''s own 2026-08-19 word
  to keep: "He talks to me because I''m the only thing here that won''t file a report. Buddy, I wish I
  could. I can''t even wave."'
anti_decal_choices: 'composite-init-pattern section 3, all three honoured and each checkable in the geometry
  sidecar. PROCEDURAL: the plant is drawn with numpy and PIL, not photographed and not cloned from nearby
  pixels. FITTED TO THE OBJECT: the mask is derived from the drawn silhouette, so the texture edge and
  the object edge are the same edge. THE PLATE''S OWN LIGHT: direction MEASURED from the plate''s low-pass
  luminance gradient over the region the plant occupies (dx -0.218 dy -0.976), the highlight crescent
  placed on the side it names, and the plate''s shading field re-applied multiplicatively over the drawn
  plant. The palette is sampled from the WEED BEING DELETED -- b19''s law, the strongest source available,
  and not a repeat because those pixels do not survive into the output.'
bar: "ONE SAMPLE, JUDGED BY EYE AT 1:1, AND THE FIRST QUESTION IS WHETHER IT\nIS THE SHOT -- not whether\
  \ the pass was busy. Two beats today have now shown\nthat the model working hard predicts nothing about\
  \ whether the picture is right.\n  S1 IT READS AS BEAT 16. The sapling is the subject of the frame and\
  \ the\n     scavenger is depth behind it. If a viewer's eye lands on him first, the\n     restage has\
  \ not happened and the crop or the plant's scale is the next\n     lever, not the prompt.\n  S2 EXACTLY\
  \ TWO LEAVES, on one stem. Canon `sapling-two-leaves`. Three is a\n     FAIL however good the drawing\
  \ is, and so is one.\n  S3 AVERAGE LEAVES. Canon `sapling-cotyledon-shape` -- ordinary, plain, the\n\
  \     shape anyone draws when you say leaf. No lobes, no lance, no exaggerated\n     silhouette. The\
  \ restage exists so the SHOT does not make a leaf a feature;\n     a leaf that arrives as a feature\
  \ anyway defeats the point of it.\n  S4 THE PLANT IS DRAWN, NOT PASTED. The pass has to give the blades\
  \ line\n     weight and cel shading in the plate's own dialect. THE FAILURE MODE WITH A\n     NUMBER:\
  \ on the big-leaf attempt the two pictures were the same picture and\n     detail inside the region\
  \ fell 10.45 -> 9.41. If nothing visibly happened,\n     say so and stop.\n  S5 ONE PLANT IN FRAME.\
  \ The weed was erased before drawing; if the pass paints\n     it back, or paints a third, the erase\
  \ or the mask is wrong.\n  S6 HE SURVIVES. Same figure as the plate, seated, not redrawn, not doubled.\n\
  \     The mask is nowhere near him but 0.30 over a pad-crop can still reach.\nNOT SCORED: which goblin\
  \ design he is. The plate is the ratified-then-superseded\nadult and the creature ruling is a separate\
  \ re-render."
failure_predicted_in_advance: 'S4 IS THE ONE I EXPECT TO ARGUE ABOUT. The four beats where this

  method worked composited a SMALL plant -- 4.1% of frame on b13 -- and this one

  is 62% of the frame''s width, which is the direction the big-leaf attempt

  failed in. The defence is that AREA is what the pass cares about and this mask

  is 9.84% of the frame against that attempt''s eight-times-a-working-mask, but

  that is an argument and this sample is the test of it. If the blades come back

  flat, the finding is that the ceiling is the object''s SPAN and not its area,

  which would be new and would close the composite route for foreground subjects.

  SECOND: S1, AND IT IS NOT A SAMPLER QUESTION. He may still pull the eye simply

  because he is a face and the plant is not. If that is the read, the lever is a

  tighter crop -- beat 09 proved this week that crop-and-condition survives i2v at

  105% of frame 1''s high-frequency energy -- and not another pass.

  THIRD: S5. `second plant` and `two plants` are in the negative, and this tree''s

  negatives have failed to hold position three for three, so they are there for

  completeness and not relied on. The erase is what is relied on.

  NOT PREDICTED AND WORTH WATCHING: the contact shadow at the stem''s base. It is

  drawn as an ellipse and 0.30 may resolve it as a hole in the ground.'
init_provenance: farm-out/ep2-b16-sapcomp-0820/16-why-sapcomp-0820.png, built by pipeline/beat16_sapling_composite.py
  on farm-out/ep2-b15-mac-plate-0819/15-good-listener-mac-plate-r1s1.png (sha256 8a9bd14b...4ebe), the
  PRE-composite parent of the b15 plate. The weed that plate carries was erased before anything was drawn
  -- b19's flood matte from a dark seed (3,988 px, stable across box sizes where a threshold-only matte
  grew 4,292 to 15,904), grown 5 px to take the lit fringe a threshold cannot see, then a within-class
  per-row fill. Two plants in frame would break `sapling-two-leaves`, and a 0.30 pass PRESERVES a weed
  rather than removing one. Full geometry, palette and light measurements in 16-why-sapcomp-0820.png.geometry.json.
not_done_on_purpose: 'No second seed -- one sample before any batch, and the recipe is unchanged so this
  sample is about the init. No recipe change of any kind. No canon edit: sapling-cotyledon-shape is OBEYED
  here, not amended, and the `licence` option the founder was offered is still open. No cut change: beat
  16 is a slate and stays one until he screens something. No motion job filed yet -- that is the next
  rung and it is fired only if this reads as the shot.'
the_mask_is_the_bet: 9.84% of the frame, against a 34% ceiling the tool refuses above. The drawn plant
  spans 62% of the frame's width and 59% of its height while occupying 5.65% of its pixels -- a thin object
  can be a close-up's subject without asking the pass to re-render the picture. The big-leaf composite
  on /review/ep2-b16-leaf-0820 failed at eight times a working mask and measurably changed nothing (detail
  10.45 -> 9.41, same per-pixel movement as the version that worked). This sample is the test of whether
  area is what the pass cares about, or span.
the_one_variable: 'THE INIT. Every sampler number is the parent''s by copy: 40 steps, cfg 7.5, strength
  0.30, pad-crop 64, blur 8, animagine-xl-3.1 base weights in the SDXL inpaint pipeline, seed 20260820,
  the whole inpaint_fruit.py payload, the env block, the needs, the dry-run-before-any-model gate and
  the no-glob publish. The prompt and negative change because they describe a different beat, and the
  fetch changes because it names different files.'
