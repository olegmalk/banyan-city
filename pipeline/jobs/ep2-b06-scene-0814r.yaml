  one failed on the board's SIZE. The action is really there — f000-f005 he faces camera
  holding the prop at waist height, f006-f011 he turns to his right and rotates it through
  edge-on, f012 he is back to camera with its written face toward the lens and from f013 to
  f045 he holds it at chest height with his eyes down on it. That is "turns the bark board
  over and reads off it", performed, on a locked camera, with ZERO identical adjacent pairs
  in the clip. The field is there at frame one, there is no white burst, and the man is the
  same man in all 46 frames. WHAT FAILS IS THE BOARD: from f012 it spans from his chin to
  below his waist and most of his shoulder width, where `done_when` requires it
  "hand-sized". Both this job's positive ("the hand-sized bark board") and its negative
  ("giant board, oversized board") failed to hold the size.
