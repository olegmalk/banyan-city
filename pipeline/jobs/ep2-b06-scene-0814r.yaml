verdict_finds_a_gap_in_the_prop_identity_bar:
  the_finding: >-
    ALL THREE OF THE BLIND READER'S BEAT-06 FAULTS ARE THE PROMPT DOING WHAT IT WAS TOLD, NOT
    THE RENDER DRIFTING. Read the payload against the three findings. (1) The missing
    background figure: the prompt demands "no second person is anywhere in the frame" — asked
    for. (2) "a YELLOW-GOLD ROUND BADGE on the left chest in every frame, absent from the
    reference": the prompt asks for "a cloth SASH OF OFFICE across his chest and a small
    brass BADGE pinned on it" — asked for. (3) "THE PROP IS REPLACED ENTIRELY ... a wide
    shallow dark-rimmed tray held HORIZONTALLY carrying loose white sheets and a pen becomes a
    tall vertical brown board, densely scribbled": the prompt asks for "a bark clipboard in
    one hand" and "the hand-sized bark board" — asked for, and the plate's tray was the WRONG
    PROP FOR THIS BEAT, because the plate belongs to beat 10.
  why_that_matters_for_the_bar_and_not_just_for_this_beat: >-
    prop_identity_bar's test is "does every object a character CARRIES OR WEARS in the init
    plate still exist in the rendered frames, as the SAME object ... and held or worn by the
    SAME character", and it is explicitly a PLATE-to-FRAMES question answerable by a reader
    with nothing but the plate and the frames. That is its strength and here it is also its
    blind spot: a reader with only those two inputs CANNOT DISTINGUISH the render corrupting a
    correct prop from the prompt correcting an incorrect one, and on this beat it is the
    second every time. A bar that fails a beat for successfully replacing a borrowed plate's
    wrong prop with the right one is measuring the wrong thing on exactly the beats that reuse
    a neighbour's plate — and this episode reuses plates constantly (beat 06 runs on beat 10's
    plate, beat 10 on beat 05's, beat 21 on beat 12's).
  what_this_lane_does_and_does_not_do_about_it: >-
    REPORTS IT; DOES NOT REWRITE THE BAR AND DOES NOT REOPEN ANYTHING. The bar's own SCOPE
    paragraph governs and is respected to the letter: "THIS CLAUSE GOVERNS WHAT WE CLOSE FROM
    HERE. It does NOT reopen beats already closed ... Read this clause forward only." Beats
    05, 06 and 10 stay SHIP WITH FAULT NAMED with their prop faults recorded. The proposal,
    named and not adopted, is one added question for the reader's brief: after "is it the same
    object", ask "and does the PROMPT ask for a different one" — which costs the lane
    commissioning the read one grep and turns an ambiguous fault into either a drift finding
    or a plate-mismatch finding. Whoever owns standard_0815 can take it or leave it.
