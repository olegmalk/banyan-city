    \  \" + name)\nwith open(os.path.join(dst, \"ep2-b12-sapnat3-0822.sha256\"), \"w\",\n          newline=\"\
    \\n\") as fh:\n    fh.write(\"\\n\".join(sorted(lines)) + \"\\n\")\nprint(\"published\", len(lines),\
