bar_addendum: "\nTHE PARENT'S BAR IS UNCHANGED AND IS STILL THE BAR (P1-P6 + P4'). ONE CLAUSE\nIS ADDED,\
  \ and it is the clause this rung exists for:\n\n  P7  THE CLOUD BANK HAS NO HORIZONTAL BARS IN IT. Read\
  \ the band between the\n      grass line and the top of the leaves at 1:1. The shipped parent has a\
  \ fan\n      of hard horizontal streaks there; `b12-fill-row-control-0822.png` in the\n      same directory\
  \ is the matched control that reproduces them from this\n      lane's own command line, so the comparison\
  \ is exact and does not depend\n      on recovering the parent's argv.\n\n      A PASS is: no bars,\
  \ and whatever the pass drew there reads as cumulus or\n      as soft sky. A soft, low-detail wash in\
  \ the bank's own colours IS A PASS\n      -- a harmonic fill is smooth by construction and the trade\
  \ was taken\n      deliberately, because a wash is a plausible piece of cloud and a bar is\n      not\
  \ a piece of anything.\n\n      A NEW FAIL MODE, named so it cannot be discovered afterwards: the wash\n\
  \      reads as an OUT-OF-FOCUS PATCH against sharp cel clouds -- the same\n      dialect break that\
  \ made beat 16's bokeh plate unusable, arriving here\n      from the compositor instead of from the\
  \ checkpoint. If that is what comes\n      back, the next lever is a smaller erase (leave more real\
  \ cloud standing)\n      and NOT a higher strength.\n\n  P8  THE LEAVES ARE STILL LIT FROM A DIRECTION\
  \ THE PLATE SUPPORTS. The fill\n      changed the measured light (dx -0.105 -> +0.549) because\n   \
  \   light_direction reads the FILLED array. The row arm was reading\n      manufactured bars, so the\
  \ new answer is the better-founded one -- but it\n      is a change to the drawing and it is scored,\
  \ not assumed.\n"
failure_predicted_in_advance: 'FIRST, AND IT IS THE ONE WITH THE MOST RIDING ON IT: the harmonic wash
  reads as OUT OF FOCUS against sharp cel clouds. That is beat 16''s bokeh failure arriving from the compositor
  side, and if it fires the lever is a SMALLER ERASE -- leave more real cloud standing -- and not a higher
  strength.

  SECOND: the mask is 23.3% of the frame against the parent''s 19.8%, because the erase parameters could
  not be recovered exactly and this cut uses the tool''s documented defaults. The mask-area law says 0.30
  does less as the mask grows, so if P1 comes back weaker than the parent''s, area is the reason and the
  fix is the erase, not the number.

  THIRD, AND UNPREDICTED UNTIL THE A/B WAS CUT: the light direction moved because it is measured on the
  filled array. The leaves are lit from the other side now. P8 scores it.'
