success: 'Four sheets. NO RECOMMENDATION FROM ME -- R4, he picks the character. The read is whether this
  is a DIFFERENT BUILD from the other five and whether the face reads DUMB AND PLAIN: small dull eyes
  rather than big round ones, mouth slack, nothing clever in it, nothing sleek. THE NEGATIVE FINDING IS
  THE ONE THAT MATTERS MOST: if all six come back cute, or come back as one face wearing six builds, this
  checkpoint''s anime prior cannot draw a plain dumb goblin -- and a drawn or sourced design becomes his
  real choice rather than a fallback. That gets reported with the evidence instead of six cute goblins
  being shipped as a spread.'
why: 'THE REFERENCE ITSELF WAS REJECTED ("thats the cute goblin again.. i''d rather him not be cute")
  and then the direction landed twice: "i just want him to be a dumb ol goblin", corrected by "not old..".
  So: dumb, plain, unremarkable, an ADULT OF NO PARTICULAR AGE. Every age term is gone -- no wrinkles,
  no sagging, no jowls, no tired posture -- and so is my first spread, which aimed at registers and included
  a sharp-featured trickster, the exact opposite of the brief. All six were pulled from the queue UNCLAIMED
  and rebuilt, so nothing off-brief rendered. Design 3 of 6, wide-jawed. What carries the brief is structural,
  because tone words have lost every time this week: SMALL DULL EYES above all -- cute IS big round eyes
  -- under a heavy sloped brow, a slack open mouth and a vacant expression so the face is doing nothing
  intelligent, plus a lumpy nose, thick neck and stubby hands for plainness. The six vary on BUILD AND
  BONE only, never personality.'
prediction: 'Written before any frame exists, and unlike r2''s this one is aimed at the failure that actually
  happened. r2 drew NO PLANT in 4 of 4 and NO WORLD in 4 of 4; r3 makes the sapling its own subject clause
  growing from the earth and gives the world its own sentence. What should come back: a rooted plant with
  a visible stem beside a kneeling goblin in a lit meadow. The remaining risks, in order — (1) the fig,
  absent in 3 of 4 of r2, is still only two words and may not read; (2) `purple fig` may fight the model''s
  prior for a fig''s colour; (3) with the character adjectives cut to buy tokens, the patchwork cloak
  is now entirely absent from the prompt, so the costume will be whatever the checkpoint defaults to —
  r2 gave a dark buttoned jacket every time. If the plant and the world come back and only the fig and
  costume are wrong, that is a PASS on the dialect question and the costume moves to the reference where
  it belongs.'
