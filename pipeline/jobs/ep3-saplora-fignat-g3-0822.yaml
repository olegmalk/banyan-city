bar: "JUDGED BY EYE AT CONTACT-SHEET LEVEL, AS A DATASET AND NOT AS A SHOT.\nThis frame is never cut into\
  \ anything; its only consumer is the sapling LoRA's\nv2 training set, so the bars are the ones a training\
  \ frame has to clear. FIVE\nOF THE SIX ARE v1'S VERBATIM. D3 IS INVERTED AND THAT IS THE POINT.\n  D1\
  \ EXACTLY TWO LEAVES ON ONE STEM. Canon `sapling-two-leaves`. Three is a\n     delete, so is one. The\
  \ init has two by construction, so a three here means\n     the 0.30 pass invented one and the finding\
  \ is about the pass.\n  D2 AVERAGE LEAVES. Canon `sapling-cotyledon-shape` -- ordinary, plain, no\n\
  \     lobes, no lance, no exaggerated silhouette.\n  D3 A FIGURE IS PRESENT, AND IT IS SEPARATE FROM\
  \ THE PLANT. Inverted from\n     v1, where a figure was a delete. Here a frame with NO figure is the\n\
  \     delete, because a figure-free frame is what the set already has 44 of.\n     The figure must also\
  \ be DISTINCT: if the pass has fused the plant into\n     him, or grown the stem out of his body, the\
  \ frame is rejected -- that is\n     the exact defect v1 produced and it must not be taught back in.\n\
  \  D4 THE PLANT IS DRAWN, NOT PASTED. Line weight and cel shading in the\n     plate's dialect. g7 IS\
  \ THE NAMED RISK HERE: its palette sampled ONE\n     green-dominant pixel, so its init plant is a single\
  \ flat olive with no\n     light/dark at all. If the pass does not give it shading, g7 is dropped.\n\
  \  D5 THE SCENE SURVIVES, AND SPECIFICALLY THE GROUND DOES. The pass may not\n     repaint the plate\
  \ around the mask, and the material under the plant --\n     cracked earth, path, rock, gravel, sand,\
  \ leaf litter, mud -- must still\n     read as that material afterwards. A frame whose ground has reverted\
  \ to\n     GRASS is a delete: it is the v1 monoculture growing back and it would be\n     captioned\
  \ with a ground word its pixels no longer support.\n  D6 ONE PLANT. No second sapling grown out of the\
  \ ground beside it."
