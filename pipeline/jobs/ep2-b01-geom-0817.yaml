# ep2-b01-geom-0817 -- 2026-08-17, geometry-vs-number rung. $0, local card, no provider.
# ONE RUNG, ONE VARIABLE, against a control that has already been scored.
# Draft key: authored_b01_geom_0817. Measured on the REAL CLIP before this file was filed
# (openai/clip-vit-large-patch14 via sd_prompt.compress + negative_tokens, the two functions
# render_wave_goblin.check() itself calls): positive 73/77, headroom 4, POSITIVE DROPPED:
# none, STYLE ANCHOR PRESENT: True. The control measures 68/77 on that same harness, which
# reproduces the figure ep2-b01-scale-0817 recorded off the box's own CLIP -- that agreement
# is why the two rows are comparable. The fallback estimator was not used: it changes
# verdicts and not merely numbers. The first geometry wording tried came back 67/77 with the
# style tail SILENTLY DELETED by compress() and ANCHOR False; it was discarded, not trimmed.
# Steps, needs and env were COPIED from the control by pipeline/insert_b01_geom_0817.py's
# sibling authoring script rather than retyped, so byte-identity is how the file was made.
# NEVER RUN: no farm-out/ep2-b01-geom-0817 and no out-b01-geom-0817 dir exists.
