# ep1 beat 07 "zero-0-moving-parts" — LTX motion re-render, round 2.
#
# r1 landed and half-worked: "07 partial (41% still frozen)"
# (origin/farm-results-hand, DONE task=ep1-v34-motion-wave-0810 at 01:49:12Z).
# The recipe produced clean clips on beats 08, 10 and 14-r2, so the recipe is
# not what is wrong with 07 — the draw is. This is therefore a SEED-ONLY retry,
# and that is deliberate: rewriting the prompt to chase 41% would be changing
# the recipe on a sample size of one beat, and the identical recipe is what the
# other five landed clips were measured under.
#
# ONE SAMPLE: one beat, nothing scales off it.
#
# OWNERSHIP — READ BEFORE FIRING. Beats 03/04/07 belong to lane card-runner-3,
# live on them at 05:43. This spec is here so the box can take the beat if that
# lane dies, not so two renders can race. Check for a STARTED/DONE on
# ep1-b07-v34-motion-r2 and confirm C:\banyan-farm\GPU-CLAIM.txt says RELEASED.

