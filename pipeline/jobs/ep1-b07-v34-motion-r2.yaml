payload:
  # Prompt synced 2026-08-11 to the sidecar of the render that actually shipped:
  # review/v34-motion/07-zero-0-moving-parts-LTX-r2.mp4.meta.yaml, same task id.
  # That render had already replaced "everything holds its position, framing
  # locked, no zoom, no push-in, no camera rise" with affirmative anchors; the
  # spec still carried the negation block, and on this path (guidance 1.0, no
  # uncond pass) the positive is the only channel, so "no zoom" delivers zoom.
  #
  # NB the header above still describes this as a SEED-ONLY retry of r1. That was
  # true when it was written; the shipped render also rewrote the framing clause.
  C:\banyan-farm\v34-r2\b07-prompt.txt: |-
    2D anime, hand-drawn cel animation, flat cel shading, clean ink linework, anime key art. a locked-off tripod shot: the camera never moves, the horizon line stays at the same height in the frame, the low sun stays in the same place on the horizon, the composition is identical in every frame. within that fixed frame the whole field is continuously in motion: the grass ripples and sways across the entire frame without ever stopping, wave after wave running through it from edge to edge, every blade moving all the time, the clouds drift steadily across the sky and keep their shapes, warm sunset light shifts and flickers over the field throughout, living scene, constant ambient motion everywhere. Subject already in frame: no human, no person, no man, no woman, no boy, no girl, no hand, no face, a wide open grass field at sunset, low sun on the horizon, a broad sky with soft clouds, no buildings.
  C:\banyan-farm\v34-r2\b07-negative.txt: |-
    wilting, drooping, bending over, falling over, collapsing, sagging, plant dying, human, person, man, woman, boy, girl, extra hand, extra arm, foot, face, crowd, animal, bird, insect, new object appearing, photorealism, 3D render look, text, 静态, 静止, frozen frame, still image, no motion, photorealistic, photograph, live action, film still, 3D render, CGI, octane, scene change, shot change, cut to another angle, second scene, new camera angle, different location, split screen, montage
  C:\banyan-farm\v34-r2\b07-jobs-encode.json: |-
    [{"beat": 7,
      "embeds": "C:\\banyan-farm\\v34-r2\\b07-embeds.pt",
      "prompt_file": "C:\\banyan-farm\\v34-r2\\b07-prompt.txt",
      "negative_file": "C:\\banyan-farm\\v34-r2\\b07-negative.txt"}]
  C:\banyan-farm\v34-r2\b07-jobs-render.json: |-
    [{"beat": 7,
      "seed": 20260838,
      "embeds": "C:\\banyan-farm\\v34-r2\\b07-embeds.pt",
      "init": "C:\\banyan-farm\\v34-r2\\07-704x1280.png",
