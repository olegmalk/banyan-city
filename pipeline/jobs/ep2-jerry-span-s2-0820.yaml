  STANDING FIGURE. adult-b19-0819.jpg is 4.0 heads crown-to-sole SEATED. PASS is

  3.6 or better crown-to-sole with lean limbs; `sit` measured 3.06 and read

  unmistakably as a small child-figure, which is the failure being fixed.

  T9 THE POSE IS SEATED. s1 can fail this and s2/s3 cannot -- s1''s skeleton is

  standing, so if the net follows the skeleton it draws a standing figure and the

  wording loses. That is a real possible outcome and it is not a bug.

  REGRESSION: T1 blank eyes, T2 no human nose, T3 no age modelling. The wording is

  n1''s recipe, which draws the blank egg -- these are held, not improved, here.'
failure_predicted_in_advance: 's3 IS THE ONE I EXPECT TO LAND, and s1 IS THE ONE THAT WOULD TEACH ME

  MOST BY LANDING. The measured relation across three poses is that drawn

  heads-over-span falls with span -- 5.08 authored gave 5.07 at span 0.965 and

  3.06 at span 0.486 -- which reads as the net sizing the head to the skeleton''s

  extent and only partly honouring the head keypoints. s3 compensates for that

  directly. s2 tests whether restoring most of the span is enough on its own.

  s1 IS THE INTERESTING FAILURE: openpose bound composition to the pixel in Sec

  13, so a standing skeleton should draw a standing figure and the seated wording

  should lose. If s1 comes back SEATED and lean, then the net is weaker on this

  checkpoint than Sec 13 measured, and the whole instrument is a suggestion rather

  than a constraint -- which would be worth more than the pose.

  IF ALL THREE FAIL, the stop gets written: openpose cannot give a folded pose at

  this character''s proportion, the LoRA''s pose gate cannot be discharged by this

  instrument, and the route is IP-Adapter off the tile''s own seated frame.'
