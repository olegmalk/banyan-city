# ================== DO NOT ENQUEUE. THE GATE BELOW IS CODE. ==================
# `gate:`/`gate_ref:` make box_enqueue.py:123-132 refuse this file outright, so
# this is enforcement and not a note someone can miss. Clearing it is a human
# deleting the key in a commit.
#
# WHAT MUST HAPPEN FIRST, named exactly: ep1-b08-313f-vo-length-0811 must have
# been LOOKED AT by Roman and its result accepted. Its artifact is
#   C:\banyan-farm\v34-motion-0810\08-ltx-r2-plate-313f-s20260739.mp4
# That job is the FIRST SAMPLE of this recipe — "stop rendering 65 frames and
# render the number of frames the voice line actually needs". This file is the
# SECOND BEAT on that recipe, which is precisely what the founder's one-sample
# rule forbids until the first has been seen (CLAUDE.md, 2026-08-03: the K recipe
# was rendered across fifteen beats on the steward's own metric and rejected with
# "literally just frozen frames"). If the 313f clip comes back bad, this file is
# deleted rather than fired.
# =============================================================================
#
# THE DEFECT, MEASURED, NOT GUESSED. render_t3.fit_duration (render_t3.py:312)
# sizes a voiced beat's slot to max(min(cdur, vdur + 2.0), vdur + 0.4). Footage
# shorter than its slot is looped. Read off this beat's own files:
#   clips/02-vo.json          total_s 4.451
#   review/provisional-v35/clips/02-three-oh-seven.mp4   2.542s (ffprobe)
#   slot = max(min(2.542, 6.451), 4.851) = 4.851s
#   4.851 / 2.542 = the picture plays 1.91 times under one sentence.
#
# HOW BAD, HONESTLY — one correction to the sibling b08 spec's reasoning. That
# spec cites render_t3.py:583 as "looping footage restarts as a hard jump-cut
# mid-shot". The full comment says that WAS the fault and that loop cycle 005
# fixed the seam: the loop is now a PALINDROME (clip + itself reversed) "so every
# seam is motion-continuous". So the defect here is the REPETITION, not a visible
# cut — the viewer watches 2.5 seconds of picture go forward and then backward
# under a line about production going down. That is milder than a jump-cut and it
# is still the thing Roman named: "i'd rather not have any looping, it looks bad."
# At 1.91x this is the mildest of the three staged beats; 13 is the worst.
#
# THE FRAME COUNT IS ARITHMETIC, NOT A PREFERENCE. No loop requires the clip to
# cover the slot: F/24 >= vdur + 0.4 = 4.851, so F >= 116.42. LTX wants 8n+1.
#   smallest 8n+1 >= 116.42 is 121 (8*15+1) -> 121/24 = 5.042s
#   5.042 >= 4.851 (nothing loops) and 5.042 <= vdur+2.0 = 6.451 (nothing is
#   trimmed, so the whole clip plays).
# 121 is far under the 385 host-RAM ceiling measured on this box (385f:
# host_peak_phys 59.8/68.1GB, commit 89.2/128.2GB against peak_torch 17.8/25.7GB).
#
# THE PLATE IS A FRAME HE HAS NOT REFUSED, and this is the check that disqualified
# three other looping beats. shots.md:1041-1046 records that after the 2026-08-08
# redraw wave "eleven of episode 1's fifteen shots now hold a frame he has not
# refused and four do not — 3, 6, 10 and 14 still have their old PNGs on disk,
# unrevoked because a revocation needs a replacement to point at ... but each is a
# frame he turned down in v32." Beats 03, 10 and 14 all loop too and all three are
# EXCLUDED for that reason: motion rendered on a refused drawing cannot ship, and
# their replacement pick is checklist item 10 (`ep1-frame-picks`), which is his.
# Beat 02 is not in that four. 02-three-oh-seven.png is canon, carries no REVOKED
# variant at all, and is present in the box checkout.
#
# THE HUMAN IN THIS FRAME IS SUPPOSED TO BE THERE, which changes the prompt tail
# and is worth stating because every other prompt in this series forbids people.
# Beat 02's shot direction (shots.md:31-37) is "1boy, solo, over the shoulder, dark
# silhouette, glasses, messy hair" — the engineer, deliberately, with the camera on
# the terminal because "the machine is the referent". So the "Subject already in
# frame:" tail below DESCRIBES the silhouette instead of negating humans. Copying
# the b06/b07 anti-human tail onto this beat would ask the model to delete the
# subject of the shot.
#
# AND THE NEGATIVE IS INERT, WHICH IS WHY IT IS ALLOWED TO STAY WRONG-ISH. Verified
# at source in the venv the box actually renders with (C:\banyan-video\venv,
# diffusers 0.39.0, pipelines/ltx2/pipeline_ltx2.py):
#     do_classifier_free_guidance = (self._guidance_scale > 1.0)
#                                or (self._audio_guidance_scale > 1.0)
#     audio_guidance_scale = audio_guidance_scale or guidance_scale
# We pass guidance 1.0 and no audio value, so both are 1.0, the property is False,
# there is no unconditional pass, and the negative embeddings are never read.
# The negative below is carried for the provenance record (§7.2) and changes no
# pixel. It has had the human terms REMOVED anyway, so that the record of what we
# asked for is not self-contradictory on the one beat with a person in it.
#
# ONE VARIABLE AGAINST THE CLIP IT REPLACES: the frame count. Nothing else about
# beat 02's look is being relitigated here.
#
# NO METRIC PICKS ANYTHING. The flow metric is disqualified on this series
# (131e433 — it scored highest on the beat where the plant fell over). Read by eye.

