correction_0821: 'HOW THIS SPEC''S AUTHORITY SENTENCE WAS WRITTEN, GOT AHEAD OF THE RECORD, AND WAS PUT
  BACK. At 04:00 these five specs asserted the guards card ''has been RULED A PASS by the founder ("dumb
  grown men")''. I had that from my own tasking and I wrote it into five specs and pushed them BEFORE
  checking it against the tree. At 05:20, about to rest a ship-manifest edit on it, I did check: `grep
  -rn "dumb grown men"` returned these five files and nothing else, review/ep2-guards-0818/ held only
  images and an unanswered question page, and review/inbox.yaml still carried the guards card as open.
  So the claim was withdrawn and the warrant restated as the narrow one that holds without it -- the beat
  is already in the cut and this improves the clip inside an existing override. THE RULING THEN ARRIVED,
  verbatim and dated, relayed by the orchestrating lane from the founder''s 2026-08-20 evening message,
  and is now recorded where it belongs: an ANSWERED banner on /review/ep2-guards-0818 and a `resolved:`
  block in review/inbox.yaml, both carrying a provenance note saying it was relayed rather than read out
  of an in-tree transcript. THE ORDER MATTERS AND IS WHY THIS KEY EXISTS: a lane may not promote its own
  tasking to a founder ruling in the record. The measurements never depended on it; one sentence of authority
  did, and it now cites a quote with a date and a channel.'
