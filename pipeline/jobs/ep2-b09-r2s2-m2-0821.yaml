the_pose_note_up_front: 'THE INIT IS NOT THE PICTURE THE CARRIED SENTENCE DESCRIBES, and it was checked
  by looking at it at 1:1 rather than assumed from the filename. r1s3: hand flat on the cheek, fingers
  up, both eyes open, blue irises. r2s2: hand CURLED AT THE MOUTH, knuckles at the lips, thumb under the
  chin, the left eye squinted shut, the head turned further away. The carried sentence says `cheek` twice.
  That is why two of the five cells swap it for a pose-matched sentence at seeds the c arm also runs,
  so the wording is one variable at a fixed crop instead of a confound inside the crop result.'
