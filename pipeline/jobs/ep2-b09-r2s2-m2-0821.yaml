bar: "THE H-BATCH'S BARS, WITH THE PRICE THE LADDER NAMED MOVED FROM THE FAIL\nCOLUMN TO THE COST COLUMN,\
  \ AND WITH THE SLOT SUBSTITUTED FOR THE CLIP. Scored by\neye at 1:1 first, on f001, f008, f030, f050,\
  \ f070 and f093, and then with the\ncommitted rulers. THE SLOT IS f001-f093; f094-f121 are rendered\
  \ and are NOT\nSHIPPED, so no clause below is scored on them.\n\nT0 THE PAN RULER, AND IT IS A GATE:\
  \ nothing else is read off a clip that fails\n   it. Background patch residual (each patch's own mean\
  \ removed, because\n   whole-frame luma falls ~7 levels over the first thirty frames on this recipe\n\
  \   and the raw b04 form reports that exposure drift as a camera move) must not\n   exceed 1.5x the\
  \ incumbent's slot mean on either patch -- bg_corner 7.02 and\n   bg_low 2.84, so 10.5 and 4.3. THE\
  \ ABSOLUTE b04 BAR OF 3.0 IS PRINTED AND IS\n   NOT USED: the SHIPPING clip fails it at 7.02, so imported\
  \ unexamined it would\n   fail the incumbent, and a bar that fails the thing it is meant to protect\
  \ is\n   not a bar. THE TOP-RIGHT CORNER IS EXCLUDED BY NAME on both crops -- it is\n   his hair, not\
  \ the world.\nX1 THE HAND AT f008 AND f030. A whole hand -- knuckles or palm and readable\n   fingers\
  \ against the face -- at f008 and at f030. f008 is the frame the\n   pre-crop parent died on; f030 is\
  \ where the h-batch's best cell was still\n   whole. This is the clause the rung exists for.\nX2 THE\
  \ HAND AT f093, THE LAST FRAME THAT SHIPS. This is the PROMOTION clause and\n   it is separate from\
  \ X1 on purpose: X1 says the mechanism carried to a sharper\n   plate, X2 says the beat is fixed for\
  \ the audience. A clip that passes X1 and\n   fails X2 is PROGRESS and the frame it goes at is the next\
  \ rung's number --\n   the same reading the h-batch's H-LATE got, and it is not a swap.\nX3 THE HAND\
  \ IS A HAND. Not a mitten, not three fingers, not a smudge, not a\n   fifth finger. A hand that survives\
  \ by becoming a shape is a FAIL and is named\n   here so it cannot be reported as a hold.\nX4 THE FACE\
  \ STILL WORKS, AND THE CLIP IS ALIVE AT THE END OF THE SLOT. Brows\n   draw and ease, eyes shift, the\
  \ head tilts a few degrees. LAST LIVE PAIR must\n   reach 93 -- the incumbent's is 92 of 92, so a clip\
  \ that dies inside the slot\n   to hold the hand loses on the incumbent's own ruler and not on an opinion.\n\
  \   Face-band interframe mean in slot >= 1.0 (incumbent 1.390) and no third of\n   the slot under 0.15\
  \ (incumbent's middle third is 0.187 and that is already\n   the fault this beat has).\nX5 THE PARENT'S\
  \ SURVIVING CLAUSES: mouth closed for the whole slot, one face,\n   one man, the same man at f093 as\
  \ at f001, no second hand.\n\nACCEPTED COSTS, PRICED IN, RECORDED AS COSTS AND NOT AS FAILS:\n  * ONE\
  \ EYE IS SQUINTED SHUT FROM f001. It is a property of the r2s2 plate, not\n    of the motion -- it is\
  \ the `shut eye` the ladder priced this route at, and\n    it is visible on the very first frame rather\
  \ than only at the end. THE\n    INCUMBENT HAS BOTH EYES OPEN AND THIS DOES NOT. That is the trade,\
  \ it is\n    named here before any pixel exists, and a clip is not failed for it.\n  * EYES SHUT AT\
  \ THE END. Off the end of the slot (f100+) and therefore not\n    scored at all; recorded because the\
  \ h-batch's verdict turned on it.\n  * SOFTER GLOBALLY THAN A NATIVE CLOSE-UP. 1.454x LANCZOS, 90.2%\
  \ of the native\n    control's high-frequency energy against r1s3's 45% -- this crop is the\n    SHARPER\
  \ of the two, which is the point, but neither is native.\n\nTHE SWAP TEST, WHICH IS NARROWER THAN THE\
  \ BAR AND IS THE ONLY THING THAT MOVES\nTHE CUT: a clip swaps in only if it passes T0, X1, X3, X4 and\
  \ X5, beats the\nincumbent on last-live-pair-in-slot AND on hand-hold by eye, and does not lose\nthe\
  \ face acting (X4's two numbers). X2 is what makes it a clear win rather than\na marginal one. If nothing\
  \ clears that, the incumbent stands and this batch is a\nmeasurement, not a swap."
failure_predicted_in_advance: 'WHAT I EXPECT, WRITTEN BEFORE IT RUNS. The crop should help X1

  and X3 for a mechanical reason the ladder already established: `the init holds

  where it is sharp`, and this hand is drawn at 1.454x instead of 2.157x -- 90.2%

  of a native close-up''s high-frequency energy against 45%. The hand is the

  softest object in the r1s3 frame and it is the first thing to go; on r2s2 it is

  not the softest object.

  WHAT I EXPECT TO GO WRONG, IN ORDER.

  H-POSE, AND IT IS WHY THE m ARM EXISTS: the carried sentence describes a hand

  flat on the CHEEK and the r2s2 init has it curled at the MOUTH. If the c cells

  show the hand sliding off the mouth toward the cheek over the first ten frames

  while the m cells do not, that is H-POSE and the answer is the m wording. If

  BOTH arms hold, the sentence''s placement clause was doing less work than its

  naming clause, and that is a finding about this engine worth more than the clip.

  X4-FREEZE, unchanged from h1: two of three h-cells were dead in their last

  twenty frames. A sharper init gives the sampler less to re-decide, which helps

  the hand and may also flatten the face. That is why last-live-pair is a GATE

  here and not a note.

  THE EYE. I am not predicting the squint opens. It is in the init and the

  positive does not mention it; the h-batch''s eyes went the other way and stayed

  there. If a c cell OPENS the eye mid-clip that is a bonus and it is not a bar.

  AND THE ONE I CANNOT PRICE: whether a boy with one eye shut and a fist at his

  mouth reads the beat better or worse than a boy with two open eyes and no hand.

  That is taste and it is not mine to settle -- which is why the swap is VETO-ABLE

  and the manifest row will say what was traded, in numbers, rather than claiming

  an upgrade.'
