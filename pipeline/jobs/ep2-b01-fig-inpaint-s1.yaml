consumer: >-
  the founder, directly. He answered item 21 with "inpaint" and the one-sample
  rule says a recipe change produces ONE artefact for his eyes before anything
  scales. Downstream of his look: the two-stage beat-01 recipe (inpaint the
  fruit into the approved init, then r8's img2img from it), which is not written
