# ep2 beat 01 — THE FIG, ONE INPAINTED SAMPLE. Not a set, not a candidate frame.
#
# HIS WORD, 2026-08-10 ~12:20, answering cuts.yaml item 21 ("The fig on beat 01 —
# drop it, or approve an inpaint?"): "inpaint". Recorded in cuts.yaml item 21
# (settled) and ledger record ep2-b01-fig-route-0810 (kind: direction) BEFORE
# this job was written. He approved a METHOD and nothing else — no size, no
# position, no colour, no ripeness — so this job invents none of those and the
# mask geometry is labelled as the steward's everywhere it appears.
#
# WHY THE PLATE IS AN EPISODE-1 FRAME, and it is the gate rather than a
# preference. G1 says a conditioned render starts from a founder-approved image.
# NO BEAT-01 STILL HAS EVER BEEN APPROVED — the node's only canon file for that
# shot is stills/01-cold-open-REVOKED-too-tall.png and it is revoked. Ledger
# record ep2-b01-r8-sample already worked this out and named the consequence:
# b15-r3-s1 (001-capability-inventory/stills/15-something-s-coming.png) is the
# ONLY approved sapling-in-grass frame in the tree and therefore the only legal
# init for this beat. Round 8 used it as an img2img init; this paints the fruit
# into it. The approved plate is NOT modified — a new file is written, and the
# script refuses to start unless the init's sha256 is
# f60c1404f88d45720ca295dfc753e9eaabb815446710bcfffb3c7a07b7277f54.
#
# WHY IT IS THE RIGHT TEST AND NOT A DETOUR. Round 8's finding was that img2img
# at 0.35 and 0.55 cannot ADD an object the init lacks (0 of 12) — but img2img
# demonstrably PRESERVES what the init already holds. So the recipe this sample
# is stage one of is: paint the fruit into the approved init, then run r8's
# existing img2img from it. If the fruit appears here, the beat-01 route follows
# without a new mechanism. If it does not, inpainting is retired on the same
# evidence standard the prompt and img2img were.
#
# METHOD, RESEARCHED OUTSIDE THIS REPO. animagine-xl-3.1 has no inpainting
# variant, so this loads the BASE weights into StableDiffusionXLInpaintPipeline.
# diffusers 0.29.2 supports a 4-channel UNet there and takes a latent-blend
# branch instead of concatenating mask channels; HF's docs say the trade-off is
# "the overall image quality may be lower, but it generally tends to preserve
# the mask area", and preserving his plate outside the mask is exactly the
# requirement. `padding_mask_crop` is the documented countermeasure for a SMALL
# object in a LARGE frame — it crops the masked region, upscales it to the
# pipeline resolution, inpaints, and pastes back — which is the resolution
# problem the "the plant is too small to carry a fruit" hypothesis describes.
#   https://raw.githubusercontent.com/huggingface/diffusers/v0.29.2/src/diffusers/pipelines/stable_diffusion_xl/pipeline_stable_diffusion_xl_inpaint.py
#   https://huggingface.co/docs/diffusers/v0.29.2/en/using-diffusers/inpaint
#   https://huggingface.co/cagliostrolab/animagine-xl-3.1
#
# LICENCES: NOTHING NEW IS DOWNLOADED. animagine-xl-3.1 is already local and
# already declared in every beat-01 sidecar (CreativeML Open RAIL++-M, use
# restrictions travel, D15). The one alternative needing a download —
# diffusers/stable-diffusion-xl-1.0-inpainting-0.1, a true 9-channel SDXL
# inpaint UNet, also OpenRAIL++-M — is deliberately NOT used: it is not the
# anime checkpoint and would draw the patch in a different dialect from the
# frame around it. No cc-by-nc weight is anywhere in this route.
#
# THE MASK IS THE STEWARD'S AND IS ONE NUMBER TO MOVE. Ellipse centred at
# (462, 848) with radii (34, 36) — 8.2% of frame width, 5.9% of frame height,
# roughly a sixth of the plant's height. The stem's own pixel path was measured,
# not eyeballed: darkest-pixel scan puts it at x=431 at y=800, x=444 at y=850,
# x=451 at y=900, so the ellipse straddles the stem's right edge below the
# cotyledons and the fruit hangs to the right. A mask PNG is written beside the
# output so the region can be looked at rather than described.
#
# ONE SAMPLE. One frame, one seed, one parameter set. No grid, no variants, no
# pick, no score. Whatever comes back goes in front of him as-is.
#
# The driver script is inlined below rather than referenced, so the job does not
# depend on the box's checkout being current. It is byte-identical to
# pipeline/inpaint_fruit.py at sha256 7e7f9a1094f54e57e29e1692bfcc2cdbd33db6b72baf397c991bd1240619601a.

id: ep2-b01-fig-inpaint-s1
task: ep2-b01-fig-inpaint-s1-0810
node: 002b-first-citizen              # founder-approved 2026-08-03, leaf 002b-t0-c.yaml
