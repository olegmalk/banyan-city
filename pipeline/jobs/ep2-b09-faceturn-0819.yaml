    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b09-faceturn-0819"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/ep2-b09-faceturn-0819/09-the-pause-LTX-ep2-b09-faceturn-0819.mp4*")
                 + glob.glob("C:/banyan-farm/ep2-b09-faceturn-0819/b09-init-704x1280.png")
                 + glob.glob("C:/banyan-farm/ep2-b09-faceturn-0819/bench-ep2-b09-faceturn-0819.jsonl"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b09-faceturn-0819.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    # >=2 so a run that wrote the init but no clip cannot pass silently.
    raise SystemExit(0 if len(src) >= 2 else 1)
