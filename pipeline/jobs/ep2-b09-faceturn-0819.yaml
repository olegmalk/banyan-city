success: 'THIS BAR IS THE FACIAL-CHANGE ENGINE QUESTION AND NOTHING ELSE, and it is written before this
  clip exists. Output is ONE 704x1280 mp4, 121 frames at 24 fps.
  PASS requires BOTH halves:
  (A) THE FACE MOVES. Measured, not eyeballed, and measured ON A FACE CROP RATHER THAN THE WHOLE FRAME
  -- that distinction is the point of the job. Beat 09''s plate has deep tall grass across the whole
  background, and whole-frame interframe diff would score a frozen face as motion the moment a blade of
  grass stirs. So: crop the head bounding box from frame 0, apply the same crop to every frame, and report
  mean abs interframe diff and drift from frame 0 over THAT region, the way ep2-b18-motion-0812 was
  measured on 2026-08-17. PASS-A needs visible, describable change in the face itself -- brows, eyelids,
  gaze or a small head tilt -- confirmed by eye at 1x AND by the crop measure.
  (B) IDENTITY HOLDS. done_when''s own second clause is "face holds, no morphing". It is the SAME MAN at
  f000 and f120: dark cropped hair that does not change colour, round wire-rim glasses present and
  legible in every frame, exactly one face, an adult.
  Pre-registered FAIL modes, each to be reported by name whether or not it fires:
  FAIL-FROZEN (the face crop''s interframe diff is indistinguishable from codec noise while the grass
  moves -- this is THE result the job is filed to be able to state, and it is a clean answer, not a
  wasted run);
  FAIL-MORPH (identity collapses: hair changes colour, the glasses vanish or turn into sunglasses or
  goggles, or the man at f120 is a different man -- beat 11''s recorded fault is "total identity collapse
  away from the plate across f16-f21", so this is a measured risk on this engine, not a worry);
  FAIL-MOUTH (the mouth opens into speech. Beat 09 is a man thinking BEFORE he speaks, and beat 11''s best
  take turned a head "into full profile WITH AN OPEN MOUTH" from f008, so the checkpoint is on record as
  animating a talking head unasked);
  FAIL-SECOND-FACE (any second figure, face, child or chibi enters frame);
  FAIL-CAMERA (the frame pans, tilts, zooms or dollies -- static locked framing is asked for in the
  positive and banned in the negative);
  FAIL-STROBE (the lighting flickers, pulses or blinks, the defect measured in ep2-b18-motion-0812).
  NOT SCORED HERE, and their absence is not a defect: whether this plate is CASTABLE (it is not -- see
  `is_show_content_why`), the framing, the hand at his face, and whether an adolescent-reading guard is
  acceptable. All four are the founder''s R4 call and one of them is an open card. NOT a pick: this job
