    Read before measured, in that order.
verdict_clauses:
  D1_eyes_moving_side_to_side: >-
    FAIL, and this is the beat. The red irises hold the same position within the same eye
    shapes for 92 consecutive frames. Verified twice: on the consecutive strips at full
    frame, and on a dedicated 6x crop of the eye band over f073-f096 where a one-pixel
    iris shift would be four pixels and visible. Nothing moves. The only change anywhere
    near the eyes is at roughly f091-f093, where the pale eye field and the red iris go
    briefly DARK and muddy and then recover — that is the eye art breaking down for two
    or three frames, not a look. Reported as an artifact, and specifically NOT credited
    as eye movement, because crediting a rendering breakdown as performance is how a bar
    gets bent to fit a clip.
  D2_held_breath_readable_in_the_body: >-
    FAIL, and unshowable rather than merely absent. From f006 the frame contains a face
    and a collar. There is no chest, no shoulders in full, no hands, no posture — nothing
    a held breath could be read off. A clause about the body cannot pass on a shot with
    no body in it.
  D3_stillness_near_motionless_body_is_correct: >-
    PASSES ONLY BY ACCIDENT AND IS NOT CREDITED. The body is indeed near-motionless after
    f010 — because it is out of frame and because the picture has largely stopped:
    exact_freeze_index reports dup_pairs=47 of 96 with identical runs at (12,2) (14,2)
    (16,3) (26,10) (36,4) (54,11) (68,21) (94,2), so forty-two of ninety-seven frames sit
    inside runs of pictures identical at ncc 1.0000. The clause was written to license a
    quiet performance, not to license a still. Scoring it PASS here would be reading the
    bar backwards.
  staging_law_standard_0815: >-
    FAIL, and this is the mechanism under D1 and D2 both. The law is "CHECK THE ACTION
    AGAINST THE PLATE CAMERA BEFORE RENDERING." This beat's action is an eye performance,
    which needs the eyes LARGE and STABLE; its plate is a full-body wide shot in which the
    eyes are a few pixels across. The prompt asked for the performance anyway and the
    sampler resolved the conflict the only way it could — by inventing a close-up. The
    beat did not lose its eyes to a bad seed; it was staged where the eyes were never
    legible.
  identity_drift_bar_standard_0815: >-
    MIXED, AND THE DRIFT IS TOWARD CANON, WHICH THE RECORD HAS BEEN CAUGHT MISREADING
    BEFORE. Face morphology holds from f006 to f096 — same cranium, same brow line, same
    mouth — so within the close-up there is no drift. Across the f000-f006 ramp the
    drawing changes wholesale, but that is the same event as the balloon and is charged
    there once rather than twice. One observation offered at low confidence and flagged as
    such: at f000, where the figure is small, the eyes read pale/light and from about f003
