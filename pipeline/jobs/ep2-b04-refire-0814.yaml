verdict: >-
  FAIL on the clause the whole beat rests on. done_when is "stillness with LIVE EYES:
  held breath readable in the body, eyes moving side to side. This is the one beat where
  a near-motionless body is correct and only the eyes carry it." THE EYES NEVER MOVE. The
  irises sit in the same position in the same sockets from f005 to f096 — read
  consecutively across the whole clip and on a 6x crop of the eye band through the tail,
  there is not one lateral saccade, not one dart, not one blink. And the body cannot
  carry the breath either, because there is no body in frame: this clip THROWS ITS OWN
  PLATE AWAY IN TEN FRAMES. f000 is the init, a small full-body figure standing in grass.
  By f004 the crown of the skull is outside the top edge; by f006 the face fills the
  frame and the ears are gone; the crop never returns for the remaining 91 frames. What
  the record calls "a clean close-up on his face" is a wide shot that inflates into a
  cropped extreme close-up in a quarter of a second and then holds.
