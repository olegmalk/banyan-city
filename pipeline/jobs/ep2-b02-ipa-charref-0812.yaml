# EPISODE 2, BEAT 02 — DOES THE PICKED REFERENCE CARRY? $0.
# 2026-08-12, character-reference lane, under his consistency mandate
# (`ep2-consistency-mandate-0812`: "almost every beat includes the goblin or the
# guards so i cant approve them, you need to create proper character consistency").
#
# ── THE QUESTION. A reference sheet is only worth the beats it can hold. This is the
# first test of the actual mechanism: condition beat 02 — the beat whose identity
# drifted worst in the wave — on the provisionally picked goblin reference, and see
# whether the creature that comes out is the creature in the reference.
#
# ── WHAT IS IN THE REFS DIR, AND WHY FOUR VIEWS OF ONE CHARACTER. The four files
# are crops of ONE frame, `ep2-charref-goblin-0812` seed s0 (the pick recorded in
# `ep2-charref-pick-0812`): s0 the front head, s1 the three-quarter left, s2 the
# three-quarter right, s3 the body from shoulders to knees. The `window4` arm draws
# one cell per reference index at the 15% window and scale 0.6, so this single job
# answers two things at once — whether the reference carries at all, and WHICH VIEW
# of it carries best. The precedent for filling the four slots deliberately is the
# facepick round, which put four identical copies in and got four identical cells;
# four different views of one character is the same cost and strictly more signal.
# The body crop keeps two chin fragments of neighbouring heads in its top corners —
# same character, same palette, stated rather than hidden.
#
# ── THE CONFOUND, NAMED BEFORE THE RENDER. `goblin_ipa_sample.py` hardcodes
# `GOBLIN_DEF = "green skin, tusks"` and this lane may not edit pipeline code, so the
# PROMPT will ask for tusks while the REFERENCE has none, and the draft it sends is
# beat 02's original `authored` text rather than the `_idfix_r2` wording. That is not
# a flaw to apologise for, it is the sharpest available test: if the frames come back
# tuskless and matching the reference, the reference is beating the prompt, which is
# exactly the property a consistency mechanism needs. If they come back with tusks,
# the prompt wins and the mechanism is not yet strong enough to carry a beat.
#
# ── NOT A PICK, NOT CANON. The reference itself is provisional under his delegated
# evaluation grant and his morning veto stands over all of it.
#
# $0 — local GPU on the rtx5090, no provider, nothing published, nothing assembled.
