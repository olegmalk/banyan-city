payload:
  C:\banyan-farm\ep2-b17-bigbody-plate-0816\fetch_plate.py: |-
    #!/usr/bin/env python3
    """Fetch the Mac-drawn whole-body plate and REFUSE on any sha mismatch.

    No model, no GPU, no spend. The bytes are the ones committed to
    origin/main, so the sha256 asserted here is verifiable against the repo
    by anyone.
    """
    import hashlib, os, sys, urllib.request

    OUT = r"C:\banyan-farm\ep2-b17-bigbody-plate-0816-out"
    RAW = "https://raw.githubusercontent.com/olegmalk/banyan-city/main/farm-out/ep2-b17-bigbody-plate-0816/"
    UA = {"User-Agent": "banyan-city-bigbody/1.0 (albert.numbro@gmail.com)"}
    WANT = [
        ("17-goodbye-bigbody-mac-plate-r3s1.png", "412633e28a5003d5438d85a7d47bd6fcd6ea50d87e47cd4e027ea08e5c572cef"),
        ("17-goodbye-bigbody-mac-plate-r3s1.yaml", "41b2749b649599ca0136b28f0221281e5485fe672a2021fe9e5e6c4321a15d6c"),
    ]
    os.makedirs(OUT, exist_ok=True)
    for name, want in WANT:
        raw = urllib.request.urlopen(
            urllib.request.Request(RAW + name, headers=UA), timeout=120).read()
        have = hashlib.sha256(raw).hexdigest()
        if have != want:
            sys.exit("!! SHA MISMATCH for %s -- refusing.\n   want %s\n   have %s"
                     % (name, want, have))
        with open(os.path.join(OUT, name), "wb") as fh:
            fh.write(raw)
        print("fetched %-42s %7d bytes  sha %s  OK" % (name, len(raw), have), flush=True)
    print("both files match their asserted sha256.", flush=True)
steps:
- name: fetch
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
