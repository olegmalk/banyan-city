# ep1 beat 10 — THE WORD "SWAYS" IS IN THE POSITIVE PROMPT. One sample that removes it.
#
# THE VERDICT. Roman, 2026-08-11, verbatim: "for beat 10 in both of the clips the
# saplings are wobbling too much." Both clips = 10-ltx-r2g-plate-s20260897.mp4
# (guidance 1.0) and 10-ltx-g20-plate-s20260897.mp4 (guidance 2.0). Same plate,
# same seed, same wording; only the scale differed. Guidance 2.0 is therefore
# ANSWERED AND REJECTED as a fix for this and is not repeated here.
#
# WHAT THE WOBBLE IS, AND IT IS NOT THE DEFECT ON RECORD. review/SHEETS records
# beat 10 as "the sprout apex climbs 181px in every round" — a monotonic rise, and
# the taste ledger's r1 measurement agrees (apex_rise_px: 181, 14.1% of frame).
# That is not what these two clips do. Tracking the leaf apex across all 65 frames
# of every beat-10 round on record, the current plate-conditioned rounds have a
# SMALL net rise and a LARGE oscillation: r2g nets 92px but ranges 292px with 12
# direction reversals; g20 nets 44px, ranges 248px, 11 reversals. In the frame
# strips the whole stem leans left, comes back, leans right, and the head bobs
# with it. The 181px climb was one-way drift; this is a back-and-forth. Roman is
# naming a different motion, and the plate conditioning is what changed it.
#
# IS IT SEED-SPECIFIC? NO — checked before spending the slot on a reseed. All six
# seeds on record (r2b s20260865, r2c s20260866, r2d s20260883, r2e s20260884,
# r2f s20260885, r2g s20260897) wobble. Amplitude varies — r2e and r2f are the
# calmest of the six — but looking at their strips, r2e's plant still translates
# steadily rightward across the shot and r2f's head changes its lean twice. There
# is no clean seed to pick. A reseed would spend the sample on a lottery ticket
# for a defect that is present in 6 of 6, so this job does not reseed: seed 20260897
# is held FIXED, the same seed as both clips he judged, so the pair is comparable.
#
# THE ONE CHANGE: the positive prompt's motion clause. Justification in one line —
# at guidance 1.0 the positive prompt is the ONLY channel that reaches the sampler
# (ltx_i2v.py:1001-1008, verified in the file today: do_classifier_free_guidance is
# guidance_scale > 1.0, so no uncond pass runs and the negative embeddings are
# never read), and the current positive prompt literally commissions the defect —
# "the tall grass around it sways in a light breeze" and "its two small leaves
# tremble very slightly". "Sways", "breeze" and "tremble" are scene-wide motion
# cues; nothing in the wording confines the wind to the grass, and the model is
# applying it to the stem. Every earlier round tried to stop the motion in the
# negative, which on this path was inert, while the positive kept asking for it.
# So: strike the breeze, the sway and the tremble; say the air is still and the
# sprout is motionless; leave the only moving things as dust motes and a shift of
# light, neither of which can move the plant. Nothing else changes — same plate,
# same seed, same 65 frames, same 8+3 two-stage, same distilled sigmas, guidance
# back to 1.0.
#
# THE NEGATIVE, and this is worth stating whatever the outcome. Beat 10's negative
# currently negates "frozen frame, still image, no motion" plus 静态/静止 (Chinese
# for "static"/"still"). Under LIVE guidance that pushes the model AWAY from
# stillness — precisely the wrong direction for a wobble, and it is what the g20
# arm was carrying when it failed to fix this. Those five terms are removed here.
# At guidance 1.0 this changes no pixel and so is not a second variable in the
# experiment; it is removed so the file is honest and so this text is safe to
# reuse if guidance is ever raised on this beat.
#
# THE RISK, named up front: the 2026-08-03 K recipe was rejected as "literally
# just frozen frames". Asking for stillness can overshoot into that. Dust motes and
# drifting light are kept explicitly so there is still visible life in the shot,
# and the answer is a look, not a number.
#
# NO METRIC RANKS THIS. The apex track above is used only to say WHAT the defect is
# and whether it is seed-specific — it chose nothing. On beat 14 the flow metric
# scored highest on the round where the sapling falls over (131e433), and the
# beat-04 arm it liked best hallucinated a phone. If a number and the picture
# disagree, the picture wins. This job produces one clip for Roman to look at,
# next to the two he has already judged.
#
# ONE SAMPLE. One beat, one wording change, one seed. Not a sweep, not a second
# beat, no batch (CLAUDE.md 2026-08-03 — the rule written after fifteen beats were
# rendered on an unapproved recipe).

