success: 'ONE 832x1216 png, judged at 1:1 and on a matched-scale sheet beside taste/refs/guard1-canon-founder-0822.png.
  THIS FRAME IS NOT THE BEAT -- IT IS THE INIT A COMPOSITOR WILL DRAW THE BARK SLAB INTO, so it is scored
  on the FIGURE and on the EMPTY HANDS and on nothing else. PRE-REGISTERED: (1) A WHOLE FIGURE IN A FIELD,
  not a portrait. (2) BOTH HANDS TOGETHER IN FRONT OF THE CHEST AND EMPTY, with the head down over them.
  Empty is the requirement: an object of any kind in those hands is a FAIL here, because the compositor
  needs clean pixels to draw into. (3) DAYLIGHT. r1 came back at night and r2 fixed it by moving the light
  into the positive; that clause is carried verbatim and a night frame means the clause did not carry
  without the second net holding the composition. (4) A GROWN MAN, five heads tall. (5) HE IS RECOGNISABLY
  GUARD 1: dark cropped hair, round wire-rim glasses. (6) DETAILED CINEMATIC ANIME, human style per canon.
  Flat or tag-sheet fails. (7) Cream shirt collar and WHITE SHOULDER SASH. (8) NOTHING GOBLIN: no green
  skin, no pointed ears. PRE-REGISTERED FAIL MODES. A GLOWING BALL IN THE CUPPED HANDS, which is what
  r1 drew with the board net at 0.5 -- if it comes back with the net REMOVED then the glow is the pose
  plus the lighting clause and not the scribble net, and the compositor paints over it either way. HANDS
  DROPPED TO THE SIDES, which r2 and r3 both did once an object occupied the chest; with no object asked
  for, that would mean the pose hint stopped binding. A PORTRAIT, which would be the adapter failure returning
  without an adapter and would be the most surprising result available.'
why: 'THE BOARD IS NOT A CONTROLNET PROBLEM AND THIS RUNG STOPS TRYING TO MAKE IT ONE. Three rungs bracketed
  the scribble net on this beat -- 0.50 (no object at all, a glowing ball in the cupped hands), 0.85 with
  the rectangle on the wrist line (a plank grown downward, standing in front of him like a post), and
  0.85 with it above the wrists (a lit white panel over his chest that ate the figure). The ladder rule
  closes at three and the finding is that this class of net renders a white stroke as LIGHT. So the board
  net is REMOVED. What this job renders is the INIT for a composite: the figure, in daylight, hands together
  and EMPTY at chest height. The slab is then drawn into those hands in PIL and settled with a 0.30 inpaint,
  which is the instrument that is four for four in this tree (beats 03, 13, 16 and 19 all got a plant
  no wording round could produce that way) and which beat 19 proved last night survives motion. AND THE
  FIGURE HALF IS KEPT BECAUSE IT WORKS: the pose route bound geometry three times out of three last night.
  THE ADAPTER ROUTE IS CLOSED BY MEASUREMENT. window4 and content on beats 05 and 06 -- opposite settings
  on both axes the sampler has -- all four returned the reference photograph''s crop and pose: a head-and-shoulders
  close-up with the hands up at the face, no board, no field. So this rung takes the PICTURE from a drawing
  and the MAN from the words, with no reference image anywhere in the job. Two nets, because a COCO-18
  hint has no keypoint for a plank and the board is this beat''s entire fault: openpose for the five-head
  figure and scribble for one rectangle exactly as wide as the skeleton''s shoulders. The scribble net''s
  known defect -- it traces whatever it can read -- is the feature here, because the thing being traced
  is a board and boards are rectangles. Both hints come out of one file and one geometry, so the prompt''s
  `as wide as his shoulders` and the drawing''s width are the same number. $0, ~3 GPU minutes. Full trace:
  pipeline/derive_b06_pose_0822.py and pipeline/author_b06_guard_pose_0822.py.'
