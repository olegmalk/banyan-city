one_sample_rule: 'ONE FRAME, ONE SEED, AND NOTHING SCALES OFF IT until it is looked at. The compositor
  step is not filed with this job: the slab can only be drawn once there are pixels showing where the
  hands actually landed. HISTORICAL NOTE FROM r1-r3. This is a new route -- a net that has never been
  used on this beat family, a second net composed with it, and two conditioning scales chosen rather than
  measured. Beat 05 needs exactly the same treatment with two skeletons and no board, and it is NOT filed
  until this frame has been looked at. That is the rule this repo wrote after fifteen beats were rendered
  on an unlooked-at recipe.'
chosen_not_measured: 'THE POSE SCALE, 0.8, carried unchanged from r1-r3 where it bound the figure three
  times out of three. HISTORICAL, r1-r3: THE TWO CONDITIONING SCALES. 0.8 for the pose and 0.5 for the
  board, against beat 08''s 1.0/0.6 composition. The board is deliberately the weaker of the two: a hard-traced
  rectangle would be a white box in a field, and what is wanted is a slab-shaped object in his hands.
  Neither number has a measurement behind it ON THIS BEAT and the bar says which way to move each one
  for each failure, so the sample aims the sweep instead of being the first step of one.'
