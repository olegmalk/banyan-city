bar:
  b0_the_stack_is_what_it_claims: 'VOID-CHECK, unchanged from the parent except the one number. Preflight
    prints `twins net verified`, `scribble net verified`, the line asserting the two nets share size and
    config and DIFFER in weights, and `staged driver, BOTH hints and BOTH references verified`. The sidecar
    must read `controlnet_2_conditioning_scale: 0.5` -- if it reads 0.3 the override did not take and
    the frame is a re-run of the parent -- with `controlnet_conditioning_scale: 1.0`, `seed: 20260819`,
    both hint shas and both capsule masks unchanged, and the prompt still carrying the grip clause.'
  b4a_the_board_AND_the_grip: 'THE WHOLE POINT, AND IT IS SCORED AS ONE CLAUSE BECAUSE THE QUESTION IS
    WHETHER THEY COEXIST. (i) A flat board or clipboard legibly drawn at the authored quad -- corners
    (608.6,660.5) (719.5,678.1) (697.7,816.2) (586.7,798.6), bbox x 583-723 y 657-820, top edge below
    the shoulder line y=491. Measured the way the parent''s loss was measured: FRACTION OF PIXELS IN THAT
    BBOX BELOW LUMA 80, against 0.758 when the board was present and 0.235 when it was gone. (ii) Separated
    digits at the board''s edge at 5x, on the far hand, with the board passing behind or between them
    rather than tucking under a rounded form. PASS needs BOTH. Board with a mitten repeats scale30 and
    is scored as such; fingers with no board repeats the parent.'
  b8_the_guard_has_hair: canon.yaml `ep2-guard-hair` -- guard B has light sandy hair, \bbald\b FORBIDDEN,
    and beat 08 is now IN that entry's scope as of 2026-08-20. THE INSTRUMENT NOW HAS TWO INPUTS AND THIS
    RUNG MOVES ONE OF THEM. It reads bald under conditioning load (1.0+0.8) and read bald again under
    prompt crowding (73 tokens at 1.0+0.3). This frame raises the conditioning while holding the crowding,
    so a bald guard here is EXPECTED if the two effects add and is the cheapest evidence that they do.
    Sandy hair at 1.0+0.5 with 73 tokens would mean they do not simply add, and that is worth as much
    as the board.
  b6_drawn_not_traced: 'THE CLAUSE 0.8 BROKE, AND 0.5 IS THE FIRST VALUE ABOVE 0.3 ANYONE HAS TRIED. Both
    figures read as DRAWN CHARACTERS at ep2-b08-twinsipa-0819''s standard: pupils and a set jaw, hair
    with strands where there is hair, folds in BOTH garments, a legible metal clasp, a drawn cuff, separated
    digits. At 0.8 this collapsed into one flat robe. If it degrades at 0.5 the usable range is narrower
    than 0.3-0.8 and the route needs to know before it tunes anything else.'
  b4b_both_arms_stay_on_their_skeletons: 'B4b-i: the pointing hand''s centroid within ~60 px of the authored
    wrist (280.5,695.1) -- twinsipa 40.3, boardnet 10.2, scale30 48.5, grip 41.2, never failed. B4b-ii:
    THE GUARD MUST HAVE TWO ARMS, both ending in drawn hands. boardnet lost the far arm into the robe
    at 0.8 and that is the specific 0.8 damage this value is testing the near edge of.'
  b7_no_limb_fragmentation: 'G-R at six regions, three per figure, EVERY BOX PLACED FRESH ON THIS FRAME
    and publishing coordinates, luma AND material. Within-figure spread <= 25.0; every guard region <=
    0.0, every goblin region >= +20.0. TWO STANDING ADMISSIBILITY RULES, both earned on this beat: boxes
    do not transfer between frames because wardrobe moves under them (scale30), and ON THE GUARD A COLOUR
    PREDICATE CANNOT DECIDE THE MATERIAL -- his cream shirt reads R-B 34.7 against his skin''s 42.6-49.7,
    and a colour-picked box landed on a sleeve at 100% ''pale'' (grip). Guard boxes are placed by eye
    at 5x and published with their R-B.'
  b2_the_identities_separate: Guard face <= 0.0, goblin face >= +20.0, separation >= +20.0. twinsipa +42.0,
    scale30 +60.6, grip +54.4. Same material-and-luma publication rule as B7.
  b4c_the_arm_belongs_to_the_guard: MUST SURVIVE. The pointing arm grows from the guard's shoulder and
    is human-skinned. Ten mechanisms have held it.
  b1_the_pair: 'TWO figures and only two, both whole, under figure_count_ruled_from_the_script_0817. AND
    EXACTLY ONE BOARD if a board arrives: the prompt names `clipboard` twice and a stronger object net
    is the condition under which that repetition could finally duplicate it.'
  b3_one_ground_plane: Both stand on the same grass. Read by eye if the automated detector is confounded
    by foreground grass.
  b5_no_colossus: Neither figure towers; twinsipa measured a stature ratio near 1.13 against the authored
    1.100. BULK is scored under B6.
not_done_on_purpose: 'ONE sample, ONE arm, ONE number. THE PROMPT IS NOT TOUCHED -- not one token, in
  either direction. Taking the nine words back out answers nothing, because that frame already exists
  and is ep2-b08-scale30-0820; leaving them in is what makes this a test of whether the board and the
  grip compete. No sweep: if 0.5 is wrong the next sample moves it once more. No per-net guidance window
  -- rung 17 excluded it. No figure ink in the board hint, which is what this rung''s failure would finally
  license as an argued lever. No change to either hint, the masks, the references, the ip-scale, the first
  net''s scale or the seed. No second seed. No third figure. No colour-cast fix. No pick, no plate_ack,
  no canon filename, no canon.yaml edit.'
rights_and_weights: THIS IS THE `licence_note`. Unchanged and clean. Base cagliostrolab/animagine-xl-3.1
  (CreativeML Open RAIL++-M). Net 1 xinsir/controlnet-openpose-sdxl-1.0 twins variant, apache-2.0. Net
  2 xinsir/controlnet-scribble-sdxl-1.0, apache-2.0, no attribution condition. IP-Adapter h94/IP-Adapter,
  apache-2.0. Both references are repo-internal crops. BOTH hints are authored in PIL from numbers --
  no annotator, so the lllyasviel/Annotators landmine is untouched by either condition. MistoLine is not
  used.
scoring_rule_pre_registered: 'THIS IS THE `verdict_rule`, WRITTEN BEFORE THE PIXELS.

  (1) BOARD BACK AND THE FINGERS KEPT, DRAWING INTACT -> the two clauses were competing for one budget,
  beat 08 has a COMPLETE plate candidate, and 0.8''s damage was the far end of a usable range rather than
  a verdict on composing two nets. Still NOT a pick and NOT a plate_ack; that is R4''s.

  (2) BOARD BACK, FINGERS GONE -> they compete and the budget cannot hold both. The object wins on this
  route and the grip goes to the hint, which is then an argued lever with evidence rather than a guess.

  (3) BOARD BACK, HAIR STILL BALD -> the object failure and the canon failure are INDEPENDENT: one is
  conditioning strength, one is token budget. Not a pass, and it splits the remaining work cleanly in
  two.

  (4) NEITHER BACK -> the second net cannot hold an object against a crowded prompt at any strength that
  leaves the drawing alone. The route stops tuning numbers; figure ink in the board hint becomes the named
  lever and it now has the argument the five tracing losses are owed.

  (5) THE DRAWING DEGRADES AT 0.5 -> the usable range is narrower than 0.3-0.8, which is a finding about
  the pair of nets that outlives beat 08 and constrains any other beat that wants a second condition.'
the_number_is_reasoned_not_measured: SAID PLAINLY SO NOBODY LATER CITES 0.5 AS AN OPTIMUM. 1.0+0.8 flattened
  the frame and killed the drawing. 1.0+0.3 leaves the drawing alone and is too weak to hold the object
  against a 73-token prompt. 0.5 is between them and nearer the value that works. That is an argument,
  not a measurement, and this sample is the measurement.
who_ruled_this_rung: 'ep2-b08-grip-0820''s own verdict, under `next_rung_named_not_taken`: "ONE sample,
  and the variable is --scale2, WITH THIS FRAME''S WORDING HELD... Holding the 73-token prompt byte-identical
  and raising --scale2 from 0.3 toward ~0.5 asks exactly that in one number." Route log pipeline/b08-arm-route-0819.md
  section 18 says the same. Fired immediately rather than left for a human hour: the card was measured
  IDLE with nothing claimed and nothing waiting, and this job has no dependency -- every weight is local
  and both hints already exist. Written in an `extra` key because `fresh` prose is retokened and a parent
  id there would become this job''s own id.'
why_these_key_names: '`scoring_rule_pre_registered` and `rights_and_weights` are this spec''s `verdict_rule`
  and `licence_note`. derive_spec''s FINDINGS_NAME guard refuses any extra key matching /verdict|licen[cs]/,
  which is right for findings and over-reaches on two house keys that must be written BEFORE the pixels.
  Same declaration the last four rungs made.'
