consumer: 'THE SAPLING LoRA v2 DATASET, and nothing else. This plate is step 1 of three: a figure-bearing,
  non-grass-ground plate here; `beat16_sapling_composite.py` draws the canon two-leaf sapling onto it
  at step 2 ($0, local, no GPU); one 0.30 SDXL inpaint finishes it at step 3. The finished frame enters
  `pipeline/lora/manifest-sapling.yaml` with a caption naming BOTH the ground material (`pale dry sand`)
  and the figure''s presence, and v2 retrains on it. IT IS NOT A BEAT CANDIDATE.'
success: ONE 832x1216 png at seed 20260823 carrying (a) A FIGURE THAT READS AS A FIGURE and (b) A ROOTABLE
  NON-GRASS GROUND PLANE the plant can stand on. Both are scored in `judge`. The goblin's DESIGN is not
  scored here and a design miss is not a fail -- see `what_is_not_scored_here`.
why: 'SAPLING LoRA v2, PLATE CELL g6.


  The palest ground in the set, and the hardest case for `foliage_palette`, which needs real plate greens
  to build the plant out of. The dune grass is there for that and the composite step measures whether
  it was enough instead of assuming it.


  THE GAP THIS BATCH EXISTS TO CLOSE, measured not asserted. v1 trained on 44 frames of which 44 are figure-free
  and 44 stand on grass. Bars B2_figure (0/3), B2_ground (4/6) and B3 (no-regression at 0.8, which DELETED
  a figure) all fail on those two facts and on nothing else -- the full score is in pipeline/lora/registry.yaml
  `bars_result` and the verdict page is review/ep3-sapling-lora-0822/SHIP-0822.md. This is a variety problem,
  so the fix is frames and not hyperparameters.


  THE ONE VARIABLE AGAINST ep3-saplora-figg6-0822 IS THE LOCATION CLAUSE (and, across the batch, the skeleton).
  The reference, the adapter, the adapter scale, head_frac 0.370, ControlNet 1.0 and seed 20260823 are
  byte-identical to w7a''s, so a plate that comes back wrong is attributable to the words that name the
  ground.'
