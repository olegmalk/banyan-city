item_18_scope: ZERO LTX PIXELS. This plate is SDXL text-to-image (animagine-xl-3.1) under ControlNet +
  IP-Adapter, and every frame downstream of it is that plate -> a numpy composite -> one SDXL inpaint.
  DECISIONS.md item 18 bans training on LTX frames specifically; the training job's stage step refuses
  any frame whose manifest does not assert an animagine chain. Item 18 is OPEN and is the founder's to
  rule on -- this records scope, it does not close it.
judge: "JUDGED AT 1:1, TWO CLAUSES, AND THE SECOND ONE IS THE RUNG.\n\n  J1 THE FIGURE. Is there ONE creature\
  \ in the frame that reads as a figure -- a head, a body, limbs, at the pose asked for? Design is not\
  \ scored (see below). Two figures, no figure, or a shape that does not resolve is a FAIL.\n  J2 THE\
  \ GROUND, and this is the whole point of the cell. Is the near foreground pale dry sand -- the MATERIAL,\
  \ readable as itself at 1:1 -- and is there an unoccupied band of it the plant can be rooted in without\
  \ touching him? A cell that returns A GREEN MEADOW has reproduced v1's own failure at the plate step\
  \ and is a FAIL; that is exactly what the LoRA did when asked for bare tilled earth.\n  J3 GREEN IS\
  \ PRESENT SOMEWHERE THAT IS NOT HIM. Step 2's `foliage_palette` builds the plant out of the plate's\
  \ own greens. If the only green-dominant pixels in the frame are the goblin's skin, the composited plant\
  \ will be built out of HIS colour -- the fusion defect v1 already has, arriving through the palette.\
  \ Each clause names a hedgerow, scrub, verge, moss, weeds, dune grass or ferns for this reason. RECORDED,\
  \ and the composite step measures it: C5 refuses the cell if the fill luma disagrees with the field."
post_ship_patch: review/ep2-ship-0821 IS NOT TOUCHED BY THIS JOB, and neither is any beat page. This is
  dataset material for a LoRA that has not passed its bars.
the_one_variable: THE LOCATION CLAUSE, `sitting on pale dry sand, green dune grass far behind, full body`,
  in place of w7a's `in tall grass`; and across the batch the SKELETON (sitfar50 here), which sets the
  figure's distance and side. Everything else in the recipe is w7a's.
the_rung_this_is_one_variable_from: ep2-b16-canon-w7a-0821 -- the plate that put ground in front of him
  after four cells of negative, four of distance clause and one of conditioning strength had all failed
  to. Its foreground band is what makes the pose route usable for a dataset at all.
what_is_not_scored_here: THE GOBLIN'S DESIGN. This is a dataset plate for a SAPLING LoRA, not a beat candidate,
  and the canon bar in ep2-b16-canon-w7a-0821 does NOT travel with it. The subject being trained is the
  plant; the figure has to be PRESENT so the trigger stops meaning `no figure`, and that is the entire
  requirement. A plate whose ears or eyes miss the founder's image is still a usable dataset frame and
  is NOT a candidate for any beat. Said here so a pass on this page can never be quoted as a pass on that
  one.
