failure_predicted_in_advance: "TWO, NAMED BEFORE THE RENDER.\n  1. THE LIGHTING/GROUND WORD LOSES TO THE\
  \ MODEL'S PRIOR. This is documented on this exact checkpoint: round 5 of the field batch asked for a\
  \ green meadow under `cold clear winter light` and got a SNOWFIELD (v10), and `alpenglow` got snow and\
  \ conifers (v14) -- the lighting word carried the ground with it. Here the ground word is the one that\
  \ must win, against a prior that has drawn tall grass on every plate this route has ever made. If a\
  \ cell comes back grass, the lever is NOT a negative (four cells of negative are already measured dead\
  \ against this route's composition) -- it is to make the material the SUBJECT of the clause rather than\
  \ its location.\n  2. THE ONLY GREEN IS HIM. See J3. The clause carries a green that is not the goblin\
  \ for this reason, and the composite step measures it rather than trusting it."
ip_adapter:
  ruling: 'FOUNDER RULING, 2026-08-21 16:54, and it is an IMAGE, not a sentence: taste/refs/goblin-canon-founder-0821.png,
    committed b93a70da, with "dude, this is how the goblin should look". It supersedes tile B and the
    08-21 age-B recipe on every axis it shows. See canon.yaml `ep2-goblin-design-adult` -> `founder_ruling_2026_08_21`
    and pipeline/jerry_canon_0821.py.'
  ref: farm-out/jerry-canon-assets-0821/jerry-canon-sq45-0821.png
  ref_sha256: 066e0457d060960e470c4ebc4f9936284b08e64550be8b89b1881dc7c7899a4c
  ref_provenance: 'goblin-canon-founder-0821.png cropped (187,110)-(677,483) -- the measured head box
    plus 18 px, WIDE because the ears project 27% of a skull width on each side -- background flood-filled
    with the image''s own field median (187,195,149), pasted CENTRED at 45% head-of-frame on a 448x448
    SQUARE canvas. Square is load-bearing: diffusers builds CLIPImageProcessor() with no arguments, which
    resizes the SHORT edge to 224 and CENTRE CROPS to a square, so only on a square canvas is the authored
    head ratio the ratio the encoder receives. Encoder coverage here is 28.3% and the subject touches
    no encoder edge (asserted by the builder, which returns 1 if it does). Rebuild with `pipeline/author_jerry_canonref_0821.py
    --head-frac 0.45`; assert with `--check 066e0457d060960e470c4ebc4f9936284b08e64550be8b89b1881dc7c7899a4c`.'
  mask: 312,134,778,530
  mask_frame: RENDER pixels, 832x1216
  mask_rule: DERIVED FROM THE SKELETON, not scaled from k6a's box. k6a's 315,130,515,350 was authored
    around a head_frac 0.190 skull whose ears 'barely break the silhouette'. At head_frac 0.370 the head
    alone is 360 px tall and the ears reach 449/300 of a skull width, so that box would sit inside the
