verdict_rule: >-
  WRITTEN BEFORE THE PIXELS, and all three branches close something. (1) If B2a
  AND B2b hold on the numbers AND the eye agrees, AND B1, B3, B4a, B4b, B4c and B5
  are all still PASS, the verdict is PASS: per-figure identity binding works on
  this stack, beat 08 has a complete recipe for the first time, and the next
  question is the THIRD FIGURE its done_when wants -- not another conditioning
  value. (2) If B2 holds but a carried clause breaks, the verdict is that IP-Adapter
  and ControlNet COMPETE at these settings, and the next rung is one sample at a
  LOWER --ip-scale (0.4-0.5) rather than a new mechanism; which clause broke names
  what the adapter overrode. (3) If B2 fails -- both heads still inside the green
  band, or separated by less than 20 levels -- the verdict is that MASKED
  IP-ADAPTER DOES NOT BIND IDENTITY ON THIS STACK, and that retires the mechanism
  rather than tuning it: the fallback is the two-pass per-figure inpaint graded in
  research §5, which is a separate job with its own bar. In branch (3) the sidecar
  is read first to confirm the adapter actually loaded, because "no effect" and
  "never applied" are different findings and the sidecar distinguishes them.

