independently_verified_pixels: >-
  THE EYE AGREES, which is the clause that decides it. Opened at full size beside
  the parent. Parent: two green figures, the guard a featureless green egg with
  closed eyes. This frame: a pale-skinned bald human man in a brown cloak with a
  gold clasp and a white sash, beside a green goblin with long pointed ears. He is
  unmistakably a different species from the figure next to him.
  THREE THINGS THE VERDICT UNDERSTATED OR OMITTED, none of which change the score:
  (1) THE GUARD IS BALD BECAUSE HIS REFERENCE IS BALD -- the positive prompt still
  says `light sandy hair` and the mask overrode it. That is the mechanism working
  as designed and it is the sharpest available proof that the mask beat the wording,
  but it also means this recipe CANNOT produce a haired guard while this reference
  conditions him, and ep2-b08-nobald-0817 exists on this beat. Whether bald is the
  wanted guard is a taste call, not a bar clause, and it is not made here.
  (2) B4b's aim is worse than "marginal" reads: the finger hangs vertically in the
  empty gap BETWEEN the figures, well clear of the goblin's silhouette, so the
  gesture does not point at anything. Scoring it a fail on aim is right; calling the
  clause overall MARGINAL is generous, and the posenet rung is the correct answer.
  (3) The guard's pointed ears are attributed above to the checkpoint's own goblin
  association. His reference's ears are near-human and much less pointed than what
  came back, so that attribution is supported -- but it is an eye call on a 370px
  crop, not a measurement, and it is recorded as such.
