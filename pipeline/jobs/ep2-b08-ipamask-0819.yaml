    comparable to six existing frames rather than to nothing.
    THE GREEN BAND WAS MEASURED, NOT CHOSEN. Every head this beat has ever judged
    "green with pointed ears" scored G-R >= +20.1 (r1 guard +44.3, r1 goblin
    +38.8, r2 guard +34.0, r2 goblin +29.4, r4 guard +38.9, r4 goblin +38.3, r5
