      B2a THE GUARD LEAVES THE GREEN BAND -- guard head G-R <= 0.0. His reference
          carries -19.1; every green guard so far measured >= +34.0.
      B2b THE TWO HEADS SEPARATE -- (goblin G-R) minus (guard G-R) >= +20.0. All
