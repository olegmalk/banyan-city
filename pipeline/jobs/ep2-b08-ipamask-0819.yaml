# BEAT 08, RUNG A -- MASKED IP-ADAPTER ON THE BEST FRAME THIS BEAT HAS PRODUCED.
# ONE SAMPLE. ONE ARM. ONE NEW MECHANISM, AND NOTHING ELSE MOVES.
#
# ============================================================================
# THE ONE VARIABLE
# ============================================================================
# Rung 2 (ep2-b08-cnetplate-r2-0819) is the best frame beat 08 has: B1, B3, B4a,
# B4b, B4c and B5 all PASS at conditioning scale 0.45 with the 7px contour hint.
# THIS JOB IS RUNG 2, EXACTLY, PLUS TWO MASKED IDENTITY REFERENCES.
#
#   held byte-for-byte: the hint (b08-pose-0819.png, sha 19cfad48...), the seed
#   (20260819), the conditioning scale (0.45), the positive prompt word for word,
#   the negative word for word, size 832x1216, 40 steps, cfg 7.5, the base
#   (animagine-xl-3.1), the ControlNet (xinsir scribble), the driver.
#   added: --ip-ref x2, --ip-mask x2, --ip-scale 0.7.
#
# Rung 2's own `next_rung_named_not_taken` ordered a scale drop to 0.25-0.30
# first. RUNG 3 TOOK IT AND IT FAILED: at 0.28 the staging collapsed -- colossus
# back, point on the goblin, guard's wardrobe on the goblin, board on a
# background figure. Sections 8-10 of b08-arm-route-0819.md then closed all three
# geometric axes. So the scale question is answered, 0.45 is the bracketed best,
# and identity is what is left. Section 10's closing paragraph says exactly that:
# "Identity is no longer blocked; it is simply the next open question... whoever
# takes it should know that geometric conditioning on this net will not help."
#
# ============================================================================
# WHY THIS MECHANISM, AND WHY IT IS NOT A GUESS WITH A GPU ATTACHED
# ============================================================================
# FIVE rungs, three scales, two stroke weights, two hint classes -> five pairs of
# green figures. The cause is not tuning and was named in advance every time: a
# contour says how tall, not WHICH BODY an attribute belongs to, so `green skin`
# enters CLIP's pooled embedding and lands on both. At 0.28 the guard's frozen
# wardrobe came back complete, well drawn, and ON THE GOBLIN.
#
# `pipeline/research/openpose-controlnet-sdxl-0819.md` §5 answers this OUTSIDE
# the repo and then verifies the answer INSIDE it, read-only:
#
#   - diffusers' own IP-Adapter guide has a Masking section whose worked example
#     is literally our case: prompt "2 girls", two reference images, two binary
#     masks, one per figure, `set_ip_adapter_scale([[0.7, 0.7]])`. Its own
#     Structural control section states IP-Adapter composes with ControlNet in
#     one pipeline. (MAINTAINER -- HF's docs, their with-mask/without-mask
#     figure is the evidence.)
#   - On OUR box, probed rather than assumed: diffusers 0.29.2,
#     `IPAdapterMaskProcessor` imports, and
#     `StableDiffusionXLControlNetPipeline.__call__` ACCEPTS `ip_adapter_image`.
#     One pipeline, pose control and per-region image conditioning, no community
#     pipeline and no version bump. (DEMONSTRATED.)
#   - `models--h94--IP-Adapter` is complete in the box cache: 0 .incomplete
#     files, 4 blobs, 4,074,282,584 bytes, including the ViT-H image encoder and
#     `ip-adapter-plus_sdxl_vit-h.safetensors`. (DEMONSTRATED.)
#
# So this is $0 with ZERO DOWNLOAD and it does not wait on
# ep2-b08-posenet-fetch-0819, which is queued alongside it and is a different
# question (does a POSE net read a skeleton) about a different blocker.
# The rejected alternatives are graded in that file's §5 and are not re-argued
# here: regional prompting via attention-coupling is SD1.5-only in diffusers,
# `mixture_tiling_sdxl` takes no ControlNet, Forge Couple and Regional Prompter
# are webui extensions and porting one is a project rather than a rung, and
# two-pass per-figure inpaint is a legitimate FALLBACK that costs two extra
# denoise passes and can break the pose it just established.
#
# ============================================================================
# THE THREE THINGS THAT WOULD HAVE MADE THIS WASTE AN HOUR, AND ARE ALREADY DONE
# ============================================================================
# 1. THE IMAGE ENCODER FOLDER. diffusers defaults
#    `image_encoder_folder="image_encoder"` and, when the name has no slash,
#    resolves it as Path(subfolder, name) -- `sdxl_models/image_encoder`, the
#    ViT-bigG encoder. `dir /s /b` on the box's snapshot lists FOUR files and the
#    only encoder among them is `models/image_encoder`, the ViT-H one every
#    `_vit-h` adapter requires. Under HF_HUB_OFFLINE=1 the default is a HARD MISS,
#    not a worse picture. A name WITH a slash is read as a full path, so
#    `models/image_encoder` is passed explicitly. Verified by reading 0.29.2's own
#    `IPAdapterMixin.load_ip_adapter` source on the box.
# 2. THE TENSOR SHAPES. The attn processor asserts
#    len(ip_adapter_masks) == len(self.scale) == len(ip_hidden_states), where
#    len(self.scale) counts ADAPTERS (one here) and each entry may be a per-image
#    list. So: one adapter, two images, scale [[0.7, 0.7]], and masks folded to a
#    ONE-element list holding a [1, 2, h, w] tensor -- which is exactly what the
#    docs' `masks.reshape(1, masks.shape[0], masks.shape[2], masks.shape[3])`
#    line does and why it is not cosmetic. Read from the 0.29.2 source, not
#    recalled.
# 3. THE CROPS ARE SQUARE. CLIPImageProcessor resizes the short side to 224 and
#    then CENTRE-CROPS. Feed it a 370x750 figure and the encoder throws away the
#    head and keeps the midriff, silently, with no sign in any sidecar. Both
#    references are 370x370 and `author_b08_ip_refs.py --selftest` asserts it.
#
# ============================================================================
# THE REFERENCES: ONE PLATE, TWO IDENTITIES, AND TWO CANDIDATES REJECTED ON PIXELS
# ============================================================================
# Both crops come from `farm-out/ep2-b08-boardcomp-0818/08-boardlowered-comp-0818.png`
# (sha 487ef4e8..., 832x1216) -- beat 08's OWN signed board-lowered composite,
# on which B1, B2, B3 and B5 all PASSED. It holds both characters, standing,
# adjacent, at one exposure, in one line weight, under one sky, so THE ONLY
# DIFFERENCE BETWEEN THE TWO REFERENCES IS THE IDENTITY ITSELF -- which is the
# variable. Two crops from two plates would also differ in lighting and palette,
# and any separation could be that instead.
#
#   guard  crop (430,120)-(800,490): bald human head, pale skin, brown cloak,
#          cream under-robe collar -- the frozen wardrobe, represented.
#   goblin crop  (60, 30)-(430,400): green head, long pointed ears, adult face,
#          teal robe collar.
#
# HEAD AND SHOULDERS, not full figures, for two reasons. B2 is scored on head hue,
# so the head is the payload; and `ip-adapter-plus` is the fine-grained variant
# that carries STRUCTURE, so a full-figure reference would be a third structural
# instruction competing with the contour hint and the prompt.
#
# REJECTED, having opened both: the b14 adult goblin plate
# (`farm-out/ep2-b14-mac-plate-0819/...r8s1.png`) is CROUCHING with the skull
# bowed to camera -- as a `plus` reference it fights the standing contour -- and
# its bowed crown catches a specular highlight that measures PALE PINK, so it
# would push the goblin's head AWAY from green, the opposite direction from the
# clause it was fetched to fix. And `review/ep2-picks/goblin-reference-0814/
# s{1,2}-head*.png` read CHILD (large eyes, small chin, chibi proportions) while
# `chibi` and `child` are both in this beat's own negative and B2's own wording is
# "an ADULT goblin".
#
# NO SPEND, NO PROVIDER, NO DOWNLOAD, NO CANON FILENAME, NO PICK, NO PUBLISH TO
# THE SITE, NO POST, NO ASSEMBLY. No video is encoded on this path, so no motion
# recipe's --image-crf reaches it.

