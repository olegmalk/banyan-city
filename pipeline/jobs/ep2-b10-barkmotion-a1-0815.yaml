#
#      **NO FORM -- 0:45-0:50**
#      "Guard 2 flips the clipboard around: the back is blank."
#      > GUARD 2: "There's no form for that. There's *barely* a form for the apple."
#
#    THE ACTION THIS JOB ANIMATES is the scripted one and nothing else.
#
# 2. THE PLATE IS THE THING THAT IS NEW, and it is why this lane exists.
#    A bark clipboard gates beats 06, 08 and 10. Four wording attempts and
#    twenty-three inpaint samples failed to put one in a frame. The method that
#    finally passed, tonight: composite procedural bark relief into the plate with
#    plain image processing ($0, no sampler), then inpaint at LOW strength. Beat 10
#    passed at strength 0.30 (7029e0ff), beat 06 at 0.30 (ec33a46a + 1de34880);
#    both failed at 0.45 the same way, the model reading a deep composited fissure
#    as an object boundary and splitting the slab.
#
#    THIS PLATE: lab/inpaint-b10/out/ep2-b10-barkboard-inpaint-0815-s13-composite-str030.png (commit 7029e0ff)
#    sha f5a5c1525f283e4c56ed3b9d46996e5cff1c333a3a9da09ecb244ac9e74d615b
#    ALREADY 704x1280 -- opened and measured, not assumed, so the cover-crop below
#    is arithmetically a no-op (scale 1.0000, centre box 0,0). The crop step is
#    kept anyway because it is also the SHA GATE: it refuses before anything is
#    written if the plate is not the frame that passed the bar.
#
# 3. WHAT IS BEING TESTED, AND IT IS NOT THE RECIPE. The recipe is closed:
#    704x1280, 97 frames, 24fps, two-stage (distilled sigmas, 8@352x640 + 3@704x1280),
#    image-crf 33, guidance 2.0, sequential offload. Every flag, the plate, its
#    asserted sha, the seed and the negative are shared byte-for-byte with the twin
#    ep2-b10-barkmotion-b1-0815. THE ONLY DIFFERENCE IS WHETHER THE ACTION
#    CLAUSE NAMES THE MATERIAL OF THE FACE THE TURN REVEALS:
#
#      arm B (unnamed, control):
#        "He turns the bark board around to face the camera, showing its blank back."
#
#      arm A (named):
#        "He turns the bark board around to face the camera; its back is the same rough bark, blank and unmarked."
#
#    Both beats turn the board so a face that DOES NOT EXIST IN THE PLATE comes
#    toward camera. The inpaint bought exactly one face. If the model fills the
#    other one with the navy clipboard, the white paper or the planed timber that
#    every one of the twenty-three failures reached for, four days of prop work is
#    undone in one denoise -- and that is a thing to find out on one clip rather
#    than at assembly.
#
# 4. THE STATE TAG LEADS, and that is not a preference. Beat 17 had 24 candidates
#    fail on "pushes himself up to standing" because the model rendered the verb's
#    END state; the state tag `sitting on grass` fixed it on the first sample. A
#    peer lost a whole render to a TRAILING framing tag and got a close-up with the
#    subject missing. So the pose the plate is already in leads the prompt:
#      "holding a rough bark board upright in both hands, two guards standing in a mown field."
#
# 4b. THE ACTION CLAUSE SAYS "THE BARK BOARD", NOT "THE BOARD", AND THAT IS A
#    CORRECTION MADE BY OPENING THE PLATE. Both plates hold TWO boards: the bark
#    slab, and the other guard's clipboard -- pale blue and fully in frame on beat
#    06, navy at the right edge on beat 10. A bare "the board" names neither, and a
#    take that turned the wrong prop would have been a wasted render that taught
#    nothing about the bark. The word is in BOTH arms, so the independent variable
#    is untouched: what separates A from B is still only whether the REVEALED face's
#    material is named.
#
# 5. THE NEGATIVE IS NOT EXTENDED WITH THE PROP'S FENCES, on purpose. It would have
#    been easy to add `chrome clip, white paper, planed timber` -- and then a clip
#    whose far face came up bark would prove nothing, because a negative that
#    forbids the failure cannot tell survival from suppression. It is byte-identical
#    to every proven motion clip in this tree.
#
# 6. SCORING. OPEN THE FRAMES. pipeline/coldread_frames.py, CONSECUTIVE strip -- the
#    motion metric is not admissible here: `cadence` reported 1.06x, "every frame is
#    new", on a clip holding every picture for three frames. Judge THE BOARD: where
#    is it at frame 0, at 24, at 48, at 96; what is its face made of at the last
#    frame; and is the turn done by the board or by the camera. Any claim about
#    scale or drift is made by ALIGNING frames, never by eyeballing a contact sheet
#    (a lane made that error twice on beat 13 and the second one reached a committed
#    spec before a subagent caught it).
#
# 7. WHAT IS *NOT* PROMISED. No wording arm on beat 13 produced a figure still
#    acting after frame 64 -- seven clips, five wordings, three seeds, blind "no" on
#    every one -- with the renderer's own log reporting a 13-latent-timestep ceiling
#    that a research lane is investigating now. These two beats are short prop
#    gestures, which is the best case for this engine, and the honest expectation is
#    a turn that completes early and then holds. A held tail is NOT a fail here. A
#    reverted face is.
#
# 8. FIRE ORDER. Third. One sample per wording, per the standing rule; seeds are
#    filed only after these four have been opened.
