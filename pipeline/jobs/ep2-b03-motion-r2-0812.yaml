# r2 2026-08-12. r1 failed on a prop I put in the prompt myself.
#
# r1's verdict: A PHOTOGRAPHIC TRIPOD STANDS IN THE FIELD and by frame 90 he has ducked
# behind it. The cause is this recipe's own style header -- "locked-off static camera on a
# fixed tripod" -- which is meant as a CAMERA INSTRUCTION and which the model rendered as
# SCENE CONTENT. Beat 03 is the beat that asks him to crouch behind something, so it took
# the nearest available noun, and the nearest available noun was mine.
#
# I THEN GOT THE FOLLOW-UP CALL WRONG TOO, which is why this note is long. On seeing r1 I
# judged the risk confined to beats that ask him to hide, and let the rest of the wave run
# unchanged. Beat 13 came back with him SITTING ON THE TRIPOD. Two of two wide beats drew
# it. b19 and b20 were pulled from ready before rendering and re-queued without it.
#
# THE FIX, one variable: "static locked framing, the frame never moves" replaces the
# hardware sentence in the positive, and tripod / camera / camera equipment / film
# equipment / stool go in the negative. Naming a defect in the negative at guidance 2.0 is
# the lever with the most measured wins behind it in this lane. Everything else -- same
# init, same sha, same seed, same 121 frames, same action text -- is untouched, so if the
# tripod goes the fix is attributable to this and nothing else.
#
# WHAT r1 ALREADY PROVED AND THIS DOES NOT NEED TO RE-PROVE: identity holds, he genuinely
# crouches, and the background painted itself in. The only open question is the prop.
