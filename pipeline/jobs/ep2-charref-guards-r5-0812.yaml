    dst = "C:/banyan-farm/courier-box/farm-out/ep2-charref-guards-r5-0812"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/wave-goblin-prep/out-charref-guards-r5/06-the-clipboard-wave1-s*.*"))
