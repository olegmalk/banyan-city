# EPISODE 2, BEAT 12 — RELATED. The 22-word cap fix, and NOTHING else.
# UNGATED, and explicitly so: STATE.md 2026-08-09 records the founder resolving
# beat 12 himself — "BEAT 12 — PROMPT-ONLY, UNGATED, RUNNABLE NOW", the still
# stands at b12-r4-s2, no founder gate on this half. Beat 16, the other half of
# that same ruling, IS gated (it needs the goblin drawn into the plate) and is
# therefore NOT in this batch.
#
# THE DEFECT. video_task.py:626 caps the anchor at 22 words:
#     anchor = " ".join(words[:22]) + ("…" if len(words) > 22 else "")
# Beat 12's anchor is longer, so the prompt the box actually rendered from —
# C:\banyan-farm\b12-promptfix-0809\12-prompt.txt, and the sidecar on the clip
# itself — ends:
#     "...utterly still, peach and gold morning sky…."
# Word 23 onward never reached the text encoder. What was lost:
#     "and drifting blurred clouds behind them, very slow push-in, cinematic
#      lighting, detailed, newest, masterpiece, best quality, very aesthetic"
# So the beat lost its background motion (the drifting clouds — the only thing in
# this shot that is SUPPOSED to move, since the leaves are meant to be dead still),
# its camera direction (the very slow push-in), and its entire quality-tag tail.
# Restoring them is mechanical: it is the direction the beat already owns.
#
# WHY THIS JOB IS DELIBERATELY NARROW. Beat 12's current clip is the output of a
# fix the FOUNDER resolved, and that fix was explicitly one variable: the character
# clause came out of the positive, "with the negative held byte-identical, so
# 'perfectly still' survives and the stillness classification is unchanged". Beat
# 12 also carries the same generic-motion-clause contradiction as beat 21 —
# "subtle continuous motion, gentle camera drift" against an anchor that says
# "utterly still" — and it is NOT being fixed here on purpose. That clause change
# is a recipe change; ONE SAMPLE (CLAUDE.md, founder 2026-08-03) says it gets one
# beat first, and that beat is 21, queued alongside this. If Roman likes beat 21,
# beat 12 gets the same clause next. Queueing both now would be scaling an
# unapproved result — the exact mistake the K recipe made across fifteen beats.
# So: motion clause byte-identical, negative byte-identical, plate byte-identical,
# seed byte-identical, frame count byte-identical. Only the truncated words return.
#
# LENGTH IS ALREADY CORRECT — 145 frames stays. clips/12-vo.json total_s 2.681
# against a 6.042s clip: fit_duration (render_t3.py:312) gives
# max(min(6.042, 4.681), 3.081) = 4.68s, so the clip is trimmed, never looped.
# There is no loop defect on this beat and the frame count is not touched.
#
# NEGATION. shots.md's beat-12 direction carries a long positive-side ban list
# ("no trunk, no ground, no fruit, no chibi, no mascot, no creature, no face, no
# other character, no city, no buildings"). Those are ALREADY correctly living in
# the negative — 12-negative.txt opens "trunk, ground, fruit, chibi, mascot,
# creature, face, other character, city, buildings, ..." — and they stay there.
# They are inert at guidance 1.0 (no unconditional pass on the distilled path;
# verified at source in the box venv, diffusers 0.39.0 pipelines/ltx2/
# pipeline_ltx2.py), but inert is strictly better than the alternative: put back
# in the positive they would feed the model "fruit", "face", "city" — and round 3
# of this very beat was rejected 4/4 for making a large pink ripe fruit the
# subject, with a face on it in s0 and a city skyline in s2. This beat is the
# repo's own best evidence for why bans do not go in the positive
# (DIAG-negation-in-positive.md, e4fbb65). The restored anchor text below contains
# no bans at all.
#
# NO METRIC RANKS ANYTHING (131e433). Read by eye, beside the existing clip.
# LICENCES: nothing new. LTX-2.3 distilled (LTX-2 Community License), on the box. $0.

