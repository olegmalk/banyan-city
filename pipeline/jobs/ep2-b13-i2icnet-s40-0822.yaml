bar: "TWO CLAUSES, AND THEY ARE SCORED SEPARATELY BECAUSE THE WHOLE POINT OF\nTHIS ROUND IS TO FIND OUT\
  \ WHETHER THEY CAN BOTH BE TRUE AT ONCE.\n\nTHE EYE IS THE CLAUSE. Read at 1:1 against\n`taste/refs/goblin-canon-founder-0821.png`\
  \ and nothing else -- not tile B, not\nround one, not a metric.\n\n  E1 THE EYE. Narrow almond, off-white\
  \ field, a TINY dark pupil, heavy upper\n     lid. Four vetoes were spent on this axis. A large round\
  \ iris of any colour\n     is a FAIL.\n  E2 THE SKULL AND EARS. Broad low dome; smallish pointed ears\
  \ NEAR HORIZONTAL,\n     not swept up and back.\n  E3 THE FACE IS SMOOTH. No brow furrows, no folds,\
  \ no jowls.\n  E4 PALETTE. Desaturated sage, washed and high-key -- not saturated kelly.\n  E5 COSTUME.\
  \ The shirt with its placket, dark shorts, dark boots.\n\nTHE POSE IS THE NEW CLAUSE, AND IT IS THE\
  \ REASON THIS ROUND EXISTS.\n\n  P1 IS HE SEATED? Hips down, knees up and apart, feet on the ground\
  \ plane --\n     the skeleton's stance. STILL STANDING is the null result for this round,\n     exactly\
  \ as it was the expected result for round one.\n  P2 DID HE ADOPT THE SKELETON OR JUST BEND? Compare\
  \ against\n     `farm-out/jerry-canon-assets-0821/jerry-canon-h37fsit-0821.png`. A crouch\n     that\
  \ is not the authored stance is partial adoption and should be reported\n     as partial, not rounded\
  \ up to a pass.\n  P3 HANDS CLASPED BETWEEN THE KNEES, which is both the skeleton's wrist\n     placement\
  \ and the founder's own wording for the beat.\n\nAND THE JOINT CLAUSE, WHICH IS THE VERDICT:\n\n  J1\
  \ DO E1-E5 AND P1 HOLD IN THE SAME FRAME? A frame that is seated with a\n     stranger's face is a FAIL.\
  \ A frame with his face still standing is a FAIL\n     for this round (it was a PASS for round one).\
  \ Only both is the route."
