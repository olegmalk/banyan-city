consumer: 'THE FOUNDER. Round one put his eye in an output for the first time in sixteen rounds and left
  one question open: at a strength low enough to keep his face, the init owns the composition and the
  figure will not move. Beat 13 is SEATED. This cell (s40) asks whether a skeleton can move the body while
  his face survives. If yes, this is the plate route for every goblin beat and b13+b14 derive immediately.
  If no, the face-versus-pose tension is measured on both curves and the next move is a LoRA on his pixels.'
success: ONE 832x1216 png at strength 0.40 in which E1-E5 hold against his image at 1:1 AND P1 says he
  is seated. Both halves in the SAME frame (J1). A seated stranger is a fail; his face still standing
  is a fail for this round.
why: 'ROUND TWO: THE INIT KEEPS THE FACE, THE NET MOVES THE BODY. THE CEILING, AND IT IS THE LAST SAFE
  CELL RATHER THAN A COMFORTABLE ONE. Round one measured the face breaking between 0.40 and 0.45, so this
  is the most denoising the route may buy. 0.45 is deliberately NOT rendered: it is on the far side of
  a measured break and re-testing it would spend a rung on a known answer.


  NO NEW TOOL. inpaint_fruit.py has taken ControlNet hints inside an SDXL inpaint pipeline since 2026-08-20,
  and round one established that an all-white mask on base weights makes that pipeline plain img2img.
  Together, at --pad-crop 0, that IS img2img plus ControlNet. This spec is round one''s command line with
  four flags added.


  THE CLOSURE STILL HOLDS. No face tag, no IP-Adapter, no reference re-crop -- there is no IP-Adapter
  anywhere in this spec and the negative carries no face term at all. A skeleton is not a face tag: it
  says where the body is, and it says nothing about his eye.'
