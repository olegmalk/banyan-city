consumer: 'THE 26:11 RATIO IN pipeline/lora/manifest-sapling.yaml. v2 is 37 frames over 15 plates and
  the lighting axis it just opened is four plates wide against eleven daylit ones -- its own record says
  so. Four more non-daylit plates is the cheapest thing that moves it, and the cells are chosen so that
  the ANSWER is worth as much as the pictures: each one deletes the word round 5 measured as carrying
  a ground material, from the cell it carried it into. What eats a passing plate is step 2 (pipeline/beat16_sapling_composite.py)
  and step 3 (pipeline/derive_sapling_lora_naturalize_0821.py). No cut, no beat, no promotion, $0 on an
  otherwise-idle card, and DECISIONS.md item 18 is open and is not touched by building the set the question
  is about.'
success: 'One 832x1216 png at seed 20260971, cel dialect, of a green meadow under ''overcast at dusk,
  the last grey light, no sun'' at ''wide shot'': STRAIGHT horizon, clean drawable ground plane in the
  lower centre, no plant, no figure, AND a GREEN-DOMINANT region in the lower half. The green is the whole
  question in three of these four cells -- v10 and v04 each returned a picture that was fine and had no
  green in it, and v01 returned green so blue the palette sampler found one pixel of it. A cell that comes
  back as generic daylight has also failed: the light must be READABLE as the named one.'
why: 'DELETES `deep blue twilight sky` FROM v01. v01 is the round-5 result that hurts most: it passed
  the eye and REFUSED at the palette sampler with ONE green-dominant pixel at RGB (2,7,2), because a blue
  key leaves no green to sample. Same time of day, grey key instead of blue. If this comes back green-dominant
  the dark end of the dataset gains dusk; if it comes back blue again the finding is that the checkpoint''s
  dusk IS blue and dusk is closed for this instrument.


  THE RECIPE IS NOT UNDER TEST. Rounds 1-4 settled it and round 5 spent it: the quality prefix, `no humans`,
  `wide shot` with NO `low angle`, the negative, the checkpoint, the size, the steps, the cfg, the staging
  and the nocontrol arm at 0.45 are inherited byte for byte from the round-4 control. The GROUND CLAUSE
  is frozen too, at `in a green meadow, distant hills` -- round 2''s depth lever, and the one phrasing
  that names no material. THE ONE VARIABLE IS THE LIGHTING CLAUSE, and every value is a round-5 clause
  with its suspect word removed.'
