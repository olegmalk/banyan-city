bar: "FOUR PLATES, JUDGED AS ONE CONTACT SHEET, BY EYE AT 1:1. THERE IS NO\nPLANT AND NO FIGURE IN ANY\
  \ OF THESE PICTURES AND BOTH ABSENCES ARE CORRECT.\n  D1 CEL, NOT PHOTO, NOT PAINTING. Flat fills, clean\
  \ ink linework, the\n     episode's dialect. This is the clause the ep2-b16-field batch lost all\n \
  \    four on, and it is the first one read. Bokeh, painterly rendering or a\n     photographic ground\
  \ plane REJECTS the plate -- you cannot draw a sharp\n     cel seedling into a soft foreground without\
  \ it reading as a decal.\n  D2 A CLEAN DRAWABLE GROUND PLANE in the lower centre, wide and tall enough\n\
  \     to root a sapling at plate scale. Blades of grass crossing it are fine.\n     A rock, a flower,\
  \ a shrub, a drawn plant or any structure is NOT: the\n     0.30 pass PRESERVES a structure it finds\
  \ in the init (12 of 40 steps from\n     a latent that still carries it), so the composite would have\
  \ to fight it.\n  D3 ZERO FIGURES. Not a goblin, not a human, not an animal, not a silhouette\n    \
  \ on the horizon. A plate with any figure in it is REJECTED AND DELETED,\n     not cropped -- this lane\
  \ may not render the scavenger and a frame that\n     contains him is not curated into a training set.\n\
  \  D4 THE LIGHT HAS A DIRECTION. beat16_sapling_composite.py measures the\n     plate's own low-pass\
  \ luminance gradient and carries it into the drawn\n     plant. A flat, directionless plate makes that\
  \ measurement a no-op and\n     the composite reads as pasted.\n  D5 THE PALETTE IS THIS SHOW'S. The\
  \ composite samples its greens FROM THE\n     PLATE, so an off-palette plate produces an off-palette\
  \ sapling and the\n     frame teaches the LoRA the wrong colour.\nNOT SCORED: whether the picture is\
  \ a good shot. None of these is a shot, none\nenters a cut, and none goes near review/ep2-ship-0821.\
  \ They are ground planes\nfor an instrument.\nNOT SCORED: variety WITHIN a cell. The variety this batch\
  \ is bought for is\nBETWEEN cells and it is measured at the manifest, not here."
the_one_variable: THE LIGHTING CLAUSE ('overcast at dusk, the last grey light, no sun'). The ground clause
  is frozen at 'in a green meadow, distant hills' and the framing at 'wide shot'; everything else is the
  round-4 control's.
this_cell: 'DELETES `deep blue twilight sky` FROM v01. v01 is the round-5 result that hurts most: it passed
  the eye and REFUSED at the palette sampler with ONE green-dominant pixel at RGB (2,7,2), because a blue
  key leaves no green to sample. Same time of day, grey key instead of blue. If this comes back green-dominant
  the dark end of the dataset gains dusk; if it comes back blue again the finding is that the checkpoint''s
  dusk IS blue and dusk is closed for this instrument.'
the_rule_this_batch_tests: 'A LIGHTING WORD THAT NAMES A SEASON, A TEMPERATURE OR A TIME OF YEAR CARRIES
  ITS OWN GROUND MATERIAL INTO THE FRAME; A LIGHTING WORD THAT NAMES ONLY A STATE OF THE SKY DOES NOT.
  Evidence it was drawn from, all round 5: `winter`+`snow peaks` returned a snowfield (v10), `alpenglow`+`peaks`
  returned snow and conifers (v14), `golden hour` returned tan macro grass (v04) and `hazy heat` returned
  an airbrush painting (v13) -- while `night, moonlight` (v02) and `storm clouds, a shaft of light` (v03)
  each kept a clean green plane and were the two best plates of the fourteen. Falsifiable in one batch:
  if w02 and w04 come back tan and white anyway, the season word was never the carrier and the rule is
  wrong.'
why_four_cells: This is a PROBE, not a breadth batch. Round 1 filed ten cells off a ratified recipe on
  the argument that only the words varied, and this lane's own record in review/ep3-sapling-dataset-0821/plates-0821.yaml
  says a four-cell probe would have found its failure for 40% of the card time. One clause is under test;
  four cells is what that costs. w03 is the CONTROL -- moonlight, which is already known to work -- so
  a batch-wide failure can be told apart from a rule being wrong.
failure_predicted_in_advance: 'FIRST, AND IT IS THE ONE THAT KILLS THE RULE: w02 AND w04 COME BACK TAN
  AND PALE ANYWAY. `low sun` and `cold clear air` may be all the checkpoint needs to reach for dry grass
  and snow, in which case the season word was a passenger and what actually carries the ground is the
  LIGHT TEMPERATURE itself -- warm light means dry, cold light means frozen -- and the honest conclusion
  is that this instrument''s usable non-daylit range is dark skies only, which is what round 5 already
  delivered.

  SECOND: w01 COMES BACK BLUE. The checkpoint may simply draw dusk as blue whatever the words say, in
  which case dusk is closed here and the dark end of the dataset is night and storm, full stop. That is
  a clean answer and it retires a cell that has now cost two rounds.

  THIRD, AND IT WOULD INVALIDATE THE BATCH RATHER THAN ANSWER IT: w03, the control, fails. v02''s words
  at a new seed producing a plate without a green plane would mean round 5''s passes were seed luck and
  nothing in this file''s reasoning is supported. Read w03 first.'
clip77_measured_not_estimated: prompt 35 of 77, counted offline on animagine's own vocab before this file
  was written; negative inherited from the round-4 control at 71 of 77.
