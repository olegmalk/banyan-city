why: RUNG w4, FOLLOWING v6. BREADTH - the beat 13 action, seated with knees drawn up. v6 took all four
  scoring clauses of the tile bar at beat 04's close-up -- blank slit eyes, no nose, a thin line mouth
  and a short low ear -- which is the first time this tree has drawn the founder's B tile creature on
  purpose at a tight crop. What it left behind is a costume tag painting stitches and a red patch ON THE
  SKULL, an unresolved two-tone clause that v7 tested three-at-a-time and therefore did not test, and
  no evidence at all that the recipe survives a different body.
bar: "THE SAME SIX-CLAUSE TILE BAR v6 PASSED, unchanged, read at 1:1 against\nreview/ep2-goblin-design-0819/adult-b19-0819.jpg:\n\
  \  T1 EYES   blank white, no iris, no pupil, narrow and slanted.\n  T2 NOSE   no bridge, no tip, no\
  \ drawn nostrils.\n  T3 AGE    no brow furrows, no folds, no jowls.\n  T4 EARS   short, low, swept back.\
  \ Long tapering spikes FAIL.\n  T5 SKULL  large smooth dome, no neck. Reported; v6 scored PARTIAL (round,\n\
  \            not tall) and nothing in this batch tries to move it.\n  T6 COLOUR two-tone, crown lighter\
  \ than the muzzle. Reported except on w3,\n            where it is THE clause under test.\nPLUS ONE\
  \ NEW SCORED CLAUSE, because the wedge found the defect and a follow-up\nthat does not measure it is\
  \ a waste of the card:\n  T7 SKIN IS NOT A COSTUME. No stitch marks, no seams and no patches ON THE\n\
  \     HEAD OR FACE. v6 has a red patch and two stitches on the skull. w1 and w2\n     each pass or fail\
  \ this outright; the other four report it.\nFOR THE THREE BREADTH RUNGS the bar is T1-T4 AND T7 at a\
  \ DIFFERENT body, and a\nfailure there is the more interesting result: it would mean the recipe is\n\
  pose-bound and the LoRA route is required rather than optional."
failure_predicted_in_advance: 'w2 BEATS w1. The mechanism is the word: `patchwork` is a

  texture-and-seams concept and the model is applying it to the nearest large

  surface, which at a head-and-shoulders crop is the skull. Ban et al. (ECCV 2024,

  arXiv:2406.02965) say a negative acts only AFTER the positive has drawn the

  thing and can even summon it early, so negating `stitches` while still asking

  for `patchwork` is asking the model to draw and then unpaint. If w1 comes back

  clean anyway, that is a genuine surprise and worth more than the fix.

  w3 FAILS T6 and the whole two-tone question dies with it. `two-tone skin` is

  18,474 posts and, on v7''s evidence, means DISCRETE REGIONS of two colours -- a

  pink patch -- not a gradient. The tile''s crown-to-muzzle falloff is almost

  certainly RENDERED LIGHT, not a skin attribute, and if w3 confirms that then T6

  should be struck from the bar rather than chased, because chasing it will keep

  producing two-coloured heads.

  THE BREADTH RUNGS ARE THE REAL RISK. v6''s pass came at a crop where the face

  occupies most of the frame; at full body the face is a few dozen pixels and the

  model has been shown all night that it draws a mask at that size. So w4/w5/w6

  are predicted to PASS T1-T3 easily and to be UNSCORABLE on T4 -- and the honest

  reading of an unscorable pass is that it tells us nothing about the ear, which

  is the attribute the LoRA exists to teach.'
one_sample_rule: SATISFIED. Six rungs, six different recipes-or-poses, ONE sample each, nothing promoted,
  no beat plate produced and nothing entering any cut. The breadth rungs render POSES, not beats.
publish_glob_fixed_here: The parent's publish step globs `-hintskel.png` while controlnet_plate.py:492
  writes `<task>-<arm>.png` and the arm is `nocontrol`. That one string made all eight wedge renders succeed
  rc=0 and all eight jobs report rc=1, with the pictures stranded on the box. Repointed here in both the
