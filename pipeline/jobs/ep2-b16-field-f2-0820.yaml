bar: "FOUR PLATES, JUDGED AS ONE CONTACT SHEET, BY EYE AT 1:1, AND AT MOST\nONE IS PICKED. This is a FIELD,\
  \ not the shot: the plant is not here yet and its\nabsence is not a fault.\n  F1 A CLEAN NEAR FOREGROUND,\
  \ lower-centre, wide enough and tall enough to hold\n     a seedling at plate scale. A blade of grass\
  \ crossing it is fine -- a rock,\n     a flower, a second creature or a drawn plant is not, because\
  \ the composite\n     would have to paint over a structure the 0.30 pass will fight to keep.\n  F2 HE\
  \ IS DEPTH, NOT THE SUBJECT. A seated figure, small, out of focus, read\n     at a glance as \"someone\
  \ is sitting back there\". IF HIS HEAD IS SHARP OR\n     FILLS ANY LARGE PART OF THE FRAME THE PLATE\
  \ IS OUT -- that is exactly how\n     the 0820 mac plates failed, twice.\n  F3 ONE FIGURE. Not two,\
  \ not a crowd.\n  F4 THE LIGHT HAS A DIRECTION and it is daytime. The composite step measures\n    \
  \ the plate's own low-pass luminance gradient and carries it into the drawn\n     plant; a flat, directionless\
  \ plate makes that step a no-op.\n  F5 CEL, NOT PHOTO. Same dialect as the rest of the episode.\nNOT\
  \ SCORED: the goblin's design. He is out of focus on purpose and no face tag\nwas used. A plate is not\
  \ rejected here for reading as the old design or the new\none -- if the creature ruling changes what\
  \ a blurred seated figure looks like,\nthat is a re-render nobody has to do.\nNOT SCORED: whether the\
  \ shot works. That question needs the plant in it and it\nbelongs to the composite rung, not to this\
  \ one."
failure_predicted_in_advance: 'F1, THE CLEAN FOREGROUND, IS WHAT I EXPECT TO LOSE. `field of

  tall grass` at 832x1216 puts blades everywhere by construction, and the near

  foreground is exactly where a sampler likes to put its biggest, sharpest

  blades. If all four come back with a busy lower-centre the fix is a framing

  word, not a fifth field: `from below` with the horizon higher gives more

  mid-ground and less near grass.

  SECOND: HE COMES BACK SHARP ANYWAY. `depth of field, blurry, out of focus` is

  asking a still model for a lens property, and the 0820 mac plates showed this

  beat''s specific gravity -- the goblin pulls focus here even when he is not asked

  for. If two or more plates give him a sharp head, the next rung composites him

  smaller rather than saying `blurry` louder.

  THIRD, AND IT IS THE ONE THAT WOULD CHANGE THE ROUTE: A PLANT ARRIVES UNASKED.

  `field`, `grass` and `outdoors` can summon a flower or a shrub into the near

  foreground. That is not fatal -- the composite mask covers it -- but a plate

  whose foreground already contains a plant makes the 0.30 pass argue with a

  structure instead of finishing one, and f3 is the variant most exposed to it.

  IF ALL FOUR FAIL F1 AND F2 TOGETHER, the honest read is that a text field plate

  is the wrong input and the composite should be built on an EXISTING beat plate

  that already has him seated at the right depth -- beat 15''s or beat 13''s, both

  of which are on disk and both of which already carry a composited plant.'
init_provenance: 'NONE, and that is the point: this is a text-to-image plate with no init and no plant.
  The canon sapling arrives in step 2 as drawn geometry, not as a sample, which is the whole reason the
  composite instrument exists -- the strongest wording available returned 0 of 16 frames with two leaves.'
not_done_on_purpose: 'No plant is prompted -- it cannot be drawn by words and asking would only put a
  wrong plant in the way of the right one. No face tags. No negative edit. No canon edit: sapling-cotyledon-shape
  is OBEYED here, not amended, and the licence option the founder was offered is still his to take. No
  cut change: beat 16 stays a slate. No edit to node.md, and none to pipeline/beat16_leaf_composite.py
  or ep2-b16-leafcomp-0820, which belong to the lane that built the big-leaf evidence.'
one_sample_rule: 'SATISFIED BY THE PARENT. The rule is one sample per RECIPE CHANGE and no recipe changes
  here: ep2-b04-tilefix-w2-0820 is the ratified still recipe, sampled fourteen times on 2026-08-20 (tileread
  v0-v7, tilefix w1-w6) with the pictures on /review/ep2-goblin-design-0819, and it has already been re-used
  unchanged across twelve Jerry tileset poses that are on disk in farm-out/. What varies here is the words,
  and four framings of one field is the plate batch episode-loop-v2 step 1 asks for.'
the_one_variable: THE PROMPT, and across the four jobs only its FRAMING CLAUSE. The quality, field, subject
  and depth clauses are byte-identical in all four; the seed walks so the set is not seed-degenerate.
  THE NEGATIVE IS THE PARENT'S BYTE FOR BYTE and nothing was added to it -- not even the plant words,
  because this tree's negatives have failed to hold position three for three and the composite's mask
  covers the foreground regardless. Checkpoint, size, steps, cfg, controlnet arm and scale are the ratified
  recipe's.
the_plate_is_step_one_of_three: STEP 1 OF THREE. (1) this field, by text, no plant in it. (2) the canon
  two-leaf sapling DRAWN into the picked field by a local numpy/PIL pass -- the b19/b03/b13 instrument,
  procedural and not a photograph, fitted to the object and not to the mask, with the plate's own measured
  light carried into it -- then ONE 0.30 inpaint to make it belong. (3) one i2v motion sample off the
  finished plate, with the scavenger's blur stated as depth. Steps 2 and 3 are separate rungs with their
  own specs; this job is not any of them and must not be read as one.
why_no_face_tags: 'The ratified core carries `blank eyes, tsurime, jitome, no nose, closed mouth, :|,
  expressionless` and EVERY ONE IS DROPPED here. Not a canon dodge -- they describe a face this shot does
  not show. The brief asks for him BLURRED BEHIND the plant, the two 0820 mac plates failed by handing
  his sharp head the whole frame, and naming seven face attributes is an instruction to draw a face. It
  also keeps this lane off the creature-vs-adult question the peer lanes own tonight: at this scale and
  this blur the design barely reads, so whichever way that lands, a picked field plate does not have to
  be re-rendered.'
