why: $0, ~3 minutes, and it is the cheapest half of the restage. The composite instrument has to be fitted
  to a SPECIFIC plate -- beat 19's leaf tips are hard-coded to its plate -- so picking the field before
  writing the geometry is the difference between writing that geometry once and writing it four times.
  T. The recipe is unchanged from a still family sampled fourteen times on 2026-08-20 and already re-used
  across twelve Jerry tileset poses, so a bad result here is attributable to the words.he same low camera
  with the horizon dropped and sky behind him -- a seedling silhouetted against sky separates from the
