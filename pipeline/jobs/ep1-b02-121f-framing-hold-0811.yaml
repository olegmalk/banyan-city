# Beat 02, 121 frames, FRAMING HELD. Roman 2026-08-11: "rerender beat 02 without
# doing a crazy perspective change."
#
# WHAT ACTUALLY MOVED — measured on the two clips, not inferred. The brief this
# job answers assumed the rejected 121f clip and his 2.542s pick were the same
# plate and seed at different lengths, so that length alone must have moved the
# camera. That is false, and the correction matters because it changes the fix:
#
#   his pick   review/provisional-v35/clips/02-three-oh-seven.mp4
#              Wan-AI/Wan2.2-TI2V-5B, seed 20260807, guidance 5.0, 14 steps, 61f
#   rejected   review/tonight/02-three-oh-seven-LTX-121f.mp4
#              LTX-2.3-Distilled, seed 20260902, guidance 1.0, 8@352x640+3@704x1280, 121f
#
# Different engine, different seed, different guidance, different prompt. Length
# is the one thing that did NOT cause the perspective change, and this is not the
# beat-07 unprompted-pull-back effect either.
#
# THE DIVERGENCE IS FRAMES 1-4, AND IT IS A COMPOSITION BREAK, NOT A DRIFT.
# Frame 0 of the rejected clip is the plate: the engineer close, front-right,
# face lit pink by the monitor, glasses catching the glow. By frame 2 the camera
# is already behind him; by frame 4 it has settled into a wide over-the-shoulder
# back-of-head silhouette with the whole monitor and a cool green window visible.
# Frames 4-120 then hold that new composition rock-steady. So the camera lock
# WORKED — it locked onto the wrong shot. The model spent four frames travelling
# to a composition the prompt told it to make, then held it.
#
# WHY IT TRAVELLED THERE: the prompt's subject tail described a different shot
# than the plate. It read "one seated figure seen from BEHIND as a dark
# silhouette against the screen" — which is beat 02's shots.md direction
# (shots.md:31-37, "over the shoulder"), not the picture being conditioned on.
# The plate, genomes/.../stills/02-three-oh-seven.png, is the close front-right
# view with his face visible. Asked for a from-behind wide while handed a
# close-up, LTX obeyed the words and moved the camera. Nothing else needed to go
# wrong.
#
# AND THE LOCK CLAUSE ITSELF CARRIED NEGATIONS, on the only channel that is read.
# At guidance 1.0 the negative is never sampled (ltx_i2v.py:1001-1008; verified at
# source in the box's diffusers 0.39.0 in ep1-b13-217f-vo-length-run.yaml:61-70:
# do_classifier_free_guidance = (guidance_scale > 1.0) or (audio_guidance_scale >
# 1.0), audio defaults to the video scale, we send 1.0). So the positive is the
# whole prompt, and "the camera NEVER MOVES and the frame NEVER CHANGES" delivers
# `camera moves` and `frame changes` — the confirmed defect in
# DIAG-negation-in-positive.md (e4fbb65), which counts 26 of 38 LTX positives
# carrying one. Both faults are fixed below; the subject tail is the bigger one.
#
# THE PROMPT DIFF, VERBATIM.
#   REMOVED (negation, and a room-level lock that never named the shot):
#     "a completely static locked-off tripod shot of a fixed dark room, the
#      camera never moves and the frame never changes"
#   REMOVED (the composition break — described the shot the plate is NOT):
#     "one seated figure seen from behind as a dark silhouette against the
#      screen, glasses, messy hair"
#   ADDED: the affirmative lock in the wording that worked on beat 14
#     (ep1-b14-v34-motion-r3.yaml:132 — "the camera is locked on a tripod and
#     stays perfectly still, ... stays centred in frame at the same size
#     throughout, ... the composition is identical in every frame"), retargeted
#     to this beat's subject, plus a subject tail that describes the PLATE.
#   NOT COPIED: beat 14's figure-ban tail ("no human, no person, no man..."). This
#     is the one beat in node 001 with a person in it on purpose, and those are
#     negations in the positive besides.
#
# THE FRAME COUNT IS ARITHMETIC. No loop needs the clip to cover its slot:
# render_t3.fit_duration (render_t3.py:312) returns
# round(max(min(cdur, vdur+2.0), vdur+0.4), 2). Beat 02's VO is 4.451s
# (review/provisional-v35/clips/02-vo.json total_s), so the floor is 4.851s and
# the ceiling 6.451s. LTX wants 8n+1:
#     113 -> 4.708333s   BELOW the 4.851 floor. Rejected.
#     121 -> 5.041667s   clears the floor; round(5.041667, 2) = 5.04 <= 5.041667,
#                        so `dur` rounds DOWN. Nothing wraps. CHOSEN.
#     129 -> 5.375s      clears the floor too, and is REJECTED on the rounding
#                        trap: round(5.375, 2) = 5.38 > 5.375. render_beat feeds
#                        `-stream_loop -1` into `trim=duration=5.38`
#                        (render_t3.py:627-631) against a 5.375s source, so 0.005s
#                        — one frame — of frame 0 wraps onto the end. That is the
#                        1-frame flash video_duration() documents at :264-271.
#   121 is also far under the 385f host-RAM ceiling measured on this box.
#
# ONE VARIABLE, AND WHICH SPEC WAS COPIED. Everything below is
# ep1-b02-121f-vo-length-run.yaml verbatim — same plate step, same cover-centre
# crop, same 121 frames, same seed 20260902, same steps, same guidance 1.0, same
# two-stage distilled schedule — except the positive prompt and the output name.
# The prompt is the single variable against the clip he rejected.
#
# ON "SAME SEED AS HIS PICK", which this job cannot honour and should not fake:
# his pick's seed is 20260807 on Wan2.2-TI2V-5B. A seed does not carry across
# models — 20260807 on LTX is an unrelated draw — and his pick's guidance 5.0 is
# incompatible with the distilled 1.0 path. Holding the rejected run's seed is
# what makes this a one-variable test of the prompt fix; matching the Wan seed
# would change the engine, the schedule and the length all at once and prove
# nothing. Flagged rather than silently resolved.
#
# NO METRIC PICKS ANYTHING. The flow metric is disqualified on this series
# (131e433 — it scored highest on the beat where the plant fell over). By eye.

