# beat field is verified 4 here (it was silently 4 on every job in this family and wrong on
# all of them but this one). And "on a fixed tripod" is OUT of the positive with tripod and
# camera equipment banned in the negative — beat 03 rendered that phrase as an actual
# tripod standing in the field, so it is a known prop-injection risk and not a camera
# instruction the model can be trusted with.
