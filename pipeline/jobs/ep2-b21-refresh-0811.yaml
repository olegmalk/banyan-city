# The 0811 date in the id is the lane's, not the clock's; the sibling refresh ids
# all carry it. Last of the three beats that had no block in wave-drafts.yaml.
#
# NOT TO BE CONFUSED WITH `pipeline/jobs/ep2-b21-stillair-fullanchor-0811.yaml`,
# which is a different job on the same beat and is not touched by this one. That
# is an LTX-2.3 video job — it re-renders the 6-second clip off an existing plate
# with an affirmative stillness clause, because the old prompt asked for
# "continuous motion, gentle camera drift" on the one beat whose whole subject is
# stillness. This is a four-seed SDXL STILL round in the wave harness, against the
# eight still candidates on the picking page. Different renderer, different
# output directory, different question — and the two do not interact, because the
# video job conditions on a plate that already exists and this one draws new
# frames from text.
#
# ── NO FOUNDER WORDS ON THIS BEAT, AND THAT IS SAID PLAINLY ───────────────────
# Beat 21's only recorded verdict is the steward's: "Provisional pick r3-s3, the
# steward's guess, logged 2026-08-09 at 0.50 confidence — the highest of the
# three, which still means it is a guess. Waiting on you." He has spoken on beats
# 01, 13, 15 and 16 and not on this one. Nothing below is his.
#
# ── WHAT THE EIGHT FRAMES ON DISK SHOW, READ BEFORE THE FIX WAS WRITTEN ───────
# `review/ep2-picks/sheets/b21.jpg` opened and looked at, r1 and r3, all eight:
#   * A HUMAN HAND IS IN FOUR OF EIGHT, AND IT COSTS THE WHOLE BEAT. r1-s1 reaches
#     an open hand in from the right with every finger drawn; r3-s0 cups the
#     sprout in a palm; r3-s1 holds the stem at its base; r1-s0 puts a large pale
#     limb behind it. This beat is the series' signature gesture — "the first
#     thing he has ever moved on purpose" — and a hand in the frame says something
#     else moved it. There is no version of this shot that survives a hand.
#   * A BIG GLASSY TEAL ORB sits at the base of the leaf in r1-s2 and r3-s2. Same
#     fault beat 20 was fixed for tonight ("a ritual orb where the fig should
#     be"), arriving here on a beat that has no fruit in it at all.
#   * THE SKY IS DEEP PURPLE-BLACK NIGHT IN FOUR OF EIGHT — r1-s0, r1-s3, r3-s0,
#     r3-s3, each with a thin sunset rim. `Low amber light` came back as after
#     dark.
#
# ── THE FIX, AND WHAT EACH TERM IS AIMED AT ───────────────────────────────────
#  1. THE HANDS. `the plant alone in frame` affirmatively, `no hands, no fingers`
#     in the negative. Both halves, because "anime sprout cupped in a palm" is a
#     very strong checkpoint prior and the guard beats taught that an affirmative
#     alone does not hold against one. `no face, no girl, no child` ride with
#     them. NOT `no boy` and NOT `no person`: check() faults on those
#     unconditionally ("peopled beat negates its own subject"), a rule written for
#     the fifteen goblin beats, so this beat renders with a weaker people-defence
#     than a plant-only plate would normally use — a real and stated cost of
#     borrowing this harness, the same one beat 01 and beat 18 pay.
#  2. THE ORB. `no glowing orb`, the term beat 20's refresh used tonight for the
#     identical object.
#  3. THE NIGHT SKY. `no night, no dark` — AND NOTHING ELSE FROM THE EIGHT-TERM
#     BLOCK, for the opposite reason to beat 18's. `Low amber light` IS
#     golden-hour light, so `no dusk, no sunset` would forbid the staging itself.
#     Only the two terms the four purple-black frames earned are sent. Beat 15's
#     precedent, not beat 17's.
#
# `no many leaves` IS DELIBERATELY NOT SENT even though several frames give the
# plant four or five leaves and beat 01 carries that term. Beat 21 asks for ONE
# leaf to TILT; it does not ask for a plant with one leaf, and the sapling this
# show has established has two cotyledons. The affirmative `one oversized leaf`
# states what has to read, and banning the plural would fight the plant's shape.
#
# THE STILL CANNOT SHOW A TILT AS MOTION AND THAT IS NOT PRETENDED. What four
# frames can show is a leaf ALREADY tilted to one side with nothing touching it,
# which is the composition the video beat then has to animate. If a frame comes
# back with a perfectly upright leaf that is a miss and should be reported as one.
#
# `kind: guard` IS A HARNESS TOKEN AND NOT A CLAIM ABOUT THE PICTURE. There are no
# guards in beat 21 and no goblin either — STATE.md 2026-08-09 lists this beat
# with 01 and 18 as the ones that "name nobody". `guard` is the only kind
# render_wave_sample.py:193 accepts without a {{GOBLIN}} marker, and its
# `extra_neg: guard` tier sends neither the fusion tags nor the species tags,
# which is right for a frame with no character in it.
#
# ── MEASURED ON THE BOX'S REAL CLIP TOKENIZER, FIRST DRAFT, NO REFUSALS ───────
# `--dry` on the box, quoted rather than summarised:
#   positive tokens (real CLIP): 59/77   STYLE ANCHOR PRESENT: True
#   count tag: '' (draft declares '')            'text' negated: True
#   negative: recipe 75 -> sent 72       DRY OK, no faults
# THE LEANEST NEGATIVE OF THE THREE BEATS IN THIS LANE: NEGWARN drops exactly ONE
# house term, `realistic skin texture`. `extra limbs` and `deformed` both survive,
# which is worth naming on the one beat of the three whose main fault is a drawn
# human hand — the two terms that fight malformed anatomy are still in the string.
#
# WHY THIS IS ONE SAMPLE AND NOT A BATCH. CLAUDE.md, founder 2026-08-03: one
# sample per recipe change. One recipe change, one beat, four seeds.
#
# SEPARATE OUT DIRECTORY: the harness names files from the beat slug, so this
# writes to `out-b21-refresh` and overwrites neither r1 nor r3.

