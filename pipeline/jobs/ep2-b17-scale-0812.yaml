# 2026-08-12. Does a clause pin SHOT SCALE the way a clause pinned the world?
#
# b17-world answered his blank-background note completely: one descriptive paragraph turned
# a flat field into a composed place -- foreground daisies, meadow running back, treeline,
# haze, raking light and long shadows. It cost one thing, and the cost is not a matter of
# taste: HE CAME OUT SMALL. Beat 17''s own approved fence says "Camera on him standing to
# leave", so a figure that reads as a dot in a meadow CONTRADICTS THE SHOT AS WRITTEN. That
# makes this a mechanical fix, not a framing preference.
#
# WHAT IS BEING TESTED, precisely: whether shot scale can be pinned BY A CLAUSE at all --
# the same mechanism that has now placed seven named things in seven attempts. It is NOT me
# choosing the framing. How large he should be is his, and if a clause turns out to work,
# the dial is his to set.
#
# SINGLE VARIABLE against b17-world: the size-pinning sentence is added at the head of the
# subject clause ("medium shot, the camera is on him, fills the middle third of the frame
# head to foot, face and hands read, the meadow BEHIND him not between him and camera") and
# the negative gains wide shot / extreme long shot / tiny distant figure / aerial. The
# entire environment paragraph is untouched, so if the world survives at the new scale the
# two clauses compose, and if the world flattens again they trade off -- which is itself
# the answer to whether this recipe can hold both.
