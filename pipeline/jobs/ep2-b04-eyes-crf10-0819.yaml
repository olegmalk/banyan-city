bar:
  e1_the_eyes_travel: 'The eyes visibly move to one side, hold, and come back. Read at 1:1 on the actual
    frames. THE PRE-REGISTERED MOST LIKELY FAILURE IS THAT THEY DO NOT: the parent''s win was an eye close-and-reopen,
    which is a LID movement, and a lateral GAZE shift is a different and smaller motion. If E1 fails while
    E2, E3 and E4 pass, the finding is that this engine moves lids and not gaze, and the next rung is
    a lid-based reading of the same beat -- a slow blink under held breath -- not a fifth wording.'
  e2_mouth_shut: Closed for all 121 frames. Beat 04 has no line; an open mouth is a speech cue and would
    have to be cut.
  e3_identity_holds: 'Same adult goblin at frame 121 as at frame 1 -- green, bald, long pointed ears.
    This is the clause --image-crf 10 exists to protect: at 33 the parent''s man was a different, younger
    person by frame 21, and a drift toward a CHILD here would re-open the exact question the founder just
    closed.'
  e4_camera_locked: No pan, tilt, dolly or zoom. Inherited clause; the parent held it.
failure_predicted_in_advance: The gaze shift (F2). The parent proved LIDS move; nothing in this repo has
  yet shown a lateral GAZE travelling on this engine, and the two are not the same motion. Named here
  so that if it comes back frozen-eyed the result is a finding about the engine rather than a disappointment
  about the beat.
init_provenance: 04-the-footnote-mac-plate-r1s1.png, drawn on macbook2 2026-08-19 from DRAFTS[4] at seed
  20260819, on the founder-ratified adult wording. Judged the best frame of the re-render wave and the
  wave's control -- the only one of four beats with no plant in it and the only one that landed. sha256
  5dd35da5...4350, verified byte-for-byte on the Mac and on the box before this spec existed, and asserted
  again by the crop step at run time.
not_done_on_purpose: 'No recipe change of any kind -- size, frames, fps, guidance, sigmas, two-stage,
  offload, mode and --image-crf 10 are the parent''s. No second seed. No crf sweep: 33 is established
  wrong and 10 is established workable, and the optimum between them is not this beat''s question. No
  pick, no plate_ack, no cut, no publish.'
pre_registered_fail_modes: F1 FAIL-FROZEN -- nothing moves at all, and on this beat that is a failure
  and not a safe outcome. F2 GAZE-DOES-NOT-SHIFT while the rest holds (see e1, the most likely). F3 the
  mouth opens. F4 identity drifts toward a human or a child. F5 the grass animates and the face does not,
  which would read as wind rather than as a performance.
