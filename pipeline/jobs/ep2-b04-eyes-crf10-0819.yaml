not_done_on_purpose: 'No recipe change of any kind -- size, frames, fps, guidance, sigmas, two-stage,
  offload, mode and --image-crf 10 are the parent''s. No second seed. No crf sweep: 33 is established
  wrong and 10 is established workable, and the optimum between them is not this beat''s question. No
  pick, no plate_ack, no cut, no publish.'
pre_registered_fail_modes: F1 FAIL-FROZEN -- nothing moves at all, and on this beat that is a failure
  and not a safe outcome. F2 GAZE-DOES-NOT-SHIFT while the rest holds (see e1, the most likely). F3 the
  mouth opens. F4 identity drifts toward a human or a child. F5 the grass animates and the face does not,
  which would read as wind rather than as a performance.
