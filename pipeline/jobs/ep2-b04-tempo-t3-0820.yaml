not_done_on_purpose: 'No new action -- the founder''s pick stands and this is a tempo adjustment inside
  it. No numeral. No negative edit. No crop, crf, guidance or sigma change. No goblin-design change. No
  cut swap: beat 04 still ships b04-refire-0814 as best-available with its fault named, and no clip from
  the peek batch was picked either.'
pre_registered_fail_modes: T-JITTER the speed words buy a vibrating head instead of a faster trip; the
  likeliest, and it closes the tempo axis. T-NOCHANGE `quick` is too weak and all three look like s1's
  single slow arc. T-ONETRIP one fast trip then a settle -- a partial, meaning speed bound and repeat
  did not, and the next lever is the END placement rather than the tempo. T-PAN the camera moves, as it
  did on s5; T0 exists so this cannot be mistaken for travel. T-SMEAR speed words pull smeared frames
  even though `motion blur` is in the negative; a first draft of this positive said `his head a blur of
  movement` and that phrase was REMOVED before filing rather than shipped and explained -- a positive
  that contradicts its own negative is not a controlled variable, which is the peek batch's own lesson
  one rung earlier.
the_design_note_up_front: THE INIT IS THE SUPERSEDED ADULT MAN, as it was for the whole peek batch. The
  founder ruled on 2026-08-20 that the goblin must read as the B tile's CREATURE; beat 04 is on the re-render
  list for it and this rung does not address it. The question here is tempo, which is a fact about the
  engine and separable from which face is on the plate. Not a plate pick.
the_one_variable: THE TEMPO OF THE ACTION CLAUSE. s3's positive asked for a lean that 'repeats'; this
  asks for one that is QUICK, SHARP and NERVOUS and lets the count follow from the speed. The middle and
  end placements are kept and re-pointed at the faster motion. Identity, camera, mouth, crouch and quality
  clauses are s3's byte for byte. THE NEGATIVE IS UNTOUCHED, still with `drifting sideways` and `moving
  to a different spot` deleted and nothing added, exactly as the peek batch left it. Init, sha, crop,
  size, frames, fps, guidance, sigmas, two-stage and --image-crf 10 are s3's. Across the three jobs only
  the seed differs, and t1's is s3's.
why_an_adjective_and_not_a_number: Because the number is measured not to bind. Cardinality is Class A
  in pipeline/composite-init-pattern.md -- no continuous encoding, CLIP's numeral embeddings near identical,
  and this repo's own frames put the strongest available count wording at 0 of 16. The SAME study found
  a continuous adjective (height) binding 3 of 4 in the same batch. `twice` is the obvious word and spending
  a rung on it would re-run an experiment already paid for; a shorter trip is how two of them fit in five
  seconds.
