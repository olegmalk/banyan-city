    src = sorted(glob.glob(out_dir + "/17-goodbye-bigbody-LTX-handbrush.mp4*")
                 + glob.glob(out_dir + "/b17-bigbody-init-704x1280.png")
                 + glob.glob(out_dir + "/bench-bigbody-handbrush.jsonl")
                 + glob.glob(pay_dir + "/b17-motion-prompt.txt")
                 + glob.glob(pay_dir + "/b17-negative.txt"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b17-bigbody-motion-0816.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(sorted(lines)) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
