  here so that a pass means something. composite-init-pattern.md 9 is the honest limit of this whole instrument:
  across seven samples the GEOMETRY half transferred completely (edges tracked to 1.8px, no FAIL-SHAPE,
  FAIL-SEAM or FAIL-DECAL below 0.45 on any of three boards) and the MATERIAL half has an unexplained
  PLATE DEPENDENCE. Worse for this job specifically: the register where the material half died was ''a
  whole-body two-shot the model renders with flat soft shading'', and THIS IS A WHOLE-BODY WIDE SHOT.
