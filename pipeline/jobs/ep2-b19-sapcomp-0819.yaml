# THE ONE VARIABLE: THE PLANT IS COMPOSITED INSTEAD OF PROMPTED.
# ------------------------------------------------------------------
# See farm-out/ep2-b19-sapcomp-0819/19-the-drop-sapcomp-0819.yaml for how the
# init was built and what was measured off the parent before any code existed.
