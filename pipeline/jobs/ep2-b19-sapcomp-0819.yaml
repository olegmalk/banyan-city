# the pixels rather than by reasoning:
#   * the parent's four "fruits" are VIOLET FACETED CRYSTALS on threads, hung off
#     two BARE TWIGS. P1 and P6 fail by CLASS, not by count, so subtraction
#     cannot reach either axis.
