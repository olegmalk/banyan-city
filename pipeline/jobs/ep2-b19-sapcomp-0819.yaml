#     where this one needs ~30px. Pasting it at an 18x downsample imports a
#     smudge. It is used as the shape and colour AUTHORITY instead.
#
# The bar below is beat 19's own, carried verbatim from the parent plate's
# sidecar where it was pre-registered before these pixels existed. Read the
# first key in it: THE FRUIT MUST BE ALOFT IN A PLATE. On the ground is where the
# MOTION ends, and a plate with the fig already in the grass is the recorded
# blocker.
