#
# THE TOP UNFIRED RUNG ON work-ladder-0819.md, FILED RATHER THAN DESCRIBED.
# Beat 19 is one of four slates in the ep2 cut. Its old blocker ("no plate exists
# with the fruit aloft") DIED tonight -- three draws, fruit aloft on all three.
# What is left is the plant, and the wording ladder for it is CLOSED at three
# rungs: three wordings, three bead-strung vines, fruit count 4 -> ~8 -> 3, never
# 1. This repo's own rule says the next instrument is compositional.
#
# THIS SPEC WAS DERIVED FROM ep2-b08-boardcomp-0818 PROGRAMMATICALLY, not retyped.
# inpaint_fruit.py is carried byte-for-byte, and so are env, needs, 40 steps, cfg
# 7.5, strength 0.30, pad-crop 64, blur 8, the dry-run-before-any-model gate and
# the no-glob publish. That is the ladder's "one variable per rung, and prefer to
# make that a fact about the file".
