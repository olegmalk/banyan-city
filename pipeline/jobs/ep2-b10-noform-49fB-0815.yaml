    import glob, hashlib, os, shutil
    src_dir = "C:/banyan-farm/ep2-b10-noform-49fB-0815"
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b10-noform-49fB-0815"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob(src_dir + "/10-no-form-LTX-noform-b.mp4*")
                 + glob.glob(src_dir + "/b10-init-704x1280.png")
                 + glob.glob(src_dir + "/bench-b10-noform-b.jsonl"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b10-noform-49fB-0815.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    raise SystemExit(0 if len(src) >= 2 else 1)
