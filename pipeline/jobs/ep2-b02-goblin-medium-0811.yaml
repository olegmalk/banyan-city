# 002b goblin wave -- THE SHOT-SIZE SAMPLE, beat 02 the-sprint, 2026-08-11.
# UNGATED ON PURPOSE: this is the ONE SAMPLE the twelve gated sibling specs are
# waiting on. It draws nothing new about the character -- Roman ruled on that
# ("yeah, that looks like the right goblin", 2026-08-11 ~15:45, on
# `ep2-b15-goblin-simple-0811`) -- and it does not clear anybody's gate. It
# exists so a human has something to look at.
#
# WHAT FAILED AND WHAT CHANGED. `ep2-b02-goblin-staged-0811` ran this same beat
# with `--variant authored_staged` and came back rc=0 with four unusable
# frames: no goblin at all in s0 and s3, a stick-sized figure in s2, and in s1 --
# the one front-on frame -- a head a few pixels across with no readable face.
# The 2026-08-11 staging fix had corrected the ANGLE (`from front`) and left the
# DISTANCE: `wide shot` survived in the same sentence, and at wide-shot distance
# in a 9:16 frame `his face visible past its thin stem` is not something the
# model can honour. Beat 04 is the only beat of this wave whose frames ever came
# back readable and it states a shot SIZE twice (`his face filling the frame`,
# `close-up`); the staged drafts had copied the angle half and not the size half.
#
# ONE TOKEN IS THE WHOLE DIFFERENCE. `--variant authored_staged_med` is
# `authored_staged` with `wide shot` -> `medium shot` and nothing else -- same
# beat, same seeds, same steps and guidance, same harness, same `green skin`
# slot. So a comparison against the failed sheet reads cleanly: if the face is
# legible now, the size term was the cause.
#
# WHY MEDIUM AND NOT BEAT 04's `close-up`. Beat 04 can fill the frame with a
# face because it has nothing else in it. This beat is a sprint AND a dive AND a
# sapling he dives behind -- the joke is the cover, and a close-up crops the
# thing being hidden behind. `authored_staged_close` sits beside it in
# wave-drafts.yaml, unrendered, for whoever looks at these four and wants tighter.
# Not a ranking and not a metric's pick: nobody has seen either yet.
#
# SEPARATE OUT DIRECTORY, DELIBERATELY. `out-staged` still holds the four failed
# frames the gate on the sibling specs cites by path. This writes to
# `out-medium`, because the harness names files from the beat slug and firing
# into `out-staged` would overwrite the evidence the gate is built on.
#
# MEASURED, NOT GUESSED: dry-run on the box's real CLIP tokenizer at 2026-08-11
# ~16:5x on this exact variant and slot string -- DRY OK, 68/77 positive tokens,
# STYLE ANCHOR PRESENT, count tag `1boy` derives, no faults. The harness refuses
# rather than falling back if the box's wave-drafts.yaml lacks the key, so a
# stale copy fails for $0 instead of quietly rendering the old staging under a
# new job id; the box copy was verified sha256-identical to the repo's
# (91d45003a7879a3083d280ef715c972df3c4599d00bdbad54a3295819544bde6) after the
# edit and before this job was queued.

