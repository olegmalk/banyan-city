  `in` DOES NOT SCOPE IT. Rung B''s grammar law is not refuted, it is BOUNDED. It
  bound `green skin` because skin had no competitor in the sentence: nobody else
  was claiming a skin colour. A garment has a competitor -- the guard''s tan wrap
  tunic and white sash are already in the prompt -- and a second garment does not
  create a second wardrobe, IT DILUTES THE FIRST ONE. The evidence is that the
  four tokens landed almost entirely on the man they were not written for, and
  took his hair and his glasses with them.
  THIS IS THE SAME CONCLUSION THE BEAT-08 LANE REACHED TONIGHT THROUGH A
  DIFFERENT CHANNEL. There: "a contour cannot say which body an attribute belongs
  to, so `green skin` enters the pooled embedding and lands on both", after four
  conditioning rungs closed the geometric axis by measurement. Here the same thing
  is shown in the WORDING channel on a different beat. Two independent channels,
  one answer: ATTRIBUTE-TO-FIGURE BINDING IS NOT REACHABLE BY GRAMMAR OR BY
  GEOMETRY ON THIS CHECKPOINT. That is worth more than this rung cost.'
