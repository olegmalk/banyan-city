# ============================================================================
# OUTCOME + THE PICK, appended 2026-08-18 (night). The bar above is unedited.
# The PASS itself was recorded the same evening in commit 72295a21 and on
# review/ep2-cold-open-0818/, but never written into this spec; the reading
# below is a fresh one, done tonight against the same bar, alongside the three
# seed variants, so the pick rests on frames and not on a commit message.
# ============================================================================
outcome:
  verdict: PASS, with one stated caveat (the bloom). Re-read tonight; the earlier PASS stands.
  ran: 'rtx5090. Re-read tonight off a 21-frame sheet (every 6th frame) plus every frame f18-f41 cropped on the fig.'
  g1_growth: 'PASS. Continuous ramp over ~16 frames: mint (f18-f24), pale mint/lilac (f25), pink-mauve (f26-f33), mauve, deep purple (f34-f41), swelling as it goes and attached the whole way. Of the four seeds this is the only one whose colour path has no cut in it except 20260828''s, which broke the frame instead.'
  g2_purple: 'PASS. Deep purple-violet end state.'
  g3_leaves: 'PASS. Two blades in every frame read.'
  g4_size_grass: 'PASS. No balloon; the fig stays below the grass tops.'
  g5_camera: 'PASS on registration. Whole-frame best fit f0->f120 is zoom 1.05 with a 4-unit shift -- the tightest lock of the four seeds (20260827 measures 1.30, i.e. a real 30 percent dolly).'
  caveat_bloom: 'Restated, not hidden: the light blooms hard between the first and second seconds and keeps rising, so by f120 the sky has washed from dawn purple to pale amber and wide yellow streaks cross the frame. More than "only the fig moves". It is a change in the LIGHT and not a loss of the DRAWING -- every grass blade is still a drawn blade in the plate''s own hand -- which is why it is a caveat here and a FAIL on seed 20260828, where the blades dissolved. That line is written out in that seed''s spec.'
pick:
  chosen: seed 20260826 (this spec) -- the clip already on review/ep2-cold-open-0818/ as cold-open-candidate.mp4.
  pool: 'Four seeds of one recipe, all read tonight against this identical bar: 20260826 PASS, 20260827 FAIL (fig replaced in a single frame f37->f38; measured 1.30x push-in), 20260828 FAIL (best growth arc of all four, but the painterly grass dissolves to a flat wash with stray hairline strokes), 20260829 FAIL (arc over by f15, then 106 frames of a motionless fig; frame blows out to yellow glare).'
  reason: 'It is the only seed that clears the bar, so the pick is arithmetic rather than taste -- one pass in four. It also happens to be the only one that both grows the fig continuously AND keeps the camera locked; each of the other three trades one of those away.'
  not_hidden: 'Two of the rejects beat the pick on one axis each, and the founder should know it before he blesses the pick: 20260827''s end frame is the most faithful to the plate of the four (dawn sky wedge intact, grass still crisply drawn, where the pick has bloomed to pale amber), and 20260828 has a visibly better growth ramp (24 continuous frames through teal and slate to deep purple, with a green calyx drawing itself in at the join). Both are shown on the seed sheet on the review page. What that pair says about the recipe -- it can hold the plate, and it can ramp the colour, just not yet in the same take -- is a finding for a daytime call, not a licence to add variables tonight.'
  taste_note: 'This is a screening pick among candidates that met a pre-registered technical bar, not a taste verdict. Whether the cold open is GOOD, and whether it is the one that opens the episode, is the founder''s under R4. Nothing is promoted, cut or published on the strength of this pick.'

# ============================================================================
# SWEEP CLOSED, appended 2026-08-18 (night) after seeds 20260830 and 20260831
# came back. The bar and the pick above are unedited; this only completes the
# record and states why no seventh seed was filed.
# ============================================================================
sweep_summary:
  tally: 'SIX seeds of one recipe, one plate, one bar. 20260826 PASS. 20260827, 20260828, 20260829, 20260830, 20260831 all FAIL. One in six.'
  the_pick_is_unchanged: 'Neither late seed displaces it, but 20260830 came close enough that saying so matters: it is the ONLY seed with a perfectly locked camera (registration 1.00 at both f060 and f120, against the pick''s 1.05) and it holds the plate''s dawn look better than any of the six -- sky wedge intact, blades still drawn, where the pick blooms to pale amber. It fails on two frames near the front, where the fig steps 2.1x in area instead of swelling. The bar is conjunctive and a partial is a FAIL, so it loses, and G1 was NOT softened to let it in. G1 is the clause that separates "the fig grew" from "a fig appeared", which is the entire shot.'
  three_independent_axes: 'THE REASON THE SWEEP STOPS HERE, and it is a finding rather than fatigue. The six failures are not one recurring fault, they are three faults that vary independently seed to seed.
    COLOUR PATH -- 2 of 6 ramp continuously (20260826 over 16 frames, 20260828 over 24), 4 of 6 pop in 1 to 4 frames.
    CAMERA LOCK -- 2 of 6 hold (20260830 at 1.00, 20260826 at 1.05); the rest measure 1.10, 1.10, 1.10, 1.30.
    PLATE FIDELITY -- best to worst: 20260830 (holds it), 20260827 (holds it), 20260826 (blooms, blades intact), 20260831 (fades to a wash), 20260828 (drawing dissolves, stray strokes), 20260829 (blows out to yellow glare).
    No seed but the pick is acceptable on all three at once, and no two failures share a cause. Rolling seeds is therefore three dice at once, and six rolls bought exactly one winner -- which is what a 1-in-6 rate on three independent axes looks like. A seventh seed is a lottery ticket, not an experiment, so none was filed and the card was allowed to empty honestly.'
  what_would_actually_move_it: 'Named, not started. Each of the three axes has an obvious one-variable attack -- the negative prompt already lists "zoom, dolly, push in" and yet four of six pushed, which is a real finding about how much that negative is worth on this engine; the colour pop might be a step-count or a scheduler question; the bloom/fade might be a plate-conditioning strength question. Every one of those is a RECIPE change, which means a new sample under the one-sample rule, and none of them is ruled tonight. They are also premature: the pick already clears the bar, and what the cold open needs next is the founder''s eye on it under R4, not a sixth engineering variable.'
  where_the_evidence_is: 'Per-seed verdicts with the measurements are appended to each of pipeline/jobs/ep2-b01-growmotion-b{2,3,4,5,6}-0818.yaml. The six last frames are on review/ep2-cold-open-0818/ as seed-sweep-f120.jpg, pick first with a gold border.'
