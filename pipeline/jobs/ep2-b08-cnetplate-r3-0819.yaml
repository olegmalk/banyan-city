# ============================================================================
# THE BAR. CARRIED FROM RUNGS 1 AND 2 UNCHANGED.
# ============================================================================
bar:
  b1_the_pair: >-
    TWO figures and only two -- one guard and one goblin, both whole in frame.
  b2_the_adults_read: >-
    EXPECTED FAIL FOR THE THIRD TIME, PRE-REGISTERED, AND NOT THIS RUNG'S
    VARIABLE. Both rungs returned two green figures with pointed ears at scales
    almost three times apart. A contour cannot say which body an attribute
    belongs to; scale does not create a per-figure identity channel. A PASS here
    would be the surprise and would mean the OUTLINE, not the strength, had been
    suppressing the wording -- which would itself be worth knowing.
  b3_one_ground_plane: >-
    Both stand on the same grass, feet at the same depth. The hint pins both foot
    lines at y=1149.1.
  b4a_board_down: >-
    The clipboard is DOWN at the guard's hip, in ONE hand, not raised at his
    chest and not in both hands.
  b4b_legible_point: >-
    The gesture ends in a HAND aimed at the goblin's belly. This clause FAILED at
    0.80 and PASSED at 0.45; it is genuinely at risk again in the other
    direction, because the hint draws only a thin finger stroke and a weaker
    condition may not hold the arm's aim at all.
  b4c_the_arm_belongs_to_the_guard: >-
    THE CLAUSE THAT MUST SURVIVE, and the one most likely to be spent here. The
    pointing arm grows from THE GUARD's shoulder. It held at 0.45; if it goes at
    0.28 the usable band is bounded below and the answer is a value between them.
  b5_no_colossus: >-
    Neither figure towers over the other. The uncontrolled frame at this seed is
    an extreme colossus, so this clause is entirely the condition's doing and is
    a direct read on how much authority is left.
  b6_drawn_not_traced: >-
    THIS RUNG'S OWN QUESTION, and the half that is still open. Rung 2 passed B6's
    three positive tests (cloth with folds, shaded limbs, faces with features)
    and failed its negative test, because the SILHOUETTES were still the authored
    polygons -- rectangular columnar legs, boxy torso, straight shoulders. B6
    passes here only if the OUTLINE becomes the checkpoint's: limbs that taper,
    a torso with a waist, shoulders that slope, cloth that leaves the polygon.
verdict_rule: >-
  WRITTEN BEFORE THE PIXELS, and all three branches are useful. (1) If B1, B3,
  B4a, B4b, B4c and B5 hold AND B6 finally passes AND B2 fails as pre-registered,
  the verdict is PASS-ON-PURPOSE and the composition lever is FINISHED as a piece
  of engineering: beat 08's only remaining blocker is identity, and the usable
  scale is known. (2) If the pose degrades -- the arm leaves the guard, the plane
  splits, the board rises, a colossus returns -- the band is bounded below at
  0.28 and the answer is a value between 0.28 and 0.45, which is a one-line
  follow-up rather than a new mechanism. (3) If the pose holds AND the
  silhouettes are STILL the authored polygons at a scale this low, then tracing
  is not a strength artefact at all and a DENSE FULL-BODY CONTOUR IS THE WRONG
  HINT CLASS for this checkpoint -- which retires this hint's shape and points at
  a sparse skeleton, a thinner stroke, or an early control_guidance_end instead.
  Branch 3 is the one that would send the tool back to the drawing board and it
  is written here so it cannot be argued away afterwards.
not_done_on_purpose: >-
  ONE sample, ONE arm, ONE variable. No scale sweep, no second seed, no
  re-authored hint, no stroke-weight change, no control_guidance_end change, no
  identity mechanism, no ControlNet-plus-mask, no pick, no plate_ack waiver, no
  canon filename. The nocontrol control is rung 1's already-published frame and
  is not re-rendered.
licence_note: >-
  Clean and identical to rungs 1 and 2. Base cagliostrolab/animagine-xl-3.1
  (CreativeML Open RAIL++-M), control net xinsir/controlnet-scribble-sdxl-1.0
