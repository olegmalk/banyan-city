# BEAT 08, RUNG 3 -- THE SAME HINT AGAIN, ONE MORE STEP DOWN THE TRACING DIAL.
# ONE SAMPLE. ONE ARM. ONE VARIABLE: conditioning_scale 0.45 -> 0.28.
#
# ============================================================================
# THE TWO RUNGS BEHIND THIS ONE, AND WHAT EACH BOUGHT
# ============================================================================
# RUNG 1, ep2-b08-cnetplate-0819, scale 0.80. FAILED B1-B5 and settled the
# question the route existed for:
#   * B4c PASSED -- THE POINTING ARM GREW FROM THE GUARD, first time on this
#     beat. Not the seed behaving: the nocontrol arm at the SAME seed and words
#     put the arm on the goblin (4 of 4 uncontrolled) and produced the most
#     extreme colossus this beat has seen, with the guard's frozen wardrobe
#     bound onto the goblin as well.
#   * B1, B3, B4a, B5 PASSED. B2 FAILED. B4b FAILED -- the arm ended in nothing.
#   * observed_not_scored: at 0.80 a DENSE full-body contour is TRACED, NOT
#     INTERPRETED. Both figures came back as flat untextured mannequins in the
#     authored polygons, while the grass and sky around them were fine.
#
# RUNG 2, ep2-b08-cnetplate-r2-0819, scale 0.45. Its pre-registered rule
# expected a FLOOR below 0.45 and found a CEILING above it:
#   * THE WHOLE POSE SURVIVED. B1, B3, B4a, B4c, B5 all held. 0.45 is still
#     enough authority to decide which figure grows the limb.
#   * B4b FLIPPED FAIL -> PASS. A modelled hand with an extended index finger,
#     exactly as that spec predicted a freer checkpoint would supply.
#   * B6 PARTIAL, which is not a pass, and the split IS the finding: its three
#     positive tests all passed and all three were ABSENT at 0.80 -- cloth with
#     folds, shaded limbs, faces with features -- while its negative test failed,
#     because the silhouettes are still the authored polygons. THE CHECKPOINT
#     WAS HANDED BACK THE SURFACE AND NOT THE OUTLINE.
#   * B2 FAILED again, as pre-registered, at a completely different exposure and
#     level of detail: heads (166,196,106) and (163,198,101), indistinguishable.
#
# ============================================================================
# THE ONE VARIABLE, AND WHY THIS VALUE
# ============================================================================
# conditioning_scale 0.28. The two steps taken so far are 0.80 -> 0.45 (x0.56)
# and this is 0.45 -> 0.28 (x0.62) -- a comparable step, so the band is sampled
# evenly instead of jumping at a guessed floor. 0.28 is the middle of the
# 0.25-0.30 range rung 2's verdict named before these pixels existed.
#
# EVERYTHING ELSE IS HELD, AND THIS IS NOW A THREE-POINT CURVE ON ONE AXIS.
# Same hint file, byte-identical and sha-asserted at render time (19cfad48...).
# Same seed 20260819. Same positive prompt word for word. Same negative --
# INCLUDING the `dark, night` fix, which rung 2 already proved out (mean luma
# 22.9 -> 151.6) and which is therefore NOT a variable here, it is the settled
# state. Same size, steps, guidance, base, ControlNet and driver at dc7348f3.
#
# ONE ARM AGAIN. The nocontrol control does not depend on conditioning scale and
# is already published at this seed (farm-out/ep2-b08-cnetplate-0819). This job
# renders ONE new frame and is read as a FOUR-WAY comparison against three
# pictures already on disk: 0.80, 0.45 and no condition at all.
#
# ============================================================================
# WHAT THIS RUNG CANNOT DO, SAID BEFORE IT RUNS
# ============================================================================
# IT CANNOT FIX B2. Two rungs at two very different scales returned two green
# figures, and the reason is structural rather than a matter of strength: a
# contour cannot say which body an attribute belongs to, so `green skin` enters
# the pooled embedding and lands on both. Nothing about lowering the scale
# creates a per-figure identity channel. B2 is carried below as an EXPECTED FAIL
# for the third time, and the identity mechanism -- per-figure IPAdapter is the
# candidate -- stays a separate probe with its own bar. Two unproven mechanisms
# in one sample is a guess with a GPU attached.
#
# NO SPEND, NO PROVIDER, NO CANON FILENAME, NO PICK, NO PUBLISH TO THE SITE, NO
# POST, NO ASSEMBLY. No video is encoded anywhere on this path, so no motion
# recipe's --image-crf reaches it. (Relevant today: the b14 pair just showed
# that flag is real where it bites and did not bite that beat; it cannot bite
# this one, which renders a still.)

