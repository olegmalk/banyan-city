success: 'ONE 832x1216 png, judged AT 1:1 and on a MATCHED-SCALE two-face sheet beside taste/refs/guard1-canon-founder-0822.png
  -- the r11a lesson, where a pick was declared off full frames at different head sizes and flipped the
  moment the crops were the same height. PRE-REGISTERED, BEFORE THE PIXELS EXIST: (1) TWO MEN, side by
  side, both whole and both facing out -- one is a DROP and three is a DROP. This beat''s one existing
  win is two figures for 117 frames and the plate may not lose it. (2) THEY ARE DIFFERENT MEN. The left
  is guard 1 as ratified (dark cropped hair, round wire-rim glasses); the right has a THICK GREY MOUSTACHE
  and a jowly face and has neither the cropped hair nor the glasses. Two copies of guard 1 is the headline
  failure of this job and it is not a note, it is a FAIL. (3) BOTH WEAR A WHITE SHOULDER SASH -- the beat''s
  own standing fault, ''neither guard wears the sash you froze for the cast'', and the reason this plate
  exists. A sash on one man only is a HALF PASS and is reported as one. (4) BOTH ARE GROWN MEN; a child,
  teenager or female read on either is a DROP. (5) DETAILED CINEMATIC ANIME, the look of the reference.
  Flat, muted or tag-sheet fails however good the casting is. (6) A real tall-grass-and-hedgerow field,
  not a plain ground. (7) NOTHING GOBLIN on either man: no green skin, no pointed ears -- tonight''s b07
  re-run put a pointed ear on this same guard, so this is a live defect and not a formality. PRE-REGISTERED
  FAIL MODES, recorded whether or not they fire, MOST LIKELY FIRST: TWO GUARD ONES -- the adapter holds
  one man''s face and nothing in this tree has ever measured what that does to the SECOND figure in a
  two-figure frame, which is the whole reason this is one cell and not three; the moustache landing on
  the wrong man, which is the b07 attribute-binding failure with the figures swapped; the adapter handing
  over the reference''s face-close-up COMPOSITION, measured to happen when reference and request geometries
  agree, which here they do not; a third figure, which four rounds of rewording on this beat did eventually
  beat and which `no third man, no crowd` is carrying.'
why: 'BEAT 05 CONTRADICTS A FINAL RULING IN ITS OWN PICTURE: ''neither guard wears the sash you froze
  for the cast''. Both sashes are asserted here, positively, in one clause covering both men, and both
  men are PLACED left and right -- the wording shape that finally got a second figure into beat 07 after
  two empty attempts. Guard 1 is the ratified man; guard 2 is NOT cast and this draft takes casting cell
  F provisionally, chosen because a thick grey moustache is the only feature in the sentence the other
  man cannot also have -- tonight''s b07 finding, where the sash bound and the collar did not. Route:
  the cinematic stack the 08-22 ladder names by file -- goblin_ipa_beat.py --character guard --arm window4,
  IP-Adapter 0.6 off after the first 15%% of the denoise, over a box-resident refs dir holding the ratified
  frame. Identical to pipeline/jobs/ep2-b06-guard1-0822.yaml filed an hour ago, so a b06 pass beside a
  b05 fail isolates THE SECOND FIGURE as the cause. $0, minutes of local GPU. Full trace: pipeline/derive_b05_guards_0822.py.
  ARM OVERRIDE, --arm content: this is the SECOND run of this job and it is not window4. The window4 run
  came back with the REFERENCE''S composition -- a tight face close-up -- on a request that asked for
  something else, which its own spec had argued could not happen. `content` scopes the adapter to down
  block_2 for the whole denoise instead of putting it on every block for the first 15%, which is the standard
  way to take identity from a reference without taking its framing. ONE VARIABLE against the window4 run:
  the arm. Same reference bytes, same prompt, same seed, same size, same driver. NAMED FAIL MODE, from
  this sampler''s own header: arms 1 and 2 ''bought identity with colour or colour with identity'', so
  a washed-out or off-key frame is the thing to look for here, and it is a different failure from the
  framing one this run exists to fix.'
