one_sample_rule: 'ONE CELL, ONE SEED, AND THE OTHER TWO CASTING READS ARE HELD. The night order names
  cells B, F and J as the sheet''s strongest reads; only F is fired. The reason is not thrift: running
  TWO identities through a single-identity adapter window has never been sampled in this tree, and if
  it collapses into two guard ones then B and J would have produced two more pictures of guard 1 and taught
  nothing. One cell answers that, and B and J are a wave the moment it comes back clean. Everything else
  -- driver, reference bytes, arm, scale, window, size, seed arithmetic -- is the b06 job''s, unchanged.'
next_rung: 'NAMED, NOT FIRED, so every outcome has somewhere to go: (a) clean two-man frame -> cells B
  and J as siblings, same everything, so the founder picks guard 2 off three plates of the actual beat
  rather than three casting heads; (b) TWO GUARD ONES -> the adapter cannot serve two identities from
  one reference and the answer is per-figure conditioning (--ip-ref twice with --ip-mask-capsules on controlnet_plate.py,
  which the b08 lane already wired), not another wording; (c) moustache on the wrong man -> the b07 attribute-binding
  problem, and the lever is the same one: give guard 1 a feature guard 2 cannot have, rather than banning
  the crossover; (d) clean -> i2v motion off THIS plate, the halt-and-scan.'
seed_note: 'Seed is the sampler''s arithmetic, pinned by construction: wg.SEED (20260719) + beat (5) +
