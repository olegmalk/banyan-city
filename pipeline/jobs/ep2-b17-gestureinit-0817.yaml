    #!/usr/bin/env python3
    """Extract ONE named frame from an asserted source clip. No model, no network.

    The init for this probe is not drawn and not composited -- it is frame 026 of the
    only clip that ever performed beat 17's brush. Drawing or compositing a hand on a
    cloak is the worst case for FAIL-DECAL on the one beat that is about hands, so the
    structure comes from the engine's own output, already in dialect and already
    704x1280.

    REFUSES on a source sha256 mismatch, so this cannot silently animate a clip that
    merely resembles the winner. Decoding mirrors pipeline/b17_hand_track.py exactly --
    ffmpeg -vsync 0, zero-based frame index -- so "frame 026" means the same frame here
    as it does in the committed travel curve that selected it. ffmpeg comes from
    imageio-ffmpeg's bundled binary because nothing is on PATH on this box.
    """
    import argparse, glob, hashlib, os, shutil, subprocess, sys, tempfile

    ap = argparse.ArgumentParser()
    ap.add_argument("--src", required=True, action="append",
                    help="repeatable; the FIRST candidate whose sha256 matches is used")
    ap.add_argument("--sha256", required=True, help="asserted before anything is written")
    ap.add_argument("--frame", type=int, required=True, help="zero-based, as the tracker counts")
    ap.add_argument("--out", required=True)
    ap.add_argument("--expect-size", default="704x1280")
    a = ap.parse_args()

    def sha_of(path):
        h = hashlib.sha256()
        with open(path, "rb") as fh:
            for chunk in iter(lambda: fh.read(1 << 20), b""):
                h.update(chunk)
        return h.hexdigest()

    # SEVERAL CANDIDATE PATHS, ONE ACCEPTED HASH. The clip lives in the courier dir
    # that an earlier job published it to, and also in that job's own out dir. Trying
    # both removes a single-path dependency without weakening anything: identity is
    # decided by the sha256, never by which path answered.
    src = None
    tried = []
    for cand in a.src:
        if not os.path.isfile(cand):
            tried.append("%s -- absent" % cand); continue
        got = sha_of(cand)
        if got == a.sha256:
            src = cand; print("src sha OK %s (%s)" % (got, cand), flush=True); break
        tried.append("%s -- sha %s" % (cand, got))
    if src is None:
        sys.exit("!! NO CANDIDATE MATCHED sha %s -- refusing.\n   %s"
                 % (a.sha256, "\n   ".join(tried)))

    try:
        import imageio_ffmpeg
        ff = imageio_ffmpeg.get_ffmpeg_exe()
    except Exception:
        ff = shutil.which("ffmpeg") or sys.exit("!! no ffmpeg (imageio-ffmpeg absent, none on PATH)")
    print("ffmpeg: %s" % ff, flush=True)

    tmp = tempfile.mkdtemp(prefix="gframes-")
    try:
        # -vsync 0 and -start_number 0 make the on-disk index the tracker's index.
        p = subprocess.run([ff, "-v", "error", "-i", src, "-vsync", "0",
                            "-start_number", "0", os.path.join(tmp, "f%05d.png")],
                           capture_output=True)
        if p.returncode != 0:
            sys.exit("!! ffmpeg decode failed: %s" % p.stderr.decode()[:400])
        got = sorted(glob.glob(os.path.join(tmp, "f*.png")))
        print("decoded %d frames" % len(got), flush=True)
        want = os.path.join(tmp, "f%05d.png" % a.frame)
        if not os.path.isfile(want):
            sys.exit("!! frame %d not in a clip of %d frames -- refusing." % (a.frame, len(got)))

        from PIL import Image
        im = Image.open(want).convert("RGB")
        W, H = (int(v) for v in a.expect_size.split("x"))
        if im.size != (W, H):
            sys.exit("!! frame is %dx%d, expected %dx%d -- refusing rather than resampling. "
                     "The bar's travel numbers are in this clip's pixel scale." % (im.size + (W, H)))
        os.makedirs(os.path.dirname(os.path.abspath(a.out)) or ".", exist_ok=True)
        im.save(a.out)
    finally:
        shutil.rmtree(tmp, ignore_errors=True)

    with open(a.out, "rb") as fh:
        oh = hashlib.sha256(fh.read()).hexdigest()
    print("frame %d -> %dx%d" % (a.frame, W, H), flush=True)
    print("WROTE %s sha %s" % (a.out, oh), flush=True)
