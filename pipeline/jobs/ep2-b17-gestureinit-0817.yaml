    # THE GLOB CARRIES THE BEAT SLUG (17-goodbye). Without it the glob matches
    # nothing and the step publishes nothing while returning a code that reads
    # like a render failure.
    import glob, hashlib, os, shutil
    out_dir = "C:/banyan-farm/ep2-b17-gestureinit-0817-out"
    pay_dir = "C:/banyan-farm/ep2-b17-gestureinit-0817"
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b17-gestureinit-0817"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob(out_dir + "/17-goodbye-gestureinit-s20260917-LTX-handbrush.mp4*")
                 + glob.glob(out_dir + "/b17-gesture-init-f026-704x1280.png")
                 + glob.glob(out_dir + "/bench-gestureinit-s20260917.jsonl")
                 + glob.glob(pay_dir + "/b17-motion-prompt.txt")
                 + glob.glob(pay_dir + "/b17-negative.txt"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b17-gestureinit-0817.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(sorted(lines)) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    raise SystemExit(0 if len(src) >= 3 else 1)
