    #!/usr/bin/env python3
    """Refuse to render unless named inputs hash to named values. No model, no network.

    The whole claim of this job is that ONLY THE INIT differs from the five clips
    already rendered. That claim is worthless if the prompt drifted by a character,
    so the prompt and negative are checked against the sha256s in the box's OWN
    published manifest for ep2-b17-bigbody-motion-0816 rather than trusted because
    they were pasted in carefully.

    Usage: assert_sha.py PATH SHA256 [PATH SHA256 ...]
    """
    import hashlib, os, sys

    args = sys.argv[1:]
    if not args or len(args) % 2:
        sys.exit("!! usage: assert_sha.py PATH SHA256 [PATH SHA256 ...]")
    bad = []
    for path, want in zip(args[0::2], args[1::2]):
        if not os.path.isfile(path):
            bad.append("%s -- ABSENT" % path); continue
        h = hashlib.sha256()
        with open(path, "rb") as fh:
            for chunk in iter(lambda: fh.read(1 << 20), b""):
                h.update(chunk)
        got = h.hexdigest()
        if got == want:
            print("OK   %s  %s" % (got, os.path.basename(path)), flush=True)
        else:
            bad.append("%s\n     want %s\n     have %s" % (path, want, got))
    if bad:
        sys.exit("!! INPUT SHA MISMATCH -- refusing to render.\n   " + "\n   ".join(bad))
    print("all inputs verified byte-identical to the asserted manifest", flush=True)
