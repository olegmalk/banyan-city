    #!/usr/bin/env python3
    """Stamp the clip's provenance sidecar as an unapproved engine probe.

    video_task.write_sidecar records model, prompt, negative, init sha and cost_usd 0,
    and it does not record whether the clip may ship. Anything this lane publishes has
    to say so on its face, so the three keys are appended here rather than asserted in
    a commit message nobody downstream reads. REFUSES if the sidecar is missing -- a
    clip whose provenance file did not get written must not pass silently.
    """
    import os, sys

    META = sys.argv[1]
    if not os.path.isfile(META):
        sys.exit("!! no sidecar at %s -- refusing to call the job clean." % META)
    with open(META, "a", encoding="utf-8", newline="\n") as fh:
        fh.write(
            "# --- appended by ep2-b17-gestureinit-0817 after the render.\n"
            "approved: false\n"
            "provisional: true\n"
            "is_show_content: false\n"
            "note: |\n"
            "  ENGINE PROBE, NOT A TAKE FOR THE CUT. This clip exists to separate two\n"
            "  readings of beat 17's missing brush: whether this engine cannot perform\n"
            "  hand-on-cloth traversal at all, or whether it cannot INITIATE one and\n"
            "  can continue one already underway. Its init is FRAME 026 OF ANOTHER\n"
            "  CLIP, so it opens mid-gesture and only ~7% of the frame is headroom --\n"
