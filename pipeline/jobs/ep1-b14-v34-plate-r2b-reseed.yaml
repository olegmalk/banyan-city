#
# TWO REASONS THIS BEAT GETS TWO DRAWS RATHER THAN ONE.
#
# 1. IT IS THE BIGGEST HOLE IN THE CUT. Beat 14 measures median 0.008 with 88% of
#    frame pairs frozen — the most frozen beat in v35 — and it plays a held still
#    because it is the one frozen beat deliberately given no twin. It sits
#    second-to-last, so a dead frame there is the last thing before the close.
#
# 2. ITS ONE GOOD ROUND HAS A KNOWN RESIDUAL THAT A SEED MAY FIX. r2 is upright,
#    clean and the most mobile clip in the series (median 4.524, 0% frozen), but
#    its own STATUS.yaml records the framing drifting upward until the leaf tips
#    crop at the top edge by frame 56. That is a per-draw composition outcome, so
#    a different seed is a legitimate second attempt at it. The alternative fix —
#    adding beat 08's affirmative framing lock — is precisely what the gated spec
#    ep1-b14-v34-motion-r3.yaml proposed, and 879820f measured that lock costing
#    beat 08 its motion. This job does not add it and does not touch that gate.
#
# AND ONE HONEST RISK, WHICH IS THE REAL REASON FOR A SECOND DRAW: beat 08 r1 is
# the single raw/plate pair of thirteen where plating cost the motion (0% -> 62%
# frozen at identical seed). Beat 14 has never been plated at all, so its twin's
# outcome is genuinely unknown. Two independent draws mean an unlucky one does
# not leave the biggest hole in the cut unfilled for another cycle.
#
# ONE VARIABLE against ep1-b14-v34-plate-twin-r2: the seed, 20260745 -> 20260853.
# Wording is r2's verbatim, guidance stays 1.0, the plate step is the ratified
# cover-centre crop.
#
# NO METRIC PICKS BETWEEN THE TWO DRAWS. On this beat the flow metric scored
# HIGHEST on r1, the round where the sapling falls over and leaves frame
# (131e433). A clip that bends, droops or falls is a fail here however it
# measures, and the choice between the draws is R4's.

