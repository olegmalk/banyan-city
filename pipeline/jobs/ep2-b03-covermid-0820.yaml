  says the beat-15 6 gate is LIVE. It was, when that spec was written on the morning of 08-19; the approval
  landed later the same day.'
script_line: 'Beat 03 BAD COVER (0:11-0:16), node.md:38 verbatim: "The scavenger crouches behind a trunk
  that hides roughly one-sixth of him." The preceding beat 02 THE SPRINT (node.md:35) is where he "dives
  behind the sapling''s thin trunk", so the dive is beat 02''s action and beat 03 is the held, inadequate
  cover it lands in. THE `trunk` WORDING IS SUPERSEDED by the founder''s ruling that the sapling is tiny
  ("thats ridiculous, lmao. the sapling is tiny"); the END STATE -- cover that is comically inadequate
  -- is what the beat needs.'
bar:
  H1_NO_TERMINAL_FREEZE: THE FAILED CLAUSE. judge_clip FREEZE must read none, or a run shorter than 6
    frames. Rung 2 read 33 frames dead from f088 at ncc 1.0000 and is the control. This is the clause
    the rung exists for and it is measured by a committed instrument rather than by eye.
  H2_he_is_still_crouched_in_the_last_frame: CARRIED FROM RUNG 2, WHICH WON IT, and it must not be given
    back. At f120 he is down in the grass behind the plant, in frame, shoulders no higher than the leaf
    tops. Rung 1 was out of frame at f114. A rung 3 that unfreezes the tail by letting him stand up again
    has undone the one thing rung 2 achieved.
  H3_the_duck_reads_and_keeps_reading: 'The head-and-shoulders drop is there AND the last twenty frames
    are not a held photograph: whole-frame ncc floor below 0.95 (rung 2: 0.891 overall but 1.0000 for
    its last 33). Judged at 1:1 as well -- the number chooses the frames, the eyes decide.'
  H4_the_cover_is_still_comically_inadequate: 'He is plainly visible at f120; the plant hides a strip
    and no more. beats.''03''.done_when: `a crouch that actually conceals him fails the beat`.'
not_done_on_purpose: 'NO recipe change -- size, frames, fps, guidance, distilled sigmas, two-stage, offload,
  mode and --image-crf 10 are the b14 crf-10 parent''s, three rungs deep now. NO new init, NO new sha,
  NO new anchor. NO new seed: 20260820 for the third time, so rungs 1 and 2 are both true controls. NO
  change to the NEGATIVE, unchanged since rung 1 -- it named `standing up` and `walking out of frame`
  and failed, and leaving it in place is what keeps every rung a test of the positive. NO plate work:
  beat 13''s plate-exposure rung is deferred to what H4 says here. No pick, no plate_ack, no cut, no publication.'
pre_registered_fail_modes:
- 'F-STILL-FROZEN / F-STILL-DAMPED -- the middle placement does not restore motion, in which case the
  finding is that terminal conditioning saturates regardless of aspect and the next rung is mechanical:
  a shorter render, since 121 frames is the whole slot and a 73-frame clip has no dead tail to fill.'
- F-POSITION-GIVEN-BACK -- motion returns and he stands up or leaves again, i.e. the middle placement
  dilutes the terminal one. That would be a real finding about how much a single prompt can place at once.
- F-PLANT-PICKED-UP -- beat 15's failed clause; re-checked on all three, since beats 03 and 13 have now
  held their plants across two rungs each.
- F-MIDDLE-IS-A-CUT -- `HALFWAY THROUGH THE SHOT` is read as a shot change rather than as a moment. The
  negative already carries `cut to another shot, scene change, shot change`, which by this ladder's own
  law is not protection; named so it is a finding and not a surprise.
- F-IDENTITY-DRIFT -- held on all six clips so far; a regression would be attributable to the clause.
rung_2_the_control: 'ep2-b03-coverlast-0820: the placement worked and G2 fired with it. He is still crouched
  behind the plant at f120 where rung 1 was out of frame at f114 -- and judge_clip reports 33 FRAMES DEAD
  AT THE TAIL FROM FRAME 88, ncc exactly 1.0000. He holds the pose because the render stopped.'
skin_probe:
  box_xyxy_in_the_704x1280_init:
  - 232
  - 352
  - 282
  - 404
  placed_on: his cheek and jaw, below the eye and above the black scarf -- SKIN, not cloth, chosen by
    eye at 5x on the real cropped init and not by any colour rule
  f000_reading: R 101.5 G 108.2 B 70.1, R-B 31.4, luma 101.8 (std 20.8)
  how_to_read_it: Re-measure the same box on f120 and publish R, G, B, R-B and luma beside these. A green-skinned
    figure on a green field is exactly the case where one scalar decides nothing, so the whole triple
    is published and the verdict is written by eye against it.
  carried_verbatim_from: 'ep2-b03-coverlast-0820.yaml, and through it from the rung-1 spec where the box
    was placed by eye at 5x before any of these frames existed. Every rung renders the same init at the
    same sha, anchor and 704x1280 crop, so the box lands on the same skin. Copied byte for byte and labelled
    rather than re-placed: re-placing a probe after the frames exist is choosing the number.'
the_one_variable: 'THE ACTION CLAUSE GAINS A MIDDLE AND BOTH ITS STATES BECOME ONGOING. Rung 2 placed
  one static terminal attitude -- `IN THE LAST FRAME he is still crouched down low` -- and the sampler
  satisfied it by making every frame the last frame: 33 frames byte-identical from f088. Rung 3 names
  a state at the halfway point for it to travel through, and describes both the middle and the end as
  things still happening (shoulders still settling, eyes still moving, still breathing) rather than as
  positions arrived at. The wording shape is taken from the one sibling that paid no cost, ep2-b15-listenlast-0820,
  whose terminal sentence named an ongoing action and did not freeze.'
