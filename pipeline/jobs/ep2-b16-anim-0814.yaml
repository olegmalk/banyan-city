verdict_status_contested_against_the_ledgers_own_definitions:
  the_arithmetic: >-
    cut-readiness-0819.yaml defines its three status values precisely. `best-available` is
    "footage that a verdict lets into a cut but which no verdict calls a pass". `slate` is
    "nothing exists that a verdict lets into a cut". Beat 16's row currently reads
    `status: best-available`. A FOUNDER RULING THAT FOOTAGE IS NOT SHIPPABLE IS NOT A VERDICT
    THAT LETS IT INTO A CUT — it is the opposite — so on the ledger's own definitions this row
    cannot be `best-available`, and the value its definitions select is `slate`.
  what_is_changed_and_what_is_not: >-
    This lane does NOT flip the value, because flipping it changes the cut's slate count and
    implies an assembly action, and because that ledger says of itself "It makes no pick, promotes
    nothing, writes no plate_ack and approves nothing." What is added to the row instead is a
    loud contested field pointing at this verdict. THE DECISION IS AN ASSEMBLY'S AND IT IS ONE
    LINE EITHER WAY: slate beat 16 and lose a picture that a viewer would otherwise accept, or
    keep it and record explicitly that the episode ships a leaf the author rejected. Both are
    defensible; neither is a judging lane's to take.
