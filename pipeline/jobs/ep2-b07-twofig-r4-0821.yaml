failure_predicted_in_advance: 'THE BOBBLEHEAD, NAMED BY k2 BEFORE THIS LANE EXISTED. ep2-jerry-face-k2-0821
  filed, for the same dial: more adapter strength ''should pull the eye further toward the reference''s
  proportions ... while pulling the HEAD further toward a reference that is 100% head'', and it named
  containment breaking -- ''seated, purple cowl, or the tile''s field'' -- as the outcome that stops the
  route. BOTH ARE LIVE HERE AND ONE IS ALREADY HALF-PRESENT: this lane''s goblin reads head-heavy and
  childlike in all three rounds at 1.0, so 1.25 has less headroom than k2 had. SECOND, AND SPECIFIC TO
  DELETING THE WORDS: the negative still bans `round pupils, big round eyes` but the positive no longer
  asks for slits, so the adapter is unopposed AND unassisted -- if it returns a blank or featureless eye
  that is a FAIL of A1, not a partial win. THIRD: `2boys` with only one face reference may hand the guard
  the goblin''s head again, which is why `two goblins, goblin guard, bare head` is in the negative.'
not_done_on_purpose: THE SKELETON IS NOT TOUCHED, so G5 -- the arm reading more extended than the authored
  mid-raise -- is still open and is still not this round's question. NO MOTION IS FILED BY THIS JOB EITHER;
  the beat 07 motion rung waits on a human opening this png, which is the rule that has kept it unfiled
  through three rounds and is the reason no GPU time has been spent animating an off-canon character.
stop_rule: ONE SAMPLE, AND A2 OR A3 ENDS THE ROUTE. If raising ip-scale inflates the head or bleeds the
  reference's containment into the plate, this is RECORDED AND STOPPED -- no round 5, no ladder of scales.
  Beat 07 then keeps its slot in the founder's per-beat iteration queue with the three-round attribute
  table as its record, and the next move is his. This is written into the spec because a scale ladder
  is exactly the kind of thing a lane talks itself into at 2am after a near miss.
the_one_variable: 'WHERE THE GOBLIN''S FACE COMES FROM: tokens, or the adapter. That is one mechanism
  even though it touches three fields, and the three move together by necessity -- deleting the face words
  is what frees the budget, raising ip-scale is what replaces them, and the guard clause is what the freed
  budget was freed FOR. DELETED from the positive: `white eyes, slit pupils, constricted pupils, eyebags,
  thin eyebrows`. RAISED: --ip-scale 1.0 -> 1.25. RESTORED AND EXTENDED: the full guard clause plus `human`,
  `closed helmet` and `a full head taller`, with `two goblins, goblin guard, bare head` added to the negative.
  HELD BYTE-FOR-BYTE: the two-figure skeleton jerry-guard-twofig-0821.png at the same sha, xinsir/controlnet-openpose-sdxl-1.0
  at scale 1.0, jerry-canon-sq45-0821.png, the IP mask 87,485,412,763, ip-adapter-plus-face_sdxl_vit-h,
  seed 20260899, `muted color` and `boots`.'
the_step_size_and_why_it_is_that_size: '1.0 -> 1.25 is the SAME RELATIVE MOVE the k-ladder made when it
  tested this dial: k1 -> k2 went 0.7 -> 0.9, +29%. A timid raise answers nothing on a single sample and
  a large one guarantees the bobblehead, so the step that already has precedent in this tree is the defensible
  one. Note the starting point is itself already above the k-ladder''s chosen 0.7 -- the canon-plate route
  moved to 1.0 with a different reference -- so 1.25 is unexplored territory for this show and is being
  entered with A2 scored first and a stop rule attached.'
