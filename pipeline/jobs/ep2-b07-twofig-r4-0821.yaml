why: 'THREE ROUNDS PROVED THE WALL IS THE TOKEN BUDGET, SO THIS ROUND REMOVES A CLAIMANT INSTEAD OF MOVING
  TOKENS AROUND.


  R1 had the guard and missed the eye. R2 had the eye and lost the palette, the mask boundary, the guard''s
  hand and the boots. R3 had the eye, the palette, no halo, the hand and the boots, and lost the guard
  -- he came back as a bare green goblin skull in armour. Every attribute has been achieved in some round
  and never all in one, and every round was the same 77 tokens reallocated. That is a structural result,
  not a wording problem.


  WHAT THIS JOB DOES: takes the goblin''s FACE off the prompt entirely -- `white eyes, slit pupils, constricted
  pupils, eyebags, thin eyebrows` are deleted -- and leaves it to the IP-Adapter reference, which is a
  head-and-ears crop of the founder''s own image and has been carrying it all along. The adapter is raised
  1.0 -> 1.25 to compensate, the same +29% relative step the k-ladder used at 0.7 -> 0.9. Every freed
  token goes to the guard: `human` and `closed helmet` are explicit because round 3 returned neither,
  `a full head taller` writes the G3 bar into the prompt, and `two goblins, goblin guard, bare head` bans
  the round-3 defect by name.


  WHAT IS HELD: the skeleton at the same sha, controlnet scale 1.0, the reference, the mask 87,485,412,763,
  seed 20260899, and `muted color` and `boots` -- the two terms round 3 proved were load-bearing when
  round 2 spent them.


  WHAT STOPS THE ROUTE: k2 is explicit that raising strength pulls the head toward a reference that is
  100% head. If A2 or A3 fires, this is RECORDED AND STOPPED at one sample -- beat 07 keeps its slot in
  the founder''s per-beat queue with the three-round table as its record.'
