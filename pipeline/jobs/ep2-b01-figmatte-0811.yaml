  that ran on the same masks with the same geometry and parameters. LEAF: the fill
  prompt loses `warm low sunlight` and the negative gains eleven glow terms,
  against `ep2-b01-leafcount-inpaint-0811` at the same four seeds — that round
  removed the blade and filled the hole with a small sun. FIG: `matte green skin`
  in the positive and the specular/glow terms in the negative, against the
  2026-08-10 `b01-fig-inpaint-s1.png`, whose fruit wears a blown-out white cap.

