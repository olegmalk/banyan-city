  need to make SURE the fig growing on the sapling is mentioned, last time we generated
  002b it just.. appeared. also, the sapling was able to flail a leaf in episode 1? why
  couldnt it do that in 002b?" His FIRST `approval_condition` is beat 01''s: "The fig
  must GROW on screen, not already hang." So the fig is a condition of the script, not a
  decoration — which is why a beat-01 frame without one cannot satisfy him however well
  it is drawn. node.md beat 01: "On the thinnest branch a green nub swells, darkens and
  rounds into a single fig — the only thing in frame that moves." A still cannot show
  the growing; that is a T2/T3 question and it is not claimed here.'

