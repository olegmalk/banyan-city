  Roman's next look at beat 01. His ~16:15 sentence named two counts and both are
  answered in one frame for the first time: the leaf mask holds the count at two
  and the fig mask supplies the fruit. What goes with the frames is the question
  that no round can settle — the plate is dusk and the script says sunrise.

success: >-
  Four PNGs at C:\banyan-farm\fig-inpaint\out-figmatte\b01-figmatte-s0..3.png with
  their `.png.meta.yaml` provenance sidecars written at render time (7.2), all
  eight declared as artifacts so a missing one fails rc=92 instead of passing
  quietly. The four intermediate leaf-only frames are kept and published too, so
  the two fixes can be read apart. Whether either reads is a human's call at the
  frames; no metric decides it and this job ranks nothing.

why: >-
