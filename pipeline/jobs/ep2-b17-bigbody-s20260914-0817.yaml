# rewritten for the reproduction:
#   M1 a hand in contact with the cloak.
#   M2 that hand TRAVELS at least one hand-width across the fabric RELATIVE TO
#      THE CLOTH -- travel in FRAME is the number that means nothing.
#   M3 the hand moves, not the camera: frame edges, horizon and cloth folds
#      must not translate with it.
#   M4 a continuous path readable across consecutive frames.
