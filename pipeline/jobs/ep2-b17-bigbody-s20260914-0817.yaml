#   2 of 4 PASS      -> ambiguous; say so and say what would separate it.
#
# THE INTERNAL CONTROL IS THE INSTRUMENT THAT MADE THE ORIGINAL PERSUASIVE and
# it is carried over: the OTHER hand, same mask, same frames. It moved 2 px
# while the travelling hand moved 231. A camera move, a global drift or a
