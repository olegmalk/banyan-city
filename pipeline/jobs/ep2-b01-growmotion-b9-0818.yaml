consumer: THE COLD OPEN OF EPISODE 2'S CUT. This animates the founder's own 2026-08-13 route ("inpaint a SMALL fig
  into frame 1, then let the motion prompt grow it") on the frame-1 plate that passed its bar 7 of 7 today. A PASS
  is a candidate opening clip; a FAIL is consumed too -- it says which clause of the growth arc (swell, darken,
  stay-attached) the engine drops, which decides whether the fix is prompt-side, plate-side, or a staged colour
  ramp.
success: A 704x1280 mp4, 121 frames at 24 fps, opening on the passed nub plate. PASS is G1 growth by a continuous
  path + G2 end-state deep purple-violet + G3 exactly two leaves in every frame + G4 no size doubling and below
  the grass + G5 only the fig moves with the camera locked (whole-frame registration). FAIL is any of H1 frozen,
  H2 stays green, H3 leaf count breaks, H4 balloon or camera push, H5 the fig detaches or teleports (the 2026-08-12
  fault, named in advance), H6 scene break. A partial is a FAIL. Judged by opening all 121 frames consecutively;
  depth is retired and no number from it will be quoted.
