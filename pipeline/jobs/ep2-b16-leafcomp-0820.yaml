    #!/usr/bin/env python3
    """Fetch beat 16's LARGE-LEAF-IN-FRONT composite and its mask; refuse on any sha mismatch.

    No model, no GPU, no spend. Both files are on origin/main, so the sha256s
    asserted here are verifiable against the repo by anyone who clones it. They were
    made on a Mac by pipeline/beat16_leaf_composite.py, so they are NOT on the box's
    courier worktree -- the courier only ever contains what the box produced.

    THE INIT THIS FETCHES BREAKS CANON ON PURPOSE, AND THAT IS THE WHOLE POINT.
    canon.yaml sapling-cotyledon-shape -- the founder's own 2026-08-17 answer --
    rules out "any leaf drawn as a feature ... no leaf whose SHAPE is the subject of
    the shot". Beat 16's brief asks for exactly that shot. The composite builds it so
    he can look at what licensing it buys instead of imagining it. Nothing built on
    these bytes may enter a cut.

    The SHAPE still obeys the ruling even though the framing is the exception: an
    ordinary ovate blade, blunt apex, no lobes, no palmate fingers, aspect 1.95.
    """
    import hashlib, os, sys, urllib.request

    OUT = r"C:\banyan-farm\b16leafcomp-0820"
    RAW = ("https://raw.githubusercontent.com/olegmalk/banyan-city/main/"
           "farm-out/ep2-b16-leafcomp-0820/")
    UA = {"User-Agent": "banyan-city-b16-leafcomp/1.0 (albert.numbro@gmail.com)"}
    WANT = {
        "16-why-leafcomp-0820.png":
            "7d9031c2ddd72f234f1d37abd04db0b7e2ebdaebd1862220b41089fc55d95540",
        "16-why-leafcomp-mask-0820.png":
            "8db8bb33bab72c1726f0b15ef74402695490a7e6c67f4bb8f14cf7973d399268",
    }

    os.makedirs(OUT, exist_ok=True)
    for name, want in WANT.items():
        raw = urllib.request.urlopen(
            urllib.request.Request(RAW + name, headers=UA), timeout=120).read()
        have = hashlib.sha256(raw).hexdigest()
        if have != want:
            sys.exit("!! SHA MISMATCH for %s -- refusing.\n   want %s\n   have %s"
                     % (name, want, have))
        with open(os.path.join(OUT, name), "wb") as fh:
            fh.write(raw)
        print("fetched %s %d bytes sha %s OK" % (name, len(raw), have), flush=True)
