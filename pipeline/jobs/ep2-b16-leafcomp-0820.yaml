mask_provenance: 'Written by the same tool in the same run; sha 8db8bb33bab72c1726f0b15ef74402695490a7e6c67f4bb8f14cf7973d399268,
  342519 white px, 33.86 percent of the 832x1216 frame. THAT IS THE LARGEST MASK THIS HOUSE HAS FIRED
  BY AN ORDER OF MAGNITUDE -- beat 13''s passing parent was 4.10 percent and its tall variant 7.97 --
  and it is stated here loudly rather than buried, because the work ladder''s own warning is that `a 0.30
  pass over 60-80 percent of a picture is a re-render, not an inpaint`. This is 33.86, between the two,
  and which side of the line it falls on is the thing the rung measures. It is the DRAWN FOOTPRINT plus
  the blade''s cast shadow, dilated by 10; the build is purely additive -- there was no wrong leaf to
  erase -- so there are no vacancies in it. Grow is 10 rather than beat 03''s 12 because pattern 12''s
  rule is grow > feather and there is no feather here: the outline''s half width is 3.1 px and the LANCZOS
