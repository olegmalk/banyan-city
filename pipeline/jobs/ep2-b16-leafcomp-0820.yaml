- name: publish
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    # EVERY FILE IS NAMED IN FULL, not matched by a glob. A glob that misses
    # publishes nothing while returning a code that reads like a render failure,
    # and box_enqueue.output_path_problems refuses a spec whose declared artifacts
    # are never named by any step -- which a wildcard defeats. Missing ONE file is
    # a FAIL of the job. No allow_fail anywhere in this spec.
    import hashlib, os, shutil
    from_dir = "C:/banyan-farm/b16leafcomp-0820"
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b16-leafcomp-0820"
    NAMES = [
        "b16-leafcomp-s20260820.png",
        "b16-leafcomp-s20260820-mask.png",
        "b16-leafcomp-s20260820.png.meta.yaml",
        "16-why-leafcomp-0820.png",
        "16-why-leafcomp-mask-0820.png",
        "prompt.txt",
        "negative.txt",
    ]
    os.makedirs(dst, exist_ok=True)
    lines = []
    for name in NAMES:
        f = os.path.join(from_dir, name)
        if not os.path.isfile(f):
            raise SystemExit("!! missing %s -- refusing to call the job clean." % f)
        shutil.copy2(f, dst)
        with open(os.path.join(dst, name), "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + name)
    with open(os.path.join(dst, "ep2-b16-leafcomp-0820.sha256"), "w",
              newline="\n") as fh:
        fh.write("\n".join(sorted(lines)) + "\n")
    print("published", len(lines), "file(s) + manifest ->", dst)
    raise SystemExit(0 if len(lines) == len(NAMES) else 1)
