script_authority: 'Node 002b-first-citizen, approved_by: founder. THIS PRODUCES A STILL, NOT AN EPISODE:
  STEWARDSHIP 6 gates voice, footage and assembly, and a labelled evidence still for a review card is
  none of those. inpaint_fruit.py writes approved: false and a provisional: block into its own sidecar.
  THE CANON TENSION IS NOT RESOLVED BY THIS JOB AND IS NOT CLAIMED TO BE: canon.yaml sapling-cotyledon-shape
  still forbids a leaf whose shape is the subject of a shot, beat 16''s brief still asks for one, and
  which of the two moves is a taste call reserved to the author (R4).'
bar:
  HOW_THIS_DIFFERS_FROM_EVERY_COMPOSITE_BAR_BEFORE_IT: The four passing composites (beats 15, 19, 03,
    13) all scored a SMALL plant composited INTO a plate, and their bars ask whether a 30-60 px object
    survived. Neither the object nor the relation is the same here. The object is an 800 px blade over
    33.86 percent of the frame and the relation is OCCLUSION -- `the leaf is the subject and he is depth`.
    So the clauses below are written for this rung and the earlier ones are not carried by name.
  L1_THE_LEAF_IS_STILL_ONE_ORDINARY_LEAF: 'ONE blade, ovate, blunt apex, NO lobes, NO palmate fingers,
    NO lance point, NO serrated margin. The composite passes this by construction and by arithmetic --
    C10 counts exactly one maximum in the half-width profile and a tip half-width of 0.34 of b against
    a lance floor of 0.18 -- so ANY lobe, finger or serration in the output is the sampler''s and is a
    FAIL. This is the clause the whole card hangs on: the author''s 08-17 ruling exists because a lobed
    palmate fig arrived on this beat in 0814, and a rung that hands him another one has answered nothing.'
  L2_THE_OCCLUSION_RELATION_SURVIVES: The leaf is IN FRONT and he is BEHIND. The composite puts 153122
    drawn px inside his measured face box, 51.6 percent of it, and both his eyes are under the blade.
    If the output resolves the overlap the other way -- his features drawn THROUGH the leaf, or the leaf
    reading as a flat green shape lying ON his face rather than in front of it -- this FAILS, and it fails
    whatever the leaf itself looks like.
  L3_THE_BLADE_READS_AS_DRAWN_CEL_ART_IN_THIS_FRAME_S_DIALECT: 'The pass tell from composite-init-pattern.md
    7, and the reason 0.30 is worth firing at all: soft procedural relief comes back AS crisp cel line
    work in the same weight and colour as the line art elsewhere in the frame. The composite deliberately
    supplies NO tertiary venation so there is something for 12 steps to add. Mean |grad| inside the blade
    is 0.95 against the plate''s own untouched face at 3.43; if that gap does not close, the pass did
    not contribute. THE RATIO IS A FILTER TO PRINT BESIDE THE PICTURE, NOT THE VERDICT.'
  L4_HE_COMES_BACK_UNCHANGED_WHERE_THE_MASK_DOES_NOT_REACH: His skull crown, both ears, both cloak shoulders
    and the whole grass bed are outside the mask. The compositor asserts 0 px changed outside its declared
    footprint, so he arrives byte-identical there and any readable drift is the sampler's. The padding_mask_crop
    round trip does move pixels outside the mask -- beat 13's parent measured 24822 of them, only 239
    exceeding a diff of 8 -- so the test is READABLE drift by eye at 3x, not a nonzero pixel count.
  L5_THE_MIDRIB_DOES_NOT_BECOME_AN_EDGE: The clause composite-init-pattern.md 5 was written for, at 13x
    the object size it was measured on. The composite keeps the midrib a ridge and holds every secondary
    vein strictly weaker than the outline on both gradient (37.4 against 70.6) and darkness (62.9 against
    39.6), measured on the finished pixels by C7. If the output splits the blade along the rib into two
    leaves, or draws a hard black line down it, the law holds at this scale too and the finding is worth
    as much as a pass.
  how_scored: 'By eye at 1x and 3x on the blade and on his face, against the committed composite SIDE
    BY SIDE at 1:1, and against the clauses above and nothing else. A metric is a filter, never a verdict.
    The side-by-side is not optional on this rung: beat 13''s sibling result this morning was a composite
    and an output that were nearly indistinguishable at 1:1, which by pattern 7 means the pass is a paste,
    and that is invisible to every number either lane computed.'
