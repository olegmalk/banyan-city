  the geometry is the steward''s and offers ONE legible instance of `the leaf is the subject`, and a second
  would ask the author two questions where the card asks one. NO ATTEMPT AT FOCUS SEPARATION: blurring
  him is writing outside the drawn footprint, which C1 forbids and which would be a second variable; if
  the shot is licensed, focus belongs to the plate authored under the licence. NO CANON EDIT. NO REVIEW
