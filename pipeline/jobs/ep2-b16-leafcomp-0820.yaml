is_show_content_why: 'CARD EVIDENCE, NOT A CUT INIT, AND PASSING A BAR IS NOT A LICENCE TO ENTER A CUT.
  This frame deliberately builds the shot canon forbids. pipeline/canon.yaml sapling-cotyledon-shape --
  the founder''s own 2026-08-17 answer, `the sapling 2 leaves are average leaves` -- rules out `any leaf
  drawn as a feature ... no leaf whose SHAPE is the subject of the shot`, and beat 16''s brief asks for
  exactly that shot. Both are his and they ask for opposite things. These bytes exist for one purpose:
  to sit on /review/ep2-b16-leaf-0820 as the rendered half of the LICENCE answer so the author can rule
  on a picture instead of on a description. NO CLIP, NO EPISODE AND NO PUBLICATION MAY BE BUILT ON THEM,
  and a PASS on every clause changes none of that. CANON IS UNCHANGED unless and until he rules `licence
  it`, at which point the exception goes into canon.yaml AS an exception so it cannot drift into the other
  beats. Beat 16 continues to ship in the demo cut as a slate.'
