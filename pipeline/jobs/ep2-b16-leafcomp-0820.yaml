the_one_variable: THE INIT, AND ITS MASK, AND NOTHING ELSE. Model, steps 40, cfg 7.5, strength 0.30, padding_mask_crop
  64, blur 8 and seed 20260820 are beat 13's numbers, and inpaint_fruit.py is beat 13's payload byte-for-byte.
  The init changes from a small plant composited INTO a plate to a LARGE object drawn IN FRONT of one
  -- 33.86 percent of frame against 4.10 and 7.97, an 800 px blade against a 485 px and a 921 px plant,
  and an occlusion relation instead of a placement. The prompt and negative are NOT the parent's, because
  the parent's describe a two-leaf sapling beside a seated figure and this frame contains neither; they
  are authored to describe this init and are measured at 75 and 68 of 77 tokens.
pre_registered_fail_modes:
  FAIL-RE-RENDER: THE MOST LIKELY FAILURE ON THIS INIT AND IT IS NAMED FIRST, BECAUSE IT IS THE ONE THE
    MASK SIZE BUYS. 0.30 runs 12 of 40 steps, but over 33.86 percent of the frame the model has enough
    surface to decide the region is a different picture. The tell is that the leaf's POSITION, SIZE or
    ANGLE moves, or that structure appears in the masked region that the composite never drew -- a second
    leaf, a stem, a hand, sky. If it fires, the finding is that the house's 0.30 does not transfer to
    a mask this size, which is a real answer to the work ladder's own warning and is worth more than the
    picture would have been.
  FAIL-PASTE: 'THE COMPOSITE AND THE OUTPUT ARE INDISTINGUISHABLE AT 1:1 IN THE LEAF REGION. Pattern 7:
    `if you cannot see a difference between your composite and the output, the pass is a paste.` NAMED
    WITH TODAY''S EVIDENCE BEHIND IT rather than as boilerplate -- the beat 13 lane hit exactly this on
    ep2-b13-tallcomp-0820 this morning, and it hit it WHILE the sampler engaged harder than on the passing
    parent (mean |delta| inside the mask 8.62 over 7.97 percent against 6.23 over 4.10). SO ENGAGEMENT
    IS NOT EVIDENCE AGAINST THIS MODE AND WILL NOT BE READ AS SUCH. The scoring step is a crop of the
    leaf region at 1:1, composite beside output, looked at.'
  FAIL-DECAL: 'The five tells from pattern 3, checked on the output and not only on the composite: texture
    axes not following the object''s tilt; a pattern ignoring the frame''s light (measured (0.345, -0.939)
    off the head''s own low pass, corroborated by the blown skull rim and the cheek split); a swatch stopping
    short of or overrunning the object''s own edge; visible tiling or a repeat; detail at the wrong scale
    against his head as the in-frame ruler. The composite was iterated against these five specifically
    and four drafts were thrown away on them, so a decal in the OUTPUT would be the sampler flattening
    something that was not flat, which is a different and more interesting finding.'
  FAIL-VEIN-SPLIT: 'The blade comes back as TWO leaves, or with a hard black line down the midrib. This
    is composite-init-pattern.md 5''s law tested at 13x the object size it was measured on, and it is
    the specific risk the venation design takes: secondaries are real cel linework here, not relief, because
    at 800 px a ridge-only blade reads bare. They are held strictly weaker than the outline and none reaches
    the margin, and C7 measures it -- but the law was learned from a sampler, not from a compositor, and
    only a sampler can confirm the reading transfers.'
  FAIL-FACE-REGROWS: 'The sampler completes his face THROUGH the leaf. Pattern 13''s cue law, applied
    forward: a masked region is filled with whatever the surviving cue suggests, and the cues around this
    mask are a skull crown, two pointed ears and two cloak shoulders, all of which say `a face belongs
    here`. Beat 01 lost a rung to a stem node doing exactly this. THE CUES CANNOT BE PATCHED -- they are
    the founder''s own plate and C1 forbids touching them -- so this mode is ACCEPTED IN ADVANCE as a
    possible outcome rather than defended against, and if it fires the finding is that an occlusion this
    deep needs the figure re-staged rather than covered.'
  FAIL-LOBES-RETURN: A lobed, palmate, fingered or serrated blade. The exact defect the author rejected
    on 08-16 and the reason canon.yaml sapling-cotyledon-shape exists. The composite is convex, single-maximum
    and blunt-apexed by arithmetic and the negative front-loads five terms against it, so a lobed output
    is the sampler overriding both. THIS IS THE ONLY FAIL MODE THAT WOULD MAKE THE FRAME UNUSABLE AS CARD
    EVIDENCE, because a card asking `may a leaf be the subject` cannot be illustrated with the wrong leaf.
  FAIL-LEAF-DISSOLVES: The sampler erases the blade back into the grass and the goblin. The plate's own
    foliage and his skin are THE SAME COLOUR to within four levels in every channel -- grass-bed luma
    band 90-140 means (107.3, 128.1, 79.6), his lit forehead is (111, 132, 79) -- which is why the composite's
    palette was pushed to true green along one named axis. If 12 steps pull it back toward the plate's
    own hue, the blade stops separating from the two things it overlaps and the shot has no subject.
  FAIL-MASK-HALO: 'A visible seam, rectangle or brightness step along the padding_mask_crop boundary.
    NAMED BECAUSE THE AREA IS FOUR TIMES BEAT 13''S: pad-crop 64 crops the masked region with padding,
    upscales it to pipeline resolution, inpaints and pastes back, and this paste boundary runs diagonally
    across his face and the grass bed rather than sitting low in texture. HF''s own documentation warns
    that this latent-blend branch is `why you can see the mask outline`.'
  FAIL-FIGURE: His skull, ears, cloak or the grass bed drift where the mask does not reach. He arrives
    byte-identical there -- the compositor asserts 0 px changed outside its declared footprint -- so any
    readable change at 3x is the sampler's alone.
