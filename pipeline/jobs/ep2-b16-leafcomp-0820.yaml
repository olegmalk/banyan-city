not_done_on_purpose: 'NO FOURTH WORDING RUNG. The ladder is closed at three and the third was a pure permutation
  that changed nothing; the prompt here is not a rung, it is a description of an init that already contains
  what it names. NO STRENGTH SWEEP: one sample, one seed, 0.30. STRENGTH IS PRE-REGISTERED AS THE NEXT
  RUNG IF THIS ONE COMES BACK WEAK, and it is named now so it cannot be claimed afterwards as a foreseen
  fix -- moving strength and the object class in the same fire measures neither, and 0.30 is the value
