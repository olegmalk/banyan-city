  with its own .meta.yaml beside it. ALL TEN CHECKS ARMED AND PASSING: C1 outside-footprint 0 px (footprint
  declared as object 269868 + anti-alias support 2859 + cast shadow 40950); C2 whole blade inside the
  frame; C3 one drawn component; C4 darkest solid drawn luma 39.6 against the plate''s own 0.0; C5 aspect
  1.95 in the 1.6-2.6 band; C6 mask fraction printed; C7 venation strictly weaker than the outline; C8
  the outline not stronger than the plate''s own p99.9 linework; C9 the occlusion relation, 51.6 percent
