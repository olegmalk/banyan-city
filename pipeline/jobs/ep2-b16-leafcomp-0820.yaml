negative_ordering: 'THE NEGATIVE IS THE PLATE''S OWN, BYTE-FOR-BYTE, AND THAT IS DELIBERATE: it is the
  negative both 0820 plates ran under, so it is not a variable on this rung. Measured with pipeline/clip_token_count.py
