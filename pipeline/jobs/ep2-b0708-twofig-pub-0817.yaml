    #!/usr/bin/env python3
    """Stamp both fetched plate sidecars as unapproved provisional stills.

    The Mac sidecars record model, prompt, negative, seed and cost, and they do
    NOT record whether the still may ship. REFUSES if it finds no sidecar -- a
    run whose provenance files did not get written must not pass silently.
    """
    import glob, os, sys

    OUT = r"C:\banyan-farm\ep2-b0708-twofig-pub-0817-out"
    side = sorted(glob.glob(os.path.join(OUT, "*-twofig-mac-*.yaml")))
    if not side:
        sys.exit("!! no sidecar yaml in %s -- refusing to call the job clean." % OUT)
    for p in side:
        with open(p, "a", encoding="utf-8", newline="\n") as fh:
            fh.write(
                "# --- appended after the fetch by the backlog-depth lane, 2026-08-17.\n"
                "approved: false\n"
                "provisional: true\n"
                "cost_usd_confirmed: 0\n"
                "note: |\n"
                "  A PLATE republished onto the results branch so box_enqueue's plate\n"
