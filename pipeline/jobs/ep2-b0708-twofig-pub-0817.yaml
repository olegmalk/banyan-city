                "  for any cut, and nothing here was re-rendered: these are the Mac\n"
                "  bytes of ep2-b0708-twofig-mac-0815 with this block appended. Taste\n"
                "  and trunk/graft calls are R4's and this job makes none.\n")
        print("stamped %s" % os.path.basename(p), flush=True)
