    #!/usr/bin/env python3
    """Fetch the two passing two-figure plates and REFUSE on any sha mismatch.

    No model, no GPU, no spend. The bytes are the ones committed to origin/main,
    so every sha256 asserted here is verifiable against the repo by anyone with
    `git cat-file blob origin/main:<path> | shasum -a 256`.
    """
    import hashlib, os, sys, urllib.request

    OUT = r"C:\banyan-farm\ep2-b0708-twofig-pub-0817-out"
    RAW = ("https://raw.githubusercontent.com/olegmalk/banyan-city/main/"
           "farm-out/ep2-b0708-twofig-mac-0815/")
    UA = {"User-Agent": "banyan-city-twofig-pub/1.0 (albert.numbro@gmail.com)"}
    WANT = [
        ("08-inside-him-twofig-mac-r3-s0.png",
         "d9cd8b1a4642a60a3362d07feef30b47999bbe988e4ef52d047d1f4d06113238"),
        ("08-inside-him-twofig-mac-r3-s0.yaml",
         "e28136652e6b0a1988bf727d0695123aeb90153eb4dab007b6a2ce42922a2c8c"),
        ("07-confiscate-twofig-mac-r1-s0.png",
         "cf97f87834571995aac5e7c2d2a7f091e721e16f07ff11b4cc12ad190d20012b"),
        ("07-confiscate-twofig-mac-r1-s0.yaml",
         "68f91e55086a30d1bab901d88708a478ff653bd5a374bccdb6c7999fafb4ed49"),
    ]
    os.makedirs(OUT, exist_ok=True)
    for name, want in WANT:
        raw = urllib.request.urlopen(
            urllib.request.Request(RAW + name, headers=UA), timeout=120).read()
        have = hashlib.sha256(raw).hexdigest()
        if have != want:
            sys.exit("!! SHA MISMATCH for %s -- refusing.\n   want %s\n   have %s"
                     % (name, want, have))
        with open(os.path.join(OUT, name), "wb") as fh:
            fh.write(raw)
        print("fetched %-38s %8d bytes  sha %s  OK" % (name, len(raw), have),
              flush=True)
    print("all four blobs match their asserted sha256.", flush=True)
