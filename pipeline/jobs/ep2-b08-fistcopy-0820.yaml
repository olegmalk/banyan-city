script_authority: 'Node 002b-first-citizen, approved_by: founder. THIS PRODUCES A PLATE, NOT AN EPISODE:
  STEWARDSHIP 6 gates voice, footage and assembly, and a still init for an approved beat is none of those.
  inpaint_fruit.py writes approved: false and a provisional: block into its own sidecar. Beat 08''s script
  line is ''lowers the clipboard and points'' and this rung touches only the LOWERING hand -- the pointing
  arm is outside the mask and byte-restored every step. No authoring call is made here: the hand that
  grips is the plate''s own drawn fist, translated, so not one digit is invented.'
bar:
  C4prime: 'THE CLAUSE THIS RUNG WAITED FOR. Run pipeline/fill_quality.py on the 7914 px region where
    the original fist was (published as 08-first-citizen-fistcopy-erase-0820.png): D >= 0.45 AND N >=
    0.25 AND F <= 2.60, against the landed frame with the init as --plate. The retired C4 would have passed
    the gripcomp corduroy comb at 89%; C4'' fails it at N 0.084 / F 7.87 and passes every honest composite
    fill on b03/b13/b15/b19. Measured false-positive rate 3.0%.'
  H1_the_fist_is_GONE: 'The original fist must be DELETED, not dented. No skin-toned blob survives inside
    poly(FIST) grown 6: judged by eye at 5x and by the absence of a closed light region there. THIS IS
    THE CLAUSE THE STRENGTH WAS CHOSEN FOR and the one most likely to fail.'
  H2_the_arm_CONNECTS: "A forearm runs from the authored elbow (627,580) to the copied hand at the wrist\
    \ (621,673) with no gap and no second limb. \xA721's 'sticker of a hand' verdict is what this clause\
    \ exists to prevent."
  H3_the_digits_SURVIVED: The copied fist's drawn fingers and thumb are still individually legible at
    5x. They are outside the mask and restored every step by the latent blend, so this is close to guaranteed
    -- it is in the bar because --blur 8 softens the boundary and the outer rim of them does take a fraction
    of the pass.
  H4_contact_not_decal: "The hand closes around the board's top edge: contact shading or occlusion is\
    \ visible where fingers cross it, and the stair-stepped octagonal rim \xA721 named is gone. This is\
    \ the clause the 12 px rim was opened for."
  B6_wardrobe: "The cream shirt, the white sash and the brown wrap are still THREE garments, not one robe.\
    \ 20.1% of the shirt and 32.5% of the sash are inside the corridor and are genuinely at risk -- see\
    \ the named fail mode. Measured the way \xA719 measured it: sleeve RGB against scale30's (217.9,193.4,165.0),\
    \ and merged-into-wrap reads about (161.6,115.4,80.3)."
  B8_hair: Canon light sandy hair, not bald. 0 of 18200 head px are in the mask so this CANNOT move; it
    is in the bar as a falsifiable check on that claim, and if it moves the mask is not what it says it
    is.
  scale30_clauses_hold: "Every clause scale30 passes, outside the mask, unchanged: B1, B2 (goblin/guard\
    \ skin separation, +60.6), B3, B4a (board quad px below luma 80, 0.758 -- MINUS the hand's intended\
    \ occlusion of the top-left corner, which is the point of the rung and not a regression), B4b, B4c,\
    \ B5. The board is OUTSIDE the mask and the latent blend restores it every step, so unlike \xA718\
    \ this pass cannot lose it."
