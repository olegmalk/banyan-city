owner: goblin-design audit lane, 2026-08-20 night
consumer: 'THE JERRY LoRA TRAINING SET. pipeline/lora/curation-tile-0820.yaml re-curated the existing
  31 frames against the B tile and kept SEVEN, in four poses, and refuses to file training on a set that
  would teach a pose instead of a character. This job is one of twelve poses filling that gap. It is a
  training CANDIDATE and not a pick: no beat plate, nothing in any cut, and it still has to clear T1-T4
  and T7 by eye before it enters any manifest.'
success: ONE 832x1216 png of the tile-faithful creature in the pose 'kneeling, both hands on knees, in
  tall grass, full body' (beat 14 and beat 19, the two poses already in the set), at seed 20260831. The
  identity clause and the negative are byte-identical to the ratified recipe in pipeline/canon.yaml correction_2026_08_20;
  the POSE and the cloak word are the only things that differ between the twelve jobs, and the cloak word
  is set by the framing rule, not by choice.
why: 'POSE p12 OF TWELVE, SERVING beat 14 and beat 19, the two poses already in the set. The recipe was
  measured over fourteen $0 samples tonight and is ratified in canon; what the dataset lacks is bodies,
  not wording. `patchwork cloak` is used here because the framing is full body and the cloak word is framing-dependent
  by measurement: at a tight crop `patchwork` paints the SKULL (six of eight wedge rungs), at full body
  it lands on the cloth. Negating it does not work -- rung w1 added `scar, stitches` to the negative and
  the patch returned frame-for-frame identical.'
bar: "EVERY FRAME IS A CANDIDATE, NOT A PICK, AND CLEARS THE SAME FOUR\nCLAUSES BY EYE BEFORE IT ENTERS\
  \ THE MANIFEST -- read at 1:1 against\nreview/ep2-goblin-design-0819/adult-b19-0819.jpg:\n  T1 EYES\
  \  blank white, no iris, no pupil.\n  T2 NOSE  no bridge, no tip, no drawn nostrils.\n  T3 AGE   no\
  \ brow furrows, no folds, no jowls.\n  T4 EARS  short and low if visible. LONG TAPERING SPIKES ARE A\
  \ REJECT, and on\n           this set that is not a style note: the LoRA exists to teach an ear\n  \
  \         Danbooru cannot name, so one spiked frame in the set teaches the\n           spike.\n  T7\
  \ SKIN IS NOT A COSTUME. No stitches, seams or patches on the head or face.\nT5 (dome) and T6 (two-tone)\
  \ are NOT scored. T6 was STRUCK from the tile bar on\n2026-08-20 -- rung w3 proved `two-tone skin` renders\
  \ as two discrete regions (a\nmagenta half-head), so the tile's falloff is rendered light and asking\
  \ for it\nmanufactures a defect.\nA FRAME THAT FAILS ANY OF T1-T4 OR T7 IS DROPPED, NOT FIXED. There\
  \ are twelve\nhere and the set does not need all twelve."
failure_predicted_in_advance: 'THE CLOSE-UPS ARE THE RISK AND THE FULL BODIES ARE NOT. Every

  full-body rung tonight held the face (w4 seated, w5 running, w6 wide), so p01,

  p02, p04-p07, p10-p12 are predicted to pass T1-T3 and to be UNSCORABLE on T4

  because the ear will be a few pixels. An unscorable pass tells us nothing about

  the ear, which is the attribute the LoRA is for -- so THE THREE CLOSE-UPS (p03,

  p08, p09) CARRY THE EAR EVIDENCE ALONE, and if they fail, the set trains

  everything except the one thing no prompt can say.

  THE TWO MOST LIKELY INDIVIDUAL FAILURES, named so they are not explained away:

  p09 (looking up, from below) because a low angle puts the jaw and the underside

  of the skull in frame and nothing tonight has tested that geometry; and p10

  (from behind, looking back) because a turned head is where identity drift lives

  in every i2v result this tree has produced.

  IF FEWER THAN SIX PASS, the wording route has reached its ceiling for dataset

  purposes and the honest next instrument is IP-Adapter conditioned on the tile

  itself -- slower, and not to be reached for before this is measured.'
one_sample_rule: SATISFIED, and this is the one place in tonight's work where the argument has to be made
  rather than pointed at. The rule is one sample per RECIPE CHANGE and this file changes no recipe --
  it was sampled fourteen times tonight (tileread v0-v7, tilefix w1-w6), the pictures are on /review/ep2-goblin-design-0819,
  and w4/w5/w6 already showed it survives a seated, a running and a wide body. What varies here is the
  POSE, which is the missing dataset input. Nothing is promoted and no beat is rendered.
the_one_variable: The pose-and-framing clause. Identity clause, negative, checkpoint, steps, cfg and size
  are identical across all twelve; the seed walks so the set is not seed-degenerate; the cloak word is
  a function of the framing and not a free choice.
