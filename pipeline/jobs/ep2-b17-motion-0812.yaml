# 2026-08-12, the goblin motion wave. FIRED ON A PASSED PROBE, not on a hunch.
#
# ep2-b15-action-probe-0812 asked whether motion can supply blocking the stills could
# not, and it came back yes on every predicate: from a standing character-sheet still
# the goblin tipped his head back, looked up and talked, stayed the same goblin, stayed
# put in frame, and the camera held. It also did something nobody predicted -- IT PAINTED
# A BACKGROUND. The blank white of the still became a field with a treeline and a dawn
# sky, which is the exact fault the founder named on the b04 clip.
#
# So each beat here gets the same recipe with ITS OWN ACTION written into the positive
# prompt, in the same voice that worked for b15: the action stated in capitals as the
# subject's own movement, the body kept in place, the camera stated as locked and its
# defects named in the negative at guidance 2.0.
#
# LENGTH IS CAPPED AT 121 FRAMES AND THAT IS A MEASURED DECISION, not the beat sheet's.
# The b04 pair measured drift scaling with requested length -- clean at 73, both eyes
# destroyed at 145 -- and the cold open re-painted its entire field at 233. Rendering a
# six-second beat at a length already measured to fail would be spending the card to
# reproduce a known defect. Beats shorter than five seconds keep their own length; beat
# 14 is written as six and is capped, which makes it a trim or a two-shot at edit time.
#
# NOT IN THIS WAVE: beat 02 (identity fails outright, his own note), beat 06 (the guard
# is bald and he vetoed that today), beat 08 (a single-character reference suppresses the
# second character, so no prompt puts the guard in -- it stays on the needs-founder list),
# beat 04 (he asked for no re-motion until a background-bearing still exists).#
# NEGATIVE CORRECTED BEFORE THIS EVER RAN. The first cut of this wave inherited b15's
# negative wholesale, which bans "changing position" — and b15 only ever moved a head and
# a mouth, so the probe never tested that term against a POSE change. Four of these beats
# are nothing but a pose change: 03 crouches, 13 folds down, 17 turns to go, 19 needs a
# fig to fall through the frame. I was about to spend the card asking for a movement and
# forbidding it in the same breath — the b10 lesson exactly. The ban now names what it
# actually meant (leaving his mark, drifting out of frame) and says nothing about pose.
# Beat 17 additionally loses the "walking away" ban, because walking away is the beat.
