eye_sample_2: 'SECOND SAMPLE FOR THE sq65 EYE, AND IT IS A SAMPLE AND NOT A WAVE. r13a (beat 13, pose
  `sit`) is the only frame this reference has been judged on since the ear-span anchor retired the height-normalised
  sheets, and by the steward''s eye at matched ear span it is right: the eye is visibly narrower and smaller
  than r12d''s and it is the closest of the four to taste/refs/goblin-canon-founder-0821.png. THAT IS
  STEWARD-PROVISIONAL. The founder has not seen it and the eye is R4.


  WHY THIS ONE FRAME AND NOT THE TWELVE THAT SIT ON r12d. The morning compositor lane refused the wave
  in its own words -- ''NO WAVE RE-FIRE. Twelve beats sit on r12d. Re-plating eleven of them on a face
  the author has not seen is the r11a mistake by name'' -- and r11a was itself an sq65 firing that was
  not adopted. That refusal stands. What a second sample buys is the thing a wave cannot: if the founder
  says yes, the wave is already de-risked on a second pose; if he says no, four card-minutes were spent
  instead of forty-four.


  WHY BEAT 04. Its own stage direction is ''THE PEEK ... THE EYES ARE THE WHOLE BEAT'', so it is the beat
  where this reference has the most to prove, and its pose is `hunch` rather than r13a''s `sit` -- a different
  skeleton, a different head mask, so a pass here is not the sample repeating itself.


  AND A CAUTION MEASURED THIS MORNING ON A DIFFERENT LEVER. The four-cell ep2-b16-canon-w5 ladder struck
  `glowing eyes, orange eyes, third eye, eyepatch` from the negative to buy CLIP-77 headroom -- four terms
  the record twice calls inert -- and ALL FOUR CELLS came back with a malformed eye: diamonds, a zigzag,
  a stray disc, a blank oval, on the beat and seed where w4 with those terms present draws two clean matched
  almonds. The eye on this stack is the most fragile thing in the recipe, which is a reason to sample
  it twice and not a reason to skip the sample.'
