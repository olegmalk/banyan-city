# ============================================================================
# PRE-REGISTERED PLATE BAR. Every axis judged BY OPENING THE IMAGE -- never by a
# metric, a file size, a process list or a summary. Axes 1-7 are the parent
# job's (ep2-b0708-twofig-mac-0815) verbatim and are NOT relaxed because the
# shot got tighter; 8 and 9 are this round's own and are why it exists.
# ============================================================================
plate_bar:
  1_two_figures: >-
    TWO whole distinct figures in frame. A single figure fails. A figure plus a
    stray hand, forearm or leg at the frame edge fails. Three or more fails.
    "Whole" is relaxed EXACTLY as far as the framing tag requires and no
    further: at torso-tight both figures are cut by the BOTTOM edge, which is
    the point, but neither may be cut by a SIDE edge and neither head may be
    cropped.
  2_identities: >-
    One is an ADULT HUMAN guard: adult proportions, brown tunic and sash, ROUND
    HUMAN EARS. The other is a GOBLIN: green skin, pointed ears, patched cloak.
    A guard with pointed ears is a FAIL however good the rest is. 4 of 18 prior
    frames failed here.
  3_workable_distance: >-
    Both in the SAME depth plane, separated by roughly one figure width or less,
    so an arm extended from one reaches toward the other.
  4_board: >-
    A clipboard-shaped RECTANGLE IN THE GUARD'S HAND -- not the goblin's, which
    is where it went in 9 of 12 prior board-bearing frames -- long edge at least
    about one eighth of frame height, unoccluded, flat face to camera rather
    than edge-on. MATERIAL IS EXPLICITLY NOT SCORED: navy or maroon with a
    chrome clip PASSES.
  5_not_infantile: >-
    The goblin has adult-or-adolescent head-to-body proportion. Chibi head,
    toddler body or mascot-sprite read is a FAIL.
  6_no_blush: >-
    No red or pink cheek patches on either figure.
  7_unoccluded_face: >-
    NO HAND MAY CROSS THE BOARD'S FACE. Held at the EDGE -- side grip, corner
    pinch or top rim -- never under a palm, never with fingers spread across the
    face. Scored as the LARGEST FULLY UNOCCLUDED RECTANGLE of board face,
    measured by segmentation with the mask overlay OPENED and confirmed not to
    have leaked, not estimated by eye.
      REFERENCE beat 10, geometry that PASSED its inpaint: 223x197
      REFERENCE beat 08 r3-s0, geometry that FAILED on MATERIAL: 83x144
    THIS AXIS IS SCORED BUT IT IS NOT THE HYPOTHESIS. s3 proved size is not the
    limiter, so a face that merely matches r3's 83x144 at the tighter register
    is ACCEPTABLE here. What must not happen is a REGRESSION into a palm across
    the face, which is what killed beat 06.
  8_register_THE_POINT_OF_THIS_ROUND: >-
    THE GUARD'S HEAD IS AT LEAST 15% OF FRAME HEIGHT (>=182px at 1216), measured
    by opening the frame under a ruler overlay and reading the scalp and chin
    rows, not estimated. Against beat 06's passing plate at 16.0% and beat 08's
    failing plate at 10.3%. Below 15% the round did not actually change the
    variable it exists to change, and the inpaint sample MUST NOT BE FIRED on
    it -- firing anyway would burn a sample on an uncontrolled test and report a
    result the frame cannot support.
  9_the_action_survives_the_crop: >-
    THE TIGHTER SHOT MUST NOT CROP THE BEAT AWAY. Both required, because the
    scripted action is the board coming DOWN and a finger pointing at a BELLY:
      (a) the goblin's belly is inside the frame with visible margin below it,
          not clipped by and not sitting on the bottom edge;
      (b) there is open frame below the board for it to be lowered into, and the
          guard's arms are at rest with the board held UP -- the PRE state, so
          motion has something left to do (beat 13's lesson: a prompt asking for
          a pose the plate is already in wastes the clip).
    A frame that clears 8 and fails 9 is a FAIL and is not a plate. It is
    reported as one and the framing is loosened a notch, not the bar.

plate_kill_conditions:
  - The guard rendered with pointed or goblin ears.
  - Two goblins or two guards instead of one of each.
  - The board in the goblin's hands rather than the guard's.
  - A blank or pale studio void instead of the outdoor location.
  - The goblin roughly the guard's own height multiplied -- the `size
    difference` giantess failure, if it returns from the negative side.

plate_pass_threshold: >-
  At least one seed meeting ALL of 1-9. Anything less is 0, is reported as 0,
  and does not release the inpaint sample. Partial credit is not a plate: the
  prior lane's own honest hit rate was 1 in 15 and it is recorded rather than
  averaged away.

# ============================================================================
# PRE-REGISTERED INPAINT BAR. Identical to 8ed2711b's, UNSOFTENED, so that this
# round's result is comparable to the twenty-eight samples before it. Eight
# terms, ALL REQUIRED. 7 of 8 is a FAIL -- all twenty-eight prior samples sat at
# 5 to 7 of these and every one of them was correctly a FAIL.
# ============================================================================
inpaint_bar:
  terms: >-
    large / flat / rectangular / rough bark texture / not planed timber /
    no chrome clip / no white paper / no tree trunk
  fail_shape: the silhouette stops being a straight-edged four-sided slab.
  fail_material: planed timber, fabric, plastic, or navy/maroon instead of crust.
  fail_seam: a visible join where the mask ended.
  fail_decal: >-
    the bark reads as a printed pattern LAID OVER the board rather than as the
    board's own surface. Its five tells, committed in advance so they cannot be
    rationalised afterwards: texture axes not following the board's tilt; a
    pattern ignoring the frame's own light direction; a swatch stopping short
    of, or overrunning, the object's own edge; visible tiling or a repeat; grain
    at the wrong scale read against the hand.
  beat_08_addition: >-
    THE GOBLIN AND BOTH FACES MUST COME BACK UNTOUCHED. They are the control.

# ============================================================================
# CONTROLS ON THE INPAINT HALF. All kept, none waivable.
# ============================================================================
controls:
  - "--dry-run re-asserts the mask sha before every render."
  - "diff against the composite init is maxdiff 0 outside the mask bbox +/- pad-crop."
  - "the goblin and both faces are the control and are checked byte-wise."
  - "outputs hashed on the box and again after transfer."
  - "EXACTLY ONE VARIABLE PER SAMPLE. One sample at a time, starting at 0.30."
  - >-
    THE PROMPT FILES ARE NEVER OPENED. Beats 06 and 10 both passed with the init
    as the sole variable; opening the prompts would make this a wording campaign,
    which is the closed branch.
  - "prompts measured on the real tokenizer before every fire."
  - >-
    COMPOSITE BUILT AND OPENED BEFORE ANY GPU RUNS. That is the whole point of
    doing the relief with image processing, and it caught a self-inflicted
    FAIL-SHAPE at least three times on 2026-08-15.

segmentation_warning_inherited: >-
  THE SEGMENTATION HAS NEEDED RE-TUNING ON EVERY SINGLE BOARD SO FAR and beat
  08's INVERTED the colour rule outright. Beat 10's navy face was B-R >= 10;
  beat 06's near-black board needed B-R >= -2; beat 08 r3-s0's face is dark
  MAROON with B-R NEGATIVE (-10 to -12), so beat 06's fence would have rejected
  that entire board, and B-G (+4..+6 on the face against cloak -29, rim -14,
  tunic -32, hands -26) was the discriminant. NOTHING IS ASSUMED TO TRANSFER TO
  THE NEW PLATE. The quad is traced afresh by scanlines on rows and columns no
  hand occludes. AND THE CLIP PROTRUDES ABOVE THE BOARD on beat 08, so no
  board-shaped quad and no fill_holes reaches it -- it has to be taken
  deliberately. Noise scale is board-size dependent: 0.52/0.70 read as smoke,
  1.20 as corduroy, 0.85 was right on beat 08 r3-s0's 170px board, and it is
  RE-JUDGED BY EYE on whatever width the new plate gives.

guards:
  - "no gate: / gate_ref: keys anywhere."
  - "distinct payload and out dirs."
  - "publish glob carries the beat slug."
  - "dry-run first."
  - "sidecars carry approved: false, provisional, cost_usd 0."
  - >-
    NO plate_ack WAIVER. A lane tonight hit that refusal twice, declined the
    waiver and published properly, because a 2026-08-14 job that took the
    shortcut was cropping THE WRONG BEAT'S PLATE.
  - >-
    IF THE BOX PLATE CHECK CANNOT RUN BECAUSE THE PLATE IS LOCAL MPS, THAT IS A
    WAIVER AND NOT A PASS. It is stated as a waiver and its failure modes are
    discharged by hand, item by item, in the outcome.

# ============================================================================
# OUTCOME -- appended after every frame was OPENED. Nothing above this line was
# edited to agree with anything below it; 755036a6 is the pre-registration and
# it is still in the history unchanged.
# ============================================================================
outcome:
  headline: >-
    SHOT SCALE IS NOT THE VARIABLE. The hypothesis d314e8f4 left for whoever
    took this next is dead, and this lane reports that and stops rather than
    reaching for another lever.

  the_register_was_reached: >-
    On the FIRST sample, on round 3 s0's own seed, with `cowboy shot` ->
    `upper body` the only thing changed. Guard head y 150..340 = 190px = 15.6%
    of frame height, against beat 06's PASSING plate at 16.0% and beat 08
    r3-s0's FAILING plate at 10.3%. Crop at the thigh, both bellies in frame,
    open frame below the board -- the action survives the crop (axis 9). Its
    board is 208x282, flat to camera, four straight edges, rounded corners,
    warm mid-brown with a chrome clip: LARGER than the board the five failing
    samples worked on (170x160), and at 1.65x its pixels. So the plate handed
    the sampler beat 06's register with a bigger board than beat 08 ever had.

  the_plate_round: >-
    22 frames, 6 batches, 2 machines, $0. 0 of 22 clear all nine axes.
    Committed as evidence at 158e4f77 with one sidecar each and a per-seed
    verdict written by opening every frame. The two failures repeat: SPECIES
    COLLAPSE (the guard elf-eared, or both figures green and pointed-eared) in
    15 of 22, against the prior round's 4 of 18 at the wider register with the
    identical negative -- tightening the shot MULTIPLIED that defect from 22%
    to 68%; and THE BOARD LEAVING THE FRAME, 6 of 22 with no board at all and 6
    more with it cut by an edge or turned edge-on, because a prop held at chest
    height sits on the bottom edge once the crop ends at the hip.

  the_composite: >-
    Built with plain image processing, $0, no sampler, and OPENED BEFORE ANY
    GPU RAN. Segmentation re-derived from scratch, because nothing has
    transferred on any board yet and this one needed a THIRD discriminant: this
    face is warm mid-brown at B-G -11..-15, which is the sign beat 08 r3-s0
    ACCEPTED with (+4..+6), so r3-s0's own fence would have rejected this whole
    board. R-G is what separates it (+20..+31 against teal robe -39..-57, green
    hand -26..-2). Quad traced by scanlines on unoccluded rows and columns and
    the four lines fitted with residuals reported (left 2.4px, right 0.4px,
    bottom 1.0px). The clip protrudes AND occludes the top edge, so the top
    line was fitted on clip-free columns only (residual 9.7px -> ~1px) and the
    quad raised 12px over the clip with a band along the board's own top NORMAL
    filled unconditionally -- a horizontal `flat_top_y` would have taken a wedge
    out of a board rotated 12 degrees. Occluder rule swapped from brightness to
    hue, because the hand on THIS board is green and its shaded half is L 118,
    below r3-s0's L>125 fence. maxdiff outside the board segment 0.
  the_composite_i_rejected: >-
    c1 was opened and read to me as grey weathered slate, and a measurement
    inside the QUAD agreed (R-G +0.4 against beat 06's passing +17.0), so c2
    rebuilt it with the value match applied to luminance only. THE MEASUREMENT
    WAS CONTAMINATED AND I WAS WRONG: the quad contains the goblin's GREEN
    hand, which the mask correctly excludes and which sits at R-G -26..-2,
    while beat 06's quad contains a PALE HUMAN hand at R-G positive -- the same
    statistic pulled down on one board and up on the other, and none of the
    difference was bark. Measured again on the pixels the compositor actually
    changed: beat 06 composite R-G +12.3 / sat 26.2, beat 08 r3-s0 composite
    +12.1 / 25.9, c1 +11.0 / 23.5, my "fix" c2 +8.6 / 18.4. c1 already matched
    both references and c2 moved away from them. The inherited value match was
    restored exactly and c3 is BYTE-IDENTICAL to c1 (sha 52a5a6e6), which is
    how the revert was checked. The bark is not grey; the plate around it is
    TEAL. Cost of that detour: about four minutes and no GPU.

  samples:
    s0: >-
      strength 0.30, the value that passed on beats 10 and 06 and that all five
      r3-s0 samples used. 5.7s, rc=0. FAIL, on term 4 alone -- 7 of 8, which is
      exactly the band all twenty-eight prior samples sat in.
        large PASS (208x282, 23% of frame height) / flat PASS / rectangular PASS
        (four straight edges, four corners, whole, nothing of the robe through
        it) / ROUGH BARK FAIL -- soft smeared vertical shading, a handful of new
        hairline strokes at the top and two knot marks, and the surface between
        them unchanged from the composite / not planed PASS, but only because it
        is not timber either / no chrome clip PASS, gone entirely, top edge one
        straight line / no white paper PASS / no tree trunk PASS.
      FAIL-SHAPE no. FAIL-SEAM no. FAIL-DECAL no on all five tells.
    s1: >-
      strength 0.45, sole variable against s0. Fired because 0.45 is the one
      value that distinguishes "the register did nothing" from "the register
      moved the threshold": it is where beat 10's composite first grew crust,
      and where beat 08 r3-s0's composite BROKE on shape. 5.4s, rc=0. FAIL, on
      term 4 alone again. Hard-edged vertical SPLITS now appear across the upper
      half and down the left, and they are real drawn line work -- but the
      surface between them is still a smooth gradient. It reads as checked or
      split smooth plank, not as crust with pale ridges and broken flake. Term 5
      (not planed timber) is now the borderline one rather than a comfortable
      pass.
      WHAT THE REGISTER DID BUY, and it is the one thing it bought: SHAPE
      SURVIVED 0.45. On the wide-shot plate the same strength tore the top edge
      and let the tunic read through (d314e8f4 s4, FAIL-SHAPE). Here the
      silhouette is whole, all four edges straight, and the hand keeps its
      outline and finger separations. So the shape/strength trade-off beat 06
      was fighting is gone at this register -- and the material floor is still
      exactly where it was, which means the floor was never a trade-off.

  the_measurement_that_agrees_with_the_eye: >-
    Fraction of the board area whose local gradient exceeds a cel-line
    threshold, composite -> sample, inside the quad eroded 8px:
        beat 06, PASSED   18.50% -> 19.52%   the sampler ADDED hard edges
        TIGHT s0 0.30     17.60% -> 15.14%   it removed them
        TIGHT s1 0.45     17.60% ->  7.58%   it removed 57% of them and drew a
                                             handful of long splits instead
    That is the same signature d314e8f4 measured on the wide plate with a
    different ruler, and it is reported here as CORROBORATION, not as the
    verdict. The verdict is the six-panel comparison at matched board width
    (EVIDENCE-b08-shot-scale-030.png and -045.png), opened and judged.

  controls_all_held: >-
    Composite sha re-asserted by the renderer at every fire and identical after
    transfer. Output hashes matched on the box and again on the Mac (b4f1093a,
    04905002). maxdiff against the composite outside the mask bbox +/- pad-crop
    64 is 0 on both samples. Against the founder's own plate, the whole right
    third of the frame, BOTH FACES and everything above y=470 came back
    BYTE-IDENTICAL. The dry run ran first and drew the mask. The prompt files
    were never opened -- they are beat 10's verbatim, measured on the real CLIP
    tokenizer on the box at 52/77 positive and 77/77 negative, neither
    truncated.

  waiver_stated_as_a_waiver: >-
    THE BOX PLATE CHECK IS WAIVED AND THAT IS A WAIVER, NOT A PASS. The plate
    half ran on local Apple MPS with no payload, no box out dir and no
    reference set, so box_enqueue.py's dry-run, distinct-dir rule, publish glob
    and CARD_REFS_DENYLIST never executed. Discharged by hand, item by item:
    (a) both prompt sides measured on the real CLIPTokenizer before firing, and
    the negative confirmed character-for-character identical to round 3's
    sidecar rather than retyped; (b) the denylist is moot -- no reference set is
