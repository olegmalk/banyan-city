# 2026-08-15, beat 08 lane (BEAT 08 ONLY). THE SHOT-SCALE TEST.
#
# WRITTEN AND COMMITTED BEFORE THE FIRST PIXEL IS DRAWN. Nothing below is
# softened afterwards; the verdicts are appended under `outcome:` in a later
# commit and this text is not edited to agree with them.
#
# ============================================================================
# WHY THIS LANE EXISTS
# ============================================================================
# A bark clipboard gates beats 06, 08 and 10. Four wording attempts and
# twenty-three inpaint samples failed before the working method was found
# (7029e0ff, ec33a46a, 1de34880): composite procedural bark relief INTO the
# plate with plain image processing -- $0, no sampler -- and then inpaint at LOW
# strength 0.30. Beats 06 and 10 both cleared an eight-term bar that way.
#
# Beat 08 did not. 8ed2711b built its composite carefully (three composites, two
# rejected by eye at zero GPU cost) and d314e8f4 fired five single samples: ALL
# FIVE FAILED, every one on MATERIAL ALONE, 7 of 8 terms passing every time. The
# geometry half of the method transferred completely -- not one FAIL-SHAPE, not
# one FAIL-SEAM, not one FAIL-DECAL below 0.45. The sampler moves the same
# amount of pixel on beat 08 as on beat 06 (mean |delta| 14.5 vs 15.9) and
# relocates it into GRADIENTS instead of hard cel line-work.
#
# THE OBVIOUS EXPLANATION IS ALREADY DEAD. The worry was that beat 08's clean
# unoccluded board face (83x144) was too small against beat 10's passing
# 223x197. Sample s3 resampled the board region 3.01x so the slab was 516px
# wide -- TWICE beat 06's passing 254px -- with prompt, strength, seed and mask
# pinned and scaled, and produced THE SAME SOFT SHADING. The failure is not the
# board's pixel size. That is a measured result and this lane does not re-derive
# it.
#
# ============================================================================
# THE HYPOTHESIS THIS LANE TESTS, and the measurement that motivates it
# ============================================================================
# d314e8f4 labelled it a hypothesis and deliberately did not spend a sample on
# it: the one uncontrolled difference left is the SHOT SCALE OF THE SURROUNDING
# CONTENT, not the board's pixel size. Beat 06's plate is a close two-shot where
# animagine draws heavy cel line-work; beat 08's is a whole-body two-shot, which
# the model renders with flat soft shading. s3 scaled pixels but kept the same
# hands at the same relative size, so it never changed the APPARENT REGISTER.
#
# MEASURED HERE, by opening both plates under a 50px ruler overlay rather than
# by eye or by adjective (scratchpad rulers; the numbers, not the images, are
# what this file rests on):
#
#   b06 plate (b06-nos2-init-704x1280.png, the one whose composite PASSED)
#     guard head   y 10..215      205px = 16.0% of the 1280-tall frame
#     board        ~250 x 205     top y 495, bottom y 700
#     bottom crop  mid-shin; no headroom, the hair touches the top edge
#   b08 plate (08-inside-him-twofig-mac-r3-s0.png, the one whose composite FAILED)
#     guard head   y 150..275     125px = 10.3% of the 1216-tall frame
#     board        ~170 x 160     top y 495, bottom y 655
#     bottom crop  none -- both figures are whole to the boots, with 150px of
#                  sky above the goblin's scalp
#
#   REGISTER RATIO 1.64x. And note which way the two numbers split: the BOARD is
#   only 1.28x smaller on beat 08, while the HEAD is 1.64x smaller. Beat 08's
#   board is if anything LARGE for its figures. It is the FIGURES that are
#   small, which is exactly what "shot scale of the surrounding content, not the
#   board's pixel size" means, and it is why s3 could double the board and
#   change nothing.
#
# IF THIS IS RIGHT, beat 08 needs a TIGHTER SHOT, not a bigger face.
# IF THE TIGHTER SHOT FAILS THE SAME WAY, THAT IS A REAL RESULT: the shot-scale
# hypothesis is dead, beat 08 needs a different lever entirely, and this lane
# reports that and stops. It does NOT open a wording campaign on the prop --
# that branch is permanently closed under any beat number (four attempts,
# "the bark never had a chance against the word clipboard").
#
# ============================================================================
# THE FRAMING I CHOSE, AND WHY -- STATED BEFORE THE RENDER
# ============================================================================
# TARGET: a TORSO-TIGHT TWO-SHOT. Top of the guard's head near the top edge,
# bottom edge at about the hip or upper thigh. Concretely: the guard's head at
# 15% or more of frame height (>=182px at 1216), against beat 06's passing 16.0%
# and beat 08's failing 10.3%.
#
# THE TAG I ASK FOR IS ONE NOTCH TIGHTER THAN THE TARGET, DELIBERATELY.
# Round 3 led with `cowboy shot, eye level` -- mid-thigh up -- and the render
# came back WHOLE-BODY, boots in frame and 150px of sky to spare. The tag
# under-delivered by a full notch. On the Danbooru ladder the next rung in is
# `upper body` (waist up). So:
#
#   `upper body, eye level` replaces `cowboy shot, eye level`. SOLE VARIABLE.
#
#   - if it under-delivers by the same notch round 3 saw, it lands on a true
#     cowboy shot, which is beat 06's register and is the target;
#   - if it lands true, waist-up puts the head near 29% of frame -- tighter than
#     needed but still holding both bellies, with the goblin's at the bottom
#     edge. That is the risk this round is watching for, and it is axis 9.
#
# WHAT THE ACTION NEEDS, AND WHY I AM NOT CROPPING IT AWAY. Beat 08's line,
# quoted beside its action (shots.md, 002b-first-citizen, beat 08):
#
#   "The apple is inside him, Dren."  -- he LOWERS THE CLIPBOARD and POINTS AT
#   THE SCAVENGER'S BELLY. Camera follows the pointing finger to the goblin's
#   belly.
#
# So the frame has to hold two things a tighter crop could destroy:
#   (a) OPEN FRAME BELOW THE BOARD for it to come down into. The plate is the
#       PRE state -- board still held up, guard not yet pointing -- so the
#       travel has to exist in frame or the motion has nowhere to go.
#   (b) THE GOBLIN'S BELLY, with margin, not clipped by the bottom edge. A point
#       at a belly that is half out of frame does not read.
# `portrait` and `close-up` are therefore both refused: they crop the belly and
# they crop the board's travel. Torso-tight is the tightest framing the action
# survives, and it is the framing asked for.
#
# EVERYTHING ELSE IS PINNED TO ROUND 3 VERBATIM, including the seed. still_local
# derives the seed as SEED(20260719) + beat(8) + seed_bump + 1000*i, so s0 at
# seed_bump 0 reproduces round 3 s0's own seed 20260727 exactly. Against the
# only beat-08 plate that ever cleared every axis, the framing tag is then the
# SOLE VARIABLE, which is the whole design of this round.
#
# ============================================================================
# PLATE KNOWLEDGE INHERITED AND NOT RE-DERIVED (18 frames, 6 rounds, 1384e5fe +
# aa160c08). None of this is re-tested here.
# ============================================================================
#  - `size difference` is a GIANTESS tag on this checkpoint -- it made the
#    goblin ~8x the guard's height in 2 of 3 frames. It stays in the NEGATIVE.
#  - LEADING framing tags carry real weight; TRAILING ones almost none. The
#    framing tag is therefore FIRST, as it was in round 3.
#  - A VERB OR A PROP DOES NOT BIND TO A NAMED CHARACTER HERE. The board
#    attached to the GOBLIN in 9 of 12 board-bearing frames; `pointing at
#    another` attached to the goblin in 3 of 3. `holding clipboard with both
#    hands` is the ONLY wording that ever put it in the guard's hands, so it is
#    reproduced character-for-character and WHICH FIGURE HOLDS IT IS CHECKED.
#  - The guard came back ELF-EARED in 4 of 18 frames, every time with `elf` in
#    the negative. The negative is not the lever for that. It is not attacked
#    here -- attacking it would be a second variable -- it is only SCORED.
#  - STATE TAGS BEAT VERBS for staging. Nothing in this prompt is a prose verb.
#  - HONEST HIT RATE ON THE LAST PLATE ROUND WAS 1 IN 15. This round budgets for
#    that: ONE sample first, opened and judged, then seeds in fours, not twos.
#  - THE BOARD'S MATERIAL DOES NOT NEED TO BE RIGHT IN THE PLATE. Navy or maroon
#    with a chrome clip is expected and fine. What matters is a large,
#    FLAT-TO-CAMERA, UNOCCLUDED face held AT THE EDGES. Round 3's grip -- both
#    hands on the side edges, only fingertips notching the rim -- is exactly
#    right and is what this round tries to reproduce at a tighter scale.
#
# ============================================================================

id: ep2-b08-tightshot-0815
task: ep2-b08-tightshot-0815
node: 002b-first-citizen
beats: [8]
runner: local-mac (Apple MPS)   # plate work. NOT a box job for the plate half.
