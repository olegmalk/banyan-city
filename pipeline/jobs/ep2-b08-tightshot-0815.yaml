script_authority: >-
  Node 002b-first-citizen, live script `002b-t0-c`, `approved_by: founder`,
  `approved_on: 2026-08-03`. These are STILL PLATES on an approved node, not an
  episode assembly, so STEWARDSHIP §6 is satisfied; `still_local.py` re-checks
