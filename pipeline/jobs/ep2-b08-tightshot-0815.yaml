  rendering more plates.

recipe_plate:
  script: pipeline/still_local.py --raw
  host: macbook1 (Apple MPS, ~5.7 min per 4-seed plate)
  base: cagliostrolab/animagine-xl-3.1     # the checkpoint the box uses
  size: 832x1216
  steps: 40
  cfg: 7.5
  env: BANYAN_NO_OPEN=1   # agent-driven: unratified frames must not land on a screen
  seed_s0: 20260727       # SEED 20260719 + beat 8 — round 3 s0's own seed
