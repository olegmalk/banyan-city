    NO plate_ack waiver was taken. The inpaint half DID run the real dry-run.

  machine_note: >-
    macbook1 and macbook3 render SDXL as PURE NOISE on this recipe -- luma
    spread 254, full colour static, hash-identical on the machine and after
    transfer so it is not the copy, and macbook1's was the first still that
