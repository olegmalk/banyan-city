  \ eyes, as in the tile. Absent in n1.\n  P2 MUZZLE. The lower face reads forward and modelled, not flat.\
  \ Absent in n1.\n  P3 MOUTH. A line, however thin. Absent in n1 -- not thin, ABSENT.\n  P4 SHADING.\
  \ Any tonal modelling on the face at all. Absent in n1.\nREGRESSION CLAUSES, and any one of them fails\
  \ the rung outright:\n  T1 no iris and no pupil.  T2 no human nose bridge, tip or nostrils.\n  T3 no\
  \ age modelling -- no furrows, no folds, no jowls.\n  T8 4.5 heads or better. The body is the thing\
  \ that already works and a face\n     rung that costs the body is not a trade, it is a loss.\nA rung\
  \ passes on 2 of 4 presences with every regression clause intact. This is\ndeliberately generous: the\
  \ question tonight is whether the face is REACHABLE at\nthis framing at all, not which wording is best."
failure_predicted_in_advance: 'f1 HELPS AND IS NOT ENOUGH -- one brow bar on a blank egg is still a blank
  egg. f2 IS THE COIN FLIP: `snout` has real Danbooru mass but reads CANINE on most checkpoints, and a
  dog muzzle is a different failure from a mask, not a smaller one. f3 IS THE ONE THAT COSTS ME SOMETHING:
  it puts back the wording this lane helped retire, on the argument that the strike was about the BUILD
  and the build is now geometry''s job. If f3 returns a lean 5-head figure with a modelled creature face,
  the correction is that `adult`/`man` were only dangerous while wording carried the build alone. If it
  returns a human male face, the strike stands and is TESTED rather than asserted.'
