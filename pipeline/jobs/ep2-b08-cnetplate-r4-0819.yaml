#   * ink_fraction 0.0581 -> 0.0244, i.e. the condition now occupies 42% of the
#     pixels it did.
#
# AND IT WAS LOOKED AT, at full size and in a 1:1 crop of the arm, side by side
# with the 7px hint: EVIDENCE-b08-thinhint-0819.png. What the eye adds to the
# numbers, and it is the reason branch 2 below is written as the likely one: at
