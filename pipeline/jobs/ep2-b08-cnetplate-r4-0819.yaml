#   0.45  staging HELD    | SURFACE returned (a hand with an index finger, two
#                         |   faces, cloth with folds, shading), OUTLINE did not
#   0.28  staging LOST    | drawn beautifully, because the condition is no
#                         |   longer shaping anything
#
# There is no value that yields both, and the 0.45 -> 0.28 failure is not a
# gradual softening -- it is a collapse back to the uncontrolled composition
# (colossus, point on the goblin, the guard's frozen wardrobe on the goblin, the
# board on a background figure). r3's own verdict named the consequence and
# pre-committed to it as branch 3: "THE NEXT INSTRUMENT IS A CHANGE OF HINT
# SHAPE, NOT OF STRENGTH", and listed exactly three candidates -- a sparse
# skeleton, a MUCH THINNER STROKE (the xinsir card's second dial; that hint is
# 7px), or an early control_guidance_end.
