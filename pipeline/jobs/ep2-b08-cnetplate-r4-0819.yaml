stroke_is_not_a_strength_dial_IT_IS_A_PRECISION_DIAL: 'THE FINDING OF THIS RUNG, and it
  inverts the assumption that put stroke weight on the list. Measured as the share of
  authored ink that has a strong render gradient within 3px (the strongest 3% of
  gradients, identical instrument on all four frames, nocontrol as the coincidence
