# THIS IS THAT PRE-COMMITTED INSTRUMENT, AND IT IS THE ONE OF THE THREE THAT
# NEEDS NO NEW CODE. `author_b08_pose_hint.py --stroke` already exists and is
# already asserted as a real dial by its own --selftest ("stroke is a control
# dial (0.0244 -> 0.1045)"), which ran clean before this hint was drawn. The
# other two both need code that nobody has run: a sparse skeleton needs a new
# drawing mode, and control_guidance_end is HARDCODED to 1.0 at
# controlnet_plate.py:167,277 and is not exposed as a flag. Filing either today
# would mean shipping an unproven mechanism inside a sample -- a guess with a
# GPU attached. This rung ships zero new code.
