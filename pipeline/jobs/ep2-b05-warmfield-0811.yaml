# EPISODE 2, BEAT 05 THE PATROL — THE SNOWY FOREST. One sample, four seeds, $0.
# 2026-08-11 ~21:3x.
#
# THE FAULT IS HIS AND SO IS THE INSTRUCTION NOT TO TOUCH ANYTHING ELSE. Founder,
# ep2 picking page, verbatim: "almost all look like they are in some snowy forest,
# otherwise its actually not bad". The second clause is the brief. The register he
# ratified at ~20:27 — "two silly round bureaucrats with visible faces" — the bare
# heads, the armour terms and the entire eight-term lighting block all carry over
# from `authored_guards_silly` word for word.
#
# TWO WORDS IN HIS SENTENCE ARE TWO DIFFERENT FAULTS, AND ONLY ONE OF THEM IS THE
# PALETTE:
#   SNOWY  — `no snow, no winter` in the negative, plus `warm green` on the field
#            in the positive. The affirmative half is cheap and the beat had none:
#            `grassy morning field` never said what colour the grass was, and a
#            white field satisfies it.
#   FOREST — `no forest`, bare. THIS IS THE HALF A PALETTE FIX WOULD MISS, and it
#            is a real hole rather than a guess: beat 05's positive contains no
#            `sapling` and no `tiny`, so `_SMALL` never fires and the eight-term
#            SCALE block — the block that carries `forest`, `bush` and `shrubbery`
#            on every plant beat — IS NOT SENT ON THIS BEAT AT ALL. Nothing has
#            ever forbidden a forest here. That is why a patrol keeps turning up
#            among trees while the sapling beats do not.
#
# WHY THREE TERMS AND NOT `frost, ice, pine forest` AS WELL — MEASURED, NOT
# PREFERRED. The five-term form costs NINE house-tier quality tags to the 77-token
# budget; the three-term form costs SIX, and it is the one that bans bare
# `forest`, where `pine forest` leaves every other kind of tree standing. Fewer
# terms, broader ban, three more quality tags kept. This is the same lesson as the
# rest of 2026-08-11: every round that bought a new tag lost and the round that
# removed one won.
#
# ONE VARIABLE, AND THE SEEDS CANNOT DRIFT. Against `ep2-b05-guards-silly-0811`
# this changes the three negatives and the two positive colour words and nothing
# else. `render_wave_sample` derives seeds as `wg.SEED + beat + i*1000` and never
# reads the variant, so s0..s3 are the same four integers as the silly round and
# the comparison is frame-to-frame at equal seed. Same steps (40), guidance (7.5),
# size and harness.
#
# NO GOBLIN IS IN THIS BEAT AND `--goblin-def` IS PASSED ANYWAY. The flag is
# mandatory in `render_wave_sample.py` (it returns 8 without one, deliberately, so
# the harness default can never draw the steward's goblin under the founder's
# name). Beat 05 carries no `{{GOBLIN}}` marker, so the replace is a NO-OP and the
# string never reaches the prompt — verified, not assumed: the sent positive
# contains no goblin terms. `green skin` is passed because it is the ratified
# value and an inert flag should not introduce a second one. Same convention as
# `ep2-b05-guards-silly-0811` and the other guard beats.
#
# MEASURED BEFORE QUEUEING, with the honest caveat about where. This Mac has no
# CLIP tokenizer so `compress()` positive counts are estimates; the NEGATIVE
# estimator was proven exact on beat 04, where it reproduced the box's `sent 76`
# to the token. On it this variant sends 77 of 77 with EVERY authored `no ...`
# term arriving — all three new ones and the whole lighting block — and the
# casualties are six house-tier quality tags. `text` survives, which is the fault
# check that applies here; `female goblin` and `plant hair` do not apply to a
# guard beat and are not sent (`extra_neg: guard`). Count tag `2boys` derives,
# which matters: the staged frames drew ONE armoured figure twice.
#
# THE `--dry` STEP IS THE REAL GATE AND RUNS FIRST — the box's own tokenizer, and
# a nonzero return BEFORE torch is imported, so a wrong estimate costs $0.

