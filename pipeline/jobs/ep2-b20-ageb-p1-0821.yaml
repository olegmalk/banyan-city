  and b08 went to round two and passed there -- and every one of those frames is the wrong age and wears
  the mannequin face. They are kept as evidence, not deleted.


  THE SAMPLE THAT RELEASED THIS BATCH is ep2-b13-ageb-s1-0821, judged by eye at 1:1 before a single one
  of these was queued.'
