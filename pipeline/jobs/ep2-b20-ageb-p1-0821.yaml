bar: "THE k6a BAR WITH THE THREE RULINGS FOLDED IN. Read at 1:1 against\nreview/ep2-goblin-design-0819/adult-b19-0819.jpg\
  \ for the CREATURE and against\nreview/ep2-goblin-age-0821/B-h240-kid.png for the AGE.\n\n  IDENTITY\
  \ -- unchanged, and this is what the rulings put at risk.\n  T4  SHORT LOW SWEPT-BACK EAR FLANGES, not\
  \ spikes. SCORED FIRST because it is\n      the clause with no instrument behind it: Danbooru has no\
  \ tag for this\n      ear, absence-plus-suppression is the only thing that has ever drawn it,\n    \
  \  and it now has to survive a bigger head AND an expression. If this is\n      lost, the pivot has\
  \ a cost nobody has priced.\n  T1  NO IRIS, NO PUPIL, NO LASHES. `blank eyes` IS STRUCK, so this clause\
  \ is\n      now carried by the ADAPTER alone. It is the single most likely thing to\n      break and\
  \ the sample exists to find out.\n  T1b EYE SIZE <= 1.4x the tile's relative to the head box; EYE SHAPE\
  \ <= 0.65.\n      NOT relaxed for expression. `wide-eyed` is a legitimate emotion on beats\n      02,\
  \ 04 and 20 and it is also a direct argument with this clause.\n  T2  NO HUMAN NOSE -- no bridge, no\
  \ tip, no drawn nostrils.\n  T3  NO AGE MODELLING -- no brow furrows, no folds, no jowls. A YOUNGER\
  \ read\n      makes this easier, not harder; a frame that fails it has gone the wrong\n      way down\
  \ the axis entirely.\n  T7  NO PATCHWORK ON THE SKULL.\n  C1  CONTAINMENT -- green head to foot, no\
  \ purple cowl, no horns.\n  C2  THE POSE IS THE ONE ASKED FOR.\n\n  AGE -- the founder's axis, now decided.\n\
  \  A1  READS AS OPTION B. Not merely younger than the tile: this frame and\n      B-h240-kid.png should\
  \ look like the same character, and 4.17 heads is\n      measurable rather than a matter of opinion.\n\
  \  A2  NOT THE KILLED DESIGN. His floor, verbatim: \"NOT the killed round-chibi\n      design\". Round-bellied,\
  \ squat or mascot FAILS.\n\n  EXPRESSION -- the new axis, and the one the whole change is for.\n  E1\
  \  THE BEAT'S EMOTION IS LEGIBLE WITH THE CAPTION COVERED. Not \"has a\n      face\": a stranger shown\
  \ this frame and the beat's stage direction should\n      agree they match. This is the clause \"lifeless\"\
  \ was about.\n  E2  A MOUTH, AND IT IS DOING SOMETHING. P3 asked only that a line exist,\n      because\
  \ `closed mouth, :|` kept drawing none at all. The bar is raised:\n      the mouth carries part of the\
  \ emotion.\n  E3  IT IS STILL HIM. An expression that changes the face's SHAPE -- a\n      different\
  \ jaw, a different eye geometry, a human cast under the emotion\n      -- fails, and fails as an IDENTITY\
  \ problem, not a mood one.\n\n  THE TUSK.\n  K1  ONE TUSK, AND IT IS BROKEN. Two intact tusks is a MISS\
  \ and a named one:\n      `tusks` is the plural Danbooru tag and `one broken tusk` is the script's\n\
  \      own words rather than a tag with a post count behind it, so if the count\n      or the break\
  \ is wrong the wording is the suspect and the fix is a tag,\n      not another adjective.\n  K2  IT\
  \ DID NOT COST THE MOUTH. A tusk drawn over a closed muzzle that has\n      lost its lipless line is\
  \ a regression on P3/E2.\n\nA frame failing ANY clause is REJECTED. Near-misses are what made the 31-frame\n\
  LoRA set untrainable."
c1_folded_fault: 'NAMED FAULT, CARRIED NOT CHASED (coordinator, 2026-08-21). This

  beat''s skeleton is FOLDED, and folded poses at this recipe bring back a magenta

  collar at the neck: measured 1.17%-7.36% of the mask region against 0.00% on

  every standing frame. It got WORSE in both directions at once -- bigger mask and

  smaller, stronger adapter and weaker -- so it is not adapter coverage; on a

  folded pose the neck sits under the jaw and the checkpoint dresses it. It is

  recorded on the ship page''s fault table and is NOT a reason to hold the beat.'
emotion_fit_judgement: FITS ON THE SUSPICION READING. '...Did you just ANSWER me?' is awe in one reading
  and DISBELIEF in another, and a scavenger who has spent the whole episode being hunted meets a talking
  plant with suspicion before wonder. Recorded as the weaker of the six fits, and it is the beat to revisit
  first if the expressive reference lands.
expression_is_invariant: SAID PLAINLY SO NO LATER LANE READS THIS PLATE AS PROOF THE EXPRESSION RULING
  WORKED. It did not. Four samples on beat 13 (s1/m1/m2/e1) moved the mask, the adapter strength and the
  eye/brow tags and the face scowled in every one, and Option B scowls with NO expression tags at all.
  This plate carries its beat's emotion tags as provenance and as a live slot for when an expressive reference
  exists -- not as a claim they drew anything. The beat ships because the WARY FACE FITS IT, which is
  the judgement recorded in emotion_fit_judgement.
failure_predicted_in_advance: 'THREE THINGS ARE MOVING AND I EXPECT THEM TO FAIL IN A KNOWN

  ORDER. Filed before the render.


  MOST LIKELY TO BREAK: T1, and it is `blank eyes` leaving. Canon''s own words are

  "`blank eyes` IS THE WHOLE GAME and `no nose` IS THE SECOND HALF" -- that

  sentence was written when WORDING WAS THE ONLY LEVER, before the adapter, the

  skeleton and the reference crop existed, and the whole claim of ruling 2 is that

  the instrument has changed under the finding. If the eyes come back with irises,

  the finding survived the instrument change and the answer is not to re-argue: it

  is to put `blank eyes` back and get the emotion from the MOUTH and BROW alone,

  which is one rung and is the isolate mode of this file.


  SECOND: K1, two intact tusks. `tusks` is plural in Danbooru and there is no tag

  for a broken one. I expect the tag to fire and the BREAK to be ignored, which is

  a partial pass and is worth having -- the tusk is in the script and has been

  absent from every prompt this tree has ever run.


  THIRD, AND THE ONE THAT WOULD COST THE MOST: T4, the ear. It has no tag holding

  it up. The age ladder already flagged that a younger read and a rounder head are

  the same direction, and now an expression is being asked for on top. This did not

  break at 0.240 on the ladder''s standing frames, which is real evidence, but the

  ladder''s frames were expressionless.


  WHAT I DO NOT EXPECT TO MOVE: the age. The ladder rendered 4.17 heads across

  three different wordings and they were "nearly indistinguishable", so the

  geometry is carrying it and an expression is not a geometric change.


  AND ONE HONEST WEAKNESS OF THIS SAMPLE, said out loud rather than discovered

  later: beat 13''s emotion is `tired, half-closed eyes, light smile, parted lips`,

  and `half-closed eyes` is a tag k6a ALREADY CARRIED. So the sample tests the

  STRIKE of `blank eyes`/`jitome` hard and the tusk hard, and tests the

  expression-tag axis only weakly. The beats that really test it are 02, 04 and 20,

  where `wide-eyed` and `open mouth` argue with T1b directly. That is a reason to

  judge the wave on its own faces rather than assume the sample covered them -- it

  is NOT a reason to sample three beats, because the thing that can break the

  identity is the same in all seven and beat 13 is the frame the founder actually

  ruled on.'
