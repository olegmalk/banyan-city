the_expression_ruling: 'STRUCK from k6a''s frozen positive: `blank eyes`, `jitome`, `half-closed eyes`.
  Plus `expressionless`, `:|` and `closed mouth` from the older tile recipe, wherever a plate still carries
  them. KEPT: `tsurime` (the tile''s slit SHAPE) and `thick eyebrows` (the brow P1 scores) -- those are
  geometry, not mood, and striking them would move the face under cover of a ruling about its expression.
  ADDED, from THIS BEAT''s stage direction in node.md: `wide-eyed, open mouth`.'
