# 2026-08-16, THE TIGHT-INSERT LANE. THE PLATE, PUBLISHED RATHER THAN WAIVED.
#
# WHY THIS JOB EXISTS AT ALL, and it renders nothing. box_enqueue refuses a
# motion job twice over when it cannot check the picture being animated: once
# because the --src is not fetchable from the results branch, and again because
# the job that produced it has no spec in pipeline/jobs. Both refusals are
# waivable with `plate_ack:` and NEITHER IS WAIVED HERE. A 2026-08-14 job that
# took that shortcut turned out to be cropping the WRONG BEAT'S PLATE, and the
# unfetchable refusal is the one guard in that file that has never yet been
# wrong. This spec is the producing job the second guard looks for, and
# farm-out/ep2-b17-insert-plate-0816 is what the first one reads.
#
# WHAT THE PICTURE IS. One 832x1216 plate drawn $0 on the Mac (Apple Silicon,
# MPS, animagine-xl-3.1, 40 steps, guidance 7.5, seed 20260816) by
# `pipeline/plate_scratch.py --beat 17`, whose inline draft carries the whole
# argument and the bar. It is a TIGHT INSERT: a green clawed hand and forearm
# resting flat on a cloak that fills the frame edge to edge. It exists to test
# ONE principle -- frame the action so that IT IS THE LARGEST MOVEMENT IN FRAME
# -- against the converged finding that this engine renders gross whole-body
# motion (12 of 12 stand-ups on beat 17's wide plate) and drops small in-hand
# actions (0 of 4 brushes in the compound, 0 of 2 asked for alone at the same
# seed, byte-identical otherwise).
#
# ENGINE PROBE, NOT SHOW CONTENT. The clip made from it must never be cut into
# an episode; splitting beat 17 into two shots is an authorship decision and
# this lane does not take it. The sidecar says `approved: false`,
# `provisional: true`, `is_show_content: false`, `cost_usd: 0.0`.
#
# WHY IT IS FETCHED OVER HTTP RATHER THAN COPIED. It was drawn on a Mac, so it
# is on origin/main, not on the box's courier worktree -- and the courier only
# ever contains what the box itself produced. The bytes are asserted by sha256
# BEFORE anything is written and the fetch step EXITS NONZERO on any mismatch,
# exactly as motion-poscontrol-plates-0816 does for its Commons fixtures, so
# "the file moved between machines" cannot become "the file changed".
#
# NO GPU, NO MODEL, NO SPEND, seconds. It does not compete for the card.
