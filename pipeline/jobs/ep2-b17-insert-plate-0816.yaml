success: 'One 832x1216 png and its provenance yaml on farm-out/ep2-b17-insert-plate-0816, each byte-identical
  to the file on origin/main (the fetch step REFUSES on any sha256 mismatch rather than continuing), plus
  a sha256 manifest. png sha256 0b8f4261a2a96af5db97fd547c74b815ebf50c2d3ad6f338f19c959d8a27342f, yaml
  sha256 75b942674eac4acd949bf0a6fbb27b0797335d3ca09d48cf56c05a5af6727d73.'
why: 'Measured on this machine before filing, with box_enqueue''s own functions on the exact 704x1280
  cover-crop the box will make: border_flatness 0.135 against the 0.62 refuse line and border_colour_flatness
  0.007, so it is nowhere near a blank-paper card and needs no `card:` ack. It also clears the four plate
  criteria pre-registered in commit 6625840b BEFORE it was drawn: P1 cloth fills the frame, no sky, no
  horizon, no empty region larger than a hand (one small defocused wedge of grass in the top-left corner,
  under 6% of the frame, recorded and not scored); P2 the green clawed hand is in contact with the cloth
  and spans ~57% of the cropped frame''s width against a >=15% bar; P3 open unobstructed cloth runs the
  full width below the hand, several hand-widths across, so a stroke has somewhere to go; P4 no face,
  no whole figure, no second arm, no prop. NAMED HONESTLY AND NOT SCORED: the cloth reads as a plain pale
  drape rather than the patchwork asked for, and the palette came back pink-brown instead of dusty brown-grey
  -- a continuity problem if this framing is ever cut into the show, and irrelevant to whether a hand can
  travel across cloth.'
