payload:
  C:\banyan-farm\ep2-b17-insert-plate-0816\fetch_plate.py: "#!/usr/bin/env python3\n\"\"\"Fetch the Mac-drawn\
    \ insert plate and REFUSE on any sha mismatch.\n\nNo model, no GPU, no spend. The bytes are the ones\
    \ committed to origin/main,\nso the sha256 asserted here is verifiable against the repo by anyone.\n\
    \"\"\"\nimport hashlib, os, sys, urllib.request\n\nOUT = r\"C:\\banyan-farm\\ep2-b17-insert-plate-0816-out\"\
    \nRAW = \"https://raw.githubusercontent.com/olegmalk/banyan-city/main/farm-out/ep2-b17-insert-plate-0816/\"\
    \nUA = {\"User-Agent\": \"banyan-city-tight-insert/1.0 (albert.numbro@gmail.com)\"}\nWANT = [\n   \
    \ (\"17-goodbye-insert-mac-plate-r1s1.png\",\n     \"0b8f4261a2a96af5db97fd547c74b815ebf50c2d3ad6f338f19c959d8a27342f\"\
    ),\n    (\"17-goodbye-insert-mac-plate-r1s1.yaml\",\n     \"75b942674eac4acd949bf0a6fbb27b0797335d3ca09d48cf56c05a5af6727d73\"\
    ),\n]\nos.makedirs(OUT, exist_ok=True)\nfor name, want in WANT:\n    raw = urllib.request.urlopen(\n\
    \        urllib.request.Request(RAW + name, headers=UA), timeout=120).read()\n    have = hashlib.sha256(raw).hexdigest()\n\
    \    if have != want:\n        sys.exit(\"!! SHA MISMATCH for %s -- refusing.\\n   want %s\\n   have\
    \ %s\"\n                 % (name, want, have))\n    with open(os.path.join(OUT, name), \"wb\") as\
    \ fh:\n        fh.write(raw)\n    print(\"fetched %-42s %7d bytes  sha %s  OK\" % (name, len(raw),\
    \ have), flush=True)\nprint(\"both files match their asserted sha256.\", flush=True)\n"
