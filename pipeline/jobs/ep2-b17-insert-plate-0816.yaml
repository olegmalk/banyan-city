    \ os, shutil\nsrc_dir = \"C:/banyan-farm/ep2-b17-insert-plate-0816-out\"\ndst = \"C:/banyan-farm/courier-box/farm-out/ep2-b17-insert-plate-0816\"\
    \nos.makedirs(dst, exist_ok=True)\nsrc = sorted(glob.glob(src_dir + \"/17-goodbye-insert-mac-plate-r1s1.*\"\
    ))\nlines = []\nfor f in src:\n    shutil.copy2(f, dst)\n    c = os.path.join(dst, os.path.basename(f))\n\
    \    with open(c, \"rb\") as fh:\n        h = hashlib.sha256(fh.read()).hexdigest()\n    lines.append(h\
    \ + \"  \" + os.path.basename(f))\nwith open(os.path.join(dst, \"ep2-b17-insert-plate-0816.sha256\"\
    ), \"w\", newline=\"\\n\") as fh:\n    fh.write(\"\\n\".join(sorted(lines)) + \"\\n\")\nprint(\"published\"\
    , len(src), \"file(s) + manifest ->\", dst)\nraise SystemExit(0 if len(src) >= 2 else 1)\n"
