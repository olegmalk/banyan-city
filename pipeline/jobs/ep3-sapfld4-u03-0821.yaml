bar: "EIGHT PLATES, JUDGED AS ONE CONTACT SHEET, BY EYE AT 1:1. THERE IS NO\nPLANT AND NO FIGURE IN ANY\
  \ OF THESE PICTURES AND BOTH ABSENCES ARE CORRECT.\n  D1 CEL, NOT PHOTO, NOT PAINTING. Flat fills, clean\
  \ ink linework, the\n     episode's dialect. This is the clause the ep2-b16-field batch lost all\n \
  \    four on, and it is the first one read. Bokeh, painterly rendering or a\n     photographic ground\
  \ plane REJECTS the plate -- you cannot draw a sharp\n     cel seedling into a soft foreground without\
  \ it reading as a decal.\n  D2 A CLEAN DRAWABLE GROUND PLANE in the lower centre, wide and tall enough\n\
  \     to root a sapling at plate scale. Blades of grass crossing it are fine.\n     A rock, a flower,\
  \ a shrub, a drawn plant or any structure is NOT: the\n     0.30 pass PRESERVES a structure it finds\
  \ in the init (12 of 40 steps from\n     a latent that still carries it), so the composite would have\
  \ to fight it.\n  D3 ZERO FIGURES. Not a goblin, not a human, not an animal, not a silhouette\n    \
  \ on the horizon. A plate with any figure in it is REJECTED AND DELETED,\n     not cropped -- this lane\
  \ may not render the scavenger and a frame that\n     contains him is not curated into a training set.\n\
  \  D4 THE LIGHT HAS A DIRECTION. beat16_sapling_composite.py measures the\n     plate's own low-pass\
  \ luminance gradient and carries it into the drawn\n     plant. A flat, directionless plate makes that\
  \ measurement a no-op and\n     the composite reads as pasted.\n  D5 THE PALETTE IS THIS SHOW'S. The\
  \ composite samples its greens FROM THE\n     PLATE, so an off-palette plate produces an off-palette\
  \ sapling and the\n     frame teaches the LoRA the wrong colour.\nNOT SCORED: whether the picture is\
  \ a good shot. None of these is a shot, none\nenters a cut, and none goes near review/ep2-ship-0821.\
  \ They are ground planes\nfor an instrument.\nNOT SCORED: variety WITHIN a cell. The variety this batch\
  \ is bought for is\nBETWEEN cells and it is measured at the manifest, not here."
the_one_variable: THE SCENE-AND-LIGHTING CLAUSE ('in a green meadow, distant hills, morning, mist'), and
  every value of it names something in the distance. 'wide shot, low angle' is still p09's byte for byte
  and still frozen; so are the quality prefix, `no humans`, the negative, the checkpoint, the size, the
  steps, the cfg, the nocontrol arm and its 0.45 scale.
this_cell: t04 without the fisheye. t04 already passed on its plane, so if this loses it, `low angle`
  was buying the plane too and that is the finding.
the_finding_that_bought_this_round: 'ROUND 3 CONFIRMED ITS HYPOTHESIS AND EXPOSED THE NEXT DEFECT. Every
  cell naming a distant landform returned a horizon and a rootable plane -- t02, t04 and t07 clean, and
  not one macro-grass frame in eight, against six of ten in round 1. But six of the eight are BARREL-DISTORTED:
  t01 arches its treeline over the top of the frame, t05 narrows its path to a wedge, and t02/t04/t06/t08
  curve the horizon. A curved horizon is not a plane a cel seedling can stand up on -- beat16_sapling_composite.py
  draws a VERTICAL stem at a measured root point and the plate''s geometry has to agree with it.'
the_cargo_i_carried_without_warrant: '`low angle` came from p09 and was frozen through rounds 2 and 3
  on the reading that the framing clause was load-bearing. r02 KILLED THAT READING -- the distance clause
  is the lever -- and I froze the framing anyway instead of retiring the half of it that no longer had
  an argument. `wide shot` earns its place; `low angle` was never tested alone and is what this checkpoint
  draws as a fisheye. Two rounds of curvature is what carrying it cost.'
what_rounds_1_to_3_cost_and_what_they_bought: '26 plates, ~78 minutes of otherwise-idle card, $0, and
  8 usable ground planes. Bought one mechanism per round, each by a controlled change: round 1 that a
  ground-cover noun returns a macro of itself, round 2 (by DELETING four words from the cell that passed)
  that a named distant feature and not the framing word is what buys depth, round 3 that the depth cue
  generalises across scenes and lighting. Two of my three round-opening predictions were wrong and both
  are kept above their results.'
failure_predicted_in_advance: 'FIRST: THE TREELINE COMES INTO THE FOREGROUND. `a treeline in the distance`
  asks for trees, the negative bans `tree`, and this tree''s negatives have failed to hold position four
  times. If trees arrive mid-frame the depth cue has cost the ground plane it bought and t02''s `distant
  hills` -- which names no bannable object -- is the cell to carry forward.

  SECOND: t04''s MIST EATS THE CUE. Haze is what makes distant hills read as distant, but r04 already
  showed mist collapsing a cell to silhouettes. If t04 fails where t02 passes, mist is incompatible with
  this route and the dataset''s cool-light breadth has to come from t06''s overcast instead.

  THIRD, AND IT IS THE ONE THAT WOULD RE-OPEN THE ROUTE: the ground plane arrives but sits at the HORIZON,
  not the lower centre. Then no wording fixes it and the answer is the crop this batch has already committed
  to for scale.'
clip77_measured_not_estimated: prompt 27 of 77, counted offline on animagine's own vocab before this file
  was written; negative inherited at 71 of 77.
