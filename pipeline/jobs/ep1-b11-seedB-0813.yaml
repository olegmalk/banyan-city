# 2026-08-13. SEED TWIN for an episode-1 beat that has exactly ONE take and no verdict.
#
# WHY: my seed test on episode 2 found FIVE of nine beats that looked solved were one lucky
# roll — the second seed disagreed on the plant, the light or the action. Every episode-1
# beat with a single take is in that same unknown state, and he is about to review them. A
# twin turns a coin-flip into stability data before he spends attention on it.
#
# ONE VARIABLE: the seed. Same plate from the same tracked still, same prompt, same frame
# count, same guidance. I verified the still is REACHABLE ON THE BOX before authoring — the
# check that has caught two broken jobs this week.
#
# ONE ADDITION THAT IS NOT A VARIABLE: A PUBLISH STEP. The original has none, so its output
# strands on the box and cannot be fetched or hash-verified — the defect that hid the cold
# open from him for hours. The twin publishes; the original's clip is already in the v37 cut.
#
# I ALSO GOT THIS FILE'S SHAPE WRONG ONCE: episode-1 jobs indent their `steps:` list by two
# spaces and my episode-2 jobs do not, so my first publish block broke the YAML. Indentation
# is now read from the file rather than assumed.

id: ep1-b11-seedB-0813
task: ep1-b11-seedB-0813-0811
node: 001-capability-inventory
beat: 11
runner: box
needs_gpu: true
priority: 25
max_attempts: 1
sample: false          # 129f is below the proven 145f - see the run-copy note
owner: queue-depth lane, 2026-08-11

consumer: >-
  the episode-1 cut he is being asked to pass — `v6-verdict` in
  pipeline/pending-founder.yaml. Beat 11's picture plays 2.11 times under its own
  line. This produces the version that does not repeat, so his yes/no lands on
  the cut rather than on an artefact of the assembler.

success: >-
  A 704x1280 mp4 at C:\banyan-farm\v34-r2\11-grow-LTX-seedB.mp4 with 129 decoded
  frames (5.375s), conditioned on the canon still, in which the sprout is the
  SAME sprout for the whole clip: the leaf trembles and the dew catches the light
  and the morning light shifts, but the plant does not grow, unfurl, sprout a new
  leaf, wilt, bend or fall, the framing does not drift or push in, and no second
  scene appears. A clip where the plant droops or collapses is a FAIL however much
  motion it has — that is the confusion 131e433 recorded. A completed clip that
  reads static is a real result and gets reported as one. By eye, beside the
  2.542s clip it replaces. No metric.

why: >-
  The footage is shorter than the sentence spoken over it, and the fix is a frame
  count on a frame he has already accepted.

est_minutes: 6   # plate <1min; encode ~2min (Gemma load dominates); render ~3.3min
                 # from this box's own numbers (145f = 214s, 385f = 436s, so
                 # ~80s + 0.925s/frame -> ~199s at 129 frames).
needs: [cuda, vram20, video-venv]

payload:
  # Skeleton is b07-prompt.txt verbatim in shape — same cel-anime opener, same
  # "small ambient motion only ... framing locked" clause block, same "Subject
  # already in frame:" tail. Content is beat 11's macro sprout. The anti-zoom
  # terms are KEPT: they were in force on beat 04 when the camera move Roman
  # praised appeared, so removing them here would change a second thing.
  # The verbs are CONTINUOUS ("trembles slowly and continuously") rather than
  # one-shot: beat 04's rejected clip traced to a "twitch once" clause the model
  # cycled, and a one-shot instruction is how you get a loop inside the clip.
  C:\banyan-farm\v34-r2\b11-prompt.txt: |-
    2D anime, hand-drawn cel animation, flat cel shading, clean ink linework, anime key art. the single small leaf trembles slowly and continuously in a light breeze and keeps its shape and its size, the dew drops on it catch and release the light as it moves, soft golden morning light shifts gently across the sprout, the pale sky behind it brightens very slightly. small ambient motion only, the plant stays exactly the same size and shape, no growing, no unfurling, no new leaf, everything holds its position, framing locked, no zoom, no push-in, no camera rise, subject stays the same size and place in frame, living scene. Subject already in frame: no human, no person, no man, no woman, no boy, no girl, no hand, no face, one tiny green sprout in macro close-up with one bright new leaf at its tip, morning dew drops, soft golden morning light, gentle pale sky.

  # Series negative, plus this beat's own terms against the growth reading. At
  # guidance 1.0 none of it is read; carried for the provenance record (§7.2).
  C:\banyan-farm\v34-r2\b11-negative.txt: |-
    wilting, drooping, bending over, falling over, collapsing, sagging, plant dying, growing, sprouting, unfurling, timelapse, second leaf, new leaf appearing, human, person, man, woman, boy, girl, hand, arm, foot, face, crowd, animal, bird, insect, new object appearing, light trails, mature tree, large tree, photorealism, 3D render look, text, 静态, 静止, frozen frame, still image, no motion, photorealistic, photograph, live action, film still, 3D render, CGI, octane, scene change, shot change, cut to another angle, second scene, new camera angle, different location, split screen, montage

  C:\banyan-farm\v34-r2\b11-jobs-encode.json: |-
    [{"beat": 11,
      "embeds": "C:\\banyan-farm\\v34-r2\\b11-embeds.pt",
      "prompt_file": "C:\\banyan-farm\\v34-r2\\b11-prompt.txt",
      "negative_file": "C:\\banyan-farm\\v34-r2\\b11-negative.txt"}]

  C:\banyan-farm\v34-r2\b11-jobs-render-129.json: |-
    [{"beat": 11,
      "seed": 20260913,
      "embeds": "C:\\banyan-farm\\v34-r2\\b11-embeds.pt",
      "init": "C:\\banyan-farm\\v34-r2\\11-704x1280.png",
      "out": "C:\\banyan-farm\\v34-r2\\11-grow-LTX-seedB.mp4"}]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  HF_HOME: C:\Users\artvn\.cache\huggingface
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "60"
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

steps:
  # No 704x1280 plate exists for beat 11 (v34-r2 holds only 04, 06, 07), so the
  # plate step runs. Source verified present in the box checkout at
  # ...\001-capability-inventory\stills\11-grow.png. prepare_plate does the
  # cover-centre crop (plate_prep.py:55) — the v34-motion-0810 series went in RAW
  # and is stretched 24.4% vertically, the confound recorded in
  # ep1-b14-v34-motion-r3.yaml. This job does not repeat it.
  - name: plate
    argv:
      - C:\banyan-video\venv\Scripts\python.exe
      - -c
      - |
        import sys; sys.path.insert(0, r"C:\banyan-farm\banyan-city\pipeline")
        from plate_prep import prepare_plate
        out, rec = prepare_plate(
            r"C:\banyan-farm\banyan-city\genomes\sapling\nodes\001-capability-inventory\stills\11-grow.png",
            "704x1280", r"C:\banyan-farm\v34-r2", "11")
        print("plate", out); print(rec["plate_wxh"], rec["crop_policy"])
        print("source_sha256", rec["sha256"])
  - name: encode
    argv:
      - C:\banyan-video\venv\Scripts\python.exe
      - C:\banyan-farm\banyan-city\pipeline\ltx_i2v.py
      - --stage
      - encode
      - --jobs
      - C:\banyan-farm\v34-r2\b11-jobs-encode.json
  - name: render
    argv:
      - C:\banyan-video\venv\Scripts\python.exe
      - C:\banyan-farm\banyan-city\pipeline\ltx_i2v.py
      - --stage
      - render
      - --jobs
      - C:\banyan-farm\v34-r2\b11-jobs-render-129.json
      - --size
      - 704x1280
      - --frames
      - "129"
      - --fps
      - "24"
      - --guidance
      - "1.0"
      - --distilled-sigmas
      - --two-stage
      - --image-crf
      - "33"
      - --offload
      - sequential
      - --mode
      - production
      - --task
      - ep1-b11-129f-vo-length-0811
      - --worker
      - rtx5090
      - --bench-jsonl
      - C:\banyan-farm\v34-r2\bench-b11-129f.jsonl
      - --bench-label
      - b11-129f-vo-length

  - name: publish
    allow_fail: true
    argv:
      - C:\banyan-farm\venv\Scripts\python.exe
      - -c
      - |
        import glob, hashlib, os, shutil
        dst = "C:/banyan-farm/courier-box/farm-out/ep1-b11-seedB"
        os.makedirs(dst, exist_ok=True)
        src = sorted(glob.glob("C:/banyan-farm/v34-r2/11-grow-LTX-seedB.mp4*"))
        lines = []
        for f in src:
            shutil.copy2(f, dst)
            c = os.path.join(dst, os.path.basename(f))
            with open(c, "rb") as fh:
                h = hashlib.sha256(fh.read()).hexdigest()
            lines.append(h + "  " + os.path.basename(f))
        with open(os.path.join(dst, "ep1-b11-seedB-0813.sha256"), "w", newline="\n") as fh:
            fh.write("\n".join(lines) + "\n")
        print("published", len(src), "file(s) ->", dst)
        raise SystemExit(0 if len(src) >= 1 else 1)

artifacts:
  - C:\banyan-farm\v34-r2\11-grow-LTX-seedB.mp4
