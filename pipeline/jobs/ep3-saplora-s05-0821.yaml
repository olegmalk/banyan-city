  \ anything; its only consumer is the sapling LoRA's\ntraining set, so the bars are the ones a training\
  \ frame has to clear.\n  D1 EXACTLY TWO LEAVES ON ONE STEM. Canon `sapling-two-leaves`. Three is a\n\
  \     delete, so is one. The init has two by construction, so a three here means\n     the 0.30 pass\
  \ invented one and the finding is about the pass.\n  D2 AVERAGE LEAVES. Canon `sapling-cotyledon-shape`\
  \ -- ordinary, plain, no\n     lobes, no lance, no exaggerated silhouette.\n  D3 NO FIGURE, NO CREATURE,\
  \ ANYWHERE IN FRAME. A frame carrying one is\n     DELETED, not cropped. This tree's negatives have\
  \ failed to hold position\n     five times and the plates exist precisely because the ~23 existing\n\
  \     composites all carry the scavenger.\n  D4 THE PLANT IS DRAWN, NOT PASTED. Line weight and cel\
  \ shading in the plate's\n     dialect. The named degenerate outcome has a number: on the b16 big-leaf\n\
  \     attempt detail inside the region fell 10.45 -> 9.41 and the two pictures\n     were the same picture.\
