  needs is across SCENES, not across seeds of one scene. No leaf-count variation: beat16_sapling_composite
  draws the canon two, leaf_count_composite only REMOVES leaves from a plate that has too many, and inventing
  a third here would break `sapling-two-leaves` to satisfy a dataset axis. No training is started, no
  trainer is installed, and DECISIONS.md item 18 is left open for the founder.'
