# 2026-08-15, goblin-fix lane. ONE VARIANT, not a seventh design and not a spread.
# It is a delta on d1 -- the best of the six -- aimed at the two failure modes a lane
# read off all 24 design frames: they render as pale Namekian-style monks in robes,
# and the dominant expression is ANGRY rather than DUMB.
