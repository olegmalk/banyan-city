owner: goblin-fix lane, 2026-08-15
consumer: 'NOT his board. The six-option picker at review/ep2-picks/sheets/goblin-design-0815.jpg
  is already filed and a single writer owns it; this does not go near review/inbox.yaml. The
  consumer is the ANSWER "all six are wrong because X": that option is on the card, six beats
  (07, 08, 15, 17, 19, 20) are recorded blocked-decision behind it, and if he takes it the fix
  is already rendered and a whole cycle is saved. If he picks a number instead this cost four
  GPU-minutes and is discarded. Result is read by the lane and reported up, not published.'
success: 'Four frames of ONE variant. The read is narrow and it is against his brief, not against
  taste: (1) does it read GOBLIN rather than bald-green-monk -- green not sickly yellow, a garment
  that is not a robe; (2) is the face DUMB rather than ANGRY -- no scowl, no snarl, no fangs;
  (3) does it read YOUNG rather than fifty. It has to beat d1 on 2 and 3 without losing d1''s
  non-cuteness, which is the thing d1 got right. THE NEGATIVE FINDING IS WORTH AS MUCH: if the
  monk read survives a string with no sash, no tunic, bare arms and `no robe` in the negative,
  then it is the checkpoint''s prior for `bald + green skin + long pointed ears` and no prompt
  on this path will fix it -- that is a report saying the design must be drawn or sourced, not
  another wording round.'
why: 'THE REFS QUESTION WAS ASKED FIRST AND IT HAS A SURPRISING ANSWER: there is no reference set.
  render_wave_sample.py builds a StableDiffusionXLPipeline and calls it with prompt/negative_prompt
  only -- no img2img, no IPAdapter, no control image. All six d-jobs are pure txt2img on
  animagine-xl-3.1. So the refs-decide law does not apply on this path, nothing outranked the words,
  and every element of the monk read is attributable to the string or to the checkpoint prior.
  Words are the only lever here, which is why this variant is words. What moved: `sash` (the most
  kimono-coded token in the six) becomes `ragged sleeveless vest, bare arms`, because bare arms are
  the structural opposite of a robe and no adjective on `tunic` can do that; `heavy sloped brow`
  (a lowered forward brow is the anatomy of anger, and the model drew it as one) becomes `thick
  eyebrows`, keeping the weight and losing the scowl, with `half-closed` added to the eyes for the
  dopey lid; `young adult` answers the third miss. d1''s build tags `squat, round-bellied` are kept
  byte for byte so this is one delta against a known baseline.'
prediction: 'Written before any frame exists. The skin should be plainly green, because `pale
  yellow-` is gone -- and that phrase was never his: it is the MOTION lane''s i2v sentence borrowed
  into these specs, while the prompt that drew the frame he called "a good representation" says
  `green skin, bald head`. So --goblin-def is a REVERT to his own words, not a new colour, and I
  expect that single change to carry most of the species fix on its own. Lower confidence on the
  garment: `ragged sleeveless vest` may still be drawn as a wrap. LOWEST confidence on the face --
  removing the heavy brow is the one change that could cost d1''s non-cuteness, and if these come
  back cuter than d1 that trade is what did it. The likeliest partial outcome is green-and-not-angry
  but blander than d1, which is still the right direction because bland is recoverable and angry is
  off-brief. I also expect `bald` + `long pointed ears` to keep pulling Namekian no matter what,
  since both are frozen identity and neither moved.'
