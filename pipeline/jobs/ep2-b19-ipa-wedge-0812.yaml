# EPISODE 2, BEAT 19 — GIVE THE POSE BACK BY SHOWING THE REFERENCE FOR LESS TIME. $0.
# 2026-08-12, character-consistency lane. ONE SAMPLE of the lever the pass named.
#
# ── WHAT THE PASS ESTABLISHED. Ten beats now hold the character and almost none hold
# their own staging: he stands still, arms at his sides, facing camera, on whatever
# beat the frozen reference is pointed at. Beat 19 is one of the clearest losses — its
# draft has him stop MID-STEP as a fig drops and bounces off his head, and all four
# frames are a standing portrait with no fig in them.
#
# ── WHY TIME AND NOT SIZE. Scope was measured and it is one axis with two ends: more
# body in the reference buys identity and costs pose. Both ends are now known, so the
# remaining axis is WHEN the reference is present. A diffusion sampler fixes coarse
# structure — which creature this is — in the earliest, highest-noise steps and spends
# the late ones on surface. The adapter currently runs for the first 15% of the
# denoise. If the creature is already decided by 10%, the last 5% is buying nothing but
# the reference's posture.
#
# ── THE ARM ALREADY EXISTS AND IS UNCHANGED. `wedge` is the sampler's own edge sweep:
# two cells, the window at 10% and at 20%, scale held at 0.6, four seeds each. 15% —
# every frame in the pass — sits between them, so this brackets what we have rather
# than wandering off it. Same beat, same refs, same seeds, same prompt.
#
# ── ONE SAMPLE, NOT A BATCH, deliberately. The other nine beats stay as they are until
# this says whether the trade is real. A metric agreeing with me is not a sample.
#
# ── NOT A PICK, NOT CANON. Provisional under his delegated evaluation grant.
#
# $0 — local GPU on the rtx5090, no provider, nothing published, nothing assembled.
