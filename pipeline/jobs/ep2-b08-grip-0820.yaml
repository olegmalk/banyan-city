verdict: >-
  FAIL, AND IT IS THE MOST INFORMATIVE FAIL ON THIS ROUTE. Nine words of
  positive grip language, with EVERY conditioning input byte-identical to the
  parent, ERASED THE CLIPBOARD AND TOOK THE GUARD'S HAIR WITH IT. Two branches
  of the pre-registered rule fired at once -- (4) prompt crowding is real, and
  (5) the second net's product is prompt-sensitive at fixed strength -- and (5)
  fired harder than it was written: it was written for a board that DEGRADES and
  what happened is a board that is GONE. The authored quad holds 23.5% of pixels
  below luma 80 against the parent's 75.8%, region mean luma 108.2 against 66.2,
  and at 3x the quad contains the wrap skirt, the grass and the belt clasp with
  no board edge anywhere in the frame. The guard is BALD -- smooth scalp, no
  hairline, no strands -- where the parent, at the same 1.0 + 0.3 conditioning,
  came back with light sandy hair. THE GRIP ITSELF PARTLY WORKED, WHICH IS THE
  DIAGNOSTIC: fingers and thumb ARE drawn, articulated, on the correct far hand
  -- and they are closed around the SASH STRAP at his chest, the nearest
  graspable object, exactly where that hand already was in the parent. The
  clause summoned a grip and the render found something else for it to hold.
  Everything else survived: B7 passes on both figures, B2 at +54.4, the pointing
  hand 41.2 px from its authored wrist, the drawing at twinsipa's level, frame
  mean luma 127.3 against the parent's 134.2 and twinsipa's 141.6. NO PICK, NO
  plate_ack, NO CUT. THE PARENT ep2-b08-scale30-0820 REMAINS THE BEST FRAME ON
  THIS BEAT and this one does not displace it.
