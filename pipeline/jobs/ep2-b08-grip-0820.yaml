scoring_rule_pre_registered: 'THIS IS THE `verdict_rule`, WRITTEN BEFORE THE PIXELS.

  (1) DIGITS ON THE BOARD, ONE BOARD, ON THE BOARD-SIDE HAND, AND EVERY CARRIED CLAUSE SURVIVES -> PASS,
  and beat 08 has a COMPLETE PLATE CANDIDATE for the first time: every clause the beat asks for in one
  frame. The pixels get STAGED for cut assembly and said so plainly. It is STILL NOT A PICK and NOT a
  plate_ack -- choosing between this frame and its predecessors is taste and belongs to R4.

  (2) NO DIGITS, EVERYTHING ELSE HELD -> wording is ELIMINATED as the lever for a hand on this route,
  cleanly, because nothing else moved. The next rung is the negative''s hand terms (`extra hands, extra
  fingers, deformed hands`), and only after that the board hint carrying a stroke for the gripping hand.

  (3) DIGITS ARRIVE ON THE POINTING HAND, OR A SECOND BOARD APPEARS -> the clause bound to the wrong referent.
  Informative and cheap to fix: the next wording names the object once and binds by position (`at his
  hip`) rather than repeating the noun.

  (4) THE GRIP ARRIVES AND SOMETHING CARRIED BREAKS -- hair, wardrobe, the far arm, an identity -> PROMPT
  CROWDING IS REAL ON THIS ROUTE AT 73 OF 77, which is a finding that outlives beat 08 and immediately
  constrains every other beat''s prompt. Not a pass; the frame would be traded one clause for another.

  (5) THE BOARD ITSELF DEGRADES -> the second net''s product is sensitive to prompt content at fixed strength,
  which contradicts nothing measured so far but would mean the 0.3 result is less robust than one frame
  suggested, and the route re-reads before it spends anything else.'
the_words_and_the_budget:
  the_only_edit: '`clipboard lowered in one hand,` -> `clipboard lowered in one hand, fingers and thumb
    gripping the clipboard edge,`. Nine words inserted; NOT ONE token of the parent''s prompt removed,
    because every one of them was in the frame that passed and this rung is not entitled to guess which
    ones mattered.'
  measured_not_estimated: 73 of 77 tokens, measured by pipeline/clip_token_count.py against animagine-xl-3.1's
    own vocab.json and merges.txt -- not counted in words. The parent measures 64 of 77. Nine of the thirteen
    free tokens are spent and four remain. The derivation ASSERTS both numbers and refuses to write the
    spec if either moves, because SDXL drops the TAIL in silence and this prompt's tail is `masterpiece,
    best quality, very aesthetic`.
  why_these_nine_words: 'The parent''s verdict names three absences in one sentence -- `no fingers, no
    thumb, no grip` -- so the clause asserts all three positively: two nouns, the verb, and the contact
    geometry (`the clipboard edge`). PROMPT-SUMMONS: a positively placed assertion beats a negative, and
    this frame''s negative already carries hand terms while its positive asserted no hand at all. `clipboard`
