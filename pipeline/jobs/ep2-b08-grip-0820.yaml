  -- it carries `extra hands, extra fingers, deformed hands` and whether those suppress hands outright
  is a real question and a SECOND variable; prompt-summons says the positive assertion is the stronger
  lever, so this rung measures that one and the negative is the named next wording rung if it fails. NO
  FIGURE INK IN THE BOARD HINT: that would be the first ever placed there and the parent ruled it must
  be argued against the five tracing losses, not slipped in, and only after wording has been tried. No
