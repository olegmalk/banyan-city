what_this_settles: >-
  WORDING IS ELIMINATED AS THE LEVER FOR THE GRIP ON THIS ROUTE, AND IT IS WORSE
  THAN NEUTRAL -- IT IS A NEGATIVE LEVER, because the tokens that buy a grip cost
  the object and the canon hair. That is branch (2) of the pre-registered rule
  answered, plus two branches nobody could have collected separately.
  SECOND, AND IT REVISES RUNG 17: --scale2 0.3 IS NOT A ROBUST SETTING, IT IS A
  PROMPT-COUPLED ONE. The board at 0.3 survived exactly one prompt -- the 64-token
  one it was measured with -- and did not survive nine words added to that same
  prompt at the same strength. "0.3 delivers the board" must now be read as "0.3
  delivered the board for that text", and any future beat-08 prompt edit has to
  re-verify the board rather than assume it.
  THIRD, THE B8 INSTRUMENT HAS TWO INPUTS, NOT ONE. It was calibrated on
  conditioning load; it moved here with conditioning fixed and only the token
  count changed. A bald guard on this beat now means "over-conditioned OR
  over-crowded", and the two are told apart by which of them moved.
  FOURTH, AN ADMISSIBILITY EXTENSION THE PARENT'S RULE DOES NOT COVER AND THIS
  FRAME FORCED: ON THE GUARD, COLOUR ALONE CANNOT CERTIFY SKIN. His cream shirt
  measures R-B 34.7 against his skin's 42.6-49.7 -- an 8-level gap, closer than
  the goblin's skin is to anything he wears. The first probe placed on this frame
  by a colour predicate landed on a SLEEVE at 100% "pale", and it would have
  passed a naive material test. Guard probes are placed by eye and published with
  their R-B; the parent's rule said publish the material, and this says the
  material of a cream-clad figure is not a colour test's to decide.
what_this_did_not_settle: >-
  WHETHER THE BOARD AND THE GRIP CAN COEXIST AT ALL. They have never been asked
  for at a strength that could carry both: the board was measured at 0.3 with no
  grip language, and the grip language has only been tried at 0.3. Nor whether
  the loss is the token COUNT or the token CONTENT -- nine words about a hand
  might crowd differently from nine words about anything else. Nor the goblin's
  trousers. Nor whether any of this holds at a second seed; every frame on this
  route is seed 20260819.
what_this_does_not_license: >-
  NO PICK, NO plate_ack, NO CUT, NO CANON FILENAME. It does not license a wording
  sweep -- one wording sample cost the board and the hair, and a second wording
  variant is the same bet at the same odds. It does not license editing the
  parent's spec or re-reading its verdict as wrong: scale30's frame is unchanged
  and still the best on this beat. It does not license putting figure ink in the
  board hint on the strength of this frame alone; that argument is still owed the
  five tracing losses.
next_rung_named_not_taken: >-
  ONE sample, and the variable is --scale2, WITH THIS FRAME'S WORDING HELD. The
  question this frame raises and cannot answer is whether the board and the grip
  compete for one conditioning budget. Holding the 73-token prompt byte-identical
  and raising --scale2 from 0.3 toward ~0.5 asks exactly that in one number: if
  the board returns AND the fingers stay, beat 08 has its recipe and the earlier
  0.8 damage was the far end of a usable range rather than a verdict on two nets.
  If the board returns and the hair stays bald, the two failures are independent
  and the wording has to come back out. If neither returns, the second net cannot
  hold an object against a crowded prompt at any strength that leaves the drawing
  alone, and the board hint carrying a stroke for the gripping hand becomes the
  argued next lever rather than the speculative one. Its bar is B4a plus B8, with
  every clause that passed here pre-registered to survive. Zero dependency: every
  weight is on the card, both hints exist, the stage is already at
  C:\banyan-farm\b08grip-0820\src.
