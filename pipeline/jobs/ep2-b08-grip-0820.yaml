bar:
  b0_the_stack_is_what_it_claims: 'VOID-CHECK, carried from the parent UNCHANGED and it must stay unchanged,
    because this rung''s whole claim is that only the words moved. Preflight prints `twins net verified`,
    `scribble net verified`, the line asserting the two nets share size and config and DIFFER in weights,
    and `staged driver, BOTH hints and BOTH references verified`. The sidecar must read `controlnet_conditioning_scale:
    1.0`, `controlnet_2_conditioning_scale: 0.3`, `control_image_sha256: 562911c8...`, `control_2_image_sha256:
    38cd39da...`, `seed: 20260819` and both capsule masks unchanged. If any of those differs from the
    parent''s sidecar this is not a wording comparison and the frame is not a result.'
  b4a_the_grip: 'THE ONE CLAUSE THIS RUNG EXISTS FOR, AND IT IS SCORED AT 5x. The board is already established
    -- the parent drew it at the authored quad, corners (608.6,660.5) (719.5,678.1) (697.7,816.2) (586.7,798.6),
    bbox x 583-723 y 657-820, at the authored 9-degree tilt with its top edge below the shoulder line
    y=491 -- and that MUST SURVIVE. What is being added: A DRAWN HAND ON THE BOARD. Passes if at 5x there
    are separated digits at the board''s edge -- fingers reading as fingers, not a rounded terminal form
    -- with the board''s edge passing BEHIND or BETWEEN them rather than tucking under a mitten. A thumb
    is wanted and its absence alone is not a fail; the fail is no digits. Scored BY EYE at 1:1, 3x and
    5x against the parent frame side by side. NO EDGE METRIC: the parent''s verdict established that mean
    gradient in this region reads lower WITH the board than without it, so the number is known to point
    the wrong way here.'
  b4a_ii_still_one_board: THE RISK THE EDIT ITSELF CREATES, PRE-REGISTERED BECAUSE IT IS THE PRICE OF
    NAMING THE OBJECT TWICE. `clipboard` now appears twice in the positive prompt, which is what binds
    the digits to the right hand, and the standing counter-risk is a duplicated object. EXACTLY ONE board
    or clipboard in the frame, at the hint's quad. A second board anywhere -- in the pointing hand, on
    the ground, doubled at the same place -- FAILS this clause even if the grip arrives, and it would
    mean the next wording must refer to the object once and bind by position instead.
  b4b_the_grip_is_on_the_RIGHT_hand: 'THE OTHER RISK THE EDIT CREATES. The guard has two hands and the
    other one is POINTING. The fingers must arrive on the board-side hand; fingers added to the pointing
    hand, or a pointing gesture that turns into a second grip, is a FAIL of this clause and a specific,
    useful finding about how the clause binds. The pointing hand''s centroid stays within ~60 px of the
    authored wrist (280.5,695.1): twinsipa 40.3, boardnet 10.2, the parent 48.5, so this has never failed.'
  b6_drawn_not_traced: 'CARRIED AND PRE-REGISTERED TO SURVIVE. Both figures read as DRAWN CHARACTERS at
    ep2-b08-twinsipa-0819''s standard, which the parent met: a face with pupils and a set jaw, hair with
    strands, folds in BOTH garments, a legible metal clasp, a drawn cuff. Words do not usually move this,
    and if it moves on a nine-word change that is itself the finding.'
  b8_the_guard_has_hair: 'CARRIED, AND IT IS NOW AN INSTRUMENT RATHER THAN JUST A CANON CHECK. canon.yaml
    `ep2-guard-hair`: guard B has light sandy hair and \bbald\b is FORBIDDEN. The parent established that
    with the wording held constant this attribute tracks conditioning load -- bald at 1.0+0.8, sandy at
    1.0+0.3. Conditioning does not move on this rung, so hair is pre-registered to stay. If the guard
    goes bald on a WORDING change, the instrument reads a second input -- prompt crowding -- and that
    is worth as much as the grip.'
  b7_no_limb_fragmentation: 'CARRIED WITH THE PARENT''S HARD-WON ADMISSIBILITY RULE, WHICH IS NOW A STANDING
    REQUIREMENT ON THIS BEAT. G-R at six regions, three per figure. EVERY PROBE BOX IS PLACED FRESH ON
    THIS FRAME AND PUBLISHES THREE THINGS: its coordinates, its luma, AND ITS MATERIAL (skin / cloth),
    with skin verified as >=97% skin-coloured pixels in the window. Boxes from the parent are NOT reused:
    the parent proved they do not transfer -- scored at twinsipa''s coordinates it read a false FAIL of
    41.5 because the goblin''s wardrobe had changed under the box, and luma-matching a box on the wrong
    material does not rescue it (50.6). Within-figure spread <= 25.0; every guard region <= 0.0, every
    goblin region >= +20.0.'
  b2_the_identities_separate: Guard face <= 0.0, goblin face >= +20.0, separation >= +20.0. twinsipa +42.0,
    the parent +60.6. Same material-and-luma publication rule as B7.
  b4c_the_arm_belongs_to_the_guard: 'MUST SURVIVE. The pointing arm grows from the guard''s shoulder and
    is human-skinned. Nine mechanisms have held it. AND THE HALF THE PARENT WON: the far arm still REACHES
    the board. An arm that goes back to vanishing takes the grip question with it and the frame is a regression,
