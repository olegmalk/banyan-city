why: |-
  ONE VARIABLE, AND IT IS A NUMBER THE LAST RUN MEASURED.

  WHAT THE RUNG BELOW THIS ONE RETURNED
  --------------------------------------
  ep2-b01-nubcomp-0818 composited the nub in plain PIL at hue 90.0 deg and blended
  it at strength 0.30. It came back:

      hue median 68.6 deg, sat 0.430, val median 0.753, max 0.847
      zero pixels above 250 in all channels, one body, 25x31 px, touching the
      pedicel, no purple

  That is a FAIL on a band of [70,150] deg registered before the frame existed --
  by 1.4 degrees. It is also the mechanism working: the rung below IT, at strength
  0.99 with the colour merely requested in the prompt, returned hue 48 deg / sat
  0.48 / val 0.95 with a 250,245,151 pixel in it. Making the colour structural
  moved the result 20.6 degrees green-ward and removed the glow defect outright.
  The dose was wrong, not the instrument.

  WHAT MOVES HERE, AND WHY IT IS THE HUE AND NOT THE STRENGTH
  ------------------------------------------------------------
  The 0.30 pass pulled the composited hue 21.4 degrees toward the plate's amber.
  That is no longer a mystery to be solved; it is a measured constant to be
  compensated. So the composite starts 21 degrees greener and the same pull is
  expected to land it mid-band:

      --hue-percentile 0.98  ->  111.4 deg   (was the median, 90.0 deg)
      111.4 - 21.4  ~=  90 deg, the middle of [70,150]

  The hue is still SAMPLED, not typed. 111.4 deg is a hue that exists in this
  plate: its greens run 76.4 at p25, 90.0 at the median, 100.0 at p75 and 128.6 at
  the greenest pixel in the frame. A percentile keeps the nub made of this
  picture's own colour, which a hex constant would not.

  The alternative was dropping strength to 0.20. Rejected on this rung: 0.20 risks
  under-blending the paste seam -- the composite goes in with a 1.6 px feathered
  edge and no cel line, and at 0.30 the pass drew the line and the form shading
  (see the previous rung's frame). Weakening the blend to fix a colour drift would
  trade a measured defect for an unmeasured one. Strength stays 0.30 and every
  other argument, including the SEED, is byte-identical, so this is a single-
  variable experiment on the hue.

  WHAT THIS RUN CAN ANSWER
  -------------------------
  Whether the -21.4 deg pull is a constant of this recipe or a coincidence of one
  hue. If it is a constant, this frame lands near 90 deg and beat 01 has a
  candidate frame-1 plate for the founder to look at. If the result overshoots or
  lands short, the pull is hue-dependent and the next move is measured from two
  data points instead of one -- which is a better position than this rung started
  from either way.

  It cannot answer whether the founder likes the nub. That is R4's and this job
  makes no taste call.
success: |-
  PRE-REGISTERED BAR, ONE SAMPLE, N=1, CARRIED FORWARD FROM
  ep2-b01-nubcomp-0818 WITH ONE CRITERION RESTATED AND NOTHING RELAXED.

      PASS-COLOUR  =  median hue of the nub's body pixels in [70, 150] degrees
                      AND median saturation >= 0.12

  Same band, same measurement, same body-mask method as the two rungs below this
  one (the pixels inside the ellipse that the pass changed vs the plate). The band
  is unchanged on purpose: it was set before any of these frames existed, the
  previous rung missed it by 1.4 degrees, and a band that moves after the pixels
  arrive measures nothing. The composite goes IN at 111.4 deg, so a result inside
  [70,150] is the pull-compensation working and a result outside it is not.

   1. COLOUR: median hue in [70,150] deg, median sat >= 0.12.
   2. NOT BLOWN: max value < 0.99 and fewer than 5 body pixels above 250 in all
      three channels.
   3. ONE BODY: exactly one connected component of 20 px or more.
   4. ATTACHED: the body touches or overlaps the pedicel tip at (407,744).
   5. SMALLER THAN EITHER LEAF: the body's larger dimension stays under 62 px.
      Lit-blade extents on this plate are 81x76 (left leaf) and 94x62 (right).
   6. PLATE UNCHANGED OUTSIDE THE MASK -- RESTATED, and this is the only change to
      the bar. The previous rung failed this criterion on a property of the tool
      rather than a change to the picture: inpaint_fruit.py sends a 64 px padded
      crop through the VAE and pastes the crop back, so 1736 pixels outside the
      mask ring differed, 1735 of them by exactly 1/255 and the last by 2/255. The
      old form demanded byte-identity, which this recipe cannot deliver at any
      strength, and an unsatisfiable criterion is a broken instrument. The form
      that measures what it was meant to protect:

          no pixel outside the mask bbox (388,727)-(420,765) grown by the 8 px
          blur ramp may differ from the plate by more than 2/255 in any channel,
          AND no pixel outside the 64 px pad-crop region may differ at all.

      That still catches every failure the original was written for -- content
      drifting outside the mask, the pass repainting the leaves, a mask in the
      wrong place -- while accepting VAE round-trip noise that is invisible at any
      viewing size. This restatement applies to this and every future rung of this
      recipe, and it is recorded here rather than quietly applied.
   7. NO PURPLE: no body pixel in 260-330 deg hue at sat > 0.2.

  FAIL modes, named now so the next rung is chosen by the failure:

    FAIL-WASH-SHORT   hue lands below 70 again -> the pull is larger than 21.4 deg
                      or scales with hue; two data points then set the next
                      percentile arithmetically.
    FAIL-OVERSHOOT    hue lands above 150 -> the pull is hue-dependent and smaller
                      at the green end; same arithmetic, other direction.
    FAIL-DECAL        colour passes but the body is still a flat feathered oval
                      with no cel line -> then strength, not hue, is the variable.
    FAIL-GLOW / FAIL-COUNT / FAIL-DETACHED / FAIL-SIZE / FAIL-PLATE / FAIL-PURPLE
                      as above.

  There is no allow_fail anywhere in this spec. A run that errors, or a publish
  step that cannot find all six files, is a FAIL of the job.

  IF IT PASSES: beat 01 has a CANDIDATE frame-1 plate, pending the founder's look.
  That is all a pass means. It is not a promotion into any leaf, any cut, any
  lineage entry or any T3 assembly, and this job performs none of those.
