  which is worse. Both are DROPS. The age anchor is a picture and not a word: taste/refs/guard1-canon-founder-0822.png,
  the guard the founder himself ruled in. (0b) THE SILHOUETTE HOLDS HIM ADULT and this is where round
  4 actually broke: cell A asked for a heavy square jaw and a thick neck and the age clause took both
  away. Read shoulder width against jaw width, and read the NECK -- a slim-jawed, thin-necked boy is a
  DROP however clean the frame is. THE STANDING BAR, term for term: (1) NO EFFECT SYMBOL ANYWHERE ON THE
  FACE -- no sweat drop, no steam puff, no dizzy spiral, no drool, foam or white bead, no sparkle; round
  3 bought this and it is not handed back. (2) NO HAND IN FRAME. This is expected to fail on about half
  the draws and that is why the round carries six spares: the hand is a seed lottery, proved unmoved by
  `raised eyebrows`, by `thick eyebrows` (round 4''s A40, hand and bead at a fresh seed) and by negative
  terms (round 2C). Do not spend another variable on it. (3) ONE MAN alone in frame -- child or female
  is a DROP; (4) the face reads DUMB at a glance -- slack, blank, gormless ("they should look like grown
  men. yes. dumb grown men") -- read as ANATOMY, not as an expression label; (5) DETAILED CINEMATIC ANIME,
  the look of taste/refs/guard1-canon-founder-0822.png; (6) NO GLASSES; (7) cream shirt collar and white
  shoulder sash -- round 4 drifted to a blue-and-gold military tunic on two cells, which is a DROP; (8)
  head and shoulders, face toward the lens, real grass-and-hedgerow background, and no foreground grass
  across the face; (9) HE IS NOT GUARD 1.'
why: 'GUARD 2, ROUND 5 SAMPLE, THE AGE CLAUSE DIALLED BACK: ''a guard man in his twenties, adult male
  face, thick neck''. Round 4 replaced round 3''s `a grown guard man, mature male face` with `a young
  guard man, early twenties, adult male build, broad shoulders` and drew a SCHOOLBOY on cells A, B, C
  and B40 -- and beat the cell clause doing it, since A asked for a heavy square jaw and a thick neck
  and got neither. `young` is the token: on this checkpoint''s captions it means protagonist-sixteen,
  not not-middle-aged. It is dropped; `in his twenties` keeps the number without the word, `adult male
  face` returns from round 3 minus the `mature` that made the forties, and `thick neck` joins the silhouette
  clause because the neck is the most reliable adult line in this style. CELL C IS THE SAMPLE BECAUSE
  IT IS THE CONTROL: round 4''s C was clean of hand and symbol, correct costume, correct framing, and
  wrong on age and nothing else. Same seed 20262725, same body clause, only the age clause moves. Negative
  and expression inherited byte for byte for a third round. $0. Full reasoning in pipeline/derive_guardcast5_0822.py.'
