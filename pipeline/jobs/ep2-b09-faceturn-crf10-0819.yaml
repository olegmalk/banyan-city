  FAIL-CAMERA: 'DID NOT FIRE. The pale diagonal in the lower-left corner holds
    position at f021 and f121. Locked, as in the parent.'
  FAIL-SECOND-FACE: 'DID NOT FIRE. One face throughout.'
  FAIL-MOUTH: 'DID NOT FIRE. Mouth closed in every frame opened. Same stated limit as
