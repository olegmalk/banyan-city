  FAIL-COLLAPSE-UNCHANGED: 'DID NOT FIRE. This was named as the most likely outcome
    and it is wrong, which is the point of naming it in advance.'
  FAIL-FROZEN: 'DID NOT FIRE. Face-crop interframe mean 2.155 with motion in both the
    first and last thirds. The feared trade -- identity bought by spending motion --
    did not happen.'
  FAIL-MORPH-LATE: 'DID NOT FIRE. Identity holds at f121, not just past f021.'
  FAIL-ARTEFACT: 'DID NOT FIRE. This was the untested direction and it came back
