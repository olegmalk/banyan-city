# clip are the ten EARLIEST, largest first (39.34, 36.90, 33.17, ... decaying
# monotonically), so this is not an identity that drifts, it is an init that is
# abandoned at the first denoising step and a scene the sampler then invents
# and holds. An anime man in three-quarter profile with dark brown hair and a
# hand at his cheek is, by f021, a front-facing child with a white crown streak
# and blue eyes.
#
# ------------------------------------------------------------------
# THE ONE VARIABLE: `--image-crf 33` BECOMES `--image-crf 10`.
# ------------------------------------------------------------------
# Every other byte of this spec is the parent's, produced by substituting the
# job id and that single argument -- the payload, the prompt files, the
# negative, the seed, the init frame, its asserted sha256, frames, fps,
# guidance, sigmas, two-stage, offload and the publish step are all carried
# programmatically rather than retyped, so "one variable" is a fact about the
# file and not a claim in a comment.
#
# THE MECHANISM, READ OFF THE RENDERER RATHER THAN GUESSED. ltx_i2v.py:1072:
#   if a.image_crf:
#       init = _crf_roundtrip(init, a.image_crf, str(Path(a.embeds).parent), ...)
# and the flag's own help text: "round-trip the still through libx264 at this
# CRF first". THE CONDITIONING IMAGE IS DELIBERATELY DEGRADED BEFORE IT
# CONDITIONS ANYTHING. CRF 33 is heavy compression. If the init arrives at the
# sampler already smeared, "the sampler ignored the init" and "the init was not
# there to be followed" are the same event, and this is the cheapest test that
# separates them.
#
# STATED AS A HYPOTHESIS, NOT A DIAGNOSIS, AND THE DIFFERENCE MATTERS HERE.
# This project has a written record of building "two confident performance
# mechanisms out of its own code comments" and retracting both. So: this lane
# has read OUR renderer, not the LTX literature. A research lane is reading the
# Lightricks reference implementation, the diffusers i2v path, ComfyUI's LTXV
# conditioning nodes and the community issue threads in parallel with this run,
# and if it comes back with a better first knob -- conditioning noise scale,
# the distilled model's CFG recommendation, frame count -- THAT is the next
# rung and this one is simply a datum. The sample is the test, not the
# confirmation, and it is filed now rather than held because it costs seven
# minutes on a card that would otherwise be idle.
#
# WHY NOT ALSO TRY A BETTER PLATE, A LOWER CFG AND A SHORTER CLIP. Because
# then nothing is attributable. The parent clip is the control and this differs
# from it by one integer.
#
# `is_show_content: false` FOR THE SAME TWO REASONS AS THE PARENT, both of
# which still hold: the init plate fails its own plate bar on three named terms
# (framing 0 of 12, a hand in frame 0 of 12, adult 5 of 12), and the guards
