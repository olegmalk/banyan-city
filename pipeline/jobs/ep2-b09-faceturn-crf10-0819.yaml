verdict: 'PASSES ITS BAR ON ALL THREE CLAUSES, decisively, and it is the largest
  single result this lane has produced. `--image-crf 33` WAS DESTROYING THE
  CONDITIONING IMAGE. One integer moved and the init went from abandoned at the
  first denoising step to held for 121 frames, on a byte-identical prompt, seed,
  plate, sampler and frame count.'
the_comparison:
  measured_the_same_way: 'Head box x 30-570, y 0-560 of 704x1280, read off the
    PARENT''s frame 1 and applied unchanged to both clips so the two are measured
    against one ruler. Whole frame and a grass-only strip (y 900-1280) as controls.'
  f001_to_f002_face_step: 'parent 39.34  ->  child 0.66. A SIXTYFOLD REDUCTION on
    the single number that diagnosed the defect. The parent''s largest interframe
    step in the whole clip was its first; the child''s first step is smaller than
    its own median motion.'
  ten_largest_face_steps: 'parent: frames 1,2,3,4,5,6,7,9,8,10 -- the ten earliest,
    largest first, which is what "the init is thrown away" looks like as a number.
    child: frames 88,86,14,90,80,94,83,22,28,92 -- distributed across the clip,
    which is what a performance looks like.'
  face_drift_from_f0: 'parent 74.23  ->  child 32.82, less than half.'
  background_strip_drift: 'parent 60.89  ->  child 9.89. The world stops being
    re-invented too. And the ORDER is now right: the face drifts 32.8 while the
    background drifts 9.9, so the SUBJECT moves and the WORLD holds. In the parent
    the background was drifting 60.9, which is not a background at all.'
  motion_by_third: 'parent 8.237 / 0.431 / 1.452 (front-loaded collapse then
    stillness). child 3.003 / 0.511 / 2.951 (motion at both ends).'
pass_clauses:
  clause_1_early_collapse_reduced: 'PASS, far past the bar. The bar said a first
    step under 20 is a clear pass and 20-30 a partial. It measured 0.66.'
  clause_2_motion_no_longer_front_loaded: 'PASS. The ten largest steps are no longer
    the ten earliest; the largest cluster sits at f080-f094.'
  clause_3_the_man_at_f021_is_the_man_in_the_init: 'PASS, by eye at 1x. Same
    three-quarter orientation, same dark brown hair carrying the init''s own pale
    highlight (not the invented white crown streak the parent grew), same round
    wire-rims, same tan tunic and white shoulder sash, and THE HAND IS STILL AT HIS
    FACE -- the parent deleted it by f021. He is not a child. At f121 he is still
    the same man: eyes now fully closed, head tilted down, the hand lowered.'
the_performance_that_survived: 'Worth stating separately, because the parent proved
  the engine CAN move a face and the worry was that holding the init would buy
  identity by spending motion. It did not. Across the clip the eyes go from downcast
  behind the lenses, to narrowed and looking down-left at f021, to fully closed with
  the brows drawn at f121, and the hand travels down off the cheek. That is "Guard
  1''s face works through it, slowly" performed by the picture rather than described
  by the prompt.'
