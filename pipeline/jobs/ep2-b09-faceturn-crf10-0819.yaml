what_this_settles_AND_IT_IS_NOT_ONLY_BEAT_09: 'THE CONDITIONING STILL WAS BEING
  DESTROYED BEFORE IT CONDITIONED ANYTHING, on every i2v job on this card that
  carries `--image-crf 33`. That flag round-trips the init through libx264 at that
  CRF (ltx_i2v.py:1072). At 33 the init arrives smeared and the sampler substitutes
  its own prior within two frames; at 10 it arrives intact and holds for 121 frames.
  CONSEQUENCES BEYOND THIS BEAT, each of which is a claim about the record and not
  about this clip:
  (a) Beat 11''s "total identity collapse away from the plate across f16-f21" and
  this beat''s parent are now BOTH explicable by one flag rather than by two plates.
  That does not retroactively pass beat 11 -- it means beat 11 is worth RE-RUNNING at
  a low CRF before anyone concludes anything about its plate.
  (b) "The b18 recipe holds a fruit and not a person" is refined: b18 held because a
  macro of a fruit has little for a smeared init to lose. The recipe was degrading
  ITS init too; the subject just did not care.
  (c) Any lane about to spend a rung on a PLATE for a beat whose motion collapsed
  should check the CRF first. A better plate cannot survive being compressed at 33.'
what_this_does_NOT_settle: 'Nothing about CAST or taste. This clip inherits the
  parent''s init, which fails its own plate bar on framing, a hand in frame and the
  adult read; holding that init faithfully means holding those defects faithfully
  too, and the man in this clip still reads young. `is_show_content: false` stands,
  the beat-09 slate stays a slate, and no pick, promotion or plate_ack is made here.
  Nor does this establish 10 as the RIGHT value -- it establishes that 33 is wrong.
  The optimum between them is unmeasured and does not need to be measured before the
  finding is used.'
what_this_licenses: 'NOT a batch. The honest next steps, in order of cheapness:
  (1) a research lane is already reading the Lightricks reference implementation,
  the diffusers i2v path and ComfyUI''s LTXV conditioning nodes -- if the upstream
  conditioning-strength parameter is a better lever than a codec round-trip, that is
  a better fix than this one and this result does not preclude it;
  (2) re-running the beats whose motion collapsed (11 above all) at a low CRF, ONE
  SAMPLE each, before any plate work is commissioned for them;
  (3) an explicit decision about the default in every future i2v spec, which is a
  route call and belongs to whoever owns the recipe, not to this verdict.'
