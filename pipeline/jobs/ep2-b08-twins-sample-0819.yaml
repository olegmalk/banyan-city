  distinct causes: the arm ended in nothing (0.80 contour), the aim was wide by construction (0.45 contour,
  and again with the masked references), the forearm mirrored (first skeleton), and now both figures leave
  their authored arms and clasp hands in the gap. The fourth cause is POSE ADHERENCE, which is the one
  thing the twins variant claims to improve and the reason every earlier rung was right to decline it.
  Its answer tells the next lane whether the openpose route can carry this gesture at all, or whether
  the point has to be staged some other way entirely.'
