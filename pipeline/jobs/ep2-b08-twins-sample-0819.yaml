  MOVED. Pose adherence WAS the fourth cause and the twins variant is its fix,
  measured on both pre-registered positions: the guard's hand closed 67% of the
  distance to its authored wrist, and the goblin's arm STAYED on its own skeleton
  instead of coming 186 px up to meet it. The two hands do not clasp. The gesture
