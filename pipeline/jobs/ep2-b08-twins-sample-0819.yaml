bar:
  b0_the_net_is_the_twins_net: 'VOID-CHECK, READ FIRST, AND IT IS NOT READ OFF THE SIDECAR THIS TIME.
    `--controlnet` points at a local directory, so the sidecar records a PATH and a path proves nothing.
    The preflight step re-reads the blob and asserts sha256 54a2afb1bd21349e475566e5428884bc937a4caecf863b29dea08acc40612fa4
    and 2502139104 bytes before the render step starts, so its stdout line `twins net verified` is the
    void-check. NO LINE, NO VERDICT: without it, "the twins net did nothing" and "the twins net never
    loaded" are indistinguishable, and that ambiguity is what this step exists to remove. The sidecar
    must additionally show scale 1.0 and no ip_adapter lines.'
  b4b_both_arms_stay_on_their_skeletons: "THIS RUNG'S WHOLE QUESTION, AND IT IS TWO MEASURED POSITIONS\
    \ BEFORE IT IS A GESTURE. Both halves must hold.\n  B4b-i THE GUARD'S HAND ARRIVES. A hand centroid\
    \ at or near the authored wrist (280.5, 695.1). The parent reached only (436, 656) -- about 60% of\
    \ the way from the authored elbow (472.9, 638.3) -- so the bar is that this frame closes materially\
    \ more of that gap.\n  B4b-ii THE GOBLIN'S ARM STAYS. His left arm is authored hanging at his side\
    \ with its wrist at (221, 857). The parent brought it UP 186 px and ACROSS 129 px to a fist at (350,\
    \ 671). It must stay down.\nAND THE GESTURE MUST READ AS A POINT AT THE BELLY, scored by eye at 1:1.\
    \ If the two hands clasp again the clause fails however the numbers land, and that is the fifth distinct\
    \ cause rather than a repeat of the fourth."
  b4c_the_arm_belongs_to_the_guard: MUST SURVIVE. The pointing arm grows from THE GUARD's shoulder. Four
    mechanisms have now held this clause and the uncontrolled tally at this seed is still 4 of 4 on the
    goblin, so losing it would be a finding about twins and not noise.
  b1_the_pair: TWO figures and only two, both whole in frame.
  b3_one_ground_plane: Both stand on the same grass. The ankles are not touched by this rung, so the parent's
    deviation is expected and is not a regression.
  b5_no_colossus: Neither figure towers. The grandparent measured 1.161 against 1.100 authored and this
    rung moves neither stature.
  b6_drawn_not_traced: 'EXPECTED TO DEGRADE, PRE-REGISTERED, AND IT IS THE PRICE THIS RUNG IS KNOWINGLY
    PAYING. xinsir''s own description of twins is MORE PRECISE POSE ADHERENCE AND A LOWER AESTHETIC SCORE.
    The skeleton hints have produced this beat''s only clean passes on B6, so some loss of drawing quality
    is the expected cost of the adherence being bought. It is scored so the trade is PRICED rather than
    discovered later: a mild loss is accepted if B4b flips, and mannequins are not.'
  b2_the_identities_separate: 'CARRIED AS AN OBSERVATION, NOT AS THIS RUNG''S CLAIM, and it is now the
    THIRD free data point on the enclosure hypothesis. Same instrument as every rung on this beat: guard
    (547,372)-(584,425), goblin (148,448)-(193,504), statistic G-R. Bare skeletons have measured +55.5
    and +83.0 separation with NO adapter, against +43.0 for the masked IP-Adapter on the contour. A third
    pass would make the masked references look redundant on this route -- which is already a named later
    question and is NOT decided here on observational data.'
  b4a_board_down: EXPECTED FAIL, PRE-REGISTERED, NOT THIS RUNG'S VARIABLE. No board is in the hint because
    a rectangle is not a pose. The remedy is multi-ControlNet pose+scribble and it is a later sample.
not_done_on_purpose: 'ONE sample, ONE arm, ONE variable. No scale sweep, no second seed, no re-authored
  hint, no wording change, no IP-Adapter, no multi-ControlNet, no night fix, no pick, no plate_ack waiver
  and no canon filename. The night (mean luma 40.4 on the parent) is NOT addressed here and is expected
  to persist: it is the next named sample after this one and folding it in would make this rung''s result
  unattributable.'
rights_and_weights: THIS IS THE `licence_note`. Clean. Base cagliostrolab/animagine-xl-3.1 (CreativeML
  Open RAIL++-M). ControlNet xinsir/controlnet-openpose-sdxl-1.0, twins variant weights from the same
  repo, apache-2.0 with no attribution condition. The hint is drawn by pipeline/author_b08_openpose_hint.py
  with PIL -- no photo-derived pose, no annotator, so the lllyasviel/Annotators landmine is not touched.
scoring_rule_pre_registered: 'THIS IS THE `verdict_rule`, WRITTEN BEFORE THE PIXELS, and all three branches
  close something. (1) If B4b-i and B4b-ii BOTH hold and the gesture reads as a point, the verdict is
  PASS: pose adherence was the fourth cause, twins is the fix, and beat 08''s blocker moves from the gesture
  to the board -- the multi-ControlNet rung. (2) If adherence measurably IMPROVES on both positions but
  the gesture still does not read, the verdict is that adherence was necessary and not sufficient, and
  the next question is the HINT''s own geometry rather than the net -- a hand cannot point at a belly
  the skeleton never brings it to. (3) If both arms deviate as far as the parent''s, the verdict RETIRES
  twins for this beat: adherence is not the cause, the two figures are being pulled together by something
  in the wording or the checkpoint''s own compositional prior, and the next probe is a wording ablation
  rather than another net. Branch (3) also spends the 2.4 GB fetch usefully, because a retired mechanism
  is a closed question.'
the_combined_rung_this_replaces: 'This lane was dispatched to file ep2-b08-cnetipa-0819: the 0.45 contour
  hint plus the masked IP-Adapter in one render. IT WAS NOT FILED, BECAUSE IT ALREADY EXISTS AND HAS ALREADY
  BEEN JUDGED. ep2-b08-ipamask-0819 is that combination exactly -- diffed key by key: same control file
  and sha 19cfad48..., same scale 0.45, same seed 20260819, byte-identical prompt and negative, plus the
  two masked references at ip-scale 0.7. It PASSED B2 (guard G-R -14.4 against a bar of <= 0.0, separation
  +43.0 against >= +20.0, re-measured independently). Filing it again would have rendered a duplicate
  of a frame already on disk. Recorded here rather than in a report because the next lane to be handed
  that instruction should find the answer in the tree.'
who_ruled_this_rung: 'ep2-b08-posenat-0819, whose verdict closed: "THE `twins` VARIANT IS NOW GENUINELY
  LICENSED, AND THIS IS THE FIRST TIME IT HAS BEEN." Its parent is ep2-b08-posenet-sample-0819 and the
  weights came from ep2-b08-twins-fetch-0819 (2,502,139,104 bytes, sha 54a2afb1..., zero .incomplete,
  manifest in farm-out). Written in an `extra` key rather than in `why` on purpose: `fresh` prose is retokened,
  so a parent id written there would be rewritten into this job''s own id and the spec would cite itself.'
why_these_key_names: 'TWO KEYS BELOW ARE NOT CALLED WHAT EVERY OTHER SPEC ON THIS BEAT CALLS THEM, and
  the reason is a guard rather than a preference. derive_spec.FINDINGS_NAME refuses any `extra` key matching
  /verdict|licen[cs]|.../ on the grounds that a spec earns findings AFTER its pixels exist. That is right
  for `verdict`, and it over-reaches on two house keys that must be written BEFORE the pixels: `verdict_rule`
  (pre-registration is the whole point of it) and `licence_note` (a licensing fact, not a finding). Rather
  than dodge the guard quietly or edit a shared tool other lanes are using tonight, they are filed here
  as `scoring_rule_pre_registered` and `rights_and_weights`, and the rename is declared here so a reader
  greping for the house names on this spec finds this paragraph instead of nothing. The guard is reported
  upstream as over-broad; it is not worked around.'
