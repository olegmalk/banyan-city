    statements are true and the contradiction IS the finding.
    ON THE STANDING INSTRUMENT: guard head G-R -53.6, goblin +67.7, separation
    +121.4 -- against +83.0 (parent), +55.5 (grandparent) and +43.0 for the masked
    IP-Adapter on the contour.
    AND IT IS MEASURING HEADS ONLY, WHICH THIS FRAME IS THE FIRST TO PUNISH. Within
    the GUARD: face -58.2, pointing forearm +48.6 -- a 106.8-level split inside one
    figure. Within the GOBLIN: head +67.7, legs -23.7 -- a 91.4-level split. Both of
    her hands are green; his legs are human.
    SO THE THIRD DATA POINT ON THE ENCLOSURE HYPOTHESIS IS CONFOUNDED AND MUST NOT
    BE COUNTED AS A THIRD PASS. Skeleton hints do separate HEADS better than the
    contour did. They also let skin tone fragment per LIMB, which the contour never
    did -- every contour frame was at least internally consistent. This is a new
    failure mode, not a better score.'
  b4a_board_down: 'FAIL, PRE-REGISTERED, AND WORSE THAN THE PARENT''S IN A NEW WAY.
    No board and no book anywhere in frame. Her free hand is closed at her chest
    around something small and green that reads as nothing identifiable. No object is
    in a pose hint, on purpose; the remedy remains multi-ControlNet pose+scribble.'
observed_not_scored: >-
  THREE, AND THE FIRST WAS PRE-REGISTERED TO PERSIST AND DID NOT. (1) THE NIGHT IS
  GONE. Mean luma 135.1 against the parent's 40.4, at the same seed, the same
  prompt and the same negative, with the CONTROLNET WEIGHTS as the only difference.
  This spec said the night was not its variable and expected it to persist, so this
  is an unpredicted result and it settles something the next lane would otherwise
  have spent a rung on: the darkness on this route was the BASE openpose net's
  doing, not the wording and not the hint. The frame is a bright purple dusk, which
  is its own colour problem, but it is not night. (2) THE GUARD READS
  UNAMBIGUOUSLY FEMALE -- blonde bob, blouse, long maroon skirt, barefoot -- where
  the parent only noted she "still reads female". The prompt says `Two men`. (3)
  ONE WARDROBE TOKEN LANDED: a white tie at her waist is a fair reading of the
  frozen `white sash`, and it is the only frozen garment anywhere in the frame.
what_this_settles: >-
  POSE ADHERENCE WAS THE FOURTH CAUSE OF B4b, AND TWINS FIXES IT. One variable, same
  hint, same seed, same words, and both authored positions moved in the predicted
  direction on the first sample -- the guard's hand 67% closer to its target and the
  goblin's arm no longer leaving its own skeleton. xinsir's "more precise pose
  adherence, lower aesthetic score" is now measured on our base rather than taken
  from a discussion thread, and BOTH halves of it are confirmed, including the cost.
  It also settles the night, for free and against this spec's own prediction.
what_this_did_not_settle: >-
  A USABLE PLATE, AND THE DISTANCE TO ONE IS NOT SHORTER THAN IT WAS -- it is
  differently shaped. Per-limb identity fragmentation is a defect no rung on this
  beat has faced: the masked IP-Adapter solved WHICH FIGURE an attribute lands on,
  and this frame shows that solving it does not solve WHICH PART OF A FIGURE. Nor
  the board, which has now failed on every skeleton frame because no object is in a
  pose hint. Nor the guard's sex. Nor the third figure beat 08's done_when wants.
what_this_does_not_license: >-
  No pick, no plate_ack, no cut, no canon filename; this frame is PROVISIONAL and is
  not a candidate. It does not license retiring the base openpose net -- twins costs
  real drawing quality and only the gesture clause justified it. It does not license
  an --ip-scale or conditioning sweep. And it does NOT license reading B2's +121.4
  as a third confirmation of the enclosure hypothesis: the instrument samples heads,
  and this frame's heads and limbs disagree by over 90 levels.
next_rung_named_not_taken: >-
  ONE sample: THIS EXACT JOB PLUS THE TWO MASKED REFERENCES, at this hint, this seed
  and this net. Both mechanisms are now individually proven on this beat -- the masks
  moved B2 by 48.5 levels on the contour (ep2-b08-ipamask-0819) and twins moved B4b
  here -- and per-limb fragmentation is precisely the kind of defect a per-region
  image condition is shaped to fix. ONE DESIGN CHANGE IS REQUIRED AND IT IS THE
  WHOLE POINT: the masks used on the contour were head-and-torso rectangles
  (guard 498,336-640,668) and the guard's pointing forearm here lies at roughly
  x 200-470, y 640-700, entirely OUTSIDE hers. A mask that does not cover the limb
  cannot colour it. So the guard's mask must be widened to enclose the extended arm,
  the two masks must be re-asserted non-overlapping against the goblin's, and the
  bar is this frame's own within-figure split: guard face-to-forearm 106.8 levels
  and goblin head-to-legs 91.4 must both collapse, with B4b's two positions holding.
  AFTER that, and unchanged in order: the board via multi-ControlNet pose+scribble,
  then the purple cast.
the_mask_geometry_problem_that_rung_must_solve_first: >-
  AND IT IS NOT FILED YET BECAUSE OF THIS, WHICH IS A DESIGN QUESTION AND NOT A
  VALUE TO TUNE. controlnet_plate takes masks as AXIS-ALIGNED RECTANGLES only --
  mask_images draws them from x0,y0,x1,y1, there is no mask file -- and it REFUSES
  two rects that overlap by even one pixel, because two identities on one pixel is
  a defect rather than a warning. In this frame THE TWO FIGURES INTERLEAVE: the
  guard's pointing hand and fingertip occupy roughly x 204-270 at y 650-730, while
  the goblin's body and his own hanging left arm occupy roughly x 100-265 at the
  same heights. Her finger is drawn OVERLAPPING his arm. No pair of non-overlapping
  rectangles can put her hand in her mask and his arm in his:
  widen hers to x>=250 and her fingertip (x=204) falls inside HIS mask, handing her
  finger his identity -- the exact trap the contour rung avoided on purpose by
  leaving the fingertip 6.5 px outside his box; narrow his to x<=200 and his own
  hanging arm (x 215-265) falls inside HERS.
  So the next rung must FIRST choose one of: (a) accept a stated mis-assignment and
  pre-register WHICH limb is handed the wrong identity; (b) teach the driver
  non-rectangular masks -- a real code change with its own selftests, and the honest
  fix; (c) re-stage the hint so the arm stops short of overlapping him, which trades
  away the gesture this rung just bought. This lane's reading is (b). It is written
  down rather than guessed at because filing a sample whose masks are known to be
  geometrically wrong would be a guess with a GPU attached.
