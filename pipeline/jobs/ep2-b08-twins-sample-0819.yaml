scoring_rule_pre_registered: 'THIS IS THE `verdict_rule`, WRITTEN BEFORE THE PIXELS, and all three branches
  close something. (1) If B4b-i and B4b-ii BOTH hold and the gesture reads as a point, the verdict is
  PASS: pose adherence was the fourth cause, twins is the fix, and beat 08''s blocker moves from the gesture
  to the board -- the multi-ControlNet rung. (2) If adherence measurably IMPROVES on both positions but
  the gesture still does not read, the verdict is that adherence was necessary and not sufficient, and
  the next question is the HINT''s own geometry rather than the net -- a hand cannot point at a belly
  the skeleton never brings it to. (3) If both arms deviate as far as the parent''s, the verdict RETIRES
  twins for this beat: adherence is not the cause, the two figures are being pulled together by something
  in the wording or the checkpoint''s own compositional prior, and the next probe is a wording ablation
  rather than another net. Branch (3) also spends the 2.4 GB fetch usefully, because a retired mechanism
  is a closed question.'
