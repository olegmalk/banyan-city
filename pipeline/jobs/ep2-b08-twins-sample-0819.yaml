    \ is spent. `--controlnet` points at a local DIRECTORY here, so\n# the sidecar can only record a path,\
    \ and a path proves nothing about the 2.4 GB\n# behind it. mac_preflight's rule on a Windows box:\
    \ size and file count passed a\n# UNet that rendered pure noise for days.\nimport hashlib, os, sys\n\
    d = r\"C:\\banyan-farm\\cnet-openpose-twins\"\nblob = os.path.join(d, \"diffusion_pytorch_model.safetensors\"\
    )\ncfg = os.path.join(d, \"config.json\")\nn = os.path.getsize(blob)\nif n != 2502139104:\n    print(\"\
    !! twins blob is %d bytes, expected 2502139104\" % n); sys.exit(1)\nh = hashlib.sha256()\nwith open(blob,\
    \ \"rb\") as fh:\n    for chunk in iter(lambda: fh.read(1 << 22), b\"\"):\n        h.update(chunk)\n\
    got = h.hexdigest()\nif got != \"54a2afb1bd21349e475566e5428884bc937a4caecf863b29dea08acc40612fa4\"\
    :\n    print(\"!! twins blob sha %s, expected 54a2afb1bd21349e475566e5428884bc937a4caecf863b29dea08acc40612fa4\"\
    \ % got); sys.exit(1)\nch = hashlib.sha256(open(cfg, \"rb\").read()).hexdigest()\nif ch != \"b5b8f9a7619c9452f19407ef73a01ce3f061fcf932de43ddbaca336d12d02801\"\
    :\n    print(\"!! twins config sha %s, expected b5b8f9a7619c9452f19407ef73a01ce3f061fcf932de43ddbaca336d12d02801\"\
    \ % ch); sys.exit(1)\nbad = [r for r, _, fs in os.walk(d) for f in fs if f.endswith(\".incomplete\"\
    )]\nif bad:\n    print(\"!! .incomplete under the twins dir: %r\" % bad); sys.exit(1)\n# The staged\
    \ tree, same discipline: a fresh payload dir was scp'd into, and\n# \"the file is there\" is not \"\
    the file is the one I sent\". Both ends were\n# compared at filing time; this re-reads them at RUN\
