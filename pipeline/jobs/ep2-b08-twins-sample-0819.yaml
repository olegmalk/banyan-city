why_these_key_names: 'TWO KEYS BELOW ARE NOT CALLED WHAT EVERY OTHER SPEC ON THIS BEAT CALLS THEM, and
  the reason is a guard rather than a preference. derive_spec.FINDINGS_NAME refuses any `extra` key matching
  /verdict|licen[cs]|.../ on the grounds that a spec earns findings AFTER its pixels exist. That is right
  for `verdict`, and it over-reaches on two house keys that must be written BEFORE the pixels: `verdict_rule`
  (pre-registration is the whole point of it) and `licence_note` (a licensing fact, not a finding). Rather
  than dodge the guard quietly or edit a shared tool other lanes are using tonight, they are filed here
  as `scoring_rule_pre_registered` and `rights_and_weights`, and the rename is declared here so a reader
  greping for the house names on this spec finds this paragraph instead of nothing. The guard is reported
  upstream as over-broad; it is not worked around.'
