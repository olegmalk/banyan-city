bar:
  b0_the_net_is_the_twins_net: 'VOID-CHECK, READ FIRST, AND IT IS NOT READ OFF THE SIDECAR THIS TIME.
    `--controlnet` points at a local directory, so the sidecar records a PATH and a path proves nothing.
    The preflight step re-reads the blob and asserts sha256 54a2afb1bd21349e475566e5428884bc937a4caecf863b29dea08acc40612fa4
    and 2502139104 bytes before the render step starts, so its stdout line `twins net verified` is the
    void-check. NO LINE, NO VERDICT: without it, "the twins net did nothing" and "the twins net never
    loaded" are indistinguishable, and that ambiguity is what this step exists to remove. The sidecar
    must additionally show scale 1.0 and no ip_adapter lines.'
  b4b_both_arms_stay_on_their_skeletons: "THIS RUNG'S WHOLE QUESTION, AND IT IS TWO MEASURED POSITIONS\
    \ BEFORE IT IS A GESTURE. Both halves must hold.\n  B4b-i THE GUARD'S HAND ARRIVES. A hand centroid\
    \ at or near the authored wrist (280.5, 695.1). The parent reached only (436, 656) -- about 60% of\
    \ the way from the authored elbow (472.9, 638.3) -- so the bar is that this frame closes materially\
    \ more of that gap.\n  B4b-ii THE GOBLIN'S ARM STAYS. His left arm is authored hanging at his side\
    \ with its wrist at (221, 857). The parent brought it UP 186 px and ACROSS 129 px to a fist at (350,\
    \ 671). It must stay down.\nAND THE GESTURE MUST READ AS A POINT AT THE BELLY, scored by eye at 1:1.\
    \ If the two hands clasp again the clause fails however the numbers land, and that is the fifth distinct\
    \ cause rather than a repeat of the fourth."
  b4c_the_arm_belongs_to_the_guard: MUST SURVIVE. The pointing arm grows from THE GUARD's shoulder. Four
    mechanisms have now held this clause and the uncontrolled tally at this seed is still 4 of 4 on the
    goblin, so losing it would be a finding about twins and not noise.
  b1_the_pair: TWO figures and only two, both whole in frame.
  b3_one_ground_plane: Both stand on the same grass. The ankles are not touched by this rung, so the parent's
    deviation is expected and is not a regression.
  b5_no_colossus: Neither figure towers. The grandparent measured 1.161 against 1.100 authored and this
    rung moves neither stature.
  b6_drawn_not_traced: 'EXPECTED TO DEGRADE, PRE-REGISTERED, AND IT IS THE PRICE THIS RUNG IS KNOWINGLY
    PAYING. xinsir''s own description of twins is MORE PRECISE POSE ADHERENCE AND A LOWER AESTHETIC SCORE.
    The skeleton hints have produced this beat''s only clean passes on B6, so some loss of drawing quality
    is the expected cost of the adherence being bought. It is scored so the trade is PRICED rather than
    discovered later: a mild loss is accepted if B4b flips, and mannequins are not.'
  b2_the_identities_separate: 'CARRIED AS AN OBSERVATION, NOT AS THIS RUNG''S CLAIM, and it is now the
    THIRD free data point on the enclosure hypothesis. Same instrument as every rung on this beat: guard
    (547,372)-(584,425), goblin (148,448)-(193,504), statistic G-R. Bare skeletons have measured +55.5
