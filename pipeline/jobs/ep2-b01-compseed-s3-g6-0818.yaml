verdict_0817: "RAN 2026-08-17 13:00Z on the rtx5090 box, bf16/CUDA, animagine-xl-3.1, 3.8s a frame, rc=0 on every\
  \ step, $0. Four frames published to farm-out/ep2-b01-leafcomp-s3-0817/ with SHA256SUMS.txt and per-frame .meta.yaml.\
  \ Scored against the pre-registration committed at 1091024f, opened at 1x, 2x and 4x, all four frames, N=4 as\
  \ fixed before firing.\n * AXIS A COUNT -- 4 of 4 frames carry EXACTLY TWO leaf blades on the sapling. Per the\
  \ outcome\n   table written before the fire, that is REPLICATED: AXIS A binding is a property of the\n   RECIPE,\
  \ not of one composite. Combined with the first fire, 8 of 8 across two independent\n   inits off two different\
  \ plate seeds. No blade ADDED and none MERGED, so neither typed\n   failure occurred; nothing needed the kinder-denominator\
  \ clause.\n   AND THE MASK DID NOT HAND IT THIS RESULT, which is what makes the number mean anything: on\n   comp-s3\
  \ all 642 bright blade pixels and all 26688 patched pixels fall inside the same\n   ellipse (worst normalised\
  \ radius 0.897 < 1), so both blades and the junction were inside\n   the denoised region and merge and split were\
  \ both reachable on every frame.\n   ONE AMBIGUITY, RULED BY THE BAR RATHER THAN BY PREFERENCE: seeds 20260819\
  \ and 20260820 show\n   a slender bare stalk beside the sapling, and 20260819 puts a small closed dark tip on\
  \ it. It\n   is not counted, because the bar counts \"any distinct expanded green lamina attached to the\n   plant\"\
  \ and excludes \"a bare stem or side-branch carrying no blade\" and background grass.\n   A closed tip on an unattached\
  \ stalk is neither a lamina nor attached. Recorded here so the\n   next reader can disagree with the ruling rather\
  \ than discover it.\n * AXIS B HEIGHT -- no regression, tighter than the first fire. Apex y=620 in comp-b01-s3\
  \ and\n   621/619/620/620 out: |delta| <= 1px against the pre-registered 12px, ratio ~1.00, nothing\n   waist-high,\
  \ nothing tree-sized, nothing doubled. Grass in frame stands taller than the plant\n   in 4 of 4.\n * AXIS C SHAPE\
  \ -- observation only, not a fail axis; the founder settled shape as \"average\n   leaves\" in his own words.\
  \ The left blade reads broad and ovate on seeds 20260819/20260820\n   and narrower lance-ward on 20260817/20260818;\
  \ the right blade is a narrow curved blade in\n   all four. Same mix as the first fire, so this rung adds nothing\
  \ new to that open card and\n   does not restate it.\n * LOOK -- no seam and no decal tell at 4x. Maxdiff outside\
  \ the ellipse is 26-37 on 21-55\n   pixels, i.e. the mask blur ramp and nothing else; cel outlines in the plate's\
  \ dialect,\n   consistent backlight, no tiling, no stem discontinuity at the mask edge. Reads DRAWN.\n * RENDER\
