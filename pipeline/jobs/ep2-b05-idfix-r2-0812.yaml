# the four — the thing the founder rejected outright is gone — plus bare heads
# 4/4, plain brown tunics, both faces visible in three, clipboard present. The
# identity half of this beat is DONE. `no armor`, `no helmet` and `no knight` are
# therefore NOT available as budget for anything, however tempting the token
# arithmetic gets: his ruling does not fund other fixes.
#
# THE FAULT IS THE CAMERA, 3 FRAMES OF 4. The sentence asks for two guards who
# "stand side by side facing camera", Medium shot:
#   s0 — extreme bird's-eye, looking straight down on their scalps.
#   s2 — the same overhead, and the bodies collapse to near-chibi infants.
#   s3 — over-the-shoulder from BEHIND. This is also why s3 loses the second
#        guard entirely to a faceless brown blob with round animal ears, and why
#        the remaining guard's face is turned away. "Both faces clearly visible"
#        cannot survive a camera standing behind them.
#   s1 — the only front-facing frame, and the only one that reads as the beat.
# So the blob and the hidden face are SYMPTOMS of the framing, not separate
# faults, and one channel should take all three frames with it.
#
# CHANNEL: unwanted framing -> negative ban, plus its affirmative counterpart in
# the positive, because this is ONE fault and not two. `no high angle, no from
# above` join the negative; `Medium shot` becomes `Medium eye-level shot`.
# `Medium shot` on its own has now failed to bind the camera height in three
# frames out of four, which is the evidence that the word needs help.
#
# PAID FOR OUT OF THE WINTER TIER, WHICH IS GUARDING NOTHING MEASURABLE. This
# beat sends 76 of 77 with one token spare and carries five cold-weather terms.
# All four frames are a warm green field. `no frost`, `no ice` and `no pine
# forest` retire; `no snow` and `no winter` BOTH STAY, so whatever drift the tier
# was added for still has a guard on it.
#
# NOT FIXED HERE, ON PURPOSE. The body type swings from tall muscular adult men
# (s1) to near-chibi infants (s2) instead of the "round soft bodies" the sentence
# asks for. That is a taste axis, it belongs to R4, and stacking it onto this
# round would make the camera result unattributable. It is written down in
