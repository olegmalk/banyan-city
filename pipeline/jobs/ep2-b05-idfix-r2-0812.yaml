#   'text' negated: True   negative recipe 75 -> sent 75 (budget 77)
#   `high angle` and `from above` both sent; `armor`, `helmet`, `knight`, `snow`
#   and `winter` all intact; the only casualty is `realistic skin texture`.
#
# SEPARATE OUT DIRECTORY. Writes to `out-b05-idfix-r2`; overwrites no evidence.

