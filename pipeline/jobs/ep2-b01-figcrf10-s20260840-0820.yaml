  clip in hand is frozen from f030. Named before the render so that a popped arc reads as the predicted
  cost of a fair test rather than a surprise, and so that the conclusion it licenses -- localisation,
  not another flag sweep -- is on record before the pixels are seen.'
init_provenance: 'Unchanged from the control: the shared beat-01 nub composite init, the frame-1 plate
  that passed its bar 7 of 7 on 2026-08-18, nub inpainted at composite centre 405,750 (mask b01-nubcomp-s20260826-mask.png,
  832x1216, cover-cropped to 704x1280, centroid (785.1, 339.4)). That mask is also the detector''s geometric
  anchor, so the judging instrument and the render start from the same object. NOTE: --image-crf does
  not change this PNG; it changes the libx264 round-trip applied to it before conditioning.'
pre_registered_fail_modes:
  F1_the_field_holds_and_the_fig_keeps_its_arc: G5a passes and G1/H1 hold. Then crf was the cause all
    along, the seed lottery was run on the wrong axis for six fires, and this is the first beat-01 clip
    to clear every scored clause -- a veto-able steward pick proposed WITH pixels under R4.
  F2_the_field_holds_and_the_fig_pops: 'G5a passes, H1 or G1 fails -- the clip becomes an incumbent-shaped
    result at a new seed. This is the most likely single outcome and it is the informative one: it would
    show field stability and fig growth are ONE knob on this engine, not two, and that no conditioning
    setting separates them. The route then is localisation (compositor-side: grow the fig against a held
    plate, using this detector''s own per-frame masks, which already exist and are validated), and NOT
    another flag sweep.'
  F3_nothing_changes: Region NCC and luma land within noise of the control. Then --image-crf does not
    reach this behaviour at all, the incumbent's stability belongs to its SEED after all, and the confound
    resolves the other way. Cheap to learn and it closes the flag route.
  F4_the_cleaner_init_changes_the_look: crf 10 alters grain, colour or contrast enough that the clip no
    longer matches the plate the other twenty beats were cut against. Watch for it; it is a taste question,
    it is the founder's under R4, and it is not scored by any clause above.
