  how_it_is_judged: pipeline/fig_track.py (geometry-anchored, selftest 15/15) against anchor mask b01-nubcomp-s20260826-mask.png,
    plus the region-NCC and whole-frame-luma probes. ONE sample of ONE recipe change, judged on landing,
