what_this_licenses_after_the_verdict: 'THE FLAG ROUTE IS CLOSED AND SHOULD NOT BE RE-OPENED.
  Negative-side conditioning was measured shut for the sapling on 2026-08-20; --image-crf
  is now measured to move field and fig together at two seeds. An intermediate crf is NOT
  licensed as a next rung: the pool already samples the curve at 10 and 33 and both ends fail,
  one on G1 and one on G5a, so a midpoint is a search for a value that satisfies a conjunction
  the knob cannot express. Anyone proposing crf 20 should read this key first.


  WHAT IS LICENSED IS LOCALISATION, exactly as F2 pre-registered: separate the fig from the
  field so they can be driven independently, rather than looking for a setting that does it
  by accident. The cheapest form needs no GPU and no new plate -- composite the fig''s growth
  from the crf-33 take onto the held field of a crf-10 take, using pipeline/fig_track.py''s
  own per-frame masks, which exist, are geometry-anchored and are validated by eye at 5x on
  exactly these frames. Both ingredient clips are already rendered and sha-verified. That
  is the next rung and it is a compositor rung, not a render rung.


  Its risk, named in advance so it is not a surprise: the fig''s own stem and its contact
  shadow move with the plant in the crf-33 take, so a fig-only matte may read as pasted. The
  residual grass band (0.062 even at crf 10) says the foreground re-inks regardless and may
  have to be taken from the held plate too.'
