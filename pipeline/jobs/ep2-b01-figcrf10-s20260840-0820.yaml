  G1_growth_by_a_continuous_path: 'SCORED. Detector live on every frame it scores; no single-frame area
    step at or above 2.0x; the frame reaching 90% of total growth at or after f060. Control: 121/121 live,
    1.084x, f108. THE INCUMBENT FAILS THIS AT f009 AND THAT IS THE WHOLE RISK OF THIS RUNG -- see H1_ALSO_THE_PREDICTED_COST.'
  G2_end_state_deep_purple_violet: 'SCORED, and requires a LIVE final frame: fig hue 270-320 deg, saturation
    >= 0.60. Control: hue 293.9, sat 0.788. A dead last frame retracts the clause, never guesses it.'
  G3_exactly_two_leaves_in_every_frame: CARRIED BUT NOT SCORED -- no leaf counter exists in this repo
    and a sampled look cannot certify a universal over 121 frames. Eye note only.
  G4_no_size_doubling: 'SCORED on b13''s settled reading: maximum single-frame area ratio under 2.0x,
    not total growth. Control: 1.084x.'
  G4b_below_the_grass: CARRIED BUT NOT SCORED -- no grass line is defined on the plate or in any spec,
    so there is no threshold to measure against. Eye note only.
  G5a_field_stability_THE_CLAUSE_THIS_RUNG_EXISTS_FOR: 'SCORED. Region NCC between f000 and the last frame
    -- gain- and offset-invariant, so an exposure change cannot fake it -- on four bands: shaft y0-350;
    sapling y430-740 x150-560; fig box y700-900 x230-450; grass floor y1000-1280. PASS requires sapling
    >= 0.45 AND shaft >= 0.70 AND grass >= 0.20, with fig box < 0.30 so that the fig is the thing that
    changed. Control fails at sapling 0.055 / shaft -0.324 / grass 0.038. The crf-10 incumbent reads 0.637
    / 0.932 / 0.323 and would pass all three.'
  G5b_camera_locked: 'CARRIED BUT NOT SCORED -- global_zoom refuses: disagreeing quadrants mean the picture
    is redrawn rather than moved, and a fit on the grid edge publishes railed:true. Neither is quotable.
    Reported, never scored.'
  H_luma_bloom: SCORED. Peak whole-frame luma within 12.0 levels of f000, and at most 6 of 121 frames
    above luma 100. Control PASSES at +10.85 / 0 frames, and this rung must not lose that.
  H1_frozen_ALSO_THE_PREDICTED_COST: 'SCORED. FAIL if fig-box NCC to the final frame is at or above 0.80
    by f060. Control: -0.127. This is the clause most likely to break: the crf-10 incumbent is frozen
    from f030 and reaches 90% of its growth by f009.'
  H5_detach_or_teleport: 'SCORED by the detector''s jump gate plus a 40 px bound on the fig centroid against
    the f000 geometric anchor (785.1, 339.4). Control: 20.6 px.'
  H6_scene_break: SCORED. FAIL if any consecutive whole-frame NCC drops below 0.80.
  conjunctive: A partial is a FAIL. Three clauses are unscored by declaration (G3, G4b, G5b); they can
    produce neither a PASS nor a FAIL and the verdict will say so out loud rather than let an absent key
    read as a clear one.
