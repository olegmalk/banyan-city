consumer: THE COLD OPEN OF EPISODE 2'S CUT, which as of this filing holds the parent clip as a best-available
  steward pick with G5a failing and named. This rung is the one remaining flag-level attempt to close
  G5a. A PASS makes beat 01 the first clip in its history to clear every scored clause and is proposed
  as a swap with pixels under R4; a FAIL is consumed too, because it separates a confound that six seed
  fires never touched and decides whether the route is localisation.
success: ONE 704x1280 121-frame mp4 at 24 fps off the same init and the same seed 20260840 as the parent
  named in `control` below, differing from it in a single argv value and nothing else, in which the sapling
  and shaft regions hold at region NCC 0.45 and 0.70 from f000 to the last frame while the fig box stays
  below 0.30, AND the fig still ramps by a continuous path -- 90% of its growth at or after f060, no single-frame
  step at or above 2.0x -- to a deep purple-violet end state, AND the whole-frame luma peak stays within
  12.0 levels of f000 with at most 6 frames over 100. The ONLY difference from the parent named in `control`
  below is `--image-crf`, 33 -> 10, in the render step's argv. Same seed 20260840, same init PNG, same
  negative and same motion prompt byte for byte, same every other flag, same 121 frames. Every threshold
  is carried unchanged from the control's own bar; none was relaxed to make this clearable, and two of
  them (G1, H luma) are clauses the control already passes and this rung must not lose.
why: $0, ~12 minutes of GPU, no download. Seven beat-01 clips have been scored on the honest detector.
  Six of them ran --image-crf 33 and land in a tight band of -0.195 to 0.144 on sapling region NCC, no
  seed escaping it. The seventh ran --image-crf 10 and lands at 0.637, four times the best of them, and
  is also the only clip whose whole-frame luma never leaves the plate. --image-crf round-trips the conditioning
  still through libx264 before it is used as the init, so it is this pipeline's conditioning-strength
  knob under another name. It is also perfectly confounded with seed across the existing pool, and nothing
  in hand separates them. Holding the seed and moving only the crf separates them in one fire, and both
  outcomes are worth having.
