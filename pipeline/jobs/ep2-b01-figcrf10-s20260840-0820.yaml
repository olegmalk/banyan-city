# --- appended 2026-08-20 by the fig-detector judging lane, on landing by the composite-plate motion lane, after the pixels.
verdict_this_job: 'FAIL on G1 and G5a -- and the rung SUCCEEDS at what it was filed to do,
  which was to break a confound rather than to win a slot. F2, pre-registered as the likeliest
  outcome, fired almost exactly as written.


  THE FIELD HOLDS, AND IT IS THE CRF, NOT THE SEED. Region NCC f000->f120: shaft 0.982, sapling
  0.734 -- against the control''s -0.324 and 0.055 at the SAME SEED with the SAME init and
  the SAME prompts. Whole-frame luma peaks +0.92 over f000 with zero frames above luma 100.
  Those numbers are not merely passing, they BEAT THE INCUMBENT on every one of them (0.932
  / 0.637 / +1.46). One argv value moved and the field stopped being redrawn. The confound
  this rung was filed to break is broken: --image-crf was the cause and seed 20260826 was
  never the story.


  AND THE FIG STOPPED GROWING WITH IT. Total measured growth 1.79x -- 800 px to 1435 px --
  against the control''s 14.77x on the same seed. 90% of what little growth there is has arrived
  by f050, against f108. The detector loses 16 of 121 frames, where it lost none on the control.
  By eye at f060/f090/f120 the nub changes COLOUR from green to a small dark purple and barely
  changes SIZE at all. G1 fails.


  SO FIELD STABILITY AND FIG GROWTH ARE ONE KNOB ON THIS ENGINE, NOT TWO, AND THAT IS NOW
  ESTABLISHED AT TWO SEEDS ON THE CRF-10 SIDE. Seed 20260826 at crf 10: field held, fig pops
  by f009. Seed 20260840 at crf 10: field held, fig grows 1.79x. Five seeds plus the control
  at crf 33: field redrawn, fig grows 8x to 19x. Nothing in seven clips separates the two
  behaviours, because --image-crf does not distinguish the fig from the field -- it sets how
  far the whole picture may drift from its conditioning image, and the fig is part of the
  picture.


  G5a FAILS ON ONE BAND ONLY, and it is worth naming precisely: grass floor 0.062 against
  a bar of 0.20, with shaft, sapling and fig box all clear. Even at crf 10 the foreground
  grass is re-inked. That is the residual dead zone of the conditioning route and it is small.


  WHAT ELSE PASSED: G2 (hue 320.0, sat 0.941 -- the most saturated end state measured, though
