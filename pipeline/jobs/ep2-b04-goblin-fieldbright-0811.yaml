# moody dark-fantasy" as a repeatable fault. POSITIVE LIGHTING TERMS ARE NOT
# BINDING. That is the finding; this job tests the one available fix for it.
#
# THE ONE VARIABLE IS EIGHT TERMS IN THE NEGATIVE. `--variant
# authored_field_bright` is `authored_field` with `no dark, no night, no dusk, no
# sunset, no dim lighting, no moody lighting, no low key, no shadows dominant`
