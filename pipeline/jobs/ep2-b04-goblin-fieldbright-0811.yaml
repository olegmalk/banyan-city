# lifts each out of the positive and `beat_negative` sends them as BEAT-SPECIFIC
# terms, which `fit_negative` protects ahead of the global house defaults. The
# negative is the channel that binds on this checkpoint — beat 03's `text` term is
# the standing proof, and this is the same move that put `no house, no building,
# no indoors` on this beat an hour ago, aimed at the light instead of the walls.
#
# ONE VARIABLE, PROVEN MECHANICALLY RATHER THAN ASSERTED. The compressed POSITIVE
# strings of `authored_field` and `authored_field_bright` compare BYTE-IDENTICAL
# under `sd_prompt.compress()` — checked, not eyeballed. The seeds cannot differ:
# `render_wave_sample` derives them as `wg.SEED + beat + i*1000` and never reads
# the variant, so s0..s3 here are the same four integers as the round this is read
# against. Same steps (40), guidance (7.5), size, harness sha (7efd0b96 —
# unchanged), `green skin` slot, close-up framing and `blurred open field behind
# him`. No IP-Adapter, no reference image.
#
# MEASURED ON THE BOX BEFORE QUEUEING, NOT GUESSED. Dry-run on the box's real CLIP
# tokenizer, this beat, this variant, this slot: DRY OK. Positive 72/77 —
# UNCHANGED from the compared round, which is the check that matters most. Negative
# `recipe 76 -> sent 76 (budget 77)`: no overflow, no dedup, NOTHING DROPPED. All
# eight terms reach the sent negative verbatim and in order between `indoors` and
# `photorealism`: `... girl, child, house, building, indoors, dark, night, dusk,
# sunset, dim lighting, moody lighting, low key, shadows dominant, photorealism,
# text, female goblin, elf`. STYLE ANCHOR PRESENT, `close-up` and `his face filling
# the frame` both survive, count tag `1boy` derives. ONE TOKEN OF HEADROOM REMAINS:
# a ninth term on this beat starts dropping others, and `fit_negative` sacrifices
# the house tier first.
#
# STATED RISK, because it is the cost of the lever. `dark` is blunt in an SDXL
# negative and can pull contrast and saturation out of the whole frame, the
# goblin's green included. Bright-but-flat is a real possible outcome and the
# answer to it would be a NARROWER block, not more terms.
