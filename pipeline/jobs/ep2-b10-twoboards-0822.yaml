negative_is_insurance_not_the_fix: 'The merge terms in the negative are cheap and are not expected to
  carry this. Ban et al. (ECCV 2024, arXiv:2406.02965), which this tree has now cited three times on its
  own evidence: a negative acts only AFTER the positive has drawn the thing. The positive is the fix.'
second_fault_fixed_in_the_same_pass: 'The page''s standing fault on beat 10 is that from f65 to f96 the
  board is flat to the LENS, so the partner would see it edge-on -- and holding it out TO HIS PARTNER
  is the clause that IS the beat. The new sentence angles the blank back toward the partner and away from
  camera. Two faults in one spec is a deliberate exception to one-variable: they are the same sentence,
  and splitting them would mean rendering the merge fix with a known-bad aim.'
the_one_variable: THE WORDING. Same plate, same init, same seed family, same sampler settings as ep2-b10-pairB-0814
  -- only the subject clause and the negative move, so a clip that still merges the boards falsifies the
  placement explanation rather than leaving it arguable.
