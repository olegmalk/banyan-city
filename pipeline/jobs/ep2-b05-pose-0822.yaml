  is a DROP. Four adapter frames returned one man and this rung exists to make the count an assertion
  rather than a hope. (2) THEY ARE DIFFERENT MEN. The left is guard 1 -- dark cropped hair, round wire-rim
  glasses. The right has a THICK GREY MOUSTACHE and has neither the glasses nor the cropped hair. Two
  copies of one man is the headline failure. (3) BOTH WEAR A WHITE SHOULDER SASH -- the beat''s standing
  fault, ''neither guard wears the sash you froze for the cast''. One sash is a HALF PASS and is reported
  as one. (4) BOTH ARE GROWN MEN, five heads tall. A child or teenager read on either is a DROP -- the
  hint asserts the proportion, so a childlike output means the hint is not binding and that is the finding.
  (5) IT IS DAYLIGHT in a real grass field. The first pose frame on beat 06 came back at night and the
  light is asserted in the positive here; a dark frame means the light clause did not carry either. (6)
  DETAILED CINEMATIC ANIME. Flat or tag-sheet fails. (7) NOTHING GOBLIN on either man: no green skin,
  no pointed ears. PRE-REGISTERED FAIL MODES, most likely first: THE MOUSTACHE LANDING ON BOTH MEN or
  on the wrong one -- a skeleton cannot carry a moustache, so the two identities are separated in WORDS
  alone and this is the b07 attribute-binding problem with nothing but a height difference on our side.
  TWO IDENTICAL MEN, which would say the words distinguish nothing and the next lever is per-figure conditioning.
  A THIRD FIGURE, which four wording rounds on this beat did eventually beat and which the hint should
  now make impossible -- if one arrives anyway, the hint is being ignored. SKELETONS DRAWN INTO THE PICTURE
  as glowing limbs, which is what the scribble net did to a medial-axis hint on beat 08; from the POSE
  net it would mean the hint class is wrong.'
why: 'THE ADAPTER ROUTE IS CLOSED BY MEASUREMENT. window4 and content on beats 05 and 06 -- opposite settings
  on both axes the sampler has -- all four returned the reference photograph''s crop and pose: a head-and-shoulders
  close-up with the hands up at the face, no board, no field. So this rung takes the PICTURE from a drawing
  and the MAN from the words, with no reference image anywhere in the job. Two nets, because a COCO-18
  hint has no keypoint for a plank and the board is this beat''s entire fault: openpose for the five-head
  figure and scribble for one rectangle exactly as wide as the skeleton''s shoulders. The scribble net''s
  known defect -- it traces whatever it can read -- is the feature here, because the thing being traced
  is a board and boards are rectangles. Both hints come out of one file and one geometry, so the prompt''s
  `as wide as his shoulders` and the drawing''s width are the same number. $0, ~3 GPU minutes. Full trace:
  pipeline/derive_b06_pose_0822.py and pipeline/author_b05_guards_pose_0822.py.'
