verdict_0820: 'THE NOUN DELETION WORKED AND THE RUNG IS STILL A FAIL. rc=0, 121 frames,
  $0. THE GOBLIN IS IN ALL 121 FRAMES AND THERE IS NO MOUND OF SOIL ANYWHERE IN THE
  CLIP -- verified frame by frame on a 121-tile sheet, f094 opened by name, and again
  at 1:1 on f093..f098 consecutively. Two deleted words undid the worst single frame
  this beat has produced. The plant is rooted at f105 and f120 with no hand on it, and
  for the first time on this beat that pass MEANS something, because the character who
  could pick it up is still in the picture. It fails H2 on both halves, narrowly --
  FREEZE 5 frames from f116 against a bar of none, HOLD strength 0.638 against a bar
  of 0.60 and rung 2''s 0.508 -- and it fails it for a reason the bar did not
  anticipate: THE MIDDLE 75 FRAMES ARE DEAD AND THE LAST QUARTER RELOCATES HIM.
  Whole-frame interframe from f009 to f084 reads mean 0.166, max 0.417; then f087..f118
  carries every spike in the clip and HIS HEAD ENDS 183 px RIGHT AND 30 px UP OF WHERE
  IT STARTED while the background does not move. NO PICK, NO CUT: beat 15 stays a slate.'

verdict_measured:
  H0_THE_GOBLIN_IS_IN_EVERY_ONE_OF_THE_121_FRAMES: 'PASS BY EYE, AND THE NUMERIC HALF
    OF THIS CLAUSE IS RETRACTED AS A BROKEN INSTRUMENT -- I wrote it and it does not
    measure what I said it measures. The eye half: all 121 frames opened on one sheet
    and f093..f098 opened consecutively at 1:1; he is seated, green, bald, long-eared,
    cloaked and present in every frame, and there is no mound of soil, earth or bare
    ground anywhere in the clip. THE NUMERIC HALF -- "no pair above 8x the clip median"
    -- FIRES (max 16.66 against a median of 0.1816, i.e. 92x) AND IS NOT SCORED. The
    threshold is unusable on a period-3 clip: the median is set by the TWO DUPLICATE
    frames in every three, so ANY real movement is tens of times the median by
    construction. Rung 3''s 165x and this clip''s 92x are not the same kind of event and
    the ratio cannot tell them apart. THE INSTRUMENT THAT DOES: a subject swap has to
    repaint the background where the subject was, so it shows energy OUTSIDE the
    subject''s footprint. Quartered, this clip''s two biggest pairs (f093-f094, f096-f097)
    read 45.9-65.1 in the subject band and 0.10-0.97 in every background quadrant, and
    the sky band and a background rock both align at dx 0 dy 0. There is no swap and no
    cut. judge_clip reads period 3 like all six siblings, not rung 3''s period 1, so the
    void condition in H2 does not fire either.'
  H1_THE_PLANT_IS_STILL_ROOTED_IN_THE_LAST_FRAME: 'PASS, AND THIS TIME THE PASS IS WORTH
    SOMETHING. At f105 and f120 read at 2x on the plant region: ONE thin stem, TWO
    leaves, running down into the grass, no hand anywhere near it, and his hands are on
    his knees on the far side of the frame. Rung 3 passed this clause by deleting the
    goblin; rung 4 passes it with him seated in shot for all 121 frames. The leaves tip
    slightly and the stem leans a few px between f105 and f120 -- normal re-inking, not
    a growth or a revert. Neither F-PLANT-PICKED-UP nor F-PLANT-REVERT fired.'
  H2_NOTHING_IS_BOUGHT_FROM_THE_PERFORMANCE: 'FAIL ON BOTH HALVES, NARROWLY, AND THE
    HONEST READING IS WORSE THAN THE MARGIN. judge_clip: FREEZE 5 frames dead at the
    tail from f116 at ncc 1.0000 against a bar of NONE; HOLD period 3, strength 0.638
    against a bar of 0.60 and against rung 2''s 0.508. The instrument is valid here --
    period 3, 8.0 effective fps, the same reading as all five siblings -- so unlike rung
    3 this number is scored. WHAT THE NUMBER UNDERSTATES: the clip is not uniformly a
    little stiffer than rung 2, it is TWO CLIPS. Whole-frame interframe f009->f084: mean
    0.166, max 0.417, i.e. 75 frames in which nothing whatever happens. Every spike in
    the clip lives in f087..f118 (3.30, 4.41, 12.82, 16.66, 6.98, 4.61, 2.78 on the step
    frames). The mouth band over the same dead stretch reads mean 0.213, max 1.192 -- an
    OPEN mouth, HELD, not a moving one. So beat 15 has traded rung 2''s uniform looseness
    for a still first two-thirds and a burst at the end, and the 0.638 is the average of
    those two things rather than a description of either.'
  H3_the_beat_still_reads_and_he_stays_seated: 'PASS ON BOTH SUB-CLAUSES AS WRITTEN, and
    read at 4x rather than off a number. He is sitting in the grass with his knees up and
    both hands on his knees at f120. His mouth is OPEN at f030, f060 and f090 -- lower
    lip down, dark interior and tongue visible -- and closed at f000 and f120. The clause
    asked for open and moving; it is open at all three and, per H2, barely moving between
    them, which is recorded there rather than double-counted here.'
  A2_the_ratified_adult_holds: 'PASS -- AND THIS IS THE FIRST b15 CLIP WHOSE SKIN PROBE
    COULD BE RE-PLACED AT ALL. The pre-registered box (302,408,356,448) reads f000 R 64.9
    G 111.9 B 46.2, R-B 18.8, luma 90.3, std 14.3 and f120 R 218.4 G 210.2 B 115.5, R-B
    102.9, luma 201.9, std 2.4. RETRACTED AS SCORED, exactly as this spec pre-registered:
    std 14.3 -> 2.4 is the COLLAPSE shape, a flat box is an empty box, and the cause is
    now known and is not a missing subject -- HE TRANSLATED 183 px RIGHT, out from under
    the box. Re-placed by eye at 4x on f120 over a printed coordinate grid, cheek below
    the eye and clear of the linework, (505,440,555,464): R 67.5 G 112.2 B 51.7, R-B
    15.8, luma 92.0, std 13.5. Against f000: +1.7 luma and -3.0 R-B, both far inside the
    +/-25 and +/-15 bars, and THE DISPERSION MATCHES TOO (13.5 against 14.3), which is
    what says the two boxes are on the same kind of surface rather than that one number
    happened to agree. Forehead confirms: (520,345,570,385) luma 95.3 / R-B 20.1 / std
    6.5. At 1:1 he is the ratified lean adult goblin -- green skin, bald, long pointed
    ears, cloak, one face, one figure.'
  A3_camera_locked: 'PASS, MEASURED IN TWO PLACES BECAUSE THE FRAME LOOKS RECOMPOSED AND
    IS NOT. A background rock template (10,690..170,770) aligns at dx 0 dy 0 at f060 and
    f087 and at dx +1..+3 dy 0..+3 at f105 and f120, with the residual rising from 1.96
    to 14.6 -- a few px of drift and a field that is RE-INKING, the same thing beat 06
    read as depth 0.516 with zero human motion. The sky band aligns at dx 0 dy 0 f000 to
    f120. The camera does not move; the SUBJECT does, and that is filed as its own
    finding below rather than as a camera fault.'
  A5_no_exposure_blowout: 'PASS AND UNCONFOUNDED. Whole-frame mean luma 158.73 -> 154.97,
    -3.76 across 121 frames, and honest because the subject stays in frame the whole
    time -- unlike rung 3''s +18.26, which was a goblin-shaped dark mass being replaced
    by bright grass.'
  F_SUBJECT_RELOCATES_a_NEW_fail_mode_not_pre_registered: 'FIRED, AND IT IS THE FINDING
    THIS RUNG ADDS. His own eye band, template-matched: dx 0 dy 0 at f060 and f087, then
    dx +182 dy -30 at f105 and dx +184 dy -30 at f120, against a background that holds at
    dx 0..+3. Between f087 and f105 he SLIDES A QUARTER OF THE FRAME WIDTH TO THE RIGHT
    and sits back, which is also where every interframe spike in the clip lives. He moves
    AWAY from the plant, so the beat''s own premise -- his face a few centimetres from the
    two leaves -- is further from true at f120 than at f000. NOT pre-registered here and
    named now: the terminal sentence places his POSTURE and his HANDS and says nothing
    about WHERE IN THE FRAME he is sitting, and by this ladder''s own noun law an
    unplaced thing takes whatever position is going.'

what_the_next_rung_is: 'THE ACTION CLAUSE GAINS A MIDDLE IN CONTINUOUS ASPECT -- the
  edit that is already measured on two sibling beats and that beat 15 has never had.
  Rungs 1 to 4 all spent their variable on the PLANT clause and the plant is now fixed:
  H1 passes with the subject present, and the noun law has its confirmation. What is
  left is a shape problem, and it is exactly the one beats 03 and 13 had before their
  rung 3: 75 frames in which nothing happens, then everything at once. On beat 13 the
  same edit took the face band from 0.64 to 4.798 and drew a tilt no wording had drawn;
  on beat 03 it bought seventeen times the motion energy through the middle. Beat 15
  gets it as ONE inserted sentence -- halfway through the shot he is sitting in the same
  spot, hands still on his knees, head still going further down toward the leaves, mouth
  still moving -- which is also a POSITION anchor at the midpoint and therefore the
  cheapest available test of F_SUBJECT_RELOCATES. Filed as ep2-b15-listenmid-0820. NOT
  proposed: a fifth edit to the rooting clause (that axis is closed by this rung), a
  shorter render (--frames re-rolls the temporal grid and is not a trim), or a frame
  position bolted onto the terminal sentence as well (that would be a second variable
  and it is pre-registered as rung 6 if the relocation survives).'

