  NOTHING ELSE. Two words go and none arrive: `stays in the ground` becomes `stays in the grass`, and
  `with soil and grass around its base` becomes `with grass around its base`. The clause keeps everything
  it was written to carry -- the stem''s POSITION (beside him, out of the grass), its ROOTEDNESS, and
  the first-frame/last-frame continuity -- and carries ZERO ground-material nouns: no soil, no earth,
  no dirt, no mud, no loam, no ground. Rung 3''s mound of bare earth occupied the frame''s largest object
  slot, which was the goblin; `grass` is the one material already saturating this plate, so the base region
  gets a noun with nothing to displace. RUNG 2''S TERMINAL SENTENCE IS UNTOUCHED, INCLUDING ITS OWN `rooted
  in the ground` -- that phrase was in rung 2, rung 2 produced no mound, and editing the one clause in
  this family that bought position for free would be a second variable AND a risk to the only thing that
  works. Rung 3 is the control and the comparison is frame for frame against it: same init, same sha,
  same anchor, same seed, same negative byte for byte, same every flag, so a difference between them was
  bought by those two words.'
why: '$0, ~4.5 minutes of GPU, no download. Beat 15 has now paid three GPU fires to learn one rule and
  the rule has three independent confirmations at one init and one seed: a noun is a placement wherever
  it appears, and an unplaced one takes the position of the largest thing nearby. Rung 4 is the cheapest
  possible test of that rule -- it deletes two words and adds none -- and it is also the first clip in
  this beat''s history that can test the rooting clause against a goblin who is still in the picture,
  because rung 3 kept its plant by removing him. A bad result is attributable to the clause, and the most
  likely bad result is named.'
