  his answer was "all approved" on 2026-08-19; beat 13 was additionally ratified 2026-08-18 by his own
  board ruling. node.md states the consequence in as many words: "voice synthesis, footage render and
  episode assembly are legal for all five beats as now written". THIS IS A SILENT MOTION CLIP: no voice
  synthesis, no episode assembly, no publication, and the approval confers no verdict on the pixels. The
  one thing 6 still gates on this node is the 2026-08-18 beat-17 shake restage, which this job does not
  touch. SUPERSESSION NOTE, because a reader will find the other sentence: pipeline/jobs/ep2-b15-macplate-publish-0819.yaml
  says the beat-15 6 gate is LIVE. It was, when that spec was written on the morning of 08-19; the approval
  landed later the same day.'
script_line: 'Beat 15 GOOD LISTENER (1:10-1:15), node.md:98 as rewritten 2026-08-17 and READ AND APPROVED
  BY THE FOUNDER 2026-08-19: "He tips his head down and sideways until his eyes are level with the two
  leaves, and talks to them from a hand''s width away; both of them share the frame." His spoken line
  in the beat is "You''re a good listener. The last three people I talked to filed a report." -- so a
  MOVING MOUTH is correct here, unlike beat 04.'
bar:
  H0_THE_GOBLIN_IS_IN_EVERY_ONE_OF_THE_121_FRAMES: 'THE GATE. This clause did not exist before rung 3
    and rung 3 is why it does: its bar had no way to notice that the subject had been deleted, and scored
    a PASS on the plant *because* he was gone. Instrument, pre-registered: whole-frame mean-absolute interframe
    luma over all 120 pairs must have NO pair above 8x the clip median (rung 3 read 28.14 against a median
    of 0.171, i.e. 165x), AND the goblin must be present and recognisable by eye at f000, f030, f060,
    f090, f094, f105 and f120 -- f094 named explicitly because that is the frame rung 3 died on. IF H0
    FAILS, NOTHING ELSE IN THIS BAR IS SCORED: every other clause is measured on a shot that contains
    its subject, and a clause that can pass on an empty frame is not an instrument.'
  H1_THE_PLANT_IS_STILL_ROOTED_IN_THE_LAST_FRAME: 'CARRIED VERBATIM FROM RUNG 3, and now gated by H0 so
    it cannot be won the way rung 3 won it. At f105 and f120, read at 2x on the plant region: the stem
    runs down into the grass and no hand is on it. Rung 2 is the precise control -- it passed this at
    f090 and failed it at f105 -- so the whole question is still the last sixth of the clip. A clip that
    holds to f090 and loses it again is a FAIL and the finding would be that the pick-up is not prompt-driven
    at all but something the engine does to a small object near a hand, after which the next rung is mechanical.'
  H2_NOTHING_IS_BOUGHT_FROM_THE_PERFORMANCE: 'Rung 2''s own numbers are the floor, because rung 2 is the
    control and it cost nothing: FREEZE none, and HOLD strength at or below 0.60 (rung 2 read 0.508; its
    frozen beat-03 sibling read 0.958 with a 33-frame dead tail). A rung 4 that fixes the plant by stilling
    the clip has traded the one clean result in this family for the one broken clause, and is a FAIL.
    VOID CONDITION, ADDED AFTER RUNG 3 AND NOT NEGOTIABLE: judge_clip''s HOLD and FREEZE statistics are
    a performance reading ONLY while the clip is one continuous shot. Rung 3 read HOLD period 1 / strength
    0.01 -- nominally the loosest number this family has ever produced -- because it contained a hard
    cut, and every other clip in the family reads period 3 at 8.0 effective fps. If H0 fails, or if the
    clip reads period 1 while its siblings read period 3, this clause is RETRACTED AND NOT SCORED rather
    than credited.'
  H3_the_beat_still_reads_and_he_stays_seated: 'Carried from rung 2, which passed both, and from rung
    3, which passed it for 93 frames and then had no subject: he is sitting in the grass at f120, and
    his mouth is open and moving at f030/f060/f090. A regression on either is attributable to the one
    clause.'
not_done_on_purpose: 'NO recipe change -- size, frames, fps, guidance, distilled sigmas, two-stage, offload,
  mode and --image-crf 10 are the b14 crf-10 parent''s, four rungs deep now. NO new init, NO new sha,
  NO new anchor. NO new seed: 20260820 for the fourth time, so rungs 1, 2 and 3 are all true controls,
  and this box has already demonstrated bit-exact reproducibility across an eight-hour gap on this exact
  recipe. NO change to the NEGATIVE, unchanged since rung 1. NO SHORTER RENDER: --frames is an input to
  the denoiser''s temporal grid and not a crop, so a shorter rung is a re-roll of the whole video and
  cannot inherit this one''s early frames as evidence. NO edit to rung 2''s terminal sentence, for the
  reason set out in the_one_variable. No pick, no plate_ack, no cut, no publication -- beat 15 stays a
  SLATE.'
pre_registered_fail_modes:
- F-GROUND-IS-A-NOUN-TOO -- a mound of earth arrives anyway, from rung 2's surviving `the plant is still
  rooted in the GROUND`. That is the one ground-material noun this rung deliberately did not remove, on
  the evidence that rung 2 contained it and produced no mound. If it fires, the noun law is stronger than
  the rung-2 control suggested -- an abstract locative `ground` places a substance as readily as a material
  `soil` does -- and rung 5 is its deletion, which is then the LAST ground noun in the prompt and closes
  the axis. Named as the most likely FAIL of this rung.
- 'F-PLANT-PICKED-UP -- rung 2''s defect returns. Rung 3 cannot be read on this clause at all: it kept
  its plant by deleting the hand''s owner, so this rung is the FIRST clip to test the rooting clause against
  a goblin who is still in the picture. A pick-up here would mean the rooting clause never fixed anything
  and rung 3''s H1 pass was pure artifact.'
- F-STILL-FROZEN / F-STILL-DAMPED -- the clip buys the plant by stilling, i.e. beat 15 acquires the cost
  its beat-03 and beat-13 siblings pay. Scored against rung 2's 0.508, and only if H0 passes.
- F-SUBJECT-DELETED-AGAIN -- H0 fires. Whatever the cause, a second one-frame subject swap on this init
  at this seed makes it a property of the init and the recipe rather than of any word, and the next rung
  is mechanical rather than lexical.
- F-IDENTITY-DRIFT -- held on every clip in this family that still had a subject to measure; a regression
  would be attributable to the clause.
- F-MOUND-WITHOUT-DELETION -- a soil mound appears somewhere in frame while the goblin stays. Recorded
  separately from H0 because it would mean the noun places a substance but does not necessarily evict
  the largest object, which narrows the law's second half.
rung_3_the_control: 'ep2-b15-listenroot-0820: FAIL, and the worst single frame this beat has produced.
  AT f094 THE GOBLIN IS DELETED AND REPLACED BY A MOUND OF BARE EARTH in ONE frame pair -- whole-frame
  interframe 28.14 against a clip median of 0.171, no other pair above 1.7, a hard swap and not a dissolve
  -- and he never comes back. The last 27 frames of a five-second beat about a man talking to a seedling
  contain no man. H1 passed on the letter and the pass was worthless: the plant is rooted because nobody
  is left to pick it up. H2 and the skin probe were both RETRACTED as broken by the defect they were pointed
  at -- a hold statistic reads a cut as stillness, and a fixed box on an empty frame reads luma 203 with
  luma_std 3.1. Rooted to f120, seated and talking at f030/f060/f090, camera locked.'
skin_probe:
  box_xyxy_in_the_704x1280_init:
  - 302
  - 408
  - 356
  - 448
  placed_on: his left cheek, below the spectacle rim and above the cloak collar -- SKIN, not cloth, chosen
    by eye at 5x on the real cropped init and not by any colour rule
  f000_reading: R 67.9 G 114.6 B 50.3, R-B 17.6, luma 93.3 (std 20.3)
  how_to_read_it: Re-measure the same box on f120 and publish R, G, B, R-B and luma beside these. A green-skinned
    figure on a green field is exactly the case where one scalar decides nothing, so the whole triple
    is published and the verdict is written by eye against it.
  carried_verbatim_from: 'ep2-b15-listenroot-0820.yaml, and through it from the rung-1 spec where the
    box was placed by eye at 5x before any of these frames existed. Every rung renders the same init at
    the same sha, anchor and 704x1280 crop, so the box lands on the same skin. Copied byte for byte and
    labelled rather than re-placed: re-placing a probe after the frames exist is choosing the number.'
  retracted_on_rung_3_and_why: 'Rung 3''s reading of this box -- f120 luma 203.2, R-B 93.9, nominally
    a +112.9 identity catastrophe -- WAS NOT AN IDENTITY READING. luma_std collapsed 14.9 -> 3.1: a flat
    box is an empty box, and this one was sitting on lit grass because the subject was out of the picture
    entirely. PUBLISH luma_std WITH EVERY READING. A collapse means the box is on a field and an EXPLOSION
    means it is on an edge (beat 13''s went 6.0 -> 85.0); both are the premise dying and only the dispersion
    shows it. If either shape appears, the probe is RETRACTED and re-placed by eye at 5x on the frame
    in question, and the verdict is written by eye at 1:1 against a re-placed box with material published
    beside luma.'
the_one_variable: 'THE ROOTING CLAUSE RUNG 3 ADDED, AND NOTHING ELSE. Two words go and none arrive: `stays
  in the ground` becomes `stays in the grass`, and `with soil and grass around its base` becomes `with
  grass around its base`. The clause keeps everything it was written to carry -- the stem''s POSITION
  (beside him, out of the grass), its ROOTEDNESS, and the first-frame/last-frame continuity -- and carries
  ZERO ground-material nouns: no soil, no earth, no dirt, no mud, no loam, no ground. Rung 3''s mound
  of bare earth occupied the frame''s largest object slot, which was the goblin; `grass` is the one material
  already saturating this plate, so the base region gets a noun with nothing to displace. RUNG 2''S TERMINAL
  SENTENCE IS UNTOUCHED, INCLUDING ITS OWN `rooted in the ground` -- that phrase was in rung 2, rung 2
  produced no mound, and editing the one clause in this family that bought position for free would be
  a second variable AND a risk to the only thing that works.'
