why: 'THE REFERENCE ITSELF WAS REJECTED. Founder on the 08-12 sheet: "thats the cute goblin again.. i''d
  rather him not be cute." The sheet he once approved IS the cute design, which retro-explains every failed
  adult round this week -- the reference is the ceiling and no wording outranks it. Design 2 of 6, wiry
  scrapper. These are six different BONE STRUCTURES, not one face with six adjective sets. The anti-cute
  lever is structural rather than tonal, because tone words have lost every time this week: `head one
  seventh his height` is a ratio the model can draw and it is the thing that never moved through any adult
  round, plus `long skull` and `small eyes`. The tonal denials sit in the negative where they cost nothing.
  Frozen facts are byte-identical across all six.'
prediction: 'Written before any frame exists, and unlike r2''s this one is aimed at the failure that actually
  happened. r2 drew NO PLANT in 4 of 4 and NO WORLD in 4 of 4; r3 makes the sapling its own subject clause
  growing from the earth and gives the world its own sentence. What should come back: a rooted plant with
  a visible stem beside a kneeling goblin in a lit meadow. The remaining risks, in order — (1) the fig,
  absent in 3 of 4 of r2, is still only two words and may not read; (2) `purple fig` may fight the model''s
  prior for a fig''s colour; (3) with the character adjectives cut to buy tokens, the patchwork cloak
