# 2026-08-12. THE PINK EYES WERE NEVER A MOTION FAULT. I checked instead of fixing.
#
# I recorded twice that b14's eyes "drift from red toward pink across the clip" and filed
# it as a motion defect to chase. Before spending a render on it I opened the INIT at full
# size: IT ALREADY HAS HOT PINK EYES. The clip was being faithful. There was nothing to
# fix at this stage and a prompt sample would have measured nothing.
#
# That is the sapling mistake in miniature, twice in one day: I attributed to motion a
# property that was sitting in the frame I handed it. The check costs one image read and
# it is now the first thing I do before calling anything a drift.
#
# SO THE FIX IS THE INIT, not the prompt. Of the eight distinct b14 frames, r0-s2 and
# r0-s3 have unmistakably RED eyes; s3 also has the worried brow, blush and sweat-drop
# that suit "embarrassed", which is what the beat is. I simulated the 86px-per-side cover
# crop on it before choosing -- both its ears survive, unlike the frame that lost them on
# beat 04.
#
# SINGLE VARIABLE against b14-r2: the init. The crouch-at-the-ground action is unchanged
# because r2 proved it -- he came back down at the soil with both hands in it, which the
# original standing pose made impossible. Everything else identical.
