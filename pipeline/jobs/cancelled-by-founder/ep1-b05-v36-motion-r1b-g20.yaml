# ep1 beat 05 — FAN SPINNING DOWN — THE FIRST VIDEO JOB THIS BEAT HAS EVER HAD.
#
# WHY THIS BEAT. Every one of the 75 existing ep1 job specs names beat 03, 04,
# 06, 07, 08, 10 or 14. Beats 05, 09, 12 and 15 have never been rendered at all:
# in the v35 provisional cut they play a held still with a 12% code push-in and
# their sidecars say so in as many words — `model: none`, `note: held still +
# code push-in, no video model ran`. Four of the ten v34 fallbacks in that cut
# are these beats. They are the only unworked renderable gap left in episode 1.
#
# THE PLATE IS FOUNDER-APPROVED CANON and is not being redrawn. `prepare_plate`
# crops `stills/05-fan-spinning-down.png` — no image model runs, so no
# still is generated, replaced or promoted. G5 holds: output goes to a v36-*
# scratch path and overwrites no canon still and no tracked clip.
#
# WHY THIS IS ONE SAMPLE AND NOT A SET. The LTX recipe is the ratified one
# (704x1280 cover-centre plate, 65 frames, 24fps, 8 steps, distilled sigmas,
# two-stage) but the WORDING is new — this beat has no prior motion round to
# copy it out of, unlike the b14 reseeds which read theirs from the clip's own
# .meta.yaml. New wording is a recipe change, so this beat gets exactly ONE job
# per arm and no seed is scaled. If the picture holds, scaling is a decision for
# after someone has looked at it.
#
# NO METRIC RANKS THESE AND NO PICK IS OFFERED. On beat 14 the flow metric scored
# HIGHEST on the round where the plant fell over (131e433). Every clip goes to R4
# unranked.
#
# ARM B of a two-arm pair. Guidance 2.0 — IDENTICAL to arm A in every other
# respect, same seed included, so the only variable is whether the negative is
# evaluated at all. This answers a question the v35 README raised and left open:
# "at guidance 1.0 the distilled model runs no unconditional pass, so half the
# prompt was inert all night". Beat 07's r5-g20 twin is the precedent — it is in
# the v35 cut, and the pre-registered risk that off-spec guidance would break the
# picture did not happen. These four beats are the cheapest place in the tree to
# settle it, because they are the only ep1 beats with no incumbent clip to risk.
#
# THE DECISION IT FEEDS: if B is no worse than A on the picture, the remaining
# rounds stop paying for a prompt half of which does nothing. If B is worse, the
# question is closed and nobody reopens it. Either way it is one job per beat.
#
