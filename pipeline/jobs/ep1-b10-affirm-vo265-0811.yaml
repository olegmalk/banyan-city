# ep1 beat 10 at VO LENGTH — the affirmative-wording spec, 65f -> 265f.
#
# WHAT THIS CHANGES against ep1-b10-affirm-still-0811 (committed 84c7d3e, rendered
# clean on the box as 10-ltx-affirm-plate-s20260897.mp4): the frame count, the
# output name, and the id. Nothing else. Same plate (10-704x1280.png off the canon
# 10-sense.png), same seed 20260897, same guidance 1.0, same distilled sigmas, same
# 8+3 two-stage, same steps, same positive prompt byte-for-byte, same negative. The
# prompt/negative/embeds filenames carry the new id because they are stamped from
# it; their CONTENT is copied verbatim from the base spec.
#
# WHY THIS IS NOT SCALING AN UNLOOKED-AT SAMPLE (CLAUDE.md 2026-08-03). Same beat,
# same wording, same seed — one clip, not the recipe rolled out to a second beat.
# And the frame count is not a free parameter on this path: beat 07's pull-back
# emerged from frame count alone, unprompted, so the 65f look does not predict the
# 265f look in either direction. This render is its own evidence. Beat 10's slot in
# the v35 cut needs a VO-length clip regardless, per Roman's no-looping order
# ("i'd rather not have any looping, it looks bad").
#
# THE FRAME COUNT IS ARITHMETIC. Verified, not inherited:
#
#   vdur = 10.124s. Two sources agree: ffprobe on
#   genomes/sapling/nodes/001-capability-inventory/clips/10-vo.mp3 gives 10.124000,
#   and clips/10-vo.json:46 "total_s": 10.124. The manifest is what actually counts
#   — render_t3.py:1000 reads `(manifest or {}).get("total_s")` FIRST and only falls
#   back to measuring the mp3.
#
#   The slot: fit_duration (render_t3.py:312) with voice present returns
#   round(max(min(cdur, vdur+2.0), vdur+0.4), 2). So the clip plays once, whole:
#     - below vdur+0.4 = 10.524s the slot outruns the footage and it LOOPS;
#     - above vdur+2.0 = 12.124s the slot is capped and the tail is TRIMMED.
#   At 24fps that is F >= 252.58 (so 253) and F <= 290.98 (so 290). LTX wants 8n+1
#   (ltx_i2v.py:543 rejects (frames-1) % 8), leaving 257, 265, 273, 281, 289.
#
#   257 IS THE SMALLEST AND IT IS WRONG — a one-frame defect the range check does
#   not catch. `dur` is rounded to two decimals; `cdur` is not, it sits on the frame
#   grid (video_duration, render_t3.py:264-277, returns an exact packet count over
#   the stream fps, i.e. F/24). 257/24 = 10.708333, which rounds UP to 10.71. So
#   dur > cdur by 0.001667s, and render_beat builds the base as `-stream_loop -1`
#   into `trim=duration=10.71` (render_t3.py:627-631): the frame at pts 257/24 =
#   10.708333 is < 10.71, so it is kept — and it is the looped stream's frame 0.
#   One frame of the clip's opening flicked onto the end of the beat. That is
#   exactly the flash render_t3.py:264-271 and :996-999 were written to kill.
#   Neither guard fires: the palindrome needs dur > cdur + 0.05 (10.71 is not >
#   10.758), and held_still (render_t3.py:532-550) reads a `model: none` sidecar,
#   which LTX footage does not have.
#
#   265 = 8*33+1 IS THE SMALLEST CLEAN ONE. 265/24 = 11.041667 rounds DOWN to
#   11.04, so the trim lands 0.001667s EARLY — a sixth of the way into one frame
#   period (0.041667s), so no frame is lost and none is wrapped. All 265 play once.
#   Of the five candidates only 265 and 289 round down (257, 273 and 281 all wrap);
#   265 is the shorter, and its 0.92s tail past the line is well inside the 2.0s
#   voiceless-tail ceiling.
#
#   265 is far under the 385-frame host-RAM ceiling measured on this box (385f:
#   host_peak_phys 59.8/68.1GB, commit 89.2/128.2GB against peak_torch 17.8/25.7GB).
#
# THE PLATE IS CANON AND WAS CHECKED TODAY. ep1-b02-121f-vo-length.yaml excluded
# beats 3, 10 and 14 from the VO-length wave because their stills were frames Roman
# turned down in v32 — that exclusion has expired. He ruled on all three on
# 2026-08-09; shots.md records the correction (rewritten 2026-08-11) and disk
# agrees: stills/10-sense.png is dated Aug 9, and the two frames it replaced are
# renamed 10-sense-REVOKED-abstract.png and 10-sense-REVOKED-style-change.png.
#
# NO METRIC RANKS THIS. On beat 14 the flow metric scored highest on the round where
# the sapling falls over (131e433). One clip, for Roman to look at. If a number and
# the picture disagree, the picture wins.
#
# ONE SAMPLE. Sequential; no batch (CLAUDE.md 2026-08-03).

