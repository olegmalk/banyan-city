why: "THE TWO TAGS I KEPT AND DEFENDED ARE THE SUSPECT.\n\nA NEW QUESTION'S FIRST ROUND, NOT THIS QUESTION'S\
  \ THIRD, and the\ndistinction is load-bearing rather than a way around the cap. m1 and m2 asked IS\n\
  IT THE ADAPTER -- where it acts, how hard it acts -- and the answer came back NO\ntwice. That question\
  \ is closed. What sets the mood is a DIFFERENT question, it\nwas raised by m2's own result, and this\
  \ is its first rung.\n\nONE VARIABLE: `tsurime, thick eyebrows` OUT of the identity clause. Everything\n\
  else is the sample's to the byte -- the sample's mask, ip-scale 0.7, the same\nseed, the same skeleton,\
  \ the same beat words, the same tusk, the same emotion\ntags that have so far done nothing.\n\nAND THE\
  \ COST IS NAMED IN ADVANCE, because these two tags were kept for reasons\nthat were not empty. P1 wants\
  \ a brow above the lid with skin between it, and\n`thick eyebrows` is what has been drawing that; T1b\
  \ wants the tile's narrow\nupward-slanting slit and `tsurime` is the tag for it. If the scowl clears\
  \ and\nP1/T1b go with it, the answer is not to put both back -- it is that the brow and\nthe eye shape\
  \ have to come from the ADAPTER, which is the one instrument these\nthree frames have proven does hold\
  \ the eyes (T1 passed in all three with\n`blank eyes` struck).\n\nIF THIS MISSES TOO, the finding is\
  \ recorded and the wave ships at the sample's\nrecipe with E1 logged as an engine limit rather than\
  \ a defect we keep re-asking.\nThat was pre-committed before m1 and m2 rendered and it still stands.\n\
  \nm1 AND m2 BOTH MISSED E1, AND THE MISS IS THE FINDING.\nJudged 1:1 against the sample, 2026-08-21.\n\
  \n  m1  HEAD-FIT MASK   E1 unchanged -- still scowling. C1 WORSE, 7.36% in mask\n                  \
  \    against the sample's 1.17%. Ear spikes worse. FAIL.\n  m2  IP-SCALE 0.45   E1 unchanged -- still\
  \ scowling. C1 WORSE, 6.69%. T1 still\n                      holds. FAIL.\n\nWHAT THAT FALSIFIES IS\
  \ MY OWN HYPOTHESIS, and it is worth more than a pass would\nhave been. Both rungs were built on \"\
  the adapter owns the expression\". Cutting\nthe adapter's grip by a THIRD -- 0.7 to 0.45 -- did not\
  \ move the mouth or the\nbrow one pixel toward the exhausted relief the beat asks for. An instrument\
  \ that\nis not doing the pinning does not stop pinning when you loosen it. THE ADAPTER IS\nNOT WHAT\
  \ MAKES THIS FACE ANGRY, measured twice, and that question is closed at\nits two-round cap.\n\nC1 GOT\
  \ WORSE IN BOTH DIRECTIONS AT ONCE -- bigger mask and smaller mask, stronger\nadapter and weaker adapter\
  \ -- which says the magenta is not adapter coverage\neither. On a FOLDED pose the neck and chest sit\
  \ right under the jaw and the\ncheckpoint dresses them. That is a real regression on folded poses, it\
  \ is\nreported rather than solved here, and it belongs to the same investigation the\nadult wave's b03/b20\
  \ seed pair opened.\n\nWHERE THE EVIDENCE NOW POINTS, and it points at something I wrote and defended.\n\
  Ruling 2 struck the mannequin block but KEPT `tsurime` and `thick eyebrows`, on\nthe argument that they\
  \ are SHAPE and not MOOD. On this checkpoint that argument\nlooks wrong: `tsurime` is the sharp upswept\
  \ eye of a severe character and\n`thick eyebrows` is the brow that furrows over it, and the three frames\
  \ differ in\nmask and in adapter strength while sharing exactly those two tags -- and exactly\none expression."
