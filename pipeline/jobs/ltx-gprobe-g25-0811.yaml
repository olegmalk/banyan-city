control_clip: C:\banyan-farm\v34-motion-0810\10-ltx-r2g-plate-s20260897.mp4
source_spec: pipeline/jobs/ep1-b10-guidance20-0811.yaml

consumer: >-
  the ep2 motion-phase recipe decision: whether negatives bind at g>1 and at what quality cost — steward compares the three arms side by side, founder is NOT asked to review a technical probe.

success: >-
    A 704x1280 65-frame mp4 at C:\banyan-farm\ltx-gprobe-0811\g25\10-ltx-gprobe-g25-0811-s20260897.mp4, from the founder-approved beat-10 plate at
    seed 20260897, rendered at guidance 2.5 with the climb-naming negative. It is
    read beside the other two arms and beside the two clips already on the box
    (10-ltx-r2g-plate-s20260897.mp4 at guidance 1.0 and
    10-ltx-g20-plate-s20260897.mp4 at guidance 2.0, both on the OLD negative).
    Two things to look for, both by eye on the frames: (1) DOES THE APEX STILL
    CLIMB — does the stem visibly grow taller through the shot, as it has in every
    round so far; (2) IS THE PICTURE INTACT — cel palette clean, no burnt contrast
    or clipped saturation, no smearing or artefacting, horizon steady, nothing
    invented, and the wanted motion (leaves trembling, grass swaying, motes
    drifting) still present rather than frozen. This arm exists to find the ceiling. Degradation showing up here and not at 2.0 puts the usable range at 2.0; degradation at both retires CFG for this recipe whatever it does to the climb.
why: >-
    One variable against ep1-b10-guidance20-0811 and its control: guidance 2.5.
    Same plate, same seed 20260897, same 65 frames, same 8 steps, same distilled
    sigmas, same two-stage, same positive text, and the same climb-naming negative
    in all three arms. Beat 10's apex climb is the only LTX defect here with a
    measurement (181px, every round) and it has refused every positive rewrite, so
