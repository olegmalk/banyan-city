# LTX GUIDANCE PROBE — ARM 3 OF 3, GUIDANCE 2.5. Does a negative that NAMES
# the defect actually bind once CFG is on, and what does the distilled picture
# pay as guidance rises? Three arms, one variable, generated from one template.
#
# WHAT IS ALREADY SETTLED AND IS THEREFORE NOT RE-ASKED HERE. At guidance 1.0
# the distilled LTX path never evaluates the negative prompt: diffusers sets
# do_classifier_free_guidance = (guidance_scale > 1.0) or (audio_guidance_scale
# > 1.0), so there is no unconditional pass and the negative embeddings are
# never read (pipeline/ltx_i2v.py:1001-1008). Commit e4fbb65 audited 26 of 38
# LTX prompt negations as dead weight on exactly that basis. Settled. Not the
# question.
#
# TWO MORE THINGS ARE ALREADY ON DISK, AND THIS PROBE BUILDS ON THEM RATHER
# THAN REPEATING THEM.
#   * ep1-b10-guidance20-0811 ran clean on 2026-08-11 (rc 0, box `done`) and
#     wrote 10-ltx-g20-plate-s20260897.mp4 from the same plate, seed, frame
#     count, steps and WORDING as its guidance-1.0 control
#     10-ltx-r2g-plate-s20260897.mp4 — the two specs differ in `--guidance` and
#     in nothing else that reaches a pixel. On the box the files are 146,127 and
#     162,733 bytes. One changed argument, a different render: at guidance 2.0
#     the negative embeddings are demonstrably BEING READ.
#   * review/provisional-v35/README.md:70 records beat 07's r5-g20 round as
#     "the only round where the negative prompt did anything at all", and says
#     the pre-registered risk that off-spec guidance breaks the image was
#     "checked on the frames, it did not — clean cel palette, horizon holds, no
#     invented object". That round is the one carried into the v35 cut.
#
# SO THE OPEN QUESTION IS NARROWER THAN "DOES CFG WORK", and stating it narrowly
# is the point: "the bytes changed" is not "the banned thing went away", and one
# beat surviving 2.0 is not a quality curve. What is unknown is whether a
# negative written AT a defect REDUCES that defect, and how much picture we pay
# for it as guidance climbs. That is what the ep2 motion phase needs before it
# writes negatives on twenty beats.
#
# THE DISCRIMINATOR IS BEAT 10'S APEX CLIMB, AND IT IS CHOSEN BECAUSE IT IS THE
# ONLY LTX FAILURE IN THIS REPO THAT CARRIES A MEASUREMENT. review/SHEETS/
# index.html:45 — "The sprout apex climbs 181px in every round; no wording binds
# it." review/provisional-v35/README.md:73 adds the mechanism and it is the part
# that makes this the right test: "its apex rises 181px over the shot, identical
# in both rounds — and no framing wording can bind it, because it is the subject
# being *drawn taller* inside a fixed frame, not a camera move (655d2c6).
# Visible on the frames: the stem grows through the shot."
# Read that against the positive prompt below, which already says "stays at
# exactly the same height", "the same size and in the same place", "the
# composition is identical in every frame" — the POSITIVE channel has asked for
# the fix in four different sentences and been refused every round. A defect
# that survives every positive rewrite is precisely the defect worth pointing a
# negative at, and it is visible by eye rather than by a metric.
# The dark-drift alternative was considered and dropped: the bright-lighting
# work on this repo's goblin beats is SDXL still generation, where CFG has
# always been live and negatives have always worked, and no LTX clip here
# carries a measured brightness drift. Choosing it would have meant inventing
# the failure the probe is supposed to detect.
#
# NEGATION STAYS OUT OF THE POSITIVE, WHICH IS WHY THE POSITIVE IS UNTOUCHED.
# The positive below is byte-identical to the control's and contains none of the
# banned climb nouns; it asks for the framing affirmatively. (It does carry the
# parent's "no human, no person..." construction. That is the known
# negation-in-positive trap, it is NOT this probe's discriminator, and it is
# left exactly as the control has it — fixing it here would put a second
# variable in a three-arm sweep.)
#
# WHAT THE NEGATIVE CHANGES, AND WHY BOTH EDITS ARE CONSTANT ACROSS ALL THREE
# ARMS. Nine climb terms are added at the front; five anti-stillness terms
# (`静态, 静止, frozen frame, still image, no motion`) are removed, because once
# CFG is live they push AWAY from stillness on the one beat whose defect is
# unwanted movement, and a negative arguing with itself yields a result nobody
# can attribute. Both edits sit in every arm, so BETWEEN the arms guidance is
# still the only thing that moves. The already-rendered g2.0 clip on the old
# wording is a free fourth reference point: old-negative-at-2.0 against
# new-negative-at-2.0 isolates the wording change at live CFG, at no GPU cost.
#
# THE GUIDANCE-1.0 ARM IS A REAL CONTROL AND ALSO A FALSIFICATION TEST. It is
# the identical recipe to 10-ltx-r2g-plate-s20260897.mp4 except for negative
# TEXT — and the negative is supposed to be inert at 1.0. So this arm should
# come back visually indistinguishable from that existing control. If it does
# not, the inertness claim that commit e4fbb65 rests on is wrong and that is a
# bigger finding than the probe's own.
#
# CFG DOUBLES PER-STEP COMPUTE. Accepted for a probe: the 2.0 arm measured
# 5m13s end to end on this box. The card is idle and the queue is empty.
#
# NO METRIC RANKS ANYTHING (131e433 — on beat 14 the flow metric scored highest
# on the round where the sapling falls over). Three clips, read by eye, side by
# side. THE FOUNDER IS NOT ASKED TO LOOK AT THIS: it is a technical probe of a
# sampler argument, it picks nothing, publishes nothing and clears no gate.
#
# LICENCES: nothing new — LTX-2.3 distilled (LTX-2 Community License), already
# on the box. $0.

id: ltx-gprobe-g25-0811
