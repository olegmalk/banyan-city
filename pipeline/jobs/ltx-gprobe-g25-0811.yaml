needs: [cuda, vram20, video-venv]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  HF_HOME: C:\Users\artvn\.cache\huggingface
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "60"
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

payload:
  # Byte-identical in all three arms. Written per-arm so each job stands alone.
  C:\banyan-farm\ltx-gprobe-0811\g25\gprobe-prompt.txt: |-
    2D anime, hand-drawn cel animation, flat cel shading, clean ink linework, anime key art. a locked-off tripod shot: the camera never moves, the sprout stays at exactly the same height in the frame with its leaf tips at the same level from the first frame to the last, the horizon of grass stays at the same height, the sprout stays the same size and in the same place, the composition is identical in every frame. within that fixed frame the sprout stands upright and rooted, stem straight and steady, and only these things move: its two small leaves tremble very slightly, the tall grass around it sways in a light breeze, dust motes drift through the warm hazy air, soft light shifts across the stem, living scene. Subject already in frame: no human, no person, no man, no woman, no boy, no girl, no hand, no face, one small sprout with two leaves on a thin upright stem, tall grass around it, warm hazy amber light.

  C:\banyan-farm\ltx-gprobe-0811\g25\gprobe-negative.txt: |-
    plant growing taller, stem lengthening, stem getting longer, sprout rising, seedling growing, subject drifting upward, plant getting bigger, time-lapse plant growth, leaf tips rising, wilting, drooping, bending over, falling over, collapsing, sagging, plant dying, human, person, man, woman, boy, girl, extra hand, extra arm, foot, face, crowd, animal, bird, insect, new object appearing, photorealism, 3D render look, text, photorealistic, photograph, live action, film still, 3D render, CGI, octane, scene change, shot change, cut to another angle, second scene, new camera angle, different location, split screen, montage

steps:
  - name: plate
    argv:
      - C:\banyan-video\venv\Scripts\python.exe
      - -c
      - |
        import sys; sys.path.insert(0, r"C:\banyan-farm\banyan-city\pipeline")
        from plate_prep import prepare_plate
        out, rec = prepare_plate(
            r"C:\banyan-farm\banyan-city\genomes\sapling\nodes\001-capability-inventory\stills\10-sense.png",
            "704x1280", r"C:\banyan-farm\ltx-gprobe-0811\g25", "10")
        print("plate", out); print(rec["plate_wxh"], rec["crop_policy"])
  - name: encode
    argv:
      - C:\banyan-video\venv\Scripts\python.exe
      - C:\banyan-farm\ltx_i2v.py
      - --stage
      - encode
      - --embeds
      - C:\banyan-farm\ltx-gprobe-0811\g25\gprobe-embeds.pt
      - --prompt-file
      - C:\banyan-farm\ltx-gprobe-0811\g25\gprobe-prompt.txt
      - --negative-file
      - C:\banyan-farm\ltx-gprobe-0811\g25\gprobe-negative.txt
  - name: render
    argv:
      - C:\banyan-video\venv\Scripts\python.exe
      - C:\banyan-farm\ltx_i2v.py
      - --stage
      - render
      - --embeds
      - C:\banyan-farm\ltx-gprobe-0811\g25\gprobe-embeds.pt
      - --prompt-file
      - C:\banyan-farm\ltx-gprobe-0811\g25\gprobe-prompt.txt
      - --negative-file
      - C:\banyan-farm\ltx-gprobe-0811\g25\gprobe-negative.txt
      - --init
      - C:\banyan-farm\ltx-gprobe-0811\g25\10-704x1280.png
      - --out
      - C:\banyan-farm\ltx-gprobe-0811\g25\10-ltx-gprobe-g25-0811-s20260897.mp4
      - --size
      - 704x1280
      - --frames
      - "65"
      - --fps
      - "24"
      - --steps
      - "8"
      - --guidance
      - "2.5"
      - --distilled-sigmas
      - --two-stage
      - --seed
      - "20260897"
      - --beat
      - "10"
      - --task
      - ltx-gprobe-g25-0811
      - --worker
      - rtx5090
  - name: publish
    allow_fail: true
    argv:
      - C:\banyan-farm\venv\Scripts\python.exe
      - -c
      - |
        import glob, hashlib, os, shutil
        dst = "C:/banyan-farm/courier-box/farm-out/ltx-gprobe-g25-0811"
        os.makedirs(dst, exist_ok=True)
        src = sorted(glob.glob("C:/banyan-farm/ltx-gprobe-0811/g25/10-ltx-gprobe-g25-0811-s20260897.mp4*"))
        lines = []
        for f in src:
            shutil.copy2(f, dst)
            # Hash the COPY, not the original: what this records has to be the
            # bytes that get committed, or the manifest attests to the wrong file.
            c = os.path.join(dst, os.path.basename(f))
            with open(c, "rb") as fh:
                h = hashlib.sha256(fh.read()).hexdigest()
            lines.append(h + "  " + os.path.basename(f))
            print("   ", os.path.basename(f), h[:16])
        # newline="\n" is load-bearing: Windows text mode rewrites \n to \r\n and
        # every filename then carries a trailing \r that shasum -c cannot open.
        with open(os.path.join(dst, "ltx-gprobe-g25-0811.sha256"), "w", newline="\n") as fh:
            fh.write("\n".join(lines) + "\n")
        print("published", len(src), "file(s) + manifest ->", dst)
        # The clip and its §7.2 sidecar. Fewer means the render wrote less than
        # it promised and the arm cannot be read against the other two.
        raise SystemExit(0 if len(src) == 2 else 1)

