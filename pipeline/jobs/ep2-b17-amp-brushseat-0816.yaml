#     beat 17            beats 06 / 08 / 10
#     one figure         two guards
#     wide full body,    chest crop, no headroom
#       ~40% sky
#     stand up and go    rotate a board held at the chest
#       (whole body,       (small, in-hand, no gravity)
#        gravity)
