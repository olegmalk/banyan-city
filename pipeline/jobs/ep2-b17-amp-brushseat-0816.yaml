# MIDDLE row. This job tests the BOTTOM row first, for eleven minutes, and it
# needs no new plate at all -- because the amplitude variable can be moved on
# beat 17's own plate, holding the other two rows fixed by construction.
#
# THE ONLY VARIABLE IS THE ACTION CLAUSE. The init, its asserted sha, the
# negative, the style suffix, the seed (20260901 -- the seed full-s1 passed at) and
# every render flag are the same bytes as ep2-b17-full-s1-0815. The control is
# not re-rendered because it already exists: ep2-b17-full-s1-0815, same seed,
# same plate, whose goblin lifts his head 39.7% of the frame height.
#
#   control  full-s1     "He pushes up off the grass onto his feet, brushes the
#                          dust from his cloak, and turns away to go."   PASSED
#   this arm amp-brushseat   'Still seated in the grass, he brushes the dust from his cloak with both hands.'
#
# WHY THIS WORDING: the same small action with the stand-up explicitly held
# down, so a stand-up cannot mask whether the HANDS moved. Read against the
# bare arm: if the bare arm stands and this one does not, the plate is
# driving the rise and the clause is not.
#
# WHY --src IS THE PUBLISHED COPY AND NOT THE BOX-LOCAL PLATE. The twelve
# cells pointed at C:\banyan-farm\ep2-b17-plates-0815\..., a Mac-drawn file
# that box_enqueue cannot fetch, so all twelve carried
# plate_ack: "unfetchable: ...". A waiver is refused at the backlog door by
# design and rightly so. Their publish step copied the CROPPED init out to
# farm-out/ep2-b17-full-s1-0815/b17-init-704x1280.png, so the identical
# picture is now on origin/farm-results-rtx5090 and fetchable, its producing
# spec is in pipeline/jobs, and that producer named no --refs. Nothing is
# waived here: the plate check and the refs check both run and both pass.
# The file is already exactly 704x1280, so the cover crop is a no-op that
# still asserts the sha before anything is written.
#
# JUDGING, pre-registered here rather than chosen after the fact. Coldread
# consecutive frames (pipeline/coldread_frames.py); hold_period.py for period,
# distinct pictures and effective fps; terminal-freeze index reported
# separately, both the exact consecutive-frame ncc == 1.0000 form and a soft
# MAD < 0.05 form because crf-18 leaves max|A-B| up to 8 on a provably frozen
# tail. DEPTH DECIDES NOTHING -- cycle 018 measured it inverted. The retired
# `cadence` metric is structurally blind (odd periods alias to exactly 1.00x)
# and is not used. Camera-scale numbers are not quoted as fact. One sample per
# wording; no seeds until this one has been read.
#
# $0. Local card, no provider, no paid engine.
