# ep1 beat 04 "the-fall" — 385 FRAMES AGAIN, ONE WORD-LEVEL CHANGE. ONE SAMPLE.
#
# THE VERDICT THIS ANSWERS. Roman, 2026-08-10 ~23:50, verbatim (recorded in
# taste/steward-model.ledger.yaml, record `ep1-ltx-16s-founder-verdict-0810`):
# "the ltx 04 clip is literally his hand repeatedly moving, although the zoom out
# is great and its exactly the kind of thing we need."
# Two halves pointing opposite ways. The CAMERA MOVE is accepted in the strongest
# terms he has given any motion result. The SUBJECT MOTION is rejected as a loop —
# one gesture cycling for sixteen seconds.
#
# WHAT THE PROMPT ACTUALLY SAID, because this is where the plan has to be honest.
# `b04-prompt.txt` (the file the praised clip's embeds were encoded from) contains
# BOTH of these clauses:
#     "the fingers twitch once"
#     "framing locked, no zoom, no push-in, no camera rise"
# So the loop he rejected traces to a real instruction — a single twitch, which
# the model cycled over 385 frames — and THE ZOOM-OUT HE PRAISED WAS NEVER ASKED
# FOR. It appeared in defiance of three anti-camera-move terms. There is no
# "camera instruction that produced the zoom-out" to preserve; the only thing that
# distinguishes the praised clip from the earlier 65-frame render of the same
# plate, same seed and same embeds (04-the-fall-LTX-r2.mp4) is --frames.
#
# THEREFORE, ONE VARIABLE AND IT IS THE FINGER CLAUSE. Everything else is held at
# the values of the clip he ruled on, INCLUDING the anti-zoom terms, precisely
# because they were in force when the move he liked appeared. Changing them here
# would confound the loop fix with the camera question, which is what the two
# beat-07 jobs queued beside this one exist to ask separately.
#
#   b04-prompt.txt  : "..., the fingers twitch once, dim light shifts..."
#   this job        : "..., the hands stay completely still and do not move, dim
#                      light shifts..."
#
# Same plate (04-704x1280.png), same seed 20260835, same negative file byte-for-
# byte (b04-negative.txt, untouched — it already carries "hand picking up phone"),
# same 385 frames, same two-stage distilled recipe, same sequential offload, same
# script. The positive prompt is the only thing that differs, so a new embeds file
# is required and the encode stage runs first — Gemma is ~88s of load and the
# render that follows measured 6m47s wall at this frame count on 2026-08-10.
#
# WHY NOT ALSO ADD NEGATIVE TERMS. "fingers twitching, repeated gesture, looping
# motion" is the obvious second move and it is deliberately NOT made. Two changes
# in one render means a result that cannot be attributed. If a positive assertion
# of stillness is not enough, the negative is the next single variable.
#
# WHAT THIS DOES NOT DECIDE. Whether the clip ships is R4's. Nothing scales off
# this: no other beat is re-rendered off this result, and the flow metric is not
# run — it is disqualified on this series (131e433: it scored highest on the beat
# where the plant fell over). Judged by eye on a frame strip.

