  page has carried ''named, not fired'' on this beat for three days and the thing that was not fired is
  precisely this pass. No cut changes because this landed; /review/ep2-beats-0821 gains a CANDIDATE only
  after the motion render off this plate is judged.'
success: 'ONE 704x1280 png in which two average cotyledon leaves in place of one giant lance leaf IS DRAWN
  INTO THE FRAME AND HAS NOT MOVED, judged by eye at 1:1 and not by a metric. P1 cel shading and the plate''s
  ink weight, not the compositor''s flat fill; P2 root, height and leaf tips within a few px of where
  they were composited; P3 exactly two AVERAGE leaves on one stem -- a disc or a lance coming back is
  a FAIL however well drawn; P4'' the backdrop outside the mask is untouched; P5 the stem makes contact
  with the ground. The named degenerate outcome is a RELOCATED or REGROWN plant: if 0.30 has moved it
  or given it a third leaf, this plate is a FAIL and the fix is the number or the drawing, not another
  seed.'
why: 'BEAT 21''S ONLY REMAINING FAULT IS THE SHAPE OF ITS PLANT, AND A SHAPE IS A DRAWING PROBLEM.


  What is in the cut today: ONE GIANT LANCE-SHAPED LEAF standing straight up, failing sapling-two-leaves
  and sapling-cotyledon-shape at once. Canon since the founder''s 2026-08-17 ruling is AVERAGE leaves
  -- ''the shape anyone draws when you say leaf'' -- and it supersedes the earlier inference by name.


  THE WORDING LADDER FOR THIS IS CLOSED AND WAS CLOSED BY MEASUREMENT. Cardinality and leaf shape are
  Class A in pipeline/composite-init-pattern.md: the strongest wording available -- the numeral plus explicit
  negation of every wrong count -- returned 0 of 16 frames with two correct leaves. The instrument that
  works is the composite, and it is now four for four on plants (beats 03, 13, 16, 19) with a fifth finding
  from last night that matters here: beat 19 proved a hand-drawn COMPOSITED object survives i2v motion.
  That was the missing evidence under this whole route, and beats 12 and 21 are two of the four beats
  it unblocks.


  WHAT THIS JOB IS AND IS NOT. It naturalises the drawn plant into the frame''s dialect at strength 0.30
  and stops. It renders no motion, it files no motion spec, and it does not touch review/ep2-ship-0821
  -- the take in the cut is unaffected until a human opens this png. Beat 21''s shipping status is unchanged:
  nothing -- beat 21 is the only beat whose definition is fully met on all four clauses, and the plant
  is its single open R4 question.'
