    \ a spec whose declared artifacts\n# are never named by any step -- which a wildcard defeats. Missing\
    \ ONE file is\n# a FAIL of the job. No allow_fail anywhere in this spec.\nimport hashlib, os, shutil\n\
    from_dir = \"C:/banyan-farm/b21sapnat2-0822\"\ndst = \"C:/banyan-farm/courier-box/farm-out/ep2-b21-sapnat2-0822\"\
    \nNAMES = [\n    \"b21-sapnat2-s20260820.png\",\n    \"b21-sapnat2-s20260820-mask.png\",\n    \"b21-sapnat2-s20260820.png.meta.yaml\"\
