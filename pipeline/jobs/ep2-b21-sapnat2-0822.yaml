  founder''s own 08-17 canon ruling; his card /review/ep2-b16-leaf-0820 stays open and `licence` is still
  his to take.'
script_line: 'Beat 21 THE ANSWER: the leaf tilts, steadily, in one direction, and stops. The MOTION of
  this beat is the one thing in episode 2 that is fully measured and passing; this job does not touch
  it.'
bar: "JUDGED BY EYE AT 1:1, AND THE QUESTION IS THE LEAF SHAPE.\n\n  P1  THE PLANT IS DRAWN, NOT PASTED.\
  \ The two blades and the stem carry cel\n      shading and the plate's own ink line weight. The compositor's\
  \ flat fill\n      and its hard cut edge are gone.\n  P2  IT HAS NOT MOVED. Stem root, height and leaf\
  \ tips sit where the\n      compositor put them, within a few px. 0.30 finishes a structure; if the\n\
  \      plant has relocated, the strength was wrong and the number is the fix.\n  P3  EXACTLY TWO AVERAGE\
  \ LEAVES ON ONE STEM. Canon sapling-two-leaves plus\n      sapling-cotyledon-shape. THIS IS THE WHOLE\
  \ POINT OF BOTH JOBS: a round\n      disc is what beat 12 already has and a lance is what beat 21 already\n\
  \      has, so either shape coming back is a FAIL even though it would look\n      like a competent\
  \ picture. Three leaves, leaflets, a branching stem or a\n      second plant is also a FAIL.\n  P4'\
  \ THE BACKDROP SURVIVES. Beat 12's cumulus bank and beat 21's hedgerow,\n      golden field and cloud\
  \ bands are the parts of these two frames the\n      founder has already accepted. The mask is local;\
  \ anything outside it\n      that has changed means the pad-crop reached further than the geometry\n\
  \      said and the plate is a FAIL.\n  P5  IT SITS IN THE GRASS. Contact where the stem meets the ground,\
  \ no\n      floating base, no halo of untouched pixels at the mask edge.\n\n  P6  THE TWO CARRIED-IN\
  \ BLEMISHES ARE GONE OR HARMLESS, and they are named in\n      advance so a lane cannot discover them\
  \ afterwards and call them new.\n      b12: a ~30x50 px black twig fragment at the grass line beside\
  \ the stem,\n      left standing because the class map protects the grass band from the\n      erase.\
  \ b21: a thin sliver of the OLD pale stem beside the new one below\n      the hedgerow line. Both are\
  \ inside the mask. If either survives as a\n      readable SECOND STALK the plate fails P3 on the count;\
  \ if it comes back\n      as one more blade of grass, that is a pass and it is said out loud.\n\n  ALSO\
  \ EXPECTED AND NOT A FAULT: b12's erase left a horizontal smear across\n  the cloud bank where two 250\
  \ px discs were filled from their boundary. It is\n  inside the mask, and repainting it is a thing this\
  \ pass may legitimately be\n  asked to do -- 20% of the frame is masked here against b16's 5%. If the\n\
  \  smear survives, THAT is the finding: 0.30 finishes a drawn structure and a\n  boundary-fill smear\
  \ is a structure, so the fix would be a wider erase and a\n  redrawn sky rather than a higher strength.\n\
  \nA FAIL on P2 or P4' kills the plate. A FAIL on P1 alone is a strength question\nand is worth one more\
  \ round; a FAIL on P3 is a compositor question and goes\nback to the drawing, not to the sampler."
failure_predicted_in_advance: 'THREE, FILED BEFORE THE PIXELS. FIRST, THE BIG-LEAF DEGENERATE the b16
  rung named: the pass draws two enormous leaves that fill the crop and detail inside the region FALLS
  while looking busier. It looks like an improvement in a thumbnail and a failure at 1:1, so P1 and P3
  are judged at full size. SECOND, AND SPECIFIC TO BEAT 12: its mask is 20% of the frame against b16''s
  5%, because it has to cover the hole where two 250 px discs were erased as well as the new plant --
  and /review/ep2-b16-leaf-0820 measured 0.30 doing NOTHING on a mask eight times the working size. If
  b12 comes back unchanged inside the region while b21 (16%) comes back drawn, the mask-area law has a
  second data point and the fix for b12 is a smaller erase, not a higher strength. THIRD: a PERSON in
  the frame. Both plates are empty of people and the 0821 prompts all named a goblin; striking that clause
  is the edit most likely to have an effect nobody predicted.'
init_provenance: 'farm-out/ep2-b21-sapnat-0822/b21-sapnat-in-0822.png, 704x1280, sha256 bbe03e24e8334e01698b123fb8dedb632da0089ec3a36ce8a48fdc3cbc8376e9,
  with its mask b21-sapnat-in-mask-0822.png sha256 dd367e90ff9874fee5d732f412f70c4aea43b0db0454c9cfd76eef877fd0b1af.
  Both are committed on origin/main -- fetch_init.py pulls them by raw URL and refuses on any sha mismatch.
  THE SOURCE FRAME IS f000 OF THE SHIPPED TAKE, not this beat''s render plate, and that is deliberate:
  neither beat renders its init (b12''s take abandons the r4-s2 macro by f006, and beat 21''s own verdict
  records ''from f007 the init is entirely gone''), so the picture to correct is the one the model settled
  on. The composite was cut by pipeline/beat16_sapling_composite.py, which erased the old plant out of
  the pixels first and drew the canon two-leaf sapling in its place; its geometry json is beside the png.'
not_done_on_purpose: 'NO MOTION IS RENDERED BY THIS JOB and no motion spec is filed by it, even though
  both beats'' motion is the actual deliverable and the card is free. The premise of the whole route is
  that a plate must CONTAIN the object before a prompt may name it; filing the motion in the same breath
  would assert this plate passed before anyone looked at it. Beats 16 and 19 are also absent from this
  deriver and they are the other two beats on the same queue: b16''s foreground grass is a blown-out bokeh
  whose green p88 is (239,255,230), so the tool draws a WHITE plant on it and the placement question is
  open; b19 needs a fig rather than a sapling and goes through the b19 drop compositor.'
the_one_variable: 'THE INIT, and within the init the LEAF SHAPE. Every sampler number is the b16 rung''s
  by copy through derive_ep2_sapnat_0821: 40 steps, cfg 7.5, strength 0.30, pad-crop 64, blur 8, seed
  20260820, the whole inpaint_fruit.py payload, the env block, the needs, the dry-run-before-any-model
  gate and the no-glob publish. The prompt changes because it describes a different scene and the FIGURE
  CLAUSE IS STRUCK -- there is no person in either of these two plates, which is the one structural difference
  from every naturalize before it, and the figure words move to the negative so the pass cannot invent
  one.'
