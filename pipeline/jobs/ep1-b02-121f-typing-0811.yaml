# Beat 02, 121 frames, FRAMING HELD *AND HE TYPES*. Roman 2026-08-11 ~15:07:
# "redo beat 2, make him actually type".
#
# WHERE THIS SITS. Two beat-02 attempts precede it and each fixed the previous
# one's fault without reaching his:
#
#   attempt 1  ep1-b02-121f-vo-length      REJECTED — camera walked behind him by
#              frame 4. Cause: the prompt's subject tail described beat 02's
#              shots.md STAGE DIRECTION ("seen from behind as a dark silhouette")
#              instead of the plate, so LTX moved the camera to make that shot.
#   attempt 2  ep1-b02-121f-framing-hold-0811   FRAMING FIXED, in the cut now.
#              Verified frame by frame: composition of frame 120 == frame 0. But
#              the only motion in it is a head tilt, a hand coming off his
#              glasses, and steam off the mug. HIS HANDS DO NOT TYPE. That is
#              what this job answers, and it is the only thing that changes.
#
# THIS IS A ONE-VARIABLE JOB. Everything below is
# ep1-b02-121f-framing-hold-0811.yaml verbatim — same plate and same cover-centre
# crop, same seed 20260902, same 121 frames, same two-stage distilled schedule,
# same guidance 1.0, same negative, same steps — except the ACTION wording in the
# positive prompt and the output name. The camera-lock clause is copied character
# for character, on purpose: it is the thing that stopped the walk and changing it
# risks re-opening attempt 1's defect.
#
# WHAT THE PLATE ACTUALLY SHOWS, because attempt 1 died of not checking.
# genomes/.../stills/02-three-oh-seven.png: close, front-and-right, his face lit
# pink by the monitor, glasses catching the glow. ONE HAND IS RAISED AT HIS
# GLASSES holding a dark object; the other rests on the desk beside the mug. The
# big mechanical keyboard is at the bottom of frame, lit pink. NEITHER HAND IS ON
# THE KEYS. That is precisely why attempt 2 animated the glasses hand — it moved
# the only hand the plate had in motion range. So "make him type" is not a matter
# of asking harder for finger motion: the raised hand has to be brought DOWN to
# the keyboard first, and the prompt now says so explicitly. Left implicit, the
# model's cheapest way to put hands on keys is to grow a new pair.
#
# THE ACTION DIFF, VERBATIM.
#   REMOVED (the stillness framing — this is what suppressed the typing; every
#   clause in it is a cap on how much the hands may move):
#     "the seated engineer holds his pose at the desk, his shoulders steady, his
#      head kept at the same angle toward the monitor; only his fingers move
#      lightly on the mechanical keyboard. small ambient motion only,"
#   ADDED (typing stated positively, specifically, and as the shot's main action —
#   named as a motion, which beat 10 proved LTX honours when it appears in the
#   positive; the hand-descent named so the hands are moved, not duplicated):
#     "the seated engineer is typing at the desk. he brings his raised hand down
#      from his glasses onto the mechanical keyboard, and from there both of his
#      hands work the keys together, his fingers striking key after key, his
#      fingers running across the rows, his wrists shifting as his hands travel
#      over the keyboard, the typing going on without a pause for the whole
#      shot,"
#   ALSO ADDED, inside the "within that fixed frame" tail, so the ambient list
#   does not read as the full inventory of motion:
#     "his fingers keep working the keys, "     (leading the ambient clause)
#   UNCHANGED: the entire camera-lock clause, the ambient tail (glow pulse, mug
#   steam, dust motes, "living scene"), and the "Subject already in frame:" tail.
#
# THE SUBJECT TAIL IS NOT TOUCHED, and that is deliberate. It describes the plate
# as the plate is. It would be easy to "help" by writing "his hands on the
# keyboard" into it, and that would be attempt 1's exact mistake in the opposite
# direction: telling the model the conditioning image contains something it does
# not, which is what makes LTX travel the camera to reconcile the two. The
# hand-on-keys state is asked for as an ACTION that happens during the shot, and
# only there.
#
# NO NEGATIONS ANYWHERE IN THE POSITIVE. At guidance 1.0 the uncond pass is
# skipped entirely (ltx_i2v.py:1001-1008), so the positive is the whole prompt and
# "no", "never", "without" deliver their nouns. Note "the typing going on without
# a pause" — "without a pause" is the one construction here that reads like a
# negation; it survives review because its noun is `pause`, and a stray `pause`
# token biases toward exactly the stillness we want less of. Rewriting it as
# "continuous" was considered and rejected as vaguer.
#
# FRAME COUNT UNCHANGED AND STILL ARITHMETIC. Beat 02's VO is 4.451s, so
# render_t3.fit_duration (render_t3.py:312) floors at 4.851s and caps at 6.451s.
# LTX wants 8n+1: 113 -> 4.708s is under the floor; 129 -> 5.375s clears it but
# round(5.375, 2) = 5.38 > 5.375, so trim=duration=5.38 against a 5.375s source
# wraps one frame of frame 0 onto the end (render_t3.py:627-631) — rejected today
# for exactly that. 121 -> 5.041667s, and round(5.041667, 2) = 5.04 <= 5.041667,
# so it rounds DOWN and nothing wraps. 121 stands.
#
# NO METRIC PICKS ANYTHING. The flow metric is disqualified on this series
# (131e433 — it scored highest on the beat where the plant fell over). By eye:
# do the hands move across the keys, and does the frame hold. Both, or it is not
# wired into the cut.

