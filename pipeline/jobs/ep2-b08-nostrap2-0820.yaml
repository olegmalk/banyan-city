pre_registered_fail_modes:
  most_likely_A_THE_INK_STAYS_SOFT: 'Nothing in this rung aims at ink density, so 10.5% is the value to
    expect again. If the band goes and the ink stays soft, THAT IS A PASS OF THIS RUNG AND A NEW, SMALLER
    QUESTION -- and it is a compositor question, not a sampler one: the plate''s own ink can be carried
    over the fill. It does NOT license a sixth inpaint rung.'
  second_A_THIRD_NOUN_ARRIVES: 'A pocket, a seam, a fold-that-is-an-object, a strap the negative did not
    name. THE ROUTE CLOSES. This is the stopping rule and it is not renegotiable after the fact: three
    nouns negatived one at a time is a tool being steered by exclusion, which does not converge.'
  third_THE_NEGATIVE_EATS_THE_REAL_STRAP: '''double strap, second strap, extra strap'' at cfg 7.5 could
    suppress the strap the pass is supposed to KEEP, leaving bare shirt where the harness crosses. That
    would be a FAIL of H1(b) from the other direction and it would mean the negative cannot distinguish
    ''a second one'' from ''this one'' -- which also closes the route, because the remaining lever would
    be spatial conditioning the tool lacks.'
  NOT_a_fail_mode_the_seam_at_the_copy: The copy's stair-stepped octagonal edge is untouched by this pass
    and WILL still read as a decal. Expected, and the second pass's job.
  NOT_a_fail_mode_a_C4prime_PASS: C4' has passed all four frames on this route including a green goblin
    fist. A fifth pass is not evidence.
sample_declaration: 'ONE SAMPLE, the FIFTH and last on this route. Four before it, each moving exactly
  one thing, each buying a finding that ruled something out: mask SIZE does not choose the noun (18408
  px drew a head, 10020 px drew a fist); the PROMPT does (the goblin vanished outright); STRENGTH governs
  how much gets invented over the conditioning (0.99 over-draws, 0.70 keeps the strap). About fifty seconds
  of card in total, $0.'
scope_limits: This does not settle beat 08's staging and does not attempt the forearm. It is the last
  inpaint rung on the grip either way.
strength_argument: 'UNCHANGED AT 0.70, and that is the point of this rung -- it is the only value measured
  to delete the fist without over-drawing. The pre-committed refusal stands and is repeated so it is not
  quietly dropped: DO NOT PROPOSE AN INTERMEDIATE STRENGTH. The pool samples the knob at 0.70 and 0.99;
  one under-inks, one over-draws, and the fault this rung attacks is a noun that a quantity cannot address.'
what_the_four_parent_runs_established: 'Measured on landed frames. (1) THE FIST CAN BE DELETED, and it
  does not need 0.99 -- 0.70 deletes it completely. (2) MASK SIZE DOES NOT CHOOSE THE NOUN. (3) THE PROMPT
  DOES: removing ''goblin''/''green skin'' removed it entirely at unchanged strength, in-mask G-R -2.83
  with 1934 px above +20 to -16.06 with 166, and 0.70 reached -23.11 with ZERO. (4) STRENGTH GOVERNS INVENTION,
  symmetrically: shard rate 1.82% for the material replaced, 9.27% at 0.99, 0.38% at 0.70 -- neither end
  lands on the plate''s own line quality. (5) THE PROTECTED DIGITS SURVIVE every pass, and take LESS damage
  at 0.70 (maxdiff 78) than at 0.99 (121). (6) --pad-crop drift is DETERMINISTIC: 8574 / 8598 / 8600 px
  over three renders of identical geometry, 100% of it inside the crop box every time. (7) C4'' AS PRESCRIBED
  CANNOT SCORE THIS GEOMETRY -- three VOIDs -- and at a re-based ring it PASSES ALL FOUR FRAMES INCLUDING
  A GREEN GOBLIN FIST, so it cannot be the clause that decides this beat.'
