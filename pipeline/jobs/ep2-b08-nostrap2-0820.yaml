script_authority: 'Node 002b-first-citizen, approved_by: founder. THIS PRODUCES A PLATE, NOT AN EPISODE:
  STEWARDSHIP 6 gates voice, footage and assembly, and a still init for an approved beat is none of those.
  inpaint_fruit.py writes approved: false and a provisional: block into its own sidecar. Beat 08''s script
  line is ''lowers the clipboard and points'' and this rung touches only the LOWERING hand -- the pointing
  arm is outside the mask and byte-restored every step. No authoring call is made here: the hand that
  grips is the plate''s own drawn fist, translated, so not one digit is invented.'
bar:
  H1_the_fist_is_GONE_the_strap_RUNS_and_it_is_INKED: '(a) DELETED: no skin-toned remnant inside poly(FIST)
    grown 6, by eye at 14x. The parent PASSED this at 0.70 and a regression would be a surprise. (b) ONE
    STRAP: the guard''s own diagonal strap runs continuously from the buckle to the belt and NO second
    band, no crossing X, no strap end, no second buckle and no clasp appears. This is the clause the parent
    failed and the only reason this rung exists. (c) INKED: the fill''s ink density (px with L<90 inside
    the erase region) is within 3 points of the plate''s 13.3%. The parent read 10.5% -- soft, not wrong
    -- and 0.99 read 24.6%. This is a NEW sub-clause and it is registered as the one most likely to fail,
    because nothing in this rung is aimed at it.'
  C4prime_SHARD_RATE_with_a_FLOOR_this_time: 'Shard rate = fraction of erase-region px whose |grad| exceeds
    the 99th percentile of its own real ring at 35-45 px. BAR: 0.80% <= rate <= 3.00%. THE FLOOR IS NEW
    and it is the correction the parent earned: at 0.38% the parent is 4.8x SMOOTHER than the 1.82% material
    it replaced, and the ceiling-only clause called that a pass. Calibration, from an empirical null of
    200 real windows of this footprint: median 0.35%, p95 4.11%, p99 6.74%. The floor is deliberately
    BELOW the plate''s own 1.82% -- a fill quieter than its surroundings is expected where a hand has
    been removed from cloth; 5x quieter is not.'
  C4prime_RING_RE_BASED: 'assess() on the erase region with the init as plate and THE RING AT 35-45 px;
    D >= 0.45, N >= 0.25, F <= 2.60; publish the annulus''s real-pixel fraction. DO NOT RUN THE PRESCRIBED
    3-12 px RING -- three VOIDs on this geometry. AND A PASS HERE DECIDES NOTHING: this instrument has
    now passed a green goblin fist, a wedge fan and a clean strap. It is reported for continuity, not
    as evidence.'
  H3_the_digits_SURVIVED: 'Three finger creases and the thumb individually legible at 14x on the copied
    fist. Report its maxdiff: 55 / 121 / 78 across the three parents, and it is inside the pad-crop box,
    so it is never zero.'
  H5_NO_NEW_NOUN: 'No face, no head, no figure, no placket, no hardware. Measured on the green channel:
    in-mask G-R mean and px above +20, against -19.90 and 0 for the real material around the fill. The
    parent read -23.11 and ZERO; anything above zero is a regression.'
  B8_hair: maxdiff 0 over the head box (500..640, 300..430), as on all three parents.
  B6_wardrobe: Cream shirt, white sash and brown wrap still THREE garments.
  OUT_OF_MASK_DRIFT_is_MEASURED_not_assumed: Report changed px outside the mask, their maxdiff, and how
    many fall outside the crop box x488-719 y458-705. The last figure has been 0 three times and the totals
    8574 / 8598 / 8600; a fourth reading in that band confirms the drift is a property of the crop.
  scale30_clauses_hold: Goblin box (60..260, 430..1140) and board box (300..832, 660..1000) re-measured;
    they have read maxdiff 0 and 1 on every frame.
