#
# ================== DO NOT ENQUEUE. THE GATE BELOW IS CODE. ==================
# `gate:`/`gate_ref:` make box_enqueue.py:123-132 refuse this file outright.
# Clearing it is a human deleting the key in a commit.
#
# WHAT MUST HAPPEN FIRST: ep1-b08-313f-vo-length-0811 must have been LOOKED AT by
# Roman and accepted. Artifact:
#   C:\banyan-farm\v34-motion-0810\08-ltx-r2-plate-313f-s20260739.mp4
# That is the FIRST SAMPLE of "render the number of frames the voice line needs".
# This is a second beat on that recipe, and at 217 frames it is also the longest
# of the three staged here — if the 313f clip degrades over its length, this one
# would degrade the same way and must not be fired.
# =============================================================================
#
# THE DEFECT, MEASURED, AND IT IS THE BIGGEST ONE LEFT. fit_duration
# (render_t3.py:312) gives a voiced beat max(min(cdur, vdur + 2.0), vdur + 0.4)
# and loops footage shorter than that.
#   clips/13-vo.json          total_s 8.356  ('I walked away.')
#   review/provisional-v35/clips/13-i-always-left.mp4   2.542s (ffprobe)
#   slot = max(min(2.542, 10.356), 8.756) = 8.756s
#   8.756 / 2.542 = the picture plays 3.44 times under one line.
# Only beat 08 was worse (4.77x) and it is already fixed by the 313f job this file
# waits on. The loop is a palindrome since loop cycle 005 (render_t3.py:583) so
# the seams are continuous — the fault is watching the same two and a half seconds
# of road go forward and backward three and a half times under the line about
# walking away. That is the "looping, it looks bad" he named.
#
# THIS IS THE BEAT THE LONG-CLIP RECIPE SHOULD SUIT BEST, which is why it is worth
# staging rather than dropping. Its content is windswept grass and drifting clouds
# over an empty road: motion that is genuinely continuous and has no gesture to
# cycle. The two failure modes the series has produced — a cycled one-shot gesture
# (beat 04's "fingers twitch once", rejected as "literally his hand repeatedly
# moving") and a frozen frame — are both least likely on a landscape whose whole
# subject is ambient movement. If 217 frames does not hold together here, it will
# not hold together anywhere, which makes this the informative one.
#
# THE FRAME COUNT IS ARITHMETIC. F/24 >= 8.756 -> F >= 210.14; LTX wants 8n+1.
#   smallest 8n+1 >= 210.14 is 217 (8*27+1) -> 217/24 = 9.042s
#   9.042 >= 8.756 (nothing loops) and 9.042 <= vdur+2.0 = 10.356 (nothing trimmed).
# 217 is comfortably under the 385-frame ceiling this box has actually run (at
# 385f: host_peak_phys 59.8/68.1GB, commit 89.2/128.2GB, peak_torch 17.8/25.7GB).
# HOST RAM is the binding constraint at these lengths, not VRAM, and 217 sits
# between the two measured points rather than beyond them.
#
# THE PLATE IS A FRAME HE HAS NOT REFUSED. shots.md:1041-1046: after the
# 2026-08-08 redraw wave, "eleven of episode 1's fifteen shots now hold a frame he
# has not refused and four do not — 3, 6, 10 and 14". Beat 13 is not in that four;
# 13-i-always-left.png is canon with no REVOKED variant. Beats 03/10/14 loop too
# and are EXCLUDED from this staged set on exactly that ground — motion built on a
# drawing he turned down cannot ship, and choosing their replacement is his
# (checklist item 10, `ep1-frame-picks`). Beat 07 also loops (2.45x) and is
# excluded because the two 385-frame jobs already in the queue tonight cover it.
#
# THERE IS NO TREE IN THIS SHOT AND THERE MUST NOT BE ONE. The direction is
# explicit: "The road he can no longer take - no tree in this frame." The sapling
# is the show's subject and the video model has invented objects on this series
# before, so the positive tail states the emptiness affirmatively rather than
# relying on the negative — which, on this path, does nothing at all:
#
# THE NEGATIVE IS INERT. Verified at source in the venv the box renders with
# (C:\banyan-video\venv, diffusers 0.39.0, pipelines/ltx2/pipeline_ltx2.py):
#     do_classifier_free_guidance = (self._guidance_scale > 1.0)
#                                or (self._audio_guidance_scale > 1.0)
#     audio_guidance_scale = audio_guidance_scale or guidance_scale
# We pass guidance 1.0 and no audio value, so both are 1.0, the property is False,
# there is no unconditional pass, and the negative embeddings are never read. This
# is why "no tree" is written into the POSITIVE tail as a description of an empty
# landscape: a negation there at least contributes no forbidden noun, whereas a
# negative term contributes nothing whatsoever. Carried for provenance (§7.2).
#
# NO METRIC PICKS ANYTHING (131e433). Read by eye.

