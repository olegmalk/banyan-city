  in the beat is "You''re a good listener. The last three people I talked to filed a report." -- so a
  MOVING MOUTH is correct here, unlike beat 04.'
bar:
  A1_THE_PLANT_HOLDS_and_this_clause_outranks_the_others: 'At f120 there is exactly ONE plant with ONE
    thin stem and TWO leaves, still rooted, still shorter than he is. Read at 1:1 on f000/f030/f060/f090/f120
    and then consecutively if those five pass. THIS IS THE PRE-REGISTERED TOP RISK ON ALL THREE JOBS and
    it is not theoretical: ep2-b19-dropmotion-0819''s F-PLANT-REVERT fired hardest of its fail modes --
    two leaves became four or more, one fig became two, an upright stem became a horizontal runner, and
    a plant that cost four drawing rounds and a closed three-rung wording ladder was undone in 90 frames.
    No beat-19 job had ever checked the count under motion. This one does, and a plant that reverts is
    a FAIL of the job whatever else lands.'
  A2_THE_RATIFIED_ADULT_GOBLIN_HOLDS: 'The same lean wiry adult goblin man at f120 as at f000 -- green
    skin, bald head, long pointed ears -- with no drift toward a human or a child. Canon: pipeline/canon.yaml
    ep2-goblin-design-adult, founder-ratified 2026-08-19. THE PROBE IS PLACED BY EYE AT 5x ON SKIN AND
    NOT ON CLOTH, and it publishes its MATERIAL and not only its luma: the b08 rung''s first probe was
    placed by colour, landed on a cream sleeve, and would have passed a naive material test with a clean
    wrong number. Box, region and f000 reading are in `skin_probe` below; f120 must sit within +/-25 luma
    and +/-15 R-B of it, and BOTH numbers are published whatever the verdict. The probe is the filter
    and the eyes decide: this recipe has now carried the ratified adult through 121 frames on b04 and
    b09, so a failure here is news.'
  A3_CAMERA_LOCKED: No pan, tilt, dolly or zoom. Inherited clause; the parent held it, and beat 19's raw
    horizon shift was shown to be field RE-INKING rather than a camera move by the region-consistency
    test -- so a raw [dx,dy] fit is reported with its per-region spread or not at all.
  A4_IT_IS_NOT_FROZEN: 'Real motion, judged at 1:1. FAIL-FROZEN is a genuine outcome on all three of these
    and is NOT a safe result. NO WHOLE-FRAME INTERFRAME FLOOR IS SET: beat 19''s tracker self-test showed
    a PERFECT 32px subject move over a frozen background reads 0.056 whole-frame and would fail any such
    floor. A near-still beat puts its floor on the TRACKED SUBJECT, never on the frame.'
  A5_NO_EXPOSURE_BLOWOUT_and_this_one_is_RE_ROLLABLE: 'Whole-frame mean luma f000 -> f120 within +25.
    Measured because the growmotion five measured it: five seeds of ONE recipe on ONE init came back at
    +67.70, +57.06, +43.56, +22.42 and +10.68 -- a 6x spread that is SEED-SENSITIVE, not a property of
    the recipe. So a blowout here is re-rolled with a second seed before any flag is touched, and it is
    recorded as a seed result rather than as a recipe verdict.'
  B1_eyes_level_with_the_two_leaves_at_the_end: 'His eye line ends inside the blade band. Read at 1:1
    on f120, not from a metric. On the init his pupils are at output y ~378 and the blades are centred
    at output y ~390, so he starts nearly there: the clause is that the tip DOWN AND SIDEWAYS happens
    and does not overshoot past the leaves or come back up. A clip where he raises his head fails, and
    it fails against his OWN approved line.'
  B2_both_in_one_frame_for_all_121_frames: 'He and the sapling are both in shot in every frame. This is
    the whole of beats.''15''.done_when -- ''a close-up of him looking up at nothing fails it however
    well he acts'' -- and twenty-four artifacts could not produce it with a real plant. NOTE THE STALE
    HALF OF THAT DEFINITION: done_when was written 2026-08-15 and says ''he LOOKS UP''; node.md:98 was
    rewritten 2026-08-17 to ''tips his head DOWN'' and the founder approved that on 08-19. The approved
    line governs the direction; done_when governs the framing, on which the two agree.'
  B3_his_mouth_moves: 'He talks. The mouth opening is a PASS on this beat and a fail on beat 04, and the
    difference is that beat 15 has a spoken line. No lip-sync is claimed or scored: the VO is muxed later
    by render_t3.'
failure_predicted_in_advance: 'F-HEAD-RISES: he starts almost at the target attitude, so the engine''s
  easiest motion is to lift the head back to a neutral pose -- which is the OLD, superseded staging and
  would read as correct to anyone holding the 08-15 done_when. Named here so it is a finding and not a
  disappointment.'
framing_measured_before_the_gpu:
  anchor: center
  why: CENTRE, i.e. the default, and it is checked rather than assumed. The composited plant occupies
    original x 121..310, which a centred crop puts at output x 41..240 with 41 px of air to the left edge
    and the whole seated figure still inside. This is the only one of the three that clears a centred
    crop, so it is the only one that reproduces every earlier copy of cover_crop.py byte for byte.
  cover_crop_arithmetic: 832x1216 -> 704x1280 scales by 1.0526 to 876x1280, so the vertical is untouched
    and 172 px come off the horizontal. A centred crop discards 81.7 ORIGINAL px per side.
  composite_mask_bbox_in_the_cropped_init:
  - 41
  - 300
  - 240
  - 636
  asserted_by: assert_framing.py, before the model loads, against these exact numbers -- and by the mask
    rather than by a colour predicate, because these are green plants on green fields.
init_provenance: 'farm-out/ep2-b15-sapcomp-0819/b15-sapcomp-s20260819.png, sha256 df399888424071e5b9281748937a1e422eff6756dbe62c452b28d7b5456d30b8.
  Produced by pipeline/jobs/ep2-b15-sapcomp-0819.yaml, which scored PASS on its one variable on 2026-08-20:
  a canon two-leaf sapling composited into the plate and CONVERTED (not pasted) by 12 of 40 denoising
  steps at strength 0.30. NOT a founder pick and not approved -- its sidecar says approved: false, provisional:
  true. Byte-identity verified three ways before this spec was written: the local copy on main, the blob
  on origin/main, and the blob on origin/farm-results-rtx5090 that box_enqueue''s plate guard actually
  reads.'
not_done_on_purpose: 'NO RECIPE CHANGE OF ANY KIND. Size, frames, fps, guidance, distilled sigmas, two-stage,
  offload, mode and --image-crf 10 are all the parent''s. No crf sweep -- 33 is established wrong, 10
  is established workable, and the optimum between them is not this beat''s question. No second seed unless
  A5 fires. No re-pick of the plate, no plate_ack, no cut, no publication. --frames 121 is a RENDER LENGTH
  and not a trim: shortening it renders a different clip rather than a cut-down of this one.'
pre_registered_fail_modes:
- F-PLANT-REVERT -- the composited sapling grows leaves, sprouts a second stem, lies down or turns into
  a bush. Beat 19's, and the one this rung most expects.
- F-PLANT-DISSOLVES -- the sapling smears back into the field. The beat-13 composite named this as its
  own top risk and it did not fire at strength 0.30; 121 frames of i2v is a different and longer exposure
  to the same risk.
- F-FROZEN -- nothing moves. A real outcome, never a safe one.
- F-IDENTITY-DRIFT -- he stops being the ratified lean adult.
- F-EXPOSURE -- the whole frame blooms pale, as four of the five growmotion seeds did. Seed-sensitive;
  re-rolled, not re-flagged.
- F-WRONG-BEAT-ANIMATED -- the engine renders an adjacent beat's action, as beat 19's take rendered beat
  20's fig-in-hands with no hand action prompted and `fruit in his hands` first in the negative. Positive
  placement beats negatives, sighted six times.
skin_probe:
  box_xyxy_in_the_704x1280_init:
  - 302
  - 408
  - 356
  - 448
  placed_on: his left cheek, below the spectacle rim and above the cloak collar -- SKIN, not cloth, chosen
    by eye at 5x on the real cropped init and not by any colour rule
  f000_reading: R 67.9 G 114.6 B 50.3, R-B 17.6, luma 93.3 (std 20.3)
  how_to_read_it: Re-measure the same box on f120 and publish R, G, B, R-B and luma beside these. A green-skinned
    figure on a green field is exactly the case where one scalar decides nothing, so the whole triple
    is published and the verdict is written by eye against it.
the_plate_was_hand_carried_to_the_results_branch: 'TRUE FOR BEATS 03 AND 13, and said out loud because
  it is a guard-adjacent act. The courier has pushed nothing to origin/farm-results-rtx5090 since 2026-08-19T17:54
  -- the branch tip before 2026-08-20 was itself another lane''s hand-carry of beat 04''s plate for the
  same reason. box_enqueue.plate_problems reads --src off that branch and nowhere else, so both plates
  were carried across byte-identical and re-hashed on the branch afterwards. THE ALTERNATIVE WAS A plate_ack:
  "unfetchable" WAIVER AND IT WAS NOT TAKEN: the guard''s value is declining to wave through a picture
  it cannot see, and one of the two jobs that hit it in the 2026-08-14 wave was cropping the WRONG BEAT''S
  plate. Beat 15''s plate was already on the branch, pushed by the runner on 08-19.'
