  new seeds. That is the informative outcome: it moves beat 05 off the wording ladder and onto the plate,
  and it is why two seeds run and not one.

  D-COUNT the pair collapses to one man or overshoots to three. This beat has produced 1, 3 and 3+ on
  words before; count now comes from the plate, so a count failure here would mean the deletion disturbed
  something the plate was holding.

