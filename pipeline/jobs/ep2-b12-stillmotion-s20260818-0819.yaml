  the_finding_that_is_not_about_beat_12: 'CAMERA LOCK IS NOT PROMPTABLE ON THIS RECIPE -- IT IS A PER-SEED LOTTERY.
    This is stronger than the repo''s positive-placement law, and it is the first case where that law does not
    explain the defect: the ban is in BOTH places. The positive opens with ''Static locked framing, the frame
    never moves and nothing enters it'' and the negative''s first six tokens are ''camera pan, camera tilt, zoom,
    dolly, push in, pull back''. It tilted 387px anyway, on a seed that behaved on beat 01 twice. So the consequence
    is the same shape as the ladder''s standing luminance note: FRAMING IS A PER-RENDER CHECK, never inherited
    from a passing sibling and never argued from the prompt. Three lanes have now measured camera lock three different
    ways ad hoc (level-normalised SAD on b12-shortstill, a two-region horizon fit on b19, phase correlation here);
    b12_camera_drift.py is committed beside these artifacts so a fourth lane does not invent a fourth convention.'
  seed_depth_STOPS_HERE: 'NO FOURTH SEED, and this is a refusal rather than an omission. The question three seeds
    were filed to answer -- is a collapse on this plate re-rollable -- IS ANSWERED (2 of 3 hold, the third is
    the outlier). A fourth seed would measure the lottery, not a mechanism: the three takes fail three different
    ways, so the next seed''s outcome is uninformative about every hypothesis on the table. This also honours
    the spec''s own what_this_licenses (''one clip on one seed, no pick, no promotion, no cut swap''), the ladder''s
    three-rungs-closes-an-axis rule, and the b01/b18 seed-depth verdicts that both said no re-roll.'
  the_derivation_leak_this_judging_found: 'The parent''s verdict keys were NOT all refused. derive_b12_stillmotion_0819.py''s
