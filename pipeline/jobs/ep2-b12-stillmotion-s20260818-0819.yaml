  the_clause_that_fails: 'FAIL-CAMERA, and it is the pre-registered clause''s own definition met exactly: ''a
    real, region-consistent camera move''. Cumulative vertical translation f000->f120 = -387px (content moves
    UP the frame, i.e. the framing descends), dx = 0 at every frame. Per-frame dy is 0 for the first seven frames,
    then ramps monotonically -1, -2, -3, -4, -5 px/frame; median -4.0, max +0, i.e. it never reverses. REGION-CONSISTENT:
    at f060 all six blocks of a 3x2 grid read (-146,-145) +/-1px and dx within 2px -- the beat-19 lane''s own
    test, which is what separates a camera move from the field re-inking that gave beat 06 depth 0.516 with zero
    human motion. Shift-compensation collapses raw mean|diff| f000->f024 from 27.53 to 3.34 and f000->f120 from
    59.66 to 17.47: nearly everything that happens in this clip IS the camera move. By eye at f100-f120 the frame
    has descended into a bank of grass blades that is not in the plate at all, and ''nothing enters it'' -- the
    positive''s own words -- is broken continuously from ~f008.'
