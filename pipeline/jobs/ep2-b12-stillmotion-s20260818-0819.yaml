  against_myself: 'The keyframes suggested a much more interesting story than the one the pixels support: if a
    camera descent into a dark lower field can forge a -15 luma drift, it could forge a -91 one, and the parent''s
    ''DUSK COLLAPSE'' would have been a framing artefact all along. TESTED AND KILLED. Run on all three clips:
    s20260819 cumulative dy +0px with a genuine -91.05 on matched content, s20260871 +7px and -0.04, s20260818
    -387px and -1.35. The parent''s fade is a real fade on a locked frame. Also recorded as a limit of the instrument
    I am shipping: on s20260819 the bottom-right block reads (183,39) because a hard fade destroys the correlation
    peak in a low-contrast block -- whole-frame and the other five blocks read 0, and the earlier lane''s note
    that ''the fade invalidated the camera instrument'' is the same effect seen from the other side.'
