  C:\banyan-farm\ep2-fix-0811\b21-prompt.txt: |-
    2D anime, hand-drawn cel animation, flat cel shading, clean ink linework, anime key art. The sapling's leaf, in absolutely still air, tilts — slowly, deliberately, the first thing he has ever moved on purpose — and holds. the air is completely still and the grass stands motionless throughout, the sky is static, the camera is locked off and does not move, framing locked, no zoom, no push-in, no camera rise, the composition is identical in every frame, and the single moving thing in the entire shot is one leaf turning slowly and smoothly to one side and then coming to rest and staying at rest. Subject already in frame: In dead-still air with the grass frozen, one oversized leaf of a tiny sapling tilts slowly and deliberately to one side — an unmistakably intentional gesture from a plant — then holds, motionless. Low amber light, quiet awe, close-up, cinematic lighting, detailed, newest, masterpiece, best quality, very aesthetic.

