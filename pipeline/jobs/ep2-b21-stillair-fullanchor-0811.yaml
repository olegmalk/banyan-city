# EPISODE 2, BEAT 21 — THE ANSWER. The show's signature gesture, and the prompt
# that rendered it asked for the opposite of it three separate ways.
# UNGATED — beat 21 names no character at all (STATE.md 2026-08-09: beats 01, 18
# and 21 "name nobody and were clean for all six seconds"), so nothing here goes
# near the goblin definition Roman still owes a sentence on.
#
# THIS IS THE ONE SAMPLE of a recipe change (CLAUDE.md, founder 2026-08-03). The
# change is the motion clause. Beat 12 has the identical contradiction and is
# NOT queued behind this — it waits until Roman has looked at this clip. Beat 12's
# own job in this batch is the truncation fix ONLY, with its motion clause held
# byte-identical, precisely so this stays the single cell of the new clause.
#
# WHAT THE MODEL WAS ACTUALLY GIVEN. Read off the file the box rendered from,
# C:\banyan-farm\ep2-prov-0809\21-prompt.txt, not off a report:
#
#   "...The sapling's leaf, in absolutely still air, tilts — slowly, deliberately,
#    the first thing he has ever moved on purpose — and holds. SPEAK . slow.
#    POPULATION: 1. subtle continuous motion, gentle camera drift, living scene.
#    Subject already in frame: In dead-still air with the grass frozen, one
#    oversized leaf of a tiny sapling tilts slowly and deliberately to one side —…."
#
# THREE MECHANICAL FAULTS IN ONE STRING, none of them a matter of taste.
#
#  1. THE ANCHOR IS CUT MID-SENTENCE. video_task.py:626 is a hard 22-word cap:
#         anchor = " ".join(words[:22]) + ("…" if len(words) > 22 else "")
#     Beat 21's anchor ends at word 22, "to one side —", so the text encoder never
#     received "an unmistakably intentional gesture from a plant — then holds,
#     motionless." THE ENTIRE SECOND HALF OF THE ACTION — the hold, which is what
#     makes the tilt read as deliberate rather than as wind — was deleted before
#     the model ran. This is the single biggest thing wrong with the clip.
#
#  2. THE GENERIC MOTION CLAUSE CONTRADICTS THE BEAT. "subtle continuous motion,
#     gentle camera drift, living scene" is a DEFAULT (video_task.py:1540,
#     `task.get("motion") or ...`), applied to every beat that does not override
#     it. Beat 21 is the one beat in the episode whose entire specification is
#     stillness — "in absolutely still air", "with the grass frozen", "no wind
#     anywhere in frame" — and it was handed a request for continuous motion and
#     camera drift. And the prediction is visible in the render: sampling frames
#     0 / 72 / 144 of the existing clip, the grass sways, the leaf swings through
#     a large arc and the composition drifts. There is no dead-still air and no
#     discrete hold. The fix is one key: `motion` is stated affirmatively.
#
#  3. TWO JUNK TOKENS. "SPEAK ." is an empty speaker field emitted for a beat that
#     has no dialogue (beat 21 is wordless by design — shots.md gives it no line),
#     and "POPULATION: 1." is the storyboard's ON-SCREEN TEXT OVERLAY
#     (002b-t1-a.html frame 21: <div class="overlay">POPULATION: 1</div>) leaking
#     out of the caption layer and into the image conditioning. Neither belongs in
#     a prompt. NOTE, so this is not overclaimed: no rendered text is visible in
#     the frames I sampled, so the leak is not currently drawing words on screen —
#     it is junk conditioning, not a visible artifact. It comes out anyway.
#
# NEGATION IS HANDLED THE RIGHT WAY ROUND, AND IT MATTERS MOST HERE. At guidance
# 1.0 on the distilled path there is no unconditional pass, so THE NEGATIVE IS
# NEVER READ (verified at source in the box's venv: diffusers 0.39.0,
# pipelines/ltx2/pipeline_ltx2.py — do_classifier_free_guidance is
# (guidance_scale > 1.0) or (audio_guidance_scale > 1.0), and both are 1.0). The
# existing 21-negative.txt opens with "wind anywhere in frame" — correctly moved
# out of shots.md's positive tail by the builder, and completely inert. So the ban
# that matters most to this beat is currently doing NOTHING, and moving it back
# into the positive would be worse than nothing: it would feed the model the word
# "wind" (DIAG-negation-in-positive.md, e4fbb65). The only thing that can work is
# an AFFIRMATIVE statement of stillness in the positive, which is what the new
# motion clause is. The negative below is kept byte-identical for provenance
# (§7.2) and is expected to change no pixel.
#
# LENGTH IS CORRECT ALREADY — 145 frames stays. Beat 21 is silent, so
# fit_duration (render_t3.py:299) returns min(cdur, script_s): the script gives it
# 1:42–1:47 = 5s and the clip is 6.042s, so it is TRIMMED to 5s, never looped.
# There is no loop defect here and the frame count is deliberately not touched —
# it would be a second variable for no reason.
#
# ONE VARIABLE PAIR. Same plate (byte-identical — the 704x1280 file the prov clip
# was conditioned on, still on the box), same seed 20260806, same guidance,
# sigmas, size, frames and negative. Only the positive changes, and every change
# to it is one of the three faults above.
#
# NO METRIC RANKS ANYTHING (131e433). Read by eye, beside the existing clip.
# LICENCES: nothing new. LTX-2.3 distilled (LTX-2 Community License), on the box. $0.

