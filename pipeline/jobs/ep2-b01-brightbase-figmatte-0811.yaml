# EPISODE 2, BEAT 01 — THE ORDER, FIXED. Bright base FIRST, then the two masks.
# One round, four seeds, three chained passes, $0. 2026-08-11 ~20:2x.
#
# ── THE BUG THIS FIXES IS AN ORDERING BUG, NOT A PROMPT BUG.
# `ep2-b01-figmatte-0811` put the matte-green fig where it belongs and killed the
# glowing orb, and it did both ON THE FOUNDER'S DUSK PLATE — so the frames came
# out dark, and the lighting ban that landed tonight on beats 04 and 02 never got
# a channel that reached the pixels. That job's own comments say why it could not
# get one: the two ellipses total under 1% of the frame and the mask blend
# restores the other 99% every step, so no negative reaches them. Under a mask
# the ban is structurally inert. The only way to give it a channel is to relight
# the BASE before either mask runs. That is the whole change: order.
#
# ── WHAT THE BRIEF ASKED FOR THAT DOES NOT EXIST, SAID PLAINLY, BECAUSE THE
# ── SUBSTITUTE IS BETTER AND SHOULD NOT BE MISTAKEN FOR THE ORIGINAL.
# The brief said "the leafcount wording that fixed the leaves (keep it)". THERE
# IS NO LEAFCOUNT WORDING. The leaf count was never fixed by words and cannot be:
# shots.md's beat-01 section, written 2026-08-06 after four such rounds were drawn
# and counted — `a single pair of oversized leaves` (4-6 leaves, 8 of 8),
# `exactly two oversized cotyledon leaves` (4-6 leaves, 4 of 4), `sprout with only
# two oversized leaves` (3 at best, 1 of 4) — ends "Do not spend a fifth round on
# synonyms for 'two'". What fixed the count was GEOMETRY: one ellipse over the
# third blade, filled with the grass around it, so the model is never asked to
# count. That mask is carried here unchanged, and the fence this round renders
# still contains `two oversized cotyledon leaves` exactly as r7/r8 sent it — the
# words are kept, they are simply not what does the work.
#
# ── AND THE BASE RENDER HAS A MEASURED PREDECESSOR, WHICH IS WHY THIS IS ONE
# ── VARIABLE AND NOT A NEW IDEA. Ledger record `ep2-b01-r8-sample` already ran
# this exact init through img2img at strength 0.35 AND 0.55 with beat 01's own
# fence, which says `peach and gold sunrise sky` in those words:
#   "at 0.35 the palette has not moved, and at 0.55 — the top of the range the
#    2026-08-06 repaints ever measured — it has STILL not moved"
#   "Retired: that a low strength can carry a foreign palette — it cannot,
#    measured at two strengths."
# and in the same record: "The t2i control renders that sky correctly on all four
# seeds, so the prompt is not the problem; the init is overriding it." So a third
# strength is not the lever — 0.55 also grew the stem back toward the 32% hairline
# the founder revoked, because on this plate the palette IS the composition. THE
# ONE CHANNEL r8 NEVER TRIED IS THE NEGATIVE, and tonight's beat-04 result is the
# evidence that it is worth two GPU-minutes: positive lighting words did not bind
# on this checkpoint and the negative did.
#
# ── THE ONE VARIABLE IS EIGHT TERMS AND IT IS PROVED, NOT ASSERTED. The block is
# beat 04's verbatim — `dark, night, dusk, sunset, dim lighting, moody lighting,
# low key, shadows dominant` — inserted into the AUTHORED fence as `no ...`
# clauses after `no night sky,`. That is beat 04's own mechanism: the negation
# lifter pulls each one OUT of the positive and `extra_negative_parts` sends them
# as BEAT-tier terms, which `fit_negative` protects ahead of the house defaults.
# The consequence is checkable, and `render_b01_bright.py` refuses to draw unless
# it holds: THE SENT POSITIVE COMES OUT BYTE-IDENTICAL TO r8's. Verified on this
# Mac before queueing (estimator) and re-measured on the box's real tokenizer by
# this job's first step. Everything else is r8's, IMPORTED from `render_b01r8.py`
# rather than copied — same init and sha assertion, same 832x1216, 40 steps, cfg
# 7.5, strength 0.35, and the same four seeds (20260720/20261720/20262720/
# 20263720) computed by r8's own rule. A copy can drift; an import cannot.
#
# ── THE COST, NAMED BEFORE IT IS PAID. The negative is already near CLIP's 77 and
# the beat tier outranks the house tier, so eight lighting terms SELL eight house
# terms off the end. On the Mac's estimator: `photorealistic, 3d render, abstract,
# watermark, signature, low quality, blurry, shrubbery`. The estimator over-counts
# this shape by ~3 near the boundary, so the real figure is measured by the `dry`
# step below and written into every sidecar. `photorealism` (beat tier) survives
# and covers most of what `photorealistic` and `3d render` were doing; the person
# terms and the style anchor are asserted present and the job fails for $0 if
# either goes. STATED RISK, the same one beat 04 named: `dark` is blunt in an SDXL
# negative and can pull contrast out of the whole frame. Bright-but-flat is a real
# possible outcome, and the answer to it is a NARROWER block, not more terms.
#
# ── THE MASKS RIDE ON THE 0.35 MEASUREMENT AND WOULD NOT SURVIVE A HIGHER ONE.
# Both ellipses were measured on the 832x1216 founder plate: the leaf at
# 378,655,48,54 and the fig at 462,848,34,36, non-overlapping (y[601,709] against
# y[812,884]). r8 measured that 0.35 leaves the layout untouched and that 0.55
# visibly redraws the subject — so 0.35 is not a timid choice, it is the only
# strength at which the two masks still land where they were measured. If the
# relit base moves the plant, that is a geometry miss and the fix is the ellipse
# numbers, not the method.
#
# ── THE PROMPTS FOR THE TWO MASKS ARE THE CORRECTED r2 FILES AND THEIR BYTES ARE
# ── ON THE RECORD (the shared-mutable-box-state hazard, 85716cf). Committed at
# 3c51dba, mirrored on the box, re-hashed on both sides in this pass — identical:
#   pipeline/b01-leaf/prompt-r2.txt    1562bf0a1cc34ba9886bd62e41624ac218579a7716962382425a35e6ab081c45
#   pipeline/b01-leaf/negative-r2.txt  035b9da9d5d819a14ca1972782d95e03e600b54369d9abc1eaeddc6f9c1761d2
#   pipeline/b01-fig/prompt-r2.txt     db4a2502927884a3ed06570916872ae2365ecd497ae12417a1525ba596879297
#   pipeline/b01-fig/negative-r2.txt   475a305aac126bd4d88226de238b1a41bf602bdef2064aa022ee8e902eb8466b
# The renderer is new and its bytes are on the record too: repo
# pipeline/render_b01_bright.py and the box copy at
# C:\banyan-farm\b01-bright\render_b01_bright.py are both
# 3c6f47cf578461411470d67ff9dd8b7ad8a6151a649d656e06cc609895f7cc37, scp'd and
# re-hashed on the box in this pass. `inpaint_fruit.py` and `render_b01r8.py` are
# untouched; the box's `render_b01r8.py`, `sd_prompt.py` and `generate_shots.py`
# were hashed against the local copies and all three match.
#
# ── CHAINING. `inpaint_fruit.py` requires `--init-sha256`. Pass 1's init is a file
# this same job wrote minutes earlier, so its hash is MEASURED at run time by the
# wrapper and handed to the script unmodified; on an intermediate the check can
# only be a self-check and pretending otherwise would be theatre. The base render
# asserts the founder's plate (f60c1404...7277f54), which is the assertion that
# matters and is intact.
#
# ── WHAT THIS CANNOT SETTLE. If four seeds come back dusk with `dark, night,
# dusk, sunset` provably sent, then beat 01's light is a property of the PLATE
# that no prompt channel reaches, and the honest next step is the question already
# queued for R4 in `ep2-b01-pickpage-founder-verdict-0811` — is a fixed dusk cold
# open acceptable, or does beat 01 need a plate he approves first? — or the
# depth-ControlNet route shots.md named. Either way the question is retired for
# about eight GPU-minutes, and that is worth more than another frame.
#
# SEPARATE OUT DIRECTORY: `C:\banyan-farm\b01-bright\out`. Nothing in
# `out-figmatte` or `out-leafcount` is touched.

