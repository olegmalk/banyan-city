# ep1 beat 05 — THE SAPLING REVEAL. One NEW frame, four seeds, unranked.
#
# WHY THIS EXISTS. Roman, 2026-08-11, verbatim and NOT withdrawn:
#
#   "we should show that he became a sapling earlier in the video just to make
#    it less confusing."
#
# The first answer reused beat 12's own push-in in the tail of beat 05 at 0:22.
# He rejected it, same day, also verbatim: "dont show beat 12's picture twice."
# So the reveal is currently OUT of the cut with nothing in its place (commit
# dc77bc8) and the confusion he named is back — knowingly, because the only fix
# available without a render was the one he refused. The draft leaf
# genomes/sapling/nodes/001-capability-inventory/leaves/drafts/001-t0-e-draft.yaml
# names what closes it under `what_would_close_it`, and this job is that:
#
#   "A NEW PLATE — one picture of the sapling that belongs to beat 05, not
#    borrowed from a later beat. Roughly: the two-leaf sapling in grass, morning
#    light to match beat 06's sky, framed wider or from a different angle than
#    beat 12's push-in so it cannot read as a repeat."
#
# NO SCRIPT CHANGE AND NO NEW BEAT. node.md and 001-t0-d.yaml describe fifteen
# beats and still do. Beat 05 has 1.42s unused inside its authored 4.00s slot,
# which holds the insert with no timing change anywhere after it. shots.md is
# NOT edited: the prompt is injected script-side, the way render_b06r6/r7/r8
# inject theirs, because writing an unread picture into shots.md would change
# the string every other renderer sends for beat 05. The driver asserts beat
# 05's own fence — the ceramic shards — byte-for-byte before a weight loads.
#
# THE RECIPE IS COPIED, MEASURED, NOT INVENTED. Source: the founder's own pick
# of the 2026-08-08 wave, takes/stills/12-undefined-r2-s1.png (seed 20261731),
# promoted to stills/12-undefined.png — animagine-xl-3.1, 832x1216, 40 steps,
# cfg 7.5, bfloat16 on cuda, prompt through the unmodified compress() +
# beat_negative() path with no script-side transform of any kind. Trap 2
# rebuilds beat 12's sent positive AND negative from the box's checkout and
# asserts both against that sidecar, so "the same recipe" is a measurement. The
# only differences are the prompt, the seeds and the output names.
#
# THE PROMPT DESCRIBES THE PICTURE, NOT A CAMERA MOVE. Beat 02 broke today
# because its prompt described shots.md's stage direction while the plate held a
# different framing and the model travelled to the words. There is no plate here
# to contradict, and the prompt still names no move, no push-in and no cut —
# only the image: an upright two-leaf sapling seen from low at ground level with
# pale morning sky, the light that cuts into beat 06's sky two seconds later.
#
# COUNT TAG: NONE, AND THAT IS THE RIGHT TAG. _tag_from_clause reads the first
# comma-clause, `plant focus`, which matches no person pattern, so the derived
# tag is empty and none is prepended — beat 12's exact behaviour, and beat 12
# drew no people. `1other` is what a BARE HUMANOID NOUN resolves to; there is no
# figure in this frame at all, so there is nothing to tag. Trap 4 refuses the run
# if a count tag appears at the head of the sent positive.
#
# PROHIBITIONS ARE IN THE NEGATIVE ONLY. The authored `No …` sentence is stripped
# out of the positive by compress()'s _NEGATION and imported into the negative's
# beat tier. Trap 5 asserts the sent positive carries no `no ` ban of any kind.
# That is the SDXL side of today's beat-03 finding — restoring `text` to the
# negative killed the gibberish glyphs 4 of 4 — and the opposite of the LTX habit
# of relocating bans into the positive, which is how `wobble` ended up in beat
# 10's binding channel.
#
# MEASURED ON THE BOX BEFORE THIS FILE WAS WRITTEN, --dry, real CLIP:
#   positive 70/77 tokens, style anchor `very aesthetic` intact
#   negative 76/77 tokens (beat 12 control: 76), all 7 required terms surviving
#   traps 1-7 green
# The first wording measured 78 and compress() paid for it by dropping the style
# anchor; trap 6 caught that and refused to draw. Two clauses were sold to buy
# the anchor back — `both leaves open wide` (said already by `two-leaf`) and
# `behind it` (done by `seen from low at ground level` beside the sky clause).
# The driver on the box is byte-identical to the repo copy,
# sha256 2abf28b15df3edd44d32374d44cdab0ff2fed30a40b5563a84f519e4df5616c2.
#
# FOUR SEEDS IS A ROUND, NOT A RECIPE CHANGE (CLAUDE.md, founder 2026-08-03).
# This beat's own series, 20260719 + beat + k*1000, at k=8..11. k=0..3 are spent
# on takes/stills/05-huh-green-s{0..3}.png; trap 7 reads the directory rather
# than trusting the arithmetic. Sequential, one config, no batch-of-4 render
# config.
#
# NOTHING HERE RANKS, PICKS, PROMOTES, PUBLISHES OR SPENDS. All four go to Roman
# in seed order with no preference expressed, and no metric chooses between them:
# on beat 14 the flow metric scored highest on the round where the plant falls
# over (131e433). The pick is R4's.
#
# D15: these are takes/ candidates, which licence_gate explicitly does not count
# against the debt ratchet ("a takes/ candidate, so it is not counted against the
# debt ratchet"). They add 0 to the 33-against-25 animagine pile today. If Roman
# picks one and it is promoted into stills/ and assembled, that promotion adds
# lines — the direction of travel is up, and it is his call whether to spend it.

