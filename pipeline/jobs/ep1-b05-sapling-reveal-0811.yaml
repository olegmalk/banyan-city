task: ep1-b05-sapling-reveal-0811
node: 001-capability-inventory
beat: 5
runner: box
needs_gpu: true
priority: 15
max_attempts: 1
owner: sapling-reveal lane (founder direction 2026-08-11, beat 05 insert)

approval: >-
  genomes/sapling/nodes/001-capability-inventory/leaves/001-t0-d.yaml:17 —
  `approved_by: founder       # 2026-07-27, read and approved: "episode 1 looks
  good, you can do it"`. leaves/ holds 001-t0-{a,b,c,d}.yaml and nothing else
  matching *-t0-*.yaml; sorted()[-1] is 001-t0-d.yaml, which is the approved
  leaf. The 001-t0-e draft is in leaves/drafts/, where the gate's non-recursive
  glob cannot see it — it sorted after 001-t0-d and its `approved_by: none`
  refused all media for node 001 during the two minutes it sat one level up.

source_still: >-
  genomes/sapling/nodes/001-capability-inventory/takes/stills/12-undefined-r2-s1.png
  (seed 20261731) — the founder's 2026-08-08 pick, promoted to
  stills/12-undefined.png. Recipe source only; its PICTURE is not reused.

consumer: >-
  Roman's standing direction of 2026-08-11 to show the sapling earlier, which is
  currently unanswered: the reveal is out of the cut (dc77bc8) and episode 1
  again shows no exterior sapling until beat 11/12 at 1:03. These four
  candidates are what he chooses the beat-05 insert from. They go to him
  unranked; nothing is cut in until he names one.

success: >-
  Four 832x1216 PNGs with §7.2 sidecars in C:\banyan-farm\b05-reveal-0811\out,
  named 05-sapling-reveal-reveal-r1-s{0..3}.png, published to
  C:\banyan-farm\courier-box\farm-out\ep1-b05-sapling-reveal-0811. Answered by
  LOOKING, on three things and nothing else: (1) is it legibly a small sapling
  standing upright — the reveal fails if the plant is bent, drooping or ambiguous;
  (2) could it be mistaken for beat 12's frame — different posture, different
  camera height, different light, or it is the repeat he rejected; (3) does the
  morning light sit beside beat 06's sky at 0:24. Style, palette and linework
  holding from the rest of the episode is assumed, not scored. No pick is made.

why: >-
  One variable against the founder-picked beat 12 still: the prompt. Same model,
  same 832x1216, same 40 steps, same cfg 7.5, same unmodified sd_prompt path,
  and beat 12's own sent positive and negative are rebuilt and asserted
