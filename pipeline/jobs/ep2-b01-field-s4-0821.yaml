why_the_erase_route_was_not_taken: 'MEASURED, not assumed. beat16_sapling_composite''s --erase-box is
  a luma flood seeded on the plant''s ink and grown through pixels below --erase-lum, which assumes a
  dark plant on a bright field. On b01''s backlit plate that ordering is inverted: upper field median
  luma 89.1, sapling stem 130.5, foreground grass 114.9. No threshold separates them, and the run proves
  it -- the flood escapes into the grass, returns 68,542 px of matte for a thin stem, and C0c refuses.
  Masking without erasing does not rescue it either: a 0.30 pass preserves a plant rather than removing
  one, so the small sapling''s leaves would stand at y 645-760 beside the new one and break `sapling-two-leaves`.'
