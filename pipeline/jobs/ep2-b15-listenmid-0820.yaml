script_line: 'Beat 15 GOOD LISTENER (1:10-1:15), node.md:98 as rewritten 2026-08-17 and READ AND APPROVED
  BY THE FOUNDER 2026-08-19: "He tips his head down and sideways until his eyes are level with the two
  leaves, and talks to them from a hand''s width away; both of them share the frame." His spoken line
  in the beat is "You''re a good listener. The last three people I talked to filed a report." -- so a
  MOVING MOUTH is correct here, unlike beat 04.'
bar:
  H1_THE_DEAD_MIDDLE_IS_GONE: 'THE CLAUSE THIS RUNG EXISTS FOR, and the instrument is rung 4''s own. Whole-frame
    mean-absolute interframe luma over the STEP FRAMES from f009 to f084 -- this family holds every 3rd
    frame at 8.0 effective fps, so the gaps are meaningless and the step frames are the signal -- must
    have a MEAN of at least 1.5 and at least a THIRD of its step frames above 1.0. Rung 4 read mean 0.166
    with a maximum of 0.417 over the whole stretch: not one step frame anywhere near 1.0. Rung 2, the
    loosest clip in the family, is the other control. PUBLISHED WITH ITS SHAPE, never as a bare mean:
    beat 13''s rung 3 read 4.798 as a mean and 26-35 on its step frames, and the bare mean would have
    read as smooth motion that is not on the screen.'
  H2_THE_PLANT_AND_THE_SUBJECT_BOTH_SURVIVE_IT: GATE, and it is carried from rung 4's H0 and H1 together
    because rung 4 is the first clip on this beat to hold both at once and it must not be given back.
    The goblin is present and recognisable in every one of the 121 frames, checked on a full-clip sheet
    with f094 opened by name; and at f105 and f120 the plant is ONE thin stem with TWO leaves running
    down into the grass with no hand on it. IF EITHER FAILS, NOTHING ELSE IS SCORED -- a motion clause
    measured on a clip that lost its subject or its plant is the mistake rung 3 made and rung 4 was written
    to stop.
  H3_THE_RELOCATION_IS_SMALLER: 'His own eye band, template-matched against f010, must end within 60 px
    of where it started, measured at f105 AND f120, with the background rock template published beside
    it at the same frames so a camera move cannot be scored as a slide. Rung 4 read dx +182 dy -30 at
    f105 and dx +184 dy -30 at f120 against a rock holding at dx 0..+3. 60 px is a THIRD of rung 4''s
    slide and is deliberately not zero: the middle sentence anchors the midpoint, not the end, so a partial
    fix is the expected shape of a pass and would be a real finding either way.'
  H4_no_terminal_freeze_and_no_stillness_tax: 'judge_clip FREEZE must read none, or a run shorter than
    5 (rung 4 read 5 from f116; rung 2 read none), and HOLD strength must come in at or below rung 4''s
    0.638. VOID CONDITION, carried: these are a performance reading only while the clip is ONE CONTINUOUS
    SHOT. All six clips in this family read period 3 at 8.0 effective fps; a clip that reads period 1
    has a cut in it and its hold statistics are RETRACTED, not credited.'
  H5_the_beat_still_reads: 'Carried from rung 4, which passed it: he is sitting in the grass with his
    knees up and both hands on his knees at f120, and his mouth is open at f030, f060 and f090. Read at
    4x, not off a number.'
not_done_on_purpose: 'NO FIFTH EDIT TO THE ROOTING CLAUSE -- that axis is closed by rung 4, which removed
  two words, added none, and produced a clip with the goblin in all 121 frames and no mound anywhere.
  NO TOUCH TO THE TERMINAL SENTENCE: a frame position there is rung 6 if H3 fails, and adding it now would
  make this rung two variables and unattributable. NO recipe change -- size, frames, fps, guidance, distilled
  sigmas, two-stage, offload, mode and --image-crf 10 are the b14 crf-10 parent''s, five rungs deep. NO
  new init, NO new sha, NO new anchor. NO new seed: 20260820 for the fifth time. NO change to the NEGATIVE,
  unchanged since rung 1. NO SHORTER RENDER: --frames is an input to the denoiser''s temporal grid and
  not a crop, so shortening re-rolls the whole video and cannot inherit this one''s early frames as evidence.
  NO plate work and NO composite -- beat 15''s plate puts him and the sapling far apart and that is a
  real open question, but it belongs to the plate lane and is not this rung. No pick, no plate_ack, no
  cut, no publication: beat 15 stays a SLATE.'
pre_registered_fail_modes:
- F-MIDDLE-DOES-NOTHING -- the dead middle survives the insertion, i.e. this beat's terminal conditioning
  saturates in a way beats 03 and 13's did not. That would be the first divergence in this family under
  an identical edit and would point at the PLATE rather than the words -- beat 15's is the only one of
  the three whose subject and plant are far apart, so there may simply be no small action available to
  him that the frame can show.
- F-MIDDLE-IS-A-CUT -- `HALFWAY THROUGH THE SHOT` read as a shot change. ANSWERED NO on beats 03 and 13
  with largest whole-frame interframe 4.32 and 7.7, so this is carried for completeness rather than as
  a live risk; it is re-reported because the negative's `cut to another shot, scene change, shot change`
  is by this ladder's own law not protection.
- 'F-SUBJECT-RELOCATES-AGAIN -- H3 fails, i.e. a midpoint position anchor does not hold the end. NAMED
  AS THE MOST LIKELY FAILURE OF THIS RUNG, because the anchor is in the wrong sentence for the frame it
  has to fix: the slide happens between f087 and f105, after the midpoint. If it fires, rung 6 is a frame
  position in the TERMINAL sentence -- one clause, and the axis is then closed at two placements.'
- F-PLANT-PICKED-UP / F-SUBJECT-DELETED -- H2's gate. Held on rung 4 and on both sibling beats through
  the same edit; a regression is attributable to the inserted sentence and would be a serious finding
  about how much one prompt can place at once.
- F-MOTION-AT-THE-COST-OF-THE-FACE -- beat 13 paid for this exact edit by pressing its face into its own
  knee for thirty frames in the middle. Beat 15's equivalent cost would be the mouth or the head occluding
  at f060, which H5 checks by eye at 4x.
- 'F-IDENTITY-DRIFT -- held on rung 4 with a re-placed probe whose dispersion matched (std 13.5 against
  14.3). Publish luma_std with every reading: a collapse is a box on a field and an inflation is a box
  on an edge, and only the dispersion shows either.'
rung_4_the_control: 'ep2-b15-listengrass-0820: THE NOUN DELETION WORKED AND IT IS STILL A FAIL. The goblin
  is in all 121 frames and there is no mound of soil anywhere -- verified frame by frame and at 1:1 across
  f093..f098 -- where rung 3 deleted him at f094 and replaced him with bare earth. The plant is rooted
  at f105 and f120 with no hand on it, and the skin probe could be RE-PLACED for the first time on this
  beat: cheek (505,440,555,464) at f120 reads luma 92.0 / R-B 15.8 / std 13.5 against f000''s 90.3 / 18.8
  / 14.3, i.e. +1.7 luma with the dispersion matching. IT FAILS H2: FREEZE 5 frames from f116 against
  a bar of none, HOLD strength 0.638 against 0.60 and against rung 2''s 0.508 -- and the shape is worse
  than the margin. f009->f084 reads mean 0.166 / max 0.417 whole-frame, the mouth band 0.213 over the
  same stretch (open, HELD), and every spike in the clip lives in f087..f118, where he also slides 184
  px right and 30 px up while the background holds at dx 0..+3.'
skin_probe:
  box_xyxy_in_the_704x1280_init:
  - 302
  - 408
  - 356
  - 448
  placed_on: his left cheek, below the spectacle rim and above the cloak collar -- SKIN, not cloth, chosen
    by eye at 5x on the real cropped init and not by any colour rule
  f000_reading: R 67.9 G 114.6 B 50.3, R-B 17.6, luma 93.3 (std 20.3)
  how_to_read_it: Re-measure the same box on f120 and publish R, G, B, R-B and luma beside these. A green-skinned
    figure on a green field is exactly the case where one scalar decides nothing, so the whole triple
    is published and the verdict is written by eye against it.
  carried_verbatim_from: ep2-b15-listengrass-0820.yaml, and through it from the rung-1 spec where the
    box was placed by eye at 5x before any of these frames existed. The box is UNMOVED, because every
    rung renders the same init at the same sha, anchor and crop.
  retracted_on_rung_3_and_why: 'Rung 3''s reading of this box -- f120 luma 203.2, R-B 93.9, nominally
    a +112.9 identity catastrophe -- WAS NOT AN IDENTITY READING. luma_std collapsed 14.9 -> 3.1: a flat
    box is an empty box, and this one was sitting on lit grass because the subject was out of the picture
    entirely. PUBLISH luma_std WITH EVERY READING. A collapse means the box is on a field and an EXPLOSION
    means it is on an edge (beat 13''s went 6.0 -> 85.0); both are the premise dying and only the dispersion
    shows it. If either shape appears, the probe is RETRACTED and re-placed by eye at 5x on the frame
    in question, and the verdict is written by eye at 1:1 against a re-placed box with material published
    beside luma.'
  rung_4_re_placement_and_what_to_do_with_it: 'Rung 4''s f120 reading in the fixed box was luma 201.9
    with std 2.4 against f000''s 90.3 / 14.3 -- a COLLAPSE, i.e. an empty box, because he had translated
    184 px right out from under it. Re-placed by eye at 4x on f120 over a printed coordinate grid at (505,440,555,464)
    it read luma 92.0 / R-B 15.8 / std 13.5, i.e. +1.7 luma with the dispersion matching, and identity
    held. DO THE SAME HERE: read the fixed box first, and if its dispersion collapses or explodes, retract
    it and re-place by eye on the frame in question rather than reporting the number. A dispersion that
    jumps is a box on an edge exactly as one that collapses is a box on a field; both are the premise
    dying and only the dispersion shows it.'
the_one_variable: 'ONE SENTENCE INSERTED IN FRONT OF THE TERMINAL SENTENCE, and nothing removed and nothing
  else changed. `HALFWAY THROUGH THE SHOT he is still sitting in the same spot with both hands still on
  his knees, his head still going further down and over toward the two leaves, and his mouth still moving
  as he keeps talking to them.` Every clause in it is CONTINUOUS -- still sitting, still going further,
  still moving, keeps talking -- because the one thing this family has measured about terminal conditioning
  is that a static attitude is satisfied by making every frame the last frame, and an ongoing action is
  not. It also names WHERE he is (`in the same spot`) at the midpoint, which is the cheapest test of rung
  4''s relocation: 184 px right, 30 px up, on a camera measured locked. THE ROOTING CLAUSE IS NOT TOUCHED
  and carries no ground-material noun; the terminal sentence is not touched; the negative, the seed, the
  init, the sha, the anchor, the frame count and every render flag are rung 4''s.'
