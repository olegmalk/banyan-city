  is a taste call and is not proposed here.'
success: 'ONE 704x1280 121-frame mp4 off the same init and the same seed as ep2-b15-listenmid-0820.yaml,
  differing from it by ONE INSERTED SENTENCE and nothing else, in which the middle of the clip is no longer
  dead, the goblin is still in all 121 frames and the plant is still rooted with no hand on it. ONE SENTENCE
  INSERTED IN FRONT OF THE TERMINAL SENTENCE, and nothing removed and nothing else changed. `HALFWAY THROUGH
  THE SHOT he is still sitting in the same spot with both hands still on his knees, his head still going
  further down and over toward the two leaves, and his mouth still moving as he keeps talking to them.`
  Every clause in it is CONTINUOUS -- still sitting, still going further, still moving, keeps talking
  -- because the one thing this family has measured about terminal conditioning is that a static attitude
  is satisfied by making every frame the last frame, and an ongoing action is not. It also names WHERE
  he is (`in the same spot`) at the midpoint, which is the cheapest test of rung 4''s relocation: 184
  px right, 30 px up, on a camera measured locked. THE ROOTING CLAUSE IS NOT TOUCHED and carries no ground-material
  noun; the terminal sentence is not touched; the negative, the seed, the init, the sha, the anchor, the
  frame count and every render flag are rung 4''s.'
why: '$0, ~4.5 minutes of GPU, no download. Beat 15 has spent four rungs on the plant clause and rung
  4 closed it -- no mound, no deleted subject, H1 passing with the character present, and a skin probe
  that could be re-placed for the first time. What is left is not a plant question: 75 consecutive frames
  at 0.166 whole-frame interframe with an open mouth held still, and every spike crammed into the last
  quarter. That is the same shape beats 03 and 13 had, and the same one-sentence edit fixed it on both
  -- beat 13''s face band 0.64 -> 4.798, beat 03''s step frames 0.4 -> 7.6 -- so this is a measured repair
  rather than a fifth wording, and F-MIDDLE-IS-A-CUT is already answered NO on two beats before it is
  risked on a third.'
