  C:\banyan-farm\attrbind-add-0817\prompt.txt: |-
    round silver wire-rim glasses, a guard man face in sunlight, dark cropped hair, detailed cinematic anime, masterpiece, best quality
  C:\banyan-farm\attrbind-add-0817\negative.txt: |-
