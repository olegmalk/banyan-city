# ep2 beat 05 -- ONE SAMPLE: eyewear onto ONE of two bare faces, BY CONSTRUCTION.
#
# HIS WORD, 2026-08-15: "draw the second man without glasses. we need to have
# control." He rejected both wordings offered him and asked for a mechanism. This
# is the mechanism's own direction: the plate is drawn with NO eyewear token at all
# (so the second man is without glasses exactly as he said), and the attribute is
# then put on guard A ALONE.
#
# THE DEFECT AND WHY WORDING CANNOT REACH IT. `glasses` inside ONE man's clause
# lands on BOTH men, 5 of 5. That is a THIRD behaviour, not the two we had names
# for: hair and garments BIND to their clause; a prop goes to ONE WRONG figure
# (bark board, 3 of 3, by adjacency); eyewear goes to EVERY figure.
# pipeline/loop/attrbind-eyewear-0817.md names it BROADCAST-class. The published
# cause is CLIP's causal encoder plus an EOS token carrying global prompt semantics
# (ALE-Edit, arXiv 2412.04715): the token steers the whole frame and nothing in it
# says WHICH face. The control arm is already in hand -- `wire-rim glasses` BINDS
# 7 of 7 on beat 09's ONE-figure close-up, and ep2-b09-cast-0817 kept them on that
# reasoning. The wording is not weak. THE NUMBER OF ELIGIBLE FACES IS THE VARIABLE.
#
# THE PAYOFF TO WATCH, AND IT IS THE WHOLE CLAIM. The word `glasses` IS IN THIS
# JOB'S POSITIVE PROMPT. The same word that broadcast to both men 5 of 5 is used
# here deliberately, because the mask confines where it can act. If guard B comes
# back bare with that word in the positive, then control is structural rather than
# rhetorical -- which is what he asked for.
#
# WHY COMPOSITE-THEN-HARMONISE AND NOT A PROMPTED INPAINT. With the frames already
# inked into the init, the attribute is not a sample from the model: at strength
# 0.30 only steps x strength steps run, so the inked structure survives and the
# pass only puts it in the plate's dialect. The bark clipboard split at 0.45 and
# held at 0.30 for the same reason. Asking a sampler to INVENT a frame inside a
# thin band risks it drawing skin instead; asking it to harmonise one that exists
# cannot lose the shape. The ink is the plate's own darkest lineart, MEASURED at
# (0,0,0) inside the region rather than assumed, because colour does not travel.
#
# WHY GUARD B IS SAFE BY CONSTRUCTION, TWICE OVER. (1) His whole head is a declared
# --protect region [470,50,720,340] and pipeline/attribute_mask.py refuses (exit 5)
# to emit a mask that reaches it -- it reported 0 violations. (2) diffusers restores
# everything outside the mask every step via the latent-blend branch, so his pixels
# are never denoised. padding_mask_crop changes only RESOLUTION, never which pixels
# may change, so even a crop that overlapped him could not alter him.
#
# THE INIT IS A COMPOSITE, BUILT AND LOOKED AT BEFORE ANY GPU WAS INVOLVED. Its
# sha256 is asserted below and was verified ON THE BOX after transfer. The composite
# was checked byte-identical to the cast plate everywhere the ink is not.
#
# THE PLATE UNDER IT IS A DIAGNOSTIC RUNG. ep2-b05-cast-0817 is marked by its own
# lane as a plate no lane may promote to a shipping frame. This job inherits that:
# it is a MECHANISM sample, it never takes a canon filename, and it is not a
# candidate frame. Look, framing and cast are R4 and the founder's alone.
#
# THE GEOMETRY IS THE STEWARD'S. Lens centres, radii, bridge and temple were read
# off a coordinate grid over his face, not eyeballed and not invented by him. Every
# number is mine and is the first thing a correction should move.
#
# ONE SAMPLE, ONE SEED. The 4-of-5 adoption threshold comes AFTER this frame.

