# paragraph that fixed the blank backgrounds describes a horizon, distance and a treeline —
# and my own beat-17 chain proved that pulls the camera BACK. All three of these beats are
# CLOSE-UPS whose background is sky or soft light. Describing a meadow would fight the shot.
# So the near content is described instead, which is the same law applied correctly.
#
# THEIR TWO WARNINGS, both kept: the fig must be named ROUND or it drifts leafward over 121
# frames (their s0/s2 came back as leaves when `round` was dropped) — note this does NOT
# contradict the cold open, where `round` produced an apple, because there the model had to
# INVENT the fruit from words and here the plate already holds a fig, so the word only
# resists drift. And beat 21''s tilt is deliberately absent from the plate because a tilt is
# an ACTION and this stage owns actions.
#
# LENGTH: 121 frames on all three, which trims beat 18 from its 7 seconds. The measured
# length result is FACE-specific (clean at 73, destroyed at 145 on a close-up face) and says
# nothing about plants — so rather than assume either way on a first sample, all three run at
# the count with the most evidence behind it and length becomes a second question once the
# motion is known to work.
