  - |
    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b06-ipa-guardfair-0812"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/goblin-ipa-0812/out-b06-guardfair/*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
