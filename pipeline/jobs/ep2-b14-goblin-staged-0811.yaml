# applied SUBTRACTIVELY. Ungated on purpose; the fourteen `ep2-b*-goblin-wave1`
# specs keep their `gate:` keys and are untouched by this file.
#
# WHY THIS EXISTS AT ALL, given a sample already ran. Beat 04 was drawn tags-only
# at 12:37 on 2026-08-10 with `--goblin-def "green skin, tusks"` and he has never
# ruled on it. That string is not his. His sentence, 2026-08-10 ~12:15 and
# repeated 2026-08-11, is "he is just a simple green goblin, nothing complex";
# `green skin` is the one attribute he named and `tusks` is a word the steward
# bought for three tokens in r9. The taste ledger says so in its own words
# (`ep2-goblin-definition-0810`): "silence inside a question is not a verdict —
# `tusks_present` 4/4 in record 42 remains a RENDER FACT and not an approval",
# and "the correct next move on this sentence is to REMOVE terms, not to buy
# another tag with the remaining token headroom." Nobody has removed one yet.
# This job is that removal, on one beat, and it stops.
#
# THE ONE VARIABLE IS THE GOBLIN SLOT — and the beat, and that second difference
# is stated rather than hidden. Against the b04 sample this changes two things:
# the beat (04 -> 15) and the slot (`green skin, tusks` -> `green skin`). Two
# variables is a real weakness of this test and it is deliberate: re-running beat
# 04 would spend the sample re-confirming a beat whose frames already came back
# "plainly simple" on the steward's eye, while beat 15 is one of the two beats
# with a RECORDED goblin-look failure. Attribution is still readable because the
# failure mode being tested is a look, not a score: if beat 15 comes back a plain
# green goblin, the words route works on a medium shot; if it comes back the
# elongated grey-eyed skull again, the beat's own staging is implicated and the
# slot string is not the lever.
#
# WHY BEAT 15 AND NOT BEAT 02, WHICH IS THE LOUDER FAILURE. Beat 02's failure is
# real ("four different creatures... s2 is a small full-body quadrupedal lizard")
# but its lever is CLOSED, and closed by evidence from last night rather than by
# opinion. `ep2-b02-goblin-founderpick-observed-0810` conditioned beat 02 on the
# exact frame he picked and it came back WORSE — glowing red eyes, a colossal
# looming dome over a miniature landscape — and that record's own ruling is "DO
# NOT RE-RUN A REFERENCE SWAP AGAINST A DIFFERENTLY-FRAMED BEAT... Another
# reference will not fix beat 02." Beat 02 also has live lanes on it right now.
# Beat 15's recorded failure is squarely a goblin-look failure — "an elongated
# egg-shaped skull rather than his round one, and blank grey-white eyes... with
# no iris colour at all" — and it came from the IP-Adapter crossbeat, a mechanism
# this job does not use. The tags-only route has never been run on beat 15.
#
# NO IP-ADAPTER, NO REFERENCE IMAGE, AND THAT IS THE POINT. His pick
# (`review/SHEETS/src-goblin/04-the-footnote-ipa-r1-w015-s6.png`, sha256
# 48d02b11bb96d872db32c090fba8a2ff748ff74bfc240c89ae30863564d433d4) is
# deliberately NOT used here. Four beats of evidence (04, 20, 15, 02) say the
# adapter transfers COMPOSITION and not identity, and beat 15 is a medium
# two-shot — the framing band where it provably drifts. Feeding a face-filling
# reference into a medium shot is the experiment that already failed twice.
#
# THE COUNT TAG IS THE CORRECTED ONE AND IT IS NOT BEING RE-DERIVED HERE. The
# drafts file supplies `A small goblin boy, {{GOBLIN}}, solo` at the head of the
# sentence with `No girl, no child.` on the negative tail — the r8 form, verified
# by calling `_tag_from_clause` on every draft, expected value `1boy`. A bare
# `goblin` resolves to `1other`, the indeterminate-humanoid tag blamed for three
# rounds at 0/4. Confirmed byte-present in the box's own copy of
# `wave-drafts.yaml` (beat 15 block, line 210) before this spec was written.
#
# THE RISK THIS SAMPLE IS ACTUALLY BUYING, named up front so the result cannot be
# spun. Dropping `tusks` gives back the female skew it was bought to fight:
# `tusks` co-occurs male-to-female 1.92:1 and on `goblin` pictures takes the skew
# from 3.14 down to 1.59. The question this job answers in three minutes is
# whether the count-tag fix (`a small goblin boy` + `solo` + `No girl, no child.`
# on the SDXL negative, where the negative binds) carries not-female on its own,
# without spending tokens on an attribute he never asked for. If it does not,
# that is a finding and the tusks argument comes back to him as a real question
# instead of an assumption.
#
# TOKENS. This beat measured 65/77 positive with the slot at `green skin`, 12
# tokens of headroom, 73 negative. Removing `tusks` only widens that, so the
# style anchor — which compress() drops FIRST and silently — is not at risk.

