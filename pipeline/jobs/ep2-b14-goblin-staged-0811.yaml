# DURABILITY, same mechanism the wave specs use and for the same reason: every
# still this farm makes lands single-copy on a box nothing backs up. The courier
# already runs `git add -A -- farm-out` and force-pushes on every job_done, and
# farm-out is NOT gitignored — so publishing is a COPY, not a git command, and
# the runner stays byte-identical. A distinct destination directory keeps these
# four away from the gated wave's output namespace.
#
# allow_fail: a failed copy must never mark a good render failed.
- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b14-goblin-staged"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/wave-goblin-prep/out-b14-staged/14-the-defense-wave1-s*.*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        # Hash the COPY, not the original: what this records has to be the
        # bytes that get committed, or the manifest attests to the wrong file.
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
        print("   ", os.path.basename(f), h[:16])
    # shasum -c format, and newline="\n" is load-bearing: Windows text mode
    # rewrites \n to \r\n and every filename then carries a trailing \r that
    # shasum -c cannot open. Measured on this farm, not guessed.
    with open(os.path.join(dst, "ep2-b14-goblin-staged.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    # 4 stills + 4 sidecars. Fewer means the render wrote less than it promised.
    raise SystemExit(0 if len(src) == 8 else 1)

