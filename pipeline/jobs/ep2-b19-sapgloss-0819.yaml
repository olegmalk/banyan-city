consumer: 'THE RECIPE, not the beat. ep2-b19-sapcomp-0819 PASSED all eight clauses at strength 0.30 and
  fired exactly one pre-registered fail mode: FAIL-CRYSTAL on its GLOSS half. This measures where that
  gloss comes from. Beat 19''s plate does not need this job -- it already has a passing sample.'
success: ONE 832x1216 png at strength 0.22 instead of 0.30, byte-identical in every other argument --
  same init, same mask, same prompt, same negative, SAME SEED 20260819, same 40 steps, same cfg 7.5, same
  pad-crop 64, same blur 8. TWO QUESTIONS, and the first one outranks the second.
why: 'A MEASUREMENT, NOT A TASTE MOVE. Whether the fruit should be matte or glossy is R4 and is already
  a founder card raised by ep2-b18-canon-0817''s verdict; this job does not answer it and must not be
  read as presuming it. What it answers is a mechanical question that is useful WHICHEVER WAY he rules:
  does the specular arrive in the early steps or the late ones. If he wants matte, the answer names the
  lever. If he wants gloss, the answer explains where it comes from and stops a future lane from hunting
  it. int(40*0.22) = 8 denoising steps against 0.30''s 12, so this is a 4-step move -- chosen over 0.25
  (10 steps) because the knob is QUANTISED and a 2-step move risks measuring nothing. The card was idle
  and this job needed no human present.'
