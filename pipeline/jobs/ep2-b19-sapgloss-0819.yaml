# ep2-b19-sapgloss-0819 -- 2026-08-19, beat-19 composite lane, second rung.
#
# DERIVED FROM ep2-b19-sapcomp-0819 PROGRAMMATICALLY. One key changed in the whole
# file: --strength 0.30 -> 0.22. Same init sha, same mask sha, same prompt, same
# negative, SAME SEED, same 40 steps / cfg 7.5 / pad-crop 64 / blur 8, same
# inpainter, same publish. "One variable" is a fact about the file.
#
# WHAT THIS IS NOT: it is not a second attempt at beat 19's plate. That question
# is ANSWERED -- the parent passed all eight clauses of the plate bar. And it is
# not a move on matte-vs-gloss, which is R4 and already a founder card raised by
# ep2-b18-canon-0817's verdict. It is a MEASUREMENT of where the specular comes
# from, and the answer is useful whichever way the author rules.
#
# THE PREDICTION IS WRITTEN DOWN AND IT IS "NO CHANGE": strength sets where the
# schedule STARTS, not where it stops, so the final low-sigma steps -- the ones
# that add fine high-frequency detail like a specular -- run in BOTH renders.
# If that is right, the strength lever is dead for gloss and a post-pass is the
# only instrument left. Q1 (the geometry must survive) outranks the gloss question
# outright: a matte paste fails this job.
