bar:
  Q1_THE_GEOMETRY_MUST_SURVIVE_AND_THIS_CLAUSE_OUTRANKS_Q2: 'The eight clauses the 0.30 sample passed
    must STILL pass: one fig attached and clear of the ground, exactly two wide oval cotyledons on one
    rooted stem with one thin side-branch, no contact, face visible, purple reads purple, one adult figure,
    whole sapling and whole of him in frame -- AND the composite''s flat fill must still have COME BACK
    as cel line work. IF THIS CLAUSE FAILS THE JOB FAILS, whatever happened to the gloss. A matte paste
    is worse than a glossy drawing, and the 0.30 sample is not replaced by this one either way.'
  Q2_did_the_specular_reduce: 'Measured exactly as the parent measured it, on the same box, so the two
    numbers are comparable line for line: circular-mean hue and luminance min/mean/max on the fruit body,
    plus THE BRIGHTEST 2 PERCENT of its pixels averaged. At 0.30: hue 309 deg, luminance min 11 mean 126
    max 220, brightest 2 percent = 211 on a body whose composited source was matte (min 44, max 213, flat).
    A brightest-2-percent under 170 with the body luminance unchanged is a clear reduction; 170-200 is
    a PARTIAL and will be reported as a partial rather than rounded either way; over 200 is unchanged.'
  Q3_did_the_hue_move_back: The fig was COMPOSITED at 272 deg and the 0.30 sample returned 309. Beat 18's
    own plate measured 305 through a completely different instrument. If 0.22 returns something near 272
    the checkpoint's hue prior is a late-step effect; if it returns 305-310 again the prior is not reachable
    by this knob at all. Reported either way and NOT a pass/fail clause -- no hue is 'correct' until R4
    says so.
  how_scored: By eye at 1x and 3x against BOTH the committed composite and the 0.30 output, all three
    of which are in the repo. The numbers are filters; the read is the verdict.
failure_predicted_in_advance: 'Q2 COMES BACK UNCHANGED OR ONLY PARTIAL, and the mechanism is written down
  before the render so that a reduction would be a real surprise. STRENGTH SETS WHERE THE SCHEDULE STARTS,
  NOT WHERE IT STOPS. At strength s the sampler begins at the sigma corresponding to s and runs down to
  0, so THE FINAL LOW-SIGMA STEPS RUN IN BOTH RENDERS. A specular highlight is fine, high-frequency detail
  -- exactly what low-sigma steps add. If gloss is written in those last steps, cutting the schedule from
  12 steps to 8 removes the EARLY ones and leaves the gloss untouched. THAT WOULD BE THE USEFUL RESULT:
  it would kill the strength lever for gloss outright and leave the post-pass as the only remaining instrument,
  which is a smaller and cheaper conclusion than a sweep. The competing hypothesis, that gloss is a mid-sigma
  structural decision, is what a reduction would show.'
