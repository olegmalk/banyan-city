      - --root
      - C:\banyan-farm\banyan-city
      - --arm
      - B
      - --task
      - 001-b06-r6b-sky-0810
      - --queue-entry
      - ep1-b06-r6b-sky
      - --out
      - C:\banyan-farm\b06-r6\out

