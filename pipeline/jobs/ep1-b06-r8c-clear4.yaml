success: >-
  Two 832x1216 PNGs with sidecars in C:\banyan-farm\b06-r8\out-clear4, named
  06-too-blue-r8c-step4-s{0,1}.png, published to
  C:\banyan-farm\courier-box\farm-out\ep1-b06-r8c-clear4. Read against three
  things: is there visibly MORE open blue than in 06-too-blue-r7b-s0.png (the
