# ep1 beat 06 — HIS FRAME, REGENERATED WITH LESS CLOUD. Ladder step 4 of 5.
#
# THE VERDICT, VERBATIM (2026-08-10, ~17:40, then he left): "this one, now im
# gonna go, bye. but actually, regenerate it. too many clouds. you almost got
# it".
#
# WHAT IS SETTLED BY THAT SENTENCE, AND IS NOT REOPENED HERE. He was pointing at
# an ARM B frame, so the composition question is closed: sky, no ground. Arm A —
# the tall-grass reading — stops here; the one a-below sample already queued is
# the last of it. "You almost got it" is the other half of the instruction and
# it is a constraint, not a compliment: the framing, the low upward camera and
# the bright daylight palette are RIGHT, and nothing in this job touches them.
#
# WHICH FRAME HE MEANT, AND HOW THAT WAS ESTABLISHED — read this before trusting
# the seed. The four arm-B candidates were pulled off the box and looked at.
# 06-too-blue-r7b-s0.png is the only one matching the frame he was shown: cumulus
# banked across the top, both sides and the bottom, open blue reduced to narrow
# wedges at upper-left and centre-left, a faint rainbow streak right of centre
# and a lens-flare sun star. s1 is a single central tower with broad open blue,
# s2 keeps half the frame clear on the left, s3 puts its blue on the right. So
# the seed here is s0's, 20264725. THIS IS AN INFERENCE FROM A DESCRIPTION OF
# WHAT HE POINTED AT, not something he said, and it is written down as such: if
# it is wrong, the ladder is drawing the right fix on the wrong picture and the
# whole set should be re-run at the true seed. 20265725 (s1) rides along as the
# second seed so each step also shows what it does to a frame with a different
# cloud arrangement.
#
# WHY A LADDER AND NOT ONE GUESS. "Fewer clouds" is a dial, not a setting, and
# nobody has drawn this beat anywhere along it. He is gone and cannot look at a
# sample, so scaling one untested formulation to sixteen frames is exactly what
# the ONE SAMPLE rule forbids — that is how fifteen beats were once rendered on
# a recipe nobody had looked at. Stepping the axis instead is exploration, which
# is sanctioned: five formulations, one job each, two seeds each, so when he is
# back he picks a POINT ON THE DIAL rather than re-rejecting another guess.
# THE STEWARD PICKS NO POINT ON IT.
#
#   step 1             `clear sky` asked for, `cloud` still in the positive
#   step 2             + `overcast` negated
#   step 3             `cloud` OUT of the positive
#   step 4             + `sunny`
#   step 5             `cloud` negated outright — the far end, to bound the dial
#
# THIS JOB IS STEP 4: step 3 plus `sunny` — the open bright-daylight reading of the same frame,
# still without negating cloud outright.
#
# THE LEVER IS THE POSITIVE AND THE NEGATIVE IS BACKUP. `clear sky` is a real
# tag on this checkpoint's Danbooru-captioned vocabulary and it goes into the
# slot r7 deleted `scenery` from, so no other tag in the positive moves. The
# negative side carries `cloudy sky` underneath it. That reinforcement is worth
# having HERE because this path runs at guidance 7.5: at guidance 1.0 the
# negative is never evaluated at all and every suppression written into it is
# decoration. (That is the trap the LTX video jobs live with, not this one.)
#
# MEASURED ON THE BOX'S REAL CLIP BEFORE THIS FILE WAS WRITTEN — positive 33/77,
# negative recipe 74 -> sent 72/77, all 20 required negatives surviving the trim,
# traps 2 and 5 through 9 green:
#   POS  no humans, clear sky, sunny, sky, blue sky, day, sunlight, cinematic
#        lighting, detailed, newest, masterpiece, best quality, very aesthetic
#   NEG  photorealistic, 3d render, abstract, text, watermark, signature, low
#        quality, blurry, extra limbs, deformed, jpeg artifacts, leaf, plant,
#        stem, foliage, tree, photorealism, cityscape, city, building, skyline,
#        road, mountain, grass, field, horizon, ground, animal, bird, aircraft,
#        cloudy sky, overcast
#
# THE DRIVER. pipeline/render_b06r8.py over render_b06r7.py, so r7's nine traps
# still run on every frame — including trap 5 asserting this step's own new
# terms reached the model rather than being trimmed at 77, and trap 6 asserting
# the ground stays out. scp'd to the box and verified byte-identical to the repo
# copy before this spec was written (sha256 fa1d8f91...).
#
# NOTHING HERE IS A PICK, A PROMOTION, A PUBLICATION OR A SPEND.

id: ep1-b06-r8c-clear4
