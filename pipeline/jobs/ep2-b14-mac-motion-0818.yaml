    sheets was an artefact of the sheets'' own per-strip cell sizes and is retracted.'
  pale_limb_mass_check: 'PASS -- NO PALE LIMB-LIKE MASS. Checked deliberately, because this is the standing
    per-seed check that overrides everything else and because there IS a large pale cream oval at frame
    lower-left. IT IS HIS OWN LEFT KNEE in pale grey trousers, present in plate r1s1 in exactly that position,
    and it is still a knee at f121 where his forearm partly crosses it. Nothing flesh-coloured, rounded
    and unattached appears in any frame. So motion did not introduce the fault a clean plate did not have,
    which is what the check existed to catch.'
  what_this_settles: 'THE PREDICTION IN THIS SPEC WAS WRONG IN THE INTERESTING DIRECTION, and that is
    the finding. F1 FROZEN HANDS was named as the likely outcome on the strength of 0 of 8 in-hand actions
    against 12 of 12 whole-body. The hands were not frozen: they reached, planted and broke ground. What
    that actually shows is that BEAT 14''S ACTION DECOMPOSES, and the two halves behave exactly as the
    12-of-12 / 0-of-8 split predicts once they are told apart. Reaching an arm down to the ground is GROSS
    WHOLE-BODY motion and it rendered. Picking repeatedly at dirt with the fingers is fine in-hand action
    and it did not -- the hands arrive and then hold. The 0-of-8 record is not contradicted; it is sharpened,
    and "the engine cannot do this beat" is too coarse a claim to keep making.'
  what_this_does_not_settle: 'ONE SEED. Whether the frozen 80-frame head is a property of the recipe, the
    plate or the seed is untested, and no second seed was fired. Whether the sullen read is fixable by
    wording, by plate or not at all is a taste question and an authorship one, not this lane''s.'
  for_the_beats_owner: 'THREE THINGS, none of them decisions this lane takes. (1) The gap to done_when
    is now TWO named clauses -- the glance must return, and the face must read embarrassed rather than
