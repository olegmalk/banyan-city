# glancing. Both clauses of `done_when` are therefore things THIS CLIP has to
# deliver, not things the plate hands it. That is the honest statement of what
# is being asked, and the bar below is written against it.
#
# ============================================================================
# THE ODDS, STATED BEFORE THE RENDER AND NOT AFTER
# ============================================================================
