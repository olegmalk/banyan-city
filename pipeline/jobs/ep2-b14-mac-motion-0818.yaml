#        not relative to the frame, so a camera move cannot score as an action.
#     M2 THE GLANCE. His head lifts and turns off the ground at least once and
#        comes back. Not a drift: a distinguishable look away and return.
#     M3 EMBARRASSMENT READABLE. Taken together M1 and M2 read as a man caught
#        out and covering for it, not as a man searching the ground for a
#        dropped object. This clause is the beat's own word and it is
