    THE CLIP IS BADLY SHAPED FOR A CUT even setting the bar aside: 80 of its 121 frames are frozen, so
    only the last ~40 carry anything, and a trim to the f085-f121 window is the obvious first edit. (3)
    The sullen read has now appeared on two different seeds of this beat, so it should be treated as a
    staging property.'
  not_done_on_purpose: 'ONE SAMPLE, ONE SEED. No sweep, no second seed, no wording variant, no re-plate,
