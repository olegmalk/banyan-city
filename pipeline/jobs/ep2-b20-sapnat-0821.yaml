  founder''s own 08-17 canon ruling; his card /review/ep2-b16-leaf-0820 stays open and `licence` is still
  his to take.'
script_line: 'EVIDENCE -- ''crouches back down, picks the fig up with both hands, and looks from it to
  the sapling''s thinnest branch beside him''. Line: ''...Did you just ANSWER me?'' Awe. The episode''s
  turn.'
bar: "JUDGED BY EYE AT 1:1, AND THE QUESTION IS NARROW.\n\n  P1  THE OBJECT IS DRAWN, NOT PASTED. The\
  \ two leaves and the stem carry cel\n      shading and the plate's own ink line weight. The flat vector\
  \ fill and\n      the hard cut edge the compositor left are gone.\n  P2  IT HAS NOT MOVED. Stem root,\
  \ height and leaf tips sit where the\n      compositor put them, within a few px. 0.30 finishes a structure;\
  \ if the\n      plant has relocated, the strength was wrong and the number is the fix.\n  P3  EXACTLY\
  \ TWO LEAVES ON ONE STEM. Canon sapling-two-leaves. Three leaves,\n      leaflets, a branching stem\
  \ or a second plant is a FAIL.\n  P4  HE SURVIVES UNCHANGED. Face, ears, skin colour, wardrobe and pose\
  \ are\n      the canon plate's, untouched. The mask is local and the pass must not\n      have reached\
  \ him.\n  P5  IT SITS IN THE GRASS. Contact where it meets the ground, no floating\n      stem, no halo\
  \ of untouched pixels around the masked region.\n\nA FAIL on P2 or P4 kills the plate. A FAIL on P1\
  \ alone is a strength question\nand is worth one more round; a FAIL on P3 is a wording question. Two\
  \ rounds is\nthe budget, and after that the beat goes to the founder as it stands."
failure_predicted_in_advance: 'TWO, AND THEY ARE FILED BEFORE THE PIXELS. FIRST, THE BIG-LEAF DEGENERATE:
  the b16 rung named it -- the pass draws two enormous leaves that fill the crop, and detail inside the
  region FALLS while looking busier. If that fires here it will look like an improvement in a thumbnail
  and a failure at 1:1, so P1 is judged at full size. SECOND, AND SPECIFIC TO THESE THREE: the mask lies
  over or beside the FIGURE here, where on b16 the plate was person-free by construction. A mask that
  clips his arm (b02), his chest (b03) or his hand (b20) hands 0.30 a licence to redraw part of him. That
  is what the dry step exists to catch, and it is why P4 is a killing bar rather than a note.'
init_provenance: farm-out/ep2-b20-sapnat-0821/b20-sapnat-in-0821.png, 832x1216, sha256 3ae6c49bfece8c6dd2b0659c1c9d9b1c82231cc2d2cc2213bb1fc4dd63b7de3e,
  with its mask b20-sapnat-in-mask-0821.png sha256 7206bb1342a2fa7cd43e98493edf5b247734c256f76203c609a36db1b9cef5c3.
  Both are committed on origin/main -- fetch_init.py pulls them by raw URL and refuses on any sha mismatch,
  so an edited composite stops the job rather than quietly naturalising a different picture. The composite
  was drawn onto beat 20's canon w2 plate, which is the same plate the failed motion take used, so the
  ONLY difference between the old init and the new one is the object the script names.
not_done_on_purpose: 'NO MOTION IS RENDERED BY THIS JOB and no motion spec is filed by it. The re-derived
  i2v rung for this beat waits on a human opening this png, because the entire premise of the fix is that
  a plate must CONTAIN the object before a prompt may name it -- filing the motion job in the same breath
  would be asserting the plate passed before anyone looked. Beat 07 is also absent: it needs a second
  FIGURE, which is a two-figure skeleton route and not a masked plant composite.'
the_one_variable: 'THE INIT. Every sampler number is the b16 rung''s by copy: 40 steps, cfg 7.5, strength
  0.30, pad-crop 64, blur 8, seed 20260820, the whole inpaint_fruit.py payload, the env block, the needs,
  the dry-run-before-any-model gate and the no-glob publish. The prompt and negative change because they
  describe a different beat, and the fetch changes because it names different files. Beat 20 additionally
  strikes `fruit` from the negative, because the canon purple fig is in that plate and the pad-crop can
  reach it.


  ONE CARRIED VALUE WAS NOT SAFE TO CARRY, and it is recorded rather than quietly kept: the parent''s
  negative measures 84 CLIP tokens against a ceiling of 77. The overflow is silent and drops from the
  tail, so as filed the b16 rung banned nothing from `chibi` onward. It is trimmed to 60 tokens here by
  removing only terms another term already covers -- see the comment on NEGATIVE_BASE in the deriver.
  This is a fix to an unrunnable inheritance, not a second variable.'
