consumer: 'THE INIT FOR BEAT 20''S RE-DERIVED MOTION SPEC, and nothing else until then. Named consumer:
  the canon-motion lane, which cannot file beat 20''s next i2v rung until a plate exists that contains
  the sapling''s thinnest branch beside him -- because the wave proved that naming it in the prompt alone
  re-frames the shot. Nothing in review/ep2-ship-0821 reads this file, and no cut changes because it landed.'
success: 'ONE 832x1216 png in which the sapling''s thinnest branch beside him IS DRAWN INTO THE PLATE
  AND HAS NOT MOVED, judged by eye at 1:1 and not by a metric. P1 the stem and both leaves carry cel shading
  and the plate''s ink line weight, not the compositor''s flat fill; P2 root, height and leaf tips are
  within a few px of where they were composited; P3 exactly two leaves on one stem; P4 the goblin''s face,
  ears, skin colour, wardrobe and pose are the canon plate''s, untouched -- the mask is local and the
  pass must not reach him; P5 the stem makes contact with the grass, with no floating base and no halo
  of untouched pixels at the mask edge. The named degenerate outcome is a RELOCATED or REGROWN plant:
  if 0.30 has moved it or given it a third leaf, this plate is a FAIL and the fix is the number or the
  wording, not another seed.'
why: 'BEAT 20''S MOTION FAILED PLATE-SIDE, AND THIS DRAWS THE MISSING OBJECT INTO THE PLATE INSTEAD OF
  REWORDING THE PROMPT AT IT.


  The canon-motion verdict for this beat reads, in its own spec: the branch the action names is absent,
  so it entered on its own at top right from ~f048 and the frame drifted to accommodate it. That is one
  instance of a law the wave measured four times -- a prompt naming an object ABSENT from the init makes
  the model build the object and pull the camera back hunting for it, while the three beats whose prompts
  ask only for motion the plate has a body for (04, 08, 13) all held their frame. So the lever is the
  init.


  WHAT THIS JOB DOES: takes the canon w2 plate for beat 20 with the sapling''s thinnest branch beside
  him already composited in by hand, and runs the b16 rung''s 0.30 masked i2i over the drawn region ONLY,
  so the object comes back drawn in the plate''s dialect without moving. The stem stands clear of him
  at frame right, its two leaves at about his eye line -- ''the branch beside him'', a thing he can turn
  his head to. It does not cross his body, because the beat needs a LOOK from the fig to the branch and
  both have to be separately findable. THE FIG WAS ALSO RECOLOURED TO CANON PURPLE in this composite by
  pipeline/beat20_fig_recolor.py: the motion verdict caught it yellow-green where canon has it purple,
  ''the same fault in a new colour, carried by the plate''.


  WHAT IT DOES NOT DO: it does not touch the cut, it does not re-render any motion, and it does not change
  a single sampler number. The motion re-derive is a separate spec that may only be filed once a human
  has looked at this png.'
