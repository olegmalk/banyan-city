# to go." became "The scavenger pushes himself up, gives his cloak a shake, and turns
# to go." (node.md:108, superseded line kept struck through beneath it). The restage
# was justified by measurement -- 8/8 STAND, 8/8 TURN, 0/8 BRUSH across eight seeds --
# but NOTHING HAS BEEN RENDERED AGAINST THE NEW LINE. Beat 17 therefore has no take
# that matches canon, and that is what this job fixes.
#
