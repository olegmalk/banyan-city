success: A 704x1280 mp4, 97 frames at 24fps, opening on the WIDE full-body init (sha 74e8eccf, the plate
  that drove 8 of 8 stand-and-turn). PASS is S1+S2+S3 together, with S2 the only clause genuinely in
  doubt.
done_when: 'PRE-REGISTERED BEFORE THE RENDER EXISTS. Beat 17''s done_when in review/ep2-picks/done-definitions.yaml
  reads ''stand, brush, turn -- a departure'', and the 0818 correction supersedes `brush` FOR RENDERING
  while defining no replacement clause. So the shake clause is written here, now, and it is written
  tight enough that it cannot be satisfied by the standing motion alone.

  S1 STAND: he goes from seated in the grass to upright on his feet, continuously, followable across
  consecutive frames. Expected to pass -- this init is 8 of 8 on it -- and a pass here is NOT news.

  S2 SHAKE (THE LOAD-BEARING CLAUSE): the cloak FABRIC moves as fabric, distinctly from the body that
  wears it. To pass, the cloak must show, in a window of consecutive frames, a displacement of its hem
  or a fold that REVERSES DIRECTION at least once -- out and back, the shape of a shake -- of at least
  one fold-width, while the torso is not itself translating by that amount in the same direction. Cloth
  that merely trails the body as he rises or swings once as he turns is NOT a shake and is scored F2,
  not a partial pass. Read by opening consecutive frames, never by a single diff number.

  S3 TURN: he turns away from the sapling toward the open field. His face leaving the lens is BY DESIGN
  here -- done-definitions records that this is the one beat where turning away IS the action -- so
  it is not a staging-law violation and must not be scored as one.

  Pre-registered FAIL modes: F1 FROZEN (no whole-body motion; measure it, do not eyeball it). F2 STAND-ONLY
  (S1 and S3 happen, the cloak never shakes -- the expected failure if the engine treats a shake the
  way it treated the brush; this is a FAIL, not a partial pass, and it is the informative outcome).
  F3 SCENE BREAK or a second figure or any extra face. F4 MORPH or TELEPORT. F5 CAMERA MOVE (frame edges
  or horizon translating). F6 STYLE BREAK to photoreal/3D.

  NOT SCORED: whether the take is beautiful, whether it ships, and the amber grade -- all R4. Also not
  scored: any brush. `brushes off` is superseded for rendering and no take may be failed for lacking
  a brush stroke.'
why: 'The restaged line has never been tested, so beat 17 currently has NO take that matches canon.
  This is the cheapest possible test of it: the plate already exists and is verified in bytes, the recipe
  is the one already proven on this beat, and the only new thing is the wording. Eleven minutes on the
  local card, $0, no new checkpoint, no sweep, ONE seed.

  It is also a real experiment rather than a formality. The 0-of-8 brush finding says this engine will
  not render a fine hand action against cloth. The restage bet is that a SHAKE is whole-body motion,
  which the engine renders at 12 of 12. S2 is written to tell those two apart: if the cloak only trails
  his body, the bet was wrong and the restage bought nothing, and that is worth knowing before the beat
  is staged a third time.'
