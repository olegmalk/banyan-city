# founder's one-sample rule. Everything else is deliberately held constant:
#   * the init is the WIDE full-body plate, sha 74e8eccf, asserted in bytes by
#     cover_crop.py before a single pixel is generated -- the same plate that drove
#     8 of 8 stand-and-turn, so S1 and S3 are near-certain and are NOT the question;
#   * the recipe is byte-for-byte the one already proven on this beat (97f, 704x1280,
#     guidance 2.0, distilled sigmas, two-stage, crf 33, sequential offload), cloned
#     from ep2-b17-amp2-armsup-0816 rather than retyped;
#   * ONE seed. Reseeding an unwatched wording is what retired four levers on
#     2026-08-16.
#
# THE BAR IS WRITTEN BELOW, BEFORE THE RENDER, and its S2 clause is deliberately hard
# to satisfy by accident: cloth that merely trails him as he stands is not a shake.
# The restage's whole bet is that a shake is whole-body motion where a brush was fine
# hand action. S2 is the clause that collects on that bet or calls it.
#
# $0. Local card, no provider, nothing spends.
