# `authored_staged_med` said `dives behind a tiny sapling` and `his face visible
# past its thin stem`. Both name the relation as an ACTION or an ABSTRACTION,
# and neither says which body is in FRONT of which in the picture:
#   * a still cannot show a dive, so `dives` gives the model a pose it must
#     invent — and the poses it invents put the two bodies side by side;
#   * `behind` inside a verb phrase is a direction of TRAVEL, not a depth order;
#   * `dives behind <object>` is a contact reading, which is where "he grabs the
#     sapling" comes from. He is describing exactly what the words asked for.
#
# THE ONE VARIABLE IS THE STAGING LINE. `--variant authored_staged_med_occl` is
# `authored_staged_med` with the action clause rewritten as OCCLUSION IN DEPTH
# ORDER — `crouches in an open field behind a tiny sapling, its thin stem in
# front of him, half hidden behind the stem, his face peeking around it` — and
# NOTHING else: same beat, same four seeds, same steps and guidance, same
# harness, same `green skin` slot, same `medium shot`, same `from front`, same
# style anchor. `crouches` for `dives` is inside that one variable and is stated
# plainly because it has a cost: it trades the sprint's motion for a pose a still
# can hold. The joke he is judging is the COVER, not the run.
#
# THE FIELD IS ANCHORED AFFIRMATIVELY AND SPENDS NO NEGATIVE BUDGET. `in an open
# field` replaces `rooted in the grass`. His beat-02 sentence names no setting
# fault — the house drift he flagged is on beats 03 and 04 — so this beat buys no
# `no house` terms it does not need, and beat 02 has never come back indoors.
#
# CHARACTER CONSISTENCY IS NOT ADDRESSED HERE AND THAT IS DELIBERATE. His second
# clause ("needs more improvement as well") is about drift in FEATURES ACROSS
# SEEDS. No adjective fixes sameness — the ledger's own scoring says every axis
# it has scores ONE frame — and the only route that ever held identity across
# seeds is the IP-Adapter route he has now turned down twice. The slot stays at
# `green skin`, the string he ratified at ~15:45 today, unchanged. One variable
# per round, and this round's variable is the staging.
#
# MEASURED ON THE BOX, NOT GUESSED — AND THE FIRST DRAFT OF THIS PROMPT FAILED
