# DURABILITY, unchanged from the wave specs and for the same reason: the
# courier already commits farm-out and force-pushes on every job_done
# (box_runner.py:486-506), so publishing is a COPY and touches no runner code
# and no credentials. allow_fail because a failed copy must never mark a good
# render failed.
- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b04-goblin-ipa"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/goblin-ipa-0810/out/*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        # Hash the COPY: what this records has to be the bytes that get
        # committed, or the manifest attests to the wrong file.
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b04-goblin-ipa.sha256"), "w") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    # 24 stills + 24 sidecars + identity-agreement.yaml.
    raise SystemExit(0 if len(src) == 49 else 1)

