# 002b beat 04 — ONE SAMPLE of a CONSISTENCY MECHANISM. Not a wave, not a
# pick sheet, and not a second opinion on what a goblin is.
#
# THE DEFECT. Commit 406909c, on the wave-1 sample: "green four times, tusked
# three times, and four different creatures." Green and tusks are prompt-level
# attributes and the prompt delivered them. Identity is not a prompt-level
# attribute — under text conditioning alone the seed picks the creature, so
# four seeds picked four creatures. A fifteen-beat wave whose goblin is a
# different animal each beat is broken whatever anyone's taste says, so this
# job is a technical fix and carries no `gate:`: it is not waiting on a verdict
# because it is not asking for one.
#
# THE ONE VARIABLE. Same beat, same four seeds (20260723/20261723/20262723/
# 20263723), same prompt string built by the same render_wave_goblin.check()
# from the same wave-drafts.yaml, same `green skin, tusks`, same 40 steps, 7.5
# guidance, 832x1216 and same negative — all of it verified identical to the
# wave-1 sidecars by a dry run before this spec was written (69 positive tokens
# on the box's real CLIP tokenizer, matching 04-the-footnote-wave1-s0.yaml).
# What changes is that the UNet also sees an image, through IP-Adapter Plus.
#
# WHY THIS MECHANISM AND NOT MORE TAGS. The obvious consistency fix is a longer,
# more specified character description, and it costs two things this project
# cannot pay. Tokens: beat 08 of this wave has 9 of headroom, and compress()
# drops TRAILING sentences, so an overrun returns unstyled rather than short.
# And the founder's own constraint — "nothing complex" — is an instruction
# AGAINST elaboration, so the tag fix argues with him. IP-Adapter adds zero
# prompt tokens and adds no words to the character at all.
#
# NOTHING IS DOWNLOADED AND NOTHING IS PICKED. Both IP-Adapter files
# (sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors and models/image_encoder)
# were already in the box HF cache; h94/IP-Adapter is Apache-2.0. IP-Adapter
# FaceID was REJECTED on licence, not on fit: it is released "exclusively for
# research purposes and is not intended for commercial use" because InsightFace
# is non-commercial — the same trap as Depth-Anything-V2 Base's cc-by-nc-4.0.
# The reference image is one of the four wave-1 frames and ALL FOUR are used in
# turn, so no frame is anointed; choosing the goblin is R4's and this job does
# not do it.

id: ep2-b04-goblin-ipa
task: ep2-b04-goblin-ipa-0810
node: 002b-first-citizen
beat: 4
runner: box
needs_gpu: true
priority: 40
max_attempts: 1
owner: goblin-consistency lane

consumer: >-
  The decision about how episode 2 gets a goblin who is the same character in
  all fifteen beats. Wave-1 answered "he is green and he has tusks" and left
  the wave unshippable; until a mechanism is measured, every one of the
  fourteen staged specs would render a fifteenth different creature. The output
  of this job is a number and a contact sheet the founder can look at, not a
  candidate he is asked to rank.

success: >-
  24 PNGs at C:\banyan-farm\goblin-ipa-0810\out (6 cells x 4 seeds), each with
  its .yaml provenance sidecar written at render time (7.2), plus
  identity-agreement.yaml carrying mean pairwise DINOv2 and CLIP-I agreement
  for the wave-1 baseline and for every cell. The job succeeds by producing the
  measurement, INCLUDING a measurement that says the mechanism failed — a low
  number here is a result, not a failed job.

why: >-
  One variable against the wave-1 sample: the conditioning. The headline arm is
  all four references at scale 0.6 (the diffusers docs put 0.5 at "balanced
  between the text and image prompt"); a 0.4/0.8 sweep on one reference follows
  so the knob is measured rather than asserted. Sequential, one image at a
  time — batch-of-4 configs are banned on this card.

