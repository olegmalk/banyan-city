not_done_on_purpose: NO SECOND SEED. The shipped take's own record says its seedB raised the board like
  a shield instead of reading it, and that a one-seed pick is not a confirmation. A second seed is the
  right next job and it is NOT filed with this one, because firing two seeds before anyone has looked
  at either is how a recipe gets scaled on an unapproved result.
the_one_variable: 'THERE IS NO ONE VARIABLE AND SAYING SO IS THE HONEST FILING. Beat 06 has no motion
  parent -- zero clips off any modern plate -- so the LTX chain is taken WHOLE from ep2-b12-tightB-0813
  (crop, encode, render, publish; 121 frames, 24 fps, 704x1280; guidance, seed and driver untouched) and
  three things are authored: the init, the positive and the negative. That is a first sample on a beat
  with nothing under it, not a rung on a ladder, and it is filed as one.'
