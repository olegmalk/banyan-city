why: 'BEAT 06''S SECOND FAULT BECOMES ASKABLE TODAY.


  Fault one is the board''s size and it was answered this morning: ep2-b06-boardnat-r3-0822 has a hand-sized
  slab of bark drawn into the plate at 160x115 px and settled in at 0.45, held in both hands at chest
  height by the man the founder picked, on a plate rendered with NO reference image and NO board net --
  the ControlNet route for this object was closed at three rungs this morning after returning, in order,
  a glowing ball, a plank standing on the ground and a lit panel that ate the figure.


  Fault two is that 4.54 s of a 6.46 s slot is ONE FROZEN FRAME, the biggest ratio in the episode, 59
  of 107 frame pairs bit-identical. It has never been askable, because the beat''s action is ''turns the
  bark board over and reads off it'' and no plate has ever contained a board. The init contains one now,
  so the sentence is description and not summons -- and the selftest asserts the init before the wording
  is allowed, because that assertion is the whole licence.


  THE ACTION CARRIES THE COUNT FINDING and this is its first application since the rung that produced
  it: a countable action fills the runtime, an instruction to go slowly does not, and a counted repeat
  only works when the action can actually happen twice. A fingertip running down a board can. $0, ~5 GPU
  minutes.'
