script_line: 'Beat 06 THE CLIPBOARD: the guard turns the bark board over and reads it. Node 002b-first-citizen,
  live script 002b-t0-c, approved_by founder 2026-08-03.'
bar: 'BEAT 06''S OWN done_when, WHICH IS: ''the guard turns the bark board over and reads off it; board
  hand-sized and readable; field present at frame one; no white burst at the head of the clip.'' PRE-REGISTERED:
  (1) THE BOARD IS IN THE FIRST FRAME AND IT IS HAND-SIZED. It is in the init, so it should be; the thing
  being tested is whether it STAYS that size for 121 frames. The beat''s whole history is the prop inflating
  -- if it grows into a shield or a sign this is a FAIL, and it is the most likely one. (2) HE TURNS IT
  AND READS OFF IT. A turn, then a read at chest height with the head down. Raising it in front of his
  face is beat 10''s move and a FAIL here -- the second seed of the shipped take did exactly that. (3)
  THE CLIP IS NOT A FROZEN FRAME. The take in the cut is 59 of 107 frame pairs bit-identical and 4.54
  s of held picture; this rung exists to answer that, and the measurement is the share of frame pairs
  under 0.5 mean interframe difference at 176x320, the same instrument the 08-22 wave used. The counted
  read is the lever and the number is the score. (4) THE FIELD IS PRESENT AT FRAME ONE and there is no
  white burst. The init is a finished daylit field, so a white head would be a new fault. (5) ONE MAN,
  and he is the man in the plate to the last frame -- dark cropped hair, round wire-rim glasses, cream
  shirt. PRE-REGISTERED FAIL MODES. THE PROP INFLATES, which is this beat''s oldest fault and which no
  wording has ever held; if it fires on an init that CONTAINS a correctly sized board, that is a much
  stronger result than another wording failure and it says the composite route does not protect scale
  through motion. THE COUNT DOES NOTHING, which would narrow the 08-22 count finding again: a fingertip
  down a board is the same shape as beat 17''s brush, so if it fails here the rule is smaller than ''an
  action with a natural cycle''. THE BOARD DISSOLVES -- a composited object has been shown to MOVE (beat
  19''s fig fell) and to KEEP ITS SHAPE (beat 12''s leaves held 121 frames), but neither of those was
  a made object with a flat readable face. And THE HANDS, which are directly under the board and which
  every i2v pass in this tree finds difficult.'
failure_predicted_in_advance: 'See `bar`. The one worth repeating here because it decides what the next
  rung is: IF THE PROP INFLATES OFF AN INIT THAT CONTAINS A CORRECTLY SIZED BOARD, the composite route
  does not protect scale through motion, and that is a bigger and more useful finding than another wording
  failure would be.'
