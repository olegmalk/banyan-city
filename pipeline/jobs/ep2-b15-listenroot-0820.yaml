  touch. SUPERSESSION NOTE, because a reader will find the other sentence: pipeline/jobs/ep2-b15-macplate-publish-0819.yaml
  says the beat-15 6 gate is LIVE. It was, when that spec was written on the morning of 08-19; the approval
  landed later the same day.'
script_line: 'Beat 15 GOOD LISTENER (1:10-1:15), node.md:98 as rewritten 2026-08-17 and READ AND APPROVED
  BY THE FOUNDER 2026-08-19: "He tips his head down and sideways until his eyes are level with the two
  leaves, and talks to them from a hand''s width away; both of them share the frame." His spoken line
  in the beat is "You''re a good listener. The last three people I talked to filed a report." -- so a
  MOVING MOUTH is correct here, unlike beat 04.'
bar:
  H1_THE_PLANT_IS_STILL_ROOTED_IN_THE_LAST_FRAME: 'THE FAILED CLAUSE AND THE ONLY REASON THIS RUNG EXISTS.
    At f105 and f120, read at 2x on the plant region: the stem runs down into the grass and no hand is
    on it. Rung 2 is the control and it is a precise one -- it passed this at f090 and failed it at f105,
    so the whole question is the last sixth of the clip. A clip that holds to f090 and loses it again
    is a FAIL and the finding would be that the pick-up is not prompt-driven at all but something the
    engine does to a small object near a hand, after which the next rung is mechanical.'
  H2_NOTHING_IS_BOUGHT_FROM_THE_PERFORMANCE: 'Rung 2''s own numbers are the floor, because rung 2 is the
    control and it cost nothing: FREEZE none, and HOLD strength at or below 0.60 (rung 2 read 0.508; its
    frozen beat-03 sibling read 0.958 with a 33-frame dead tail). A rung 3 that fixes the plant by stilling
    the clip has traded the one clean result in this family for the one broken clause, and is a FAIL.'
  H3_the_beat_still_reads_and_he_stays_seated: 'Carried from rung 2, which passed both: he is sitting
    in the grass at f120, and his mouth is open and moving at f030/f060/f090. A regression on either is
    attributable to the one sentence.'
not_done_on_purpose: 'NO recipe change -- size, frames, fps, guidance, distilled sigmas, two-stage, offload,
  mode and --image-crf 10 are the b14 crf-10 parent''s, three rungs deep now. NO new init, NO new sha,
  NO new anchor. NO new seed: 20260820 for the third time, so rungs 1 and 2 are both true controls. NO
  change to the NEGATIVE, unchanged since rung 1 -- it named `standing up` and `walking out of frame`
  and failed, and leaving it in place is what keeps every rung a test of the positive. NO plate work:
  beat 13''s plate-exposure rung is deferred to what H4 says here. No pick, no plate_ack, no cut, no publication.'
pre_registered_fail_modes:
- 'F-STILL-FROZEN / F-STILL-DAMPED -- the middle placement does not restore motion, in which case the
  finding is that terminal conditioning saturates regardless of aspect and the next rung is mechanical:
  a shorter render, since 121 frames is the whole slot and a 73-frame clip has no dead tail to fill.'
- F-POSITION-GIVEN-BACK -- motion returns and he stands up or leaves again, i.e. the middle placement
  dilutes the terminal one. That would be a real finding about how much a single prompt can place at once.
- F-PLANT-PICKED-UP -- beat 15's failed clause; re-checked on all three, since beats 03 and 13 have now
  held their plants across two rungs each.
- F-MIDDLE-IS-A-CUT -- `HALFWAY THROUGH THE SHOT` is read as a shot change rather than as a moment. The
  negative already carries `cut to another shot, scene change, shot change`, which by this ladder's own
  law is not protection; named so it is a finding and not a surprise.
- F-IDENTITY-DRIFT -- held on all six clips so far; a regression would be attributable to the clause.
rung_2_the_control: 'ep2-b15-listenlast-0820: FAIL at the last frame and the best clip of six. Rooted
  to f090 (85 frames better than rung 1), never stands, talks throughout, FREEZE none, HOLD strength 0.508
  -- the loosest of all six. Then his hand closes on the stem at f105 and at f120 the plant is out of
  the ground.'
skin_probe:
  box_xyxy_in_the_704x1280_init:
  - 302
  - 408
  - 356
  - 448
  placed_on: his left cheek, below the spectacle rim and above the cloak collar -- SKIN, not cloth, chosen
    by eye at 5x on the real cropped init and not by any colour rule
  f000_reading: R 67.9 G 114.6 B 50.3, R-B 17.6, luma 93.3 (std 20.3)
  how_to_read_it: Re-measure the same box on f120 and publish R, G, B, R-B and luma beside these. A green-skinned
    figure on a green field is exactly the case where one scalar decides nothing, so the whole triple
    is published and the verdict is written by eye against it.
  carried_verbatim_from: 'ep2-b15-listenlast-0820.yaml, and through it from the rung-1 spec where the
    box was placed by eye at 5x before any of these frames existed. Every rung renders the same init at
    the same sha, anchor and 704x1280 crop, so the box lands on the same skin. Copied byte for byte and
    labelled rather than re-placed: re-placing a probe after the frames exist is choosing the number.'
the_one_variable: 'THE FINAL SENTENCE OF THE ACTION CLAUSE, and nothing else. `Nobody touches the plant
  and nobody picks it up.` becomes a statement of what IS: the stem stays in the ground, rising out of
  the grass, rooted in the last frame as in the first. NO PLANT-TOUCHING NOUN SURVIVES ANYWHERE IN THE
  PROMPT -- no `touch`, no `pick`, no `hand` in the same sentence as the plant. His hands are still placed,
  on his knees, because that placement held for 105 frames in rung 2 and is not what failed. The ongoing-action
  terminal sentence is rung 2''s, unchanged, because it is the one thing in this family that bought position
  for free.'
