failure_predicted_in_advance: 'FAIL-PASTE IS NAMED AS THE MOST LIKELY OUTCOME HERE, and it is a DIFFERENT
  prediction from the parent job''s, on a measurement rather than a hunch. Beat 19''s spec predicted FAIL-MATERIAL
  from composite-init-pattern.md 9''s plate dependence and it did not fire. What is different about this
  init is its SIZE: the drawn footprint is 8540 px inside a 42792 px mask (4.23% of frame) against beat
  19''s drawn plant inside a 172847 px mask (17.08%), and the drawn structures here are THIN -- a stem
  7.0 px at the root tapering to 2.1 px, and two blades 43x25 px. padding_mask_crop=64 upscales the crop,
  which is the countermeasure and the reason this is a prediction and not a refusal. But 12 of 40 steps
  over a small thin structure is the least conversion pressure any composite in this repo has been given,
  so ''the drawing comes back unconverted'' is the honest expectation. If it fires, the named lever is
  the parent''s own knob in the other direction -- strength 0.30 -> 0.40, which is ONE SAMPLE and no new
  code -- and NOT a wording, because the wording ladder on this beat is closed at two rungs.'
