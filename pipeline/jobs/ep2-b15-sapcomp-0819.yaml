pre_registered_fail_modes:
  FAIL-PASTE: the drawn shapes come back unconverted -- same flat fill, same uniform outline, no cel line
    work, no drawn vein or midrib. The 0.30-too-low direction, and the outcome named most likely above.
  FAIL-SHAPE: 'the sampler re-invents inside the mask: the stem splits, a blade is chewed or lance-tipped,
    the joint grows a third stub. The 0.30-too-high direction, which beat 10 hit at 0.45 by reading its
    own deepest composited line as an object boundary. The petiole/midrib here is capped at the plate''s
    own outline step (213.9 -> 45.1) precisely to deny that.'
  FAIL-COUNT: a leaf count other than exactly two, or a second stalk. THE AXIS TWO WORDINGS ALREADY FAILED
    -- r1 five blades on three nodes, r2 unmoved -- so this is the clause the whole rung exists for.
  FAIL-NODE: 'leaves reappear at a SECOND node on the bare stem. Distinct from FAIL-COUNT: the count can
    be right at the top and the stem still grow a lower pair, which is exactly how r1 failed.'
  FAIL-TIP-BALL: 'a bud, ball or fruit appears at the stem tip or hanging off it. Named because the init
    under all six of this beat''s motion takes was a weed topped with a WHITE SPHERE, so it is this checkpoint''s
    demonstrated prior on this beat -- and because continuity genuinely wants a fig here (THE-SAPLING.md
    gives 002b ''two leaves + one thin side-branch'' and the fig does not leave the plant until beat 19).
    It is still a FAIL: the fig is a SECOND VARIABLE and frozen canon belonging to the fig lane, and beat
    15''s own P3 scores a bud at the tip as a fail. Flagged in the composite''s sidecar rather than smuggled
    in.'
  FAIL-VACANCY: 'a new noun grows where the weed was removed. composite-init-pattern.md 6: ''an emptied
    region is a hole the model fills with the largest available noun, and the negative does not reach
    it.'' 21377 px were clone-filled from the plate''s own field with 0 px left without a source, so a
    firing here means the law reaches further than the fill.'
  FAIL-FIGURE: damage to a clause that PASSES. The mask necessarily puts 278 px inside his silhouette
    proper and 589 px inside the dilated protect halo, and his cloak's left edge runs x 291..370 through
    the mask's rows, so his cloak, his hands or his spectacles coming back wrong is attributable to this
    job and is a FAIL, not a wash. Reported with px counts, per region, as the parent's verdict did.
  FAIL-EYE-LEVEL: the sampler moves the blades off his eye line. P8 is carried by construction, so this
    is the only way it can fail -- and it is the clause the founder's own approved sentence turns on.
  FAIL-SEAM: a visible join, a row of dashes or a vertical edge where the weed was cloned out. Named because
    an earlier composite round DID produce exactly that -- grey dashes at x 233-257 and a seam at x 262
    -- and was rejected by eye before any GPU. The fix was restricting the clone source to the measured
    clean field; this clause is how we find out whether the fix held under the sampler.
  FAIL-DECAL: 'any of pattern 5''s five tells: texture axes not following the blade''s own tilt; shading
    ignoring the frame''s measured straight-down light (dx -0.072 dy -0.997); a swatch stopping short
    of or overrunning the object''s own edge; visible tiling; detail at the wrong scale against his hands
    as an in-frame ruler. Never fired below 0.45 in thirty-one prior samples, so it is a real check rather
    than a formality only because this drawing is new.'
  reporting_rule: EVERY mode above is reported BY NAME in the verdict whether or not it fired. Naming
    the most likely outcome in advance is what makes it meaningful when it turns out wrong.
negative_ordering: 'THE DEFECT CLASS IS FIRST ON PURPOSE, AND THE CEILING IS MEASURED RATHER THAN ESTIMATED.
  composite-init-pattern.md 4: animagine''s budget is 77 CLIP tokens and ''any word added silently drops
  the tail''. Every earlier spec in this repo has claimed headroom by counting WORDS. This one counted
  tokens on animagine''s own vocab with pipeline/clip_token_count.py, and the first draft of this negative
  measured 85 OF 77 -- eight tokens would have been dropped in silence, off the tail, which is where `text,
  photorealism, 3d render, low quality` live. Trimmed to 24 terms measuring 71 of 77; the prompt measures
  58 of 77. Control: the PARENT job''s negative measures 71 on the same instrument, matching its own recorded
  claim of comfortable headroom, which is what says the counter is right rather than convenient. Ordering:
  the terms that name this beat''s ACTUAL observed failures (leaf counts, extra stalk, multi-node weed,
  lance tips, bead/vine, a bud or ball at the tip) are at the FRONT, so if the tail is ever clipped it
  is `low quality` that goes and not the one thing this rung is about. It is also not load-bearing: the
  standing law is that the positive places what you want and the negative does not -- six times on this
  checkpoint a defect the negative forbade arrived anyway -- and here the structure is placed by the INIT,
  which is stronger than either.'
