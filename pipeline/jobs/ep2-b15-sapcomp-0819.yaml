  every beat-15 artifact was scored with GAZE DELIBERATELY UNSCORED, because STEWARDSHIP.md 6 was live
  on this beat: its staging was rewritten on 2026-08-17 with beats 12, 13, 19 and 20 and leaves/002b-t0-c.yaml
  recorded ''approval_status: NOT YET READ BY HIM''. The founder read all three rewritten lines and approved
  them on 2026-08-19 (''all approved'', recorded in 5d6eb792), so 6 came off all five restaged beats and
  the approved line is now the thing to stage TO. That is why P8 below is scored rather than recorded.
  It is also why this job is a PLATE and not footage: 6 gated voice, footage and assembly, and its discharge
  does not make a still init into a pick.'
