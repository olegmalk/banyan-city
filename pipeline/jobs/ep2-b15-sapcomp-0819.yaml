    FAIL-PASTE: 'FIRED AS A PARTIAL, AND IT WAS NAMED AS THE MOST LIKELY OUTCOME. The instrument agrees
      with the eye and it is the one number that separates this sample from beat 19''s: mean |delta| against
      the init inside the mask is 7.3 here against beat 19''s 13.4, and highpass sigma-3 std in the drawn
      region moves 23.21 -> 21.40 (beat 19: 22.10 -> 20.59). Only 6589 of 42792 masked px changed by more
      than 20. My pre-registered reason for expecting this was the SIZE of the drawing -- a 4.23% mask
      against beat 19''s 17.08%, with structures 7.0 px and 2.1 px wide -- and that reason survives the
      sample. THE LEVER IS ALREADY NAMED IN THIS SPEC: strength 0.30 -> 0.40, one variable, no new code,
      ONE SAMPLE.'
    FAIL-SHAPE: 'DID NOT FIRE. Both blades intact, stem intact, nothing split along an internal line.
      Capping the midrib at the plate''s own outline step (213.9 -> 45.1) is why: pattern 5''s law, and
      beat 10 split its slab at 0.45 on exactly this.'
    FAIL-COUNT: 'DID NOT FIRE -- exactly two blades, which is the axis two wordings failed at five and
      then at five again. NOTE ON THE INSTRUMENT, because it would mislead anyone re-running it: the green-blob
      count went 5 components -> 7. NONE of the new ones is a leaf. The composite''s blades and stem were
      ONE component of 8875 px because they touch; in the output the sampler darkened two stretches of
      the stem enough to fall below the green test, so the same plant now reads as a blade pair (7339
      px, y 342..404) plus two stem segments (457 px at y 409..504, 769 px at y 509..605). The other four
      blobs are byte-identical to the composite''s and are the plate''s own grass tufts by his knees.
      A blob count would have reported a FAIL here and it would have been wrong.'
    FAIL-NODE: DID NOT FIRE. One node. The bare stem grew no second pair, which is precisely how r1 failed.
    FAIL-TIP-BALL: DID NOT FIRE. No bud, no ball, no fruit at the tip or anywhere on the plant -- worth
      stating because the init under all six of this beat's motion takes was a weed topped with a WHITE
      SPHERE, so this is the checkpoint's demonstrated prior on this beat and it stayed away.
    FAIL-VACANCY: DID NOT FIRE. Nothing grew where the five-blade weed was removed. 21377 px were clone-filled
      from the plate's own measured field with 0 px left without a source, and the field came back as
      field.
    FAIL-FIGURE: DID NOT FIRE. Hands 0 px, boots 0 px, face 15 px at the mask's own edge. 60 px outside
      the mask changed by more than 20, all of them inside the padded crop the inpaint pastes back (x
      127..286, y 425..605 against the mask's own 121..310 / 285..604), which is the pipeline's documented
      behaviour and not leakage into an unrelated region.
    FAIL-EYE-LEVEL: DID NOT FIRE. 0.5 px of blade-band movement. See P8.
    FAIL-SEAM: DID NOT FIRE, AND THIS IS THE RESULT I WOULD HAVE BET AGAINST. An earlier composite round
      put a row of grey dashes at x 233-257 and a vertical seam at x 262 into the cloned field, and the
      fix was to restrict the clone source to the plate's own measured clean window (x 55-150). The open
      field left of the plant comes back continuous at 3x with its horizontal banding intact -- so the
      fix held under the sampler and not merely in the composite.
    FAIL-DECAL: 'DID NOT FIRE. None of the five tells: the new rim highlight sits on the side the plate''s
      measured light comes from, the shading follows each blade''s own tilt, the drawing''s edges are
      the object''s edges, there is no repeat, and the plant''s scale reads correctly against his hands
      and the grass tufts as in-frame rulers.'
  what_this_settles: 'BEAT 15''S LEAF COUNT IS REACHABLE, BY GEOMETRY RATHER THAN BY WORDS, and the beat''s
    blocker moves from ''the thing sharing the frame with him is not the sapling'' to ''the plant is the
    sapling and owes the house dialect''. That is a smaller and different problem. It also gives the composite-then-inpaint
    pattern its second beat in one night, on a plate with none of beat 19''s advantages -- and the two
    samples together say something neither says alone: CONVERSION SCALES WITH THE SIZE OF THE DRAWN REGION
    AT A FIXED STRENGTH. 17.08% of frame at 0.30 converted fully; 4.23% at 0.30 converted only at its
    edges. That is a mechanism a lane can act on, not a plate quirk.'
  what_this_does_NOT_settle: 'It does not establish 0.30 as right for a small mask -- the whole point
    of the partial is that it probably is not. It does not measure a rate: ONE CLIP, ONE SEED, ONE STRENGTH,
    ONE WORDING. And it says nothing about beat 15''s MOTION, which is a separate decision that wants
    the crf-10 finding applied to it (--image-crf 10, not 33, on the evidence of ep2-b09-faceturn-crf10-0819
    and beat 07''s cut-preferred take).'
  is_this_plate_a_pick: 'NO. NOT A PICK, no plate_ack, no promotion, no leaf, no lineage entry, nothing
    written to done-definitions.yaml and nothing added to any cut. It is one sample that clears a pre-registered
    bar on the axis that blocked the beat, which is the evidence a pick would be made ON. Beat 15 stays
    a slate until the author says otherwise (R4). The sidecar the box wrote carries approved: false and
    a provisional: block for the same reason.'
  the_next_rung_named: STRENGTH 0.30 -> 0.40 ON THIS EXACT INIT, one variable, no new code, ONE SAMPLE,
    about 5 s of GPU. 0.40 runs int(40*0.40) = 16 of 40 steps instead of 12. It is the cheapest test of
    whether the flat interior is a strength effect or a scale effect, and the pair 0.30/0.40 on a 4.23%
    mask is directly comparable to beat 19's 0.22/0.30 on a 17.08% one. The risk is FAIL-SHAPE at the
    higher strength, which beat 10 hit at 0.45 -- so 0.40 and not 0.45. Both plates would then be committed
    side by side, as beat 19's were, so the choice is made on pixels in one look.
