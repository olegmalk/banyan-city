  every one fails because the thing sharing the frame with him is not the sapling, which is the whole
  of beats.'15'.done_when. All six motion takes were animated from ONE init whose plant is a wiry weed
  topped with a white sphere, so no reseed can reach the bar. This is the init beat 15 has to have before
  it can be animated at all.
success: 'ONE 832x1216 png, its mask and its provenance sidecar, published into courier-box. THE BAR IS
  BEAT 15''S OWN: P1-P7 are carried VERBATIM from plate_scratch.py DRAFTS[15], where they were pre-registered
  before r1 existed and where r1 scored 6 of 7 against them. P3 is the one clause r1 failed and it is
  the clause this rung exists for. C8 is the composite half of the same question, and P8 is scoreable
  for the first time.'
why: 'The plant is DRAWN rather than asked for. Two wording rungs closed the leaf count: r1''s `two leaves
  on one thin stem` gave five blades on three nodes, and r2''s `two leaves at the top of one bare stem`
  did not move the plant at all. composite-init-pattern.md 1 calls cardinality CLASS A -- ''the attribute
  is not a direction in the conditioning space at all, so there is no knob to turn'' -- and Class A is
  the pattern''s strongest case, because a composited count is not a sample from anything. pipeline/beat15_listener_composite.py
  removed the weed into the plate''s own field and drew one canon sapling, $0 on the Mac, with two rounds
  rejected by eye first. Max change outside the mask is 0.0, so the six clauses r1 already passes are
  byte-identical to r1.'
