script_authority: 'Node 002b-first-citizen, approved_by: founder. THIS PRODUCES A PLATE, NOT AN EPISODE:
  STEWARDSHIP 6 gates voice, footage and assembly, and a still init for an approved beat is none of those.
  inpaint_fruit.py writes approved: false and a provisional: block into its own sidecar. Beat 08''s script
  line is ''lowers the clipboard and points'' and this rung touches only the LOWERING hand -- the pointing
  arm is outside the mask and byte-restored every step. No authoring call is made here: the hand that
  grips is the plate''s own drawn fist, translated, so not one digit is invented.'
bar:
  H1_the_fist_is_GONE_and_the_strap_RUNS: 'THE ONE QUESTION THIS RUNG ASKS, and it is the parent''s H1
    with its second half made explicit because that is the half that failed. (a) DELETED: no skin-toned
    fist survives inside poly(FIST) grown 6, by eye at 9x -- the parent PASSED this and a regression means
    0.70 was too low to erase. (b) PLAUSIBLE: the guard''s own diagonal harness strap RUNS CONTINUOUSLY
    through the mask, entering at the top edge and leaving at the bottom, and no second strap, second
    buckle or second clasp appears. The parent severed the strap and drew a new clasp across the break;
    that is the defect this rung is trying to buy out.'
  C4prime_RING_RE_BASED: 'Run pipeline/fill_quality.py''s assess() on the erase region (08-first-citizen-eraseonly-erase-0820.png)
    with the init as plate and THE RING PUSHED OUT TO 35-45 px. D >= 0.45 AND N >= 0.25 AND F <= 2.60.
    DO NOT RUN THE PRESCRIBED 3-12 px RING AND REPORT ITS VOID AS A RESULT: it has VOIDed three times
    on this exact geometry and it will VOID again, because --pad-crop repaints the annulus. Measured on
    both parent frames, identically: real fraction of the annulus is 3.1% at 3-12, 41.4% at 20-30, 99.1%
    at 30-40 and 100.0% at 35-45. PUBLISH THE ANNULUS''S REAL-PIXEL FRACTION beside the score. AND READ
    THE SCORE WITH ITS KNOWN BLIND SIDE IN HAND: C4'' bars D from below only, so it passed the parent''s
    wedge fan at D 3.479 and the grandparent''s green goblin fist at D 1.751. A PASS HERE IS NOT EVIDENCE
    THE FILL IS GOOD.'
  C4prime_SHARD_RATE_the_clause_C4_is_missing: 'THE CEILING C4'' DOES NOT HAVE, measured here because
    the parent showed why it is needed. Shard rate = fraction of fill px whose |grad| exceeds the 99th
    percentile of its own real ring (35-45 px). Reference values on this exact footprint: the material
    this fill replaces 1.82%, the grandparent''s goblin fist 2.79%, the parent''s wedge fan 9.27%. BAR:
    <= 3.00%. Also report near-black (L<40) and near-white (L>240) counts, whose reference is 242 and
    535 on the init against 925 and 1542 on the parent.'
  H3_the_digits_SURVIVED: 'The copied fist''s three finger creases and thumb are still individually legible
    at 9x. It is wholly outside the mask but INSIDE the pad-crop box (box y ends 705, the copy spans y
    640-705), so it is not untouched: it read maxdiff 55 at the grandparent and 121 at the parent. Report
    the number; legible is the bar.'
  H5_NO_NEW_NOUN: 'No face, no head, no figure, no placket -- and, sharpened by the parent, NO NEW HARDWARE:
    no second buckle and no second clasp. Judged by eye at 4x on the whole frame, plus the green-channel
    measurement that made the parent''s verdict checkable: in-mask G-R mean and px above +20, against
    -19.90 and 0 for the real material around the fill.'
  B8_hair: Canon light sandy hair, not bald. maxdiff 0 over the head box (500..640, 300..430), which has
    now held at 0 through three runs because the head is outside the crop box.
  B6_wardrobe: Cream shirt, white sash and brown wrap are still THREE garments. The mask reaches none
    of them but the shirt around the fist.
  OUT_OF_MASK_DRIFT_is_MEASURED_not_assumed: 'Report changed px outside the mask, their maxdiff, and how
    many of them fall outside the pad-crop box x488-719 y458-705. The answer to the last one has been
    0 twice and any other answer is a finding. Reference: 8574 px / maxdiff 132 at the grandparent, 8598
    / 151 at the parent.'
  scale30_clauses_hold: B1, B2, B3, B4a, B4b, B4c, B5 re-measured on the landed frame. Goblin box (60..260,
    430..1140) and board box (300..832, 660..1000) are both far outside the crop box and have read maxdiff
    0 and 1.
