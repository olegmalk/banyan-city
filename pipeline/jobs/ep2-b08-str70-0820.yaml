pre_registered_fail_modes:
  most_likely_A_the_fist_only_DENTS: '0.70 is a 29% cut in how far the pass may leave its conditioning,
    and deletion is the thing that needs freedom. If a skin-toned remnant survives inside poly(FIST) grown
    6, THE ROUTE IS CLOSED, not retuned: 0.99 deletes but over-draws and 0.70 under-deletes would mean
    no single value satisfies the conjunction, which is the same shape of refusal the b01 crf ladder reached
    and it should be read the same way. DO NOT PROPOSE 0.85.'
  second_THE_CLASP_COMES_BACK_ANYWAY: 'If the strap is still severed and a clasp is still drawn at 0.70,
    then the invention is not a function of strength either, and the honest conclusion in the consumer
    field fires: no spatial conditioning, no limb erasure, back to txt2img.'
  third_A_SEAM_AT_THE_COPY: The copy's stair-stepped octagonal edge is untouched by this pass and WILL
    still read as a decal. EXPECTED, NOT A FAIL -- it is the second pass's job, and it is written here
    again so that seeing it does not get mistaken for a regression.
  NOT_a_fail_mode_a_C4prime_PASS: 'C4'' passing is not evidence of a good fill on this instrument: it
    passed a green goblin fist and a wedge fan. Only the shard-rate clause and the eye clauses can fail
    this frame.'
sample_declaration: 'ONE SAMPLE, and the FOURTH on this route. Each of the three before it moved exactly
  one thing and each bought a distinguishable finding: fistcopy (18408 px mask) drew a goblin HEAD, eraseonly
  (10020 px) drew a green goblin FIST, nogoblin (prompt) drew NO goblin at all and a second buckled strap
  instead. Four renders, about forty seconds of card in total, $0, and a route that will be closed or
  finished on the next look rather than argued about.'
scope_limits: This does not settle beat 08's staging and it does not attempt the forearm. The plate draws
  the guard's hand at the authored elbow and the pose hint wants it at the wrist; re-routing a limb needs
  spatial conditioning that inpaint_fruit.py does not have. That is a txt2img question and this rung leaves
  it there.
strength_argument: 'CHOSEN: 0.70, at 40 steps and cfg 7.5, and it is the value Section 23 pre-registered
  rather than a fresh guess. THE OBJECTION THAT HELD IT BACK IS DISCHARGED: Section 23 declined to pull
  this lever because the fault was a NOUN and strength does not choose nouns. Section 24 measured the
  noun gone at 0.99 with the prompt alone, so what remains is a quantity. 0.70 IS STILL ABOVE THE STRUCTURE-PRESERVING
  REGIME: the pass must still DELETE a drawn fist from real pixels, and this tree has already measured
  0.236-class and 0.30-class values as insufficient for deletion (see inpaint_fruit.py''s own docstring
  and the 0.55 rung). The risk being accepted, named in advance: at 0.70 the fist may only DENT.'
what_the_three_parent_runs_established: 'Measured on landed frames, not inferred. (1) THE FIST CAN BE
  DELETED -- it was, completely, at 0.99, twice. (2) THE PROTECTED DIGITS SURVIVE A 0.99 PASS -- the copied
  fist''s three creases and thumb stayed legible at 9x through all three runs. (3) MASK SIZE DOES NOT
  CHOOSE THE NOUN: 18408 px drew a head, 10020 px drew a fist, same noun either way. (4) THE PROMPT DOES
  CHOOSE THE NOUN: removing ''goblin''/''green skin'' removed it entirely, first try, at unchanged strength.
  (5) `--pad-crop 64` BREAKS THE OUT-OF-MASK GUARANTEE, and the breakage is now bounded: 8598 of 8598
  out-of-mask changed px fall INSIDE the crop box x488-719 y458-705, 0 outside, dense within ~20 px of
  the mask boundary and gone by 30. (6) C4'' AS PRESCRIBED CANNOT SCORE THIS GEOMETRY -- three VOIDs --
  because that drift band eats its 3-12 px ring; the ring must be re-based.'
