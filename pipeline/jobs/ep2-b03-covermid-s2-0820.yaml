    from f114. THE INSTRUMENT IS RANKING BACKWARDS AND THIS IS THE FOURTH
    INSTRUMENT THIS LANE HAS HAD TO QUALIFY IN TWO DAYS. It counts only pairs
    that are EXACTLY identical, so it measures where the sampler gave up
    outputting new pixels and says nothing about where the PERFORMANCE stopped.
    Rung 3 stops acting at f073 and then spends 32 frames producing near-dead
    but not byte-identical pictures (0.012-0.155) before its exact run begins at
    f114; this clip acts until f102 and then goes exactly dead almost at once.
    A viewer sees 29 more frames of performance and a shorter interval of
    "nearly nothing happening", and the number goes the other way. THE
    REPLACEMENT MEASURE, and it needs no new threshold because it is the same
    quantity the record already publishes: the last interframe pair above 1.0.
    Rung 2 f069, rung 3 f073, this clip f102.
  H2_he_is_still_crouched_in_the_last_frame: >-
    PASS ON POSITION. At f120 he is in frame, down in the grass, directly behind
    the two-leaf plant with his head at leaf level and his face beside the
    leaves. Scored on position only, as this spec directed. HEIGHT REPORTED AS A
