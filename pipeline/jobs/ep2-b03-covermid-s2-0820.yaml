  2026-08-03`. STEWARDSHIP.md 6 IS DISCHARGED FOR THIS BEAT AND THE RECORD IS node.md:204: the five beats
  rewritten 2026-08-17 to play at knee height (12, 13, 15, 19, 20) were put to the founder verbatim and
  his answer was "all approved" on 2026-08-19; beat 13 was additionally ratified 2026-08-18 by his own
  board ruling. node.md states the consequence in as many words: "voice synthesis, footage render and
  episode assembly are legal for all five beats as now written". THIS IS A SILENT MOTION CLIP: no voice
  synthesis, no episode assembly, no publication, and the approval confers no verdict on the pixels. The
  one thing 6 still gates on this node is the 2026-08-18 beat-17 shake restage, which this job does not
  touch. SUPERSESSION NOTE, because a reader will find the other sentence: pipeline/jobs/ep2-b15-macplate-publish-0819.yaml
  says the beat-15 6 gate is LIVE. It was, when that spec was written on the morning of 08-19; the approval
  landed later the same day.'
script_line: 'Beat 03 BAD COVER (0:11-0:16), node.md:38 verbatim: "The scavenger crouches behind a trunk
  that hides roughly one-sixth of him." The preceding beat 02 THE SPRINT (node.md:35) is where he "dives
  behind the sapling''s thin trunk", so the dive is beat 02''s action and beat 03 is the held, inadequate
  cover it lands in. THE `trunk` WORDING IS SUPERSEDED by the founder''s ruling that the sapling is tiny
  ("thats ridiculous, lmao. the sapling is tiny"); the END STATE -- cover that is comically inadequate
  -- is what the beat needs.'
S5_THE_MIDDLE_IS_NOT_GIVEN_BACK: 'THE CLAUSE THAT PROTECTS WHAT RUNG 3 ACTUALLY WON, and it is measured
  on a floor calibrated against this beat''s own history rather than invented. Step-frame whole-frame
  mean-absolute interframe luma across f060..f072 (this family holds every 3rd frame, 8.0 effective fps,
  all six clips) must average at or above 3.5. Rung 3 reads 7.60 / 7.29 / 7.02 / 5.54 / 7.20 there and
  rung 2 reads 0.44 / 0.40 / 0.34 / 0.05 / 0.04, so the floor is roughly HALF of rung 3 and eight times
  rung 2: a draw that halves the effect still passes and a draw that lands back in the terminal-placement
  regime cannot. H1 alone would let a clip that unfroze the tail by killing the middle read as an improvement.'
S6_THE_PLANT_AND_THE_RATIFIED_ADULT_BOTH_HOLD: 'GATE. If either fails nothing else is scored. The plant
  ONE thin stem and TWO leaves, rooted, no hand on it, at f000 f030 f060 f090 f120 (rung 3 passed this
  on the composite for the third rung running). The subject the ratified ADULT goblin -- lean wiry man,
  green skin, bald, long pointed ears, patchwork cloak -- present and recognisable in all 121 frames,
  checked on a full-clip sheet. NOT a chibi child and NOT holding a leafy tree: that pair is the exact
  defect of the clip currently in the published cut, and it is what this composite route was built to
  close.'
S7_REPORT_WHERE_THE_CLIP_DIES_WHATEVER_IT_IS: NOT A PASS/FAIL CLAUSE -- the number this job is most likely
  to be remembered for. Publish the last frame pair whose whole-frame mean-absolute interframe luma exceeds
  1.0. Rung 3 dies at f073 (7.199, then 0.012-0.155 to the end) and rung 2 died at f069, i.e. at essentially
  the same place regardless of the words. If the seed does not move it either, the death point is a property
  of the RECIPE or the LENGTH and the only remaining lever on this beat is the shorten-the-render candidate
  rung 3's record already names. If it does move it, that is a new axis and it was bought for $0.
S8_identity_and_the_flat_box_lesson: 'Re-measure the skin probe box on f000 and f120 and publish R, G,
  B, R-B AND luma_std for both. Rung 3''s pre-registered box was RETRACTED AS SCORED at this exact step:
  by f060 his head has dropped ~450 px and the box was sitting on the hazy horizon, reading a nominal
  +130 luma that was not an identity reading at all -- the tell was luma_std 18.5 -> 5.9. A FLAT BOX IS
  AN EMPTY BOX. If the box empties again, re-place by eye at 5x on f120 and say so, exactly as rung 3
  did.'
