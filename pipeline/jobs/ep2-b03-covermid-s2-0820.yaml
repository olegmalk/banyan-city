not_done_on_purpose: 'NO WORDING CHANGE OF ANY KIND -- rung 3''s measurement exonerated the wording and
  this job would destroy that control. NO BAR CHANGE: H1-H4 are carried byte-identical and the four clauses
  added here are additions, not edits, every one of them calibrated against a number this beat has already
  produced. NO SHORTER RENDER -- 121 frames stays, because --frames is an input to the denoiser''s temporal
  grid and not a crop, and testing it is a different rung with a different control. NO TRIM AND NO SIDECAR:
  both trim points were computed on rung 3 and both were refused in writing (f073 re-adds a 1.299 s hold
  with 0.60 s of the line over a frozen picture; f105 is a trim chosen to satisfy an instrument). NO PLATE
  WORK and no new init, sha, anchor or mask. NO THIRD SEED FILED ALONGSIDE THIS ONE -- if this agrees
  with rung 3 the question is closed at two, exactly as beat 15''s was. AND NO CUT SWAP IS PROPOSED BY
  THIS SPEC: whether rung 3 or this seed sits in review/ep2-demo-0820''s beat 03 slot is an assembly decision
  made elsewhere, and this file neither makes it nor pre-writes it.'
pre_registered_fail_modes:
- 'F-FREEZE-IS-THE-RECIPE -- H1 fails again at roughly 7 frames from roughly f114. NAMED AS THE MOST LIKELY
  OUTCOME AND THE REASONING IS PUBLISHED BEFORE THE PIXELS: rung 2 and rung 3 both die within four frames
  of each other from completely different terminal wordings, which is already two independent votes that
  the tail belongs to the recipe. If this fires, the wording axis AND the seed axis are both closed on
  beat 03 and the honest next step is the 73-frame render (no dead tail to fill, 40% less GPU) or nothing.'
- 'F-THE-MIDDLE-WAS-THE-DRAW -- S5 fails: the f060..f072 band collapses toward rung 2''s numbers with
  the wording untouched. This would be the most valuable failure in the set and it would contradict beat
  15, where the same edit''s motion passed HARDER at this same seed. It would mean rung 3''s central finding
  -- that a middle in continuous aspect buys motion -- rests on one draw on two beats, and every conclusion
  drawn from it would need re-reading.'
- F-PLANT-PICKED-UP / F-SUBJECT-SWAPPED at a new seed -- S6's gate. Beat 15 answered the sibling version
  of this NO (neither rung 2's picked-up plant nor rung 3's deleted goblin returned at 20260821), so a
  hit here would say the composite init's protection is weaker on beat 03 than on beat 15.
- F-DEATH-POINT-MOVES -- S7's number lands materially away from f073. Not a failure of the beat; a sharpening.
  It would be the first evidence on this beat that anything other than the length controls where the performance
  stops.
- 'F-H1-PASSES-AND-NOTHING-ELSE-CHANGES -- the run comes back at 5 frames or fewer and the clip is otherwise
  indistinguishable. THIS IS A PASS THAT MUST NOT BE OVERSOLD: a 7-vs-5 difference at the tail is a draw
  crossing a threshold, not a repair, and the 32 near-dead frames between f073 and f105 are untouched
  by it. Say so in the verdict rather than reporting a green H1 as a fixed beat.'
