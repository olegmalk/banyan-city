consumer: 'THE BEAT-20 SELECTION on review/ep2-beats-0821. Beat 20 currently has three takes and not one
  of them closes its done_when, so the founder has nothing to pick between: the shipping take is an old
  man under the wrong tree, round 1 is a still with a runtime, and round 2 is a clean canon goblin who
  never moves his head. This batch exists to put a FINISHED version in front of him rather than a fourth
  description of what is wrong. Nothing here touches review/ep2-ship-0821 or any cut.'
success: 'THREE 704x1280 105-frame 24fps mp4s, and the batch succeeds if AT LEAST ONE of them clears all
  four bars. H1 THE HEAD TURNS: his face is square to the lens at f000 and is angled away from the lens
  toward his right by f096, judged as skull orientation and not as eye direction -- eyes rolling up inside
  a level head is what round 2 already did and it is a FAIL here. H2 the chin is visibly higher at f096
  than at f000. H3 everything round 2 already won is still won: frame locked with his scale constant,
  the composited stem still there and un-multiplied, the fig purple, and face, ears, skin and clothes
  drawn in every frame with no dissolve. H4 the fig stays closed in both hands the whole clip. A clip
  that buys the head turn by breaking H3 is not a candidate, it is a trade the beat cannot make.'
why: 'ROUND 2''S SUBJECT INVENTORY TOLD THE MODEL HE WAS ALREADY LOOKING UP, AND THEN THE ACTION ASKED
  HIM TO LOOK UP.


  The sentence is ''He is squatting, holding a small fruit, looking up, in tall grass, full body.'' That
  clause is the model''s inventory of what is already true. With the end state pre-asserted there, a goblin
  who looks up and never moves satisfies both sentences at once -- which is the clip that came back in
  round 1 and again in round 2.


  ROUND 2''S OWN RESULT IS THE EVIDENCE THAT THIS IS THE LIVE FAULT AND NOT A GUESS. The LIFT in that
  same action clause DID happen: the fig goes from his lap at f000 to chest-and-chin height by f048. The
  lift is the half of the action whose end state the inventory did NOT already assert -- the inventory
  says the fruit is ''closed in both his hands'', not that it is raised. So the model moved the part it
  had not been told was finished and skipped the part it had. Two halves of one sentence, one rendered
  and one not, split exactly along which end state the inventory had already spent.


  WHAT CHANGED: the inventory now describes the init as it is -- head level, face to the lens, fruit low
  in the lap, all three checked at 1:1 on b20-init-704x1280.png before this was written -- and THE ACTION
  restates the delta in body-part terms, the skull rotating and the chin lifting, rather than in the word
  the inventory had already used. The stem''s position is also corrected to what the picture shows: its
  leaves sit at about y=440 against his eyes at about y=220, so they are BELOW his eye line, and round
  2''s ''at about his eye line'' was wording that disagreed with its own init. This wave has already measured
  what the model does when the words and the init disagree.


  WHAT DID NOT CHANGE: the init plate and its sha assert, size, frame count, fps, guidance, sampler, sigmas,
  two-stage, crf, offload, the negative block byte for byte, and the trim plan. Round 2 proved the plate;
  this asks only about the sentence.'
