failure_predicted_in_advance: 'EYES WITHOUT A SKULL, and it is why H1 is written as skull orientation.
  Round 2 already showed the model will roll the pupils upward inside a head that does not move; a round
  3 that buys a slightly stronger version of the same eye-roll has not bought the beat, and scoring it
  generously is how a fault survives a round. SECOND: the head turns and takes the face off-canon with
  it -- a three-quarter or profile skull is a view the canon plate never showed the model, so the ear,
  the collar or the slit pupil can dissolve as it rotates. H3 catches that, and a clip that turns the
  head by losing the face is a fail, not a trade. THIRD, cheapest: naming the stem as a thing he turns
  TOWARD re-opens the pull-back the plate fix closed. H3''s scale clause catches it.'
not_done_on_purpose: THE INIT IS NOT RE-COMPOSITED, even though the stem's leaves sitting below his eye
  line is a real reason a LOOK UP is hard to buy here. Lifting the stem in the plate is a second variable
  and a second render step, and the sentence is the cheaper lever by an order of magnitude; if all three
  seeds come back with a level head, the wording route is closed and the plate geometry is the next rung,
  filed as its own job with its own question. NOTHING HERE TOUCHES THE CUT, and no beat outside 20 is
  in this batch.
the_one_variable: 'THE SUBJECT INVENTORY''S POSE SENTENCE, which stops asserting the action''s end state,
  plus the action clause restated as the body-part delta that follows from it. Everything a sampler reads
  is round 2''s: same init png and same sha assert, same 704x1280, same 105 frames at 24fps, same guidance,
  sigmas, two-stage, crf and offload, same negative text. SEED 20260920 IS ROUND 2''S OWN SEED and is
  kept on purpose so that s1 is a true single-variable control against the round-2 clip; s2 and s3 are
  variance on the same wording, because a head turn either seeds in or does not.'
