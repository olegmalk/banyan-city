  prompt_after: Tight on the sapling's two leaves, perfectly still. Static locked framing, the frame never
    moves and nothing enters it. The leaves hold their shape and their position; only the grass stirs,
    very slightly, in the air. Detailed cinematic anime, warm amber backlight, hazy out-of-focus grassy
    field, soft glowing light, masterpiece, best quality, very aesthetic.
  nothing_replaces_it: Deliberate. The shot is the two leaves. Substituting a describing phrase would
    make this two variables and would re-open the question of what the substitute itself summons.
  the_approved_line_does_contain_it: node.md:83, the approved shot description, reads "Tight on the sapling's
    two leaves, perfectly still -- the scavenger is still crouched in the grass behind them, out of frame."
    The prompt is a transcription of it. This rung is NOT 'deleting text the script does not contain'
    -- that justification was drafted, checked, and found false before filing.
  what_makes_the_deletion_right: 'node.md:189, the staging half of the same node: "12 RELATED -- he is
    crouched in the grass behind the leaves and out of frame, not below them. OFF-SCREEN ONLY; THE PICTURE
    DID NOT CHANGE." Canon requires the scavenger absent from the picture; four of five renders put him
    in it. The RENDER violates canon, and the deletion moves the output toward the approved staging.'
  the_law_that_outranks_this_beat: A SHOT DESCRIPTION IS NOT A PROMPT. Staging prose describes what is
    true of the scene, including what is deliberately off-screen -- normal screenwriting. A diffusion
    positive can only describe what is IN the frame. Transcribing an off-screen clause verbatim asks for
    exactly the thing the script says to exclude.
  scope_named_honestly_and_NOT_claimed_as_audited: 315 specs match `out of frame`, and sampled, the overwhelming
    majority are NEGATIVES banning subject exits -- `walking out of frame, leaving the frame` -- a correct
    and unrelated use. The defect is an off-screen clause inside a POSITIVE, and beat 12 is the only confirmed
    instance. The audit that would settle it reads positives only and HAS NOT BEEN RUN; a whole-file grep
    cannot tell the two apart. Named as unowned, not claimed as measured.
  authority: NOT R4. A prompt is not the script. What would be R4 is editing node.md's line, or widening
    a framing he approved as 'tight on two leaves'. Beat 12's line was approved by name on 2026-08-19
    (5d6eb792) and STEWARDSHIP.md 6 is discharged for this beat.
