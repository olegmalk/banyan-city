  and is NOT owned by this job.
pre_registered_fail_modes:
  FAIL-FIGURE-ANYWAY: 'the crouching form returns with the clause gone. NAMED AS THE MOST USEFUL NEGATIVE
    RESULT: it would move the cause off the phrase and onto the plate or the checkpoint, and would retire
    prompt surgery as beat 12''s lever in one clip.'
  FAIL-BIRD: no scavenger, but the parent's black bird with the white eye rises again. B1 counts it. Named
    separately from FAIL-FIGURE-ANYWAY because they point at different causes -- the bird was never in
    any prompt.
  FAIL-DEAD: nothing moves, grass included. The parent already sat at 0.011 in the grass band, so this
    beat is closer to dead than to busy and deleting a subject clause can only reduce what there is to
    animate. Named as MORE LIKELY THAN THE FIGURE RETURNING.
  FAIL-COLLAPSE: matched-content luma drift 20 levels or more. This seed held at -0.04 on this plate,
    but the collapse is a (seed x plate) interaction and the prompt is not a proven-innocent third factor.
  FAIL-CAMERA: a real, region-consistent move. Per-render, never inherited.
  FAIL-PLANT-CHANGE: a leaf appears, vanishes, wilts or grows.
  reporting_rule: every mode above is reported BY NAME whether or not it fired, and a mode discovered
    after the fact is reported as unpredicted rather than folded into the nearest pre-registered one --
    the parent generation's DUSK COLLAPSE is why that sentence is here.
