consumer: 'BEAT 12 IN THE EP2 CUT, and it is the beat''s first shot at a take that fails NOTHING. The
  seed axis closed 0 for 5: every take failed at least one clause, and on four of the five the failure
  was the same one -- a crouching figure behind the lower leaf, on four independent seeds, in the same
  slot. Beat 12 ships today as best-available with a colour fault named, on a take carrying a different
  prompt and a different seed. This rung asks whether removing one unrenderable clause removes the figure
  and leaves the locked, flat clip that 20260871 already produced. If it does, beat 12 has a candidate
  the assembler can swap in; if it does not, the cause is not the phrase and the beat needs a plate route
  instead.'
success: 'ONE 121-frame 704x1280 mp4 with its sidecar and the 704x1280 init it was conditioned on, published
  into courier-box with a .sha256 manifest. THE DECISIVE CLAUSE IS B1, NO FIGURE ANYWHERE: it is the one
  thing that separates this take from its parent, and a pass on everything else with a figure still in
  frame is a FAIL of this job. The bar below was written before the pixels existed.'
why: 'ONE VARIABLE off ep2-b12-noscav-0819, and the variable is a span of text: `-- the scavenger crouched
  behind them, out of frame` leaves the positive and NOTHING REPLACES IT. A diffusion positive has no
  negation operator and no way to place a named subject outside the canvas, so that clause encodes a subject
  and a position and gets them drawn -- four of five seeds, four of four among the takes that stayed on
  the plate, against a negative that names goblin, creature, person, face, hands and figure entering frame.
  node.md:189 requires the scavenger OFF-SCREEN ONLY, ''the picture did not change'', so the render is
  what violates canon and the deletion moves the output toward the approved staging. Not R4: this changes
  a prompt, not the script.'
