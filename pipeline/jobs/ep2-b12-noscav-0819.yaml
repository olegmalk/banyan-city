bar:
  written_before_the_pixels: Every clause below is pre-registered. Instruments are named per clause; numbers
    are FILTERS and the verdict is the read. All 121 frames opened, not sampled -- the beat-07 lane's
    standard.
  B1_NO_FIGURE_ANYWHERE_AND_IT_IS_THE_DECISIVE_CLAUSE: 'No scavenger, goblin, person, face, hand, limb
    or dark humanoid form in ANY of the 121 frames, at any edge and behind either leaf. This is the clause
    the rung exists for and it outranks every other clause here: a take that passes B2-B5 with a figure
    in it is a FAIL. Scored by opening every frame, with the region behind the LOWER LEAF -- where four
    of four on-plate seeds put him, and where 20260871''s bird rose at f030 -- looked at specifically.
    THE BIRD COUNTS: the parent''s only mover was a black bird with a large white eye, and ''any figure''
    includes it. Reported as figure/bird/neither so a partial result is legible instead of rounded.'
  B2_EXACTLY_TWO_LEAVES_and_the_count_is_scored_AGAINST_THE_PLATE: 'beats.''12''.done_when asks for exactly
    two cotyledons and one bare side-branch. THE PLATE DOES NOT CARRY THAT AND NO i2v RENDER CAN ADD IT,
    because the init is frame one. Measured on the plate itself: four blade-sized components, major axes
    619/772/607/591 px, aspects 2.85/3.11/3.38 against composite-init-pattern.md 8''s pre-registered 1.6-2.6
    band -- lance-shaped, and more than two. So the clause here is the one this render CAN fail: THE COUNT
    MUST NOT CHANGE across the 121 frames. No leaf appears, vanishes, wilts or grows. The absolute count
    remains a PLATE FAULT with a named route (the composite instrument that solved beats 15 and 19) and
    is not charged to this take.'
  B3_CAMERA_LOCKED: 'Instrument: farm-out/ep2-b12-stillmotion-s20260818-0819/b12_camera_drift.py -- phase
    correlation on native-resolution BT.601 gray, cumulated, reported whole-frame AND per 3x2 block. PASS
    = whole-frame |dy| and |dx| within the parent''s own result (+7px, all six blocks agreeing inside
    1px). A real camera move is region-consistent; field re-inking is not. THE INSTRUMENT''S OWN LIMIT
    IS CARRIED: a hard fade or content substitution destroys the correlation peak, so if B4 collapses,
    THE BLOCK NUMBERS ARE NOISE and must not be quoted as a camera move (s20260873 read +133px per block
    against a whole-frame +0px). Framing is a per-render check and is never inherited from a passing sibling:
    20260818 tilted -387px with the ban in both the positive and the first six tokens of the negative.'
  B4_MATCHED_CONTENT_LUMA_WITHIN_BOUNDS: 'Mean luma of the OVERLAP REGION ONLY -- f000 rows [s:] against
    fN rows [:H-s] at the measured cumulative shift -- so a fade cannot hide behind a pan and a pan cannot
    forge a fade. PASS = |matched drift| f000->f120 under 20 levels, two-sided, plus the equal-thirds
    band read from pipeline/luma_drift.py for the sign-disagreement check. Bands disagreeing in sign is
    never scored as a collapse; a single band moving alone is an OBJECT until eyes say otherwise. The
    parent read -0.04 matched, and 20260819 on this same plate read -91.05, so this axis is live even
    though the seed is the flat one: the collapse is a (seed x plate) INTERACTION and the prompt is one
    of the two things changing here.'
  B5_FOUR_QUARTERS_MOTION_alive_but_not_moving: '''Perfectly still'' does not mean ''a still''. Interframe
    median reported for EACH QUARTER of the clip -- f000-030, f030-060, f060-090, f090-120 -- and separately
    inside the leaf mask and the grass band. PASS = the grass band is non-zero in ALL FOUR quarters and
    the leaf band is near zero in all four. Quartered because the parent''s whole-clip grass figure was
    0.011 while a bird crossed it, i.e. a single number over 121 frames cannot tell ''alive throughout''
    from ''one event in the middle of a dead clip''. Measured on regions, not on the frame: a perfect
    32px fall over a frozen background moves whole-frame interframe by 0.056 and would fail a frame-level
    floor.'
duration_and_the_assembler_trap: '121 frames at 24 fps = 5.0417 s. render_t3''s default fill for footage
  is now a last-frame HOLD (af863c0b) and the palindrome survives only as opt-in `loop_fill: pingpong`,
  which nothing in this tree writes -- but beat 12 is near-still, so a palindrome here would be nearly
  invisible, which is worse and not better. Whoever assembles should check beat 12''s slot length against
  5.0417 s rather than assume.'
failure_predicted_in_advance: 'FAIL-DEAD IS MORE LIKELY THAN THE FIGURE RETURNING, and saying so is what
  makes a clean pass worth something. The parent''s grass band measured 0.011 -- effectively frozen --
  and its ONLY mover was the bird this rung is trying to delete. Remove the one subject clause from a
  positive whose whole first sentence asks for stillness, on a recipe measured to over-deliver stillness
  (beat 18 went 5.956 -> 0.570 at crf 10 and was scored FAIL-FROZEN), and the plausible outcome is a clip
  with nothing in it at all. That is why B5 quarters the motion instead of reporting one number: a dead
  clip and a locked clip differ only in the grass, and only if you look at the grass in every quarter.'
