not_asked_by_this_rung: No pick, no promotion, no cut swap, and no plate route filed off this sample.
  THE PICK IS R4 AND NO BEAT-12 TAKE HAS EARNED ONE. Beat 12 keeps 12-related-b12-tightB-untrimmed.mp4
  as best-available with its colour fault named, whatever this returns. The absolute leaf count is a plate
