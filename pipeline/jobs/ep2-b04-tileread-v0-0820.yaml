success: 'ONE 832x1216 png for rung v0 (CONTROL, CLOSE - the canon string as it stands, at the hard framing).
  Identity clause: ''1boy, solo, lean wiry adult goblin man, green skin, bald head, patchwork cloak''.
  Everything else is byte-identical across all eight rungs -- same seed 20260820, same negative, same
  scene clause, same sampler numbers. Judged against the six-clause tile bar pre-registered in this file
  BEFORE the render existed.'
why: RUNG v0 OF AN EIGHT-RUNG TILE-READ WEDGE. CONTROL, CLOSE - the canon string as it stands, at the
  hard framing. The founder ruled 2026-08-20 night that the goblin must read as the B tile's CREATURE
  and that `adult` in canon was steward drift; the design axis is now fidelity to adult-b19-0819.jpg.
  Beat 19 IS that tile and beat 15 is the next-best match in the cut, and BOTH were rendered from the
  same man-read string -- wide, with `close-up` negated. So framing, not wording, is what separates the
  creature from the man today, and a recipe that only works at distance is an avoidance rather than a
  recipe. This ladder asks what the positive clause is worth AT THE CLOSE-UP, one attribute at a time.
bar: "PRE-REGISTERED BEFORE THE RENDER, read at 1:1 beside\nreview/ep2-goblin-design-0819/adult-b19-0819.jpg.\
  \ Six clauses, and the first\nfour are what \"the creature, not a man\" means:\n  T1 EYES      blank\
  \ white, no iris and no pupil drawn.\n  T2 NOSE      no bridge, no tip, no drawn nostrils.\n  T3 AGE\
  \       no brow furrows, no nasolabial folds, no jowls. A smooth mask.\n  T4 EARS      ear length under\
  \ about a third of head height, low and swept\n               back. LONG TAPERING SPIKES ARE A FAIL\
  \ on this clause even though\n               four beats in the shipping cut have them.\n  T5 SKULL \
  \    large smooth dome; no neck reading as a distinct cylinder.\n  T6 COLOUR    two-tone -- crown lighter\
  \ than the muzzle. Reported, not scored:\n               the tile's own two-tone may be a lighting artefact\
  \ and no rung\n               should be failed on it until that is settled.\nPASS = the FIRST rung that\
  \ takes T1-T4 at the close framing. T5/T6 reported.\nNOT A CLAUSE, and stated so nobody scores it: whether\
  \ the resulting creature is\nGOOD. That is R4 and it is the founder's. This measures fidelity to a picture\
  \ he\nalready ruled, which is a comparison anyone can check."
failure_predicted_in_advance: 'v0 FAILS T1, T2 and T3 -- an adult human male face, which is the

  defect as it ships. v1 PASSES T1-T3 on framing alone and is the control that

  proves the ladder is measuring the close-up problem and not the checkpoint.

  v2 STILL FAILS: `1boy` plus a bare `goblin` leaves the human-male anatomy prior

  intact and animagine will fill in the eyes and nose it was never told to leave

  out -- deleting `man` is predicted to be worth almost nothing on its own, and if

  that is wrong it is the cheapest possible answer.

  THE HIGHEST-YIELD SINGLE RUNG IS PREDICTED TO BE v3 (the eyes), because a

  blank-eyed face reads non-human before any other feature is parsed.

  THE MOST LIKELY WAY THE WHOLE LADDER FAILS: every rung comes back with a human

  face wearing blank contact lenses -- the tags bind as SURFACE DECORATION on human

  anatomy rather than as a different skull. If that is what eight rungs show, the

  wording route for the close-up is CLOSED and the answer is a reference route (a

  LoRA trained on tile-faithful frames, or IP-Adapter off the tile), which is a

  larger and slower instrument and should not be reached for first.'
init_provenance: 'NONE, and that is the design. No init image, no mask, no IP-Adapter, no reference set
  and no control hint: this is txt2img so that the only thing on the canvas is what the wording put there.
  --control/--control-sha256/--scale are carried byte-identical from the parent and are INERT on --arm
  nocontrol (controlnet_plate.py:592 -- every use is inside `if use_cn:`), kept rather than deleted so
  the derivation stays one-variable against its parent.'
one_sample_rule: SATISFIED. The founder's 2026-08-03 rule is one sample per RECIPE CHANGE and forbids
  scaling an unapproved recipe across a set of beats. This is eight DIFFERENT recipes at ONE sample each,
  on ONE beat, with nothing promoted -- the shape of the step sweep and the shake A/B, not the shape of
  the K recipe.
the_one_variable: THE IDENTITY CLAUSE. Seed, checkpoint, steps, cfg, size, scene clause, quality tail
  and the whole negative are identical in all eight rungs. Rung v1 additionally moves the FRAMING and
  is labelled as the control that does so.
