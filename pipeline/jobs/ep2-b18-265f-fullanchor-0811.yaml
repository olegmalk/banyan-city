# EPISODE 2, BEAT 18 — THE DECISION. Two measured mechanical defects, one render.
# UNGATED. No taste question is asked or answered here.
#
# DEFECT 1 — THE CLIP LOOPS 1.81x UNDER ITS OWN LINE.
# fit_duration (render_t3.py:312) sizes a voiced beat
#   round(max(min(cdur, vdur + VOICELESS_TAIL_MAX), vdur + 0.4), 2)
# and loops footage shorter than that (palindrome since loop cycle 005,
# render_t3.py:583).
#   clips/18-vo.json                              total_s 10.546
#   review/ep2-prov-0809/ltx-002b-b18-prov.mp4     6.042s (ffprobe, 145f @ 24fps)
#   slot = max(min(6.042, 12.546), 10.946)       = 10.95s
#   10.946 / 6.042 = the picture plays 1.81 times under one line.
# This is the same defect class Roman named on episode 1 today ("looping, it looks
# bad") and the same fix: make the clip long enough that nothing loops.
#
# THE FRAME COUNT IS ARITHMETIC, not a choice.
#   F/24 >= 10.946 -> F >= 262.72; LTX wants 8n+1.
#   8*32+1 = 257 -> 10.708s, still short. 8*33+1 = 265 -> 11.042s.
#   11.042 >= 10.946 (nothing loops) and 11.042 <= vdur+2.0 = 12.546 (nothing trimmed).
# 265 is well under the 385-frame ceiling this box has actually run (at 385f:
# host_peak_phys 59.8/68.1GB, commit 89.2/128.2GB, peak_torch 17.8/25.7GB). HOST
# RAM binds at these lengths, not VRAM, and 265 sits between two measured points
# rather than beyond them. The recipe itself is proven and APPROVED: Roman looked
# at ep1 beat 8 at 313 frames on 2026-08-11 and said "beat 8 looks good". 265 is
# under that, so this is not a recipe change and needs no fresh sample.
#
# DEFECT 2 — THE MODEL NEVER SAW HALF THE SHOT. video_task.py:626 reads
#     anchor = " ".join(words[:22]) + ("…" if len(words) > 22 else "")
# a hard 22-WORD CAP on the anchor. Beat 18's anchor is longer, so the prompt that
# actually rendered — verified by reading the file the box rendered from,
# C:\banyan-farm\ep2-prov-0809\18-prompt.txt, not from a report — ends:
#     "...its stem flexing under the weight, rimmed by…."
# Everything from word 23 was dropped before the text encoder ever ran. What was
# lost is the whole second half of the direction, including the beat's ONLY
# statement of progression: "The trembling grows; the stem bends further." The
# model was asked for a trembling fig and never told the trembling goes anywhere.
# That matters much more at 265 frames than at 145 — an undirected micro-motion
# over eleven seconds is exactly the cycling failure ep1 beat 04 produced.
#
# This job does NOT touch video_task.py. The 22-word cap is the `token-truncation`
# lane's to fix in the builder; here the full anchor is written straight into a
# prompt_file, which is how every episode-1 long-clip job already works
# (pipeline/jobs/ep1-b13-217f-vo-length-run.yaml). No shared file is edited.
#
# NEGATION: NOTHING BANNED IS IN THE POSITIVE. Verified at source in the box's own
# venv (C:\banyan-video\venv, diffusers 0.39.0, pipelines/ltx2/pipeline_ltx2.py):
# do_classifier_free_guidance is (guidance_scale > 1.0) or (audio_guidance_scale >
# 1.0); we pass guidance 1.0 and no audio value, so there is no unconditional pass
# and THE NEGATIVE IS NEVER READ. A ban left in the positive would therefore be
# strictly worse than useless — it would feed the model the noun it forbids
# (DIAG-negation-in-positive.md, e4fbb65). shots.md's tail carries "no cut", "No
# photorealism, no 3D render look" and "no text" in the positive; the builder
# already moves those to the negative, and this file keeps them there. The
# negative below is byte-identical to 18-negative.txt on the box. Carried for
# provenance (§7.2), not for effect.
#
# ONE VARIABLE PAIR, DELIBERATELY. Same plate (byte-identical — the 704x1280 file
# the prov clip itself was conditioned on, still on the box), same seed, same
# guidance, same sigmas, same negative, same generic motion clause. Only the frame
# count and the truncated half of the anchor change, because those are the two
# measured defects. The motion clause is left alone on purpose: fixing it too
# would make a bad result unattributable.
#
# NO METRIC RANKS ANYTHING (131e433). Read by eye, beside the 6.042s clip.
# LICENCES: nothing new. LTX-2.3 distilled (LTX-2 Community License), already on
# the box. $0.

id: ep2-b18-265f-fullanchor-0811
task: ep2-b18-265f-fullanchor-0811
