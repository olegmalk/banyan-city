  C:\banyan-farm\ep2-fix-0811\b18-prompt.txt: |-
    2D anime, hand-drawn cel animation, flat cel shading, clean ink linework, anime key art. Extreme close-up: the one fig on the thinnest branch, stem trembling. subtle continuous motion, gentle camera drift, living scene. Subject already in frame: One small round green fruit trembles on the thinnest branch of a tiny sapling, its stem flexing under the weight, rimmed by warm amber afternoon light against a soft wash sky. The trembling grows continuously and the stem bends steadily further under the weight for the whole shot. Held macro, extreme close-up, cinematic lighting, detailed, newest, masterpiece, best quality, very aesthetic.

