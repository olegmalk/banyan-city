consumer: >-
  Episode 2's beat 18. It is the emotional turn of the episode — the tree
  deciding to spend the only thing it owns — and today its picture plays 1.81
  times under the line that carries that decision. Roman's directive on
  2026-08-11 was "finish episode 1, then move on to episode 2"; beat 18 is one of
  only five episode-2 beats that is not waiting on his goblin definition, so it
  is real forward movement on episode 2 rather than a deeper pile on a gated one.
  His verdict on this clip answers two things: whether beat 18 stops looping, and
  whether the restored progression ("the trembling grows") reads over 11 seconds.

success: >-
  A 704x1280 mp4 at C:\banyan-farm\ep2-fix-0811\18-the-decision-LTX-265f.mp4 with
  265 decoded frames (11.042s), conditioned on the same plate as the 6s clip, in
  which the fig's trembling BUILDS across the whole shot and the stem bends
  progressively further rather than vibrating in place, the macro framing stays on
  the same fig against the same sky, and no second scene, figure or object
  appears. The specific thing to look for at this length is whether the trembling
  stays progressive or settles into a repeating cycle — a cycle is the same defect
  at a smaller scale and is worth reporting as such. A clip that reads static is a
  real result too and should be reported, not re-run. By eye, beside
  review/ep2-prov-0809/ltx-002b-b18-prov.mp4. No metric is run.

why: >-
  The clip is 4.9 seconds shorter than the line it plays under, and the half of
  the direction that says the motion goes somewhere was cut by a 22-word cap
  before the text encoder ran.

est_minutes: 9    # encode ~2min (Gemma load dominates); render ~5.4min from this
                  # box's own measurements (145f = 214s, 385f = 436s -> ~80s +
                  # 0.925s/frame -> ~325s at 265 frames). No plate step: reused.

