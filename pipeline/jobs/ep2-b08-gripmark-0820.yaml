  frame, authored-quad fraction below luma 80 falling 0.754 -> 0.234, which is
  the same value the nine-word wording rung produced (0.229). And B8 came back
  BALD with BOTH of its calibrated inputs held at the values that passed.
  Every other clause held. `ep2-b08-scale30-0820` remains the best frame on
