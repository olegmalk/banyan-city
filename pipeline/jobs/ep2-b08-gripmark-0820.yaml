verdict: >-
  FAIL, AND THE FINDING IS WORTH MORE THAN THE FRAME -- IT IS THE ONE THE FIVE
  TRACING LOSSES DID NOT CONTAIN. The loop BOUND: the pre-registered most-likely
  mode (L1, ignored, loss-3 class) did NOT fire. It was traced at full fidelity
  in place -- 511 gold pixels centred at (615.7, 681.2), 14.2 px from the
  authored L-wrist. Figure ink at --scale2 0.3 in this two-net rig is above
  threshold, which is a real answer to a real question.
  AND THE NET NAMED IT FROM ITS NEIGHBOURHOOD RATHER THAN FROM THE WRIST
  UNDERNEATH IT. The closed hand-sized loop came back as a SECOND GOLD BELT
  CLASP, drawn beside the existing one at the belt line. The openpose net
  asserts a guard L-wrist at exactly (621.6704, 668.4352) at scale 1.0, the
  prompt says `clipboard lowered in one hand`, and the scribble net still
  resolved the enclosure into the object class its surroundings suggest: a
  rounded closed form on a belt beside a leather strap is hardware. THE
  ARGUMENT THIS RUNG WAS BUILT ON IS THEREFORE FALSIFIED IN ITS LOAD-BEARING
  STEP -- "the two nets agree at one pixel, and agreement between nets is not a
  new class of instruction" is wrong as measured. The pose keypoint did not
  disambiguate the mark at all.
