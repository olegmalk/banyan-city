owner: 'beat 08 staging lane, 2026-08-20 -- derived by pipeline/derive_b08_gripmark_0820.py, on the lever
  three rungs named and none authored. The argument the record owed is filed first, in pipeline/work-ladder-0819.md,
  and it changed the proposal from a stroke to a closed loop. Fired without waiting for a human hour:
  every weight is on the card, both hints exist, and the previous rungs took ~30 s of GPU end to end.'
consumer: 'Beat 08''s plate, and this is the last named lever on it. The beat asks for a clipboard LOWERED
  IN ONE HAND. The best frame the beat has draws the board correctly and ends the sleeve in a digit-free
  lobe on its top edge, with the hand itself 90.5 px away at the elbow gripping a strap the model invented.
  The cut cannot use a board that reads as a satchel, and every input that does not require figure ink
  has now been spent: wording summons a grip and binds it to the wrong object while costing the board,
  strength restores the board and moves no hand while merging the wardrobe, and the guidance window was
  excluded two rungs earlier.'
success: 'One 832x1216 png with its sidecar, published to C:\banyan-farm\courier-box\farm-out\ep2-b08-gripmark-0820
  with a sha256 manifest, and read at 1:1, 3x AND 5x beside its parent -- 5x because that is the magnification
  at which the parent''s lobe was found to have no digits, and a grip judged at 1:1 is a grip not judged.
  The preflight must print its four verification lines; the sidecar must read `control_2_image_sha256:
  e822a88a...`, `controlnet_2_conditioning_scale: 0.3`, `controlnet_conditioning_scale: 1.0`, `control_image_sha256:
  562911c8...` and `seed: 20260819`; and its `prompt:` must NOT contain `fingers and thumb`.'
why: One sample, one variable, ~30 s of GPU, and the record already predicts what each outcome means because
  the five failure modes were written down before the hint was drawn. A hand at the board closes beat
  08's last clause. No hand at all says small-scope figure ink cannot bind at the only strength the wardrobe
  survives, which sends the beat to the composite-then-inpaint route that went 4 for 4 today -- and that
  is worth knowing before anyone spends a second GPU hour on this net.
