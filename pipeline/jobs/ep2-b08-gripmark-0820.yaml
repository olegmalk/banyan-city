  (1) A HAND AT THE BOARD, EVERY PARENT CLAUSE HELD -> beat 08 has a COMPLETE plate candidate for the
  first time and the route stops. Pixels get staged for cut assembly and said so plainly. STILL NOT a
  pick and NOT a plate_ack -- choosing between frames is taste and belongs to R4.

  (2) A HAND AT THE BOARD, A PARENT CLAUSE LOST -> the loop acts globally as well as locally, which is
  the five losses re-appearing at small scope. Not a candidate; the finding is that scope does not buy
  locality on this net.

  (3) NO CHANGE AT ALL (L1) -> figure ink at 0.3 is below threshold. The scribble net is spent as a placement
  instrument on this beat and the route goes to the composite.

  (4) THE BOARD DEGRADES (L4) -> section 18''s coupling is a property of the pair in BOTH directions,
  which constrains every future multi-net beat, not just this one.

  (5) A THIRD HAND-FORM (L5) -> the checkpoint adds hands rather than relocating them, and no hint-side
  instrument can fix a hand that is already committed elsewhere. That is the cleanest possible licence
  for the composite route.'
the_argument_this_rung_required_before_it_could_exist: FILED FIRST, IN pipeline/work-ladder-0819.md --
  "the grip mark, argued against the five tracing losses". Read it before reading this spec's result,
  because it also REJECTS the lever as three rungs named it. The proposal on the record was "a SHORT STROKE
  for the gripping hand"; a short stroke is tracing loss 4 exactly (r4's 1 px finger at 0.45, which did
  not carry and cost r2's articulated hand a fingerless wedge), and section 9 ruled at the time that what
  B4b needs is a HAND-SIZED mark. What is authored here is a CLOSED LOOP, and author_b08_board_hint.py
  --selftest proves the word closed with a flood fill seeded off-ink at its centre that must be trapped,
  the way section 10 proved the contour/skeleton distinction.
the_fallback_named_in_advance: 'COMPOSITE-THEN-INPAINT, and it is named now so nobody has to invent an
  instrument after a disappointment. That route went 4 for 4 on 2026-08-20 (beats 15, 19, 03, 13) on precisely
  this shape of problem -- a RELATION between a figure the sampler has already placed and something it
  draws where it likes. Beat 03''s entry states the general form: a relation is no more a knob than a
  numeral is. "A hand grips this board" is that relation. Drawing the hand into the parent plate and running
  a 0.30 pass with padding_mask_crop=64 touches neither net and risks neither the board nor the wardrobe.
  The hint rung goes first only because it is one variable on a recipe already on the card and keeps beat
  08''s plate a single-pass render.'
who_ruled_this_rung: The parent's own verdict under `next_rung_named_not_taken` ("IF WORDING FAILS, the
  next lever is the board hint carrying a short stroke for the gripping hand at the authored L-wrist --
  which would be the first figure ink ever put in that hint and must be argued for explicitly against
  the five tracing losses, not slipped in"), and route log pipeline/b08-arm-route-0819.md sections 17,
  18 and 19, which say the same three times. The argument is filed; the lever is taken in the class the
  argument survived in, which is a closed loop and not a stroke. Written in an `extra` key because `fresh`
  prose is retokened and a parent id there would become this job's own id.
why_these_key_names: '`scoring_rule_pre_registered` and `rights_and_weights` are this spec''s `verdict_rule`
  and `licence_note`. derive_spec''s FINDINGS_NAME guard refuses any extra key matching /verdict|licen[cs]/,
  which is right for findings and over-reaches on two house keys that must be written BEFORE the pixels.
  Same declaration the last five rungs made.'
