bar:
  b0_the_stack_is_what_it_claims: 'VOID-CHECK, and it has one MORE line to read than the parent''s because
    the variable is a conditioning input rather than a number. Preflight prints `twins net verified`,
    `scribble net verified`, the line asserting the two nets share size and config and DIFFER in weights,
    and `staged driver, BOTH hints and BOTH references verified` -- and the staged-file table now pins
    b08-board-grip-0820.png at e822a88a..., so a stale hint on the box fails here rather than in a verdict.
    The sidecar must read control_2_image_sha256 e822a88a... and control_image_sha256 562911c8...: if
    the second reads 38cd39da... the new hint never reached the card and the frame is a re-run of the
    parent under a new name.'
  b4b_the_grip: 'THE CLAUSE THIS RUNG EXISTS FOR, AND IT IS SCORED AT 5x. A HAND at the board''s top edge:
    a form that reads as a hand, whose centroid is CLOSER TO THE AUTHORED WRIST (621.7, 668.4) THAN TO
    THE AUTHORED ELBOW (627.2, 579.7) -- i.e. under ~45 px from the wrist, against the parent''s 90.5
    -- and which overlaps the board''s top edge rather than hovering above it or sitting behind it. Digits
    are scored SEPARATELY and are not required for the clause to pass: the beat asks for a clipboard held,
    not for a hand anatomy study, and the parent already proves the model draws digits at 0.3 when it
    decides a hand is a hand. Placed by geometry, not by colour -- a colour predicate cannot certify skin
    on this guard, whose cream shirt reads R-B 34.7 against his skin''s 42.6-49.7.'
  b4a_board_down: 'MUST NOT REGRESS, AND THIS IS NOT A FORMALITY. Section 18 established that --scale2
    0.3 is not robust but PROMPT-COUPLED: it carried the board for exactly the text it was measured with
    and lost it entirely for nine more words at the same strength. This rung moves the OTHER half of that
    pair, so the object is re-measured by the same instrument: fraction of pixels below luma 80 inside
    the authored quad -- corners (608.6,660.5) (719.5,678.1) (697.7,816.2) (586.7,798.6) -- published
    for BOTH frames computed the same way in the same pass, because the published 0.758/0.235 figures
    came from an instrument this lane cannot reproduce exactly. Top edge below the shoulder line y=491,
    one board and only one.'
  b6_drawn_not_traced: 'THE CLAUSE THE FIVE TRACING LOSSES ARE ABOUT, AND THE REASON THE ARGUMENT HAD
    TO BE WRITTEN FIRST. Both figures read as DRAWN CHARACTERS at ep2-b08-twinsipa-0819''s standard: pupils
    and a set jaw, hair with strands, folds in BOTH garments -- cream shirt, white sash AND brown wrap
    as three separable things -- a legible metal clasp, a drawn cuff. SPECIFICALLY: the guard''s face
    must not be traced, and nothing anywhere in the frame may read as a hard-rimmed flat form. A flat
    blob at the wrist is fail mode L2 and is scored as a FAIL of this clause, not as a partial win on
    B4b.'
  b8_the_guard_has_hair: 'canon.yaml `ep2-guard-hair` -- light sandy hair, \bbald\b FORBIDDEN, and beat
    08 is in that entry''s scope as of 2026-08-20. THE INSTRUMENT HAS TWO CALIBRATED INPUTS AND THIS RUNG
    HOLDS BOTH AT THE VALUES THAT PASSED: 64 tokens (bald arrived at 73) and 1.0+0.3 (bald arrived at
    1.0+0.8 and 1.0+0.5). So a bald guard here would mean the loop itself raised the effective load, which
    is a third input nobody has measured and would be the finding of the rung.'
  b7_no_limb_fragmentation: 'G-R at six regions, three per figure, EVERY BOX PLACED FRESH ON THIS FRAME
    and publishing coordinates, luma AND material. Within-figure spread <= 25.0; every guard region <=
    0.0, every goblin region >= +20.0. Two standing admissibility rules, both earned on this beat: boxes
    do not transfer between frames because wardrobe moves under them, and ON THE GUARD A COLOUR PREDICATE
    CANNOT DECIDE THE MATERIAL. Guard boxes are placed by eye at 5x and published with their R-B.'
  b2_the_identities_separate: Guard face <= 0.0, goblin face >= +20.0, separation >= +20.0. twinsipa +42.0,
    the parent +60.6. Same material-and-luma publication rule as B7.
  b4b_ii_both_arms_stay_on_their_skeletons: The pointing hand's centroid within ~60 px of the authored
    wrist (280.5,695.1) -- parent 48.5 -- and THE GUARD MUST HAVE TWO ARMS, neither swallowed. The pointing
    arm is the clause the loop is furthest from and the hint's selftest asserts it is not touched; if
    it moves, the loop is acting globally and that is fail mode L2 in a worse form.
  b4c_the_arm_belongs_to_the_guard: MUST SURVIVE. The pointing arm grows from the guard's shoulder and
    is human-skinned. Eleven mechanisms have held it.
  b1_the_pair: TWO figures and only two, both whole, under figure_count_ruled_from_the_script_0817. AND
    EXACTLY ONE BOARD and TWO HANDS ON THE GUARD -- fail mode L5 is a hand at the wrist ARRIVING ALONGSIDE
    the existing fist at the strap, which would be three hand-forms on one man.
  b3_one_ground_plane: Both stand on the same grass. Read by eye if the automated detector is confounded
    by foreground grass, as it has been on the last two frames.
  b5_no_colossus: Neither figure towers; twinsipa measured a stature ratio near 1.13 against the authored
    1.100.
not_done_on_purpose: 'ONE sample, ONE arm, ONE hint. NO second seed. NO scale sweep -- section 19 closed
  the number and the window is narrower than 0.3-0.5. NO wording change in either direction beyond reverting
  to the parent''s own 64-token payload, which is not a change but the absence of one. NO knuckles, NO
  thumb, NO finger divisions in the loop: r2''s hand was good and aimed wide BY CONSTRUCTION, and hand-authored
  geometry fails by being confidently wrong. NO second mark anywhere in the hint and NO new limb in its
  contact set, both asserted as pixels. NO change to the openpose hint, the masks, the references, the
  ip-scale, the first net''s scale or the driver. NO pick, NO plate_ack, NO cut, NO canon filename, NO
  canon.yaml edit.'
one_variable_and_how_it_is_proved: NOT BY PROMISE. build(grip=False) is still the default and --selftest
  asserts it is byte-identical to 38cd39da..., the hint four rungs rendered from, both re-derived in memory
  and on disk; the grip hint is asserted a strict SUPERSET of it, with every added pixel inside the loop's
  own dilation. The two hints therefore differ by the loop and by nothing else, as a measurement. The
  prompt is the parent's payload dict, byte-identical, asserted equal in this deriver and measured at
  64 of 77 tokens. Both nets, both shas, both capsule masks, the openpose hint, --scale, --scale2, --ip-scale
  and the seed are the parent's untouched.
pre_registered_fail_modes: 'WRITTEN BEFORE THE PIXELS, EACH TIED TO THE LOSS IT COMES FROM.

  L1 IGNORED (loss 3 class, AND THE MOST LIKELY): the hand stays at the elbow and the board is unchanged.
  At 0.28 figure ink stopped binding entirely and this loop carries about a tenth of the board''s ink
  at 0.3. Reads as: small-scope figure ink cannot bind at the only strength the wardrobe survives, and
  the route leaves this net.

  L2 FLAT-TRACE (loss 1 class): a hard-rimmed digit-free blob at the wrist. Reads as: 7 px is not a ribbon
  at 0.3, i.e. section 9''s precision finding is scale-dependent. Scored a FAIL of B6, not a partial B4b.

  L3 MERGE (loss 5 class): the loop''s ink and the board''s top edge read as ONE enclosure -- a bump on
  the board, or a luminous bar at the wrist. The loop straddles the edge by design and this is the price
  of that design.

  L4 BOARD-COST (section 18 class): the board degrades or vanishes because the PAIR moved. Section 18''s
  lesson was written for prompt edits at a fixed hint; this is a hint edit at a fixed prompt and the same
  logic applies. Measured, not eyeballed.

  L5 THIRD-HAND: a hand at the wrist arrives ALONGSIDE the existing fist at the strap. `extra hands` is
  in the negative and negatives have not been reliable on this beat.

  A frame can fire more than one; section 18 fired two at once.'
