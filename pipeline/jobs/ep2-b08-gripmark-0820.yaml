pre_registered_fail_modes_as_fired: >-
  FIVE WERE WRITTEN BEFORE THE PIXELS. L1 IGNORED: did NOT fire -- the mark
  bound, at 14.2 px. L2 FLAT-TRACE: did NOT fire -- the traced form is fully
  drawn, with a rim, an inset and a highlight. L3 MERGE: fired in a form the
  wording did not anticipate -- the loop did merge, but with the BELT and the
  STRAP rather than with the board''s top edge, and the merge is what named it.
  L4 BOARD-COST: FIRED, 0.754 -> 0.234. L5 THIRD-HAND: did NOT fire.
  AND ONE MODE NOBODY PRE-REGISTERED FIRED, WHICH IS THE RUNG''S REAL RESULT:
  WRONG NOUN. Every one of the five tracing losses drew ink ON a figure, so the
  ink was the silhouette that named itself and the question could not arise.
  This is the first mark on this route whose intended noun differed from what
  its neighbourhood suggests, and the neighbourhood won.
what_this_settles: >-
  THREE THINGS, AND THE FIRST OUTLIVES BEAT 08.
  (1) ON A SCRIBBLE NET YOU CHOOSE THE SHAPE AND THE PLACE; YOU DO NOT CHOOSE
  THE NOUN. Section 10 established that any hint this net can read is a hint it
  traces. The corollary this frame adds is that the semantic class of what gets
  traced comes from the surrounding pixels, and neither a co-located ControlNet
  keypoint at scale 1.0 nor the prompt overrides it. Do not place an authored
  enclosure and expect the object you had in mind; place one only where the
  neighbourhood already implies that object -- which is exactly why the BOARD
  hint worked, a rectangle at a hip beside a hand is a board.
  (2) THE EFFECTIVE CONDITIONING LOAD IS (STRENGTH x INK), NOT STRENGTH. 29%
  more ink at an unchanged 0.3 cost the object AND the canon hair, the same two
  clauses that raising the strength to 0.5 and adding nine prompt tokens each
  cost. The B8 hair instrument now reads three inputs, and any lane that adds
  ink to a hint "at the scale that worked" is raising the load.
  (3) FIGURE INK AT 0.3 IS ABOVE THRESHOLD IN THIS TWO-NET RIG. Tracing loss 3
  measured figure ink losing its grip at 0.28 on a SINGLE net; it does not
  transfer here, and the route no longer has to wonder.
what_this_did_not_settle: >-
  Whether a hand-shaped enclosure placed somewhere the neighbourhood ALREADY
  implies a hand would be named correctly -- this frame only shows that a belt
  line names it hardware. Whether a smaller loop (less ink) would keep the board
  while still binding; the two effects were not separated and separating them
  costs a second sample on a route that has no consumer left for it. Nor whether
  any of this holds at a second seed -- every frame on this route is seed
  20260819. Nor the goblin''s legwear, which moved AGAIN (bare green legs here,
  teal trousers to the ankle in the parent) and remains the unruled attribute
  already filed as a taste card.
observed_not_scored: >-
  THREE. (1) THE GUARD''S POINTING SLEEVE GAINED A BLUE CUFF that nothing in the
  prompt, the hints, the masks or the references asks for -- the same
  unasserted-attribute invention this beat keeps producing. (2) THE GOBLIN''S
  LEGWEAR CHANGED AGAIN, and it is why the parent''s guard forearm probe box
  landed on cloth. (3) The frame darkened slightly, mean luma 135.4 -> 130.2,
  consistent with a small rise in effective load rather than with the collapse
  0.5 and 0.8 produced.
what_this_does_not_license: >-
  NO PICK, NO plate_ack, NO CUT, NO CANON FILENAME, AND NOT THE WORDS "COMPLETE
  PLATE CANDIDATE". Beat 08 is exactly where it was: `ep2-b08-scale30-0820` is
  the best frame it has and it is still one clause short. It does not license a
  smaller loop, a second seed, a scale change, or any further figure ink on this
  net -- the reason to stop is not disappointment, it is that finding (1) says
  the instrument cannot do what the clause needs.
next_rung_named_not_taken: >-
  THE FALLBACK THIS SPEC NAMED IN ADVANCE IS NOW THE ROUTE:
  COMPOSITE-THEN-INPAINT on ep2-b08-scale30-0820. Draw the hand into the parent
  plate and run a 0.30 pass with padding_mask_crop=64, per
  composite-init-pattern.md. That route went 4 for 4 on 2026-08-20 (beats 15,
  19, 03, 13) on the same shape of problem -- a RELATION between a figure the
  sampler has already placed and something it draws where it likes -- and it is
  the one instrument that does not have to ask this net for a noun, because the
  compositor draws the noun and the sampler only re-renders it. Not taken by
  this lane.
