  PICTURE ANYWAY. box_enqueue refuses this init twice -- border flatness 0.740 against a 0.62 threshold,
  and membership of CARD_REFS_DENYLIST via the producing job ep2-b10-patrol-scene-r2-0813 (reference
  set refs-charref-guards-r5-0812). The refusal text itself says: ''refs-charref-guards-r5-0812 also
  drew ep2-b10-patrol-scene-r2-0813/10-no-form-ipa-r0-w010-s1.png, opened 2026-08-16, which is a field
  with a hedge, flowers and two guards. If this is that plate, this refusal is wrong.'' THIS IS THAT
  PLATE, by name and by sha. Not taken on the guard''s word: the blob was fetched from origin/farm-results-rtx5090
  on 2026-08-21 night, its sha256 re-computed as 441a4fd115fa2d0b5194b61b4317be8ee0e14ef6045a9507372062ef3e4cd98c
  -- byte-identical to the assertion this spec''s crop step already makes -- and OPENED AT 1:1. What
  is in it: a grown dark-haired man in a brown patrol coat and maroon sash standing in grass, with
  white and yellow flowers in the near field, a hedge line across the middle distance, open sky above,
  and a second smaller figure standing in the right background. It is a location, not blank paper.
  The two refusals are also one signal and not two, as the guard''s own note says: the denylist was
  built by scoring plates with the same border-flatness statistic. Waived for these two cells only;
  the guard is left unchanged, because the threshold is right for the six cards it was cut from and
  this is the false positive it already documents.'
