pre_registered_fail_modes: 'H-PLATE-WIDTH, AND AFTER OPENING THE INIT THIS IS THE ONE I EXPECT. The plate
  was opened at 1:1 before this spec was filed (see plate_ack). The prop already in it is a WIDE FLAT
  TRAY carried horizontally at waist height with loose papers on it, and it is nearly as wide as the man.
  The shipped clip''s first frames show exactly that tray and then convert it, around f008-f012, into
  a vertical bark slab OF THE SAME WIDTH. On that reading the board is oversized because THE PLATE''S
  PROP IS THAT WIDE, and a positive clause asking for hand-sized is arguing with the picture -- which
  the absent-object law says it loses. If both cells come back with a wide board, that is not a weak result:
  it converts ''the bark board is the wrong size'' from an open wording question into a PLATE JOB, in
  one round, for $0, and the next lane should re-cut the plate rather than write a fifth sentence about
  size. This is written down BEFORE the render so a wide board cannot be reported as a surprise.

  H-SHIELD he raises the board in front of his face instead of reading off it. This is on record as this
  beat''s other seed''s failure (''seedB holds the scene and the man but delivers the WRONG ACTION - he
  raises the board like a shield''), so it is a known seed outcome and a second draw of it is information,
  not surprise.

  H-DEAD-AGAIN the render freezes again in the same region. Two fresh seeds both dying moves this beat
  off the seed ladder and onto the plate.

  H-SMALL-BUT-DEAD the sizing clause binds and the clip still dies. Recorded as a SPLIT result -- it would
  mean the two faults are independent and the beat needs the sizing clause carried onto whatever fixes
  the freeze.

  H-OVERSHOOT the board shrinks until it is not readable as a written board. The bar says hand-sized AND
  readable and this cell can fail on the second half.

  H-SECOND-FIGURE the plate carries a SECOND, smaller figure in the right background holding a pale card
  up. This beat''s positive says ''ONE uniformed patrol guard ... is alone in this shot and no second
  person is anywhere in the frame'' and its negative names ''two men, second guard, a pair''. The shipped
  take erased him successfully; a fresh seed may not.'
