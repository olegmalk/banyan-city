consumer: >-
  the v35 screening cut. Beat 08 measured 0.01 median / 88% frozen at
  QA-v34-0810.md and is the last frozen ep1 beat with no round beyond its
  wave r1 and no gate in front of it. The output goes in front of the founder
  beside 03/04/07/10 as an unranked set — his verdict, not the steward's.

success: >-
  A 704x1280 65-frame mp4 at
  C:\banyan-farm\v34-motion-0810\08-ltx-r3-plate-s20260739.mp4.
  Judged on FRAMING and CONTENT, not on the flow number: pan and rise under
  ~20px of 704/1280 and implied zoom within 1.00 +/- 0.02 (r1 measured pan 21,
  rise -89, zoomH 0.991 — the rise is the defect this round targets), the plant
  upright and rooted for all 65 frames, and NO object or figure that is not in
  the init still. Beat 04 is the precedent: its best-scoring arm was the one
  that invented a phone, so an invented object fails this round outright
  however the median reads.

why: >-
  Six of seven dead ep1 beats have a corrected round; 08 is the gap, and 06 is
  gated on an unratified frame so it cannot be closed.

