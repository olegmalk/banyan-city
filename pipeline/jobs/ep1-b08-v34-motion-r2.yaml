# ep1 beat 08 "sev-1" — LTX motion re-render.
#
# HISTORY OF THIS FILE, because the id changed under it: as written it fired r2
# at 03:11:47Z (rc=0 03:21:59Z, clip 927734ba.., scored REJECT in ledger record
# ep1-b08-v34-motion-r2-sample). It is now retargeted to r3-plate after the
# geometry defect below was found. The r2 wording analysis stands; the r2
# ARTIFACT does not ship. Nothing here has been fired since the retarget.
#
# THE LAST UNGATED FROZEN BEAT. QA-v34-0810.md names seven dead beats in the
# v34 cut (03, 04, 06, 07, 08, 10, 14). Six now have motion rounds beyond r1:
# 03 r2/r3, 04 r2/r3, 07 r2/r3, 10 r2, 14 r2. Beat 06 is EXCLUDED and stays
# excluded — the wave excluded it on 2026-08-09 because its frame is the
# b06-r5 PROVISIONAL pick, not founder canon, and §6 does not let a render
# stand on an unratified still. That leaves 08, which has only its wave r1.
#
# ONE VARIABLE: the framing clause. r1's positive carried the negation cluster
#   "everything holds its position, framing locked, no zoom, no push-in,
#    no camera rise, subject stays the same size and place in frame"
# and that cluster is measured HARMFUL, not merely inert (07218cb): at
# guidance 1.0 the distilled schedule runs no unconditional pass, so a negation
# earns no gradient away from what it names, and in the POSITIVE "no zoom"
# contributes the token `zoom`. r2 restates the same constraints affirmatively,
# naming where each object STAYS. Everything else — the ambient verbs, the
# plant anchor, the subject tail, the negative, the seed 20260739, the still —
# is byte-identical to r1, so the wording is the only variable.
#
# WHY THIS IS A METHOD FIX AND NOT A BET ON A SCORE. The affirmative rewrite is
# the one change with a measured, reproduced effect: beat 03 r1 -> r2 cut the
# pan from 245px to 52px of 704 (-79%) and the push-in from 1.653 to 1.000,
# same seed and still. It is NOT justified by the flow metric, which is
# DISQUALIFIED as a selection criterion on this series — see below.
#
# THE METRIC SELECTS FOR THE FAILURE. Two independent proofs now:
#   131e433  the motion number was highest on the beat where the plant fell over
#   b04 r3   the best-scoring arm (median 0.73, best framing numbers of the
#            three) is the arm that re-invents the phone at the wrist
# So median frame delta may be REPORTED here but must not pick a winner. A
# metric that rewards hallucination launders a bad result as a good one.
#
# STATE THE LOCK ONCE. Beat 03 r3 escalated the affirmative lock a second time
# and bought ~2px against r2's ~48px — the dose saturates, and the escalation
# degraded the steam into a smear. So this spec states the lock once and spends
# no further budget on it.
#
# GEOMETRY DEFECT — FOUND AFTER THE r2 RENDER, AND IT MAKES THAT CLIP
# UNSHIPPABLE. This spec as originally fired passed the 832x1216 still straight
# to --init with no plate step, and LTX's preprocessor resizes to the target
# without preserving aspect. 0.6842 / 0.5500 = 1.2440, so the clip came back
# 24.4% TALLER than the composition the founder approved. Measured, not
# inferred: frame 0 of 08-ltx-r2 sits at mean-abs-diff 2.75 against a naive
# stretch of its own still and 17.19 against a cover-centre crop, while frame 0
# of the v34 CUT's own beat 08 inverts it exactly — 17.09 naive, 2.09 cover.
# The cut is geometrically right and every LTX motion render in this series is
# not. plate_prep.py's docstring named this mechanism on 2026-08-08 and named
# ltx_i2v.py as one of the two offenders; the fix existed and was never wired in.
#
# The plate step below is the fix, and it is NOT cosmetic. It also changes the
# output name, because a plate-corrected clip is a different artifact and must
# not overwrite the stretched one that the r2 ledger record describes.
#
# DO NOT FIRE THIS UNCOORDINATED. A plate-corrected beat 08 is NOT comparable to
# r1, which is stretched — isolating the wording variable again would need r1
# re-rendered on a plate too. This belongs to a plate-corrected re-render of the
# whole beat set, which the queue-fill lane is already opening with b14. Queuing
# it alone would burn the card on a comparison whose baseline does not exist yet.
#
# PROVENANCE FLAG, DELIBERATE: the script below is C:\banyan-farm\ltx_i2v.py,
# sha256 d49f8ecb.., which matches NEITHER repo HEAD (8cdd186e..) NOR the
# working tree (ef6e8533..). It is what every clip in this series was rendered
# with, so using it is what makes beat 08 comparable to beats 03/04/07/10. It
# also means none of this series is reproducible from the repo alone. Recorded
# here rather than quietly swapped, because swapping the binary mid-series
# would change the recipe on the one beat meant to isolate a wording change.

id: ep1-b08-v34-motion-r3-plate
task: ep1-b08-v34-motion-r3-plate-0810
node: 001-capability-inventory
beat: 8
runner: box
