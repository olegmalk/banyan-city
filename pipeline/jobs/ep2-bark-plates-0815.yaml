  - "# Assert BEFORE copying. A hash checked after the fact is a log line, not a gate.\nimport hashlib,\
    \ os, shutil\nsrc_dir = \"C:/banyan-farm/ep2-bark-plates-0815\"\ndst = \"C:/banyan-farm/courier-box/farm-out/ep2-bark-plates-0815\"\
    \nWANT = {\n  \"b10-barkboard-pass-s13.png\": \"f5a5c1525f283e4c56ed3b9d46996e5cff1c333a3a9da09ecb244ac9e74d615b\"\
    ,\n  \"b06-barkboard-pass-s10.png\": \"063ad56112a718006b6eb2d883e3c01bcb579aef90ea0b201de27a29123565f9\"\
    ,\n}\nhave = {}\nfor name, want in sorted(WANT.items()):\n    p = os.path.join(src_dir, name)\n   \
    \ if not os.path.isfile(p):\n        raise SystemExit(\"!! missing %s\" % p)\n    h = hashlib.sha256()\n\
    \    with open(p, \"rb\") as fh:\n        for chunk in iter(lambda: fh.read(1 << 20), b\"\"):\n   \
    \         h.update(chunk)\n    got = h.hexdigest()\n    if got != want:\n        raise SystemExit(\"\
    !! SHA MISMATCH, refusing to publish %s\\n   want %s\\n   have %s\" % (name, want, got))\n    have[name]\
    \ = got\n    print(\"asserted %s %s\" % (got[:12], name), flush=True)\nos.makedirs(dst, exist_ok=True)\n\
