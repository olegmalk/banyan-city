why: 'THE PLATE UNDER THIS CLIP ALREADY CARRIES THE PANIC, so this job only has to not lose it and to
  fix the landing.


  THE FACE was moved by ep2-b02-panicface-0822, a masked i2i over the brow and mouth bands of round 2''s
  own init -- the route ep2-jerry-expref-r2-0821 measured working after four prompt-side interventions
  measured failing. The motion prompt''s existing ''his face DOES NOT CHANGE'' clause is carried byte-for-byte
  and is now working FOR the note instead of against it: round 2 proved that clause holds a face for all
  105 frames, and the face it will hold is the panicked one.


  THE LANDING. ''He just faceplants into the ground.'' Round 2''s own verdict says the same thing from
  the other side -- the plate fixed the camera and left ''the SHAPE of the move'' wrong: ''there is no
  entry, no skid, and the dive reads as a duck''. The script says he ''sprints into frame, skids, and
  dives behind the sapling''s thin trunk'', and the end state that implies is behind cover, not nose-first
  in the dirt. So the landing is written as a PLACEMENT -- forearms take it, chin off the ground, prone
  with the head up -- which is the wording form this engine has been measured following, rather than an
  adjective it has been measured ignoring.


  WHAT DID NOT CHANGE: 704x1280, 105 frames at 24fps, guidance, sampler, sigmas, two-stage, crf, offload,
  the cover-crop sha assert and the trim-to-97 plan.'
