# ep1 beat 10 — the anti-wobble prompt, written WITHOUT negation. Supersedes
# ep1-b10-stillwording-0811, which commanded the defect it was written to remove.
#
# WHY THIS EXISTS. Roman, 2026-08-11: "for beat 10 in both of the clips the
# saplings are wobbling too much." The stillwording job was the fix for that. Its
# rendered sidecar (C:\banyan-farm\v34-motion-0810\10-ltx-still-plate-s20260897.mp4.meta.yaml,
# byte-identical to the repo text) shows what the model was actually handed:
#
#   "there is no wind, no breeze, no gust, nothing is blowing"
#   "does not bend, lean, tilt, sway, nod, bob or wobble at any point"
#
# At guidance 1.0 the positive prompt is the ONLY channel the sampler reads
# (ltx_i2v.py:1001-1008 — do_classifier_free_guidance is guidance_scale > 1.0, so
# no uncond pass runs). Diffusion conditioning does not subtract on negation: those
# two clauses put wind, breeze, gust, blowing, bend, lean, tilt, SWAY, nod, bob and
# WOBBLE into the binding channel. The anti-wobble prompt contains the word wobble.
# It is at best inert and at worst a stronger commission of the defect than the
# r2g control, whose only offending words were "sways" and "tremble".
#
# THE PRECEDENT THIS FOLLOWS, not an invention. Beat 14 r1's positive said "its
# thin stem bending and springing back"; the ledger record ep1-b14-v34-motion-sample
# reads "LTX honoured `bending` and never `springing back`" and the sapling was
# near-horizontal by frame 64. r2/r3 fixed it by replacing the directional verbs
# with AMBIENT AFFIRMATIVE ones — b14 r3's "the sapling stands upright and holds
# its position, stem straight and steady, rooted firmly in place" and "the camera
# is locked on a tripod and stays perfectly still". Same shape, same fix, applied
# here: say what the scene IS.
#
# THE RULE THIS PROMPT OBEYS: zero negation words of any kind in the positive. No
# "no", no "not", no "never", no "nothing", no "without", no un-/-less forms. Every
# clause is a positive description of a still scene. Stillness is carried by calm,
# settled, hushed, at rest, rigid, straight, rooted, fixed, held, identical, same.
#
# THREE BLOCKS STRIPPED, each replaced by an affirmative, none merely relocated:
#
#  1. FRAMING. r2g/stillwording said "a locked-off tripod shot: the camera never
#     moves". "never moves" is the same defect one notch quieter, and this beat has
#     already been burned by it: the ledger blames beat 10's 181px apex climb on r1,
#     "a prompt whose only framing instruction was the negation `no camera rise`".
#     Replaced by where the camera IS and that it holds — "locked on a tripod at
#     ground level and holds that one position for the whole shot" — plus the
#     positive frame anchors (same height, same size, same horizon, identical
#     composition) that the b04/b07 r2 sidecars already proved out.
#  2. FIGURE BAN. "Subject already in frame: no human, no person, no man, no woman,
#     no boy, no girl, no hand, no face" — eight forbidden nouns in the binding
#     channel. The audit ties exactly this string to Roman's 2026-08-11 beat-07
#     complaint, "the control has some people in the background which we dont
#     want". Stripped entirely; its affirmative half (what IS in frame) is kept as
#     the closing subject clause. The nouns stay in the negative, where they belong.
#  3. THE ANTI-WIND AND ANTI-WOBBLE CLAUSES. Replaced by still air described as
#     air — calm, settled, heavy, hushed — and a plant described by its posture.
#
# THE RISK, named. The 2026-08-03 K recipe was rejected as "literally just frozen
# frames". The dust motes and the light shift are kept as the shot's living motion
# so there is something alive to look at. If this comes back dead, the finding is
# that the ambient clause needs to carry more, not that stillness was wrong.
#
# NO METRIC RANKS THIS. On beat 14 the flow metric scored highest on the round
# where the sapling falls over (131e433). One clip, for Roman to look at next to
# the two he judged. If a number and the picture disagree, the picture wins.
#
# ONE SAMPLE. One beat, one wording change, one seed. Sequential; no batch
# (CLAUDE.md 2026-08-03).

