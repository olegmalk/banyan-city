bar: "EVERY CLAUSE k3 PASSED, HELD, PLUS THE TWO IT FAILED ON. k3 is the\nincumbent and this rung replaces\
  \ it or it does not ship: nine clauses held, and\na regression on any of them is a FAIL even if the\
  \ two new ones pass.\nRuler: pipeline/measure_face_eye_0821.py, whose --selftest reproduces the\npublished\
  \ f/g/h numbers before it is allowed to produce a new one.\n  READ THE RULER'S KNOWN ARTIFACT BEFORE\
  \ QUOTING IT. Its WHITE_MIN is 190 and\n  k3's eyes render to a dimmer cream that falls under it, so\
  \ the AREA column\n  read 0.0040 on a face with two plain eyes. The threshold is calibrated\n  against\
  \ five published rungs and IS NOT MOVED to flatter a sixth. THE\n  BOUNDING-BOX COLUMN IS WHAT THIS\
  \ BAR IS SCORED ON, and any area figure is\n  quoted at both 190 and 170 with the pair shown.\nTHE TWO\
  \ NEW CLAUSES, and they are why the rung exists:\n  NO HORNS. No spike, prong, antler or protrusion\
  \ off the skull. k3 grew two.\n       This is a creature-feature fail and it is judged BY EYE at 1:1\
  \ -- the\n       pale-above-dome proxy separates k1 (0.04%) from k3 (0.90%) but reads\n       0.39%\
  \ on horn-free k2, so it corroborates and does not decide.\n  NO COWL. The tile's purple cowl-scarf\
  \ must not appear at the neck.\n       Containment break #2 of the three named on k1; it fired on k3.\n\
  THE SIZE CLAUSES, which are the ones this axis is supposed to move:\n  T1b  SHAPE -- per-eye aspect\
  \ (h/w). TILE 0.52; k1 0.54, k3 0.54. Hold it.\n       SIZE -- eye bounding box relative to the head\
  \ box, against the tile.\n       j2 1.40x, k1 1.87x, k2 2.32x, k3 1.24x. PASS is 1.4x or lower, which\n\
  \       means k3's 1.24x is the number to beat and j2's 1.40x is the floor.\n  T8   4.5+ heads. j2 5.56,\
  \ k1 4.57, k2 4.41 FAIL, k3 4.97. Scored first.\nHELD FROM k3, all nine: T1 no iris and no pupil, T2\
  \ no nose bridge, T3 no age\nmodelling, P1 the brow bar with skin between it and the eye (a lash arc\
  \ welded\nto the rim is an eyelid and does not count), P2 muzzle, P3 a mouth line, P4\nfacial shading,\
  \ plus the standing pose and the patchwork cloak in tall grass."
failure_predicted_in_advance: 'THE TREND SAYS the eye box lands between k3''s 1.24x and k4a''s 1.41x,
  aspect improves back toward the tile''s 0.52 from k4a''s 0.59, and head_frac drifts a little under the
  0.190 authored from k4a''s 0.195 -- T8 has 0.6 heads of room above the 4.5 bar so it is not the clause
  at risk.


  k5b IS ALSO A FALSIFICATION TEST AND THAT IS WHY IT IS THE LOWER OF THE TWO. At 3.9%% encoder coverage
  it sits BELOW k3''s 5.4%%, on a square canvas. The k4 reading says the horn was the CUT and that starvation
  alone does not grow one. IF k5b COMES BACK WITH A HORN, that reading is wrong -- coverage has a floor
  and the horn is a starvation effect after all -- and the honest consequence is that the usable window
  is pinched between a horn floor and an eye-size ceiling, which would retire the reference route for
  SIZE outright.


  IF BOTH COME BACK CLEAN AND NEITHER BEATS 1.4x, the axis is exhausted: every point on it has been measured,
  none passes, and the eye belongs to an instrument this route does not contain. I am not filing what
  that instrument is, because the band has already falsified one confident reading from this lane tonight.'
