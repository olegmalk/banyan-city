why: 'RUNG k5a: k4a''s rung with the square reference''s head at 0.25 of frame instead of 0.30. Same axis,
  one variable, everything else frozen.


  WHAT THE k4 BAND ESTABLISHED. On a SQUARE canvas the centre crop is a no-op and all four rungs came
  back HORN-FREE and COWL-FREE, including k4a at 8.8% encoder coverage. The horn was never smallness --
  it was k3''s 416x608 PORTRAIT reference losing the top 30% of its subject, the whole cranial dome, to
  CLIPImageProcessor''s centre crop, with the horns growing upward out of that cut.


  AND WHAT IT COST. Eye size rose monotonically with coverage across the band -- 1.41x, 1.70x, 1.94x,
  2.10x the tile''s relative bounding box -- with aspect rounding off from 0.59 to 0.86 against the tile''s
  0.52. So k3''s best-in-tree 1.24x was a crippled embedding transferring less of everything, and k4a
  at 1.41x merely ties what j2 draws with NO adapter.


  WHY BELOW 30% IS THE NEXT PLACE TO LOOK AND NOT A GUESS. The axis is monotonic across four measured
  points and k4a sits at its low end. The trend puts an eye between k3''s 1.24x and k4a''s 1.41x below
  30% -- and there, unlike k3, the subject is INTACT. This rung is an extrapolation from the band, not
  a new idea about the mechanism.'
