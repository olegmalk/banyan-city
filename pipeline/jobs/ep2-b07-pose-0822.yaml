success: 'ONE 832x1216 png. THIS BEAT IS ABOUT CROSSOVER AND THE BAR IS SCORED ON CROSSOVER FIRST. (1)
  THE GUARD IS HUMAN. No pointed ear, no green skin, no bald dome. Tonight''s motion clip put a POINTED
  EAR on him and that is the measured defect this rung is aimed at. (2) THE GUARD''S KIT IS HIS OWN. A
  tan tunic and a WHITE SHOULDER SASH -- no mandarin collar and no frog closures, which are the goblin''s
  and which arrived on the guard in every previous frame of this beat. (3) THE GOBLIN IS THE GOBLIN: broad
  bald dome, large pointed ears, small off-white almond eyes. He does not acquire the glasses, the hair
  or the sash. THE GLASSES ARE THE ONE TO WATCH -- beat 05''s pose frame bound a moustache to one man
  and spread the glasses across both. (4) TWO FIGURES, one of each. One is a DROP and three is a DROP.
  (5) THE POINT LANDS: the guard''s arm extends left and his hand ends at the goblin''s face, not his
  belly and not the air. (6) THEY ARE THE RIGHT SIZES -- the guard is a five-head adult and the goblin
  is short with a large dome, which the hint asserts. (7) DAYLIGHT in a real grass field, and DETAILED
  CINEMATIC ANIME. PRE-REGISTERED FAIL MODES, most likely first: CROSSOVER SURVIVING THE SEPARATION --
  the glasses or the collar on both, which would say a drawn structural split is not enough and the lever
  is per-figure conditioning (--ip-ref twice with --ip-mask-capsules, which the b08 lane already wired
  and whose capsules can be built from this same skeleton). THE SPECIES MERGING, a green guard or a human
  goblin, which is worse than crossover and would retire this hint. The POINT missing, which the selftest
  has already measured to 0.0 px in the drawing, so a miss in the render is the net and not the geometry.
  And a THIRD figure, which this beat has produced before.'
why: 'THE ADAPTER ROUTE IS CLOSED BY MEASUREMENT. window4 and content on beats 05 and 06 -- opposite settings
  on both axes the sampler has -- all four returned the reference photograph''s crop and pose: a head-and-shoulders
  close-up with the hands up at the face, no board, no field. So this rung takes the PICTURE from a drawing
  and the MAN from the words, with no reference image anywhere in the job. Two nets, because a COCO-18
  hint has no keypoint for a plank and the board is this beat''s entire fault: openpose for the five-head
  figure and scribble for one rectangle exactly as wide as the skeleton''s shoulders. The scribble net''s
  known defect -- it traces whatever it can read -- is the feature here, because the thing being traced
  is a board and boards are rectangles. Both hints come out of one file and one geometry, so the prompt''s
  `as wide as his shoulders` and the drawing''s width are the same number. $0, ~3 GPU minutes. Full trace:
  pipeline/derive_b06_pose_0822.py and pipeline/author_b07_twofig_pose_0822.py.'
