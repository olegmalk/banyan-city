# Durability: the courier commits farm-out and force-pushes on every job_done,
# and farm-out is NOT gitignored, so publishing is a COPY and needs no runner
# change. allow_fail so a failed copy never marks a good render failed.
- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b14-goblin-facepick-sample"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/goblin-ipa-0810/out-b14-facepick/*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        # Hash the COPY: the manifest must attest to the bytes that get committed.
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
        print("   ", os.path.basename(f), h[:16])
    # newline="\n" is load-bearing on Windows: text mode would append \r to every
    # filename and shasum -c on the Mac could not open one of them.
    with open(os.path.join(dst, "ep2-b14-goblin-facepick-sample.sha256"),
              "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)

# The four DISTINCT frames (one per seed, r0 row). r1/r2/r3 are byte-identical
# to r0 at the same seed because all four references are the same image, so
# declaring them as artifacts would assert four facts about one file.
artifacts:
- C:\banyan-farm\goblin-ipa-0810\out-b14-facepick\14-the-defense-ipa-r0-w015-s0.png
- C:\banyan-farm\goblin-ipa-0810\out-b14-facepick\14-the-defense-ipa-r0-w015-s1.png
