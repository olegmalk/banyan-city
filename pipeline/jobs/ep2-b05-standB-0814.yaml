    was ASKED FOR, by its own description; this is the pixels.
  and_one_thing_that_is_genuinely_new_and_cuts_the_other_way: >-
    THE PLATES ASKED FOR BALD AND THIS CLIP'S GUARDS BOTH HAVE HAIR. guard_plates_are_miscast_0816
    counts 14 of 17 guard-beat prompts containing `bald` or `bare heads` and calls that
    decisive because "NEITHER APPROVED GUARD IS BALD". Both men in this file have full heads
