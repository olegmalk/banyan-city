    what_it_re_explains: "WE RECORDED THE RENDER DRIFTING TOWARD THE APPROVED CAST AS THE
    DEFECT." On the hair AXIS this render is closer to canon than its own prompt was. It is
    still wrong — wrong colour on one man, wrong age on both, no sash and no glasses — but a
    redraw lane should know that `bald` was not what came back, because a plan built on
    "the plates are bald so the clips are bald" would be planning against the wrong picture.
  who_this_is_for: >-
    NOT a taste question and not escalated as one. The ruling is already made and already
    frozen; this is a defect against it, which per the taste/picks boundary is the steward's
    to name and the plate lanes' to fix. It is flagged loudly because a founder ruling being
    silently contradicted by footage in five cuts is precisely what an unjudged middle
