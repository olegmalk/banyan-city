  relation_to_this_job: >-
    NOT byte-identical to this job's artifact and that is deliberate, not an error. The cut
    carries the trim_pass_0815 derivative — its own sidecar says "trim_pass_0815 output: 3
    degraded head frames removed, 5.04s -> 4.92s" — so 118 frames, not 121. The trim removed
    only head frames, so every clause below is scored on the same pictures this job rendered
    minus its first three. Frame indices in this verdict are indices into the TRIMMED file.
  method: >-
    pipeline/coldread_frames.py --pad 60: 118 CONSECUTIVE source frames over six strips plus
