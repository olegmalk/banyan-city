# ==================================================================
# FIRST VERDICT ON THIS FILE, 2026-08-19 — judging-lane sweep of the
# eight beats cut-readiness-0819.yaml's `the_unscored_middle` named as
# having ridden five consecutive cuts with no verdict block anywhere.
# The file judged is the TRIMMED derivative of this job's output, which
# is what is actually in the cut. Bar taken verbatim from
# done-definitions beats.05.done_when; cast checked against the FROZEN
# wardrobe canon in guards_CORRECTION_0816. No bar was invented.
# ==================================================================
verdict: >-
  FAIL, on four of seven clauses, AND IT CONTRADICTS A FROZEN FOUNDER RULING ON THE CAST —
  see `verdict_contradicts_a_founder_ruling` below, which is the reason this sweep exists.
  What this take genuinely won is worth saying first and saying plainly: TWO FIGURES, IN A
  FIELD, FROM FRAME ONE TO FRAME 117, never one and never three. That is the clause four
  rounds of words produced 1, 3 and 3-plus on, the plate supplied it, and it holds for
  every one of the 118 frames. Zero identical adjacent pairs in the whole clip
  (exact_freeze_index dup_pairs=0), so nothing here is dead air either. Everything else
  fails. Neither man wears a sash; both read adolescent rather than adult; the jog is gone
  by the record's own choice and nobody amended the definition; and the right-hand guard is
  REDRAWN MID-CLIP — he bows double from f045, loses his face entirely f049-f054, snaps
  upright at f055 with a different head, and bows again f057-f059.
