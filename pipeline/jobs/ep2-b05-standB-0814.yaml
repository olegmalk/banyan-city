verdict_measured:
  no_freeze_at_all: >-
    exact_freeze_index.py: `frames=118 terminal_freeze_index=None terminal_freeze_len=0
    dup_pairs=0 runs=[]`. Not one identical adjacent pair in the whole clip. Parity-collapsed
    lag-4 mean-abs confirms it from the other side: median 10.94, MINIMUM 5.62, so there is
    no four-frame window anywhere in this clip that is one picture. Beat 05 is the liveliest
    of the eight beats in this sweep by a wide margin and the sampling caveat in
    blind_read_0815_b05_b06_b10.reconciliation.sampling_caveat_do_not_read_as_a_defect is
    hereby corroborated: the reader found set N "completely static" at f110-f119 and it is
    not static, it is a decel. Nothing in this file is frozen.
  the_thrash_window: >-
    The five largest interframe steps in the clip fall at pairs 65, 67, 61, 63 and 56 — all
    inside the f045-f070 bow-and-redraw window, none of them at the head. So the clip's
    peak motion is the defect, not the action. Recorded because a bare "this clip moves a
    lot" number would read as praise.
