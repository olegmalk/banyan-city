  honest_scoping_this_is_not_a_new_discovery: >-
    THE CLASS WAS ALREADY KNOWN AND SAYING OTHERWISE WOULD BE THEFT.
    guard_plates_are_miscast_0816 states the headline in capitals — "EVERY GUARD PLATE WE
    OWN IS MIS-CAST, AND IT IS ONE CAUSE ACROSS SIX BEATS ... NO MOTION WORK ON BEATS 05,
