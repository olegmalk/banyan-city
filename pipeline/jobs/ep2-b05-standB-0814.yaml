    about what a fix DID rather than about what the frames SHOW — is the same shape. Not
    charged as the same error; noted as the same shape.
verdict_next_instrument: >-
  A CAST-CORRECT PLATE, WHICH IS ALREADY THE NAMED ROUTE AND ALREADY ANOTHER LANE'S. Two
  further constraints this read adds for whoever draws it. (1) The plate must DISTINGUISH the
  two men by garment, not only by hair — identical tan shirts make A and B unidentifiable
  even when the hair is right, and it is also what lets a prop wander between them. (2) The
  redraw window is f045-f070 and it coincides exactly with the prop reassignment, so an
  identity-holding instrument tested on the head or the tail of this clip will report success
  on the two thirds where nothing was wrong. Named, not fired — this lane files no GPU work.
verdict_status_recommendation: >-
  best-available, UNCHANGED, with four failed clauses and a founder-ruling contradiction now
  named rather than blank. It stays cuttable: two guards do stand in a field, the VO plays
  over them, and a slate is worse. But the middle 25 frames are the weakest quarter-second
  stretch in this sweep and an assembly with a trim budget should spend it here — f045-f070
  is a bounded, nameable, removable window, and losing it costs about one second of a beat
  whose head and tail both hold.
verdict_by: judging lane, 2026-08-19. $0, no GPU, no render. Bar quoted verbatim, never widened.
