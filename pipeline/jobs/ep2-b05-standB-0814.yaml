    move can score as a cut. Then review/ep2-picks/exact_freeze_index.py and a
    parity-collapsed lag-4 mean-abs series.
verdict_clauses:
  P1_two_guards_from_frame_one: >-
    PASS, unambiguously, and it is the strongest thing this beat owns. Two figures are in
    frame at f000 and at f117 and at every frame between. No third guard appears, no figure
    drops out, nobody walks off an edge. Against the recorded history — round 1 one guard,
    round 2 three guards at both seeds, round 3 three at seedA and "four-ish" at seedB —
    this is the clause the two-guard scene plate was fetched for and it delivered it.
  P2_jog_in_together: >-
    FAIL, AND FAIL BY DESIGN, WHICH IS WORTH SEPARATING FROM A DEFECT. Nobody jogs. Both men
    are standing at f000 and there is no run-in, no approach, no travel toward camera at any
    point. That is exactly what the record chose: beats.05.lever reads "stage them ALREADY
    STANDING and scanning rather than jogging in - motion toward camera is what breaks it",
    and beats.05.park_reason reads "even with count supplied by the plate, the jog pulls the
    camera and loses the pair". THE LEVER TRADED THIS CLAUSE AWAY TO WIN P1 AND NOBODY WROTE
    THAT DOWN. `done_when` still says "jog in together FROM FRAME ONE" and the pick is named
    `standB`. So the definition and the pick have been in contradiction since 2026-08-14 and
    five cuts have shipped over it. This lane does NOT amend the definition — whether the
    scavenger-spotting patrol may arrive already standing is a staging call about how the
    beat reads, and it belongs to whoever owns the beat's staging, not to a judging lane.
    It is escalated, not decided.
  P3_stop_and_scan: >-
    PARTIAL AND WEAK, and it is not the reason for the FAIL. There is real head movement:
    the right-hand guard's head turns to his right through f000-f044 and both heads make
    small turns through the tail f100-f117, on a locked camera, with zero duplicate frames.
    A viewer would accept "two people standing in a field looking about". What is NOT a scan
    is the middle: f045-f070 is the right guard pitching forward and doubling over, twice,
    which no reading of "stop, and scan" covers. Scored PARTIAL because the clause is met at
    the head and the tail and contradicted in the middle.
  P4_both_adult_men: >-
    FAIL. Both figures read as adolescent boys — smooth round cheeks, small soft chins, large
    eyes, no jaw mass, slight shoulders. This is not a new observation and it should not be
    presented as one: beats.05.shipping_fault already records "the two guards read younger
    and softer-drawn than the guards in beats 06 and 11", and the blind reader in
    blind_read_0815_b05_b06_b10 scored this pick 5/10 and marked the de-aging as MORPHOLOGY
    and "the single biggest change in the set". What this read adds is that it is true of
    BOTH figures and true from f000 — it is not a drift away from an adult plate, the plate
    is adolescent too, so no identity-holding lever can reach it.
  P5_in_tunic_and_sash: >-
    FAIL, and on the sash specifically. Both men wear a tan-brown shirt over a brown wrap
    skirt, so "tunic" is arguably met. NEITHER WEARS A SASH. The dark-haired guard has a
    narrow DARK diagonal strap across his chest that reads as a satchel or bandolier strap,
    not a sash; the light-haired guard has a DARK band at the waist that reads as a belt.
    There is no white sash, of either the waist or the over-shoulder kind, anywhere in 118
    frames. Checked at f000, f055, f100 and f117 so it cannot be a transient.
  P6_field_present_at_frame_one: >-
    PASS. f000 has grass edge to edge, a dark hedgerow band across the upper third and blue
    sky with cloud above it. No white burst, no iris, no scene forming. The world is a
    property of the plate here and the plate delivered it.
  P7_neither_redrawn_mid_clip: >-
    FAIL, DECISIVELY, AND THIS IS THE HARDEST OF THE FOUR. Read consecutively: f040-f044 the
    right guard stands with a dark teal board in his hands; f045-f046 he pitches sharply
    forward, head dropping, arms swinging back; f049-f054 he is doubled fully over with only
    the back of his skull and his back visible and HIS FACE IS OUT OF THE PICTURE; f055-f056
    he is bolt upright facing camera AND HIS HEAD IS A DIFFERENT HEAD — auburn rather than
    mid-brown, a longer face, a different hairline and a different fringe; f057-f059 he bows
    over again. The left guard is redrawn more quietly over the same stretch: a cowlick
    (ahoge) appears on his crown around f048 and is still there at f117, where f000 has a
    flat fringe. NOT A CUT, and that distinction is load-bearing here — every one of those
    transitions is smooth frame to frame, so this is genuine motion into a wrong pose and a
    genuine redraw, which is worse than a sampling artifact and cannot be dismissed as one.
  prop_identity_bar_standard_0815: >-
    FAIL, and this read CONFIRMS THE BLIND READER ON THE WHOLE CLIP rather than on ten tail
    frames. blind_read_0815_b05_b06_b10.verdicts.'05'.prop_fault says "THE PROPS SWAPPED
    HANDS. In the reference the boy holds the teal clipboard and the man carries a grey-blue
    slab. In the frames the man holds both and the boy's hands are empty." At f000 of this
    file each man holds one object. From roughly f053 to f117 THE DARK-HAIRED GUARD HOLDS
    BOTH — the grey-blue slab tucked under his left arm and the dark teal board in his right
    hand — and THE LIGHT-HAIRED GUARD'S HANDS HANG EMPTY at his sides. So the reassignment
    is not a property of the tail sample the blind reader happened to get; it happens
    on-screen, in the middle of the clip, during the same f045-f070 window in which he is
    redrawn. The two faults are one event.
  identity_drift_bar_standard_0815: FAIL — see P7. Face and hair both change on the right-hand figure; costume holds. "Roughly the same costume, drifting face", the reader's own phrase for it.
