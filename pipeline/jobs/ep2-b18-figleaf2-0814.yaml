script_authority: 'Node 002b-first-citizen, live script `002b-t0-c`, `approved_by: founder`, `approved_on:
  2026-08-03`, read from genomes/sapling/nodes/002b-first-citizen/leaves/002b-t0-c.yaml, the leaf the
  render gate itself reads. Neither `approval_condition` touches beat 02. This is a mechanism test on
  an approved node, not an episode assembly.'
consumer: motion-wave, which re-animates this beat off the plate.
success: Sixteen frames. Read the strip along the SEED axis, not the reference axis - the previous fig
  set was the same crop four times and the first cold read saw one picture four times as a result. Cold
  read again with no context. Pass is a majority calling it a FIG. THE DECISIVE QUESTION is whether the
  LEAF reads as lobed with fingers; if the leaf lands and the fruit still reads as an aubergine, then
  the fruit was never the problem and a fig leaf belongs in every fig shot in the show. If the leaf comes
  back as simple ovals again, the reference is not reaching leaf shape either and the fig goes to the
  founder as a question rather than another round.
why: 'STOP DESCRIBING THE FRUIT. Seven rounds on the fruit produced 0 of 4 reads as a fig - two eggplant,
  one plum, one ''not a fruit at all''. The LEAF carries the identification instead: a deeply lobed fig
  leaf is unmistakable and the fruit under it can just be a purple teardrop. The cold reader said the
  same thing independently. PREMISE CORRECTED: beat 16 did NOT produce a lobed leaf. Its four plate frames
  are close-ups of the GOBLIN - he pulled focus and the leaf never became the subject, the exact failure
  that beat''s own spec predicted - so there was no accidental win to harvest. The leaf is sourced licence-clean
  instead: Wellcome Collection j92sfxzp, ''Fig (Ficus carica L.): fruit and leaves'', coloured aquatint
  by G. Pera c.1825, PUBLIC DOMAIN MARK, sha256 ba9b3b2cf9455c595939b94855e81a15c7aabe891e5ec6f235238e91c18641a8.
  Wellcome''s y5c3yxzt was rejected on licence: cc-by-nc. REFERENCE IS NOW TWO SOURCES IN FOUR SLOTS -
  two crops of the lobed leaf, two of the purple Brunswick fruit including one tight on its base. The
  leaf says what plant this is; the fruit says the colour and the matte surface. The crossing-stem artifact
  the reader called systematic is banned by name, and ''ostiole'' is described rather than named because
  the word never landed once in seven rounds.'
