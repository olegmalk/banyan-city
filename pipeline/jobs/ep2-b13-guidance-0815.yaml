# 2026-08-15, CFG lane. Beat 13, THE SHADE. ONE SAMPLE OF LEVER L4:
# GUIDANCE 2.0 -> 1.0, AND A MATCHED CONTROL BESIDE IT IN THE SAME JOB.
# GUIDANCE IS THE ONLY VARIABLE. Generated, not hand-typed, and the control's
# prompt/negative/plate/sha are READ OUT OF pipeline/jobs/ep2-b13-stg-0815.yaml
# rather than retyped -- see the assertions at the bottom of the generator.
#
# 1. THE SCRIPT LINE, quoted from genomes/sapling/nodes/002b-first-citizen/node.md:
#
#      **THE SHADE -- 1:00-1:04**
#      "The scavenger slides down the trunk and folds into the sapling's tiny
#       shade, knees up around his ears."
#
# 2. WHAT IS ALREADY RULED OUT, EACH BY MEASUREMENT. None of it is re-derived.
#    * WORDING. Five wordings, three seeds: no arm produced a figure still
#      acting after frame 64.
#    * THE INIT PLATE (onset). Measured across ten clips, 9/10 inside 0.25s.
#    * THE 13-LATENT COUNT. (97-1)//8+1 = 13 is correct arithmetic and the
#      latent grid is period-8 while we measure period-3 (dfa87c27).
#    * THE DECODE SIDE, END TO END. A real plate panned a fixed integer px per
#      frame came back moving on every frame; tiling ON vs OFF differed by
#      0.4 dB and nothing else, and a known period-3 hold fed in came back
#      period 3 in both arms (70e3c79a).
#    * STG AT UPSTREAM'S RECOMMENDED SETTING. stg_scale 1.0, blocks [28]:
#      period 3 -> 3, 32.0 -> 32.0 distinct pictures, 8.0 -> 8.0 effective fps.
#      Unmoved. It bought a crisper picture, +25% travel per ten frames after
#      alignment, an unrequested 1.036x push-in and +21% render time (369e4101).
#
#    So the hold is in the latents and the remaining levers are the ones that
#    change what the transformer is asked for. Guidance is the best-sourced of
#    those, and it is the last one with a PRIMARY source behind it.
#
# 3. WHY GUIDANCE, AND WHOSE WORDS THOSE ARE.
#    Lightricks' own packages/ltx-pipelines/docs/multimodal-guidance.md:
#
#      "Higher `cfg_scale` = stronger prompt adherence but potentially LESS
#       NATURAL MOTION"
#
#    The STG paper, arxiv.org/abs/2411.18664, first line of the abstract:
#
#      "While sampling guidance techniques like CFG improve quality, THEY
#       REDUCE DIVERSITY AND MOTION."
#
#    And the official ltxv-13b-0.9.8-DISTILLED config sets `guidance_scale: 1`
#    in BOTH passes. We run 2.0. ltx_i2v.py's own --guidance default is already
#    1.0 -- 2.0 is what our job specs pass, presumably so the anti-static
#    negative (which contains "still image, freeze frame") would bite.
#
# 4. WHAT GUIDANCE 1.0 ALSO DOES, STATED UP FRONT RATHER THAN DISCOVERED LATER.
#    do_classifier_free_guidance is (guidance_scale > 1.0), so at 1.0 there is
#    NO UNCOND PASS AND THE NEGATIVE PROMPT IS NEVER READ. That is inherent to
#    the flag, not a second variable smuggled in: you cannot have CFG 1.0 and a
#    live negative. It is called out here because "zoom, dolly, push in" lives
#    in that negative, so the 1.0 arm has nothing suppressing camera motion.
#
# 5. THE BAR, WRITTEN BEFORE THE FRAMES ARE LOOKED AT.
#    The control is a re-run of the STG lane's control -- same plate, same
#    asserted sha, same seed 20260815, same prompt, negative and flags -- whose
#    published clip measures, on pipeline/hold_period.py (d820bf3f) with the
#    trough/peak DEPTH from pipeline/vae_roundtrip.py (70e3c79a) beside it:
#
#      period 3 | strength 0.923 | DEPTH 0.038 | 32 distinct pictures | 8.0 fps
#      no terminal freeze: last change at frame 96 of 96
#
#    Depth travels with every number because the metric is SCALE-FREE and reads
#    a +-3% ripple like a freeze: a VAE round trip whose frames provably advance
#    4px reported period 2 strength 0.90 at depth 0.971. Reference depths:
#    b13-AFTER 0.029, STG arm 0.059, b06-DONE 0.181, b02-FIXED 0.431.
#
#    PASS = period falls, or distinct pictures rise materially above 32, or the
#    figure is still acting after frame 64. FAIL = period 3 at depth ~0.03
#    again, reported exactly as loudly as a win would have been. A third
#    outcome is live and MUST NOT be misread as a win: APPARENT MOVEMENT THAT
#    IS THE CAMERA. Three clips on 2026-08-15 showed unrequested push-ins
#    (1.036x, 1.26x) WITH the negative active; the 1.0 arm has no negative at
#    all. Scale and drift are settled by FRAME ALIGNMENT, never by eyeballing a
#    contact sheet -- a lane made that exact error twice on this beat, and the
#    second time it reached a committed spec.
#
# 6. THE FRAME-62 WALL IS SCORED SEPARATELY AND MUST NOT BE CONFLATED WITH THE
#    HOLD. Two bark clips on beats 06 and 10 are BIT-IDENTICAL from frame 62 to
#    96 (ncc 1.000). Beat 13's STG sample had NO terminal freeze in either arm.
#    So a clip can hold every picture for three frames and still be changing at
#    frame 96: two phenomena, measured separately. Both arms are asked where
#    they go bit-identical, and an arm whose period improves while the clip
#    dies at f62 is a PARTIAL result and gets reported as one.
#
# 7. HOW THE TWO ARMS ARE KEPT MATCHED. One crop from an asserted plate sha,
#    ONE ENCODE FEEDING BOTH ARMS (so "identical text conditioning" is the same
#    .pt read twice and not an assumption about Gemma's determinism), one seed,
#    both renders in one job. The two render steps are built from a single argv
#    function whose ONLY recipe parameter is guidance; the generator asserts
#    that the sole recipe-flag difference is --guidance and that every other
#    difference sits after --jobs, --task, --bench-jsonl or --bench-label. It
#    further asserts our control's argv IS the STG lane's control argv modulo
#    job-name plumbing, so the sha comparison in section 8 is meaningful.
#    Recipe, unchanged and NOT under test: 704x1280, 97 frames, 24fps,
#    two-stage 8@352x640 + 3@704x1280, distilled sigmas, image-crf 33,
#    sequential offload, STG unpassed on both arms.
#
# 8. NO RENDERER CODE IS TOUCHED. `--guidance` has been a flag on ltx_i2v.py
#    since long before tonight, so there is no "did the patch change the
#    default path" question to answer: this job yaml is the entire diff. The
#    control still doubles as the harness check -- the STG lane's control
#    published 13-the-shade-STG-OFF-control.mp4 at sha256
#    42043851da4b246cfcd4e858cda828da992d0d48f15ef10d81d3a99c1ceb445a and the
#    init png at 210932b7..., and this job's control asks for both again. A
#    mismatch invalidates the comparison rather than being explained away.
#
# 9. THIS IS ONE SAMPLE. Whatever it shows, nothing scales off it. On
#    2026-08-03 a recipe was picked on a steward's own metric, rendered across
#    all fifteen beats, and came back "literally just frozen frames". A metric
#    agreeing with the steward is not a sample, and one sample is not a batch.
