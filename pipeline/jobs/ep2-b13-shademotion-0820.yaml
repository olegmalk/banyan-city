  -- the branch tip before 2026-08-20 was itself another lane''s hand-carry of beat 04''s plate for the
  same reason. box_enqueue.plate_problems reads --src off that branch and nowhere else, so both plates
  were carried across byte-identical and re-hashed on the branch afterwards. THE ALTERNATIVE WAS A plate_ack:
