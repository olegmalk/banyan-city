    2D anime, hand-drawn cel animation, flat cel shading, clean ink linework, anime key art. the clouds drift slowly and continuously across the sky in one steady direction and keep their shapes, sunlight shifts gently through them, the blue deepens and lightens softly. small ambient motion only, everything holds its position, framing locked, no zoom, no push-in, no camera rise, subject stays the same size and place in frame, living scene. Subject already in frame: no human, no person, no man, no woman, no boy, no girl, no hand, no face, only open blue sky with soft white clouds seen from below, nothing but sky, no ground, no horizon, no buildings.

