  still and the ruling that covers 05/09/12/15 should be extended to cover it.

success: >-
  A 704x1280 mp4 at C:\banyan-farm\v34-r2\06-too-blue-LTX-121f.mp4, 121 decoded
  frames (5.04s), conditioned on his plate, in which the clouds drift and
  nothing else happens: no ground, no horizon line, no buildings, no figure,
  no second scene. Whether the drift is enough motion to carry the beat is the
  OBSERVATION and his call, not the pass condition — a completed clip that
  still reads static is a real result and gets reported as one. An OOM would
  also be a result, though 121 frames is well under the 385 proven on this box.

why: >-
