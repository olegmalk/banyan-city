# WHY. `guard_plates_are_miscast_0816` in review/ep2-picks/done-definitions.yaml:
# 0 of 17 guard plate prompts name the approved cast and 14 of 17 ask for `bald`,
# and NEITHER APPROVED GUARD IS BALD. Guard A has dark cropped hair, guard B has
# light sandy hair. 18 guard plates were drawn on 2026-08-16/17 against those
# prompts and none passed. The founder froze the wardrobe on 2026-08-16 -- "the
# cast stands as drawn", glasses included -- so this is a WORDING correction to
# match a settled look, not a proposal about how the guards should look.
#
# WHY THIS BEAT NEEDS ITS OWN PLATE AND MUST NEVER INHERIT BEAT 08'S. Beats 07
# and 08 want TWO figures, not three (`pipeline/insert_b0708_figure_count_0817.py`
# corrected the three-figure done_when clauses, which were drafted from an
# imagined master). One guard as actor plus the scavenger as target. BEAT 07'S
# GUARD IS GUARD 1 -- guard A, dark cropped hair, wire-rims -- AND HE HAS NO
# CLIPBOARD. The bark board is GUARD 2's prop; beats 06, 08 and 10 are the beats
# that name it. So this prompt negates `clipboard` outright, and beat 08's
# passing two-figure plate cannot stand in for this one no matter how good it is.
#
# THE PROMPT, verbatim from pipeline/wave-drafts.yaml beats.7.authored_b07_nobald_0817
# (repo sha 8466f0b28530e15599787e06c0c150feec39d344b4ea6fc95c10063702113938; both harness copies were synced by
# `box_enqueue.py --sync-drafts` with the queue drained and hash-verified to that
# sha by the tool itself AFTER the copy, and the sampler records `drafts_sha256` in
# every sidecar so the frames prove it themselves):
#
#   A guard man with dark cropped hair, wire-rim glasses, tan wrap tunic, white
#   sash points one arm at green skin crouching low, other hand open, tall grass,
#   treeline behind, pale sky above, cinematic lighting, masterpiece, best
#   quality, very aesthetic No girl, no child, no armor, no helmet, no knight, no
#   clipboard, no dark, no night. No photorealism, no 3D render look. 9:16
#   vertical, no text.
#
# THE SLOT IS GONE AND THAT IS THE WHOLE VARIABLE: the predecessor wrote
# `{{GOBLIN}}` where this writes `green skin`, and the sampler filled that marker
# with `green skin, bald head`.
#
# TOKENS, AND THE TRADE IS NONE. 59 of 77 positive and 58 of 77 negative, measured
# through render_wave_goblin.check() on the REAL CLIP (transformers
# openai/clip-vit-large-patch14, offline) and read back out of the written
# wave-drafts.yaml rather than off a draft in a scratch file. ZERO FAULTS, style
# anchor `very aesthetic` PRESENT, count tag `1boy` derived against a declared
# `1boy`.
#   NOTHING WAS TRADED. Removing `bald head` FREES tokens; this rung spends none of
#   them on filler, cuts no word, drops no clause and does not touch the style tail.
#   So there are no traded words to name as first suspects -- the paragraph that
#   would normally list them is empty on purpose, not omitted.
#   A CORRECTION TO THE PREDECESSOR'S FIGURE, recorded rather than quietly dropped:
#   `ep2-b07-cast-0817`'s header claims 76 of 77 positive and 60 of 77 negative. The
#   draft as it actually stands in wave-drafts.yaml measures 62 of 77 and 58 of 77
#   through check() on the real CLIP. I measure as I find and do not inherit the
#   older number; whichever way that gap arose, it is not the figure for this rung.
#   THE ESTIMATOR IS THE LIKELY SOURCE OF SUCH GAPS AND IS WORTH THE WARNING: with
#   `transformers` NOT importable, sd_prompt falls back to a word-count estimate and
#   compress() uses that same estimate for its own fitting loop, so it sheds the tail
#   the real tokenizer keeps and invents faults. It reads beat 08's clean draft as
#   85/77 with two faults against a true 74/77 with none. A token figure quoted from
#   a plain `python3` on the Mac is not evidence.
# THE PREDECESSOR'S OWN TRADE PARAGRAPH FOLLOWS, carried forward unedited because it
# still describes the tail this draft inherited -- but its 76/77 figure is superseded
# by the measurement above. It says: measured with sd_prompt.negative_tokens rather
# than with compress()'s
# prose estimator -- which under-counts a comma-separated tag list by up to 10
# tokens and let six earlier drafts pass at 78-82 real tokens with the style
# anchor already truncated away. To fit a named cast beside a goblin, this beat's
# longer tail was traded for the 14-token one beats 05, 06 and 09 carry. THE
# TRADED WORDS ARE `Medium full shot`, `bright morning light`, `detailed` and
# `newest`, and they are the first thing to blame if framing or light regresses
# against this beat's older plates.
#
# THE LAWS APPLIED. Every hand in frame is specified -- the pointing arm AND
# `other hand open` -- because an unspecified hand is a vacancy the model fills
# with the largest noun and the negative does not reach it (beat 10 got a bamboo
