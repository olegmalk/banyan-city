# ep2-b07-nobald-0817 -- 2026-08-17. RUNG A: `bald` REMOVED. ONE VARIABLE.
#
# THE LADDER. Beat 07 had TWO measured defects and they are on SEPARATE rungs so the
# result of each can be attributed:
#     RUNG A (this spec)  `bald` removed. NOTHING ELSE MOVES.
#     RUNG B  ep2-b07-twofig-0817  rung A plus the grammar fix.
# `insert_b07_nobald_0817.py` REFUSES TO WRITE rung A unless the draft equals the
# predecessor's SENT string minus exactly the eleven characters `, bald head`. So the
# sash still governs `points` here and the goblin still has no noun -- those are RUNG
# B's variable and are deliberately LEFT BROKEN on this rung. If the guard comes back
# haired, `bald` is what did it and nothing else did.
#
# WHY THIS EXISTS. `ep2-b07-cast-0817` -- the spec whose text begins below and whose
# bar this job carries forward unaltered -- was filed to take `bald` off the guards
# and it STILL SENT `bald head`. It rendered 12 of 12 BALD.
#
# THE TOKEN WAS NEVER IN THE DRAFT, which is why grepping the draft never found it.
# `authored_b07_cast_0817` carries the `{{GOBLIN}}` marker, and the sampler fills it
# from its own constant: `goblin_ipa_sample.py` line 65,
# `GOBLIN_DEF = "green skin, bald head"`. The string the model received was
#
#     1boy, a guard man with dark cropped hair, wire-rim glasses, tan wrap tunic,
#     white sash points one arm at green skin, bald head crouching low, other hand
#     open, tall grass, ...
#
# AND THAT IS WHY b06 IS CLEAN. b06 renders 12 of 12 HAIRED off the same refs,
# sampler, model and day -- the contrast the scoring lane used to rule out model,
# refs, sampler and seed. The mechanical difference is one thing:
# `authored_b06_cast_0817` carries NO `{{GOBLIN}}` marker. b07 and b08 are the ONLY
# two cast drafts that carry the slot and the only two that went 12 of 12 bald. The
# contrast now has a cause, not just a correlation -- and the other five cast specs
# need nothing.
#
# IT CONFIRMS THE BROADCAST-CLASS LAW INDEPENDENTLY. On b08 the token sat inside the
# goblin's own clause -- `green skin, bald head, patched cloak` -- as tightly scoped
# to one character as prose gets, and the GUARD still went bald 12 of 12. So the
# token is REMOVED, not re-scoped, and NO negation is attempted: the vacancy law says
# a negative does not reach an empty region, and a broadcast attribute is a BINDING
# failure rather than a presence failure. The guard's hair is NAMED instead.
#
# `GOBLIN_DEF` IS NOT TOUCHED, and `insert_b07_nobald_0817.py` ASSERTS that rather
# than trusting it. Two founder rulings collide: bald FOR THE GOBLIN is his own
# 2026-08-12 ruling, bald for the GUARDS is the defect he ordered fixed on
# 2026-08-16 ("the cast stands as drawn"). Editing the shared constant would overturn
# the first to serve the second across all eleven goblin beats. The slot comes out of
# these two drafts alone; goblin-only beats keep his bald skull.
#
# THE BAR IS CARRIED FORWARD, NOT REWRITTEN. `success:` below is the predecessor's
# byte for byte, and so is `frame_count_correction_0817` with its `N of 12`
# denominator and the `r3` sentinel already dropped -- a sibling lane's correction
# this rung inherits and does not relitigate. Score N of 12, never N of 16; every
# `r3` frame is a byte-copy of `r0` and is skipped. Recipe, references, arm, seed
# count and seed start are byte-identical to the predecessor's by construction: this
# file IS its file with the draft key, the --out directory and the task name
# substituted and nothing else.
#
# $0. Local card, no provider, no spend. No `plate_ack`, no `drafts_ack`, no gate;
# the frames are UNAPPROVED and PROVISIONAL by this spec's own declaration.
#
# ====================== the predecessor's spec text follows =====================
# ep2-b07-nobald-0817 -- 2026-08-17, GUARD CAST REDRAW. Beat 07, CONFISCATE.
#
# THE ONE VARIABLE. The draft key, and nothing else. Recipe, references, arm,
# seed count and seed start are byte-identical to ep2-b09-plate-nos2-0815, the
# job that drew this beat family's last box plates: same
# refs-guards-twoinfield-nos2-0815, same --arm window4, same 4 seeds per cell,
# no --ref-prefix and no --seed-start. What changes is the WORDING, from a
# prompt that asked for an anonymous bald type to one that names the approved
# cast. That is the whole experiment.
