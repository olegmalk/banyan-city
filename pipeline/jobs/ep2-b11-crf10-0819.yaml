# ep2-b11-crf10-0819 -- 2026-08-19, beat 11 lane. ONE SAMPLE, ONE INTEGER.
#
# THIS IS ep2-b11-leave-w4brake-0817 RE-RUN WITH `--image-crf 33` LOWERED TO 10.
# Every other byte that reaches the machine is the parent's, carried across by a
# script rather than retyped: the payload, the prompt string, the negative, the
# seed 20260817, the plate and its asserted sha256, 97 frames, 24 fps, guidance
# 2.0, distilled sigmas, two-stage, sequential offload and the publish step. The
# derivation then REVERSED its own substitutions on the child and demanded the
# parent back byte for byte, and got it, so "one variable" is a fact about this
# file and not a claim in this comment.
#
# ------------------------------------------------------------------
# WHY, IN NUMBERS THAT ARE NOT THIS BEAT'S.
# ------------------------------------------------------------------
# Tonight a sibling lane ran the same one-integer test on beat 09 (specs
# ep2-b09-faceturn-0819 and ep2-b09-faceturn-crf10-0819, both with their verdicts
# appended). Two byte-identical runs differing ONLY in that integer:
#   f001->f002 face-crop interframe step   39.34 (crf 33)  ->   0.66 (crf 10)
#   ten largest steps in the 121-frame clip  the ten EARLIEST  ->  spread f014-f094
#   background-strip drift                  60.89           ->   9.89
#   identity at f021                        an adult man had become a child
#                                           ->  the same man, held for all 121 frames
# The mechanism is read off our renderer, not guessed: ltx_i2v.py:1083 calls
# _crf_roundtrip() on the conditioning still, which encodes and decodes it through
# libx264 at `--image-crf` BEFORE it is VAE-encoded. The still the sampler sees is
# not the still we chose.
#
# ------------------------------------------------------------------
# WHY THE PARENT IS w4brake AND NOT THE BROKEN 0814 TAKE.
# ------------------------------------------------------------------
# The obvious target is the take done-definitions.yaml calls BROKEN -- beat 11's
# `status_override_0815`, "total identity collapse away from the plate across
# f16-f21", pick ep2-b11-finalB-0814. IT IS THE WRONG TARGET AND THE SAME FILE
# SAYS WHY. `plate_is_miscast_0816` records that that take's conditioning plate
# was opened and shows TWO BALD MEN IN BROWN OVERCOATS -- neither of the two
# approved guards -- and `override_third_check_REREAD_0816` rules that no lever
# which binds identity to a plate can help a plate that does not contain the
# identity: "Do not spend another round on identity-holding levers for this beat
# until it has a plate of the approved men." A codec cannot exonerate that plate,
# and a clip conditioned on it could not be cut whatever came back.
#
# BEAT 11 MOVED ON, and the newer work is what this test belongs to. On 2026-08-17
# the beat got its first cast-correct staged plate (r3s1, published as
# farm-out/ep2-b11-plate-pub-0817/11-they-leave-mac-plate-r3s1.png, sha256
# 425d59f6...; plate_scratch.py's DRAFTS[11] passes it 7 of 7) and four wordings
# were run off it. The last, W4, is this job's parent, and its own `outcome:`
# block scores it against beat 11's done_when: D1 two guards PASS, D2 walking away
# PASS, D4 both present PASS, D5 field at frame one PASS, D6 no head or costume
# change and no merge PASS -- and
#   D3 backs turned, no face: FAIL. "Guard B turns his head into full profile
#   with an open mouth from about f008 to f022 and is back to a clean rear view
#   by f040. FOURTH WORDING, FOURTH TURN."
# FIVE OF SIX, ONE FAULT, AND THE FAULT IS IN THE EARLY WINDOW. That window --
# f008-f022 -- is the same stretch of frames in which the beat-09 pair showed the
# init being discarded and the sampler substituting its own idea of the subject.
# Confirmed here by eye before this spec was written: at f000 guard B is the back
# of a sandy head; at f016 and f022 he has an eye, a nose and an open mouth.
#
# ------------------------------------------------------------------
# THE LEVER, MEASURED ON THIS BEAT'S OWN PLATE BEFORE THE RENDER.
# ------------------------------------------------------------------
# The parent's init was round-tripped locally through the exact ffmpeg commands
# _crf_roundtrip issues, at both values, and compared to the clean plate in
# float64 (mean abs, 0-255). This is what the sampler was handed:
#   CRF 33   FIG 5.741   HEAD_A 5.994   HEAD_B 6.589   BG 5.847   FULL 5.192
#   CRF 10   FIG 1.565   HEAD_A 1.665   HEAD_B 1.636   BG 1.638   FULL 1.482
# The whole 704x1280 conditioning frame survives CRF 33 as 17.6 KB. AND THE BOX
# THE CODEC DAMAGES MOST IS GUARD B'S HEAD, 6.589 -- the highest number of the
# five, on the one head in this shot that fails. Opened at 4x, his head at CRF 33
# is ringing and halo: the hair silhouette blown out, the nape and collar smeared,
# the back-of-head contour that carries "this man is facing away" mushed. At CRF
# 10 it is indistinguishable from the plate. So the prediction is specific: the
# model was being asked to keep facing away a head whose facing-away was the part
# it could not see.
#
# ------------------------------------------------------------------
# WHAT WEAKENS THIS HYPOTHESIS, SAID BEFORE THE RESULT RATHER THAN AFTER.
# ------------------------------------------------------------------
# (a) THE BEAT-09 SIGNATURE IS ABSENT FROM THIS PARENT. Measured on the parent
#     clip with the instrument this spec pre-registers below: its first interframe
#     step is 3.419 (FIG) and is nowhere near its largest; the ten largest steps
#     sit at f005-f037. This clip does NOT throw its init away at frame one the
#     way the beat-09 clip did -- it opens on the plate and holds the field, the
#     costumes and both men. What it has is a LOCAL early defect, not a collapse.
#     A smaller defect has less room to be caused by one flag.
# (b) CRF 33 IS THE UPSTREAM DEFAULT AND IS DELIBERATE. _crf_roundtrip's own
#     docstring: Lightricks' media_io.load_image_and_preprocess round-trips at
#     DEFAULT_IMAGE_CRF=33 "to match the compressed frames the model saw in
#     training -- a clean PNG is out of distribution by their own reckoning." So
#     CRF 10 is the off-distribution direction, FAIL-ARTEFACT and FAIL-FROZEN are
#     live risks rather than politeness, and a research lane is reading the
#     reference implementation in parallel. Beat 09 says 10 was better THERE; it
#     does not say 10 is right, only that 33 was wrong once.
# (c) A CLEAN ANSWER OF "NO" IS WORTH THE SEVEN MINUTES. Beat 11 has spent four
#     wordings and thirteen seeds on this one head. If the codec is not the lever,
#     that eliminates it for every beat still fighting an early-window defect, and
#     it costs an idle card eleven minutes and $0.
#
# NOT A PROMOTION. No pick, no plate_ack, no leaf, no lineage entry, no edit to
# done-definitions.yaml or to the cut. Taste is R4. $0, local card, no provider.
