  opening f000, f004, f008, f012, f016, f020, f022, f028, f040, f060 and f096 at full resolution, plus
  3x crops of guard B''s head at two-frame density across f000-f040 and guard A''s at four -- the same
  density the 0817 lane read the parent at.

  PASS. All three clauses must hold. P1 IS THE CENTRAL CLAUSE AND IT IS D3: GUARD B KEEPS HIS BACK TO
  CAMERA THROUGH f008-f022. No eye, no nose, no mouth, no profile in any frame opened, and no look back
  anywhere in the clip. In the parent he is in full profile with an open mouth from about f008 to f022
  and clean again by f040; a pass here is a clean rear view across that whole window. This is a by-eye
  clause and is not decided by a number. P2 SUPPORTS P1 WITH THE STATISTIC: guard B''s head stops doing
  most of its work in the first third. Parent HEAD_B thirds are 5.594/2.536/0.321. Below 4.0 in the first
  third is a clear pass, 4.0-5.0 is a PARTIAL and will be reported as a partial rather than rounded either
  way, above 5.0 is unchanged. The mid-clip drift peak of 52.505 against an end value of 33.568 -- the
  bump that is the turn and the turn back -- should shrink. P3 THE OTHER FIVE CONDITIONS SURVIVE THE CHANGE,
  quoted from beat 11''s own done_when in review/ep2-picks/done-definitions.yaml, "two guards walk away
  from camera, backs turned, still arguing; both present the whole clip; field present at frame one":
  D1 two guards and no third body in every frame; D2 they end further away than they began by their own
  height and not by the camera moving; D4 both men in every frame including f096; D5 field at frame one;
  D6 neither man''s head or costume changes -- dark cropped hair over the tan coat on the left, sandy
  hair over the dark brown on the right -- and the shot does not end on two indistinguishable backs. All
  five PASSED in the parent, so any loss here is attributable to the one variable and is a fail, not a
  fault.

  PRE-REGISTERED FAIL MODES, EACH REPORTED BY NAME WHETHER OR NOT IT FIRES. FAIL-COLLAPSE-UNCHANGED: guard
  B turns in the same window and the read is indistinguishable from the parent''s. THIS IS THE MOST LIKELY
  OUTCOME and it is a clean answer: it eliminates the codec as the lever for this defect and sends the
  next rung at a conditioning-strength parameter, the CFG or the wording instead. FAIL-FROZEN: the cleaner
  init holds so hard that the shot stops being a walk -- a nonzero terminal identical-frame run, or D2
  lost because nobody recedes. The opposite failure, and it would mean this recipe trades adherence against
  motion on one axis, which is itself the finding. FAIL-ARTEFACT: blocking, banding, posterisation or
  any wrongness the parent does not have. CRF 10 is the OFF-DISTRIBUTION direction here -- upstream chose
  33 deliberately to match training-time compression -- so this is a live risk and not a formality. FAIL-MORPH-LATE:
  the early window clears and identity or costume breaks later instead. Report the frame. This is beat
  11''s historic fault under a new name and the reason f040, f060 and f096 are in the read. FAIL-MERGE:
  the shot ends on two indistinguishable backs (carried verbatim from the parent''s D6 fail mode). FAIL-D2-INVERTED:
  the men grow rather than recede, or the recession is the camera pushing in rather than their legs --
  checked against the background, not by the figure height alone, because a quotient is not a picture.
  FAIL-EXIT: either man leaves frame before f096. FAIL-THIRD-BODY: a third figure appears.

  NOT SCORED HERE: whether this take should be cut, whether it beats ep2-b11-leave-w4-s20260903, the glasses
  question, and anything else that is taste. All R4. The job SUCCEEDS MECHANICALLY IF THE CLIP RENDERS
  AT ALL -- a frozen clip is a successful job and a failed sample, and the two are never confused.'
