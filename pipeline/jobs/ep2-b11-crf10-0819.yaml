  THE PARENT''S NUMBERS, MEASURED AND WRITTEN DOWN HERE FIRST so the comparison cannot be tuned afterwards.
  FIG first step 3.419, mean 3.124, thirds 4.057/3.638/1.676, drift to f096 37.661. HEAD_A first 4.876,
  mean 3.971, thirds 3.347/4.698/3.868. HEAD_B first 6.854, mean 2.817, thirds 5.594/2.536/0.321, drift
