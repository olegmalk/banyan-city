    \ fh:\n    for chunk in iter(lambda: fh.read(1 << 20), b\"\"):\n        h.update(chunk)\nhave = h.hexdigest()\n\
    if a.sha256 and have != a.sha256:\n    sys.exit(\"!! SRC SHA MISMATCH -- refusing.\\n   want %s\\\
    n   have %s\" % (a.sha256, have))\nW, H = (int(v) for v in a.size.split(\"x\"))\nim = Image.open(a.src).convert(\"\
