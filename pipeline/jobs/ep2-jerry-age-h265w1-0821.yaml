  ref_sha256: f65c9bb412e541fbe9b6024ddaec5a78b78028afd87e325baa06d6d430dded14
  ref_provenance: 'adult-b19-0819.jpg cropped (176,280)-(332,432), sky flood-filled with the tile''s own
    field green, pasted CENTRED at 20% of a 448x448 SQUARE canvas. Square is load-bearing: diffusers builds
    CLIPImageProcessor() with no arguments, which resizes the SHORT edge to 224 and CENTRE CROPS to a
    square, so only on a square canvas is the authored head-to-frame ratio the ratio the encoder receives.
    k3''s 416x608 portrait lost the top 30% of the subject -- the whole cranial dome -- to that crop and
    grew horns out of the cut. Encoder coverage here is 3.9%. Rebuild with `pipeline/author_jerry_squareref_0821.py
    --head-frac 0.20`; assert with `--check f65c9bb412e541fbe9b6024ddaec5a78b78028afd87e325baa06d6d430dded14`.'
  mask: 315,130,515,350
  mask_frame: RENDER pixels, 832x1216
  mask_rule: k6a's authored mask 315,130,515,350 TRANSLATED by this pose's head-block offset. The five
    head keypoints move as one rigid block between poses (ear span 136.0 px in every pose at head_frac
    0.190), so the head box translates rigidly and so does the mask. For `stand` the delta is zero and
    this IS k6a's mask. Derived by pipeline/jerry_standard_0821.mask_for('stand').
  scale: '0.7'
  weights: h94/IP-Adapter sdxl_models/ip-adapter-plus-face_sdxl_vit-h.safetensors, apache-2.0, sha256
    677ad8860204f7d0bfba12d29e6c31ded9beefdf3e4bbd102518357d31a292c1, 847517512 bytes. THE GENERAL ADAPTER
    ip-adapter-plus_sdxl_vit-h.safetensors IS THE SAME NUMBER OF BYTES, so only the digest separates them;
