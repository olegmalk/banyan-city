# CHARACTER REFERENCE — MAGISTRATE. ONE SAMPLE, four seeds, $0.
#
# WHY THIS EXISTS BEFORE ANY OF ITS BEATS. The founder's standing consistency
# mandate is "we need to setup character consistency even if they only appear
# once", and his own precedent on the guards was that no guard beat fires until
# a guard reference exists and he has seen it. The magistrate has never been
# drawn. So this is a reference sheet for his eye, not a beat, and no beat that
# needs this character may be queued until he points at a frame.
#
# THE WORDING IS THE SCRIPT'S OWN. Substance is lifted from the node's own
# continuity block rather than invented, because character appearance is
# R4-adjacent and D22 delegated the SCRIPT read, not character design. What is
# on offer here is four candidates; which one is the character is his.
#
# SHAPE IS THE GUARD SHEET'S, which held 4/4 — a single figure facing camera in
# a lit field, face clearly visible, medium shot. Not `multiple views`: the
# research found `reference sheet, multiple views, turnaround` are the tokens
# with weight, but the guards fork then measured that asking for ONE figure
# deliberately was what actually held.
#
# --beat 16 is cosmetic (filename and seed naming) EXCEPT for its count tag,
# which is checked against the beat block's declaration: this draft declares
# `1girl`.
#
#
# ROUND 2 — r1 FAILED CLEAN AT THE DRY STEP, rc=4, zero GPU. The harness
# refused: "carries no {{GOBLIN}} marker, so the founder's definition would
# have nowhere to go and this render would test nothing about the goblin."
# That check is right and I had routed around its intent: a character sheet for
# someone who is NOT the goblin has no goblin slot by design. The harness
# already exempts beats whose `kind` is `guard`, which is exactly how the
# authored_b05_sheet_* guard sheets rendered two arbitrary bureaucrats. So this
# variant moved to beat 16 (kind=guard), and the frames come out named
# 16-charref-magistrate-*.
#
# $0 — local GPU, no provider, nothing published, nothing promoted (D15).
#
# THIS ONE ALSO TESTS A NEW COUNT TAG. She is `she` in 006a and every existing
# beat block declares '', '1boy' or '2boys', so there was nowhere for a female
# subject to live. Block 16 was created to carry `tag: 1girl`. If the checker
# does not accept that value the DRY step fails for $0 and nothing is drawn,
# which is the cheapest possible way to learn it — and the answer is worth
# having on its own, because every future female character hits the same wall.
