consumer: >-
  The founder's morning page, and the recipe decision for the remaining 131 ep3
  prompts. Four seeds side by side, nothing ranked and nothing recommended.
success: >-
  Four PNGs at C:\banyan-farm\wave-goblin-prep\out-ep3-charref-magistrate-r2 with their .yaml
  provenance sidecars written at render time (7.2), all eight declared as
  artifacts so a missing one fails rc=92 instead of passing quietly. Success is
  four readable, comparable frames of the beat the script describes — a green
  bald goblin cradling a fig beside a 55cm two-leaf sapling at dawn, in the
  current detailed-cinematic dialect. Whether it is GOOD is R4's and not this
  job's.
why: >-
  Five scripts are approved and none of them can be drawn, because every prompt
  behind them is in a style the founder rejected two weeks ago. This is the one
  frame that says whether the conversion works.
prediction: >-
  Written before any frame exists, and unlike r2's this one is aimed at the
  failure that actually happened. r2 drew NO PLANT in 4 of 4 and NO WORLD in 4
  of 4; r3 makes the sapling its own subject clause growing from the earth and
  gives the world its own sentence. What should come back: a rooted plant with
  a visible stem beside a kneeling goblin in a lit meadow. The remaining risks,
  in order — (1) the fig, absent in 3 of 4 of r2, is still only two words and
  may not read; (2) `purple fig` may fight the model's prior for a fig's
  colour; (3) with the character adjectives cut to buy tokens, the patchwork
  cloak is now entirely absent from the prompt, so the costume will be whatever
  the checkpoint defaults to — r2 gave a dark buttoned jacket every time. If
  the plant and the world come back and only the fig and costume are wrong,
  that is a PASS on the dialect question and the costume moves to the reference
  where it belongs.
