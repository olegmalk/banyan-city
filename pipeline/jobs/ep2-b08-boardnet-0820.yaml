consumer: 'Beat 08''s plate, for its cut slot in the episode 2 assembly. The parent is the first frame
  on this beat that could plausibly BE that plate: staging, gesture and per-limb identity all landed in
  one render. Exactly one pre-registered clause is still failing, B4a, and it is the beat''s own done_when
  -- "the clipboard comes DOWN". Whoever assembles the cut needs to know whether a second ControlNet closes
  that clause without spending any of the nine the parent bought, because a plate with no clipboard does
  not satisfy the beat and a plate whose figures got traced is worse than the one we already have.'
success: One 832x1216 png with its sidecar, published to C:\banyan-farm\courier-box\farm-out\ep2-b08-boardnet-0820
  with a sha256 manifest, and read at 1:1 and at 3x beside the PARENT's frame -- which is the control
  for this rung, being the same seed, same prompt and same everything but the second net. The preflight
  must print `twins net verified`, `scribble net verified` and `staged driver, BOTH hints and BOTH references
  verified`, and the sidecar must name controlnet_2, its scale and control_2_image_sha256; without all
  of that the job has no result and the render is not scored.
why: 'The board cannot be reached from where the parent stands: COCO-18''s eighteen keypoints are all
  body parts, so no conditioning scale on the pose net will ever put an object in a hand. A second net
  is the only mechanism, the composition was verified read-only against the installed diffusers 0.29.2
  source before this spec was written, both nets are already on the card, and the board hint''s own selftest
  proves it carries no figure pixel. Two minutes, $0, no download, no provider.'
