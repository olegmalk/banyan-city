    \      + glob.glob(ctl_dir + \"/b08-board-0820.png\")\n               + glob.glob(ctl_dir + \"/b08-ref-*-0819.png\"\
    ))\nlines = []\nfor f in files:\n    shutil.copy2(f, dst)\n    c = os.path.join(dst, os.path.basename(f))\n\
