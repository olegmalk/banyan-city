an_inherited_defect_reported_not_fixed: The clip line across the board's top edge is COLLINEAR with that
  edge in BOTH hint authors, so it adds no distinct mark and cannot be, as author_b08_pose_hint's comment
  claims, "what makes a rectangle read as a clipboard". Measured at 0.00 px off the edge. It is reproduced
  UNCHANGED because this geometry is what B4a passed on four times and this rung's one variable is the
  second net. Offsetting the clip so it actually reads is a candidate for a later rung, on its own.
bar:
  b0_the_stack_is_what_it_claims: 'VOID-CHECK, READ FIRST, FOUR LINES, and it grew a line because it grew
    a net. (i) preflight prints `twins net verified: 2502139104 bytes, sha 54a2afb1...`; (ii) preflight
    prints `scribble net verified: 2502139104 bytes, sha b3e4ac47...`; (iii) preflight prints that the
    two nets SHARE size and config and DIFFER in weights -- the two blobs are byte-for-byte the same length
    and ship the same config.json, so a size check cannot tell the pose net from the object net and only
    the sha can; (iv) the sidecar reads `controlnet_2: xinsir/controlnet-scribble-sdxl-1.0`, `controlnet_2_conditioning_scale:
    0.8`, `control_2_image_sha256: 38cd39da304dbb0317aa2522e1ccca099bef583e88e6573fde03b287358213d6`,
    AND still reads `ip_adapter_mask_geometry: capsules` with `ip_adapter_masks_overlap: false`. Missing
    any of the four and the frame is VOID -- "the second net did nothing" and "the second net never loaded"
    are different findings and this rung must not confuse them.'
  b4a_board_down: 'THIS RUNG''S OWN QUESTION, AND IT IS THE BEAT''S OWN done_when, quoted verbatim from
    review/ep2-picks/done-definitions.yaml beat 08: "the clipboard comes DOWN and the point goes to the
    BELLY, both legible".


    INSTRUMENT, AND THE PARENT IS THE CONTROL. Same seed, same prompt, same pose hint, same masks, same
    references -- the ONLY difference between the two frames is the second net, so the two frames are
    read side by side and the authored board region is compared between them. The authored quad''s corners
    are (608.6,660.5) (719.5,678.1) (697.7,816.2) (586.7,798.6); its bounding box is x 583-723, y 657-820.


    PASSES IF, read at 1:1 and at 3x, a flat rectangular board or clipboard is legibly drawn, held at
    or near the guard''s lowered far hand, with its top edge BELOW his shoulder line (y=491). The verdict
    publishes: whether the object is present, where its corners actually landed against the four authored
    ones, and the same reading taken on the PARENT frame in the same box -- which has no board and is
    the negative control. `Legible` is the beat''s word and it is scored by eye at 3x; the corner geometry
    is the number that says whether the second net put it WHERE it was asked.'
  b6_drawn_not_traced: 'CARRIED, AND ON THIS RUNG IT IS LOAD-BEARING RATHER THAN ROUTINE -- it is the
    clause a second net most endangers. The scribble net lost the figure-tracing question five times on
    this beat, and the parent''s verdict named that as this rung''s risk. Both figures must still read
    as DRAWN CHARACTERS and must NOT get worse than the parent, which improved markedly on its own parent:
    a face with pupils and a set jaw, hair with strands, folds in both garments, a legible metal clasp.
    A frame that delivers the board and returns traced outlines FAILS this clause and the rung does not
    pass -- the board is not worth the drawing.'
  b7_no_limb_fragmentation: 'CARRIED UNCHANGED FROM THE PARENT, WITH THE PARENT''S OWN INSTRUMENT WARNING
    PROMOTED INTO THE BAR.


    G-R sampled at SIX regions, three per figure -- face, forearm, shin -- each box placed ON THE DRAWN
    LIMB at 1:1 and its coordinates published. PASSES IF each figure''s WITHIN-FIGURE SPREAD (max minus
    min across its three regions) is <= 25.0 levels, AND every guard region is <= 0.0 with every goblin
    region >= +20.0.


    THE PROBES MUST BE LUMA-MATCHED AND MUST PUBLISH THEIR LUMA. This is not advice, it is a condition
    of the measurement being admissible. The parent established that G-R COMPRESSES WITH LUMA: sweeping
    the goblin''s leg in 30px bands, G-R fell 28.3 -> 13.7 from y920 to y1130 while luma fell 196.9 ->
    105.1, so a probe drifting into grass shadow invents fragmentation that is not there. The parent''s
    six final probes sat at luma 196.9-250.1. Any probe here that cannot be placed at comparable luma
    is reported UNMEASURABLE, not scored.'
  b2_the_identities_separate: CARRIED. Guard face <= 0.0, goblin face >= +20.0, separation >= +20.0. The
    parent measured +42.0. Scored to catch the second net dragging the two identities around, not because
    it is in doubt.
  b4b_both_arms_stay_on_their_skeletons: 'MUST SURVIVE. The guard''s hand centroid within ~60 px of the
    authored wrist (280.5,695.1) -- the parent measured 40.3 px. The goblin''s arms hang, hands near y~900,
    and the two hands must not clasp. NOTE THE SPECIFIC HAZARD THIS RUNG ADDS: the board hint''s ink legitimately
    meets the guard''s GRIPPING forearm, and if the second net pulls his POINTING arm toward the board
    instead, that shows up here first.'
  b4c_the_arm_belongs_to_the_guard: MUST SURVIVE, seventh mechanism. The pointing arm grows from THE GUARD's
    shoulder and its skin matches its owner (the parent read -3.3 on that forearm).
  b8_the_guard_has_hair: 'PRE-REGISTERED BECAUSE AN UNASSERTED ATTRIBUTE FALLS TO WORDING, AND HERE THE
    WORDING IS THE ONLY CANON-CORRECT PART OF THE STACK. canon.yaml `ep2-guard-hair`: "The approved guards
    have HAIR. Guard A dark cropped hair, guard B light sandy hair", and it FORBIDS \bbald\b. Beat 08''s
    actor is Guard 2 = guard B = light sandy hair. THE IP-ADAPTER REFERENCE IS BALD BY CONSTRUCTION --
    author_b08_ip_refs.GUARD_BOX is commented "bald human head, brown cloak, cream collar", cut from ep2-b08-boardcomp-0818,
    a plate that predates the hair ruling. The prompt says `light sandy hair` and the parent came back
    sandy-haired, so on this route the wording beat the reference and the frame is canon-correct while
    its own reference is not. PASSES IF the guard has hair and is not bald. A regression to bald here
    means the second net shifted the balance toward the reference, which would be a real finding about
    multi-net composition and not a cosmetic miss.'
  b1_the_pair: 'TWO figures and only two, both whole in frame. Two is CORRECT and not a shortfall: `figure_count_ruled_from_the_script_0817`
    ruled the done_when''s "both guards and the scavenger" clause refutes itself -- the script''s stage
    direction names one guard as the actor and the scavenger''s belly as the target -- and REMOVED the
    three-figure blocker on this beat.'
  b3_one_ground_plane: Both stand on the same grass. The parent measured 4 px between the two lowest skin
    rows; the ankles are not touched by this rung.
  b5_no_colossus: Neither figure towers. The parent measured a stature ratio near 1.13 against the authored
    1.100.
not_done_on_purpose: ONE sample, ONE arm, ONE variable. The second net's scale is 0.8 because that is
  the ONLY conditioning scale this repo has measured for the scribble net and the value the four passing
  B4a frames used -- it is not a tuned number and it is not swept here. No ip-scale sweep, no second seed,
  no re-authored openpose hint (it is byte-identical, sha 562911c8), no change to either capsule mask,
  no change to the references, no third figure, no prompt change of any kind, no purple-cast fix, no pick,
  no plate_ack waiver, no canon filename, and no edit to canon.yaml. The purple cast the parent returned
  is expected to persist and is not addressed.
rights_and_weights: 'THIS IS THE `licence_note`. Clean, and now TWO nets carry terms. Base cagliostrolab/animagine-xl-3.1
  (CreativeML Open RAIL++-M). Net 1: xinsir/controlnet-openpose-sdxl-1.0 twins variant, apache-2.0, allowlisted
  in the driver by its upstream repo, blob name and digest. Net 2: xinsir/controlnet-scribble-sdxl-1.0,
  apache-2.0, no attribution condition, the driver''s default net and its original allowlist entry. IP-Adapter
  h94/IP-Adapter, apache-2.0. Both references are repo-internal crops. BOTH hints are authored in PIL
  from numbers -- no annotator, so the lllyasviel/Annotators landmine is untouched by either condition.
  MistoLine was NOT used and its standing visible-attribution obligation is not attached to this frame.'
scoring_rule_pre_registered: 'THIS IS THE `verdict_rule`, WRITTEN BEFORE THE PIXELS, and all five branches
  close something.

  (1) BOARD ARRIVES AND EVERY CARRIED CLAUSE SURVIVES -> PASS, and BEAT 08 HAS A COMPLETE PLATE CANDIDATE:
  every pre-registered clause on the beat met in one frame. The pixels get staged where the next cut assembly
  can reach them and the fact is stated plainly. It is still NOT a pick and NOT a plate_ack -- choosing
  the plate is a taste call (R4).

  (2) BOARD ARRIVES BUT B6 DEGRADES (either figure traced) -> the second net bought the object and spent
  the drawing. The next rung is ONE sample at a lower --scale2, and B6''s severity names how much lower.

  (3) NO BOARD AT ALL, and the authored region is EMPTY -> a hint this sparse does not reach the scribble
  net at 0.8. Next rung raises --scale2 or thickens the stroke; which one is named by whether ANY structure
  appeared in the region.

  (4) SOMETHING APPEARS IN THE AUTHORED REGION BUT IS NOT A BOARD (a smear, a fence, a second figure)
  -> the net read the quad as scenery rather than as a held object. That is a WORDING question next, not
  a scale one: the prompt already says `clipboard lowered in one hand` and the negative already says `raised
  clipboard, second board`.

  (5) A BOARD APPEARS SOMEWHERE ELSE, or two boards appear -> the second condition is mis-registered.
  Read `control_2_image_sha256` in the sidecar FIRST: that tells a resized or wrong hint (a driver bug,
  not a result) from the net genuinely relocating the object.'
