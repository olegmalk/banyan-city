observed_not_scored: >-
  THREE. (1) THE FRAME DARKENED AND THE LIGHT CHANGED CHARACTER: mean luma 141.6
  -> 86.9, and flat ambient became a hard directional key with a visible shaft
  from the upper right. A board hint has no business changing the lighting, and
  that it did is the clearest single sign that the second condition acted
  globally rather than locally. (2) THE PURPLE CAST IS GONE, replaced by a
  green-gold one. Pre-registered as not addressed, and it moved anyway --
  another global effect. (3) THE BOARD HAS NO CLIP, as this spec predicted it
  might: the clip line in both hint authors is collinear with the top edge and
  adds no distinct mark, so nothing in the condition ever asked for one.
what_this_settles: >-
  A SPARSE HINT IS NOT A WEAK HINT, AND THAT IS THE FINDING THIS RUNG BUYS.
  The board hint is 99.7% black (ink fraction 0.00324). The intuition that it
  would therefore act only where its ink is, and barely at all elsewhere, is
  WRONG. For a scribble ControlNet a black pixel is not an absence of
  instruction -- it is the instruction "no edge here" -- so a nearly-black hint
  asserts "no edges anywhere" across the WHOLE frame, at scale 0.8, for the
  full denoise (control_guidance 0.0 -> 1.0). Its residuals are then ADDED to
  the pose net's at 1.0, so total conditioning pressure is far above anything
  this beat has rendered under. Everything observed follows from that one
  mechanism: detail flattened everywhere, garments simplified, linework lost,
  an arm dropped, the light hardened, and the one place the hint did say "edge
  here" is the one place an object appeared. It also settles that
  multi-ControlNet WORKS on this stack -- composed first try, no crash, no
  driver bug, the IP-Adapter masks unaffected exactly as the read-only source
  check predicted -- so the mechanism is available and only its strength is
  wrong.
what_this_did_not_settle: >-
  Whether a weaker second net delivers the board WITHOUT the damage -- that is
  the next rung and it is one sample away. Nor whether the board can be made to
  read as HELD rather than HUNG, which may be a wording question
  (`clipboard lowered in one hand` is already in the prompt and was not enough
  against a robe that ate the arm) or may follow automatically once the arm
  survives. Nor whether B8's bald regression is caused by conditioning pressure
  in general or by this net specifically. Nor B7, on this frame, at all.
what_this_does_not_license: >-
  NO PICK, NO plate_ack, NO CUT, NO CANON FILENAME. This frame is NOT a plate
  candidate and must not be staged as one: it is off-canon on the guard's hair,
  it has lost the frozen wardrobe, and it is a worse drawing than the parent
  that already exists. THE PARENT REMAINS THE BEST FRAME ON THIS BEAT. It does
  not license a scale2 sweep either -- ONE sample at one lower value, then look.
  It does not license reverting the multi-ControlNet driver change, which is
  proven correct and is what made this finding cheap.
next_rung_named_not_taken: >-
  ONE sample, and the variable is the SECOND NET'S STRENGTH, nothing else.
  Everything here carries unchanged -- same hints, same masks, same references,
  same seed, same words -- with --scale2 dropped from 0.8 to about 0.3. Its bar
  is B4a AND the two clauses this rung broke, B6 and B8, restored to parent
  quality; a board with a bald guard in a shapeless robe fails again at 0.3
  just as it failed at 0.8.
  IF 0.3 STILL DAMAGES THE FRAME, the second lever is a PER-NET GUIDANCE
  WINDOW: an object only needs establishing in the early denoise, so net 2
  would run control_guidance 0.0 -> ~0.3 and then stop, leaving the last 70% of
  the steps to draw. diffusers accepts LISTS for control_guidance_start/end and
  broadcasts scalars only when they are not lists
  (pipeline_controlnet_sd_xl.py:1222-1232), so this is a small driver change of
  the same shape as --scale2 and it is NOT taken here because this rung had one
  variable and has now spent it.
