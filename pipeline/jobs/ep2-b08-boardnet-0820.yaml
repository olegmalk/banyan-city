  capsule mask; and the set of guard limbs the ink meets is EXACTLY {gripping forearm, torso, left thigh},
  the three a clipboard held at the hip occludes, with his face and his pointing arm asserted untouched
  BY NAME. The board''s grip point equals the openpose skeleton''s guard L-wrist TO THE FLOAT, (621.6704,
  668.4352), so the object and the hand that holds it cannot drift apart across two files. Ink fraction
  0.00324.'
