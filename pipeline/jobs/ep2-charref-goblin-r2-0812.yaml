# ROUND 2 — THE RESEARCHED TAG DIALECT. See the r1 spec of the same name for the
# order, the authority and the shape of the job; ONLY the draft variant changes.
#
# WHY THERE IS AN r2 AT ALL, STATED PLAINLY. r1 was drafted from this repo's own
# habits and queued while an external research pass was still reading, because the
# card was idle and a three-minute sample is the cheapest question we can ask. That
# was my call and it is on the record. The research then came back with four
# corrections that no amount of staring at our own code would have produced:
# `character sheet` / `model sheet` / `character design` are DEAD tokens (zero
# posts); `reference sheet`, `multiple views` and `turnaround` are the ones with
# weight; `solo` fights multi-view; and an anime checkpoint's standard failure on a
# multi-view ask is COMIC PANELS, which is why the new negative names them.
#
# r1 IS NOT WASTE AND IS NOT HIDDEN. It rendered, it is on his page as the control
# column, and it is the only way to see what the researched tags bought. r2 is a
# RECIPE, not a one-variable delta — on the goblin it also sells six ban terms to
# afford seven new ones, because that negative was already full at 77/77.
#
# EPISODE 2 — THE GOBLIN CHARACTER REFERENCE. One sample, four seeds, $0.
# 2026-08-12, character-reference lane.
#
# ── HIS ORDER, VERBATIM (ledger `ep2-charref-order-0812`): "character consistency?
# have you even made a character reference for the goblin and for the guards? make,
# and let me review. because these characters change too much through beats
# otherwise." The last clause is the specification. The fault being fixed is DRIFT
# ACROSS BEATS, not any one frame, so what this job owes him is not a better beat —
# it is a canonical picture that later beats can be conditioned on.
#
# ── WHY THE EXISTING SHEETS DID NOT ALREADY ANSWER IT. `ep2-goblin-sheet-*-0812`
# drew the goblin standing in a sunlit field, one candidate per costume. He saw those
# and still asked whether a reference exists. That is the answer: a single pose in a
# location is a candidate for a shot; a reference is the same character from several
# angles on a blank ground, where identity is the subject rather than a by-product.
# This job renders the second thing, and it is the first time this repo has asked for
# one.
#
# ── THE ONE SAMPLE RULE. This is a NEW recipe — a composition nothing in this repo
# has drawn — so it is exactly one job, four seeds, and it stops. Nothing here is
# carried to another beat, and no beat is re-rendered against it, until he points at
# a frame. The wave taught this the expensive way: the K recipe went to fifteen beats
# on the steward's own metric and came back "literally just frozen frames".
#
# ── MEASURED BEFORE QUEUED, on the box, with the real CLIP tokenizer:
#   positive 66/77, negative 74/77 (NEGWARN drops `realistic skin
#   texture` and `jpeg artifacts`, which is a warning and not a fault), nothing dropped, style anchor present, count tag `1boy` matches
#   the draft's declaration, `female goblin` survived the negative budget, no faults.
#   drafts sha256 5ffc4ff6d3a5ace59ea78f30e71b7fdd2b6e5b4fc4eb551aa52a5fee294c247a
# The dry step below re-runs that same check on the box at run time, so a stale
# drafts file fails for $0 instead of drawing the wrong text (render_wave_sample.py
# refuses rather than falling back to `authored`).
#
# ── HONEST PRIOR, WRITTEN BEFORE THE FRAMES. A plain SDXL checkpoint with no
# ControlNet and no IP-Adapter has no mechanism that forces the three views to be the
# same individual — `multiple views` is a composition tag, not an identity
# constraint. So the most likely failure is not an ugly sheet, it is a handsome sheet
# showing three cousins. If that is what comes back, the finding is that a reference
# sheet must be BUILT (one approved frame, then IP-Adapter conditioned views) rather
# than PROMPTED, and this job bought that answer for three GPU-minutes.
#
# ── ITS OWN OUT DIR, ON PURPOSE. `out-charref-goblin-r2` has never been written by any
# other job. On 2026-08-12 a shared out dir let one job's publish pick up another
# job's bytes (commit c123d1bd); a fresh directory per job is the cheap fix.
#
# $0 — local GPU on the rtx5090, no provider, nothing published, nothing assembled.
