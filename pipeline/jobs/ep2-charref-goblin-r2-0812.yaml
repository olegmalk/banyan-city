    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-charref-goblin-r2-0812"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/wave-goblin-prep/out-charref-goblin-r2/04-the-footnote-wave1-s*.*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
        print("   ", os.path.basename(f), h[:16])
    with open(os.path.join(dst, "ep2-charref-goblin-r2-0812.sha256"), "w", newline="\n") as fh:
