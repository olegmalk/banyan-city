  holds STEADY. Nothing else enters frame: no creature, no person, no second fruit. Pre-registered FAIL modes: FAIL-FROZEN
  (the plate simply sits still -- measure it, do not eyeball it: mean abs interframe diff and drift from frame 0,
  the way ep2-b18-motion-0812 was measured on 2026-08-17); FAIL-STROBE (the lighting or the specular highlight flickers,
  pulses or blinks, or the fruit''s surface markings appear and disappear between frames -- this is the defect measured
  in the 0812 clip and it is the failure worth reporting, because it would mean the recipe and not the plate is
  the lever); FAIL-COLOUR (the fig drifts off purple toward green, red or brown over the 121 frames); FAIL-COUNT
  (a second fruit appears, or the fig turns into a leaf -- the 0812 lane''s warning that the fig drifts leafward
  unless named ROUND is kept, and ROUND is in the positive); FAIL-DETACH (the fig leaves the stem or exits frame);
  FAIL-PERSON (any face, figure, chibi or mascot). NOT SCORED HERE, and their absence is not a defect: leaf count
