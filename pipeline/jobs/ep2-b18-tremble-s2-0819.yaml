verdict_measured:
  read_how: '121 frames decoded at full length (704x1280, 24fps, 121 frames -- format confirmed by ffprobe), measured
    downscaled to 176x320, and LOOKED at: a 9-panel sheet at f000/015/030/045/060/ 075/090/105/120 plus a 12-frame
    consecutive strip at f040-f051 to catch anything that only shows frame-to-frame.'
  motion_not_frozen: 'PASS, and measured rather than eyeballed as the bar demands. Mean abs interframe diff, by
    thirds: f000-030 med 5.56, f030-060 med 6.67, f060-090 med 6.05, f090-120 med 5.16. Motion is not just present,
    it is EVEN -- no quarter of the clip is carried by another. Only 4 of 120 frame pairs fall below 0.5 and the
    longest consecutive still run is 1 frame. Drift from f000 reaches 46.2. The fig swings on its stem and the stem
    bends with it.'
  lighting_steady_no_strobe: PASS, and this is the clause that killed the 0812 clip, so it was measured hardest.
    Adjacent-frame specular pumping -- |bright(n) - bright(n-1)| as a fraction of the clip max -- exceeds 25% on
    0 of 120 frame pairs. Whole-frame luminance high-frequency component (residual after a 9-frame moving average)
    has std 0.95 on a mean of 118. Peak luminance 247-255. The specular highlight is present and roughly constant
    in every one of the 21 frames looked at; it never blinks out and the fruit's surface markings never appear and
    disappear. The 0812 defect -- a glow present at f001/f016/f076 and gone at f031-f061 -- does not occur here.
  colour_holds_purple: 'PASS. Median hue of the saturated subject pixels sits at 315 degrees with a total spread
    of 4.1 degrees across all 121 frames. Mean subject RGB: f000 58,25,53 -> f060 59,29,53 -> f120 59,29,54. That
    is deep purple-violet end to end with no drift toward green, red or brown.'
  count_attach_person: PASS on all three. One fruit in every frame looked at, never two, and it never turns leafward
    -- it stays a round fig. It stays joined to the thin stem at the neck the whole way and never leaves frame.
    No face, figure, chibi or mascot appears.
