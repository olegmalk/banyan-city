bar: 'BOTH HALVES, and this is the first rung that can pass both.

  PRESENCES: P1 brow bar, P2 forward muzzle, P3 a mouth line, P4 facial shading. f3 scored 2 of 4; n1,
  f1 and f2 scored 0 of 4.

  ABSENCES: T1 no iris and no pupil -- f3''s hard fail. T2 no human nose bridge, tip or nostrils -- f3''s
  second fail. T3 no age modelling. T8 4.5 heads or better.

  PASS is 2 of 4 presences with T1, T2, T3 and T8 all intact. Nothing has ever scored that.'
failure_predicted_in_advance: 'THE THING I EXPECT AND DO NOT WANT: `blank eyes` is a strong attractor
  and may drag the whole face back to the mask rather than only the eyes -- the wedge''s own finding was
  that it is ''the whole game'', and a tag that decides a face is a tag that can flatten one. If f4 returns
  the egg, the reading is that the subtractive tags are not additive with a descriptive wording and the
  two dialects cannot be mixed; the route then is IP-ADAPTER off the tile for the FACE over an openpose
  skeleton for the BODY -- attribute instrument and geometry instrument each doing the job the record
  says it does, which is where Sec 11 and Sec 13 pointed all along.

  f5 IS THE RISKIER OF THE TWO and is filed anyway because if f4 works and f5 does not, that isolates
  `no nose` as the flattener, which is worth a rung.'
one_sample_rule: Two rungs, one variable each, ~20 s a render, on a card whose queue this lane is already
  feeding. Round 2 of 2 on the face-at-full-body question; if neither passes, the stop gets written and
  training stays held rather than forced.
the_one_variable: f4 PLUS `no nose`, and nothing else. The wedge's second half. If f4 keeps the face and
  fixes the eyes, this is the rung that decides whether the nose tag is what flattens everything or whether
  the collapse needed all four subtractive tags together.
