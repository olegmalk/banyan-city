consumer: THE JERRY LoRA SET, HELD. A frame that passes T1-T3 and T8 with a face on it is the first trainable
  full-body frame this project has produced; the close mac plates carry the face and no reliable proportion,
  and the reference-route frames so far carry the proportion and no face. No beat plate.
success: ONE 832x1216 png at seed 20260823 on the h19 skeleton at scale 1.0 with f4 PLUS `no nose`, and
  nothing else. The wedge's second half. If f4 keeps the face and fixes the eyes, this is the rung that
  decides whether the nose tag is what flattens everything or whether the collapse needed all four subtractive
  tags together. Scored on T1 (blank eyes), T2 (no human nose), T3 (no age modelling), T8 (4.5+ heads)
  AND on P1-P4 -- brow, muzzle, mouth, shading. This is the first rung where a frame can pass both halves.
why: 'RUNG f5: f4 PLUS `no nose`, and nothing else. The wedge''s second half. If f4 keeps the face and
  fixes the eyes, this is the rung that decides whether the nose tag is what flattens everything or whether
  the collapse needed all four subtractive tags together.

  f1 (drop `thick eyebrows`) and f2 (`no nose` -> `snout`) both came back the SAME BLANK EGG as n1 --
  one tag cannot reach the face at this framing. f3, the struck tile wording at the same skeleton, came
  back with a mouth, ear flanges, facial shading and a lean 6-head body, and failed T1 and T2 on drawn
  pupils and a small nose. So the face IS reachable at full body and the subtractive recipe is what flattens
  it. This walks the two clauses that matter back in, one at a time, onto the wording that works.'
