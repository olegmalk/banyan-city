consumer: 'The beat-09 SLATE in review/ep2-demo-0820, one of the cut''s last two. Not this clip -- is_show_content
  stays false while the adult read is an open R4 card. What the slot buys is the answer to whether a CROPPED
  plate survives i2v: if the softness of a 2.157x upscale holds across 121 frames, beat 09''s framing
  axis is closed for good and every other beat blocked on head size inherits the route. If it does not,
  reference-plus-crop is a still-only instrument and the beat needs the IP-Adapter arm re-shot tighter.'
success: 'ONE 704x1280 mp4, 121 frames at 24 fps. THE BAR IS THE SOFTNESS QUESTION AND THE FRAMING IT
  WAS BOUGHT WITH, and nothing else; cast and taste are explicitly out of scope. C1 THE FRAMING SURVIVES:
  head bounding box on frame 1 measures at least 50% of frame height (the plate is 55%; the 704x1280 cover
  crop preserves full height, so anything under 50 means the crop step moved the head). C2 THE INIT STILL
  HOLDS: f001->f002 face-crop step under 20, the parent''s own pass threshold, which it met at 0.66. A
  softer init is the one thing that could plausibly change this and that is why it is re-measured rather
  than assumed. C3 THE SOFTNESS DOES NOT COMPOUND: highpass sigma-1 std over the face box on frame 121
  is at least 70% of frame 1''s. A cropped init starts at 45% of a native plate''s detail; the failure
  this clause catches is the sampler treating that softness as the subject and smearing further with every
  frame. C4 THE FACE IS STILL DOING SOMETHING: face-crop interframe mean above 1.0 with motion in both
  the first and last thirds, the parent''s measure, which read 2.155. Report N of 4 with each number beside
  its threshold.'
why: 'The parent settled that --image-crf 10 makes the init HOLD for 121 frames and said in the same breath
  what it could not settle: it inherited an init that fails its own plate bar on framing, on a hand in
  frame and on the adult read. Beat 09''s plate bar has now been met on the framing clause by geometry
  rather than by words -- the wording ladder was closed by measurement at eight renders, and the instrument
  the work ladder named instead (reference-plus-crop) ran today for $0 and reached 55% head from an IP-Adapter
  frame that already carried near-black cropped hair, wire-rims and open eyes. This is the first beat-09
  motion job whose starting picture is not a known-miscast one.'
