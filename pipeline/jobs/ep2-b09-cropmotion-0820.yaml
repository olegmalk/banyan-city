pre_registered_fail_modes:
  FAIL-SOFT-COMPOUNDS: NAMED AS THE MOST LIKELY. The init is a 2.157x upscale at 45% of a native plate's
    high-frequency energy. If i2v reads that as the subject's own texture, C3 fails and the clip gets
    progressively mushier. If it fires, reference-plus-crop is a STILLS instrument and the next rung is
    the IP-Adapter arm re-shot at a tighter framing so the crop starts from ~38% and only needs 1.45x
    -- the ratio measured today at 90% of native.
  FAIL-CROP-MOVES-THE-HEAD: cover_crop.py takes 832x1216 to 704x1280 by cropping WIDTH (target aspect
    0.55 against the source's 0.684) and keeping full height, so the 55% head should be preserved exactly.
    C1 exists because 'should' is not 'measured', and this beat has already lost a rung to a framing claim
    that was carried in prose and moved in the string.
  FAIL-COLLAPSE-RETURNS: The parent's crf-10 finding was measured on a DIFFERENT init. If C2 fails here,
    the finding was plate-dependent, which would be a correction to a result this repo has already generalised
    to every i2v job on the card.
