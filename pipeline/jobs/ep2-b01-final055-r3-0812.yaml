  - "import hashlib, os, sys\nfrom pathlib import Path\nCLONE = r\"C:\\banyan-farm\\banyan-city\"\nsys.path.insert(0, CLONE + r\"\\pipeline\")\n\nfails = []\ndef check(ok, label):\n    print((\"  ok   \" if ok else \"  FAIL \") + label, flush=True)\n    if not ok:\n        fails.append(label)\n\n# 1. per-step env. First use of box_runner.py:720 from a spec, so prove it.\ncheck(os.environ.get(\"STRENGTH\") == \"0.00\",\n      \"per-step env arrives (STRENGTH=%r)\" % os.environ.get(\"STRENGTH\"))\ninit = os.environ.get(\"INIT\", \"\")\ncheck(bool(init), \"per-step env carries INIT (%s)\" % init)\n\n# 2. the init is the frame he called good, by hash and not by filename.\nINIT_SHA = \"874d36f566cf251753a6835144eed76fbbef558df65a30f3efa913c75d942454\"\nif init and os.path.isfile(init):\n    h = hashlib.sha256(open(init, \"rb\").read()).hexdigest()\n    print(\"  init sha256 %s\" % h, flush=True)\n    check(h == INIT_SHA, \"init is ep2-b01-t2i-fig-0811 s2 (expected %s)\" % INIT_SHA[:16])\nelse:\n    check(False, \"init file exists at %s\" % init)\n\n# 3. the harness is the reviewed bytes.\nSC = CLONE + r\"\\pipeline\\runpod_render.py\"\nHARNESS_SHA = \"dd834f57f987a090fcb6cebd8cbd5ff5fdcf306125bbef43739f71f1517ebd9c\"\nhh = hashlib.sha256(open(SC, \"rb\").read()).hexdigest()\nprint(\"  harness sha256 %s\" % hh, flush=True)\ncheck(hh == HARNESS_SHA, \"runpod_render.py is the reviewed copy\")\n\n# 4. the fence on disk. A stale checkout must not start.\nimport runpod_render as rr\nfrom generate_shots import parse_shots\nshots = Path(CLONE) / \"genomes/sapling/nodes/002b-first-citizen/shots.md\"\nraw = [s for s in parse_shots(shots.read_text(encoding=\"utf-8\")) if s[\"num\"] == 1]\ncheck(len(raw) == 1, \"exactly one beat 1 in shots.md\")\ns = raw[0]\nFENCE = (\"A tiny 40cm seedling standing in short grass, its sturdy curved stem \"\n         \"no taller than the grass around it, two oversized cotyledon leaves, \"\n         \"one small round green fruit hanging from the stem, whole plant in \"\n         \"frame, wide shot, peach and gold sunrise sky, no girl, no boy, no \"\n         \"child, no person, no chibi, no mascot, no creature, no face, no \"\n         \"branches, no night sky, cinematic lighting, detailed, newest, \"\n         \"masterpiece, best quality, very aesthetic No photorealism, no 3D \"\n         \"render look. 9:16 vertical, no text.\")\ncheck(s[\"prompt\"] == FENCE, \"beat-01 fence is byte-for-byte the measured one\")\ncheck(s[\"slug\"] == \"cold-open\", \"slug is cold-open (output filenames depend on it)\")\n\n# 5. the sent strings, through the harness's OWN constant and functions.\npos, dropped = rr.compress(s[\"prompt\"])\nneg = rr.beat_negative(rr.NEG, s[\"prompt\"])\nprint(\"\\n  POS: %s\\n\\n  NEG: %s\\n\" % (pos, neg), flush=True)\ncheck(not dropped, \"nothing dropped from the positive for budget (%r)\" % (dropped,))\ncheck(\"one small round green fruit hanging from the stem\" in pos, \"FIG term in the positive\")\ncheck(\"two oversized cotyledon leaves\" in pos, \"LEAF term in the positive\")\ncheck(\"cinematic lighting, detailed, newest, masterpiece, best quality, very aesthetic\"\n      in pos, \"detailed-cinematic-anime tail in the positive\")\n\n# 6. the delta against r8's SENT positive is the height predicate, exactly.\n# Imported, not copied: a copy of this string can drift out of step with r8.\nfrom render_b01r9 import R8_POS_SENT\nPREDICATE = \" no taller than the grass around it\"\ncheck(pos != R8_POS_SENT, \"this round is NOT sending r8's positive (it cannot)\")\ncheck(pos.replace(PREDICATE, \"\", 1) == R8_POS_SENT,\n      \"the ONLY delta vs r8's sent positive is %r\" % PREDICATE)\ncheck(pos.count(PREDICATE) == 1, \"the predicate appears exactly once\")\n\n# 7. seeds, stated so the sidecars can be read against r8's.\nprint(\"  seeds: %s\" % [rr.SEED + 1 + k * 1000 for k in range(2)], flush=True)\ncheck(rr.SEED + 1 == 20260720, \"seed rule matches the b01 family (SEED+beat)\")\n\nprint(\"\\nDRY: %d check(s) failed\" % len(fails), flush=True)\nraise SystemExit(1 if fails else 0)\n"
