  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - "import hashlib, json, os, shutil, subprocess, sys\nfrom pathlib import Path\nARM   = \"i55\"\nCLONE = r\"C:\\banyan-farm\\banyan-city\"\nSC    = CLONE + r\"\\pipeline\\runpod_render.py\"\nRAW   = os.path.join(CLONE, \"runpod-out\")\nOUT   = r\"C:\\banyan-farm\\out-b01-final055r3\"\nsys.path.insert(0, CLONE + r\"\\pipeline\")\n\nstrength = os.environ[\"STRENGTH\"]\ninit     = os.environ[\"INIT\"]\ninit_sha = hashlib.sha256(open(init, \"rb\").read()).hexdigest()\nprint(\"arm %s strength %s init %s sha256 %s\" % (ARM, strength, init, init_sha), flush=True)\n\nrc = subprocess.call([sys.executable, SC])\nif rc:\n    sys.exit(rc)\n\nimport runpod_render as rr\nfrom generate_shots import parse_shots\nshots = Path(CLONE) / \"genomes/sapling/nodes/002b-first-citizen/shots.md\"\ns = [x for x in parse_shots(shots.read_text(encoding=\"utf-8\")) if x[\"num\"] == 1][0]\npos, _ = rr.compress(s[\"prompt\"])\nneg = rr.beat_negative(rr.NEG, s[\"prompt\"])\nshots_sha = hashlib.sha256(shots.read_bytes()).hexdigest()\nharness_sha = hashlib.sha256(open(SC, \"rb\").read()).hexdigest()\ntry:\n    commit = subprocess.run([\"git\", \"-C\", CLONE, \"rev-parse\", \"HEAD\"],\n                            capture_output=True, text=True).stdout.strip() or \"unknown\"\nexcept OSError:\n    commit = \"unknown\"\n\nos.makedirs(OUT, exist_ok=True)\nmoved = 0\nfor k in range(4):\n    src = os.path.join(RAW, \"01-%s-s%d.png\" % (s[\"slug\"], k))\n    if not os.path.isfile(src):\n        print(\"   !! missing %s\" % src, flush=True)\n        continue\n    dst = os.path.join(OUT, \"b01-final055-%s-s%d.png\" % (ARM, k))\n    shutil.move(src, dst)\n    moved += 1\n    sha = hashlib.sha256(open(dst, \"rb\").read()).hexdigest()\n    seed = rr.SEED + 1 + k * 1000\n    with open(dst + \".meta.yaml\", \"w\", encoding=\"utf-8\", newline=\"\\n\") as fh:\n        fh.write(\"\\n\".join([\n            \"task: ep2-b01-final055-r3-0812\",\n            \"node: 002b-first-citizen\",\n            \"beat: 1\",\n            \"arm: \" + ARM,\n            \"strength: \" + strength,\n            \"model: \" + rr.BASE,\n            \"dtype: bfloat16\",\n            \"pipeline: StableDiffusionXLImg2ImgPipeline\",\n            \"harness: pipeline/runpod_render.py\",\n            \"harness_sha256: \" + harness_sha,\n            \"harness_modified_for_this_round: false\",\n            \"init_image: \" + json.dumps(init),\n            \"init_sha256: \" + init_sha,\n            \"init_provenance: >-\",\n            \"  ep2-b01-t2i-fig-0811 seed s2, the frame the founder called \\\"really\",\n            \"  good\\\" at ~23:45 on 2026-08-11. Also committed on farm-results-rtx5090\",\n            \"  at farm-out/ep2-b01-t2i-fig/01-cold-open-wave1-s2.png.\",\n            \"size: 832x1216\",\n            \"steps: 40\",\n            \"guidance: 7.5\",\n            \"seed: %d\" % seed,\n            \"seed_rule: SEED(%d) + BEAT(1) + k*1000\" % rr.SEED,\n            \"prompt_source: genomes/sapling/nodes/002b-first-citizen/shots.md beat 1\",\n            \"prompt_source_sha256: \" + shots_sha,\n            \"positive: \" + json.dumps(pos),\n            \"negative: \" + json.dumps(neg),\n            \"positive_recomputed_not_captured: true\",\n            \"positive_delta_vs_r8_sent: >-\",\n            \"  this positive is r8's SENT positive plus the height predicate\",\n            \"  ` no taller than the grass around it`, which runpod_render.py cannot\",\n            \"  strip and r8 deletes script-side. Asserted exact by the dry step.\",\n            \"negative_carries_lighting_block: false\",\n            \"repo_commit: \" + commit,\n            \"cost_usd: 0\",\n            \"sha256: \" + sha,\n            \"provisional: >-\",\n            \"  Not a pick, not canon, not published, not assembled. A three-arm\",\n            \"  strength probe; the verdict on it is R4's.\",\n            \"\",\n        ]))\n    print(\"   %s  %s\" % (os.path.basename(dst), sha[:16]), flush=True)\nshutil.rmtree(RAW, ignore_errors=True)\nprint(\"arm %s wrote %d frame(s)\" % (ARM, moved), flush=True)\nraise SystemExit(0 if moved == 2 else 1)\n"
- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - "import glob, hashlib, os, shutil\ndst = \"C:/banyan-farm/courier-box/farm-out/ep2-b01-final055-r3\"\nos.makedirs(dst, exist_ok=True)\nsrc = sorted(glob.glob(\"C:/banyan-farm/out-b01-final055r3/b01-final055-*\"))\nlines = []\nfor f in src:\n    shutil.copy2(f, dst)\n    # Hash the COPY: what this records has to be the bytes that get committed,\n    # or the manifest attests to a file nobody will ever read.\n    c = os.path.join(dst, os.path.basename(f))\n    with open(c, \"rb\") as fh:\n        h = hashlib.sha256(fh.read()).hexdigest()\n    lines.append(h + \"  \" + os.path.basename(f))\n    print(\"   \", os.path.basename(f), h[:16])\n# newline=\"\\n\" is load-bearing: Windows text mode rewrites \\n to \\r\\n and every\n# filename then carries a trailing \\r that shasum -c cannot open.\nwith open(os.path.join(dst, \"ep2-b01-final055.sha256\"), \"w\", newline=\"\\n\") as fh:\n    fh.write(\"\\n\".join(lines) + \"\\n\")\nprint(\"published\", len(src), \"file(s) + manifest ->\", dst)\n# 3 arms x 2 seeds x (png + sidecar) = 12. Fewer means the round wrote less\n# than it promised.\nraise SystemExit(0 if len(src) >= 8 else 1)\n"
