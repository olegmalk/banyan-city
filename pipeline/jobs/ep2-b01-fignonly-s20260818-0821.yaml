  AND THE FIELD DOES NOT MOVE WITH IT -- the grass blades and the background hold while the fruit changes.
  The incumbent''s specific weakness, found by reading it tonight, is that its fig does not ripen so much
  as SWAP: it is teal and static from f000 to f087 and purple at f098, a colour change inside one 11-frame
  gap, and the fruit also relocates down the stem across that gap. A cell that ripens gradually and keeps
  the fruit on its node beats the incumbent on the beat''s own done_when (''the purple fig SWELLS on the
  stem'').'
