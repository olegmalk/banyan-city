  COMPRESSED, so the same 200x220 box that held only a head on a standing figure now overlaps neck and
  shoulder -- and k6b/k6c/k6d already proved this adapter transfers the tile''s PURPLE COWL through a
  mask when it is given more to act on. This rung changes the SEED alone, which asks whether the magenta
  is the mechanism or the draw. If it survives the seed it is the mask and the fix is a smaller box on
  folded poses, which is a third rung and would be named then.'
