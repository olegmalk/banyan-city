bar: "THE k6a BAR, AS RECALIBRATED BY THE 2026-08-21 STEWARD RULING.\nRead at 1:1 against review/ep2-goblin-design-0819/adult-b19-0819.jpg.\n\
  \  T1  BLANK EYES -- no iris, no pupil, no lashes.\n  T1b EYE SIZE <= 1.4x the tile's, relative to the\
  \ head box. NOT widened.\n      EYE SHAPE (h/w aspect) <= 0.65. RECALIBRATED from 0.52-0.54: only\n\
  \      defective frames ever met the old value -- k1 met it with a 1.87x eye,\n      k3 with horns and\
  \ the cowl, k5a with no mouth -- while 0.59-0.63 frames\n      read as the tile. k6a sits at 0.63.\n\
  \  T2  NO HUMAN NOSE -- no bridge, no tip, no drawn nostrils.\n  T3  NO AGE MODELLING -- no brow furrows,\
  \ no folds, no jowls.\n  T7  NO PATCHWORK ON THE SKULL.\n  T8  HEAD-TO-BODY >= 4.5 heads with lean limbs.\
  \ k6a reads 5.51.\n  P1  A BROW ABOVE THE LID WITH SKIN BETWEEN. A lash arc welded to the eye\n    \
  \  rim is NOT a brow -- that is what the wording rungs drew.\n  P3  A MOUTH. A line, however thin. k5a\
  \ had NONE and that is why it lost.\n  C1  CONTAINMENT -- no purple cowl at the neck, no horns, no portrait\n\
  \      composition. k6b/k6c/k6d put the cowl back at 47.3%/17.8%/39.2% and\n      failed on it; k6a\
  \ reads 0.0%.\n  C2  THE POSE IS THE ONE ASKED FOR. A frame whose skeleton the net ignored is\n    \
  \  not the pose, however good the figure is.\nA frame failing ANY clause is REJECTED. The whole reason\
  \ the old 31-frame LoRA\nset was untrainable is that near-misses were kept."
failure_predicted_in_advance: 'SPLIT PREDICTION, AND IT IS FILED BEFORE THE RENDER.

  b04-r2 and b08-r2 are WORDING rungs on a recipe whose wording route is otherwise

  closed, and the reason they are expected to work where six face rungs did not is

  that they move the POSE clause, not the identity clause -- the pose clause is the

  one slot the standard leaves open, and every pose-set rung that changed it got

  the pose it asked for. If b04 still stands upright, the finding is that the hunch

  skeleton is under the net''s resolution and the answer is a deeper-authored hint,

  not more words.


  THE SEED PAIR IS THE ONE THAT CAN TEACH SOMETHING EITHER WAY. If b03-r2 and

  b20-r2 both come back clean, the magenta was the draw and round one''s picks stand

  with a noted seed. If BOTH keep it, it is the mask overlapping neck on compressed

  poses and the fix is geometric -- shrink the box for folded skeletons -- which is

  a change to jerry_standard_0821.mask_for and therefore to every folded frame

  already rendered. If they SPLIT, one seed is not an instrument and the honest

  answer is that we do not know yet.'
ip_adapter:
  ruling: STEWARD PICK, coordinator 2026-08-21, VETO-ABLE (R4). k6a is THE goblin recipe; the T1b shape
    bar is recalibrated 0.52-0.54 -> <= 0.65 because only defective frames ever met the old value (k1
    eye 1.87x, k3 horns and cowl, k5a no mouth) while 0.59-0.63 frames read as the tile. See pipeline/jerry_standard_0821.py
    and canon.yaml.
  ref: farm-out/jerry-skel-assets-0820/jerry-tile-sq20-0821.png
  ref_sha256: f65c9bb412e541fbe9b6024ddaec5a78b78028afd87e325baa06d6d430dded14
  ref_provenance: 'adult-b19-0819.jpg cropped (176,280)-(332,432), sky flood-filled with the tile''s own
    field green, pasted CENTRED at 20% of a 448x448 SQUARE canvas. Square is load-bearing: diffusers builds
    CLIPImageProcessor() with no arguments, which resizes the SHORT edge to 224 and CENTRE CROPS to a
    square, so only on a square canvas is the authored head-to-frame ratio the ratio the encoder receives.
    k3''s 416x608 portrait lost the top 30% of the subject -- the whole cranial dome -- to that crop and
    grew horns out of the cut. Encoder coverage here is 3.9%. Rebuild with `pipeline/author_jerry_squareref_0821.py
    --head-frac 0.20`; assert with `--check f65c9bb412e541fbe9b6024ddaec5a78b78028afd87e325baa06d6d430dded14`.'
  mask: 315,484,515,704
  mask_frame: RENDER pixels, 832x1216
  mask_rule: k6a's authored mask 315,130,515,350 TRANSLATED by this pose's head-block offset. The five
    head keypoints move as one rigid block between poses (ear span 136.0 px in every pose at head_frac
    0.190), so the head box translates rigidly and so does the mask. For `stand` the delta is zero and
    this IS k6a's mask. Derived by pipeline/jerry_standard_0821.mask_for('crouch').
  scale: '0.7'
  weights: h94/IP-Adapter sdxl_models/ip-adapter-plus-face_sdxl_vit-h.safetensors, apache-2.0, sha256
    677ad8860204f7d0bfba12d29e6c31ded9beefdf3e4bbd102518357d31a292c1, 847517512 bytes. THE GENERAL ADAPTER
    ip-adapter-plus_sdxl_vit-h.safetensors IS THE SAME NUMBER OF BYTES, so only the digest separates them;
    controlnet_plate.py carries an IP_WEIGHTS allowlist keyed by name and carrying the digest, and the
    sidecar records which one actually rendered the frame.
  skeleton: farm-out/jerry-skel-assets-0820/jerry-skel-h19crouch-0820.png
  skeleton_sha256: b3028a04ed18ed992cfa884900443d8ee547423e0dcfd72e42c4dfa52d2352fe
  head_frac: 0.19
  controlnet: xinsir/controlnet-openpose-sdxl-1.0 at scale 1.0
