why: 'ROUND TWO for beat 03, and the LAST round for this question.


  ROUND ONE PASSED THE FACE AND CARRIED MAGENTA AT THE NECK, and so did b20 and the crouch pose-set rung
  -- three frames, all of them FOLDED, while every standing frame in the wave read clean. THE MECHANISM
