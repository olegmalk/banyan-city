  one thing 6 still gates on this node is the 2026-08-18 beat-17 shake restage, which this job does not
  touch. SUPERSESSION NOTE, because a reader will find the other sentence: pipeline/jobs/ep2-b15-macplate-publish-0819.yaml
  says the beat-15 6 gate is LIVE. It was, when that spec was written on the morning of 08-19; the approval
  landed later the same day.'
script_line: 'Beat 13 THE SHADE (1:00-1:04), node.md:88 as rewritten 2026-08-17 and RATIFIED BY THE FOUNDER
  2026-08-18 by his own board ruling -- "the shipped version stands (no slide, he sits down beside it,
  thin shade)": "The scavenger''s legs give out and he drops to sit in the grass at the base of the stem,
  then tips his head sideways into the sapling''s hand-sized patch of shade -- the only part of him it
  will cover -- knees up around his ears." THE PLATE IS ALREADY THE SEATED END STATE, so the only action
  left in the beat is the head tipping into the shade. Rendering a slide would be re-opening a question
  the founder closed.'
bar:
  H1_THE_PERFORMANCE_COMES_BACK: 'THE FAILED CLAUSE, and it is measured on the same fixed face band (250,240,400,360)
    as rung 2 so the three rungs are directly comparable. Mean absolute interframe luma at or above 3.0,
    and the last twenty pairs at or above 1.0. The three readings so far are rung 1 10.80 / 24.07 and
    rung 2 0.64 / 0.148. THE BAR IS DELIBERATELY NOT RUNG 1''S NUMBER: rung 1 earned its 10.80 by standing
    up and walking out of frame, so matching it would be a failure. What is wanted is a seated man who
    is visibly alive, which is a middle this family has not yet produced.'
  H2_he_is_still_seated_knees_up_face_readable: CARRIED FROM RUNG 2, WHICH WON BOTH, and neither may be
    given back. At f120 he is folded small with his knees up -- the founder's ruling, `no slide, he sits
    down beside it`, 2026-08-18 -- and his face is legible at f000, f030, f060, f090 and f120. Rung 1
    lost the face for fifty frames to a forward fold and rung 3 must not reintroduce it while chasing
    H1.
  H3_the_tilt_is_SIDEWAYS_and_goes_further_than_rung_2s: Rung 2's tilt was a lean rather than a tip. With
    a halfway state named and the aspect continuous, the head should travel further over to the side by
    f120 than it did in rung 2, judged at 1:1 side by side.
  H4_G8_the_shade_on_his_eyes_and_what_it_decides: 'Weak again and named again. Rung 2 failed it and blamed
    the DIM plate, but rung 2 was also frozen nearly solid, so the plate was not the only suspect. THIS
    SAMPLE IS WHAT SETTLES IT: if H1 passes -- a clip that is demonstrably moving -- and G8 still fails,
    the wording is exonerated and beat 13''s next rung is the PLATE EXPOSURE rung its rung-2 verdict named,
    deferred from this pass on purpose.'
not_done_on_purpose: 'NO recipe change -- size, frames, fps, guidance, distilled sigmas, two-stage, offload,
  mode and --image-crf 10 are the b14 crf-10 parent''s, three rungs deep now. NO new init, NO new sha,
  NO new anchor. NO new seed: 20260820 for the third time, so rungs 1 and 2 are both true controls. NO
  change to the NEGATIVE, unchanged since rung 1 -- it named `standing up` and `walking out of frame`
  and failed, and leaving it in place is what keeps every rung a test of the positive. NO plate work:
  beat 13''s plate-exposure rung is deferred to what H4 says here. No pick, no plate_ack, no cut, no publication.'
pre_registered_fail_modes:
- 'F-STILL-FROZEN / F-STILL-DAMPED -- the middle placement does not restore motion, in which case the
  finding is that terminal conditioning saturates regardless of aspect and the next rung is mechanical:
  a shorter render, since 121 frames is the whole slot and a 73-frame clip has no dead tail to fill.'
- F-POSITION-GIVEN-BACK -- motion returns and he stands up or leaves again, i.e. the middle placement
  dilutes the terminal one. That would be a real finding about how much a single prompt can place at once.
- F-PLANT-PICKED-UP -- beat 15's failed clause; re-checked on all three, since beats 03 and 13 have now
  held their plants across two rungs each.
- F-MIDDLE-IS-A-CUT -- `HALFWAY THROUGH THE SHOT` is read as a shot change rather than as a moment. The
  negative already carries `cut to another shot, scene change, shot change`, which by this ladder's own
  law is not protection; named so it is a finding and not a surprise.
- F-IDENTITY-DRIFT -- held on all six clips so far; a regression would be attributable to the clause.
rung_2_the_control: 'ep2-b13-shadelast-0820: the placement worked on every clause it was aimed at and
  G2 took the performance. Still folded small with his knees up at f120 and his FACE READABLE IN EVERY
  FRAME, where rung 1 folded its face into its knees from f024 and walked out at f114 -- and face-band
  interframe mean 10.80 -> 0.64, last-20 24.07 -> 0.148, whole-frame ncc range 0.687..1.000 -> 0.972..0.9997.'
