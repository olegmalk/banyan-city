    \ % k, map_location=\"cpu\") for k in keys}\ndef tb(t):\n    t = t.contiguous().cpu()\n    if t.dtype == torch.bfloat16:\n\
    \        t = t.view(torch.int16)          # a VIEW, same bytes, not a conversion\n    return hashlib.sha256(t.numpy().tobytes()).hexdigest()\n\
    MUST = {\"prompt_embeds\": \"distinct\",\n        \"negative_prompt_embeds\": \"same\",\n        \"negative_prompt_attention_mask\"\
    : \"same\",\n        \"prompt_attention_mask\": \"report\"}\nlines, ok = [], True\nfor f, rule in MUST.items():\n\
    \    h = {k: tb(d[k][f]) for k in keys}\n    lines.append(\"%-32s %s\" % (f, \"  \".join(\"%s=%s\" % (k, h[k][:12])\
    \ for k in keys)))\n    if rule == \"same\":\n        good = len(set(h.values())) == 1\n        ok = ok and good\n\
    \        lines.append(\"    -> %s\" % (\"IDENTICAL across all four (REQUIRED: one negative)\"\n              \
    \                       if good else \"!! THE NEGATIVES DIFFER\"))\n    elif rule == \"distinct\":\n        good\
    \ = len(set(h.values())) == len(keys)\n        ok = ok and good\n        lines.append(\"    -> %s\" % (\"all four\
    \ DISTINCT (REQUIRED: four prompts)\"\n                                     if good else \"!! two arms share a\
    \ positive\"))\n    else:\n        lines.append(\"    -> reported only; equal-length prompts share a mask by \"\
    \n                     \"construction and this gates nothing\")\nlines.append(\"shapes pos %s neg %s\" % (tuple(d[\"\
    a0\"][\"prompt_embeds\"].shape),\n                                        tuple(d[\"a0\"][\"negative_prompt_embeds\"\
    ].shape)))\ntxt = \"\\n\".join(lines) + \"\\n\"\nopen(OUT + \"\\\\embeds-verify.txt\", \"w\", newline=\"\\n\"\
    ).write(txt)\nprint(txt, flush=True)\nif not ok:\n    sys.exit(\"!! the four embeds files are not four distinct\
    \ positives against one negative\")\nprint(\"VERIFIED: one negative, four distinct positives, one encoder process.\"\
    , flush=True)\n"
