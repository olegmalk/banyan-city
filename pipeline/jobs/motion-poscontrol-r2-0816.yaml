consumer: 'This lane''s report to the founder, answering the question underneath every motion experiment we have run
  and that none of them has tested: can LTX-2.3 distilled make a figure ACT at all. Six lanes have moved CADENCE --
  how often a new picture arrives -- and in every arm of every one of them the figure holds the same pose from f0
  to f96. This job asks the capability question directly under conditions rigged for the engine to succeed, and it
  is the gate on whether spending disk and hours on non-distilled weights is worth anything. Consumed as: hold period,
  depth, distinct pictures, effective fps and a SEPARATE terminal-freeze index for all four arms; a block-matching
  body-displacement number for f0->f96 with its limits stated; and a consecutive-frame evidence sheet so the next
  reader cold-reads the frames rather than the numbers.'
success: 'Four 704x1280 97-frame mp4s from three crops of three asserted plate shas and ONE encoder process, with
  four render argvs the generator proves differ by NO recipe flag. THE BAR IS WRITTEN ABOVE THE FRAMES. A0 is the
  tripwire: beat 13''s control has returned clip sha256 42043851da4b246cfcd4e858cda828da992d0d48f15ef10d81d3a99c1ceb445a
  five times across four nights and must do so a sixth; a non-matching control INVALIDATES this job rather than being
  explained away. A1 (waterfall) establishes whether the engine moves anything at all. A2 (a photoreal runner mid-stride,
  whole body, clean ground, asked only to keep running) is the decisive one: if she does not run, THE ENGINE CANNOT
  ACT A BODY, every beat-level lever six lanes have pulled is moot, and the only live question left is the checkpoint.
  If she does run, the constraint is our domain or our beats and that is a different and much better investigation.
  A3 asks beat 13''s own plate for a large one-way action instead of a small cyclic one, changing nothing but the
  action clause, and separates ''the request is too small'' from ''the plate cannot move''. NOTHING SCALES OFF ANY
  OF IT -- it is a capability probe, and 48 pictures of the wrong thing was never a better beat than 32.'
why: 'Every intervention this investigation has made was measured against cadence. Prompt wording (5 wordings x 3
  seeds), the init plate as an onset lever, the 13-latent count, the whole VAE/decode side, STG at upstream''s recommended
  setting, the 200-word ceiling and the negative''s content are all eliminated by measurement, and guidance turned
  out to be a STEP at the CFG on/off boundary rather than a ramp. Two levers reached period 2 / 48 pictures and BOTH
  were rejected on the cold read: guidance 1.0 swings 81 of 255 in frame-mean luma and dies by the last twelfth, and
  the 9px blurred plate leaves all 97 frames soft against the taste call that killed v2 low-detail. Through all of
  it the figure never once moved its body. That makes ''more distinct pictures of a motionless figure'' the wrong
  variable, and it means we may have spent a week optimising it. Before any non-distilled checkpoint is downloaded
  -- ~38 GB of transformer weights, hours of box time -- the cheap question has to be answered first: can this stack
  move ANYTHING from a still under ideal conditions. Four renders on an idle card answer it, they cost $0, they touch
  no renderer code, and a negative result retires more work than any positive one would create.'
