# 0. WHY THIS IS r2, AND IT IS NOT A RECIPE CHANGE. r1 (motion-poscontrol-0816)
#    cropped all three plates and encoded all four prompts, then REFUSED ITSELF
#    at its own verify-embeds step and rendered nothing. The refusal was correct
#    behaviour on a wrong assertion, not a defect in the material: the check
#    demanded that all four prompt_attention_masks differ, and a1 and a2 are both
#    exactly 60 Gemma tokens, so their masks are identical BY CONSTRUCTION. A
#    mask records LENGTH; two different sentences of the same length share one.
#    r1's own output, quoted from the runner's failed-job log:
#      prompt_embeds   a0=87b76c09cc5d a1=70eb2b246a2a a2=7dbb499788d9 a3=3793fca1786e
#        -> all four DISTINCT
#      negative_prompt_embeds  d9315dc3a259 on all four
#        -> IDENTICAL across all four
#    i.e. THE THING THAT MATTERED WAS ALREADY TRUE. r2 changes the assertion to
#    the claim actually worth proving -- four distinct positives against one
#    identical negative -- prints the masks for the reader and gates nothing on
#    them. NOT ONE RECIPE FLAG, PROMPT, PLATE, SEED OR SHA DIFFERS FROM r1.
#
# 1. THE QUESTION THIS JOB EXISTS TO ANSWER, and it is not a cadence question.
#    Six lanes have now moved how OFTEN a new picture arrives. In every arm of
#    every one of them THE FIGURE DOES NOT MOVE ITS BODY. Verbatim from three
#    independent lanes: "neither figure rocks"; "at f0 and f96 he is in the
#    identical folded pose"; "what changes between loud pairs is the drawing
#    being re-inked in place -- the shadow on the skull slides, the ear edge
#    redraws, grass reshuffles". Beat 13's prompt asks for a cyclical rocking
#    motion and NO ARM HAS EVER PRODUCED IT.
#
#    So before anything else is optimised, or any new checkpoint is downloaded:
#    CAN THIS STACK MOVE ANYTHING AT ALL FROM A STILL, under conditions chosen
#    deliberately to make it succeed? Not our beat, not our style, not our
#    characters. If the answer is no, the problem is not our prompts, our plates
#    or our recipe, and no beat-level work will ever fix it. If the answer is
#    yes, the constraint is something about OUR BEATS and that is a completely
#    different investigation. Either result is worth more than another cadence
#    sample.
#
# 2. THE LADDER. Four renders, one job, ONE encoder process, ONE seed, and --
#    asserted by the generator, quoted in section 6 -- FOUR ARGVS THAT DIFFER BY
#    NO RECIPE FLAG AT ALL. Every arm runs the exact production recipe: 704x1280,
#    97 frames, 24fps, two-stage 8@352x640 + 3@704x1280, distilled sigmas,
#    guidance 2.0, the full negative, image-crf 33, sequential offload, seed
#    20260815. The recipe is NOT under test here. The subject is.
#
#      A0  CONTROL. Beat 13's asserted plate, beat 13's prompt, byte-for-byte
#          out of ep2-b13-negcfg-0816. THE TRIPWIRE: this clip has come back
#          sha256 42043851da4b246cfcd4e858cda828da992d0d48f15ef10d81d3a99c1ceb445a
#          five times across four nights, from an asserted plate through a fresh
#          crop, encode and denoise. A SIXTH NON-MATCHING CONTROL INVALIDATES
#          THIS JOB and is reported as such rather than explained away.
#
#      A1  WORLD -- the floor of the ladder. A photograph of a waterfall, and a
#          prompt asking the water to fall. No body, no articulation, no
#          character: the easiest motion any i2v model is ever asked for. If
#          THIS holds still, the engine is not moving anything and the figure
#          question does not arise.
#
#      A2  HUMAN -- the arm that matters. A photograph of one woman running
#          barefoot on wet sand, whole body head to toes, BOTH FEET OFF THE
#          GROUND mid-stride, clean surf-and-sand background, and a prompt
#          asking her to keep running. Every dial is set to make this succeed:
#          photoreal (in-distribution for a video model, unlike anime line art),
#          one subject, uncluttered ground, room on all sides, and a cyclic gait
#          -- the single most common motion in any video corpus. IF LTX-2.3
#          DISTILLED CANNOT MAKE A RUNNER RUN, THAT IS THE FINDING.
#
#      A3  OURS, ASKED FOR SOMETHING EASY. Beat 13's plate again, same seed,
#          same negative, same recipe, and a prompt whose subject clause and
#          whose entire style tail are BYTE-IDENTICAL to A0's -- only the action
#          clause differs. A0 asks him to rock in place (small, cyclic, hard).
#          A3 asks him to put his hands down, push up onto his feet, stand and
#          step forward (large, one-way, easy). A0 vs A3 is therefore a genuine
#          one-variable diff on the same plate: is beat 13 frozen because the
#          ACTION REQUESTED IS TOO SMALL, or because the plate cannot move?
#
