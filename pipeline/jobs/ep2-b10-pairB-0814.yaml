verdict: >-
  FAIL on the clause that IS the beat, and the failure is the one the record already charged
  to the OTHER seed. `done_when` requires "the near one flips the bark board and holds its
  blank back TOWARD HIS PARTNER". From f065 to f096 the blank board is held with its face
  essentially PARALLEL TO THE PICTURE PLANE — presented to the lens — while the partner
  stands to its right and would see it nearly edge-on. That is verbatim the defect
  beats.10.round_3_result charges to seedA ("the board faces camera not the partner"), and it
  is present in pairB as well. What DOES land, and it is the beat's punchline, is the BLANK:
  from f055 the board is a completely featureless orange-tan rectangle, and NO FORM reads.
  Two guards hold for all 97 frames, the field is there at frame one, and there are zero
  identical adjacent pairs in the clip.
