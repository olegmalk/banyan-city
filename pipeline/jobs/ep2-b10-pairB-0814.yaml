  In this file: two adolescent boys, one dark-brown-haired and one light-brown, NEITHER BLOND,
  in matching tan-brown shirts and brown wrap skirts, NEITHER WEARING A WHITE SASH, NEITHER
  WEARING GLASSES, and not distinguishable as A and B by garment at all. The class is already
  on the record (guard_plates_are_miscast_0816); the attribute-by-attribute check against the
  shipped pixels is what this sweep adds. Named for the plate lanes; not a taste question,
  because the ruling is already made.
verdict_measured:
  no_freeze: >-
    exact_freeze_index.py: `frames=97 terminal_freeze_index=None terminal_freeze_len=0
    dup_pairs=0 runs=[]`. Parity-collapsed lag-4 median 11.11, minimum 1.20 — no four-frame
    window is one picture. With beat 05 and beat 06 these are the three clean-motion takes of
    the eight, and all three run off scene plates rather than costume cards.
  the_action_is_where_the_motion_is: >-
    Unlike beat 05, whose peak interframe steps all fall inside its defect window, beat 10's
    largest steps cluster in the early pairs and again around pairs 31-37, which is the
    handling window. The clip's motion is mostly the intended gesture. Recorded because it is
    the honest counterpart of the beat-05 note and would otherwise look like a double standard.
verdict_disagrees_with_the_record_and_leaves_it_standing:
  the_record_says: >-
    beats.10.round_4_result: "off the two-guard scene plate: both men present from frame one
    and throughout, board raised with its blank face showing, field at frame one. Meets its own
    definition."
  what_this_file_shows: >-
    THREE OF THE FOUR STATEMENTS ARE CONFIRMED AND THE CONCLUSION IS NOT. Both men present
    throughout: confirmed, 97 of 97. Blank face showing: confirmed, and it is the best thing in
    the clip. Field at frame one: confirmed. "Meets its own definition": NOT SUPPORTED. The
    definition does not say the blank face is SHOWING, it says it is held TOWARD HIS PARTNER,
    and it is held toward the lens. Note the wording of round_4_result itself — it says
    "showing" where the definition says "toward his partner", which is the substitution that
    let the conclusion through. Left standing unedited; this is the reading that disagrees.
verdict_reported_forward_for_the_lane_that_owns_the_in_hand_statistic: >-
  beats.10.plate_lane_0817 closes with "this beat's action is a small in-hand manipulation,
  which measures 0 of 8 in-hand against 12 of 12 whole-body, and the composition fix for it
  reproduced 0 of 4. A passing plate here would NOT imply a passing beat." THIS TAKE CONTAINS
  ABOUT TWENTY FRAMES OF IN-HAND HANDLING — f040-f059, a board raised, tilted and turned
  between two pairs of hands, continuous frame to frame. That does not refute the 0-of-8, which
  was measured on a different population and for all this lane knows on stills; it does mean
  an i2v motion job off this scene plate produced in-hand movement, so the pessimism in that
  last sentence may be aimed one notch too low. Handed to that lane with the frame range
  attached rather than argued about here.
verdict_next_instrument: >-
  NOT A SEED AND NOT A WORDING. Two things have to come from staging, and the record already
  names the harder one. (1) THE ADDRESSEE: the board's blank face must point at the partner,
  which means the partner has to be standing where the camera can see the face he is being
  shown — i.e. the two men need to be angled to each other, not shoulder to shoulder facing
  the lens. This plate stands them in parallel, so no seed can aim the board at both the
  partner and the audience. (2) THE PROP: two props merging into one is what happens when both
  men are dressed alike and drawn adjacent, which is beats.10.plate_lane_0817's own finding
  that "A PROP DOES NOT [bind to a person clause], it attaches to whichever figure is drawn
  nearest" — and that entry already lists dressing the men differently among the remaining
  options. Named, not fired — this lane files no GPU work.
verdict_status_recommendation: >-
  best-available, UNCHANGED. It stays cuttable and the reason is specific rather than
  charitable: the blank board IS the joke of NO FORM and the blank board is on screen, big and
  unmistakable, for the last forty frames. A viewer gets the gag. What they do not get is who
  it is aimed at, and that is now written down instead of blank.
verdict_by: judging lane, 2026-08-19. $0, no GPU, no render. Bar quoted verbatim, never widened.
