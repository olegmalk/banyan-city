verdict_contradicts_a_founder_ruling: >-
  THIRD INSTANCE IN THIS SWEEP, AND IT IS THE SAME PLATE AS BEAT 05's, SO IT IS ONE DEFECT
  APPEARING TWICE IN THE CUT rather than two. Against the frozen wardrobe
  (guards_CORRECTION_0816.still_genuinely_the_founders_ANSWERED_0816, R4, "the cast stands as
  drawn"): guard A dark-haired, tan wrap tunic, wide WHITE waist sash, WIRE-RIM GLASSES; guard
