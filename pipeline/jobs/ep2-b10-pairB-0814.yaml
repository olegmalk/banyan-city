    FAIL. From f055 the tan board spans roughly from the near guard's collarbone to his belt
    and close to the width of his torso. Same failure and same magnitude as beat 06's, on a
    different plate and a different prompt — which is worth pairing, because two beats failing
    the same dimension clause independently says the size of a held prop is not currently
    controlled anywhere in this pipeline.
