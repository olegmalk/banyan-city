verdict_clauses:
  P1_two_guards_in_frame: >-
    PASS. Two figures at f000, at f096 and at every frame between. No third man, nobody drops
    out. Like beat 05, this is the clause the shared two-guard plate exists to supply and it
    supplies it.
  P2_the_near_one_flips_the_bark_board: >-
    PARTIAL, AND THE MECHANISM IS NOT A FLIP. Read consecutively: f040-f044 the nearer
    (dark-haired, drawn larger and lower) figure holds a pale grey-blue slab angled with his
    partner's hands steadying its lower edge; f045-f049 he raises and tilts it; f050-f054 the
    presented face changes from pale grey-blue to orange-tan while the object also changes size
    and outline; f055-f059 it is a blank tan board in both his hands. TO A VIEWER THAT READS AS
    A FLIP — a face goes away and a blank face arrives — and it is fair to say the beat's
    gesture is legible. What is on screen is not a rigid body rotating: it is one object
    morphing into a different object mid-turn. Scored PARTIAL rather than PASS because the
    clause names an action performed on a board, and half of what sells it here is the prop
    changing identity. "The near one" is satisfied: the nearer man is the one holding it.
  P3_holds_its_blank_back_TOWARD_HIS_PARTNER: >-
    FAIL, and it is the load-bearing failure. Checked at f065, f070, f074, f079 and f096: the
