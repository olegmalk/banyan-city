verdict_this_job: >-
  FAIL, AND THE ORIGINAL STANDS. The crf-10 take is marginally more faithful to
  the plate and dramatically more stable in time, and it spends the beat to get
  there: FAIL-FROZEN on a beat whose entire script line is "stem trembling", plus
  a round yellow form that enters frame in the last quarter and is in neither the
  plate nor the original. This is beat 14's lesson firing a third time and by far
  the hardest -- here the conditioning fix costs the content of the shot.
verdict_this_job_measured:
  motion_FAIL_FROZEN: 'THE VERDICT. Interframe median collapses to 0.570 from the
    original''s 5.956 -- a 10.4x reduction -- and it is even across the clip
    (quarters 0.52 / 0.55 / 0.59 / 0.62 against 5.69 / 6.81 / 6.20 / 5.31), so
    nothing is redistributed, it is simply gone. Pairs under 0.5 rise to 18 of 120
    from 3; the longest consecutive still run goes to 3 frames from 1; drift from
    f000 reaches only 29.73 against 52.81. The mp4 is half the size (254,864 bytes
    against 480,467) which is the codec saying the same thing.'
  and_it_is_NOT_codec_shimmer_which_was_tested: 'THE OBVIOUS OBJECTION, MEASURED AND
    REJECTED, because a crf-33 take could plausibly win an interframe comparison on
    injected noise alone. Real motion survives a spatial low-pass and per-pixel noise
    does not: at Gaussian blur 3 the gap is unchanged, 4.966 against 0.347. And on
    depicted motion, which no amount of noise can fake -- the centroid of the fig
    mass, measured on blurred frames -- the original swings 40.84 px horizontally
    against this take''s 17.73 on a 176 px-wide frame, with a median frame-to-frame
    centroid shift of 3.160 px against 0.154, a factor of 20. The original genuinely
    trembles. This take genuinely does not.'
  looked_at_and_it_confirms_the_numbers: 'The 12-frame consecutive strip at idx40-51
    is the decisive picture. In this take the specular diamond holds a crisp,
    near-identical shape and position across all twelve frames and the stem tip barely
    changes -- near-duplicates with a slow background gradient drift over the top. In
    the original the highlight visibly changes shape and position frame to frame and
    the stem edge shifts. The bar says "measure it, do not eyeball it"; measured and
    eyeballed agree.'
  something_enters_frame: 'FAIL against the PASS clause "Nothing else enters frame".
    A soft round YELLOW form appears at the top-right, absent at idx60 and growing
    through idx90 / idx105 / idx120. Checked at source before calling it: the init
    plate''s top-right corner is clean, and so are BOTH conditioning images and BOTH
    first frames (corner mean RGB 228.7,194.4,194.8 on the plate against
    227.4,192.7,193.2 and 228.3,192.4,193.7 on the two cond files) -- so it is
    generated during the clip, not preserved from the plate. Whether it is
    specifically FAIL-COUNT is arguable: it is soft-focus and could be read as a
    background bokeh highlight rather than a second fruit. It is not arguable that it
    is new, that the plate does not contain it, and that the original stays clean
    there for all 121 frames.'
  lighting_steady_no_strobe: 'PASS, and much better than the original -- the one axis
    where the fix delivers exactly what it promised. Adjacent-frame specular pumping
    over 25%: 0 of 120, as in the original. Whole-frame luminance high-frequency
    residual std 0.052 against the original''s 0.968, an 18x improvement in temporal
    stability. Peak luminance 246.2-250.3.'
  colour_holds_purple: 'PASS. Median hue of the saturated subject pixels 311.7 deg
    with a total spread of 2.5 deg across all 121 frames, against the original''s
    311.2 and 4.2. Mean subject RGB f000 49,22,45 -> f060 50,24,45 -> f120 51,24,46.
    Deep purple-violet end to end, no drift toward green, red or brown, and tighter
    than the original.'
  count_attach_person: 'PASS on attach and person -- one fig, joined at the neck, never
    leaves frame, no face or figure. Count is scored under something_enters_frame
    above rather than banked here.'
  fidelity_first_frame: 'Marginally better: mean |RGB| of the first frame from the init
    2.528 against 2.774, a 9% reduction. At source the conditioning image is cleaner
    as expected -- crf 33 puts 5.23% of pixels off by more than 8 levels (mean 2.37)
    against crf 10''s 0.31% (mean 1.49). So even a 17x reduction in visibly corrupted
    conditioning pixels moves f000 by 9%, and on this beat it moves the motion by
    -90%.'
why_the_original_stands_in_one_line: 'Beat 18 is an extreme close-up of a trembling
  stem, and the crf-10 take does not tremble.'
what_this_settles_beyond_this_beat: 'The crf ruling buys real fidelity and real
  temporal stability, and on a MACRO plate with a single subject it buys them by
  removing the motion. The mechanism is plausible and consistent with beats 14 and 17:
  a cleaner conditioning image gives i2v less to push off from, so a shot whose entire
  content is fine high-frequency movement has nothing left to move. That is a
  BEAT-SHAPE-DEPENDENT tradeoff, not a global win, and it is the calibration the three
  re-runs were filed to produce.'
what_this_licenses: 'Nothing on beat 18. No fourth seed, no reseed, no crf value
  between 10 and 33, no bar change, no publication. The original take
  ep2-b18-tremble-s20260871-0817 remains the beat-18 candidate exactly as it was, on
  its own unmodified verdict, and nothing about the cut changes. The one general
  follow-up is on the ladder: a bar clause capping the share of frame pairs under 0.5
  interframe, which beats 17 and 18 have both now needed and neither has ever had.'
