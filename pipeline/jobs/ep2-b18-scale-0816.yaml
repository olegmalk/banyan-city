why: >-
  The founder ruled the plant on 2026-08-16: "make sure it has 2 leafs and has a set height... dont make it double in size suddenly." Canon: genomes/sapling/THE-SAPLING.md. What this draft changes vs the line
  it derives from: the one beat-18 draft that is NOT a macro - it carries grass, a treeline and a horizon, so the plant's size is actually on screen. Leaf count added; the purple-fig wording is byte-identical to its source (fruit colour belongs to the fig lane).
script_line: >-
  THE DECISION, beat 18, node.md verbatim: "Extreme close-up: the one fig on the thinnest branch, stem trembling."
success: >-
  THIS BAR IS BEAT 18's AND NOTHING ELSE. Beat 18 is THE DECISION and its action, quoted verbatim from
  genomes/sapling/nodes/002b-first-citizen/node.md, is "Extreme close-up: the one fig on the thinnest
  branch, stem trembling." There is no goblin in this beat and no sprint; a spec judged against beat 02's
  sprint prose is being judged against the wrong beat. Sixteen frames at 704x1280. PASS is ONE deep
  purple-violet fig, the only fruit in frame, hanging from the thin branch of a sapling that has EXACTLY
  TWO leaves and stands no taller than the surrounding grass, with the treeline and pale sky behind so
  the plant's size is actually readable on screen. The failure worth reporting is the plant coming back
  waist-high or with three or more leaves, which would mean the `no taller than the grass around it`
  anchor does not bind in wording and the size has to move into the reference set instead. Fruit colour
  is byte-identical to the source draft and belongs to the fig lane, not this test. Read against beat
  18's unanchored `authored_b18_scene`.
