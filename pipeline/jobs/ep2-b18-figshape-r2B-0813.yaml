# 2026-08-13 r2. THE r1 SAMPLE WAS INVALID AND THE CONFOUND WAS MINE.
# r1 carried the teardrop clause AND, in the same prompt, "ONE SINGLE ROUND GREEN FIG"
# three times in capitals plus "a round fruit". I wrote the fix and the defect into one
# prompt and then read the result as if it were a test of the fix. seedA inflated to a
# sphere; seedB held a teardrop anyway, which is the clause winning against three shouted
# contradictions. Nothing about the clause can be concluded from r1.
#
# r2 removes the four "round"s that describe the fig, by exact phrase, never by substring
# (deleting the substring "noon" once turned "afternoon" into "after"). "NOT a round ball"
# stays: that one is the ban, not the defect.
#
# The fill-the-frame clause goes too. It is the same prop-inflation driver that turned the
# bark clipboard into a slab in b06/b10, and in r1 seedA it pushed the camera in until the
# fig burst its own outline. What replaces it is the geometry that DID bind count on b18
# at both seeds: the frame is too tight to hold a second fruit.
