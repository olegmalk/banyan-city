why: |-
  ONE VARIABLE MOVED, AND IT IS NOT A WORDING.

  THE RUNG BELOW THIS ONE FAILED ON COLOUR, MEASURED
  --------------------------------------------------
  ep2-b01-nubinpaint-0818 ran on this same plate, this same ellipse, this same
  prompt and this same negative, at strength 0.99, and came back:

      mean RGB 243,219,127  ->  hue 48 deg, sat 0.48, val 0.95
      brightest pixel 250,245,151

  Cream-gold and near-blown: FAIL-COLOUR. That verdict is committed in aff9f6f5
  and it is the reason this job exists. It is also the SECOND time this defect has
  been measured on this frame -- ep2-b01-fig-inpaint-s1 on 2026-08-10 returned a
  fruit wearing a blown white specular cap -- and the negative it failed under
  already carried `ripe fig, purple fruit, purple, violet, magenta, dark fruit`
  plus eight glow terms plus `matte green skin` in the positive. Every word that
  could be written against the defect was already written. A ninth wording is not
  an instrument; it is the same question asked louder.

  WHY COLOUR WILL NOT BIND THROUGH THE PROMPT HERE
  -------------------------------------------------
  The crop is amber rim-light in every direction -- this plate is a backlit dusk
  field, mean hue 20-30 deg over 80% of the frame, and only 0.6% of its pixels are
  green at all. A 0.99 pass discards the init inside the mask and re-derives the
  region from context plus text, and the context says amber in a voice CLIP cannot
  shout over. That is the same shape of failure as leaf COUNT on this beat, which
  eight promptings could not fix and one PIL composite fixed on 8 of 8 frames
  (leafcomp-0817, and the compseed lane that picked this very plate).

  SO THE COLOUR STOPS BEING A REQUEST AND BECOMES A PIXEL
  --------------------------------------------------------
  pipeline/nub_composite.py pastes the nub into the init before the GPU is
  touched: an ellipse 21x27 px centred (405,750), hue and saturation sampled from
  the plate's OWN 6047 green pixels (median hue 90.0 deg, quartiles 76.4/100.0;
  saturation at the p90 of those greens, 0.298), value taken from the mean light
  inside the nub's own footprint (0.824) and hard-capped at 0.92 so it CANNOT come
  back blown the way the 0.99 body did. A vertical gradient (1.10 -> 0.74 on
  value) and a 1.6 px feathered edge give the sampler something to shade instead
  of a flat decal. No hex constant exists anywhere in the tool -- a typed green
  would be a taste call wearing a number, and on a dusk plate it would also land
  as a sticker.

  Then ONE inpaint pass at strength 0.30 -- the community-measured
  preserve-the-init band (0.2-0.35), the same band this repo's own leaf lane used
  to bind an attribute the prompt could not encode. The pass is not being asked to
  invent a fruit. It is being asked to draw the line around one that is already
  there.

  WHAT THIS RUN CAN AND CANNOT ANSWER
  ------------------------------------
  It answers: does 0.30 KEEP a green that was structurally present, or does the
  amber context repaint it anyway? That is a real fork. If the green survives, the
  route to a shippable frame-1 nub is open and the remaining work is craft. If
  0.30 washes it to amber, then the context is stronger than the init at this
  strength and the next rung is lower strength (0.20) or a stronger composite, not
  another sentence. Either way the answer is measured, not argued.

  It cannot answer whether the founder likes the nub. That is R4's and this job
  makes no taste call.
success: |-
  PRE-REGISTERED BAR, ONE SAMPLE, N=1. Written before the frame exists,
  read off the committed file afterwards, and NOT rewritten once the pixels are in
  front of me.

  The colour axis is stated as a NUMBER because the rung below it failed on a
  number. The 0.99 sample was failed by measuring the nub body's pixels and
  getting hue 48 deg / sat 0.48. The same measurement, on the same kind of body
  mask, decides this one:

      PASS-COLOUR  =  median hue of the nub's body pixels in [70, 150] degrees
                      AND median saturation >= 0.12

      Band justification, so it cannot be moved later: the plate's own greens run
      76.4 deg at p25, 90.0 at the median and 100.0 at p75, with 128.6 the
      greenest pixel in the frame. A band demanding more than 150 deg would demand
      a green this picture does not contain; a band starting below 70 deg would
      start letting amber in. The failed sample sat at 48 deg -- 22 degrees
      outside the lower edge -- so the band separates the two answers with room to
      spare. The composite goes IN at hue 90.0 / sat 0.298, so what this run
      actually measures is RETENTION: how much of a structurally-present green a
      0.30 pass keeps.

  Every one of these must hold for PASS:

   1. COLOUR: as above -- median hue in [70,150] deg, median sat >= 0.12.
   2. NOT BLOWN: max value < 0.99 and fewer than 5 body pixels above 250 in all
      three channels. The 0.99 sample returned val 0.95 with a 250,245,151
      brightest pixel; a green that glows is a different failure, not a pass.
   3. ONE BODY: exactly one nub. Not two, not a cluster, not a nub plus a flower.
   4. ATTACHED: the body touches or overlaps the pedicel that ends at (407,744) --
      it may not float clear of it.
   5. SMALLER THAN EITHER LEAF: the body's larger dimension stays under 62 px.
      Measured lit-blade extents on this plate are 81x76 px (left leaf) and 94x62
      (right); the composite goes in at 21x27, so anything approaching a leaf
      means the pass grew it.
   6. PLATE UNCHANGED OUTSIDE THE MASK: zero differing pixels outside the mask
      bbox (388,727)-(420,765) grown by the 8 px blur ramp.
   7. NO PURPLE: no body pixel in 260-330 deg hue at sat > 0.2. Frame 1 is
      pre-ripe by the approved script.

  FAIL modes, named now so the next rung is chosen by the failure and not by mood:

    FAIL-WASH     colour drifts out of the band toward amber -> 0.30 is still
                  strong enough for context to win; go to 0.20, or composite at a
                  higher saturation. Not a new wording.
    FAIL-DECAL    green survives but the body is still a flat feathered oval with
                  no cel line and no shading -> 0.30 is too weak to draw; go up to
                  0.40, which is still inside the preserve band.
    FAIL-GLOW     criterion 2 -> the checkpoint's specular habit survives even a
                  value-capped init; next instrument is a darker composite top.
    FAIL-COUNT / FAIL-DETACHED / FAIL-SIZE / FAIL-PLATE / FAIL-PURPLE as above.

  A run that errors, or a publish step that cannot find all six files, is a FAIL
  of the job and not of the recipe -- there is no allow_fail anywhere in this
  spec, so the queue will say so itself.
