  FAIL-WASH BY 1.4 DEGREES. The composite went in at hue 90.0 and came out at 68.6:
  the 0.30 pass pulled 21.4 degrees of amber into a green that was structurally
  present, and 21.4 degrees was exactly enough to land outside a band whose lower
