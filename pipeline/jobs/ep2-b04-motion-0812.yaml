# 2026-08-12. His order: "do your on evaluation, character consistency, then
# generate video clips." I did the evaluation first (416 files hash-verified
# against the box, thirteen contact sheets read by eye) and it changed how many
# clips this phase can honestly produce.
#
# THE WALK HOLDS THE CHARACTER AND LOSES THE BEAT. Across ten conditioned beats
# the goblin is the approved one — pale yellow-green, bald, long ears, red eyes,
# patched coat — and the STAGING is gone: beats 03, 08, 13, 14, 15, 17, 19 and 20
# are front-facing standing character-sheet portraits on blank white. No sapling
# in 15, no falling fig in 19, no fig in his hands in 20, one character in 08
# where the beat needs two. Beat 02, the one he named, is the worst: fangs, a
# dog-shaped creature, duplicated goblins, style swinging between flat cartoon
# and cel.
#
# BEAT 04 IS THE EXCEPTION AND IT IS NOT LUCK. Its shot IS a face close-up
# ("Close on his face holding his breath"), so the portrait bias the mechanism
# has and the framing the beat wants are the same picture. It is the only beat
# in the pass that clears identity AND staging, so it is the only beat that gets
# a clip. Animating the other eleven would be rendering a standing portrait and
# calling it a beat -- the exact "do not scale an unapproved result" the ONE
# SAMPLE rule names.
#
# CAMERA: shots.md asks for a "slow push-in". I am holding the camera locked and
# saying so out loud. The face already fills the frame, so a push-in has nowhere
# to go but into his ears -- the feature carrying most of the identity -- and his
# last motion verdict today was a camera move he rejected ("its just.. making the
# camera go down in the clip"). Locked-off at guidance 2.0 with the defects NAMED
# in the negative is the recipe with a measured result behind it. If he wants the
# push-in, it is one flag and one re-render.
