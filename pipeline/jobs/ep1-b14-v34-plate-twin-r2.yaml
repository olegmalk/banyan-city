# ep1 beat 14 "worth-staying-in" — PLATE TWIN of the r2 round.
#
# WHY THIS IS THE HIGHEST-VALUE JOB IN THE QUEUE. Beat 14 is the biggest
# remaining hole in the v35 cut. Measured on the cut's own clip today:
# median frame-pair delta 0.008, 88% of pairs under 0.2 — the most frozen beat
# in the episode, and it sits second-to-last, so a dead frame there is the last
# thing before the closing beat. v35 plays a HELD STILL here (312 frames) because
# beat 14 is the one frozen beat that was deliberately given no twin.
#
# IT ALREADY HAS A GOOD ROUND. `14-worth-staying-in-LTX-r2.mp4` measures median
# 4.524 with 0% frozen pairs — the most motion of any candidate in the whole v34
# series — and its own STATUS.yaml records the picture as upright, style-holding,
# with no human/hand/face/invented object. Its ONLY blocking defect is geometry:
# like every clip in the series it was rendered off a raw 832x1216 still resized
# to 704x1280, a 24.4% vertical stretch, so it cannot sit next to its neighbours.
#
# SO THIS JOB CHANGES EXACTLY ONE THING: --init is a 704x1280 cover-centre plate
# from plate_prep.prepare_plate instead of the raw still. Prompt, negative, seed
# (20260745), size, frames, fps, steps, guidance, sigmas, two-stage and the
# renderer binary are held byte-fixed to what r2's own sidecar records — the text
# that actually rendered, not a spec that might have drifted from it.
#
# THE RECIPE IS RATIFIED, NOT A CHANGE. The founder approved the cover-centre
# crop today ("the crop -- yes"). Thirteen raw/plate pairs are already on disk and
# I measured all of them: twelve held their motion under plating and most gained
# (03 r3 0.825->3.391, 04 r4 0.872->1.387, 10 r2 1.688->1.243). So this is an
# approved recipe applied to a new beat, not a recipe under test.
#
# THE ONE HONEST RISK, NAMED. Beat 08 r1 is the single pair of the thirteen where
# plating cost the motion: identical recipe and seed, raw 1.210/0% frozen ->
# plate 0.131/62% frozen. A crop cannot turn 0% duplicate pairs into 62%, so that
# was a bad draw, not a property of plate_prep. It is still the reason this beat
# gets a second seed (ep1-b14-v34-plate-r2b-reseed) rather than one attempt.
#
# NOT THE GATED SPEC. `ep1-b14-v34-motion-r3.yaml` carries a `gate:` key and is
# UNTOUCHED by this file — I did not delete it and it must not be fired. That
# spec's two recorded objections were (1) no plate step and (2) it applied beat
# 08's affirmative framing lock, which costs motion, to a beat believed to be the
# most frozen in the cut. This job answers (1) and simply does not do (2): the
# wording here is r2 verbatim with no lock added. Releasing that gate is still a
# human act and this job does not perform it.
#
# NO METRIC PICKS ANYTHING HERE. collect_farm.measure is disqualified as a
# selection criterion on this series — 131e433 recorded its highest score on the
# beat where the plant FELL OVER, which is beat 14's own r1. Numbers above are
# reported to say what changed, never to choose. Which round of beat 14 enters
# the cut is R4's.

