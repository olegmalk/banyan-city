payload:
  # r2's prompt verbatim from its sidecar. The `[unused: ...]` line video_task
  # appends inside the negative block is stripped: it is a note the sidecar
  # writer added at render time, not part of the text that was encoded, and
  # feeding it back would make this twin differ from its pair by a line of
  # English — the one thing a twin must not do.
  C:\banyan-farm\v34-plates-0810\ep1-b14-v34-plate-twin-r2-prompt.txt: |-
    2D anime, hand-drawn cel animation, flat cel shading, clean ink linework, anime key art. the sapling stands upright and holds its position, stem straight and steady, rooted firmly in place; only its two leaves tremble very slightly, the short grass around its base ripples in a light breeze, dust motes drift in the air, warm afternoon light shifts gently across the leaves. small ambient motion only, the plant stays standing tall and centred, framing unchanged, gentle camera drift, living scene. Subject already in frame: no human, no person, no man, no woman, no boy, no girl, no hand, no face, plant focus, one slender sapling standing tall and erect, thin stem rising well above the grass to near the top of the frame, short grass, warm afternoon light.
  # Carried verbatim for the provenance record. At guidance 1.0 the distilled
  # schedule runs no unconditional pass (07218cb), so this text changes no pixel;
  # it is here so the twin's inputs match its pair exactly.
  C:\banyan-farm\v34-plates-0810\ep1-b14-v34-plate-twin-r2-negative.txt: |-
    wilting, drooping, bending over, falling over, collapsing, stem bending, plant dying, sagging, human, person, man, woman, boy, girl, hand, arm, foot, face, photorealism, 3D render look, text, 静态, 静止, frozen frame, still image, no motion, photorealistic, photograph, live action, film still, 3D render, CGI, octane, depth of field bokeh, scene change, shot change, cut to another angle, second scene, new camera angle, different location, split screen, montage

