instrument_note_the_probe_metric_is_VOID_on_this_hint: >-
  RECORDED IN ADVANCE SO NOBODY QUOTES IT. controlnet_probe.py's bind_ratio is
  void on this hint class by the probe's own pre-registered rule, exactly as
  recorded for rungs 3 and 4: the nocontrol frame at this seed scores 1.498,
  outside the probe's [0.85, 1.15] kill-switch band for an unconditioned arm, and
  that rule says every number in such a run is void. The metric assumes a sparse,
  OFF-CENTRE hint whose strokes sit where the model would not otherwise put
  structure; this hint's strokes run down the middle of two standing figures. THE
  VERDICT WILL REST ENTIRELY ON THE PIXELS, plus the ink-adherence measure rung 4
  introduced, which is comparable across rungs because it is computed identically.
