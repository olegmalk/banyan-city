  b4c_the_arm_belongs_to_the_guard: >-
    THE CLAUSE THAT MUST SURVIVE. The pointing arm grows from THE GUARD's
    shoulder. It has held on every hint that held the staging, and it is the only
    thing this route has ever produced that nothing else has. If a skeleton cannot
    keep it, hand-authored geometry stops being a composition lever for this beat.
  b5_no_colossus: >-
    Neither figure towers over the other. The uncontrolled frame at this seed is
    an extreme colossus, so this clause is entirely the condition's doing and is
    the most sensitive read on how much authority a non-enclosing hint retains.
  b6_drawn_not_traced: >-
    THIS RUNG'S OWN QUESTION AND THE REASON IT EXISTS. Rungs 2 and 4 both passed
