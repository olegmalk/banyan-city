# BEAT 08, RUNG 5 -- THE FIRST RUNG THAT CHANGES THE HINT'S CLASS.
# ONE SAMPLE. ONE ARM. ONE VARIABLE: dense full-body CONTOUR -> sparse SKELETON.
#
# ============================================================================
# ITS PARENT IS RUNG 2, NOT RUNG 4, AND THAT IS WHAT MAKES THIS ONE VARIABLE
# ============================================================================
# Rung 2 is ep2-b08-cnetplate-r2-0819: scale 0.45, stroke 7px, dense contour.
# This job is scale 0.45, stroke 7px, SKELETON. Same seed 20260819, same positive
# word for word, same negative including the settled `dark, night` fix, same
# size/steps/guidance/base/ControlNet, driver byte-identical at
# 2a1bd19e. So the ONLY difference anywhere in this job against rung 2 is the
# hint file, and the only difference in the hint file is its class.
#
# Rung 4 (0.45, 3px, contour) is the sibling that closed the stroke dial, and its
# stroke value is deliberately NOT carried here: stacking a 3px stroke on a class
# change would be two variables and would make a failure unattributable.
#
# ============================================================================
# WHY THE CLASS, AND WHY IT IS THE RULED INSTRUMENT RATHER THAN A NEW IDEA
# ============================================================================
# Four rungs have now bracketed two dials by measurement:
#
#   scale   0.80 / 0.45 / 0.28   staging HELD / HELD / LOST
#   stroke  7px / 3px @ 0.45     staging HELD / HELD -- and the outline never freed
#
# Rung 4's finding was that the second dial POINTS THE WRONG WAY. Share of
# authored ink carrying a strong render gradient within 3px, one instrument,
# nocontrol as the coincidence floor: nocontrol 26.1%, 0.80/7px 97.7%,
# 0.45/7px 94.4%, 0.45/3px 98.3%. THE THIN HINT WAS TRACED MOST TIGHTLY OF ALL.
# A 7px bar is an ambiguous ribbon the model may fill anywhere; a 3px line is a
# single edge locus the outline snaps onto. Stroke weight is a PRECISION dial, not
# a strength dial, so no weight frees the silhouette.
#
# That localises the cause on the ENCLOSURE, and it is the one property no rung
# has yet varied. A closed contour around a body is an instruction about where
# that body's EDGE goes, at any strength and at any weight. This rung removes it:
# joint dots and single-line bones, the medial axis instead of the silhouette.
#
# ============================================================================
# THE HINT EXISTS, ITS CLAIM IS ASSERTED IN CODE, AND IT WAS LOOKED AT
# ============================================================================
# pipeline/control/b08-pose-skel-0819.png, sha 09200bdf..., 832x1216, drawn by
# author_b08_pose_hint.py --skeleton. Three things are asserted by --selftest
# BEFORE any pixels, and all of them pass:
#
#   * THE GEOMETRY IS IDENTICAL, key by key, to the contour hint: ground_y_px,
#     guard, goblin, stature_ratio, point, board, size and stroke_px all compare
#     equal. Same cx for both figures, same statures, same shared foot line
#     y=1149.1, same shoulder->elbow->wrist->fingertip chain, same 26.8px torso
#     clearance, same extension 0.847, same board. The pose is not re-authored.
#   * NEITHER BODY IS ENCLOSED, and this is a STRUCTURAL assertion by flood fill
#     rather than a claim about ink. Seeded at mid-torso, off every line, and
#     checked off-ink in both classes first: in the CONTOUR class the fill is
#     trapped inside the torso (guard 18007 px, goblin 11247 px as single closed
#     cells); in the SKELETON class the same seed reaches the frame border in both
#     figures. THE BOARD IS STILL A CLOSED RECTANGLE ON PURPOSE -- it is an object
#     we want traced, not a body we want redrawn, and B4a has passed on it four
#     times -- and that too is asserted so nobody "fixes" it later.
#   * A HAND-SIZED MARK SITS AT THE END OF THE ARM (361 px of ink within 9px of
#     the wrist). This is not a second variable, it is rung 4's own ruling carried
#     forward: rung 4 pre-registered that "B4b needs a hand-sized mark at the end
#     of the arm whatever the class" after its 1px finger came back as a
#     fingerless wedge.
#
# ONE THING THE SELFTEST FOUND AND THE DRAWING WAS CHANGED FOR, recorded because
# it was a real defect and not a threshold to be tuned: the first skeleton drew a
# HIP BAR, and shoulder-bar + spine + hip-bar + the board arm still closed a cell
# holding 56% of the guard's torso -- i.e. it still partly specified his right
# edge. The hip bar was redundant with the leg-joint dots, so it was removed
# rather than the assertion weakened. Hip WIDTH still reaches the model, as two
# joints instead of as a line.
#
# ink_fraction 0.0398 against the contour's 0.0581. NOTE THAT SPARSITY IS NOT THE
# CLAIM -- the joint dots cost ink back, and non-enclosure is the variable.
#
# Opened at full size and at 1:1 beside the contour hint before this spec was
# written: EVIDENCE-b08-skelhint-0819.png.
#
# NO SPEND, NO PROVIDER, NO CANON FILENAME, NO PICK, NO PUBLISH TO THE SITE, NO
# POST, NO ASSEMBLY, NO VIDEO. This renders one still.

