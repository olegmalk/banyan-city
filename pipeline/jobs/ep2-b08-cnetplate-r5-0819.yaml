    gripping-hand dot exist to protect.
  b4b_legible_point: >-
    The gesture ends in a HAND aimed at the goblin's belly. FAILED at 0.80 (ended
    in nothing), PASSED at 0.45/7px (a modelled hand with an index finger), FAILED
    at 0.28 (a clean hand on the wrong figure), FAILED at 0.45/3px (a fingerless
