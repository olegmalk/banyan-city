steps:
  - name: hintskel
    argv:
      - C:\banyan-farm\venv\Scripts\python.exe
      - C:\banyan-farm\b08cnetplate-r5-0819\src\pipeline\controlnet_plate.py
      - --root
      - C:\banyan-farm\b08cnetplate-r5-0819\src
      - --repo-commit
      - dc7348f36d6ffaf218a9d423a80072f0efb6fdf3
      - --task
      - ep2-b08-cnetplate-r5-0819
      - --arm
      - hintskel
      - --control
      - pipeline/control/b08-pose-skel-0819.png
      - --control-sha256
      - 09200bdf0d293f2555a4ee5430c3f9787dcccba8a6d783b7ff62cebafae89ac3
      - --scale
      - '0.45'
      - --seed
      - '20260819'
      - --prompt-file
      - C:\banyan-farm\b08cnetplate-r5-0819\prompt.txt
      - --negative-file
      - C:\banyan-farm\b08cnetplate-r5-0819\negative.txt
      - --out
      - C:\banyan-farm\b08cnetplate-r5-0819\out
  - name: publish
    argv:
      - C:\banyan-farm\venv\Scripts\python.exe
      - -c
      - |-
        # Required by box_enqueue.courier_problems (2026-08-19): a job whose
        # artifacts live outside courier-box\farm-out must have a step that
        # carries them there, because the courier pushes from farm-out and from
        # nowhere else. ep2-cnet-probe-0817 rendered perfectly and was invisible
        # for two days for want of exactly this.
        import glob, hashlib, os, shutil
        out_dir = "C:/banyan-farm/b08cnetplate-r5-0819/out"
        pay_dir = "C:/banyan-farm/b08cnetplate-r5-0819"
        dst = "C:/banyan-farm/courier-box/farm-out/ep2-b08-cnetplate-r5-0819"
        os.makedirs(dst, exist_ok=True)
        files = sorted(glob.glob(out_dir + "/ep2-b08-cnetplate-r5-0819-hintskel.png*")
                       + glob.glob(pay_dir + "/prompt.txt")
                       + glob.glob(pay_dir + "/negative.txt"))
        lines = []
        for f in files:
            shutil.copy2(f, dst)
            c = os.path.join(dst, os.path.basename(f))
            with open(c, "rb") as fh:
                h = hashlib.sha256(fh.read()).hexdigest()
            lines.append(h + "  " + os.path.basename(f))
        with open(os.path.join(dst, "ep2-b08-cnetplate-r5-0819.sha256"), "w",
                  newline="\n") as fh:
            fh.write("\n".join(sorted(lines)) + "\n")
        print("published", len(files), "file(s) + manifest ->", dst)
        raise SystemExit(0 if len(files) >= 4 else 1)

artifacts:
  - C:\banyan-farm\b08cnetplate-r5-0819\out\ep2-b08-cnetplate-r5-0819-hintskel.png

# ============================================================================
# THE BAR. CARRIED FROM RUNGS 1-4 UNCHANGED. Not edited after the pixels.
# ============================================================================
bar:
  b1_the_pair: >-
    TWO figures and only two -- one guard and one goblin, both whole in frame.
    GENUINELY AT RISK for the first time on this axis: a skeleton does not enclose
    a body, so nothing in the hint says how wide either figure is, and the
    checkpoint may merge two nearby skeletons into one figure or grow a third.
  b2_the_adults_read: >-
    EXPECTED FAIL FOR THE FIFTH TIME, PRE-REGISTERED, AND NOT THIS RUNG'S
    VARIABLE. Four rungs across two dials returned four pairs of green figures,
    because a contour -- or a skeleton -- cannot say which body an attribute
    belongs to: `green skin` enters the pooled embedding and lands on both.
    Changing the hint's class does not create a per-figure identity channel. A
    PASS here would be a real surprise and would mean the ENCLOSURE had been
    suppressing the wording, which would redirect the identity probe.
  b3_one_ground_plane: >-
    Both stand on the same grass, feet at the same depth. The skeleton pins both
    foot lines at y=1149.1, unchanged, and keeps the ground ticks.
  b4a_board_down: >-
    The clipboard is DOWN at the guard's hip, in ONE hand, not raised at his chest
    and not in both hands. This is the clause the retained board rectangle and the
    gripping-hand dot exist to protect.
  b4b_legible_point: >-
    The gesture ends in a HAND aimed at the goblin's belly. FAILED at 0.80 (ended
    in nothing), PASSED at 0.45/7px (a modelled hand with an index finger), FAILED
    at 0.28 (a clean hand on the wrong figure), FAILED at 0.45/3px (a fingerless
    wedge). The hand-sized wrist mark is this rung's answer to the last of those.
  b4c_the_arm_belongs_to_the_guard: >-
    THE CLAUSE THAT MUST SURVIVE. The pointing arm grows from THE GUARD's
    shoulder. It has held on every hint that held the staging, and it is the only
    thing this route has ever produced that nothing else has. If a skeleton cannot
    keep it, hand-authored geometry stops being a composition lever for this beat.
  b5_no_colossus: >-
    Neither figure towers over the other. The uncontrolled frame at this seed is
    an extreme colossus, so this clause is entirely the condition's doing and is
    the most sensitive read on how much authority a non-enclosing hint retains.
  b6_drawn_not_traced: >-
    THIS RUNG'S OWN QUESTION AND THE REASON IT EXISTS. Rungs 2 and 4 both passed
    B6's three POSITIVE tests -- cloth with folds, shaded limbs, faces with
    features -- and both failed its NEGATIVE test, because the SILHOUETTES were the
    authored polygons: boxy torsos, straight shoulders, columnar legs, a
    rectangular bar for an arm. B6 passes here only if the OUTLINE is the
    checkpoint's: limbs that taper, a torso with a waist, shoulders that slope,
    cloth that leaves the polygon. Score the positive and negative halves
    separately.
verdict_rule: >-
  WRITTEN BEFORE THE PIXELS. (1) If B1, B3, B4a, B4b, B4c and B5 hold AND B6
  finally passes both halves AND B2 fails as pre-registered, the verdict is
  PASS-ON-PURPOSE and the composition lever is FINISHED as a piece of engineering:
  the recipe is 0.45 + sparse skeleton, and beat 08's only remaining blocker is
  identity, which unparks immediately because it now has a model-drawn outline to
  attach to. (2) If B6 passes AND the staging degrades -- the arm leaves the guard,
  a colossus returns, the figures merge or a third appears -- then the ENCLOSURE
  was load-bearing for composition and not merely for tracing, and the two
  properties cannot be separated by this instrument. That closes hand-authored
  geometry as the route and hands beat 08 to a plate campaign or to per-figure
  IPAdapter, which is a real answer and not a failure. (3) If the staging holds AND
  B6 still fails -- polygon silhouettes off a hint that draws no silhouette -- then
  the tracing was never the enclosure either, and the flatness is a property of
  this checkpoint under ANY geometric conditioning at a usable strength. That
  retires the whole hint-authoring line for the look, keeps it for the staging, and
  makes `control_guidance_end` the last untried lever. UNDER ANY BRANCH, DO NOT
  FILE A SIXTH HINT VARIANT WITHOUT READING ALL THREE ABOVE FIRST.
not_done_on_purpose: >-
  ONE sample, ONE arm, ONE variable. No stroke change (7px, rung 2's value, is
  held), no scale change (0.45 is the settled constant), no re-posed hint, no
  control_guidance_end change (still hardcoded, still its own question), no
  identity mechanism, no ControlNet-plus-mask, no pick, no plate_ack waiver, no
  canon filename, no second seed. The nocontrol control is rung 1's
  already-published frame at this same seed and is not re-rendered.
licence_note: >-
  Clean and identical to rungs 1-4. Base cagliostrolab/animagine-xl-3.1
  (CreativeML Open RAIL++-M), control net xinsir/controlnet-scribble-sdxl-1.0
