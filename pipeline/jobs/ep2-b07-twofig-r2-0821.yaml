shared_scratch_dir_with_round_1: |
  RECORDED BECAUSE IT IS TRUE OF THE JOB THAT RAN, not as an excuse. This spec
  names C:\banyan-farm\b07twofig-0821 -- ROUND 1's box scratch directory --
  because the box dirtok is the id with the `ep2-` prefix and two dashes
  removed, so it does not contain the parent id and derive_spec's parent-id
  assertion cannot see it. The retoken pair was not supplied.

  WHY IT WAS LET RUN RATHER THAN RE-FILED: nothing is lost or confused by it.
  `--task` is ep2-b07-twofig-r2-0821, so the artifact is
  ep2-b07-twofig-r2-0821-ipahead.png and does not collide with round 1's; the
  publish destination is farm-out/ep2-b07-twofig-r2-0821 and is likewise
  distinct. The only files overwritten are prompt.txt and negative.txt inside
  the shared scratch dir, and round 1's copies of both are already published
  and committed at farm-out/ep2-b07-twofig-0821/. box_enqueue has no cancel,
  and deleting a queued json out from under a live runner to fix a cosmetic
  path is a worse trade than saying so here.

  THE DURABLE FIX IS IN THE SHARED HELPER: derive_spec.derive now detects a
  surviving parent dirtok and prints a loud warning naming the exact retoken
  pair to add. It warns rather than refuses on purpose -- derive_spec is used
  by every lane in a live worktree, and a new refusal would stop peers mid-run
  for a fault that is usually cosmetic. A round 3 will see the warning.
