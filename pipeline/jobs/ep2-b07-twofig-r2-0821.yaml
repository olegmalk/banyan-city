  perfect: exactly two figures; the guard five heads, armoured, helmeted, a head and a half taller; no
  adapter leak onto the guard; the mandarin collar and frog closure still on the goblin; both full body
  in tall grass. The named degenerate outcome is THE BANNED-ATTRIBUTE SWAP: `blank eyes, no pupils` and
  `round pupils` are both in the negative now, and a model squeezed between them can return a featureless
  eye. That is a FAIL, not a win on E1.'
why: 'BEAT 07''S ROUND-1 TWO-FIGURE PLATE FIXED THE STAGING AND MISSED THE EYES, AND THE EYE IS THE FOUNDER''S
  IMAGE.


  Round 1 was filed to answer whether a two-figure plate could exist at all, because the beat''s motion
  take proved a guard summoned by wording alone re-stages the shot and loses the goblin. It can: two figures,
  one ground line, the guard a genuine grown man at five heads per the founder''s 2026-08-20 ruling, and
  no IP-Adapter leak onto him. What came back wrong is one attribute of one character -- large round green
  eyes where canon has off-white eyes with narrow vertical slit pupils.


  THE FIRST EXPLANATION WAS TESTED AND DISCARDED BEFORE THIS WAS FILED. The suspicion was the IP mask:
  at the goblin''s stature in a two-figure frame the head box might have slipped onto his neck. Drawing
  87,485,412,763 on the round-1 output settles it -- the box holds the whole skull, both ears and the
  entire face. So the mask is correct and is held unchanged, and the lever is the wording that round 1
  cut to make room for the guard: the accepted SOLO canon plate for this beat says `slit pupils, constricted
  pupils`, and round 1 said only `slit pupils` -- in a prompt that now has a second subject competing
  for every attribute.


  WHAT THIS JOB DOES: round 1 with the eye clause restored and the observed defect banned by name. Same
  skeleton, same controlnet, same reference, same mask, same ip-scale, same seed.'
