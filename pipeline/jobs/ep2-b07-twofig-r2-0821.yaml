success: 'ONE 832x1216 png that clears round 1''s bar WITH G2, and the eyes are the whole question. E1
  the goblin''s eyes are off-white with NARROW VERTICAL SLIT PUPILS, read at 1:1 against taste/refs/goblin-canon-founder-0821.png
  -- not round, not a green iris, not blank; E2 with the eye fixed the face reads as the canon ADULT rather
