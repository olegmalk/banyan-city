bar: "JUDGED BY EYE AT 1:1, AND BOTH IDENTITIES ARE JUDGED, not just the goblin.\n\n  G1  TWO FIGURES,\
  \ EXACTLY TWO, both whole and both standing on the same\n      ground. Not one figure with a shadow,\
  \ not three.\n  G2  THE GOBLIN IS THE FOUNDER'S GOBLIN. Read against\n      taste/refs/goblin-canon-founder-0821.png:\
  \ green skin, bald, large\n      pointed ears, off-white eyes with narrow vertical slit pupils, eyebags,\n\
  \      mandarin-collar sage shirt, dark shorts, boots. The IP-Adapter is masked\n      to his head box\
  \ alone, so a face that has drifted is a mask failure and\n      the box is the fix.\n  G3  THE GUARD\
  \ IS A GROWN MAN. The founder's 2026-08-20 ruling is \"they\n      should look like grown men. yes.\
  \ dumb grown men\". Five heads tall,\n      armoured, helmeted, a full head-and-then-some over the goblin.\
  \ A chibi\n      guard, a second goblin, or a guard the goblin's size is a FAIL.\n  G4  THE GUARD'S\
  \ FACE IS NOT THE GOBLIN'S. He gets no adapter; if the\n      founder's face has leaked onto him the\
  \ mask leaked and G2's box is wrong.\n  G5  THE ARM IS MID-RAISE AND AIMED AT THE GOBLIN. Not down at\
  \ his side, not\n      already fully extended. The beat needs travel left to do.\n  G6  STAGING SURVIVES:\
  \ goblin at left, guard at right, both full body, tall\n      grass, the plate's own dialect and palette.\n\
  \nG1, G3 and G4 are killing bars -- they are the whole reason this plate exists\ninstead of a reworded\
  \ motion prompt. G5 is a strong preference: a completed\npoint is what froze beat 20's take, and it\
  \ is worth one more round. Two rounds\nis the budget."
failure_predicted_in_advance: 'THE BANNED-ATTRIBUTE SWAP, and it is why E1 is written as three exclusions
  rather than one inclusion. The negative now carries `blank eyes, no pupils` AND `round pupils, big round
  eyes`; a model that cannot satisfy both may return a featureless or a solid-dark eye, which would score
  as ''not round'' while being just as far from canon. SECOND: the eye terms are worth 5 tokens and they
  were paid for out of the guard''s half of a 77-token budget -- if the guard degrades (loses the helmet,
  drops below five heads) the budget is the cause and the answer is a longer-context checkpoint, not a
  sixth wording.'
hypothesis_tested_and_discarded_before_filing: 'THE IP MASK, and it cost one composite instead of a round
  of GPU. The first explanation for a drifting face on a two-figure plate is a mask that no longer sits
  on the head -- the box was derived at the goblin''s stature 0.53 and the canon head_box() assumes 0.90,
  so a slip was plausible enough to act on. It was DRAWN ON THE ROUND-1 OUTPUT instead: 87,485,412,763
  contains the whole skull, both ears and the entire face, with a little slack at the collar and nothing
  missing at the crown. The mask is therefore held. This is recorded because a wrong hypothesis that was
  checked is worth more to the next lane than a right one that was guessed.'
not_done_on_purpose: 'G5 IS NOT ADDRESSED. Round 1''s arm reads closer to fully extended than to the authored
  mid-raise, and the hand sits above the goblin''s skull rather than at his face. That is a SKELETON change
  -- ARM_ELB / ARM_WRI in pipeline/author_b07_twofig_skel_0821.py -- and it would be a second variable
  in a round whose whole question is the eye. It is also marginal rather than failing: an over-extended
  point still gives the motion model somewhere to travel from, where a MISSING guard gave it nothing.
  If the eye lands and G5 still bothers the founder, it is one skeleton edit and a third round. ALSO NOT
  DONE: no motion is rendered or filed by this job.'
the_one_variable: 'THE EYE CLAUSE, on both sides of the prompt. POSITIVE gains `white eyes` and `constricted
  pupils`; NEGATIVE gains `round pupils` and `big round eyes`. Room is bought by dropping `muted color`,
  `best quality` and `boots` from the positive and `watermark`, `wrinkled skin` and `eyepatch` from the
  negative -- none of them describes an eye, and round 1 shows none was load-bearing: the palette, the
  render quality and the boots all came back correct, and not one of the three dropped negatives fired.
  HELD, UNCHANGED AND ON PURPOSE: the two-figure skeleton jerry-guard-twofig-0821.png at the same sha,
  xinsir/controlnet-openpose-sdxl-1.0 at scale 1.0, the square reference jerry-canon-sq45-0821.png, the
  IP mask 87,485,412,763, ip-scale 1.0, ip-adapter-plus-face_sdxl_vit-h, and seed 20260899.'
