# EPISODE 2, BEAT 17 — IS HE THE SAME GOBLIN IN A BEAT HE WAS NOT TUNED ON? $0.
# 2026-08-12, character-consistency lane, under his consistency mandate
# (`ep2-consistency-mandate-0812`).
#
# ── THIS IS HIS ACTUAL COMPLAINT. Everything so far measured ONE beat across four
# seeds. He did not say the goblin changes between seeds, he said "these characters
# change too much through beats". Sixteen cells of beat 02 cannot answer that. A
# second beat, drawn from the same reference bytes, can.
#
# ── WHAT THE LADDER SETTLED, AND WHAT IS FROZEN BECAUSE OF IT. A reference transfers
# what it contains: head crops held his face and let his clothes change every seed;
# crops reaching the coat hem put the same coat on him in 4 of 4 AND kept the face
# at a readable size; the whole figure added trousers and boots. The two rungs that
# worked are both here — r0/r1 the coat hem, r2/r3 the whole figure — because the
# rows are independent arms, so this asks the cross-beat question of both at once
# and costs nothing extra to do it.
#
# ── THE CROP FAULT THE LADDER EXPOSED IS FIXED IN THESE REFS. The wider rungs drew
# EXTRA small goblins in 3 of 8 cells: the source is a sheet, so a crop wide enough
# to hold the coat also held fragments of the neighbouring head views in its corners.
# Painted rectangles kept missing ear tips, so the reference is now cut by
# CONNECTIVITY — the one connected blob of ink containing the standing figure is
# kept and every other mark on the page is whited out. Nothing of him can be lost
# that way: head, sleeves and boots are one drawing.
#
# ── TWO THINGS CHANGED SINCE THE LAST GOBLIN ROUND AND BOTH ARE NAMED. The beat is
# new (that is the question), and the harness now sends his frozen definition
# `green skin, bald head` instead of `green skin, tusks` (commit 472909d0, his
# ruling, not mine). So the tusk contest that the reference lost 13 times out of 16
# is not in this round at all — the prompt and the reference finally agree, and if
# tusks still appear they came from the model rather than from us.
#
# ── HONEST PRIOR. Costume should hold, because it held 4/4 on a beat this reference
# had never seen either. Where I expect trouble is beat 17's own staging pulling the
# framing away from a standing figure, and the face at whole-figure scale: the
# encoder sees 224 pixels, and a full body spends most of them on a coat.
#
# ── NOT A PICK, NOT CANON. Provisional under his delegated evaluation grant.
#
# $0 — local GPU on the rtx5090, no provider, nothing published, nothing assembled.
