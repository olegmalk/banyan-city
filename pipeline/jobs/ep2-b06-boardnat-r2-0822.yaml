script_line: 'Beat 06 THE CLIPBOARD: the guard turns the bark board over and reads it. The board''s SIZE
  is the beat''s standing fault, so it is authored in pixels -- 240 px against a 220 px shoulder floor
  -- rather than described.'
bar: "JUDGED BY EYE AT 1:1. THE OBJECT IS THE QUESTION, THE MAN IS THE CONTROL.\n\n  P1  THE SLAB IS DRAWN,\
  \ NOT PASTED. It carries cel shading and the plate's own\n      ink line weight; the compositor's flat\
  \ two-value fill, its ruled grain\n      and its hard cut edge are gone. It should read as a piece of\
  \ BARK -- a\n      rough, fibrous, slightly warped natural surface -- and not as a plank of\n      milled\
  \ timber and not as a card.\n  P2  IT HAS NOT MOVED AND IT HAS NOT SHRUNK. The board's width is this\
  \ beat's\n      entire standing fault (\"the bark board is the wrong size\"), it was\n      authored\
  \ at 240 px against a 220 px shoulder floor, and if 0.30 has\n      narrowed it or slid it off the hands\
  \ this plate is a FAIL and the number\n      is the fix.\n  P3  HE IS HOLDING IT. His hands stay at\
  \ its bottom edge and his head stays\n      bowed over it. Hands dropped to his sides is what r2 and\
  \ r3 both did and\n      it is a FAIL here.\n  P4  THE MAN SURVIVES UNCHANGED. Dark cropped hair, round\
  \ wire-rim glasses, an\n      adult, the cream shirt and the sash. The mask covers his chest, so this\n\
  \      is the clause most at risk and it is a killing one.\n  P5  IT IS NOT GLOWING. Three rungs on\
  \ this beat returned a lit panel or a\n      luminous ball; the composite is deliberately darker than\
  \ the local mean\n      and the pass must not brighten it back.\n  P6  NOTHING GOBLIN, and no second\
  \ board.\n\nA FAIL on P2 or P4 kills the plate. A FAIL on P1 alone is a strength question\nand is worth\
  \ one more round. If it passes, the next rung is MOTION -- and the\nbeat's other fault, 4.5 s of frozen\
  \ frame in a 6.5 s slot, is a motion question\nthat could never be asked while the object was missing.\n\
  \nROUND 2 ADDS ONE CLAUSE AND IT CUTS BOTH WAYS. At 0.45 the pass runs 18 of 40\nsteps instead of 12,\
  \ which is more licence to redraw AND more licence to move.\nSo P2 stops being a formality: if the board\
  \ is a beautiful piece of bark that\nhas slid, narrowed or turned into a scroll, round 1 is the better\
  \ plate and the\nanswer is that this object wants a strength between the two. Say which of the\ntwo\
  \ frames is better rather than scoring this one alone."
failure_predicted_in_advance: 'THREE. FIRST, THE PANEL: the board comes back luminous and the figure darkens
  behind it, which is r3 exactly and would mean the reading is in the MODEL''s prior for a bright rectangle
  at chest height rather than in the scribble net. That would be a real finding and it is why the composite
  is drawn deliberately darker than the local mean. SECOND, THE HANDS: the mask''s pad-crop is 64 px and
  the fingers sit immediately under the board''s bottom edge, so this pass can reach them; deformed hands
  is in the negative and P4 is a killing clause. THIRD, THE CARD: 0.30 leaves the slab exactly as flat
  as it was drawn, which would say the pass needs more strength on a hard-edged man-made object than it
  needs on a leaf -- and that is worth one more round rather than a redraw.'
init_provenance: farm-out/ep2-b06-boardcomp-0822/b06-boardcomp-in-0822.png, 832x1216, sha256 055a3870a4ce0874107352bf1ded76c21c68cd04baadc77532916e964a18f325,
  with its mask b06-boardcomp-in-mask-0822.png sha256 d531f94436d1d8864181f9d168160bb7b4f81fa6df6cba7c07dac15b7a275884.
  Both are committed on origin/main; fetch_init.py pulls them by raw URL and refuses on any sha mismatch.
  The plate under the composite is farm-out/ep2-b06-pose-r4-0822/ep2-b06-pose-r4-0822-posebooth.png, an
  openpose-only rung with NO reference image and NO board net, and the slab's geometry -- board box, hands
  box, chin line, shoulder floor, measured ink and light -- is in the .geometry.json beside the composite.
not_done_on_purpose: NO MOTION IS RENDERED AND NO MOTION SPEC IS FILED. Beat 06's second fault is that
  4.5 s of its 6.5 s slot is one frozen frame, and that is a motion question that has never been askable
  because the object was missing from every plate. It becomes askable the moment this plate passes, and
  not before -- filing it now would assert the plate passed before anyone looked at it.
the_one_variable: 'THE INIT. Every sampler number is the b16 rung''s by copy through derive_ep2_sapnat_0821
  and derive_ep2_sapnat2_0822: 40 steps, cfg 7.5, strength 0.30, pad-crop 64, blur 8, seed 20260820, the
  whole inpaint_fruit.py payload, the env block, the needs, the dry-run-before-any-model gate and the
  no-glob publish. The prompt and negative change because the object is a board and not a plant, and the
  negative additionally STOPS banning `1boy`/`man`/`person`: the sibling deriver bans them because its
