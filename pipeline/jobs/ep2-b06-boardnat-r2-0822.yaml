owner: morning compositor lane, 2026-08-22
consumer: 'THE INIT FOR BEAT 06''s FIRST MOTION RENDER. This beat has ZERO clips and two named faults,
  and the second one -- 4.5 s of frozen frame in a 6.5 s slot -- has never been askable, because the object
  the beat is about was not in any plate. Named consumer: this lane''s b06 motion rung, filed only after
  a human opens this png. No cut changes because this landed.'
success: 'ONE 832x1216 png in which the bark slab READS AS BARK, has not moved, has not narrowed, is still
  held in both hands with the head bowed over it, is NOT glowing, and in which the man is unchanged --
  dark cropped hair, round wire-rim glasses, an adult in a cream shirt in a daylit field. The named degenerate
  outcome is the one three ControlNet rungs already produced: the board comes back as a LIT PANEL and
  the figure goes dark behind it.'
why: 'BEAT 06''S OBJECT IS NOW DRAWN AND THIS SETTLES IT INTO THE PICTURE.


  The board is not a ControlNet problem and that is measured, not argued: three rungs on 2026-08-22 bracketed
  --scale2 twice and the drawn rectangle''s position twice, and returned, in order, no object at all with
  a glowing ball in the cupped hands; a plank grown DOWNWARD out of the hint''s top edge, standing in
  front of him like a post; and a lit white panel over his chest with the figure collapsed into a dark
  shrouded shape behind it. The ladder rule closes at three, and the reading across them is the beat-08
  finding in a different costume -- this class of net renders a white stroke as LIGHT.


  So ep2-b06-pose-r4-0822 removed the board net and rendered only the man, in daylight, with his hands
  together and EMPTY at chest height. pipeline/beat06_board_composite.py drew the slab into those hands
  at a width authored in pixels -- which is the one thing no wording round has ever controlled and which
  IS this beat''s fault. This job runs the proven 0.30 masked i2i over the drawn region only, so the slab
  comes back in the plate''s dialect instead of on top of it.


  The route''s evidence: four plant composites (beats 03, 13, 16 and 19) and, from last night, the fact
  that a hand-drawn composited object SURVIVES i2v motion -- the fig in beat 19 came off its stem and
  fell. That was the missing evidence under this whole route and it is why the board is worth drawing
  rather than asking for a fifth time.'
