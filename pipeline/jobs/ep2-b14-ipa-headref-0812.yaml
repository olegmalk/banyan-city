# EPISODE 2, BEAT 14 — MATCH THE REFERENCE TO THE SHOT SIZE. $0.
# 2026-08-12, character-consistency lane. One variable: what the reference contains.
#
# ── TWO BEATS FAILED IN OPPOSITE DIRECTIONS AND TOGETHER THEY NAME THE RULE. On the
# whole-figure reference, beat 03 held the creature 8 of 8 and LOST ITS STAGING — the
# draft asks him to crouch behind a sapling and every frame is a neutral standing
# figure. Beat 14 did the reverse: it kept its own intimate low close-up and LOST THE
# CREATURE — dark teal, round pink eyes, no pointed ears, no coat, nothing of the
# reference in it.
#
# ── WHY THAT IS ONE FINDING AND NOT TWO FAILURES. A reference transfers what it
# contains, and a whole-figure crop contains a face about twenty pixels across. Ask it
# for a close-up and there is no face in it to transfer; ask a standing pose to crouch
# and the pose it does contain wins. So the rule is MATCH THE REFERENCE SCOPE TO THE
# BEAT'S SHOT SIZE, and this job tests exactly that on the beat that failed hardest.
#
# ── THE REFERENCE IS ROUND 1'S OWN HEAD CROP, BYTE-IDENTICAL, in all four slots
# (sha256 a1d9b5c9…). Not a new crop, so there is no new crop decision to argue about:
# it is the picture that held the FACE at ~3/4 in the very first conditioning round.
# Everything else is held at the failing round's values — same beat, arm, window,
# scale, seeds.
#
# ── AND THE BEAT PASS IS STOPPED UNTIL THIS ANSWERS. Beats 4, 8, 13, 15, 19 and 20
# are written and dry-run and deliberately NOT fired. Six more beats on a reference
# that is right for wide shots and wrong for close-ups is the K-recipe mistake with a
# different noun, and my own metric agreeing with me is not a sample.
#
# ── NOT A PICK, NOT CANON. Provisional under his delegated evaluation grant.
#
# $0 — local GPU on the rtx5090, no provider, nothing published, nothing assembled.
