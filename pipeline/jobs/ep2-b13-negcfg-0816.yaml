# 2026-08-16, negative-vs-CFG lane. Beat 13, THE SHADE. THE TWO SAMPLES THAT
# RESOLVE WHAT 68dbe136 LEFT OPEN, plus the matched control, ALL IN ONE JOB.
# Generated, not hand-typed: the plate path, the plate sha, cover_crop.py's
# source, the positive prompt, the full negative, the seed and every recipe flag
# are READ OUT OF pipeline/jobs/ep2-b13-guidance-0815.yaml and asserted (the
# generator's assertion output is quoted in section 7).
#
# 1. THE SCRIPT LINE, quoted from genomes/sapling/nodes/002b-first-citizen/node.md:
#
#      **THE SHADE -- 1:00-1:04**
#      "The scavenger slides down the trunk and folds into the sapling's tiny
#       shade, knees up around his ears."
#
# 2. WHERE THIS LANE IS. Beat 13's control HOLDS: 32 distinct pictures across 97
#    frames, effective 8 fps, period 3, depth 0.038. Eliminated by measurement,
#    and NOT re-derived here:
#      * WORDING -- five wordings, three seeds.
#      * THE INIT PLATE AS AN ONSET LEVER -- 9/10 clips onset inside 0.25s.
#      * THE 13-LATENT COUNT -- (97-1)//8+1 = 13 is correct, and the latent grid
#        is period-8 while we measure period-3 (dfa87c27).
#      * THE VAE/DECODE SIDE -- tiling ON vs OFF differed by 0.4 dB and nothing
#        else, with a `--hold 3` positive control proving the harness could see
#        a hold if one were there (70e3c79a).
#      * STG at upstream's recommended stg_scale 1.0 / blocks [28] -- period
#        3 -> 3, 32.0 -> 32.0 pictures, 8.0 -> 8.0 fps (369e4101).
#      * THE 200-WORD PROMPT CEILING -- the premise was simply wrong. Beat 13's
#        control prompt is 37 words / 58 Gemma tokens on the real tokenizer, and
#        no beat-13 render has ever exceeded 216 words (68dbe136).
#
#    TWO levers have moved it, both in 68dbe136, and they are the reason this
#    job exists:
#
#      arm                      period  pictures  eff.fps  depth
#      control (guidance 2.0)      3      32.0      8.0    0.038
#      guidance 1.0                2      48.0     12.0    0.035
#      9px motion-blurred init     2      48.0     12.0    0.041
#
#    Two interventions with nothing mechanically in common, landing on EXACTLY
#    the same three numbers, neither reaching period 1, all three arms holding
#    at the same depth.
#
# 3. WHAT IS AMBIGUOUS, AND WHY EACH ARM IS THE MINIMUM TEST OF IT.
#
#    ARM B -- guidance 2.0, EMPTY negative. THE DECISIVE ONE. The guidance-1.0
#    sample changed TWO things at once and cannot separate them:
#    `do_classifier_free_guidance` is `(guidance_scale > 1.0)`, so at 1.0 there
#    is no uncond pass and THE NEGATIVE IS NEVER READ. ltx_i2v.py documents this
#    itself at `common = dict(...)`. You cannot have CFG 1.0 and a live
#    negative -- but you CAN have CFG 2.0 and no negative, which is this arm.
#    CFG strength is held at the control's 2.0; the uncond pass still runs; only
#    the negative's CONTENT is removed. That content is:
#
#      "camera pan, camera tilt, zoom, dolly, push in, pull back, tripod, cut to
#       another shot, scene change, different location, split screen, still
#       image, freeze frame"
#
#    Eleven of those thirteen clauses forbid MOVEMENT of some kind. A negative
#    that costs more motion than it buys is a live hypothesis, and if it is the
#    lever then the fix is far cheaper than turning CFG off: prompt adherence
#    survives, the uncond pass survives, and only the wording changes.
#    MECHANICS, verified on the box rather than assumed: diffusers 0.39.0's
#    LTX2 encode_prompt runs `negative_prompt = negative_prompt or ""`, so an
#    empty negative file is EXACTLY the canonical unconditional embedding --
#    the same thing upstream does when no negative is given at all.
#
#    ARM C -- guidance 1.5, FULL negative. The obvious untested midpoint, and
#    the negative stays alive because 1.5 > 1.0. This is the test of the
#    period-2 FLOOR hypothesis, which 68dbe136 raised explicitly as unproven
#    from two samples: if period 2 / 48.0 pictures is a floor of this recipe,
#    1.5 must land on 48.0 exactly. Anything strictly between 32.0 and 48.0
#    falsifies the floor and says the relationship is continuous.
#
# 4. THE BAR, WRITTEN BEFORE THE FRAMES ARE LOOKED AT.
#      control              period 3 | strength 0.923 | DEPTH 0.038 | 32.0
#                           pictures | 8.0 eff. fps | no terminal freeze
#                           (last change at frame 96 of 96)
#      ARM B period 2 / 48.0  => the lever is THE NEGATIVE'S CONTENT
#      ARM B period 3 / 32.0  => the lever is CFG STRENGTH
#      ARM C exactly 48.0     => period 2 is a floor of this recipe
#      ARM C strictly between => it is not a floor; the relationship is continuous
#    Depth travels with every number because the metric is SCALE-FREE and reads
#    a +-3% ripple like a freeze. Reference depths: b13 0.038, STG arm 0.059,
#    b06-DONE 0.181, b02-FIXED 0.431, a clean VAE round trip 0.971.
#
# 5. THE TERMINAL FREEZE IS SCORED SEPARATELY AND MUST NOT BE CONFLATED WITH THE
#    HOLD. Two bark clips on beats 06 and 10 are BIT-IDENTICAL from frame 62 to
#    96 (consecutive-frame ncc 1.0000). Beat 13 has the hold and no wall. Two
#    phenomena, two numbers, and an arm whose period improves while the clip
#    dies at f62 is a PARTIAL result reported as one.
#
# 6. WHAT WILL NOT BE CLAIMED. Camera-scale estimates by chained NCC are
#    currently UNRELIABLE on this bench: a lane showed the method rails to its
#    search boundary when the fits fail, and gating it more strictly just
#    samples frozen tails and reports 1.000x for the wrong reason. What is exact
#    is consecutive-frame ncc = 1.0000. If this lane claims the camera moved it
#    will say how that was established and name the method's limits. Apparent
#    movement is never settled by eyeballing a contact sheet -- a lane made that
#    exact error twice on this beat and the second time it reached a committed
#    spec.
#
# 7. HOW THE THREE ARMS ARE KEPT MATCHED, AND THE GENERATOR'S OWN PROOF.
#    ONE crop from an asserted plate sha. ONE ENCODER PROCESS writing both .pt
#    files (Gemma loads once; `--jobs` carries two entries with the same
#    prompt_file and different negative_file), so "identical positive
#    conditioning" is a property of one process rather than an assumption about
#    Gemma's determinism across runs. Step `verify-embeds` then PROVES it: it
#    hashes the raw tensor bytes of both files and REFUSES unless
#    prompt_embeds/prompt_attention_mask are byte-identical AND
#    negative_prompt_embeds/negative_prompt_attention_mask differ. One seed
#    (20260815). All three renders in one job. The three render steps are built
#    from a SINGLE argv function whose only recipe parameter is guidance, and
#    the generator asserts:
#
#      control vs empty-neg : recipe flags differing = NONE (only --jobs, which
#                             is plumbing -- the variable lives entirely inside
#                             the embeds file, and verify-embeds bounds it to
#                             the negative half)
#      control vs cfg 1.5   : recipe flags differing = ['--guidance']
#      control vs ep2-b13-guidance-0815's render-control :
#                             IDENTICAL modulo plumbing
#
#    Recipe, unchanged and NOT under test: 704x1280, 97 frames, 24fps, two-stage
#    8@352x640 + 3@704x1280, distilled sigmas, image-crf 33, sequential offload,
#    STG unpassed on all three arms.
#
# 8. NO RENDERER CODE IS TOUCHED. `--guidance` is a long-standing flag and the
#    empty negative is a payload FILE, so this job yaml is the entire diff. The
#    control doubles as the harness check: four independent jobs across three
#    nights have returned clip sha256 42043851da4b246cfcd4e858cda828da992d0d48f
#    15ef10d81d3a99c1ceb445a and init sha256 210932b760f70ef34b97f41a28d1905ef5
#    358e5f6982110c3f2440884b8b5199. A FIFTH non-matching control INVALIDATES
#    THIS JOB and gets reported as such rather than explained away.
#
# 9. THIS IS TWO SAMPLES AND NOTHING SCALES OFF THEM. In every arm measured so
#    far NEITHER FIGURE ROCKS -- the prompt asks him to rock slowly forward and
#    back and he holds the same folded pose across the clip. The previous lane's
#    line is the standard: 48 pictures of the wrong thing is not a better beat
#    than 32. On 2026-08-03 a recipe was picked on a steward's own metric,
#    rendered across all fifteen beats, and came back "literally just frozen
#    frames".
