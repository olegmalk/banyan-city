# EPISODE 2, BEAT 05 — THE REGISTER, STAGED INSTEAD OF ASSERTED. $0.
# 2026-08-12, stills lane, on his direction: "chase silly via pose and expression
# staging."
#
# ── WHAT HE CLOSED. Five rounds put the register in the positive prompt as adjectives
# — `silly harmless bureaucrats`, `round soft bodies`, `harmless and bureaucratic` —
# and five rounds drew solemn men, 0 of 4 every time, bald and haired alike
# (ep2-b05-guards-silly-0811, ep2-guards-sheet-0812, charref-guards r3/r4/r5,
# ep2-b06-ipa-guardcast-0812-observed). The prior-confirmation law says a reference can
# confirm this model's prior for a `guard man` and cannot overturn it; five rounds now
# say an adjective cannot either. So the words stop arguing.
#
# ── WHAT THIS SPENDS THE TOKENS ON INSTEAD. What the two men are DOING, and what their
# faces are doing while they do it. Nothing in the positive describes a body. The cast
# facts from the references he accepted are untouched: short hair, plain brown tunic,
# bark clipboard, visible faces.
#
# ── `round` LEAVES THE PROMPT, AND THAT IS DECLARED. It is HIS word ("two silly round
# bureaucrats with visible faces", 2026-08-11 ~20:27). Removing a founder's own word is
# the move that must never happen quietly, so: it is not a rejection of the register,
# it is the direction's content — the tone stops being asserted and starts being
# staged. Ledger `ep2-guards-register-verdict-0812` carries the full reasoning and what
# a failure here would mean (the choice becomes his: accept the men this model draws,
# or change the checkpoint).
#
# ── WHY BEAT 05 AND NOT 06. Beat 06 is one man and a clipboard close-up. Beat 05 is the
# only guard beat whose script stages BOTH men in motion — "two guards jog into an empty
# morning field and stop to scan it" — and a pair is where a register lives: the comedy
# is one man's posture against the other's. The staging is the beat played straight, not
# a gag invented for it. The joke is put in the STOP: one overshoots, the other never
# looks up from the clipboard.
#
# ── THE ONE NEGATIVE ADDED, WITH ITS PRECEDENT. `no standing at attention`. The failure
# mode across all five rounds is literally two men standing side by side at attention.
# On beat 03 the crouch came back only when the pose was promoted to the dominant clause
# AND the standing pose was banned (ep2-b03-crouch-0812-scored) — dominant clause plus
# ban is the proven pair, so both halves are here.
#
# ── FRAMING. The beat is wide and the references are full-body turnarounds, so the crop
# and the shot agree for once; no crop ladder is needed to find out.
#
# ── MEASURED, NOT GUESSED. The first wording ran 83/77 on the box and compress() dropped
# the entire trailing sentence — camera, light and style anchor — and the dry gate
# refused it. Trimmed and re-measured: positive 72/77, style anchor present, count tag
# 2boys, DRY OK, no faults.
#
# ── THE REFERENCES ARE ACCEPTED; THESE FRAMES ARE NOT. $0, local GPU, nothing published,
# shots.md untouched. Provisional — his veto stands.
