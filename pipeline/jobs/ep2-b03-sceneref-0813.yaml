success: 'Sixteen PNGs. The question is whether the world SURVIVES at 15%: grass, treeline and sky present,
  as they are in the reference, while the costume and skin come back closer to the frozen facts than the
  10% frames did. That result would mean scene-carrying references are the fix and the whole wave can
  be rebuilt this way at no cost to consistency. If the world vanishes and the plate returns to white,
  the reference does not carry background through the adapter at all, and the only remaining route is
  the 10% window with its identity bill -- which is a founder tradeoff, not a steward one.'
why: 'THE FOUNDER, verbatim: "why arent you putting the background in the reference itself?" This does
  exactly that. ep2-b03-scene-wedge-0813 settled that the WINDOW is the variable: at the standard 15%
  the reference owns the early structure-forming steps and every plate came back a standing figure on
  white; at 10% the same words drew the beat''s whole world -- tall grass, a treeline, blue sky -- and
  the crouch with it. But 10% also drifted the costume off the patched hooded coat and the skin toward
  yellow, which is the identity he has spent days demanding. So the knob works and charges for it. This
  run keeps the identity-preserving 15% window and changes the REFERENCE instead: the four 10% frames,
  which already contain the scene, are staged as refs-goblin-scene-0813 and conditioned at w015. Same
  draft, same arm, same seeds as the white control -- the reference is the only variable.'
