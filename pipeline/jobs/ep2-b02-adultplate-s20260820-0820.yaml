bar:
  p1_he_is_the_ratified_adult: 'THE CLAUSE THE JOB EXISTS FOR. Read at 1:1 against picture B on /review/ep2-goblin-design-0819
    and against beats 07, 14, 17 and 19 of the ship cut: lean, angular, five and a half to six heads tall,
    green skin, bald, long pointed ears. NOT the round child of picture C -- no four-head proportion,
    no oversized dome, no pink cheek patches, no child stance. A tile that is arguable is a NO; the whole
    point of the sheet is that some tiles will not be arguable.'
  p2_he_is_running: 'The pose reads as a sprint at 1:1: weight forward, one leg driving, not a standing
    figure with motion lines. Beat 02''s whole content is the dive, and an i2v init that shows him standing
    gives the motion recipe nowhere to go. Second in rank behind P1 and ahead of P3.'
  p3_the_sapling_is_tiny_and_in_frame: 'One thin stem with two leaves, rooted, and SHORTER THAN HE IS
    -- the founder''s standing ruling that the sapling is tiny, which beat 13''s shipped take broke by
    growing a mature forked tree. Nice to have on a plate, not fatal: the motion job can be conditioned
    on a tile that has him and no plant, and beat 03 already carries the size mismatch.'
  p4_wide_enough_for_a_dive: Full body in frame with grass around him, not a bust and not a close-up.
    The script says "Camera wide so the dive reads" and a cropped plate cannot be widened by a motion
    prompt.
  p5_one_figure: Exactly one creature. No second goblin, no guard, no human. The b08 lane has burned eleven
    rungs on `green skin` landing on two bodies out of one pooled embedding, and that failure is cheap
    to detect here and expensive to detect after a motion render.
failure_predicted_in_advance: P-THE-SAPLING-EATS-THE-ADJECTIVES. This prompt asks for a LEAN ADULT and
  a TINY PLANT in one pooled embedding, and this model's documented habit in this repo is to move size
  words onto the subject. If it fires -- adult wording, child result, on tiles that drew the sapling and
  not on tiles that did not -- the next rung is to drop the plant from the plate entirely and let the
  motion job's field carry it, NOT a seventh wording of the identity string.
how_to_judge_this_in_the_morning: Tile all six into one contact sheet next to picture B and picture C
  from /review/ep2-goblin-design-0819, and answer P1 off the sheet in one line per tile. Only the P1 survivors
  get read for P2-P5. If no tile passes P1, the finding is that the canon wording alone does not carry
  this pose and the next rung is an adult reference set -- which does not exist yet and would have to
  be cut.
init_provenance: 'NONE, and that is the design. No IPA, no reference image, no control hint: this is txt2img
  from the canon string quoted verbatim out of pipeline/canon.yaml. Every existing b02 plate descends
  from refs-goblin-approved-0814, which is the round child set, and the only adult-leaning refs on the
  box (refs-goblin-d1std-0815) measure themselves at 4.5-5 heads and would reproduce the defect. Text
  is the route that has actually drawn this character.'
not_done_on_purpose: NO MOTION JOB IS FILED AGAINST THESE. A plate nobody has looked at is not an approved
  result, and firing beat 02's motion recipe on an unseen tile is the exact thing ONE SAMPLE BEFORE ANY
  BATCH exists to stop. No edit to plate_scratch.py, wave-drafts.yaml or the canon identity string --
  the string is quoted, not revised. No touch to beats 08 or 13, which peer lanes own tonight.
pre_registered_fail_modes: P-THE-CHILD-COMES-BACK -- the model resolves `goblin` to the round young one
  regardless of `lean wiry adult`, which is the read the whole 08-13 to 08-15 ladder was fighting when
  it had no `child` in its negative. Named as most likely on the tiles that also carry `tiny`. P-THE-SAPLING-EATS-THE-ADJECTIVES
  -- `tiny two-leaf sapling` sits four clauses after `lean wiry adult` and SDXL pools the whole string;
  `tiny` landing on HIM instead of the plant is the specific mechanism that made `a small goblin` read
  as a child in the first place (the 08-13 diagnosis, which the goblin-design page calls probably still
  right). P-TWO-FIGURES -- `green skin` on two bodies, the b08 lane's standing defect. P-NO-SPRINT --
  he stands still in tall grass and the pose clause is ignored, which is P2 and is survivable only if
  some tile does run. P-CROPPED -- the figure fills the frame and the dive has nowhere to happen.
the_one_variable_and_the_three_inert_flags: The arm, from `hintskel` to `nocontrol`. `controlnet_plate.py`
  line 488 reads `use_cn = a.arm != "nocontrol"`, and `--control`, `--control-sha256` and `--scale` are
  read only inside `if use_cn:` (lines 592-608). They are therefore left BYTE-IDENTICAL to the parent's
  rather than edited out -- an edit would be a second difference between this job and a recipe that has
  run clean, and the honest record is that they are present and never read. The prompt, the negative,
  the beat and the seed are the job's own; the model, the sampler, the size, the steps and the cfg are
  the parent's.
