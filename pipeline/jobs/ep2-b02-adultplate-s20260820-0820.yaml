  02 motion job on the proven `anchor` recipe -- and through that, beat 02''s slot in review/ep2-ship-0821,
  which today opens the episode on the wrong creature. Nothing consumes a single one of these tiles on
  its own: the sheet is the artifact and the pick is a person''s.'
success: 'One 832x1216 SDXL plate, seed 20260820, of the founder-ratified lean wiry adult goblin sprinting
  through a morning field, drawn from the canon wording and NO reference image. It lands as one tile of
  a six-seed sheet and is scored against the five clauses in `bar`, in rank order: he is the adult, he
  is running, the sapling is tiny, the framing is wide, there is one figure. A tile that fails P1 is discarded
  whatever else it does, because P1 is the founder''s complaint and the other four are craft.'
why: $0, ~2 minutes, zero dependencies, and it is the ONLY missing input for the one goblin beat in this
  episode that has never had an adult plate drawn for it. The card measured 0 ready / 0 running / 0 backlog
  at 20:57 -- the same empty-box window that wasted last night -- and this needs no session alive to run.
