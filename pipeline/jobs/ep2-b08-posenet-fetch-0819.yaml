# BEAT 08 RUNG B, STEP 1 OF 2 -- FETCH THE POSE-CLASS CONTROLNET. NO RENDER.
#
# ============================================================================
# WHY THIS IS ITS OWN JOB AND NOT THE FIRST STEP OF THE SAMPLE
# ============================================================================
# `b08-arm-route-0819.md` §10 closed hand-authored geometry as a composition
# lever ON THE NET WE HAVE, and it closed it for a reason that names its own
# remedy: `xinsir/controlnet-scribble-sdxl-1.0` is a SCRIBBLE net, and scribble
# conditioning means one thing -- THESE LINES ARE LINES IN THE PICTURE. A closed
# contour is interpretable that way, which is why rungs 1, 2 and 4 held the
# staging and traced the silhouette, and why a THINNER stroke bound TIGHTER. A
# medial-axis skeleton is not a boundary, so rung 5's frame DREW the skeleton as
# glowing scene objects (guard spine column luma 212.3 against a 165.4 surround)
# and lost every composition clause. Three axes are fully bracketed: any hint
# this net can read is a hint it traces, and any hint it cannot read it ignores
# or draws.
#
# A pose skeleton is the right INSTRUCTION and the wrong NET. §10 therefore
# ruled the next instrument a different net, and ruled it a research question
# first, per the research-before-solving directive. THAT RESEARCH IS IN:
# `pipeline/research/openpose-controlnet-sdxl-0819.md`, graded DEMONSTRATED /
# MAINTAINER / FOLKLORE line by line, and it answers all four of §10's
# questions:
#
#   - Does an SDXL-compatible openpose ControlNet exist? YES --
#     xinsir/controlnet-openpose-sdxl-1.0, apache-2.0 on both the front matter
#     and the body, config.json field-for-field identical to the scribble net's
#     (cross_attention_dim 2048, block_out_channels [320,640,1280],
#     addition_embed_type text_time) and therefore loadable against
#     animagine-xl-3.1 for the same reason scribble is.
#   - Licence? apache-2.0 with NO attribution condition. thibaud's openpose SDXL
#     was REJECTED on licence, not size: its card reads, in full, "License:
#     refers to the OpenPose's one", and CMU OpenPose upstream is
#     academic/non-commercial -- the same defect B01-R9-PLAN.md §9 already flags
#     on lllyasviel/Annotators, except at the WEIGHTS level where it would
#     attach to every frame ever rendered. xinsir/controlnet-union-sdxl-1.0 was
#     rejected on a version wall: it needs ControlNetUnionModel and the box runs
#     diffusers 0.29.2.
#   - Is the preprocessor the Annotators landmine? NOT NEEDED AT ALL. §2 of that
#     file fetched and read controlnet_aux/open_pose/util.py::draw_bodypose and
#     transcribed the whole hint spec -- COCO-18 keypoint order, the shared
#     18-colour ramp, the 17-entry limbSeq. The hint is colored lines and dots on
#     a black canvas and we can author it in PIL, exactly as every hint on this
#     route already is. No annotator, no controlnet_aux, no model.
#   - Can it reach a box running HF_HUB_OFFLINE? Only by being fetched once,
#     which is what this job is.
#
# SO THIS JOB IS SPLIT OFF BECAUSE IT IS THE ONLY PHYSICAL DEPENDENCY IN THE
# PLAN, and under the no-artificial-delay rule a physical dependency fires the
# moment someone is at a prompt rather than waiting for the code that will
# consume it. 2,386 MiB over the box's own network link is the clock this route
# runs on; the hint author and the sample spec are written while it lands.
# Rung A (masked IP-Adapter, $0, zero download) is unblocked by this and does
# not wait for it.
#
# ============================================================================
# THE TWO KWARGS THAT ARE THE WHOLE JOB, AND WHAT EACH COSTS TO GET WRONG
# ============================================================================
# allow_patterns=["config.json", "diffusion_pytorch_model.safetensors"]
#   A naive snapshot_download of this repo pulls ~5,014 MB: the 22 other files
#   are .webp showcase art, README.md, .gitattributes and a SECOND 2,502,139,104
#   byte weight file (`diffusion_pytorch_model_twins.safetensors`, a different
#   variant that needs an explicit filename load and is NOT this rung). With the
#   patterns it is 2,502,140,339 bytes. That is a 2.5 GB difference for one
#   kwarg, over a link this route is already waiting on.
#
# HF_HUB_OFFLINE cleared -- AND THAT IS WHY THIS JOB HAS EXACTLY ONE STEP.
#   Every other spec on this route sets HF_HUB_OFFLINE=1, deliberately, because
#   an offline box cannot silently re-fetch a weight somebody swapped. The env
#   block is per-JOB, not per-step, so the only honest way to clear it "for that
#   step only" is for the job to BE that step. Nothing here loads a model, runs
#   a pipeline or touches the GPU, so there is no render in this process whose
#   provenance an open network could contaminate.
#
# variant: NOT PASSED ANYWHERE. xinsir ships only the plain filename, so
#   passing variant="fp16" RAISES. The r3gm "fp16" mirror is byte-identical in
#   size to xinsir's file -- a rename, not a quantisation -- and its only effect
#   is to flip that trap the other way. `controlnet_plate.py` already holds
#   CONTROLNET_VARIANT = None and this job changes nothing about it. There is no
#   fp16 saving to chase: 2,502,139,104 / 2 = 1,251,069,552, which is already the
#   ~1,251,014,160 params the cache crosswalk measured for the scribble net, so
#   the shipped file IS half precision.
#
# NO SPEND. Public apache-2.0 weights over the box's own link: $0, no provider,
# no key, no ledger row. NO GPU: needs_gpu is false and this job must not hold
# the card away from a lane that can use it.
# NO RENDER, NO PICK, NO CANON FILENAME, NO PUBLISH TO THE SITE, NO POST.

id: ep2-b08-posenet-fetch-0819
task: ep2-b08-posenet-fetch-0819
node: 002b-first-citizen
beat: 8
runner: box
needs_gpu: false
sample: false
priority: 30
max_attempts: 2
owner: beat 08 arm-route lane, 2026-08-19

consumer: >-
  ep2-b08-posenet-sample-0819, the ONE sample that asks whether a COCO-18 pose
  skeleton binds on animagine-xl-3.1 -- the instrument b08-arm-route-0819.md §10
  ruled after bracketing conditioning scale, stroke weight and hint class on the
  scribble net and finding no setting that yields a model-drawn figure inside an
