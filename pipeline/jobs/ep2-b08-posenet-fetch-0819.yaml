success: >-
  C:\Users\artvn\.cache\huggingface\hub\models--xinsir--controlnet-openpose-sdxl-1.0
  holds config.json (1,235 bytes) and diffusion_pytorch_model.safetensors
  (2,502,139,104 bytes) with ZERO .incomplete files, and a manifest naming both
  files with their sizes and sha256 is in
  C:\banyan-farm\courier-box\farm-out\ep2-b08-posenet-fetch-0819. The step
  asserts the byte counts itself and exits nonzero if either is wrong, so a
  truncated download fails here rather than at the sample.

why: >-
  It is the only physical dependency on the whole route and the card is free. The
  research that licenses it is filed and graded; the licence is clean; the size is
  measured from the HF blob API rather than from prose; and $0 leaves the ledger
