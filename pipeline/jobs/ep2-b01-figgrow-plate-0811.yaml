#   * BEAT 16 — same header, next line: "BEAT 16 is gated on the goblin look."
#     Its fence puts "a goblin shape sits talking in flat pastel blur" behind the
#     leaf, and its only still is a PROVISIONAL steward pick at confidence 0.40,
#     which is not a founder-approved image and so is not a legal init under G1.
# The same header gives the real plant-only set: "BEATS 01/12/18/21 are
# plant-only". 12, 18 and 21 all ran plate-anchored rounds today (db0e424) and
# are in front of the founder. That leaves 01, and it leaves exactly one beat —
# so this lane queues two arms of one question on beat 01 and does NOT invent a
# third round to fill a slot. No work without a consumer.
#
# BEAT 01 HAS NO LEGAL FOOTAGE AT ALL, WHICH IS THE CONSUMER. Its only LTX clip,
# review/ep2-b01/ltx-b01-v2.mp4, records `init_frame.path:
# genomes\sapling\nodes\002b-first-citizen\stills\01-cold-open.png` — the still
# the founder revoked as "its tooooo tall", now on disk as
# stills/01-cold-open-REVOKED-too-tall.png. Every frame of the cold open is
# conditioned on a revoked plate. This is the first beat-01 motion round from a
# plate the founder has actually passed.
#
# THE INIT IS THE ONLY G1-LEGAL ONE AND ITS BYTES ARE ASSERTED. No beat-01 still
# has ever been approved, so the init is 001's `15-something-s-coming.png`
# (b15-r3-s1) — the only founder-approved sapling-in-grass frame in the tree, the
# same one r8's img2img and the fig inpaint both used, and the reasoning for that
# choice is already committed in ep2-b01-fig-inpaint-s1.yaml rather than invented
# here. It is 832x1216; the crop step below cover-crops it to 704x1280 and
# refuses to run unless the source sha256 is
# f60c1404f88d45720ca295dfc753e9eaabb815446710bcfffb3c7a07b7277f54.
#
# THE ACTION IS THE FOUNDER'S OWN CONDITION, NOT A STEWARD CHOICE. node.md beat
# 01: "On the thinnest branch a green nub swells, darkens and rounds into a
# single fig — the only thing in frame that moves." That sentence exists because
# he required it: leaf 002b-t0-c approval_conditions[0], "The fig must GROW on
# screen, not already hang", written into his 2026-08-03 approval of this node.
# So the fig growing is the beat, and a clip in which a fig merely hangs does not
# satisfy him even if it is beautiful.
#
# FINDING APPLIED — ANCHOR THE PROMPT TO THE PICTURE, NOT THE STAGE DIRECTION.
# Ep1 beat 02 broke twice because its prompt described shots.md's camera
# direction while the plate showed something else, and the model travelled to the
# words in four frames (2ba427b). Beat 01's script says "the thinnest branch";
# the approved plate has no branch, it has one slender stem in tall grass under a
# low warm light. So the positive below opens with what is actually in the
# picture — "Subject already in frame:", the same construction the b12 fullanchor
# job used — and only then states the change. `branch` does not appear.
#
# FINDING APPLIED — NEGATION BELONGS IN THE NEGATIVE. At guidance 1.0 the
# distilled LTX path runs no unconditional pass, so the negative is never read;
# a ban moved into the positive would simply feed the model those nouns. The
# negative below is byte-identical to the one the prior beat-01 LTX run recorded
# and is carried for provenance (§7.2) only. The positive contains no bans.
#
# THE 22-WORD ANCHOR CAP CANNOT BITE HERE. video_task.py:626 truncates a DERIVED
# anchor at 22 words — the defect that cost beat 12 its clouds. This job supplies
# the prompt as a literal file to ltx_i2v.py, so nothing derives and nothing
# truncates. The full text is what the encoder sees.
#
# FINDING APPLIED — FRAME COUNT IS NOT FREE. Roman rejected an ep1 LTX beat as
# "so slow" for stretching one action over 121 frames where the original used 61,
# so the count here is derived, not chosen. clips/01-vo.json total_s = 9.072.
# render_t3.fit_duration would loop a clip shorter than vo+0.4 = 9.472s, so 233
# frames at 24fps (9.708s) is the SHORTEST 8n+1 count that never wraps. It is the
# floor, not padding: the swell has to last the line. Well under the 385 cap.
#
# NO METRIC RANKS ANYTHING (131e433). Two arms, read by eye, side by side.
# LICENCES: nothing new. LTX-2.3 distilled (LTX-2 Community License), on the box.
# animagine is not in this path. $0.

