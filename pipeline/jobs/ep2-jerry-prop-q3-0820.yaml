why: 'RUNG q3: `1other` -> `1boy`, and nothing else. THE WEDGE WAS FOUGHT AT A CLOSE-UP because that is
  where the man-read lived, and a close-up has no body in it -- every one of the tile bar''s seven clauses
  is above the neck. A bar inherits the blind spot of the failure that motivated it, and this is that
  blind spot being closed. T8 is added to the bar and the twelve-pose set is scored retrospectively: all
  twelve FAIL it.'
bar: "T8 IS THE ONLY SCORED CLAUSE HERE AND IT IS NEW:\n  T8 HEAD-TO-BODY. Standing height divided by\
  \ head height. The B tile reads 5-6;\n     the twelve-pose set reads about 3. PASS is 4.5 or better\
  \ BY EYE against\n     adult-b19-0819.jpg, with lean limbs rather than stubby ones.\nT1-T3 and T7 are\
  \ REGRESSION CLAUSES: blank eyes, no nose, no age modelling, no\npatchwork on the skull. A rung that\
  \ fixes the body and breaks the face is a\nFAIL, and it is the most likely way each of these three goes\
  \ wrong.\nT4 (ears) is unscorable at full body and is not scored.\nT6 remains STRUCK."
failure_predicted_in_advance: 'q3 WINS AND IT COSTS ME A PUBLISHED CONCLUSION. Four commits ago

  this lane wrote "AXIS A IS A DEAD LEVER" off the wedge, and that was measured

  entirely on close-ups, where there is no body to be wrong. If restoring `1boy`

  restores adult proportion, the honest correction is that the count tag governs

  the BODY and the feature tags govern the FACE, and the wedge simply never had a

  body in frame to notice with.

  q1 FAILS on the mechanism w1 already demonstrated: nothing in the positive asks

  for a mascot, so there is nothing for the negative to cancel; per Ban et al. a

  negative acts on what the positive draws, and this basin is arrived at by the

  ABSENCE of a human prior rather than by any word.

  q2 IS THE COIN FLIP. `long legs` is a real tag with real mass, but it describes

  a proportion within a body rather than the body''s relation to the head, so it

  may lengthen the legs of a bobblehead and produce something worse than either.

  IF ALL THREE FAIL, the wording route is finished for the BODY exactly as it

  succeeded for the face, and the answer is a reference route -- IP-Adapter or

  ControlNet off the tile''s own silhouette, which supplies proportion as geometry

  instead of asking for it as a word.'
the_one_variable: 'p04''s exact prompt, negative, seed and sampler with ONE change: q1 the negative, q2
  two positive tags, q3 the count tag alone.'
this_rung_tests_a_conclusion_this_lane_published: q3 in particular. Commit `the ladder gets the recipe,
  the dead lever...` states AXIS A IS A DEAD LEVER on the strength of v2/v3/v4, all of which were close-ups
  with no body in frame. If q3 restores proportion, that conclusion is wrong as stated and the correction
  is that the count tag governs the BODY while the feature tags govern the FACE.
