# 2026-08-15, deep-queue lane. EXTENSION of a sample that has LANDED AND BEEN OPENED.
#
# NOT A NEW RECIPE, and that is why it carries no `sample: true`. Every knob --
# beat, draft key, arm, reference set, ref prefix, harness, sampler -- is held at
# ep2-b04-standing-views-0815's values byte for byte. The ONLY thing that moves is
# the seed index, via the sampler's own `--seed-start`, which exists for this:
# "index of the first seed, so a later run can EXTEND an existing one". The seed
# arithmetic is `SEED + BEAT + i*1000` indexed ABSOLUTELY, so s6..s7 here are the
# seeds a single run of eight would have drawn. They cannot collide with s0..s5, and
# the output filenames end -s6/-s7 so they cannot overwrite them either.
#
# WHAT THE SAMPLE ACTUALLY SHOWED, opened frame by frame by this lane rather than
# read off the job name (the rule that caught five aspirational "fixes" today):
#   PASS -- the goblin. Lean, dour, half-lidded, long robe, sash, boots, head to
#     toe, ~5.5-6 heads on r1/r2. ZERO blush across the frames opened. The adult
#     wording plus the blush/chibi/baby negative block holds for a second run.
#   FAIL -- the background, and it is the sample's own sharpest prediction:
#     "grass and sky in all sixteen, and NO blank-paper frames". The frames came
#     back on BLANK WHITE with a tuft of grass under the boots. `pale sky above
#     him` in the positive and `no white background, no simple background` in the
#     negative did not buy a location. That is the sample's stated redirect
#     condition, verbatim: "the blank paper was coming from the REFERENCE tile's
#     white field and not from the prompt". It is rule 5 again -- THE REFERENCE
#     DECIDES, THE PROMPT LOSES, for framing and location.
#     This job does NOT try to fix that. Fixing it is a reference-set change and
#     therefore a new sample, which is a different job. This one buys the thing
#     the white paper does not spoil.
#
# WHY MORE SEEDS IS STILL WORTH SEVEN MINUTES DESPITE THAT FAILURE: the blocker
# this chain exists to clear is VIEW SPREAD, not location. A reference tile is
# allowed to be on white -- that is what a reference tile normally is. The sample
# could not commission four views because a round varies the REFERENCE and all
# four rounds share one prompt; the only thing that varies WITHIN a round is the
# seed, and it predicted in advance that it might come back "four-distinct by
# sha256 but weak in angle coverage". Every frame this lane opened was frontal.
# So seeds are the ONLY lever left that can produce a three-quarter or a profile
# without changing the recipe, and two more seeds per job is the cheapest honest
# draw at it.
#
# WHAT WOULD MAKE THIS A WASTE, said before it runs: if s6 and s7 are frontal in
# all four rounds too, then seed does not move body angle either, and the answer
# is a drawn or sourced turnaround rather than another sampler round. That is a
# real finding and it is worth seven minutes to have it stated rather than assumed.
