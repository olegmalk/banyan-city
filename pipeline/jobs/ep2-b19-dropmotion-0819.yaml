    #!/usr/bin/env python3
    """REFUSE TO RENDER IF THE FRUIT IS NOT IN THE CROPPED INIT.

    The whole beat is a fruit falling. A framing bug that clips the fruit costs
    12 GPU-minutes and produces a clip that cannot be judged, and the centred
    crop this job had to override does exactly that. So the geometry is asserted
    on the actual cropped file, before the model loads, and the numbers are the
    ones this spec pre-registered -- they cannot be moved afterwards to fit.

    No model, no network, no GPU. Reads one PNG.
    """
    import colorsys, sys
    from PIL import Image

    PATH = sys.argv[1]
    im = Image.open(PATH).convert("RGB")
    W, H = im.size
    if (W, H) != (704, 1280):
        sys.exit("!! wrong size %dx%d -- refusing." % (W, H))
    px = im.load()

    # The fruit: violet, hue 255-305, mid saturation, not the pale field.
    # Searched ONLY in the pre-registered start window so his purple cloak and
    # its cast shadow (the exact contamination that produced a retracted hue
    # measurement in this lane on 2026-08-19) cannot be counted as fruit.
    XS, XE, YS, YE = 560, 704, 860, 1000
    pts = [(x, y) for y in range(YS, YE) for x in range(XS, XE)
           if (lambda c: 255 <= c[0] * 360 <= 305 and c[1] > 0.28 and 0.15 < c[2] < 0.75)
              (colorsys.rgb_to_hsv(*[v / 255.0 for v in px[x, y]]))]
    if len(pts) < 300:
        sys.exit("!! only %d violet px in the fruit window -- the fruit is not "
                 "in frame or is not violet. REFUSING." % len(pts))
    xs = [p[0] for p in pts]
    ys = [p[1] for p in pts]
    x0, x1, y0, y1 = min(xs), max(xs), min(ys), max(ys)
    print("fruit bbox x %d..%d y %d..%d  n=%d" % (x0, x1, y0, y1, len(pts)), flush=True)
    # PRE-REGISTERED: fruit fully inside, clear of the frame edge, and clear of
    # the declared body zone (x <= 500). Contact would need 110px of drift.
    if x1 > 690:
        sys.exit("!! fruit within 14px of the right edge (x1=%d) -- REFUSING." % x1)
    if x0 <= 500:
        sys.exit("!! fruit overlaps the declared body zone (x0=%d) -- REFUSING." % x0)
    if y1 > 970:
        sys.exit("!! fruit is already at grass level (y1=%d) -- nothing to fall. "
                 "REFUSING." % y1)
    print("FRAMING OK -- fruit aloft, clear of both the frame edge and the body "
          "zone. gap to body zone %dpx, fall clearance to grass ~%dpx"
          % (x0 - 500, 978 - y1), flush=True)

