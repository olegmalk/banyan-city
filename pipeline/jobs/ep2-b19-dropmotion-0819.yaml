    #!/usr/bin/env python3
    """Cover-crop an asserted source image to an exact WxH. No model, no network.

    ep2-b14-motion-crf10-0819's copy, with ONE addition: --anchor. The default
    is `center`, which is what every earlier copy of this file did, so passing
    nothing reproduces those jobs byte for byte.

    WHY THE ANCHOR EXISTS, measured before this job was filed. The picked plate
    is 832x1216 and the target is 704x1280, so the cover-crop scales by 1.0526
    and then discards 81.7 ORIGINAL pixels off each side. Beat 19's fruit lives
    at original x 743..773 -- the right 4% of the plate -- so a CENTRED crop
    keeps 8 of its 32 columns and throws the subject of the beat out of frame.
    Right-anchored, the fruit lands at output x 610..642 with 62px of air to the
    frame edge, and the goblin is still whole (his silhouette ends at output
    x ~500). Right-anchored is not a preference here, it is the only offset that
    holds both bodies: even at the maximum the fruit has only 62px to spare.
    """
    import argparse, hashlib, os, sys
    from PIL import Image

    ap = argparse.ArgumentParser()
    ap.add_argument("--src", required=True)
    ap.add_argument("--sha256", default="", help="asserted before anything is written")
    ap.add_argument("--out", required=True)
    ap.add_argument("--size", default="704x1280")
    ap.add_argument("--anchor", default="center", choices=["center", "left", "right"])
    a = ap.parse_args()

    if not os.path.isfile(a.src):
        sys.exit("!! src not found: %s" % a.src)
    h = hashlib.sha256()
    with open(a.src, "rb") as fh:
        for chunk in iter(lambda: fh.read(1 << 20), b""):
            h.update(chunk)
    have = h.hexdigest()
    if a.sha256 and have != a.sha256:
        sys.exit("!! SRC SHA MISMATCH -- refusing.\n   want %s\n   have %s" % (a.sha256, have))

    W, H = (int(v) for v in a.size.split("x"))
    im = Image.open(a.src).convert("RGB")
    sw, sh = im.size
    scale = max(W / float(sw), H / float(sh))
    nw, nh = int(round(sw * scale)), int(round(sh * scale))
    im = im.resize((nw, nh), Image.LANCZOS)
    if a.anchor == "center":
        left = (nw - W) // 2
    elif a.anchor == "left":
        left = 0
    else:
        left = nw - W
    top = (nh - H) // 2
    im = im.crop((left, top, left + W, top + H))
    os.makedirs(os.path.dirname(os.path.abspath(a.out)) or ".", exist_ok=True)
    im.save(a.out)
    print("src %dx%d sha %s" % (sw, sh, have), flush=True)
    print("cover-crop scale=%.4f -> %dx%d, anchor=%s box (%d,%d)"
          % (scale, nw, nh, a.anchor, left, top), flush=True)
    print("WROTE %s" % a.out, flush=True)

