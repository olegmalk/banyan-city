  M4_HE_STAYS_HIMSELF: Same goblin - green skin, bald head, patchwork cloak, seated with both hands on his
    knees. No second figure, no morph, no costume change, no standing up. Read on the frames, not measured.
  M5_CAMERA_LOCKED: No pan, tilt, zoom or dolly. Measured on the static field and horizon - median absolute
