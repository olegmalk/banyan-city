prediction_pre_registered: 'F-IMPERCEPTIBLE OR F-FROZEN ON THE FRUIT IS THE MOST LIKELY OUTCOME, and the
  reasoning is arithmetic rather than pessimism. The founder''s knee-height canon puts the sapling at 40cm
  and the drop at about 30cm; the board requires this beat WIDE (the gate flagged a scale jump from the previous
  macro), so 30cm of world maps onto ~32px of a 1280-tall frame. The engine is being asked to move a 32x43px
  rigid object by less than its own height. Against that: this engine measures 12 of 12 on whole-body motion
  and 0 of 8 on in-hand actions, and a small falling object is neither of those classes -- there is no prior
  on it in this repo, which is the honest position and is why this is a sample.

  I ALSO PREDICT THE NOTICE LANDS AND THE FALL DOES NOT -- i.e. M8 passes while M1/M2 fail. A head turn is
  a large-amplitude motion of the kind the engine does (ep2-b09-faceturn-crf10-0819), so the most likely
  single clip is a goblin who looks down at a fruit that never moved. That is a specific, falsifiable shape
  and it is written before the render so it can be wrong.

  IF I AM WRONG in the other direction and the fruit moves too much, the mode to watch is F-CONTACT, because
  the engine has no notion of his body as an obstacle.'

crf_choice:
  chosen: --image-crf 10
  guided_not_defaulted: 'THE LADDER ALREADY NAMED IT FOR THIS EXACT PLATE. pipeline/work-ladder-0819.md,
    beat 19: "Still named, not fired: this plate''s motion wants --image-crf 10, not 33, on the evidence
    of ep2-b09-faceturn-crf10-0819." So this is a filed decision being executed, not a fallback. The generic
    fallback offered to this lane was "use 10 and say why if the class is unguided" -- the class is guided,
    and citing the guidance is stronger than citing the fallback.'
  the_per_beat_argument: 'The ladder''s crf finding is explicitly NOT a global win: crf 10 helps beats 01
    and 17 and FROZE beat 18, because on a macro plate whose whole content is fine high-frequency movement
    a cleaner init gives i2v less to push off from. Beat 19 is the opposite register -- a wide whole-body
    plate whose single moving element is a hard-edged 32x43px object. What must survive the encode here is
    that object''s EDGE, and crf 33 puts 29.4% of a comparable plate''s pixels off by more than 8 levels
    against crf 10''s 7.1%. A 32px object is exactly the thing that measurement destroys.'
  the_risk_of_the_choice_named_out_loud: 'CRF 10 COULD BE A CAUSE OF MY OWN PREDICTED FAILURE. The beat-18
    mechanism -- cleaner init, less to push off from, motion stops -- is a real mechanism and this beat''s
    motion is small, so it is exposed to it. That is not a reason to pick 33 blind; it is a reason to
    pre-register the follow-up: IF F-FROZEN OR F-IMPERCEPTIBLE FIRES, the designated next rung is this same
    spec at --image-crf 33, one variable, same seed, same plate, same words -- NOT a wording change and NOT
    a new plate. Named here so the next lane does not have to re-derive it, and so nobody answers a freeze
    with a fifth prompt.'

pre_registered_fail_modes:
  reporting_rule: EVERY mode below is reported BY NAME in the verdict whether or not it fired. A mode that
    did not fire is evidence about the recipe and is not a footnote.
  F-FROZEN: 'Nothing moves in 121 frames. Beat 14 produced exactly this and beat 18''s crf-10 take produced
    a near-freeze (interframe median 0.570 against 5.956). Caught by M7''s floor: fewer than 8 consecutive
    pairs above 0.5 in the fall window.'
  F-IMPERCEPTIBLE: 'The fruit moves, but by less than its own height, so the beat does not read as a fall.
    THIS IS A FRAMING QUESTION AS MUCH AS AN ENGINE ONE and it belongs to the author if it fires: the wide
    framing is a board requirement, the 30cm drop is his own knee-height canon, and the two together cap
    the fall at ~32px whatever the engine does. If this is the outcome, the finding to report is not "the
    engine failed" but "this beat may not be filmable wide", which is a story decision and not ours.'
  F-CONTACT: 'The fruit touches him. DISQUALIFYING -- his ruling, twice given. Requires 110px of leftward
    drift from the measured start position, so if it fires it will be unmistakable rather than borderline.'
  F-DETACHED-FLOAT: 'THE 2026-08-12 FAULT, named because this plate is the fix for it and the fix is what
    is under test. done-definitions records the mechanism: "Asking a plate with the fruit already down for
    a fall is what made fruit materialise in mid-air." Every earlier beat-19 plate had the fruit already
    in the grass, so the engine invented a second one aloft. The shape to watch here is the inverse: the
    fruit stays on the branch while a copy appears mid-air, or it vanishes from the branch and reappears
    on the ground with no path between. Caught by M1''s continuity clause and by M6''s one-fruit count.'
  F-REWIND: 'THE PALINDROME TAIL, and it has two halves that fail in different places.

    IN THE CLIP: i2v engines will happily run an action and then unwind it. If the fruit falls and then rises
    back toward the branch, the clip fails M1''s monotonicity even though a still from the middle looks perfect.

    IN THE ASSEMBLER, which is the half nobody has written down for this beat: pipeline/render_t3.py:616
    palindromes any clip whose slot outruns it -- `dur > cdur + 0.05 and cdur <= 16.0` -- and beat 19''s
    slot is 1:34-1:39, i.e. 5.000s, against this clip''s 121/24 = 5.0417s. So the palindrome does NOT fire,
    BY 0.09 SECONDS. That margin is the entire safety of an IRREVERSIBLE action: reversed, this beat shows
    a fig flying back up onto a stem, which is the most obviously broken thing the show could put on screen.
    PRE-REGISTERED CONSEQUENCE: if beat 19''s slot ever exceeds 5.09s -- a VO-led retime, a trim, a shorter
    re-render -- the clip must be LENGTHENED or held, never palindromed. Beat 19 is the first beat in this
    show whose action a viewer can see run backwards, and the assembler currently has no notion of that.'
  F-PLANT-REVERT: The drawn plant reverts under motion to the bead-strung vine three wordings produced before
    it was drawn, or the leaves multiply. Caught by M6. Never checked under motion on this beat by anyone.
  F-HEAD-ONLY: He turns his head and nothing else in the frame changes -- which is a FAIL of the beat and
    also, per the prediction above, the single most likely clip. Reported as M8 pass + M1/M2 fail rather
    than as one undifferentiated FAIL, because those two halves cost different things to fix.
  F-CAMERA: Pan, tilt, zoom or dolly. Caught by M5.
  F-MORPH: He changes, a second figure appears, or he stands up. Caught by M4.
  F-SCENE-BREAK: A cut to another location mid-clip. Caught on the frames.

recipe_derivation:
  parent: 'ep2-b14-motion-crf10-0819 -- the proven LTX i2v shape on this box. Cloned: 704x1280, 121 frames,
    24 fps, guidance 2.0, --distilled-sigmas, --two-stage, --image-crf 10, --offload sequential, --mode production,
    the two-stage encode/render split, the sidecar stamp and the named-files publish.'
  departure_1_the_crop_anchor: 'cover_crop.py gains --anchor, defaulting to center so every earlier job it
    was copied into is reproduced byte for byte. Passed `right` here BECAUSE THE CENTRED CROP THROWS THE
    SUBJECT OF THE BEAT OUT OF FRAME -- measured, not feared: 832x1216 -> 704x1280 discards 81.7 original
    px per side, the fruit lives at original x 743..773, and a centred crop keeps 8 of its 32 columns. This
    was caught by measuring the picked plate against the recipe before filing, and it is the reason the job
    also carries assert_framing.py: the same class of bug would otherwise cost 12 GPU-minutes and return
    an unjudgeable clip.'
  departure_2_this_beats_words: The prompt is beat 19's own script line and the negative front-loads this
    beat's defect class ahead of the parent's camera block, per the negative-ordering finding the plate specs
    in this lane recorded. Nothing else in the argv differs.
  a_guard_the_parent_lacked: 'assert_framing.py, which REFUSES BEFORE THE MODEL LOADS if the fruit is not
    aloft, in frame, clear of the frame edge and clear of Z-BODY. Its thresholds are this spec''s pre-registered
    numbers, so it cannot be relaxed after the fact to bless a bad crop.'
  a_parent_key_deliberately_not_inherited: 'NO `verdict`, `verdict_measured`, `pick` or `sweep_summary` block
    is carried in from ep2-b14-motion-crf10-0819. The ladder recorded on 2026-08-19 that three crf-10 specs
    were derived from their parents INCLUDING those keys, so a filed job advertised a PASS belonging to a
    different clip. This spec starts with none of them, and its verdict will be appended after the render
    by the lane that opens the frames.'
  prompt_is_verbatim: 'The action clause is the founder''s own sentence with nothing added: "the stem lets
    go, the fig falls, and lands in the grass at his feet. He notices." Lower-case opening kept because that
    is how it reads in node.md:118. Only the house style tail is appended, exactly as beat 14 does it.

    WHAT I DELIBERATELY DID NOT ADD, and it is a real choice: no positive hand-placement clause ("both hands
    stay on his knees") to guard M3, even though the positive-placement law has now fired five times in this
    repo and negatives are known to be weak. Two reasons. The instruction was a verbatim script line, and
    smuggling staging words into it would make a PASS unattributable. And the plate''s own geometry is the
    guard: 110px of clearance for a fruit that has to fall 32px. IF F-CONTACT FIRES ANYWAY, the designated
    next lever is exactly that positive clause -- named here so it is a filed rung and not an improvisation.'
  text_encoder_note: LTX here encodes with Gemma3 (pipeline/ltx_i2v.py), not CLIP, so the 77-token budget
    that governs the animagine plate prompts in this lane does not bind on these two files. Not measured
    on the real tokenizer, and no truncation is claimed - only that the CLIP constraint is the wrong one
    to cite here.

script_authority: 'S6 DERIVATION, WRITTEN OUT BECAUSE THIS BEAT SITS INSIDE THE 08-17 REWRITE THAT THE FOUNDER
  HAS NOT READ. Node 002b-first-citizen carries `approved_by: founder`, and beats 12/13/15/19/20 were rewritten
  on 2026-08-17 with `approval_status` NOT YET READ BY HIM. S6 says no footage render from a script the founder
  has not read and approved, so the question is whether THIS render depends on unread text. It does not,
  and here is the chain:

  1. THE ACTION THIS CLIP ANIMATES IS HIS OWN SENTENCE, WHICH HE TYPED HIMSELF. On 2026-08-15 he edited node.md:118
  in commit a483eb52 ("the fig falls on the ground now, so the board entry that foreclosed that has to say
  so"), and it reads: "the stem lets go, the fig falls, and lands in the grass at his feet. He notices."
  That is the prompt, verbatim. It is not a steward rewrite of his text; it is his text.

  2. THE STAGING IS HIS RULING, GIVEN ONCE AND RE-CONFIRMED TWICE. ruling_0815, verbatim: "ok then just make
  the fig fall on the ground and the goblin will notice it" -- superseding his own earlier "lets make it
  drop on his head". Re-confirmed in done_when ("NO CONTACT WITH HIS BODY -- a take where the fruit touches
  him fails this beat now, however well it moves") and again by his own node.md edit above. Same class as
  beat 13''s verbal ratification: the substance is the author''s, only the transcription is the steward''s.

  3. AND HERE THE BRIEF THIS LANE WAS HANDED IS NOT QUITE RIGHT, SO IT IS CORRECTED RATHER THAN REPEATED.
  The brief said the 08-17 rewrite''s "only substantive delta is the founder''s OWN 08-15 ruling". On beat
  19 that is not the whole delta. The 08-17 knee-height rewrite ALSO answered `plate_requirement_0815.body_position`
  -- it put him "standing beside it, mid-stride away", the fig landing "by his heel", and it did so on the
  steward''s authority over a question done-definitions still records as an OPEN AUTHOR CALL. That is a second
  substantive change and it is unread.

  4. WHICH IS WHY THIS JOB DOES NOT USE IT. The plate this clip opens on has him SEATED, hands on his knees
  -- a pose the plate lane derived from beat 20''s opening and from beat 14 (which renders this character
  crouching) and recorded as overturnable in one word. So the unread half of the rewrite is NOT load-bearing
  here: this render leans only on (1) and (2), both his own words, and it would be unaffected if the standing/mid-stride
  sentence were struck tomorrow. The tension is NAMED rather than resolved: the board and the plate disagree
  about his body, done-definitions still calls body_position open, and that is an author card this job does
  not spend.

  5. BEATS 12, 15 AND 20 REMAIN UNREAD AND ARE NOT TOUCHED BY THIS JOB. Nothing here renders, re-words, re-plates
  or assembles any of them, and beat 13 is not touched either.

  WHAT THIS JOB IS NOT: no voice synthesis, no episode assembly, no publication. Silent, $0, one clip. The
  sidecar ships `approved: false`, `provisional: true`. shots.md, node.md and pipeline/wave-drafts.yaml are
  UNTOUCHED by this job.'

is_this_a_pick: 'NO. This is ONE SAMPLE against a pre-registered bar. No plate_ack, no promotion, no leaf,
  no lineage entry, nothing in any cut and nothing published. Beat 19 stays a slate until the frames are
  opened and, if they pass, until the author says otherwise. The plate PICK this is conditioned on is a steward
  route decision recorded in ep2-b19-sapgloss-0819.yaml `pick_0819` and is vetoable in one line for $0.'

# ============================================================================
# VERDICT -- appended 2026-08-19 by the same lane, after the render.
# Scored against the bar THIS SPEC PRE-REGISTERED ABOVE, which is not edited.
# READ HOW: all 121 frames extracted and the fruit tracked per frame against
# the geometry filed before the render; then the frames OPENED, which is what
# overturned the tracker on two clauses. $0, CPU, nothing re-rendered.
# Evidence: farm-out/ep2-b19-dropmotion-0819/.
# ============================================================================
verdict_0819:
  verdict: 'FAIL, decisively, and MY PRE-REGISTERED PREDICTION WAS WRONG IN THE MOST USEFUL DIRECTION.
    I predicted F-FROZEN or F-IMPERCEPTIBLE -- that the engine would not move a 32x43px object by less than
    its own height -- and that the notice would land while the fall did not. The engine produced PLENTY of
    motion. It animated the WRONG SUBJECT. crf 10 did not freeze this beat and amplitude was never the problem.'
  what_actually_happens_in_the_clip: 'THE PLANT GROWS AND THEN LIES DOWN, AND HE REACHES FOR IT. Frame by
    frame: f000-f020 the plate, fruit aloft, nothing moves. From ~f025 the sapling THICKENS AND ELONGATES.
    At f030 his right hand leaves his knee. f039-f065 HIS HAND DESCENDS ONTO THE PLANT and rests on its leaves.
    By f088 the sapling is a SPRAWLING PROSTRATE plant -- four or more large oval leaves lying nearly flat,
    the upright stem replaced by a long horizontal runner, and TWO figs instead of one -- and it holds that
    state to f120. The figs reach grass level BECAUSE THE PLANT LIES DOWN. There is no detachment event
    anywhere in the clip: nothing ever separates from anything.'
  the_finding_that_outlives_this_clip: 'THE ENGINE RENDERED BEAT 20''S ACTION INSIDE BEAT 19. Beat 20''s
    own line is "The scavenger picks the fig up with both hands and looks up at the bare branch." This clip
    is him reaching for the fig. The prompt named no hand action, the plate has both hands on his knees, and
    `fruit touching him, fruit on his body, fruit in his hands` were the FIRST tokens of the negative. It
    arrived anyway -- the positive-placement law firing again, on a sixth beat. Given a human, a plant and
    a sentence about fruit reaching the ground, i2v assigned the agency to the human. The fix for subject
    attribution in this repo has never been a negative and has never been a fifth wording.'
  measured:
    M1_DETACH_AND_FALL: 'FAIL. The tracked blob is stationary for 20 frames, then jumps 13px (f021), 30px
      (f027), 29px (f033), 40px (f036) and 113px (f039) -- twelve jumps over the 12px continuity cap, and
      four BACKWARD steps (f027 -30.0px, f030 -20.5px, f077 -10.0px, f080 -10.5px). A 113px single-frame
      jump is not a fall, and the backward steps break monotonicity outright.'
    M2_LANDS_IN_THE_GRASS: 'READS PASS ON THE NUMBERS AND IS AN ARTIFACT -- reported as FAIL. Centroid descent
      114.0px against the 20px required, bottom edge y1059 against y965 required, and the last 12 frames move
      0.0px, so all three clauses of M2 are satisfied. They are satisfied by THE PLANT MIGRATING, not by a
      fruit falling. This is exactly the shape of result the repo''s own rule was written for: a metric agreeing
      with me is not a sample. The frames overrule the number.'
    M3_NEVER_TOUCHES_HIS_BODY: 'FAIL as written -- 81 frames (f039-f120) put fruit pixels inside Z-BODY, min
      gap -212px. BUT THE CAUSE IS NOT WHAT THE CLAUSE WAS WRITTEN FOR, and this must not be quoted as "the
      fig hit him". From f039 the migrated fig sits BELOW HIS BOOT in the foreground grass; by f088 its overlap
      with Z-BODY is at the zone''s bottom edge (fig top y1014 against the zone''s y1015). The zone was drawn
      generous on purpose and this is the technicality that a generous zone buys.'
    M4_HE_STAYS_HIMSELF: 'SPLIT, and the split is worth keeping. IDENTITY HELD -- same goblin, green skin,
      bald, patchwork cloak, no morph, no second figure, he never stands up. That is a real positive about
      this recipe and it is the half beats 08 and 14 keep failing. THE POSE CLAUSE FAILED: "both hands on
      his knees" does not survive f030.'
    M5_CAMERA_LOCKED: 'PASS ON THE READ, AND THE INSTRUMENT''S NUMBER IS NOT TRUSTWORTHY HERE -- both are
      reported because quoting only the number would file a camera fault that does not exist. Raw output was
      max horizon shift [4, 4]. Checked: dx = 0 everywhere, so there is no pan. The vertical component is
      REGION-INCONSISTENT -- best fit +3px on the low-contrast horizon band, -1px on the high-contrast fence
      posts at x100-170. A camera move is rigid; this is not. It is the field being RE-INKED between frames,
      which is the same re-inking that gave beat 06 a depth of 0.516 with zero human motion. Framing is stable
      across all seven sampled frames by eye.'
    M6_PLANT_KEEPS_EXACTLY_TWO_LEAVES: 'FAIL, HARDEST OF ALL, and it is F-PLANT-REVERT firing. Two wide oval
      cotyledons become four or more large leaves; ONE fig becomes TWO (the tracker sees a second compact violet
      component from f042 and it never goes away); the thin upright stem becomes a prostrate horizontal runner.
      This plant took four rounds of drawing and a closed three-rung wording ladder to get to two leaves and
      one fruit. MOTION UNDID ALL OF IT IN 90 FRAMES, and no beat-19 job had ever checked the count under motion
      before -- which is why the clause was added.'
    M7_NOT_SECRETLY_FROZEN: 'FAIL as written (94 of 120 pairs under 0.5 against the cap of 90; longest run
      over 0.5 is 2 against the 8 required; interframe median 0.197, max 6.707) AND THE CLAUSE IS THE WRONG
      INSTRUMENT FOR THIS BEAT. Found by self-testing the tracker on a synthetic 32px fruit translation BEFORE
      the clip existed: a pure fruit drop over a frozen background moves whole-frame interframe by 0.056, i.e.
      a perfect execution of this beat would fail M7''s floor. M7 measures whole-frame churn and cannot see
      whether the RIGHT thing moved. The threshold is NOT retuned to fit -- it stays as filed and its FAIL
      is recorded as uninformative. The load-bearing measurement on this beat is the fruit track, and the
      generalisation for the next motion bar is that a near-still beat needs its floor on the TRACKED SUBJECT,
      never on the frame.'
    M8_HE_NOTICES: 'FAIL, ENTANGLED. His head does tilt down and stay down, so a downward look exists -- but
      it arrives with the reach and is inseparable from it. A notice that is the first half of a grab is not
      the beat''s notice; beat 19 ends with him seeing it and beat 20 is where he takes it.'
  fail_modes_all_reported_by_name:
    F-FROZEN: DID NOT FIRE. The opposite fired. This is the mode I called most likely.
    F-IMPERCEPTIBLE: DID NOT FIRE, and its whole premise is dead. 114px of blob travel in a beat I argued
      was capped at ~32px, because the mover was the plant and not the fruit.
    F-CONTACT: FIRED, and from the direction my bar could not see -- see `the_hole_this_found_in_my_own_bar`.
    F-DETACHED-FLOAT: FIRED, in its second shape. Not a fruit materialising in mid-air, but a SECOND fruit
      appearing (f042 onward) and never resolving. The 08-12 fault's real content survives - the engine will
      invent fruit rather than move the one it has.
    F-REWIND: DID NOT FIRE in the clip - the four backward steps are 10-30px jitter, not an unwind. The
      ASSEMBLER half is untouched and still latent, and the 0.09s margin recorded above is unchanged
      (clip 5.0417s measured by ffprobe against beat 19's 5.000s slot).
    F-PLANT-REVERT: FIRED, hardest. See M6.
    F-HEAD-ONLY: DID NOT FIRE. He moves his arm and torso, not only his head.
    F-CAMERA: DID NOT FIRE. See M5.
    F-MORPH: DID NOT FIRE. Identity held for 121 frames.
    F-SCENE-BREAK: DID NOT FIRE. One location, one continuous take.
  the_hole_this_found_in_my_own_bar: 'M3 IS ASYMMETRIC AND THE FOUNDER''S RULING IS NOT. I wrote it as "no
    FRUIT pixel inside a static Z-BODY box measured at f000". His ARM left that box, so the bar was structurally
    unable to see BODY-ONTO-FRUIT contact -- only fruit-onto-body. The clip contains the first kind and my
    instrument scored it by accident, through the plant''s migration, rather than by design. The clause the
    ruling actually needs is SYMMETRIC and needs a PER-FRAME body mask, not an f000 rectangle: no contact
    between his body and the fruit in either direction, in any frame. Written down for the next lane rather
    than patched into a bar this clip was already scored against.'
  what_this_does_NOT_impeach: 'THE PLATE, AND THEREFORE THE PICK. The framing gate passed on the real file,
    the init was correct, the fruit was aloft at exactly the filed bbox (measured 612..639 x 906..941 against
    610..642 x 903..946 pre-registered -- a 2-3px difference and it is the libx264 crf-10 round trip, not a
    different picture), and it had 110px of clearance. Nothing in this clip is evidence against strength 0.22
    or against the drawn plant. What failed is an i2v motion recipe applied to this staging. `pick_0819` stands.'
  next_rung_named_and_the_one_it_cancels:
    cancelled_by_its_own_condition: 'THE crf-33 A/B IS OFF. This spec pre-registered it as the designated
      follow-up IF F-FROZEN or F-IMPERCEPTIBLE fired. Neither fired, so the rung does not fire either. Recorded
      because a pre-registered follow-up that gets run unconditionally is how a lane burns a card on a question
      its own evidence closed.'
    not_a_fifth_wording: 'The failure is SUBJECT ATTRIBUTION, not amplitude or phrasing, and this repo has
      five rungs of evidence that words do not fix attribution -- most recently tonight''s b08 finding, "five
      rungs of geometry could not say which body an attribute belongs to; a reference image behind a mask can".
      A sixth wording of who-does-what would be the closed-axis mistake.'
    the_rung_this_lane_recommends: 'COMPOSITE THE FALL, $0, CPU, NO GPU AND NO ENGINE. Every condition this
      beat needs is already met for it: the camera is LOCKED, the fig is a 32x43px RIGID object, the plate
      is picked and passing, and this lane already owns pipeline/beat19_drop_composite.py which DREW that
      plant. A sprite translated down a parabola over the static plate produces a physically exact 32px fall,
      lands it in the grass beside him, and CANNOT produce any of the three faults that killed this take --
      the plant cannot revert because it is not being re-generated, he cannot reach because he is not being
      re-generated, and a second fig cannot appear. It also satisfies the founder''s ruling exactly. The open
      question it leaves is a taste one and belongs to him: whether a composited fall reads as animation next
      to i2v beats, which is one look at one sample.'
    the_authors_card_underneath_all_of_it: 'Whether beat 19 is filmable WIDE at all. His knee-height canon
      caps the fall at ~30cm and the board requires the sapling and the scavenger in one frame, so the drop
      is ~32px of a 1280-tall frame however it is produced. That is a story/framing question, not an engine
      one, and this clip is the first evidence for it.'
  is_this_a_pick: 'NO, and there is nothing to pick. FAIL. Nothing published, nothing cut, no plate_ack, no
    leaf, no lineage entry. Beat 19 remains a SLATE and its blocker has moved: no longer "no plate exists"
    -- the plate exists and is picked -- but "no motion recipe has produced a fall".'
