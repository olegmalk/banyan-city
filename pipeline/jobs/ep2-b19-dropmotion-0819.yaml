  M1_DETACH_AND_FALL: The fruit separates from the side-branch and descends by a CONTINUOUS path. Measured
    - the violet blob is present in all 121 frames, its centroid y is non-decreasing across the fall window
    to within 2px of jitter, and there is no frame pair in which the blob disappears and reappears more than
    12px away. A fruit that vanishes and re-materialises fails this even if the end state looks right.
  M2_LANDS_IN_THE_GRASS_BESIDE_HIM: It comes to REST on the ground. Measured - the blob's bottom edge reaches
    y >= 965, its centroid descends >= 20px from f000, and over the final 12 frames the centroid moves <=
    3px. Rest matters as much as fall - done_when asks for the fall, the landing and the noticing IN THAT
    ORDER, so a fruit still moving at f120 has not landed.
  M3_NEVER_TOUCHES_HIS_BODY: 'DISQUALIFYING ON ITS OWN, and it is the founder''s ruling and not this lane''s
    bar. NO violet-blob pixel may fall inside Z-BODY (x 0..500, y 285..1015) in ANY of the 121 frames. One
    frame is enough to fail the take. Rule: "NO CONTACT WITH HIS BODY -- a take where the fruit touches him
