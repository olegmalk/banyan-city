#      window 5.2% (pairs 10..15) | head 2.898 | body 3.661 | tail 0.898 | cadence 1.53x
#
#    Read together, three wordings put the action in three different places and
#    ALL THREE END THE SAME WAY: the head is buried by frame 26-45 and the last
#    two thirds of the clip are one held pose. Note also that "tail" here is NOT
#    a stillness figure -- arm 1 and arm 2 read tail 1.585/1.616 against bodies of
#    0.740/2.931 because the frame creeps inward the whole way. The number cannot
#    see the difference between a body moving and a camera drifting, which is why
#    the frames decide.
#
# 3. WHAT IS BEING TESTED HERE, AND WHY IT IS ONE VARIABLE.
#    THE HYPOTHESIS: the freeze is the model COMPLETING A TERMINAL ACTION and then
#    holding its end state. "Lowers his head until his face is hidden" has an end
#    state written into it, and so does every clause we have tried; the model
#    reaches that state as fast as it can and stops, which is the same failure
#    beat 17 hit when "pushes himself up to standing" rendered as a man already
#    standing. An action with NO end state cannot complete.
#
#    The leading state tag is carried over WORD FOR WORD from arm 2. The only
#    difference is that arm 2's terminal action clause becomes a cyclical one:
#
#      arm 2:  "sitting on grass, knees up, arms around knees. He lowers his head
#               until his face is hidden behind his knees."
#      arm 4:  "sitting on grass, knees up, arms around knees. He rocks slowly
#               forward and back."
#
#    Recipe untouched and not under test: 704x1280, 97 frames, 24fps, two-stage
#    8@352x640 + 3@704x1280, distilled sigmas, image-crf 33, guidance 2.0,
#    sequential offload. No parameter change has ever improved motion here and no
#    parameter is being changed.
#
# 4. THE PREDICTION, WRITTEN BEFORE THE FRAMES ARE LOOKED AT.
#    If the terminal-action hypothesis is right, the figure is still moving after
#    frame 64 and the last third is not one held pose. IF HE ROCKS ONCE AND STOPS,
#    the cyclical clause is not a lever either -- three wording levers in a row
#    will have failed to buy duration on this beat, and the honest conclusion is
#    that beat 13's duration problem is NOT a wording problem. That gets reported
#    as loudly as a win. A third outcome is live: "rocks" on a figure this small
#    may read as a wobble or a lurch rather than as acting, which would be worse
#    than a freeze.
#
#    The cost of this arm is that the script's own action -- the head going down
#    into the shade -- is not asked for. That is deliberate: the plate is ALREADY
#    the folded pose the line describes, so the head-down is the only terminal
#    move left in the beat and it is exactly the move that keeps completing.
#
#    THIS IS ONE RENDER. Nothing scales off it until it has been looked at, and
#    the second seed does not go in until this one has.
#
# 5. SCORING. OPEN THE FRAMES. Where is the head at 0, 32, 64, 96, and does
