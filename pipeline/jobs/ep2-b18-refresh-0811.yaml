# Beat 18 THE DECISION refresh, derived from the b11 skeleton at 2026-08-12 ~01:4x.
# The 0811 date in the id is the lane's, not the clock's; the sibling refresh ids
# all carry it.
#
# NOT TO BE CONFUSED WITH `pipeline/jobs/ep2-b18-265f-fullanchor-0811.yaml`, which
# is a different job on the same beat and is not touched by this one. That is an
# LTX-2.3 video job — it re-renders the 6-second clip at 265 frames off an
# existing plate to stop it looping under its line. This is a four-seed SDXL STILL
# round in the wave harness, against the eight still candidates on the picking
# page. Different renderer, different output directory, different question.
#
# BEAT 18 HAD NO BLOCK IN wave-drafts.yaml UNTIL THIS JOB WAS WRITTEN — the same
# reason beats 13 and 21 were skipped by tonight's twenty refresh rounds, which
# covered every beat that had one. Beat 16 stays out on purpose; it waits on the
# goblin being drawn into the plate, which is his call.
#
# ── NO FOUNDER WORDS ON THIS BEAT, AND THAT IS SAID PLAINLY ───────────────────
# Beat 18's only recorded verdict is the steward's: "Provisional pick r3-s0, the
# steward's guess, logged 2026-08-09 at 0.45 confidence. Waiting on you; not a
# decision." He has spoken on beats 01, 13, 15 and 16 and not on this one. Nothing
# below is his and nothing below is presented as his.
#
# ── WHAT THE EIGHT FRAMES ON DISK SHOW, READ BEFORE THE FIX WAS WRITTEN ───────
# `review/ep2-picks/sheets/b18.jpg` opened and looked at, r1 and r3, all eight:
#   * TWO FRUITS IN THREE OF EIGHT. r1-s2 is a matched pair of dark red spheres,
#     r3-s1 hangs a second fruit below the first, r3-s2 puts a big one and a small
#     one in the same frame. The line this beat plays under is "One fruit —
#     everything I own." A second fruit does not weaken the shot, it deletes the
#     story.
#   * r1-s1 HAS A GIRL IN IT — a white-haired anime face, blushing, filling the
#     top half of a beat whose entire subject is a piece of fruit.
#   * r3-s1 DRAWS TWO EYES ON THE FRUIT. The fig became a character.
#   * THE FRUIT IS AN APPLE IN SIX OF EIGHT — big, glossy, hard-shouldered,
#     orange-red in r1 and green in r3 — hanging off a THICK DARK WOODY LIMB that
#     belongs to a mature tree. This beat is the thinnest branch of a tiny sapling.
#   * r3-s3 is a pale yellow-white fruit: the `no white fruit, no pale fruit` case
#     the b01 inpaint lane's r2 negative was written for.
#   * FAINT WHITE DASHED SKETCH MARKS rim the fruit in four of eight. That is not
#     a new observation — shots.md already records it for this beat as "a flourish
#     this wave added that nothing else in the show has", and it is why the picker
#     marked 18 down on style. It has never been sent a term until now.
#
# ── THE FIX, AND WHAT EACH TERM IS AIMED AT ───────────────────────────────────
#  1. THE SECOND FRUIT. `the only fruit in frame` affirmatively plus `no second
#     fruit`. The affirmative alone is not trusted here: an apple-tree branch with
#     two apples on it is about as strong as a checkpoint prior gets, and the guard
#     beats taught that a strong prior needs both channels.
#  2. THE APPLE. `no apple, no red fruit` beside shots.md's own `small round green`
#     fig, plus the two terms the fig beats always carry, `no white fruit, no pale
#     fruit`.
#  3. THE BRANCH. `no thick branch`. The scale negatives already append on their
#     own — `tiny` and `sapling` fire `sd_prompt._SMALL`, which sends `mature tree,
#     large tree, thick trunk, full canopy` — but the limb, not the tree, is what
#     six of eight frames drew wrong, and none of those four terms names it.
#  4. THE PEOPLE. `no face, no girl, no child`. NOT `no boy` and NOT `no person`:
#     check() faults on those unconditionally ("peopled beat negates its own
#     subject"), a rule written for the fifteen goblin beats. So this beat renders
#     with a weaker people-defence than a plant-only plate would normally use, and
#     that is a real and stated cost of borrowing this harness — the same cost beat
#     01 pays. `no face` also answers the eyes on the fruit.
#  5. THE SKETCH MARKS. `no sketch lines, no dashed outline`. Small stated risk:
#     these are the only two terms in this round aimed at a STYLE artifact rather
#     than at content, and if the linework comes back soft or unfinished they are
#     the first two to drop.
#
# NO DARK BAN, AND THIS IS THE `unless the beat stages otherwise` CASE. The
# staging is `warm amber afternoon light against a soft wash sky` and all eight
# frames came back warm and bright. There is no darkness fault to answer, and `no
# dusk, no sunset` would fight amber afternoon light rather than sharpen it — the
# opposite of beat 17, where afternoon is affirmed against frames that actually
# arrived at twilight.
#
# `kind: guard` IS A HARNESS TOKEN AND NOT A CLAIM ABOUT THE PICTURE, exactly as
# beat 01's block says. There are no guards in beat 18 and no goblin either; there
# is no character at all. `guard` is the only kind render_wave_sample.py:193
# accepts without a {{GOBLIN}} marker, and its `extra_neg: guard` tier sends
# neither the fusion tags nor the species tags — right here, since a collision
# needs two bodies and this frame has none. That saving is what pays for the six
# fruit-and-style terms above.
#
# ── MEASURED ON THE BOX'S REAL CLIP TOKENIZER, FIRST DRAFT, NO REFUSALS ───────
# `--dry` on the box, quoted rather than summarised:
#   positive tokens (real CLIP): 64/77   STYLE ANCHOR PRESENT: True
#   count tag: '' (draft declares '')            'text' negated: True
#   negative: recipe 76 -> sent 73       DRY OK, no faults
# NEGWARN, recorded rather than buried: five house terms are dropped to make room
# — realistic skin texture, jpeg artifacts, deformed, extra limbs, blurry. Exactly
# the trade the beat-08, beat-09 and beat-11 refreshes made. On a macro frame with
# no anatomy in it, `extra limbs` and `deformed` are the cheapest five this file
# has ever given up.
#
# WHY THIS IS ONE SAMPLE AND NOT A BATCH. CLAUDE.md, founder 2026-08-03: one
# sample per recipe change. One recipe change, one beat, four seeds.
#
# SEPARATE OUT DIRECTORY: the harness names files from the beat slug, so this
# writes to `out-b18-refresh` and overwrites neither r1 nor r3.

