why: 'RUNG k6d: k5a''s frozen recipe with the ADAPTER WEIGHT changed to ip-adapter-plus-face_sdxl_vit-h,
  at head share 0.50 of the square canvas (24.5% of the encoder''s pixels).


  WHAT THE SEVEN SQUARE POINTS SETTLED, AND WHY AN EIGHTH IS NOT THE ANSWER. The reference-framing axis
  is fully characterised and it has NO WINDOW. The EYE is best at 25% coverage -- k5a came back at 1.26x
  the tile''s relative bounding box with aspect 0.53 against the tile''s 0.52 and area 0.0171, the first
  rung in the entire ladder to pass the 0.030 clause, and 0.0235 even at the disclosure threshold 170
  so it is not a shading artifact. The MOUTH is only drawn from 30% up -- ink 447, 471, 473 across 30/45/60/75%,
  collapsing to 210 at 25% and 312 at 20%, which at 1:1 and at contrast x2.6 on a blank lower face is
  NOT A THIN MOUTH BUT NONE. k4a at 30% is the lowest rung that keeps the mouth and its eye is 1.41x,
  which is what j2 draws with no adapter at all.


  TWO HALVES OF ONE FACE, TWO OPTIMA, ONE DIAL. That is a statement about the INSTRUMENT and not about
  the value, so the instrument is what changes. ip-adapter-plus-face_sdxl_vit-h is trained for exactly
  the regime where the presences drop out: a face that must survive a small share of the reference. It
  is the same repo, the same apache-2.0 terms, the same ViT-H encoder and the same 847,517,512 bytes as
  the incumbent -- only the digest separates them, which is why the driver now carries an IP_WEIGHTS allowlist
  keyed by filename and refuses an unlisted weight before a model loads.


  THE COVERAGE WALK IS PART OF THE INSTRUMENT TEST AND NOT A SECOND VARIABLE. The defect being aimed at
  is coverage-dependent by construction, so a single point could not tell ''the face adapter keeps the
  mouth'' from ''this point happens to''. The four points bracket the 30% floor on both sides: 20 and
  25 are k5b''s and k5a''s OWN references reused digest-identical, which makes k6a/k6b a clean A/B on
  the weight with the reference held; 35 and 50 are new, above the floor where the incumbent kept the
  mouth and lost the eye.'
