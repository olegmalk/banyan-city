bar: "EVERY CLAUSE k5a PASSED, HELD, PLUS THE ONE IT FAILED ON. k5a is\nthe incumbent -- the best face\
  \ this tree has measured -- and this rung replaces\nit or it does not ship. A regression on any held\
  \ clause is a FAIL even if P3\npasses, because a mouth on a worse face is not progress.\nRuler: pipeline/measure_face_eye_0821.py,\
  \ whose --selftest reproduces the\npublished f/g/h numbers before it is allowed to produce a new one.\n\
  \  READ THE RULER'S KNOWN ARTIFACT BEFORE QUOTING IT. Its WHITE_MIN is 190 and\n  a dimmer cream eye\
  \ falls under it, so the AREA column can read 0.0040 on a\n  face with two plain eyes. The threshold\
  \ is calibrated against five published\n  rungs and IS NOT MOVED to flatter a sixth. THE BOUNDING-BOX\
  \ COLUMN IS WHAT\n  THIS BAR IS SCORED ON, and any area figure is quoted at both 190 and 170\n  with\
  \ the pair shown.\nTHE CLAUSE THIS RUNG EXISTS FOR:\n  P3  A MOUTH. A line, however thin -- the wording\
  \ the curation file used\n      after n1: \"a line, however thin. n1 has NONE -- absent, not thin.\"\
  \n      Judged BY EYE at 1:1 on the lower face and again at contrast x2.6,\n      which is how k5a's\
  \ absence was confirmed. Mouth ink corroborates and\n      does not decide: 447/471/473 at 30/45/60/75%,\
  \ 210 at 25%, 312 at 20%.\nTHE SIZE CLAUSES, unchanged, because they are what k5a already passed:\n\
  \  T1b SHAPE -- per-eye aspect (h/w). TILE 0.52; k5a 0.53. Hold it.\n      SIZE -- eye bounding box\
  \ relative to the head box, against the tile.\n      j2 1.40x with NO adapter, k4a 1.41x, k5a 1.26x.\
  \ PASS is 1.4x or lower,\n      and k5a's 1.26x is the number to beat.\n  T8  4.5+ heads. k5a 5.31,\
  \ k4a 5.13. Scored first.\nTHE CREATURE-FEATURE CLAUSES, still live because a new weight can reopen\
  \ them:\n  NO HORNS. No spike, prong, antler or protrusion off the skull. Only k3 --\n      the amputated\
  \ portrait reference -- ever grew them, and k5b at 3.9%\n      coverage on a square canvas did not,\
  \ so the cut reading is tested. A\n      horn HERE would falsify it. Judged BY EYE at 1:1.\n  NO COWL.\
  \ The tile's purple cowl-scarf must not appear at the neck.\nHELD FROM k5a: T1 no iris and no pupil,\
  \ T2 no nose bridge, T3 no age\nmodelling, P1 the brow bar with skin between it and the eye (a lash\
  \ arc welded\nto the rim is an eyelid and does not count), P2 muzzle, P4 facial shading,\nplus the standing\
  \ pose, the patchwork cloak and the tall grass -- the whole\ncontainment. A PORTRAIT COMPOSITION IS\
  \ A CONTAINMENT FAIL: this weight is\ntrained on face crops and the frame is a full-body standing shot.\n\
  AND ONE MECHANICAL CLAUSE, because the two adapters are the same 847,517,512\nbytes: the sidecar's ip_adapter_weight\
  \ line must name\nip-adapter-plus-face_sdxl_vit-h.safetensors and its licence line must carry\nsha256\
  \ 677ad886...92c1. A frame that rendered on the incumbent weight is not\nthis rung no matter how it\
  \ looks."
failure_predicted_in_advance: 'THE LIKELIEST WAY THIS DISAPPOINTS, and it is not the mouth. The face adapter
  is a stronger identity channel on the FACE region specifically, and the tile''s face is the thing whose
  eye is 1.87x too big when it transfers at full strength (k1). So the mouth may well arrive at 20-25%%
  coverage AND BRING k1''S EYE WITH IT -- presences restored, T1b lost, which is the same trade the coverage
  axis already refused. If that is what the band shows, the face adapter is not a fix, it is the same
  tradeoff on a different dial, and --ip-scale below 0.7 becomes the honest next question rather than
  a fifth coverage point.


  THE SECOND FAILURE MODE IS THE CONTAINMENT. This weight is trained on face crops, and every rung since
  k1 has been scored on the goblin STAYING a standing full-body figure in a patchwork cloak in tall grass
  inside a head-box mask. A portrait composition, a seated figure or the purple cowl returning is a FAIL
  on containment no matter what the face looks like, and it would mean the mask -- not the weight -- is
  the next instrument.


  THE THIRD, and it is the one that would close the route: horns. Every square rung has been horn-free,
  k5b at 3.9%% coverage included, so the cut hypothesis is tested and standing. A horn on a square canvas
  from a DIFFERENT ADAPTER would say the horn is a property of weak face conditioning after all and not
  of the crop -- which would falsify the k4 reading and put both this route and k4a''s fallback in doubt.


  IF NO RUNG PASSES: the honest consequence is that the eye and the presences cannot both be had from
  a reference channel at all, and what is left is R4 -- accept k4a''s 1.41x eye with the mouth present
  and treat the eye as a defect the LoRA is not asked to fix. That is a change to what the character LOOKS
  LIKE, which belongs to the author and not to this lane. It goes on the board as an option with pixels,
  not as a decision.'
ip_adapter:
  ref: farm-out/jerry-skel-assets-0820/jerry-tile-sq50-0821.png
  ref_sha256: 8c6de1bc776f4f89f0f14145a03973cdfb7c1ccb04de655faba273c8cd363cf8
  ref_provenance: 'the SAME head crop and the same flooded field green as k3''s reference, on a SQUARE
    448x448 canvas with the head at 0.50 of frame, CENTRED on both axes. Square because diffusers builds
    CLIPImageProcessor() with no arguments and its defaults resize the SHORT edge to 224 and then CENTRE
    CROP to a square: on a square canvas that crop is a NO-OP, so the authored ratio is the ratio encoded.
    The subject reaches the encoder INTACT at 24.5% of its pixels. k3''s 416x608 portrait lost the top
    30% of its subject -- the whole cranial dome -- and delivered 5.4%. Built by pipeline/author_jerry_squareref_0821.py;
    evidence review/ep2-goblin-design-0819/CLIP-STARVE-0821.png; sources pipeline/research/ipa-ref-framing-0821.md.'
  mask: 315,130,515,350
  mask_frame: RENDER pixels, 832x1216
  scale: '0.7'
  weights: h94/IP-Adapter sdxl_models/ip-adapter-plus-face_sdxl_vit-h.safetensors, apache-2.0, sha256
    677ad8860204f7d0bfba12d29e6c31ded9beefdf3e4bbd102518357d31a292c1, 847,517,512 bytes, fetched and digest-verified
    on the box by ep2-ipa-facewt-fetch-0821 (rc=0, snapshot 018e4027, encoder image_size 224 / patch 14
