one_sample_rule: 'ONE BATCH OF FOUR, filed after every one of k1, k2, k3, k4a-d, k5a and k5b was rendered,
  measured and read at 1:1 -- fourteen rungs of looking before this recipe changed. THE RECIPE CHANGE
  IS ONE THING: the adapter weight. Everything the seven square rungs held constant is still constant,
  and two of the four references are the previous rungs'' own files byte-for-byte.


  WHY FOUR AND NOT ONE. The one-sample rule exists so a recipe is not scaled before it is seen, and nothing
  here is being scaled: no dataset grows, no beat plate is rendered, no pose set is produced, the gate
  stays shut. Four diagnostic points on a characterised axis is the same shape as the k4 band that closed
  the horn question, and the axis is exactly the one on which the defect is known to move -- a single
  point would be unreadable against seven measured incumbents. Est 16 GPU-minutes total.


  AND THE PHYSICAL DEPENDENCY WAS CLEARED FIRST, NOT ASSUMED: ep2-ipa-facewt-fetch-0821 fetched the weight,
  asserted its digest against the incumbent''s (identical sizes, different shas), asserted the incumbent
  is still resolvable in the same snapshot so k4a stays re-renderable, and exited rc=0 before this batch
  was authored.'
the_one_variable: 'k5a''s frozen recipe with --ip-weight swapped from ip-adapter-plus_sdxl_vit-h to ip-adapter-plus-FACE_sdxl_vit-h,
  and the reference head share at 0.50 of the square canvas (24.5% of the encoder''s pixels). THE ADAPTER
  IS THE VARIABLE; the coverage walk is the axis it is being read against, because the defect this instrument
  is aimed at is itself coverage-dependent and one point could not separate a fixed adapter from a lucky
  point. Everything else is k5a''s byte-for-byte: 832x1216, seed 20260823, h19 skeleton at --scale 1.0,
  j2''s prompt and negative, mask 315,130,515,350, --ip-scale 0.7, the same head crop on the same flooded
  field green. k6a and k6b reuse k5b and k5a''s OWN reference files, digest-identical, so those two pairs
  are a clean A/B on the weight alone.'
