  the control's sha is compared against it. NOTHING SCALES OFF THIS. One sample per recipe change.
why: 'STG is the only motion lever a Lightricks person has ever named for this exact symptom -- ybitterman (COLLABORATOR,
  an LTX-Video paper author) answered ''how to increase the motion size of the generated video?'' with ''Playing
  with the STG blocks will help with that'' (github.com/Lightricks/LTX-Video/issues/184). The official ltxv-13b-0.9.8-distilled
  config sets stg_scale 0 in both passes while the dev config schedules it to 4, and the STG paper''s abstract says
  CFG-family guidance ''reduce[s] diversity and motion''. It is reachable from our call path (stg_scale line 883
  of the installed pipeline_ltx2_image2video.py) and we have never passed it. Cost: one extra transformer forward
  per step. $0, local card, no provider.'
