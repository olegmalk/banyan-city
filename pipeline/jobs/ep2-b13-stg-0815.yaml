  BIT-IDENTICAL from frame 62 to 96 and no beat-13 arm has produced a figure still acting after frame 64. Both arms
  get a frame alignment; where each one goes bit-identical is reported, and a period that improves while the clip
  still dies at f62 is a PARTIAL result. (3) IS THE DEFAULT PATH UNCHANGED? The control arm is a byte-for-byte re-run
