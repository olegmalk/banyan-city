    """Stamp the clip's provenance sidecar as unapproved and provisional.
    video_task.write_sidecar records model, prompt, negative, init sha and
    cost_usd 0, and it does not record whether the clip may ship. Nothing this
    lane publishes may read as picked, so the keys are written on the artifact
    itself rather than asserted in a commit message nobody downstream reads.
    REFUSES if the sidecar is missing -- a clip whose provenance file did not
    get written must not pass silently.
    """
    import os, sys
    META = sys.argv[1]
    if not os.path.isfile(META):
        sys.exit("!! no sidecar at %s -- refusing to call the job clean." % META)
    with open(META, "a", encoding="utf-8", newline="\n") as fh:
        fh.write(
