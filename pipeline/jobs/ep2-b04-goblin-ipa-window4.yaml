# 002b beat 04 — ARM 5. The arm-3 window held FIXED at 15% and swept across all
# four references instead of one. This is arm 3's own stated next step and the
# only thing that turns its result into a claim about a mechanism.
#
# THE VERDICT THIS ANSWERS TO. Roman, 2026-08-10 ~15:00: "the goblin needs abit
# more regeneration." Ledger ep2-goblin-regen-directive-0810. A reject and a
# direction to iterate. Nothing here picks, ranks or promotes a frame.
#
# WHAT ARM 3 FOUND, ON ONE REFERENCE. Sweeping WHEN the adapter is applied, on
# reference s0 at scale 0.6: green returns monotonically as the window shortens
# — green_share 0.034 at 60% of the 40 steps, 0.040 at 40%, 0.192 at 25%, 0.335
# at 15%, against the tags-only baseline's 0.363 and arm 1's 0.012 — and by eye
# the four seeds at 15% are still ONE creature where the baseline is four. The
# two costs that arms 1 and 2 traded against each other came apart. That is what
# a structure-early / colour-late account of the denoise predicts, and it is the
# first result in this lane that is not a trade.
#
# WHY IT IS NOT YET A MECHANISM, AND WHY THIS JOB EXISTS. Every arm-3 cell used
# reference s0. One reference cannot separate "the window works" from "the
# window works on s0", and s0 is a peculiar reference: record
# ep2-b04-goblin-ipa-observed established it is the ONE baseline frame with a
# closed frown and no tusks, which is exactly why arm 3 chose it as a readout.
# Generalising from it alone would be the same shape of error the DINO metric
# made twice on this beat. Four references, one window, one variable.
#
# THE r0 CELL IS A DELIBERATE REPEAT of an already-rendered arm-3 cell at
# identical config, seeds, prompt and window. It should come back byte-identical
# to C:\banyan-farm\goblin-ipa-0810\out3\04-the-footnote-ipa-r0-w015-s*.png. If
# it does not, determinism on this card is a larger problem than the goblin and
# every A/B in this lane is weaker than it reads. Costs four frames to know.
#
# STILL ZERO PROMPT TOKENS. Nothing is added to the description of the goblin,
# so nothing here spends "nothing complex".
#
# LICENCES. Nothing new: animagine-xl-3.1 (CreativeML Open RAIL++-M, D15 open),
# h94/IP-Adapter Plus SDXL (Apache-2.0), ViT-H image encoder (MIT-derived),
# diffusers 0.29.2 (Apache-2.0). All in the box cache; nothing spent.

id: ep2-b04-goblin-ipa-window4
task: ep2-b04-goblin-ipa-window4-0810
node: 002b-first-citizen
beat: 4
runner: box
needs_gpu: true
priority: 42
max_attempts: 1
owner: goblin-regen lane

consumer: >-
  Whether the step window is a property of IP-Adapter on this beat or a property
  of one reference frame. If green returns and identity holds on all four, the
  finding to take to the founder is a mechanism — one goblin per beat without
  losing the colour he named — and the next question becomes whether it survives
  a DIFFERENT beat, which is a separate job and is not queued. If it holds only
  on s0, arm 3's result is an artifact and says so.

success: >-
  16 PNGs at C:\banyan-farm\goblin-ipa-0810\out5 with per-frame 7.2 sidecars,
  plus identity-agreement-window4.yaml measuring the baseline, the four arm-1
  controls and these four on one build of one metric. A result showing the
  window works only on s0 is a success: the job produces the measurement.

metric_warning: >-
  DINOv2 seed agreement is unreliable on beat 04 (724b616, 93356b1 — on a face
  close-up against a constant background it is largely scoring the background)
  and no arm may be ranked by it. Run for series continuity only; the read is by
  eye, at mouth-level zoom for the tusks.

why: >-
  One variable against arm 3: the reference. Window fixed at 15% of 40 steps
  (6 steps), scale fixed at 0.6, references s0 through s3. Sequential, one image
  at a time — batch-of-4 configs are banned on this card.

