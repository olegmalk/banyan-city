  - --ref-for
  - arm5-ref2-window015=C:\banyan-farm\wave-goblin-prep\out\04-the-footnote-wave1-s2.png
  - --ref-for
  - arm5-ref3-window015=C:\banyan-farm\wave-goblin-prep\out\04-the-footnote-wave1-s3.png
  - --out
  - C:\banyan-farm\goblin-ipa-0810\out5\identity-agreement-window4.yaml

- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b04-goblin-ipa-window4"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/goblin-ipa-0810/out5/*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b04-goblin-ipa-window4.sha256"), "w") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    # 16 stills + 16 sidecars + identity-agreement-window4.yaml.
    raise SystemExit(0 if len(src) == 33 else 1)

