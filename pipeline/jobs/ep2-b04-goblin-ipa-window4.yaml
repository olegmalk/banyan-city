# The determinism check, run BEFORE the metric so a nondeterministic card is
# reported even if the measure step falls over. allow_fail so a mismatch is
# recorded in the log rather than retiring the job's output.
- name: repeat-check
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    import hashlib, pathlib
    a = pathlib.Path("C:/banyan-farm/goblin-ipa-0810/out3")
    b = pathlib.Path("C:/banyan-farm/goblin-ipa-0810/out5")
    same = diff = 0
    for s in range(4):
        n = "04-the-footnote-ipa-r0-w015-s%d.png" % s
        pa, pb = a / n, b / n
        if not (pa.exists() and pb.exists()):
            print("MISSING", n); diff += 1; continue
        ha = hashlib.sha256(pa.read_bytes()).hexdigest()
        hb = hashlib.sha256(pb.read_bytes()).hexdigest()
        print(("SAME  " if ha == hb else "DIFFER"), n, ha[:16], hb[:16])
        same += ha == hb
        diff += ha != hb
    print("determinism: %d byte-identical, %d differing" % (same, diff))

- name: measure
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\wave-goblin-prep\identity_agreement.py
  - --group
  - wave1-baseline=C:\banyan-farm\wave-goblin-prep\out\04-the-footnote-wave1-s*.png
