    # like a render failure.
    import glob, hashlib, os, shutil
    out_dir = "C:/banyan-farm/ep2-b17-insert-motion-0816-out"
    pay_dir = "C:/banyan-farm/ep2-b17-insert-motion-0816"
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b17-insert-motion-0816"
