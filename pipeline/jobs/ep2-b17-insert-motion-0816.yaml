# 2026-08-16, THE TIGHT-INSERT LANE. ONE SAMPLE. ONE VARIABLE: SIZE IN FRAME.
# ENGINE PROBE, NOT A TAKE FOR THE CUT -- see script_authority below.
#
# ============================================================================
# WHAT IS ALREADY SETTLED. NONE OF IT IS RE-DERIVED HERE.
# ============================================================================
# Three independent lines converged this week on one explanation for two days
# of failed motion work:
#
#  1. WHOLE-BODY MOTION RENDERS RELIABLY. Twelve beat-17 cells, judged against
#     a bar written BEFORE the renders: 12 of 12 perform a full seated-to-
#     standing stand-up, head-top rise 29.2%-39.7% of frame height. The
#     colour-segmentation tool was falsified by overlaying its own mask back
#     onto the frames, which caught sky speckle silently scoring three complete
#     stand-ups as "no movement". The horizon holds fixed while he rises, so it
#     is the body and not the camera.
#  2. SMALL IN-HAND ACTIONS NEVER RENDER, ON THAT SAME PLATE. amp-brush and
#     amp-brushseat, same seed 20260901, byte-identical otherwise, FROZE
#     COMPLETELY -- hands clasped on the knee unchanged f0->f96 -- while the
#     clouds, the eyelids and a bird moved.
#  3. BOTH AT ONCE, INSIDE SINGLE CLIPS. All four beat-17 `full` cells audited
#     frame by frame, all 97 frames each: 4 of 4 perform the stand and the
#     turn, 0 of 4 brush the cloak. The arms unfold and drop to the sides or
#     the hands rest on knees. One cell has cloak CONTACT WITHOUT TRAVERSAL --
#     drape and body rotation, not a stroke.
#
# THE EXPLANATION: this engine renders GROSS whole-body motion and DROPS SMALL
# IN-HAND ACTIONS. It also fits beats 06, 08 and 10, which have failed every
# wording, strength, seed, recipe and composition lever -- all three ask for a
# small in-hand prop manipulation.
#
# ============================================================================
# THE ONE THING THIS JOB TESTS
# ============================================================================
# FRAME THE ACTION SO THAT IT IS THE LARGEST MOVEMENT IN FRAME. The model
# renders big motion, so make the brush big -- not a figure in a landscape
# performing a small gesture, but a tight insert where the hand and the cloak
# are the whole picture and the hand's travel across the cloth is the only
# thing in frame large enough to be the shot's motion.
#
# THE COMPARISON IS DELIBERATELY NARROW. Against ep2-b17-amp-brush-0816, which
# froze: same seed 20260901, same negative byte for byte, same style suffix
# byte for byte, same 704x1280 / 97 frames / 24fps / two-stage 8@352x640 +
# 3@704x1280 / distilled sigmas / image-crf 33 / guidance 2.0 / sequential
# offload. THE PLATE IS THE VARIABLE. Stated honestly rather than glossed:
# TWO WORDS also differ -- amp-brush said "with both hands", this says "with
# his hand" -- and that delta is FORCED BY THE PICTURE, because the insert has
# one hand in frame and asking a one-hand plate for both hands is asking for a
# second arm to be invented. It is named here so nobody later reads this as a
# perfectly single-variable A/B; the framing is the variable of interest and
# the wording follows the plate it describes.
#
# NOT SWEPT, BY INSTRUCTION: guidance, CFG and checkpoint belong to another
# lane and every render flag below is the fixed production recipe.
#
# ============================================================================
# THE BAR, PRE-REGISTERED IN COMMIT 6625840b BEFORE THE PLATE WAS DRAWN
# ============================================================================
# Copied here verbatim from pipeline/plate_scratch.py DRAFTS[17], which was
# committed and pushed before a single pixel existed. It is a BODY-MOTION
# test, not a picture-changed test, and it does not get rewritten afterwards.
#
#   PASS requires ALL of:
#     M1 a hand is in contact with the cloak in at least one frame;
#     M2 that hand TRAVELS across the fabric while in contact -- its position
#        relative to the cloth moves at least one hand-width (~15% of frame
#        width) between two frames of the clip;
#     M3 it is the HAND moving and not the camera: the frame edges and the
#        cloth's own folds do not translate with it;
#     M4 the path is continuous -- read at consecutive frames, the hand can be
#        followed from where it starts to where it ends.
#
#   FAIL MODES, NAMED IN ADVANCE:
#     F1 FROZEN -- identical hand position at f0 and f96, only the linework
#        re-inked in place. Round 1's exact signature.
#     F2 CLOTH-ONLY -- the fabric ripples or blows and the hand does not move
#        relative to it.
#     F3 CAMERA-ONLY -- the whole frame drifts, pushes in or zooms and hand
#        and cloth keep the same relative geometry.
#     F4 MORPH -- the hand dissolves, gains or loses fingers, or reappears
#        somewhere else without a continuous path. A teleport is not a stroke.
#     F5 SCENE BREAK -- the shot cuts, pulls back to a figure, changes
#        location, or a second figure arrives.
#     F6 CONTACT WITHOUT TRAVERSAL -- the hand touches and the cloth drapes or
#        rotates under it but the hand does not travel. EXPLICITLY A FAIL: one
#        of the four `full` cells already did exactly that, and calling it a
#        pass is how a bar gets bent.
#
#   NOT EVIDENCE, AND NONE OF IT WILL BE QUOTED. `depth` is RETIRED AND
#   INVERTED, confirmed three ways: full stand-up 0.290, zero-motion clip
#   0.516, a clip whose only movement was a bird 0.376. The old `cadence`
#   metric is structurally blind -- odd hold periods alias to exactly 1.00x.
#   Camera-scale numbers are unreliable without aligned frames. All 97 frames
#   get opened CONSECUTIVELY via pipeline/coldread_frames.py, cropped to the
#   hand and the cloth, and any tool used gets its own output overlaid back
#   onto the frames before it is believed -- that overlay is what turned
#   9-of-12 into 12-of-12.
#
# BOTH OUTCOMES ARE THE FINDING. A pass says size-in-frame IS the lever, which
# unlocks beat 17's brush and re-opens beats 06/08/10 as inserts -- and this
# lane then SAYS SO AND STOPS, because splitting beat 17 into two shots and
# re-planning three more is an authorship decision. A fail says size-in-frame
# is NOT the lever and the engine simply cannot do fine hand action, which
# changes what episode 2 can contain.
#
# ============================================================================
# GUARDS
# ============================================================================
# --src is the PUBLISHED plate on origin/farm-results-rtx5090, produced by
# ep2-b17-insert-plate-0816 whose spec is in pipeline/jobs and which names no
# --refs, so the plate check and the refs check both RUN and both PASS.
