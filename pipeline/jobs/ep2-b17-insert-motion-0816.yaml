    #!/usr/bin/env python3
    """Stamp the clip's provenance sidecar as an unapproved engine probe.

    video_task.write_sidecar records model, prompt, negative, init sha and
    cost_usd 0, and it does not record whether the clip may ship. This lane's
    standing requirement is that anything it publishes says so on its face, so
    the three keys are appended here rather than asserted in a commit message
    nobody downstream reads. REFUSES if the sidecar is missing -- a clip whose
    provenance file did not get written must not pass silently.
    """
    import os, sys

    META = sys.argv[1]
    if not os.path.isfile(META):
        sys.exit("!! no sidecar at %s -- refusing to call the job clean." % META)
    with open(META, "a", encoding="utf-8", newline="\n") as fh:
        fh.write(
            "# --- appended by ep2-b17-insert-motion-0816 after the render.\n"
            "approved: false\n"
            "provisional: true\n"
            "is_show_content: false\n"
            "note: |\n"
            "  ENGINE PROBE, NOT A TAKE FOR THE CUT. This clip exists to test one\n"
            "  composition principle -- frame the action so that it IS the largest\n"
            "  movement in frame -- on a tight insert plate drawn for the test. Its\n"
            "  action clause is not beat 17's scripted line as staged, and splitting\n"
            "  beat 17 into two shots is an authorship decision no lane has taken.\n"
            "  It must never be picked into an episode.\n")
    print("stamped %s" % META, flush=True)
