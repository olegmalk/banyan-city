verdict_this_job_measured:
  the_crf_ruling_is_confirmed_AT_ITS_SOURCE: 'THE STRONGEST NUMBER IN THIS
    JUDGEMENT, and it needed no render at all. Both takes write the conditioning
    image they actually feed the model (cond-crf-17.png); measured against the true
    init, crf 33 puts 29.40% of the plate''s pixels off by more than 8 levels
    (mean 5.28, p99 40, max 166) while crf 10 puts 7.13% (mean 2.16, p99 15, max
    65). The corruption the 2026-08-19 ruling was made on is real, is 2.4x worse in
    the mean, and affects 4x as many pixels. Independent of any bar.'
  fidelity_first_frame: 'BETTER, which is the clause this job exists for. Mean |RGB|
    of the decoded first frame from the init: 5.54 against the original''s 6.42, a
    14% reduction. Worth stating plainly for calibration: a 2.4x cleaner
    conditioning image buys only a 14% closer first frame, because the diffusion
    process, not the encode, dominates what f000 becomes.'
  p1_plate_fidelity: 'PASS, both ceilings cleared with room. f008 = 12.21 (ceiling
    40), f096 = 25.32 (ceiling 55). The original reads 12.54 and 24.61 on the same
    instrument -- so f008 is slightly better and f096 slightly worse, both far
    inside. Blue sky and green meadow intact end to end.'
  p2_garment_colour: 'PASS, AND NARROWLY, WHICH THE BAR REQUIRES BE SAID SEPARATELY.
    Median hue/sat of the pre-registered torso box (rows 30-55%, cols 35-65%, frames
    decoded at full size): f036 = RGB 57,47,81, hue 257.6 deg, sat 0.420; f060 = RGB
    51,59,106, hue 231.3 deg, sat 0.519. Both inside 180-260 deg at sat >= 0.40, so
    the clause passes. But f036 clears BOTH axes by a hair -- 2.4 deg from the hue
    edge and 0.020 above the saturation floor -- where the parent measured a
    comfortable 223.8 / 0.578 at the same frame. Looked at: the cloak is navy and
    patterned in both takes and does not go pink. The margin is a POSE difference,
    not a colour drift: at f036 this take has the cloak spread much wider, so the
    fixed box catches more of the dark open interior and its shadow. Recorded rather
    than explained away, because a clause that passes at 0.420 would fail on a
    slightly different frame choice.'
  s1_stand: 'PASS. Seated at idx0, crouched at idx8, upright from idx24.'
  s2_shake: 'PASS, and the cloak action is LARGER than the original''s. On one
    instrument applied identically to both (horizontal extent of the dark mass in the
