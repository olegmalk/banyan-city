verdict: >-
  THE END STATE PASSES AND THE CLIP CONTRADICTS A FOUNDER RULING TO REACH IT. beats.13.done_when
  is unusually explicit about scope: "he ends FOLDED SMALL in the sapling's shade, knees up ...
  The END STATE is what the beat needs; how he gets there is an author call, not a steward one."
  Scored that way and only that way: from f064 to f096 he IS folded small with his knees drawn
  up and his arms wrapped round his shins at the base of the trunk. Two of the three end-state
  terms are met. THE THIRD IS NOT, AND IT IS NOT A NEAR MISS: the thing he is sitting under is a
  MATURE TREE — a thick bark-textured trunk with a fork, running off the top of the frame at
  roughly four times his standing height — and the founder has ruled, in words this very
  `done_when` quotes, "thats ridiculous, lmao. the sapling is tiny". There is no sapling in this
  clip, so there is no sapling's shade for him to end in. Worse, the clip performs the exact
  action that ruling made unshootable: from f007 he stands, from f010 he rises astride the
  trunk, by f016 he is reduced to a single boot at the top edge, and he then climbs back DOWN
  it. `done_when` forbids a steward from scoring that journey and this verdict does not score
  it — but the tree it needs in order to happen is a canon object, and that is scored.
