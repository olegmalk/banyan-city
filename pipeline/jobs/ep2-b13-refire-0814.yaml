  identity_within_the_clip: >-
    PASS on what is visible. Whenever his face IS in frame — f000-f011 and f035-f096 — it is the
    same face: bald dome, wide pointed ears, the same dark eyes and thin mouth, the same pale
    sage shirt, dark trousers and brown boots. No morphology change and no costume swap. The
    continuity break here is absence, not drift.
verdict_the_most_useful_thing_this_read_found: >-
  THE BEAT'S REQUIRED END STATE IS ALREADY IN FRAME ZERO. At f000-f004, before any motion and
  before any tree exists, he is sitting on the grass with his knees drawn up and his arms wrapped
  round his shins — folded small, knees up. That is E1 and E2, satisfied by the INIT PLATE. The
  97 frames that follow are a round trip: away from the answer, up a mature tree that should not
  exist, out of the top of the frame, back down, and into the same pose he started in, followed
