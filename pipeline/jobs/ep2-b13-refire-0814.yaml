  final third genuinely shows the scavenger folded small under a plant, which is what a viewer
  needs from THE SHADE, and because the VO carries the beat. An assembly with a trim budget
  should know the shape precisely: f000-f011 is usable, f012-f034 has no face in it, f035-f062
  is the descent, and f063-f096 is one frozen picture of the correct pose. The cheapest edit in
  this beat is to drop the middle.
