    the cheapest unblocking item in this sweep, because one description would govern beats 03,
    12, 13, 15, 16, 19, 20 and 21 at once.
verdict_faults_against_standing_bars:
  the_subject_leaves_the_picture: >-
    HIS FACE IS OUT OF THE FRAME FOR TWENTY-THREE FRAMES, about one second, from roughly f012
    to f034. Read from the top-band crop, which is why it was made: at f012-f015 his head and
