  method: >-
    pipeline/coldread_frames.py --pad 60, 75 consecutive frames over four strips plus a
    16-frame overview, read consecutively per standard_0815.scoring_method. Then a 4x ffmpeg
    crop of the TOP 30% of frames f012-f023, because the question "is the subject still in the
    picture" cannot be answered off a full-frame thumbnail when the subject is one shoe. Then
    review/ep2-picks/exact_freeze_index.py and a parity-collapsed lag-4 series.
verdict_clauses:
  E1_he_ends_folded_small: >-
    PASS. f064 through f096: seated on the ground at the trunk's foot, knees drawn up to his
    chest, both arms wrapped round his shins, head tipped slightly down, occupying a small part
    of the lower-left frame. This is the pose the script describes and it is unmistakable.
  E2_knees_up: >-
    PASS. Both knees are up against his chest and held there for the whole final third.
  E3_in_the_saplings_shade: >-
    FAIL, and not on the shade's thinness — on the plant. There is no sapling in this clip at
    all. The trunk is mature: bark texture, a fork, a diameter comparable to his torso, and it
    exits the top of the frame so its canopy is never seen. What he sits in is the broad
    diagonal field shadow that crosses the whole picture from f000 onward, which is the same
    shadow that is there before any tree exists. The record's own beats.13.shipping_fault
    concedes "The shade is thin"; the reading here is stronger than that — it is not the
    sapling's shade, because there is no sapling.
  the_journey_clause_NOT_SCORED_and_why: >-
    DELIBERATELY UNSCORED. `done_when` says how he gets there "is an author call, not a steward
    one", so this lane does not fail the beat for the climb, does not fail it for the ascent
    order, and takes no position on whether a scavenger levitating up a trunk is acceptable
    staging. That is R4-adjacent and it is left alone. What IS scored below is different in
    kind: standing bars that apply to every beat regardless of staging, and one founder ruling
    about an object.
verdict_contradicts_a_founder_ruling:
  the_ruling: >-
    Quoted inside this beat's own done_when, and therefore known to every lane that has read
    it: "the founder has ruled the sapling is tiny — 'thats ridiculous, lmao. the sapling is
    tiny' — so there is no trunk to slide down."
  what_is_in_the_cut: >-
    A FULL MATURE TREE, and the slide down it. The trunk is absent at f000-f004; a thin stem
    appears at f005; by f010-f012 it has thickened into a bark-textured mature trunk with a
    fork, taller than the 1280px frame; the goblin rides it up and out of shot and then comes
    back down it. FIVE CONSECUTIVE CUTS HAVE SHIPPED THE SHOT THAT RULING SAYS CANNOT EXIST.
  why_this_is_the_loudest_of_the_three_ruling_contradictions_in_this_sweep: >-
    Beats 05 and 10 contradict the frozen guard wardrobe, which is a costume matter on two
    characters. This one is THE PLANT, and the plant is what episode 2 is about. It is also the
    third beat in this sweep whose plant is wrong in a way a founder has already ruled on: beat
