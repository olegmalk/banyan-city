    lobed palmate leaf that "do[es] not resemble the sapling", and beat 13 grows a whole tree.
    done-definitions beats.16.both_legs_rejected_0816 already names the general shape of this —
    "whether a canonical sapling description exists at all is the open question filed with this
    ruling; if it does not, defining the plant is the founder's (R4) and gets its own card" —
    and this verdict is a third data point for that card rather than a new question.
  what_this_lane_does_about_it: >-
    NAMES IT. It does not define the plant (R4), does not amend the ruling, and does not pull
