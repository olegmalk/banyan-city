consumer: The founder's morning page, and the recipe decision for the remaining 131 ep3 prompts. Four
  seeds side by side, nothing ranked and nothing recommended.
success: Four frames. Pass is the r3 assessor WITH hair and otherwise unchanged -- thin, tall, dust-grey
  robes, chained ledger, quill, humourless. He already said this one is good, so the only way to fail
  is to have changed something else while adding three tokens. Page it against 005's lines.
why: 'Founder: "the assessor is good, just.. unnecessarily bald." ONE CHANGE from r3 -- thin grey receding
  hair, asserted. I grepped r3 first as instructed and it contains NO bald or hairless token anywhere,
  positive or negative, so nothing we wrote asked for it and the checkpoint defaults him bald. I also
  checked the more interesting hypothesis and it is FALSE: the job passes --goblin-def "green skin, bald
  head", but this draft has no {{GOBLIN}} slot, so that replace is a no-op and the goblin''s own definition
  never reaches the assessor''s prompt. The hair is the script''s man, not a generic fix -- 005 gives
  him dust-grey robes, a chained ledger and a stub of quill, so thin grey receding hair suits the character
  already written.'
prediction: 'Written before any frame exists, and unlike r2''s this one is aimed at the failure that actually
  happened. r2 drew NO PLANT in 4 of 4 and NO WORLD in 4 of 4; r3 makes the sapling its own subject clause
  growing from the earth and gives the world its own sentence. What should come back: a rooted plant with
  a visible stem beside a kneeling goblin in a lit meadow. The remaining risks, in order — (1) the fig,
  absent in 3 of 4 of r2, is still only two words and may not read; (2) `purple fig` may fight the model''s
  prior for a fig''s colour; (3) with the character adjectives cut to buy tokens, the patchwork cloak
  is now entirely absent from the prompt, so the costume will be whatever the checkpoint defaults to —
  r2 gave a dark buttoned jacket every time. If the plant and the world come back and only the fig and
  costume are wrong, that is a PASS on the dialect question and the costume moves to the reference where
  it belongs.'
