the_expression_ruling: 'STRUCK from k6a''s frozen positive: `blank eyes`, `jitome`, `half-closed eyes`.
  Plus `expressionless`, `:|` and `closed mouth` from the older tile recipe, wherever a plate still carries
  them. KEPT: `tsurime` (the tile''s slit SHAPE) and `thick eyebrows` (the brow P1 scores) -- those are
  geometry, not mood, and striking them would move the face under cover of a ruling about its expression.
  ADDED, from THIS BEAT''s stage direction in node.md: `tired, half-closed eyes, light smile`.'
the_one_variable: 'THREE, and they are named because this is a RULING BATCH and not a rung: (1) head_frac
  0.190 -> 0.240 with the age clause `young goblin, slim`, (2) the mannequin block struck and this beat''s
  emotion `tired, half-closed eyes, light smile` in its place, (3) the broken tusk added. They are moved
  together because they are one decision -- a lifeless face at the wrong age is not a thing anyone wants
  a clean rung on -- and the ISOLATE mode exists for exactly the case where the frame breaks and the attribution
  matters.'
