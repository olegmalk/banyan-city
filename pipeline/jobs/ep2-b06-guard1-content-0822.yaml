success: 'ONE 832x1216 png, judged AT 1:1 against taste/refs/guard1-canon-founder-0822.png on a MATCHED-SCALE
  face sheet -- the r11a lesson from the goblin lane, where a pick was declared off two full frames at
  different head sizes and flipped the moment the crops were the same height. PRE-REGISTERED, BEFORE THE
  PIXELS EXIST: (1) HE IS GUARD 1 -- dark cropped hair, round wire-rim glasses, the same face. Unlike
  the casting sheet, a clone of the reference is a PASS here. (2) A GROWN MAN. A child, teenager or female
  read is a DROP. (3) THE BOARD IS LARGE -- a slab of bark at least as wide as his shoulders, held in
  BOTH hands at chest height, with him looking down at it. This is the beat''s standing fault and a small
  board is a FAIL however good the man is. (4) IT IS BARK, not a clipboard: no metal clip, no spring clip,
  no white or lined paper. (5) DETAILED CINEMATIC ANIME, the look of the reference. Flat, muted or tag-sheet
  is a fail. (6) The costume family reads: cream shirt collar and WHITE SHOULDER SASH. (7) A real grass-and-hedgerow
  field behind him, not a plain ground. (8) NOTHING GOBLIN: no green skin, no pointed ears -- tonight''s
  b07 re-run put a pointed ear on this same guard, so this is a live defect and not a formality. PRE-REGISTERED
  FAIL MODES, recorded whether or not they fire: the adapter handing over the reference''s COMPOSITION
  (a face close-up instead of a medium shot, and/or the hand-on-cheek) -- measured to happen when reference
  and request geometries agree, which here they do not; the board arriving small anyway, which would mean
  scale is not reachable by words on this stack and the next rung is an object composite; child proportions,
  whose named answer is a 5-head skeleton on controlnet_plate.py.'
why: 'BEAT 06''s INIT IS A CHARACTER WHO NO LONGER EXISTS. Every b06 draft before this one draws a round
  bald bureaucrat in mismatched armour; on 2026-08-22 the founder ratified guard 1 as a specific man --
  dark cropped hair, round wire-rim glasses, cream shirt, white shoulder sash -- by posting one of our
  own frames back at us. A motion pass cannot fix a wrong man, so the plate is first. Same job also answers
  the beat''s board-size fault, positively, in the words. Route: the cinematic stack the 08-22 ladder
  entry names by file -- goblin_ipa_beat.py --character guard --arm window4, IP-Adapter 0.6 off after
  the first 15%% of the denoise, over a box-resident refs dir holding the ratified frame, prose prompt
  out of wave-drafts.yaml closing on the ratified style tail. Minutes of local GPU, $0. Full trace: pipeline/derive_b06_guard1_0822.py.
  ARM OVERRIDE, --arm content: this is the SECOND run of this job and it is not window4. The window4 run
  came back with the REFERENCE''S composition -- a tight face close-up -- on a request that asked for
  something else, which its own spec had argued could not happen. `content` scopes the adapter to down
  block_2 for the whole denoise instead of putting it on every block for the first 15%, which is the standard
  way to take identity from a reference without taking its framing. ONE VARIABLE against the window4 run:
  the arm. Same reference bytes, same prompt, same seed, same size, same driver. NAMED FAIL MODE, from
  this sampler''s own header: arms 1 and 2 ''bought identity with colour or colour with identity'', so
  a washed-out or off-key frame is the thing to look for here, and it is a different failure from the
  framing one this run exists to fix.'
