# 2026-08-12, character-consistency lane, ON HIS RULING, same hour it was given.
#
# ── HIS WORDS. "the guards beign bald is a bit strange.. why are you making everyone
# bald..?" He is right, and the provenance is worth writing down rather than quietly
# fixing: BALD WAS NEVER HIS WORD FOR THE GUARDS. What he ratified was "two silly round
# bureaucrats with visible faces". `bare heads` was the STEWARD'S translation of an
# anti-helmet intent, and it then carried his separate bald ruling for the GOBLIN onto
# two men it was never about. Three rounds of guard sheets inherited that mistake and
# nobody caught it until he looked.
#
# ── ONE CHANGE FROM r3. r3's solo turnaround is the thing that fixed the count — 4/4
# one man, after 0/8 across two rounds — and it is kept exactly: same tags, same order,
# same negative, same beat-06 block, same seeds. `bald` comes out, `short hair` and
# `visible face` go in. Nothing else moves, so a failure here is a failure of the head
# and not of a fourth layout.
#
# ── NO `no bald` IN THE NEGATIVE, and the reason is a measurement. That negative sits
# at 75/77, and the beat-06 conditioning round showed this model's prior for a `guard
# man` is a HAIRED soldier: it put hair on two bald references in roughly 14 of 16
# frames when nobody had asked for any. Hair is what it wants to draw here. Paying two
# tokens to forbid the opposite would be buying something we already have — and if a
# bald guard turns up anyway, that is the round that earns the ban.
#
# ── HAIR COLOUR IS LEFT UNSAID. Four seeds of an unspecified `short hair` is a casting
# call exactly as r3 was: two of them become guard A and guard B, and letting the seeds
# vary is how they come out as two different men instead of one man twice.
#
# ── THE REGISTER GETS ONE HONEST LOOK, NOT A CRUSADE. `silly harmless bureaucrats` has
# scored 0/4 in three rounds against bald men. Softer, rounder, haired men may simply
# read less solemn. That is worth ONE observation on this sheet; it is not worth a
# fifth round, and the register stays in needs-founder either way.
#
# ── MEASURED BEFORE QUEUED, on the box, with the real CLIP tokenizer: positive 74/77,
# negative 75/77, count tag `1boy` matching the draft, style anchor present, nothing
# dropped, no faults.
#
# ── ITS OWN OUT DIR (`out-charref-guards-r4`), never written by another job.
#
# ── PROVISIONAL. His veto stands, as it did on the three rounds before this one.
#
