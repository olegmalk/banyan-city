success: 'ONE 832x1216 png, judged at 1:1 and on a matched-scale sheet beside taste/refs/guard1-canon-founder-0822.png.
  PRE-REGISTERED: (1) A WHOLE FIGURE IN A FIELD, not a portrait. Two adapter runs returned a head-and-shoulders
  close-up and this rung exists to fix that, so a close-up here is a FAIL whatever the face looks like.
  (2) HE IS HOLDING A BOARD, in both hands, at chest height, looking down at it -- and the board is AT
  LEAST AS WIDE AS HIS SHOULDERS. This is the beat''s standing fault and no previous frame of it has ever
  been right. (3) IT IS BARK, not a clipboard: no metal clip, no spring clip, no paper. (4) A GROWN MAN,
  five heads tall. A child or teenager read is a DROP -- the hint asserts the proportion, so if the output
  is still childlike the hint is not binding and that is the finding. (5) HE IS RECOGNISABLY GUARD 1:
  dark cropped hair, round wire-rim glasses. This is the half being taken from WORDS instead of from a
  reference, so it is the half that could newly fail, and a miss here is the interesting result rather
  than a disappointment. (6) DETAILED CINEMATIC ANIME. Flat or tag-sheet fails. (7) Cream shirt collar
  and WHITE SHOULDER SASH. (8) NOTHING GOBLIN: no green skin, no pointed ears. Tonight''s b07 re-run put
  a pointed ear on this same guard. PRE-REGISTERED FAIL MODES, with what each one would mean: A LITERAL
  WHITE OUTLINED RECTANGLE floating in frame -- the scribble net traced the hint instead of interpreting
  it, and the answer is to drop --scale2 below 0.5, not to redraw the board. NO BOARD AT ALL -- 0.5 is
  too weak, raise it. A SKELETON DRAWN INTO THE PICTURE as glowing limbs, which is what the scribble net
  did to a medial-axis hint on beat 08; if the POSE net does it too, the hint class is wrong and not just
  the scale. THE FIGURE IGNORING THE HINT entirely, which at ratio 3.0 line thickness would be a real
  surprise and would point at the net not loading rather than at the drawing.'
why: 'THE ADAPTER ROUTE IS CLOSED BY MEASUREMENT. window4 and content on beats 05 and 06 -- opposite settings
  on both axes the sampler has -- all four returned the reference photograph''s crop and pose: a head-and-shoulders
  close-up with the hands up at the face, no board, no field. So this rung takes the PICTURE from a drawing
  and the MAN from the words, with no reference image anywhere in the job. Two nets, because a COCO-18
  hint has no keypoint for a plank and the board is this beat''s entire fault: openpose for the five-head
  figure and scribble for one rectangle exactly as wide as the skeleton''s shoulders. The scribble net''s
  known defect -- it traces whatever it can read -- is the feature here, because the thing being traced
  is a board and boards are rectangles. Both hints come out of one file and one geometry, so the prompt''s
  `as wide as his shoulders` and the drawing''s width are the same number. $0, ~3 GPU minutes. Full trace:
  pipeline/derive_b06_pose_0822.py and pipeline/author_b06_guard_pose_0822.py.'
