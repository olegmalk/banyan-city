one_sample_rule: 'CELL A IS THE SAMPLE AND THE OTHER NINE ARE HELD. CLAUDE.md requires one sample per
  RECIPE CHANGE, and this is three at once: a new reference, a new prompt family and a new beat. The specific
  risk the sample answers: the reference wears WIRE RIMS and has A HAND ON THE CHEEK, and a 6-step structure
  hold is precisely when a composition is set, so `no glasses` and `no hands` are load-bearing negatives
  that have never been tested against THIS reference. Round 1''s spec argued "THE BATCH IS THE SAMPLE"
  and round 1 was rejected entire.'
seed_note: 'Seeds are the sampler''s own arithmetic and are pinned by construction: wg.SEED (20260719)
  + beat (6) + seed_start * 1000. Cell A is --seed-start 0 -> 20260725; cells B..J take seed_start 1..9
  -> 20261725..20269725. No two cells can collide and every cell''s seed is derivable from its letter
  without opening the artifact.'
frame_count: ONE png per cell. window4 enumerates four reference slots and the stage step writes four
  byte-identical copies of the single guard-1 reference, so dedup_cells drops three and one cell is drawn,
  at one seed. Stated here rather than discovered by the artifact check -- an artifact list naming frames
  the run never writes is what retired a b09 job at rc 92.
