# BEAT 08, RUNG 2 -- THE SAME HINT AT A LOWER CONDITIONING SCALE.
# ONE SAMPLE. ONE ARM. ONE VARIABLE, AND IT IS NAMED IN ITS OWN SPEC BEFORE THE
# PIXELS: conditioning_scale 0.8 -> 0.45.
#
# ============================================================================
# WHAT RUNG 1 SETTLED, AND WHY THAT MAKES THIS THE NEXT QUESTION AND NOT A SWEEP
# ============================================================================
# ep2-b08-cnetplate-0819 (verdict appended to its own spec 2026-08-19) FAILED
# B1-B5 and settled the thing the whole route existed to ask:
#
#   B4c PASSED -- THE POINTING ARM GREW FROM THE GUARD. First time on this beat.
#     It is not the seed behaving: the nocontrol arm at the SAME SEED and the
#     SAME WORDS put the arm on the goblin, taking the uncontrolled tally to
#     4 of 4, and produced the most extreme colossus this beat has seen with the
#     guard's frozen wardrobe bound onto the goblin as well.
#   B1, B3, B4a, B5 PASSED -- two whole figures, one ground plane, a clipboard
#     legibly lowered at the hip in ONE hand, and the stature ratio held.
#   B2 FAILED, exactly where rung 1 said in advance geometry could not help:
#     both figures came back green with pointed ears, the two heads measuring
#     (33,78,49) and (31,72,49).
#   B4b FAILED -- the arm is aimed but ends in nothing; the fingertip region
#     samples background.
#
# AND IT NAMED ITS OWN NEXT VARIABLE, in `observed_not_scored`: at scale 0.8 a
# DENSE full-body contour is TRACED, NOT INTERPRETED. Both figures returned as
# flat untextured mannequins wearing the exact polygon silhouettes that were
# authored -- boxy torsos, rectangular limbs, no cloth and no folds -- while the
# grass and sky AROUND them came back detailed and well drawn. That inverts the
# probe's sparse-hint flattening note rather than repeating it: there the
# ENVIRONMENT flattened, here the environment is fine and the flattening landed
# entirely on the CONDITIONED REGIONS.
#
# ============================================================================
# THE ONE VARIABLE, AND THE ONE LINE THAT JUSTIFIES ITS VALUE
# ============================================================================
# conditioning_scale 0.45. The xinsir card frames scale and stroke weight as the
# two dials running from "prompt wins" to "condition wins"; 0.8 was chosen as
# the condition-wins end and it won COMPLETELY, so 0.45 sits just above half of
# it -- enough authority left to hold a pose the prompt has never been able to
# produce, and most of the drawing handed back to the checkpoint.
#
# EVERYTHING ELSE IS HELD. Same hint file, byte-identical and sha-asserted at
# render time (19cfad48...). Same seed 20260819. Same size, same steps, same
# guidance, same base, same ControlNet, same driver at the same commit. Same
# positive prompt, word for word.
#
# ============================================================================
# ONE THING CHANGED THAT IS NOT THE VARIABLE, AND CALLING IT A VARIABLE WOULD BE
# DISHONEST: THE NEGATIVE IS BUG-FIXED
# ============================================================================
# Rung 1's frame came back NIGHT -- mean luma 22.9 against its own control arm's
# 95.1. That was an AUTHORING ERROR and rung 1 recorded it as one, in its own
# verdict, as mine: the negative was assembled from ep2-b08-boardcomp-0818, which
# was written for an INPAINT over an already-daylit init and so never needed a
# darkness clause, while beat 08's own cast draft (`authored_b08_cast_0817`)
# carries `no dark, no night` and always has. Restoring those two tokens is
# PARITY WITH THE HOUSE NEGATIVE, not an experiment, and it is stated here rather
# than folded in quietly because a spec that changes two things and reports one
# is how a lane fools itself.
#
# ROOM WAS MADE BY DELETING REDUNDANCY, NOT BY CUTTING A LIVE CLAUSE. Rung 1's
# negative measured 76 of 77 on the box's real tokenizer -- one token from silent
# truncation -- so `dark, night` could not simply be appended. Removed:
#   `huge`          -- duplicates `giant`
#   `extra board`   -- duplicates `second board`
#   `deleted sky`   -- rung 1 returned a sky; the clause had nothing to do
#   `third person`  -- ambiguous as a negative, and `crowd` covers the harm
# MEASURED ON THE BOX'S REAL TOKENIZER BEFORE FILING, not estimated here: the
# positive is 64 of 77 and the new negative is 69 of 77. Rung 1 is the reason
# that measurement is taken on the box -- the authoring-time estimate on the Mac
# said 71 for a negative that was really 76, wrong by five in the dangerous
# direction.
#
# ============================================================================
# ONE ARM, BECAUSE THE CONTROLS ARE ALREADY ON DISK
# ============================================================================
# Rung 1 published both a hinted frame at 0.8 and a nocontrol frame at the same
# seed, and the nocontrol frame does not depend on conditioning scale -- so
# re-rendering it would be a second copy of a picture we already have. This job
# renders ONE new frame and is read as a three-way comparison against
# farm-out/ep2-b08-cnetplate-0819/{hint,nocontrol}. That is fewer GPU-seconds and
# a better experiment, not a corner cut.
#
# NO SPEND, NO PROVIDER, NO CANON FILENAME, NO PICK, NO PUBLISH TO THE SITE, NO
# POST, NO ASSEMBLY. No video is encoded anywhere on this path, so no motion
# recipe's --image-crf reaches it.

id: ep2-b08-cnetplate-r2-0819
task: ep2-b08-cnetplate-r2-0819
node: 002b-first-citizen
beat: 8
runner: box
needs_gpu: true
sample: true
priority: 34
max_attempts: 1
owner: beat 08 staging lane, 2026-08-19

consumer: >-
  Beat 08's plate, for its cut slot in the episode 2 assembly. Rung 1 proved the
  hint can AIM the gesture and cannot draw a character; this rung decides whether
  the aiming survives at a scale where the checkpoint is free to draw people
  instead of tracing polygons. Its answer is what tells the next lane whether the
  hint stays in beat 08's recipe at all, and it is read by whoever takes the
  identity question (see b2 below), because a traced mannequin has nowhere for an
  identity lever to attach.

success: >-
  One 832x1216 png with its sidecar, published to
  C:\banyan-farm\courier-box\farm-out\ep2-b08-cnetplate-r2-0819 with a sha256
  manifest, and read side by side against rung 1's two frames. See verdict_rule
  below -- all three outcomes it enumerates are informative and one of them is a
  PASS-ON-PURPOSE with B2 failing exactly as pre-registered.

why: >-
  Rung 1 named this variable in its own verdict and deliberately did not take it,
  because scaling an unapproved result is the thing that wastes an hour. It is
  now ruled. Two minutes, $0, no provider, no download: every weight is already
  in the box cache, the hint was drawn on a Mac with PIL, and the driver and hint
  are already staged and hash-verified on the box.

