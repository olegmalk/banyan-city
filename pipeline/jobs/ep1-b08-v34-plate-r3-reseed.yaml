# ep1 beat 08 "sev-1" — a SECOND DRAW of the r1 wording on a prepared plate.
#
# BEAT 08 HAS NO USABLE CANDIDATE. Every correctly-framed arm of it is frozen,
# measured on the files today:
#     08-sev-1-LTX.mp4        (r1, raw 24.4% stretch) median 1.210,  0% frozen
#     08-sev-1-LTX-plate.mp4  (r1, plate)             median 0.131, 62% frozen
#     08-sev-1-LTX-r2.mp4     (r2, raw stretch)       median 0.106, 62% frozen
#     08-sev-1-LTX-r2-plate   (r2, plate)             median 0.148, 62% frozen
# The v35 cut plays the r2 plate. The v35 README offers r1 as the override that
# "moves" — but that is the RAW r1, a vertical stretch that cannot sit in the cut.
# The r1 PLATE is frozen at 62%. There is nothing to override to, so this beat
# needs footage rather than a pick.
#
# WHY A RESEED IS THE RIGHT MOVE AND NOT A REWORDING. The r1 wording demonstrably
# produces motion on this beat: its raw arm is 0% frozen at median 1.210, with the
# picture upright and clean. The r2 wording is the one that froze it by design —
# 879820f measured its affirmative framing lock taking beat 08 from median 1.07 to
# 0.10 and 0% frozen to 66%. So the wording to keep is r1's, unchanged.
#
# WHAT ACTUALLY WENT WRONG WAS THE DRAW. I compared all thirteen raw/plate pairs
# on disk. Twelve held their motion under plating and most gained (03 r3
# 0.825->3.391, 04 r4 0.872->1.387, 07 r4 0.745->0.699, 10 r2 1.688->1.243).
# Beat 08 r1 is the single exception, 0% -> 62% frozen at identical recipe and
# identical seed 20260739 — and a crop cannot turn 0% duplicate pairs into 62%,
# so that is one unlucky draw landing in a frozen basin, not a property of
# plate_prep. The remedy for an unlucky draw is another draw.
#
# ONE VARIABLE: the seed, 20260739 -> 20260851. Prompt, negative, plate, size,
# frames, fps, steps, guidance 1.0, sigmas, two-stage and the renderer binary are
# byte-identical to ep1-b08-v34-plate-twin-r1.
#
# SETTLED RECIPE, NOT A CHANGE. Guidance stays 1.0 and the cover-centre crop is
# ratified ("the crop -- yes"). The g2.0 question is being asked exactly once, in
# ep1-b08-v34-plate-g20-sample, and nothing here depends on its outcome.

