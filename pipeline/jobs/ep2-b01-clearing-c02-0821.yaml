  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - "# Required by box_enqueue.courier_problems (2026-08-19): a job whose\n# artifacts live outside courier-box\\\
    farm-out must have a step that\n# carries them there, because the courier pushes from farm-out and\
    \ from\n# nowhere else. ep2-cnet-probe-0817 rendered perfectly and was invisible\n# for two days for\
    \ want of exactly this.\nimport glob, hashlib, os, shutil\nout_dir = \"C:/banyan-farm/b01clearing-c02-0821/out\"\
    \npay_dir = \"C:/banyan-farm/b01clearing-c02-0821\"\ndst = \"C:/banyan-farm/courier-box/farm-out/ep3-b01clearing-c02-0821\"\
    \nos.makedirs(dst, exist_ok=True)\nfiles = sorted(glob.glob(out_dir + \"/ep3-b01clearing-c02-0821-nocontrol.png*\"\
    )\n               + glob.glob(pay_dir + \"/prompt.txt\")\n               + glob.glob(pay_dir + \"\
    /negative.txt\"))\nlines = []\nfor f in files:\n    shutil.copy2(f, dst)\n    c = os.path.join(dst,\
    \ os.path.basename(f))\n    with open(c, \"rb\") as fh:\n        h = hashlib.sha256(fh.read()).hexdigest()\n\
    \    lines.append(h + \"  \" + os.path.basename(f))\nwith open(os.path.join(dst, \"ep3-b01clearing-c02-0821.sha256\"\
    ), \"w\",\n          newline=\"\\n\") as fh:\n    fh.write(\"\\n\".join(sorted(lines)) + \"\\n\")\n\
    print(\"published\", len(files), \"file(s) + manifest ->\", dst)\nraise SystemExit(0 if len(files)\
    \ >= 4 else 1)"
