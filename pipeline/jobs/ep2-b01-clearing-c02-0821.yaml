bar: "TWO PLATES, JUDGED AS ONE CONTACT SHEET, BY EYE AT 1:1. THERE IS NO\nPLANT AND NO FIGURE IN ANY\
  \ OF THESE PICTURES AND BOTH ABSENCES ARE CORRECT.\n  D1 CEL, NOT PHOTO, NOT PAINTING. Flat fills, clean\
  \ ink linework, the\n     episode's dialect. This is the clause the ep2-b16-field batch lost all\n \
  \    four on, and it is the first one read. Bokeh, painterly rendering or a\n     photographic ground\
  \ plane REJECTS the plate -- you cannot draw a sharp\n     cel seedling into a soft foreground without\
  \ it reading as a decal.\n  D2 A CLEAN DRAWABLE GROUND PLANE in the lower centre, wide and tall enough\n\
  \     to root a sapling at plate scale. Blades of grass crossing it are fine.\n     A rock, a flower,\
  \ a shrub, a drawn plant or any structure is NOT: the\n     0.30 pass PRESERVES a structure it finds\
  \ in the init (12 of 40 steps from\n     a latent that still carries it), so the composite would have\
  \ to fight it.\n  D3 ZERO FIGURES. Not a goblin, not a human, not an animal, not a silhouette\n    \
  \ on the horizon. A plate with any figure in it is REJECTED AND DELETED,\n     not cropped -- this lane\
  \ may not render the scavenger and a frame that\n     contains him is not curated into a training set.\n\
  \  D4 THE LIGHT HAS A DIRECTION. beat16_sapling_composite.py measures the\n     plate's own low-pass\
  \ luminance gradient and carries it into the drawn\n     plant. A flat, directionless plate makes that\
  \ measurement a no-op and\n     the composite reads as pasted.\n  D5 THE PALETTE IS THIS SHOW'S. The\
  \ composite samples its greens FROM THE\n     PLATE, so an off-palette plate produces an off-palette\
  \ sapling and the\n     frame teaches the LoRA the wrong colour.\nNOT SCORED: whether the picture is\
  \ a good shot. None of these is a shot, none\nenters a cut, and none goes near review/ep2-ship-0821.\
  \ They are ground planes\nfor an instrument.\nNOT SCORED: variety WITHIN a cell. The variety this batch\
  \ is bought for is\nBETWEEN cells and it is measured at the manifest, not here.\n\nAND ONE CLAUSE THE\
  \ DATASET BAR DOES NOT CARRY, BECAUSE THIS PLATE IS FOR A BEAT AND NOT FOR A DATASET: NO HORIZON AND\
  \ NO SKY. Every plate the closed ladder kept has one; beat 01's approved look has neither, so a clean\
  \ plate with a ridgeline in it is a FAIL for this consumer and should be handed to the dataset lane\
  \ rather than scored here."
the_one_variable: THE SCENE CLAUSE ('in a green meadow, a clearing of bare earth receding into the distance,
  warm backlight, day'). It names a receding feature that is NOT a landform -- the half of the closed
  ladder's rule that ladder stated but never tested on its own, because every cell it ran bought its depth
  from hills, a treeline, a creek or a path.
this_cell: 'THE CELL PLUS BEAT 01''S LIGHT, one variable from c01. `warm backlight` is asked for as light,
  not as `orange theme`, which is the word that took round 1 to a sunset. Backlight is also what the shipping
  take is made of, so if the clearing survives it this is the closer match of the two. Pre-registered
  risk: backlight silhouettes the near grass and eats the plane, which is exactly how the closed ladder''s
  r03 and r04 died.'
the_rule_this_inherits: 'From review/ep3-sapling-dataset-0821/plates-0821.yaml, four rounds and 26 plates:
  a scene clause naming only ground cover returns a macro of that ground cover at any framing, and what
  buys a drawable plane is a landform OR A RECEDING FEATURE. Beat 01''s own two rounds re-derived the
  first half at a cost of four plates before that file was read. This cell tests the second half, which
  is the only form of the rule that can serve a look with no horizon in it.'
what_beat_01s_own_two_rounds_cost: Four plates and about a minute of card, $0. Round 1 (s1-s3) named `scenery`
  -- Danbooru's landscape-shot tag -- and returned sunset vistas three for three. Round 2 (r2s1) deleted
  it and named only ground cover, and returned the macro grass wall the closed ladder's rule predicts.
  Both rounds were run before that ladder's laws were read, which is the avoidable half of the cost and
  is recorded as mine.
failure_predicted_in_advance: 'FIRST AND MOST LIKELY: A CLEARING IS NOT READABLE AS DISTANCE. Every depth
  cue the closed ladder found is an OBJECT with a silhouette -- hills, trees, a creek, a path. A clearing
  is an ABSENCE, and this checkpoint may have no way to place the camera relative to a hole in the grass.
  Then c01 comes back as macro grass, the no-horizon route is closed for this checkpoint, and beat 01
  keeps fignonly.

  SECOND: THE CLEARING ARRIVES AND BRINGS A HORIZON ANYWAY, because `in the distance` is what the model
  draws as a skyline. That is a FAIL for this consumer and a PASS for the dataset lane, so the plate gets
  handed over rather than deleted.

  THIRD, ON c02 ONLY: `warm backlight` silhouettes the near grass and the plane goes black before the
  clearing is readable. That is precisely how the closed ladder''s r03 (sunset) and r04 (mist) died, and
  if it happens here the light has to come from the grade rather than from the plate.

  FOURTH, AND IT WOULD BE THE EXPENSIVE ONE: the plate passes by eye and then beat16_sapling_composite
  refuses it for want of a green-dominant pixel, as it refused u05. Both cells name green for this reason,
  and the check is cheap and offline -- it should be run on the returned png BEFORE any composite is attempted.'
clip77_measured_not_estimated: prompt 37 of 77, counted offline on animagine's own vocab before this file
  was written; negative inherited from the parent unchanged.
