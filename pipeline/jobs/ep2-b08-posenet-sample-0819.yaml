  b4b_legible_point: 'FAIL, THE THIRD TIME ON THIS BEAT AND THE FIRST TIME LIKE THIS.
    The arm ends in a well-drawn hand with a clearly extended index finger -- and it
    points UP AND AWAY. The hint authored Rsho (512,491) -> Relb (360,485) ->
    Rwri (257,657): out horizontally, then steeply DOWN toward the belly at
    (225,711). The render bound the first limb exactly and then MIRRORED THE SECOND
    ABOUT THE ELBOW, putting the hand at roughly (320,420) -- about 230 px ABOVE
    where the wrist was authored. Nothing is drawn at the authored wrist at all.
    So the forearm''s LENGTH and ATTACHMENT bound while its DIRECTION did not.
    TWO CANDIDATE CAUSES, AND THE CHEAPER ONE IS TESTABLE FIRST. (a) The authored
    pose is anatomically odd: the elbow sits at SHOULDER HEIGHT and laterally out,
    a chicken-wing, and the forearm then drops steeply -- not what a person does to
