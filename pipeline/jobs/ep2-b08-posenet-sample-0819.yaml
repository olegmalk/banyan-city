observed_not_scored: >-
  FOUR THINGS, AND THE FIRST IS SEVERE. (1) THE FRAME IS NIGHT. Mean luma 32.5,
  against rung A's 115.7 and rung 2's 149.5 at the same seed with the SAME negative,
  which carries `dark, night`. Rung 1's darkness was an authoring error (the clause
  was missing); this one is not -- the clause is present and was overridden. A large
  dark palm-frond silhouette dominates the left third and a second trunk crosses the
  right, where the prompt asks for tall grass and pale sky. Conditioning scale 1.0 is
  the obvious suspect and it is the card's recommended value, so this is a real
  tension rather than a mistake. (2) THE GUARD READS AS A WOMAN -- blonde chin-length
  hair, soft features, a feminine build -- against a prompt that opens "Two men" and
  a negative carrying `girl`. Human and sandy-haired, which is what B2 asks; not a
  man, which the beat needs. (3) `plump` BROADCAST ONTO THE GUARD while `green skin`
  did NOT. The guard is heavy-set and the goblin is slight, which is the reverse of
  the wording. So the pooled-embedding broadcast is REDUCED, not eliminated, and
  which attributes escape it is not yet predictable. (4) BOTH FIGURES ARE IN MODERN
  PLAINCLOTHES -- the goblin in a tan t-shirt and dark trousers, the guard in a white
  tee and a brown wrap skirt. The wrap skirt is the one wardrobe clause that landed.
what_this_settles: >-
  POSE-CLASS CONDITIONING WORKS ON THIS CHECKPOINT, and all three of the research's
  open questions are now DEMONSTRATED rather than argued: pose binds on
  animagine-xl-3.1, two skeletons in one hint give two distinct figures with no
  fusion, and a stated stature ratio survives into the render (1.161 against 1.100).
  It also settles B6 for the first time in six rungs -- a hint with no enclosure
  leaves the checkpoint to draw people, which is what §9's tracing-is-caused-by-the-
  enclosure finding predicted and what no scale or stroke on the scribble net could
  deliver. And it settles that hand-authored geometry is NOT closed on this
  checkpoint: §10 raised that as branch (3)'s risk and branch (3) did not fire.
what_this_did_not_settle: >-
  THE AIM, which is now the beat's only remaining blocker and has failed on three
  separate mechanisms. Nor whether the forearm flip is our staging or the net's
  prior -- that is one render away and is the ruled next rung. Nor why the frame
  went dark, nor whether a lower conditioning scale relaxes the night and the
  foliage while keeping the pose. Nor B2's surprise: whether the enclosure was
  suppressing figure differentiation all along is a hypothesis with one frame behind
  it, and confirming it needs its own sample. Nor the third figure beat 08's
  done_when wants.
what_this_does_not_license: >-
  No pick, no plate_ack, no cut, no canon filename; this frame is PROVISIONAL and a
  night frame with the gesture pointing the wrong way is not a candidate. It does
  NOT license dropping rung A's masked references on the strength of B2 passing
  here: that is ONE sample against rung A's measured mechanism, and the honest
  reading is that the references are now possibly redundant rather than proven so.
  It does not license the `_twins` variant (a second 2,386 MiB for "more precise
  pose, lower aesthetic score") -- pose adherence was not the failure; forearm
  DIRECTION was. And it does not license a conditioning-scale sweep: the night
  needs one sample with its own question, not a bracket.
next_rung_named_not_taken: >-
  ONE sample: RE-STAGE THE ARM and change nothing else. Elbow LOW and near the
  ribs, forearm reaching forward and down to the belly -- the pose a person actually
  makes -- instead of the current elbow-at-shoulder-height chicken-wing whose
  forearm has to drop steeply. Its question is whether the flip was our anatomy or
  the net's prior, and it is the cheaper of the two hypotheses to test, needs no new
  weights, and is a change to author_b08_openpose_hint.py's staging with its
  --selftest carried. AFTER that, in this order and each as one sample: the NIGHT
  (same hint at scale 0.6-0.7 -- does the dark relax while the pose holds), then
  B4a via multi-ControlNet pose+scribble for the board, then whether rung A's
  masked references are still needed at all given B2's surprise here.
