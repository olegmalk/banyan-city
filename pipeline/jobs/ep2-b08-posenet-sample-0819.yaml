# BEAT 08 RUNG B, STEP 2 OF 2 -- DOES A POSE SKELETON BIND ON animagine-xl-3.1?
# ONE SAMPLE. ONE ARM. ONE VARIABLE, AND THE VARIABLE IS THE NET.
#
# ============================================================================
# THE ONE VARIABLE, AND IT IS THE INSTRUMENT ITSELF
# ============================================================================
# Rung 2 conditioned a 7px CONTOUR on xinsir/controlnet-SCRIBBLE-sdxl-1.0 at 0.45.
# This conditions a COCO-18 SKELETON on xinsir/controlnet-OPENPOSE-sdxl-1.0 at 1.0.
# Held: the base, the seed (20260819), the size, the steps, the guidance, the
# positive prompt and the negative word for word, the driver file, the staging
# (both figures at the same cx, the same statures, the same foot line, the same
# shoulder, the same target, the same total reach, the same 0.847 extension --
# asserted key for key in author_b08_openpose_hint.py --selftest against
# author_b08_pose_hint's own metadata).
#
# The conditioning scale moves from 0.45 to 1.0 and THAT IS NOT A SECOND
# VARIABLE, it is this net's documented operating point: xinsir's own card
# recommends 1.0 for openpose, and 0.45 was a value bracketed for a scribble net
# whose failure mode was TRACING THE OUTLINE. A skeleton has no outline to trace,
# so the dial that 0.45 was tuning does not exist here. Stated out loud rather
# than folded in, because a spec that changes two things and reports one is how a
# lane fools itself.
#
# ============================================================================
# WHY A DIFFERENT NET, AND WHY IT IS NOT A SIXTH TUNING ATTEMPT
# ============================================================================
# b08-arm-route-0819.md §10 closed hand-authored geometry on the scribble net by
# bracketing three axes:
#
#   conditioning scale  0.80 / 0.45 / 0.28   staging HELD / HELD / LOST
#   stroke weight       7px / 3px @ 0.45     HELD both; thin traced TIGHTER
#   hint class          contour / skeleton   contour TRACES, skeleton is DRAWN
#
# And it explained all three with one mechanism: a SCRIBBLE net reads ENCLOSURE.
# "These lines are lines in the picture" is the only thing it can mean, so a
# closed contour is an object boundary it traces (which is why a THINNER stroke
# bound TIGHTER -- a 3px line is a single unambiguous edge locus where a 7px bar
# is an ambiguous ribbon), and a medial-axis skeleton means nothing to it, so
# rung 5's frame RENDERED THE SKELETON as glowing scene objects: a luminous cross
# with two orbs on each figure's chest, guard spine column luma 212.3 against a
# 165.4 surround. Four rungs were asking a scribble net to do pose conditioning.
#
# A pose skeleton is the right INSTRUCTION and the wrong NET. That is what this
# job changes, and nothing else.
#
# ============================================================================
# AND A SECOND, INDEPENDENT LICENCE FOR IT, FOUND TODAY
# ============================================================================
# ep2-b08-ipamask-0819 (rung A, PASSED 2026-08-19) settled identity and, in doing
# so, REGRESSED B4b's aim -- and the cause it measured is a property of the
# contour hint, not of the adapter. The contour aims with a separate 1px FINGER
# stroke, which leaves its forearm free to bend: extend its own elbow->wrist
# segment and it passes 29.1 px WIDE OF THE NAVEL. The arm that hint asks for
# genuinely is "horizontal upper arm, forearm hanging down", and rung A drew it
# faithfully -- a human hand drooping at the wrist rather than a point.
#
# COCO-18 HAS NO FINGER KEYPOINT, so the elbow->wrist limb has to be the thing
# that aims. author_b08_openpose_hint.py therefore solves the elbow against a
# target one HAND short of the belly and puts the wrist one forearm along
# elbow->belly: THE FOREARM RAY NOW PASSES 0.1 PX FROM THE NAVEL, and the hand a
# pose net draws beyond the wrist lands on it. So this rung is licensed by two
# independent findings rather than one.
#
# ============================================================================
# THE THREE TRAPS THE RESEARCH NAMES, ALL HANDLED BEFORE FILING
# ============================================================================
# 1. THICKNESS. xinsir's own card: "When using the default pose line the
#    performance may be unstable, this is because the pose label use more thick
#    line in training to have a better look." He ships a replacement
#    draw_bodypose whose only change is a resolution ratio; at max(W,H)=1216 the
#    band is 3.0, so LIMBS ARE 24 PX AND DOTS ARE r=12. A 4px skeleton at this
#    size is a documented way to get an unstable result and would look exactly
#    like rung 5's failure. Independently reported in
#    comfyui_controlnet_aux#447. The hint's --selftest asserts both numbers and
#    every band boundary.
# 2. THE COLOUR CODE. Limbs are zip(limbSeq, colors) and dots are
#    zip(keypoints, colors) -- THE SAME 18-COLOUR RAMP INDEXED DIFFERENTLY. The
#    nose DOT and the neck->R-shoulder LIMB are both (255,0,0); the R-wrist DOT is
#    (170,255,0) while the R-elbow->R-wrist LIMB is (255,255,0). "One colour per
#    body part" produces a hint the net has never seen. The tool asserts both
#    halves against each other, and the drawn hint was OPENED AT FULL SIZE before
#    this spec was written: amber R-shoulder, orange neck and green L-shoulder dots
#    on both figures, in the right places.
# 3. variant IS NOT PASSED. xinsir ships only the plain filename;
#    variant="fp16" raises. CONTROLNET_VARIANT is None and unchanged.
#
# ============================================================================
# WHAT IS DELIBERATELY NOT IN THE HINT, AND WHY B4a IS PRE-REGISTERED AT RISK
# ============================================================================
# NO BOARD RECTANGLE AND NO GROUND TICKS. A pose net's entire vocabulary is 18
# keypoints; a rectangle is not a pose and this net was never trained on one.
# Rung 5 put ink a net could not read into a hint AND THE NET DREW IT -- putting a
# clipboard in a pose hint would be that exact category error in a new coat. So
# B4a becomes a PROMPT-ONLY clause here and is expected to be the weakest one, and
# saying so before the render is the difference between a finding and an excuse.
# The guard's board-holding ARM is still staged (L-shoulder -> L-elbow -> L-wrist
# ending at the hip), so the POSE of holding something low is conditioned even
# though the object is not.
#
# ONE MORE PRE-REGISTERED PREDICTION: THE FIGURES WILL COME OUT SLIGHTLY TALLER
# THAN THE HINT. A skeleton specifies the NOSE, not the crown, so the drawn skull
# rises above the topmost ink -- the guard's highest hint pixel is y~377 against
# the contour's authored crown at 346.5. B5 is a RATIO clause so it should be
# unaffected, but if the measured statures come back ~5% over the authored ones,
# that is this effect and not a failure.
#
# ============================================================================
# WHY IDENTITY IS NOT IN THIS JOB
# ============================================================================
# Rung A proved masked IP-Adapter binds identity per figure on this stack -- the
# guard's head moved 48.5 levels on the pre-registered instrument and came back a
# human man. It is a SOLVED BOLT-ON with its own met bar. Carrying it in here
# would make a two-variable job out of a one-variable question, and the question
# is "does a skeleton bind at all on animagine". SO THIS RUNS BARE, and both
# figures are expected to come back green. B2 IS PRE-REGISTERED TO FAIL and a PASS
# would be the surprise. If the skeleton binds, the recipe is skeleton + the two
# masked references, and both halves will have been proven separately.
#
# NO SPEND, NO PROVIDER, NO DOWNLOAD (the weights landed at 08:00Z, both byte
# counts exact, zero .incomplete), NO CANON FILENAME, NO PICK, NO PUBLISH TO THE
# SITE, NO POST, NO ASSEMBLY. No video is encoded on this path.

