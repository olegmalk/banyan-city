    guard is pale-skinned and blonde. NO IP-ADAPTER WAS LOADED.
    THE HYPOTHESIS THIS RAISES, STATED AS A HYPOTHESIS: the contour hint did not
    only trace the silhouette, it also DESTROYED THE MODEL''S ABILITY TO
    DIFFERENTIATE THE TWO FIGURES -- two enclosed polygons of near-identical shape
    got near-identical fills, five times running. A skeleton leaves each body''s
    surface to the checkpoint, which then drew the two DIFFERENT characters the
    prompt describes. If that is right, four rungs of green pairs were an artifact
    of the enclosure and not of CLIP''s pooled embedding at all. ONE SAMPLE IS NOT
    ENOUGH TO PROMOTE THAT PAST A HYPOTHESIS and this verdict does not.'
  b3_one_ground_plane: 'MARGINAL. It reads as one plane -- both figures stand in the
    same lit grass with no split horizon -- but the guard''s feet sit at y~1155 and
    the goblin''s at y~1120, 35 px apart, where the hint pins both ankle keypoints at
