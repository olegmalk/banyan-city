# ============================================================================
# THE BAR. The research's three-in-one question, plus the carried clauses, plus
# the two clauses this hint class puts at risk on purpose.
# ============================================================================
bar:
  b0_the_net_is_the_pose_net: >-
    VOID-CHECK, READ FIRST AND BEFORE ANY PIXEL IS SCORED. The sidecar must say
    `controlnet: xinsir/controlnet-openpose-sdxl-1.0`. "The pose net did nothing"
    and "the pose net never loaded" are different findings and only the provenance
    block tells them apart. If this fails the frame is VOID, not negative.
  b_pose_binds: >-
    THE RESEARCH'S FIRST QUESTION. Does pose conditioning bind at all on
    animagine-xl-3.1? Scored as: does the rendered composition follow the
    skeleton -- two standing figures at these positions, the guard's arm out to
    frame left -- rather than the free-running composition the same seed and words
    produce? The uncontrolled frame at this seed is already published
    (farm-out/ep2-b08-cnetplate-0819/...-nocontrol.png): an extreme colossus with
    the point on the goblin. Anything resembling the skeleton is a bind.
    xinsir's anime showcase (masonry0.webp, opened and inspected by the research
    lane) is an existence proof for anime-class SDXL generally but names no
    checkpoint, so this is MAINTAINER-grade for our base and this sample is what
    makes it DEMONSTRATED either way.
  b_two_skeletons_two_figures: >-
    THE RESEARCH'S SECOND QUESTION, AND THE ONE WITH NO UPSTREAM EVIDENCE EITHER
    WAY. Every one of xinsir's own hint-to-result strips is ONE FIGURE and his card
    makes no multi-person claim -- a DEMONSTRATED ABSENCE, not a negative. The
    documented failure mode (Mikubill/sd-webui-controlnet#1791, open since 2023-07)
    is that with multiple characters "one person's arms and legs are often connected
    to others", because the hint has no per-figure identity channel and no occlusion
    channel. Beat 08's figures are ADJACENT rather than overlapping, which is
    exactly the case that issue does not describe -- a reason to expect it to work,
    not a reason to skip the sample. PASSES if two distinct whole figures come back
    with no limb crossing between them.
  b_scale_survives: >-
    THE RESEARCH'S THIRD QUESTION. Two skeletons whose neck-to-ankle spans differ
    by a stated ratio are a constraint in the conditioning tensor where "a tall
    figure and a short figure" is a prompt the model rounds off. Measured, not
    eyeballed: row-wise edge energy inside each figure's x band, the same
    instrument that scored rung A at 816/729. PASSES if the ratio lands within
    10% of the authored 1.100 -- and see the header's pre-registered note that
    both statures may read ~5% tall because a skeleton specifies the nose and not
    the crown.
  b1_the_pair: >-
    TWO figures and only two, both whole in frame.
  b2_the_identities_separate: >-
    EXPECTED FAIL, PRE-REGISTERED, AND NOT THIS RUNG'S VARIABLE. No IP-Adapter is
    loaded here on purpose (see the header). Both figures are expected green with
    guard head G-R inside the measured band (floor +20.0). A PASS would be the
    surprise and would mean the pose class does something for identity that the
    contour class could not, which would itself be worth a rung. Scored on the same
    instrument as always -- guard (547,372)-(584,425), goblin (148,448)-(193,504),
    statistic G-R -- so the number is comparable to the seven frames before it.
  b3_one_ground_plane: >-
    Both stand on the same grass, feet at the same depth. The hint pins both ankle
    keypoints at 0.035 of stature above y=1149.1. NOTE: no ground ticks are drawn
    (a pose net cannot read them), so this clause now rests entirely on the ankle
    keypoints.
  b4a_board_down: >-
    THE WEAKEST CLAUSE AND IT IS NAMED AS SUCH BEFORE THE RENDER. No board is drawn
    in the hint, because a rectangle is not a pose and rung 5 proved unreadable ink
    gets DRAWN. Only the guard's board-holding ARM is staged, ending at his hip. So
    this is now a PROMPT-ONLY clause. A FAIL here does not count against the pose
    net; it counts against the hint class's vocabulary, and the remedy would be a
    multi-ControlNet pose+scribble composite (both nets local, $0) rather than
    putting a rectangle in a pose hint.
  b4b_legible_point: >-
    THE CLAUSE THIS RUNG EXISTS TO FIX. The gesture must end in a HAND aimed at the
    goblin's belly. Rung A drew a good hand hanging almost straight DOWN because
    the contour's forearm genuinely points that way; this hint's forearm ray passes
    0.1 px from the navel with no finger keypoint, so a hand drawn beyond the wrist
    should land on the target. PASSES only if the gesture reads as aimed AT the
    goblin, not merely as an extended arm.
  b4c_the_arm_belongs_to_the_guard: >-
    THE CLAUSE THAT MUST SURVIVE. The pointing arm grows from THE GUARD's shoulder.
    The uncontrolled tally at this seed is 4 of 4 on the goblin. Here it is carried
    by the R-shoulder -> R-elbow -> R-wrist chain in COLORS[2] and COLORS[3], which
    is the most explicit form this instruction has ever taken -- the colour itself
    names the body part.
  b5_no_colossus: >-
    Neither figure towers over the other.
  b6_drawn_not_traced: >-
    A skeleton has no outline to trace, so on the mechanism argument this should be
    a clean PASS -- the figures should be the checkpoint's own drawing with the
    checkpoint's own silhouettes. If they come back as flat mannequins ANYWAY, that
    is the single most interesting possible result on this route, because it would
    mean the tracing was never about enclosure.

verdict_rule: >-
  WRITTEN BEFORE THE PIXELS. B0 first: a sidecar that does not name the openpose
  net makes the frame VOID. Then (1) if pose binds AND two figures come back at
  their stated scales AND B4c holds AND B6 passes, the verdict is PASS and beat
  08's conditioning recipe is settled -- skeleton for staging, masked references
  for identity, both halves proven separately, and the next question is the third
  figure the beat's done_when wants. (2) If pose binds but a clause fails -- the
  figures fuse, the aim still misses, the board is gone -- the verdict names which,
  and the named remedy is multi-ControlNet (pose + depth or pose + scribble with
  staggered guidance windows; every net involved is already local and $0), which
  is the workaround the upstream issue thread itself proposes. (3) If pose does NOT
  bind on animagine -- the frame is the uncontrolled composition, or the skeleton
  is drawn as glowing lines the way rung 5's was -- then HAND-AUTHORED GEOMETRY IS
  CLOSED ON THIS CHECKPOINT ENTIRELY, not merely on the scribble net, and beat 08's
  staging goes to Route A's plate campaign with identity supplied by rung A's
  now-proven adapter. That third branch is the expensive one to learn and it is
  still worth one 17-second render.

not_done_on_purpose: >-
  ONE sample, ONE arm, ONE variable. No IP-Adapter (rung A proved it separately;
  two mechanisms in one job is a guess with a GPU attached). No `_twins` variant --
  a second 2,386 MiB for "more precise pose, lower aesthetic score" per xinsir's
  own discussion #3, and it is an A/B for AFTER a bind is demonstrated, not before.
  No multi-ControlNet. No conditioning-scale sweep: 1.0 is the card's recommended
  value and a second value needs its own question. No stroke/ratio change -- 3.0 is
  xinsir's own band for this canvas and deviating from it is the documented way to
  get an unstable result. No second seed. No board rectangle in the hint. No
  re-render of the nocontrol control, which is already published and does not depend
  on anything this job changes. No pick, no plate_ack waiver, no canon filename.

licence_note: >-
  Clean, and this is the whole reason the net was chosen. Base
  cagliostrolab/animagine-xl-3.1 (CreativeML Open RAIL++-M, use restrictions
  travel; D15). ControlNet xinsir/controlnet-openpose-sdxl-1.0, apache-2.0 on both
  its front matter and its body, with NO attribution condition -- and the driver
  now refuses any net not in an allowlist that carries its licence, so
  thibaud/controlnet-openpose-sdxl-1.0 ("License: refers to the OpenPose's one",
  inheriting CMU's non-commercial terms at the weights level) cannot be reached by
  a typo. THE HINT IS AUTHORED IN PIL from the COCO-18 spec transcribed in
  pipeline/research/openpose-controlnet-sdxl-0819.md §2 -- no preprocessor, no
  annotator, no photo-derived pose estimate -- so lllyasviel/Annotators is not
  touched on this route either, which was §10's explicit condition for opening it.

