    pre-registered 10% band. Both statures land within 4% of what was asked, which
    is the header''s pre-registered nose-not-crown effect showing up smaller than
    predicted rather than larger.'
  b1_the_pair: 'PASS. Two figures, both whole, only two.'
  b2_the_identities_separate: 'PASS -- AND IT WAS PRE-REGISTERED TO FAIL, SO THIS IS
    THE SURPRISE THIS SPEC SAID WOULD BE WORTH A RUNG. Guard head G-R = -27.5, the
    MOST human reading any frame on this beat has produced; goblin +28.0, still
