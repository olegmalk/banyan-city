script_authority: 'Node 002b-first-citizen, approved_by: founder. THIS PRODUCES A PLATE, NOT AN EPISODE:
  STEWARDSHIP 6 gates voice, footage and assembly, and a still init for an approved beat is none of those.
  inpaint_fruit.py writes approved: false and a provisional: block into its own sidecar. Beat 08''s script
  line is ''lowers the clipboard and points'' and this rung touches only the LOWERING hand -- the pointing
  arm is outside the mask and byte-restored every step. No authoring call is made here: the hand that
  grips is the plate''s own drawn fist, translated, so not one digit is invented.'
bar:
  H1_the_fist_is_GONE: 'THE ONE QUESTION THIS RUNG ASKS. The original fist must be DELETED and replaced
    by plausible harness strap, cuff and shirt: no skin-toned blob survives inside poly(FIST) grown 6,
    judged by eye at 5x. The parent PASSED this clause, so a regression here would mean the smaller mask
    starved the pass of context.'
  C4prime: 'Run pipeline/fill_quality.py on the erase region (published as 08-first-citizen-eraseonly-erase-0820.png)
    with the init as --plate: D >= 0.45 AND N >= 0.25 AND F <= 2.60. NOTE THE PARENT RETURNED **VOID**
    ON THIS CLAUSE, CORRECTLY -- its 18408 px mask left only 120 real px in the 3-12 px ring, below the
    200 px floor, so the instrument refused to score rather than guess. That is dead zone 5 behaving as
    documented. This mask is small enough that the ring clears it: measured 4673 real px on the init.'
  H3_the_digits_SURVIVED: The copied fist's fingers and thumb are still individually legible at 5x. The
    parent proved this holds at 0.99; here the copy is WHOLLY outside the mask rather than merely interior-protected,
    so it should hold more strongly.
  H5_NO_NEW_NOUN: THE CLAUSE THE PARENT BOUGHT. No face, no head, no figure, no garment placket that was
    not in the init appears anywhere in the mask. Judged by eye at 4x on the whole frame, not just the
    crop -- the parent's goblin was obvious at 1x and would have been caught by any look at all.
  B6_wardrobe: The cream shirt, the white sash and the brown wrap are still THREE garments. The mask no
    longer reaches the sash or the belt at all; what remains exposed is the shirt around the fist.
  B8_hair: 'Canon light sandy hair, not bald. 0 px of the head are in the mask AND the head must also
    fall outside the --pad-crop box: the parent showed the mask alone does not guarantee this. Measured
    as maxdiff 0 over the head box (500..640, 300..430).'
  OUT_OF_MASK_DRIFT_is_MEASURED_not_assumed: Report changed px outside the mask and their maxdiff. The
    parent read 15355 px / maxdiff 160. This mask's crop box is much smaller, so the number should fall;
    whatever it is, it is REPORTED rather than claimed to be zero, and every scale30 clause is re-measured
    on the landed frame rather than assumed to survive.
  scale30_clauses_hold: B1, B2 (goblin/guard skin separation, +60.6), B3, B4a, B4b, B4c, B5 re-measured
    on the landed frame. The board is far outside this mask and outside its crop box.
init_provenance: 'pipeline/beat08_grip_copy.py --write --variant eraseonly, selftest PASS on 19 clauses.
  init 08-first-citizen-eraseonly-0820.png sha 7cc1a4cb12ca14a3628eb9ba8b8257ccc1f07f7cf9a9727d8ce769e1d5de8d45,
  mask 08-first-citizen-eraseonly-mask-0820.png sha 8c94f1403c3e13839fe2351c70e494f9f2961c0b5a718db3f786d2a341a2d505,
  both on origin/main and fetched by sha. The INIT IS BYTE-IDENTICAL to the parent''s (same sha 7cc1a4cb...):
  the composite did not change, only the mask did, which is what makes this a one-variable sample. The
  mask is the guard''s original fist grown 10 and nothing else -- 10020 px, largest component 9956 px
  in a 102x118 box.'
pre_registered_fail_modes:
  most_likely_A_NOUN_STILL_ARRIVES: '102x118 is smaller than the region that hosted a head but it is not
    small. If a face, a hand or a bunched garment object appears, the mask is not the whole lever and
    STRENGTH is the next rung: 0.99 -> 0.70, which is still above the 0.30 structure-preserving regime.
    That is the pre-committed next step and it is one variable.'
  second_THE_FIST_ONLY_DENTS: The smaller margin gives the pass less real strap to reason from, so the
    deletion could come back partial where the parent's was complete. If so the answer is grow 10 -> 12,
    not more strength.
  third_A_SEAM_AT_THE_COPY: With no rim in the mask, the copy's stair-stepped octagonal edge is untouched
    and WILL still read as a decal. THIS IS EXPECTED, NOT A FAIL of this rung -- it is the second pass's
    job. It is written here so that seeing it does not get mistaken for a regression.
  NOT_a_fail_mode_the_vacancy_artifact: 'The corduroy comb, the smooth blob and the per-row ladder cannot
    recur: there is no vacancy and no fill function in the init.'
sample_declaration: 'ONE SAMPLE, and the SECOND on this route. The first (ep2-b08-fistcopy-0820) is why
  this one exists, and it is exactly what the founder''s 2026-08-03 rule buys: one render, seven minutes,
  $0, and a route corrected before anything was scaled. One variable moves here -- the mask. Strength
  stays 0.99 and the prompt stays byte-identical; the seed moves only because a repeat draw against a
  changed mask is a different sample, not a repeat.'
scope_limits: This does not settle beat 08's staging, and it deliberately does not attempt the forearm.
  The plate draws the guard's hand at the authored elbow and the pose hint wants it at the wrist; re-routing
  a limb needs spatial conditioning, and inpaint_fruit.py has no controlnet at all. That is a txt2img-route
  question and this rung leaves it there.
strength_argument: "CHOSEN: 0.99, at 40 steps and cfg 7.5. ONE SAMPLE.\n\nTHE FIRST DRAFT OF THIS ARGUMENT\
  \ SAID 0.55 AND IT WAS WRONG, from reasoning\nabout plain img2img when this is not that. `inpaint_fruit.py`'s\
  \ own docstring,\nsourced to the diffusers 0.29.2 pipeline it loads, settles it:\n\n    \"`strength`\
  \ must be high to ADD something. It is not the img2img case; the\n     unmasked region is restored every\
  \ step by the blend above, so a high\n     strength costs nothing outside the mask.\"\n\nThe blend it\
  \ means is SDXL inpaint's latent branch, taken because animagine has\nno inpainting variant and its\
  \ UNet has 4 input channels:\n\n    latents = (1 - init_mask) * init_latents_proper + init_mask * latents\n\
  \nand the same file records the measurement that kills the middle of the range:\nadding an object the\
  \ init lacks got **0 of 12 at strength 0.35 or 0.55**.\n\n1. WHY NOT 0.30, THE HOUSE DEFAULT (66 of\
  \ the specs in this tree).\n   `composite-init-pattern.md`: an inpaint pass runs only `int(steps x\n\
  \   strength)` of its schedule -- at 40 steps, 0.30 is TWELVE steps. That is\n   the regime chosen precisely\
  \ because it PRESERVES structure, and every\n   sibling that used it was INTEGRATING something already\
  \ drawn into the init\n   (b13's sapling, b15/b19's clone fills, beat 03's ramp given blade texture).\n\
  \   NONE of them had to DELETE a fully-inked object with its own dark outline\n   and CREATE a forearm\
  \ that is not in the plate at all. 0.30 hands the fist\n   twelve steps and a latent that still contains\
  \ it, and gets a dented fist.\n\n2. WHY 0.99 IS NOT THE RISK IT LOOKS LIKE, AND THIS IS THE PART I HAD\
  \ BACKWARDS.\n   I worried a near-fresh draw would wreck the copied digits. It cannot: the\n   digits\
  \ are OUTSIDE the mask, and the latent blend above restores every\n   unmasked pixel AT EVERY STEP.\
  \ So they are safe by construction of the\n   sampler, not by the size of the knob -- a strictly stronger\
  \ guarantee than\n   the one K3 was written to give, and it holds at any strength. The 12 px\n   contact\
  \ rim IS inside the mask and IS redrawn, which is what it was opened\n   for, and it is redrawn with\
  \ the restored digits visible as context on every\n   step rather than against a neighbour the model\
  \ cannot see.\n\n3. THE ONE LEAK, NAMED. `--blur 8` softens the mask edge, so the outermost few\n  \
  \ px of the protected digits take a fraction of the pass. That is wanted --\n   a hard protect boundary\
  \ is how you get a seam -- but it is a leak and it is\n   stated rather than denied. If the digits come\
  \ back mushy at their rim, the\n   next rung lowers `--blur`, not the strength.\n\n4. WHAT IT COSTS\
  \ AGAINST B6, B8 AND THE WARDROBE -- AND WHY \xA721'S FEAR IS\n   SMALLER THAN IT LOOKED, MEASURED.\
  \ \xA721 warned a higher strength \"re-opens\n   the exact clauses (B6, B8, the wardrobe) the 0.30 number\
  \ was bought with\".\n   Those clauses were bought at the CONDITIONING scale (`--scale2`) on a\n   WHOLE-FRAME\
  \ txt2img render -- \xA719's table is scale2 0.3/0.5/0.8, not a\n   denoise strength. A MASKED pass\
  \ cannot write one pixel outside its mask at\n   ANY strength -- that is the same latent-blend property\
  \ as part 2, and it is\n   the pipeline's behaviour rather than a hope -- so the price is not a guess\n\
  \   about the knob; it is the item's overlap with 1.82% of the frame, and K15\n   prints it:\n\n   \
  \    B8 canon hair          0 of 18200 px reachable  -- 0.0%, at any strength\n       gold chest clasp\
  \      11 of   994 px            --  1.1%, all of it\n                                             \
  \             inside the fist's own\n                                                          6 px\
  \ deletion margin\n       gold belt buckle     382 of  5366 px            --  7.1%\n       B6 white\
  \ sash        108 of   332 px            -- 32.5%\n       B6 cream shirt      5750 of 28573 px     \
  \       -- 20.1%\n\n   B8 IS UNTOUCHABLE AND THAT WAS THE LOUDEST OF THE THREE. What is genuinely\n\
  \   at risk is B6: a fifth of the cream shirt and a third of the white sash sit\n   in the corridor\
  \ the arm has to be drawn through, and at 0.99 the sampler\n   redraws that fifth from near-noise --\
  \ it may merge shirt into wrap the way\n   `--scale2` 0.5 did, inside the corridor. THAT IS THE REAL\
  \ PRICE OF THIS\n   RUNG, it is the reason the corridor was widened knowingly, and it is\n   pre-registered\
  \ as a named fail mode rather than discovered afterwards."
what_the_two_parent_runs_established: 'Measured on the landed frame, not inferred. (1) THE FIST CAN BE
  DELETED -- it was, completely. (2) THE PROTECTED DIGITS SURVIVE A 0.99 PASS -- they did, byte-intact,
  which confirms the latent-blend argument and means strength is NOT the lever that endangers them. (3)
  A ~200 px TALL MASK AT 0.99 GETS FILLED WITH A CHARACTER. (4) `--pad-crop 64` BREAKS THE OUT-OF-MASK
  GUARANTEE: the landed frame differs from its init in 15355 px OUTSIDE the mask, maxdiff 160, because
  padding_mask_crop upscales a crop and resamples it back. That is a property of the tool, it applies
  to every composite in this tree, and on that frame the guard''s head fell outside the crop box and read
  maxdiff 0 -- B8 survived by luck of geometry, not by the guarantee. IT IS IN THIS SPEC''S BAR AS A MEASURED
  CLAUSE FOR THAT REASON.'
