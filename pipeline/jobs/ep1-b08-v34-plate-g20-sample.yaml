# ep1 beat 08 "sev-1" — THE ONE SAMPLE for guidance 2.0. Do not scale from this
# until the founder has looked at the clip it produces.
#
# WHAT QUESTION THIS ANSWERS, AND WHY THE EXISTING g2.0 EVIDENCE COULD NOT.
# 07218cb established that the series runs at guidance 1.0, where the distilled
# path does no classifier-free guidance, so the negative prompt was never
# evaluated — every anti-freeze term ("frozen frame", "still image", "no motion")
# has been inert all along. One g2.0 arm exists, beat 07 r5-g20. I compared it
# frame by frame against its g1.0 pair r4 (same beat, same seed 20260738, one
# variable) and the result is:
#
#   * THE PICTURE HOLDS. The pre-registered risk was that off-spec guidance would
#     bleach or over-saturate a model distilled for CFG 1.0. It did not. Chroma
#     at frame 0 is Cab 23.10 (g2.0) against 23.08 (g1.0); mean luma 144.0 against
#     144.1; R (chroma retention f64/f0) 0.992 against 0.986. On the frames the
#     cel palette, the ink linework, the horizon and the cloud forms all hold, and
#     neither arm invents an object.
#   * THE MOTION GAIN IS MARGINAL. Total motion extent (mean of per-pixel
#     max-minus-min over the clip) 21.35 against 19.31, about +10%. Per-step
#     displacement is larger (peak consecutive-pair delta 6.25 against 3.31) but
#     g2.0 holds the on-twos cadence slightly HARDER, not less: 28 of 64 pairs
#     under 0.2 against 25 of 64.
#   * AND CRUCIALLY IT PROVES NOTHING ABOUT FREEZING, because beat 07 was never
#     frozen. It animates on twos at ~12fps effective and the original QA note
#     misread that cadence as a fault. Asking "does g2.0 unfreeze a frozen beat?"
#     of a beat that was already moving cannot return an answer.
#
# SO THE VERDICT WAS: queue the settled beats at g1.0, and test g2.0 exactly once,
# on a beat that is genuinely frozen. That is this job.
#
# WHY BEAT 08 IS THE RIGHT SUBJECT. It is the only beat in the cut with NO usable
# candidate at all — every correctly-framed arm of it is frozen:
#     08-sev-1-LTX.mp4         (r1, raw/stretched)  median 1.210,  0% frozen
#     08-sev-1-LTX-plate.mp4   (r1, plate)          median 0.131, 62% frozen
#     08-sev-1-LTX-r2.mp4      (r2, raw/stretched)  median 0.106, 62% frozen
#     08-sev-1-LTX-r2-plate    (r2, plate)          median 0.148, 62% frozen
# The v35 cut plays the r2 plate and it is the beat's worst option. The README
# says "r1 is the alternative and it moves" — that is true only of the RAW r1,
# which is a 24.4% vertical stretch and cannot go in the cut. The r1 PLATE, which
# is the only correctly-framed version of the round that moves, is frozen at 62%.
# So beat 08 cannot be fixed by overriding the round; there is nothing to
# override to. It needs new footage, which makes it the honest place to spend the
# one guidance experiment.
#
# ONE VARIABLE, AND IT IS EXACTLY THE ONE UNDER TEST. Everything here — prompt,
# negative, plate, size, frames, fps, steps, sigmas, two-stage, renderer binary,
# and the SEED 20260739 — is byte-identical to ep1-b08-v34-plate-twin-r1, the
# clip measured above at 62% frozen. Only --guidance changes, 1.0 -> 2.0. The
# comparison is therefore against a known-frozen clip rather than against nothing.
#
# PRE-REGISTERED PREDICTION, written before the frames exist so it can be scored:
# if the inert negative was ever load-bearing, the frozen-pair share should fall
# well below 62% and the sapling and grass should carry continuous ambient motion.
# If it lands near 62% anyway, then the freeze is the sampler and the conditioning
# frame, the negative prompt was never the lever, and g2.0 should be abandoned for
# this series rather than tried on more beats. I expect the picture to survive
# either way, on the beat-07 colour evidence above.
#
# HOW TO READ THE RESULT: on the frames. The flow metric is disqualified as a
# selection criterion on this series (131e433: its highest score was the beat
# where the plant fell over; bb769ad: its best beat-04 arm is the one that
# hallucinates a phone). Frozen-pair share is reported here because it is a
# CADENCE count on a beat with a measured freeze, not a quality ranking — and if
# it disagrees with the picture, the picture wins and the report says so.

