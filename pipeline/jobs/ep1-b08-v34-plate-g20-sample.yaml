consumer: >-
  the v35 provisional screening cut, for beat 08, which currently plays its worst
  available option and has no correctly-framed moving candidate in existence.
  Second consumer: the recipe decision itself — whether guidance 2.0 goes any
  further than this one clip depends on the founder looking at it.

success: >-
  A 704x1280 65-frame mp4 at
  C:\banyan-farm\v34-motion-0810\08-ltx-g20-plate-s20260739.mp4.
  The clip is a SUCCESS as an experiment whichever way the motion falls — a g2.0
  arm that stays frozen is a real answer and retires the idea. It is a FAILURE
  only if the picture breaks: bleached or over-saturated colour, lost cel
  linework, a subject that bends, droops or falls, or any human, hand, face or
  invented object. Report the frozen-pair share against the 62% of its g1.0 pair,
  and report what the frames actually look like.

why: >-
  One variable against ep1-b08-v34-plate-twin-r1 (08-ltx-plate-s20260739.mp4,
  62% frozen): --guidance 2.0 instead of 1.0. Same seed, same plate, same text.
  This is the first time the negative prompt will be evaluated on a beat that is
  actually frozen.

