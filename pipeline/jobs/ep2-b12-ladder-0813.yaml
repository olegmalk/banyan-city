# 2026-08-13. FOUNDER: "in beat 12, it shows a bunch of leaves, and they look big"
#
# This one is a CANON VIOLATION, not a taste note, which is why it gets fixed rather than
# discussed. 002b's growth ladder in style.md puts this row at roughly forty centimetres with TWO
# oversized cotyledon leaves and ONE thin bare side-branch. We have been rendering a bushy crown.
#
# The fix states the two things the prompt never said: the COUNT, exactly two leaves and one bare
# branch, and the SCALE RELATIONSHIP, no taller than the grass around it - which is the ladder's
# own wording and is what makes "small" mean something rather than being a size adjective the
# model can render at any scale. Size clauses alone are inert; a relationship to something else in
# frame is not. Negative gains the shapes it keeps producing: bush, crown, canopy, foliage mass.
#
# The plate side has the same violation and plate-drafts has it - a two-leaf prompt over a
# bushy-crown plate loses, the same way a purple fig over a green plate would.
