consumer: 'Beat 08''s plate, for its cut slot in the episode 2 assembly, and this is the first rung that
  could plausibly BE that plate rather than answer a question about it. Staging is solved -- two whole
  figures, one ground plane, no colossus, the arm on the guard in five mechanisms, and a hand that now
  arrives 52.5 px from its authored wrist. Identity is the last blocker, and it has changed shape: it
  no longer smears one attribute across both figures, it fragments WITHIN each of them. Whoever takes
  the board rung next needs to know whether a per-figure image condition fixes that, because a plate with
  a green-armed guard cannot be cut.'
success: 'One 832x1216 png with its sidecar, published to C:\banyan-farm\courier-box\farm-out\ep2-b08-twinsipa-0819
  with a sha256 manifest, and read at 1:1 beside the parent''s frame with the six per-region probes measured.
  The preflight step must print `twins net verified` and `staged driver, hint and BOTH references verified`,
  and the sidecar must read `ip_adapter_mask_geometry: capsules` with `ip_adapter_masks_overlap: false`;
  without all three the job has no result and the render is not scored.'
why: 'Both mechanisms are individually proven on this beat and the one thing that blocked composing them
  -- rectangular masks cannot separate two figures whose limbs interleave -- was fixed in the driver today
  with the interleaving case as its selftest. Two minutes, $0, no download, no provider: every weight
  is on the card and the references are already in the repo.'
