bar:
  b0_the_stack_is_what_it_claims: 'VOID-CHECK, READ FIRST, THREE LINES. (i) preflight prints `twins net
    verified: 2502139104 bytes, sha 54a2afb1bd21349e475566e5428884bc937a4caecf863b29dea08acc40612fa4`;
    (ii) preflight prints `staged driver, hint and BOTH references verified`; (iii) the sidecar reads
    `ip_adapter_mask_geometry: capsules` and `ip_adapter_masks_overlap: false` and names both reference
    shas. Missing any of the three and the frame is void -- "the adapter did nothing" and "the adapter
    never loaded" are different findings.'
  b7_no_limb_fragmentation: 'THIS RUNG''S OWN QUESTION, AND IT REPLACES THE HEAD-ONLY INSTRUMENT, WHICH
    IS NOW A KNOWN TRAP.

    INSTRUMENT: G-R sampled at SIX regions, three per figure -- face, forearm, shin. Each box is placed
    ON THE DRAWN LIMB at 1:1 and its coordinates are published in the verdict, because a box pinned to
    the authored keypoint measures whatever happens to be there and cannot tell a mis-coloured limb from
    an absent one. If a limb cannot be located within ~40 px of its authored position, that is an adherence
    failure and the region is reported UNMEASURABLE rather than scored.

    PASSES IF each figure''s WITHIN-FIGURE SPREAD (max minus min across its three regions) is <= 25.0
    levels. The parent measured 106.8 for the guard (face -58.2, forearm +48.6) and 91.4 for the goblin
    (head +67.7, legs -23.7); both must collapse. A figure whose three regions agree is one body.

    AND THE SIGNS MUST BE RIGHT, or a frame with two identical grey figures would pass: every guard region
    <= 0.0 and every goblin region >= +20.0, the same two class boundaries this beat has used since rung
    1.'
  b2_the_identities_separate: CARRIED, AND NO LONGER THE HEADLINE. Guard face <= 0.0, goblin face >= +20.0,
    separation >= +20.0. The parent already passes this at +117.4 on these boxes WITHOUT any adapter,
    so a pass here is expected and proves little on its own -- it is scored to catch the adapter DRAGGING
    the two faces together, which is the specific harm an unmasked reference would do.
  b4b_both_arms_stay_on_their_skeletons: MUST SURVIVE -- this is what the parent bought and what an adapter
    could plausibly spend. The guard's hand centroid within ~60 px of the authored wrist (280.5,695.1);
    the parent measured 52.5 px. The goblin's arm stays down, hands near y~900 against an authored wrist
    of (221,857). The two hands must not clasp.
  b4c_the_arm_belongs_to_the_guard: MUST SURVIVE. The pointing arm grows from THE GUARD's shoulder. Five
    mechanisms have held it; the uncontrolled tally at this seed is 4 of 4 on the goblin. AND ITS SKIN
    MUST NOW MATCH ITS OWNER, which is b7's business and is the whole reason her mask was widened to enclose
    the limb.
  b1_the_pair: TWO figures and only two, both whole in frame.
  b3_one_ground_plane: Both stand on the same grass. The parent measured 34 px between the two lowest
    skin rows; the ankles are not touched by this rung, so a similar deviation is expected.
  b5_no_colossus: Neither figure towers. The parent measured a ratio near 1.17 against the authored 1.100.
  b6_drawn_not_traced: Both read as drawn characters. The parent passed with the pre-registered twins
    aesthetic cost -- looser linework, a crude goblin face -- and it must not get WORSE. An adapter carrying
    structure from a clean reference could plausibly IMPROVE it, which would be a finding and not a win.
  b4a_board_down: EXPECTED FAIL, PRE-REGISTERED, NOT THIS RUNG'S VARIABLE. No object is in a pose hint.
    The remedy is multi-ControlNet pose+scribble and it is the next rung after this one.
not_done_on_purpose: ONE sample, ONE arm, ONE variable. No ip-scale sweep (0.7 is the value that worked
  first try on the contour and a second value would need its own question), no second seed, no re-authored
  hint, no re-staged arm, no conditioning-scale change, no multi-ControlNet, no board, no night or colour-cast
  fix, no pick, no plate_ack waiver and no canon filename. The purple cast the parent returned is NOT
