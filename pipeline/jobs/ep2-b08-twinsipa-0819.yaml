rights_and_weights: THIS IS THE `licence_note`. Clean. Base cagliostrolab/animagine-xl-3.1 (CreativeML
  Open RAIL++-M). ControlNet xinsir/controlnet-openpose-sdxl-1.0 twins variant, apache-2.0, no attribution
  condition, allowlisted in the driver by its upstream repo, blob name and digest. IP-Adapter h94/IP-Adapter,
  apache-2.0. Both references are repo-internal crops with no external image's terms attached. The hint
  is authored in PIL -- no annotator, so the lllyasviel/Annotators landmine is untouched.
scoring_rule_pre_registered: 'THIS IS THE `verdict_rule`, WRITTEN BEFORE THE PIXELS, and all four branches
  close something. (1) If b7 passes on both figures AND B4b, B4c, B1, B3 and B5 all survive, the verdict
  is PASS and BEAT 08 HAS ITS PLATE RECIPE: staging, gesture and identity in one render, and the only
  clause left open is the board. (2) If b7 passes but a staging clause breaks, the adapter and the pose
  net COMPETE at ip-scale 0.7 and the next rung is one sample at a lower scale -- which clause broke names
  what the adapter overrode. (3) If the fragmentation SURVIVES inside the masks, then a per-region image
  condition does not govern skin tone at all, the cause is the checkpoint''s own part-wise colour prior,
  and the next probe is a wording ablation rather than a stronger mask. (4) If the two figures come back
  matched but WRONG -- both human, or both green -- the masks are being applied in the wrong order or
  the positional zip is inverted, which is a driver bug and not a result; the sidecar''s ref/mask pairing
  is read first to tell (3) from (4).'
the_masks_are_the_hint: 'THE ONE THING A READER SHOULD CHECK FIRST. The two --ip-mask-capsules tokens
  were not typed: they are emitted by author_b08_openpose_hint.figure_capsules(stage()) -- one dilated
  capsule per limb of the SAME COCO-18 skeletons the hint PNG is drawn from, through the same LIMBS table.
  So the region each reference is applied to is, by construction, the region the ControlNet is steering,
  and the two cannot drift. Radii: 12 px on arms and legs, 30 on torso, 34 on head. THE 12 IS MEASURED:
  the guard''s authored wrist (257.4,657.3) sits 27.6 px from the goblin''s hanging arm, so two capsules
  stay disjoint while their radii sum under that -- disjoint through r=13, colliding at r=14. The hint''s
  --selftest asserts the two figures'' masks share no lit pixel while their bounding boxes DO overlap,
  which is the fact that makes rectangles impossible and capsules necessary.'
who_ruled_this_rung: ep2-b08-twins-sample-0819's verdict named it and deliberately did not file it, recording
  the rectangle problem under `the_mask_geometry_problem_that_rung_must_solve_first` and reading option
  (b), non-rectangular masks, as the honest fix. The steward approved (b) and ordered ONE sample after
  it. Its sibling ep2-b08-ipamask-0819 is where the masked IP-Adapter was proven. Written in an `extra`
  key because `fresh` prose is retokened and a parent id there would become this job's own id.
why_these_key_names: '`scoring_rule_pre_registered` and `rights_and_weights` are this spec''s `verdict_rule`
  and `licence_note`. derive_spec''s FINDINGS_NAME guard refuses any extra key matching /verdict|licen[cs]/,
  which is right for findings and over-reaches on two house keys that must be written BEFORE the pixels.
  Renamed rather than worked around, and declared here.'
