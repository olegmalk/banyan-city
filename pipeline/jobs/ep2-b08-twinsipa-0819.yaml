observed_not_scored: >-
  THREE, AND THE FIRST INVERTS A FINDING FROM THE CONTOUR ROUTE. (1) THE GUARD HAS
  SANDY HAIR AND READS MALE. His reference is BALD, and on the contour route
  (ep2-b08-ipamask-0819) that bald reference BEAT the prompt's `light sandy hair`
  and the frame came back bald. Here the mask supplied species, skin and wardrobe
  while the WORDING got its hair back -- and the parent's unambiguous blonde woman
  is gone. So a capsule mask over a skeleton does not override wording the way a
  torso rectangle over a contour did; it appears to leave attributes the reference
  does not assert to the prompt. That is a hypothesis from one frame and is worth
  its own rung before anyone relies on it. (2) THE WARDROBE IS MOSTLY BACK: a
  cream/white shirt and a brown wrap skirt, two of the three frozen garments, plus a
  brown harness with a gold clasp. The sash is brown where the cast draft freezes it
  white. (3) THE PURPLE CAST PERSISTS at mean luma 141.6 against the parent's 135.1.
  Pre-registered as not addressed, and it is the next colour question.
what_this_settles: >-
  A PER-FIGURE IMAGE CONDITION GOVERNS SKIN TONE PER LIMB, AND CAPSULE MASKS ARE
  WHAT MAKE IT REACHABLE ON THIS BEAT. Branch (3) is excluded: the fragmentation did
  not survive inside the masks, so it was never a part-wise colour prior in the
  checkpoint. Branch (2) is excluded: nothing the pose net bought was spent -- the
  hand got CLOSER to its authored wrist, the ground plane got tighter and the
  drawing got better. It also settles that the two mechanisms compose at ip-scale
  0.7 with no tuning, on the first sample, exactly as they did on the contour route.
  And it settles the shape of beat 08's remaining work: one clause, the board.
what_this_did_not_settle: >-
  THE BOARD, which needs an object in the conditioning and therefore multi-ControlNet
  pose+scribble. Nor the purple cast. Nor whether B6's improvement is the adapter
  carrying structure or this seed being kind -- one frame. Nor the hair finding in
  (1), which inverts the contour route's result and rests on a single comparison.
  Nor the third figure beat 08's done_when wants: this frame has two, as every frame
  on this route has.
what_this_does_not_license: >-
  NO PICK, NO plate_ack, NO CUT, NO CANON FILENAME. This frame is PROVISIONAL. It is
  the first frame on this beat that could plausibly BE the plate, and that makes the
  restraint matter more rather than less: choosing it is a taste call and belongs to
  the founder (R4), not to the lane that rendered it. It does not license an
  ip-scale or conditioning sweep -- 0.7 and 1.0 worked first try. It does not license
  scaling this recipe to other beats: one sample, one beat, and the board is still
  missing.
next_rung_named_not_taken: >-
  ONE sample: THE BOARD, via multi-ControlNet -- the openpose skeleton for the
  figures plus a scribble hint carrying the clipboard rectangle at the guard's hip,
  both nets composed on the same pipeline, with these two capsule masks and this
  reference pair carried unchanged. Its bar is B4a alone, with every clause passing
  here pre-registered to survive; its risk is that a second ControlNet re-opens the
  tracing question the scribble net lost on five times, so its hint must carry the
  BOARD ONLY and no figure contour. That is the last clause between beat 08 and a
  complete plate.
