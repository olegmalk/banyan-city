    y\", choices=[\"x\", \"y\"])\nap.add_argument(\"--assert-out-sha256\", default=\"\",\n                help=\"\
    refuse to finish unless the written file hashes to this\")\na = ap.parse_args()\n\nif not os.path.isfile(a.src):\n\
    \    sys.exit(\"!! src not found: %s\" % a.src)\nh = hashlib.sha256()\nwith open(a.src, \"rb\") as fh:\n   \
    \ for chunk in iter(lambda: fh.read(1 << 20), b\"\"):\n        h.update(chunk)\nhave = h.hexdigest()\nif a.sha256\
    \ and have != a.sha256:\n    sys.exit(\"!! SRC SHA MISMATCH -- refusing.\\n   want %s\\n   have %s\" % (a.sha256,\
    \ have))\n\nW, H = (int(v) for v in a.size.split(\"x\"))\nim = Image.open(a.src).convert(\"RGB\")\nsw, sh =\
    \ im.size\nscale = max(W / float(sw), H / float(sh))\nnw, nh = int(round(sw * scale)), int(round(sh * scale))\n\
    im = im.resize((nw, nh), Image.LANCZOS)\nleft, top = (nw - W) // 2, (nh - H) // 2\nim = im.crop((left, top,\
    \ left + W, top + H))\nif a.motion_blur > 0:\n    # A directional box blur: average the frame against copies\
    \ of itself shifted\n    # 1..k px along one axis. That is a linear motion smear, which is what a\n    # camera\
    \ integrating over an exposure produces. Done in numpy on floats so\n    # no intermediate rounding accumulates.\n\
    \    import numpy as np\n    arr = np.asarray(im, dtype=np.float64)\n    k = a.motion_blur\n    acc = np.zeros_like(arr)\n\
