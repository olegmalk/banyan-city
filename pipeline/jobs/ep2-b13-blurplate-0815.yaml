# 2026-08-15, plate-blur lane. Beat 13, THE SHADE. ONE SAMPLE OF LEVER L5:
# A MOTION-BLURRED INIT PLATE, AND A MATCHED CLEAN CONTROL BESIDE IT IN THE
# SAME JOB. THE INIT PNG IS THE ONLY VARIABLE -- the two render argvs are
# byte-identical apart from --jobs/--task/--bench-*, which the generator
# asserts. Generated, not hand-typed; the prompt, negative, source plate and
# plate sha are READ OUT OF pipeline/jobs/ep2-b13-stg-0815.yaml, not retyped.
#
# 1. THE SCRIPT LINE, from genomes/sapling/nodes/002b-first-citizen/node.md:
#
#      **THE SHADE -- 1:00-1:04**
#      "The scavenger slides down the trunk and folds into the sapling's tiny
#       shade, knees up around his ears."
#
# 2. WHAT IS ALREADY RULED OUT, EACH BY MEASUREMENT. Not re-derived here.
#    * WORDING. Five wordings, three seeds: no arm produced a figure still
#      acting after frame 64.
#    * THE INIT PLATE AS AN ONSET QUESTION. Onset measured across ten clips,
#      9/10 inside 0.25s. THAT IS A DIFFERENT CLAIM FROM THIS ONE -- it asked
#      WHEN motion starts and WHICH plate, never whether the plate DEPICTS
#      motion. See section 3.
#    * THE 13-LATENT COUNT. (97-1)//8+1 = 13 is correct arithmetic and the
#      latent grid is period-8 while we measure period-3 (dfa87c27).
#    * THE DECODE SIDE, END TO END. A real plate panned a fixed integer px per
#      frame came back moving on every frame; tiling ON vs OFF differed by
#      0.4 dB and nothing else (70e3c79a).
#    * STG AT UPSTREAM'S RECOMMENDED SETTING (1.0, blocks [28]): period 3 -> 3,
#      32.0 -> 32.0 distinct pictures, 8.0 -> 8.0 fps. Unmoved (369e4101).
#    * GUIDANCE 2.0 -> 1.0, the best-sourced remaining lever: see
#      pipeline/jobs/ep2-b13-guidance-0815.yaml and the CFG lane's report.
#
# 3. WHY A BLURRED PLATE, AND WHOSE WORDS THOSE ARE.
#    `Shecht-ltx`, answering "For the ltx13B model, how to increase the motion
#    size of the generated video?" in
#    github.com/Lightricks/LTX-Video/issues/184:
#
#      "You should try INCREASING THE CRF and also IF THE INITIAL FRAMES
#       CONTAINS MOTION CUES (SUCH AS MOTION BLUR) IT MAY HELP"
#
#    Semi-official at best: the handle carries the -ltx suffix but
#    author_association is NONE. We already run image-crf 33, inside the 30->35
#    band the same person names, so the CRF half is near-exhausted. The
#    motion-cue half has never been tried: our plates are clean, crisp,
#    blur-free stills.
#
# 4. THE BLUR IS DECLARED, NOT TUNED. One axis, one length. The scripted action
#    is "He rocks slowly forward and back", whose screen projection is
#    dominantly VERTICAL, so the streak runs along y; 9 px on a 1280-tall frame
#    is ~0.7% of frame height, visible as a smear without destroying the
#    linework the model is asked to continue. A different length or axis is a
#    FURTHER sample, one variable each, and this job does not license one.
#
# 5. THE BAR, WRITTEN BEFORE THE FRAMES ARE LOOKED AT.
#    The recorded control (same plate, sha, seed, prompt, negative, flags)
#    measures on pipeline/hold_period.py (d820bf3f) with the trough/peak DEPTH
#    from pipeline/vae_roundtrip.py (70e3c79a) beside it:
#
#      period 3 | strength 0.923 | DEPTH 0.038 | 32 distinct pictures | 8.0 fps
#      no terminal freeze: last change at frame 96 of 96
#
#    Depth travels with every number because the metric is SCALE-FREE and reads
#    a +-3% ripple like a freeze: a VAE round trip whose frames provably
#    advance 4px reported period 2 strength 0.90 at depth 0.971. Reference
#    depths: b13-AFTER 0.029, STG arm 0.059, b06-DONE 0.181, b02-FIXED 0.431.
#
#    PASS = period falls, or distinct pictures rise materially above 32, or the
#    figure is still acting after frame 64. FAIL = period 3 at depth ~0.03
#    again, reported exactly as loudly as a win would have been.
#    THE TRAP SPECIFIC TO THIS LEVER: a blurred plate makes the opening frames
#    SOFTER, and softness is not motion. A softer clip will also read a lower
#    absolute MAD without holding any less. The reading is the PERIOD and the
#    DISTINCT-PICTURE COUNT, both scale-free, plus depth; it is never "it looks
#    like it is moving more". Scale and drift are settled by FRAME ALIGNMENT --
#    a lane eyeballed a contact sheet twice on this beat and was wrong twice.
#
# 6. THE FRAME-62 WALL IS SCORED SEPARATELY AND MUST NOT BE CONFLATED WITH THE
#    HOLD. Two bark clips on beats 06 and 10 are BIT-IDENTICAL from frame 62 to
#    96 (ncc 1.000). Beat 13's STG sample had NO terminal freeze in either arm.
#    A clip can hold every picture for three frames and still change at frame
#    96: two phenomena, measured separately.
#
# 7. HOW THE TWO ARMS ARE KEPT MATCHED, AND THE PROOF THE DEFAULT PATH IS
#    UNCHANGED. ONE source plate at an asserted sha, cropped TWICE BY ONE
#    SCRIPT; ONE ENCODE feeding both arms; one seed; both renders in one job.
#    pipeline/ltx_i2v.py IS NOT TOUCHED -- the blur lives in this job's own
#    payload crop script, which is the STG lane's crop script plus three
#    argparse lines and one guarded block, with --motion-blur defaulting to 0.
#    THE CLEAN ARM PROVES IT: its crop step asserts its own output hashes to
#    210932b760f70ef34b97f41a28d1905ef5358e5f6982110c3f2440884b8b5199 -- the
#    init png the STG and CFG lanes rendered from -- and FAILS THE JOB rather
#    than continuing if it does not. An option that changed the default path
#    could not produce that file.
#    Recipe, unchanged and NOT under test: 704x1280, 97 frames, 24fps,
#    two-stage 8@352x640 + 3@704x1280, distilled sigmas, guidance 2.0,
#    image-crf 33, sequential offload, STG unpassed on both arms.
#
# 8. THIS IS ONE SAMPLE. Whatever it shows, nothing scales off it. On
#    2026-08-03 a recipe was picked on a steward's own metric, rendered across
#    all fifteen beats, and came back "literally just frozen frames".
