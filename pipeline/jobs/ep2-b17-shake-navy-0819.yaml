  it and changes nothing else -- same init, SAME SEED 20260941, same negative, same recipe, same frame
  count -- so any change in garment colour is attributable to the clause.

  The negative was deliberately NOT touched. Adding ''pink cloak'' there would be a second variable,
  and the cold-open sweep already showed this engine ignoring negatives it was given (four of six seeds
  pushed in against an explicit ''zoom, dolly, push in''). Naming the thing you want in the positive
  is the lever with evidence behind it; banning what you do not want is the one without.

