    src = sorted(glob.glob(src_dir + "/09-the-pause-LTX-pause-a.mp4*")
                 + glob.glob(src_dir + "/b09-init-704x1280.png")
                 + glob.glob(src_dir + "/bench-b09-pause-a.jsonl"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b09-pause-49f-0815.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
