# Both harness files were scp'd to the box at enqueue time and verified
# byte-identical to the repo copies (sha256 b245ee53.. for goblin_ipa_sample.py,
# 2174b2a8.. for green_share.py). The sampler records its own sha in every
# sidecar, so a drift between the two would be visible in the provenance rather
# than silent.
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: '1'
  HF_HOME: C:\Users\artvn\.cache\huggingface
  HF_HUB_DISABLE_XET: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '60'
  HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

steps:
- name: sample
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\wave-goblin-prep\goblin_ipa_sample.py
  - --harness
  - C:\banyan-farm\wave-goblin-prep
  - --root
  - C:\banyan-farm\wave-goblin-prep\repo
  - --refs
