  - C:\banyan-farm\goblin-ipa-0810\out8
  - --arm
  - wscale
  - --task
  - ep2-b04-goblin-ipa-wscale-0810

# allow_fail on purpose: a measurement that falls over must never retire eight
# rendered frames. The frames are the deliverable; the table is a convenience.
- name: green
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\wave-goblin-prep\green_share.py
  - baseline-tags-only|C:\banyan-farm\wave-goblin-prep\out\04-the-footnote-wave1-s*.png|sq
  - arm1-r0-all40steps|C:\banyan-farm\goblin-ipa-0810\out\04-the-footnote-ipa-r0-c060-s*.png|sq
  - arm3-r0-w015|C:\banyan-farm\goblin-ipa-0810\out3\04-the-footnote-ipa-r0-w015-s*.png|sq
  - arm3-r0-w025|C:\banyan-farm\goblin-ipa-0810\out3\04-the-footnote-ipa-r0-w025-s*.png|sq
  - arm7-r0-w015-scale080|C:\banyan-farm\goblin-ipa-0810\out8\04-the-footnote-ipa-r0-w015-c080-s*.png|sq
  - arm7-r0-w015-scale100|C:\banyan-farm\goblin-ipa-0810\out8\04-the-footnote-ipa-r0-w015-c100-s*.png|sq

- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b04-goblin-ipa-wscale"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/goblin-ipa-0810/out8/*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b04-goblin-ipa-wscale.sha256"), "w") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    # 8 stills + 8 sidecars.
    raise SystemExit(0 if len(src) == 16 else 1)

