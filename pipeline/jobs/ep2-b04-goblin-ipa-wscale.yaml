consumer: >-
  Whether the window mechanism's one measured defect — tusks going missing —
  is recoverable without giving the late steps back to the reference. The
  founder named green and named "nothing complex"; tusks are in the steward's
  unratified translation of his sentence, and a mechanism that silently deletes
  half of that translation is one nobody should describe to him as working.
  It is also the test that can falsify the structure-early / colour-late story
  this whole lane is currently reasoning from.

success: >-
  8 PNGs at C:\banyan-farm\goblin-ipa-0810\out8 with per-frame 7.2 sidecars, plus
  a green_share table over the tags-only baseline, arm 3's w015 row and these two
  higher scales on one build of one instrument. A result showing the green drains
  as scale rises is a success: the job produces the observation that breaks the
  account.

metric_warning: >-
  green_share answers the COLOUR question only, and only because its
  discrimination on this exact footage is recorded in its docstring. It says
  nothing about whether the four seeds are one creature; that is read by eye. The
  DINOv2 identity metric is NOT run here — it failed twice on this beat
  (724b616, 93356b1) and re-running it would only invite a ranking it cannot
  support.

why: >-
  One variable against arm 3's w015 cell: the scale. Reference fixed at s0,
  window fixed at 0.15 of 40 steps (6 steps), seeds fixed at the wave-1 four,
  scales 0.8 and 1.0 against its measured 0.6. Sequential, one image at a time —
  batch-of-4 configs are banned on this card.

