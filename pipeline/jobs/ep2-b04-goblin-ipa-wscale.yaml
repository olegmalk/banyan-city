# 002b beat 04 — ARM 7. The 15% window at a HARDER adapter: scale 0.8 and 1.0
# on reference s0, against arm 3's measured 0.6.
#
# THE VERDICT THIS ANSWERS TO. Roman, 2026-08-10 ~15:00: "the goblin needs abit
# more regeneration." A reject and a direction to keep iterating. Nothing in this
# job picks, ranks or promotes a frame, and nothing in it decides what the goblin
# looks like — that is R4's and it is not delegated here.
#
# WHY THIS AND NOT MORE OF THE SAME. a1dcd32 established that switching the
# IP-Adapter off partway through the denoise gets the green back without losing
# the creature: green_share 0.335 at a 15% window against the tags-only
# baseline's 0.363 and 0.012 when the reference owns all forty steps. The window
# also has ONE NAMED COST, measured and not disputed: tusks. 3 of 4 seeds carry
# them in the tags-only baseline, 1-2 of 4 at w015, 0 of 4 at w060. Tusks are
# structure, and structure is exactly what the early denoise is supposed to be
# fixing — so losing them as the adapter's TIME shrinks says the reference is not
# getting enough authority over the steps it has, not that it is arriving too
# late.
#
# THE ONE KNOB NEVER VARIED. Every window cell anyone has drawn — arm 3's four,
# arm 5's four, arm 6's two — held scale at 0.6. Time and strength are separate
# and only time has been swept. This job sweeps the other one, inside the short
# window, where the late colour-forming steps stay unconditioned either way.
#
# WHICHEVER WAY IT FALLS IT IS WORTH KNOWING. If tusks come back at 1.0/w015 with
# the green intact, the mechanism's stated cost is not a cost and the recipe to
# describe is (window short, scale high). If green drains as scale rises even
# inside a short window, then colour loss tracks TOTAL adapter influence rather
# than its timing — which contradicts the structure-early / colour-late account
# arm 3 was read through, and that account is currently doing the explaining for
# this entire lane. A result that undermines our own story is the most valuable
# thing this queue can produce.
#
# ONE REFERENCE, s0, DELIBERATELY. Each cell then differs from arm 3's measured
# w015 row by scale alone. Whether any of this generalises across references is
# arm 5's question and mixing the two would confound both.
#
# THE INSTRUMENT IS green_share.py, NOT THE IDENTITY METRIC. DINOv2 seed
# agreement is disqualified on this beat — 724b616 and 93356b1 record it calling
# four visibly different faces the same creature, twice, on a face close-up
# against a constant background it is largely scoring. green_share is used
# because its own docstring records the discrimination check on THIS footage:
# wave-1 and arm-2 frames (green to the eye) at 0.34-0.49, arm-1 frames
# (grey-teal to the eye) at 0.001-0.014, ordering matching a direct look at the
# contact sheet in all three groups. It measures the colour question only. The
# identity question — one creature or four — is read BY EYE off the frames, at
# mouth-level zoom for the tusks, and no number in this job is allowed to answer
# it. Where a number and the picture disagree the picture wins.
#
# THE READ IS A TUSK COUNT, out of four, per cell, by eye at mouth-level zoom,
# reported next to the w015 baseline of 1-2 of 4 whichever way it goes. That
# count is the whole point of the job and no number in it substitutes for the
# count.
#
# ZERO PROMPT TOKENS. Nothing is added to the description of the goblin, so
# nothing here spends the founder's "nothing complex".
#
# LICENCES, nothing new: animagine-xl-3.1 (CreativeML Open RAIL++-M, D15 open),
# h94/IP-Adapter Plus SDXL (Apache-2.0), ViT-H image encoder (MIT-derived),
# diffusers 0.29.2 (Apache-2.0). All cached on the box. $0.

