# ROUND 3 — THE GUARD REFERENCE, SOLO. One sample, four seeds, $0.
# 2026-08-12, character-consistency lane, under his consistency mandate
# (`ep2-consistency-mandate-0812`: "almost every beat includes the goblin or the
# guards so i cant approve them, you need to create proper character consistency
# ... do some evaluation ... so i dont need to keep reviewing so much").
#
# ── WHAT TWO ROUNDS MEASURED. Eight guard frames asked for TWO men and drew ONE:
# 0/4 in r1, 0/4 in r2. The goblin's sheets, drawn from the same recipe on the same
# box in the same hour, came back as clean full-length turnarounds 4/4. The
# difference is not prompt quality, it is a grammar collision — `reference sheet,
# multiple views, turnaround` MEANS one character seen from several angles, so
# `Two round guard men` read as one man drawn twice and the `2boys` count tag did
# not save it. r2 made it worse in a way worth naming: it negated `no different
# characters` beside a two-character ask, so the sheet was banning the thing it was
# requesting. Several r2 faces also came back blank.
#
# ── THE FIX IS THE COUNT, AND ONLY THE COUNT. This is the goblin's r2 recipe — the
# one that demonstrably produced standing full-body turnarounds in 4 of 4 — carrying
# the guard's frozen facts with a SOLO subject, so every tag in the string finally
# agrees with every other: `turnaround` wants one character, `1boy` declares one,
# `no multiple boys` and `no different characters` defend one.
#
# ── WHY THIS JOB SAYS `--beat 6`. `check()` derives the count tag from the draft
# text and FAULTS when it disagrees with the beat's declaration (render_wave_goblin
# .py:131), so a solo draft cannot run under beat 05's `2boys` — it would draw
# nothing and return 1. Beat 06 is `kind: guard`, `tag: 1boy`, `extra_neg: guard`:
# the same guard negative tier, and the only block in the drafts file that a solo
# guard sheet can legally run under. It is borrowed for its MECHANICS exactly as r1
# and r2 borrowed beat 05's, and its artifacts are named for that slug. THIS DOES
# NOT DRAW BEAT 06 — beat 06's own staging (clipboard filling the lower third,
# finger tracing, brow furrowed) is nowhere in this draft.
#
# ── TWO GUARDS OUT OF ONE ROUND. The pair does not have to live inside the frame.
# Four seeds of a solo turnaround is a casting call: two of them become guard A and
# guard B, each with its own conditionable sheet. That is also the shape the
# mechanism wants — an IP-Adapter reference is cropped to ONE character however many
# were drawn, so a pair sheet was never going to be conditioned on as a pair. The
# pair-ness belongs to the beat prompt, which already says two.
#
# ── ONE VARIABLE, AND WHAT I DELIBERATELY DID NOT ADD. No face tag, despite r2's
# blank faces. The goblin's identical structure came back with faces in 4/4, so the
# mannequins are more likely the eight-tiny-figures crowding of a pair ask than a
# missing tag. If faces are still empty at solo scale, THAT is the next single knob
# and this round is what makes it readable. Adding both fixes at once would have
# made neither answer legible.
#
# ── THE GARMENT AND THE REGISTER ARE NOT RE-OPENED. `plain brown tunic`, `silly
# harmless bureaucrat`, bare head and the bark clipboard are the frozen guards
# identity (`ep2-frozen-identities-0812`) passed through untouched, singular where
# the frozen text is plural. That singular IS the count fix; nothing else moved.
#
# ── HONEST PRIOR, WRITTEN BEFORE THE RENDER. The count predicate should now hit
# near 4/4 — it is the model's native sheet grammar rather than a fight with it. The
# register (`silly harmless bureaucrats`) has scored 0/4 twice and I do not expect
# the count fix to buy it; if r3 comes back as four solemn monks who are at least
# ONE solemn monk each, the count is solved and the register is the open axis.
#
# ── ITS OWN OUT DIR (`out-charref-guards-r3`), never written by another job — the
# fix for the shared-directory publish poisoning of commit c123d1bd.
#
# ── NOT A PICK, NOT CANON. Provisional under his delegated evaluation grant; his
# morning veto stands over all of it.
#
# $0 — local GPU on the rtx5090, no provider, nothing published, nothing assembled.
