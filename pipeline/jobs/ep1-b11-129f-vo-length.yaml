# ep1 beat 11 "grow" — CLIP SIZED TO ITS OWN VOICE LINE. STAGED, GATED.
#
# ================== DO NOT ENQUEUE. THE GATE BELOW IS CODE. ==================
# `gate:`/`gate_ref:` make box_enqueue.py:123-132 refuse this file outright.
# Clearing it is a human deleting the key in a commit.
#
# WHAT MUST HAPPEN FIRST: ep1-b08-313f-vo-length-0811 must have been LOOKED AT by
# Roman and accepted. Artifact:
#   C:\banyan-farm\v34-motion-0810\08-ltx-r2-plate-313f-s20260739.mp4
# That is the FIRST SAMPLE of "render the number of frames the voice line needs".
# This is a second beat on the same recipe, which the one-sample rule forbids
# until the first has been seen.
# =============================================================================
#
# THE DEFECT, MEASURED. fit_duration (render_t3.py:312) gives a voiced beat
# max(min(cdur, vdur + 2.0), vdur + 0.4) and loops footage shorter than that.
#   clips/11-vo.json          total_s 4.970  ('Latency: three days. Throughput: one leaf.')
#   review/provisional-v35/clips/11-grow.mp4   2.542s (ffprobe)
#   slot = max(min(2.542, 6.970), 5.370) = 5.370s
#   5.370 / 2.542 = the picture plays 2.11 times under the line.
# The loop is a palindrome since loop cycle 005 (render_t3.py:583), so the seam is
# continuous and the fault is the repetition, not a cut — see the b02 spec's
# header for the full correction to how this has been described.
#
# BEAT 11 ALREADY HAS AN ANIMATED CLIP AND THIS IS NOT A REJECTION OF IT.
# review/11-grow-antisplit.mp4 is a real motion clip and it is the 2.542s one now
# in the cut; it is not a held still and Roman never ruled it one. He settled
# 05/09/12/15 as held stills ("yeah keep em still") and beat 11 was NOT in that
# group. So the only thing wrong with beat 11 is that its footage is shorter than
# its sentence. One variable: the frame count.
#
# THE FRAME COUNT IS ARITHMETIC. F/24 >= 5.370 -> F >= 128.88; LTX wants 8n+1.
#   smallest 8n+1 >= 128.88 is 129 (8*16+1) -> 129/24 = 5.375s
#   5.375 >= 5.370 (nothing loops) and 5.375 <= vdur+2.0 = 6.970 (nothing trimmed).
# The margin over the slot is 0.005s. That is deliberate and it is safe here:
# fit_duration rounds to 2dp (5.37) and the held-still branch's no-epsilon warning
# at render_t3.py:589 is about a HELD STILL falling short, not about footage that
# covers the slot. The next rung, 137 frames, would be 5.708s — also inside the
# +2.0 ceiling — so if the 129 clip is seen to wrap even one frame, re-cut at 137
# and nothing else changes.
# 129 frames is far under the 385 host-RAM ceiling measured on this box.
#
# THE PLATE IS A FRAME HE HAS NOT REFUSED. shots.md:1041-1046: after the
# 2026-08-08 redraw wave, "eleven of episode 1's fifteen shots now hold a frame he
# has not refused and four do not — 3, 6, 10 and 14". Beat 11 is not in that four;
# 11-grow.png is canon and has no REVOKED variant. Beats 03/10/14 also loop and
# are EXCLUDED from this staged set for exactly that reason — motion on a drawing
# he turned down cannot ship, and their replacement pick is his (checklist item
# 10, `ep1-frame-picks`).
#
# WHAT THE MOTION MUST *NOT* BE, and this is the trap on this beat. The shot
# direction reads "Timelapse on the one new leaf" — and asking a 5.4-second clip
# to grow a leaf is a CONTENT change on a frame that is already canon, on the beat
# whose subject is the plant, in the same week the founder said "just make it tall
# in each clip of it, and thats pretty much it. dont overthink the leafs on it."
# So this asks for AMBIENT motion only, exactly as every other clip in the series
# does. The leaf trembles; it does not unfurl. If Roman wants the timelapse read,
# that is a new direction from him and a different job.
#
# THE NEGATIVE IS INERT AND IS CARRIED ANYWAY. Verified at source in the venv the
# box renders with (C:\banyan-video\venv, diffusers 0.39.0, ltx2/pipeline_ltx2.py):
#     do_classifier_free_guidance = (self._guidance_scale > 1.0)
#                                or (self._audio_guidance_scale > 1.0)
#     audio_guidance_scale = audio_guidance_scale or guidance_scale
# At guidance 1.0 both are 1.0, so there is no unconditional pass and the negative
# embeddings are never read. It is recorded for provenance (§7.2), not for effect.
#
# NO METRIC PICKS ANYTHING (131e433 — the flow metric scored highest on the beat
# where the plant fell over). Read by eye.

