success: 'THE BEAT''S OWN done_when, IN ORDER, AND IT IS THREE EVENTS: the fruit STARTS ON THE STEM, it
  FALLS, it LANDS ON THE GROUND, and HE NOTICES it. PRE-REGISTERED: (1) THERE IS A FRUIT IN THE FIRST
  FRAME AND IT IS ON THE STEM. Tonight''s w4 take had no fruit anywhere and that is the whole reason this
  exists. (2) IT LEAVES THE STEM AND REACHES THE GROUND inside the clip. A fruit that is on the stem at
  the first frame and on the stem at the last is a FAIL. (3) HE NOTICES -- his head goes down toward it
  AFTER it lands, not before. This is the clause the plate that passed 8 of 8 could never deliver, because
  that job drew a still. (4) NO CONTACT WITH HIS BODY. The beat''s definition says a take where the fruit
  touches him FAILS this beat now, however well it moves. (5) EXACTLY ONE fruit, and the plant stays rooted
  and single. (6) The canon face survives to the LAST frame: broad dome, small off-white almond eyes with
  dark pupils, near-horizontal ears. PRE-REGISTERED FAIL MODES: THE STILL-FALL-STILL SHAPE, which is EXPECTED
  rather than feared -- a fall is inherently one-shot, tonight measured that one-shot actions park, and
  beat 13 measured that putting a count on an action that cannot repeat makes it worse. If all three events
  land in order this is a PASS even with a held head and tail. THE FRUIT NOT MOVING AT ALL, which would
  say i2v will not animate a composited object and the drop needs to be authored frame by frame. THE PLANT
  DRIFTING OR GROWING, which the composite was built to stop. And the fruit falling ONTO him, which the
  definition rules out by name.'
