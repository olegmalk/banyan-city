crf_note: --image-crf 10 is inherited from the parent's render step and is asserted rather than assumed,
  because the ladder's named change for this beat WAS the crf and a child that silently ran at 33 would
  look like the rung having been fired when it had not.
expected_shape_stated_in_advance: STILL, FALL, STILL. A fall is inherently one-shot; tonight measured
  that one-shot actions park, and beat 13 measured that putting a count on an action that cannot happen
  twice makes it WORSE. So no count is put on this one. The tail is given something to do instead -- he
  keeps looking at where it landed -- which is the only lever tonight's evidence supports. If the three
  events land in order, the bar calls that a pass even with a held tail, because the beat's definition
  is about ORDER and not about filling a runtime.
the_one_variable: THE INIT, from a face plate with no plant in it to the composite plate that passed 8
  of 8 with a rooted stem, two leaves, a side-branch and one matte violet fig. The action changes with
  it and that is not a second variable being smuggled -- the old sentence describes a foot and a lean,
  and the beat is a fruit falling; a foot sentence over a fruit plate would measure nothing.
why_the_wording_may_name_objects: THIS WAVE'S FIRST LAW is that a prompt naming an object its init does
  not contain makes the model build the object and re-frame the shot to fit it -- beat 04 rotated ninety
  degrees onto its side over a trunk that was not there, tonight. The sapgloss init CONTAINS the fig,
  the stem and the leaves, so naming them is description and not summons. --selftest asserts the init
  being pointed at is the sapgloss one, because that assertion is the entire licence for the wording.
