verdict: >-
  ***THE ONLY BEAT OF THE EIGHT WHOSE DEFINITION IS FULLY MET — ALL FOUR CLAUSES, AND THE HARD
  ONE IS MEASURED.*** `done_when` is "the leaf tilts slowly and deliberately in still air and
  HOLDS; it reads as a deliberate movement, not a wind wobble; outdoors, scene at frame one."
  The leaf tilts, monotonically, over about ninety frames, in one direction with no oscillation
  and no reversal — which is what makes it read deliberate rather than as wind. AND IT STOPS:
  tracked by the topmost leaf pixel, the tip descends from row 29 at f000 to row 125 by f090 and
  then sits at row 125 for the final THIRTY-ONE FRAMES. The record claimed this ("tilts over and
  STOPS") and the claim is now measured rather than asserted. AGAINST THAT, ONE LARGE FAULT THE
  RECORD UNDERSTATES: the clip CROSS-DISSOLVES OFF ITS OWN INIT PLATE IN SEVEN FRAMES. f000 is a
  warm sunset with THREE broad rounded leaves against pink cloud; f001-f006 that picture fades
  out while a completely different one fades in beneath it; from f007 there is a single narrow
  LANCE-SHAPED leaf in a hard-banded poster landscape. Different leaf, different count, different
  palette, different style. So: PASS on this beat's own definition, FAIL on standard_0815's plate
  and identity clauses, and those are two different bars — neither is allowed to erase the other
  below.
