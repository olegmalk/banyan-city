verdict_measured:
  the_hold_is_real_and_here_is_the_instrument: >-
    The question "does it HOLD" cannot be answered off a contact sheet and cannot be answered off
    a whole-frame difference number either, because this picture's banded sky and grass re-ink
    every frame and keep the global difference well above zero forever. So the LEAF was tracked
    instead of the frame: a green mask (G-R > 18 and G-B > 10) restricted to the upper 200 rows of
    a 176x320 decode, taking the topmost masked row per frame as the leaf tip. Result — tip row by
    frame: f000:29 f010:32 f020:31 f030:36 f040:41 f050:56 f060:71 f070:91 f080:109 f090:124
    f100:125 f110:125 f120:125, AND THE LAST FIFTEEN FRAMES ARE ALL 125. So the tilt decelerates
    and stops around f090 and the leaf is then still for the remaining 31 frames.
  the_limit_of_that_instrument_stated_plainly: >-
    At a 176x320 decode one row is about four source pixels, so the strict claim is "the tip does
    not move by more than roughly one row at this sampling resolution", NOT "the leaf is
    pixel-frozen". It is a hold, not a freeze — and that distinction is the right one here, because
    exact_freeze_index.py confirms there is no freeze: `frames=121 terminal_freeze_index=None
    terminal_freeze_len=0 dup_pairs=3 runs=[(10, 2), (13, 3)]`. Three identical pairs in 120, none
    at the end. THAT COMBINATION IS EXACTLY WHAT THIS BEAT WANTS and it is worth naming as a
    pattern: a held pose that is not dead air. Compare beat 03 (59-frame identical trailing run),
    beat 13 (34) and beat 16 (63), where the "hold" is a duplicated frame and reads as the picture
    having stopped. done-definitions beats.03.hold_is_not_freeze draws this exact line; beat 21 is
    the episode's clean example of the good side of it.
  why_the_tail_lag4_of_4_4_is_not_the_leaf: >-
    Parity-collapsed lag-4 mean-abs runs 3.23 early (f008-028), 8.03 mid (f040-060), 7.64 late
    (f070-090) and 4.50 in the tail (f096-116), never reaching zero. Read naively that says the
    clip never settles. It is not the leaf: the leaf tip is provably stationary over that window,
    so the residual is the banded sky, the cloud edges and the grass re-inking frame to frame.
    Recorded because the b19 lane hit the identical trap from the other side and wrote it down —
    "M5's raw [4,4] horizon shift is the field re-inking and not a rigid pan ... because filing a
    camera fault that does not exist is its own defect." Same shape, same conclusion, second beat.
