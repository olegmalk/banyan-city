the_tusk_ruling: '`tusks, broken tusk`. It is in the script and has never been in a prompt: node.md, THE
  SPRINT -- "A SCAVENGER -- goblin-ish, enormous ears, one broken tusk, patchwork cloak". The founder
  asked what happened to the original design. `tusks` is a Danbooru tag; `one broken tusk` is the script''s
  own words and is the part expected to be ignored, which the K1 clause scores.'
