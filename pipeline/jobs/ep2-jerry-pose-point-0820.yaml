    \npay_dir = \"C:/banyan-farm/jerrypose-point-0820\"\nctl_dir = \"C:/banyan-farm/jerrypose-point-0820/src/pipeline/control\"\
    \ndst = \"C:/banyan-farm/courier-box/farm-out/ep2-jerry-pose-point-0820\"\nos.makedirs(dst, exist_ok=True)\n\
    # The HINT travels with the frame: it is the frame's condition, and a\n# reader scoring whether the\
    \ net read it needs to see it at the same\n# pixel columns.\nfiles = sorted(glob.glob(out_dir + \"\
    /ep2-jerry-pose-point-0820-posehint.png*\")\n               + glob.glob(pay_dir + \"/prompt.txt\"\
    )\n               + glob.glob(pay_dir + \"/negative.txt\")\n               + glob.glob(ctl_dir + \"\
    /jerry-skel-h19point-0820.png\"))\nlines = []\nfor f in files:\n    shutil.copy2(f, dst)\n    c =\
    \ os.path.join(dst, os.path.basename(f))\n    with open(c, \"rb\") as fh:\n        h = hashlib.sha256(fh.read()).hexdigest()\n\
    \    lines.append(h + \"  \" + os.path.basename(f))\nwith open(os.path.join(dst, \"ep2-jerry-pose-point-0820.sha256\"\
    ), \"w\",\n          newline=\"\\n\") as fh:\n    fh.write(\"\\n\".join(sorted(lines)) + \"\\n\")\n\
