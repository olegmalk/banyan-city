bar: "EVERY FRAME IS SCORED FOR ENTRY TO THE TRAINING SET, not for a cut.\n  T8 HEAD-TO-BODY. 4.5 heads\
  \ or better BY EYE against adult-b19-0819.jpg, with\n     lean limbs. n1 set the standard this batch\
  \ is held to.\n  T1 BLANK EYES -- no iris, no pupil, no lashes.\n  T2 NO HUMAN NOSE -- no bridge, no\
  \ tip, no drawn nostrils.\n  T3 NO AGE MODELLING -- no brow furrows, no folds, no jowls.\n  T7 NO PATCHWORK\
  \ ON THE SKULL. The wedge measured `patchwork cloak` bleeding\n     stitch marks onto the head in six\
  \ of eight rungs; n1-n5 did not show it at\n     full body and this batch is where that holds or does\
  \ not.\n  T9 THE POSE IS THE ONE ASKED FOR. A rung whose skeleton the net ignored is\n     not a pose\
  \ in the set, however good the figure is.\nT4 (ears) is unscorable at full body and is not scored. T6\
  \ remains STRUCK.\nA frame failing ANY clause is REJECTED from the set. The whole reason the old\n31-frame\
  \ set was untrainable is that near-misses were kept."
failure_predicted_in_advance: 'THE UPRIGHT POSES LAND AND THE FOLDED ONES ARE THE RISK, and the

  risk is specific: `sit` and `crouch` compress the skeleton into a third of the

  canvas, so the head keypoints sit far from where a standing figure''s would, and

  Sec 13''s measured binding was on two UPRIGHT figures. If the net treats a folded

  skeleton as a small figure rather than a folded one, those two come back

  correctly posed and BOBBLEHEADED -- which would say head-to-body binds through

  the ratio the whole skeleton spans and not through the head keypoints alone.

  That is worth knowing and is why they are in the batch rather than deferred.

  `reach` AND `point` ARE THE SAFEST -- legs identical to n1''s, arms the only

  change. `hunch` IS THE ONE I EXPECT THE NET TO SOFTEN: it differs from n1 by a

  quarter of a head height and 2% of stature, which may be under the net''s

  resolution, in which case it is a duplicate of n1 and not a pose.

  IF FOUR OF SIX PASS, the set reaches six poses at the tile''s proportion counting

  n1 and the stride, and the LoRA''s pose gate is discharged on arithmetic rather

  than on hope.'
one_sample_rule: DISCHARGED BY n1 AND n5, not waived. The recipe change under test -- ratified face wording
  plus an openpose skeleton at head_frac 0.190 -- was rendered as ONE sample (n1) and judged by eye before
  this set was authored, and n5 is the control that made that judgement a mechanism instead of a seed.
  This batch varies the POSE, which is the thing the sample could not vary.
the_one_variable: 'the SKELETON and the pose words that describe it, moving together: ''arm outstretched,
  pointing, in tall grass, full body''. Everything else -- the face wording, the negative, the seed, the
  scale, head_frac and the five head keypoints -- is byte-identical to ep2-jerry-skel-n1-0820''s.'
