why: 'POSE point of six, at the ratified proportion. n1 proved the skeleton carries head-to-body and n5
  -- the 3.1-head hint at the same scale, seed and words -- proved it by coming back a bobblehead on purpose.
  What is left before the Jerry LoRA can train is POSE BREADTH: the curated set is seven frames in four
  poses, and a pose-locked character LoRA is worse than none. The skeleton and the pose words move together
  here and that is the one variable.'
