# identical; --offload and --mode are memory and bookkeeping and touch no pixel.
#   1. --image-crf 33 was ADDED. It was absent, and absent means 0, and 0 BYPASSES. What it does
#      is round-trip the conditioning still through libx264 at CRF 33 and back before the still is
#      VAE-encoded. Every clip tonight is conditioned on a compressed copy of its plate. It is not
#      a mistake - upstream's media_io does exactly this at DEFAULT_IMAGE_CRF=33 deliberately, so
#      a clean PNG is out of distribution by their reckoning - but it was adopted for fidelity to
#      upstream and, as far as the ledger shows, never A/B'd against the era he is remembering.
#   2. --guidance 1.0 -> 2.0.
#
# AND ONE STORY IS ALREADY DEAD: clip length. His approved example was 313 frames, longer than
# tonight's 121, so "the new clips are longer and degrade" cannot be the explanation. Knobs first,
# per the inert-vs-outvoted law, and the knobs really do differ.
#
