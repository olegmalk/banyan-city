why: 'TWIN A - THE COMPOSITION FAULT. Round 2 fixed the binding (one restored noun turned the leaf into
  a fruit: deep purple, teardrop, hanging from a stem) but the reference then OWNED the composition. The
  prompt asked for a tiny seedling in an open field, two cotyledons, whole plant in frame; what came back
  was a macro of one fruit filling the frame with blurred grass, at dusk instead of morning, and all four
  references were near-identical - very low variance, which is the adapter dominating. Beat 01''s own
  fence is a WIDE shot of the whole 40cm plant, so a macro is the wrong shot and the beat cannot be animated
  from it. ONE VARIABLE: the window shortens to 10% and 20% instead of 15%, which is the lever that gave
  beat 03 its whole world back when the reference was overriding the scene.'
