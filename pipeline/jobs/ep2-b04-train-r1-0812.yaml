# EPISODE 2, BEAT 04 — HIS NEAR-PASS, WITH THE TWO THINGS HE NAMED. One sample, $0.
# 2026-08-12, character-consistency lane.
#
# ── HIS WORDS, AND THEY ARE THE FIRST POSITIVE ON A CONDITIONED CHARACTER BEAT: "the
# beat 04 beats are actually pretty good, only problem is it looks like he's holding
# something which is confusing." And on the motion clip cut from it: "the background is
# blank." So this round changes exactly what he named and leaves what he liked alone.
#
# ── THE HELD OBJECT WAS DIAGNOSED BEFORE IT WAS BANNED. Enlarging the lower third of
# all four frames: s0 has both hands gripping the rim of a dark rounded vessel — an
# invented prop. s2 has a blank white placard across the frame with two clawed hands on
# its edge — that is a SIGN whose text was banned, not a prop. s1 is a cream scarf and
# s3 is the coat's own toggle, and he is holding neither. Two of four, two different
# faults, and the ban is written for what was actually there rather than for the
# complaint: object, item, sign, placard.
#
# ── THE PROMPT ITSELF SAID `holding`. Wave-1's line is "HOLDING his breath with cheeks
# puffed" — the one strong verb in the sentence is the thing he objected to seeing
# drawn. The beat's INTENT is untouched (beats.json still reads "close on his face
# holding his breath"); the words sent to the model now describe the result, `cheeks
# puffed tight`, and never name the action. `empty hands` states it affirmatively too,
# because a negative on its own has to fight a verb that is still in the positive.
#
# ── THE BLANK BACKGROUND HAS A CAUSE AND IT IS NOT THE BEAT'S FAULT. Beat 04's wave-1
# draft names no location at all, and the reference it conditions on is a character
# sheet on white paper. Neither channel was asking for a field, so the sheet's ground
# won by default — the same "a reference imposes what it contains" that this lane has
# measured all day, now visible in the background as well as the pose. `in a blurred
# sunny grassy field` goes EARLY, where compress() cannot drop it.
#
# ── THE CROP IS UNCHANGED: the head crop, because beat 04 is the face-filling close-up
# and the framing rule says the reference's scope chooses the shot. That is also the
# half of the last round he liked, so it does not move.
#
# ── THIS STILL IS PIPELINE-CRITICAL: its output is the motion init for beat 04's
# re-clip.
#
# ── MEASURED BEFORE QUEUED: positive 76/77, style anchor present, nothing dropped, no
# faults, and `DRY OK` asserted present rather than inferred from the absence of an
# error string — the check that let a faulted job through earlier today.
#
# $0 — local GPU on the rtx5090, no provider, nothing published, nothing assembled.
