consumer: THE PLATE beat 02's next motion round runs on, and nothing else. It is looked at at 1:1 first;
  only then is the motion job filed against it. review/ep2-ship-0821 is not touched by this job and no
  clip changes because it landed.
success: 'ONE 832x1216 png that is the same creature with a different MOOD. F1 the brows are up and arched
  and the mouth is open wide -- panic, not the flat soldier''s line the founder named; F2 the eyes are
  BYTE-IDENTICAL to the source plate, because they are outside the mask, and the slit pupils are still
  slit pupils; F3 nothing outside the two bands moved -- ears, skull, collar, shirt, the composited sapling
  and the grass are the source plate''s; F4 no human brow ridge, no hairline, no teeth, no nose change.
  THIS JOB DECIDES NOTHING: if F1 fails the strength moves, if F2 or F3 fail the bands move, and no GPU-minute
  goes on motion either way.'
why: 'HALF OF THE FOUNDER''S BEAT-02 NOTE IS A FACE, AND ON THIS RECIPE A FACE IS PIXELS, NOT WORDS. The
  landing half of his note is an action-wording change and it rides on the motion job that runs after
  this plate is looked at; this job is only the face.


  THE FACE. ''Too serious the whole time, like a soldier.'' Expression is NOT reachable from the prompt
  on this recipe and that is measured, not assumed: ep2-jerry-expref-r2-0821 moved the mask, the adapter
  scale and the expression tags -- four interventions, MAE 28.4/24.0/7.9 between them so they were real
  -- and the face did not change, while a version carrying NO expression tags at all wore the same one.
  What did move it was repainting the brow and mouth bands of the reference. So the panic is painted into
  the plate here, over exactly those two bands, with the eyes left outside the mask because the slit pupil
  is the identity clause this character loses most often. The motion prompt''s existing ''his face DOES
  NOT CHANGE'' clause then carries it for 105 frames, which is the one thing round 2 proved that clause
  does reliably (R4 PASS, features drawn in all 105 frames, no dissolve).


  WHAT DID NOT CHANGE FROM THE PARENT: the same masked-i2i tool, the same 40 steps, the same cfg 7.5,
  the same pad-crop 64 and blur 8, the same publish-by-name discipline. The strength goes 0.30 -> 0.42
  because the parent was FINISHING a shape that had been composited in and this has to REPLACE the shapes
  it finds; 0.42 is still inside the band this repo has measured preserving layout and identity.'
