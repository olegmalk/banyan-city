  episode.
failure_predicted_in_advance: 'THE REPAINT EATS THE FACE. 0.42 over a brow band 336 px wide is a large
  hole on a stylised anime face; the named degenerate outcome is a human brow ridge, a hairline, or a
  mouth with teeth in it -- all four are in the negative and F4 is what catches them. SECOND, CHEAPER:
  0.42 is not enough to move a face that is drawn with this much ink and the brows come back as the same
  two flat strokes. F1 catches that, and the answer is a strength rung, not a new mask.'
plate_provenance: farm-out/ep2-b02-sapnat-0821/b02-sapnat-s20260820.png, 832x1216, sha256 30dce0fa..,
  asserted by the dry step and again by the repaint step before either loads a model. That is the plate
  round 2 of the canon-motion wave animated, so the only difference between round 2's clip and the next
  one is what this job paints.
the_mask_geometry_was_looked_at_before_it_was_written: The two bands were drawn as a translucent overlay
  on farm-out/ep2-b02-sapnat-0821/b02-sapnat-s20260820.png and opened at 1:1 before this spec existed.
  BROW [268,90,604,166] clears the top of the eyes by 11 px; MOUTH [334,274,506,350] starts 14 px below
  the nose and stops above the collar. The step rebuilds them from those same numbers rather than shipping
  a mask blob, so the geometry is auditable in the spec.
the_one_variable: 'THE FACE''S MOOD, painted into two bands of one plate. Everything else about the plate
  is the source plate''s, and the eyes are not even in the mask. The action wording is a SEPARATE change
  on a SEPARATE job, so a mixed result stays readable: if the motion round comes back panicked but face-planting,
  the face lever worked and the landing lever did not.'
why_this_is_two_jobs_and_not_one: 'It was one job first, and box_enqueue refused it twice. Its crop step''s
  --src was a file three steps in the future, so the plate guard could not fetch the picture and the refs
  guard could not name the job that drew it -- two BLOCKS, both correct, both waivable with plate_ack:
  and neither worth waiving. Splitting costs one round trip and pays for itself twice: the guards get
  a real farm-out directory to read, and the plate is opened at 1:1 before eight GPU-minutes go on animating
  it.'
