needs: [cuda, vram12, sdxl-venv]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  HF_HOME: C:\Users\artvn\.cache\huggingface
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "60"
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

steps:
  - name: step5
    argv:
      - C:\banyan-farm\venv\Scripts\python.exe
      - C:\banyan-farm\b06-r8\render_b06r8.py
      - --variant
      - b-clear
      - --step
      - '5'
      - --seeds
      - 20264725,20265725
      - --set
      - r8d-step5
      - --r7-dir
      - C:\banyan-farm\b06-r7
      - --root
      - C:\banyan-farm\banyan-city
      - --task
      - 001-b06-r8d-step5-0810
      - --queue-entry
      - ep1-b06-r8d-step5
      - --out
      - C:\banyan-farm\b06-r8\out-step5

  # allow_fail on purpose: a copy that falls over must never retire rendered
  # frames. The frames are the deliverable.
  - name: publish
    allow_fail: true
    argv:
      - C:\banyan-farm\venv\Scripts\python.exe
      - -c
      - |
        import glob, hashlib, os, shutil
        dst = "C:/banyan-farm/courier-box/farm-out/ep1-b06-r8d-step5"
        os.makedirs(dst, exist_ok=True)
        src = sorted(glob.glob("C:/banyan-farm/b06-r8/out-step5/*"))
        lines = []
        for f in src:
            shutil.copy2(f, dst)
            c = os.path.join(dst, os.path.basename(f))
            with open(c, "rb") as fh:
                h = hashlib.sha256(fh.read()).hexdigest()
            lines.append(h + "  " + os.path.basename(f))
        with open(os.path.join(dst, "ep1-b06-r8d-step5.sha256"), "w") as fh:
            fh.write("\n".join(lines) + "\n")
        print("published", len(src), "file(s) + manifest ->", dst)
        # 2 stills + 2 sidecars.
        raise SystemExit(0 if len(src) == 4 else 1)

artifacts:
