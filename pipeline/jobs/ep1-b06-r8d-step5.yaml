# ep1 beat 06 — THE CLOUD LADDER'S STEP 5. THE BOTTOM OF THE DIAL.
#
# THE VERDICT THIS SERVES, VERBATIM (2026-08-10, ~17:40): "this one, now im
# gonna go, bye. but actually, regenerate it. too many clouds. you almost got
# it". Composition closed — arm B, sky, no ground. The framing, the low upward
# camera and the daylight palette are his and nothing here touches them. The
# only thing that moves is how much of the frame is cloud.
#
# ---------------------------------------------------------------------------
# WHAT THIS RUNG IS FOR: ENDING THE LADDER WITH AN ANSWER, NOT A GUESS
#
# Step 5 is deliberately the last one. `fewer clouds` is a dial and nobody has
# drawn this beat along it, so the point of stepping it was to hand Roman a
# range to pick a point IN rather than another single guess to re-reject. Steps
# 1, 2, 3 and 4 walk the axis; this is the far end of it. If step 5 reads as
# materially more open than step 4, the dial had further to go and he can pick
# it. If it reads identical to step 4, that is not a wasted render — IT LOCATES
# THE BOTTOM, and it tells him the axis is exhausted so his pick is a real
# choice over the whole range rather than over however far the steward happened
# to push.
#
# ONE VARIABLE FROM STEP 4: `storm cloud` ADDED TO THE NEGATIVE. Positive is
# step 4's, byte for byte. Same model, same 832x1216, same steps, same guidance
# 7.5, same two seeds.
#
# WHY `storm cloud` AND EMPHATICALLY NOT `cloud`. This is the only rung that
# touches the negative and the distinction is the whole safety of it. The
# original sketch of this ladder said the negative would eventually gain
# "`cloud` itself". That move is now KNOWN to be the failure and is not taken
# here or anywhere. `cloud` is the only SUBJECT_ANCHOR arm B can hold —
# `scenery` sits in arm B's forbid_pos — and sending `cloud` on both sides at
# guidance 7.5 cancels precisely the direction that DELETING it cancelled on
# 2026-08-10, when six frames came back as a machine housing, a wolf head and a
# rabbit-demon. Trap 10 would not catch that: it reads the positive TEXT, so a
# `cloud` present-but-negated passes green and still empties the subject slot —
# the same failure wearing a passing test, which is worse than the failure.
#
# `storm cloud` names the cloud FORM that carries mass — the banked,
# frame-filling shape he objected to — while the bare anchor stays only in the
# positive. Suppression lands on what he complained about; the subject survives.
#
# THE HARD CONSTRAINT, AND IT WAS CHECKED BEFORE THIS FILE EXISTED. Step 3
# measured the negative at 72/77 sent, so there were roughly five tokens of
# headroom and the protective block had to fit inside them. The rule was stated
# in advance: if `storm cloud` could not fit alongside animal, bird, aircraft
# and the whole urban and ground set, THE PROTECTIVE TERMS WIN and this step
# does not ship — losing them is what produced the wolf heads.
#
# IT FITS. MEASURED ON THE BOX'S REAL CLIP (--measure, drew nothing). Positive
# 37/77, negative recipe 77 -> sent 75/77, and all 21 required negatives
# survived the trim, the protective block intact. Traps 2, 5, 6, 7+8, 9 and 10
# green, trap 10 confirming "positive keeps the subject anchor cloud". Only
# `realistic skin texture` and `jpeg artifacts` were shed, as at every step.
#   POS  no humans, clear sky, sunny, sun, sky, blue sky, day, cloud, sunlight,
#        cinematic lighting, detailed, newest, masterpiece, best quality,
#        very aesthetic
#   NEG  photorealistic, 3d render, abstract, text, watermark, signature, low
#        quality, blurry, extra limbs, deformed, leaf, plant, stem, foliage,
#        tree, photorealism, cityscape, city, building, skyline, road,
#        mountain, grass, field, horizon, ground, animal, bird, aircraft,
#        cloudy sky, overcast, storm cloud
# Two tokens of headroom left. This is the last rung the budget can hold, which
# is a second, independent reason step 5 is the end of the ladder.
#
# THE DRIVER. pipeline/render_b06r8.py over render_b06r7.py, so r7's nine traps
# still run on every frame, plus trap 10. scp'd to the box and verified
# byte-identical to the repo copy before this spec was written
# (sha256 6259529d...).
#
# NOTHING HERE IS A PICK, A PROMOTION, A PUBLICATION OR A SPEND. How few clouds
# is few enough is Roman's call alone and this job makes no part of it.

