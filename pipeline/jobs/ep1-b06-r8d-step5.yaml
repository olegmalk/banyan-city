  Roman, who is looking at the beat-6 cloud ladder right now and may pick at
  any moment. Beat 6 is the last unresolved FRAME in episode 1 and "finished"
  now means episode 1 polished and ready to publish. This rung is what turns
  the ladder from "four guesses" into a bounded range: with it he is choosing a
  point on an axis whose far end has been drawn, and if it changes nothing he
  learns the axis is spent and can pick from what exists without wondering
  whether a fifth push was left on the table.

success: >-
  Two 832x1216 PNGs with sidecars in C:\banyan-farm\b06-r8\out-step5, named
  06-too-blue-r8d-step5-s{0,1}.png, published to
  C:\banyan-farm\courier-box\farm-out\ep1-b06-r8d-step5. Read against four
