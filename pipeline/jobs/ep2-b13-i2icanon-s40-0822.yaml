bar: "THE ONLY BAR IS HIS IMAGE, AT 1:1, SIDE BY SIDE.\n`taste/refs/goblin-canon-founder-0821.png` and\
  \ this frame, same scale, nothing\nelse consulted. Not tile B, not any previous round, not a metric.\n\
  \n  E1 THE EYE. Narrow almond, off-white field, a TINY dark pupil, heavy upper\n     lid. This is the\
  \ axis four vetoes were spent on. A large round iris of any\n     colour is a FAIL, and it is the failure\
  \ every one of the sixteen prompt-\n     side rounds produced.\n  E2 THE SKULL AND EARS. Broad low dome;\
  \ smallish pointed ears sitting NEAR\n     HORIZONTAL, not swept up and back. A tall egg skull with\
  \ large upswept\n     ears is the vetoed design.\n  E3 THE FACE IS SMOOTH. No brow furrows, no nasolabial\
  \ folds, no jowls. He is\n     not an adult man.\n  E4 PALETTE. Desaturated sage, washed and high-key.\
  \ Saturated kelly green is\n     the vetoed palette.\n  E5 COSTUME. The shirt with its placket, dark\
  \ shorts, dark boots.\n\nAND ONE BAR THAT IS ABOUT THE ROUTE RATHER THAN THE FACE:\n  R1 DID ANYTHING\
  \ HAPPEN? A frame byte-identical in feel to the init is not a\n     pass, it is a null -- it means the\
  \ strength is too low to build a plate\n     from and the route needs a higher floor. Report what MOVED:\
  \ light,\n     background, grass, pose, framing.\n\nNOT SCORED, AND NAMED SO IT CANNOT BE READ AS A\
  \ MISS: THE POSE. He is standing\nin the init and beat 13 is seated. At 0.30-0.45 the init owns the\
  \ composition.\nA standing figure here is the expected result and round two is where the\nskeleton arrives."
clip77_measured_not_estimated: positive 34 of 77, negative 30 of 77, on animagine's own vocab.
failure_predicted_in_advance: 'FIRST, AND IT IS THE ONE THAT WOULD KILL THE ROUTE: R1, THE NULL.

  At 0.30 over a full frame the pass runs 12 of 40 steps from a latent that still

  holds his entire drawing, and it may simply hand back his image. That is not a

  face failure, it is a route failure of a different shape -- it would mean

  img2img-from-canon cannot produce a DIFFERENT PICTURE of him, only a re-render

  of the one we have, and the durable fix (a LoRA trained on his pixels) becomes

  the only path rather than the second step. The 0.55 probe exists to bound this.

  SECOND: THE FACE BREAKS SOMEWHERE IN THE BRACKET. Expected, and it is what a

  bracket is for. The useful outcome is the crossing point -- the highest

  strength at which E1-E5 still hold -- because that number is the route''s

  operating parameter for every beat afterwards.

  THIRD, AND IT IS NOT A FAILURE: THE POSE DOES NOT MOVE. Named in the bar above

  as not scored. Round two is ControlNet at the winning strength.

  WHAT WOULD SURPRISE ME: the face surviving at 0.55 with real scene change. That

  would mean the init carries identity far more strongly than the sixteen rounds

  of embedding work ever managed, which is the whole hypothesis, and it would

  make the goblin dataset cheap to build.'
