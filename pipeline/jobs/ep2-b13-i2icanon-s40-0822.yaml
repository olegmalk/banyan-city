round_2_lever: "NAMED BEFORE THE RENDER, in order:\n  1. THE FACE HOLDS AND NOTHING MOVED (R1 null) ->\
  \ raise the strength above the winning cell, not lower it, and the 0.55 probe already says whether that\
  \ is affordable.\n  2. THE FACE HOLDS AND THE POSE IS WRONG -> ControlNet at the winning strength, skeleton\
  \ from jerry_canon_0821. This is the expected round two.\n  3. THE FACE BREAKS AT EVERY STRENGTH THAT\
  \ MOVES ANYTHING -> the route cannot make new pictures of him and the only remaining path is a LoRA\
  \ trained on his pixels plus augmentation, which is the durable fix anyway.\nOne at a time, and at most\
  \ two rounds before this goes back to the founder either way."
