  cover it lands in. THE `trunk` WORDING IS SUPERSEDED by the founder''s ruling that the sapling is tiny
  ("thats ridiculous, lmao. the sapling is tiny"); the END STATE -- cover that is comically inadequate
  -- is what the beat needs.'
bar:
  A1_THE_PLANT_HOLDS_and_this_clause_outranks_the_others: 'At f120 there is exactly ONE plant with ONE
    thin stem and TWO leaves, still rooted, still shorter than he is. Read at 1:1 on f000/f030/f060/f090/f120
    and then consecutively if those five pass. THIS IS THE PRE-REGISTERED TOP RISK ON ALL THREE JOBS and
    it is not theoretical: ep2-b19-dropmotion-0819''s F-PLANT-REVERT fired hardest of its fail modes --
    two leaves became four or more, one fig became two, an upright stem became a horizontal runner, and
    a plant that cost four drawing rounds and a closed three-rung wording ladder was undone in 90 frames.
    No beat-19 job had ever checked the count under motion. This one does, and a plant that reverts is
    a FAIL of the job whatever else lands.'
  A2_THE_RATIFIED_ADULT_GOBLIN_HOLDS: 'The same lean wiry adult goblin man at f120 as at f000 -- green
    skin, bald head, long pointed ears -- with no drift toward a human or a child. Canon: pipeline/canon.yaml
    ep2-goblin-design-adult, founder-ratified 2026-08-19. THE PROBE IS PLACED BY EYE AT 5x ON SKIN AND
    NOT ON CLOTH, and it publishes its MATERIAL and not only its luma: the b08 rung''s first probe was
    placed by colour, landed on a cream sleeve, and would have passed a naive material test with a clean
    wrong number. Box, region and f000 reading are in `skin_probe` below; f120 must sit within +/-25 luma
    and +/-15 R-B of it, and BOTH numbers are published whatever the verdict. The probe is the filter
    and the eyes decide: this recipe has now carried the ratified adult through 121 frames on b04 and
    b09, so a failure here is news.'
  A3_CAMERA_LOCKED: No pan, tilt, dolly or zoom. Inherited clause; the parent held it, and beat 19's raw
    horizon shift was shown to be field RE-INKING rather than a camera move by the region-consistency
    test -- so a raw [dx,dy] fit is reported with its per-region spread or not at all.
  A4_IT_IS_NOT_FROZEN: 'Real motion, judged at 1:1. FAIL-FROZEN is a genuine outcome on all three of these
    and is NOT a safe result. NO WHOLE-FRAME INTERFRAME FLOOR IS SET: beat 19''s tracker self-test showed
    a PERFECT 32px subject move over a frozen background reads 0.056 whole-frame and would fail any such
    floor. A near-still beat puts its floor on the TRACKED SUBJECT, never on the frame.'
  A5_NO_EXPOSURE_BLOWOUT_and_this_one_is_RE_ROLLABLE: 'Whole-frame mean luma f000 -> f120 within +25.
    Measured because the growmotion five measured it: five seeds of ONE recipe on ONE init came back at
    +67.70, +57.06, +43.56, +22.42 and +10.68 -- a 6x spread that is SEED-SENSITIVE, not a property of
    the recipe. So a blowout here is re-rolled with a second seed before any flag is touched, and it is
    recorded as a seed result rather than as a recipe verdict.'
  B1_the_cover_is_comically_inadequate: 'At f120 he is still plainly visible with the plant in front of
    him and hiding a strip of him and nothing more. A clip in which the plant grows enough to actually
    conceal him FAILS the beat -- beats.''03''.done_when says so in as many words: ''A crouch that actually
    conceals him fails the beat.'''
  B2_he_reads_CAUGHT_OUT_rather_than_RESIGNED: 'THE CLAUSE THIS RUNG EXISTS FOR, and the open item the
    plate''s own verdict left: r1s1 read ''RESIGNED, not caught out'', and the composite pass fixed the
    size-and-position relation without touching the acting. PASS needs a visible DUCK -- head and shoulders
    lower than they start -- and a held freeze after it. Judged at 1:1 by eye. This is the one clause
    a metric cannot decide and none is offered for it.'
failure_predicted_in_advance: 'F-STANDS-UP: the only motion this plate obviously affords from a kneeling
  pose is rising, and ''he does not stand up'' is the kind of abstract prohibition the b04 head-lock rung
  proved a positive placement beats. If he rises, the next rung is a positive placement of the DOWN attitude
  (''his shoulders stay below the top of the leaves in every frame''), not a seventh wording of the negative.'
framing_measured_before_the_gpu:
  anchor: left
  why: LEFT, and it is a framing fix and not a preference. The composite mask reaches original x=67 and
    a centred crop starts at original x=81.7, so the left edge of the authored region falls outside the
    frame. Left-anchored the whole mask lands at output x 70..485 with 218 px of air to the RIGHT, and
    the discarded strip (original x > 668.7) is open field with no figure and no plant in it -- checked
    by eye on the real crop before this job was filed.
  cover_crop_arithmetic: 832x1216 -> 704x1280 scales by 1.0526 to 876x1280, so the vertical is untouched
    and 172 px come off the horizontal. A centred crop discards 81.7 ORIGINAL px per side.
  composite_mask_bbox_in_the_cropped_init:
  - 70
  - 561
  - 485
  - 1235
  asserted_by: assert_framing.py, before the model loads, against these exact numbers -- and by the mask
    rather than by a colour predicate, because these are green plants on green fields.
init_provenance: 'farm-out/ep2-b03-sapcomp-0820/b03-sapcomp-s20260820.png, sha256 7d3ab86a3f419f0d39c3c8960483008e61da99592dc77b4ff5cbb46cd2471671.
