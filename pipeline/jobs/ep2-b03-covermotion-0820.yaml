  a canon two-leaf sapling composited into the plate and CONVERTED (not pasted) by 12 of 40 denoising
  steps at strength 0.30. NOT a founder pick and not approved -- its sidecar says approved: false, provisional:
  true. Byte-identity verified three ways before this spec was written: the local copy on main, the blob
  on origin/main, and the blob on origin/farm-results-rtx5090 that box_enqueue''s plate guard actually
  reads.'
not_done_on_purpose: 'NO RECIPE CHANGE OF ANY KIND. Size, frames, fps, guidance, distilled sigmas, two-stage,
  offload, mode and --image-crf 10 are all the parent''s. No crf sweep -- 33 is established wrong, 10
  is established workable, and the optimum between them is not this beat''s question. No second seed unless
  A5 fires. No re-pick of the plate, no plate_ack, no cut, no publication. --frames 121 is a RENDER LENGTH
  and not a trim: shortening it renders a different clip rather than a cut-down of this one.'
pre_registered_fail_modes:
- F-PLANT-REVERT -- the composited sapling grows leaves, sprouts a second stem, lies down or turns into
  a bush. Beat 19's, and the one this rung most expects.
- F-PLANT-DISSOLVES -- the sapling smears back into the field. The beat-13 composite named this as its
  own top risk and it did not fire at strength 0.30; 121 frames of i2v is a different and longer exposure
  to the same risk.
- F-FROZEN -- nothing moves. A real outcome, never a safe one.
- F-IDENTITY-DRIFT -- he stops being the ratified lean adult.
- F-EXPOSURE -- the whole frame blooms pale, as four of the five growmotion seeds did. Seed-sensitive;
  re-rolled, not re-flagged.
- F-WRONG-BEAT-ANIMATED -- the engine renders an adjacent beat's action, as beat 19's take rendered beat
  20's fig-in-hands with no hand action prompted and `fruit in his hands` first in the negative. Positive
  placement beats negatives, sighted six times.
