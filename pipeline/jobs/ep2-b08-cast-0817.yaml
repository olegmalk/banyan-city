  one guard; if a third body arrives, the refs are pulling it and that is a real finding about using a two-figure ref
  on a one-guard beat. (2) THE BOARD IS IN THE GUARD''S HANDS AND ONLY HIS -- both of his hands on it, no second board,
  and no goblin hand touching it. The board reaching the goblin is the recorded 9-of-12 fault and is what the near-owner
  staging exists to prevent. CAST CONTROLS: (3) the guard has LIGHT SANDY hair, a cream shirt, a white sash and a
  brown skirt; (4) HE IS NOT BALD -- a bald guard fails outright, because bald is precisely the defect being corrected;
  (5) he reads ADULT, not a child. GOBLIN CONTROLS: (6) the goblin is green-skinned with pointed ears and a patched
  cloak, reads adult rather than a human child (a human child is the recorded beat-08 fault at two seeds), and (7)
  HIS BELLY IS VISIBLE AND UNOCCLUDED -- the beat''s `done_when` needs the belly legible as the point''s target, so
  a belly hidden behind the board or cropped out is a fail even if everything else lands. (8) his hands are EMPTY --
  no pole, no duplicate board, nothing. PROP AND WORLD CONTROLS: (9) the board is hand-sized, flat, rectangular and
  reads as BARK rather than paper, with no hand across its face -- material is scored SEPARATELY from ownership, because
  a bar that certified a prop''s material while never naming its shape scored 8/12 passes with 0/12 usable this week;
  (10) tall grass at ground level and sky ABOVE it, both with real content, no white or plain background, and not a
  downward plan view. PRE-REGISTERED FAIL MODES, recorded by name whether or not they fire: a second guard arriving
  from the refs; the board on the goblin or in both pairs of hands; the guard coming back bald; the goblin reading
  as a human child; the belly occluded by the board the guard is holding, which is the one geometric tension in this
  staging and is expected to be the closest call; eyewear appearing on either figure unprompted, which is a finding
  to hand the binding lane and NOT something this job may attempt to fix. A term found loose is said so and tightened
  FORWARD, never rewritten after seeing the picture.'
