# ep2-b08-cast-0817 -- 2026-08-17, GUARD CAST REDRAW. Beat 08, INSIDE HIM.
#
# THE LAST GUARD BEAT WITH NO FILED PLATE. 05, 06, 07, 09, 10 and 11 are all filed.
# This one was blocked on a bookkeeping question that turned out not to exist, and
# the reason it is worth stating is that the block was believed for a day:
#
#   Beat 08 was reported as needing `tag: 2boys` edited to `1boy`, on the reading
#   that my 2026-08-17 script ruling made it a two-figure beat and that `2boys`
#   was a residue of the retired three-figure master. `count_tag()` DOES NOT COUNT
#   FIGURES -- it regex-matches the LEADING Danbooru tag of compress()'s output --
#   so `tag:` records the AUTHORING CONVENTION a beat's drafts open in, and the
#   count guard in check() is an INTERNAL CONSISTENCY test between a draft and its
#   beat. Beat 07 shows the same two figures (guard + {{GOBLIN}}) opening "A guard
#   man" and declaring `1boy`, clean at 62/77. Beat 08's six drafts all open
#   "Two ..." and declare `2boys`. Both conventions are legal; nothing was wrong.
#   Forcing `1boy` was MEASURED to fault beat 08's existing `authored`
#   ("COUNT TAG is '2boys', draft declares '1boy'") and would have faulted all six.
#   So no key was edited. `authored_b08_cast_0817` was ADDED, opening "Two men,".
#
# THE CAST, and this beat is the one place the cast is COMPLETE rather than
# compromised. Founder 2026-08-16 "the cast stands as drawn"; 2026-08-17 "draw the
# second man without glasses. we need to have control." Guard 2 IS the second man
# -- guard B on the sheet: light sandy hair, cream shirt, white sash, broad brown
# wrap skirt, no eyewear. So unlike ep2-b06/b10-cast-0817, which are explicitly
# DIAGNOSTIC RUNGS because they omit guard A's wire-rims, THIS DRAFT OMITS NOTHING
# THE APPROVED CAST CARRIES. It is still not a shipping plate for the reason in
# `limits` below, but not for an eyewear reason. NO general eyewear instrument is
# attempted here -- no `glasses` in the negative, nothing -- because a separate
# lane owns that binding and `glasses` inside one man's clause landed on both men
# at 5 of 5.
#
# THE PROMPT, verbatim from pipeline/wave-drafts.yaml beats.8.authored_b08_cast_0817
# (repo sha cbb3658ed516e087bbe3725d6c5a83103ed3ab0f9480f0803cf6c713c8e732a5; the
# harness copy at C:\banyan-farm\wave-goblin-prep\wave-drafts.yaml was hashed with
# certutil AFTER the sync and MATCHES -- verified, not assumed, and the sampler
# records `drafts_sha256` in every sidecar so the frames prove it themselves):
#
#   Two men, the near one light sandy hair, cream shirt, white sash, brown skirt,
#   holds a bark clipboard in both hands, the far one a goblin, {{GOBLIN}}, patched
#   cloak, looks at his belly, arms down, tall grass, pale sky above, cinematic
#   lighting, masterpiece, best quality, very aesthetic No girl, no child, no armor,
#   no helmet, no knight, no white background, no plain background, no dark, no
#   night. No photorealism, no 3D render look. 9:16 vertical, no text.
#
# `C:\banyan-farm\wave-goblin-prep\render_wave_goblin.py` was also hashed and is
# BYTE-IDENTICAL to the repo's (be18f941...), so the measurement below was taken
# with the same checker code the box will run.
#
# TOKENS AND THE ONE TRADE, NAMED AS THE FIRST SUSPECT. 74 of 77 positive and 66 of
# 77 negative, measured through render_wave_goblin.check() on the REAL CLIP -- not
# the prose estimator, which under-counts a tag list by up to 10 tokens and reports
# headroom after CLIP has already dropped the anchor. ZERO FAULTS, style anchor
# PRESENT, count tag `2boys` against the declared `2boys`. WHAT WAS TRADED:
# `hedgerow` is gone. With it the draft measures 75/77 and compress() SHEDS `very
# aesthetic` -- the style anchor -- which is a fault (measured: 75/77 anchor
# MISSING vs 74/77 anchor PRESENT). THE STYLE TAIL IS NOT CUT and is byte-identical
# to the other seven cast drafts. `tall grass` and `pale sky above` both survive,
# so the ground band and the ABOVE-HORIZON band each keep a noun of their own.
#
# THE LAWS THIS DRAFT USES RATHER THAN FIGHTS.
#   PROP OWNERSHIP: a prop does not bind to a person clause, it goes to whoever is
#     drawn NEAREST -- four beat-10 plates lost the board to the wrong man at 4 of 4
#     with the board clause inside its owner's clause. The clipboard is GUARD 2's,
#     so guard 2 is `the near one` and holds it. Copied deliberately from
#     authored_b10_cast_0817, the only cast-correct guard draft measured clean.
#   STATE, NOT VERB: the board is AT REST in both hands. The beat's action is
#     "lowers the clipboard and points", and this model renders a verb's END state,
#     so a plate saying "lowering" or "pointing" would arrive finished with nowhere
#     to travel. The plate is the PRE state on purpose; i2v supplies the move.
#   THE HAND LAW: every hand in frame is named -- the near man's on the board, the
#     goblin's `arms down`. Beat 10's unnamed far man grew a bamboo pole at one seed
#     and a duplicate board at another WITH `weapon` negated, against beat 05's four
#     specified hands at 0 of 3.
#   THE VACANCY LAW ABOVE THE HORIZON: `pale sky above` gives the upper band its own
#     positive noun and `horizon` is negated nowhere. Beat 14 spent three rungs on
#     2026-08-17 proving the corollary -- a band above the horizon cannot be filled
#     by a ground noun, and a region with no noun comes back a flat wash.
#
# WHAT THIS DOES NOT ASK, so a passing frame is not over-read. IT DOES NOT ASK
# WHETHER THE POINT BINDS TO THE GUARD. In text-to-image a pointing arm attached to
# the goblin 3 of 3 and a board 9 of 12 however worded; `ep2-b08-twofig-both`,
# `-armonly` and `ep2-b07-twofig-turn` own that question off an init and are
# `is_show_content: false` engine probes that are never cut in. This draft asks for
# no gesture at all and deliberately does not compete with them.
#
# A REAL EXPOSURE ON THIS JOB, FOUND WHILE FILING IT AND NOT WAIVED AWAY.
# box_enqueue's `drafts_problems` docstring says: "The renderer keeps a second,
# later check of its own (see --expect-drafts-sha256) because enqueue time and run
# time are not the same moment: `--backlog` work sits for hours". THAT FLAG IS
# IMPLEMENTED NOWHERE. Grepped across the repo on 2026-08-17: the string
# `--expect-drafts-sha256` appears in exactly one place, box_enqueue.py's own
# docstring, and in none of goblin_ipa_beat.py, goblin_ipa_sample.py or
# render_wave_goblin.py. So the enqueue-time drafts comparison that this job just
# passed is the ONLY one there is, and it fires on the Mac at filing time.
#
# WHY THAT BITES THIS JOB SPECIFICALLY: it is going to BACKLOG, so it will sit. If
# any lane re-syncs a different wave-drafts.yaml to C:\banyan-farm\wave-goblin-prep
# before this runs, this job renders a different prompt and publishes it as beat
# 08's cast plate, and NOTHING WILL STOP IT. It remains DETECTABLE after the fact,
# which is the saving grace and the instruction below.
#
# SO, FOR WHOEVER SCORES THESE FRAMES -- DO THIS BEFORE BELIEVING ANY OF THEM:
# every sidecar goblin_ipa_sample.py writes carries `drafts_sha256`. It MUST read
#   cbb3658ed516e087bbe3725d6c5a83103ed3ab0f9480f0803cf6c713c8e732a5
# If it does not, these frames were drawn from wording this spec did not measure,
# the 74/77 zero-fault measurement below does not describe them, and they must be
# re-rendered rather than scored. The flag was NOT implemented here: adding a
# run-time check to a shared renderer with live peers mid-shift is new plumbing in
# somebody else's file, and the honest move is to record the gap and hand it on
# rather than to patch it quietly or to pretend the docstring is true.
#
# NO plate_ack, no drafts_ack, no gate. $0, local card, no provider, no spend.
