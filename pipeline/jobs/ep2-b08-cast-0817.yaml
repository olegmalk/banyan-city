success: 'THE BAR, PRE-REGISTERED BEFORE THE PIXELS EXIST, scored by eye per frame across all 16 and reported as N
  of 16 with a per-condition rate across the four seeds. THE TERMS THIS RUNG EXISTS FOR: (1) EXACTLY TWO FIGURES --
  ONE human guard and ONE goblin, both whole-bodied. A SECOND GUARD IS A FAIL and it is the single most likely failure
