owner: the episode-finish compositor lane, 2026-08-22
consumer: THE INIT FOR BEAT 03'S MOTION SPEC, and nothing else until then. review/ep2-ship-0821 is not
  touched and no cut moves because this landed.
success: ONE 832x1216 png in which the trunk that hides roughly one-sixth of him IS DRAWN INTO THE PLATE
  AND HAS NOT MOVED, judged by eye at 1:1. P1 stem and both leaves carry cel shading and the plate's ink
  line weight, not the compositor's flat fill; P2 root, height and leaf tips within a few px of where
  they were composited (root [420.0, 1150.0], height 480, apex [378.2, 671.8]); P3 exactly two leaves
  on one stem; P4 the goblin is untouched -- the mask is local and must not reach him; P5 the stem meets
  the grass with no floating base and no halo. The named degenerate outcome is a RELOCATED or REGROWN
  plant.
why: 'BEAT 03''S MOTION FAILS PLATE-SIDE, AND THIS DRAWS THE MISSING OBJECT INTO THE PLATE INSTEAD OF
  REWORDING THE PROMPT AT IT.


  Same root cause as b02 and the b03 verdict says so: ''the camera pulls back from ~f072 and his height
  roughly halves by f104. No trunk is ever drawn, so the beat''s cover does not exist.'' The stem runs
  up the centre across his waist, which IS the joke -- a trunk wide enough to actually hide him would
  be the wrong picture.


  WHAT IS NEW HERE AND WHAT IS NOT. Not one sampler number: strength, steps, cfg, pad-crop, blur and the
  whole inpaint payload are the parent''s, and the parent is the rung beats 03, 13, 15, 16 and 19 already
  shipped plants on. What is new is the INIT, and it is new in two ways. It is built on the pass-two finish
  plate (a 0.30 identity pass off the founder''s own canon ref, so the face is his pixels), and it is
  COLOUR GRADED -- station morning, converge t=1.00, lum 171.0 -> 131.2 -- because the prompt provably
  could not buy light: across all 19 pass-two plates the 0.30 pass moved 33-48% of pixels while the mean
  RGB moved about one level.


  ORDER NOTE: the prop is composited on the RAW plate and the grade is applied after. Compositing onto
  a graded plate trips the compositor''s own C5 luma-agreement check, and the grade is a global per-pixel
  function so it cannot introduce a seam between the prop and the plate.'
