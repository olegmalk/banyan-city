    \ 4 or 9 input\n    channels\", and at 4 (a normal SDXL checkpoint) it takes the latent-blend\n  \
    \  branch instead of concatenating mask channels:\n        latents = (1 - init_mask) * init_latents_proper\
    \ + init_mask * latents\n    HF's docs name the trade-off in their own words: \"the overall image\
    \ quality\n    may be lower, but it generally tends to preserve the mask area (that is why\n    you\
    \ can see the mask outline)\". Preserving the unmasked area is exactly what\n    we want here -- the\
    \ plate is the founder's and must come back unchanged\n    outside the mask.\n  * `padding_mask_crop`\
    \ is the countermeasure for the failure mode this beat has:\n    a SMALL object in a LARGE frame.\
    \ It crops the masked region with padding,\n    upscales that crop to the pipeline resolution, inpaints\
    \ there, and pastes it\n    back -- so the fruit is drawn at full model resolution instead of at the\
    \ ~5%\n    of the frame it will occupy. Verified present in 0.29.2's __call__ on the box.\n  * `strength`\
    \ must be high to ADD something. It is not the img2img case; the\n    unmasked region is restored\
