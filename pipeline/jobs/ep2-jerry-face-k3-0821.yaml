why: 'RUNG k3: k1''s rung with the reference''s HEAD-TO-FRAME RATIO changed from 100% to 19.1% and nothing
  else.


  WHAT k2 CLOSED. Strength is not the size dial. 0.7 -> 0.9 moved eye AREA 0.0566 -> 0.0557, which is
  1.6% relative and is noise; moved eye ASPECT 0.54/0.46 -> 0.63/0.71, i.e. AWAY from the tile''s 0.52;
  and spent the last of T8, 4.57 -> 4.41 heads against a 4.5 bar. Every effect of more strength landed
  on composition and none on the residual. The prediction filed with k2 got the T8 half right and the
  eye half WRONG, and the eye half is the one that mattered.


  WHAT BOTH k RUNGS DID DO IS INFLATE THE HEAD: head_frac drawn 0.181 (j2, no adapter) -> 0.219 (k1) ->
  0.227 (k2), against a 0.190 authored skeleton. ONE CAUSE EXPLAINS THE OVERSIZED HEAD AND THE OVERSIZED
  EYE: the reference is a head CROP, so what the adapter was shown is a head that fills a frame, and a
  mask says WHERE the adapter acts, not how big the thing it draws should be. k3 shows it the same head
  at the size a head should occupy in a full-body frame.'
