  \ as they were on j1/j2 so the numbers are comparable.\nRuler: pipeline/measure_face_eye_0821.py, whose\
  \ --selftest reproduces the\npublished f/g/h numbers before it is allowed to produce a new one.\n  T1b\
  \  AREA -- white-eye pixels over the head box. TILE 0.0143, j2 0.0353,\n       k1 0.0566. PASS is 0.030\
  \ or lower.\n       SHAPE -- per-eye aspect (h/w). TILE 0.52. Six wording rungs sat at\n       1.00-1.26;\
  \ k1 came back 0.54. PASS is a slit at 1:1, not a small oval.\n       BOTH clauses, and k1 proved they\
  \ move independently.\n  P1   a dark brow ABOVE the eyes with skin between it and the eye. 0 of 7\n\
  \       wording rungs ever scored it; k1 did. A lash arc welded to the eye rim\n       is an eyelid\
  \ and does not count.\nHELD, and a regression on any of these is a FAIL of the instrument even if the\n\
  face improves: T1 no iris and no pupil, T3 no age modelling, T8 4.5+ heads,\nP3 a mouth line, P4 facial\
  \ shading.\nT8 IS THE ONE UNDER PRESSURE AND IT IS SCORED FIRST. j2 drew 5.56 heads at\nhead_frac 0.181;\
  \ k1 drew 4.57 at 0.219, against a 0.190 authored skeleton. The\nreference is a HEAD CROP, so the adapter's\
  \ own notion of how much frame is head\nis 100%, and the mask says WHERE not HOW MUCH. Below 4.5 is\
  \ a fail.\nCONTAINMENT, and it is scored: the figure must still be STANDING, in the\npatchwork cloak,\
  \ in tall grass. None of the three predicted breaks fired on k1\nat 0.7 -- no seated pose, no purple\
  \ cowl, no tile background -- and 0.9 is\nwhere they would first show."
failure_predicted_in_advance: 'IF THE RATIO IS THE CAUSE, both defects move together: head_frac back toward
  0.190 with T8 back over 4.5, and the eye down from 1.87x the tile''s relative bounding box, while the
  brow and the 0.54 aspect survive because the head pixels are unchanged.


  IF ONLY T8 MOVES and the eye stays at 1.87x, then the eye is not downstream of the ref''s framing and
  the remaining lever is the CHECKPOINT''s own eye prior -- which no reference route reaches, and the
  honest answer becomes that this face is trainable only from frames that already have it, i.e. the seven
  mac-plate keeps plus whatever k1 can be cropped to yield.


  IF THE FACE GOES BACK TO j2''s, the adapter needed the head to fill the reference in order to bite at
  all, and the route is a face-only adapter (ip-adapter-plus-face, 847 MB, NOT cached) rather than a reframed
  reference.


  THE THING I AM NOT DOING is filing all three of those now. k2 falsified a prediction of mine an hour
  old; the next rung after this one gets authored off what k3 shows, not off which of these three I currently
  believe.'
