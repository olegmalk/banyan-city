  its own pose words out of node.md and one emotion tag, and its plate rendered and was opened at 1:1
  before this spec was written. It came back as his creature: bald, large lateral pointed ears, off-white
  eyes with slit pupils, mandarin collar, dark shorts, boots, no human nose, no folds at the mouth.


  STAGING, FROM THE APPROVED SCRIPT: WHY -- ''Close on the sapling''s leaf; the scavenger sits blurred
  behind it.'' He has no line here; the tree does. He is the still figure in the background of somebody
  else''s close-up.


