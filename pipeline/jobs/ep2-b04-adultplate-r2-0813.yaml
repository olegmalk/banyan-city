why: 'THE THIRD ATTEMPT at the hardest beat, and the first written after opening the second attempt''s
  frames rather than off its verdict. All four of those were full-body standing poses on white — the close-up
  never bound at all — with an egg-dome cranium and anime emphasis lines read as scribbles. Two named
  variables answer those two findings: framing moved out of the weightless trailing tag into the action
  clause, and a line-art block (blush, motion lines, emphasis lines, sweat drop) added to the negative,
  paid for by dropping the held-object ban whose fault is gone. The draft''s own comment carries the evidence.
  The control already exists on farm-results-rtx5090: the same draft without either change, at ep2-b04-adultplate-0813.'
