  rewritten 2026-08-17 to play at knee height (12, 13, 15, 19, 20) were put to the founder verbatim and
  his answer was "all approved" on 2026-08-19; beat 13 was additionally ratified 2026-08-18 by his own
  board ruling. node.md states the consequence in as many words: "voice synthesis, footage render and
  episode assembly are legal for all five beats as now written". THIS IS A SILENT MOTION CLIP: no voice
  synthesis, no episode assembly, no publication, and the approval confers no verdict on the pixels. The
  one thing 6 still gates on this node is the 2026-08-18 beat-17 shake restage, which this job does not
  touch. SUPERSESSION NOTE, because a reader will find the other sentence: pipeline/jobs/ep2-b15-macplate-publish-0819.yaml
  says the beat-15 6 gate is LIVE. It was, when that spec was written on the morning of 08-19; the approval
  landed later the same day.'
script_line: 'Beat 15 GOOD LISTENER (1:10-1:15), node.md:98 as rewritten 2026-08-17 and READ AND APPROVED
  BY THE FOUNDER 2026-08-19: "He tips his head down and sideways until his eyes are level with the two
  leaves, and talks to them from a hand''s width away; both of them share the frame." His spoken line
  in the beat is "You''re a good listener. The last three people I talked to filed a report." -- so a
  MOVING MOUTH is correct here, unlike beat 04.'
bar:
  S1_THE_MIDDLE_IS_STILL_ALIVE: 'THE CLAUSE THIS JOB EXISTS FOR. Whole-frame mean-absolute interframe
    luma over ALL pairs f009..f084 must land at or above 0.30, and the mouth band (300,420,420,500) over
    the same stretch at or above 0.80. THE NUMBERS ARE CALIBRATED AGAINST THIS BEAT''S OWN HISTORY AND
    NOT INVENTED: rung 2, the clip the ladder called the loosest of six, reads 0.079 / 0.200; rung 4 reads
    0.166 / 0.213; rung 5 reads 0.623 / 1.759. The floor is set at roughly HALF of rung 5 and four times
    rung 2, so a seed that merely halves the effect still passes and a seed that lands back in the old
    regime cannot. (Rung 5''s own bar asked for 1.5 on a step-frame measure; that threshold was invented
    without calibration, is above anything this engine has produced on this beat at any seed, and is retracted
    rather than carried.)'
  S2_THE_PLANT_AND_THE_SUBJECT_BOTH_HOLD: GATE. The goblin present and recognisable in all 121 frames,
    checked on a full-clip sheet; the plant ONE thin stem and TWO leaves, rooted, with no hand on it,
    at f000 f030 f060 f090 f120. If either fails nothing else is scored. Rung 3 lost the subject to one
    noun and rung 2 lost the plant to one phrase, at THIS seed; whether that was the words or the draw
    is part of what this job answers.
  S3_NO_TERMINAL_FREEZE_AND_NO_STILLNESS_TAX: 'judge_clip FREEZE none, and HOLD strength at or below 0.638
    (rung 4''s number; rung 5 read 0.559). REPORT THE PERIOD WHATEVER IT IS: rung 5 is the only clip in
    this family that reads period 2 / 60 distinct / 12.0 effective fps against everyone else''s period
    3 / 40 / 8.0, and whether that doubling is the recipe or the draw is the single most interesting thing
    this job can report. Period 1 still voids the hold statistics -- it means a cut.'
  S4_HE_DOES_NOT_RELOCATE: 'His eye band within 60 px of where it started at f105 and f120, with a background
    template published at the same frames so a camera move cannot be scored as a slide. Rung 4 slid dx
    +184 dy -30 against a background holding at dx 0..+3; rung 5 does not slide by eye. USE A TEMPLATE
    FROM f010 AND REPORT ITS RESIDUAL: on rung 5 the f010 eye-band template hit the search boundary at
    mad 35 on every later frame, which means the head had TIPPED rather than travelled and the tracker
    had nothing to lock -- a boundary hit at a high residual is a FAILED MEASUREMENT and must be reported
    as one, not as a 60 px slide.'
  S5_the_beat_still_reads: He is sitting in the grass with his knees up and both hands on his knees at
    f120; his head tips down and over toward the two leaves rather than away; his mouth is open at f030,
    f060 and f090. Read at 4x.
not_done_on_purpose: 'NO WORDING CHANGE OF ANY KIND. NO recipe change -- size, frames, fps, guidance,
  distilled sigmas, two-stage, offload, mode and --image-crf 10 are the b14 crf-10 parent''s, six rungs
  deep. NO new init, NO new sha, NO new anchor, NO new mask. NO SHORTER RENDER: --frames is an input to
  the denoiser''s temporal grid and not a crop. NO THIRD SEED FILED ALONGSIDE THIS ONE -- a sweep answers
  a question one sample has not yet asked, and if this seed agrees with rung 5 the question is closed
  at two. NO plate work: that the plate puts his face ~160 px from the leaves where the script says a
  hand''s width is real, open, and the plate lane''s. No pick, no plate_ack, no cut, no publication --
  beat 15 stays a SLATE and rung 5 is not offered as a candidate until this job reports.'
pre_registered_fail_modes:
- 'F-SEED-CARRIED-THE-RESULT -- S1 fails and the middle is dead again. NAMED AS THE OUTCOME THAT MATTERS
  MOST, because it is the one that changes what happens next: rung 5 would then be a lucky draw rather
  than a recipe, it must not be offered as a cut candidate on its own, and the honest next step is a third
  seed to see which of the two is the outlier. Beat 14''s crf-10 rung is the precedent -- believed until
  its second seed cost movement.'
- 'F-PLANT-PICKED-UP / F-SUBJECT-DELETED at a new seed -- S2''s gate. This would be the most valuable
  failure in the set: it would mean the noun law''s fixes were seed-specific, and every conclusion beat
  15 has drawn from five rungs at one seed would need re-reading.'
- 'F-PERIOD-REVERTS -- the clip comes back at period 3 / 8.0 effective fps with the middle still alive.
  That would separate two things this lane currently cannot: whether the inserted sentence bought MOTION
  or bought TEMPORAL RESOLUTION. Not a failure of the beat; a sharpening of the finding.'
- F-IDENTITY-DRIFT -- a different draw is the classic place for it. Publish luma_std with every probe
  reading; a collapse is a box on a field and an inflation is a box on an edge, and rung 4's probe collapsed
  14.3 -> 2.4 purely because the subject walked out from under it.
- F-MIDDLE-IS-A-CUT at a new seed -- answered NO on beats 03 and 13 and on rung 5, so this is carried
  for completeness. The negative's `cut to another shot` is by this ladder's own law not protection.
rung_5_the_control: ep2-b15-listenmid-0820 at seed 20260820. f009..f084 all-pairs whole-frame interframe
  0.623 and mouth band 1.759, against rung 2's 0.079 / 0.200 and rung 4's 0.166 / 0.213; judge_clip FREEZE
  none, HOLD period 2 strength 0.559, 60 distinct pictures, 12.0 effective fps -- twice the temporal resolution
  of every other clip in this family. Goblin present throughout, plant rooted, camera locked (background
  rock dx 0 dy 0, mad 3.7-4.0), and no relocation by eye where rung 4 slid 184 px.
skin_probe:
  box_xyxy_in_the_704x1280_init:
  - 302
  - 408
  - 356
  - 448
  placed_on: his left cheek, below the spectacle rim and above the cloak collar -- SKIN, not cloth, chosen
    by eye at 5x on the real cropped init and not by any colour rule
  f000_reading: R 67.9 G 114.6 B 50.3, R-B 17.6, luma 93.3 (std 20.3)
  how_to_read_it: Re-measure the same box on f120 and publish R, G, B, R-B and luma beside these. A green-skinned
    figure on a green field is exactly the case where one scalar decides nothing, so the whole triple
    is published and the verdict is written by eye against it.
  carried_verbatim_from: ep2-b15-listengrass-0820.yaml, and through it from the rung-1 spec where the
    box was placed by eye at 5x before any of these frames existed. The box is UNMOVED, because every
    rung renders the same init at the same sha, anchor and crop.
  retracted_on_rung_3_and_why: 'Rung 3''s reading of this box -- f120 luma 203.2, R-B 93.9, nominally
    a +112.9 identity catastrophe -- WAS NOT AN IDENTITY READING. luma_std collapsed 14.9 -> 3.1: a flat
    box is an empty box, and this one was sitting on lit grass because the subject was out of the picture
    entirely. PUBLISH luma_std WITH EVERY READING. A collapse means the box is on a field and an EXPLOSION
    means it is on an edge (beat 13''s went 6.0 -> 85.0); both are the premise dying and only the dispersion
    shows it. If either shape appears, the probe is RETRACTED and re-placed by eye at 5x on the frame
    in question, and the verdict is written by eye at 1:1 against a re-placed box with material published
    beside luma.'
  rung_4_re_placement_and_what_to_do_with_it: 'Rung 4''s f120 reading in the fixed box was luma 201.9
    with std 2.4 against f000''s 90.3 / 14.3 -- a COLLAPSE, i.e. an empty box, because he had translated
    184 px right out from under it. Re-placed by eye at 4x on f120 over a printed coordinate grid at (505,440,555,464)
    it read luma 92.0 / R-B 15.8 / std 13.5, i.e. +1.7 luma with the dispersion matching, and identity
    held. DO THE SAME HERE: read the fixed box first, and if its dispersion collapses or explodes, retract
    it and re-place by eye on the frame in question rather than reporting the number. A dispersion that
    jumps is a box on an edge exactly as one that collapses is a box on a field; both are the premise
    dying and only the dispersion shows it.'
the_one_variable: 'THE SEED, 20260820 -> 20260821, AND NOTHING ELSE IN THE FILE. The prompt is rung 5''s
  byte for byte -- including the inserted middle sentence -- and so are the negative, the init, its sha,
  the crop size, the anchor, 121 frames, guidance 2.0, distilled sigmas, two-stage, sequential offload
  and --image-crf 10. 20260821 is the next integer after the seed this whole family has run on, chosen
  for that reason and no other: a neighbouring integer has no more claim on a good draw than a distant
  one, and picking a seed with a story attached is how a confirmation becomes a selection.'
