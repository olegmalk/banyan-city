# 2026-08-12. THE SIZE CLAUSE FAILED. The hypothesis it leaves behind is better.
#
# ep2-b17-scale added a size-pinning sentence -- medium shot, camera is on him, fills the
# middle third, meadow behind him -- plus wide-shot bans in the negative. HE DID NOT GET
# BIGGER. He came out the same size or smaller and walked off into the meadow. The world
# survived intact, so the named failure mode (scale and environment trading off) did NOT
# happen: the clause simply did nothing.
#
# WHICH SPLITS THE LEVER IN TWO, and this is the finding. Naming the CONTENTS of a frame
# works, 7 for 7 -- objects, plants, an entire landscape. Naming the CAMERA''S RELATIONSHIP
# to those contents does not. And there is a simpler explanation sitting in every clip this
# lane has made: SHOT SCALE HAS ALWAYS TRACKED THE INIT. b04''s init is a face close-up and
# every b04 clip is a close-up. b17''s init is a full-length standing figure and every b17
# clip is a wide. b14''s medium init gives medium clips. Not once has a prompt changed the
# scale it inherited.
#
# SO THE TEST IS THE CROP, NOT THE SENTENCE. The failed size clause is REMOVED and this
# reverts to the exact b17-world prompt that produced the good background. The only change
# is that the init is pre-cropped to a medium framing before the usual cover-crop: box
# 156,0,676,945 out of the 832x1216 plate, which is head-to-waist at the 0.55 aspect the
# render wants, so the cover-crop then takes nothing off the sides. I simulated it locally
# first -- both ears survive at this box and are clipped at anything tighter.
#
# The pre-crop is done by THIS JOB''S OWN payload copy of cover_crop.py, which gains a
# --src-box argument. No pipeline code is touched.
