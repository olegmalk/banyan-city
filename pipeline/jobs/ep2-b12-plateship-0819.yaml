# ep2-b12-plateship-0819 -- 2026-08-19, beat 12/15/20 lane.
#
# WHY THIS ONE-MINUTE JOB EXISTS: BECAUSE A GUARD REFUSED, AND IT WAS RIGHT TO.
# `ep2-b12-stillmotion-0819` needs beat 12's plate as its --src. That plate lives
# in the repo at genomes/sapling/nodes/002b-first-citizen/takes/stills/, and the
# 08-13 beat-12 jobs read it off C:\banyan-farm\plates-local. So the first version
# of that motion spec fetched the plate straight into its own working directory,
# and box_enqueue.py refused it twice:
#
#   !! BLOCKED: could not fetch this job's --src, so its picture was NOT checked
#      -- and 'could not check' is not 'fine'.
#   !! BLOCKED: could not work out which job produced this job's --src, so the
#      reference set it was drawn with was NOT checked.
#
# Both refusals are correct and both have scars behind them: "two of the
# 2026-08-14 wave landed here and one of them was cropping the WRONG BEAT'S
# plate." The guard's own instruction offers two ways out -- publish the plate
# through a farm-out directory one spec owns, or waive it with `plate_ack`. THE
# WAIVER IS NOT AVAILABLE TO ME: work-ladder-0819.md's standing rules say
# "Picks, promotion and `plate_ack` are not made in a job spec." So this job is
# the other route, and it is the honest one -- after it runs, the plate is
# fetchable from origin/farm-results-rtx5090, this directory is named for the one
# spec that publishes into it, and the motion job's --src becomes checkable
# instead of asserted.
#
# Modelled on ep2-b15-macplate-publish-0819, whose refusal semantics are carried:
# every file named IN FULL with no glob, a sha256 asserted per file before
# anything is written, and a missing file is a FAIL of the job rather than a
# partial success. No GPU, so it cannot displace anything that needs one.
#
# REVISED 2026-08-19 AFTER TWO FAILED RUNS, and the revision is a correction of
# this header, not only of a step. Both runs died in `fetch` with HTTP 404
# (failed/ep2-b12-plateship-0819-1787132409.log, -1787133492.log) because they
# read the plate off raw.githubusercontent.com/olegmalk/banyan-city/main/genomes/
# ... and THE PLATE IS NOT ON MAIN AND CANNOT BE. `.gitignore:40` is
# `genomes/*/nodes/*/takes/**/*.png`: every plate under takes/ is ignored by
# design, only the .meta.yaml sidecars are tracked, and 12-related-r4-s2.png is
# untracked on disk. Raw serves README.md from this repo with a 200, so the repo
# is public and the fetch was not blocked -- it asked for a file the branch has
# never carried. (The route DOES work when the bytes are committed somewhere not
# ignored: ep2-b14-mac-plate-0818 fetches main/farm-out/... and succeeded on
# 08-18.) And the sentence this
# header used to carry, that C:\banyan-farm\plates-local "NO LONGER EXISTS on the
# box (checked, not assumed)", was WRONG: `dir /s /b C:\banyan-farm\12-related-r4
# -s2.png` returns three copies and certutil hashes all three to cc6bd5f0...c074,
# the sha the repo copy hashes to here. The plate never left the card. So the step
# is now a box-local copy with the same per-file sha assertion -- offline, no
# network dependency at all -- and the parenthetical claiming a check that had not
# been run is gone rather than softened.
