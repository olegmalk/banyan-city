  in ep2-b12-stillmotion-0819''s bar as a PLATE fault with its own route, and nothing here promotes it.'
payload:
  C:\banyan-farm\ep2-b12-plateship-0819\fetch_plate.py: "#!/usr/bin/env python3\nr\"\"\"Fetch beat 12's\
    \ plate and its sidecar, and REFUSE on any sha mismatch.\n\nNo model, no GPU, no spend. Both sha256s\
    \ below are hashes of files committed to\norigin/main, so anyone who clones the repo can verify these\
    \ assertions without\nrunning this script. The plate is the init under the beat-12 take that is in\n\
    the cut today: ep2-b12-tightB-0813's crop step names this same file at this\nsame sha.\n\"\"\"\nimport\
    \ hashlib, os, sys, urllib.request\n\nOUT = r\"C:\\banyan-farm\\ep2-b12-plateship-0819-out\"\nRAW =\
    \ (\"https://raw.githubusercontent.com/olegmalk/banyan-city/main/\"\n       \"genomes/sapling/nodes/002b-first-citizen/takes/stills/\"\
    )\nUA = {\"User-Agent\": \"banyan-city-b12-plateship/1.0 (albert.numbro@gmail.com)\"}\nWANT = [\n  \
    \  (\"12-related-r4-s2.png\",\n     \"cc6bd5f0c0cc116d3cb6530a9bae81ac5b5593a683e4e80e20d6319e0cc0c074\"\
    ),\n    (\"12-related-r4-s2.png.meta.yaml\",\n     \"ee8765db88e85d88502fa30679f34ce0a24fc63302bcd5bf1626fd594a68fee7\"\
    ),\n]\nos.makedirs(OUT, exist_ok=True)\nfor name, want in WANT:\n    raw = urllib.request.urlopen(\n\
    \        urllib.request.Request(RAW + name, headers=UA), timeout=120).read()\n    have = hashlib.sha256(raw).hexdigest()\n\
    \    if have != want:\n        sys.exit(\"!! SHA MISMATCH for %s -- refusing.\\n   want %s\\n   have\
    \ %s\"\n                 % (name, want, have))\n    with open(os.path.join(OUT, name), \"wb\") as fh:\n\
    \        fh.write(raw)\n    print(\"fetched %-32s %7d bytes  sha %s  OK\" % (name, len(raw), have),\n\
    \          flush=True)\nprint(\"both files match their asserted sha256.\", flush=True)\n"
