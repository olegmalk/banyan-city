payload:
  C:\banyan-farm\ep2-b12-plateship-0819\copy_plate.py: |
    #!/usr/bin/env python3
    r"""Copy beat 12's plate and its sidecar off THIS BOX, refusing on any sha mismatch.

    No model, no GPU, no spend, and -- the change -- NO NETWORK. The first two
    attempts at this job both died in their fetch step with `HTTP Error 404: Not
    Found` (C:\banyan-queue\failed\ep2-b12-plateship-0819-1787132409.log and
    -1787133492.log). They read the plate from
    raw.githubusercontent.com/olegmalk/banyan-city/main/genomes/... and THAT FILE IS
    NOT ON MAIN. `.gitignore:40` ignores `genomes/*/nodes/*/takes/**/*.png`, so every
    plate under takes/ is untracked by design and only the sidecars are committed.
    The repo is public -- raw serves its README with a 200 -- so nothing was denied:
    the fetch asked for a path the branch has never carried, and a sha assertion
    cannot conjure a blob that was never pushed.

    AND THE PREMISE UNDER THAT FETCH WAS FALSE. The first version of this spec said
    C:\banyan-farm\plates-local "NO LONGER EXISTS on the box (checked, not
    assumed)". It exists. On 2026-08-19 a recursive dir for 12-related-r4-s2.png
    under C:\banyan-farm returned three copies and certutil hashed all three to
    cc6bd5f0...c074 -- the same sha the repo copy hashes to on the Mac. The bytes
    were on the card the whole time and the job went to the internet for them.

    WHY A LOCAL COPY IS AS GOOD AS THE COMMITTED ONE, AND NOT A WEAKER CLAIM: the
    two sha256s below are the hashes of the files committed to main, asserted before
    anything is written. A file that matches one of them IS that committed file,
    byte for byte, whichever directory on this box it came out of. Nothing matches,
    nothing is copied, and the job exits nonzero.
    """
    import hashlib, os, shutil, sys

    OUT = r"C:\banyan-farm\ep2-b12-plateship-0819-out"
    # ORDERED, and all three were hashed by certutil before this list was written.
    # take-archive leads because it is the only one of the three that carries BOTH
    # files and is not some other job's output directory.
    DIRS = [
        r"C:\banyan-farm\take-archive\002b-first-citizen\stills",
        r"C:\banyan-farm\plates-local",
        r"C:\banyan-farm\redraw-0809\out",
    ]
    WANT = [
        ("12-related-r4-s2.png",
         "cc6bd5f0c0cc116d3cb6530a9bae81ac5b5593a683e4e80e20d6319e0cc0c074"),
        ("12-related-r4-s2.png.meta.yaml",
         "ee8765db88e85d88502fa30679f34ce0a24fc63302bcd5bf1626fd594a68fee7"),
    ]


    def sha256(path):
        h = hashlib.sha256()
        with open(path, "rb") as fh:
            for chunk in iter(lambda: fh.read(1 << 20), b""):
                h.update(chunk)
        return h.hexdigest()


    os.makedirs(OUT, exist_ok=True)
    for name, want in WANT:
        tried = []
        for d in DIRS:
            src = os.path.join(d, name)
            if not os.path.isfile(src):
                tried.append("%s -- absent" % src)
                continue
            have = sha256(src)
            if have != want:
                tried.append("%s -- sha %s" % (src, have))
                continue
            shutil.copy2(src, os.path.join(OUT, name))
            print("copied %-32s %8d bytes  sha %s  OK  <- %s"
                  % (name, os.path.getsize(src), have, d), flush=True)
            break
        else:
            sys.exit("!! NO COPY OF %s ON THIS BOX MATCHES ITS ASSERTED SHA -- refusing.\n"
                     "   want %s\n   tried:\n     %s"
                     % (name, want, "\n     ".join(tried)))
    print("both files match their asserted sha256, sourced from this box alone.",
          flush=True)
steps:
- name: copy
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\ep2-b12-plateship-0819\copy_plate.py
- name: publish
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    # EVERY FILE IS NAMED IN FULL, not matched by a glob. A glob that misses
    # publishes nothing while returning a code that reads like a fetch failure, and
    # box_enqueue.output_path_problems refuses a spec whose declared artifacts are
    # never named by any step -- which a wildcard defeats. Missing ONE file is a FAIL
    # of this job, not a partial success. No allow_fail anywhere in this spec.
    import hashlib, os, shutil
    from_dir = "C:/banyan-farm/ep2-b12-plateship-0819-out"
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b12-plateship-0819"
    NAMES = [
        "12-related-r4-s2.png",
        "12-related-r4-s2.png.meta.yaml",
    ]
    os.makedirs(dst, exist_ok=True)
    lines = []
    for name in NAMES:
        src = os.path.join(from_dir, name)
        if not os.path.isfile(src):
            raise SystemExit("!! missing %s -- publishing nothing." % name)
        shutil.copy2(src, dst)
        with open(os.path.join(dst, name), "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + name)
    with open(os.path.join(dst, "ep2-b12-plateship-0819.sha256"),
              "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(NAMES), "file(s) + manifest ->", dst)
    raise SystemExit(0)
