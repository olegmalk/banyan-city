success: 'TWO SCORES, KEPT SEPARATE ON PURPOSE, because a number and a picture can disagree here and the
  picture wins. (A) THE MEASUREMENT, pre-registered: mean absolute interframe difference at 176x320 over
  all 104 pairs, reported as the share under 0.5 and as the mean of each ten-frame block. The parent is
  89/104 with blocks 0.29 0.07 0.14 0.37 0.23 0.20 0.22 0.24 5.44 4.89 6.28. A PASS on this half is a
  large fall in the share AND no single block carrying the clip. (B) THE PERFORMANCE, by eye and it outranks
  (A): the turn must READ as one continuous departure, and the brush must read as a brush -- a hand moving
  down the front of the shirt, twice, not a twitch. A clip that scores well on (A) with a jittering figure
  is a FAIL and is reported as one, because interframe difference is not motion, it is change. CARRIED
  UNCHANGED FROM THE PARENT BAR: the face is drawn in EVERY frame of the trimmed clip and it is the CORRECTED
  face -- small off-white almond eyes with tiny dark pupils, broad dome, near-horizontal ears, sage mandarin
  collar -- checked at the LAST frame and not only the first. NOTE this beat''s own definition says the
  turn takes his face away by design, so a back-of-head final frame is NOT a face failure here; the check
  is that the face is his for as long as it is visible. PRE-REGISTERED FAIL MODES: the null, 89/104 again,
  which retires the repeat count as a lever across all six beats rather than only this one; a jitter that
  passes (A) and fails (B); the brush binding to the wrong hand or to the grass; and the turn completing
  early and holding, which is the parent''s failure arriving at a different frame rather than being fixed.'
why: 'SIX CLIPS RENDERED TONIGHT ON ONE RECIPE SPLIT CLEANLY BY HOW THEIR ACTION IS WORDED. The two prompts
  that name a repeat count -- beat 16''s ''twice ... over the whole clip'' and beat 14''s ''twice, and
  between the two'' -- are the two that move all the way through, at 0 and 56 of 104 frame pairs under
  0.5. The four that describe a one-shot sequence all park at 74 to 89 of 104, performing their single
  state change in one burst and holding a frame either side. Beat 13''s is the plainest: its action ENDS
  on the word ''still'' and the clip moves for 58 frames and is then still for 40. This job changes ONE
  STRING -- beat 17''s action sentence, from a one-shot sequence to a countable repeat plus an explicit
  whole-clip span -- and changes nothing else. The repeat chosen is a cloak brush, which is not an invention:
  this beat''s done_when is ''stand, brush, turn'' and the rendered clip never brushes, so the thing that
  tests the hypothesis is also the clause the beat is missing. $0, ~4 GPU minutes. Full trace: pipeline/derive_b17_repeat_0822.py.'
