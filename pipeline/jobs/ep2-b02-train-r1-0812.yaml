#     the beat as a MEDIUM shot of him cowering behind the stem with his face peeking
#     around it, instead of wave-1's sprint-and-dive;
#   * `green skin, bald head` — his frozen definition, so the tusk contest that the old
#     round lost 13 times out of 16 is simply not in this one.
#
# ── WHY THE REFS DIR HOLDS TWO CROPS. r0/r1 are the coat-hem crop and r2/r3 the whole
# figure. The staged draft asks for a MEDIUM shot, and the framing rule says the crop
# chooses the shot, so the coat-hem rows are the ones expected to match the beat. Having
# both in one job means the round says which was right rather than assuming it.
#
# ── WHAT I AM NOT SPENDING ROUNDS ON. The sapling. Ten beats have now failed to draw a
# 40cm two-leaf seedling, and that is a model limit and a compositing question for him,
# not a conditioning knob. This round is judged on the goblin: his consistency, and the
# hallucinated extras.
#
# ── THE REFERENCE IS APPROVED; THESE FRAMES ARE NOT. $0, local GPU, nothing published.
