# FIRST conditioning test ever run here (`ep2-b02-ipa-charref-0812`), and by today's
# standards it is built out of three things we have since replaced: raw head-and-body
# crops taken straight off a sheet, so the neighbouring head views were still in the
# corners and rendered as extra creatures; the wave-1 `authored` draft rather than the
# staged wording; and a prompt that demanded TUSKS the reference did not have. He is
# right that it hallucinates. It is also the oldest frame on the page.
#
# ── SO ROUND 1 IS NOT A NEW IDEA, IT IS BEAT 02 BROUGHT UP TO DATE. Three things
# change together, and that is deliberate — this round establishes the modern baseline
# rather than testing a hypothesis, and rounds 2 and 3 move ONE variable each from here.
#   * the APPROVED reference (`refs-goblin-frozen-0812`, his "the goblin looks good"),
#     cut by connectivity so nothing but the one figure is in the picture — the fix that
#     took stray goblins from 3 of 8 cells to none across ten beats;
