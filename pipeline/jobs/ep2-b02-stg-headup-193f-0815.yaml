# STAGING TEST, beat 02, 2026-08-15. NOT a parameter sweep. The four-arm sweep
# (crf42 / motion-negative / guidance 1.0) already ran and NO arm improved subject
# motion; the recipe below is therefore frozen at the settled values and is not
# the variable here.
#
# ================== WHAT IS ACTUALLY IN THE PLATE ==================
# Read with the Read tool at 704x1280 (the cover-cropped init, i.e. exactly what
# the model sees), before a word of prompt was written. Present:
#   - ONE character: a bald green goblin, large pointed ears, big head on a small
#     body. Standing. HEAD ALREADY TILTED DOWN, eyes half-lidded and downcast,
#     mouth a flat neutral line.
#   - His clothes: a long-sleeved collared shirt with pale rolled cuffs, dark
#     shorts, bare legs, bare feet.
#   - His hands: both, clasped together in front of his chest, fingers interlaced.
#   - Grass: a green field, sparse blades in the foreground, soft shadow patches.
#   - A pale white sky band at the very top, above a soft dark blur at the frame's
#     top edge.
#   - CAMERA: a HIGH ANGLE, already looking DOWN on him. The top of his skull
#     already owns a large share of the frame.
# ABSENT: no sapling. No stem. No soil. No pebbles. No prop. No second character.
# (The control's prompt named none of these either -- that law is already kept.)
#
# ================== THE DIAGNOSIS ==================
# A blind cold reader, given only frames and no context, said of all four sweep
# clips: "the one action on offer is a forward fold shot from an overhead angle
# that swallows the character in the top of his own skull -- in P, W and K the face
# is partly or wholly gone by the end", "the fold happens in about three frames
# while the camera swings simultaneously, so it reads as a lurch or a stumble
# rather than a deliberate crouch", and of the control "by frame 13 the face is
# gone entirely (you see a bald dome and two hands)".
#
# The plate explains that completely. Camera high + head already down + bald dome
# means the control's action -- "He drops low and presses himself flat to the
# ground" -- travels the face AWAY from the lens from frame 1. No sampler setting
# can recover a face that the staging is actively hiding. We have been tuning a
# render recipe for a shot that hides its own subject.
#
# ================== THE ONE VARIABLE: THE STAGING ==================
# Positive prompt action clause ONLY. Held byte-identical to the control
# ep2-b02-nw-0815: source plate + sha, cover_crop.py, seed 20260815, negative
# prompt, style tail, 704x1280, 97 frames, 24 fps, guidance 2.0, distilled sigmas,
# two-stage, image-crf 33, sequential offload.
#
#   control: "He drops low and presses himself flat to the ground."
#   here:    "He raises his head from looking down until he is looking straight
#             up at the camera, and his eyes open wide."
#
# WHY THIS APPROACH AND NOT THE OTHER TWO ON OFFER:
#   - "specify a low camera so the fold is seen in profile" is REJECTED. LTX i2v
#     cannot reposition a camera that the init image has already fixed; the init
#     IS the camera. Asking for a low angle would either be ignored or answered
#     with a restyle/cut, and the negative bans camera moves outright. You cannot
#     prompt your way out of the lens you shot on.
#   - "keep the fold but have him turn his head toward camera" is REJECTED. That
#     is two simultaneous movements, which is the exact recipe the blind reader
#     already called a lurch, and the face still travels toward the top of the
#     skull for most of the clip's duration.
#   - CHOSEN: replace the fold with a single-joint action that keeps the head UP.
#     A neck rotation is inherently one continuous movement -- there is no second
#     limb to desynchronise from -- so the "three frames plus a swing = stumble"
#     failure is structurally unavailable to it. And it is the one action that
#     moves the face TOWARD the lens instead of away: the camera is high and he is
#     looking down, so lifting the chin rotates the face INTO the shot. Face
#     readability at the END should be strictly BETTER than at frame 0. That makes
#     this the maximally diagnostic staging test rather than merely a safer one.
#     Continuity without a stillness word: the clause names a START and an END for
#     the rotation ("from looking down" -> "until looking straight up"), giving the
#     movement a long arc to spend frames on. No "slowly", no "gently", no
#     stillness clause -- those are what the loosened-recipe rules removed.
#     "his eyes open wide" is part of the same head action and is aimed at the
#     reader's third complaint, that "the expression never changes in any clip".
#   NOUN LAW: he, his head, his eyes -- all in the init. Nothing else named.
#
# ================== THE PREDICTION (written BEFORE enqueue) ==================
# Control, for comparison: head 0.461 | body 7.687 | tail 0.075 | motion window
# 1.04s -> 3.42s | cadence 2.14x | flash 30.6.
#
# 1. FRAME-DIFFERENCE WILL GO DOWN, AND THAT IS NOT A FAILURE. A neck rotation
#    moves a small fraction of the pixels a whole-body fold moves. I predict the
#    segmented body-window mean lands BELOW the control's 7.687, in the range
#    2.0-6.0. I am saying this in advance precisely so I cannot later dress a
#    lower number up as a win by surprise, nor a win up as a loss.
# 2. THE MOTION WINDOW WILL BE LONGER AND START NO LATER. A chin arc with a named
#    start and end has distance to spend. I predict onset at or before 1.04s and
#    the window still live past 3.42s.
# 3. CADENCE WILL SURVIVE, ~2x. The period-2 high/low alternation is a sampler or
#    decoder artifact and has nothing to do with what the character is asked to do.
#    If it moves a lot, then staging was confounded with it and I will say so
#    rather than claim the credit.
# 4. THE FACE WILL BE READABLE IN THE FINAL FRAME -- more readable than in frame
#    0, chin up and eyes visible, not a bald dome. THIS IS THE LOAD-BEARING CLAIM
#    and the whole test rides on it.
# 5. THE BLIND READER WILL NAME A HEAD/LOOKING-UP ACTION, will say the face IS
#    readable at the end, and will NOT use the words lurch, stumble or reverse.
#
# ================== WHAT WOULD FALSIFY IT ==================
# Any ONE of these means STAGING IS NOT THE PROBLEM and the defect is back in the
# model or the recipe, where the sweep left it:
#   a. The blind reader again reports the face gone, hidden or unreadable at the
#      end. If the face disappears even when the action explicitly points it at the
#      lens, then the model erases faces regardless of what it is asked to do, and
#      no amount of restaging will save this shot.
#   b. The blind reader calls the clip frozen or motionless AND the body-window
#      mean collapses below ~1.0. That would mean the forward fold was carrying
#      ALL the motion -- that face-swallowing is simply the price of any movement
#      at all from this model -- and staging is not a free fix but a trade.
#   c. The reader still reports a lurch, a stumble, or a movement that reverses.
#      A single-joint rotation cannot desynchronise from a second limb, so if it
#      lurches anyway then the compound-action explanation was wrong and the lurch
#      is a sampler property.
# A result where the number falls AND the blind read improves is a WIN: the metric
# is a floor, never a verdict, and where the number and the eye disagree the eye
# wins. A result where the number RISES but the reader still cannot find the face
# is a LOSS, and will be reported as one.
#
# NOTHING HERE IS PROMOTED TO CANON. One clip. If it works the next test is named
# in the report and then this stops -- ONE SAMPLE BEFORE ANY BATCH.
#
# ================== THE RESULT (rendered rc=0 in 235s, 2026-08-15) ==================
# Scored with a window rule validated against the control first: the same rule
# reproduces ep2-b02-nw-0815's published window to the pair (1.04s->3.42s, head
# 0.478 vs 0.461, body 7.83 vs 7.687, tail 0.116 vs 0.075, cadence 2.21 vs 2.14,
# flash 30.68 vs 30.6), so the two clips are graded identically.
#
#                    control        this clip
#   flash (pair 0)     30.68          47.87     WORSE
#   head                0.478          0.569
#   body                7.83           2.13     lower, as predicted
#   tail                0.116          0.415
#   motion window   1.04 -> 3.42s   0.54 -> 2.58s
#   cadence            2.21x         17.75x     MUCH worse
#
# PREDICTION 1 WON. Body mean 2.13, inside the predicted 2.0-6.0 and below the
#   control, exactly because a neck rotation moves fewer pixels than a fold.
# PREDICTION 2 SPLIT. Onset 0.54s beat the predicted <=1.04s. But the window ENDS
#   at 2.58s, not "live past 3.42s" -- it is SHORTER than the control's, not
#   longer. Lost the half that mattered.
# PREDICTION 3 LOST, and the header pre-committed to saying so rather than
#   claiming the credit. Cadence did not "survive at ~2x"; it went to 17.75x. Odd
#   pairs sit at 0.1-0.27 MAD the whole way through, so every other frame is a
#   near-duplicate and the clip runs at an effective 12fps. Staging is therefore
#   NOT independent of the duplicate-frame cadence, which is what I asserted.
# PREDICTION 4 WON -- the load-bearing one. The face is readable in the final
#   frame and is far MORE readable than in frame 0. Blind reader, verbatim:
#   "Readable. In frame-16 the face is fully front-on, both eyes are drawn open
#   with visible grey irises, pupils, upper lids and brows... Least readable:
#   frames 1-6".
# PREDICTION 5 PARTIAL. The reader named the action ("it lifts its head and lowers
#   its hands") and reported the first expression change this protocol has ever
#   found here ("Frames 1-7: eyes as downcast slits... reads sullen/withdrawn.
#   Frames 8-16: eyes wide open... reads neutral, wary"). It avoided the words
#   lurch, stumble and reverse -- but replaced them with "It lands, but badly",
#   "single abrupt jump", "That is a cut, not an in-between." Not claimed as a win.
#
# NO FALSIFIER FIRED. (a) the face is not gone, it is the most readable it has
# been; (b) body 2.13 is not a collapse to <1.0 and the movement is visible;
# (c) no reversal was reported.
#
# THE READER'S "CUT" IS A SAMPLING ARTIFACT, and this is a finding about the
# PROTOCOL, not the clip. The blind set is 16 frames drawn from 97, so its
# "frames 7 -> 8" is source frames 38 -> 45, seven frames apart across the
# steepest part of the arc. Pulling frames 38-49 CONSECUTIVELY shows a smooth
# eased head lift -- the chin rises frame by frame and the eyes open from slits
# through half-lidded to full irises with no step anywhere. The raw series agrees:
# 1.32, 1.72, 3.39, 3.58, 4.19, 3.42, 3.37, 4.94, 5.11, 4.73, 4.15, 4.15, 3.66,
# 3.13, 2.36, 1.59, 0.79 -- a textbook ease-in/ease-out arc, not a jump. A
# 16-of-97 contact set CANNOT TELL A CONTINUOUS 1.7s MOVE FROM A CUT, which means
# the earlier verdict "the fold happens in about three frames" is also suspect.
#
# REAL DEFECTS THIS CLIP DOES HAVE, all new or worsened:
#   - flash 47.87, worse than the control's 30.68, on the original negative (by
#     design -- the motion-worded negative's flash fix is being confirmed on b03).
#   - a FOUR-FRAME EXPOSURE FLICKER at frames 21-24: whole-frame brightness goes
#     115.4 -> 136.9 and back to 116.9 with no pose change. That is the pair-20 and
#     pair-24 spikes (22.1 and 18.0 MAD). The control is rock steady at 134.x.
#   - global exposure drift away from the approved plate: 166.7 -> 111.7 here vs
#     166.8 -> 136.4 for the control, so this clip lands ~25 levels darker.
#   - 12fps judder (the cadence above).
#   - dead air at both ends: the whole performance lives in 0.54-2.58s of a 4.04s
#     clip. Reader: "roughly a third of the sequence is a still image at the end
#     and another third is a still image at the start."
#   - an uncommanded arm drop: the clasped hands unclasp and fall to his sides.
#     Nothing in the prompt asked for that.
#
# VERDICT: the hypothesis won where it was aimed. Restaging recovered the face
# and the expression that four rounds of parameter tuning could not, so shot
# design is a real lever and was the missing one. It did NOT fix motion quality,
# and it made the flash, the exposure stability and the frame cadence worse. This
# clip is a diagnosis, not a keeper. NOT PROMOTED.
