# Prediction for `ep2-b01-styleprobe-0812`, written BEFORE enqueue and before any
# frame of that round exists. Kept here as well as in taste/steward-model.ledger.yaml
# for one reason, stated plainly rather than left to be discovered:
#
# The ledger was CLEAN when this lane checked it (`git status --porcelain --
# taste/steward-model.ledger.yaml`, empty), so the record was appended there as the
# brief asked. Between that check and the next read, the wave-scorer lane appended
# sixteen `*-idfix-0812-observed` records of its own to the same file. The record
# below is therefore sitting in the ledger at position 146 of 162, intact and
# verified by parse, but the FILE is now carrying another lane's uncommitted batch —
# so this lane does not commit it. `git commit -- taste/steward-model.ledger.yaml`
# from here would sweep wave-scorer's half-finished work into a commit with this
# round's message on it. That file gets committed by the lane that owns it.
#
# This copy is the durable one: it is committed with the spec, so the prediction is
# on the record with a sha and a timestamp that both precede the render, which is
# the only property that makes a prediction worth anything. If the ledger copy
# survives wave-scorer's batch — it should, the file is append-only — the two are
# byte-identical below the `record:` key and the ledger's is the one the scorer
# reads. If it does not survive, this file is the record.

