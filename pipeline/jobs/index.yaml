# Fire order for pipeline/jobs/. The README has pointed at this file since it
# was written; this is the first version of it that exists.
#
# Read this before any job file. It describes the SET — what may fire now, what
# is waiting on a machine, and what is waiting on a person — and it is the only
# file here that does.
#
# Fire with:  python3 pipeline/box_enqueue.py pipeline/jobs/<id>.yaml
# Inspect:    python3 pipeline/box_enqueue.py --list
#
# box_enqueue refuses, on its own, to queue a job that names an unapproved node,
# carries a `gate` key, or has an unfilled `recipe_slot`. That refusal is code,
# not a convention, because the §6 approval gate raises SystemExit rather than
# an exception — an unapproved node does not fail its job, it kills the daemon.

updated: 2026-08-10T02:20Z
queue_root: C:\banyan-queue          # ready/ running/ done/ failed/ on the box
runner: pipeline/box_runner.py        # drains it; started as SYSTEM by \banyan-box-runner

approved_nodes:
  # The ONLY two nodes any job here may name. Verified on the box by
  # box-preflight-0810 at 02:12:49Z, reading the same leaf the render gate reads.
  - id: 001-capability-inventory
    leaf: 001-t0-d.yaml
    approved_by: founder            # 2026-07-27
  - id: 002b-first-citizen
