    by a growing black object in one band and not by the frame walking to dusk. Two of the three
    bands lose under 2 levels across the whole clip.
  FAIL-DEAD: FIRED, as pre-registered and as predicted in the bar. Grass band interframe median 0.0000;
    ramp-subtracted 0.146 levels/frame falling to 0.054 on the plateau.
  FAIL-INTRUDER: DID NOT FIRE. No creature, no figure, no bird, at any edge, in any of the 73 frames.
  FAIL-PALETTE: DID NOT FIRE. Hue swing 0.09 deg across the first second and 1.15 deg across the
    clip, against the shipped crf-33 take's 40.24. The luminance half of M1 did not reproduce and
    is charged to FAIL-PLANT-CHANGE.
  FAIL-PLANT-CHANGE: FIRED. A leaf mass appears and grows. It is the fault of this take.
  FAIL-CAMERA: DID NOT FIRE, and unlike the parent the measurement is meaningful -- see M4.
fail_mode_I_DID_NOT_PRE_REGISTER: 'No new fail MODE -- FAIL-PLANT-CHANGE was on the list and it is
  what fired. What was not pre-registered, and is worse than a missing mode, is that THE RUNG''S
  DERIVATION ARGUMENT WAS FALSE. 70cd3b98 reasoned that because the parent''s decay was "progressive
  and back-loaded", stopping at 73 frames would "never render the part of the ramp that collapsed".
  That treats --frames as a trim. It is not: the two renders share only f000. Every sentence in this
  spec of the form "the parent had lost 11.8 by f060, so 12 at f072 is the bound the measured curve
  already implies" was reasoning about a curve that this render was never going to have. The bar
  it produced still fired correctly, by luck rather than by design, and that is recorded here rather
  than folded away.'
what_the_next_rung_should_be: 'NOT LICENSED BY THIS SPEC AND NOT FILED. `what_this_licenses` above
  says one clip, no third rung, and it is honoured -- no follow-up job was enqueued off this verdict.
  Recorded for whoever holds the beat-12 lane next, as a recommendation and not an order: (1) the
  frame-count lever is spent as a way of dodging a late defect, because it does not dodge, it re-rolls;
  (2) both rungs now show the same shape of failure -- the negative names the thing that arrives
  ("creature" then "new leaf") and does not hold it -- so the honest next lever is the POSITIVE prompt,
  which spends its entire first sentence asking for stillness and gets total stillness plus one uninvited
  object, not the negative, which has now failed twice; (3) the grass clause cannot be scored on
  this plate at any length and needs a wider one if anybody still wants it. Beat 12 has no goblin
  on screen, so none of this is blocked on the design answer.'
cut_preference: 'NO SWAP. Beat 12 keeps review/ep2-demo-0819/sources/12-related-b12-tightB-untrimmed.mp4,
  status best-available with its warm-to-cool first-second fault named in review/ep2-picks/cut-readiness-0819.yaml.
  This take would trade a one-second colour shift for 15% of the frame going black under a growing
  leaf that nobody asked for, and it is dead still on top of that. The cut-readiness row for beat
  12 is deliberately NOT edited by this verdict: a FAIL changes nothing about which file ships, and
  the upgrade that row already names (the TRIMMED crf-33 take, which the record says removes the
  fault by edit) is untouched by anything measured here.'
