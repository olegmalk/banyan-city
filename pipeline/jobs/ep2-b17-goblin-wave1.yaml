# 002b goblin wave, round 1 -- beat 17 goodbye. STAGED, NOT QUEUED.
#
# One of fourteen. The fifteenth (beat 04 the-footnote) is the ONE SAMPLE and it
# has already been drawn; these fourteen wait on the founder's verdict on it.
# Written by the queue-fill lane on 2026-08-10, untracked-adjacent: nothing here
# has been enqueued and no GPU time was spent writing it.
#
# MEASURED, NOT GUESSED. On the real CLIP tokenizer on the box, this beat is
# 64/77 positive tokens with the goblin slot filled by `green skin`, leaving
# 13 tokens of headroom, and 73 negative. The binding beat of the whole wave is
# 08 inside-him at 9 headroom. The measurement matters because compress() drops
# TRAILING sentences and the style anchor is always last -- an overrun does not
# come back truncated, it comes back unstyled, silently.

# ===========================================================================
# STAGING RE-CUT, 2026-08-11 — WHY THIS SPEC CHANGED WHILE STILL GATED.
#
# THE EVIDENCE. `ep2-b15-goblin-simple-0811` was the ONE SAMPLE against the
# founder's definition ("he is just a simple green goblin, nothing complex"),
# with the slot cut back to `green skin`. It SETTLED THE CHARACTER: one plain
# green round-headed creature with pointed ears, consistent across all four
# seeds — the first time the words-only route has held species. It FAILED ON
# STAGING, and the lane scored it `partial`, miss_axis STAGING: THREE OF THE
# FOUR SEEDS DREW HIM FROM BEHIND, so there was no face to judge, and the
# sapling came back a houseplant in two frames, absent in one, and a walking
# creature with its own face in the fourth. Sidecars, with the exact string the
# model saw: review/tonight/15-good-listener-wave1-s{0..3}.yaml.
#
# WHY THAT LANDS ON THIS FILE. All fourteen `ep2-b*-goblin-wave1` specs were
# written in one sitting on 2026-08-10 against the same drafts, so the beat this
# spec draws carries the same two holes beat 15 did: nothing in its words says
# where the camera is relative to the goblin's face, and nothing says the
# sapling is in the ground. Cleared as written, it inherits the same defect. So
# the staging is fixed NOW, while the gate still holds, and the founder's
# approval is the only thing left between this spec and a usable frame.
#
# WHAT ACTUALLY CHANGED HERE — three lines, and no new ornament:
#   1. `--variant authored_staged`. The corrected staging lives in a NEW key
#      beside the old one in wave-drafts.yaml; `authored` is byte-identical to
#      what it was, because the ungated goblin_ipa_* crossbeat jobs read it for
#      beats 2, 15 and 20 and a lane is verifying beat 02 right now. The
#      per-beat wording change, and why, is in the comment above that beat's
#      `authored_staged` block. The fix is affirmative and mostly SUBTRACTION —
#      `from front` / an explicit face clause, `rooted in the grass`, paid for
#      by deleting `40cm`, `mascot-simple` and `standing tall`. Nothing was
#      added to the negative: it is ALREADY over CLIP's 77 and dropping nine
#      house terms, so a prohibition bought there is a quality term sold.
#   2. `goblin_def: green skin`, down from `green skin, tusks`. This is a
#      REMOVAL, and it is the whole finding of 2026-08-11: every round that
#      bought a tag with leftover tokens lost, and the round that took one out
#      won. `tusks` is a word the founder never said. Leaving it here would mean
#      he approves a sample drawn with `green skin` and thirteen beats then
#      render a recipe he never saw — which is exactly the mismatch the b15
#      spec's own consumer note warned about.
#   3. A `preflight` step: the same command with `--dry`, which measures on the
#      box's real CLIP tokenizer and draws nothing. It exists because this Mac
#      has NO tokenizer (sd_prompt._clip_tokenizer() returns None), so the token
#      budgets behind the rewrite above are reasoned, not measured. It also
#      fails loudly if the box's wave-drafts.yaml is older than this job and has
#      no `authored_staged` key — a silent fallback to `authored` would render
#      the OLD staging under the NEW job id and nobody would see it in the
#      frames. It costs seconds and no GPU.
#
# THE GATE BELOW IS UNTOUCHED AND STAYS SHUT. Clearing it is the founder's act.
# ===========================================================================

