# DURABILITY. Every clip and still this farm has made lands single-copy on a
# box nothing backs up, and 04-the-fall-LTX-r4.mp4 sat stranded eight hours
# because .gitignore:57 swallows media under review/ so git showed nothing
# missing. This step closes that WITHOUT touching the runner: the courier
# already commits `git add -A -- farm-out` and force-pushes
# farm-results-rtx5090 on every job_done (box_runner.py:486-506), farm-out is
# NOT gitignored (verified with git check-ignore), and it is already carrying a
# 406KB mp4 that is live on origin right now. So publishing is a COPY, not a git
# command -- no credentials, no second worktree, no daemon change, and the
# runner that survived the fleet wipe stays byte-identical.
#
# allow_fail: a failed copy must never mark a good render failed. If it fails
# the stills are still on the box and the log says so.
# Forward slashes on purpose: Windows Python takes them, and they keep this
# code out of YAML's backslash-escape minefield.
- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-goblin-wave1"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/wave-goblin-prep/out/17-goodbye-wave1-s*.*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        # Hash the COPY, not the original: what this records has to be the
        # bytes that get committed, or the manifest attests to the wrong file.
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
        print("   ", os.path.basename(f), h[:16])
    # shasum -c format, so the Mac verifies byte-identity by running the
    # manifest instead of re-hashing blind against a number in a log.
    # newline="\n" is load-bearing: this runs on Windows, where text mode
    # rewrites \n to \r\n, and every filename would then carry a trailing
    # \r that shasum -c cannot open. Measured, not guessed -- the first
    # manifest written here failed all four files on the Mac for exactly this.
    with open(os.path.join(dst, "17-goodbye-wave1.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    # 4 stills + 4 sidecars. Fewer means the render wrote less than it
    # promised, and allow_fail keeps that a loud log line, not a failed job.
    raise SystemExit(0 if len(src) == 8 else 1)

