failure_predicted_in_advance: 'TWO GOBLINS, and it is filed before the pixels. The adapter is masked to
  ONE head box, but the box is a rectangle and the guard''s head at cx 0.71 is nowhere near it, so a leak
  would mean the mask is not being honoured rather than that it is badly placed. SECOND: A CHIBI GUARD.
  openpose gives the model proportion, not age, and every prior guard on this show was carried by words
  alone -- if five heads of skeleton still yields a big child, the lever is the wording and the founder''s
  ruling is the bar it has to clear. THIRD, AND CHEAPEST TO MISS: the arm reads as ALREADY POINTING. The
  skeleton is mid-raise, but SDXL may resolve an ambiguous elbow into the completed gesture, and an end-state
  plate is exactly what froze beat 20.'
founder_rulings_this_plate_answers_to: 'TWO, AND THEY ARE BOTH IMAGES OR VERBATIM. (1) THE GOBLIN: taste/refs/goblin-canon-founder-0821.png,
  supplied 2026-08-21 with ''dude, this is how the goblin should look''. It is carried here by the SAME
  square reference and the SAME adapter weight as the accepted solo plate -- only the mask moved. (2)
  THE GUARD: the founder''s 2026-08-20 ruling, ''they should look like grown men. yes. dumb grown men''.
  That is why the guard''s skeleton is FIVE HEADS TALL and not a scaled goblin, and why G3 is a killing
  bar rather than a note.'
not_done_on_purpose: 'NO MOTION IS RENDERED BY THIS JOB and no motion spec is filed by it, for the same
  reason as the b02/b03/b20 naturalize jobs: filing the motion rung in the same breath would assert the
  plate passed before anyone looked at it. ALSO NOT DONE: the guard is not given an IP-Adapter reference.
  There is no founder image of a guard, and inventing one to condition on would be this lane authoring
  a character design -- which is taste, and reserved.'
