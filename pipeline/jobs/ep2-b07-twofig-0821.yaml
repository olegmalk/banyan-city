consumer: 'THE INIT FOR BEAT 07''S RE-DERIVED MOTION SPEC, and nothing else until then. Named consumer:
  the canon-motion lane, which cannot file beat 07''s next i2v rung until a plate exists that already
  holds BOTH figures -- because the wave proved that summoning the guard by wording alone costs the frame
  and then the goblin. review/ep2-ship-0821 is not touched by this job and no cut changes because this
  plate landed.'
success: 'ONE 832x1216 png holding EXACTLY TWO FIGURES, judged by eye at 1:1 on both of them. G1 two whole
  figures on one ground line, goblin left, guard right; G2 the goblin is the founder''s goblin read against
  taste/refs/goblin-canon-founder-0821.png -- bald, large pointed ears, off-white eyes with narrow vertical
  slit pupils, mandarin-collar sage shirt; G3 the guard is a GROWN MAN, five heads, armoured and helmeted,
  a full head taller; G4 the guard''s face is NOT the goblin''s -- he gets no adapter, so a leak means
  the IP mask is wrong; G5 his arm is MID-RAISE toward the goblin, not completed and not down; G6 both
  full body in tall grass in the plate''s dialect. The named degenerate outcome is TWO GOBLINS: the adapter
  is masked to one head box and if it has painted the founder''s face on both figures this plate is a
  FAIL and the mask is the fix, not the seed.'
why: 'BEAT 07''S MOTION FAILED BECAUSE THE SECOND FIGURE ARRIVED BY WORDING INSTEAD OF BY PLATE, AND THE
  ARRIVAL RE-STAGED THE SHOT.


  The beat''s own canon-motion verdict is the licence and it corrected this lane''s prediction: the guard
  DID appear from f024 once both figures were named and the second-figure terms left the negative -- ''the
  point completes ... but THE GOBLIN IS GONE BY f096, so the guard points at empty grass. The camera also
  pulls back at f024 to fit the second figure.''


  That is one instance of the law the wave measured four times: a prompt naming something ABSENT from
  the init makes the model build it and pull the camera back hunting for it, while the three beats whose
  prompts ask only for motion the plate has a body for -- 04, 08 and 13 -- all held their frame. For b02,
  b03 and b20 the absent thing is an object and the fix is a composite. Here it is a FIGURE, so the fix
  is a two-figure plate.


  WHAT THIS JOB DOES: beat 07''s accepted canon-plate rung with ONE input changed -- a two-figure openpose
  skeleton instead of the solo one, the IP-Adapter mask re-derived to the goblin''s head box at his stature
  in it, and wording that places both figures. Same checkpoint, controlnet, reference, ip-scale, sampler
  and seed.


  WHAT IT DOES NOT DO: it renders no motion and files no motion spec. The re-derived i2v rung waits on
  a human opening this png, because the whole premise is that a plate must CONTAIN what the prompt names.'
