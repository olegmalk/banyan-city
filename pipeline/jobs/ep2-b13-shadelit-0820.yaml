script_authority: 'Node 002b-first-citizen, live script `002b-t0-c`, `approved_by: founder`, `approved_on:
  2026-08-03`. STEWARDSHIP.md 6 IS DISCHARGED FOR THIS BEAT AND THE RECORD IS node.md:204: the five beats
  rewritten 2026-08-17 to play at knee height (12, 13, 15, 19, 20) were put to the founder verbatim and
  his answer was "all approved" on 2026-08-19; beat 13 was additionally ratified 2026-08-18 by his own
  board ruling. node.md states the consequence in as many words: "voice synthesis, footage render and
  episode assembly are legal for all five beats as now written". THIS IS A SILENT MOTION CLIP: no voice
  synthesis, no episode assembly, no publication, and the approval confers no verdict on the pixels. The
  one thing 6 still gates on this node is the 2026-08-18 beat-17 shake restage, which this job does not
  touch. SUPERSESSION NOTE, because a reader will find the other sentence: pipeline/jobs/ep2-b15-macplate-publish-0819.yaml
  says the beat-15 6 gate is LIVE. It was, when that spec was written on the morning of 08-19; the approval
  landed later the same day.'
script_line: 'Beat 13 THE SHADE (1:00-1:04), node.md:88 as rewritten 2026-08-17 and RATIFIED BY THE FOUNDER
  2026-08-18 by his own board ruling -- "the shipped version stands (no slide, he sits down beside it,
  thin shade)": "The scavenger''s legs give out and he drops to sit in the grass at the base of the stem,
  then tips his head sideways into the sapling''s hand-sized patch of shade -- the only part of him it
  will cover -- knees up around his ears." THE PLATE IS ALREADY THE SEATED END STATE, so the only action
  left in the beat is the head tipping into the shade. Rendering a slide would be re-opening a question
  the founder closed.'
bar:
  G8_THE_PLANTS_SHADE_IS_ON_HIS_EYES: 'THE FAILED CLAUSE AND THE ONLY REASON THIS RUNG EXISTS, and it
    is now measured rather than eyeballed. At f120, read at 4x: a distinct darker patch lying across the
    eye band, with a visible EDGE, that is not his own arm, knee or brow shadow. INSTRUMENT, pre-registered:
    eye band (290,350,500,410) mean luma at f120 must be at least 15 BELOW the forehead/dome band (300,150,480,260)
    at the same frame, and the eye band must still sit at least 20 ABOVE the frame''s p5 -- i.e. a shade,
    not a hole. Both bands are published at f000 and f120 whatever the verdict. THE NUMBER IS THE FILTER
    AND THE EYE IS THE DECISION: a brow shadow satisfies the arithmetic and is not the beat, so a PASS
    requires an edge that can be traced to the plant.'
  H1_THE_PERFORMANCE_IS_NOT_GIVEN_BACK: 'CARRIED FROM SHADEMID, WHICH WON IT, AND IT IS THE THING MOST
    AT RISK. Face band (250,240,400,360), the same fixed band as rungs 1-3, mean absolute interframe luma
    over all 120 pairs at or above 3.0, and the last twenty pairs at or above 1.0. Shademid read 4.798
    and 2.263. A brighter init is a different conditioning image and this engine has already shown that
    a cleaner init can cost motion (beat 18 lost 90% of its interframe to crf 10); a lifted one may do
    the same. Published with its SHAPE, not as a bare mean: this family holds every 3rd frame (judge_clip
    period 3, 8.0 effective fps, all six clips), so the energy is on the step frames and the gaps read
    0.04-0.35. A clip that reads period 1 while its siblings read period 3 has a CUT in it and the hold
    statistics are retracted, not credited.'
  H2_he_is_still_seated_knees_up_and_the_plant_holds: Carried. At f120 he is folded small in the grass
    with his knees up, satisfying the founder's 2026-08-18 ruling `no slide, he sits down beside it`;
    and the plant is ONE thin stem with TWO leaves, rooted, at f000 f030 f060 f090 f120. Both passed on
    shademid and a regression on either is attributable to the init.
  H3_the_sideways_tilt_survives: 'Carried, and judged 1:1 side by side against shademid rather than against
    a memory of it: upright and facing camera at f000, over on its side by f090, face rotated back toward
    the camera at f120. This is the attitude the beat asks for and shademid is the first clip that drew
    it.'
  A5_no_exposure_blowout_MEASURED_AGAINST_THE_LIFTED_PLATE: 'f000 to f120 whole-frame mean luma within
    +/-25. THE BASELINE MOVES WITH THE VARIABLE AND THAT IS NOT A LOOSENING: the lifted cropped init reads
    mean 125.65 / p50 118.1 where shademid''s read 103.36 / 89.5, so f120 is compared to THIS job''s f000
    and never to shademid''s. Shademid ran +1.71 across 121 frames, the flattest of the six, and that
    is the number to beat. A drift materially larger than +/-2 on a recipe whose only change is a tone
    curve would itself be the finding.'
not_done_on_purpose: 'NO WORDING CHANGE OF ANY KIND -- the prompt and the negative are shademid''s byte
  for byte, and that is the whole design: wording was exonerated by shademid''s own pre-registered test
  and a fourth wording would be the ladder this repo forbids. NO recipe change: size, frames, fps, guidance,
  distilled sigmas, two-stage, offload, mode and --image-crf 10 are the b14 crf-10 parent''s. NO new seed:
  20260820 for the fourth time. NO new anchor -- LEFT, as shademid. NO change to the composite MASK and
  none to assert_framing.py''s WANT_BBOX, because the lift moves no pixel''s coordinates. NO COLOUR CORRECTION
  and NO MASKED OR SELECTIVE LIFT: a mask is a second instrument and this ladder has twice had a masked
  or colour-predicate instrument return a clean, wrong number on green-on-green ground. NO SHORTER RENDER:
  --frames is an input to the denoiser''s temporal grid, not a crop. NO re-composite and NO re-framing
  -- that is the rung F-EXPOSURE-IS-NOT-THE-SUSPECT names, and it is named rather than fired. No pick,
  no plate_ack, no cut, no publication: beat 13 stays a SLATE.'
pre_registered_fail_modes:
- 'F-EXPOSURE-IS-NOT-THE-SUSPECT -- G8 fails a FOURTH time on a plate that is measurably 31.8 luma brighter
  on the cheek and 28.6 on the whole-frame median. NAMED AS THE MOST LIKELY OUTCOME OF THIS RUNG, and
  the reasoning is published above rather than after the fact: beat 13 already had the brightest FACE
  of the three composite plates (cheek 114.6 against b03''s 101.8 and b15''s 93.3) and only the darkest
  FIELD, and no light direction on this plate puts a 15cm plant''s shadow on a face 300px above it. If
  it fires, exposure joins wording as an exonerated suspect, the axis is closed at two instruments, and
  the remaining lever is FRAMING -- his head and the leaves in one register -- which is a composite-geometry
  rung, not a plate-tone one.'
- F-MOTION-COST -- H1 regresses. A lifted init is a different conditioning image, and this box has already
  measured a cleaner init costing beat 18 roughly 90% of its interframe motion. If the face band falls
  below 3.0 the lift is not free and the tradeoff is a real finding about tone versus amplitude, independent
  of G8.
- 'F-WASHED-CEL -- the dialect breaks: the cloak''s blacks lift out of ink and the frame reads as flat
  rather than as cel-shaded. k = 2.6 was rejected by eye for exactly this before k = 2.0 was written,
  and the plate''s p5 only moves 8.1 -> 15.3, so it is not expected -- but the engine re-inks every frame
  and may push it further than the plate does.'
- F-IDENTITY-DRIFT -- the skin probe's f000 baseline moves by construction (cheek R 100.1 G 123.8 B 65.7
  luma 110.1 becomes R 130.9 G 156.7 B 89.8 luma 141.3, both Rec.601 on the same box on the same crop).
  f120 is scored against the LIFTED f000. A judge who scores it against the parent's number will find
  a fictional +31 catastrophe.
- F-PLANT-REVERT / F-PLANT-PICKED-UP -- rechecked, held on all three b13 rungs so far.
rung_3_the_control: 'ep2-b13-shademid-0820: THE BEST CLIP THIS BEAT HAS PRODUCED AND STILL A FAIL. rc=0,
  121 frames, 262.4 s, $0. H1 passed by 7x -- face band (250,240,400,360) mean absolute interframe 10.80
  (rung 1, earned by walking out of frame) / 0.64 (rung 2, frozen) / 4.798 (rung 3), against a bar of
  3.0, with the step frames reading 26-35 at f066..f099. H3 passed decisively: the head travels from upright
  and facing camera at f000 to fully over on its side by f090, where rung 2 ''leans but does not tip''.
  Posture held, plant held, camera locked, exposure flat at +1.71. It failed on H2''s FACE sub-clause
  -- the head tips so far that from ~f042 to ~f072 the face is pressed into his own knee and is not legible
  at f060 -- and on G8, for the third time.'
skin_probe:
  box_xyxy_in_the_704x1280_init:
  - 286
  - 282
  - 352
  - 336
  placed_on: his cheek, below the eye and clear of the ink linework -- SKIN, not cloth, chosen by eye
    at 5x on the real cropped init and not by any colour rule
  f000_reading: R 130.9 G 156.7 B 89.8, R-B 41.0, luma 141.3 (std 6.6) -- ON THE LIFTED INIT, Rec.601,
    the same box on the same 704x1280 left-anchored crop.
  how_to_read_it: Re-measure the same box on f120 and publish R, G, B, R-B and luma beside these. A green-skinned
    figure on a green field is exactly the case where one scalar decides nothing, so the whole triple
    is published and the verdict is written by eye against it.
  carried_verbatim_from: ep2-b13-shademid-0820.yaml, and through it from the rung-1 spec where the box
    was placed by eye at 5x before any of these frames existed. THE BOX IS UNMOVED -- (286,282,352,336)
    -- and only its f000 reading changes, because the one variable changes what is under it. Re-placing
    a probe after the frames exist is choosing the number; re-reading an unmoved probe on a new init is
    the measurement.
  f000_reading_on_the_PARENT_plate_for_reference_only: 'R 100.1 G 123.8 B 65.7, R-B 34.4, luma 110.1 (std
    6.0). REPRODUCED EXACTLY by this lane''s own instrument before the lift was applied, which is what
    establishes that the two readings are like for like. IT IS NOT THIS JOB''S BASELINE: f120 is scored
    against the LIFTED f000 above. Scoring it against this line yields a fictional +31 luma identity catastrophe,
    and this rung''s one variable is exactly the thing that would cause it.'
  publish_luma_std_with_every_reading: 'A fixed window measures the subject only while the subject stays
    in the window, and the DISPERSION is the only thing that says so. Beat 13''s own rung 3 went luma_std
    6.0 -> 85.0 -> 56.6 as the head tipped out from under the box and left it straddling lit cheek and
    dark cloak: an EXPLOSION is a box on an edge exactly as a COLLAPSE is a box on a field, and beat 13''s
    is the more dangerous shape because an inflated std looks like a subject that changed. If either appears,
    the probe is RETRACTED, re-placed by eye at 5x on the frame in question, and the verdict written by
    eye at 1:1 with material published beside luma.'
the_one_variable: 'WHICH PNG THE COVER-CROP READS, AND NOTHING ELSE. b13-sapcomp-s20260820.png becomes
  b13-sapcomp-lit-0820.png: the same 832x1216 pixels through y = k*x/(1+(k-1)*x) on linear light at k
  = 2.0, a true exposure gain with a built-in shoulder (slope k at black, slope 1/k at white, 0 -> 0 and
  1 -> 1 exactly, so it cannot clip -- asserted, 0 newly pure-white pixels). NO GEOMETRY CHANGE: same
  size, every pixel keeps its coordinates, so the published composite mask and assert_framing.py''s pre-registered
  WANT_BBOX are both still valid and are carried unchanged. NO COLOUR CORRECTION: the curve runs per channel
  in linear light, which is what an exposure change physically is, and R-B is published before and after
  rather than steered. The PROMPT, the NEGATIVE, the seed 20260820, the crop size, the LEFT anchor, 121
  frames, guidance 2.0, distilled sigmas, two-stage, sequential offload and --image-crf 10 are shademid''s
  byte for byte. A gamma was this lane''s first choice and was rejected by measurement, not by taste:
  gamma COMPRESSES the top of the range, so face-minus-median goes 25.1 -> 24.6 (g 0.85) -> 23.7 (g 0.75)
  -> 22.4 (g 0.65), the wrong direction for a clause that needs a dark patch to be legible on a lit face.
  The exposure gain takes it to 28.3.'
