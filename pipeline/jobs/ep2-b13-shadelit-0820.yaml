success: 'ONE 704x1280 121-frame mp4 off the SAME WORDS, the same seed and the same mask as ep2-b13-shadelit-0820,
  conditioned on an exposure-lifted copy of its plate, in which the plant''s shade reads on his eyes at
  f120 WITHOUT giving back the performance shademid won. WHICH PNG THE COVER-CROP READS, AND NOTHING ELSE.
  b13-sapcomp-s20260820.png becomes b13-sapcomp-lit-0820.png: the same 832x1216 pixels through y = k*x/(1+(k-1)*x)
  on linear light at k = 2.0, a true exposure gain with a built-in shoulder (slope k at black, slope 1/k
  at white, 0 -> 0 and 1 -> 1 exactly, so it cannot clip -- asserted, 0 newly pure-white pixels). NO GEOMETRY
  CHANGE: same size, every pixel keeps its coordinates, so the published composite mask and assert_framing.py''s
  pre-registered WANT_BBOX are both still valid and are carried unchanged. NO COLOUR CORRECTION: the curve
  runs per channel in linear light, which is what an exposure change physically is, and R-B is published
  before and after rather than steered. The PROMPT, the NEGATIVE, the seed 20260820, the crop size, the
  LEFT anchor, 121 frames, guidance 2.0, distilled sigmas, two-stage, sequential offload and --image-crf
  10 are shademid''s byte for byte. A gamma was this lane''s first choice and was rejected by measurement,
  not by taste: gamma COMPRESSES the top of the range, so face-minus-median goes 25.1 -> 24.6 (g 0.85)
  -> 23.7 (g 0.75) -> 22.4 (g 0.65), the wrong direction for a clause that needs a dark patch to be legible
  on a lit face. The exposure gain takes it to 28.3.'
why: '$0, ~4.5 minutes of GPU, no download, and the plate already exists at 0 GPU seconds -- numpy and
  PIL over one PNG, with the before/after luma table and the k sweep published beside it and looked at
  at 1:1 and 6x before this spec was written. Beat 13 has spent three rungs on wording and shademid closed
  that axis by its own pre-registered condition, so the next lever is the only other thing in the job
  that can change without changing the beat: the tone of the picture the model is conditioned on. It is
  also the cheapest rung this beat will ever get -- the variable is one file path and one sha.'
