# 2026-08-12, character-consistency lane, under his consistency mandate
# (`ep2-consistency-mandate-0812`).
#
# ── WHY THIS COULD NOT RUN AN HOUR AGO. `goblin_ipa_beat.py` refused every beat
# outside GOBLIN_BEATS, so no guard beat could be conditioned at all whatever refs
# it was handed. Commit 472909d0 taught the gate that guards are characters too
# (`--character guard`, GUARD_BEATS). The references were already cut and staged
# against that moment; this is the first job through the new door.
#
# ── THE REFERENCES ARE THE TWO CAST GUARDS (`ep2-charref-guards-pick-0812`), cut
# from the r3 solo turnaround: r0 guard A whole figure, r1 guard A head, r2 guard B
# whole figure, r3 guard B head. Front views only — a back view carries no face. The
# rows are four independent arms, so this asks two questions at once without
# confounding either: does the mechanism carry a guard, and does whole-figure beat
# head, which is the same question the goblin's crop ladder is answering in parallel.
#
# ── THE CONTEST IS NAMED BEFORE THE RENDER, AND IT IS SHARPER THAN THE TUSKS ONE.
# The sampler sends the beat's `authored` draft and beat 06's `authored` says
# "A round guard man in MISMATCHED ARMOR". The references wear the frozen plain brown
# tunic. So the prompt and the picture disagree about the single most visible thing
# in the frame, and the tusk round already showed which way that goes — the prompt
# won 13 of 16. GARMENT IS THEREFORE EXPECTED TO MISS. What this job is actually
# measuring is the FACE: whether the man who comes out is the man in the reference
# when his clothes are being argued about. That is his complaint, not the costume.
#
# ── SO THESE FRAMES ARE NOT BEAT-06 CANDIDATES. Armour is a look he rejected; a
# frame drawn from a draft that asks for it cannot be offered to him as a beat. This
# is a mechanism measurement and the page says so.
#
# ── WHAT WOULD FIX THE CONTEST, NAMED NOT DONE. The sampler reads `d["authored"]`
# with no variant flag (goblin_ipa_sample.py:417), so the tunic wording that already
# exists as `authored_b06_idfix_r2` cannot be reached from here. Adding a variant
# flag is a pipeline edit and not this lane's to make.
#
# ── ITS OWN OUT DIR (`out-b06-guardref`), never written by another job.
#
# ── NOT A PICK, NOT CANON. Provisional under his delegated evaluation grant.
#
# $0 — local GPU on the rtx5090, no provider, nothing published, nothing assembled.
