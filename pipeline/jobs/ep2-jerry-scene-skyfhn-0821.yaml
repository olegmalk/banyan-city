success: ONE 832x1216 png at seed 20260823, the k6a standard entire, conditioned on jerry-skel-h19hunch-0820.png
  at scale 1.0 with the pose words 'standing, hunched over, arms at sides, in an empty field, low horizon,
  peach and gold sunrise sky, full body' and the adapter masked to 315,176,515,396. Scored on the k6a
