# ep1 beat 10 — DOES THE NEGATIVE PROMPT BIND AT ALL? One sample at guidance 2.0.
#
# THE QUESTION. review/SHEETS/index.html records beat 10 as: "The sprout apex
# climbs 181px in every round; no wording binds it." Round after round of prompt
# wording has failed to stop one defect. The sheet reads that as a wording
# problem. It may not be one.
#
# WHAT THE CODE SAYS (pipeline/ltx_i2v.py:1001-1008, verbatim):
#     # THE NEGATIVE PROMPT IS DEAD WEIGHT ON THIS PATH and that is upstream's design,
#     # not an oversight of ours: do_classifier_free_guidance is
#     # (guidance_scale > 1.0) or (audio_guidance_scale > 1.0), audio defaults to the
#     # video scale, so at guidance 1.0 there is no uncond pass and the negative
#     # embeddings are never read. Upstream's distilled arg parser does not even
#     # register --negative-prompt. It is still passed and still recorded in the
#     # sidecar, because what we ASKED for is provenance, but it changes no pixel.
#     common = dict(guidance_scale=a.guidance, output_type="np", return_dict=False, **e)
# Every beat-10 round has run --guidance 1.0. So every negative we have written,
# on this beat and on every other beat of the distilled recipe, has been inert.
# "No wording binds it" is not evidence that wording cannot bind it; it is
# evidence that half our wording was never read by the sampler.
#
# WHY A RENDER AND NOT A CODE FIX. Turning CFG on is a RECIPE CHANGE to a
# distilled 8-step model. Distilled checkpoints are trained with guidance baked
# in, and raising guidance_scale on one is a known way to get burnt contrast,
# saturation clipping and motion artefacts. We do not know whether this recipe
# survives guidance 2.0 at all. That is the question this one clip answers, and
# it must be answered before anyone spends a beat rewriting negatives on top of
# it. The encode stage already stores negative embeddings unconditionally
# (ltx_i2v.py:512-519, do_classifier_free_guidance=True), so the .pt carries what
# the render needs; only the render-side scale has ever been the gate.
#
# WHAT THE BEAT-10 NEGATIVE ACTUALLY SAYS, and why this arm is deliberately not a
# wording test. Its text is copied here verbatim from the source spec. It covers
# wilting, drooping, bending, falling, humans, photorealism and scene changes —
# it says NOTHING about a climbing apex, a rising subject, upward drift or a
# tracking camera. Worse for beat 10 specifically, it negates "frozen frame,
# still image, no motion", which under live CFG pushes the model AWAY from
# stillness on a beat whose defect is unwanted upward movement. So a plausible
# outcome is that guidance 2.0 makes beat 10 WORSE. That is still worth knowing,
# and it is why this arm changes the scale and NOT the text: mixing a recipe
# change with a wording change gives a result no one can attribute. If the
# picture holds together at 2.0, the next job rewrites the negative to name the
# climb ("the sprout rises out of frame, subject drifting upward, camera tilting
# up, plant growing taller") and drops the anti-stillness terms. If the picture
# falls apart at 2.0, we stop rewriting negatives on the distilled path entirely
# and treat the positive prompt as the only channel that has ever worked.
#
# ONE SAMPLE. One beat, one guidance value, against an existing control. Not a
# sweep, not a second beat. The founder's rule (CLAUDE.md, 2026-08-03) was
# written after a recipe was scaled to fifteen beats unsampled.
#
# NO METRIC RANKS THIS. On beat 14 the flow metric scored highest on the round
# where the sapling falls over (131e433). This job produces a picture for a human
# to look at, next to its control.

