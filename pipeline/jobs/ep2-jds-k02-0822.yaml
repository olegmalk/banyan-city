  founder''s own 08-17 canon ruling; his card /review/ep2-b16-leaf-0820 stays open and `licence` is still
  his to take.'
bar: "JUDGED AT 1:1 AGAINST `taste/refs/goblin-canon-founder-0821.png`, ONE\nFRAME AT A TIME, AND THE\
  \ ADMISSION BAR IS HIS FACE. Nothing else is consulted --\nnot tile B, not a previous round, not a metric,\
  \ not a contact sheet.\n\n  E1 THE EYE. Narrow almond, off-white field, a TINY dark pupil, heavy upper\n\
  \     lid. A large round iris of any colour is a FAIL. This is the axis four\n     founder vetoes were\
  \ spent on.\n  E2 THE SKULL AND EARS. Broad low dome; smallish pointed ears sitting NEAR\n     HORIZONTAL.\
  \ A tall egg skull with large upswept ears is the vetoed design.\n  E3 SMOOTH FACE. No brow furrows,\
  \ no nasolabial folds, no jowls.\n  E4 PALETTE. Desaturated sage, washed and high-key. Saturated kelly\
  \ green is\n     the vetoed palette.\n  E5 COSTUME. The shirt with its placket, dark shorts, dark boots.\
  \ (Not scored\n     on the square portrait, where only the collar is in frame.)\n\n  D1 DID THE CELL'S\
  \ OWN AXIS ARRIVE? The caption will tell the trainer this\n     frame stands on `<ground>` in `<light>`.\
  \ If the ground did not change, the\n     frame is DROPPED -- it is not re-captioned as grass, because\
  \ a set of\n     near-duplicates all captioned `tall grass` is the monoculture this batch\n     exists\
  \ to prevent, and a caption that describes a frame that did not\n     arrive is a lie the LoRA will\
  \ learn.\n  D2 IS IT CLEAN? A second figure, a melted hand, a text artifact, a soft or\n     smeared\
  \ frame: dropped. A character set is small enough that one bad frame\n     is 3% of everything the token\
  \ learns.\n\nADMISSION IS MERCILESS AND THE TARGET IS >= 20 OF 32 ACROSS ALL THREE FRAMINGS.\nA framing\
  \ that admits nothing is reported as such rather than back-filled from\nanother framing -- the whole\
  \ point of the set is that it is not one camera."
camera_angle_is_not_an_axis: 'NAMED SO ITS ABSENCE IS NOT READ AS AN OVERSIGHT. `from below` and `high
  angle` are instructions about GLOBAL STRUCTURE and are decided in high-noise steps this pass never enters
  -- the same mechanism that made an OpenPose skeleton at scale 1.0 fail to bend a knee in round two.
  Angle variety in this set is geometry: the square head crop is a closer camera and the cowboy is a mid.'
caption_scheme: 'TEN CLAUSES, THREE VARIABLE, IDENTICAL IN LENGTH ACROSS ALL 32 CELLS. `registry.yaml`
  v2b measured the rule: lengthening captions by two clauses cost identity 11/15 -> 9/15 and giving them
  back recovered it EXACTLY. Uniform length means the trigger''s share of every caption in the set is
  the same.


  `standing`, `looking at viewer` and the framing word NEVER VARY AND ARE NAMED ANYWAY. A named attribute
  is one the token is excused from carrying, and the one thing this LoRA must not learn is a pose -- it
  exists so a skeleton can move him. A set cut from one standing picture and captioned without the word
  `standing` would fuse standing into `bnyjerry` and reproduce the img2img pose lock one level down.'
clip77_measured_not_estimated: 'positive 36 of 77, negative 30 of 77, on animagine''s own vocab. The ground
  and light clauses are the HEAD of the positive rather than its tail on purpose: if a prompt ever overran,
  the quality tail would be what dropped and not the one thing this cell varies.'
post_ship_patch: review/ep2-ship-0821 IS NOT TOUCHED. Nothing here is a plate candidate for any beat.
route_closure: pipeline/canon.yaml `route_closure_2026_08_22`. No face tag, no IP-Adapter scale, no reference
  re-crop. Checked in code by `derive_goblin_i2i_0822.assert_no_face_terms` over the positive, the negative
  AND the caption -- three strings, where round one had two.
the_caption_this_frame_earns: 'bnyjerry, 1boy, solo, standing, looking at viewer, full body, dry cracked
  earth, warm low sunlight, anime style, cel shading


  WRITTEN BEFORE THE RENDER AND CONDITIONAL ON IT. If the frame is admitted this string is its caption
  verbatim; if the ground or the light did not arrive the frame is DROPPED. The caption is never edited
  to match a frame that missed -- that is how a dataset acquires a lie, and the trainer cannot tell the
  difference.'
