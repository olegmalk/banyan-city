#   positive 72/77   STYLE ANCHOR PRESENT: True   count tag '1boy'
#   'text' negated: True   negative recipe 77 -> sent 77 (budget 77)
#   `extra heads` and `disembodied head` both sent; `armor`, `helmet` and
#   `knight` intact - his ruling is not spent to pay for anything.
#
