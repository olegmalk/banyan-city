#
# WHAT THE `_idfix` FRAMES SHOW. s1 is THREE BALD HEADS LYING IN THE GRASS with
# no bodies attached. s3 puts a severed head with closed eyes in the grass below
# the guard. s2 sets a featureless brown sphere behind his skull. And all four
# inflate the head far past a person's - s0 fills the frame with a distended
# skull and swollen cheeks. Grotesque rather than comic, and not shippable.
# THE COUNT TAG WAS NEVER GOING TO CATCH THIS: `1boy` holds for BOYS, and the
# model does not read a loose head as a boy.
#
# THE ADJACENCY IS THE CAUSE, AND THE WAVE PROVED IT ONCE ALREADY TONIGHT. The
# positive says "a round bald guard man" - `round` sits directly against `bald`.
# This checkpoint applies whatever is adjacent to `bald head` TO THE SKULL. That
# is exactly what the beat 02/03/04 versus beat 08 comparison shows for
# `patchwork cloak`: the three beats carrying it in the IDENTITY SLOT sew and
# pale the scalp (4/4, 3/4, 4/4), and beat 08, the only beat that omits it, comes
# back with clean green heads 4/4. `round bald` produces a round bald HEAD, and
# at close-up range that is a sphere. Two independent words, same slot, same
# failure - so this is a mechanism, not a coincidence.
#
# SO THE WORD MOVES; IT IS NOT REMOVED. `round` is the founder's own word for
# these guards and it STAYS in the sentence - on the BODY, where his ratified
# character puts it anyway: "a silly harmless bureaucrat with a round soft body".
# `bald guard man` is then left with nothing to donate to the skull. His word is
# kept and only its target is corrected, which is the difference between fixing a
# fault and overruling him.
#
# PLUS A BAN THAT COSTS NOTHING. `no extra heads, no disembodied head` go into a
# negative that was sending 71 of 77 with six tokens spare, so nothing is evicted
# and no existing guard is disturbed. `Deadpan timing` - a performance phrase a
# STILLS harness cannot spend - pays for the body clause in the positive.
#
