verdict_cut: NOT PROPOSED FOR THE CUT. The bar is conjunctive and G5a fails, so this is not
  a pick and no swap into review/ep2-demo-0820 is proposed. It is nonetheless the strongest
  beat-01 cold open measured to date -- 7 of 8 scored clauses, the incumbent's exposure discipline
  and the parent's growth arc in one clip -- and the incumbent it would replace has its own
  G1 failure on the record. Both of those are the founder's call under R4, not this lane's.
what_this_licenses_after_the_verdict: 'The twelve exposure terms are EARNED and should be
  carried by every future beat-01 negative: they removed the bloom entirely and cost the fig
  nothing measurable. The six plant-growth terms are NOT earned -- they did nothing -- and
  a future rung should not re-spend a fire on rewording them, which is the specific mistake
  this verdict exists to prevent.


  What it does NOT license: another negative-prompt rung on the sapling. The clause is not
  reachable from that side on this engine and one clean measurement says so. The two candidates
  left are PLATE-SIDE (an init whose sapling is already at final size, so there is nothing
  left to grow -- note this changes the plate that passed 7 of 7, so it needs its own bar)
  and COMPOSITOR-SIDE (render the fig''s growth against a held plate). Choosing between them
  is a route decision with the evidence now in front of it, and it is deliberately left open
  here rather than guessed at.'
