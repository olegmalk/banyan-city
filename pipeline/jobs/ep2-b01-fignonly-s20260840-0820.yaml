failure_predicted_in_advance: 'F2 is the most likely single outcome: the negative binds and takes the
  fig with it, because ''growing'', ''enlarging'' and ''blooming'' do not know that the fig is exempt.
  It is named here before the render so that a collapsed arc reads as the predicted cost of a fair test
  and not as a surprise to be explained away afterwards.'
init_provenance: 'The shared beat-01 nub composite init, unchanged: the frame-1 plate that passed its
  bar 7 of 7 on 2026-08-18, with the small green nub inpainted at composite centre 405,750 (mask b01-nubcomp-s20260826-mask.png,
  832x1216, cover-cropped to 704x1280 -- centroid (785.1, 339.4)). That mask is also the detector''s geometric
  anchor, so the judging instrument and the render start from the same object.'
pre_registered_fail_modes:
  F1_the_negative_does_not_bind: 'The sapling grows anyway and the field still blooms: region NCC and
    luma land within noise of the parent''s. Then negative-side conditioning does not reach this fault
    on this engine, the two candidate fixes left are plate-side (a plate whose sapling is already at final
    size, so there is nothing to grow) or a staged colour-only ramp, and NEITHER is licensed by this rung.'
  F2_it_binds_and_takes_the_fig_with_it: 'The field holds -- G5a and the luma bound pass -- and G1 collapses,
    because ''growing'' and ''enlarging'' suppressed the one thing that was supposed to enlarge. This
    is the predicted cost and the most likely single outcome. It would make the clause boundary the finding:
    the engine cannot separate the fig from its plant by wording, and the split has to be made in the
    plate or in the compositor.'
  F3_it_binds_cleanly: Field holds AND the fig still ramps. This is the first clip in this beat's history
    to clear every scored clause, it becomes a veto-able steward pick for the cold open, and the swap
    into review/ep2-demo-0820 is proposed WITH pixels and with the incumbent's own G1 failure alongside
    it. Still not a taste verdict; R4 is the founder's.
  F4_the_seed_does_not_reproduce: Same seed, same init, one prompt file changed, and the output differs
    structurally everywhere. Then b15 was never a control for anything, this whole family of one-variable
    rungs has been comparing noise, and that is worth knowing before another one is filed.
