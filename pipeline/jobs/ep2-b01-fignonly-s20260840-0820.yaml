  G2_end_state_deep_purple_violet: 'SCORED, and it requires a LIVE f120. Fig hue at the last frame in
    270-320 deg with saturation at or above 0.60. Parent b15: hue 301.6, sat 0.72. If the last frame is
    dead the clause is retracted, not guessed -- b16 is why this sentence exists: 55 dead frames, f098
    reads amber, f120 looks purple, neither was scored.'
  G3_exactly_two_leaves_in_every_frame: CARRIED BUT NOT SCORED -- NO INSTRUMENT EXISTS. This repo has
    no leaf counter and a sampled look cannot certify a universal over 121 frames. Recorded as an eye
    note. Naming this is the point; it was scored by assumption before.
  G4_no_size_doubling: 'SCORED on the reading ep2-b01-growmotion-b13-0819 settled and this lane did not
    move: maximum single-frame area ratio under 2.0x, not total growth. TENSION CARRIED FORWARD: that
    reading admits an unbounded total and b15 rode it to 19.37x. Not changed here, because changing a
    settled clause in the same breath as scoring against it is how a bar stops meaning anything.'
  G4b_below_the_grass: CARRIED BUT NOT SCORED -- no grass line is defined in this spec or on the plate,
    so there is no threshold. Eye note only. If it is to become a bar someone must put a y-coordinate
    on the plate first.
  G5a_field_stability_THE_NEW_EXPLICIT_CLAUSE: 'SCORED, and this is the clause that killed the best clip
    of the last round. Region NCC between f000 and f120 -- gain- and offset-invariant, so a global exposure
    change cannot fake it -- on four bands: shaft y0-350; sapling y430-740 x150-560; fig box y700-900
    x230-450; grass floor y1000-1280. PASS requires sapling at or above 0.45 AND shaft at or above 0.70
    AND grass floor at or above 0.20, with the fig box BELOW 0.30 (the fig must be the thing that changed).
    Reference values, measured, not invented: the incumbent seed 20260826 on this same init reads 0.932
    / 0.637 / 0.023 / 0.323 and would pass; parent b15 reads -0.355 / 0.092 / 0.002 / 0.027 and fails
    on three of the four.'
  G5b_camera_locked: CARRIED BUT NOT SCORED -- the instrument refuses. global_zoom fits one scale to the
    picture and refits it on four disjoint quadrants; disagreeing quadrants mean the picture is being
    redrawn and no scale may be quoted, and a fit that lands on the grid edge now publishes railed:true
    and is unquotable as well. Not one of the five 2026-08-20 clips was quadrant-consistent. Reported,
    never scored.
  H_LUMA_BLOOM_THE_OTHER_NEW_EXPLICIT_CLAUSE: 'SCORED. Whole-frame mean luma, every frame, no fig mask
    involved so no part of it is retractable. FAIL if peak whole-frame luma exceeds f000 by more than
    12.0 levels, or if more than 6 of 121 frames read above luma 100. Reference values, measured: incumbent
    +1.46 with 0 frames over 100 (passes with room); the five seeds run +17.45 (b15), +23.67, +44.17,
    +57.37, +71.07 with 71 to 120 frames over 100, and ALL FIVE FAIL THIS BOUND INCLUDING THE MILDEST.
    Correcting the 2026-08-20 ladder while carrying it forward: it is not true that all five pass 100
    by f024 -- b15 sits at 99.58 at f024 and peaks 104.64 at f035.'
  H1_frozen: SCORED. FAIL if fig-box NCC to the final frame is at or above 0.80 by f060, i.e. the last
    half is a still. b16 reads 0.669 at f060 and 0.965 at f100.
  H5_detach_or_teleport: SCORED by the detector's own jump gate, live per frame; plus the fig centroid
    must stay within 40 px of its f000 geometric anchor (785.1, 339.4) for the whole clip. Parent b15
    moves 14 px across 121 frames and passes.
  H6_scene_break: SCORED. FAIL if any consecutive whole-frame NCC drops below 0.80. b16 reads 0.6415 at
    f001 and fails; b15 reads 0.9522 worst and passes.
  conjunctive: A partial is a FAIL, as the parent said. Two clauses are unscored by declaration (G3, G4b)
    and one is unquotable by its own instrument (G5b); those three cannot produce a PASS and cannot produce
