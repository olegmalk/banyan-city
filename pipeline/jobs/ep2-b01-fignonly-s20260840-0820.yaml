  G1_growth_by_a_continuous_path: 'SCORED. Detector live on every frame it scores; no single-frame area
    step at or above 2.0x; growth distributed rather than popped -- the frame reaching 90% of total growth
    must be at or after f060. Parent b15: 121/121 live, max step 1.08x, 90% at f111. The INCUMBENT fails
