why: '$0, ~12 minutes of GPU, no download, nothing to fetch. All five growmotion seeds were scored FAIL
  today against bars pre-registered before their renders, and the pool''s structure is the finding: the
  recipe gives a locked field with a popped fig (the incumbent, seed 20260826) or a real growth arc inside
  a moving field (b15, seed 20260840), and no seed of six has given both. That is why this is not a seed
  re-roll -- a seventh seed re-runs a lottery whose two outcomes are both already in hand and both already
  fail. It changes instead the one thing the measurement names: b15 obeyed all thirteen negative terms
  and failed on the two faults none of them mentions. One variable, one sample, judged on landing before
  anything is scaled.'
