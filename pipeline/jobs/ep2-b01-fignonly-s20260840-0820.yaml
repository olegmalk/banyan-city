# --- appended 2026-08-20 by the fig-detector judging lane, on landing by the composite-plate motion lane, after the pixels.
verdict_this_job: 'FAIL on G5a field stability, and it is a HALF-BIND that answers the question
  it was filed to ask. 7 of the 8 scored clauses pass, against 6 of 8 for its parent.


  THE LUMA-BLOOM CLAUSE FLIPPED, CLEANLY. Peak whole-frame luma +10.85 over f000 against a
  bar of 12.0, and ZERO of 121 frames above luma 100 against a bar of 6. The parent, same
  seed and same init, ran +17.45 with 71 frames over 100 and failed. The clip now ends at
  luma 89.2 -- the incumbent, the only clip that ever held its exposure, ends at 89.1. Negative-side
  conditioning reaches this fault, and twelve words bought the whole of it.


  THE PLANT-GROWTH CLAUSE DID NOT MOVE AT ALL. Region NCC f000->f120 sapling 0.055 against
  the parent''s 0.092 and a bar of 0.45; shaft -0.324 against -0.355. Inside noise. `growing
  plant`, `sprouting`, `unfurling leaves`, `stem lengthening`, `leaves enlarging` and `plant
  enlarging` are all in the negative that provably ran (sha-verified against the job''s own
  manifest) and the sapling grows exactly as it did before.


  SO THE PREMISE OF THIS RUNG WAS HALF WRONG, AND THAT IS THE FINDING. The spec argued a growing
  sapling and a brightening field were ONE fault -- ''something other than the fig is changing''
  -- and therefore one variable. They are not one fault. One of them is suppressible from
  the negative side and the other is not reachable from there at all, and no amount of reasoning
  about the prompt would have separated them; only running it did.


  F2, PRE-REGISTERED AS THE LIKELIEST OUTCOME, DID NOT FIRE. The prediction was that the negative
  would bind and take the fig with it, because ''growing'' and ''enlarging'' do not know the
  fig is exempt. The fig arc is intact: 121/121 live, max single-frame step 1.084x, 90% of
  the growth still arriving at f108, ending deep purple-violet at hue 293.9 / sat 0.788 --
  richer than the parent''s 301.6 / 0.720. Total growth 14.77x against the parent''s 19.37x,
  which is the only trace the suppression left on the subject. The exposure terms are therefore
  SAFE TO KEEP: they cost the fig nothing measurable.'
