verdict_canonmotion_0821: >-
  PASS 6/7, A1 MARGINAL, AND THE MOST ENCOURAGING CLIP IN THE WAVE. There is a real
  out-and-back: he leans out and across from ~f024, is fully extended f048-f072 and is upright
  again by f096, INSIDE the 97-frame trim -- so the pull-back, which is the joke, lands in the
  slot. That is the motion TWO PLATE ROUNDS FAILED TO DRAW, so asking the motion model for the
  lean paid. What it is not is a peek: with no trunk in frame there is nothing to lean out from,
  so it reads as a stumble-and-recover. Identity, wardrobe and the locked frame all hold.
