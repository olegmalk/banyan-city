failure_predicted_in_advance: 'THE PREDICTION THIS TRANCHE EXISTS TO TEST, and it is filed before the
  pixels. LTX has no IP-Adapter. Every canon plate was drawn by one, holding a face the base checkpoint
  does not otherwise produce, and LTX is handed that face as PIXELS in one init frame and asked to keep
  it against its own prior. So IDENTITY DRIFT, IF IT COMES, DRIFTS TOWARD LTX''S PRIOR -- a rounder, more
  human head -- and shows up LATE. The prior wave''s version of this was the green egg: silhouette and
  colour kept, features simply not drawn.


  AND THE SHARPER PREDICTION, which is the one that pays. The onsets recorded at 121 frames were f055,
  f055, f055, f065, ~f095, f106. If the fault is PROPORTIONAL to the render, a 105-frame clip should lose
  the face near f048 and the shorter render buys nothing at all. If it is ABSOLUTE, it lands at f055 again
  and the shorter render still buys nothing. ONLY A CLIP THAT HOLDS PAST ITS TRIM POINT SUPPORTS THE PREMISE.
  Two of the three outcomes retire the frame-count idea and point at the LoRA (train-jerry-0820) as the
  only durable fix, because a LoRA moves the prior where an init frame only argues with it.


  THE STRUCTURAL RISK ACROSS THE WHOLE TRANCHE IS A FREEZE, AND IT IS NOT THE MODEL''S FAULT. A plate
  is posed at the beat''s most legible instant, which is usually the beat''s END: b08''s plate is already
  `head bowed, looking down`, b13''s is already `sitting`, b20''s is already `looking up`. An i2v clip
  whose init already holds the finished pose has nowhere to travel, and this tree has shipped a still
  with a runtime before. If the passes here are frozen passes, the finding is that the patch wave needs
  START-STATE plates, which is a plate-side change and not a motion recipe at all.


  BEAT 04 SPECIFIC, AND IT IS THE ACTION, NOT THE FACE. The peek is out-look-back, and the pull-back is
  the joke. Two plate rounds failed to draw a lean, so the whole lean-and-return is being asked of the
  motion model from a plate that only hunches. If LTX will not produce a return from a standing init,
  the answer is a two-plate approach -- lean plate, return plate -- and not a third wording.'
identity_and_wardrobe_source: 'taste/refs/goblin-canon-founder-0821.png, the founder''s own image, supplied
