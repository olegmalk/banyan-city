one_sample_rule: 'SATISFIED, AND NOT BY THE COUNT. Seven jobs is not one recipe scaled to seven: it is
  seven beats, each an independent question with its own init plate, its own action and its own slot,
  at one seed each. What IS scaled is the frame count, and it is scaled from a rung that has never been
  sampled at all -- which is the objection, and the answer to it is the order these are filed in. Beat
  13 runs FIRST and alone in priority: it is the canon module''s own SAMPLE_BEAT, and if 105 frames breaks
  it, the remaining six are cancellable before the card has spent twenty minutes.'
