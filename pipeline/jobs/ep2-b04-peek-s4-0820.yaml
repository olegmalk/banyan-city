not_done_on_purpose: 'No crop change -- the tighter crop was already measured as a lever on this beat
  and came back almost absent, and changing framing in the same job would leave two candidate causes.
  No crf change. No guidance or sigma change. No second plate. NO GOBLIN-DESIGN CHANGE: that is the peer
  lanes'' question tonight and this lane stays off it. node.md and done-definitions.yaml are NOT edited
  by this script -- the pick is recorded in script_line here, and the script edit is a separate change
  with its own diff.'
one_sample_rule: 'SATISFIED BY THE RECIPE, and the argument is made rather than pointed at. The rule is
  one sample per RECIPE CHANGE. No recipe changes here: the crf-10 family has run clean three times on
  this exact plate (eyes-crf10, headlock, tightcrop) and every generative flag is inherited. What varies
  is the seed, which is the sanctioned batch shape in episode-loop-v2 step 2 -- ''i2v from the picked
  plate, 4-8 seeds in one batch, pick by eye''. The ACTION is new, and the founder has already looked
  at it: he picked it off a card that showed him both failures on frames.'
pre_registered_fail_modes: P1 ONE TRIP INSTEAD OF TWO (partial, tempo rung). P2 THE SECOND TRIP COMPLETES
  AND THE CLIP THEN SITS -- fails the last-twenty clause and is the old defect in new clothes. P3 the
  mouth opens because the body is finally allowed to move. P4 A CAMERA PAN WEARING THE LEAN'S CLOTHES,
  the likeliest and the easiest to mis-pass at a glance. P5 identity drift or a second goblin during the
  travel, which is where drift has lived in every i2v result in this tree. P6 THE LEAN IS SUPPRESSED ENTIRELY
  and he holds still, which would point at the remaining motion phrases in the negative rather than at
  the action.
the_design_note_up_front: THE INIT IS THE SUPERSEDED ADULT MAN. The founder ruled on 2026-08-20 that the
  goblin must read as the B tile's CREATURE and that 'adult' in canon was drift; beat 04 is on the re-render
  list for it. This batch does NOT address that and must not be read as a plate pick. Motion and staging
  are separable from which face is on the plate -- whether this engine will play a repeated lean-out on
  a locked camera is a fact about the engine. When the creature plate lands, this prompt moves onto it
  unchanged, which is the point of asking the question now instead of queueing behind it.
the_one_variable: THE ACTION CLAUSE, and its one forced consequence in the negative. The positive's stillness
  block ('HIS HEAD DOES NOT MOVE ... ONLY HIS PUPILS MOVE', rung 2) is replaced by action A placed at
  the middle and at the end as an ongoing action; every other sentence is rung 1's byte for byte. The
  negative has exactly two phrases DELETED -- 'drifting sideways' and 'moving to a different spot' --
  because they forbid the picked action in as many words; nothing is added to it, the camera block is
  untouched, and 'walking out of frame', 'leaving the frame', 'standing up' and 'sitting down' all stay.
  Init, size, frames, fps, guidance, sigmas, two-stage, offload and --image-crf 10 are rung 1's. Across
  the five jobs THE SEED IS THE ONLY DIFFERENCE; the prompt bytes are identical in all five.
the_placement_law_as_applied: 'Three clauses, each one a measured finding rather than a preference. ONGOING
  not static: 2026-08-20, b03/b13/b15 -- a terminal placement naming an ongoing action held position at
  no cost (b15, HOLD 0.508, no freeze) while a static attitude bought the hold by killing the clip (b03,
  33 dead frames from f088; b13, face-band 10.80 -> 0.64). MIDDLE AND END both placed, so the second trip
  is asked for where it has to happen. NO UNPOSITIONED NOUN: the card''s word ''trunk'' is NOT in the
  prompt because there is no trunk in this plate -- it is beat 03''s -- and naming a noun the init does
  not contain is how this engine draws one. The cover he leans out from is the tall grass already crossing
  the foreground, which is what the plate shows.'
