    load is sane.'
  b7_no_limb_fragmentation: 'PASS ON BOTH FIGURES -- AND ONLY BECAUSE THE PROBES
    WERE RE-PLACED. THIS IS THE INSTRUMENT FINDING OF THE RUNG AND IT IS REPORTED
    FIRST BECAUSE IT NEARLY PRODUCED A FALSE FAIL.
    THE PARENT''S PUBLISHED BOXES ARE NOT TRANSFERABLE BETWEEN FRAMES. Scored at
    twinsipa''s six coordinates this frame reads guard 14.1 and goblin 41.5 -- a
    fail on the goblin. Rendering the boxes onto the image shows why: the
    goblin IS WEARING TROUSERS in this frame and his "shin" and "forearm" boxes
    land on CLOTH, while the guard''s "forearm" box lands on his SLEEVE. The
    statistic was comparing a garment to a face. Even luma-matching those boxes
    to 0.3 levels still gave 50.6, so luma-matching alone does NOT rescue a probe
    that is on the wrong material -- the bar''s "placed ON THE DRAWN LIMB"
    requirement is doing separate work from its luma requirement, and this frame
    is the proof.
    RE-PLACED ON PURE SKIN (windows >=97% skin-coloured, coordinates published):
    GOBLIN -- face (150,480,174,504) +41.7 luma 222.0; forearm (231,764,255,788)
    +41.6 luma 222.1; shin (106,880,130,904) +49.7 luma 221.9. SPREAD 8.1
    against a bar of 25.0, luma-matched to 0.1 levels. Every region >= +41.6
