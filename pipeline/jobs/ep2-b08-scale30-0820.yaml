verdict: >-
  PASS ON THE STRENGTH QUESTION -- BRANCH (2), AND IT IS THE BEST FRAME BEAT 08
  HAS. Dropping the second net from 0.8 to 0.3 recovered EVERYTHING the parent
  broke and KEPT THE BOARD. The guard has his light sandy hair back, his cream
  shirt and brown wrap skirt back, both arms back, and the drawing is at
  twinsipa's level; the frame is back to mean luma 135.4 from the parent's 86.9
  against twinsipa's 141.6. B7 passes on BOTH figures, B2 at +60.6, the pointing
  hand 48.5 px from its authored wrist. The board is drawn at the authored
  position and the authored 9-degree tilt, top edge well below the shoulder, and
  THIS TIME THE FAR ARM REACHES IT.
  WHAT IS STILL SHORT, AND IT IS ONE THING: NO HAND IS DRAWN ON THE BOARD. At 5x
  the sleeve ends in a rounded mitten-like form and the board's top edge tucks
  under it -- no fingers, no thumb, no grip. The beat asks for a clipboard
  "lowered in one hand" and what is drawn is a board carried at the end of a
  sleeve. That is far better than the parent's satchel hanging off a vanished
  arm, and it is not yet the picture. SO THIS IS NOT DECLARED A COMPLETE PLATE
  CANDIDATE -- the gap is narrow and it is named, and overclaiming it would be
  the one thing a lane must not do to a frame this close.
verdict_measured:
  b0_the_stack_is_what_it_claims: 'PASS. Preflight printed all four lines. The
    sidecar reads `controlnet_2_conditioning_scale: 0.3` -- the override took --
    with `controlnet_conditioning_scale: 1.0`, `control_2_image_sha256:
    38cd39da...`, `seed: 20260819` and both capsule masks unchanged. Not a
    re-run of the parent; a real one-number comparison.'
  b4a_board_down: 'SUBSTANTIALLY YES, ONE DETAIL SHORT, AND THE DETAIL IS THE
    HAND.
    PRESENT AND CORRECT: a board with a crisp black outline at the authored quad,
    at the authored 9-degree tilt, top edge far below the shoulder line y=491.
    It survived the drop from 0.8 to 0.3, which is the question this rung asked.
    THE FAR ARM REACHES IT -- the parent lost that arm entirely and with it any
    possibility of the board being held.
    NOT CLOSED: at 5x there is NO HAND. The sleeve terminates in a rounded form
    and the board begins; no fingers, no thumb, no grip is drawn. `the clipboard
    comes DOWN` reads as an object carried at the hip rather than held.
    AND THE EDGE METRIC IS AGAIN NOT USED, for the reason the parent''s verdict
    established: mean gradient in the region reads 9.68 here against twinsipa''s
    13.36 even though twinsipa HAS NO BOARD, because twinsipa''s region is full
    of sash and hand linework. The metric measures busyness and cannot answer
    this clause. The eye call stands, as both specs said it would.'
  b6_drawn_not_traced: 'PASS, AND SCORED AGAINST twinsipa RATHER THAN AGAINST
    THE PARENT, as this spec required. Hair with visible strands, folds in the
    sleeves, the gold harness clasp and belt buckle both legible, a well-drawn
    fist gripping the harness strap with individual fingers, a brown cuff. The
    parent gave all of that back for one flat robe and this recovers it. The
    linework is marginally SOFTER than twinsipa''s in places -- a slight loss of
    crispness, not a change of kind -- and that is reported rather than rounded
