  b8_the_guard_has_hair: 'PASS. Light sandy hair, clearly drawn with strands.
    Canon-correct under canon.yaml `ep2-guard-hair`, and the reversal of the
    parent''s bald regression on a single-number change. THIS CONFIRMS THE
    CLAUSE IS A USABLE INSTRUMENT: the guard''s hair tracks conditioning
    pressure, going bald at 1.0+0.8 and returning at 1.0+0.3 with the wording
