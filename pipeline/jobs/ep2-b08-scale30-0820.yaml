bar:
  b0_the_stack_is_what_it_claims: 'VOID-CHECK, unchanged from the parent except the one number. Preflight
    prints `twins net verified`, `scribble net verified`, the line asserting the two nets share size and
    config and DIFFER in weights, and `staged driver, BOTH hints and BOTH references verified`. The sidecar
    must read `controlnet_2_conditioning_scale: 0.3` -- if it reads 0.8 the override did not take and
    the frame is a re-run of the parent, not a result.'
  b4a_board_down: 'THE CLAUSE THIS ROUTE IS TRYING TO CLOSE. A flat board or clipboard legibly drawn at
    the authored quad -- corners (608.6,660.5) (719.5,678.1) (697.7,816.2) (586.7,798.6), bbox x 583-723
    y 657-820 -- with its top edge below the shoulder line y=491. The parent DELIVERED this at 0.8, so
    presence is not in doubt; what is in doubt is whether it survives at 0.3. AND THE HALF THE PARENT
    MISSED IS SCORED HERE: the board must be HELD. The parent''s board hung like a satchel because the
    far arm was absorbed into the robe; a hand, or at minimum a lowered far arm reaching it, is required
    for `the clipboard comes DOWN` to be the picture the beat asks for. Scored by eye at 1:1 and 3x; the
    edge metric is NOT used, see below.'
  b6_drawn_not_traced: 'THE CLAUSE THE PARENT BROKE, AND HALF THE POINT OF THIS RUNG. Both figures read
    as DRAWN CHARACTERS at ep2-b08-twinsipa-0819''s standard, which is the reference: a face with pupils
    and a set jaw, hair with strands, folds in both garments, a legible metal clasp, a drawn hand with
    a dark cuff. The parent gave all of that back for one flat robe. PASSES ONLY IF the drawing is at
    twinsipa''s level, not merely better than boardnet''s -- ''less bad than the frame we rejected'' is
    not a bar.'
  b8_the_guard_has_hair: 'THE OTHER CLAUSE THE PARENT BROKE. canon.yaml `ep2-guard-hair`: guard B has
    light sandy hair, and \bbald\b is FORBIDDEN. The prompt says `light sandy hair` and is byte-identical
    across all three frames. twinsipa came back correctly haired; boardnet came back BALD, flipping toward
    the reference, which is bald by construction. PASSES IF the guard has hair. This is the cheapest available
    read on whether conditioning pressure is back to a sane level -- it moved once, so it is an instrument
    now.'
  b4b_both_arms_stay_on_their_skeletons: 'BOTH HALVES, AND THE SECOND HALF IS WHY IT IS RESTATED. B4b-i:
    the pointing hand''s centroid within ~60 px of the authored wrist (280.5,695.1) -- twinsipa measured
    40.3, boardnet 10.2, so this has never failed and is not the worry. B4b-ii: THE GUARD MUST HAVE TWO
    ARMS. boardnet''s far arm was swallowed by the robe entirely -- no elbow, no wrist, no hand. An arm
    that disappears has not stayed on its skeleton, and it is also why nothing held the board. The goblin''s
    arms hang and the hands do not clasp.'
  b7_no_limb_fragmentation: 'CARRIED, WITH THE ADMISSIBILITY RULE THAT MADE IT UNSCORABLE LAST TIME. G-R
    at six regions, three per figure, each box ON THE DRAWN LIMB with its coordinates AND ITS LUMA published.
    Within-figure spread <= 25.0; every guard region <= 0.0, every goblin region >= +20.0. THE PROBES
    MUST BE LUMA-MATCHED. On boardnet no matched set existed -- the brightest available patch on each
    guard region still spanned 120.2 luma levels because the light had turned hard and directional --
    and the clause was reported UNMEASURABLE rather than scored. If that happens again it is reported
    again, and the RECURRENCE is itself the finding: it would mean the lighting change tracks the second
    net at any strength.'
  b2_the_identities_separate: Guard face <= 0.0, goblin face >= +20.0, separation >= +20.0. twinsipa +42.0.
    Scored to catch the identities being dragged together, and subject to the same luma-matching condition
    as B7.
  b4c_the_arm_belongs_to_the_guard: MUST SURVIVE. The pointing arm grows from the guard's shoulder and
    is human-skinned. Eight mechanisms have held it, including boardnet.
  b1_the_pair: TWO figures and only two, both whole. Two is correct under figure_count_ruled_from_the_script_0817.
  b3_one_ground_plane: Both stand on the same grass. twinsipa measured 4 px between the two lowest skin
    rows. Read by eye if the automated detector is confounded by foreground grass, as it was on boardnet
    -- an honest eye call beats a number from a confounded detector.
  b5_no_colossus: 'Neither figure towers. twinsipa measured a stature ratio near 1.13 against the authored
    1.100. Note that BULK is scored under B6, not here: boardnet''s guard was roughly twice as wide and
    that is a drawing failure, not a stature one.'
not_done_on_purpose: ONE sample, ONE arm, ONE number. No sweep -- 0.3 is a single reasoned value and if
  it is wrong the next sample moves it once more. No per-net guidance window, which is the SECOND lever
  the parent named and needs its own driver change and its own rung. No change to either hint (both byte-identical),
  no change to the masks, the references, the ip-scale, the first net's scale, the seed or a single word
  of the prompt. No third figure. No colour-cast fix. No pick, no plate_ack, no canon filename, no canon.yaml
  edit.
rights_and_weights: THIS IS THE `licence_note`. Unchanged from the parent and clean. Base cagliostrolab/animagine-xl-3.1
  (CreativeML Open RAIL++-M). Net 1 xinsir/controlnet-openpose-sdxl-1.0 twins variant, apache-2.0. Net
  2 xinsir/controlnet-scribble-sdxl-1.0, apache-2.0, no attribution condition. IP-Adapter h94/IP-Adapter,
  apache-2.0. Both references are repo-internal crops. BOTH hints are authored in PIL from numbers --
  no annotator, so the lllyasviel/Annotators landmine is untouched by either condition. MistoLine is not
  used.
scoring_rule_pre_registered: 'THIS IS THE `verdict_rule`, WRITTEN BEFORE THE PIXELS.

  (1) BOARD PRESENT AND HELD, AND B6 + B8 AT twinsipa''s LEVEL, AND THE CARRIED CLAUSES SURVIVE -> PASS,
  and beat 08 has a COMPLETE plate candidate for the first time. Still NOT a pick and NOT a plate_ack;
  that is R4''s call.

  (2) BOARD PRESENT, B6 AND B8 RECOVERED, BUT THE BOARD IS HUNG RATHER THAN HELD -> the strength question
  is SETTLED and the remaining question is the arm. Next rung is wording or a hint that includes the forearm
  reaching the board, NOT another scale.

  (3) BOARD GONE AND THE DRAWING RECOVERED -> 0.3 is below this hint''s threshold. The board lives in
  a window between 0.3 and 0.8 and the next sample takes the midpoint; the mechanism is confirmed either
  way.

  (4) BOARD PRESENT AND THE DRAWING STILL DAMAGED -> scale is NOT the lever. The damage is not proportional
  to strength, which points at the full-denoise application rather than the magnitude, and the next rung
  is the per-net guidance window.

  (5) B7 UNMEASURABLE AGAIN for the same lighting reason -> the hard directional key travels with the
  second net at any strength, which is a finding about the net and not about this frame, and it changes
  what the route is willing to spend a second condition on at all.'
the_number_is_reasoned_not_measured: SAID PLAINLY SO NOBODY LATER CITES 0.3 AS AN OPTIMUM. The parent
  ran the two nets at 1.0 + 0.8 = 1.8 total conditioning and the frame flattened everywhere. Beat 08 has
  rendered well at a single net at 1.0 and at 0.8. 0.3 puts the sum at 1.3 -- above what has worked, below
  what failed, and closer to the former. That is an argument, not a measurement, and this sample is the
  measurement.
who_ruled_this_rung: 'ep2-b08-boardnet-0820''s own verdict, under `next_rung_named_not_taken`: "ONE sample,
  and the variable is the SECOND NET''S STRENGTH, nothing else... with --scale2 dropped from 0.8 to about
  0.3. Its bar is B4a AND the two clauses this rung broke, B6 and B8, restored to parent quality." Fired
  immediately because the card was idle with nothing claimed and nothing waiting, and the job has no dependency:
  every weight is local and both hints already exist. Written in an `extra` key because `fresh` prose
  is retokened and a parent id there would become this job''s own id.'
why_these_key_names: '`scoring_rule_pre_registered` and `rights_and_weights` are this spec''s `verdict_rule`
  and `licence_note`. derive_spec''s FINDINGS_NAME guard refuses any extra key matching /verdict|licen[cs]/,
  which is right for findings and over-reaches on two house keys that must be written BEFORE the pixels.
  Same declaration the last two rungs made.'
