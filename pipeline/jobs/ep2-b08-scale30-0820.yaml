observed_not_scored: >-
  THREE. (1) THE GOBLIN GAINED FULL TROUSERS. twinsipa has him bare-legged with a
  tan loincloth; here he wears teal trousers to the ankle and a matching tunic.
  Nothing in the prompt, the hint or the reference asked for that, and it is the
  change that broke the transferability of the B7 probes. Whether a clothed
  scavenger is acceptable is a canon/taste question and is NOT ruled on here --
  flagged for whoever owns the scavenger's costume. (2) THE PURPLE CAST IS BACK,
  mean luma 135.4 against twinsipa's 141.6 and the parent's 86.9, and the hard
  directional key is gone. So the lighting damage tracked the second net's
  STRENGTH, not its presence -- which retires the worry raised as branch (5) of
  the parent's rule. (3) THE BOARD STILL HAS NO CLIP, as predicted: the clip line
  in both hint authors is collinear with the top edge and asks for nothing.
what_this_settles: >-
  THE STRENGTH QUESTION IS SETTLED AND THE MECHANISM IS CONFIRMED. A second
  ControlNet on a board-only hint delivers the object at 0.3 and destroys the
  frame at 0.8, with every other input byte-identical across the two renders.
  The parent's diagnosis was right: a nearly-black hint is not a weak hint, it
  asserts "no edges anywhere" at whatever strength it is given, and the damage
  is proportional to that strength rather than intrinsic to composing two nets.
  It also settles that the per-net guidance window is NOT needed -- branch (4)
  of the parent's rule is excluded, because scale WAS the lever. And it settles
  that B8 is an instrument: the guard's hair tracks conditioning load with the
  wording held constant.
  SEPARATELY AND WORTH AS MUCH: PUBLISHED PROBE BOXES DO NOT TRANSFER BETWEEN
  FRAMES ON THIS BEAT. Wardrobe moves, and a box that measured skin in one frame
  measures cloth in the next. Every future B7 must re-place its probes on pure
  skin and publish both the coordinates AND the material, not just the luma.
what_this_did_not_settle: >-
  THE HAND. The board is reached but not gripped, and whether that is a wording
  problem, a hint problem (the board hint says nothing about a hand, and the
  openpose hint's L-wrist is at the board's grip corner but carries no finger
  keypoints -- COCO-18 has none) or simply this seed is unknown from one frame.
  Nor whether 0.3 is optimal or merely sufficient; no value between 0.3 and 0.8
  has been sampled and none needs to be unless something else wants tuning. Nor
  the goblin's new trousers. Nor whether any of this holds at a second seed --
  every frame on this route is seed 20260819.
what_this_does_not_license: >-
  NO PICK, NO plate_ack, NO CUT, NO CANON FILENAME, AND NOT THE WORDS "COMPLETE
  PLATE CANDIDATE". This is the closest frame beat 08 has produced and it is
  still one clause short: the beat asks for a clipboard lowered IN ONE HAND and
  no hand is drawn on it. Calling it complete because it is close is exactly the
  failure mode a pre-registered bar exists to prevent. Choosing between this
  frame and twinsipa is a taste call and belongs to the founder (R4). It does
  not license a scale sweep, a second seed, or scaling this recipe to other
  beats.
next_rung_named_not_taken: >-
  ONE sample: THE HAND ON THE BOARD, with --scale2 held at 0.3 and the board
  hint held byte-identical. The cheapest lever first, because it is free and
  because the wording is already half-right: the prompt says `clipboard lowered
  in one hand` and the negative says `raised clipboard, second board`, so the
  change is to make the GRIP explicit -- e.g. `one hand gripping the clipboard
  at his hip` -- and nothing else. Its bar is B4a's grip clause alone, with every
  clause passing here pre-registered to survive, and it is a WORDING rung so its
  risk is the token budget (the prompt currently runs 64 of 77).
  IF WORDING FAILS, the next lever is the board hint carrying a short stroke for
  the gripping hand at the authored L-wrist -- which would be the first figure
  ink ever put in that hint and must be argued for explicitly against the five
  tracing losses, not slipped in.
