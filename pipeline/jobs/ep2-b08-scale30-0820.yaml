    if ch != \"b5b8f9a7619c9452f19407ef73a01ce3f061fcf932de43ddbaca336d12d02801\":\n    print(\"!! twins\
    \ config sha %s, expected b5b8f9a7619c9452f19407ef73a01ce3f061fcf932de43ddbaca336d12d02801\" % ch);\
    \ sys.exit(1)\nbad = [r for r, _, fs in os.walk(d) for f in fs if f.endswith(\".incomplete\")]\nif\
    \ bad:\n    print(\"!! .incomplete under the twins dir: %r\" % bad); sys.exit(1)\nprint(\"twins net\
    \ verified: %d bytes, sha %s\" % (n, got))\n\n# ---- THE SECOND NET, resolved out of the offline HF\
    \ cache by repo id.\nsd = r\"C:\\Users\\artvn\\.cache\\huggingface\\hub\\models--xinsir--controlnet-scribble-sdxl-1.0\"\
    \nsnaps = glob.glob(os.path.join(sd, \"snapshots\", \"*\"))\nif len(snaps) != 1:\n    print(\"!! expected\
    \ exactly 1 scribble snapshot, found %r\" % snaps); sys.exit(1)\nsblob = os.path.realpath(os.path.join(snaps[0],\
    \ \"diffusion_pytorch_model.safetensors\"))\nsn = os.path.getsize(sblob)\nif sn != 2502139104:\n \
    \   print(\"!! scribble blob is %d bytes, expected 2502139104\" % sn); sys.exit(1)\nsgot = sha(sblob)\n\
    if sgot != \"b3e4ac47bc814019d50dc842f579301440deb6d8f09ee1b91a30f527ace1b852\":\n    print(\"!! scribble\
    \ blob sha %s, expected b3e4ac47bc814019d50dc842f579301440deb6d8f09ee1b91a30f527ace1b852\" % sgot);\
    \ sys.exit(1)\nsch = hashlib.sha256(open(os.path.join(snaps[0], \"config.json\"), \"rb\").read()).hexdigest()\n\
    if sch != \"b5b8f9a7619c9452f19407ef73a01ce3f061fcf932de43ddbaca336d12d02801\":\n    print(\"!! scribble\
    \ config sha %s, expected b5b8f9a7619c9452f19407ef73a01ce3f061fcf932de43ddbaca336d12d02801\" % sch);\
    \ sys.exit(1)\nsbad = [r for r, _, fs in os.walk(sd) for f in fs if f.endswith(\".incomplete\")]\n\
    if sbad:\n    print(\"!! .incomplete under the scribble dir: %r\" % sbad); sys.exit(1)\nif glob.glob(os.path.join(snaps[0],\
    \ \"*fp16*\")):\n    print(\"!! a fp16 variant appeared; the driver passes variant=None\"); sys.exit(1)\n\
    print(\"scribble net verified: %d bytes, sha %s\" % (sn, sgot))\n\n# ---- AND THE TWO ARE NOT THE\
    \ SAME WEIGHTS, asserted rather than assumed.\nif got == sgot:\n    print(\"!! THE TWO NETS ARE THE\
    \ SAME WEIGHTS. One of the two directories \"\n          \"holds a copy of the other and this render\
    \ would condition the \"\n          \"skeleton and the board on one net.\"); sys.exit(1)\nif n !=\
    \ sn or ch != sch:\n    print(\"!! the two nets no longer share size and config, so the premise of\
    \ \"\n          \"this guard has changed and it must be re-read, not relaxed.\"); sys.exit(1)\nprint(\"\
    the two nets share size %d and config %s and DIFFER in weights -- \"\n      \"only the sha separates\
    \ them\" % (n, ch))\n\nfor rel, want in ((\"pipeline/controlnet_plate.py\", \"aff188907fa03914b30a8cec2e5f739a5c4941f5d4246f4b2e220a9cc047c66a\"\
    ),\n                  (\"pipeline/control/b08-openpose-nat-0819.png\", \"562911c8174a6ecc21bc8710a1ac1b7f965c3f2d865093a742c2598c37d952e0\"\
    ),\n                  (\"pipeline/control/b08-board-0820.png\", \"38cd39da304dbb0317aa2522e1ccca099bef583e88e6573fde03b287358213d6\"\
    ),\n                  (\"pipeline/control/b08-ref-goblin-0819.png\", \"13b0c69d2f95dad6fd5472d8ab0310967b1a88c4554de7e6ff74b2d3e3644d8c\"\
    ),\n                  (\"pipeline/control/b08-ref-guard-0819.png\", \"61dc3f7fbd052617e52db63e8f6d359822b6ceba14b13514ffc03179b56cd83c\"\
    )):\n    p = os.path.join(r\"C:\\banyan-farm\\b08scale30-0820\\src\", rel.replace(\"/\", os.sep))\n\
    \    if not os.path.exists(p):\n        print(\"!! staged file missing: %s\" % p); sys.exit(1)\n \
    \   hh = sha(p)\n    if hh != want:\n        print(\"!! %s sha %s, expected %s\" % (p, hh, want));\
    \ sys.exit(1)\nprint(\"staged driver, BOTH hints and BOTH references verified\")"
