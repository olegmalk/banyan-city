# BEAT 03 JOINS THE VO-LENGTH WAVE, AND IT WAS EXCLUDED FROM IT BY A STALE LINE.
# The sibling spec `ep1-b02-121f-vo-length-run.yaml` names beat 03 in its
# exclusion list and cites shots.md:1041-1046 — "3, 6, 10 and 14 still have their
# old PNGs on disk, unrevoked ... each is a frame he turned down in v32". That
# passage is dated 2026-08-08 and beat 03 outran it the next day. The beat's own
# section overrides it (shots.md:137): "PICKED 2026-08-09 (founder, R4):
# `b03-r4-s3`. THIS BEAT IS CANON AND NOTHING RE-RENDERS ON IT", and the
# revocation was done on disk — the refused v32 frame is parked as
# `stills/03-deploy-succeeded-REVOKED-terminal-lab.png`.
#
# CHECKED, NOT ASSUMED. `shasum -a 256 stills/03-deploy-succeeded.png` =
# f38faecb350421154afcdd3ca0757496c82b4bb9d3bdbfa48fc59019c44a954a, which is the
# sha shots.md:139 records for the promoted pick, byte for byte. So the
# disqualifier the b02 spec applied to this beat does not hold, and nothing here
# re-renders the plate: this job conditions on it.
#
# THE DEFECT, MEASURED. render_t3.fit_duration (render_t3.py:312) sizes a voiced
# beat's slot to max(min(cdur, vdur + 2.0), vdur + 0.4), and footage shorter than
# its slot is looped as a palindrome. Read off this beat's own files:
#   clips/03-vo.json                                     total_s 3.13
#   review/provisional-v35/clips/03-deploy-succeeded.mp4 2.708s (ffprobe)
#   slot = max(min(2.708, 5.13), 3.53) = 3.53s
#   3.53 / 2.708 = the picture plays 1.30 times under one sentence.
# Milder than beat 02's 1.91x and it is the same artefact Roman named: "i'd
# rather not have any looping, it looks bad." Every one of the ten beat-03
# candidates on the review page is 65 frames / 2.708s, so this is not an
# eleventh candidate competing with ten — it is the first one that can go in the
# cut without repeating.
#
# THE FRAME COUNT IS ARITHMETIC, AND 81 WOULD NOT HAVE BEEN ENOUGH. The
# no-loop condition is F/24 >= vdur + 0.4 = 3.53, not F/24 >= vdur.
#   F >= 84.72. LTX wants 8n+1. Smallest 8n+1 >= 84.72 is 89 (8*11+1).
#   89 / 24 = 3.708s. 3.708 >= 3.53 (nothing loops) and 3.708 <= vdur + 2.0 =
#   5.13 (nothing is trimmed, so the whole clip plays).
# 81 frames is 3.375s, which is over the 3.13s line but UNDER the 3.53s slot, so
# it would still have looped — at 1.05x, a barely-visible repeat that would have
# read as a pass. 89 is the smallest count that actually fixes it. Far below the
# 385f host-RAM ceiling this box has measured, and below the 121f that rendered
# clean here on 2026-08-11.
#
# WHICH RECIPE THIS COPIES, AND WHY THAT ONE. `ep1-b03-v34-plate-twin-r3-0810`
# (clip `review/v34-motion/03-deploy-succeeded-LTX-r3-plate.mp4`), seed 20260734.
# Two reasons, neither of them a taste call: r3's wording is the one this repo
# has already banked as working on an interior — the b02 spec adopted it by name
# ("the beat-03 r3 prompt on this box proved that phrasing on an interior: a
# locked-off tripod shot with every object keeping its position") — and r3 is the
# most-exercised of the three, since all seven `v34-plate-reseeds/03-ltx-r3b..r3h`
# runs are its prompt at other seeds. Which of the ten Roman prefers is still his
# open call and this does not pre-empt it; it changes the length, on the recipe
# the pipeline already leans on elsewhere.
#
# THE ONE PROMPT CHANGE: THE NEGATION CLAUSE IS DELETED FROM THE POSITIVE.
# r3's positive ended:
#   "... Subject already in frame: no human, no person, no man, no woman, no boy,
#    no girl, no hand, no face, a dark room at night, one glowing monitor ..."
# At guidance 1.0 the sampler runs no unconditional pass (ltx_i2v.py ~1001-1008,
# confirmed against diffusers 0.39.0 in C:\banyan-video\venv), so the positive is
# the only channel the model reads — and negation does not subtract in it. That
# clause was feeding the model the tokens `boy`, `girl`, `hand`, `face` in the one
# place they bind. Same shape as beat 10, where the wobble turned out to be the
# literal word "sways" sitting in its positive (550705e).
#   DELETED, exactly: "no human, no person, no man, no woman, no boy, no girl,
#   no hand, no face, "
# It is deleted, not relocated. What remains of the tail is the positive
# description of what IS in frame, and I checked every noun of it against the
# canon plate by eye: the pink-magenta screen, the white mug, the potted plant at
# frame left, the night room. Nothing was added to compensate — inventing new
# wording here would be a second variable.
#
# THE NEGATIVE IS CARRIED VERBATIM AND IS INERT. Same guidance-1.0 finding: it is
# never read and changes no pixel. Unlike beat 02 (which has a person in it by
# design and had its human terms stripped so the record was not self-
# contradictory), beat 03 is an unpeopled close-up, so r3's negative is an honest
# record of what was asked and stays as it was.
#
# EXECUTION FLAGS COME FROM THE PROVEN LONG-CLIP SPEC, not from the 65f twin:
# `--offload sequential --mode production --image-crf 33`, as in the b02 121f run
# that completed on this box on 2026-08-11. `--steps` is omitted, which is the
# default 8 (ltx_i2v.py:1295) and therefore the same 8@352x640+3@704x1280
# two-stage schedule the r3 twin's own meta records. Guidance, seed, size and fps
# are r3's unchanged.
#
# ONE VARIABLE THIS DOES NOT REPEAT: the plate step runs, so the init is a
# cover-centre 704x1280 crop (plate_prep.py CROP_POLICY = "cover-centre") rather
# than the raw 832x1216 still. The whole v34-motion-0810 series went in raw and is
# stretched 24.4% vertically; the `-plate` twins corrected it and this follows them.
#
# NO METRIC PICKS ANYTHING. The flow metric is disqualified on this series
# (131e433 — it scored highest on the beat where the plant fell over). Read by eye.

