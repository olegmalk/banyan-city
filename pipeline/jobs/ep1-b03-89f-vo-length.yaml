    2D anime, hand-drawn cel animation, flat cel shading, clean ink linework, anime key art. a completely static locked-off tripod shot of a fixed room, the camera never moves and the frame never changes; the monitor stays exactly centred with both of its bezels inside the frame, the white mug stays on the same spot of the desk, the potted plant stays at the left edge, the desk edge stays along the bottom, every object keeps the same position and the same size in every single frame from the first to the last, the background is fixed and identical throughout. within that fixed frame there is only small ambient motion: the monitor glow pulses very faintly across the desk, a thin wisp of steam curls up from the white mug, the potted plant leaves stir slightly, dust motes drift slowly through the screen light, living scene. Subject already in frame: a dark room at night, one glowing monitor on a desk, a white mug in front of it, a potted plant at the left edge, cool magenta screen light.

