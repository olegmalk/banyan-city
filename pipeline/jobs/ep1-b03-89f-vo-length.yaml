success: >-
  A 704x1280 mp4 at C:\banyan-farm\v34-r2\03-deploy-succeeded-LTX-89f.mp4 with 89
  decoded frames (3.708s), conditioned on the canon plate, in which the room is
  the same room for the whole clip: the monitor stays centred and the same size,
  the mug and the potted plant hold their places, and no person, no second
  object and no scene change appears. The figure check is the one that matters
  here — the previous prompt asked for people by naming them, and this one does
  not name them at all, so a clip with a hand or a face in it is the finding.
  Whether the ambient motion is interesting enough is the OBSERVATION and his
  call, not the pass condition; a completed clip that reads static is a real
  result and gets reported as one. Judged by eye beside the 2.708s r3 clip. No
  metric.

why: >-
  Beat 03's clip is shorter than the sentence spoken over it, so the cut loops
  it; the fix is a frame count, plus deleting a clause that was asking for the
  people the shot forbids.

