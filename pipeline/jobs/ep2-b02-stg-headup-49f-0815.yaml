# THE 49-FRAME TEST, beat 02, 2026-08-15. ONE CLIP. Not a sweep, not a batch.
#
# ================== WHAT IS HELD AND WHAT MOVES ==================
# EVERY field is byte-identical to ep2-b02-stg-headup-0815 except ONE: --frames
# goes 97 -> 49. Same plate + same asserted sha256, same cover_crop.py, same seed
# 20260815, same positive prompt, same negative, 704x1280, 24 fps, guidance 2.0,
# distilled sigmas, two-stage, image-crf 33, sequential offload. LTX requires
# (frames - 1) % 8 == 0; 49 satisfies it. 49 frames at 24 fps = 2.04s.
#
# ================== WHY ==================
# The staging test won where it was aimed (the face came back) but its blind
# reader named dead air twice, unprompted: "roughly a third of the sequence is a
# still image at the end and another third is a still image at the start". The
# measured window agrees -- the whole performance lives in 0.54s -> 2.58s of a
# 4.04s clip, i.e. 2.04s of movement inside twice that much runtime. 2.04s is
# exactly 49 frames. So the question this clip asks is simple: does the model
# spend its motion arc PROPORTIONALLY to the runtime it is given (in which case
# a shorter clip is mostly performance and the dead air was a length artifact),
# or does it spend a FIXED-LENGTH arc and pad (in which case 49 frames buys the
# arc with no padding), or does it TRUNCATE (in which case the head lift will be
# caught unfinished at the last frame and 49 is too short for this action)?
# Those three answers have different signatures and the scoring below separates
# them.
#
# ================== THE PREDICTION (written BEFORE enqueue) ==================
# Measured references, both scored with the same validated window rule:
#   control ep2-b02-nw-0815:      head 0.478 | body 7.83 | tail 0.116 |
#                                 window 1.04 -> 3.42s | cadence 2.21x | flash 30.68
#   staged  ep2-b02-stg-headup:   head 0.569 | body 2.13 | tail 0.415 |
#                                 window 0.54 -> 2.58s | cadence 17.75x | flash 47.87
# The staged clip's window covers 50.5% of its runtime.
#
# 1. THE MOTION WINDOW WILL COVER A LARGER FRACTION OF THE CLIP. I predict the
#    window spans at least 70% of the 2.04s runtime -- head and tail freezes
#    shrink in absolute seconds, not just in proportion. THIS IS THE LOAD-BEARING
#    CLAIM; it is the only reason to spend the render.
# 2. BODY-WINDOW MEAN WILL RISE ABOVE 2.13, into 2.5-6.0. The same chin arc
#    across half the frames is more pixel change per frame. I say the range now
#    so that a number landing outside it cannot be re-narrated afterwards as the
#    thing I meant.
# 3. CADENCE WILL STAY BAD, 8x or worse. The period-2 near-duplicate is a
#    sampler/decoder property and has no reason to know how long the clip is.
# 4. THE BLIND READER WILL NOT NAME DEAD AIR AT BOTH ENDS. At most one end, and
#    not as "a third of the sequence". This is the prediction the founder's
#    complaint actually rides on.
# 5. THE ACTION WILL STILL COMPLETE: face readable at the LAST frame and more
#    readable than at frame 0, chin up, eyes open -- the win the staging test
#    bought must survive the shortening or the shortening is not free.
#
# ================== WHAT WOULD FALSIFY IT ==================
#   a. Window fraction <= 50.5%, i.e. no better than the 97-frame clip. Then the
#      model pads proportionally, frame count is not a dead-air lever at all, and
#      the fix has to come from staging or from cutting in post instead.
#   b. Body mean BELOW 2.13 while the blind reader reports the head still rising
#      at the last frame. That is the TRUNCATION signature: 49 frames is simply
#      not enough runtime for this action, and the answer is a shorter ACTION,
#      not a shorter clip.
#   c. The reader still says a third at each end is a still image. Prediction 4
#      dead, and with it the whole premise of this test.
#   d. Cadence drops below 4x. Then cadence is coupled to frame count, the
#      17.75x reading on the staged clip was partly a length artifact, and every
#      cadence comparison we have made across clips of different lengths needs
#      re-doing. This one would be a FINDING even though it falsifies me.
#
# A shorter clip that is mostly performance is a win even if every absolute
# number moves. A shorter clip that merely cuts the arc off is a loss and will be
# reported as one. The metric is a floor, never a verdict; where number and eye
# disagree the eye wins.
#
# ================== HOW IT WILL BE SCORED ==================
# Segmented frame-difference with PAIR 0 DROPPED (frame 0->1 is a restyle flash,
# not motion), motion window found on a PARITY-COLLAPSED difference series, plus
# a blind cold read taken from pipeline/coldread_frames.py -- a DENSE CONSECUTIVE
# strip through the motion window plus a whole-clip overview. The old 16-of-97
# even spread is retired: it samples ~7 source frames apart and made a continuous
# 1.7s head lift read as a cut to a blind reader on this very beat.
#
# NOTHING HERE IS PROMOTED TO CANON. ONE CLIP. ONE SAMPLE BEFORE ANY BATCH.
#
