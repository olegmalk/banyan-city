consumer: 'Beat 01''s shippable frame-1 plate. The founder resolved the route on 2026-08-13: "inpaint a SMALL fig
  into frame 1, then let the motion prompt grow it" -- so frame 1 owes a fruit and the motion pass owes the ripening,
  and neither owes the other''s job. The plate half of that is now settled too: beat 01''s base plate was PICKED on
  2026-08-18 off the compseed grid -- ep2-b01-compseed-s3-g5-0818''s b01-compseed-s3-s20260917.png, a two-leaf sprout
  that already carries a BARE PEDICEL and no fruit. This job is the one step between the picked plate and a frame-1
  plate that matches the approved script: it paints the script''s `green nub` onto that pedicel''s tip. Nothing downstream
  of it exists yet -- no motion job may point at a frame-1 plate that has no nub on it, because growing a fruit from
  nothing is the 0-of-12 img2img finding this repo already paid for.'
why: 'ONE VARIABLE: THE NUB. The plate is the picked frame BYTE-PINNED -- `--init-sha256 49fe0387...062b`, verified
  against the box''s own copy with certutil at authoring time and against the local copy the ellipse was measured
  on (same digest, so the geometry below was measured on the exact bytes the card will read). If the box''s copy is
  not that frame, inpaint_fruit.py stops before a model loads instead of painting a nub onto some other picture. Everything
  except the masked region comes back as the picked plate''s own pixels: diffusers 0.29.2 on a 4-channel UNet takes
  the latent-blend branch, which restores the unmasked area every step.

  THE MASK IS THE STEWARD''S AND IT IS ONE NUMBER TO MOVE. --ellipse 404,746,16,19, i.e. bbox (388,727)-(420,765),
  32x38 px = 3.8% of frame width and 3.1% of frame height. It was placed by measuring the plate, not by eye: a darkest-pixel
  scan of the sprout puts the leaf node at (414,711), the main stem at x=425-427 by y=744, and the BARE PEDICEL --
  the slender side stalk that leaves the main stem near y=822 and rises up-left -- ending in a free blunt tip at (407,744).
  The ellipse is centred within 3 px of that tip so the nub is drawn ON it rather than beside it, and it deliberately
  stops 6-7 px short of the main stem so a 0.99 pass cannot nick the stem and leave a discontinuity. It also covers
  ~12 px of pedicel below the tip, so the nub has stalk to attach to. SIZE IS THE POINT AND IS BOUNDED BY THE MASK:
  the model cannot draw anything wider than 32 px, and the two leaf blades measure 79x73 px and 82x61 px of lit blade
  in this same frame, so the nub is capped at roughly a third of a leaf''s span before the sampler gets a vote. The
  founder said SMALL; the mask is what makes that checkable.

  STRENGTH 0.99, AND THIS IS A DEVIATION FROM THE COMPSEED RECIPE WITH ITS REASON ON THE CARD. steps 40, cfg 7.5,
  pad-crop 64 and blur 8 are carried unchanged from the proven settings. STRENGTH IS NOT, and it must not be: 0.30
  is the compseed lane''s BLEND number, used to finish a two-leaf structure that plain PIL had already composited
  INTO the init (40 x 0.30 = 12 steps from a latent that already holds the answer). Here there is nothing at the pedicel
  tip to blend -- the nub does not exist yet and has to be ADDED. This repo has already measured what low denoise
  does to an ADD: 0 of 12 at strength 0.35 and 0.55 on an init that carried no fruit at all, and the note in inpaint_fruit.py''s
  own docstring -- "`strength` must be high to ADD something. It is not the img2img case; the unmasked region is restored
  every step by the blend above, so a high strength costs nothing outside the mask." The one run that ever put a fruit
  on this plant did it at 0.99 with pad-crop 64 (ep2-b01-fig-inpaint-s1, 2026-08-10: "THERE IS A FRUIT, the first
  in 36 frames", plate unchanged outside the ellipse, mean |dRGB| 0.011 of 765, max 20). Filing 0.30 here would spend
  the sample on a setting whose own evidence says it returns the plate back.

  PROMPT IS THE PROVEN FIG WORDING, RE-AIMED AT THE PRE-RIPE STATE. `matte green skin` and the glow bans (glowing,
  glow, orb, white sphere, specular highlight, glossy, shiny, lens flare) are pipeline/b01-fig/{prompt,negative}-r2.txt,
  written because the 2026-08-10 sample''s fruit wore a blown-out white specular cap. The plate''s own style words
  (soft blurred summer grass, warm amber backlight, hazy out-of-focus background, detailed cinematic anime tail) are
  the compseed prompt''s, so the patch is asked for in the dialect of the frame around it. PURPLE IS BANNED ON PURPOSE:
  purple is the RIPE state the motion prompt grows toward, and putting it in frame 1 would contradict the approved
  script''s `green nub`.

  ONE SAMPLE, NOT A BATCH. This is a recipe change (new init, new mask, new prompt, strength back to the ADD number),
  so it fires ONE frame at ONE seed and stops. max_attempts 1. $0, local card, no provider, nothing downloaded.'
success: "PRE-REGISTERED BAR, ONE SAMPLE, N=1, written before the frame exists and read off the committed file afterwards\
  \ rather than rewritten around the result. The frame is read at 1x and 4x against the picked plate side by side.\n\
  PASS requires ALL of: (a) exactly ONE nub, ROUND and GREEN, sitting ATTACHED at the pedicel tip near (407,744) --\
  \ touching the stalk, not floating beside it; (b) it is CLEARLY SMALLER THAN EITHER LEAF -- its longest span under\
  \ half the 79 px lit span of the left blade, and eye-obviously subordinate to both blades at 1x; (c) both leaves\
  \ and the main stem are visually unchanged outside the mask bbox (388,727)-(420,765), with any pixel motion out\
  \ there confined to the blur-8 ramp; (d) NO second fruit, no flower, no extra leaf anywhere in the mask; (e) NO\
  \ purple and no violet -- frame 1 is pre-ripe by the approved script.\nNAMED FAIL MODES, fixed before the frame\
  \ exists:\n * FAIL-ABSENT -- the mask comes back as bare pedicel or bare background, no nub. The next instrument\
  \ is NOT a hotter strength (0.99 is already the ceiling): it is a bigger mask, or the composite route -- draw the\
  \ nub in plain PIL the way leaf_count_composite.py draws structure, then blend at 0.30.\n * FAIL-DETACHED -- a nub\
  \ exists but floats clear of the pedicel tip. Instrument: move the ellipse centre onto the tip and shrink it, so\
  \ there is less empty mask for the nub to sit in.\n * FAIL-SIZE -- the nub rivals or exceeds a leaf. That would\
  \ mean the mask is the wrong cap, not the wording; instrument is a smaller ellipse.\n * FAIL-COLOUR -- purple, violet,\
  \ red-ripe, or the 2026-08-10 defect back again (white specular cap / glowing orb). Instrument is the negative,\
  \ which is the channel that binds colour on this checkpoint.\n * FAIL-COUNT -- two or more fruit, a flower, or a\
  \ third leaf inside the mask.\n * FAIL-PLATE -- anything outside the mask bbox moved beyond the blur ramp. That\
  \ invalidates the run outright: the picked plate is what the pick was made on.\nREPORTED BUT NOT A FAIL AXIS: whether\
  \ the nub takes the plate's amber backlight, and whether there is a seam or decal tell at 4x. Both were faults of\
  \ the 2026-08-10 fig and both are worth knowing; neither is scored here, because scoring three unattended knobs\
  \ off one frame is the K recipe.\nTHIS IS NOT A PICK AND NOT A TASTE CALL. It is a steward-rendered SAMPLE: not\
  \ approved for any cut, not canon, never takes a canon filename, not voiced, not animated, not assembled, not published\
  \ to the site. Whether beat 01 ships this frame is R4's."
