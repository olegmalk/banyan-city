    \ in the spec before anything is built on it. Taste and\\n\"\n            \"  trunk/graft calls are R4's and this\
    \ run makes none.\\n\")\nprint(\"stamped\", len(side), \"sidecar(s) in\", out_dir)\n"
- name: publish
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - "# Publish THIS job's own files out of THIS job's own directory. farm-out is not\n# gitignored, so the runner\
    \ pushes them itself and the frame reaches the Mac\n# without anybody logging in. The names are spelled out rather\
    \ than globbed, and\n# the exit code asserts the exact count -- a publish step that cannot find its\n# frames\
    \ must fail the job, so there is no allow_fail over this one.\nimport hashlib, os, shutil\nsrc = 'C:/banyan-farm/nubinpaint-0818'\n\
    dst = 'C:/banyan-farm/courier-box/farm-out/ep2-b01-nubinpaint-0818'\nos.makedirs(dst, exist_ok=True)\nnames =\
    \ ['b01-nub-s20260825.png', 'b01-nub-s20260825.png.meta.yaml',\n         'b01-nub-s20260825-mask.png', 'b01-nub-dry-mask.png']\n\
    got = []\nfor n in names:\n    p = os.path.join(src, n)\n    if os.path.isfile(p):\n        shutil.copy2(p, os.path.join(dst,\
    \ n)); got.append(n)\nwith open(os.path.join(dst, 'SHA256SUMS.txt'), 'w', newline='\\n') as fh:\n    for n in\
    \ got:\n        h = hashlib.sha256(open(os.path.join(dst, n), 'rb').read()).hexdigest()\n        fh.write('%s\
    \  %s\\n' % (h, n))\nprint('published', len(got), 'of', len(names), '->', dst)\nraise SystemExit(0 if len(got)\
    \ == len(names) else 1)\n"
