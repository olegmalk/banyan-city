  C:\banyan-farm\nubinpaint-0818\inpaint_fruit.py: "#!/usr/bin/env python3\nr\"\"\"Paint ONE object into ONE masked\
    \ region of an approved plate. SDXL, $0, local.\n\nWHY THIS EXISTS. Beat 01 asks for \"one small round green fruit\
    \ hanging from the\nstem\" and the prompt cannot deliver it: 0 of 24 across the wording rounds, and\n0 of 12 in\
    \ round 8's img2img -- which is the decisive one, because r8's init\ncarried no fruit at all and so was a clean\
    \ test of whether img2img will ADD an\nobject the init lacks. It will not, at strength 0.35 or 0.55. The founder\
    \ chose\n`inpaint` over `drop` on 2026-08-10 (ledger `ep2-b01-fig-route-0810`), so the\nfruit becomes its own\
    \ step and this is that step.\n\nTHE METHOD, AND EVERY CHOICE IN IT IS SOURCED RATHER THAN INVENTED.\n\n  * animagine-xl-3.1\
    \ has NO inpainting variant, so this loads the BASE weights\n    into StableDiffusionXLInpaintPipeline. diffusers\
    \ 0.29.2 supports that\n    explicitly -- its own check is \"The unet should have either 4 or 9 input\n    channels\"\
    , and at 4 (a normal SDXL checkpoint) it takes the latent-blend\n    branch instead of concatenating mask channels:\n\
    \        latents = (1 - init_mask) * init_latents_proper + init_mask * latents\n    HF's docs name the trade-off\
    \ in their own words: \"the overall image quality\n    may be lower, but it generally tends to preserve the mask\
    \ area (that is why\n    you can see the mask outline)\". Preserving the unmasked area is exactly what\n    we\
    \ want here -- the plate is the founder's and must come back unchanged\n    outside the mask.\n  * `padding_mask_crop`\
    \ is the countermeasure for the failure mode this beat has:\n    a SMALL object in a LARGE frame. It crops the\
    \ masked region with padding,\n    upscales that crop to the pipeline resolution, inpaints there, and pastes it\n\
    \    back -- so the fruit is drawn at full model resolution instead of at the ~5%\n    of the frame it will occupy.\
    \ Verified present in 0.29.2's __call__ on the box.\n  * `strength` must be high to ADD something. It is not the\
    \ img2img case; the\n    unmasked region is restored every step by the blend above, so a high strength\n    costs\
    \ nothing outside the mask.\n\n    diffusers 0.29.2 source: https://raw.githubusercontent.com/huggingface/diffusers/v0.29.2/src/diffusers/pipelines/stable_diffusion_xl/pipeline_stable_diffusion_xl_inpaint.py\n\
    \    inpaint docs:            https://huggingface.co/docs/diffusers/v0.29.2/en/using-diffusers/inpaint\n    model\
    \ card + licence:    https://huggingface.co/cagliostrolab/animagine-xl-3.1\n    padding_mask_crop issue: https://github.com/huggingface/diffusers/issues/6345\n\
    \nWHAT THIS SCRIPT REFUSES TO DO. It will not run on an init whose sha256 does not\nmatch the one named on the\
    \ command line. G1 says a conditioned render starts from\na frame the founder has passed, and the only way that\
    \ gate means anything is if\nthe bytes are asserted rather than the filename. It also never writes a canon\nfilename\
    \ and always writes `approved: false` in the sidecar.\n\nTHE MASK IS GEOMETRY AND IT IS THE STEWARD'S, NOT HIS.\
    \ He approved a method, not\na size or a position. The ellipse is passed in on the command line, drawn to a\n\
    PNG beside the output so it can be looked at, and reported in the sidecar in both\npixels and as a fraction of\
    \ the frame, so the first correction he makes can be\n\"lower\", \"smaller\", \"other side\" and it is one number.\n\
    \nSECOND CALLER, 2026-08-15: THE BARK BOARD, AND WHY THE MASK GREW STRAIGHT EDGES.\nA prop -- a clipboard made\
    \ of bark -- gates three beats of 002b (06 \"turns over a\nclipboard made of bark and reads\", 08 \"lowers the\
    \ clipboard and points\", 10\n\"flips the clipboard around: the back is blank\"). Four wording attempts closed\n\
    the wording lever for good (see `a5e61487`, `c7a11ff0`): they established that\nwording reaches the prop's MATERIAL\
    \ -- deleting the noun killed the chrome clip\nand white paper in 12 frames of 12 -- and that wording does NOT\
    \ reach its\nGEOMETRY. `large flat rectangular` was in the positive of a clean, uncontested\nprompt and all four\
    \ seeds still rounded the object into a lozenge, a dome, a\nsurfboard blank and a basket lid. So the geometry\
    \ has to come from the mask, and\nan ELLIPSE MASK CANNOT SUPPLY IT: an ellipse is the rounded blob that four\n\
    prompts already failed against, and masking a board with one would re-draw the\ndefect under test. Hence `--quad`,\
    \ four corners and four straight edges. A\nrectangle is a quad; a rectangular board held at an angle is a quad\
