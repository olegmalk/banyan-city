- name: stamp
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - "# Stamp the sample's sidecar as an unapproved provisional take.\n# inpaint_fruit.py already writes `approved:\
    \ false` and a `provisional:` block at\n# render time, so this ASSERTS those rather than writing them again --\
    \ appending a\n# second `approved:`/`provisional:` key would leave a sidecar with duplicate keys,\n# and a provenance\
    \ file that parses ambiguously is worse than one unstamped.\n# REFUSES if it found no sidecar, or one missing\
    \ the renderer's own gate lines: a\n# run whose provenance did not get written must not pass silently.\nimport\
    \ glob\nout_dir = \"C:/banyan-farm/nubinpaint-0818\"\nside = sorted(glob.glob(out_dir + \"/b01-nub-*.png.meta.yaml\"\
    ))\nif not side:\n    raise SystemExit(\"!! no sidecar yaml in %s -- refusing to call the job clean.\" % out_dir)\n\
    for p in side:\n    with open(p, encoding=\"utf-8\") as fh:\n        text = fh.read()\n    for needed in (\"approved:\
    \ false\", \"provisional:\"):\n        if needed not in text:\n            raise SystemExit(\"!! %s is missing\
    \ %r written by inpaint_fruit.py -- refusing.\" % (p, needed))\n    with open(p, \"a\", encoding=\"utf-8\", newline=\"\
    \\n\") as fh:\n        fh.write(\n            \"# --- appended after the render by the job-authoring lane, 2026-08-18.\\\
    n\"\n            \"# The renderer's own `approved: false` and `provisional:` lines are above and\\n\"\n      \
    \      \"# were asserted present before this block was written.\\n\"\n            \"cost_usd_confirmed: 0\\n\"\
    \n            \"approved_stamp: false\\n\"\n            \"provisional_stamp: true\\n\"\n            \"not_a_pick:\
    \ |\\n\"\n            \"  ONE SAMPLE of the frame-1 nub inpaint (ep2-b01-nubinpaint-0818) on the plate\\n\"\n\
    \            \"  picked for beat 01 on 2026-08-18. Not a pick, not a seed confirmation, not\\n\"\n           \
