    \ %s\"\n                       % str([[int(x), int(y)] for x, y in corners])]\n    mask_lines += [\n        \"\
    mask_bbox_px: [%d, %d, %d, %d]\" % tuple(bbox),\n        \"mask_width_frac: %.4f\" % ((bbox[2] - bbox[0]) / float(W)),\n\
    \        \"mask_height_frac: %.4f\" % ((bbox[3] - bbox[1]) / float(H)),\n    ]\n    sidecar = a.out + \".meta.yaml\"\
    \n    with open(sidecar, \"w\", encoding=\"utf-8\", newline=\"\\n\") as fh:\n        fh.write(\"\\n\".join([\n\
    \            \"# Still provenance (7.2), written AT RENDER TIME by inpaint_fruit.py\",\n            \"# on the\
    \ rtx5090. The plate outside the mask is the founder's own\",\n            \"# pixels; only the region described\
    \ below was redrawn.\",\n            \"platform: local-gpu (rtx5090)\",\n            \"model: %s\" % BASE,\n \
    \           \"model_licence: %s\" % BASE_LICENCE,\n            \"pipeline: StableDiffusionXLInpaintPipeline (base\
    \ weights, unet.in_channels=%d)\" % in_ch,\n            \"size: %dx%d\" % (W, H),\n            \"steps: %d\" %\
    \ a.steps,\n            \"guidance: %s\" % a.cfg,\n            \"strength: %s\" % a.strength,\n            \"\
    seed: %d\" % a.seed,\n            \"padding_mask_crop: %s\" % (a.pad_crop or \"null\"),\n            \"mask_blur_factor:\
    \ %d\" % a.blur,\n            \"init_image: %s\" % a.init.replace(\"\\\\\", \"/\"),\n            \"init_sha256:\
    \ %s\" % have,\n            \"mask_png: %s\" % os.path.basename(mask_png),\n        ] + mask_lines + [\n     \
    \       \"mask_is_the_stewards: >-\",\n            yaml_block(\"THE FOUNDER APPROVED A METHOD, NOT THIS GEOMETRY.\
    \ He said \"\n                       \"`inpaint` and named no size, no position, no colour and no \"\n       \
    \                \"shape. The mask above is the steward's and is the first \"\n                       \"thing\
    \ his correction should move -- 'lower', 'smaller', \"\n                       \"'other side' is one number here;\
    \ the words in the prompt \"\n                       \"are his own approved shots.md wording.\"),\n          \
    \  \"rendered_utc: %s\" % stamp,\n            \"render_seconds: %.1f\" % render_s,\n            \"wall_seconds:\
    \ %.1f\" % (time.time() - t0),\n            \"cost_usd: 0\",\n            \"python_version: %s\" % versions[\"\
    python\"],\n            \"torch_version: %s\" % versions[\"torch\"],\n            \"diffusers_version: %s\" %\
    \ versions[\"diffusers\"],\n            \"approved: false\",\n            \"provisional: >-\",\n            yaml_block(\"\
    PROVISIONAL. A steward-rendered SAMPLE, not a pick and not \"\n                       \"canon. Never takes a canon\
    \ filename, is not published, not \"\n                       \"posted, and not assembled into an episode. Ground\
    \ truth is \"\n                       \"the founder (R4).\"),\n            \"note: >-\",\n            yaml_block(a.note\
    \ or \"one inpainted sample; the fruit question.\"),\n            \"prompt: |-\",\n            yaml_block(prompt),\n\
    \            \"negative: |-\",\n            yaml_block(negative),\n            \"\",\n        ]))\n\n    print(\"\
    WROTE %s\" % a.out, flush=True)\n    print(\"WROTE %s\" % mask_png, flush=True)\n    print(\"WROTE %s\" % sidecar,\
    \ flush=True)\n    print(\"rc=0 render_s=%.1f\" % render_s, flush=True)\n    return 0\n\n\nif __name__ == \"__main__\"\
