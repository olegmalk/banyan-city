verdict_this_job: 'FAIL -- G5, by the thing that makes it the best clip in the pool. This
  is the close one and the reason the re-roll is worth filing.


  G1 PASS, the widest margin anything has cleared it by. 121/121 frames live -- the only clip
  besides b11 the detector never loses -- 892 -> 17275 px, ZERO shrinking frames, maximum
  single-frame step 1.08x, and the arc runs to the end: 50% of the growth at f086, 90% at
  f111. This is ''the fig grew'', not ''a fig appeared'', which is the whole clause. Validated
  by eye at 5x on f000/f060/f090/f120, f090 being the desaturated slate frame the retired
  predicate went blind on (13.7% recall) and this one holds through at a 1.03x worst step.


  G2 PASS: hue 301.6, sat 0.72, val 0.42 -- deep purple-violet.


  G4 (size) PASS on b13''s settled per-frame reading, max step 1.08x against a 2.0x bar. See
  clause_instrument_status for the tension this reading carries at a 19.37x total.


  G5 FAIL, and it is not the bloom -- b15 has the MILDEST bloom of the five by 2.4x (peak
  104.64 at f035, +17.45, and the only one that has not passed 100 by f024). It fails because
  THE SAPLING GROWS TOO. Its two leaves go from a sprout sitting below the grass tips at f000
  to filling the upper half of the frame by f120, the stem thickens and elongates, and the
  grass thickens with it. Region NCC f000->f120: shaft -0.355 (the leaves have grown into
  the top strip), sapling 0.092, grass floor 0.027 -- against the incumbent''s 0.932 / 0.637
  / 0.323 on the same init. The prompt asks for the nub to swell as ''the only thing in frame
  that moves''; here the whole picture does.


  G4 (below the grass), EYE NOTE ONLY, clause retracted for want of a threshold: the plant
  tops the grass from about f072 and is well clear of it by f120.


  H4 camera push NOT PROVEN and not quotable. The first fit said 1.5x on three of four quadrants
  and that was the search grid''s edge, not a measurement; extended to 2.50 it reads 2.20
  whole-frame with quadrants [2.5, 2.5, 1.25, 1.55], spread 1.25 -- the top of the picture
  magnifying about twice as hard as the bottom, which is a locally-varying redraw and not
  a camera move. The probe now refuses railed fits outright (fig_track.py 527c4b5f).


  G3, eye note only: two leaves at every one of f000/f024/f048/f072/f096/f120. Six frames
  are not 121 and this is not scored.


  H1, H5 both clear: nothing frozen (fig-box NCC to the last frame is still -0.184 at f080),
  and the fig centre moves 14 px across 121 frames (786,339 -> 788,325) with the jump gate
  live throughout.'
