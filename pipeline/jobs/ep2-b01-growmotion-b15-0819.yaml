  instrument: 'pipeline/fig_track.py (commit 527c4b5f), geometry-anchored, NOT a colour predicate.
    The mask starts from the composite''s own inpaint mask b01-nubcomp-s20260826-mask.png
    carried through this job''s cover_crop into the 704x1280 init -- centroid (785.1, 339.4),
    the --centre 405,750 the composite was given -- and every later frame propagates by region
    continuity. Five declared gates; a frame that fails one publishes status:dead, a reason
    in words and area_px:null, and never enters a growth ratio. 15 selftest checks pass including
    the six frame-backed ones: the anchor lands on the geometry, all six hand-verified b15
    keyframes (read by eye off gridded crops, the f090 slate frame among them) sit within
    22 px, and the retired green-magenta predicate is shown keeping 91.1% of the true fig
    at f072 and 13.7% at f090 -- that collapse and re-inflation IS the 3.9x b15 balloon the
    old instrument published, and it is an artifact of the mask. Re-validated for this verdict
    by eye at 5x on b15 f000/f060/f090/f120: the outline hugs the green nub, the green sphere,
    the grey-blue slate sphere and the purple berry.'
  clause_instrument_status:
    G3 (exactly two leaves in every frame): RETRACTED -- NO INSTRUMENT EXISTS. This repo has
      no leaf counter, and eyes on a six-frame sample cannot certify a universal over 121
      frames. What the sample says is recorded per clip as a look, not as a score. The clause
      is unscored rather than assumed.
    G4, second half (below the grass): RETRACTED -- no grass line is defined anywhere in the
      spec or the plate, so there is no threshold to measure against. Recorded per clip as
      an eye note only.
    G5, camera-locked half (whole-frame registration): RETRACTED -- the instrument refuses.
      global_zoom fits one scale to the picture and refits it on four disjoint quadrants;
      a camera move is one transform, so disagreeing quadrants mean the picture is being redrawn
      and no scale may be quoted. Not one of the five is quadrant-consistent. On b15 the default
      grid also RAILED at its 1.50 maximum and invited a 'three quadrants agree on a 1.5x
      push' reading; extended to 2.50 it reads 2.20 whole-frame with quadrants [2.5, 2.5,
      1.25, 1.55]. Fixed in 527c4b5f so a railed fit publishes railed:true and can never be
      quoted again.
    G4, first half (no size doubling): 'SCORED, on the reading ep2-b01-growmotion-b13-0819
      already settled and this lane did not move: MAXIMUM SINGLE-FRAME AREA RATIO under 2.0x,
      not total growth -- which is how b13 passed G4 while growing x10.30. TENSION NAMED,
      NOT ACTED ON: a per-frame reading admits an unbounded total, and b15 rides it to 19.37x,
      nearly double b13''s. Re-reading a settled clause in order to fail a clip is not a thing
      to do quietly, so it is written here instead.'
    G5, only-the-fig-moves half: 'LIVE and scored. Region NCC between f000 and f120 -- gain-
      and offset-invariant, so the bloom does not fake it -- on four bands: the light shaft
      (y0-350), the sapling (y430-740, x150-560), the fig box (y700-900, x230-450) and the
