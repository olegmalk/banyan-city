    src = sorted(glob.glob(srcdir + \"/04-the-footnote-*\")) + sorted(glob.glob(srcdir + \"/refs-dedup.yaml\"\
    ))\npngs = [f for f in src if f.lower().endswith(\".png\")]\nlines = []\nfor f in src:\n    shutil.copy2(f,\
    \ dst)\n    # Hash the COPY, not the original: what this records has to be the bytes\n    # that\
