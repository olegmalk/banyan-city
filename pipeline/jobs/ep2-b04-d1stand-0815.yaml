why: 'WHAT THE REFERENCE SET IS. refs-goblin-d1stand-0815, frozen at
  pipeline/refs/refs-goblin-d1stand-0815.yaml and staged by pipeline/refs/stage_standing_refs.py.
  Four STANDING FULL BODIES of design #1, all four generated by ep2-b04-standing-views-0815
  round r0, whose IP-Adapter anchor was the one sound standing tile (sha256 9526882e.., the
  same bytes as refs-goblin-d1-0815 slot s2):

    goblin-d1stand-s0.png  395e2cdc..  <- 04-the-footnote-ipa-r0-w015-s0.png  f4273d14..
    goblin-d1stand-s1.png  a964a94e..  <- 04-the-footnote-ipa-r0-w015-s1.png  652eb336..
    goblin-d1stand-s2.png  a227ddd0..  <- 04-the-footnote-ipa-r0-w015-s2.png  e482dfb7..
    goblin-d1stand-s3.png  51289bd1..  <- 04-the-footnote-ipa-r0-w015-s3.png  051c5a92..

  Four distinct sha256, so the sampler''s content dedup drops nothing and the arm draws all
  sixteen frames. That is the whole reason this set had to be generated: d1 seed s1 held ONE
  sound standing tile, and four copies of one picture is one distinct reference — the dedup
  would have drawn four frames while the job returned a code that looks like success.

  SCORE s0, s1 AND s2. Slot s3 is OFF-DESIGN — its ears came back small and rounded instead
  of long and pointed and its skin reads grey rather than green, so it is a bald old man
  rather than the goblin. It fills the fourth slot because the sampler builds slots as
  `{prefix}-s{i}` for i in 0..3 and refuses on a missing file. Its round is expected to be
  the odd one out and that is not evidence about the set.

  NO WHITE PADDING ANYWHERE, and this is the one thing about the set worth arguing for. The
  previous sweep bought margin by padding tiles with a white field, and every padded round
  came back on blank paper — the lane''s own verdict was "my own margin did what an identity
  card does". These tiles are squared by resampling the 832x1216 frame to 569x832 and
  extending its outermost COLUMN sideways to fill the canvas, so the tile is sky-over-grass
  edge to edge and every pixel belongs to its own frame. An earlier revision mirrored the
  outer strip instead and pulled a detached fragment of his SLEEVE into the frame edge on two
  tiles; that was caught by eye and replaced, because a duplicated limb in a reference is
  what `extra limbs` sits in the negative to prevent.

  WHAT IS NOT TOUCHED: the draft key (`authored_goblin_approved_recipe`, the same control both
  previous samples ran), the prompt, the negative, the seeds, the steps, the guidance, the arm
  (window4 — the 15% window at scale 0.6 across all four references, four seeds each), the
  beat, the harness and the sampler. This arm adds no word to either prompt, so the negative is
  unchanged and stays where it already was inside the 77-token budget.

  NOT A LICENCE TO SCALE. The budget is at the freeze boundary. This is the only render this
  lane is authorised to fire off the new set, and no wave follows it.'

prediction: 'WRITTEN BEFORE THE RUN.

  THE COMPARISON IS EXACT. Round r2 of ep2-b04-d1refs-0815 and round r2 of
  ep2-b04-d1margin-0815 are the same beat, arm, draft and seeds off a STANDING reference, and
  they measured 4.9 and 5.8 heads. Every round of this job is off a standing reference, so I
  predict the WHOLE RUN sits in that band rather than one round of it:

    r0, r1, r2   5 to 6 heads, lean, no blush, dour. No round below 4.5.
    r3           the off-design slot; expect the same proportion but a blunter, rounder-eared
                 head, because that is what its tile depicts.

  THE SHARPEST PREDICTION, and the reason the set was built this way: THE PLATES SHOULD COME
  BACK IN A PLACE. Every tile carries sky and grass to its own edges, and the evidence that
  the reference''s background is what decides this is direct — in ep2-b04-standing-views-0815
  the round conditioned on the UNPADDED tile returned four locations while the three rounds
  conditioned on WHITE-PADDED tiles returned blank paper in 11 of 12 frames, with a prompt
  that said "standing in sunlit grass" and a negative carrying `white background, simple
  background`. If the location comes from the reference, these sixteen are outdoors.

  WHAT WOULD FALSIFY IT: blank or near-blank backgrounds anyway. Then the location is not
  carried by the reference either, both explanations are dead, and the next lever is the
  draft rather than the tiles.

  WHAT I EXPECT NOT TO GET, stated so it cannot be smuggled in as a win: POSE, and VIEW
  VARIETY. All four tiles are frontal standing figures — the generation run produced no
  three-quarter, no profile and no back view in sixteen frames — so this set teaches the
  adapter one angle, well. Nobody will crouch. Neither is under test.

  NOT A PREDICTION ABOUT TASTE. Heads-tall, blush and background are measurables. "A young
  dumb goblin, but not cute" is R4''s and is reported separately, unscored.'

success: Sixteen frames opened beside ep2-b04-d1refs-0815''s and ep2-b04-d1margin-0815''s.
  Pass is the prediction holding — 5-to-6 heads across the scored rounds, zero blush, and the
  plates in a location rather than on paper. A clean failure against the prediction is worth
  the same four minutes and is reported as plainly.
verdict: 'RAN 2026-08-15, rc=0, 16 frames in about four minutes, $0. All sixteen opened.

  THE LOCATION PREDICTION HELD — fifteen of sixteen plates came back OUTDOORS: grass fields,
  clouded skies, a sunset treeline, distant hills, a lake. The stated falsifier ("blank or
  near-blank backgrounds anyway") did NOT fire, and the costume-card failure mode this set was
  built to avoid did not appear.

  BLANKNESS TRANSFERS FROM THE TILE ONE FOR ONE. Border blankness of the reference tile against
  the mean of the four plates it drew:

    tile s0  0.000  ->  0.004     located
    tile s2  0.002  ->  0.004     located
    tile s3  0.218  ->  0.204     part paper
    tile s1  0.387  ->  0.493     half paper, some with a white border

  Monotone and near the identity line — a transfer, not a correlation. THE REFERENCE DECIDES THE
  LOCATION, now with a number rather than an adjective. The corollary is the useful half: a clean
  tile draws clean plates. On that measurement slots s1 and s3 are DEMOTED in the frozen manifest
  (`use_slots: [s0, s2]`, `replace_before_use: [s1, s3]`) and the set is honestly two slots.

  BLUSH RETURNED IN ROUGHLY FOURTEEN OF SIXTEEN — pink cheek patches, blush whisker-lines, soft
  round cheeks, large red eyes. This is NOT a defect of the set and it is the most useful thing the
  sample says. This job deliberately ran `authored_goblin_approved_recipe`, which says "A small
  goblin boy" and carries no anti-blush term at all, because holding the draft fixed is what makes
  the reference the only variable. The SAME references under the adult draft
  (ep2-b04-standing-views-0815) drew ZERO blush in sixteen.

    the REFERENCE carries the LOCATION and the build.
    the DRAFT carries whether he is a blushing child or a dour adult.

  PROPORTION HELD at ~5 to 5.5 heads, measured on the full-resolution frame: r2-s0 is 200 px
  skull-to-chin against 1065 px skull-to-sole, 5.3 heads. So "small goblin boy" damaged the FACE
  and not the height.

  ONE ARTEFACT: r3-s1 drew two faded GHOST FIGURES flanking him on a `solo` prompt. One frame in
  sixteen and in the off-design slot, but recorded because an unbidden second figure is how a
  wave-wide defect starts.

  RECOMMENDATION, NOT APPLIED. The twelve beats on refs-goblin-approved-0814 — 02 03 04 07 08 13
  14 15 16 17 19 20 — stay exactly where they are. What these two samples jointly argue is that
  re-pointing a beat at a reference set ALONE buys a better background and hands back the baby:
  the reference and the draft have to move together. Any re-point should pair
  refs-goblin-d1stand-0815 (slots s0 and s2 only, after s1 and s3 are replaced) with the adult
  wording and the `blush, red cheeks, chibi, big head, baby face, toddler, child` negative. That is
  R4''s call and a founder screening, not this lane''s.'

