why: 'ONE SAMPLE, ONE VARIABLE. Everything here is byte-identical to `ep2-b07-scene-0815` (which ran,
  rc=0) except `--refs`. That job used refs-guards-twoinfield-0813 and got its LOCATION but not its CAST:
  the guard came back a pointy-eared elf child and the goblin a green plant-sprite mascot, consistently
  across seeds, because those refs contain two guards in a field and NO GOBLIN AT ALL. Beat 07 is a
  two-character beat pointed at a one-character reference set. The refs-decide law says the reference
  wins over the sentence, so the fix is a reference and not an adjective. refs-b07-mixed-0815 was staged
  box-side by the previous stills lane and left UNTESTED; this lane verified it by CONTENT HASH rather
  than by filename or slot order, because every file in it is still named `04-the-footnote-wave1-sN.png`
  from the goblin wave and the names now lie about what is inside. Verified 2026-08-15:
    s0 582e5ab5.. = refs-goblin-approved-0814/s0  (founder-approved goblin, seed s0)
    s1 466b18bb.. = refs-goblin-approved-0814/s1
    s2 8e680225.. = refs-guards-chosen-0814/s0    (guard A, frozen 2026-08-14)
    s3 9b4a0a14.. = refs-guards-chosen-0814/s1
  CONSEQUENCE FOR PROVENANCE: the sidecars this job writes will record `ip_adapter_reference:
  04-the-footnote-wave1-sN.png` for all four rounds, and for s2/s3 that string is WRONG -- those rounds
  are conditioned on guard A. Read the hashes above, not the filename, when citing this run.
  NOT A LICENCE TO SCALE: a two-figure reference set has never been tried on this harness, and beat 10
  measured that a SINGLE-figure reference imposes a single figure. The symmetric risk is that this set
  imposes two figures on beats that want one. Nobody reuses refs-b07-mixed-0815 on a single-character
  beat until this sample has been opened and judged.'
