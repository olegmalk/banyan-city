verdict_this_job_measured:
  instrument: 'All 121 frames extracted and opened -- an 11x11 whole-clip sheet, a 4-up at f000/040/080/120, and
    a 2x zoom on the fig through the colour change. THE FIRST INSTRUMENT WAS WRONG AND IS REPORTED AS SUCH: a
    green-OR-purple colour-predicate mask reported a one-frame colour pop and a 2.0x-2.5x single-frame area step
    on this clip, and BOTH ARE ARTEFACTS OF THE MASK -- the fig passes through teal and desaturated slate on its
    way to purple, which satisfies neither predicate, so the blob vanishes and reappears and the class flips in
    one frame while the pixels ramp smoothly. Re-measured with a colour-INDEPENDENT windowed mask (not-warm, inside
    a 220px box tracking the previous centroid), which is where every number below comes from.'
  container: 704x1280, 24 fps, 121 frames, 5.041667 s (ffprobe). 260.7 s of GPU, peak 12.0 GB torch, $0. Six published
    files verified against ep2-b01-growmotion-b14-0819.sha256.
  G1_GROWTH_BY_A_CONTINUOUS_PATH_PASS: 'Fig area 444 px at f000 -> 2832 px at f120, x6.38. CONTINUOUS: the largest
    single-frame area ratio anywhere in the clip is 1.11x, and no frame reaches 1.2x. Area passes 616 at f010,
    1041 at f040, 2304 at f080 and 2671 at f100 -- a smooth ramp that flattens over the last twenty frames rather
    than stepping.'
  G2_END_STATE_DEEP_PURPLE_VIOLET_PASS: Mean fig RGB walks (150,181,126) pale green at f010 -> (131,177,127) at
    f040 -> (116,117,110) neutral grey at f050 -> (99,22,88) at f060 -> (93,18,86) at f120. The end state is deep
    purple-violet and the path to it is a continuous ramp through teal and desaturated slate, not a switch.
  G3_EXACTLY_TWO_LEAVES_PASS: Two leaves in every one of the 121 frames, read on the whole-clip sheet and on the
    4-up. None appears, none vanishes, none splits.
  G4_NO_SIZE_DOUBLING_PASS: 'No frame doubles the fig: the maximum single-frame ratio is 1.11x against a 2.0x
    bound. THE FIG DESCENDS RATHER THAN RISES: centroid y789 at f000 to y908 at f120, 119 px DOWN. It is not scored
    as a fail -- G4 asks for no doubling and for the fig to stay below the grass, and a descending fig satisfies
    both -- but it is the exact opposite of the sibling seed, which rose 69 px, and a fruit that sinks as it ripens
    is worth a look before this recipe is trusted.'
  G5_ONLY_THE_FIG_MOVES_FAIL: 'THE CLAUSE THAT KILLS IT. The whole sapling enlarges across the clip -- the leaves
    at f120 are clearly larger than at f000, though less dramatically than seed 20260838. WHAT THE INSTRUMENT
    CAN AND CANNOT SAY, stated plainly rather than dressed up: a whole-frame scale fit about the centre picks
    scale 1.13 at f120, but it beats no-scale by only 0.35 levels of SAD, which by the same region-consistency
    discipline this repo applies elsewhere is TOO WEAK TO FILE AS A CAMERA MOVE on its own. So the measurement
    cannot separate "the camera pushed in" from "the plant ballooned". IT DOES NOT NEED TO: H4 names both, and
    G5 says only the FIG moves. Something other than the fig moved, it is visible at a glance in the 4-up, and
    the bar is conjunctive.'
  PLATE_FIDELITY_measured_not_a_clause: Whole-frame mean luminance 87.28 at f000 -> 97.36 at f120, +10.08. The
    best plate fidelity this lane has measured on the recipe -- a quarter of the sibling's bloom.
