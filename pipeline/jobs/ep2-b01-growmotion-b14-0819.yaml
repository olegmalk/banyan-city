    A 2x crop at f040/055/070/085/100/120 shows a thin stalk running from the fig to the main stem in every frame.
    The sheet was wrong, the zoom corrected it, and it is recorded because a false positive on a fault named in
    advance is expensive.
  H6-SCENE-BREAK: DID NOT FIRE. One continuous shot, no cut, no location change.
THE_FINDING_THAT_OUTLIVES_BOTH_CLIPS: 'THESE TWO SEEDS ARE EVIDENCE AGAINST THIS SPEC''S OWN sweep_summary_correction.
  That block calls G1 "the recipe''s dominant, systematic failure mode", on the strength of "4 of 6 pop in 1 to
  4 frames" and rejects that "step 2.1x-2.9x in area across 1-4 frames". Seeds 20260838 and 20260839 BOTH pass
  G1 and BOTH pass G2, with maximum single-frame area ratios of 1.11x each and colour ramps that are continuous
  under a colour-independent mask. AND THERE IS A MECHANISM FOR HOW THE EARLIER NUMBERS COULD BE WRONG, reproduced
  here on purpose: a green-or-purple colour-predicate mask reported a ONE-FRAME POP and a 2.47x AREA STEP on seed
  20260838, and both evaporated when the mask stopped depending on colour. The fig''s path runs through teal and
  desaturated slate, which satisfy neither predicate, so the blob shrinks to nothing and the class flips in a
  single frame while the pixels ramp over forty. THIS DOES NOT OVERTURN THE SWEEP -- those six clips were not
  re-measured here and this lane did not open them. It names a specific, checkable reason to re-measure them BEFORE
  anyone builds the "temporal distribution of change" experiment the correction recommends, because that experiment
  would otherwise be attacking a defect that may be an instrument artefact. One re-measure of the six on a colour-independent
  mask settles it and costs no GPU.'
THE_PUBLISHED_FILENAME_IS_WRONG_ON_BOTH_JOBS: 'BOTH ep2-b01-growmotion-b13-0819 AND ep2-b01-growmotion-b14-0819
  published a file called `01-cold-open-LTX-nubgrow-b-s20260826.mp4`. That name asserts seed 20260826, which is
  the PICK from the earlier sweep and is neither job''s seed. The renders are genuinely different (sha 92e67c20...
  and f5093d5c...) and the sidecars are CORRECT -- seed 20260838 and 20260839, matching bench-b01-nubgrow.jsonl
  -- so nothing was mis-rendered and no provenance was lost. What was lost is the filename''s usefulness: two
  different takes carry one name, that name claims a third seed, and a consumer that globs by filename or copies
  both into one directory gets a silent collision with the pick''s own name. The derivation cloned the parent''s
  out path and substituted the seed everywhere except in the string it is written into. Not fixed by re-rendering
  -- a rename plus a manifest rewrite is the whole repair, and it is not done here because this lane was asked
  to judge, not to re-issue.'
verdict_cut: NOT CUT-PREFERRED, and the cold open's pick does not move. Seed 20260826 remains the only clip that
  has cleared this bar, and the tally is now ONE PASS IN EIGHT. Nothing is promoted, published or cut on the strength
  of this verdict, and whether the cold open is GOOD remains the founder's under R4.
what_this_licenses_after_the_verdict: 'Nothing new, and specifically NOT a ninth seed. The sweep''s own conclusion
  -- "a seventh seed is a lottery ticket, not an experiment" -- is unchanged, and these two rolls are what it
  looks like when it is ignored: two more clips, two more H4s, no new axis. The one piece of work these clips
  DO justify is the $0 re-measure named above, which needs no card and no founder.'
