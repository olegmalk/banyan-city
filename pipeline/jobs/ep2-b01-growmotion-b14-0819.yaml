  H1-FROZEN: DID NOT FIRE. The fig grows by a factor of 6.38 and the colour ramps the whole way.
  H2-STAYS-GREEN: DID NOT FIRE. It ends deep purple-violet.
  H3-LEAF-COUNT: DID NOT FIRE. Two leaves, all 121 frames.
  H4-BALLOON-OR-CAMERA-PUSH: FIRED. This is the fail. Which half of it fired is not separable by the instrument
    -- see G5 -- and the clause does not require separating them.
  H5-FIG-DETACHES-OR-TELEPORTS: DID NOT FIRE. AND IT WAS NEARLY FILED WRONGLY. On the whole-clip sheet the descending
