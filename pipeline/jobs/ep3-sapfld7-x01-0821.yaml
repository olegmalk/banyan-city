  that has been open since round 2 and stop a later round paying for it again. No cut, no beat, no promotion,
  $0 on the card, filed at priority 120 so the beat campaign runs first, and DECISIONS.md item 18 is open
  and is not touched by building the set the question is about.'
success: 'One 832x1216 png at seed 20260981, cel dialect, of ''in a grassy courtyard, a long stone colonnade
  receding'' under ''low sun behind thin cloud, warm diffuse glow'' at ''wide shot'': STRAIGHT horizon,
  a clean drawable ground plane in the lower centre with NO built structure standing in it, no plant,
  NO FIGURE, and a GREEN-DOMINANT region in the lower half. Three of these four cells name stone, and
  stone is grey: w01 came back grey and the palette sampler found ZERO green-dominant pixels in its whole
  lower half and refused the plate. A beautiful courtyard with a paved floor has failed.'
why: 'THE STRONGEST FORM OF THE QUESTION. A colonnade is pure recession and nothing else -- repeated verticals
  marching away from camera, no landform anywhere in the words. `grassy courtyard` comes FIRST so the
  near ground is named before the architecture, which is the word order round 5 used on the water cells
  (and which did not save them; that is recorded, not hidden). If any cell draws a plane on recession
  alone it is this one.


  THE RECIPE IS NOT UNDER TEST AND NEITHER IS THE LIGHT. Rounds 1-4 settled the recipe, round 5 spent
  it and round 6 found the one lighting clause that keeps a green ground: the quality prefix, `no humans`,
  `wide shot` with NO `low angle`, the negative, the checkpoint, the size, the steps, the cfg, the staging
  and the nocontrol arm at 0.45 are inherited byte for byte from the round-4 control, and the lighting
  is frozen at ''low sun behind thin cloud, warm diffuse glow'', which is w02''s. THE ONE VARIABLE IS
  THE SCENE CLAUSE, and every value names a RECEDING FEATURE THAT IS NOT A LANDFORM.'
