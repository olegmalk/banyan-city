bar: "FOUR PLATES, JUDGED AS ONE CONTACT SHEET, BY EYE AT 1:1. THERE IS NO\nPLANT AND NO FIGURE IN ANY\
  \ OF THESE PICTURES AND BOTH ABSENCES ARE CORRECT.\n  D1 CEL, NOT PHOTO, NOT PAINTING. Flat fills, clean\
  \ ink linework, the\n     episode's dialect. This is the clause the ep2-b16-field batch lost all\n \
  \    four on, and it is the first one read. Bokeh, painterly rendering or a\n     photographic ground\
  \ plane REJECTS the plate -- you cannot draw a sharp\n     cel seedling into a soft foreground without\
  \ it reading as a decal.\n  D2 A CLEAN DRAWABLE GROUND PLANE in the lower centre, wide and tall enough\n\
  \     to root a sapling at plate scale. Blades of grass crossing it are fine.\n     A rock, a flower,\
  \ a shrub, a drawn plant or any structure is NOT: the\n     0.30 pass PRESERVES a structure it finds\
  \ in the init (12 of 40 steps from\n     a latent that still carries it), so the composite would have\
  \ to fight it.\n  D3 ZERO FIGURES. Not a goblin, not a human, not an animal, not a silhouette\n    \
  \ on the horizon. A plate with any figure in it is REJECTED AND DELETED,\n     not cropped -- this lane\
  \ may not render the scavenger and a frame that\n     contains him is not curated into a training set.\n\
  \  D4 THE LIGHT HAS A DIRECTION. beat16_sapling_composite.py measures the\n     plate's own low-pass\
  \ luminance gradient and carries it into the drawn\n     plant. A flat, directionless plate makes that\
  \ measurement a no-op and\n     the composite reads as pasted.\n  D5 THE PALETTE IS THIS SHOW'S. The\
  \ composite samples its greens FROM THE\n     PLATE, so an off-palette plate produces an off-palette\
  \ sapling and the\n     frame teaches the LoRA the wrong colour.\nNOT SCORED: whether the picture is\
  \ a good shot. None of these is a shot, none\nenters a cut, and none goes near review/ep2-ship-0821.\
  \ They are ground planes\nfor an instrument.\nNOT SCORED: variety WITHIN a cell. The variety this batch\
  \ is bought for is\nBETWEEN cells and it is measured at the manifest, not here."
the_one_variable: THE SCENE CLAUSE ('in a grassy courtyard, a long stone colonnade receding'). The lighting
  is frozen at 'low sun behind thin cloud, warm diffuse glow' and the framing at 'wide shot'; everything
  else is the round-4 control's.
this_cell: THE STRONGEST FORM OF THE QUESTION. A colonnade is pure recession and nothing else -- repeated
  verticals marching away from camera, no landform anywhere in the words. `grassy courtyard` comes FIRST
  so the near ground is named before the architecture, which is the word order round 5 used on the water
  cells (and which did not save them; that is recorded, not hidden). If any cell draws a plane on recession
  alone it is this one.
the_rule_this_batch_tests: 'ROUND 2 SAID A LANDFORM **OR A RECEDING FEATURE** BUYS A DRAWABLE GROUND PLANE,
  AND ONLY THE FIRST HALF HAS EVER BEEN TESTED. Every cell of rounds 1-6 named a hill, a mountain, a ridge,
  a treeline or a distant field. These four name recession with NO landform in it -- a colonnade, a wall
  in perspective, a lane between houses -- and one control that names the landform. Falsifiable in one
  batch: if all three built cells come back as macro texture the way round 1''s ground-cover clauses did,
  then recession is not the mechanism, landforms are, and this dataset is outdoors permanently.'
why_four_cells: A PROBE, not a breadth batch, and the second one in a row. Round 1 filed ten cells off
  a ratified recipe and review/ep3-sapling-dataset-0821/plates-0821.yaml records in this lane's own words
  that a four-cell probe would have found its failure for 40% of the card time. Round 6 was four cells
  and answered more than round 5's fourteen. x04 is the CONTROL so a batch-wide failure can be told apart
  from the rule being wrong.
failure_predicted_in_advance: 'FIRST, AND IT IS THE ONE THIS TREE HAS THE WORST RECORD ON: A FIGURE. The
  negatives here have failed to hold position five times, and the only reason rounds 5 and 6 went 22 for
  22 clean is that they asked for EMPTY LANDSCAPES, where there is nobody for the checkpoint to put in.
  A courtyard and a village lane are places people live, and this is the hardest that ban has ever been
  pushed. A plate with a figure in it is DELETED under D3, not cropped -- so a batch that comes back populated
  costs its whole card time and returns the finding that built scenes are unreachable for this lane at
  this negative, which is worth knowing and is not worth a sixth attempt at rewording the ban.

  SECOND: THE STONE IS GREY AND GREY STARVES THE PALETTE. w01 was refused at step 2 with ZERO green-dominant
  pixels in its whole lower half. A courtyard floored in flagstones or a lane floored in cobbles is the
  same refusal arriving through a MATERIAL word instead of a lighting one. Every cell names grass, lawn
  or verges first for exactly this reason, and round 5 proved that putting the green word first did not
  save the water cells.

  THIRD: THE BUILDING STANDS IN THE ROOTABLE STRIP. Round 3 pre-registered this shape for treelines and
  it did not happen; round 5 pre-registered it for water and it happened 3 of 3. A wall or a house wall
  crossing the lower centre is a STRUCTURE, and D2 rejects a plate whose plane has one in it because the
  0.30 pass preserves what it finds in the init.

  FOURTH, AND IT INVALIDATES THE BATCH RATHER THAN ANSWERING IT: x04, the control, fails. w02''s words
  at a new seed producing tan grass or no plane would mean round 6''s warm-light finding rests on one
  picture. Read x04 first.'
clip77_measured_not_estimated: prompt 40 of 77, counted offline on animagine's own vocab before this file
  was written; negative inherited from the round-4 control at 71 of 77.
priority_is_deliberate: '120, and box_runner sorts ready/ by (priority, name) ASCENDING, so a LOWER number
  runs first and an unset priority defaults to 100. This is therefore behind even an unmarked job. Two
  iteration-campaign lanes (beats 01-10 and 11-21) are filing ship work to this same card tonight -- at
  15 -- and a variety probe does not preempt ship work. This lane also does NOT refill after these four:
  the campaign owns the card.'
