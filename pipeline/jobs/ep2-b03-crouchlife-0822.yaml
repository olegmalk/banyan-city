  that bad, if the goblin didn''t look like an old man'' is the shipped take, and the 08-20 design audit
  says the same thing in its own words -- human nose with nostrils, a rounded human ear, folds either
  side of the mouth, flat olive skin. Round 2 of the canon-motion recipe drew his own tile''s face instead
  and its verdict is unambiguous: R4 PASS, the horn from round 1 gone, features drawn in all 105 frames,
  collar and ears held, and R2 PASS on the trunk that beat 03 never used to have. Its one failure is R3:
  ''the pose barely changes from f000 to f104, there is no crouch and no sideways eye flick, and the only
  event in the clip is that his eyes CLOSE from about f096''. That job pre-registered A STILL WITH A RUNTIME
  by name and then hit it, and wrote down why -- it had asked a motion model to HOLD STILL.


  So the design does not need another round. The action does. Same plate, same recipe, same identity clause
  byte-for-byte, and ''crouches low and holds still, eyes flicking sideways'' replaced by three head-and-shoulder
  moves with a start, a bottom and a return. Eye flicks are dropped entirely: this engine was measured
  refusing gaze-only motion from both directions on beat 04 (rung 1 moved the whole head 64.7 px when
  told not to, rung 2 locked the head to 4.7 px and the eyes stopped with it), and asking for them again
  would be re-running a closed experiment.'
