round_2_lever: "NAMED BEFORE THE RENDER, in the order they will be reached for:\n  1. G1 PASSES BUT HE\
  \ READS AS A DOLL AT THE CAMERA -> the lever is not the span, it is the GROUND LINE: raise `ground`\
  \ further so his feet sit higher against a horizon, holding the span.\n  2. A SECOND GOBLIN GROWS IN\
  \ THE FOREGROUND HOLE -> put the foreground subject in the POSITIVE at that location. Not a negative;\
  \ w5 spent four cells proving the negative does not reach this beat's composition.\n  3. THE FACE IS\
  \ TOO SMALL TO READ -> that is the beat working as briefed (he is the blurred figure behind the leaf)\
  \ and it is a FOUNDER call, R4, not a re-render.\nOne at a time, and each is one spec."
rung: "BEAT 16'S FRAMING, ROUND SEVEN, AND THE LEVER IS GEOMETRY BECAUSE EVERY OTHER\nONE IS SPENT. Three\
  \ levers were measured DEAD against this beat's framing and\nall three are recorded:\n\n  w5{z,a,b,c}\
  \  the NEGATIVE plus the sapling-field lane's distance clause --\n               four cells, ALL NULL\
  \ on the foreground (green p88 240/252/247\n               against w4's 241, no hills). The strip that\
  \ paid for them also\n               BROKE THE EYE on all four cells: the four \"inert\" containment\n\
  \               terms are not inert, and \"adding X did nothing\" does not license\n               \"\
  removing X is free.\"\n  w6a          ControlNet 1.0 -> 0.55. The figure still fills the frame and\n\
  \               still reaches the bottom edge; he is if anything larger. The pose\n               held\
  \ below the record's 0.7 floor, which is worth knowing on its\n               own, and THE COSTUME DRIFTED\
  \ (mandarin frog closures became a\n               plain button placket, dark leggings appeared).\n\n\
  WHY NONE OF THEM COULD HAVE WORKED, stated as the finding they produced: HOW\nSTRONGLY THE SKELETON\
  \ IS APPLIED IS NOT THE SAME QUESTION AS HOW MUCH OF THE\nCANVAS IT COVERS. A full-span skeleton at\
  \ ControlNet 1.0 owns the composition\nand no word outranks it.\n\nTHE LAW THIS ROUND IS BUILT ON is\
  \ the 08-21 seated-gate finding, verbatim: \"the\nskeleton's span sets the drawn SIZE, so author the\
  \ span you want and let the\nfold come from the WORDING.\" So the span is authored. jerry_canon_0821\
  \ gains a\nPLACEMENT axis and this cell is a `sit` skeleton drawn at 60% of the full-span\nsit's 866\
  \ px keypoint span, placed at cx 0.655, with the ground line solved so\nthe CROWN LANDS AT y=300 --\
  \ the same y on all three cells, so the SPAN is the\nonly thing that moves and the ghost-head fix (MAX_EMPTY_TOP\
  \ 0.28) is not\nquietly spent to buy the framing."
