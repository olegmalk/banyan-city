judge: "JUDGED AT 1:1, FOUR CLAUSES, IN THIS ORDER, and the first one is the rung:\n\n  G1 THE PLANE.\
  \ Is there GROUND IN FRONT OF HIM -- an unoccupied foreground\n     band, bottom of frame up to his\
  \ feet, that a plant can stand in without\n     touching him? This is what w5 and w6a both failed. Measure\
  \ it, do not\n     impress yourself: the skeleton reserves 396 px (33% of frame height)\n     below\
  \ his lowest ink.\n  G2 FIGURE SIZE. Does he read as a figure SET BACK, right of centre -- not a\n \
  \    small person standing at the camera? A short skeleton is read as a SMALL\n     PERSON, not a distant\
  \ one, and the record already predicts short-span\n     skeletons come back as \"SMALL FIGURES with\
  \ oversized heads\". That was a\n     defect for every other beat and it is what this beat wants; the\
  \ failure to\n     watch for is a DOLL, not a distance.\n  G3 COSTUME. The mandarin collar, the green\
  \ shirt, the dark shorts, the boots.\n     w6a lost them to a conditioning drop and this cell holds\
  \ ControlNet at 1.0\n     precisely so that cannot be the explanation for anything seen here.\n  G4\
  \ THE EYE. `eyebags, jitome`, no pupil word. The w5 strip broke the eye on\n     four cells; this round\
  \ strips NOTHING from either side of the prompt --\n     positive and negative are byte-identical to\
  \ w4's -- so a broken eye here\n     is not attributable to the wording.\n\nA cell that fails G1 kills\
  \ the whole geometry hypothesis and the beat goes back\nto the founder as a straight trade. A cell that\
  \ passes G1 and fails G2 is a span\nthat went too far and the neighbouring cell is the answer."
