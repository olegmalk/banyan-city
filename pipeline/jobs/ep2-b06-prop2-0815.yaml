#    that the reference owns the prop the way it owns the location is DEAD, and
#    it died on frames, not on an argument. That is the finding round 1 bought,
#    and it is what makes this round worth firing rather than escalating.
#
# 3. WHAT ROUND 1 DID NOT BUY, AND MY OWN BAR WAS PART OF THE PROBLEM. Round 1's
#    pre-registered PASS asked that the object read as "BARK OR WOOD ... and NO
#    metal hardware and NO white lined paper" and SAID NOTHING ABOUT BOARD-NESS.
#    8 of 12 satisfied it. ZERO of 12 produced a board anyone could read from.
#    That bar was too loose and it was mine; it certified the material axis and
#    quietly let the axis the beat actually needs go unmeasured. Recorded rather
#    than reinterpreted, because a bar that only ratchets down is worthless.
#
#    WHAT THE 12 FRAMES ACTUALLY HOLD:
#      bark scraps/lumps cupped in the palms  r0 s0, r0 s2, r0 s3, r1 s3, r2 s3
#      a curved bark strip                    r0 s1
#      a round log cross-section, growth rings r1 s1
#      a cylindrical branch                   r1 s2
#      NOTHING AT ALL / empty hands           r1 s0, r2 s0, r2 s1, r2 s2
#    Material solved; geometry not. `slab` plus `in both hands` bought a thing
#    you CUP, not a thing you READ.
#
# 4. THE SECOND DEFECT ROUND 1 EXPOSED, and the reason one word is deleted here:
#    r2 went to a LITERAL TREE in 4 of 4 -- a trunk filling the frame, the guard
#    touching bark still attached to it. `a flat slab of TREE bark` put `tree`
#    beside a background that already says `treeline`, and the composition
#    followed. `tree` therefore comes OUT of the prop phrase. `bark` alone still
#    means bark in a field; `treeline` stays because the background wants it.
#
# 5. THE RECIPE CHANGE, ONE HYPOTHESIS: RESTORE BOARD-NESS, CHANGE NOTHING ELSE.
#    A neutral board noun that carries no office-clip prior (`board`, never
#    `clipboard`) plus the three geometry words the frames say are missing --
#    `large`, `flat`, `rectangular`. THE FIVE HARDWARE FENCES STAY, because they
#    are precisely what worked: clipboard, metal clip, spring clip, white paper,
#    lined paper, all lifted by `_NEGATION` at ZERO positive-token cost.
#
#    THIS IS THE ONE BOUNDED ROUND ROUND 1 ALREADY AUTHORISED. Its FAIL-ABSENT
#    clause, written before that render existed, said the absent-object outcome
#    "buys EXACTLY ONE more round -- a neutral noun (`board`, `tablet`) restored
#    to the positive with the hardware fences kept". Four of twelve came back
#    empty-handed, so that clause fired and this is it being spent, not a new
#    permission invented after seeing the frames.
#
# 6. TOKEN BUDGET, MEASURED ON THE BOX WITH THE REAL CLIP TOKENIZER before this
#    file was written:
#      positive 65/77   (nothing dropped)
#      negative recipe 77 -> sent 77   (NOTHING dropped; only `text` deduplicated)
#      count tag '1boy' (draft declares '1boy')   STYLE ANCHOR PRESENT: True
#    `realistic skin texture` and `jpeg artifacts` -- the anti-photoreal guards
#    that eight fences evicted in round 1 -- are both present in the sent string.
#
# 7. THE PREDICTION, WRITTEN BEFORE THE RENDER EXISTS, AND IT CAN LOSE.
#    Judged BY OPENING FRAMES, never by a metric. 12 scored frames (r3 discarded).
#
#    PASS -- in a MAJORITY of the 12, the held object reads as A BOARD: flat,
#    broadly rectangular, and BIG ENOUGH TO READ FROM (spanning the width of both
#    hands or more -- forearm scale, not palm scale), of bark or wood, with no
#    metal clip and no white paper. Then the prop is solved, the same construction
#    goes to beat 10, and both beats get bark-correct plates.
#
#    FAIL-GEOMETRY -- the majority still come back scraps, lumps, discs, branches
#    or empty hands. SAID PLAINLY NOW: THE WORDING LEVER IS THEN DONE. Round 1
#    proved wording moves the prop's MATERIAL; this round tests whether it moves
#    the prop's GEOMETRY, and two failures on geometry is enough. The next lever
#    is a REFERENCE TILE CONTAINING A BARK BOARD, or an inpaint pass on the prop
#    region -- NOT a third draft, and not seed-rolling. That gets reported as
#    loudly as a pass.
#
#    FAIL-TREE -- if the literal-tree composition persists in the majority even
#    with `tree` deleted from the prop phrase, then the tree came from the
#    REFERENCE SLOT and not from the word, which is a different finding with a
#    different fix (re-cut r2's slot) and it does not by itself retire the
#    wording lever for geometry.
#
# 8. THE REFERENCE SET, VERIFIED BY HASH ON THE BOX, unchanged from round 1 so
#    that round 1 and round 2 differ ONLY in the draft:
#      s0 26062b66dfcf9b22   s1 725a2c1163971f85
#      s2 293afe818773176a   s3 26062b66dfcf9b22  (DECLARED duplicate of s0)
#    The tile a98aa7c261afab4b that degraded the cast to balloon heads appears in
