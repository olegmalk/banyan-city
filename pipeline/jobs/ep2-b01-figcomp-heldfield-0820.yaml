verdict_instrument_rung_0820: 'THE RUNG THIS SPEC LICENSED WAS TAKEN AND IT FAILED. G1 IS STILL VOID,
  the swap precondition is not met, and beat 01 is unchanged. Recorded at the same weight as a
  success, because the mechanism named in what_this_licenses_after_the_verdict was wrong and the next
  lane must not spend a second fire on it.


  WHAT WAS PREDICTED: that fig_track''s background annulus was landing inside the compositor''s feather
  at the fig''s smallest radius, that the mixed field there inflated the ring MAD, and that handing the
  detector the blend zone would lift f001 over the 2.00 separability gate and make G1 readable in a
  direction no encoder could flip.


  WHAT HAPPENED: separability at f001 went 1.764 -> 1.747 on the PNG frames and 1.883 -> 1.651 at
  crf 0. Sideways, and slightly DOWN. The clause still flips at exactly the same point in the encode
  sweep -- dead at PNG / crf 0 / crf 10 / crf 14, live at crf 18 / crf 23 -- so nothing about G1''s
  unscorability changed. And across the full 121 frames the exclusion COSTS ten live frames,
  120/121 -> 110/121, with max single-frame step rising 1.068 -> 1.201.


  WHY IT COSTS FRAMES: at small radii the blend zone eats the annulus. The excluded ring at f001 is
  711 to 1001 px hugging the excluded boundary, against 6907 px once the fig is large enough for the
  outward fallback to fire. The 40 px ring floor accepts that sliver as a background model when it
  should not. That is a SECOND defect, found by this rung, and it is deliberately NOT fixed here: the
  floor is a constant every published verdict in this tree was scored under, and raising it now --
  having just seen which way it moves this clip -- would be choosing an instrument to get an answer.
  It needs a number set from first principles and pre-registered.


  THE MECHANISM IS REAL, IT IS JUST NOT THE ONE THAT DECIDES f001. Where clean background is
  plentiful the exclusion is a clear improvement: crf 18 separability 2.178 -> 3.084, crf 23 2.248 ->
  3.236. The selftest pins it -- under annulus contamination of sigma 0 / 15 / 40 the plain reading
  runs 71.12 -> 18.57 -> dead while the excluded reading is 70.754 at every level, i.e. invariant to
  the contamination, which is the whole claim of the fix.


  AND ONE PIECE OF GOOD NEWS, MEASURED RATHER THAN ASSUMED: the encoder dependence is NOT systemic. The
  full-clip sweep is 120/121 at PNG, crf 0, crf 10 and crf 14 and 121/121 at crf 18 and crf 23, with the
  dead list exactly [1] or [] in every case and max step and the f90% frame stable at 1.068-1.229 and
  f107/f108. ONE FRAME moves. Every other G1 verdict this tree has published is untouched by this, and
  the two ingredient clips re-score digit for digit under the new build.'
