# --- appended 2026-08-20 by the beat-01 composite lane, after the pixels.
verdict_this_job: 'NO SWAP, and the reason is not the one this rung expected.

  F1 -- the pasted fig, the risk this whole route was warned about -- DID NOT FIRE. F2 fired, and
  the cure named for it turns out to be worse than the disease. And the rung found a third thing
  nobody had filed: THE G1 CLAUSE, ON THIS BUILD, IS DECIDED BY THE VIDEO ENCODER AND NOT BY THE
  PICTURE, so it is VOID rather than passed or failed.


  THE COMPOSITE WORKS AS A PICTURE. Opened at 5x on f000/f030/f060/f090/f120 with held, grow and
  composite side by side, the fig sits on the HELD plate''s own stem at every keyframe. Dilating
  the detector''s mask by 0.45 of the fig''s equivalent radius carries the crown stub and the contact
  shadow across with the fruit, which is exactly what F1 said would be missing. There is no seam, no
  halo and no exposure step -- the ring gain match never had to work harder than 1.114x. At 1x it
  reads as one shot: a locked field with the foreground grass sweeping, and a fig that goes green ->
  teal -> slate -> deep purple over five seconds. It is the best beat-01 cold open this tree has
  produced, and it is still not proposed for the cut.


  AND IT BEATS ITS OWN INGREDIENT ON THE FIELD, BY A LOT. Region NCC f000->f120: shaft 0.982 and
  sapling 0.736, against the in-cut take''s -0.324 and 0.055. Whole-frame luma peaks +0.93 against
  +10.85. Worst consecutive whole-frame NCC 0.9966 against 0.9403. Those are the held clip''s numbers,
  which is the point: outside the matte the composite IS the held clip.


  G5a STILL FAILS, ON ONE BAND, AND F2 IS WHY -- grass floor 0.062 against 0.20, inherited whole from
  the held plate. But the clause is mis-reading that band, and this lane measured it rather than
  asserting it. On the held plate the grass band''s CONSECUTIVE-frame NCC is 0.9950 mean / 0.9887 min
  and its correlation to f000 decays MONOTONICALLY -- 0.842, 0.554, 0.299, 0.098, 0.062 at
  f010/030/060/090/120. That is a foreground that SWEEPS. The crf-33 control''s same band reads 0.9640
  / 0.8720 consecutive and decays non-monotonically -- 0.423, 0.019, 0.177, 0.166, 0.038. That is a
  foreground being RE-INKED. G5a''s grass clause is a two-point f000-to-last statistic and cannot tell
  those apart. It is failing this clip for grass that moves the way grass moves.


  THE CURE F2 NAMED WAS SAMPLED AND IT IS WORSE. --freeze-band 1000:1280 takes the grass from the held
  f000 and scores grass 1.000 -- BY CONSTRUCTION, which the tool labels in its own output. On screen it
  TEARS: every blade crossing y=1000 is severed and offset, visible at f060 and blatant at f120,
  because the blades cross the band boundary. The grass cannot be taken as a band. It can only be taken
  as a whole plate, and that is a different shot.


  THE FINDING THAT VOIDS G1. The composite loses exactly one frame, f001, to the separability gate at
  1.76 against a bar of 2.00, with template NCC 0.988, margin 0.680 and a 0.73 px jump -- the detector
  plainly found the right object and declined to stand behind it. Both ingredients clear that gate at
  the same frame on their own pixels (grow 2.27, held 2.90); only the composite sits on it. And then the
  same composite PNG frames were encoded five ways:


  PNG, no encode 1.76 DEAD | libx264 crf 0, mathematically lossless 1.88 DEAD | crf 10 1.88 DEAD |
  crf 14 1.84 DEAD | crf 18 2.18 OK | crf 23 2.25 OK.


  The answer straddles the gate on an encoder setting, and BACKWARDS -- the more compressed encode
  passes, because compression smooths the detector''s background annulus, lowers its MAD and raises
  separability. A clause whose verdict I can choose by picking a CRF is not a measurement. G1 is VOID
  at f001 on this build and this lane scores it NEITHER WAY. What survives is the part that does not
  move with the encoder: 120 of 121 frames live outside f001, maximum single-frame area step 1.068
  against a 2.0x bar, and 90% of the growth arriving at f107 against a bar of f060.


  WHICH ALSO VOIDS THE TWO BUILDS THAT LOOKED LIKE WINNERS. --freeze-band and --held-still both score
  8 of 8 and both are unquotable. Their G5a bands are 1.000 by construction, not measured. And their
  G1 "121/121 live, PASS" is the same encoder artefact seen from the other side: they contain the
  IDENTICAL fig, from the identical grow frames, and their f001 flipped live because freezing pixels
  200 px BELOW the fig changed libx264''s bit allocation. Two clips scoring 8 of 8 is not this rung''s
  result and is not reported as one.'
