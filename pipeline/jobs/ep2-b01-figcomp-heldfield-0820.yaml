recipe:
  matte: pipeline/fig_track.py track(mask_sink=...) -- the detector's OWN per-frame boolean mask, the
    same array its area_px is counted from. Never re-derived, so the thing cut out and the thing scored
    cannot disagree.
  dilation: 'exact Euclidean disk, radius max(8, 0.45 x the fig''s equivalent radius) -> 8 px at f000,
    30 px at f120. NOT cosmetic: fig_track''s binary_open deliberately deletes the thin dark stem, which
    is right for measuring a fig and wrong for cutting one out, and the stem and contact shadow move WITH
    the fruit. This is the mitigation for the pre-named risk F1.'
  feather: Gaussian, radius 0.5 x the dilation.
  gain_match: 'per-frame scalar, median ring luma of HELD over median ring luma of GROW, clamped to
    [0.5, 2.0]. Measured range on this build 0.974..1.114. Multiplicative on RGB, so chromaticity and
    therefore HSV hue and saturation are EXACTLY unchanged: it cannot manufacture or destroy G2.'
  everything_outside_the_feathered_matte: the held clip's own pixel, untouched.
  dead_zones: fig_track publishes no matte on a killed frame and this file invents none. GROW is 121/121
    live, so zero frames were held and `held_on_dead_frames` is empty.
  matte_area_px: 2007 at f000 -> 29069 at f120, max 29262.
bar:
  carried_from: pipeline/jobs/ep2-b01-figcrf10-s20260840-0820.yaml, clause for clause and threshold for
    threshold, which carried them unchanged from ep2-b01-fignonly-s20260840-0820. Not one number is
    relaxed for this rung, and none was rewritten after the pixels were seen.
  how_it_is_judged: pipeline/fig_track.py (selftest 15/15, six frame-backed) against anchor mask
    b01-nubcomp-s20260826-mask.png, plus the region-NCC and whole-frame-luma probes. Judged on the
    DECODED OUTPUT MP4, not on the pre-encode PNGs, because the mp4 is what would ship.
  G1_growth_by_a_continuous_path: SCORED. Detector live on every frame it scores; no single-frame area
    step at or above 2.0x; the frame reaching 90% of total growth at or after f060.
  G2_end_state_deep_purple_violet: SCORED, and requires a LIVE final frame -- fig hue 270-320 deg,
    saturation >= 0.60.
  G3_exactly_two_leaves_in_every_frame: CARRIED BUT NOT SCORED -- no leaf counter exists. Eye note only.
  G4_no_size_doubling: SCORED -- maximum single-frame area ratio under 2.0x.
  G4b_below_the_grass: CARRIED BUT NOT SCORED -- no grass line is defined. Eye note only.
  G5a_field_stability: SCORED. Region NCC f000 to last frame on four bands -- shaft y0-350; sapling
    y430-740 x150-560; fig box y700-900 x230-450; grass floor y1000-1280. PASS requires sapling >= 0.45
    AND shaft >= 0.70 AND grass >= 0.20, with fig box < 0.30.
  G5b_camera_locked: CARRIED BUT NOT SCORED -- global_zoom refuses. Reported, never scored.
  H_luma_bloom: SCORED. Peak whole-frame luma within 12.0 levels of f000, at most 6 of 121 frames above
    luma 100.
  H1_frozen: SCORED. FAIL if fig-box NCC to the final frame is at or above 0.80 by f060.
  H5_detach_or_teleport: SCORED. 40 px bound on the fig centroid against the f000 geometric anchor
    (785.1, 339.4), plus the detector's jump gate.
  H6_scene_break: SCORED. FAIL if any consecutive whole-frame NCC drops below 0.80.
  conjunctive: A partial is a FAIL. Three clauses are unscored by declaration (G3, G4b, G5b) and can
    produce neither a PASS nor a FAIL.
control: ep2-b01-figcrf10-s20260840-0820 and ep2-b01-fignonly-s20260840-0820, which are this rung's two
