verdict_cut: 'SUPERSEDED BY `verdict_cut_swapped_0820` ON 2026-08-20 — rung 1 of 3, kept verbatim.
  The cut DID change: beat 01 is 01-cold-open-COMP-chroma-s20260840.mp4.


  NOT PROPOSED FOR THE CUT, and no swap follows. review/ep2-demo-0820 beat 01 is unchanged
  and keeps 01-cold-open-LTX-fignonly-s20260840.mp4.


  The arithmetic: the in-cut take carries ONE failing clause out of eight scored. This composite carries
  ONE failing clause out of SEVEN scorable, plus a VOID. It does not beat the in-cut take''s clause
  count -- it ties on failures and loses a clause to unscorability.


  The substance, which matters more: the clause it cannot score is G1, the growth arc, which is the one
  thing this entire localisation route exists to preserve. Swapping a clip into the cut on the strength
  of a clause this lane has just proved is decided by an encoder setting would be exactly the failure the
  2026-08-20 entries above it were written to prevent. When the instrument rung below makes G1 readable,
  this composite gets scored again and the swap gets re-proposed on numbers.


  Recorded explicitly because it would be easy to swap it anyway. By eye it is the best beat-01 cold open
  in this tree''s history, and it beats the clip it would replace on shaft, sapling, luma and steadiness
  while carrying that clip''s exact fig. The bar is conjunctive, the grass clause fails, and the growth
  clause cannot be read. Best-looking is not a clause.'
what_this_licenses_after_the_verdict: 'THE LOCALISATION ROUTE IS OPEN AND THE COMPOSITOR IS NOT THE
  OBSTACLE. F1 is closed by pixels, not by argument: a matte dilated by 0.45 of the fig''s own radius
  carries the stem and the contact shadow and the result does not read as pasted at 5x on any keyframe.
  pipeline/fig_composite.py is committed with its guards and its dead-zone policy, and it is
  deterministic -- both ingredients are in the repo at their asserted shas, so any of the three builds
  reproduces byte for byte.


  THE NEXT RUNG IS AN INSTRUMENT RUNG, NOT A PICTURE RUNG, AND IT IS $0. fig_track''s background annulus
  runs from 1.35 to 2.10 equivalent radii, and at the fig''s SMALLEST radius that annulus lands inside
  the compositor''s feather, where the two clips'' fields are blended and the ring MAD is inflated. The
  compositor knows exactly where the blend zone is and can hand it to the detector. Score composites with
  the blend zone excluded from the ring -- or with the ring pushed outside the feather''s support -- and
  f001 becomes readable in a direction that an encoder cannot flip. DO NOT instead choose an encode that
  makes it pass; that door is named here so the next lane does not walk through it.


  G5a''S GRASS CLAUSE NEEDS A RULING BEFORE IT IS SPENT AGAIN. As instrumented it is a two-point
  f000-to-last NCC and it cannot separate coherent foreground sway from re-inking; this lane has the
  discriminator in hand (consecutive-frame NCC plus monotonicity of the decay) and did NOT apply it to
  re-score this clip, because rewriting a pre-registered bar after seeing the pixels is how a score
  becomes worthless. It is filed as a bar change for a ruling, not as a result.


  NOT LICENSED: freezing the grass as a band. Sampled once, and it tears every blade that crosses
  y=1000. Anyone proposing --freeze-band on this beat should open
  evidence/COMP-grassband-tears-at-y1000.jpg first.


  NOT LICENSED EITHER: another crf sweep, another seed, another negative. All three doors are measured
  shut in the specs above this one.


  A TASTE QUESTION IS PARKED, NOT PROPOSED. --held-still puts the same fig on a frozen plate. It has no
  seam, it satisfies every field clause by construction, and it has no ambient motion at all -- no grass
  sway, no drifting light shafts, no dust. That is a trade between a locked-off plate and a living
  field, it is R4, and it is deliberately not being asked yet: it should be asked once, with pixels,
  alongside a heldfield build whose G1 can actually be scored. The clip is built and sha''d so that ask
  costs nothing when it comes.'

