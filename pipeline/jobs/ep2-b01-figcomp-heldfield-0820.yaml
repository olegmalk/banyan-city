verdict_cut_swapped_0820: 'THE SWAP HAPPENED, under the coordinator''s standing decision rule: G1
  scorable and passing WITH G2 intact -> veto-able steward swap. review/ep2-demo-0820 revision d,
  beat 01 = 01-cold-open-COMP-chroma-s20260840.mp4, sha 12e256fd...1e28, cut sha
  6f12302d0bebe9f0e2e370cba9c61253c27b1cf7c66839b5f5343099c0868d1f. That cut was re-assembled once,
  20 minutes after it went up: the first assembly, sha 173179f4...c16a0, played this clip at 0.53x
  because render_t3 read this sidecar''s honest `model: none` as "no video" rather than "no sampler".
  Fixed in the tool by ba412265, not in the sidecar; found and reported by the ship lane, and by no
  gate this rung ran -- none of them looks at playback rate.


  IT IS A STEWARD PICK AND NOT A TASTE VERDICT. Mechanical selection between two takes that score the
  same 7 of 8, on the ground that this one fails its single clause on ONE band where the other failed
  it on THREE, holds the field the other redraws, and answers G1 in a way no codec can flip. R4
  VETO-ABLE IN ONE LINE: "beat 01: put fignonly back." The outgoing clip is committed at
  farm-out/ep2-b01-fignonly-s20260840-0820/ with its sidecar and its own sha256 manifest -- that
  directory was UNTRACKED while picks-0820.yaml promised the clip was still in the repo, which is
  fixed in the same commit as the swap.


  AND THE TASTE NOTE THAT IS NOT THIS LANE''S TO SETTLE: the take leaving the slot is the MORE DRAMATIC
  picture -- its whole sapling grows and two big leaves sweep the top third of the frame by f120. This
  one is a locked-off plate where only the fig moves, which is what the cold-open line asks for and
  what G5a exists to enforce. The written standard picks it. "More correct" and "better shot" are
  different questions and the founder has screened neither clip; both are side by side at
  farm-out/ep2-b01-figcomp-heldfield-0820/evidence/COMP-SWAP-chroma-vs-incut.jpg.


  GATES RUN BEFORE ANYONE GETS A URL: qa_local.py PASS, 83 routes. qa_episode.py 15 checks pass, 1
  advisory warning, audio intact at -16.8 LUFS. proof_receipts 19 takes / 19 sha match / 0 differs. The
  served bytes at /review/ep2-demo-0820/ep2-demo-0820.mp4 hash to the sha the page itself prints.'
what_this_licenses_after_the_chromaticity_rung: 'THE COMPOSITE ROUTE FOR BEAT 01 IS DONE, not closed --
  it delivered, and there is no further rung to file on it. Three things are now settled and must not
  be re-opened without new evidence: ring geometry (closed by the instrument rung), encode-picking
  (never licensed), and the gain match (this rung; chroma is available and its cost is known).


  WHAT IS STILL OPEN AND IS NOT THIS BEAT''S TO FIX:

  1. G5a''s grass band is a TWO-POINT clause and it cannot tell a foreground that SWEEPS from one being
  RE-INKED. On the held plate the grass band''s consecutive-frame NCC is 0.9950 and its correlation to
  f000 decays monotonically (0.842, 0.554, 0.299, 0.098, 0.062); on the crf-33 clip the same band reads
  0.9640 consecutive and decays non-monotonically. Both return ~0.06 on the two-point test. That is a
  BAR defect filed for a ruling. It was NOT applied to re-score this clip, because relaxing a clause
  after seeing which way it moves a verdict is the move this lane keeps refusing.

  2. The 40 px ring floor in fig_track accepts a background model of 711 px hugging an excluded
  boundary. That constant is in every verdict this tree has published. It needs a number set from first
  principles and pre-registered, not nudged now.

  3. `farm-out/ep2-b01-figcomp-heldfield-0820/01-cold-open-COMP-stillplate-0820.mp4` -- the whole field
  frozen from the held clip''s f000 -- satisfies every field clause BY CONSTRUCTION and has no ambient
  motion at all. Locked-off plate versus living field is R4. Built and sha''d so the ask costs nothing
  when it comes; still parked, still not asked.'
