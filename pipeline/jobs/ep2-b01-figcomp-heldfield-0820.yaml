  the fig from the field in the compositor, because no render setting separates them.'
success: ONE 704x1280 121-frame mp4 at 24 fps in which the FIG is the crf-33 take's fig, frame for frame,
  and the FIELD is the crf-10 take's field, frame for frame, joined by fig_track.py's own geometry-anchored
