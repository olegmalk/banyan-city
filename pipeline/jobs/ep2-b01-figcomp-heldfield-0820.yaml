  now established as ONE knob at two seeds: --image-crf sets how far the whole picture may drift from
  its conditioning image and the fig is part of the picture. The flag route is closed by measurement and
  an intermediate crf is refused in advance. Localisation is the one thing left, both ingredients are
  already rendered and sha-verified, and the masks it needs already exist and are validated by eye at 5x
