  peak stays within 12.0 levels of f000 with at most 6 frames over 100. Every threshold is carried
  clause for clause from the parent named in `control`; not one is relaxed. AND the composite must not
  READ as a composite -- see `pre_registered_fail_modes.F1`, which is a taste clause the numbers cannot
  reach and is answered by opening the frames at 5x, not by a metric.
why: '$0, no GPU, no new plate, ~3 minutes of a Mac. Seven beat-01 clips are scored and the pool is
  exhausted as a render problem. --image-crf 33 grows the fig 14.77x and redraws the field; --image-crf
