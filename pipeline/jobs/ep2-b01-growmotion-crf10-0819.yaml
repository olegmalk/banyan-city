verdict_this_job: >-
  PASS on all five clauses, AND IT FIXES THE ONE DEFECT THE PARENT'S OWN VERDICT
  ADMITTED AGAINST ITSELF. The parent conceded under pick.not_hidden that the pick
  "has bloomed to pale amber"; that bloom is now measured, and this take does not
  have it. MARKED CUT-PREFERRED for the cold open. This is the clearest win of the
  three crf-10 re-runs and the only one with no countervailing cost.
verdict_this_job_measured:
  the_bloom_is_gone_and_here_is_the_number: 'THE HEADLINE. Whole-frame mean
    luminance across the clip: this take runs 83.3 -> 84.8 against a plate at 85.1,
    i.e. it ends within 0.3 levels of the picture it was conditioned on. The original
    runs 82.5 -> 148.4 -- it nearly doubles in brightness and washes the dawn out to
    pale cream. Distance from the init at the LAST frame: 15.22 against 65.67, a 4.3x
    improvement. The dark sky wedge, the saturated orange and the drawn grass blades
    are all still there at f120, which is precisely what the parent said its pick
    lost.'
  fidelity_first_frame: 'Better too: mean |RGB| of the first frame from the init 2.375
    against 3.543, a 33% reduction. So this take is closer to the plate at both ends
    of the clip, and the end is where it matters -- the bloom is a cumulative failure,
    not a first-frame one.'
  g1_growth_by_a_continuous_path: 'PASS, and better than the original on every part of
    the clause. The fig grows monotonically over 85 frames from first appearance at
    idx8, with ZERO frames in which it shrinks and a largest single-frame area step of
    1.48x -- nowhere near the 2.1x-2.9x pops the parent identified as this recipe''s
    dominant systematic failure. The original starts at idx34, ramps over 76 frames,
    and contains 2 shrink events. Colour path: first purple frame idx10 against the
    original''s idx34, ending at hue 282.6 deg. Looked at, the crop also shows this
    take drawing a GREEN CALYX at the join from idx45 on, which the original never
    draws -- the parent verdict listed that calyx as something only the rejected seed
    20260828 achieved.'
  g2_end_state_deep_purple_violet: 'PASS. The fig is deep purple-violet at f120 with a
    specular highlight, hue 282.6 deg.'
  g3_exactly_two_leaves_in_every_frame: 'PASS. Two golden leaves in every frame looked
    at, in both takes. The green calyx sepals at the fig''s neck are a calyx, not a
    third leaf.'
  g4_no_size_doubling_and_below_the_grass: 'PASS, and this is the one clause where the
    two takes differ materially, so it is scored with the number rather than an
    adjective. The fig at f120 occupies 292 px of a 176x320 measurement frame -- 0.518%
    of the picture -- with its bounding box at y 185-203 of 320, low in the frame and
    below the grass tops. It does not balloon: growth is monotone and final area equals
    peak area exactly. It is however 2.7x the original''s final area (0.518% against
    0.190%). At half a percent of frame that is a fig, not a balloon, and the clause as
    written is about ballooning -- but if the founder reads G4 as a cap on how large
    the fig may end up relative to the take already on the review page, that is a taste
    read and it is R4''s, so the number is put here rather than argued away.'
  g5_only_the_fig_moves_camera_locked: 'PASS, and equal. Best-fit registration scale
    against f000 measures 1.00 at both f060 and f120 for BOTH takes on one instrument
    (a scale search minimising mean |RGB| about the frame centre). No push-in, no
    dolly, in either. Note this instrument reads 1.00 where the parent spec quoted 1.05
    for the same original clip, so it is coarser than theirs; it is used only for the
    A/B, where it separates nothing.'
  fail_modes: 'H1 frozen -- no, and neither take is: 0 of 120 pairs under 0.5
    interframe in both. H2 stays green -- no, purple by idx10. H3 leaf count -- holds.
    H4 balloon or camera push -- neither. H5 detach or teleport -- no, the fig stays on
    the stem the whole way. H6 scene break -- none.'
  a_motion_number_that_needs_its_caveat: 'Interframe median 0.877 against the
    original''s 1.444. Read naively that is the b14 regression again, and here it is
    largely NOT: a whole-frame luminance ramp from 82.5 to 148.4 inflates every
    interframe difference in the original, so much of its apparent motion IS the bloom.
    The depicted subject moves MORE in this take, not less -- the fig grows 2.7x
