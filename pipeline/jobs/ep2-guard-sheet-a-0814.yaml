success: Four sheets per man. This is a PROPOSAL HE CAN REDLINE -- he said he wants to make his own changes
  -- so the read is whether these are two men he can tell apart and wants, not whether they are finished.
  If he redlines, the change goes into the wording and it re-runs; if he approves, the sheet becomes the
  conditioning set for all six guard beats the way the goblin frame did.
why: 'THE GUARDS HAVE NEVER HAD AN APPROVED REFERENCE, which is why he has not seen consistency between
  guard clips -- every beat has been inventing its own man. Same gate the goblin was. Guard A of 2: they
  differ on BUILD AND FACE, not register, so he can tell them apart. Recipe shape from the goblin pick:
  plain wording, no proportion clause, no denial pile, and the winning negative''s ANTI-PRETTY block.
  What does not transfer is `no hair, no wig` -- that made the goblin bald and the guards need hair. `silly
  harmless bureaucrats`, `round`, `soft` and `bald` are absent; all three of those are his own vetoes.'
prediction: 'Written before any frame exists, and unlike r2''s this one is aimed at the failure that actually
  happened. r2 drew NO PLANT in 4 of 4 and NO WORLD in 4 of 4; r3 makes the sapling its own subject clause
  growing from the earth and gives the world its own sentence. What should come back: a rooted plant with
  a visible stem beside a kneeling goblin in a lit meadow. The remaining risks, in order — (1) the fig,
  absent in 3 of 4 of r2, is still only two words and may not read; (2) `purple fig` may fight the model''s
  prior for a fig''s colour; (3) with the character adjectives cut to buy tokens, the patchwork cloak
  is now entirely absent from the prompt, so the costume will be whatever the checkpoint defaults to —
  r2 gave a dark buttoned jacket every time. If the plant and the world come back and only the fig and
  costume are wrong, that is a PASS on the dialect question and the costume moves to the reference where
  it belongs.'
