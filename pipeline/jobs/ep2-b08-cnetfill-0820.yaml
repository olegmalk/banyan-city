script_authority: 'Node 002b-first-citizen, approved_by: founder. THIS PRODUCES A PLATE, NOT AN EPISODE:
  STEWARDSHIP 6 gates voice, footage and assembly, and a still init for an approved beat is none of those.
  inpaint_fruit.py writes approved: false and a provisional: block into its own sidecar. Beat 08''s script
  line is ''lowers the clipboard and points'' and this rung touches only the LOWERING hand -- the pointing
  arm is outside the mask and byte-restored every step. No authoring call is made here: the hand that
  grips is the plate''s own drawn fist, translated, so not one digit is invented.'
bar:
  B0_THE_STACK_IS_WHAT_IT_CLAIMS: 'VOID-CHECK, READ FIRST. `the net did nothing` and `the net never loaded`
    are DIFFERENT FINDINGS and this rung must not confuse them. The job has no result unless all four
    hold: (i) the log prints `PIPELINE StableDiffusionXLControlNetInpaintPipeline, 2 net(s), scales [1.0,
    0.3]`; (ii) the log prints a `CROP REGION` line saying vendored == live; (iii) the sidecar names `controlnet:
    C:\banyan-farm\cnet-openpose-twins`, `controlnet_2: xinsir/controlnet-scribble-sdxl-1.0`, `controlnet_conditioning_scale:
    1.0`, `controlnet_2_conditioning_scale: 0.3`, `control_image_sha256: 562911c8174a6ecc21bc8710a1ac1b7f965c3f2d865093a742c2598c37d952e0`
    and `control_2_image_sha256: 38cd39da304dbb0317aa2522e1ccca099bef583e88e6573fde03b287358213d6`; (iv)
    the sidecar names `pad_crop_region_px` with a real box. Missing any one and the frame is VOID -- not
    a fail.'
  H1a_the_fist_is_GONE: No skin-toned fist survives inside poly(FIST) grown 6, by eye at 9x. Both 0.99
    and 0.70 passed this; a regression means the conditioning is holding the old limb in place, which
    is itself a finding and is pre-registered below as a fail mode.
  H1b_THE_CROSSING_BAND_IS_ABSENT: 'THE ONE QUESTION THIS RUNG ASKS, and it is a SPATIAL claim, so it
    is judged SPATIALLY AND BY EYE. The guard''s own diagonal harness strap RUNS CONTINUOUSLY through
    the mask, entering at the top edge and leaving at the bottom, and NO SECOND BAND CROSSES IT. On ep2-b08-str70-0820
    a second brown band crosses the strap below the buckle, forming a small X with two short stubs at
    its top; on ep2-b08-nostrap2-0820 the same band is in the same place after 91.3 % of the fill was
    redrawn. TWO INDEPENDENT READINGS ARE REQUIRED AND BOTH MUST PASS: (a) BY EYE AT 5x on the fill region,
    against the parent side by side; (b) THE BAND''S OWN MEASURED SIGNATURE -- count, on every horizontal
    scanline crossing the erase region, the maximal runs of strap-hued pixels, where strap hue is defined
    off THE PLATE''s own strap sampled outside the mask and not off this frame. One strap crossing a scanline
    gives ONE run; the X gives TWO. The reference numbers for `band present` and `band absent` are measured
    on the THREE ALREADY-LANDED frames (init, str70, nostrap2) and written into the ladder BEFORE this
    frame is opened; they are not to be chosen after looking at it.'
  C4prime_RING_RE_BASED: 'Run pipeline/fill_quality.py''s assess() on the erase region with the init as
    plate and THE RING PUSHED OUT TO 35-45 px. D >= 0.45 AND N >= 0.25 AND F <= 2.60. DO NOT RUN THE PRESCRIBED
    3-12 px RING AND REPORT ITS VOID AS A RESULT: it has VOIDed three times on this exact geometry because
    --pad-crop repaints the annulus. Real fraction of the annulus is 3.1 % at 3-12 and 100.0 % at 35-45.
    PUBLISH THE ANNULUS''S REAL-PIXEL FRACTION beside the score.'
  C4prime_AND_SHARD_ARE_NECESSARY_AND_NOT_SUFFICIENT: 'WRITTEN INTO THE BAR BECAUSE SECTION 27 EARNED
    IT THE HARD WAY. C4'' bars D from below only and has certified a green goblin fist (D 1.751) and a
    wedge fan (D 3.479). The shard clause was added to fix that, and one rung later it PASSED A FRAME
    THAT IS UNUSABLE AT A GLANCE -- the ink-carry composite scored 2.82 % shard and 12.2 % ink, both inside
    their bands, while looking blocky, staircased and spotted with lavender background blobs on the guard''s
    chest, because posterisation produces plate-like edge statistics by destroying the picture. SO: A
    PASS ON THIS RUNG REQUIRES LOOKING. No combination of automatic clauses may be reported as a pass
    without the 5x eye reading of H1b, and a metric agreeing with the steward is not a sample.'
  SHARD_RATE_ceiling_AND_floor: 'Shard rate = fraction of fill px whose |grad| exceeds the 99th percentile
    of its own real ring (35-45 px). BAND: 0.80 % to 3.00 %. References on this exact footprint: the material
    this fill replaces 1.82 %, the goblin fist 2.79 %, the wedge fan 9.27 %, str70 0.38 %, nostrap2 0.31
    %. An empirical null of 200 real windows of this footprint puts the median at 0.35 %, p95 4.11 %,
    p99 6.74 %. The FLOOR is not decoration: it is the only automatic clause that failed nostrap2 in the
    direction that frame was actually wrong.'
  INK_floor: 'Fraction of erase-region px with L < 90. FLOOR 10.3 %. References: the plate''s own material
    13.3 %, str70 10.5 %, nostrap2 9.1 % (fail), the 0.99 wedge fan 24.6 % (over-drawn).'
  H3_the_digits_SURVIVED: 'The copied fist''s three finger creases and thumb are still individually legible
    at 9x. It is wholly outside the mask but INSIDE the pad-crop box, so it is not untouched: it read
    maxdiff 55, 121 and 78 across three renders and 0 after the --restore-only composite. Report the number;
    legible is the bar.'
  H5_NO_NEW_NOUN: 'No face, no head, no figure, no placket, no second buckle and no second clasp. Judged
    by eye at 4x on the whole frame, plus the green-channel measurement that made three verdicts checkable:
    in-mask G-R mean and px above +20, against -19.90 and 0 for the real material around the fill. References:
    -2.83 with 1934 px (green goblin fist), -16.06 with 166 (wedge fan), -23.11 with 0 (str70), -24.47
    with 0 (nostrap2).'
  B8_hair: Canon light sandy hair, not bald. maxdiff 0 over the head box (500..640, 300..430), which has
    held at 0 through four runs because the head is outside the crop box.
  B6_wardrobe: Cream shirt, white sash and brown wrap are still THREE garments. The mask reaches none
    of them but the shirt around the fist.
  OUT_OF_MASK_DRIFT_is_MEASURED_not_assumed: 'Report changed px outside the mask, their maxdiff, and how
    many fall outside the pad-crop box the sidecar names. The answer to the last has been 0 four times
    running -- 8574 / 8598 / 8600 / 8572 px, a 0.3 % spread over identical geometry -- and any other answer
    is a finding. NOTE THAT THE SHIPPING FORM DOES NOT CARRY THIS AT ALL: Section 27''s --restore-only
    composite takes the plate''s own bytes outside the mask and measured 0 px beyond the feather. The
    raw render is measured anyway, because a change in a number that has been stable four times means
    the geometry moved.'
  scale30_clauses_hold: B1, B2, B3, B4a, B4b, B4c, B5 re-measured on the landed frame. The goblin box
    (60..260, 430..1140) and the board box (300..832, 660..1000) are both far outside the crop box and
    have read maxdiff 0 and 1.
diffusers_facts_read_before_this_spec_was_written: 'READ OUT OF THE 0.29.2 SOURCE, NOT REMEMBERED. (1)
  StableDiffusionXLControlNetInpaintPipeline takes the SAME latent-blend branch at unet.in_channels ==
  4 (`return_image_latents = num_channels_unet == 4`), so the base animagine weights load into it on the
  identical terms as the plain inpaint pipeline -- there is no 9-channel inpainting checkpoint involved
  and none is needed. (2) It accepts padding_mask_crop, computes ONE crops_coords from the mask, and passes
  that same tuple to the init, to the mask and to EVERY control image -- prepare_control_image(..., crops_coords=crops_coords,
  resize_mode=resize_mode) in both the ControlNetModel and the MultiControlNetModel branches. That is
  why hint alignment here is by construction: the driver hands the hints over full-frame and crops nothing
  itself. (3) AutoPipelineForInpainting.from_pipe(pipe, controlnet=[cn, cn2]) swaps the class while reusing
  the loaded modules, and a LIST is wrapped into a MultiControlNetModel by the constructor -- the same
  composition controlnet_plate.py uses on the txt2img side.'
driver_change_and_its_selftest: 'pipeline/inpaint_fruit.py grew --controlnet/--control/--control-sha256/--scale
  and their `2` siblings, all defaulting to nothing, and nothing is the branch six filed verdicts were
  measured on. Its --selftest is $0 and runs with no torch and no network: 32 assertions, of which the
  load-bearing one reproduces ep2-b08-str70-0820''s OWN LANDED SIDECAR byte for byte through the refactored
  writer -- a filed verdict as the anchor rather than a fixture written the same day. Alignment is asserted
  structurally: every hint must equal the init''s pixel size (rc 13 otherwise) and the module is checked
  to contain no crop call of its own. At render time the vendored get_crop_region is compared against
  the live pipe.mask_processor.get_crop_region and a mismatch is rc 14. Also refused before any weight
  loads: an unlisted net (the licence travels with the name), a net with no hint, a hint with no net,
  an unpinned hint, a hint whose bytes are not the pinned ones, the same net composed with itself, and
  a conditioning scale that was never stated.'
init_provenance: 'pipeline/beat08_grip_copy.py --write --variant eraseonly. init 08-first-citizen-eraseonly-0820.png
  sha 7cc1a4cb12ca14a3628eb9ba8b8257ccc1f07f7cf9a9727d8ce769e1d5de8d45, mask 08-first-citizen-eraseonly-mask-0820.png
  sha 8c94f1403c3e13839fe2351c70e494f9f2961c0b5a718db3f786d2a341a2d505 -- BYTE-IDENTICAL to all five parents
  on this route. The two hints are b08-openpose-nat-0819.png sha 562911c8174a6ecc21bc8710a1ac1b7f965c3f2d865093a742c2598c37d952e0
  and b08-board-0820.png sha 38cd39da304dbb0317aa2522e1ccca099bef583e88e6573fde03b287358213d6, carried
