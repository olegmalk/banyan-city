  and every carried clause still holds, beat 08 finally has a complete plate: the fill gets wrapped in
  the --restore-only composite Section 27 adopted, and ONE motion sample off that plate follows immediately
  as the beat''s take candidate. If the band survives spatial conditioning at scale 1.0, the route is
  closed in writing -- beat 08 ships as-is on ep2-b08-scale30-0820 and the hand-authored matte (R4, the
  author''s and not the steward''s) is the only lever left. No third outcome is on the table and no sixth
  wording is.'
success: ONE 832x1216 PNG plus its sidecar, published into courier-box, off the same asserted init sha
  and the same asserted mask sha as the parent, with BOTH hints published beside it. The sidecar must
  name controlnet, controlnet_2, both conditioning scales, both hint sha256s and the pad_crop_region_px
  box, and the log must carry the CROP REGION line showing the driver's vendored crop equals the live
  one. NOT a pick and NOT a plate_ack.
why: 'THE LAST DEFECT ON THIS BEAT IS A SHAPE, AND THIS IS THE FIRST OF THE TWO LEVERS THAT REACH ONE.
  Five renders closed everything else by measurement rather than argument: mask size does not choose the
  noun (18408 px drew a head, 10020 px drew a fist); the prompt does choose a KIND (deleting `goblin`
  deleted it outright, first try, at unchanged strength); strength governs invention symmetrically and
  neither end lands on the plate''s own line quality; and a negative handed the exact noun that arrived
  -- `second strap, crossed straps, extra strap` -- redrew 91.3 % of the fill and the crossing band came
  back in the same place. A negative removes a kind, not a count, because `second` is a cardinality over
  a thing the positive asks for by name and the text encoder has nowhere to put the word. What is left
  is a small X of brown band across the guard''s strap: a SHAPE, and the only conditioning that addresses
  a shape is spatial. inpaint_fruit.py had no ControlNet when b08-arm-route-0819.md wrote that sentence
  in Section 27. It has one now, the pipeline is diffusers'' own, and the two hints are the ones this
  plate''s txt2img parent was rendered with.'
