    at all, something other than the conditioning moved and this job must stop here at $0.'
- name: publish
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - "# EVERY FILE IS NAMED IN FULL, not matched by a glob. A glob that misses\n# publishes nothing while\
    \ returning a code that reads like a render failure,\n# and box_enqueue.output_path_problems refuses\
    \ a spec whose declared artifacts\n# are never named by any step -- which a wildcard defeats. Missing\
    \ ONE file is\n# a FAIL of the job. No allow_fail anywhere in this spec.\nimport hashlib, os, shutil\n\
    from_dir = \"C:/banyan-farm/b08cnetfill-0820\"\ndst = \"C:/banyan-farm/courier-box/farm-out/ep2-b08-cnetfill-0820\"\
    \nNAMES = [\n    \"b08-cnetfill-s20260822.png\",\n    \"b08-cnetfill-s20260822-mask.png\",\n    \"\
    b08-cnetfill-s20260822.png.meta.yaml\",\n    \"08-first-citizen-eraseonly-0820.png\",\n    \"08-first-citizen-eraseonly-mask-0820.png\"\
    ,\n    \"b08-openpose-nat-0819.png\",\n    \"b08-board-0820.png\",\n    \"prompt.txt\",\n    \"negative.txt\"\
    ,\n]\nos.makedirs(dst, exist_ok=True)\nlines = []\nfor name in NAMES:\n    f = os.path.join(from_dir,\
    \ name)\n    if not os.path.isfile(f):\n        raise SystemExit(\"!! missing %s -- refusing to call\
    \ the job clean.\" % f)\n    shutil.copy2(f, dst)\n    with open(os.path.join(dst, name), \"rb\")\
    \ as fh:\n        h = hashlib.sha256(fh.read()).hexdigest()\n    lines.append(h + \"  \" + name)\n\
    with open(os.path.join(dst, \"ep2-b08-cnetfill-0820.sha256\"), \"w\",\n          newline=\"\\n\")\
    \ as fh:\n    fh.write(\"\\n\".join(sorted(lines)) + \"\\n\")\nprint(\"published\", len(lines), \"\
    file(s) + manifest ->\", dst)\nraise SystemExit(0 if len(lines) == len(NAMES) else 1)\n"
