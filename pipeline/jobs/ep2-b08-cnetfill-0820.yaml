pre_registered_fail_modes:
  most_likely_A_THE_BAND_SURVIVES: 'The openpose hint carries eighteen body keypoints and the scribble
    hint carries a board; NEITHER names a strap, so it is entirely possible that pinning the torso and
    the arm leaves the sampler as free to draw a diagonal across the chest as it was. IF THE BAND IS STILL
    THERE, THE ROUTE CLOSES IN WRITING. Not retuned, not re-scaled, not re-hinted: three levers (prompt,
    strength, negative) and now a fourth (spatial conditioning) would have failed the same clause, beat
    08 ships as-is on ep2-b08-scale30-0820, and the hand-authored matte -- R4, the author''s and not the
    steward''s -- is the only lever left. DO NOT PROPOSE SCALE 1.5, A THIRD NET, OR A STRAP HINT.'
  second_THE_HINT_HOLDS_THE_OLD_FIST_IN_PLACE: 'The openpose skeleton puts a wrist near the region this
    pass is trying to empty. If a skin-toned remnant survives inside poly(FIST) grown 6 -- something neither
    0.99 nor 0.70 did -- then the conditioning is fighting the deletion rather than shaping what replaces
    it. That is a REAL finding and it closes the route on the same terms as the first fail mode: it would
    mean the two jobs (erase a limb, and say what stands where it was) are not simultaneously satisfiable
    by any conditioning this driver can carry.'
  third_THE_FILL_GOES_FLAT_OR_SPIKY: A conditioning channel at scale 1.0 inside a 10020 px hole may push
    the shard rate out of the 0.80-3.00 % band in either direction. This is a FAIL of the shard clause
    and is reported as one; it is NOT a licence to sweep the scale, because the clause that decides this
    rung is H1b and a shard failure with the band still present is the first fail mode wearing a second
    hat.
  fourth_A_SEAM_AT_THE_COPY: The copy's stair-stepped octagonal edge is untouched by this pass and WILL
    still read as a decal in the raw render. EXPECTED, NOT A FAIL -- and in the shipping form it is moot,
    because --restore-only puts the plate's own bytes back outside the mask and measured the copy byte-exact
    (maxdiff 0).
  NOT_a_fail_mode_a_C4prime_OR_SHARD_PASS: Neither is evidence of a good fill on this instrument. C4'
    passed a green goblin fist and a wedge fan; the shard clause passed a posterised frame that is unusable
    at a glance. Only H1b's two readings can pass this frame.
sample_declaration: 'ONE SAMPLE, and the SIXTH on this route -- but the first with a lever the previous
  five did not have. Each of the five moved exactly one thing and each bought a distinguishable finding:
  fistcopy (18408 px mask) drew a goblin HEAD; eraseonly (10020 px) drew a green goblin FIST; nogoblin
  (prompt) drew no goblin and a second buckled strap; str70 (strength) deleted the fist, kept the strap
  running and left one crossing band; nostrap2 (negative) redrew 91.3 % of the fill and left THE SAME
  BAND. This one moves the conditioning. About sixty seconds of card across all six, $0.'
scope_limits: 'This does not settle beat 08''s staging, it does not attempt the forearm, and it does not
  touch the txt2img plate. The plate draws the guard''s hand at the authored elbow and the pose hint wants
  it at the wrist; re-routing a limb is a txt2img question and this rung leaves it there. It also does
  not license a conditioning-scale sweep: one sample, at the scales the plate''s own parent used, and
  a verdict either way.'
the_one_variable_and_what_is_held: 'MOVED: two ControlNets inside the inpaint -- C:\banyan-farm\cnet-openpose-twins
  at 1.0 on b08-openpose-nat-0819.png, composed as a MultiControlNetModel with xinsir/controlnet-scribble-sdxl-1.0
  at 0.3 on b08-board-0820.png. HELD BYTE-FOR-BYTE: init sha 7cc1a4cb12ca14a3628eb9ba8b8257ccc1f07f7cf9a9727d8ce769e1d5de8d45,
  mask sha 8c94f1403c3e13839fe2351c70e494f9f2961c0b5a718db3f786d2a341a2d505, seed 20260822, strength 0.70,
  40 steps, cfg 7.5, pad-crop 64, blur 8, prompt and negative. The hints are not new work: both are the
  ones ep2-b08-scale30-0820 -- the txt2img frame this init descends from -- was rendered with, so they
  are already in this beat''s lineage AND in the init''s own 832x1216 coordinate frame. A freshly authored
  hint would have been a second variable.'
the_shipping_form_is_the_composite_not_the_render: 'WHATEVER THIS PASS PRODUCES IS WRAPPED IN pipeline/beat08_ink_carry.py
  --restore-only BEFORE IT IS JUDGED AS A PLATE, per Section 27, which adopted that form for every inpaint
  result in this tree. It takes the fill inside the mask and the PLATE''s own bytes outside it, blending
  only a 2 px feather: measured 0 px differing from the plate beyond the feather against 7560 for the
  raw render, and the protected fist copy back to byte-exact. It costs nothing, it cannot make a picture
  worse, and it retires a defect four renders in a row carried. It CANNOT remove a shape, which is why
  it is a wrapper here and not the rung.'
why_a_controlnet_can_reach_what_the_negative_could_not: 'MEASURED, NOT HOPED. Section 26''s finding is
  that a negative prompt removes a KIND and not a COUNT: `goblin` is a kind and deleting it deleted the
  goblin, but `second strap` is a cardinality over a thing the POSITIVE asks for by name (`brown leather
  harness strap`), the same token pulls both ways, and CLIP has nowhere to put the word `second`. A ControlNet
  does not carry counts either -- it carries POSITIONS. The openpose hint says where the torso and the
  arm are; the scribble hint says where the board is. Neither says `one strap`, and this spec does not
  claim they do. The claim is narrower and is the thing being tested: with the region''s geometry pinned
  by a spatial channel, the sampler has less unconditioned room in which to invent a second diagonal.
  If that is wrong, the band survives and the route closes -- which is a real result and the reason the
  fail modes below are written before the render.'
