# Beat 02 typing, VARIANT A — the spec that is ON THE CARD RIGHT NOW, recorded
# because the running job's recipe was otherwise going to exist nowhere but in a
# queue json. Roman 2026-08-11 ~15:06: "redo beat 2, make him actually type."
#
# READ THIS FIRST — TWO LANES WROTE THE SAME JOB. This lane and another both
# answered the same verdict within thirteen seconds of each other. Both enqueued
# under the SAME task id `ep1-b02-121f-typing-0811` (queue files ...-1786446886
# = this one, ...-1786446899 = the other) and both name the SAME output,
# 02-three-oh-seven-LTX-121f-typing.mp4. The other lane's spec overwrote this
# one at pipeline/jobs/ep1-b02-121f-typing-0811.yaml while this one's job was
# already running. Nothing is reverted: the peer's spec is the better one (see
# below) and keeps the canonical path and the canonical output name. This file
# preserves what variant A actually asked for, so the clip that is rendering can
# be attributed to a prompt instead of guessed at.
#
# WHERE THE TWO VARIANTS DIFFER, and why B is the better ask. Both delete the
# same three suppressors from the framing-hold prompt — "holds his pose", "only
# his fingers move lightly", "small ambient motion only" — which is the actual
# cause of the no-typing clip, and both carry the camera lock verbatim. They part
# on the plate:
#   A (this file)  asks for "both hands down on the mechanical keyboard" as a
#                  STATE the shot opens in.
#   B (the peer)   checked stills/02-three-oh-seven.png and found that in the
#                  plate ONE HAND IS RAISED AT HIS GLASSES and the other rests on
#                  the desk — NEITHER hand is on the keys. So B asks for the
#                  descent as an action: he brings the raised hand down from his
#                  glasses onto the keyboard, and from there both hands work the
#                  keys.
# That difference matters and A got it wrong. Telling LTX that hands are already
# on the keyboard, while conditioning it on a frame where they are not, is the
# same category of prompt/plate mismatch that made attempt 1 walk the camera —
# and the model's cheapest way to satisfy it is to grow a second pair of hands.
# A may still produce usable typing; it is likelier than B to produce a duplicated
# hand, and that is the thing to check first in the A clip.
#
# BOTH CLIPS SURVIVE. Because A and B write the same filename, A's mp4 is copied
# to 02-three-oh-seven-LTX-121f-typing-A-handsdown.mp4 as soon as it lands, before
# B's render reaches its write. B keeps the canonical name. Judge by eye, side by
# side: does he type, does the frame hold, and does he still have exactly two hands.
#
# THE CLAUSE A CHANGED, verbatim, against ep1-b02-121f-framing-hold-0811:
#   BEFORE:
#     "the seated engineer holds his pose at the desk, his shoulders steady, his
#      head kept at the same angle toward the monitor; only his fingers move
#      lightly on the mechanical keyboard. small ambient motion only,"
#   AFTER:
#     "the seated engineer is typing at the desk, both hands down on the
#      mechanical keyboard, his fingers striking the keys one after another in a
#      steady unbroken rhythm that runs from the first frame to the last, his
#      wrists and forearms shifting a little along the keys as he works, his
#      shoulders steady and his head kept at the same angle toward the monitor,"
#   The shoulders-and-head half is kept on purpose: it supports the camera lock
#   (a steady head is what holds his face at the same height) rather than
#   suppressing his hands. Continuous wording, no countable unit — beat 04's
#   "twitch once" looped and beat 10's "sways" wobbled, so nothing here names a
#   keystroke, a count or a single gesture.
#
# CARRIED BYTE-FOR-BYTE from ep1-b02-121f-framing-hold-0811 and verified by diff,
# not by eye: the style head, the whole camera-lock clause ("the camera is locked
# on a tripod and stays perfectly still ... the composition is identical in every
# frame."), the ambient tail (glow pulse, mug steam, dust motes, "living scene")
# and the "Subject already in frame:" tail describing the plate. Everything from
# the lock to the end of the prompt is identical between the two files. Same
# plate, same cover-centre crop, same seed 20260902, same 121 frames, same steps,
# same guidance 1.0, same two-stage distilled schedule, same negative.
#
# NO NEGATIONS IN THE POSITIVE. At guidance 1.0 the uncond branch is never built
# (ltx_i2v.py:1001-1008), so the positive is the whole prompt and any "no"/"never"
# delivers its noun. The changed clause contains none.
#
# 121 FRAMES IS ARITHMETIC, unchanged: VO 4.451s -> fit_duration floor 4.851s,
# ceiling 6.451s (render_t3.py:312). 113 -> 4.708s is under the floor. 129 ->
# 5.375s rounds UP to 5.38 and wraps one frame of frame 0 onto the end
# (render_t3.py:627-631). 121 -> 5.041667s rounds DOWN to 5.04. 121 stands.
#
# NO METRIC. The flow number is disqualified on this series (131e433) and could
# not tell fingers from steam anyway. By eye.

