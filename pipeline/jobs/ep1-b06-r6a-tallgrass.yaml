# ep1 beat 06 "too blue" — ROUND 6, ARM A: ground visible, covered in TALL GRASS.
# One candidate set, four seeds. The other half of this round is
# `ep1-b06-r6b-sky.yaml` and the two are ALTERNATIVES, not a sweep with a winner.
#
# WHY THIS EXISTS. The founder (R4) rejected every beat-6 candidate this tree has
# ever drawn — rounds 3, 4, 5 and the `fix` set — on 2026-08-10 ~15:00 local, and
# gave the composition in the same sentence:
#
#     "none of the beat 6 images will work, you either show the ground as having
#     tall grass or dont show the ground at all and show the sky, right now its
#     showing the ground as some flat place, or showing cities for some reason"
#
# Two acceptable readings, and he chose neither. This job renders the first one.
# THE STEWARD MAKES NO PICK BETWEEN THE ARMS anywhere in this round — showing him
# both is the point of it. Recorded in taste/steward-model.ledger.yaml at commit
# d71cadb, where the round-5 pick `b06-r5-s2` is scored an honest MISS.
#
# THE CITIES ARE A DIAGNOSED PROMPT FAULT, NOT BAD LUCK, AND NOT A TRIM. Every
# negative this beat has ever sent was read back from its own sidecars — r3, r4,
# r5 and the fix set — and NOT ONE contains city, cityscape, building, skyline,
# skyscraper, industrial, town or architecture. A city has never once been
# forbidden here. It is also not the token budget: r5's negative measured 51 of
# 77 on the box's real CLIP with 26 tokens spare, so nothing was trimmed away.
# The term was never written. The positive side is the other half: r5's one
# tactic was to speak native Danbooru tags and the tag it chose for "a landscape"
# was `scenery` — the umbrella whose children include `cityscape`, 62,273 posts
# against 19,945 (qdlabs/danbooru-tags mirror on HuggingFace, read 2026-08-10;
# danbooru.donmai.us itself timed out from here as it did for r5 and is NOT cited
# as if it had been read). r5 is the first round on this beat to carry `scenery`,
# and r5 is the round that drew a city through s0's ring and an industrial
# skyline along s1's bottom edge. Both arms delete the tag AND negate the block.
#
# WHAT ARM A SENDS, MEASURED ON THE BOX'S REAL CLIP BEFORE THIS FILE WAS WRITTEN
# (positive 35/77, negative 59/77, nothing trimmed, r5 control reproduced
# byte-for-byte on both halves):
#   POS  no humans, tall grass, grass, sky, blue sky, day, cloud, sunlight,
#        cinematic lighting, detailed, newest, masterpiece, best quality,
#        very aesthetic
#   NEG  photorealistic, 3d render, abstract, text, watermark, signature, low
#        quality, blurry, extra limbs, deformed, jpeg artifacts, realistic skin
#        texture, leaf, stem, tree, photorealism, text, cityscape, city,
#        building, skyline, road, mountain
#
# `tall_grass` IS HIS WORD AND IT IS A THIN TAG. 785 posts on this checkpoint's
# vocabulary against 89,292 for plain `grass`. It is sent because it is what he
# asked for and because it means what he asked for; `grass` rides behind it to
# carry the conditioning. If arm A comes back a mown lawn, that ratio is the
# first thing to look at, and it was measured before the render rather than
# after.
#
# THE ONE JUDGEMENT CALL, STATED RATHER THAN BURIED: arm A removes `plant` and
# `foliage` from the negative. Grass is a plant, and asking for tall grass while
# forbidding it is the self-cancelling prompt that gave r3 a wall of cumulus
# against `no big clouds`. `leaf`, `stem` and `tree` STAY — those are the
# founder's own 2026-08-07 rule and they are about the CHARACTER, not the ground:
# "there shouldnt be a leaf in the image, doesnt make sense that he can see
# himself when he is looking at the sky."
#
# WHAT IS HELD FIXED WHILE THE COMPOSITION MOVES: `no humans` at the HEAD of the
# POSITIVE with no person noun anywhere in the negative. That is r5's one
# confirmed win — a girl in 2 of 4 (r3) and 3 of 4 (r4) down to zero in 4 of 4 —
# and his verdict does not mention people. Traps 7 and 8 refuse the run if either
# half of it slips.
#
# SEEDS ARE r5's OWN FOUR, this beat's k=4..7, which r3 and r4 also drew. Both
# arms run the same four, so A against B is a comparison of the prompt and not of
# the noise, and either arm still sets beside the rejected rounds column for
# column.
#
# THE SCRIPT IS NOT READ FROM THE SHARED CLONE, ON PURPOSE. Other lanes are
# rendering out of C:\banyan-farm\banyan-city right now and pulling it forward
# could change a file under a running job. render_b06r6.py was copied to its own
# directory and verified byte-for-byte at both ends (sha256
# 074fdcc2a975ac950423251f95f7c725c6eb21c215a9f0197a31247c3ff3982d, repo commit
# fa479ad). The clone is still used for --root, and that is safe BECAUSE of the
# traps rather than in spite of them: trap 1 asserts the beat-6 fence is
# byte-identical to what r5 rendered and trap 2 rebuilds r5's exact sent prompt
# and negative from that checkout's own sd_prompt.py. A clone behind HEAD cannot
# pass both and silently send something else.
#
# WHAT THIS IS NOT: no pick, no ranking, no arm recommended, no promotion to
# canon, no publication, no spend, and shots.md is not edited.

id: ep1-b06-r6a-tallgrass
task: 001-b06-r6a-tallgrass-0810
node: 001-capability-inventory
beat: 6
runner: box
needs_gpu: true
priority: 12
max_attempts: 1
owner: b06-r6

consumer: >-
  the founder's choice between his own two options. He rejected every beat-6
  frame that exists and named two compositions he would accept; this is the
  first of them, and it is unrunnable to answer him without it. Beat 6 is the
  last beat in episode 1 with no frame of his, and v34 is currently holding a
  frame he has rejected. Priority 12 is ahead of the plate and goblin lanes
  because this is a same-day response to an R4 verdict on the only open frame in
  episode 1, and it costs about a minute of card time.

success: >-
  Four 832x1216 PNGs with sidecars in C:\banyan-farm\b06-r6\out, named
  06-too-blue-r6a-s{0..3}.png. Read against exactly three things and nothing
  else: is the ground covered in TALL GRASS rather than reading as a flat empty
  place; is there any city, skyline, building or industrial silhouette anywhere
  in the frame (his second named defect — zero of four is the bar); and does r5's
  people result hold at zero of four with the person nouns still out of the
  negative. No pick is made and no arm is preferred.

why: >-
  Two fixes for one diagnosed defect: `scenery`, the tag that imports cityscapes,
  comes out of the positive, and the urban block goes into the negative where it
  has never been. The composition itself is his instruction rendered literally
  rather than a steward's interpretation of it.

