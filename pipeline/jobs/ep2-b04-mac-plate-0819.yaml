  Drawn on macbook2 2026-08-19T23:41 by pipeline/plate_scratch.py --beat 4, from
  DRAFTS[4] at seed 20260819, 832x1216 on MPS, farm job mac-b04-0819-233811. The
  positive's identity clause is byte-identical to DRAFTS[14]'s and so to the
  string the founder ratified on 2026-08-19; measured 73/77 positive and 58/77
  negative on the real CLIP tokenizer with exit-7 clash NONE. Judged at full
  size before this spec existed: PASS on cast, near-pass on the beat -- eyes
  off-axis to frame left, jaw set, held breath reading. It is also the wave's
  control, being the only one of four beats with no plant in it and the only one
  that landed. NO PICK AND NO plate_ack IS CLAIMED BY THIS SPEC: publishing a
  plate so a guard can read it is not promoting it.

