# 2026-08-12, STABILITY ROUND. This one is not a hypothesis — it is a contradiction I wrote.
#
# Two seeds of beat 17 disagreed hard on palette: one warm daylight meadow, one dark dusk with
# bare twigs. I went looking for what was unpinned and found something worse. THIS PROMPT
# CONTAINS FOUR CONFLICTING TIME WORDS AT ONCE: "morning", "afternoon", "noon" and "amber".
# I built it by layering an environment paragraph onto a base prompt and never re-read the
# result, so the model has been choosing a time of day for me every run — and with the seed
# changed it chose differently. That is not instability in the model; it is an incoherent
# instruction that happened to resolve pleasantly the first time.
#
# THE FIX IS TO SAY ONE TIME. Beat 17''s own fence in shots.md says "afternoon light warming
# toward amber", so afternoon it is, and morning and noon come out. Nothing else moves.
