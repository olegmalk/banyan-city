bar:
  t1_the_glance_reads: 'At 1:1, on the frames and not on a number: he visibly looks away and back. THE
    WHOLE POINT OF THE RUNG IS THAT THE MECHANISM NO LONGER HAS TO BE THE PUPILS. Rung 1 was failed for
    redirecting the gaze with a head rotation against a prompt that forbade it; at this crop a rotation
    of the size the engine actually gives subtends enough frame to READ as a glance, and beat 04''s done_when
    asks for live eyes under a held breath, not for a particular muscle. If it reads, it passes.'
  t2_head_travel_is_measured_not_forbidden: Head-band ink centroid travel, rung 1's instrument and rung
    1's rows (100-520), PUBLISHED WHATEVER IT IS and scored against nothing. It is here so the three rungs
    are comparable -- 64.7 px at z 1.0, 4.7 px with the head locked -- and so a future reader can see
    what the crop did to the number. A bar on it would re-open the wording ladder these two rungs closed.
  t3_the_ratified_adult_holds: 'Same lean wiry adult goblin at frame 121 as at frame 1: green skin, bald
    dome, long pointed ears, one face, one figure, NO DRIFT TOWARD A CHILD. Canon: pipeline/canon.yaml
    ep2-goblin-design-adult, founder-ratified 2026-08-19. This is the clause the whole job is for and
    it outranks T1: a clip that finds the glance and loses the character is a FAIL, because the character
    is what the founder complained about on 08-20.'
  t4_the_ears_survive_the_crop: Both long pointed ears are inside the frame at f000 and at f120. Scored
    on the z 1.7 rungs and EXPECTED TO FAIL on z 2.4, which is filed as a bracket. It is a separate clause
    from T3 because the ears are the cheapest read on this design and losing them to the crop would be
    buying the glance with the character.
  t5_rung_1s_passing_clauses_hold: 'Mouth shut for all 121 frames -- beat 04 has no spoken line and an
    open mouth is a speech cue. Camera locked: no pan, tilt, dolly or zoom. Both passed in rungs 1 and
    2; losing one would mean the crop bought its win somewhere else.'
failure_predicted_in_advance: T-FROZEN. Rung 1's motion was spread across the frame and a large share
  of it was grass; this crop throws most of the grass away, and rung 2 already showed that when this engine
  runs out of things to move it holds rather than invents. If T-FROZEN fires on all three seeds, beat
  04 as written is not reachable on this engine and the honest report to the founder is that the beat
  needs a different action or a different tool -- his call, not this lane's.
how_to_judge_this_in_the_morning: Contact-sheet level, by eye, one line per clip. Extract f000/f030/f060/f090/f120
  from all four, tile them next to rung 1's clip and next to the child take that shipped, and answer T1,
  T3 and T4 off the sheet. Only if T1 is arguable does the head-band number get computed. The founder's
  complaint is a design complaint and T3 is the clause that answers it, so a rung that passes T3 and fails
  T1 is still worth reporting as a design-clean fallback.
init_provenance: 'Rung 1''s plate, unchanged and unmoved: 04-the-footnote-mac-plate-r1s1.png, sha256 5dd35da532612e5d85c15ef3353068bf1e44675f8ddfc73c316ac2f654d4e350,
  published through ep2-b04-mac-plate-0819 and resolvable on origin/farm-results-rtx5090, so the plate
  and refs guards RUN and PASS with no plate_ack. The sha is asserted inside cover_crop.py before anything
  is written, so a crop of the wrong plate cannot happen silently. THE CROP WAS RUN ON THIS EXACT FILE
  LOCALLY BEFORE THIS JOB WAS FILED and the three framings were read at 1:1 -- $0, PIL only, no model.'
not_done_on_purpose: 'No prompt edit. No negative edit. No crf change. No frame or fps change. No new
  argv flag -- the zoom lives in the payload so the invocation is identical to the parent''s. No fourth
  wording: rungs 1 and 2 closed that route from both sides and re-opening it here would make any result
  ambiguous.'
pre_registered_fail_modes: 'T-FROZEN -- the tight crop removes the grass, which is most of what moved
  in rung 1, and the clip comes back dead. Named as the most likely and it is a FAIL, not a tidy still:
  rung 2 already produced the degenerate pass once and it was reported as a failure. T-THE-CROP-IS-NOT-ENOUGH
  -- the rotation is the same 64.7 px of plate and still reads as a twitch rather than a glance; the z
  2.4 bracket exists to tell that apart from ''more crop would fix it''. T-IDENTITY-DRIFT-ON-A-BIGGER-FACE
  -- a face at this scale gives the sampler more room to redraw features; --image-crf 10 is what stands
  between this and the drift that fired at 33, and if T3 fails while the flag is at 10 that is a finding
  about crop scale and not about the flag. T-THE-EARS-GO -- expected on z 2.4 by construction, and would
  be a real loss on z 1.7. T-SEEDS-AGREE -- all three draws at z 1.7 do the same thing, in which case
  the answer is the framing and not the draw, and the next move is a different staging rather than more
  seeds.'
the_one_variable: The init's framing, and nothing else. cover_crop.py takes a centred sub-box at ZOOM
  1.7, centre y 0.42, instead of the whole plate; the step's argv, the source plate, its asserted sha,
  the prompt, the negative, the frame count, the fps, the guidance, the sigmas, the two-stage flag, the
  offload mode and --image-crf 10 are rung 1's byte for byte. The three z 1.7 rungs differ from each other
  ONLY in seed.
