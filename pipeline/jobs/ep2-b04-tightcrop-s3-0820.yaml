    \ the sub-box is the largest WxH-aspect rectangle that fits the\nsource, divided by ZOOM, centred\
    \ at (CX, CY) as fractions of the source, and\nclamped inside the source so it can never sample outside\
    \ the image.\n\"\"\"\nimport argparse, hashlib, os, sys\nfrom PIL import Image\n\nZOOM = 1.7\nCX =\
    \ 0.5\nCY = 0.42\n\nap = argparse.ArgumentParser()\nap.add_argument(\"--src\", required=True)\nap.add_argument(\"\
    --sha256\", default=\"\", help=\"asserted before anything is written\")\nap.add_argument(\"--out\"\
    , required=True)\nap.add_argument(\"--size\", default=\"704x1280\")\na = ap.parse_args()\n\nif not\
    \ os.path.isfile(a.src):\n    sys.exit(\"!! src not found: %s\" % a.src)\nh = hashlib.sha256()\nwith\
    \ open(a.src, \"rb\") as fh:\n    for chunk in iter(lambda: fh.read(1 << 20), b\"\"):\n        h.update(chunk)\n\
    have = h.hexdigest()\nif a.sha256 and have != a.sha256:\n    sys.exit(\"!! SRC SHA MISMATCH -- refusing.\\\
    n   want %s\\n   have %s\" % (a.sha256, have))\n\nW, H = (int(v) for v in a.size.split(\"x\"))\nim\
    \ = Image.open(a.src).convert(\"RGB\")\nsw, sh = im.size\nar = W / float(H)\nbh = min(sh, sw / ar)\
    \ / float(ZOOM)\nbw = bh * ar\nif bw > sw:\n    bw = sw\n    bh = bw / ar\nx = CX * sw - bw / 2.0\n\
    y = CY * sh - bh / 2.0\nx = max(0.0, min(sw - bw, x))\ny = max(0.0, min(sh - bh, y))\nbox = (int(round(x)),\
    \ int(round(y)), int(round(x + bw)), int(round(y + bh)))\nim = im.crop(box).resize((W, H), Image.LANCZOS)\n\
    os.makedirs(os.path.dirname(os.path.abspath(a.out)) or \".\", exist_ok=True)\nim.save(a.out)\nprint(\"\
    src %dx%d sha %s\" % (sw, sh, have), flush=True)\nprint(\"ZOOM %.3f CY %.3f -> sub-box %s of %dx%d,\
    \ resized to %dx%d\" % (ZOOM, CY, box, sw, sh, W, H), flush=True)\nprint(\"WROTE %s\" % a.out, flush=True)\n"
