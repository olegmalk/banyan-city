# 002b beat 04 — ARM 6. The two windows either side of 15%, on reference s0.
#
# THE VERDICT THIS ANSWERS TO. Roman, 2026-08-10 ~15:00: "the goblin needs abit
# more regeneration." A reject and a direction to keep iterating. Nothing in this
# job picks, ranks or promotes a frame, and nothing in it decides what the goblin
# looks like — that is R4's and it is not delegated here.
#
# WHY THIS AND NOT MORE OF THE SAME. a1dcd32 established that switching the
# IP-Adapter off partway through the denoise gets the green back without losing
# the creature: green_share 0.335 at a 15% window against the tags-only
# baseline's 0.363 and 0.012 when the reference owns all forty steps, with the
# four seeds still reading as ONE creature. But 15% is the SHORTEST window anyone
# has drawn. Arm 3 sampled 0.15 / 0.25 / 0.40 / 0.60 and 0.15 is the end of the
# measured range, not a located optimum. Nobody knows whether green keeps
# climbing below it, and nobody knows whether identity survives there.
#
# AT 40 STEPS THIS IS AS FINE AS THE KNOB GETS: 0.10 is 4 steps of adapter, 0.15
# is 6, 0.20 is 8. Three consecutive integers.
#
# BOTH SIDES, BECAUSE EITHER RESULT IS A FINDING. If 0.10 keeps the green and
# loses the creature, then 15% sits at a real edge and the mechanism has a floor
# worth writing down. If 0.10 keeps both, the floor is lower than anyone has
# looked. And 0.20 is the only readout that says whether the jump from 0.192 (at
# 0.25) to 0.335 (at 0.15) is a smooth curve or a step — four sampled points
# cannot tell those apart.
#
# ONE REFERENCE, s0, DELIBERATELY. Every cell here then differs from an existing
# measured arm-3 row by the window and nothing else. Whether the window
# generalises across references is arm 5's question (ep2-b04-goblin-ipa-window4,
# queued separately) and mixing the two would confound both.
#
# THE INSTRUMENT IS green_share.py, NOT THE IDENTITY METRIC. DINOv2 seed
# agreement is disqualified on this beat — 724b616 and 93356b1 record it calling
# four visibly different faces the same creature, twice, on a face close-up
# against a constant background it is largely scoring. green_share is used
# because its own docstring records the discrimination check on THIS footage:
# wave-1 and arm-2 frames (green to the eye) at 0.34-0.49, arm-1 frames
# (grey-teal to the eye) at 0.001-0.014, ordering matching a direct look at the
# contact sheet in all three groups. It measures the colour question only. The
# identity question — one creature or four — is read BY EYE off the frames, at
# mouth-level zoom for the tusks, and no number in this job is allowed to answer
# it. Where a number and the picture disagree the picture wins.
#
# CARRY THE KNOWN COST FORWARD: tusks come back only partially at short windows
# (0 of 4 at w060, 1-2 of 4 at w015, against 3 of 4 in the tags-only baseline).
# w010 is shorter still, so the tusk count at w010 is the specific thing to look
# at and to report whichever way it goes.
#
# ZERO PROMPT TOKENS. Nothing is added to the description of the goblin, so
# nothing here spends the founder's "nothing complex".
#
# LICENCES, nothing new: animagine-xl-3.1 (CreativeML Open RAIL++-M, D15 open),
# h94/IP-Adapter Plus SDXL (Apache-2.0), ViT-H image encoder (MIT-derived),
# diffusers 0.29.2 (Apache-2.0). All cached on the box. $0.

id: ep2-b04-goblin-ipa-wedge
task: ep2-b04-goblin-ipa-wedge-0810
node: 002b-first-citizen
beat: 4
runner: box
needs_gpu: true
priority: 42
max_attempts: 1
owner: queue-fill lane (goblin regeneration, founder directive 2026-08-10)

consumer: >-
  Where the step window's useful edge is, which is the next thing the goblin
  finding needs before it can be described to the founder as anything more than
  "one setting that worked". If green holds or improves at w010 with the creature
  intact, the recipe to carry to the other beats is w010, not w015. If it breaks
  at w010, w015 is an edge and the report says the mechanism has a floor. Either
  way the answer lands in the same sentence he gets about the goblin.

success: >-
  8 PNGs at C:\banyan-farm\goblin-ipa-0810\out6 with per-frame 7.2 sidecars, plus
  a green_share table over the tags-only baseline, arm 3's w015 row and these two
  new windows on one build of one instrument. A result showing w010 destroys
  identity is a success: the job produces the observation.

metric_warning: >-
  green_share answers the COLOUR question only, and only because its
  discrimination on this exact footage is recorded in its docstring. It says
  nothing about whether the four seeds are one creature; that is read by eye. The
  DINOv2 identity metric is NOT run here — it failed twice on this beat
  (724b616, 93356b1) and re-running it would only invite a ranking it cannot
  support.

why: >-
  One variable against arm 3: the window. Reference fixed at s0, scale fixed at
  0.6, seeds fixed at the wave-1 four, windows 0.10 and 0.20 of 40 steps.
  Sequential, one image at a time — batch-of-4 configs are banned on this card.

est_minutes: 5

needs:
- cuda
- vram20
- farm-venv

# Both harness files were scp'd to the box at enqueue time and verified
# byte-identical to the repo copies (sha256 b245ee53.. for goblin_ipa_sample.py,
# 2174b2a8.. for green_share.py). The sampler records its own sha in every
# sidecar, so a drift between the two would be visible in the provenance rather
# than silent.
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: '1'
  HF_HOME: C:\Users\artvn\.cache\huggingface
  HF_HUB_DISABLE_XET: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '60'
  HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

steps:
- name: sample
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\wave-goblin-prep\goblin_ipa_sample.py
  - --harness
  - C:\banyan-farm\wave-goblin-prep
  - --root
  - C:\banyan-farm\wave-goblin-prep\repo
  - --refs
  - C:\banyan-farm\wave-goblin-prep\out
  - --out
  - C:\banyan-farm\goblin-ipa-0810\out6
  - --arm
  - wedge
  - --task
  - ep2-b04-goblin-ipa-wedge-0810

# allow_fail on purpose: a measurement that falls over must never retire eight
# rendered frames. The frames are the deliverable; the table is a convenience.
- name: green
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - C:\banyan-farm\wave-goblin-prep\green_share.py
  - baseline-tags-only|C:\banyan-farm\wave-goblin-prep\out\04-the-footnote-wave1-s*.png|sq
  - arm1-r0-all40steps|C:\banyan-farm\goblin-ipa-0810\out\04-the-footnote-ipa-r0-c060-s*.png|sq
  - arm3-r0-w015|C:\banyan-farm\goblin-ipa-0810\out3\04-the-footnote-ipa-r0-w015-s*.png|sq
  - arm3-r0-w025|C:\banyan-farm\goblin-ipa-0810\out3\04-the-footnote-ipa-r0-w025-s*.png|sq
  - arm6-r0-w010|C:\banyan-farm\goblin-ipa-0810\out6\04-the-footnote-ipa-r0-w010-s*.png|sq
  - arm6-r0-w020|C:\banyan-farm\goblin-ipa-0810\out6\04-the-footnote-ipa-r0-w020-s*.png|sq

- name: publish
  allow_fail: true
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - |
    import glob, hashlib, os, shutil
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b04-goblin-ipa-wedge"
    os.makedirs(dst, exist_ok=True)
    src = sorted(glob.glob("C:/banyan-farm/goblin-ipa-0810/out6/*"))
    lines = []
    for f in src:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b04-goblin-ipa-wedge.sha256"), "w") as fh:
        fh.write("\n".join(lines) + "\n")
    print("published", len(src), "file(s) + manifest ->", dst)
    # 8 stills + 8 sidecars.
    raise SystemExit(0 if len(src) == 16 else 1)

