success: 'ONE 832x1216 png that keeps round 2''s eye and loses round 2''s three regressions. KEPT FROM
  ROUND 2: K1 off-white sclera with NARROW VERTICAL SLIT PUPILS at 1:1; K2 the mandarin collar with its
  frog closure. RECOVERED FROM ROUND 1: P1 the muted sage palette -- no blue sky, no golden grass, no
  gold-trimmed armour; P2 NO RECTANGULAR HALO around the goblin, the background continuous across the
  IP-mask boundary; P3 the guard''s pointing hand is ARMOURED, not green goblin skin, and is aimed AT
  him rather than up and away; P4 dark boots, not sandals. HELD THROUGHOUT: exactly two figures on one
  ground line, goblin left and guard right; the guard five heads, armoured, helmeted, a head and a half
  taller; both full body in tall grass. The named degenerate outcome is THE GUARD THINNING OUT: his wording
  lost 4 tokens to pay for this, so if he comes back shorter than five heads, unhelmeted, or absent, the
  budget is the cause and the answer is ip-scale rather than another wording round.'
why: 'ROUND 2 FIXED THE EYE AND BROKE THREE OTHER THINGS, ALL FROM ONE BAD TRADE, AND THIS ROUND UNDOES
  THE TRADE WITHOUT UNDOING THE FIX.


  Round 2''s one variable was the eye clause and it worked: `white eyes, constricted pupils` plus `round
  pupils, big round eyes` in the negative produced canon slit pupils where round 1 had round green eyes.
  It is kept verbatim here, negative included.


  What it cost was paid in the wrong currency. To fit 5 tokens of eye into 77, round 2 dropped `muted
  color` and `boots`, reasoning that round 1 proved them unnecessary because the palette and boots came
  back right. They came back right BECAUSE those terms were there -- the absence of a defect is not evidence
  the guard against it is idle. The result was a warm palette, sandals, a guard hand made of green goblin
  skin, and A VISIBLE RECTANGULAR MASK HALO around the goblin. The halo is the interesting one: the IP
  mask and ip-scale are IDENTICAL to round 1, which has no halo, so the box is not a mask fault -- it
  is the masked region holding the reference''s muted palette while everything outside went warm, drawing
  the boundary.


  WHAT THIS JOB DOES: restores `muted color` and `boots` and buys the 4 tokens back from THE GUARD CLAUSE
  only, which is the one place in the prompt duplicating work the skeleton already does -- his stature,
  position, facing and raised arm are all in the openpose canvas at scale 1.0. Nothing else moves: not
  the eye clause, not the negative, not the skeleton, not the mask, not ip-scale, not the seed.


  IT IS ALSO A TEST OF THE HALO DIAGNOSIS, and a free one. If the halo is a palette split, a muted palette
  removes it with the mask untouched. If it survives, the diagnosis was wrong and the next lever is ip-scale,
  not words.'
