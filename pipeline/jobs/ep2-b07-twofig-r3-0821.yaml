halo_diagnosis_under_test: 'PRE-REGISTERED, AND THE JOB IS ITS OWN EXPERIMENT AT NO EXTRA COST. CLAIM:
  round 2''s hard-edged rectangle around the goblin is not an IP-Adapter mask fault but a palette discontinuity
  across the mask boundary -- inside kept the reference''s muted sage, outside went warm once `muted color`
  was dropped. EVIDENCE FOR IT ALREADY IN HAND: round 1 used the SAME mask at the SAME ip-scale and has
  no halo, and the mask box was separately verified correct by drawing 87,485,412,763 on round 1''s output,
  where it contains the whole skull, both ears and the face. FALSIFIABLE HERE: restoring `muted color`
  with the mask untouched should remove the box. IF THE HALO SURVIVES, this diagnosis is wrong, the mask
  or ip-scale is implicated after all, and the next lever is ip-scale -- not a fourth wording.'
not_done_on_purpose: 'THE NEGATIVE IS NOT TOUCHED, including the temptation to ban the green hand by name.
  `green hands` cannot be banned on a plate whose protagonist has green hands, and the leak is predicted
  to be a symptom of the palette rather than a fault of its own -- banning a symptom would also destroy
  the test above. G5 IS STILL NOT ADDRESSED: the arm reads more extended than the authored mid-raise,
  which is a skeleton edit (ARM_ELB / ARM_WRI in pipeline/author_b07_twofig_skel_0821.py) and would be
  a second variable. AND NO MOTION IS FILED BY THIS JOB -- the beat 07 motion rung waits on a human opening
  this png, which is the same rule that kept it unfiled through two rounds.'
the_mistake_this_round_corrects: 'STATED PLAINLY BECAUSE IT WAS THIS LANE''S, AND BECAUSE THE SHAPE OF
  IT WILL RECUR. Round 2''s spec argued: "round 1 shows none was load-bearing: the palette, the render
  quality and the boots all came back correct, and not one of the three dropped negatives fired." That
  is an inference from a clean result to a redundant cause, and it is invalid whenever the cause is what
  produced the clean result. In a fixed token budget every addition is a subtraction, so the question
  is never "did this term fire?" but "what was this term holding?" -- and the only way to answer it is
  to look at what the term describes, not at whether the picture was fine while it was present.'
the_one_variable: 'THE PROMPT''S BUDGET ALLOCATION, and nothing else in the job. RESTORED: `muted color`
  and `boots`. PAID FOR BY the guard clause alone -- "and one tall armored city guard in a helmet at right,
  facing him, arm rising to point" becomes "tall armored guard, helmet, at right, arm rising to point
