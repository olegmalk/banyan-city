  aim that round 2''s hand got wrong. Positive 76 of 77, counted with animagine-xl-3.1''s own vocab. HELD
  BYTE-FOR-BYTE: round 2''s eye clause, round 2''s ENTIRE negative, the two-figure skeleton jerry-guard-twofig-0821.png
