bar: "TEN PLATES, JUDGED AS ONE CONTACT SHEET, BY EYE AT 1:1. THERE IS NO\nPLANT AND NO FIGURE IN ANY\
  \ OF THESE PICTURES AND BOTH ABSENCES ARE CORRECT.\n  D1 CEL, NOT PHOTO, NOT PAINTING. Flat fills, clean\
  \ ink linework, the\n     episode's dialect. This is the clause the ep2-b16-field batch lost all\n \
  \    four on, and it is the first one read. Bokeh, painterly rendering or a\n     photographic ground\
  \ plane REJECTS the plate -- you cannot draw a sharp\n     cel seedling into a soft foreground without\
  \ it reading as a decal.\n  D2 A CLEAN DRAWABLE GROUND PLANE in the lower centre, wide and tall enough\n\
  \     to root a sapling at plate scale. Blades of grass crossing it are fine.\n     A rock, a flower,\
  \ a shrub, a drawn plant or any structure is NOT: the\n     0.30 pass PRESERVES a structure it finds\
  \ in the init (12 of 40 steps from\n     a latent that still carries it), so the composite would have\
  \ to fight it.\n  D3 ZERO FIGURES. Not a goblin, not a human, not an animal, not a silhouette\n    \
  \ on the horizon. A plate with any figure in it is REJECTED AND DELETED,\n     not cropped -- this lane\
  \ may not render the scavenger and a frame that\n     contains him is not curated into a training set.\n\
  \  D4 THE LIGHT HAS A DIRECTION. beat16_sapling_composite.py measures the\n     plate's own low-pass\
  \ luminance gradient and carries it into the drawn\n     plant. A flat, directionless plate makes that\
  \ measurement a no-op and\n     the composite reads as pasted.\n  D5 THE PALETTE IS THIS SHOW'S. The\
  \ composite samples its greens FROM THE\n     PLATE, so an off-palette plate produces an off-palette\
  \ sapling and the\n     frame teaches the LoRA the wrong colour.\nNOT SCORED: whether the picture is\
  \ a good shot. None of these is a shot, none\nenters a cut, and none goes near review/ep2-ship-0821.\
  \ They are ground planes\nfor an instrument.\nNOT SCORED: variety WITHIN a cell. The variety this batch\
  \ is bought for is\nBETWEEN cells and it is measured at the manifest, not here."
the_one_variable: THE SCENE/LIGHTING CLAUSE ('in tall grass, sunlight, day') AND THE SCALE CLAUSE ('close-up,
  low angle, ground level'). The quality prefix, `no humans`, the negative, the checkpoint, the size,
  the steps, the cfg, the nocontrol arm and its 0.45 scale are ep2-b04-tilefix-w2-0820's. The seed walks
  so the set is not seed-degenerate.
this_cell: CONTROL. The ratified recipe's own location clause and the tightest scale. Nearest cell to
  a picture this checkpoint has returned fourteen times; if THIS one breaks dialect the cause is `no humans`,
  not the scene words, and the whole route changes.
not_a_beat: 'beat: 16 is carried for the queue''s bookkeeping and for one honest reason beyond it -- beat
  16''s own restage needs a goblin-free cel field plate and has never had one, so a passing plate here
  is reusable there. It does not make this a beat render: no shot is authored, no script line is served,
  nothing is promoted and the founder''s card /review/ep2-b16-leaf-0820 is untouched.'
goblin_free_by_construction: 'THE SCAVENGER''S AGE IS R4-GATED AND THIS LANE RENDERS NOTHING THAT CONTAINS
  HIM. The positive prompt carries `no humans` and not one figure tag -- no `1other`, no `colored skin`,
  no `green skin`, no `bald`, no cloak, none of the seven face tags. The negative names the figure as
  a second line of defence only; negatives have failed to hold position in this tree three for three,
  so the guard that is actually load-bearing is bar clause D3: a frame with any figure in it is REJECTED
  AND DELETED rather than curated.'
one_sample_rule: 'SATISFIED BY THE PARENT ON THE RECIPE, AND THE BATCH IS THE SAMPLE ON THE WORDS. ep2-b04-tilefix-w2-0820
  is the ratified still recipe, sampled fourteen times on 2026-08-20 and re-used unchanged across twelve
  Jerry tileset poses and four b16 field plates that are all on disk. Nothing about the recipe moves here.
  What moves is the PROMPT, and a batch of ten backdrops is the plate batch episode-loop-v2 step 1 asks
  for, at the breadth the gate asks for. THE DIALECT RISK IS REAL AND IS PRICED: if all ten break cel
  the loss is 30 minutes of otherwise-idle card and the route moves to cropping the pre-composite beat
  plates, which is written into failure_predicted_in_advance rather than discovered. p01 is the control
  cell and it is the first one read.'
failure_predicted_in_advance: 'FIRST AND MOST LIKELY: `no humans` DOES NOT BUY AN EMPTY FRAME, IT BUYS
  A LANDSCAPE. It is the same gravity `scenery` had -- both are tags that in the base model''s training
  data label vistas -- and if all six come back as wide painterly country, the fix is not a seventh wording:
  it is to composite onto the PRE-composite beat plates that are already in the right dialect and crop
  the figure out, which costs a crop and no GPU.

  SECOND: D2, THE CLEAN GROUND PLANE, on the close cells. `tall grass` at 832x1216 puts its biggest sharpest
  blades exactly in the near foreground and that is where the sapling roots. p01/p03/p05 are the exposed
  cells; if all three lose D2 and the medium cells hold it, the dataset''s close scale comes from CROPPING
  a medium plate, which beat 09 proved survives downstream at 2.157x LANCZOS.

  THIRD, AND IT WOULD CHANGE THE GATE READING RATHER THAN THE RECIPE: p05 the creek comes back with water
  the composite cannot light against. That is a real answer about how far the scene axis can be pushed
  and it is why the furthest cell is in the first six instead of being discovered at frame twenty.'
gate_this_serves: 'pipeline/lora/README.md, the sapling section: ''>=20 composited saplings spanning distinct
  scenes, scales and lighting'', with scale and leaf count kept as caption VARIABLES (trigger `bnysapling`,
  pipeline/research/character-lora-sdxl-0820.md section 4) so one LoRA serves a protagonist who grows
  15cm -> 1.6m across seven episodes. TEN PLATES IS NOT THE GATE and this batch does not claim to clear
  it; it is the first ten ground planes of the scene/lighting breadth the gate asks for and the existing
  ~23 do not have. Seven distinct scenes, five lighting states and three scales -- against five near-identical
  tall-grass scenes today.'
governance_flag_not_resolved_here: 'DECISIONS.md item 18 reads ''Never train on the output. No LoRA, no
  finetune, no distillation.'' The Jerry LoRA is in training under a later ruling and pipeline/lora/README.md
  writes the sapling gate as live work, so item 18 appears superseded in practice -- but this lane did
  not resolve it and must not. NOTHING FILED HERE TRAINS ANYTHING: these are $0 plates, and the composites
  and captions that follow are $0 files. Training is a separate, gated act and the contradiction is raised
  for the founder before it happens.'
