consumer: 'THE PLATE BEAT 07''S MOTION SPEC GETS FILED OFF IF IT IS NINE OF NINE -- that is the standing
  agreement and the motion rung is written the moment a human confirms this plate. Beat 07 is the only
  one of the wave''s four failed beats with no round-2 clip at all, because no plate has yet been good
  enough to animate. SECOND CONSUMER: the finding itself. Round 4 showed the adapter carries eye SHAPE
  and words carry eye COLOUR; if putting exactly those two words back closes the gap without costing the
  guard, that division of labour becomes a reusable rule for every two-character plate in this show.'
success: 'ONE 832x1216 png that is NINE OF NINE. THE TWO THIS ROUND IS FOR: E1 off-white sclera, not a
  green iris filling the eye; E2 eyebags present under both eyes. THE SEVEN ROUND 4 ALREADY WON, and a
  regression on any of them FAILS this round even if E1 and E2 land, because round 4 would then be the
  better plate: E3 narrow vertical slit pupils; A2 no bobblehead at an identical crop box; A3 no containment
  bleed beyond round 4''s faint pre-existing ring ghosting; G1 exactly two whole figures on one ground
  line; G2 THE GUARD IN A CLOSED HELMET, human; G3 five heads, a full head taller, full plate; G4 armoured
  gauntlet, no green hand; P1 muted sage palette, no mask halo, dark boots. The named degenerate outcome
  is THE GUARD PAYING AGAIN: six tokens of goblin went back into a 77-token budget and one came out of
  the goblin''s own pose clause, but if the guard loses his helmet or his species anyway, the budget is
  the cause and the answer is not a sixth wording round.'
why: 'ROUND 4 SPLIT THE FACE INTO WHAT THE ADAPTER HOLDS AND WHAT THE WORDS HELD, AND THIS PUTS BACK EXACTLY
  THE SECOND HALF.


  With every goblin face word deleted and ip-scale at 1.25, round 4 returned the species, the bald skull,
  the large pointed ears, the skin AND narrow vertical slit pupils -- the hardest feature in the canon,
  which six k-ladder wording rungs never reached. It did not return the off-white sclera, which came back
  as a green iris, or the eyebags. That is a clean decomposition and it names its own next rung: `white
  eyes, eyebags`, and nothing else.


  IP-SCALE STAYS AT 1.25. Round 4 was gated on k2''s bobblehead and it DID NOT FIRE -- at an identical
  crop box the head is the same size relative to the body as at 1.0, if anything smaller, and the faint
  ring ghosting is equally present in round 3 at 1.0 so it is not a scale artefact. The scale is what
  is buying the slit pupil now that the words are gone, so walking it back would undo the thing that worked.


  ONE TOKEN HAD TO MOVE AND IT IS DISCLOSED. `white eyes, eyebags` measures SIX tokens, not the four this
  lane estimated when it reported five free; 72 + 6 is 78, one over. `arms at sides` is dropped to make
  room because the openpose skeleton states it outright -- the goblin''s arms hang at his sides in the
  canvas at controlnet scale 1.0 -- and because that is the SAME argument round 4 used to shorten the
  guard''s clause, which came back correct. Dropping it lands at 74 of 77 instead of sitting exactly on
  the ceiling with no margin, and a silently dropped tail has already cost this lane a round today.


  EVERYTHING ELSE IS BYTE-IDENTICAL to round 4: the negative, the skeleton and its sha, controlnet scale
  1.0, the reference, the mask, the adapter weight, ip-scale and the seed.'
