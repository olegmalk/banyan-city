failure_predicted_in_advance: 'THE GUARD PAYS AGAIN, and it is the whole risk of this round. Six tokens
  of goblin went back into a fixed budget. One came out of the goblin''s own pose clause rather than the
  guard''s, which is the entire reason `arms at sides` was chosen -- but the guard clause is long and
  it is the first thing a tokeniser squeeze has taken twice already (round 3 lost his helmet and his species
  that way). IF HE COMES BACK BARE-HEADED OR GREEN, the trade failed and round 4 is the better plate.
  SECOND: the adapter at 1.25 and `white eyes` may now DOUBLE UP on the eye and flatten it -- the negative
  still carries `blank eyes, no pupils`, and a sclera pushed too hard with the slit pupil lost would be
  an E1 win that fails E3, which is why E3 is on the scored list and not assumed.'
ip_scale_1_25_carried_from_round_4: IP-SCALE 1.25 IS SAFE ON THIS REFERENCE AND THIS MASK, and that is
  round 4's most transferable result. k2 (ep2-jerry-face-k2-0821) predicted that raising adapter strength
  against a reference that is 100% head would inflate the head, and named containment breaking as the
  outcome that stops the route. NEITHER FIRED. Measured the way the bar asked -- an IDENTICAL crop box
  across rounds 1, 3 and 4 so head size cannot be a framing artefact -- round 4's head at 1.25 is the
  same size relative to his body as rounds 1 and 3 at 1.0, if anything marginally smaller. The faint concentric
  ring ghosting around his head is equally present in round 3 at 1.0, so it is pre-existing rather than
  scale-induced. The dial has more room than the k-ladder's 0.7 -> 0.9 experience implied.
not_done_on_purpose: 'THE COLLAR FROGGING IS NOT BOUGHT. Round 4''s frog closures degraded into plain
  round buttons, and a term for them would have cost the guard''s clause, which is worth more. It is watched
  and reported rather than scored. THE SKELETON IS NOT TOUCHED, so G5 -- the arm reading more extended
  than the authored mid-raise -- remains open and remains not this round''s question. AND NO MOTION SPEC
  IS FILED BY THIS JOB: it is filed AFTER a human confirms nine of nine, which is the rule that has kept
  the card off an off-canon character for four rounds.'
the_one_variable: 'THE TWO WORDS ROUND 4 PROVED THE ADAPTER DOES NOT CARRY: `white eyes` and `eyebags`,
  added to the positive. HELD BYTE-FOR-BYTE: the entire negative, the two-figure skeleton jerry-guard-twofig-0821.png
  at the same sha, xinsir/controlnet-openpose-sdxl-1.0 at scale 1.0, jerry-canon-sq45-0821.png, the IP
  mask 87,485,412,763, ip-adapter-plus-face_sdxl_vit-h, --ip-scale 1.25, and seed 20260899. ONE FURTHER
  CHANGE, DISCLOSED RATHER THAN BURIED: `arms at sides` is removed, because the two words cost SIX tokens
  and not the four estimated, and 72 + 6 = 78 is over the ceiling. It is the phrase openpose states most
