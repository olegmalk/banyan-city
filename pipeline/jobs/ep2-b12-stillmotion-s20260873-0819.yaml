  FAIL-PALETTE: 'the warm-to-cool shift survives at crf 10, i.e. the shipped fault is not the flag''s. A real and
    useful negative result: it would move the cause to the prompt or the plate.'
  FAIL-INTRUDER: a goblin, hand, face or figure enters frame. His line forbids it.
  FAIL-PLANT-CHANGE: a leaf appears, vanishes, wilts or grows.
  FAIL-CAMERA: a real, region-consistent camera move.
  FAIL-BLOOM: luminance climbs across the clip the way beat 01's crf-33 take did (85 -> 148.4). The flag is supposed
    to prevent this; if it arrives anyway the finding is about the flag, not the beat.
