failure_predicted_in_advance: 'FAIL-DEAD IS THE MOST LIKELY OUTCOME AND IT IS NAMED SO THAT A PASS MEANS SOMETHING.
  Beat 18 is the closest beat in the repo to this one by shot class -- a macro whose content is fine high-frequency
  movement -- and at crf 10 it went from an interframe median of 5.956 to 0.570 and was scored FAIL-FROZEN. If that
  happens here the clip is a still image with a file extension, and ''perfectly still'' does not mean ''a still'':
  the line''s own ''only the grass stirs'' is what separates the two, which is why M2 measures the grass band separately
  rather than measuring the frame. If FAIL-DEAD fires, the lever is NOT another crf value -- it is this beat''s
  own prompt, which currently asks for stillness with the whole of its first sentence, and the shipped take''s crf-33
  clip remains in the cut untouched meanwhile.'
