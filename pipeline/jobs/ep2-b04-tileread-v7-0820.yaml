success: 'ONE 832x1216 png for rung v7 (AXIS B - + SKIN (two-tone / shiny / no eyebrows) - the full recipe).
  Identity clause: ''1other, solo, colored skin, green skin, bald, patchwork cloak, blank eyes, tsurime,
  jitome, no nose, closed mouth, :|, expressionless, two-tone skin, shiny skin, no eyebrows''. Everything
  else is identical across all eight rungs -- seed 20260820, one shared negative, one scene clause, one
  quality prepend, same sampler numbers. Judged against the six-clause tile bar pre-registered in this
  spec BEFORE the render existed.'
why: RUNG v7 OF AN EIGHT-RUNG TILE-READ WEDGE. AXIS B - + SKIN (two-tone / shiny / no eyebrows) - the
  full recipe. The founder ruled 2026-08-20 night that the goblin must read as the B tile's CREATURE and
  that `adult` in canon was steward drift. Beat 19 IS that tile and beat 15 is the next-best match in
  the cut, and BOTH came off the same man-read string -- wide, with `close-up` negated -- so framing,
  not wording, is what separates the creature from the man today. A recipe that only works at distance
  is an avoidance, so this ladder asks what the positive clause is worth AT THE CLOSE-UP. Every tag in
  it is a Danbooru tag with a post count behind it; the ones this lane invented on the first pass are
  listed in `outside_research` with why they cannot work.
bar: "PRE-REGISTERED BEFORE THE RENDER, read at 1:1 beside\nreview/ep2-goblin-design-0819/adult-b19-0819.jpg.\
  \ Six clauses, and the first\nfour are what \"the creature, not a man\" means:\n  T1 EYES      blank\
  \ white, no iris and no pupil drawn, narrow and upslanting.\n  T2 NOSE      no bridge, no tip, no drawn\
  \ nostrils.\n  T3 AGE       no brow furrows, no nasolabial folds, no jowls. A smooth mask.\n  T4 EARS\
  \      ear length under about a third of head height, low and swept\n               back. LONG TAPERING\
  \ SPIKES ARE A FAIL on this clause even though\n               four beats in the shipping cut have them.\
  \ NOTE, because it\n               changes how this clause should be read: Danbooru has NO tag for\n\
  \               the tile's ear, so no rung can ask for it -- T4 measures whether\n               omitting\
  \ every ear tag plus negating the spike tags is enough.\n  T5 SKULL     large smooth dome; no neck reading\
  \ as a distinct cylinder.\n               `no neck` has 36 posts, i.e. is untrained, so this is likewise\n\
  \               unaskable and only observable.\n  T6 COLOUR    two-tone, crown lighter than the muzzle.\n\
  PASS = the FIRST rung that takes T1-T4 at the close framing. T5/T6 reported.\nNOT A CLAUSE, and stated\
  \ so nobody scores it: whether the resulting creature is\nGOOD. That is R4 and it is the founder's.\
  \ This measures fidelity to a picture he\nhas already ruled, which is a comparison anyone can check."
failure_predicted_in_advance: 'v0 FAILS T1-T3 -- an adult human male face, which is the defect

  as it ships. v1 PASSES T1-T3 on framing alone; if it does not, the framing

  finding is wrong and that is the most valuable single result in the batch.

  AXIS A is the one nobody can predict from a source: no published work says what

  `1boy` present / absent / `1other` does to species in this model family, and

  `1boy` is the largest single attractor in the prompt at 2.1M posts. My inference,

  flagged as inference, is that DROPPING it (v3) beats substituting it (v4).

  THE HIGHEST-YIELD SINGLE FEATURE RUNG IS PREDICTED TO BE v5 (the eyes), because

  a blank-eyed face reads non-human before any other feature is parsed, and

  `blank eyes` is the one tag in this whole vocabulary that means exactly what the

  tile shows.

  THE MOST LIKELY WAY THE WHOLE LADDER FAILS, written down so a failure cannot be

  re-narrated afterwards: every rung comes back a human face wearing the tags as

  SURFACE DECORATION -- blank contact lenses on human anatomy, green paint on a

  human skull -- because `colored skin` and `blank eyes` are attributes the model

  has only ever seen ON humanoid faces. T4 is the clause most likely to fail

  everywhere, since no rung is even able to ask for the right ear. If eight rungs

  show that, THE WORDING ROUTE FOR THE CLOSE-UP IS CLOSED and the answer is a

  reference route -- a LoRA trained on tile-faithful frames, or IP-Adapter off the

  tile itself -- which is a larger, slower instrument and should not have been

  reached for first.'
init_provenance: 'NONE, and that is the design. No init image, no mask, no IP-Adapter, no reference set,
  no control hint: txt2img, so the only thing on the canvas is what the wording put there. --control/--control-sha256/--scale
  are carried byte-identical from the parent and are INERT on --arm nocontrol (controlnet_plate.py:592
  -- every use is inside `if use_cn:`), kept rather than deleted so the derivation stays one-variable
  against its parent.'
one_sample_rule: SATISFIED. The 2026-08-03 rule is one sample per RECIPE CHANGE and forbids scaling an
  unapproved recipe across a set of beats. This is eight DIFFERENT recipes at ONE sample each, on ONE
  beat, nothing promoted -- the shape of the step sweep and the shake A/B, not the shape of K.
outside_research: "OUTSIDE RESEARCH, 2026-08-20, and it overturned this wedge's first\ndraft rather than\
  \ confirming it. animagine-xl-3.1 model card + Danbooru tag\ndatabase (counts via safebooru.donmai.us/tags.json).\
  \ What it changed:\n  * `blank eyes` (18,467) is the tile's eye exactly -- \"missing both the irises\n\
  \    and pupils; only the sclera are present\". `no pupils` KEEPS THE IRIS and\n    `white eyes` keeps\
  \ iris AND pupil; both were in draft 1 and both are wrong.\n  * `tsurime` (64,520) + `jitome` (49,408)\
  \ are the eye SHAPE, which draft 1 had\n    no tags for at all.\n  * `lipless mouth`, `flat mouth`,\
  \ `straight mouth` DO NOT EXIST. `:|` (14,379)\n    is the only real tag for the tile's single thin\
  \ line.\n  * THERE IS NO TAG FOR THE TILE'S EAR. `short pointy ears` = 0 posts,\n    `round ears` absent,\
  \ `long ears` is an ALIAS TO `pointy ears`. The only\n    sourced lever is naming no ear tag and negating\
  \ the spikes.\n  * `smooth skin` = 0 posts (untrained). `shiny skin` 156,330 and\n    `two-tone skin`\
  \ 18,474 are real; two-tone IS the tile's gradient.\n  * `goblin` (4,326) FIGHTS US -- its own wiki\
  \ defines \"pointy noses and ears\".\n    `monster boy` is worse: \"a human face and torso\". Both are\
  \ out of the\n    positive from v2 up; `monster boy` is in the negative.\n  * `1other` (126,608) is\
  \ GENDER-ambiguity, not species, at 6% of `1boy`'s\n    2,100,960. Nobody has published what the swap\
  \ does, so all three are sampled.\n  * Ban et al. ECCV 2024 (arXiv:2406.02965): a negative acts only\
  \ after the\n    positive renders the thing, and applying one too early SUMMONS it.\n    Alhamoud et\
  \ al. CVPR 2025 (NegBench): CLIP barely parses \"no\"/\"not\". So\n    `no nose` works as a TRAINED\
  \ TAG STRING, not as a negation -- which is\n    precisely why inventing `lipless` could never have\
  \ worked, and why the work\n    here is in the positive with the negative as a backstop.\nNOT ADOPTED\
  \ AND NAMED: the card recommends CFG 5-7, steps <30, Euler a. This\nwedge runs 40 steps at cfg 7.5 because\
  \ that is what the TILE was rendered at\n(b19-sapgloss-s20260819). Matching the target's own sampler\
  \ beats matching the\ncard here, and a sampler rung is a separate one-variable question."
run_1_was_refused_and_the_refusal_was_right: 'The first filing of these eight (2026-08-20 17:48Z) died
  rc=9 in four seconds each, $0, no weights loaded: the shared negative ran 126 tokens against CLIP''s
  77 and the driver refused rather than let diffusers truncate it silently. Truncation would have dropped
  the back half -- the man-read suppressors, the whole point -- and eight pictures would have come back
  looking like an answer. This deriver now refuses to author a spec whose strings do not fit.'
the_one_variable: Seed, checkpoint, steps, cfg, size, scene clause, quality prepend and the whole negative
  are identical in all eight. v0/v1 move FRAMING and nothing else. v2/v3/v4 move the SUBJECT TAG and nothing
  else. v5/v6/v7 add one feature clause each to the v4 base. Two axes, kept apart.
