owner: goblin-design audit lane, 2026-08-20 night
consumer: THE RECIPE, NOT THE BEAT. The seven-beat design wave (02 03 04 07 08 13 20) cannot be authored
  until a wording puts the B tile's creature on the canvas at a CLOSE-UP on purpose. This rung is one
  sample of one candidate wording; beat 04's framing is the test bed because it is the tightest crop in
