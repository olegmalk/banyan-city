why: 'ONE SAMPLE, ONE VARIABLE. Every argument below is byte-identical to
  ep2-goblin-freeze-w015-0814 except --refs, --ref-prefix and --out, so the sixteen frames this
  draws are a true A/B against the forty-eight frames refs-goblin-approved-0814 has already
  produced on this beat.

  WHAT CHANGED AND WHY. The founder picked goblin design #1 on 2026-08-14 and warned that "some of
  the heads in the reference are dismorphed or something". Of the four d1 seeds only s1 is sound
  (sha256 389c7637..., published on origin/farm-results-rtx5090 as
  farm-out/ep2-goblin-design-d1-0814/04-the-footnote-wave1-s1.png; the file is NOT on main). s0, s2
  and s3 are rejected -- s3 droops a pelican jowl on every head, s0 melts the midface on roughly
  four of nine, s2 carries a faceless egg-head, a beaked profile and Japanese onomatopoeia that
  would leak into anything conditioned on it. NO TILE FROM s0, s2 OR s3 IS IN THIS SET.

  THE SET IS FOUR CROPS OF s1 AND NOTHING ELSE, and the mapping is recorded BY HASH because a
  prior lane lost a day to an s0/s1 position mix-up and position is not evidence:

    goblin-d1s1-s0.png  dd4b30cd..  crouch A, knees up, mouth open
    goblin-d1s1-s1.png  c51c6467..  crouch B, knees up, eyes closed
    goblin-d1s1-s2.png  9526882e..  standing full body, hands on hips
    goblin-d1s1-s3.png  d84abe2f..  bust, three-quarter

  all four cut from the ONE source file sha256 389c7637..., and the full slot -> source-crop-box ->
  sha256 table is frozen at pipeline/refs/refs-goblin-d1-0815.yaml.

  WHAT THE OLD REFERENCE WAS DOING. refs-goblin-approved-0814 carries no blush -- the blush sets
  (refs-goblin-frozen-0812, refs-goblin-head-0812, refs-charref-goblin-0812,
  refs-charref-goblin-scope-0812, all 2026-08-12) are already retired -- and it is STILL the most
  infantile reference we own: roughly four heads tall, oversized bald cranium, stubby limbs,
  toddler stance. It is what beats 02, 03, 04, 07, 08, 13, 14, 15, 16, 17, 19 and 20 currently
  point at. All four d1 seeds read markedly more adult. That is the claim this sample tests.

  POSES, NOT PORTRAITS (body-position ruling, 2026-08-15). A reference has to answer WHERE IS HIS
  BODY at the start of the beat, not only what the character looks like, so two of the four slots
  are the two sound KNEES-UP CROUCHES from s1 -- the pose the chain needs for beats 03, 04, 07, 08
  and 12 -- one is the standing full-body that beats 17-end to 20 need, and one is a bust for the
  face. The bad mid-centre profile tile, whose mouth floats as a red dot on the cheek, is excluded.

  NOT A LICENCE TO SCALE. Eleven other goblin beats stay on refs-goblin-approved-0814 until this
  frame is opened.'
