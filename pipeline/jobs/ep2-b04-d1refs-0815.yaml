success: Sixteen frames read beside ep2-goblin-freeze-w015-0814's sixteen, which used the SAME beat,
  the SAME draft key, the SAME arm and the SAME seeds. Pass is a goblin who reads ADULT-ish -- a
  young dumb goblin, not cute, not old, and above all NOT A BABY. The failure worth reporting is
  the infantile read surviving the reference swap, which would mean the baby is coming from the
