bar: 'THE BEAT''S OWN done_when, PLUS THE ONE THING THIS RUNG CHANGED. PRE-REGISTERED: (1) EXACTLY TWO
  AVERAGE LEAVES ON ONE STEM, IN THE FIRST FRAME AND IN THE LAST. This is the whole point. ONE GIANT LANCE-SHAPED
  LEAF standing straight up is what the take in the cut shows, and either that shape or a third leaf coming
  back is a FAIL however well the clip moves. Canon: sapling-two-leaves and sapling-cotyledon-shape. (2)
  THE TILT, MONOTONE, AND IT STOPS. The parent take is the only clip in episode 2 whose definition is
  fully met and this is the clause that was measured: the leaf tilts steadily in ONE direction over about
  ninety frames, with no oscillation and no reversal, and then it stops. A two-leaf plant has two blades
  to tilt, so the honest reading is THE PLANT tilting as one thing. (3) THE PLANT DOES NOT DRIFT, MULTIPLY
  OR REROOT. (4) THE FRAME HOLDS. No pull-back, no re-framing -- the wave''s first law is that a prompt
  naming an object its init lacks makes the model build it and re-frame the shot, and this init now CONTAINS
  every object the sentence names, so a re-frame here would be a new finding rather than that one. PRE-REGISTERED
  FAIL MODES. THE INIT ABANDONED, which is what both parents did -- b12''s take cuts away from its macro
  plate by f006 and beat 21''s verdict says ''from f007 the init is entirely gone''. If the two leaves
  survive past f010 that alone is new. THE LEAVES ROUNDING BACK toward discs over the clip, which would
  say the model''s prior for a seedling beats the init and the fix is not the compositor. And on beat
  12 only, THE CLOUD SMEAR: the naturalize left a horizontal boundary-fill band across the cumulus and
  it is carried in deliberately; if 121 frames of LTX repaint it, that is the cheapest possible answer
  to whether the erase needs re-cutting.'
