# NO `allow_fail` ON PUBLISH, DELIBERATELY, AND THIS IS A DEPARTURE FROM THE CONTROL.
# The control carried `allow_fail: true` on this step while its last line asserts
# `SystemExit(0 if len(src) >= 16 else 1)` -- so the frame-count assertion was
# NEUTERED and a publish that copied nothing could still read as a clean job. That
# is one of the four ways tooling lied on 2026-08-17. The assertion keeps its teeth
# here: if fewer than 16 frames land, this job is FAILED and says so.
- name: publish
  argv:
  - C:\banyan-farm\venv\Scripts\python.exe
  - -c
  - "# THE GLOB CARRIES THE BEAT SLUG (01-cold-open). Without it the glob matches\n# nothing and the step\
    \ publishes nothing while returning a code that reads like\n# a render failure. farm-out is not gitignored,\
    \ so the runner pushes these itself.\n# The manifest is written from the files ACTUALLY COPIED, and the\
    \ sha is read back\n# off the COPY at the destination -- a publish step has written a manifest for\n\
    # files it never copied before.\nimport glob, hashlib, os, shutil\nout_dir = \"C:/banyan-farm/goblin-ipa-0812/out-b01-nodecount-0817\"\
    \ndst = \"C:/banyan-farm/courier-box/farm-out/ep2-b01-nodecount-0817\"\nos.makedirs(dst, exist_ok=True)\n\
    src = sorted(glob.glob(out_dir + \"/01-cold-open-ipa-r*-w015-s*.png\")\n             + glob.glob(out_dir\
    \ + \"/01-cold-open-ipa-r*-w015-s*.yaml\"))\nlines = []\nfor f in src:\n    shutil.copy2(f, dst)\n\
    \    c = os.path.join(dst, os.path.basename(f))\n    with open(c, \"rb\") as fh:\n        h = hashlib.sha256(fh.read()).hexdigest()\n\
    \    lines.append(h + \"  \" + os.path.basename(f))\nwith open(os.path.join(dst, \"ep2-b01-nodecount-0817.sha256\"\
    ), \"w\", newline=\"\\n\") as fh:\n    fh.write(\"\\n\".join(sorted(lines)) + \"\\n\")\npngs = [f for\
    \ f in src if f.endswith(\".png\")]\nprint(\"published\", len(src), \"file(s),\", len(pngs), \"png ->\"\
    , dst)\nraise SystemExit(0 if len(pngs) >= 16 else 1)\n"
