consumer: 'The count-control question on the plant beats, which is the most repeatable defect in them.
  This rung exists because its control''s own verdict was RE-READ and the mechanism inverted. The geometry
  rung scored 2 of 16 on exact count -- a real null by its pre-registered rule -- but at full resolution
  its clean cells show the clause BOUND AND BOUND WELL: stems carry swollen node joints and at EVERY node
  there are exactly two leaves, opposed, one either side. What `opposed one either side of the stem` never
  constrained is HOW MANY NODES THE PLANT HAS, so the model honoured the arrangement and stacked it two or
  three times up the stem. Eight cells each obeying "opposed, one either side" returned four to six leaves.
  The clause describes A NODE, not a plant, so it was never a count constraint and could not have been.
  NODE COUNT is the free variable that exposed and this is the only job that names it. Named before any
  pixel is drawn, per the no-work-without-a-consumer rule. NOTE HONESTLY WHAT THIS IS NOT THE ONLY ROUTE
  TO: composite-then-inpaint at 0.30 already delivers exact two-leaf count 8 of 8 with zero GPU spent on
  the count, so count is SOLVED for any beat where a composited init can be built. This rung matters for
  the case that route does not cover -- a plate generated fresh, where a prompt that yields a correct-count
  init is what removes the compositing step. That is a smaller consumer than the control had and it is
  stated as smaller rather than inflated.'
why: 'THE ONE VARIABLE IS A PURE ADDITION, which is what makes it provable rather than asserted.
  ` at one node` is appended to the control''s leaf clause: `wide oval cotyledon leaves opposed one either
  side of the stem` becomes `wide oval cotyledon leaves opposed one either side of the stem at one node`.
  The control clause survives CHARACTER FOR CHARACTER. Everything else is byte-identical -- the purple fig
  clauses, `green at its neck`, the scale relation `no taller than the grass around it`, the style tail,
  the reference set, the arm, the seeds, and the ENTIRE negative including `no three leaves, no four leaves,
  no many leaves`. Those negatives STAY: removing them would be a second variable and the comparison would
  stop being real. pipeline/insert_b01_nodecount_0817.py proves the single variable MECHANICALLY -- it
  builds the draft as `control.replace(OLD, OLD + " at one node")`, refuses unless the length delta is
  exactly the addition, then RE-PARSES the file and refuses unless the new value matches and the control is
  still byte-identical. A matching byte delta is not proof of a correct edit; the parsed comparison is.
  `a single node` MEASURED FINE (74/77, anchor True) AND WAS REJECTED ANYWAY: it REPLACES `the stem` rather
  than adding to it, so a win with it could not be told apart from a change of referent.
  THE PREDICTION IS PRE-REGISTERED AND IT IS NOT OPTIMISTIC. `one` is a numeral, and the settled outside
  finding is that numerals barely reach the conditioning -- CLIP''s text embeddings are near-identical
  across numerals (T2ICountBench, arXiv 2503.06884; full read in
  pipeline/research/count-control-sdxl-0817.md) -- which is exactly why `exactly two` runs 0 of 16 on this
  arm. So this rung tests a NARROWER claim than "numbers work": whether a numeral binds when applied to a
  STRUCTURAL feature the model draws explicitly (a node, which it renders as a visible swollen joint)
  rather than to the counted objects themselves. A null here is an informative null and is expected more
  than a win is.
  DEPARTS FROM ITS BRIEF ON ONE POINT AND SAYS SO. The brief (ep2-b01-geom-0817.yaml, key
  `the_lever_this_actually_points_at_and_why_it_is_NOT_filed_either`) says to fold in the founder''s
  2026-08-17 "average leaves" ruling at the same time so `cotyledon` is not carried a third time. READING
  THE RULING REFUSES THAT: canon subject `sapling-cotyledon-shape` records his words -- "the sapling 2
  leaves are average leaves" -- and then states that NOT settled by them is "whether the leaves are called
  cotyledons -- ''average'' is a ruling about shape, not about vocabulary or scale", and names `wide oval
  cotyledon leaves with soft round tips` COMPLIANT. So `cotyledon` is not debt, the ruling does not reach
  it, and removing it would be an unauthorised SECOND variable. It stays. If the word is to go, that is a
  separate wording pass with its own control.
  COLOUR: nothing green is propagated. This lineage is already purple and PURPLE HELD 16 OF 16 on the
  control -- `one small deep purple-violet fig` in the positive and `no green fig, no green fruit` in the
  negative, both inherited byte-identical.
  IS NOT: a mask rung, a composite rung, or a pick. Beat 01''s mask route is closed by its own stop rule.
  $0, local card, no provider.'
success: 'PRE-REGISTERED IN THIS COMMIT, BEFORE ANY FRAME OF THIS RUNG EXISTS, and carried forward from
  the control''s own bar rather than rewritten. Sixteen stills at 832x1216 (4 reference cells x 4 seeds) --
  the control''s grid exactly, because a count result needs a denominator and the comparison is only real
  on the same grid.
  PRIMARY, leaf count out of 16: PASS is EXACTLY TWO leaves on the plant. FAIL-COUNT = three or more, or
  one. Control on this grid: 2 of 16.
  MECHANISM, node count out of 16, SCORED SEPARATELY because this rung''s claim is about nodes and not
  about leaves: PASS-NODE is exactly ONE leaf-bearing node on the stem. This is recorded whatever the
  primary does, because the two can come apart in both directions -- two nodes each carrying two opposed
  leaves fails PRIMARY while showing the arrangement held, and one node carrying three leaves fails
  PRIMARY while showing the node constraint held. Reporting only the leaf count is how the control''s
  mechanism was misread the first time.
  SECONDARY, height relation out of 16, SCORED SEPARATELY so that a count fix cannot silently break the
  half that is supposed to hold: the whole plant in frame and NO TALLER THAN THE GRASS AROUND IT.
  FAIL-SCALE = bush or waist height, overtopping the grass, or the founder''s 2026-08-16 "dont make it
  double in size suddenly". Control on this grid: 0 of 16.
  ALSO FAIL, inherited unchanged: FAIL-COLOUR (a green, red, pale or white fruit, or more than one) and
  FAIL-PERSON (any face, figure, chibi or mascot -- the beat has no character in it).
  THE SUB-GRID IS DECLARED NOW AND NOT CHOSEN AFTERWARDS. The control''s correction established that rows
  r2 and r3 of this reference set come back as bush-sized purple fig masses while rows r0 and r1 are
  cleanly composed seedlings at a workable scale. Both readings are therefore reported: the full 16, AND
  the r0/r1 eight-cell sub-grid. The DECISION RULE below is settled on the FULL SIXTEEN; the sub-grid is
  published alongside it as context and may NOT be substituted for it if the sixteen read badly.
  THE DECISION RULE, written before the frames exist so the read cannot be softened afterwards: the node
  constraint BINDS only if leaf count reaches 9 of 16 AND the height count does not fall below the
  control''s 0 of 16 on the same grid. 6 of 16 is the rate `exactly two` runs across the wave sheets, so
  anything at or under it is NO EFFECT. Between 7 and 8 of 16 is INDETERMINATE and licenses one repeat at
  fresh seeds on this same grid and nothing else. A height regression is a REGRESSION however the count
  reads. Scored AS WRITTEN and tightened FORWARD ONLY, never retroactively -- bending a bar after the
  picture is how 8/12 "passes" became 0/12 usable.
  FAILURE IS REACHABLE AND IS CURRENTLY THE STATUS QUO: the control scored 2 of 16 on this exact grid, and
  `whole plant in frame` keeps the whole stem in shot, so a second node further up the stem can appear and
  be counted against this. This is not a framing that cannot fail, and the pre-registered prediction above
  says a null is the more likely outcome.
  A THREAT TO VALIDITY, RECORDED NOW SO A NULL IS NOT OVER-READ: `one` is a numeral on an arm where two
  count-asserting wordings have already scored 0 of 16, so a null here is ambiguous between "node count is
  the wrong lever" and "numerals do not reach the conditioning, including this one". It cannot distinguish
  them, and it must not be written up as though it had. The clean discriminator is a DEVELOPMENTAL-STAGE
  adjective -- a newly sprouted seedling has one node by botany without asserting any number, and
  stage/size adjectives are the class of wording that HAS bound on this beat where numerals have not. That
  is a different job with its own bar and is NOT smuggled into this one.
  NOT A PICK and NOT A TASTE CALL: which of the sixteen, if any, ships is R4''s and this job makes no such
  claim. Measurement is the lane''s; taste is the founder''s.'
