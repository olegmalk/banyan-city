success: 'ONE 704x1280 121-frame 24fps mp4. T1 THE FRUIT IS DEEP PURPLE at the end -- round 1 lost this
  and it is the beat''s whole event; T2 the silhouette is a fig: wider across its bottom half than its
  top, with no bare stalk standing clear above it and NO horns or stalks growing out of the fruit itself,
  which is round 1''s other fault; T3 the fruit is one clean body, not a blob with a second colour inside
  it; T4 the growth is continuous and is still the only thing moving.'
why: 'ROUND 1 CAME BACK TEAL, AND THAT IS THIS LANE''S OWN MISTAKE RATHER THAN A FINDING. Rewriting the
  prompt to describe the silhouette dropped the words ''deep purple'' out of it, so the beat''s only colour
  instruction left with them and the fruit ripened to teal. The rung claimed one variable and moved two.
  Round 2 restores the colour words and keeps the silhouette clause, so the question round 1 was supposed
  to ask actually gets asked.


  THE SHAPE ALSO FAILED, and that half WAS predicted: round 1''s spec says in as many words that banning
  ''sphere'' and ''perfect circle'' risks the model reading a ban on roundness generally and returning
  something lumpy. It did -- a flat blob with two stalk-like horns out of the top. A fig IS round; what
  the founder objected to is the LOLLIPOP reading, so round 2 bans that and nothing else about roundness.


  WHAT DID NOT CHANGE: the plate, 704x1280, 121 frames at 24fps, guidance, sampler, sigmas, two-stage,
  crf 33, offload.'
