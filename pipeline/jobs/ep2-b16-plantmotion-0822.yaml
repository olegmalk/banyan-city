  the frame, so the plant OVERLAPS him rather than standing in a near foreground. Beat 16''s staging is
  ''close on the leaf, he sits blurred behind it'' and that needs a frame with room in front of him. Two
  levers were spent this morning proving words cannot buy it -- four cells killing the depth of field
  and naming a distance clause, all null -- and a third (ControlNet 0.55, ep2-b16-canon-w6a-0821) shows
  the conditioning strength is not the lever either: the pose held and the framing did not move. The lever
  left is the SKELETON''S OWN SPAN and that is a build.


  So this clip is strictly better than the trade currently on the page -- corrected face AND a plant --
  without being the shot the beat wants.'
