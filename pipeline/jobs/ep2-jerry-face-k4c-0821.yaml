one_sample_rule: 'A SWEEP ON A DIAGNOSTIC AXIS, filed after k1, k2 and k3 were each rendered, measured
  and read at 1:1 -- four points on ONE axis, not four guesses. It is not a batch in the sense the rule
  bans: nothing it produces is promoted, no dataset grows, no beat plate is cut, and the gate stays shut
  until a rung is judged. Four points and not one because the public answer is a DIRECTION -- square canvas,
  dominant subject -- and does not name a ratio; the band 30-75%% brackets k3''s 19.1%% below and k1''s
  ~100%% above, and both of those are already rendered, so the sweep has anchors at both ends and buys
  the curve between them. If a single rung had been filed instead, whichever way it came back the next
  question would have been ''and what about the other side'', which is the same GPU spent over four sequential
  waits.'
the_one_variable: k3's rung with the reference CANVAS MADE SQUARE and the head at 0.60 of it -- the head-to-frame
  ratio is the axis and it is the only thing that moves across k4a..k4d. Same head pixels, same field
  green, same mask, same --ip-scale 0.7, same seed, same skeleton, same wording. The subject reaches the
  encoder INTACT at 35.2% of its pixels, where k3's reached it amputated at 5.4%.
