success: 'ONE 832x1216 png at seed 20260823 on the h19 skeleton at scale 1.0, j2''s prompt and negative
  byte-identical, plus --ip-ref jerry-tile-sq60-0821.png --ip-mask 315,130,515,350 --ip-scale 0.7. Scored
  on the k4 bar: k3''s nine passing clauses HELD, plus NO HORNS and NO COWL, with the eye bounding box
  at 1.4x the tile''s or lower and T8 at 4.5 heads or better. Judged by eye at 1:1 against review/ep2-goblin-design-0819/adult-b19-0819.jpg,
  with the ruler''s bounding-box column -- not its area column -- carrying the numbers.'
why: 'RUNG k4c OF THE k4 BAND: k3''s rung with the reference canvas made SQUARE and the head at 0.60 of
  it. One axis, four points, everything else frozen at k3''s.


  WHAT k3 ESTABLISHED AND WHAT IT BROKE. k3 changed the reference''s head-to-frame ratio 100% -> 19.1%
  and moved both defects at once: eye bounding box 1.87x -> 1.24x the tile''s, the best this tree has
  made, with aspect held at 0.54, and head_frac 0.219 -> 0.201 with T8 back to 4.97 heads. AND IT GREW
  TWO HORNS and let the tile''s purple cowl through.


  THE CAUSE, RESEARCHED RATHER THAN GUESSED, AND IT IS NOT THE ONE THE k3 ENTRY NAMED. diffusers'' load_ip_adapter
  builds `CLIPImageProcessor()` with NO arguments, and that class defaults to resizing the SHORT edge
  to 224 and then CENTRE CROPPING to 224x224. k3''s reference was 416x608, so it became 224x327 and the
  crop kept rows 51..275 -- while the head sat at resized rows 33..93. THE TOP 30% OF THE SUBJECT, THE
  ENTIRE CRANIAL DOME, WAS CUT OFF BEFORE THE ENCODER SAW IT, leaving 64x42 px flush against row 0 with
  the tile''s dark ear flanges running up into the cut. k1''s reference was 156x152, effectively square,
  survived the crop intact at 96% coverage, and drew no horns. The horns grow upward out of the cut, from
  exactly those flanges. Sources and the two source files this is read from: pipeline/research/ipa-ref-framing-0821.md.
  Pixels: review/ep2-goblin-design-0819/CLIP-STARVE-0821.png.


  SO THE CANVAS IS SQUARE HERE, which makes the centre crop a NO-OP and is the only condition under which
  the authored head-to-frame ratio is the ratio the model actually receives. On k3 it was not.'
