# send the fusion tier, and those numbers were beat 02's. A provenance block that
# attests to a different beat is the exact silent divergence §7.2 exists to stop,
# so the prose is replaced with this beat's own facts. NOT ONE EXECUTABLE VALUE
# WAS TOUCHED — the steps, argv, artifacts, priority and env are byte-identical to
# what was queued as `ep2-b04-fieldban-0811-1786470002.json`.
#
# THE FAULT THIS ANSWERS IS HIS, VERBATIM: "for beat 4 its also not too bad but
# character consistency, and the background is a house" (founder, ep2 picking
# page, 2026-08-10). The framing and the goblin he did not object to; the SETTING
# is the fault. `authored_field` answered it once with `no house, no building, no
# indoors` plus `blurred open field behind him`, and `authored_field_bright` then
# added the eight-term lighting block on top — a block whose predicate was read
