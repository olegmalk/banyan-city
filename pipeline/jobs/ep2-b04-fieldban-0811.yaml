# THE ONE VARIABLE IS THE WALLS, IN BOTH CHANNELS:
#  1. THE SETTING MOVES TO THE FRONT OF THE POSITIVE. `authored_field_bright`
#     states the field SEVENTH, after the face, the breath, the eyes and the ears
#     — by which point an anime close-up prior has already committed the pixels
#     behind the head. `in a blurred open grassy field` now sits in the THIRD
#     clause, ahead of the face. This is a MOVE, not an addition: `behind him` is
#     dropped and `grassy` added, so the clause is a token shorter than the one it
#     replaces and the positive does not grow.
#  2. `no interior` and `no architecture` join the negative chain. The other three
#     walls terms (`house`, `building`, `indoors`) were already there, untouched.
#
# NOTHING ELSE MOVES. Same `green skin` slot, same `his face filling the frame`
# and `close-up` he part-approved, same held-breath action word for word, same
# eight-term lighting block, same steps (40), guidance (7.5) and size. The seeds
# cannot drift: `render_wave_sample` derives them as `wg.SEED + beat + i*1000` and
# never reads the variant, so s0..s3 are the same four integers as every prior
# beat-04 round and the comparison is frame-to-frame at equal seed.
#
# HIS CHARACTER-CONSISTENCY COMPLAINT IS DELIBERATELY NOT ANSWERED HERE, and
# saying so is the point: consistency is drift ACROSS seeds, no added adjective
# fixes it, and the taste ledger's sixth scoring already found that no axis in the
# model can even see it. Adding a term for it would be the steward guessing.
#
# MEASURED, WITH AN HONEST CAVEAT ABOUT WHERE. These numbers are from this Mac,
# not the box: there is no CLIP tokenizer here, so `compress()` POSITIVE counts
# are estimates. The NEGATIVE estimator is not an estimate on this beat — it was
# proven exact when it reproduced the box's `sent 76` for `authored_field_bright`
# to the token. On it, this variant sends 77 of 77 with EVERY authored `no ...`
# term arriving, none dropped and none deduplicated away:
#   photorealistic, 3d render, abstract, text, watermark, signature, low quality,
#   blurry, extra limbs, deformed, girl, child, house, building, interior,
#   indoors, architecture, dark, night, dusk, sunset, dim lighting, moody
#   lighting, low key, shadows dominant, photorealism, female goblin, elf
# The only casualties are two house-tier quality tags, `realistic skin texture`
# and `jpeg artifacts`. `text`, `female goblin` and `elf` survive — the three the
# fault checks fail on — and the count tag `1boy` derives.
#
# THE `--dry` STEP IS THE REAL GATE AND IT RUNS FIRST. It measures on the box's
# actual CLIP tokenizer and `render_wave_sample.py` returns nonzero BEFORE it
# imports torch, so if any of the above is wrong the job costs $0 and no GPU
