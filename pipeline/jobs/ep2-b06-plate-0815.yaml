why: 'ONE SAMPLE BEFORE ANY BATCH (founder, 2026-08-03). Five beats -- 06, 07, 09, 10 and possibly
  18 -- have no usable scene plate, and the last wave animated costume cards for six beats because
  nobody opened an init first. This job tests ONE recipe change on ONE beat before any of the others
  are queued.

  THE RECIPE CHANGE, and it is a single variable: the IP-Adapter REFERENCE. Beats 05 and 11 came
  back with a real field in frame; beats 06 and 09 came back as costume cards. Same sampler, same
  arm (window4, 15% window), same scene-first prompt shape, same day. What differed is --refs:
  05 and 11 used `refs-guards-twoinfield-0813` (two guards standing in a field); 06 and 09 used
  `refs-charref-guards-r5-0812`, whose own draft reads "reference sheet, multiple views, turnaround,
  ... white background". The adapter owns the composition, so a character-sheet reference returns
  a character sheet whatever the prompt says. This job runs beat 06 on the two-in-field reference.

  The draft `authored_b06_scene2` is beat 05''s proven sentence with beat 06''s action swapped in
  (two men in frame, matching the two-figure reference); the cast ruling, the negatives and the arm
  are beat 05''s byte for byte.'
