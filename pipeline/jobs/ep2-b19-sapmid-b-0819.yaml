    \nThe cure is the one commit 0f799ddd applied to ep2-b12-plateship-0819 after the\nsame class of failure:\
    \ a box-local copy under the SAME per-file sha256\nassertion. BYTE-IDENTITY COMES FROM THE HASH, NOT\
    \ FROM THE ORIGIN OF THE BYTES.\nThe two sha256s below are the hashes of the files committed to main;\
    \ a file that\nmatches one of them IS that committed file, whichever directory it came out of.\nNothing\
    \ matches, nothing is written, nonzero exit.\n\nThe parent's fetch_init.py claimed these files \"\
    are NOT on the box's courier\nworktree -- the courier only ever contains what the box produced\".\
    \ True of the\nday the composite was drawn on a Mac; false since ep2-b19-sapcomp-0819 and\nep2-b19-sapgloss-0819\
    \ published their own inputs next to their outputs. Each\ndirectory below was hashed by certutil before\
    \ it was listed here.\n\"\"\"\nimport hashlib, os, shutil, sys\n\nOUT = r\"C:\\\\banyan-farm\\\\b19sapmid-b-0819\"\
    \nDIRS = [\n    r\"C:\\banyan-farm\\courier-box\\farm-out\\ep2-b19-sapcomp-0819\",\n    r\"C:\\banyan-farm\\\
    courier-box\\farm-out\\ep2-b19-sapgloss-0819\",\n    r\"C:\\banyan-farm\\b19sapcomp-0819\",\n    r\"\
    C:\\banyan-farm\\b19sapgloss-0819\",\n]\nWANT = [\n    (\"19-the-drop-sapcomp-0819.png\", \"b6dbd53bffd0dae77eb410c7669a042c9a040fb3faf2a5f5a5032b7431418903\"\
    ),\n    (\"19-the-drop-sapcomp-mask-0819.png\", \"ce1e5ba2f89e9cabd0f90a3316a1436605bfd152a23b7add994995e255bcf266\"\
    ),\n]\n\n\ndef sha256_of(path):\n    h = hashlib.sha256()\n    with open(path, \"rb\") as fh:\n  \
    \      for chunk in iter(lambda: fh.read(1 << 20), b\"\"):\n            h.update(chunk)\n    return\
    \ h.hexdigest()\n\n\nos.makedirs(OUT, exist_ok=True)\nmissing = []\nfor name, want in WANT:\n    dst\
    \ = os.path.join(OUT, name)\n    if os.path.isfile(dst) and sha256_of(dst) == want:\n        print(\"\
    already here %-34s sha %s OK\" % (name, want[:12]), flush=True)\n        continue\n    got = \"\"\n\
    \    for d in DIRS:\n        src = os.path.join(d, name)\n        if not os.path.isfile(src):\n  \
    \          continue\n        have = sha256_of(src)\n        if have != want:\n            print(\"\
    \   skip %s -- sha %s != %s\" % (src, have[:12], want[:12]),\n                  flush=True)\n    \
    \        continue\n        shutil.copy2(src, dst)\n        after = sha256_of(dst)\n        if after\
    \ != want:\n            sys.exit(\"!! COPY CORRUPTED %s -- wrote %s\" % (dst, after))\n        got\
    \ = d\n        break\n    if not got:\n        missing.append(name)\n    else:\n        print(\"copied\
    \ %-34s from %s  sha %s OK\" % (name, got, want[:12]),\n              flush=True)\nif missing:\n \
    \   sys.exit(\"!! NOT FOUND at the asserted sha in any of %d dirs: %s\\n\"\n             \"   Nothing\
    \ was rendered. Add a directory to DIRS or re-publish \"\n             \"the composite.\" % (len(DIRS),\
    \ \", \".join(missing)))\nprint(\"both files present at their asserted sha256. no network was used.\"\
    ,\n      flush=True)\n"
