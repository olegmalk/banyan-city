script_authority: 'Node 002b-first-citizen, approved_by: founder. THIS PRODUCES A PLATE, NOT AN EPISODE:
  STEWARDSHIP 6 gates voice, footage and assembly, and a still init for a beat whose script is approved
  is none of those. inpaint_fruit.py writes approved: false and a provisional: block into its own sidecar,
  so nothing here can be mistaken for a pick or a plate_ack.'
bar:
  Q1_THE_GEOMETRY_MUST_SURVIVE_AND_THIS_CLAUSE_OUTRANKS_Q2: 'The eight clauses the 0.30 sample passed
    must STILL pass: one fig attached and clear of the ground, exactly two wide oval cotyledons on one
    rooted stem with one thin side-branch, no contact, face visible, purple reads purple, one adult figure,
    whole sapling and whole of him in frame -- AND the composite''s flat fill must still have COME BACK
    as cel line work. IF THIS CLAUSE FAILS THE JOB FAILS, whatever happened to the gloss. A matte paste
    is worse than a glossy drawing, and the 0.30 sample is not replaced by this one either way.'
  Q2_did_the_specular_reduce: 'Measured exactly as the parent measured it, on the same box, so the two
    numbers are comparable line for line: circular-mean hue and luminance min/mean/max on the fruit body,
    plus THE BRIGHTEST 2 PERCENT of its pixels averaged. At 0.30: hue 309 deg, luminance min 11 mean 126
    max 220, brightest 2 percent = 211 on a body whose composited source was matte (min 44, max 213, flat).
    A brightest-2-percent under 170 with the body luminance unchanged is a clear reduction; 170-200 is
    a PARTIAL and will be reported as a partial rather than rounded either way; over 200 is unchanged.'
  Q3_did_the_hue_move_back: The fig was COMPOSITED at 272 deg and the 0.30 sample returned 309. Beat 18's
    own plate measured 305 through a completely different instrument. If 0.22 returns something near 272
    the checkpoint's hue prior is a late-step effect; if it returns 305-310 again the prior is not reachable
    by this knob at all. Reported either way and NOT a pass/fail clause -- no hue is 'correct' until R4
    says so.
  how_scored: By eye at 1x and 3x against BOTH the committed composite and the 0.30 output, all three
    of which are in the repo. The numbers are filters; the read is the verdict.
failure_predicted_in_advance: 'Q2 COMES BACK UNCHANGED OR ONLY PARTIAL, and the mechanism is written down
  before the render so that a reduction would be a real surprise. STRENGTH SETS WHERE THE SCHEDULE STARTS,
  NOT WHERE IT STOPS. At strength s the sampler begins at the sigma corresponding to s and runs down to
  0, so THE FINAL LOW-SIGMA STEPS RUN IN BOTH RENDERS. A specular highlight is fine, high-frequency detail
  -- exactly what low-sigma steps add. If gloss is written in those last steps, cutting the schedule from
  12 steps to 8 removes the EARLY ones and leaves the gloss untouched. THAT WOULD BE THE USEFUL RESULT:
  it would kill the strength lever for gloss outright and leave the post-pass as the only remaining instrument,
  which is a smaller and cheaper conclusion than a sweep. The competing hypothesis, that gloss is a mid-sigma
  structural decision, is what a reduction would show.'
init_provenance: 'farm-out/ep2-b19-sapcomp-0819/19-the-drop-sapcomp-0819.png, sha256 b6dbd53bffd0dae77eb410c7669a042c9a040fb3faf2a5f5a5032b7431418903,
  drawn by pipeline/beat19_drop_composite.py on a Mac, $0, no model loaded. Its parent is farm-out/ep2-b19-mac-plate-0819/19-the-drop-mac-plate-r3s1.png
  sha256 de7a256c29b0a752b335e1e022c111e654c4c65cbe43b05fb98bd9573e1c6cbf (animagine-xl-3.1, seed 20260819).
  Both are on origin/main, so every sha asserted in this spec is verifiable by anyone who clones the repo.
  READ OFF THIS BOX, NOT OFF THE NETWORK: both files were hashed by certutil on the rtx5090 on 2026-08-19
  before this spec was written and are present at these exact shas in four directories -- courier-box\farm-out\ep2-b19-sapcomp-0819,
  courier-box\farm-out\ep2-b19-sapgloss-0819, b19sapcomp-0819 and b19sapgloss-0819. copy_init.py tries
  them in that order and refuses on any mismatch, so byte-identity is established by the hash rather than
  by the origin of the bytes.'
mask_provenance: 'farm-out/ep2-b19-sapcomp-0819/19-the-drop-sapcomp-mask-0819.png, sha256 ce1e5ba2f89e9cabd0f90a3316a1436605bfd152a23b7add994995e255bcf266.
  172847 px, 17.08% of frame: the union of the two cleared twig arcs, the two small on-figure patches,
  and the drawn sapling''s own footprint, dilated 12.'
negative_ordering: 'THE DEFECT CLASS IS FIRST ON PURPOSE. animagine''s negative budget is 77 CLIP tokens
  and composite-init-pattern.md 4 records what happens at the ceiling: beat 06/08''s negative measured
  EXACTLY 77/77 and ''any word added silently drops the tail''. This one is 26 terms / 38 words, comfortably
  under, and the terms that name the actual failure (crystal, gem, faceted, glossy, bead, vine, counts)
  are at the FRONT so that if the tail is ever clipped it is ''low quality'' that goes and not the one
  thing this rung is about. It is also not load-bearing: the standing law is that the positive places
  what you want and the negative does not -- four times on this checkpoint a defect the negative forbade
  arrived because the positive left it vague -- and here the structure is placed by the INIT, which is
  stronger than either.'
parent_the_bar_came_from:
  spec: pipeline/jobs/ep2-b19-sapmid-0819.yaml
  carried_verbatim: 'bar, pre_registered_fail_modes, failure_predicted_in_advance, negative_ordering and
    mask_provenance are the parent''s text unchanged, and that is deliberate rather than lazy: the parent
    NEVER RENDERED, so its bar has never been tested against pixels and is still pre-registered in the
    only sense that matters. Re-wording an untested bar at re-file time is how a rung quietly becomes
    a different rung.'
  what_is_NOT_carried: Its `outcome_0819` block -- the rc=1, the DNS diagnosis and the instructions to
    the next lane. That is the parent's history and it stays on the parent. This spec restates the mechanism
    in its own words under `the_fetch_step_is_gone_and_this_is_what_replaced_it` because the fix is this
    job's, but nothing is inherited.
pre_registered_fail_modes:
  FAIL-PASTE: 'the drawn shapes come back unconverted -- flat fill, soft edge, no cel line work. 7''s
    low-side failure and the direction 0.22 moves toward. Named as the main RISK of this job: at 8 of
    40 steps there may not be enough schedule left to draw anything.'
  FAIL-GEOMETRY-LOST: any of the eight clauses the 0.30 sample passed now failing. Q1.
  FAIL-GLOSS-UNCHANGED: brightest 2 percent still over 200. Named as the MOST LIKELY outcome, with its
    mechanism, above.
  FAIL-COUNT: more than one fig, or a leaf count other than two.
  FAIL-CRYSTAL: the faceted gem returns. It was gone at 0.30 and a return at 0.22 would mean the crystal
    prior is an EARLY-step effect the shorter schedule stops suppressing.
  FAIL-VACANCY: a new noun in either cleared arc.
  FAIL-FIGURE: damage to the hood or cloak-edge patches the mask covers.
  reporting_rule: every mode above is reported BY NAME whether or not it fired.
takeover_and_why_it_is_not_a_double_file: 'The parent reserved its own re-run for the beat-19 composite
  lane and warned that two lanes re-filing one job is what box_enqueue''s known idempotency gap turns
  into 264 wasted GPU seconds. Taken over anyway, on three facts: the owner was notified when the job
  died and has not re-filed it; the card is EMPTY -- ready 0, running 0, backlog 0, read off the box directly
  rather than off a box_autofill snapshot, which was caught 16 minutes stale the same night; and this
  is a NEW id under a NEW working directory publishing under a NEW filename, so even if the owner re-files
  the original the two cannot collide in the queue, on disk or in farm-out. ep2-b19-sapmid-0819 stays
  in the tree carrying its outcome and is not edited by this job.'
the_fetch_step_is_gone_and_this_is_what_replaced_it:
  what_killed_the_parent: rc=1 at step `fetch`, 2026-08-19T16:43:12Z, ~3 minutes after start. socket.gaierror
    [Errno 11001] getaddrinfo failed, out of fetch_init.py's urllib.request.urlopen. No GPU ran, no sampler
    loaded, no pixels exist -- which is why no verdict was written against it and why this child carries
    its bar untouched.
  the_cure_was_already_committed: '0f799ddd, the same day, one hour earlier, on another lane''s job: ep2-b12-plateship-0819
    failed its fetch twice and was fixed by replacing it with a box-local copy under the same per-file
    sha256 assertion, after which the successor ran rc=0. pipeline/measured/failed-acknowledged.yaml carries
    it as a `fetch-404` group. The fix never crossed to this lane.'
  why_a_local_copy_is_not_a_weaker_claim: The two sha256s are the hashes of the files committed to main.
    A file matching one of them IS that committed file, byte for byte, whichever directory on this box
    it came out of. Nothing matches, nothing is written, nonzero exit. The parent's `fetch_note` argued
    the re-fetch is what makes 'one variable' true of the artifacts; a copy under the same assertion proves
    exactly the same thing without making a GPU job depend on name resolution.
  the_parents_own_claim_that_was_stale: fetch_init.py's docstring said these files "are NOT on the box's
    courier worktree -- the courier only ever contains what the box produced." True the day the composite
    was drawn on a Mac; false since ep2-b19-sapcomp-0819 and ep2-b19-sapgloss-0819 published their own
    inputs beside their outputs. Same species as the b12 header that said plates-local no longer existed
    while three copies sat on the card.
  max_attempts_raised_1_to_2: 'A three-second DNS outage permanently failed a GPU job and idled the card
    behind it. Every step here is idempotent: copy_init.py skips a file already present at the right sha,
    the inpaint is a fixed seed overwriting its own output, and the publish names every file in full and
    fails on a missing one. A retry cannot half-run.'
  the_working_directory_and_filename_are_this_jobs: 'The parent wrote its payload into C:\banyan-farm\b19sapgloss-0819
    -- the PARENT SAPGLOSS JOB''s directory -- and named its output b19-sapgloss-s20260819.png, which
    is byte-for-byte the filename of the 0.22 sample that job already published. Two distinct takes, one
    basename, and a directory a second job would clobber. Retokened to b19sapmid-b-0819 and b19-sapmid-b-s20260819.png.
    Fixed in the generator, not in the published files: renaming a published artifact invalidates the
    .sha256 that proves it arrived intact.'
