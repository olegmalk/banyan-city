one_sample_rule: 'ONE FRAME, AND IT IS BEAT 13.


  The rule is one sample per RECIPE CHANGE, and this is a recipe change on three

  axes at once, so it gets a sample before anything is scaled. Beat 13 is the beat

  to spend it on for two reasons that are not convenience: it is the frame the

  founder pointed at when he said the goblin reads as an adult ("this is one of the

  images where the goblin looks like an adult, which is wrong"), and it was the

  BEST PASS of the adult wave''s round one, so a break here is attributable to the

  three new things and not to a beat that was already marginal.


  NOTHING SCALES OFF THIS UNTIL IT IS JUDGED BY EYE AT 1:1. If identity breaks, the

  `isolate` mode of this file emits the one-variable rungs -- expression alone,

  tusk alone -- and the wave waits. If it holds, the wave is seven frames and each

  one is judged on its own face.'
round: TWO of two. episode-loop-v2 caps a question at two rounds. If neither rung lands, the finding is
  recorded as an instrument limit and the wave ships at the sample's recipe -- there is no round three.
stage_direction: 'THE SHADE -- ''The scavenger''s legs give out and he drops to sit in the grass at the
  base of the stem, then tips his head sideways into the sapling''s hand-sized patch of shade''. Line:
  ''...Thanks for the shade.'' EXHAUSTED RELIEF, and the first kind thing that happens to him.'
the_expression_ruling: 'STRUCK from k6a''s frozen positive: `blank eyes`, `jitome`, `half-closed eyes`.
  Plus `expressionless`, `:|` and `closed mouth` from the older tile recipe, wherever a plate still carries
  them. KEPT: `tsurime` (the tile''s slit SHAPE) and `thick eyebrows` (the brow P1 scores) -- those are
  geometry, not mood, and striking them would move the face under cover of a ruling about its expression.
  ADDED, from THIS BEAT''s stage direction in node.md: `tired, half-closed eyes, light smile`.'
the_mask_defect: 'Found while measuring C1 and it outlives this rung: `age_mask` puts the box 75 px above
  the crown on a folded pose at head_frac 0.240 and cuts the chin off. Crown 439, chin 673, mask 364..642.
  Only folded poses pay, which is why Option B''s standing frame measured C1 at 0.00% and nobody caught
  it. If m1 wins, `head_fit_mask` becomes the rule for the whole wave and `age_mask` keeps only the frames
  it already rendered.'
the_one_variable: ONE. The MASK, and it is derived from the skeleton rather than chosen. Everything else
  is the sample's to the byte -- same prompt, same negative, same skeleton, same seed, same adapter and
  reference.
