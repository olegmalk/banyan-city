consumer: THE SEVEN-BEAT WAVE, which is held on this. The sample settled the age and the identity and
  left ONE thing open -- whether the beat's own emotion can reach the face. These two frames name the
  mechanism; the wave is emitted against whichever wins, and if neither does the wave ships at the sample's
  recipe with E1 recorded as an engine limit rather than a defect we keep re-asking.
success: ONE 832x1216 png. Judged against ep2-b13-ageb-s1-0821 at 1:1 on exactly three clauses -- E1 (did
  the exhaustion arrive), T1 (did the blank eyes survive) and C1 (magenta in the mask region, measured
  against the sample's 1.17%).
why: "ROUND TWO FOR THE AGE-B SAMPLE. THE MASK, FITTED TO THE HEAD IT IS SUPPOSED TO MASK.\n\nMECHANISM\
  \ 1: the adapter is acting on the wrong region. The box is derived from the skeleton -- crown to chin,\
  \ head width -- instead of inherited from a standing figure at another head_frac, and on this pose that\
  \ is 323,440,509,673 against the sample's 289,364,541,642. It drops the sky, and it PICKS UP THE MOUTH.\n\
  \nTHE PREDICTION IS SPLIT AND BOTH HALVES ARE INFORMATIVE. C1 should improve -- less non-head area for\
  \ the adapter to transfer a cowl through. E1 may get WORSE, because a mask that now covers the mouth\
  \ hands the mouth to the adapter too, and the adapter's reference is a tile with a flat lipless line.\
  \ If C1 clears and E1 worsens, the mask is the right fix for the COWL and the wrong lever for the EMOTION,\
  \ and the two problems are properly separated instead of being one confused rung.\n\nep2-b13-ageb-s1-0821,\
  \ JUDGED BY EYE AT 1:1 AGAINST BOTH\nRULERS (the tile for the creature, B-h240-kid.png for the age),\
  \ 2026-08-21.\nVERDICT: PARTIAL -- the age landed, the identity HELD WHERE IT WAS PREDICTED TO\nBREAK,\
  \ and the ruling the sample existed to prove DID NOT TAKE.\n\nWHAT PASSED, and the first one is the\
  \ surprise:\n  T1  BLANK EYES HELD WITH `blank eyes` STRUCK. Narrow, pale, no iris, no pupil\n     \
  \ -- closer to the tile's slits than Option B's big ovals. This was the\n      predicted failure and\
  \ it did not happen: the ADAPTER carries no-iris-\n      no-pupil on its own, which is exactly ruling\
  \ 2's claim and it is now\n      evidence instead of an argument.\n  A1  Reads as Option B. Young, big-headed,\
  \ slim.\n  A2  Not the killed design. No belly, no squat, no mascot.\n  T7  No patchwork on the skull.\n\
  \  C2  The pose is the one asked for -- seated, knees up, hands between them.\n\nWHAT FAILED:\n  E1\
  \  THE EMOTION DID NOT LAND, AND THIS IS THE HEADLINE. The beat is \"...Thanks\n      for the shade\"\
  \ -- exhausted relief -- and the frame is SCOWLING: brow\n      furrowed into an angry V, mouth a downturned\
  \ frown. `tired, half-closed\n      eyes, light smile` did not reach the face. THE CONTROL IS ALREADY\
  \ IN\n      HAND: Option B carries the same scowl with NO expression tags at all, so\n      the tags\
  \ moved nothing and the scowl is what the adapter supplies.\n  C1  THE MAGENTA COWL IS BACK. Measured,\
  \ not eyeballed: 1.17% of the mask\n      region against 0.00% for both the k6a anchor and Option B.\
  \ Round two of\n      the adult wave was already chasing this on FOLDED poses (b03, b20) and\n     \
  \ guessed the mechanism was the mask overlapping the neck. This corroborates\n      it and adds a cause\
  \ -- the age mask is 1.26x bigger.\n  K1  TWO TUSKS, BOTH INTACT. Predicted in advance: `tusks` is plural\
  \ and\n      nothing in Danbooru tags a BREAK. The tusk arrived, the count and the\n      break did\
  \ not.\n  T3  BROW FURROWS -- part of the scowl, and the clause says no age modelling.\n  T2  A NOSE\
  \ NUB. No bridge and no nostrils, so it is not the human nose the\n      clause was written against,\
  \ but it is more of a tip than either ruler\n      has.\n  T4  METAL SPIKES ON THE EAR FLANGES. The\
  \ flange shape survived; grey studs\n      appeared on it that are on neither ruler.\n\nAND THE MEASUREMENT\
  \ THAT EXPLAINS MOST OF IT, found while checking C1: THE MASK\nIS MISALIGNED, NOT MERELY LARGE. On this\
  \ pose the crown is at y=439 and the chin\nat y=673; the mask ran 364..642. Seventy-five pixels of SKY\
  \ above the head, and\nTHE CHIN AND MOUTH CUT OFF below. The adapter was conditioning background and\n\
  the top of a skull while the MOUTH was left to the checkpoint -- which is\nprecisely the split the pixels\
  \ show: tile-true eyes inside the mask, a\ncheckpoint-chosen frown outside it. `age_mask` scales k6a's\
  \ box about the box's\nown centre, and that centre was authored 20 px high to clear a standing dome;\n\
  raising head_frac also moves the head DOWN. The two errors add, and only a\nfolded pose pays for them,\
  \ which is why Option B measured clean.\n\nSO THE NEXT RUNGS ARE NOT THE ONES THIS FILE PRE-WROTE. `isolate`\
  \ was built for\nan identity break and identity did not break. The live question is why the\nwording\
  \ cannot reach the face, and it has two candidate mechanisms that are\nseparable in two frames."
