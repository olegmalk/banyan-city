bar: "EIGHT PLATES, JUDGED AS ONE CONTACT SHEET, BY EYE AT 1:1. THERE IS NO\nPLANT AND NO FIGURE IN ANY\
  \ OF THESE PICTURES AND BOTH ABSENCES ARE CORRECT.\n  D1 CEL, NOT PHOTO, NOT PAINTING. Flat fills, clean\
  \ ink linework, the\n     episode's dialect. This is the clause the ep2-b16-field batch lost all\n \
  \    four on, and it is the first one read. Bokeh, painterly rendering or a\n     photographic ground\
  \ plane REJECTS the plate -- you cannot draw a sharp\n     cel seedling into a soft foreground without\
  \ it reading as a decal.\n  D2 A CLEAN DRAWABLE GROUND PLANE in the lower centre, wide and tall enough\n\
  \     to root a sapling at plate scale. Blades of grass crossing it are fine.\n     A rock, a flower,\
  \ a shrub, a drawn plant or any structure is NOT: the\n     0.30 pass PRESERVES a structure it finds\
  \ in the init (12 of 40 steps from\n     a latent that still carries it), so the composite would have\
  \ to fight it.\n  D3 ZERO FIGURES. Not a goblin, not a human, not an animal, not a silhouette\n    \
  \ on the horizon. A plate with any figure in it is REJECTED AND DELETED,\n     not cropped -- this lane\
  \ may not render the scavenger and a frame that\n     contains him is not curated into a training set.\n\
  \  D4 THE LIGHT HAS A DIRECTION. beat16_sapling_composite.py measures the\n     plate's own low-pass\
  \ luminance gradient and carries it into the drawn\n     plant. A flat, directionless plate makes that\
  \ measurement a no-op and\n     the composite reads as pasted.\n  D5 THE PALETTE IS THIS SHOW'S. The\
  \ composite samples its greens FROM THE\n     PLATE, so an off-palette plate produces an off-palette\
  \ sapling and the\n     frame teaches the LoRA the wrong colour.\nNOT SCORED: whether the picture is\
  \ a good shot. None of these is a shot, none\nenters a cut, and none goes near review/ep2-ship-0821.\
  \ They are ground planes\nfor an instrument.\nNOT SCORED: variety WITHIN a cell. The variety this batch\
  \ is bought for is\nBETWEEN cells and it is measured at the manifest, not here."
the_one_variable: THE SCENE-AND-LIGHTING CLAUSE ('in a field of dry grass, autumn, clear sky, day'). The
  framing clause 'wide shot, low angle' is p09's byte for byte and is FROZEN across all eight; so are
  the quality prefix, `no humans`, the negative, the checkpoint, the size, the steps, the cfg, the nocontrol
  arm and its 0.45 scale. The seed walks so the set is not seed-degenerate.
this_cell: PALETTE. The composite samples its greens FROM THE PLATE, so a plate with no green in it is
  the test of whether the instrument can put a green sapling in a dry field or whether it will tint it
  straw.
round_1_result_that_bought_this: '1 OF 10. p01/p03/p04/p07/p10 lost D2 to macro framing, p05 lost D1 to
  a painterly dialect, p02 returned a hooded masked figure and p06 a giant bird (D3), and p09 -- meadow,
  wide shot, low angle -- passed. The framing word, not the scene word, separates them: every close and
  medium cell failed and the only wide cell passed.'
the_scale_axis_moved_off_the_sampler: THE GATE WANTS DISTINCT SCALES AND THIS BATCH DOES NOT ASK FOR ANY.
  Round 1 asked the sampler for magnification and got macro grass six times. Scale now comes from CROPPING
  these wide plates, which beat 09 measured surviving downstream at 2.157x LANCZOS with 105% of frame
  1's high-frequency energy at f121. A crop is deterministic and $0; a framing word on a subject-less
  prompt is a lottery this batch already lost.
my_prediction_was_backwards_and_it_is_on_the_record: 'derive_sapling_field_0821 pre-registered ''FIRST
  AND MOST LIKELY: `no humans` DOES NOT BUY AN EMPTY FRAME, IT BUYS A LANDSCAPE'', and filed the wide
  cell as the sacrificial test of a question the ep2-b16-field batch was thought to have closed. THE LANDSCAPE
  IS THE THING THAT WORKED. Kept here rather than quietly replaced, because a prediction that is only
  recorded when it lands is not a prediction.'
negatives_failed_again_and_are_NOT_touched_here: '`no humans` in the positive plus a nine-term figure
  ban in the negative still returned a hooded figure (p02) and a bird (p06) -- this tree''s negatives
  failing to hold position for the fourth time. NO NEGATIVE CHANGE IS ATTEMPTED: the lever that has failed
  four times is not the lever to pull, and one passing cell is not the evidence to re-author a ban list
  on. The guard that holds is bar clause D3, which DELETES a frame carrying a figure rather than curating
  it -- which also means p02 and p06 are deleted, not cropped.'
failure_predicted_in_advance: 'FIRST: THE GROUND PLANE IS TOO FAR AWAY. `wide shot, low angle` buys a
  visible ground, but p09''s usable strip is mid-frame, not the lower centre the composite roots into.
  If the passing cells all put their clean ground at the horizon, the fix is the CROP -- which this batch
  has already committed to for scale -- and not a ninth wording.

  SECOND: THE CONTROL SPLITS FROM p09. r01 is p09''s own words at a new seed. If r01 fails, the round-1
  pass was a seed lottery and the framing finding is unproven; that would be worth knowing at a cost of
  three minutes and it is why the control is in the batch.

  THIRD: r07, THE DRY FIELD, COMES BACK WITH NO GREEN AND THE COMPOSITE TINTS THE SAPLING STRAW. The instrument
  samples its palette from the plate by design. That is a finding about how far the scene axis can be
  pushed before the palette rule breaks, and it is cheaper to learn on one plate than at frame twenty.'
clip77_measured_not_estimated: prompt 32 of 77, counted offline on animagine's own vocab before this file
  was written. The negative is p09's, inherited unchanged at 71 of 77.
