# 2026-08-12. r1 picked the fig up correctly and then kept going.
#
# r1's verdict: his hands are empty at frame 0, a dark fig IS in them by frame 18, and he
# lifts it -- chest, then face, then STRAIGHT OVER HIS HEAD by frame 54, which reads as
# celebration or surrender rather than holding something out as evidence. The pick-up is
# right; the gesture overshoots its own ending.
#
# THE CAUSE IS TWO PHRASES OF MINE PULLING THE SAME DIRECTION: "lifting his cupped hands
# UP", and "tips his head back to look UP at that empty branch" -- with "holding it out"
# as the only counterweight, and that is a weak instruction next to two ups. The model
# raised everything.
#
# THE FIX, one variable class: the arms are given a CEILING in the positive (chest height,
# stay there, elbows tucked, never past the shoulders, never above the head) and the
# looking-up is explicitly assigned to the eyes and chin alone. The negative gains arms
# raised overhead / hands above head / raising arms / cheering / celebrating / surrender
# pose, since naming a defect in the negative at guidance 2.0 is the lever with the most
# measured wins in this lane. Same init, same seed, same 73 frames, sapling sentence kept.
