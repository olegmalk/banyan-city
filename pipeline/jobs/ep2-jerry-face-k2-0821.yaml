why: 'RUNG k2: k1 with --ip-scale 0.7 -> 0.9 and nothing else.


  WHAT k1 SETTLED. The instrument works and it works on the clause the words could not reach. k1 came
  back with the tile''s eye KIND -- aspect 0.54 against the tile''s 0.52, where six wording rungs sat
  between 1.00 and 1.26 -- and with a brow, the clause that was 0 of 7. It also holds T1, T2, T3, P2,
  P3, P4 and the whole containment.


  WHAT k1 DID NOT BUY, AND IT IS ONE WORD: SIZE. Relative to the head box, k1''s eye bounding box is 1.87x
  the tile''s; j2''s was 1.40x. So the frame moved further away on scale while arriving on shape, which
  is not a contradiction -- it is the signature of an instrument that supplies KIND. Strength is the dial
  that says how far the picture is pulled toward the reference''s own proportions, and it is the only
  lever one variable from here.'
