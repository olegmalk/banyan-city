  # Same cover-crop script arm A inlines, byte-identical, so this job stands on
  # its own if arm A never runs. No sha is asserted on this source: it is a
  # steward-rendered sample, not an approved plate, and asserting a hash would
  # dress it as one. Its provenance is its own sidecar, which says approved: false.
  C:\banyan-farm\ep2-b01-figgrow-0811\cover_crop.py: |-
    #!/usr/bin/env python3
    """Cover-crop an asserted source image to an exact WxH. No model, no network."""
    import argparse, hashlib, os, sys
    from PIL import Image

    ap = argparse.ArgumentParser()
    ap.add_argument("--src", required=True)
    ap.add_argument("--sha256", default="", help="asserted before anything is written")
    ap.add_argument("--out", required=True)
    ap.add_argument("--size", default="704x1280")
    a = ap.parse_args()

    if not os.path.isfile(a.src):
        sys.exit("!! src not found: %s" % a.src)
    h = hashlib.sha256()
    with open(a.src, "rb") as fh:
        for chunk in iter(lambda: fh.read(1 << 20), b""):
            h.update(chunk)
    have = h.hexdigest()
    if a.sha256 and have != a.sha256:
        sys.exit("!! SRC SHA MISMATCH -- refusing.\n   want %s\n   have %s" % (a.sha256, have))

    W, H = (int(v) for v in a.size.split("x"))
    im = Image.open(a.src).convert("RGB")
    sw, sh = im.size
    scale = max(W / float(sw), H / float(sh))
    nw, nh = int(round(sw * scale)), int(round(sh * scale))
    im = im.resize((nw, nh), Image.LANCZOS)
    left, top = (nw - W) // 2, (nh - H) // 2
    im = im.crop((left, top, left + W, top + H))
    os.makedirs(os.path.dirname(os.path.abspath(a.out)) or ".", exist_ok=True)
    im.save(a.out)
    print("src %dx%d sha %s" % (sw, sh, have), flush=True)
    print("cover-crop scale=%.4f -> %dx%d, centre box (%d,%d)" % (scale, nw, nh, left, top), flush=True)
    print("WROTE %s" % a.out, flush=True)

