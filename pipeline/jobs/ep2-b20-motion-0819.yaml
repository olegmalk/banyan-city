    This clip moves, a lot, and it is a two-handed pick-up rather than a gesture or a tremble.'
  FAIL-TELEPORT: DID NOT FIRE. Largest frame-to-frame fruit displacement 51.6 px against a 53 px fruit
    width, median 1.07 px.
  FAIL-FRUIT-DOUBLE: DID NOT FIRE. One fig, present in 121 of 121 frames, never vanishing and never
    doubling.
  FAIL-CHILD: DID NOT FIRE in any frame.
  FAIL-STANDS: DID NOT FIRE.
  FAIL-CAMERA: DID NOT FIRE, and the measurement is region-consistent enough to say so rather than
    to abstain -- see M4.
  FAIL-LIMB-READ: 'DID NOT FIRE, which is the second-best result here. His head never tilts up: the
    gaze is level or downward for all 121 frames, so the clip does not read as "he looks up at the
    big tree" even though that tree is in the corner of every frame. The plate fault stayed a plate
    fault and did not become a take fault.'
fail_mode_I_DID_NOT_PRE_REGISTER: 'PROGRESSIVE DARKENING. Whole-frame mean luminance walks 141.89
  (f000) -> 135.27 (f024) -> 125.04 (f048) -> 118.39 (f072) -> 115.57 (f096) -> 116.86 (f120): -25.03
  levels over five seconds, in every band (rows 0-427 190.79 -> 168.75, rows 427-853 97.53 -> 92.42,
  rows 853-1280 137.24 -> 89.35). This bar has no brightness clause at all, so it is a mode found
  after the fact and it is written as one. Plate fidelity is NOT the cause -- init 143.78 against
  f000 141.89, a hold of 1.89 levels, which is crf 10 doing its job -- so the drift happens during
  sampling. IT IS A RECIPE PROPERTY AND NOT A BEAT PROPERTY: the beat-12 121-frame take on the same
  crf 10 / two-stage / distilled-sigmas / 121-frame recipe lost 91 levels the same way, on a different
  plate, a different prompt and a different subject. Two beats, same drift, same recipe. Whoever owns
  the recipe should carry a brightness clause on every rung from here rather than discovering it per
  beat.'
what_this_settles_and_what_it_does_not: 'SETTLED: --image-crf 10 does not kill a large action. The
  spec predicted FAIL-FROZEN as most likely on the strength of -23% on beat 07''s gesture and -90%
  on beat 18''s tremble, and a two-handed pick-up came back with 6.1 levels of mean interframe motion.
  The honest reading is that the crf-10 motion cost is not a property of the flag alone -- a plate
  staged mid-action gets its action. Beat 12''s plate is a static two-leaf close-up whose prompt spends
  its first sentence asking for stillness, and it got total stillness; this plate has both hands already
  closing on a fruit, and it got the pick-up. NOT SETTLED: whether beat 20 can come off slate, because
  that is a plate question now and not a motion one.'
verdict_cut: 'NOT PROPOSED FOR THE CUT, and beat 20 stays a slate for now. This is a steward call
  on a tradeoff and the reasoning is written out rather than asserted: footage normally beats a slate,
  and the cut-readiness ledger has a `best-available` row type for exactly this. But this clip cannot
  satisfy beat 20''s own done_when -- "the empty stem is the evidence and must be in frame" -- because
  there is no sapling in the plate, and it puts the founder''s recorded fault ("THE BRANCH IS THE
  WRONG TREE") on screen for all five seconds. Shipping it would show a beat whose evidence is missing
  and whose wrong tree is the only tree. THE MOTION IS NOT THE BLOCKER AND IS NOW PROVEN ON THIS ACTION:
  the route is a plate drawn at the 2026-08-17 knee-height staging with the sapling''s own bare stem
  beside him at face height, then this exact recipe on it. Nothing here is a taste call on the character
  and no design change is proposed -- the goblin-identity question is untouched by this verdict.'
assembler_note: 121 frames at 24 fps = 5.0417 s. render_t3.py:616 reverses a clip whose slot outruns
  it, and a reversed pick-up puts the fig back in the grass. If this take is ever assembled, beat 20's
  slot must be checked against 5.0417 s rather than assumed.
what_this_licenses_after_the_verdict: Nothing new. `what_this_licenses` above still holds -- one clip
  on one seed on one plate, no second arm, no crf sweep, no plate promotion, and the other 24 seeds
  of the 2026-08-19 macbook1 wave remain unpublished and unscored. No follow-up job was filed off this
  verdict.
