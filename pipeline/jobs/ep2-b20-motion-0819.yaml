    # THE GLOB CARRIES THE BEAT SLUG (20-evidence). Without it the glob
    # matches nothing and the step publishes nothing while returning a code
    # that reads like a render failure. No allow_fail: a publish that cannot
    # find its files is a FAIL of the job, not a footnote.
    import glob, hashlib, os, shutil
    out_dir = "C:/banyan-farm/ep2-b20-motion-0819-out"
    pay_dir = "C:/banyan-farm/ep2-b20-motion-0819"
    dst = "C:/banyan-farm/courier-box/farm-out/ep2-b20-motion-0819"
    os.makedirs(dst, exist_ok=True)
    files = sorted(glob.glob(out_dir + "/20-evidence-LTX-macplate-r1s1.mp4*")
                   + glob.glob(out_dir + "/b20-mac-init-704x1280.png")
                   + glob.glob(out_dir + "/bench-b20-macplate.jsonl")
                   + glob.glob(pay_dir + "/b20-motion-prompt.txt")
                   + glob.glob(pay_dir + "/b20-negative.txt"))
    lines = []
    for f in files:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b20-motion-0819.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(sorted(lines)) + "\n")
    print("published", len(files), "file(s) + manifest ->", dst)
    raise SystemExit(0 if len(files) >= 6 else 1)
