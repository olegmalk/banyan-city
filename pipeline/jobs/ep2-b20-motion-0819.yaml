    standing requirement is that anything it publishes says so on its face, so
    the keys are appended here rather than asserted in a commit message nobody
    downstream reads. REFUSES if the sidecar is missing -- a clip whose
    provenance file did not get written must not pass silently.

    UNLIKE the beat-17 probe lane this clip IS a candidate for the cut, so it is
    stamped `is_show_content: true`. It is still `approved: false` and
    `provisional: true`: nothing is cut until the frames are opened against the
    bar this spec pre-registered, and R4 taste calls are the founder's.
    """
    import os, sys

    META = sys.argv[1]
    if not os.path.isfile(META):
        sys.exit("!! no sidecar at %s -- refusing to call the job clean." % META)
    with open(META, "a", encoding="utf-8", newline="\n") as fh:
