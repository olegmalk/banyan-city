                   + glob.glob(out_dir + "/bench-b20-macplate.jsonl")
                   + glob.glob(pay_dir + "/b20-motion-prompt.txt")
                   + glob.glob(pay_dir + "/b20-negative.txt"))
    lines = []
    for f in files:
        shutil.copy2(f, dst)
        c = os.path.join(dst, os.path.basename(f))
        with open(c, "rb") as fh:
            h = hashlib.sha256(fh.read()).hexdigest()
        lines.append(h + "  " + os.path.basename(f))
    with open(os.path.join(dst, "ep2-b20-motion-0819.sha256"), "w", newline="\n") as fh:
        fh.write("\n".join(sorted(lines)) + "\n")
    print("published", len(files), "file(s) + manifest ->", dst)
