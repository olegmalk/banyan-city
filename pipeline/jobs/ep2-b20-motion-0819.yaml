    #!/usr/bin/env python3
    """Stamp the clip's provenance sidecar.

    video_task.write_sidecar records model, prompt, negative, init sha and
    cost_usd 0, and it does not record whether the clip may ship. This lane's
    standing requirement is that anything it publishes says so on its face, so
    the keys are appended here rather than asserted in a commit message nobody
    downstream reads. REFUSES if the sidecar is missing -- a clip whose
    provenance file did not get written must not pass silently.

    UNLIKE the beat-17 probe lane this clip IS a candidate for the cut, so it is
    stamped `is_show_content: true`. It is still `approved: false` and
    `provisional: true`: nothing is cut until the frames are opened against the
    bar this spec pre-registered, and R4 taste calls are the founder's.
    """
    import os, sys

    META = sys.argv[1]
    if not os.path.isfile(META):
        sys.exit("!! no sidecar at %s -- refusing to call the job clean." % META)
    with open(META, "a", encoding="utf-8", newline="\n") as fh:
        fh.write(
            "# --- appended by ep2-b20-motion-0819 after the render.\n"
            "approved: false\n"
            "provisional: true\n"
            "is_show_content: true\n"
            "note: |\n"
            "  A CANDIDATE TAKE FOR BEAT 20'S CUT SLOT, not an engine probe. Beat 20\n"
            "  has NO footage: it is a slate on every cut this repo has made. It\n"
            "  animates 20-evidence-mac-plate-r1s1, picked off the pixels from the 25\n"
            "  seeds macbook1 drew on 2026-08-19 as the only one where the fig is\n"
            "  still in the grass, and it is judged against the bar pre-registered in\n"
