pre_registered_fail_modes:
  FAIL-COUNT: a leaf count other than exactly two, or a second stalk, or the leaflets
    coming back. r1s1 drew six to eight of them and this is CLASS A, so it is the
    clause the composite exists for.
  FAIL-NO-COVER: 'the plant ends up beside him rather than in front of him, or stops
    occluding him. That is the frame r1s1''s verdict already rejected, and it is reachable
    here in a way it is not on beats 15 and 19: the mask covers a strip of HIM, so
    a 0.30 pass could in principle resolve the overlap the other way and paint his
    thigh over the plant.'
  FAIL-FIGURE: his face, his skull, his poncho or his kneel drift. 0 px of him change
    going in and the face box is byte-identical, so any drift is the sampler's. Named
    because the mask DOES touch him.
  FAIL-WEED-RETURNS: a leaflet or a stub grows back in the cleared region. Pattern
    13's law -- an emptied region is filled with whatever the surviving cue suggests
    -- and beat 01 lost a rung to it. The weed was removed whole precisely so there
    is no cue left.
  FAIL-DECAL: 'any of pattern 5''s tells: shading ignoring the frame''s light (measured
    straight down, (0.02, -0.9998), from the sun disc rather than from a low-pass
    gradient his black trousers dominate); an edge stopping short of or overrunning
    the object''s own; detail at the wrong scale against his hand as an in-frame ruler.'
  FAIL-SMEAR: the erased vacancy resolves as fog or as a flat patch instead of as
    grass. The fill is per-row interpolation and asserts NO texture it cannot see,
    so the blade structure inside the vacancy is entirely the sampler's to supply.
    This is the honest risk of the removal method and it is named before the fire,
    not after.
negative_ordering: 'THE DEFECT CLASS IS FIRST ON PURPOSE, AND THE CEILING IS MEASURED
  RATHER THAN ESTIMATED. composite-init-pattern.md 4: animagine''s budget is 77 CLIP
  tokens and any word added silently drops the TAIL, which is where `text, photorealism,
  3d render, low quality` live. Measured with pipeline/clip_token_count.py on animagine''s
  own vocab, not counted in words: prompt 65 of 77, negative 68 of 77. The leaflet
  and branching-stem terms lead because they are r1s1''s OBSERVED defect, and the
  plant-girl block is carried from DRAFTS[3]''s own negative because naming a plant
  beside a figure summons alraune on this checkpoint.'
