not_done_on_purpose: No crop change. No crf change. No strength, guidance or sigma change. No negative
  edit. No second init. No new plate. No cut swap. The r2s2 route is left unfired on purpose so that if
  this fails, there is still an unspent lever with a known cost rather than a second wording.
pre_registered_fail_modes: H-FREEZE the clip holds the hand by holding everything; H1 passes, H3 fails,
  and it is a FAIL. H-SMUDGE the hand survives as a shape that is not a hand -- a mitten, three fingers,
  a blur -- which reads as a hold on any metric and not at 1:1. H-SECONDHAND naming a hand summons one
  and a second arrives somewhere in frame; nothing was added to the negative, so this is the fail mode
  that would earn a negative edit rather than one being pre-spent. H-FACE-COST the added sentence displaces
  conditioning the face clauses were using and the thought stops reading, without a freeze. H-LATE the
  hand survives f008 and goes later; that is PROGRESS and not a pass, and the frame it goes at is the
  number the next rung would be aimed with.
the_one_variable: ONE SENTENCE INSERTED INTO THE POSITIVE, naming the hand and placing it. Every other
  byte of the positive is the parent's, in the parent's order. THE NEGATIVE IS UNTOUCHED byte for byte
  -- it already carries melting, morphing and changing face and the hand dissolved anyway, and adding
  'disappearing hand' would put that phrase in the conditioning, which is the beat-15 trap. Init, crop,
  sha, size, frames, fps, guidance, sigmas, two-stage, offload and --image-crf 10 are the parent's. Across
  the four jobs the prompt bytes are identical and only the seed moves; h1's seed is the PARENT'S, which
  is what makes the set a controlled comparison rather than four fresh draws.
why_it_is_phrased_as_an_ongoing_action: 'Measured 2026-08-20 on b03/b13/b15: a terminal placement naming
  an ONGOING action held position at no cost to the performance (b15, HOLD 0.508, no freeze), while one
  naming a STATIC attitude bought the hold by making every frame the last frame (b03, 33 dead frames from
  f088; b13, face-band interframe 10.80 -> 0.64). Beat 09''s done_when IS the performance -- ''Guard 1''s
  face works through it, slowly'' -- so a static hand clause would trade the beat for the prop. Hence
  ''shifting a little against his cheek as he thinks'' rather than ''his hand does not move''.'
