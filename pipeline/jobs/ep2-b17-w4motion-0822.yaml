why: 'THE FOUNDER VETOED THE FACE ON 2026-08-22 -- ''that aint my goblin'' -- and it was the EYE. Rounds
  nine to twelve on beat 13 found it: naming the pupil (`slit pupils`, `constricted pupils`) draws a large
  rendered iris every time, while `eyebags` flips the fill to an off-white field and `jitome` fixes the
  size and shape. Both are RENDERING-CONVENTION tags, not feature tags, and that is the finding. Every
  plate was re-rendered as w4 on the corrected recipe and opened at 1:1 on a common-scale contact sheet
  before this spec was written.


  THE ACTION IS AUTHORED HERE -- this beat has never had a motion spec, so there was no sentence to carry.
  It is written to the wave''s laws and, because this plate is ALREADY in the pose the beat describes,
  it CONTINUES that pose rather than asking for it: beat 20 asked a plate to look up when its own inventory
  already said he was looking up, and got a still with a runtime. THE HEAD CLAUSE IS NOT CARRIED AS WRITTEN:
  it said `off-white eyes with narrow vertical slit pupils`, which is the vetoed eye, and a subject clause
  that disagrees with its own init is how this engine drifts a face back to its prior over a clip.'
