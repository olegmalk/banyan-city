# ep1 beat 10 at VO length. The affirmative-still recipe of ep1-b10-affirm-still-0811
# (committed 84c7d3e, rendered clean), extended from 65 frames to 257 so the shot
# covers the line instead of looping under it.
#
# WHY THIS EXISTS. Beat 10's slot in the v35 cut holds a 2.7s clip under a 10.124s
# line, which render_t3 loops about 3.9 times. Roman ruled out looping. A clip long
# enough to play once is the only thing that fills the slot.
#
# THE ARITHMETIC, measured rather than assumed. clips/10-vo.mp3 is 10.124s by
# ffprobe; the node copy (genomes/sapling/nodes/001-capability-inventory/clips/)
# and the cut copy (review/provisional-v35/clips/) are the same file, md5
# 133c37abe1799c3c13f12a2c065dc0cd.
#
#   floor   = vo + 0.4 = 10.524s -> 10.524 * 24fps = 252.576 -> 253 frames minimum
#   LTX     = 8n+1 frame counts only. 249 (n=31) is 10.375s and lands UNDER the
#             floor; 257 (n=32) is 10.708s and clears it. 257 is the smallest fit.
#   ceiling = vo + 2.0 = 12.124s. 10.708s is inside it, so render_t3 trims nothing.
#
# ONE VARIABLE. Frames, 65 -> 257. Everything else is held: the same plate prepared
# from 10-sense.png, seed 20260897, guidance 1.0, 8 steps, distilled sigmas,
# two-stage. The positive and negative prompt files are byte-identical copies of
# ep1-b10-affirm-still-0811's, its zero-negation positive included — that wording is
# what 84c7d3e was written to test, and changing a word of it here would fold two
# questions into one clip.
#
# WHAT LENGTH RISKS, named. 257 frames is nearly four times the length this wording
# has been seen at, and drift a 2.7s clip hides has 10.7s to accumulate. The stem can
# wander off the held posture late, or the take can read dead across ten seconds the
# way the 2026-08-03 K recipe did. Either outcome is a finding about length.
#
# NO METRIC RANKS THIS. On beat 14 the flow metric scored highest on the round where
# the sapling falls over (131e433). One clip, watched under the line it has to cover.
#
# ONE SAMPLE. One beat, one length change, one seed. Sequential; no batch
# (CLAUDE.md 2026-08-03).

