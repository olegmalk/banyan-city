success: 'ONE 832x1216 png at seed 20260823 on the h19 skeleton at scale 1.0, differing from ep2-jerry-face-f4-0820
  by f4''s wording with the NEGATIVE gaining `nose`, and nothing else. This is the OPPOSITE of f5 and
  it is the distinction canon already draws: w1 measured that a negative cannot undo what the POSITIVE
  asks for, per Ban et al. Here the positive does not ask for a nose -- the checkpoint draws one anyway
  -- which is precisely the case a negative is for. f5 put the suppression in the positive as `no nose`
  and flattened the entire face; this asks whether the same suppression in the negative takes the nose
  and leaves the mouth, the ears and the shading standing. PASS is 2 of 4 presences (P1 brow, P2 muzzle,
  P3 mouth, P4 shading) with T1, T2, T3 and T8 ALL intact. f4 scored 2 presences and missed T2 by a nose
  tip; nothing has yet scored the full set.'
