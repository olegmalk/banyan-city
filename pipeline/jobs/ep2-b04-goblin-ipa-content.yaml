# 002b beat 04 — ARM 2 of the consistency sample. Same beat, same four seeds,
# same prompt. One variable against ARM 1: WHERE the adapter is applied.
#
# WHY THERE IS AN ARM 2. Arm 1 (ep2-b04-goblin-ipa, done 2026-08-10) worked and
# charged for it. Seed-to-seed identity agreement rose from 0.6967 mean pairwise
# DINOv2 on the wave-1 baseline to 0.7828-0.8345 across four references at scale
# 0.6, and by eye each row of four is recognisably one creature where the
# baseline row is four. But the skin left the green band: the share of pixels at
# hue 140-170 deg fell from 0.256 on the baseline to 0.005, 0.001, 0.013 and
# 0.002 on the four arm-1 references, with mean saturation down from 0.256 to
# 0.10-0.23. Green is the founder's ONE named attribute. A mechanism that holds
# the character by draining his one stated colour out of it has not fixed the
# defect, it has traded it, and reporting the DINO gain without the hue loss
# would be reporting half a measurement.
#
# WHY IT HAPPENS AND WHY THIS IS THE LEVER. IP-Adapter carries the reference's
# palette along with its character, and every beat-04 reference is lit like a
# dim interior — the wave-1 lighting fault (morning light drew dusk in 4 of 4),
# now being fed back in and amplified. diffusers 0.29.2's set_ip_adapter_scale
# takes a per-transformer-block config and its own docstring names the split:
# up block_0 is where style is injected, down block_2 is where layout/content
# is. This arm scopes the adapter to down block_2 alone — ask the reference for
# the creature, leave the colour to the text prompt that was already delivering
# it. That is a documented lever, not a steward's theory of the UNet.
#
# ALL FOUR REFERENCES AGAIN, for the same reason as arm 1: nobody has picked a
# canonical goblin and this job does not pick one. Choosing the goblin is R4's.

id: ep2-b04-goblin-ipa-content
task: ep2-b04-goblin-ipa-content-0810
node: 002b-first-citizen
beat: 4
runner: box
needs_gpu: true
priority: 40
max_attempts: 1
owner: goblin-consistency lane

consumer: >-
  The same decision arm 1 serves — how episode 2 gets one goblin across fifteen
  beats — with the question arm 1 left open: whether the identity gain can be
  had WITHOUT the colour loss. If it can, the recommendation is a mechanism the
  founder's "green" and "nothing complex" both survive. If it cannot, that
  trade-off is the finding and he is the one who should hear it.

success: >-
  16 PNGs at C:\banyan-farm\goblin-ipa-0810\out2 (4 references x 4 seeds) with
  per-frame 7.2 sidecars, plus identity-agreement-content.yaml measuring the
  wave-1 baseline, the arm-1 cells and these four with ONE build of one metric.
  A result showing the scoped adapter loses the identity gain is a success:
  the job produces the measurement, not a preferred answer.

why: >-
  One variable against arm 1: the adapter is scoped to down block_2 instead of
  every block at 0.6. Sequential, one image at a time — batch-of-4 configs are
  banned on this card.

est_minutes: 6

