# 2026-08-15, deep-queue lane. Guard-only scene plate for beat 09, s2 EXCLUDED.
#
# 0. WHY BEAT 09 AGAIN WHEN ep2-b09-scene4-0815 ALREADY LANDED TODAY. Two reasons,
#    both concrete. First, scene4 ran on refs-guards-twoinfield-0813 WITH the s2 tile
#    in slot 2 -- the tile that degrades the cast to balloon heads across four beats --
#    so one of its four rounds was spent on a reference known to be bad. This round
#    spends all four on tiles that are not.
#    Second, and this is the practical one: beat 09's MOTION jobs are BLOCKED right
#    now because box_enqueue's plate check cannot fetch scene4's frames -- they have
#    not reached origin/farm-results-rtx5090 -- and the only beat-09 plates that HAVE
#    reached it are `-guardpick-` sets, which are identity cards on blank paper and
#    are barred. The guard's own prescribed remedy is 'publish the plate through a
#    farm-out job and point --src at it'. That is exactly what this job does, so it
#    CLEARS the block instead of waiving it. No guard is waived anywhere in this batch.
#
# 1. THE SCRIPT LINE THIS BEAT IS, quoted from the live approved script so the
#    mismatch would be VISIBLE if there were one:
#
#      "Guard 1's face works through it, slowly."
#
#    THE ACTION THIS JOB DRAWS: close on his face, head and shoulders, working slowly through an idea, eyes drifting, mouth slightly open.
#
#    The draft's action IS the script's, almost word for word: a face working slowly
#    through an idea. There is no other event in this beat, so there is no other
#    action it could have drawn.
#    The staging law constrains HOW an action is shot, not WHICH action is shot.
#    A well-executed wrong action is worse than a failed right one because it
#    looks like progress -- three beats rendered the wrong action this morning
#    because the action was written to suit the plate instead of the beat.
#
# 2. NO GOBLIN IS IN THIS FRAME. Beat 09 is a guard beat (1boy), the guard cast is
#    founder-approved, and nothing unsettled about the goblin design is inherited
#    here. That is the whole reason this beat is queueable tonight while 07, 08,
#    18 and 19 are not.
#
# 3. STANDING ACTION ONLY. Pose is unreachable through reference or prompt --
#    confirmed across 48 frames today, nothing crouched. This draft asks for no
#    crouch, no fold and no kneel, so it spends no render on a pose the mechanism
#    cannot produce.
#
# 4. THE REFERENCE, AND WHY IT IS NOT THE OBVIOUS ONE. The adapter owns
#    composition: rule 5, THE REFERENCE DECIDES AND THE PROMPT LOSES, for framing,
#    location and proportion. Beats 05 and 11 came back with a real field in frame
#    off `refs-guards-twoinfield-0813`; beats 06 and 09 came back as COSTUME CARDS
#    off `refs-charref-guards-r5-0812`, whose own draft reads "reference sheet,
#    multiple views, turnaround, ... white background". Same sampler, same arm,
#    same day. So this job uses the two-in-field reference and never a sheet.
#
#    IT USES A SET WITH THE s2 SLOT EXCLUDED, built for this batch and verified by
#    hash. Source `refs-guards-twoinfield-0813` s2 = a98aa7c261afab4b... is the
#    tile that degraded the cast to balloon heads across four beats. In
#    `refs-guards-twoinfield-nos2-0815` that hash appears in NO slot:
#      s0 26062b66dfcf9b22  (source s0)
#      s1 725a2c1163971f85  (source s1)
#      s2 293afe8187731764  (source s3, PROMOTED into the excluded slot)
#      s3 26062b66dfcf9b22  (source s0 again -- a DECLARED duplicate)
#    The harness builds four slots `{prefix}-s{i}` for i in 0..3 and refuses on a
#    missing file, so a set must have four files even when only three are trusted.
#    SCORE r0, r1 and r2. r3 is a known duplicate of r0 and its frames are
#    discarded -- said here, before the render, so it cannot be read as a finding.
#
# 5. TOKEN BUDGET, MEASURED ON THE BOX WITH THE REAL CLIP TOKENIZER, not estimated
#    on the Mac (the Mac estimator lies by ~3 tokens). I ran this exact draft
#    through the harness's own `--dry` before writing this file:
#      positive 67/77
#      negative recipe 72 -> sent 72  (NOTHING was dropped)
#    Terms that overflow 77 are dropped silently and the first casualties are
#    `photorealistic` and `3d render`, which are what hold back the 3D-CG look the
#    founder killed. Both are the negative's leading terms and both are in the
#    sent string. The count tag derived '1boy' and the block declares '1boy' --
#    that check is exactly what failed ep2-b06-plate-0815 at its dry step for $0
#    on 2026-08-14 (its draft said "Two adult guard men" under a 1boy block), and
#    it is why this job runs `dry` first too.
