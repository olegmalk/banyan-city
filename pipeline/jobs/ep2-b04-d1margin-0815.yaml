prediction: 'WRITTEN BEFORE THE RUN. The mechanism under test: the IP-Adapter reference transfers
  the fraction of the tile the HEAD occupies, and the model spends that fraction as head-to-body
  ratio in a full-body output — so a tight crop reads as "big head relative to body" and draws a
  toddler.

  THE LADDER IT ALREADY CLIMBED (ep2-b04-d1refs-0815, all sixteen frames opened): head-fraction
  0.33 -> 3 to 3.5 heads tall; 0.34 -> 3 to 3.5; 0.19 -> 4.5 to 5; 0.65 -> a portrait. Monotone
  across four points.

  THE MARGINED SET HALVES EVERY RUNG: s0 0.33->0.17, s1 0.34->0.17, s2 0.19->0.095, s3 0.65->0.33.

  SO I PREDICT, per round, in heads-tall, judged the same way the previous lane judged:

    r0 (m-s0, 0.17)   4.5 to 5 heads. A full head TALLER than the control''s r0. This is a
                      replication of the control''s r2, from a crouch tile.
    r1 (m-s1, 0.17)   4.5 to 5 heads. Same, and the two crouch rounds should agree with each
                      other as they did in the control.
    r2 (m-s2, 0.095)  5 heads or more — the tallest round, off the end of the measured range.
    r3 (m-s3, 0.33)   NOT A PORTRAIT ANY MORE. A full or three-quarter figure at 3 to 3.5 heads,
                      landing exactly where the control''s CROUCH slots landed. This is the
                      sharpest single frame in the run: the tile still contains nothing but a
                      head, so if framing is the driver it moves from "bust" to "chibi full
                      figure" on crop alone.

  PASS = the two crouch rounds clear 4 heads and stop reading as babies, and the ranking of the
  four rounds follows the head-fraction ladder.

  WHAT WOULD FALSIFY THE MECHANISM — any one of these, and I report it as a kill, not a caveat:

    F1  NO MOVEMENT. All four rounds come back at the control''s numbers (3-3.5, 3-3.5, 4.5-5,
        busts). Then margin is inert, the slot-to-slot spread in the control came from what is IN
        the tile — a crouched body genuinely is a squashed body, a bust genuinely is a head — and
        the baby read has another cause, most likely the draft wording or the base model. This
        would kill the framing theory outright.
    F2  FRAMING MOVES, PROPORTION DOES NOT. The outputs become wider shots with smaller figures
        that are STILL 3 to 3.5 heads tall. Then the reference carries framing only, re-cropping
        is not a fix for the baby, and the two claims have to be separated.
    F3  r3 STAYS A BUST. Then it is head CONTENT and not head CROP that makes a portrait, and
        "the tighter the crop, the more infantile" is the wrong description of what was seen.
    F4  IDENTITY COLLAPSE. All four rounds converge on one look regardless of slot, or the green
        skin / cream robe / red eyes drain out. Then a 0.5 margin has simply turned the adapter
        off and this run measures nothing about proportion. Distinguishable by eye: the control''s
        four rounds were plainly four different pictures.

  NOT A FALSIFIER, and stated so it cannot be smuggled in as one: POSE. I expect NONE of the
  sixteen to be crouching, exactly as in the control. Pose does not transfer through this
  mechanism and this job does not test whether it does. If nobody crouches, that is the known
  result, not evidence against margin.

  NOT A PREDICTION ABOUT TASTE. Heads-tall is a measurable; "a young dumb goblin, but not cute"
  is the founder''s and is judged separately and reported separately.'

