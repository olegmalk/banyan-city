why: 'ONE SAMPLE, ONE VARIABLE. Every argument here is byte-identical to ep2-b04-d1refs-0815
  except --refs, --ref-prefix and --out, and ep2-b04-d1refs-0815 was itself byte-identical to
  ep2-goblin-freeze-w015-0814 except the same three. So this frame set sits on a two-step chain
  where each step moved one thing.

  WHAT THE REFERENCES ARE. refs-goblin-d1-margin-0815, frozen at
  pipeline/refs/refs-goblin-d1-margin-0815.yaml. Four tiles, each the corresponding tile of
  refs-goblin-d1-0815 resampled to 416x416 and pasted centred on an 832x832 white field:

    goblin-d1s1m-s0.png  154c99aa..  <- s0 dd4b30cd..  crouch A
    goblin-d1s1m-s1.png  ce0fbe5b..  <- s1 c51c6467..  crouch B
    goblin-d1s1m-s2.png  4dde5c00..  <- s2 9526882e..  standing full body
    goblin-d1s1m-s3.png  71a0417f..  <- s3 d84abe2f..  bust

  No new crop is taken out of the source sheet, so no neighbouring figure and no new content
  enters the set — which is the failure mode "re-crop with more margin" invites, because the
  figures on the source sheet touch. Every figure pixel is the frozen tile''s own pixel at half
  the linear size. All four corners of all four source tiles were verified pure white before the
  field was added, so the added margin is continuous with the margin already there.

  All four margined tiles are four distinct sha256, so the sampler''s duplicate-cell guard drops
  nothing and the arm draws all sixteen frames rather than silently fewer.

  WHAT IS NOT TOUCHED. The prompt, the negative, the draft key, the seeds, the steps, the guidance,
  the arm (window4: the 15% window at scale 0.6 across all four references, four seeds each), the
  beat, the harness and the sampler. This arm adds no word to either prompt, so the negative is
  unchanged from the control and stays where it already was inside the 77-token budget — the
  colour-anchor arm is the only one that spends tokens and it is not this arm.

  NOT A LICENCE TO SCALE. Twelve beats stay on refs-goblin-approved-0814 no matter what these
  sixteen frames show. The budget is at the freeze boundary and this is the only render
  authorised.'
