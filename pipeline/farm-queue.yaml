# 2026-08-02. Per-beat ACTION prompts — the fix for the hoodie.
#
# The overnight beat-2 clip held the approved frame correctly (the prompt fix
# works) but the man pulled his hoodie up and down instead of typing. Founder:
# "he didnt type at all." Of course not — every one of the fifteen beats was sent
# the same motion instruction, "gentle drift; only what would really move here",
# so the model had to guess what moves and guessed wrong.
#
# node.md has said what moves all along, per beat, in the author's own words:
#   beat 1  "One mechanical keyboard, very fast — then it stops"
#   beat 3  "The spinner resolves"
#   beat 4  "A sharp breath in — the frame tips sideways — the mug hits the floor
#            before he does"
# shots.md describes how a beat LOOKS; node.md describes what HAPPENS. We were
# reading only the first and inventing the second. video_task.beat_actions() now
# reads the second and puts it at the front of the prompt.
#
# `motion` below is now only the discipline suffix (no new subjects, no scene
# change) — the actual instruction comes from the script.
#
# Beat 2 is back in the queue because its take was rejected on motion, not on
# framing. One beat per task, after the eight-hour batch stall.
