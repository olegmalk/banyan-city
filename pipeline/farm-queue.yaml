  why: >-
    D18 says a metered service gets a monitoring line on the status page, and a
    meter nobody can read is not a meter. The consumer is dad, who paid the >$100
    and asked for money to be kept in mind permanently — he should be able to see
    the current month's build volume on the page instead of on an invoice a month
    later. $0 sources only, and only two are known to exist: the new account's
    Vercel usage endpoint IF that account's tier exposes one (unverified — do not
