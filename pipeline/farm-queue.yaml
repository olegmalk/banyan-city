# THE FASTWAN SAMPLE IS LICENCE-CLEARED AND UNIMPLEMENTABLE, and this entry is the
# distance between those two facts. db26f7b cleared the licence. Nothing cleared
# the code, and nothing had looked.
#
# wan_i2v.py holds exactly two load_lora_weights calls, at :317 and :319, and both
# sit inside load_animegen() (:216). They are hardcoded to Lightning's two-expert
# A14B shape — high_noise_model / low_noise_model, adapter_name high / low,
# load_into_transformer_2 on the second. The TI2V-5B path (:394 onward) has no
# adapter mechanism at all: no loader, no flag, no fuse. A 5B LoRA is not a flag
# away; it is a path that does not exist.
#
# THREE THINGS NOT TO REDERIVE:
#   * repo id and weight name are PARAMETERS. The A14B path hardcodes both, which
#     is exactly why it serves one LoRA and only one.
#   * LOAD, DO NOT FUSE — the diffusers Wan GGUF precedent. Fusing writes the
#     adapter into the base weights and the sidecar can no longer say honestly
#     which weights ran.
#   * THE SIDECAR MUST NAME THE LoRA, not just the 5B base — and the licence gate
#     will not catch you if it does not. See licence-gate-substring-1786123560:
#     the bare string `fastwan` resolves to Apache-2.0 today by matching `wan`
#     inside itself, having read nothing.
#     THE GATE CATCHES IT NOW (2026-08-08, that entry's fix): keys match whole
#     tokens, so `fastwan` matches nothing at all and fails closed — an unread
#     LoRA named in the sidecar is a violation instead of a silent Apache-2.0.
#     Naming the LoRA is still the requirement; what changed is that omitting it
#     is now the only way to stay quiet, and scan_media catches THAT.
- id: lora-5b-load-path-1786123500
  runner: manual
  worker: m1pro
  needs: []
  window: any
  est_minutes: 90
  cmd: >-
    give wan_i2v.py's TI2V-5B path a --lora option — repo id and weight name as
    parameters, load and never fuse, and the adapter recorded in the sidecar by
    name
  why: >-
    t5-fastwan-sample-b01-1786090260 reads runnable and cannot be run: its licence
    is cleared, its recipe is written, and the 5B has never loaded a LoRA in its
    life. This is the one piece of real work between that row and a clip.

# THE GATE SAID Apache-2.0 ABOUT FASTWAN BEFORE ANYONE HAD READ FASTWAN'S LICENCE.
# It was right, and it was right by accident. Verified by running the classifier,
# not reasoned about:
#   model_licences("fastwan")  -> [("wan", "Apache-2.0")]
#   engine_licence("fastwan")  -> "Apache-2.0"
#   "fastwan" in MODEL_LICENCES -> False
# Matching is substring-based — model_licences (licence_gate.py:520, `if name in
# norm` at :531) — and the key `wan` (:332) sits inside `fastwan`. The verdict was
# allow-by-inheritance from a table entry about a different model, and it was
# invisible precisely BECAUSE the accident agreed with the truth this time: db26f7b
# went and read FastVideo's own LICENSE and it is Apache-2.0. The next one will not
# agree, and nothing will say so.
#
# THE TABLE ALREADY KNOWS THIS FAILURE and its safeguard did not hold.
# licence_gate.py:187-194 documents the identical hazard in the PREFIX direction —
# a hypothetical non-commercial VoxCPM3 waved through by `voxcpm` — and prescribes
# discipline: "add every new version explicitly, after reading ITS licence, and
# never rely on the prefix". `fastwan` is the SUFFIX direction. It does not read
# like a version bump, so nobody thought to add it. That is the whole lesson:
# discipline is not the fix, because the failure mode is not remembering.
#
# HARD CONSTRAINT FOR THE IMPLEMENTER. The table's semantics are load-bearing for
# lint's debt ratchet (LICENCE_DEBT = 38, lint_genome.py:61; :49 names the ONE
# reason the number may rise). Token-aware matching WILL change what some strings
# resolve to. The fix must not reclassify shipped assets — the ratchet stays 38, or
# the commit explains in the file why it moved and D15 moves with it.
# RETIRED 2026-08-08 NIGHT — licence-gate-substring-1786123560, done in the commit
# that carries this line. Matching is token-aware and per-identifier now
# (licence_gate.identifiers / _match_grades / model_licences), and the rule is the
# asymmetry this entry's own text kept pointing at: a restriction may travel to a
# variant, an ALLOWANCE never may.
#
#   model_licences("fastwan")                    -> []            (was Apache-2.0)
#   engine_licence("fastwan")                    -> None          → fails closed
#   engine_licence("Lykon/dreamshaper-8-anything") -> "unread variant of
#                                                   dreamshaper …"  (was OpenRAIL)
#   engine_licence("VoxCPM3")                    -> same shape    (was Apache-2.0)
#
# Both directions the entry named, plus the one it did not:
#   * SUFFIX — a key must match whole TOKENS, so `wan` is not inside `fastwan`.
#   * FINETUNE — an allow key is honoured only where it NAMES the identifier;
#     leftover words (`-anything`, `-nsfw-merge`) or a fused version (`voxcpm3`)
#     demote the hit to licence_gate.UNINHERITED, which classify() reads as
#     unknown. The finding is POSITIVE, not a dropped hit — a dropped one goes
#     quiet the moment the same sidecar also names our own GPU.
#   * MOST-SPECIFIC-WINS — a key that names the identifier answers for it, so
#     adding `voxcpm2` now MAKES that string resolve instead of leaving it in the
#     base key's doubt. Adding a version is rewarded, which is what every "add
#     every new version explicitly" comment in that file was asking for and could
#     not enforce.
#
# THE HARD CONSTRAINT ABOVE WAS MET AND MEASURED, not asserted: `licence_gate.py`
# run before and after prints BYTE-IDENTICAL output — 25 violations, ratchet 25,
# same files, same documents cited — and all 61 distinct provenance strings in
# genomes/, cuts/ and the trial gallery resolve to exactly the licence they did
# before. The only three strings in the repo or the tests whose verdict moved are
# the three hazards above. Nothing was reclassified, so D15 does not move.
# Regressions live in test_pipeline.test_licence_gate, both directions, and the
# 16 real strings are asserted by value so the next matcher change has to show its
# work the same way.
#
# ONE DEFERRAL, DECLARED RATHER THAN DISCOVERED: licence_gate.ALLOW_INHERITS lists
# the keys whose allowance may still reach a name nobody read, and `wan` is the one
# entry there that is weights rather than a service or our own compute. It is there
# because ~100 sidecars name hosted wan previews whose real document is the platform
# grant recorded beside them, and strict matching would refuse every one for the
# wrong reason. The successor entry below is that tightening, and it is a
# classification job, not a matcher job.
- id: licence-gate-wan-versions-1786212300
  runner: manual
  worker: m1pro
  needs: []
  window: any
  est_minutes: 60
  cmd: >-
    give licence_gate a key per wan version we have actually used — wan2.1, 2.2,
    2.5, 2.6, 2.7, wan-api, the -plus variants — each with the document that
    governs IT (open weights vs Model Studio's terms), then delete `wan` from
    ALLOW_INHERITS and confirm the gate output is unchanged
  why: >-
    `wan` is the last allow key whose licence can reach a release nobody read, and
    the table's own comment already says the hosted previews publish no weights, so
    Apache-2.0 is the wrong document for six of the values we write today. The gate
    would then cite the right one, and the last declared allow-by-inheritance in
    the file goes away. Consumer: the publish gate and every wan sidecar's
    `model_licence` line, which farm_worker writes from engine_licence().

