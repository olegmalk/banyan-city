# 2026-08-02, v3 — TWO MACHINES IN PARALLEL.
#
# Founder: "can you do multiple beats at a time? that will be the best." On ONE
# GPU, no — two renders on one card each run at half speed (the contention that
# cost four hours on 2026-08-01), and batching already avoids the only real
# overhead there is, the model reload. Within a batch each clip PUSHES AS IT
# FINISHES, so the first arrives in ~10 min and the rest every ~6.
#
# Across TWO machines, yes. farm-results-msi shows 6 completed video renders, so
# the older Windows laptop can do this. Split:
#
#   rtx5090  beats 1-10   faster card, model already cached
#   msi      beats 11-15  16GB, takes the two-process path, so fewer
#
# Wall clock roughly halves: ~55 min for the 5090's ten, ~45 for the MSI's five,
# running at the same time. Needs a human to start the MSI worker.
#
# Beats are assigned EXPLICITLY rather than worker: any — done_ids is per-worker,
# so two workers on "any" would each render the whole queue.
