# 2026-08-02 — A/B THE SPEED FIX FIRST. It may have corrupted the picture.
#
# Founder on the step sweep: "all of these step sweep results are bad and corrupt
# the image. there is barely a difference between them as well."
#
# The second half of that sentence is the diagnostic. 20 steps and 4 steps should
# look DRAMATICALLY different; they look nearly identical. When step count stops
# mattering, the conditioning is not driving the denoiser — and the steward changed
# exactly that by hand-passing prompt_embeds in order to evict the 11.4GB text
# encoder (the change that took 536s to 66s).
#
# Two variables moved at once, so this isolates them. Same beat, same still, same
# seed, same motion.yaml direction, same 20 steps:
#   ab-evict-on   hand-passed prompt_embeds, encoder evicted   (~66s)
#   ab-evict-off  the pipeline's own prompt path, encoder resident (~536s)
#
# If ON is corrupt and OFF is clean, the speed fix is the cause and gets reverted
# or repaired — an 8x speedup that damages every frame is worth nothing.
# If BOTH are corrupt, it is the motion.yaml prompt and the speedup stands.
#
# The 15 beats sit behind the A/B deliberately. Rendering them through a pipeline
# that might corrupt every frame would waste the time the speedup just bought.
#
# Also confirmed from the founder's review of the 12 v2 clips, for whoever picks
# this up: beat 9 does not move at all, beat 2 is random camera motion, beat 7 has
# the sapling moving aggressively and strangely. motion.yaml addresses 2 and 7
# directly ("camera locked" on every entry, and beat 7 asks for a leaf whip rather
# than a camera shake). Beat 9 asks for "leaves stir very slightly", so it may stay
# static — that one is a direction problem, not a model problem.
