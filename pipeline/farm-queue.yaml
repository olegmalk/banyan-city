# Covered by test_the_nested_init_frame_dialect_resolves_like_the_flat_one and
# test_every_served_cut_posters_the_frame_its_record_names.
#
# ---- the entry, kept for the read it was filed on ---------------------------
#
# THE READ. The v2 renders in review/ep2-b01/ (wan5b-b01-v2.mp4, ltx-b01-v2.mp4)
