# PROPOSAL ONLY — do not implement off this entry. It changes how quickly the
# status page can notice a dead box, which is a call about what we are willing to
# be blind to, not a cleanup.
- id: telemetry-idle-cadence-proposal-1786166940
  runner: manual
  worker: any
  needs: []
  gate: founder
  gate_ref: >-
    Nobody has agreed to trade liveness for quiet. This entry is the written
    proposal and the tradeoff; the decision is dad's or the founder's.
  window: any
  est_minutes: 20
  cmd: >-
    put the proposal below in front of dad, and implement nothing until he picks
  why: >-
    telemetry.py's PUBLISH_SECONDS = 300 fires whether the box is rendering or
    sitting idle — 288 pushes a day, forever, and the 2026-08-08 forensics found
    96.9% of 613 recent rtx5090 push gaps sitting in that 4-6 minute band. PROPOSAL:
    keep 5 minutes while a task is in flight, back off to ~30 minutes when the
    queue is empty and no render is running, and push immediately on the
    idle->busy edge so starting work is never delayed by the slow cadence. That is
    roughly 288 -> 48 pushes on an idle day. TRADEOFF, stated because it is the
    whole reason this is gated: liveness detection on the status page gets 6x
    slower exactly when the box is idle, so a machine that dies quietly reads as
    "fine, just idle" for up to half an hour instead of five minutes — and an idle
    box is the one most likely to have died without anyone noticing. WORTH SAYING
    PLAINLY: after D18's ref allowlist lands, these pushes cost nothing per push,
    so this is push NOISE, not spend. It should be argued on whether a 30-minute
    blind spot is acceptable, and not sold as saving money it will no longer save.

# ---- THE COURIER'S BARE COMMIT, STILL OPEN AT HEAD --------------------------
#
# Adjacent to the incident and found while measuring it. Not fixed — verified
# present at HEAD on 2026-08-08.
#
#   farm_worker.py:155  sh("git", "add", "-A", str(self.out), check=False)
#   farm_worker.py:156  sh("git", "commit", "-qm", f"hb: {stage}", check=False)
#
# Line 155 is correctly pathspec-scoped to farm-out/. Line 156 is NOT: a bare
# `git commit` writes the WHOLE INDEX, so anything another process staged in that
# working tree before the heartbeat fired is swept into a commit labelled
# `hb: <stage>` and force-pushed to a courier branch. The worker shares its
# checkout with whatever else is running there, and the commit that carries the
# accident is the one nobody reads, on the branch nobody reads.
# RETIRED 2026-08-08 — courier-commit-pathspec-1786167000. Courier.mark() now runs
# `git commit -qm "hb: <stage>" -- <farm-out>`, so the commit is scoped to the same
# path line 155 stages and a file another process left in the index stays there.
# Covered end to end by test_a_heartbeat_commits_only_the_heartbeat: it stages an
# unrelated file in a throwaway checkout, runs a real mark(), and asserts the file
# is neither in the commit nor lost from the index. Verified against the old code
# first — a bare commit sweeps it in and clears the index, which is the behaviour
# the test would now catch.
#
# THE FIX DOES NOT REACH A RUNNING BOX UNTIL ITS CHECKOUT TURNS OVER. Each worker
# runs the farm_worker.py in its own working copy, so a machine that has not
# pulled since 2026-08-08 is still committing the whole index every five minutes.
# The second half of the retired entry — auditing the courier branches for
# heartbeat commits that already carry unrelated files — is NOT done and is not
# assumed to be empty; it is a history read on four branches, filed as
# courier-branch-sweep below rather than quietly dropped.

- id: courier-branch-sweep-1786190400
  runner: manual
  worker: any
  needs: []
  window: any
  est_minutes: 30
  cmd: >-
    on each farm-results-* branch (rtx5090, msi, m1pro, m2) and runpod-results,
    `git log --format='%H %s' --name-only` filtered to commits whose subject
    starts `hb:`, and list every path outside farm-out/ that any of them touched.
    Anything found is someone's work committed under a heartbeat message — decide
    per file whether it is still wanted anywhere before the branch is next
    force-pushed over.
  why: >-
    The bare-commit bug is fixed forward but wrote history for as long as it
    existed, and these branches are force-pushed on a 5-minute timer, so anything
    swept into them is one push from being unreachable. The consumer is whoever
    lost a file in a shared checkout and has never been told where it went.

# RETIRED 2026-08-08 NIGHT — 002b-candidates-dangling-links-1786190460, done in the
# commit that carries this line. (B) WAS CHOSEN AND (A) IS DELETED: no candidate PNG
# is un-ignored, the ~120 MB of repo growth is not paid, and neither the board's
# links nor the build's copy step can now reach a file the deploy will not have.
# `build_site.in_the_tree()` is the gate and both go through it, so the two cannot
# disagree about what exists. What that was worth tonight is stated plainly below.
#
# READ THIS BEFORE YOU BELIEVE THE ENTRY ABOVE — ITS PREMISE DID NOT REPRODUCE.
# The entry says "every local build_site run produces links to frames that are not
# in the tree". Measured at HEAD tonight, on this laptop, with all 185 candidate
# PNGs sitting on disk: the site emits ZERO hrefs into any `*-takes/` directory,
# site-wide. build_shotboard renders candidate cells only for a beat that is NOT
# approved (`{'' if approved else variant_cells(...)}`), and 002b's beats are
# approved now, so the 164 links this entry is named after are not in the tree.
# They were real when it was filed; approving a beat retires them.
#
# SO THIS COMMIT DOES NOT CLOSE THE LOCAL RED, AND MUST NOT BE READ THAT WAY.
# Isolated A/B — same tree, HEAD vs this commit, both with the 185 PNGs present —
# both exit 1, and the two broken-link sets are IDENTICAL: 38 links, every one a
# `sapling/posters/take-*.jpg` or `still-*.jpg` on 001's shot board, not one of
# them a candidate frame.
#
# WHAT THE LOCAL-ONLY RED ACTUALLY IS, measured, so the fourth re-diagnosis can
# stop: it is ffmpeg. Same commit, same tree, only PATH differs —
#     ffmpeg present → exit 1, 38 broken poster links
#     ffmpeg absent  → exit 0, 70 pages swept, none broken
# With ffmpeg the board asks for a 480px thumb per beat, is told it was made, links
# it, and the file is not there when the build ends. Without ffmpeg — which is the
# Vercel build image — no thumb URL is emitted at all and the filmstrip falls back
# to the copied full-size PNG, which does exist. That is why every laptop is red and
# the deploy is green, and why CI structurally cannot see it. It belongs to
# review-poster-names-stale-still-1786197251, in flight in this same file; that
# working copy, run here by accident, takes the same build to exit 0.
#
# WHAT THIS COMMIT DOES CHANGE, measured: 002b's published takes/ goes from 22
# copied files plus a WITHHELD.md to empty. Nothing linked them either way, so no
# visitor loses a link — what goes is 22 orphan files on the deploy and a notice
# whose own first sentence ("these takes exist in the repo") was false for every
# frame it named. 001's takes/ archive is TRACKED (the
# `!…/001-capability-inventory/takes/**` un-ignore) and is untouched: its 22 files
# and its WITHHELD.md still ship, so the withheld path still works. The skip is
# printed, never silent — 185 here — because a forgotten `git add` and a deliberate
# ignore look identical from outside, and that silence is what let this be argued
# about three times.
#
# ASKS WHAT GIT KEEPS, NOT WHAT .gitignore MATCHES, a deliberate widening of the
# entry's wording: a file nobody has committed yet is exactly as absent from the
# deploy as a deliberately ignored one, and if the two got different answers this
# comes back wearing a different hat. The standalone board (`build_shotboard.py …
# --out`, base64, gitignored) is deliberately NOT filtered — judging uncommitted
# candidates is the only reason that page exists. Three tests on real git
# repositories, including the no-git case, which must fall back to every file on
# disk rather than publish nothing; a mocked `ls-files` would only test the mock.

- id: rtx5090-schtasks-sweep-1786190520
  runner: manual
  worker: any
  needs: []
  window: any
  est_minutes: 30
  cmd: >-
    on the rtx5090 box (ssh alias rtx5090, cmd.exe), `schtasks /query /fo LIST
    /v | findstr /i banyan` to list every banyan-* registration, and for each one
    read what it fires before deleting it — a task that re-arms a render is not
    the same as a task that only logs. Delete with `schtasks /delete /tn <name>
    /f`, one at a time, and paste the before/after list into the report.
  why: >-
    Roughly 19 stale banyan-* scheduled tasks are registered on that box from past
    lanes; two of them were armed to RE-FIRE a render and were killed on
    2026-08-08 after they did. The rest are unaudited. The consumer is anyone who
    starts a render on that machine and needs to know that nothing else will
    launch onto the same card behind them — which is exactly the collision that
    cost ten hours on 2026-08-07. Supervised on purpose: a blind `/delete` loop
    over a findstr match is how a scheduled task somebody still wants disappears.

# NOT the frames bug it looked like. Kept as an entry because what it IS is worse
# for the queue's honesty than an arithmetic error would have been.
- id: queue-id-borrowed-by-hand-run-1786190580
  runner: manual
  worker: any
  needs: []
  window: any
  est_minutes: 30
  cmd: >-
    decide what a hand-run should do with a queue task's id. Either it claims the
    task properly (write the STARTED/DONE heartbeat lines, so the promoter can
    retire it) or it takes its own id and the queue entry stays open. Then make
    the chosen one the easy path — today both are equally easy and one of them
    lies. Whatever is decided, record it in this file's ENTRY SHAPE header, since
    that is where the next person looks for what an id means.
  why: >-
    STATE.md 2026-08-08 records "that queue entry asks for seconds 2.5 and the
    pipeline delivered 4.708s — nobody has explained the gap". The frames
    derivation is not the gap and is not broken: wan_i2v computes
    `frames = int(seconds * fps)` and video_task passes the task's `seconds`
    straight through, which reproduces all three clips exactly — 4.71s to 113
    frames, 6.05s to 145, 6.042s to 145. The clip's own sidecar says
    `seconds: 4.71`, and write_sidecar can only have read that from the task dict.
    So nothing ever asked the pipeline for 2.5: the render was hand-run with the
    queue entry's ID and a different recipe, which is also why no `DONE
    task=002b-b01-video-5b-1786089900` line exists on any heartbeat. The consumer
    is anyone reading this queue to find out what has actually been rendered —
    right now an id in a sidecar does not mean the queue entry ran.

# RETIRED 2026-08-08 — wan-bench-sidecar-beat-1786190640, done by 49f54ac (`the
# bench path can be told which beat it is rendering, and says nothing when nobody
# tells it`). `--beat` exists on wan_i2v and is threaded to both `if bench:`
# write_sidecar calls; a --jobs entry's own `beat` overrides it per clip, and
# video_task's wan jobs entries now carry one.
#
# DEFAULTED TO NOTHING, not to 0, which is where this entry's own `cmd` was wrong.
# It asked for "a --beat that defaults to 0" — that keeps writing `shot_beat: 0`
# over beat 1 on every run nobody remembers the flag on, and a placeholder 0 is
# indistinguishable from a real beat to every reader. Unset now OMITS the field,
# the drop-a-None convention video_task._yaml_map and `extra` already state, so an
# untold bench clip reads as "not recorded" instead of claiming a beat.
#
# One thing --beat could have broken and does not: write_sidecar publishes
# seed_base + beat, so naming a beat while handing over the seed itself would move
# a recorded seed and publish a draw that never happened. wan_i2v.sidecar_seed_base
# subtracts it, as ltx_i2v.py:1164 already did. beat=0 had made that subtraction
# invisible.
#
# The three files this was filed for keep their correction blocks and their
# `shot_beat: 0` — render-time provenance is not rewritten here
# (review/ep2-b01/wan5b-b01.mp4, its -v2, cuts/checklist/002b-b01-5b.mp4). What
# changes is that the next bench clip screened as a beat needs no block at all.
# Pinned by test_bench_sidecar_names_the_beat_or_omits_it, including two AST checks
# that neither call site hard-codes a beat again — the stage functions need torch,
# so nothing else in CI can reach them. Deleted rather than annotated, as
# t4-sageattention was: `runner: manual`, which the promoter never retires.

