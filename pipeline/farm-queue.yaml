# 2026-08-02, v3 — REVIEW PASS. Sized for a fast look, not final quality.
#
# Founder: "2.5 hours? thats a lot." Correct. Measured cost is 599s of sampling per
# 480x832 / 20-step clip plus ~3 min of model load per task, so 15 separate tasks
# was ~3.2 hours. Three changes bring it under 1.5:
#
#   batches of 5   one model load per five clips instead of per clip  (-36 min)
#   12 steps       instead of 20                                     (-60 min)
#   2.5s clips     instead of 3.0                                    (-15 min)
#
# WHAT THIS COSTS: 12 steps is genuinely less refined than 20. It is the right
# trade for THIS pass because the question being reviewed is MOTION — does beat 1
# type, does beat 2 stop redrawing the monitor, does anything cut to a new scene —
# and motion is decided by the prompt, not the step count. Any beat the founder
# approves gets re-rendered at full steps before it ships.
#
# 2.5s also matches his verdict on beat 1: "beat 1 was a bit long anyway, 2.45 sec
# is good, no need to loop."
#
# Batching is safe again now that _stream kills a batch producing nothing for 45
# minutes — the eight-hour stall that made batching look reckless is detectable.
# Five per batch, so a wedge costs five clips rather than fifteen.
