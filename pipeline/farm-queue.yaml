#                                     alternate episode rather than one clip. Fails
#                                     fast if the model does not load, because the
#                                     weights will be cached by then, and the retry
#                                     cap stops it looping.
#
#   3. prefetch                        speculative, last, as always.
#
# Two hours of work for a night. If AnimeGen turns out broken we still wake up
# with a publishable episode 1.
