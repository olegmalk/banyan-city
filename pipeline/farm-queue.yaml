# PROPOSAL ONLY — do not implement off this entry. It changes how quickly the
# status page can notice a dead box, which is a call about what we are willing to
# be blind to, not a cleanup.
- id: telemetry-idle-cadence-proposal-1786166940
  runner: manual
  worker: any
  needs: []
  gate: founder
  gate_ref: >-
    Nobody has agreed to trade liveness for quiet. This entry is the written
    proposal and the tradeoff; the decision is dad's or the founder's.
  window: any
  est_minutes: 20
  cmd: >-
    put the proposal below in front of dad, and implement nothing until he picks
  why: >-
    telemetry.py's PUBLISH_SECONDS = 300 fires whether the box is rendering or
    sitting idle — 288 pushes a day, forever, and the 2026-08-08 forensics found
    96.9% of 613 recent rtx5090 push gaps sitting in that 4-6 minute band. PROPOSAL:
    keep 5 minutes while a task is in flight, back off to ~30 minutes when the
    queue is empty and no render is running, and push immediately on the
    idle->busy edge so starting work is never delayed by the slow cadence. That is
    roughly 288 -> 48 pushes on an idle day. TRADEOFF, stated because it is the
    whole reason this is gated: liveness detection on the status page gets 6x
    slower exactly when the box is idle, so a machine that dies quietly reads as
    "fine, just idle" for up to half an hour instead of five minutes — and an idle
    box is the one most likely to have died without anyone noticing. WORTH SAYING
    PLAINLY: after D18's ref allowlist lands, these pushes cost nothing per push,
    so this is push NOISE, not spend. It should be argued on whether a 30-minute
    blind spot is acceptable, and not sold as saving money it will no longer save.

# ---- THE COURIER'S BARE COMMIT, STILL OPEN AT HEAD --------------------------
#
# Adjacent to the incident and found while measuring it. Not fixed — verified
# present at HEAD on 2026-08-08.
#
#   farm_worker.py:155  sh("git", "add", "-A", str(self.out), check=False)
#   farm_worker.py:156  sh("git", "commit", "-qm", f"hb: {stage}", check=False)
#
# Line 155 is correctly pathspec-scoped to farm-out/. Line 156 is NOT: a bare
# `git commit` writes the WHOLE INDEX, so anything another process staged in that
# working tree before the heartbeat fired is swept into a commit labelled
# `hb: <stage>` and force-pushed to a courier branch. The worker shares its
# checkout with whatever else is running there, and the commit that carries the
# accident is the one nobody reads, on the branch nobody reads.
- id: courier-commit-pathspec-1786167000
  runner: manual
  worker: any
  needs: []
  window: any
  est_minutes: 15
  cmd: >-
    scope farm_worker.py:156 to the same pathspec line 155 stages — commit only
    farm-out/ — and check the courier branches for heartbeat commits that already
    carry unrelated files
  why: >-
    Explicit-pathspec commits are a standing house rule and the courier is the one
    place in the pipeline that breaks it, on an automatic 5-minute timer with a
    force-push behind it. The consumer is anyone who has ever wondered why a
    farm-results branch contains a file they did not put there; the fix is one
    argument.

# ---- THE DOMAIN OUTLIVES THE MIGRATION --------------------------------------
#
# The epoch in this id is the ELIGIBILITY date (2026-09-07T00:00Z), not the
# filing date (2026-08-08). It is the earliest day the work can legally start,
# and it is in the id so nobody has to open another file to work out why an
# entry filed in August is sitting here doing nothing.
#
# Two dates and one card, written up in full as MIGRATION.md section F.
# banyan.city was registered THROUGH Vercel on 2026-07-09 (registrar of record
# Name.com) and auto-renews 2027-07-09, billed ~30 days ahead with a warning
# email at 60, against the payment method of WHICHEVER Vercel team holds it on
# that day. The team the project moved to keeps NO payment method by design —
# that absence is the spend guard, and it is also a renewal charge that cannot
# succeed. What follows a failed charge is expiry, a ~30-day redemption window
# with a fee on top, and then a name anyone can register.
#
# NOT FILED IN pending-founder.yaml, and deliberately. That inbox renders
# publicly as the author's morning checklist and every item on it is answerable
# the day he reads it; this one cannot be acted on before 2026-09-07 and is
# infrastructure rather than taste. Putting it on his board in August would post
# a question he is unable to close for a month. It belongs there, if anywhere,
# when it becomes answerable.
- id: domain-transfer-out-1788739200
  runner: manual
  worker: any
  needs: []
  gate: founder
  gate_ref: >-
    A spend decision, so nobody's but the founder's: ~$10-20/yr at an external
    registrar, on dad's card. It is also boxed at both ends by dates nothing in
    this repo can move — ELIGIBLE AFTER 2026-09-07 (ICANN's 60-day lock, counted
    from the 2026-07-09 registration; no Vercel setting shortens it) and MUST
    RESOLVE BEFORE 2027-06-01, which sits ahead of the ~2027-06-09 renewal
    billing attempt. Between those two dates the only question left is whether
    the domain leaves Vercel or a card goes onto the team that holds it.
  window: any
  est_minutes: 60
  cmd: >-
    after 2026-09-07, work MIGRATION.md section F2 — auth code out of the account
    that holds banyan.city (Domains, the ... menu, Transfer out; Team Owner role
    only, and if clientTransferProhibited blocks it that is a Vercel support
    ticket, not a toggle we know of), start the transfer at the new registrar,
    recreate the A/CNAME records in the NEW registrar's DNS and let them resolve
    BEFORE cutting nameservers because the Vercel DNS zone does not travel, and
    prove `curl -sI https://banyan.city` serving before anyone retires the old
    Vercel account
  why: >-
    banyan.city is the address the show lives at, and it currently renews against
    a Vercel team that has no card on purpose — so the same guard that keeps this
    project from billing anyone is what fails the renewal if the domain is still
    there in June 2027. Owning it at a registrar we pay directly ends that, and
    frees the last asset trapped inside a Vercel account. Human time is about an
    hour; the transfer itself takes up to a week of wall clock, which is why the
    deadline is June and not July.
