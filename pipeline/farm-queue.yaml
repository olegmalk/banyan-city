# ---- THE INFRA METER, FILED THE DAY IT COST MONEY ---------------------------
#
# Two entries came out of the 2026-08-08 Vercel incident: >$100 in under a month
# because every courier heartbeat and every 5-minute telemetry pulse triggered a
# full site rebuild on a branch nobody reads (STATE.md 2026-08-08, D18). 2,344
# courier pushes in 29 days; 78% of all builds were non-main. The first is
# retired directly below; the second is still open, still gated, and still dad's.
#
# RETIRED 2026-08-09 — infra-spend-tile-1786166880, done by 240ade4 (`the meter
# that billed over $100 had no line anywhere in this repo, and a stale one would
# have been worse than none`). D18's second obligation, and the one that was ours
# rather than dad's: the ref allowlist stopped the spending, this makes it
# legible.
#
# TRIGGERS, NOT DOLLARS — the entry's own fallback, taken because the fallback
# was the honest option and not because the first choice failed to work. There is
# no $0 dollar source: the new account is a cardless Hobby team, no free usage
# endpoint on it is known to exist, and buying a plan to read a spend number
# would be the joke writing itself. Vercel's git integration opens a GitHub
# DEPLOYMENT per build; that list is public, free and CORS-enabled (verified
# 2026-08-09). `environment=Production` is filtered server-side because two
# thirds of this repo's deployments are the free github-pages mirror and counting
# those would inflate a bill nobody is paying.
#
# A DAY, NOT A MONTH, which is arithmetic rather than taste and is the one place
# the entry's wording ("the current month's build volume") could not be met. One
# unauthenticated request returns 100 rows and readers share a 60-request hour by
# IP, so paging a month would cost eight requests a view and take the meter down
# for everybody. At this repo's real rate 100 production deployments reach back
# about four days (measured: 100 rows spanning 08-05 to 08-09), so 24 hours fits
# inside one page with room — and stops fitting only when the rate quadruples,
# which is the alarm rather than a gap.
#
# COUNTED IN THE READER'S BROWSER, like the machines' logs and the render box's
# vitals, and for a reason specific to this number: a build-time count only
# advances when a build happens, and a flood of builds is the failure being
# watched for. build_status.py also has no `gh` CLI and no local refs on the
# deploy server, as the entry warned, so this was never going to be a repo fact.
# The page therefore ships with NO count in it — not zero, not the last one seen.
# Four ways it declines to answer (no fetch, non-200, a body that is not an
# array, an unreadable date) and every one says so in words. The '+' is
# load-bearing: if the oldest row on the page is inside the window there were
# builds this request could not see, so it prints 'N+' rather than passing a
# floor off as a count.
#
# Its own tile and deliberately not a fifth `.vital` — that row promises four
# numbers a reader can check against the repo, and this one is live and can be
# absent. Pinned by test_the_infra_meter_never_prints_a_number_the_page_did_not_
# measure, which checks every INFRA_* the browser script reads against what
# build() emits IN BOTH DIRECTIONS: INFRA_HOURS was read by the fetch and defined
# nowhere for one revision, and an undefined global inside a .catch()'d promise
# fails into the "unavailable" branch — a meter reporting that GitHub did not
# answer when GitHub answered fine. There is no browser in CI to catch that.

# PROPOSAL ONLY — do not implement off this entry. It changes how quickly the
# status page can notice a dead box, which is a call about what we are willing to
# be blind to, not a cleanup.
- id: telemetry-idle-cadence-proposal-1786166940
  runner: manual
  worker: any
  needs: []
  gate: founder
  gate_ref: >-
    Nobody has agreed to trade liveness for quiet. This entry is the written
    proposal and the tradeoff; the decision is dad's or the founder's.
  window: any
  est_minutes: 20
  cmd: >-
    put the proposal below in front of dad, and implement nothing until he picks
  why: >-
    telemetry.py's PUBLISH_SECONDS = 300 fires whether the box is rendering or
    sitting idle — 288 pushes a day, forever, and the 2026-08-08 forensics found
    96.9% of 613 recent rtx5090 push gaps sitting in that 4-6 minute band. PROPOSAL:
    keep 5 minutes while a task is in flight, back off to ~30 minutes when the
    queue is empty and no render is running, and push immediately on the
    idle->busy edge so starting work is never delayed by the slow cadence. That is
    roughly 288 -> 48 pushes on an idle day. TRADEOFF, stated because it is the
    whole reason this is gated: liveness detection on the status page gets 6x
    slower exactly when the box is idle, so a machine that dies quietly reads as
    "fine, just idle" for up to half an hour instead of five minutes — and an idle
    box is the one most likely to have died without anyone noticing. WORTH SAYING
    PLAINLY: after D18's ref allowlist lands, these pushes cost nothing per push,
    so this is push NOISE, not spend. It should be argued on whether a 30-minute
    blind spot is acceptable, and not sold as saving money it will no longer save.

# ---- THE COURIER'S BARE COMMIT, STILL OPEN AT HEAD --------------------------
#
# Adjacent to the incident and found while measuring it. Not fixed — verified
# present at HEAD on 2026-08-08.
#
#   farm_worker.py:155  sh("git", "add", "-A", str(self.out), check=False)
#   farm_worker.py:156  sh("git", "commit", "-qm", f"hb: {stage}", check=False)
#
# Line 155 is correctly pathspec-scoped to farm-out/. Line 156 is NOT: a bare
# `git commit` writes the WHOLE INDEX, so anything another process staged in that
# working tree before the heartbeat fired is swept into a commit labelled
# `hb: <stage>` and force-pushed to a courier branch. The worker shares its
# checkout with whatever else is running there, and the commit that carries the
# accident is the one nobody reads, on the branch nobody reads.
# RETIRED 2026-08-08 — courier-commit-pathspec-1786167000. Courier.mark() now runs
# `git commit -qm "hb: <stage>" -- <farm-out>`, so the commit is scoped to the same
# path line 155 stages and a file another process left in the index stays there.
# Covered end to end by test_a_heartbeat_commits_only_the_heartbeat: it stages an
# unrelated file in a throwaway checkout, runs a real mark(), and asserts the file
# is neither in the commit nor lost from the index. Verified against the old code
# first — a bare commit sweeps it in and clears the index, which is the behaviour
# the test would now catch.
#
# THE FIX DOES NOT REACH A RUNNING BOX UNTIL ITS CHECKOUT TURNS OVER. Each worker
# runs the farm_worker.py in its own working copy, so a machine that has not
# pulled since 2026-08-08 is still committing the whole index every five minutes.
# The second half of the retired entry — auditing the courier branches for
# heartbeat commits that already carry unrelated files — is NOT done and is not
# assumed to be empty; it is a history read on four branches, filed as
# courier-branch-sweep below rather than quietly dropped.

# RETIRED 2026-08-08 NIGHT — courier-branch-sweep-1786190400, audited in the commit
# that carries this line. THE SWEEP IS REAL AND NOTHING WAS LOST. Both halves of
# that sentence were measured, and the second half is the one the entry did not
# expect.
#
# THE SWEEP HAPPENED. Diffing each branch tip against its own merge-base with main
# — which is the only comparison that isolates what the courier wrote, since a
# courier branch is a whole checkout and "differs from today's main" mostly just
# means main moved on — 478 file states outside the out-dirs were committed under
# `hb:` messages: msi 212, m1pro 264, m2 2, rtx5090 1, runpod 0. m1pro's is the
# widest (CLAUDE.md, three workflow files, .gitignore, STATE.md, the audio-sources
# tree, the footage archive); m2's is the narrowest and the most on-the-nose
# (pipeline/farm-queue.yaml and pipeline/farm_worker.py — the courier committing
# its own source).
#
# NOTHING IS ONE PUSH FROM UNREACHABLE, which is what the entry was filed to find
# out. Every blob those commits introduced was checked against the set of objects
# reachable from origin/main (`git rev-list --objects origin/main`, 7,616 objects).
# Across ALL 231 branch commits, not just the tips, and counting blobs only —
# the first pass counted tree objects too and read as hundreds of unique files,
# which was an artefact of the filter, not a finding:
#     msi      217 distinct blobs outside farm-out/  → 0 not reachable from main
#     m1pro    184                                   → 0
#     m2         6                                   → 0
#     rtx5090    1                                   → 1  (telemetry.json)
#     runpod     0                                   → 0
# Zero. Every state the courier swept in is a state that also reached main through
# a real commit. The bug wrote noise into history; it did not capture a single edit
# that then went missing. So the answer to this entry's own consumer line — whoever
# lost a file in a shared checkout — is that there is no such person, and the four
# stale branches can be force-pushed over without losing anything. That is a
# licence this audit grants and the entry could not.
#
# THE ONE UNIQUE BLOB IS NOT THE BUG. `telemetry.json` on farm-results-rtx5090 sits
# outside farm-out/ by design — it is what banyan-telemetry publishes, rewritten
# every ten minutes, and the newest copy is the only one anyone wants. It is unique
# because it is live, not because it was swept.
#
# WIDER THAN ASKED, DELIBERATELY. The entry said "commits whose subject starts
# `hb:`"; this covered every commit on each branch not on main. The difference is
# exactly one commit — rtx5090's telemetry push — and filtering it out would have
# hidden the single unique blob in the whole audit.
#
# HISTORY WAS NOT REWRITTEN, per the brief. Three of the four farm branches are
# already cold (m2 2026-07-30, msi 2026-07-31, m1pro 2026-08-07; only rtx5090 is
# live), so the cheapest cleanup is to let the next force-push take them, and no
# entry is filed to do it because the audit says there is nothing to preserve.

