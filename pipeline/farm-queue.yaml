# Two parameters dead. So the limit is upstream of both, and the prompt is the
# remaining suspect. Counting beat 1's actual prompt: 15 words of style, 19 of
# motion, then 25 DESCRIBING A STATIC COMPOSITION — the biggest block and the last
# thing the text encoder reads. It is also redundant: the init image already IS
# that composition. Describing a still frame in detail to a video model is a
# plausible way to get a still frame.
#
#  D  drop the static anchor      (33-word prompt, motion-forward)
#  E  drop "camera locked" too    — it is in every direction, added to stop drift,
#                                   and a model may not distinguish "the camera
#                                   does not move" from "nothing moves"
#  F  explicit amplitude language — big visible strokes, not just "fast"
#
