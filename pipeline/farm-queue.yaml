# RE-QUEUED 2026-08-01 07:45Z. Fresh ids on purpose.
#
# The previous run of these exact tasks failed in ten seconds each, all five,
# because the 5090 LOST ITS NETWORK around 01:54-02:20:
#   OSError: Cannot load model Wan-AI/Wan2.2-TI2V-5B-Diffusers: model is not
#   cached locally and an error occurred while trying to fetch metadata
# Same outage silently ate every `git push` for six hours, so from outside the
# machine looked hung while it was actually failing fast and reporting into a
# void. Network is back (a manual push went through at 07:40Z).
#
# Nothing is wrong with the tasks, so they are re-queued unchanged apart from
# their ids. New ids are REQUIRED: a task that failed is added to the worker's
# in-session done set and never retried, and with an empty queue the worker
# never reaches the code-sync step either — so it would poll forever without
# picking up either these tasks or any fix.
# REBUILT 2026-08-01 00:55Z, after the monolithic batch failed.
#
# WHAT HAPPENED. `vid-720p-all` asked for 8 clips at 704x1280 / 50 steps in one
# task and hit the 4-hour subprocess timeout with ZERO clips saved
# (TimeoutExpired after 14400s, worker-log on farm-results-rtx5090). It was
# mis-sized, and the old buffered runner threw away every clip it HAD rendered
# because nothing was pushed until the task returned.
#
# THE ARITHMETIC WE NOW HAVE. A batch of 4 clips took 1h42m (19:04:47 ->
# 20:47:34) at the earlier size; single beats ran ~13 min each. At 704x1280 with
# 50 steps the per-clip cost is >30 min, so 8 clips was never going to fit in
# four hours and 5 would have been marginal. THREE clips per task is ~1.5h — a
# comfortable margin, and it means a slow chunk costs one chunk.
#
# Two fixes already landed alongside this and change the risk profile: clips are
# now pushed as each one finishes (video_task._stream), so an overrun keeps
# whatever completed; and a task that fails twice is skipped so it cannot starve
# the queue (farm_worker.MAX_ATTEMPTS).
#
# ORDER IS DELIBERATE. The licence beats come first. Beats 2, 4, 8, 11 and 13 of
# the LIVE episode are PixVerse free-tier takes, which is personal-use only
# against our CC BY 4.0 release (D13) — so until these five exist on a
# publish-safe route, the only postable cut is the static POST fallback. These
# unblock shipping; the other eight only improve what already ships.
tasks:
