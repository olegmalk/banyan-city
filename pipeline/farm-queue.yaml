# MUST write that task's STARTED and DONE lines. Taking your own id and leaving
# the entry open stays available and stays honest. What is gone is doing neither.
#
# `pipeline/claim_task.py <id> -- <cmd>` writes STARTED, runs the command, and
# writes DONE or FAIL FROM THE EXIT CODE — not from intent, so the two lines
# cannot be forgotten separately from the run and a crash cannot leave a bare
# STARTED behind. `started`/`done`/`fail`/`interrupted` halves exist for
# multi-step work; `interrupted` costs no attempt.
#
# TWO DESIGN CALLS WORTH KEEPING, because both are places the obvious version
# would have been wrong. It publishes to `farm-results-hand` rather than the
# borrowed machine's own branch: courier force-pushes `farm-results-<name>` from
# whatever heartbeat.txt is on that box's disk, so a line written there is erased
# the next time that worker checks in, and a claim a machine can silently delete
# is not a claim. queue_promoter globs `farm-results-*`, so it reads identically.
# And it never touches the working tree — courier's `git checkout -qB` is safe in
# a dedicated worker checkout and would be a disaster in the one a person is
# working in, so the commit is built with plumbing against a temp index
# (hash-object, read-tree, write-tree, commit-tree, push) and HEAD, the index and
# every file on disk are left alone. $0 and CI-silent: vercel.json disables
# deployments for `farm-results-*` and both workflows carry branches-ignore.
#
