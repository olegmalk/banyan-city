# RETIRED 2026-08-09 — checklist-b01-poster-backfill-1786215660, done by 39fc1eb
# (`every held clip re-armed the stale-poster bug on the one host that cannot
# catch it, and episode 2's cold open was blank over a record that named its
# frame`), the same commit as the entry above and for the same reason the two
# were filed together.
#
# THE DIALECT. record_still_claim() now reads all three record shapes plus
# corrections in one precedence order — `init_still`/`_sha256` (the renderers),
# `source_still`/`_sha256` (hold_still), and the nested
# `init_frame: {path:, sha256:, …}` that video_task's LTX/Wan renders write. Both
# traps the entry named are handled and both are pinned by tests. The path is
# written with WINDOWS separators and a backslash is a legal posix filename
# character, so `Path().name` returns the whole string rather than raising —
# hence basename by hand, and the sha preferred over the name anyway.
# `plate_sha256` (004dc1e8…) is NOT read: it is the 704x1280 cover-crop fed to
# the model, it exists in no stills/ directory, and a test proves that reading it
# would have produced a REFUSAL rather than merely being untidy.
#
