# the render, which is R6 keeping a retired frame in place. The two v2 sidecars
# in review/ep2-b01/ record the same hash at render time, so three independent
# records name one frame. Read through `corrected_init_still`, the convention
# licence_gate already reads as `corrected_model`, so the correction is consulted
