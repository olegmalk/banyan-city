# OVERNIGHT 2026-08-01. Certain value first, experiment second.
#
# The founder is running the AnimeGen beat-1 canary BY HAND in a console right
# now, so `anime-b1` is removed — otherwise the worker would duplicate a render he
# is already watching, on the same card. (Two renders on one GPU is the mistake
# that cost four hours this morning; the lock only guards worker-vs-worker, and a
# hand-run is the door it does not cover. wan_i2v now warns on a busy card.)
#
# ORDER, deliberately:
