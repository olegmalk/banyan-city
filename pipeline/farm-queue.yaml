# 2026-08-02 18:15Z — THE SHAKE FIX. Two causes, both the steward's.
#
# Founder on the three motion.yaml clips: "definitely improvement, but i noticed
# these all have a pattern of like, shaking alot, strangly." ALL of them, so
# systematic rather than per-beat.
#
# CAUSE 1: we told the model not to be still, on every clip. Wan's official negative
# prompt contains 静态 (static), 静止 (motionless) and 静止不动的画面 (a motionless
# picture). A sound default for text-to-video, where freezing is the usual failure —
# backwards for a show where the approved still IS the composition and every
# motion.yaml entry ends "camera locked". Removed those three, kept every quality
# suppressor, and added explicit shake terms (camera shake, handheld, jitter,
# wobble, unstable, trembling camera, rolling shutter).
#
# CAUSE 2: contradictory camera instructions. motion.yaml says "camera locked" and
# the steward appended "gentle drift" after it, so the prompt read "camera locked.
# gentle drift." Jitter is what a model does with that. The suffix is now only the
# discipline part: "no new subjects, no scene change".
#
# BEAT 1 FIRST, alone. It is the clip he has judged more than any other, so it is
# the honest comparison. ~11 min. If the shake is gone, the remaining 14 follow;
# if not, we have spent 11 minutes instead of two hours.
#
# ---------------------------------------------------------------------------
# 2026-08-02 20:4xZ — RESOLUTION, ahead of the shake question.
#
# The founder rejected ep1-v21-CANON as "too low quality". That canon was built
# from 480x832 clips, and every task below was queued at 480x832 — so as
# written, a full night of rendering reproduces the exact thing he turned down.
# 480x832 upscaled to a 1080x1920 phone screen is a 2.25x blow-up; soft is the
# expected outcome, not a surprise.
#
# But 704x1280 has NEVER completed on this card: vid-720p-all failed twice,
# and -c, -d, -e once each. Five attempts, zero clips. So the resolution
# question gets ONE beat, not fifteen — with --offload, which is the supported
# way to fit a model that already sits at 24.4/26GB (hand-rolled eviction is
# what corrupted every frame on 2026-08-02; do not repeat it).
#
# Order is deliberate: the hi-res canary runs FIRST so the answer arrives in
# ~15 min while there is still a night left to use it. The 480x832 set stays
# queued behind it, so if 720p OOMs we still wake up to a complete shake-fixed
# episode instead of nothing.
#
# ---------------------------------------------------------------------------
# 20:40Z — THE CANARY LANDED, and the result inverts the assumption.
#
#   704x1280 + --offload : 240s   <- first 720p clip this card has ever made
#   480x832  no offload  : 467-493s (four clips)
#
# Higher resolution, TWICE as fast. The likely cause is the 24.4/26GB residency
# we already measured: without offload the model sits on the card and the
# renderer pages against itself, which is a silent multiplier that looks like a
# slow model. --offload (enable_model_cpu_offload, the supported path — NOT the
# hand-rolled eviction that corrupted every frame earlier today) keeps memory
# orderly.
#
# So all 14 remaining beats move to 704x1280 + offload. shake-canary-b01 stays
# at 480x832 with NO offload on purpose: it is the same beat 1, so it is a free
# controlled test of whether offload is really what bought the 2x. If it comes
# back near 470s, offload is confirmed. If it comes back near 240s, something
# else changed and I should not credit offload.
