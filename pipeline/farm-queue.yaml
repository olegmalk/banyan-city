# 2026-08-03 06:0xZ — ANIME-NATIVE CANARY. One beat, one question.
#
# The previous queue's 18 tasks are all DONE (episode 1 is rendered: see
# MORNING-2026-08-03.md) and have been cleared. The worker skips ids it has
# already finished, so leaving them here only made the file harder to read.
#
# Everything in ep1-v22-hires was rendered on BASE Wan 2.2 TI2V-5B — NOT an anime
# model. The founder asked to confirm and the answer is no: every one of those 18
# tasks left `video_model` unset, so all of them fell through to the ti2v-5b
# default. His own read from 2026-07-29 still stands: "wan 2.2 is still pretty
# good, the problem is its not made for anime style."
#
# The anime LOOK in the finished cut comes from two other places, which is why it
# works at all: the approved stills are cagliostrolab/animagine-xl-3.1 (an anime
# SDXL finetune) and image-to-video inherits its input frame's style, plus
# video_task prepends STYLE ("2D anime, hand-drawn cel animation, flat cel
# shading, clean ink linework") and suppresses photorealism in the negative.
# Composition is anime and the prompt insists on it. Only the MOTION comes from a
# general-purpose model.
#
# So the open question is whether an anime-native model MOVES better.
# aidealab/AnimeGen-I2V is Apache-2.0 with its LICENSE verified byte-identical to
# canonical, and it fits: its card says "RTX 4090 or higher" (24GB) against this
# card's 25.7GB, with fp8 layerwise casting plus cpu offload.
#
# `no_lora: true` IS A LICENCE DECISION, NOT A PERFORMANCE ONE. AnimeGen's own
# recipe uses the Lightning 4-step LoRAs (lightx2v/Wan2.2-Lightning) at guidance
# 1.0, and that is what makes it fast. Those weights declare apache-2.0 in HF
# metadata and ship NO LICENSE FILE — unquotable, so our gate calls them unknown,
# which is a violation and would redden CI. Running without them costs steps and
# time, but every weight involved has a licence we can actually read. If the look
# turns out to be worth having, whether to use an unquotable-licence LoRA is a
# founder call, not a steward one.
#
# BEAT 7 ON PURPOSE: the leaf whip. It is the most motion-dependent beat in the
# episode and the one the founder criticised directly ("the sapling is
# aggressively moving, in a very weird way"). Same approved still, same 704x1280,
# same offload — only the model changes, so any difference can only be the model.
#
# EXPECT IT TO BE SLOW: a 27B pair of A14B transformers at 25 steps against
# ti2v-5b's 5B at 20. Budget tens of minutes, not the 239s the hi-res set
# averaged. It is one clip, and it answers a question five ti2v-5b renders could
# not.
#
# NOT A BLOCKER FOR POSTING. ep1-v22-hires.mp4 is finished and screenable now;
# this only decides whether a future re-render is worth doing.
