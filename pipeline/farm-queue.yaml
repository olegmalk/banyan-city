    three — the file's own churn note says why that is how a mean got trusted
    over a median on 2026-08-03; if a rule cannot be found that separates the set
    without special-casing it, RECORD THAT and leave the tool as a reporter.
  why: >-
    check_invention.py exists to catch exactly this — a video model inventing
    content that is not in the approved still — and on 2026-08-09 it passed all
    eight clips of the beat-16 drift experiment, including the three containing a
    full anime human, printing "nothing flagged: every clip returns toward its
    opening frame". Its own docstring says the thresholds are "deliberately loose"
    because "a false alarm costs one look and a miss costs a shipped defect". It
    missed three of three. Until now the tool had no labelled data at all and was
    tuned against recollections of beats 11 and 01; this experiment produced
    ground truth by construction, one variable apart, and it should not be spent.
    The finding does not block the wave — the beat-16 scoring was done by
    frame-sampling and never leaned on this tool — but anything that DOES lean on
    it is currently trusting a detector with 0 of 3 recall on the only case we
    can check.

