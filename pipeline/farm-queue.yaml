# build_site.composite_publishable() walks it, and FOUR WAYS A ROW FAILS — three
# of them absences, as the entry asked. Recorded verdict already false; no file
# or no hash on the row; the file no longer hashing to the recorded value; or the
# file passing then and refused NOW, re-asked through publishable() itself so a
# licence reclassified after assembly is caught on the next build. `_inside`
