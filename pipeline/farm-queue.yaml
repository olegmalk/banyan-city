#      default.
#   2. write_sidecar emits <full-name>.meta.yaml, the convention sidecar_of
#      cannot see. Until held-sidecar-classify-1786114785 lands, sidecars
#      written this way are correct records the gate still cannot read.
# AND EXPECT THE GATE TO GET LOUDER, WHICH IS THE POINT: still_model
# "cagliostrolab/animagine-xl-3.1" is ALREADY an open licence_gate finding on
# the 001 leaves (CreativeML Open RAIL++-M, use restrictions travel, D15).
# Naming the model on the stills path surfaces that same known finding on more
