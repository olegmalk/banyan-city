#
# Founder: "see how low can we get, and at which point does the quality become too
# bad." Same shape as the earlier image-model speed test.
#
# CONTROLLED: beat 1, the same approved still, the same motion.yaml direction, the
# same seed, 480x832, 2.5s, guidance 5.0. ONLY the step count varies, so the
# comparison is honest — one variable.
#
# Beat 1 on purpose: the founder knows it well, it opens the episode, and it has
# fingers on keys. Fine detail is where low step counts break first, so degradation
# will be visible rather than a matter of taste.
#
# Measured baseline is 26.8s per step, so:
#   20 steps ~ 9m    (today's setting)
#   12 steps ~ 5.5m
#    8 steps ~ 3.5m
#    6 steps ~ 2.7m  <- the 3-minute target lands about here
#    4 steps ~ 1.8m
# ~25 min for all five in one model load, each pushing as it finishes.
#
# CAVEAT recorded before the result, so it cannot be read as an excuse afterwards:
# guidance 5.0 is arguably unfair to 4-6 steps. Distilled few-step setups run
# guidance ~1.0, and high CFG at low steps is a known failure mode. So D and E may
# look worse than the model's real floor. This sweep answers "what do we get with
# what we have"; if the low end collapses, the follow-up is the same steps at
# guidance 1.0-1.5 before concluding anything about the model.
