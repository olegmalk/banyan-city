# RETIRED 2026-08-09 — composite-provenance-manifest-1786218000, done by 39224e5
# (`a concat laundered every refusal inside it, and a hand-run could borrow a
# queue id without ever claiming it`). All three halves shipped.
#
# render_t3.ingredient_row() writes one row per muxed source — beat, kind, repo-
# relative path, sha256 of the bytes as muxed, and the verdict — and it gets that
# verdict by CALLING build_site.publishable() rather than re-deriving one, the
# same way this module already borrows render_local.approved() for §6. One gate,
# one implementation, so a licence classified once cannot mean two things.
# assembly_sidecar() writes the block for BENCH CUTS TOO (`--out`), which is the
# point and not an oversight: the review page serves working cuts out of `cuts/`
# and those were exactly the files carrying no record at all.
