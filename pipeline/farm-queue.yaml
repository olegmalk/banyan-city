# ---- 5. PROMPT-FIX CANARY: the three beats the founder rejected --------------
# Founder verdict on the six existing Wan takes (2026-08-01): only beat 1 usable.
# "3rd and 4th seem like random motion", "5th has a stick poking the sapling",
# "6th doesnt move at all". He was right on every one, and the frames show why —
# but the cause was not the model.
#
# We were feeding the video model the STILL-GENERATION prompt: a full instruction
# for drawing the scene from scratch, with SDXL quality tags and negatives written
# as prose INSIDE the positive prompt. An i2v model reads "a single thin green
# plant stem bent into a tense arc" as "draw this" — so it drew one in addition to
# the stem already in frame. That is the stick. "No ghost, no sphere" sat in the
# positive prompt too, where it reads as a request.
#
# Fixed in video_task.video_prompt(): motion first, scene reduced to a 22-word
# anchor labelled "Subject already in frame", negatives moved to the real negative
# field. These three beats are the direct test — same stills, same seeds, only the
# prompt changed. If the stick is gone and beat 14 moves, the fix is real.
- id: fix-prompt-canary-1785573000
  worker: rtx5090
  video: true
  node: 001-capability-inventory
  beats: 12,14,15
  motion: 'true to the frame: only what would actually move in this shot - gentle
    camera drift, no new subjects, no scene change'
  size: 704x1280
  seconds: 3.0
  steps: 50
  guidance: 5.0
  seed_base: 20260731
# ---- 4. THE ANIME MODEL, unparked: AnimeGen-I2V quantised on load -----------
# Founder, after screening six Wan takes: "wan 2.2 is still pretty good, the
# problem is its not made for anime style" (2026-08-01). That is the whole
# diagnosis — Wan's training is dominated by live action, so it pulls every frame
# toward photography however anime the still it was handed.
#
# aidealab/AnimeGen-I2V is the purpose-built answer: Apache-2.0 (LICENSE verified
# byte-identical to canonical), an anime finetune of Wan 2.2 that force-prepends
# "Japanese anime style" and negatives out 3d/cg/photo. Its own card admits it is
# WORSE outside anime — tuned in exactly our direction.
#
# It was parked because it is an A14B: two 14B experts, ~54GB in bf16 against
# 24GB of card, and no fp8/GGUF build of this finetune exists. That turns out not
# to matter — diffusers can quantise at load, so we make our own 8-bit weights
# instead of waiting for someone to publish some. Slower per clip (offload streams
# through system RAM) but it fits.
#
# ONE clip, on beat 12 — the beat whose stick exposed the prompt bug — so this
# tests the anime model and the prompt fix on the same frame the founder rejected.
# If bitsandbytes is missing in the video venv the task fails loudly with the
# install line rather than OOMing three hours in.
- id: anime-canary-b12-1785574000
  worker: rtx5090
  video: true
  video_model: animegen
  node: 001-capability-inventory
  beats: 12
  # AnimeGen's own card: motion-only prompt ("blink her eyes."), 4 steps at
  # guidance 1.0 via the Lightning LoRAs, 16fps, 832x480 or 1280x720. The steps
  # and guidance below are overridden in wan_i2v for this model — left here so the
  # queue is honest about what it asked for. 480x832 IS a trained size for A14B
  # (unlike the 5B, where it was off-distribution), so this is the cheap tier.
  motion: 'gentle drift; only what would really move here'
  size: 480x832
  seconds: 3.0
  steps: 4
  guidance: 1.0
  seed_base: 20260731
# ---- 3. the A14B prefetch, last: download only, no install decision ----------
# Already in flight when this file was rewritten; kept here so a restart can
# recover it as done rather than starting the 25GB pull again.
- id: prefetch-a14b-1785529520
  worker: rtx5090
  video: true
  node: 001-capability-inventory
  beats: ''
  prefetch:
  - repo: QuantStack/Wan2.2-I2V-A14B-GGUF
    patterns:
    - HighNoise/*Q6_K*
    - LowNoise/*Q6_K*
    - VAE/*
  - repo: lightx2v/Wan2.2-Distill-Loras
    patterns:
    - '*i2v*rank64*4step*'
