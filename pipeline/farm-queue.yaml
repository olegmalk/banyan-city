# THE FARM QUEUE — two lists, one meaning each.
#
# tasks:    RUNNABLE NOW. Every worker ever shipped reads exactly this key
#           (farm_worker.py:115, `.get("tasks", [])` off origin/main) and nothing
#           else. A machine that polls the queue will start anything in here.
# backlog:  PLANNED, NOT RUNNABLE. Invisible to every worker, including stale
#           checkouts, because the read path above never looks for it. This is
#           where work waits with its blocker written down instead of in a
#           comment nobody can query.
#
# Promotion is one commit: `python3 pipeline/queue_promoter.py` moves a dict out
# of backlog: and into tasks: in a single write, so the two lists can never
# disagree. The promoter also RETIRES tasks whose `DONE task=<id>` line exists on
# a farm-results-* heartbeat — that is what the stale faceneg entry needed and
# never got. It never invents work and never clears a gate.
#
# ---- ENTRY SHAPE ------------------------------------------------------------
# A backlog entry is a tasks entry plus planning fields. Nothing here is read by
# a worker: unknown keys on a task are inert (dead keys already exist in this
# file's history), so a promoted entry keeps its planning fields and no worker
# cares.
#
#   id           REQUIRED, slug-epoch. heartbeat_attempts() counts STARTED lines
#                keyed on id, so re-queued work MUST take a new id or it inherits
#                the old one's spent attempts.
#
#                CARRYING AN ID OBLIGES YOU TO CLAIM IT (ruling, lead 2026-08-08,
#                queue-id-borrowed-by-hand-run-1786190580). An id is how every
#                reader downstream — sidecars, the promoter, this file — says
#                which piece of queued work produced a file, so it may not mean
#                two things. A HAND-RUN that puts a task's id on its output MUST
#                write that task's STARTED and DONE heartbeat lines; the standing
#                alternative, take your own id and leave the entry open, is still
#                available and is the honest choice when you are not running the
#                recipe the entry asks for. What is NOT available is the third
#                thing that used to happen by default: borrow the id, write no
#                lines, and leave an entry sitting in tasks: reading as unstarted
#                while its output is already on the review page. That is
#                `002b-b01-video-5b-1786089900` — the entry asks for seconds 2.5,
#                the clip carrying its id is 4.71s, and STATE.md 2026-08-08 spent
#                a paragraph on a pipeline bug that never existed.
#
#                THE EASY PATH IS THE HONEST ONE, which is the only reason the
#                ruling holds — both were one command before:
#
#                  python3 pipeline/claim_task.py <id> -- <the command>
#
#                writes STARTED, runs it, and writes DONE or FAIL off the exit
#                code, so the lines cannot be forgotten separately from the run.
#                `<id> started` / `<id> done` exist for multi-step work. It
#                publishes to `farm-results-hand` — never a borrowed machine's own
#                branch, which courier force-pushes from that box's disk and would
#                erase the claim — and it touches neither HEAD, the index, nor any
#                file on disk. queue_promoter globs `farm-results-*`, so the entry
#                retires exactly as a worker's would.
#   worker       plain string, matched by equality at farm_worker.py:488
#                ("any" is the wildcard). Never a list.
#   runner       farm   — a farm_worker task. The ONLY kind the promoter moves.
#                manual — a command a person or an agent runs. Never promoted,
#                         because tasks: is a worker inbox and a worker would
#                         choke on it. The promoter reports it as runnable and
#                         leaves it here.
#   cmd          manual entries only: the exact command where one exists,
#                otherwise the one-line instruction.
#   after        list of ids that must ALL show `DONE task=<id>` on some
#                farm-results-* heartbeat. Render dependencies only — a code or
#                writing job never writes a heartbeat line, so those are gates.
#   gate         founder | code | hardware. Present = BLOCKED, full stop. The
#                promoter cannot clear one; clearing is a human deleting the key
#                in a commit. It names the NEAREST blocker only: when you clear
#                one, re-read the entry, because `why` may name another behind it
#                and you are the one who has to write the new gate value.
#   gate_ref     what specifically. A pending-founder.yaml id, the code gap with
#                file:line, or the machine and its fault. Not "blocked".
#   needs        capability tags. cuda | vram20 | mps | video-venv. The promoter
#                fills `worker` from these when it is unset (see CAPS in
#                queue_promoter.py) and refuses to promote if nothing matches.
#   window       overnight | day | any. ADVISORY ONLY, and deliberately so: the
#                promoter never delays on it. Machine work is scheduled by
#                dependencies, not human hours (Oleg, 2026-08-05). It records
#                that a host-exclusive job will evict the farm worker, not that
#                anyone should wait for dark.
#   est_minutes  int, an estimate, sourced in `why` where one exists.
#   why          one line a stranger understands, naming the consumer of the
#                output. No job without a consumer (standing rule).
#
# ---- RUNNABLE NOW -----------------------------------------------------------
