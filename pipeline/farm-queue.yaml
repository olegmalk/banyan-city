# FOUND WHILE PROMOTING BEAT 15, AND IT IS ON THE LIVE PAGE, NOT IN A LOG.
# build_site.still_for() picks a review-page clip's poster by reading `init_still` /
# `source_still` out of the clip's sidecar BY NAME, and poster() only reaches that
# fallback when ffmpeg is missing — which is exactly the Vercel build image
# (build_site.py:574-601, its own docstring says so). So the moment a still is
# promoted under an existing canon filename, every published clip drawn from the OLD
# pixels gets a poster of the NEW frame: the beat-15 comparison pair now shows a tall
# sapling over footage of bare soil, and the beat-12 pair has done the same since
# 01d28a4 that morning without anyone noticing. The clips' own sidecars are innocent —
# three of the four beat-15 ones record `init_still_sha256: aa14d078…`, the bytes now
# under the -REVOKED-underground name, so the data to do this right is already on
# disk and unread.
# NOT fixed in the promotion commit on purpose: it is a build_site change, it needs a
# test, and a stills promotion is not where a site generator gets edited.
- id: review-poster-names-stale-still-1786197251
  runner: manual
  worker: m1pro
  needs: []
  window: any
  est_minutes: 30
  cmd: >-
    make build_site.still_for() resolve a clip's poster against the still the clip
    was ACTUALLY drawn from, not against whatever now holds that filename: prefer
    the sidecar's `init_still_sha256` and accept the `-REVOKED-*` sibling whose bytes
    match it, fall back to no poster rather than to a frame the clip does not
    contain, and add a test that a promoted canon still does not silently re-poster
    an older clip. Then check the two pairs already affected, beats 12 and 15 — and
    a THIRD that is armed rather than firing: node 002b beat 01, whose plate was
    revoked on 2026-08-08 (01-cold-open-REVOKED-too-tall.png). Its four clips in
    review/ep2-b01/ currently resolve to no poster at all, because nothing holds the
    name they were drawn from; the moment ep2-b01-cold-open-redraw promotes a new
    01-cold-open.png they will silently poster themselves with a frame none of them
    contains. Fix it before that promotion and the third pair never happens.
  why: >-
    The review page is what the founder screens on, and a poster is the first frame
