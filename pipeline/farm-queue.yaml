  why: >-
    On 2026-08-09 the founder answered the Wan-vs-LTX question — "wan has nearly
    no motion, and ltx is just amazing" — and there was NOTHING IN THE LEDGER TO
    SCORE IT AGAINST, because the ledger only models predictions about candidate
    frames. The prediction did exist and it was a hit: cuts.yaml item 14 had
    published "Wan barely moves at all" off measured frame-to-frame deltas (LTX
    31.4/19.8/23.9 vs Wan 0.9/4.3/0.8 on beats 16/18/21) before he saw the clips,
    and the hedge attached to it — "the stiller one is not automatically worse" —
    was wrong. Scoring it meant writing the result into the cuts.yaml body as a
    workaround, which is not a ledger and cannot be tallied against the model's
    hit rate. Engine and recipe calls are exactly the kind of expensive,
    hard-to-reverse guess the ledger exists to keep honest.

