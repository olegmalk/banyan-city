what_changed: >-
  The PLANT, and nothing else. Both of the parent's arcing twig-plants were removed and
  clone-filled from the plate's own pixels, and one canon sapling was drawn in their place:
  a rooted tapered stem, EXACTLY TWO wide oval cotyledon leaves with soft round tips angled
  up in a V, ONE thin side-branch, and hanging from that branch ONE matte violet fig clear
  of the ground. Measured: max change OUTSIDE the inpaint mask is 0.0, so every pixel of the
  five plate terms that already PASS (P2 framing, P3 hands empty and no contact, P4 face
  visible, P5 purple reads purple, P7 one adult figure) is byte-identical to the parent.

why_drawn_and_not_pasted: >-
  The ladder's rung was written as "composite beat 18's fig in at scale". Opening the pixels
  killed both halves of that and the tool's docstring records it in full: (a) beat 18's
  passing plate (ep2-b18-canon-0817 r2-w015-s2) is an EXTREME CLOSE-UP MACRO whose fig spans
  ~430px where beat 19's must span ~30px -- an 18x downsample imports a violet smudge, not a
  fig, and "detail at the wrong scale" is decal tell 5; (b) subtraction cannot reach either
  failing axis, because the parent's four "fruits" are VIOLET FACETED CRYSTALS on threads and
  its "plants" are bare twigs, so deleting three leaves a crystal on a twig. Beat 18's plate
  is used as the SHAPE AND COLOUR AUTHORITY (its verdict measured 305 deg, violet/magenta,
  12 of 16 frames) rather than as pixels -- and its own honest_caveat, gloss plus a magenta
  lean, is the second reason not to paste it.

