rejected_rounds_before_this_one: >-
  FOUR, all by eye, all pre-GPU, ~4.5 s each. v1: a per-row-median field model fired on the
  field's own horizontal bands, the ribbons connected the figure to everything, and the
  protect mask swallowed all four crystals (93-100% of every crystal box) so none were
  removed. v2: fixed by a horizontal high-pass, but inside the figure that test is not a
  plant detector -- his cloak's stitching and folds are thin too, and the column-clone
  smeared a 30x240px streak down him. v3: per-region colour rules fixed the smear, but the
  cloak-edge crystal's rule was too tight and selected ZERO, leaving a second violet object
  in frame. v4: the leaves read as a television aerial and the fig as a capsule. v5, this
  file: cotyledons angled up in a V from the joint, the fig's neck taper moved to the top
  where the stalk enters, and the petiole line deleted -- it was a stem-coloured bar across
  half the blade, the internal line composite-init-pattern.md 5 forbids by name.

