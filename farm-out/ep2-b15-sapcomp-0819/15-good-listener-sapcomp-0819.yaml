reproduced_byte_for_byte_before_it_was_committed: >-
  This artifact was found on disk from a crashed peer's session and was NOT taken
  on trust. The committed script was re-run against the committed parent plate on
  a second machine session and produced sha256 109abc61... and mask f7933427...,
  identical to the bytes committed here. So "deterministic: same arguments, same
  bytes" is a checked fact rather than a docstring claim, and the exact command is:
  python3 pipeline/beat15_listener_composite.py
  --init farm-out/ep2-b15-mac-plate-0819/15-good-listener-mac-plate-r1s1.png
  --init-sha256 8a9bd14b00c45ff50d0996b75cb4023bfbf8022f393b9e62c31f89f20fbf4ebe
  --out 15-good-listener-sapcomp-0819.png
  --mask-out 15-good-listener-sapcomp-mask-0819.png
  (every other knob at its default: thin-k 61, thin-tol 16.0, protect-grow 6,
  remove-grow 3, fill-min-dist 26, mask-grow 12, feather 3)

what_changed: >-
  The PLANT, and nothing else. The parent's one multi-node weed -- five pointed
  blades on three nodes, x 140-268 y 300-568 -- was removed and clone-filled from
  the plate's own field, and one canon sapling was drawn in its place: a curved
  tapered stem rooted at (222,592) into the plate's OWN surviving grass tufts, and
  EXACTLY TWO wide oval leaves with soft round tips at (175,374) and (257,374),
  43x25 px, aspect 1.72. No side-branch and no fig were drawn, deliberately: see
  the_gap_flagged_not_fixed. Measured: max change OUTSIDE the inpaint mask is 0.0,
  so every pixel of the six clauses the parent already PASSES is byte-identical.

why_the_leaves_sit_where_they_do_and_it_is_the_APPROVED_LINE_not_taste: >-
  The founder approved beat 15's rewritten staging on 2026-08-19 ("all approved",
  recorded in 5d6eb792), and node.md:98 as rewritten reads "He tips his head down
  and sideways until his EYES ARE LEVEL WITH THE TWO LEAVES, and talks to them from
  a hand's width away; both of them share the frame." His eye level in this plate is
  y 370, measured at 4x on the pupils behind his spectacles. The blades are centred
  at y 374 and span y ~348-400, so HIS EYE LINE FALLS INSIDE THE BLADES -- staging no
  beat-15 artefact out of twenty-four has ever depicted. That is also why the apex
  moved down from the weed's y 336 to y 392: the plant is 200 px tall against the
  weed's 256, its apex sits 135 px BELOW his head top at y 257, so P4 SCALE (the
  first beat-15 clause ever to pass on scale) is untouched.

why_drawn_and_not_pasted: >-
  The route the b15 verdict named was "r1's frame with ep2-b12-tightB's leaves
  composited in". Opening beat 12's pixels killed the paste on three measurements,
  all taken before any drawing code existed: SCALE -- its blade components have major
  axes 619/772/607/591 px where beat 15 needs ~80, a 7.4x-9.7x downsample and decal
  tell #5; SHAPE -- those blades measure aspect 2.85/3.11/3.38 against
  composite-init-pattern.md §8's pre-registered acceptable band of 1.6-2.6, so they
  are LANCE-shaped by our own standing number; LIGHT -- beat 12 is backlit at sunset
  with pink rim and near-black shadow sides, this plate is lit from straight above
  (measured dx -0.072 dy -0.997), which is decal tell #2. Beat 12 is therefore the
  ARCHITECTURE authority (smooth entire margin, no lobe, no serration, one strong
  midrib) and not the pixel source. Same conclusion the beat-19 lane reached hours
  earlier from the other side with beat 18's fig.

