two_rounds_REJECTED_BY_EYE_before_this_one:
  the_straight_stem: >-
    A dead-straight 256 px stem with a two-blade crown read as a TELEVISION AERIAL
    or a lollipop, not a seedling -- the same class of rejection beat 19's own
    geometry() records, arriving here through a different door. The parent's own weed
    bows gently right through its middle, so the drawn stem is sampled along a
    quadratic Bezier carrying that bow, tapering 7.0 px at the root to 2.1 px at the joint.
  the_unrestricted_clone_source: >-
    With the fill source left free, the nearest acceptable pixel for rows y 493-557 was
    found out past his cloak, and the composite came back with a row of grey dashes at
    x 233-257 and a vertical seam down the box's own right edge at x 262 -- both visible
    at 3x, both rejected. composite-init-pattern.md §12's SOURCE LAW is the general form;
    the specific fix is that this plate HAS a measured clean field and the fill is made
    to use it (SOURCE_COLUMNS 55-150). Restricting the source removed both artefacts.

the_rooting_cue_is_KEPT_on_purpose: >-
  composite-init-pattern.md §13 in the POSITIVE: "a masked vacancy is filled with
  whatever the surviving cue suggests ... an attachment point is a structural cue and it
  is as strong as an outline." On beat 01 that law cost a rung. Here the removal stops at
  y 565, ABOVE the plate's own grass tufts at y 563-607, so the tufts and the last 25 px
  of the original stem base survive untouched and the drawn stem is rooted INTO them. The
  plate does the rooting; the sampler is asked to finish a join that is already physically
  there.

the_gap_flagged_not_fixed: >-
  NO SIDE-BRANCH AND NO FIG WERE DRAWN, and that leaves a real continuity gap reported
  rather than smuggled. THE-SAPLING.md's growth ladder gives 002a/b/c "two leaves + one
  thin side-branch", and the fig does not leave the plant until beat 19 -- so at beat 15
  the episode's own continuity puts a fig on this plant, and neither r1's prompt nor r2's
  ever asked for one. The bar this rung is scored against is beat 15's own P3, "Exactly
  ONE plant, TWO leaves, ONE thin stem. Extra stalks, extra leaves ... or a bud/ball at
  the tip all FAIL" -- a drawn side-branch scores as an extra stalk and a drawn fig as a
  bud at the tip. ONE VARIABLE PER RUNG: this rung is the LEAF COUNT. The fig is a second
  variable and is separately frozen canon belonging to the fig lane (ep2-fig-purple in
  pipeline/canon.yaml, scope.beats [19, 20]).

