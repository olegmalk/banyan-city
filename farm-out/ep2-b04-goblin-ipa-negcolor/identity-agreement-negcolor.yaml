# Identity agreement across seeds — measured, not judged.
# Written by identity_agreement.py. Mean cosine over all pairs within
# each group. Whole-frame embeddings on a beat whose framing is
# identical in every frame, so absolute values are inflated in BOTH
# arms and only the delta between groups carries meaning.
dino_model: facebook/dinov2-base
dino_licence: Apache-2.0
clip_model: openai/clip-vit-large-patch14
clip_licence: MIT
primary_metric: dino_mean (DreamBooth: CLIP-I cannot separate two
  different subjects sharing one description, which is this defect)
groups:
- name: wave1-baseline
  frames: 4
  pairs: 6
  dino_mean: 0.6967
  dino_min: 0.6420
  clip_mean: 0.8931
  clip_min: 0.8667
