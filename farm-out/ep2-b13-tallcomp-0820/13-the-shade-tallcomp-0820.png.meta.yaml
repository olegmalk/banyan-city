the_one_variable: >-
  PLANT HEIGHT, and nothing else. Same plate, same palette measured off that
  plate, same light axis, same drawing primitives, same root position
  (150, 1160) as the default build. Height 485 px -> 921 px; ~25.7 cm -> ~48.7 cm
  at this plate's head-derived rate, against canon's ~40 cm.
