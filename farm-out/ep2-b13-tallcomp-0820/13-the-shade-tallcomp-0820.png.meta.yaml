checks_still_scored_and_all_PASS: "C1 outside-footprint 0; C2 face box maxdiff 0;
  C3 whole plant in frame; C6 one drawn component; C8 0 px in the background
  sprig; C9 darkest solid drawn luma 24 vs the plate's own 23"
checks_lifted_and_why:
  C7_NO_DRAW_ABOVE_Y: >-
    LIFTED. 37224 drawn px above y=640, where the default build requires 0. That
    guard exists so nothing this tool draws can reach his hands, arms or face --
    and it IS the refusal the author is being asked to override, so it is
    measured and printed rather than enforced. Of those 37224 px, ZERO are inside
    his face box; C2 stayed armed and proves it.
  C4_crown_at_knee_line: >-
    REPORTED, NOT SCORED. Crown y 199 against his measured knee line y 595, off by
    396 px. A plant that clears his knee line is the whole of what answer B asks
    for, so scoring it would be scoring the answer against the premise.
what_the_geometry_had_to_obey_and_it_is_a_finding: >-
  THE PLANT HAD TO FIT A 248 px CORRIDOR. Tall enough to reach his eye line means
  drawn beside his head, and beside his head there is frame edge at x 2 and face
  box at x 250 and nothing in between. Three blade angles were built and looked
  at: +-50 deg runs off the left edge (C3, x min 0), +-58 deg puts 114 px inside
  his face box (C2), and only +-70 deg clears both -- 34 px of margin left, 7 px
  right. THE CONSEQUENCE IS VISIBLE AND IS NOT A DRAWING FAULT TO BE FIXED: at
  +-70 deg the two blades are near-vertical and overlap into a two-lobed mass
  rather than splaying like the default's. At this framing there is no room for a
  tall plant to have wide leaves. That is evidence about the SHOT, and it belongs
  on the card next to the picture.
one_correction_made_inside_this_build: >-
  shade(root_anchored=True), founder-option only. The plate's low-pass field is
  renormalised against `local`, the ambient level where the plant sits. Over a
  921 px footprint reaching into the bright upper frame that mean jumps
  101.5 -> 160.9, the root loses its lift (ratio at base 1.488 -> 0.938) and comes
  out at luma 21.2 against the plate's own darkest 22.9 -- C9 firing correctly on
  a genuinely too-dark root. `local` is therefore measured over the band the
  plant is ROOTED in (the lowest quarter of its own y-extent). Root goes to 23.9
  and C9 passes ON THE DRAWING, not on a moved bar. THE DEFAULT PATH IS UNTOUCHED
  AND WAS RE-VERIFIED: it still reproduces 9ae127d1... byte for byte, which
  matters because ep2-b13-sapcomp-0820.yaml asserts that sha before loading a
  model.
