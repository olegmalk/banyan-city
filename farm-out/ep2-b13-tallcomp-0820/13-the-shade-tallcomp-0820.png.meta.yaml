geometry_is_the_stewards: >-
  The staging choice in this frame is mine, not the author's, and it is offered
  as one legible instance of "taller", not as the only one. If he rules B and
  wants a different height or a different lean, that is a new draw and costs
  seconds.
what_this_does_NOT_settle: >-
  It does not show the shade landing on his face. It shows a plant whose leaves
  are at his eye line, which is the necessary condition. Whether a 0.30 pass then
  puts a readable patch of shade on his cheek is the downstream sample
  (ep2-b13-tallcomp-0820), and it is reported, never assumed.
