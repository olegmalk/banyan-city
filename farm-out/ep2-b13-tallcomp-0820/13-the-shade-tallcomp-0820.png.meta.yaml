tool: pipeline/beat13_shade_composite.py --founder-option
sampler: "NONE -- plain image processing, $0, no GPU, no network"
what_this_is: >-
  ANSWER B of the taste question on /review/ep2-b13-shade-0820, drawn so the
  author can look at it instead of imagining it. The card asks: does the current
  take satisfy "tips his head sideways into the sapling's hand-sized patch of
  shade", OR may the plant be drawn TALLER THAN CANON in this one shot so the
  shade can reach his face? Answer A already had pixels. Answer B had none,
  because the only tool that can draw it refuses to. This is that refusal
  deliberately opened, once, under a named flag.
is_show_content: false
why_is_show_content_false: >-
  CARD EVIDENCE, NOT A CUT INIT. Canon says the sapling is ~40 cm and always
  shorter than he is, in every beat of 002b (node.md:181-187, founder
  2026-08-16 "thats ridiculous, lmao. the sapling is tiny"). This frame breaks
  that on purpose, at ~48.7 cm, to show what the exception would look like.
  Nothing built on it may enter the cut, and canon is unchanged unless and until
  the author rules "draw it taller" -- at which point the exception gets written
  into pipeline/canon.yaml AS an exception so it cannot drift.
