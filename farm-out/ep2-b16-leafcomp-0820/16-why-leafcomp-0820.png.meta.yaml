palette_measured_and_why_it_was_moved: "The plate's own foliage (grass bed, luma band 90-140) means (107.3, 128.1, 79.6) and the goblin's lit forehead is (111, 132, 79) -- THE SAME COLOUR to within four levels in every channel. Drawing the blade in the plate's own plant colour, which is this house's practice, would make it INVISIBLE over the part of the frame it most needs to occlude. It is therefore moved along ONE named axis, saturation toward true green, to a tone neither the yellow-green grass nor the olive skin occupies."
what_this_rung_does_NOT_fix: "FOCUS. The plate's focal plane is on HIM -- his face is sharp and the near grass is blurred -- so the depth delivered here is occlusion and scale, not the brief's 'blurred behind it'. Blurring him means writing outside the drawn footprint, which C1 forbids and which would put a second variable in the same fire. SCALE, too: he still fills the frame, because that is the plate's own recorded fault and no composite reaches it. Both are the reason this is evidence for a taste question and not a candidate frame."
