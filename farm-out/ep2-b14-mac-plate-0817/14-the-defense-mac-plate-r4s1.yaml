what_this_advances: >-
  THE OPERATOR-CLASS SWAP WORKED DIRECTIONALLY AND THE REGION STILL HAS NO
  OBJECT, AND THE DIFFERENCE BETWEEN THOSE TWO IS THE FINDING. r3's `tall green
  grass behind him` did not touch the upper band at all - it put tufts beside
  him at his own depth. r4's `tall green grass background` REACHED THE BAND: it
  turned it from pale greenish-white to green and added faint texture. So a
  frame-anchored `background` tag does address the upper region where a
  figure-anchored `behind him` does not, which was r4's hypothesis and it is
  supported. WHAT THE TAG DELIVERED WAS THE COLOUR OF GRASS AND NOT GRASS.
  AND THERE IS A GEOMETRIC REASON IT CANNOT DELIVER MORE, WHICH IS THE MOST
  USEFUL THING IN THIS PAIR OF RENDERS. THE HOLE IS ABOVE THE HORIZON. Grass
  grows on the ground; the band that keeps coming back empty is the band above
  his hunched back, and NO QUANTITY OR PHRASING OF A GRASS NOUN CAN PUT GRASS
  THERE. Every rung so far has been aiming a ground noun at a sky region. The
  only nouns that can legitimately occupy that band are sky, clouds, distant
  hills, or something standing at the horizon line - AND `tree, forest` ARE IN
  THIS BEAT'S NEGATIVE, which forbids the most natural horizon object outright.
  That also explains why (11,3) got grass to its top edge and this beat cannot:
  (11,3) looks ALONG the field at two men walking away, so the ground plane
  fills the frame geometrically. A low close-up on a crouching figure has a
  horizon in it, and therefore has a sky.
  ONE PRE-REGISTERED GUESS IS WEAKENED BY ITS OWN TEST. r4's commit named the
  r5 candidate as naming the sky positively, on the hypothesis that the wash
  was an unnamed sky. The band went GREEN, not blue, when given a grass-coloured
  background tag - so the model is not treating that region as sky by default,
  it is treating it as "background, colour unspecified" and taking the nearest
  hue. The r5 direction survives (that band needs an above-horizon noun) but the
  specific reasoning behind it did not, and the correction is recorded here
  rather than allowed to pass as a confirmed prediction.
  NEITHER REVISION IS A FINDING ABOUT A WORDING. Both are single seeds of one
  seed number (20260814, four draws now: r1, r2, r3, r4) on a renderer that
  differs from the box at MAE 61 of 255. No seed batch was fired, because the
  committed decision rule spends three fresh seeds only once ALL axes hold.
