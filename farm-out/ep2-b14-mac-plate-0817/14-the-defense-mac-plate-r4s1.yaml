  cloak with white cuffs, in a FULL SQUAT - knees out to either side, black
  boots flat on the ground and VISIBLE, torso folded forward, head down and
  face angled toward his hands. BOTH green clawed hands are down at the soil,
  fingers converging, fingertips in contact, with a dug divot of loose crumbs
  beneath them and a tiny pale yellow-green SPROUT rising at the point of
  contact. Nothing is held in either hand. A band of bare brown soil runs
  across the middle-lower frame. GREEN GRASS IS NOW ON FOUR SIDES OF THE SOIL:
  a continuous grass band behind his boots at the far edge of the dirt, tufts
  at the left and right frame edges, and tall blades across the bottom
  foreground, all reading green rather than straw. THE UPPER BAND IS STILL A
  WASH but it has CHANGED CHARACTER: where r3's was pale greenish-white, this
