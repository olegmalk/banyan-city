what_this_frame_shows: >-
  A HIGH ANGLE LOOKING DOWN. ONE adult green goblin, bald, long pointed ears,
  brown-oxblood ragged hooded cloak, crouched right down with knees splayed and
  his torso folded, seen from above and slightly in front. THERE IS NO HORIZON
  AND NO SKY ANYWHERE IN THE FRAME: the top edge is tall green grass drawn as
  individual blades across the full width, and green grass continues past the
  left, right and bottom edges too. He is on a large patch of bare pale
  sand-cream soil that fills the middle of the frame, ringed by that grass on
  ALL FOUR SIDES. BOTH FORFARMS come down the centre of the frame and CONVERGE
  INTO A SINGLE FUSED HAND -- one wrist, one palm, six visible digits with dark
  claws -- pressed into a shallow dug divot with dark crumbs thrown around it.
  Contact is unmistakable. The hand mass is roughly the size of his skull and
  the two are the largest elements in the frame. His whole FACE is visible
  because the camera is above him: heavy brow, both blank white eye-slits, nose,
  mouth, both ears, angled down toward his own hand. Legs cut off below the
  knees, no feet. Cloak plain, no patchwork.
verdict_against_pre_registered_bar: >-
  P5 PASSES FOR THE FIRST TIME IN FOUR RUNGS AND r6 IS STILL NOT A PASS, because
  P2 REGRESSED. Scored axis by axis, against the text as written:
  P1 LOW AND OVER THE GROUND - PASS. Crouched, not standing, and the ground he
  is over is the whole frame.
  P2 BOTH HANDS IN FRAME AND DOWN - FAIL. The axis requires "both hands
  visible". Two forearms arrive and terminate in ONE hand: a single wrist, a
  single palm, six digits. r5 had two separate hands side by side with ten
  fingertips in the divot (checked by re-opening r5 at the same zoom rather than
  trusting its write-up). Nothing is held and nothing is on a knee, so the rest
  of P2's text is satisfied; the hand COUNT is what fails.
  P3 CONTACT - PASS. Claw tips are in a dug divot with loose crumbs, skin
  meeting dirt, not hovering.
  P4' DIRT WITHIN A GREEN FIELD, RATIO NAMED - PASS, AND THE STRONGEST OF ANY
  RUNG. Bare soil under and around the hand, green vegetation on FOUR sides of
  him and continuing past every frame edge, no isolated tufts. This is a dirt
  patch inside a field, which is what the beat has wanted since 08-16 and what
  r5 only marginally had.
  P5 NO VACANCY - PASS. THE AXIS UNDER TEST, and the fault is DELETED rather
  than filled: there is no above-horizon band at all, because there is no
  horizon. The top of the frame is textured grass, both top corners included.
  No dust haze band, no white background, no featureless wash larger than his
  torso. Scored BY EYE as r3, r4 and r5 were. Supporting measure only, and the
  bar's own rule that P5 is never scored from a rectangle alone is respected:
  pipeline vacancy measure gives the largest inscribed flat rectangle in the
  whole frame as 155x114 = 17670 px^2, which is 0.29 of this figure's own torso
  area, AND IT SITS ON HIS BALD SKULL rather than in the background -- where
  r5's largest sat in the right-edge wash at 65x320. The subject is now the
  flattest thing in the frame, which is the opposite of a hole.
  P6 HIS HEAD IS IN FRAME - PASS, and better than the failure I named in
  advance. Q11 TOP-OF-SKULL PLATE did NOT fire: the high angle returned the
  crown AND the entire face, so the clip has brow, eyes, nose and mouth to
  animate the glancing with. NO FORWARD TIGHTENING OF P6 IS NEEDED and the one
  I pre-registered as a candidate is withdrawn as unnecessary.
  P7 ONE ADULT GOBLIN - PASS. One figure, adult proportions, green skin, no
  second body. The skull reads large only through foreshortening; Q7 child/chibi
  did not fire.
  SO: SIX OF SEVEN, AND IT IS A DIFFERENT SIX. P5 and P4' are fixed and P2 is
  broken, where r5 had P2 and failed P5. By the rule committed before the pixel
  -- "a regression in ANY of P1, P2, P3, P4', P6, P7 FAILS r6 even if the band
