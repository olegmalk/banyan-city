  P5 PASS -- THE CONDITION HELD, no band, no horizon, no wash. Largest inscribed
  flat rectangle 161x140 = 22540 px^2 at x=292 y=324, which sits ON HIS BALD SKULL,
  so the flattest thing in frame is the subject rather than a hole -- the same
