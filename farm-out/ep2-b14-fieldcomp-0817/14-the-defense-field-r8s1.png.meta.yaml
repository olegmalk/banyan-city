  Q1-Q11 DID NOT FIRE. Q10 -- the field leaves with the sky -- is the mode this
  rung existed to close, and it is closed: the band is still gone AND the field is
  a field. Q12 DECAL did not fire on any of the five tells; Q13, Q14 and Q16 did
