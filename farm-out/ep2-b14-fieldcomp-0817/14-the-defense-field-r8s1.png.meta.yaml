  looseness and NOT used to score (s3 measured 46.8%).
  P6 PASS (head low in frame, whole face readable: brow, eyes, nose, fang).
  P7 PASS AS WRITTEN -- exactly one figure, adult limbs and adult face, green skin,
  no second body anywhere and nothing small in the background. THIS IS THE
  BORDERLINE AND IT IS SAID OUT LOUD: the unresolved mass above is ONE READING away
  from firing Q15. It reads to me as a smear, not a creature and not a second body,
  so P7 is scored PASS; the crop and the coordinates are committed so anyone who
  reads it as a second body can fail P7 and therefore the rung, on the evidence
