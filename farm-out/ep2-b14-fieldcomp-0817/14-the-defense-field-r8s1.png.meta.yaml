what_this_frame_shows: >-
  High angle looking down. ONE adult goblin, bald with a large domed skull, one
  pointed ear, purple-mauve cloak with a white collar, stooped right down over the
  ground with his back arched, knees bent under him, head low and his face angled
  toward the camera. NO SKY, NO HORIZON, NO BAND. TWO SEPARATE HANDS, two distinct
  wrists, fingers and pale claws of BOTH pushed into a dark brown crumbly dug
  patch with clods thrown around it. Around that dug patch is a bare pale-tan
  clearing roughly 415x260 px. EVERY OTHER PART OF THE FRAME IS A CONTINUOUS GREEN
  GRASS FIELD -- above him, below him, left and right, running off all four frame
  edges, with no bare sand between clumps anywhere. Face readable under the heavy
  brow: scowl, one eye reading RED, a fang. ONE DEFECT, DESCRIBED SO THE VERDICT
  IS CHECKABLE: at x 430..520, y 600..740, where the init had his white collar tip
  and grass, the 12 denoise steps resolved the leftover collar fragment and the
  grass around it into an AMORPHOUS PALE YELLOW-GREEN LIMB-LIKE MASS with contour
  lines and a claw-like tip. It is neither figure nor grass. See
  AB-r8s1-unresolved-form-init-left-render-right.png.
