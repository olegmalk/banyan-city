# ---------------------------------------------------------------------------
# CHANGE 1 — THE VOICES
# ---------------------------------------------------------------------------
the_revoice:
  the_ruling: >-
    2026-08-19, founder, verbatim "B", recorded at
    genomes/sapling/nodes/002b-first-citizen/clips/guards-revoice-0819.yaml.
    Three GUARD 2 candidates were built and measured and he picked B. GUARD 1 was
    moved in the same pass and was NOT asked for — see `guard_1_was_not_asked_for`.
  what_he_heard: >-
    Watching 0819c: "guard 2 has the same voice as the sapling." He was right to
    within 1.7 Hz. Measured on that cut's own takes, GUARD 2 sat at 109.1 Hz
    against the sapling's 107.4 — the only confusable pair in the episode.
  the_cause_was_a_casting_GAP_not_a_miswire: >-
    genomes/sapling/voices.yaml casts the tree as bm_fable and GUARD 2 as
    am_echo: two different voices, correct on paper. Both guards were cast AFTER
    build_refs.py's 2026-07-25 VOICE_SHAPING pass, so neither had an entry and
    both cloned from the same shared REF_TEXT at speed 1.0 / pitch 0.0. GUARD 1
    drifted clear by MPS luck; GUARD 2 landed on the tree.
  guard_1_was_not_asked_for: >-
    Taken by the VO lane, not by the founder, and named as such: his reference
    sat 1.1 Hz from bm_fable's and he cleared 0819c only because MPS
    non-determinism happened to push him +14 Hz. A base voice was NOT changed —
    am_adam throughout — so this is a band move, not a recast. One line to veto.
  takes_replaced: [5, 6, 7, 8, 9, 10]
  takes_replaced_scope: >-
    FIVE FOOTAGE BEATS AND ONE SLATE. Beats 5, 6, 7, 8 and 10 carry the new take
    over real footage; beat 9 is a slate and its new take plays over the card.
  separation_measured_on_the_bare_takes:
    # from guards-revoice-0819.yaml, measured by qa_voices' estimators on the
    # rendered audio — refs predict nothing, the engine pulls toward ~110 Hz.
    medians_hz: { VO: 109.6, GUARD 2: 135.6, SCAVENGER: 167.8, GUARD 1: 192.0 }
    GUARD 2/VO: 26.0          # was 1.7 — the defect he heard
    GUARD 1/VO: 82.4          # was 22.8 by luck, now by construction
    worst_pair_in_the_episode: 24.2   # GUARD 1 / SCAVENGER
  verified_in_the_muxed_output_not_just_in_the_directory:
    why_this_check_exists: >-
      BECAUSE THE DOCUMENTED PATH WOULD HAVE SHIPPED THE OLD VOICES AGAIN.
      guards-revoice-0819.yaml's own `next_assembly` note and
      work-ladder-0819.md:1279 both say render_t3 reads clips/NN-vo.mp3 straight
      out of the node directory, "no flag, no copy step". THE CODE DISAGREES:
      find_audio() (render_t3.py:249, called at 1088) and vo_manifest() (:347,
      called at 1094) both resolve against args.clips ONLY, with no fallback to
      the node dir — and pointing --clips at the node's own clips/ fails
      check_clips_dir() (:209) because that directory holds no NN-*.mp4. So the
      copy is mandatory, and a hash of the copied file only proves what went INTO
      the directory. These two checks prove what came OUT of ffmpeg.
    check_1_waveform: >-
      The beat's audio was decoded back OUT of the finished mp4 and
      normalised-cross-correlated against the decoded new take and the decoded
      old take. NCC is scale-invariant, so the master's loudnorm pass does not
      confound it, and the two takes are different performances, so the winner is
      unambiguous. ALL SIX BEATS: 0.9749 / 0.9861 / 0.9830 / 0.9935 / 0.9934 /
      0.9869 against the NEW take, versus 0.0622 / 0.0466 / 0.0733 / 0.0714 /
      0.0841 / 0.1488 against the OLD one.
    check_2_pitch_through_the_master: >-
      Median F0 measured on audio pulled back out of each episode, same estimator
      and same window on both. GUARD 2's three beats read 111.4 / 108.9 / 111.1 Hz
      in 0819c and 143.2 / 150.5 / 145.1 Hz in 0820. Against beat 01's sapling
      line in the same cut: SEPARATION GOES FROM 2.0 Hz TO 32.3 Hz.
    why_32_3_and_not_26_0: >-
      Named rather than smoothed over. 26.0 Hz is measured on the bare mp3 takes;
      32.3 Hz is measured through the finished master, over the whole beat slot,
      including the wind bed and after loudnorm. Different windows, so different
      numbers. Both clear the 20 Hz bar and both were taken the same way on both
      cuts, which is what makes the comparison mean anything.
  the_scavenger_overlap_is_carried_forward_unfixed: >-
    From the re-voice record, not re-derived: on medians GUARD 1 and the
    SCAVENGER are 24.2 Hz apart, but per take they overlap — GUARD 1's b07 take
    is 181.8 and the scavenger's own takes range 155.8-192.0, a 36 Hz spread that
    predates this pass. NOT fixed: the scavenger is outside the ruling's scope
    and re-rolling him is a lottery against his own spread. The mitigating fact
    is that the two never alternate (guards speak 05-10, scavenger 13-20),
    whereas the pair the founder caught alternates line by line.
  short_lines_undershoot: >-
    Also from the record. Beat 07 ("So we confiscate the apple.", five words)
    rendered 177.8, 174.5, 170.2 and 181.8 across four attempts, consistently
    below the same voice's long lines. Short lines do not give the clone enough
    voiced material to reach the reference. The best of the four is what is here.
  r6: >-
    Every take this pass replaced is in
    genomes/sapling/nodes/002b-first-citizen/clips/vo-archive/ (05-vo.v6,
    06-vo.v3, 07-vo.v3 through v6, 08-vo.v3, 09-vo.v3, 10-vo.v3), and the
    superseded copies are also still in review/ep2-demo-0819c/sources/. Nothing
    was deleted.
  the_other_twelve_takes_are_byte_identical_to_0819c: >-
    VERIFIED, NOT ASSUMED. Beats 1, 3, 4, 11, 12, 13, 14, 15, 16, 17, 18 and 20 —
    all twelve mp3 and all twelve json — hash identical to 0819c's. Only the six
    the ruling covers moved.

# ---------------------------------------------------------------------------
# CHANGE 2 — THE PALINDROME FIX, FIRST PUBLISHED USE
# ---------------------------------------------------------------------------
the_hold_fix:
  the_commit: af863c0b — pipeline/render_t3.py, committed 2026-08-19, applied to no cut until this one.
  what_it_replaced: >-
    render_t3.render_beat filled any slot that outran its clip by playing the
    footage FORWARD THEN REVERSED and looping that palindrome, and it printed
    nothing while doing it. In 0819c it fired on 8 of the 18 footage beats — 1,
    3, 4, 6, 10, 11, 17, 18.
  what_it_does_now: >-
    The clip plays once, forward, and its final frame is held for the remainder
    (tpad=stop_mode=clone), padded 0.2s past the slot so the -stream_loop cannot
    wrap back to frame 1. The tool now PRINTS the substitution on every beat it
    fires on. The palindrome survives only as opt-in `loop_fill: pingpong`, which
    nothing in this tree writes.
  it_fires_on_7_beats_in_this_cut: [1, 3, 4, 6, 11, 17, 18]
  why_seven_and_not_eight: >-
    BEAT 10 DROPPED OFF, and it is the re-voice that did it. Its slot is
    max(script, VO) and its new take is 0.10s shorter, so the slot went 4.17s ->
    4.08s against a 4.04s clip — a 0.04s margin, inside the branch's 0.05s
    epsilon. Beat 10 now plays its clip once and stops. Nothing was tuned to
    achieve that; it is a side effect of the voice change and is recorded so
    nobody reads the 8 -> 7 as a second fix.
  verified_on_two_beats_by_frame_comparison:
    method: >-
      The fill window is the span of a beat's slot AFTER its clip has played
      once. Frames were pulled from the ASSEMBLED cuts (not the sources, because
      the claim is about the cut) at 24fps across that window, cropped to rows
      0-800 — the picture strictly above the caption strip, because caption text
      changes on VO chunk boundaries and that is motion which is not the footage.
      Adjacent pairs whose mean absolute luma difference exceeds 0.30 levels
      count as moving.
    beat_01:
      slot: 0.00-9.46s in BOTH cuts, clip 5.04s, fill window 5.04-9.46s
      moving_pairs_0819c: 105 of 105
      moving_pairs_0820: 0 of 105
      bit_identical_pairs_0820: 70 of 105
      max_pixel_delta_0820: 4        # h264 ringing; 197 in 0819c
      what_the_fill_actually_contains: >-
        Each fill frame was matched against every frame of the forward clip. In
        0819c the best match walks BACKWARDS — 120, 119, 118, 117, 116 ... down to
        68 — which is the reversal, visible. In 0820 it is frame 120 for all 105
        fill frames. Distance from the clip's own last frame: 0.029 mean levels.
    beat_06:
      slot: 28.96-35.67s in 0819c (6.71s), 29.00-35.46s in 0820 (6.46s), clip 1.92s
      moving_pairs_0819c: 100 of 114
      moving_pairs_0820: 0 of 108
      bit_identical_pairs_0820: 80 of 108
      max_pixel_delta_0820: 11
      what_the_fill_actually_contains: >-
        THE TEXTBOOK CASE. In 0819c the best-matching clip frame runs 45 -> 0 ->
        45 -> 25 with two direction changes inside the fill window: the board turn
        plays backwards, forwards, then backwards again. In 0820 it is frame 45
        for all 109 fill frames, 0.092 mean levels from the clip's last frame.
      the_picture: review/ep2-demo-0820/b06-hold-vs-palindrome.jpg
    the_other_five_were_not_frame_checked: >-
      Beats 3, 4, 11, 17 and 18 take the same code path and print the same line,
      and they were NOT independently frame-compared. Named rather than implied:
      two beats were verified and five are inferred from the branch they took.
  a_claim_from_0819c_that_the_pixels_DO_NOT_support: >-
    picks-0819c.yaml and 0819c's page both said beat 01's fig "goes green, ripens
    to purple, and un-ripens to green again". Opening the frames, the fig is
    already purple by 1.2s and stays purple; what actually reverses is the
    growth detail at the fig's crown and all the ambient motion. The reversal is
    real and measured at 105 of 105 pairs — the colour story around it was
    overstated. Corrected here rather than repeated.

runtime:
  duration_s: 113.33
  previous_cut_actual_s: 113.46
  delta_s: -0.13
  a_correction_to_the_0819c_manifest: >-
    picks-0819c.yaml records `duration_s: 113.29` for a file that measures
    113.46s. The number was wrong in that manifest; ffmpeg reads 00:01:53.46 off
    the published mp4. Recorded here because the delta above is meaningless
    against a figure nobody checked.
  why_it_barely_moved_when_the_VO_grew_1_77s: >-
    THE VO GOT LONGER AND THE EPISODE GOT SHORTER, which looks wrong and is not.
    Slots fit to the LONGER of the script length and the VO length, so VO growth
    below the script floor buys no runtime. Per beat: 05 +0.86s of voice bought
    +0.04s of slot; 07 +1.11s of voice bought +0.21s; 09 +0.18s bought 0.00s.
    Meanwhile 06 -0.25s, 08 -0.03s and 10 -0.10s of voice gave slot back:
    -0.25s, -0.05s, -0.09s. Net slot change -0.14s, which is the -0.13s measured
    to within rounding. No clip was stretched, looped, trimmed or reversed.

