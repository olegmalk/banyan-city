# ---------------------------------------------------------------------------
# REVISION B — the two picks, their provenance, and how to veto either one.
# ---------------------------------------------------------------------------
revision_b:
  date: '2026-08-20'
  by: the composite-plate motion lane, acting on the coordinator's direction
  cost_usd: 0.0
  gpu_seconds: 0
  what_it_cost: one ffmpeg assembly and four local file copies. No render, no
    voice synthesis, no GPU, no network, no spend.
  authority: >-
    BOTH ENTRIES BELOW ARE STEWARD PICKS, NOT TASTE VERDICTS. A steward pick is
    mechanical selection among takes with a stated reason; taste is R4 and stays
    R4. Neither clip has been screened by the founder, and putting a clip in a
    REVIEW cut is how it gets screened — this file is the record of what he is
    being shown and why, not a claim that he has accepted it. Each pick is
    veto-able in one line and the line is written out below it.
  beat_15_pick:
    take: 15-good-listener-LTX-mid-s20260821-0820.mp4
    sha256: 3ee36f170386a815a9e3f98c687741099756cd2adaac02f667bd798b9720171c
    job: pipeline/jobs/ep2-b15-listenmid-s2-0820.yaml
    decided_by: >-
      the steward (this lane), 2026-08-20; ratified by the session coordinator.
      NOT the founder — he has never seen either candidate.
    the_choice_that_was_open: >-
      Beat 15 produced TWO passing clips in one evening, at two seeds, off the
      same recipe. ep2-b15-listenmid-0820 (seed 20260820) leans in and STAYS at
      the leaves, closer to the script's sustained staging, and pays with a
      drooped bent leaf pair at f120 and a visible eye that simplifies to a
      blank almond. ep2-b15-listenmid-s2-0820 (seed 20260821) leans in and comes
      back out, and keeps the plant and the face clean.
    why_the_s2_take: >-
      Three reasons, in order of weight. (1) CLEAN LEAVES. The plant is the
      thing eight beats of this episode keep getting wrong, and this is the one
      candidate where f090 and f120 show two clean ovate blades on a straight
      stem. (2) LIVE EYES. His irises survive to f120 where the sibling's
      collapse — beat 04 is already in this cut FAILING on exactly that clause,
      and shipping a second dead-eye beat next to it is a compounding defect.
      (3) STRONGER MOTION, MEASURED: f009..f084 all-pairs whole-frame interframe
      0.761 against the sibling's 0.623, mouth band 3.441 against 1.759, against
      a pre-registered floor of 0.30 / 0.80 calibrated on this beat's own
      history before either clip existed.
    what_the_pick_COSTS_and_it_is_named: >-
      A 3-frame exact freeze at the tail from f118 (the sibling has none), and
      the sustained lean the script arguably wants. The freeze is 3 frames out
      of 121 at HOLD strength 0.362 — the loosest reading this beat has ever
      produced, below the 0.508 the ladder had called the loosest of six. The
      lean is the one axis on which the sibling is genuinely better and it is a
      TASTE axis, which is why this pick is veto-able rather than final.
    the_judder_is_engine_wide_and_matches_the_episode: >-
      This clip reads judge_clip period 3 / 40 distinct pictures / 8.0 effective
      fps. So do all six other clips in this family and so does the rest of the
      episode. The sibling alone read period 2 / 60 / 12.0, and its confirmation
      seed proved that doubling was THE DRAW and not the recipe. Picking the
      sibling for its smoothness would have been picking a lottery ticket, and
      it would have put one beat at twice the temporal resolution of its
      neighbours.
    how_to_veto_it_in_one_line: >-
      "beat 15: use the other seed" — the sibling take is committed at
      farm-out/ep2-b15-listenmid-0820/15-good-listener-LTX-mid-0820.mp4; copy it
      into sources/, delete this one, re-run the command in `assembled_by`.
      Or "beat 15: back to a slate", same procedure with no copy.
  beat_03_swap:
    take: 03-bad-cover-LTX-midend-s20260821-0820.mp4
    sha256: 0c5fc0008e6f7fe6bd5099cc449c95e19e4222cd3cf1c9b81eb2504235f87e48
    job: pipeline/jobs/ep2-b03-covermid-s2-0820.yaml
    replaces: 03-bad-cover-b03-refire-0814.mp4 (sha 1d3992569bf969757fbd608e9f4f7cf5433e9ec0487403661aa238500795b1bc)
    and_also_replaces_the_first_choice_of_this_same_afternoon: >-
      03-bad-cover-LTX-midend-0820.mp4, sha 06446b9e6306a779e0b545748cbf58f5f
      5fb9697a87b2aa296e5a7440519903e, which held this slot for 40 minutes.
      Its seed re-roll landed while the page describing it was being written and
      is strictly better in the cut, so the slot moved again rather than waiting
      for a tidier moment. Both are the same prompt, plate, init sha and flags;
      the only difference between them is the draw.
    why_the_re_roll_and_not_the_first_take: >-
      IT KEEPS THE PICTURE ALIVE UNDER THE WHOLE SPOKEN LINE, WHICH THE FIRST
      TAKE DID NOT. Last interframe pair above 1.0: f101->f102 against
      f072->f073. Live content 103 frames against 74, 4.292 s against 3.083 s.
      Beat 03's VO is 3.982 s = frame 95.6, so the first take plays roughly the
      last second of its own line over a frozen picture and this one does not.
      It also acts harder in the middle on the same instrument (step-frame
      f060..f072 mean 8.726 against 6.995) and 16x harder in the tail window
      (step pairs from f084: mean 1.514 against 0.094).
    and_it_fails_H1_WORSE_which_is_the_finding: >-
      judge_clip reads 15 exactly-duplicated frames from f106 where the first
      take read 7 from f114, against a bar allowing fewer than 6. BOTH ARE TRUE
      OF THE SAME CLIP. The exact-duplicate run counts only byte-identical pairs,
      so it measures where the sampler stopped emitting new pixels, not where the
      PERFORMANCE stopped — the first take stops acting at f073 and then spends
      32 frames producing near-dead-but-not-identical pictures before its exact
      run begins. On this beat the instrument RANKS THE TWO CLIPS BACKWARDS, and
      the pick was made on the last-live-pair number instead, which is the same
      quantity the record already publishes for every rung. Recorded as an
      instrument qualification, in the same class as the three this lane retracted
      on 08-19, and NOT as a bar quietly relaxed to fit a clip: H1 is scored FAIL
      and stays FAIL.
    so_beat_03_is_NOT_marked_cut_ready: >-
      Stated because the alternative was available and would have been an
      overclaim. The beat carries a written FAIL on a pre-registered clause; it
      is in the cut as BEST-AVAILABLE with the fault named, exactly as thirteen
      other beats are. What closed is the seed axis: three draws now read f069,
      f073 and f102 for the death point, so where the performance stops is
      substantially the draw, and the wording axis was already closed by
      measurement at three rungs.
    decided_by: >-
      the founder's ratified adult-goblin design, applied. The DESIGN call is
      his and is already made; choosing which of two clips enacts it is the
      mechanical part and that is this lane's.
    why: >-
      THE INCUMBENT CONTRADICTS A RATIFIED DESIGN AND ITS OWN NEGATIVE. It is a
      chibi CHILD in a buttoned shirt — `child, chibi, round head` is in this
      beat's own negative prompt — holding the trunk of a whole leafy TREE from
      f018, which is the exact plant miss the composite route was built to
      close. The replacement is the ratified lean adult goblin crouching behind
      a two-leaf seedling. It also beats the incumbent on every measurable axis
      the record holds: 46 dead pairs of 120 against 60 of 96, last live pair
      f072->f073 against f035->f036, and no assembler hold at all against the
      incumbent's 0.34 s.
    what_it_does_NOT_fix_and_this_is_on_the_page: >-
      The clip's own last stretch is still a frozen picture — the last 19 frames,
      0.79 s of a 5.042 s slot. What changed is WHERE it starts: after the line
      ends rather than a second before it. It is IN THE FOOTAGE, not an assembler
      fill: the clip is longer than the slot floor so render_t3's hold branch
      never fires on this beat, where the incumbent needed 0.34 s of one. And the
      height sub-clause is unmoved and now shown to be unmovable — two independent
      draws off one init put the top of his cloaked back ~185 px above the leaf
      tops, within 10 px of each other. It is a plate property.
    how_to_veto_it_in_one_line: >-
      "beat 03: back to the old clip" — it was never deleted; it lives at
      review/ep2-demo-0819c/sources/03-bad-cover-b03-refire-0814.mp4 and in this
