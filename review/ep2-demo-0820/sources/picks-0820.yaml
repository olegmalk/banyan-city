      Or "beat 03: use the other seed" for the 20260820 take, which is at
      farm-out/ep2-b03-covermid-0820/.
  the_seed_re_roll_landed_during_this_revision: >-
    ep2-b03-covermid-s2-0820: backlogged 14:04, filed by the autofill tick, rc=0
    at 14:12, 266.3 GPU-seconds, $0. Prompt, negative and init asserted
