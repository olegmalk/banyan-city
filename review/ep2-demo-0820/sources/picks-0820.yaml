# ONE ROW PER BEAT: which take is in the cut, and WHY it is the one in the cut.
# `why` is exactly one of:
#   new              — footage that was not in the 2026-08-19c cut
#   carry-forward    — the 0819c pick, kept because nothing newer earned the slot
#   slate            — no footage that a verdict lets into a cut
#
# THIS CUT CHANGES NO PICK. Every one of the eighteen footage beats is the same
# file at the same sha as 0819c — verified, not asserted: all 18 mp4 and all 18
# sidecars were hashed against review/ep2-demo-0819c/sources/ and 36 of 36 match.
# Beat 16 stays a slate per the founder's 2026-08-16 ruling; beat 19's fall stays
# best-available on a steward ruling. No verdict has landed since 0819c that
# moves any slot.
#
# WHAT IS DIFFERENT IS THE TWO THINGS THAT WERE FINISHED AND NEVER SHIPPED:
#
#   1. THE VOICES. Six re-voiced guard takes (beats 05-10) enacting the founder's
#      2026-08-19 "B" ruling. GUARD 2 was 1.7 Hz from the sapling in 0819c — the
#      defect he heard while watching it. Provenance: sources/guards-revoice-0819.yaml.
#   2. THE PALINDROME FIX. render_t3's fill branch (af863c0b) now HOLDS the last
#      frame instead of playing the clip forwards-then-backwards. 0819c played
#      eight of its eighteen footage beats partly in reverse and printed nothing
#      while doing it. This is that commit's first published use.
#
# Both were on disk and unpublished at the close of 08-19. Neither needed a
# founder gate, a GPU or a dollar.

