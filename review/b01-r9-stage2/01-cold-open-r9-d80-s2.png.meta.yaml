note: |-
  round 9, the DEPTH-CONTROLNET round: the plate is taken as GEOMETRY ONLY, its colour discarded before the first denoise step. r8 settled half of this beat — seven rounds of wording produced no grounded whole-plant frame and the b15 init produced 8 of 8, at ~30% (i35) and ~25-34% (i55) stem height — and left the other half open: all eight wear the plate's amber dusk, its light shaft and its macro bokeh where the beat asks for `peach and gold sunrise sky, wide shot`, while r8's own t2i control drew that sky correctly on all four seeds. So the prompt is fine and the init is overriding it. r8's closing sentence — "in this particular plate the palette IS the composition, so strength cannot buy one without spending the other" — is true about STRENGTH and does not generalise to DEPTH: an RGB init makes geometry and colour the same numbers and `strength` is one scalar over both, whereas a depth map separates them BEFORE diffusion starts, one channel of geometry with no colour left to leak. THE SINGLE VARIABLE is the conditioning: base checkpoint, bf16/cuda, 832x1216, 40 steps, cfg 7.5, the seed rule, the sent positive (65 tokens) and the sent negative (72, r7's string) are all r8's byte for byte, and the plate arrives as image=<depth map> through diffusers/controlnet-depth-sdxl-1.0 instead of as an init. control_guidance_start/end are pinned at 0.0/1.0 deliberately: ending control early is the standard trick for letting the prompt own late-stage colour, but a depth map carries no colour, so here it would be a second variable bought against a problem the architecture already solves — if geometry and palette fight late in the denoise, that is r10's axis. ONE SET OF WEIGHTS: the base pipeline loads once and AutoPipelineForText2Image.from_pipe(pipe, controlnet=cn) swaps the class while reusing the loaded modules, the same discipline as r8's from_pipe. THE MAP IS COMMITTED, NOT DERIVED HERE — Intel/dpt-hybrid-midas never loads in this script; Stage 0 derived the map, a human passed it against three gates (polarity: near is bright, per MiDaS inverse depth; the sprout survives the estimator's downsample; b15's light shaft is gone from the sky band), and it was committed with its own sidecar so the round stays reproducible even if the estimator's weights or defaults move. G1 CHAIN, both ends asserted: approved plate b15-r3-s1 (canon since d4488de, sha f60c1404…) -> pinned estimator -> committed map (sha fda4bf6c…) -> pipeline. The map carries strictly LESS than the approved still, so it can subtract from approved content but cannot introduce unapproved content, and the plate itself is read for its hash only and is never passed to the pipeline. b15 is the only admissible geometry source and that is structural rather than a taste choice: every beat-01 frame carrying the right palette — r2-s3, r3-s3, r6-s3 — is unapproved or revoked and would fail G1 before the founder saw it, which is exactly why the fix has to be to discard the init's colour rather than to find a better-coloured init. SHOTS.MD WAS NOT EDITED; the height predicate is stripped script-side after asserting the fence on disk is byte-for-byte r7's, so a stale checkout cannot start. ONE SAMPLE IS ENFORCED IN CODE: --frames defaults to 1 and more than one frame refuses without an explicit --stage2, so Stage 1 (d60, seed 20260720, one frame) cannot be skipped past. THE TOKEN COUNTS ARE A BOX MEASUREMENT — the script refuses to run without a real CLIP tokenizer, because the estimator over-counts a positive of this shape by ~3 near the 77 boundary and the comparability claim rests on 65 and 72 exactly. PRE-REGISTERED RUBRIC, two axes: (A) geometry unchanged from r8 so the numbers compare — stem height fraction against the 32% ceiling he revoked, with r8's ~30% standing, plus grounded/person/pale-slab counts n of 4, person-binding observed not assumed; (B) palette, measured not eyeballed — mean sky RGB over the top 25% against the plate, r8-i35-s0 (the leak) and r8-t2i-s0 (the correct s