files:
  14-worth-staying-in-LTX-r1-COLLAPSES.mp4: >-
    REJECTED ON EYES by the steward as a mechanical defect, not a taste call. The
    sapling bends monotonically from frame 40 and is near-horizontal and leaving
    frame by 64. It measured median 4.45->6.87 (6.87), the HIGHEST number in the
    episode, because a subject falling over is large frame-to-frame change. Kept
    as evidence that the motion metric cannot tell "alive" from "collapsing".
  14-worth-staying-in-LTX-r2.mp4: >-
    Same seed 20260745, prompt the only variable, ambient-only motion wording.
    The sapling stays upright for all 65 frames; style, palette and linework hold
    from the conditioning frame; no human, hand, face or invented object appears.
    Median 4.45, 0% frozen. ONE RESIDUAL, offered as an observation and NOT as a
    verdict: the framing drifts upward and the leaf tips crop at the top edge by
    frame 56. It reads as the plant growing, which suits the beat's line, but
    whether that is right is R4's and nobody else's.
  B14-MOTION-COMPARE.mp4: side by side, v34 held still (left) vs r2 (right).
  SHEET-b14-r1-collapse.png: conditioning frame + 9 frames, the collapse.
  SHEET-b14-r2.png: conditioning frame + 9 frames, upright.
