# ===================================================================
# PROVISIONAL — v36b clip set. Nothing here is canon, nothing here is
# approved, and no file in this directory may be promoted to a canon
# name or published. Taste is the founder's (R4).
# ===================================================================
# NO MODEL RAN FOR THIS FILE. It is a 1.625s head-cut of an already
# rendered clip in this same set, re-encoded only so the concat is
# frame-clean. Nothing was generated, voiced or synthesised.
#
# WHY IT EXISTS. Founder, 2026-08-11: "also we should show that he
# became a sapling earlier in the video just to make it less
# confusing." Beat 05 is silent and its authored slot is 0:20-0:24
# (4.00s) while its footage runs 2.583s, so 1.417s of the slot the
# author already wrote was playing as nothing. render_t3 sequences
# multiple `05-*.mp4` in stem order, so this file plays as the TAIL of
# beat 05 — the cut from the dark apartment floor to what he is now —
# and no script beat was added, moved or renumbered to make room.
#
# THE `-alt1-` IN THE FILENAME IS A LIE THE GUARD FORCES, AND THIS IS
# WHERE IT IS CORRECTED. This file is NOT an alternate take of the fan
# spin-down; it is a SECOND, DIFFERENT SHOT sequenced after it inside
# beat 05. It was first named `05-sapling-reveal.mp4` and
# `render_t3.footage_matches_beat` silently dropped it from the cut:
# that guard slug-matches a clip's filename against its beat's slug so
# that stale footage from a renumbered script cannot play over the
# wrong line, and "saplingreveal" does not match "fanspinningdown". The
# guard was right on its own terms — it cannot tell a deliberate insert
# from a stale orphan. `find_clips` documents `NN-slug-alt1.mp4` as the
# convention for a beat's second clip and splits on `-alt` before
# matching, so the name has to start with the beat's own slug. The
# filename says "alt"; the shot is a cut to somewhere else.
