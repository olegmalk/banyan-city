  - id: v08
    scene: sea clifftop
    verdict: REJECT
    law: D2
    note: >-
       returned a FLOATING ISLAND in open sea. The scene words and the picture
       disagree completely and there is no near ground plane at all.
  - id: v09
    scene: ridge above fog
    verdict: REJECT
    law: D2
    note: >-
       `low fog below` put the camera ABOVE the weather: the near plane is
