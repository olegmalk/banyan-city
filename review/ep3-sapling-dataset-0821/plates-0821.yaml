round_6_what_the_predictions_got_right_and_wrong: >-
  PREDICTION ONE (w02 and w04 come back tan and pale anyway, killing the rule)
  IS HALF RIGHT AND THE SPLIT IS THE RESULT. It named both cells together and
  they diverged: w04 came back frozen, w02 came back green. The prediction's own
  alternative -- "what actually carries the ground is the LIGHT TEMPERATURE
  itself, warm light means dry, cold light means frozen" -- is HALF confirmed
  and half falsified by the same batch: cold light does mean frozen, warm light
  does NOT mean dry.
  PREDICTION TWO (w01 comes back blue, dusk is closed) IS RIGHT ON THE OUTCOME
  AND WRONG ON THE MECHANISM. w01 is not blue, it is GREY -- the deletion
  worked, the sky lost its blue -- and it refuses anyway, harder than v01 did.
  What kills dusk is not a hue, it is the light LEVEL: a ground plane that dim
  has no dominant channel left. Dusk is closed either way.
  PREDICTION THREE (the control fails and the batch is invalidated) DID NOT
  HAPPEN. w03 is the strongest plate in the whole set.

