round_5_result: >-
  4 OF 14 USABLE, against 8 of 8 in round 4 -- and the drop is the point of the
  round rather than a regression in it. Round 4 asked for eight DAYLIT scenes
  off a recipe tuned on daylit scenes and got eight. Round 5 asked for the
  lighting the recipe had never been pointed at, and the recipe held on the
  axis it was proved on (D3: ZERO FIGURES IN FOURTEEN OF FOURTEEN, the first
  clean sweep this tree's figure ban has ever had) while failing on two
  specific things that are now measured instead of guessed. Kept: v02, v03,
  v05, v12.

