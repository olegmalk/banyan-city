       REFUSED IT. `foliage_palette` found ONE green-dominant pixel in the
       plant's region AND in the whole-lower-half fallback, at RGB (2,7,2), and
       C5 then failed the composite -- fill luma 5.0 against a field's 54.9.
       Dusk teal is BLUE-dominant, not green-dominant, so this is the u05
       failure arriving through a lighting word rather than a ground-cover one.
       Not an eye call and not curated around; the plate is kept on main so the
