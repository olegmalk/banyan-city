round_5_result: >-
  4 OF 14 USABLE, against 8 of 8 in round 4 -- and the drop is the point of the
  round rather than a regression in it. Round 4 asked for eight DAYLIT scenes
  off a recipe tuned on daylit scenes and got eight. Round 5 asked for the
  lighting the recipe had never been pointed at, and the recipe held on the
  axis it was proved on (D3: ZERO FIGURES IN FOURTEEN OF FOURTEEN, the first
  clean sweep this tree's figure ban has ever had) while failing on two
  specific things that are now measured instead of guessed. Kept: v02, v03,
  v05, v12.

round_5_verdicts:
  - id: v01
    scene: dusk
    verdict: REFUSED AT STEP 2
    law: D5
    note: >-
       By eye it passes: cel, straight horizon, a smooth dusk field band at
       y~610-800 with tall-grass silhouettes below it. THE PALETTE SAMPLER
       REFUSED IT. `foliage_palette` found ONE green-dominant pixel in the
       plant's region AND in the whole-lower-half fallback, at RGB (2,7,2), and
       C5 then failed the composite -- fill luma 5.0 against a field's 54.9.
       Dusk teal is BLUE-dominant, not green-dominant, so this is the u05
       failure arriving through a lighting word rather than a ground-cover one.
       Not an eye call and not curated around; the plate is kept on main so the
       refusal can be reproduced.
  - id: v02
    scene: night, moonlight
    verdict: PASS
    law: all
    note: >-
       THE PRE-REGISTERED PREDICTION WAS WRONG HERE AND IT IS WORTH THE WHOLE
       ROUND. v02 was named in advance as the cell most likely to come back
       green-starved; it is the GREENEST PLATE IN THE BATCH -- 34k to 176k
       green-dominant pixels depending on the region, against v01's one. Flat
       cel fills, hard ink, a smooth emerald slope from y~800 with blades
       crossing it (D2 allows blades), moonlit rim gradient for D4. The
       dataset's dark end comes from TRUE NIGHT after all, not from dusk.
  - id: v03
    scene: storm, light shaft
    verdict: PASS
    law: all
    note: >-
       The other cell pre-registered as green-starved, and also wrong: a bright
       flat green plane from y~950 under a near-black sky, 10k-97k green px.
       The shaft gives D4 a real luminance gradient. CAVEAT CARRIED INTO THE
       GEOMETRY TABLE: dark landform wedges sit in both bottom corners, so
       roots stay in x 280..680.
  - id: v04
    scene: golden hour
    verdict: REJECT
    law: D2
    note: >-
       The distance clause worked at the top of the frame and the LOWER HALF IS
