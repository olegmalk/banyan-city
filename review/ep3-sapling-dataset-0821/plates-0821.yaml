  - id: v06
    scene: lake
    verdict: REJECT
    law: D2
    note: "water fills the lower two thirds; risk 2 fired exactly as written."
  - id: v07
    scene: creek
    verdict: REJECT
    law: D2
    note: >-
       risk 2 again, and this one is the surprise: r06's cell PASSED in round 2
