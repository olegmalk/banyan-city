# ROUND 6, FILED AND JUDGED 2026-08-21. A four-cell WORD PROBE, not a breadth
# batch: each cell deletes one suspect word from a round-5 failure and changes
# nothing else, the way round 2 did. All four landed on the box at 22:44 and
