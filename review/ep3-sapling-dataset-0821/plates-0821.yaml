# farm-out/ep3-sapfld6-wNN-0821/, and w01/w02/w03 are copied onto main.

round_6_the_rule_under_test: >-
  A LIGHTING WORD THAT NAMES A SEASON, A TEMPERATURE OR A TIME OF YEAR CARRIES
  ITS OWN GROUND MATERIAL INTO THE FRAME; A LIGHTING WORD THAT NAMES ONLY A
  STATE OF THE SKY DOES NOT. Round 5 filed "a lighting word on this checkpoint
  carries a whole scene", which is true and not actionable. The ground clause
  was frozen at `in a green meadow, distant hills` -- round 2's depth lever,
  and the one phrasing that names no material -- and the lighting clause was
  the single variable.

round_6_verdict_on_the_hypothesis: >-
  HALF TRUE, AND THE HALF THAT IS FALSE IS THE MORE USEFUL HALF. The
  season/sky split is NOT the axis. WARM/COLD IS.
  ON THE WARM SIDE THE RULE HELD, CLEANLY. w02 deleted `golden hour` and `long
  shadows` from v04 and kept the photons (`low sun behind thin cloud, warm
  diffuse glow`). v04 returned magnified tan grass with no plane; w02 returned
  a green rolling downland with 146k-167k green-dominant pixels in its lower
  half and a real receding plane. The season word WAS the carrier of the dry
  grass, and warm low light on its own does not bring it.
  ON THE COLD SIDE THE RULE FAILED, AND PRE-REGISTERED FAILURE ONE IS WHY IT
  WAS WRITTEN DOWN FIRST. w04 deleted `winter` and `snow peaks` from v10 and
  kept `cold clear air, pale blue light, long shadows`. It came back a
  SNOWFIELD anyway, over the same `green meadow` clause. Nothing in that prompt
  names a season, a month or a frozen material. So on the cold side the season
  word was a PASSENGER and the carrier is the light temperature itself.
  ON THE DIM SIDE IT FAILED TOO, ONE ROUND LATER THAN IT SHOULD HAVE. w01
  deleted `deep blue twilight sky` from v01 and asked for a grey key instead
  (`overcast at dusk, the last grey light, no sun`). v01 sampled ONE
  green-dominant pixel; w01 SAMPLES ZERO, in the region and in the whole lower
  half, and beat16_sapling_composite refuses it with its own reason. The word
  `blue` was not what made v01 blue. DUSK IS NOW CLOSED FOR THIS INSTRUMENT --
  two rounds, two wordings, two refusals at the same tool -- and the dark end
  of the dataset is night and storm, exactly as pre-registered failure two
  said it would be.
  THE ACTIONABLE FORM, WHICH IS WHAT THE ROUND WAS FOR: on this checkpoint a
  lighting clause predicts the GROUND MATERIAL by its colour temperature and
  its level, not by whether it names a season. WARM keeps green (w02, v03's
  shaft, v12's breaking cloud). COOL-AND-BRIGHT brings frozen ground whatever
  else the words say (w04, v10, v14). DIM-AND-GREY desaturates the ground until
  there is no green left to sample (w01, v01). Cool-and-DARK is the exception
  that pays: moonlight (v02, w03) is the greenest thing this instrument draws.

