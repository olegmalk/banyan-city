    verdict: PASS
    note: banks are the rootable strip; water holds the centre; treeline horizon.
  - id: ep3-sapfld2-r08-0821
    scene: on a dirt path, green field, late afternoon, warm light
    verdict: PASS with a caveat
    note: >-
      best ground plane in the batch (path plus grass verges, lower centre) but
