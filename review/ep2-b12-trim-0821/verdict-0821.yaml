the_sweep_that_found_beat_21: >-
  All 21 clips in review/ep2-ship-0821/sources measured at f000/f002/f004/f006/
  f008/f012/f024 with luma_drift. EXACTLY TWO carry the opening transient, and
  they are the two goblin-free sapling beats: b12 (125.53 -> 178 by f012) and
  b21 (125.42 -> 154 by f008). Both open on the SAME f000 value within 0.11
  levels, which is the shared plate they were conditioned on. Beat 08 has a
  one-frame f000 outlier (176.53 -> 141.49 at f002) that settles in a single
  frame and is a different thing; every other beat is flat from f000. So this
  is a two-clip defect with a named cause, not a recipe-wide one.

what_the_eye_adds_that_the_numbers_missed: >-
  CONTACT-b12-trim-0821.png. The first frames are not "warm" -- they are a
  DIFFERENT PICTURE. b12 f000 is a tight macro of four or five large pointed
  leaves against a sunset; f006 onward is a wide two-leaf seedling in a cloudy
  blue sky. The pointed leaves violate canon.yaml sapling-cotyledon-shape,
  which rules out "any leaf drawn as a feature -- no lance shapes, no
  exaggerated silhouette". So the clip that has ridden five cuts OPENS ON A
  CANON VIOLATION, and the trim removes it. That is the strongest argument for
  the edit and no instrument was going to produce it.

the_fault_the_trim_does_NOT_fix_named_honestly: >-
  BEAT 12'S SAPLING GROWS ACROSS THE SHOT. Over the 108 trimmed frames the
  plant's apex rises from y=346 to y=206 -- 140 px, 11% of frame height,
  monotone -- on a beat whose approved line is "perfectly still" and a canon
  (sapling-height) that pins 002b at ~40 cm. The trim does not touch this and
  does not claim to. It is strictly better than the incumbent on two faults
  (the canon-violating opening shot, the measured colour/luma transient) and no
  worse on the third, so beat 12 stays `best-available` -- the STATUS does not
  move, the FILE does. Same pattern as amended_0820's beat_03.
  BEAT 21 CARRIES A BIGGER ONE AND IT IS NOT SEED-CLASS: its plant is a single
  tall LANCE-shaped leaf on a curved stem, not two average cotyledons. That
  fails sapling-two-leaves and sapling-cotyledon-shape both, and it is the same
  wrong-plant fault done-definitions already names for beats 16 and 20. The
  sapling wording ladder is CLOSED (work-ladder-0819.md: "three rungs on one
  question"), so the route is the composite instrument, not a re-roll. NO BATCH
  IS FILED FOR BEAT 21 -- it is instrument-gated, which is a skip by the rules,
  not an oversight. The trim is taken anyway because it is free and strictly
  positive.

house_traps_checked:
  beat_12: >-
    Slot 4.68 s, trimmed clip 4.50 s. `fill` moves `once` -> `hold`, i.e. a
    0.18 s freeze on the last frame. The palindrome branch has been OPT-IN
    (`wants_pingpong`) since the 0819c audit, so no reversal fires. On a beat
    directed "perfectly still" a 0.18 s freeze is invisible. VO is 2.68 s, well
    inside the clip.
  beat_21: >-
    Slot 5.0 s, trimmed clip 4.708 s, 0.29 s freeze, no VO on this beat at all
    (audio: none). The beat's own direction is "tilts... AND HOLDS", so a freeze
    on the final frame is the stage direction, not a defect.
  encode: >-
    Both trims re-encoded libx264 crf 10 from a crf-33 source, so the trim adds
    no visible loss of its own. Nothing was re-sampled.

status: >-
  CANDIDATES, NOT SWAPS. Neither file has been put into review/ep2-ship-0821/
  sources and the cut has not been re-assembled -- that belongs to the next
  assembly and other lanes are live in this tree. Recorded here and in
  cut-readiness so a finished rung is not lost, which is the failure
  amended_0820c was opened to fix.
  STEWARD PICK under the 2026-08-18 widening, VETO-ABLE IN ONE LINE.

what_this_licenses: >-
  Two file swaps at the next assembly. No plate change, no prompt change, no
  re-roll, no negative change, no canon edit, and no change to either beat's
  status. It does not license trimming anything else: the sweep says exactly
  two clips have this defect and both are named above.
