date: '2026-08-21'
by: sapling/ship-fault lane
cost_usd: 0.0
gpu_seconds: 0

headline: >-
  BEAT 12'S SHIPPED FAULT IS NOT A COLOUR SHIFT AND IT IS NOT SEED-CLASS. Frames
  000-012 of the clip in the ship cut are A DIFFERENT SHOT -- a tight warm
  sunset macro of four or five large POINTED leaves -- which cuts to the wide
  cool two-leaf seedling the beat actually is. It has been named as "a
  warm-to-cool first-second colour shift" through five cuts because it was only
  ever measured and never looked at. BEAT 21 HAS THE SAME DEFECT, from the same
  shared opening frame. Both are removable by EDIT, $0, no GPU, no re-roll.

no_seed_batch_was_filed_and_that_is_the_finding: >-
  The unit was briefed as "one seed batch (4-5) from b12's proven recipe,
  bars = its clauses + luma-collapse-absent". THE SEED AXIS IS ALREADY SPENT AND
  A SEVENTH TAKE WOULD BE THE FAILURE episode-loop-v2 RULE 3 NAMES BY NAME
  ("if two batch rounds fail the same way -> the BEAT is wrong for the engine:
  restage, don't grind the axis"). Six takes exist on the crf-10 stillmotion
  recipe and every one is judged:
    ep2-b12-stillmotion-0819          seed 20260819  FAIL  dusk collapse -91.1, plus a bird
    ep2-b12-stillmotion-s20260871     seed 20260871  PASS-HOLD on luma, drift -0.04
    ep2-b12-stillmotion-s20260818     seed 20260818  FAIL  luma passes; tilts down 387px
    ep2-b12-stillmotion-s20260872     seed 20260872  FAIL  luma passes; a crouching form grows in, -180px drift
    ep2-b12-stillmotion-s20260873     seed 20260873  FAIL  -43.48; the sky is replaced by a wall of dry reeds
    ep2-b12-shortstill-0819           73 frames      FAIL  a black leaf mass grows over 15% of the frame
  s20260871 ALREADY PROVED the collapse re-rollable -- "the plate and the prompt
  are exonerated, the collapse is a (seed x plate) INTERACTION" -- and a clean
  seed still did not produce a cuttable clip, because every take fails on a
  DIFFERENT uninvited object. The frame-count lever is spent too, and its own
  verdict says why: "frame count is an input to the denoiser's temporal grid,
  not a crop of a longer render... 'stop before the collapse' is not a move that
  exists." The record's own named next lever is the POSITIVE prompt, untried,
  and it is not this unit's.

the_premise_that_was_wrong: >-
  The named seed x plate luma-collapse belongs to b12's crf-10 REPLACEMENT
  candidates, not to the clip in the ship cut. The shipped take is the crf-33
  one and its measured motion is a BLOOM (+60.44 luma), the mirror image. A
  batch filed on "luma-collapse-absent" would have been scoring the wrong clip.

goblin_audit_verified_before_any_work: >-
  BEAT 12 IS GOBLIN-FREE BY THE SCRIPT ITSELF. node.md, RELATED 0:55-1:00:
  "Tight on the sapling's two leaves, perfectly still -- the scavenger is still
  crouched in the grass behind them, OUT OF FRAME." Beat 21 likewise: "The
  sapling's leaf, in absolutely still air, tilts... and holds." Neither renders
  the scavenger and nothing here does either -- both artifacts are EDITS of
  files that already exist, so no sampler ran.

