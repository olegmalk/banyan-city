why_trimmed: >-
  THE FACE STOPS BEING DRAWN AT f106. From frame 106 to frame 120 the head keeps
  its silhouette and its green, and the slit eyes, brow bar and mouth line are
  simply absent — a featureless ovoid. It is the failure mode six of this wave's
  fourteen clips share. Frames 000-096 are clean: the sprint, the push off and
  the dive into the grass all complete inside them, and the face is intact
  through f101.
  THE TRIM IS NOT WHAT KEEPS THE EGG OFF SCREEN — the slot would have.
  Beat 02 is silent, so fit_duration gives it min(clip, script_s) and the
  outgoing 4.042 s take was already slotted at 4.04 s. What the trim removes is
  the DEPENDENCE on that: an untrimmed 5.042 s clip would slot at min(5.042,
  script_s), and if the script's paper timing for beat 02 is longer than 4.04 s
  the dissolved frames would play. Cutting at 97 makes the window a property of
  the file instead of a property of a number in another document.
