    pair-THISTLE.png: 216ba2ddc057fb4dffe3b07299f251a9cb81c9b616e99c0ff2f1f95a9c0ad332
    pair-HOLLOW.png: 9852ca484d8df9d6f136d9769cf9857366ff6d740f641ea7cd55c469a674c3be
    pair-PEWTER.png: 5ded6f9ba69d74cbf98c80d9707c571ad73d60006ab393f285258d17d3c91726
  not_committed_as_files: >-
