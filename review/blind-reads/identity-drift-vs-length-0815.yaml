recovery:
  recovered_by: record-keeping lane, 2026-08-15
  from: >-
    Working files survived at
    <session-scratchpad>/driftinit/ (readerdir/pair-*.png, frames/, mapping.json,
    build.py). The verbatim verdict was recovered first-hand from the blind reader's
    own transcript, not from a summary of it.
  what_was_checked_rather_than_taken_on_trust:
    - The shared init is one git blob across all three job dirs.
    - The three meta.yaml files differ only in `seconds:`.
    - The scratchpad copies of the three clips hash equal to the git blobs.
    - The final frames re-extract byte-identically from the git blobs.
    - The graded frames and all three reader sheets rebuild byte-identically.
    - The Lab deltas printed by a fresh build.py run match mapping.json exactly.
  nothing_was_marked_unverifiable: true
