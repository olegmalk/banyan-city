arms:
  set_one_sparse:
    what: >-
      One sheet, 16 frames evenly spread over the 97, in a 4x4 grid, each cell
      labelled "frame 1".."frame 16".
    source_frame_indices: [0, 6, 13, 19, 26, 32, 38, 45, 51, 58, 64, 70, 77, 83, 90, 96]
    built_by: review/blind-reads/build_sparse_sheet_16.py
    sha256: {sheet.png: 79f31d76b6308091c3c43d335aee54f4d3ce725efede9c6caef277a4a42f46a9}
    note: >-
      This is a faithful replication of the RETIRED method — the instrument that
      produced the earlier verdicts, rebuilt so it could be put on trial.
  set_two_dense:
    what: >-
      One whole-clip overview (16 tiles evenly spread, labelled with true source
      frame indices 000-096) PLUS four strips of every consecutive frame across the
      motion window and its padding — 022-041, 042-061, 062-081, 082-086.
    built_by: pipeline/coldread_frames.py
    sha256:
      overview.png: 33e269567092ae4238f69aa877dab6d4e658dea6f0090994bae27cd16ec297e9
      strip-01.png: e0075f28fb870b8c3af2548973bfc3a88d7cc90e3374c888f9c7f987c141babc
      strip-02.png: cf0a6bf21b3c4f5c09da0a2389d9fcd3bc9e91e8105bfbe223b87b06e09c40e8
      strip-03.png: c648f15675ba4ff59744cf6bd6530a5e0dc4ff62c5b925e18dce0fcefe49fa91
