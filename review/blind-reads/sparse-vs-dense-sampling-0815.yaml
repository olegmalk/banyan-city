# Blind read: does HOW we sample frames change what a reader says the clip does?
# Recovered into the repo 2026-08-15 by the record-keeping lane. The read ran
# earlier the same night and wrote nothing to the repo.
#
# THIS IS THE MOST CONSEQUENTIAL OF THE NIGHT'S FINDINGS. It does not report on a
# clip; it reports on our INSTRUMENT, and it invalidates a whole class of earlier
# verdicts. Read `standing_consequence` before citing any older motion verdict.

id: sparse-vs-dense-sampling-0815
date: '2026-08-15'
kind: blind_read
question: >-
  Shown the SAME clip twice — once as an evenly-spread 16-frame contact sheet, once
  as consecutive frames — does a blind reader give the same answer to "is the
  movement continuous, or does it step?"

answer: >-
  NO. The same clip read as STEPPING from the sparse sheet and as CONTINUOUS from
  the consecutive frames. The reader, unprompted and in its own words: "If I had
  only been given set one, I would have wrongly reported a broken or dropped-frame
  clip." The stepping is an artifact of the sampling, not a property of the video.

# ---------------------------------------------------------------------------
design: >-
  One cold reader, no project context, given two directories and told explicitly
  that the sets "may be from the same video or from different videos — you are not
  being told which, and you must not assume either way." It answered the same six
  questions for each set independently, and only compared them at the end. It was
  not told what the experiment was testing. It worked out on its own that the two
  sets were the same video, and said how it knew: frame-by-frame landmark matches
  between the sparse cells and the overview tiles ("frame 1 has the identical
  top-of-frame white flare as tile 000, frames 5 and 6 match tiles 032 and 038,
  frame 8 matches 045").
why_this_design_is_sound: >-
  The two arms differ ONLY in sampling — same clip, same source frames underneath,
  same reader, same questions, same session. Set two is a strict superset of set
  one's information: it contains that same sparse spread as its overview sheet PLUS
  four strips of consecutive frames. So the reversal cannot be attributed to the
  clip, the reader, or the question. There is only one variable left.

# ---------------------------------------------------------------------------
input_clip:
  branch: origin/farm-results-rtx5090
  path: farm-out/ep2-b02-nw-0815/02-the-sprint-LTX-nw.mp4
  sha256: 44001de1f567b736453fc218c7b148c083e3fd71dcc97dee188f93daec9511b6
  frames: 97
  verified: >-
    The scratchpad copy the sheets were built from hashes equal to the git blob, and
