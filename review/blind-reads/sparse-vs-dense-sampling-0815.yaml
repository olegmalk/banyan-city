# ---------------------------------------------------------------------------
result:
  set_one_verdict: STEPPING
  set_two_verdict: CONTINUOUS
  verbatim_verdict: review/blind-reads/sparse-vs-dense-sampling-0815.verdict.md
  the_decisive_line: >-
    "SET ONE reads as STEPPING; SET TWO reads as CONTINUOUS. ... The stepping I saw
    in set one is an artifact of how thinly it was sampled, not something in the
    movement. If I had only been given set one, I would have wrongly reported a
    broken or dropped-frame clip."
  set_one_named_a_specific_false_cut: >-
    "Frames 7 -> 8 is the big one" — described as a figure standing upright becoming
    a figure bent double "at a different scale and camera pitch", with "a large
    amount of movement missing between them". Those are source frames 38 and 45. The
    intervening frames 039-044 exist and, shown consecutively, are smooth: "the hands
    open and lower in even increments, the head tips a few degrees per frame."
  set_two_found_the_opposite_defect: >-
    "The only thing that could be mistaken for a defect is the opposite problem —
    long stretches where consecutive frames are indistinguishable." Sparse sampling
    hid the real fault (dead air) while inventing a fake one (stepping).
  what_survives_both_sets: >-
    The composition complaint is NOT a sampling artifact and stands: the clip loses
    the character's face partway through (legible to ~frame 051, gone from 057) and
    then holds on an unreadable shape — "a large beige dome with two shoe soles above
    it and two disembodied hands below it" — for its entire final quarter.

# ---------------------------------------------------------------------------
standing_consequence:
  rule: >-
    ANY VERDICT OF THE FORM "the motion steps / stutters / lurches / jumps / drops
    frames" THAT WAS REACHED FROM AN EVENLY-SPREAD CONTACT SHEET IS NOT EVIDENCE.
    It must be re-read on consecutive frames before it is acted on. A sheet sampling
    every 6th frame cannot distinguish a genuine jump-cut from a fast move.
  already_claimed_one_verdict: >-
    The "three-frame lurch" verdict on this same clip fell the same night. The old
    verdict was "the fold happens in about three frames while the camera swings
    simultaneously, so it reads as a lurch or a stumble." Measured, the fold occupies
    pairs 25->82 — 57 pairs, 2.4 seconds — with a smooth ease-in/ease-out envelope,
    and no step between any adjacent pair anywhere. The old set's finest resolution
    was 7 frames: it could not have SEEN a three-frame event, it INFERRED one. That
    leg of the staging diagnosis is struck. NOTE the honest caveat the lane that
    struck it recorded about itself: no blind reader was available at that moment, so
    the consecutive-frame half of that particular re-read was its own SIGHTED read.
    The measurement half stands on its own, and the blind A/B recorded here — which
    did have a reader — reaches the same conclusion independently.
  do_not_over_read: >-
    This finding is about the INSTRUMENT, and it is n=1 on one clip. It does not say
    every past stepping verdict was wrong; it says none of them was ever supported by
    the evidence shown, so each needs re-reading rather than reversing. The safe
    inference is "unsupported", not "false".

# ---------------------------------------------------------------------------
motion_timing_quantification:
  measured_on: the same 97-frame control clip, from the consecutive strips
  finding:
    head_still_frames: ~38     # frames 000-037, standing, no body movement
    movement_frames: 22-24     # frames 038-061, "roughly 22-24 frames: 038 through 061"
    tail_hold_frames: ~35      # frames 062-096, held pose, "the figure itself does not move"
  arithmetic_check: 38 + 24 + 35 = 97, which is the clip length. Consistent.
  reader_words: >-
    "about 38 frames of standing still at the head and about 35 frames of held pose
    at the tail" — the action "fills roughly a quarter of the running time and the
    rest is two static bookends."
  THIS_DOES_NOT_GENERALISE: >-
    RECORD THE NARROWING WITH THE FINDING, ALWAYS. `trim_pass_0815` (in
    review/ep2-picks/done-definitions.yaml) established that this measurement is a
    property of the 97-frame recipe and DOES NOT TRANSFER to the recorded picks: all
    five picks are 121 frames at 24fps from the older 0813/0814 recipe, NONE has a
    frozen head, the motion window opens at pair 1 in every one of the five, and head
    trim available across all five picks is ZERO frames. Only tails had anything to
    give. So "clips have ~38 dead frames at the head" is FALSE as a general statement
    about our output; it is true of one clip on one recipe.
  related_caveat: >-
    See also coldread_period_caveat_0815 in done-definitions.yaml: the tool's
    parity-collapse is width-2, calibrated to this 97-frame recipe, and the 121-frame
    picks stutter with period 3, so its windows must not be trusted across recipes
    without checking the cadence period first.

