what_the_ledger_says: >-
  THE HONEST PICTURE, from review/ep2-picks/cut-readiness-0819.yaml. FOUR beats
  have a written PASS against a bar pre-registered before the pixels existed: 1,
  7, 17 and 18. THIRTEEN are best-available. Of those thirteen, EIGHT — beats 3,
  4, 5, 6, 10, 13, 16 and 21 — have no verdict block of any kind and have ridden
  five consecutive cuts unchanged. They are not suspected of being bad; they have
  never been judged, and five appearances in a cut is not five passes. The slates
  are the loud, tracked problem; the quiet middle is where the unknown actually
  lives. Named here rather than fixed, because judging eight beats is its own
  unit with its own bars, and inventing bars for footage that already exists is
  how a bar gets bent to fit the clip.

