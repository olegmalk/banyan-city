# Per-beat source manifest for review/ep2-demo-0819c/ep2-demo-0819c.mp4
#
# ONE ROW PER BEAT: which take is in the cut, and WHY it is the one in the cut.
# `why` is exactly one of:
#   new              — footage that was not in the 2026-08-19b cut
#   carry-forward    — the 0819b pick, kept because nothing newer earned the slot
#   slate            — no footage that a verdict lets into a cut
#
# THIS CUT IS 0819b WITH EXACTLY TWO BEATS CHANGED. Same node, same render_t3
# bench invocation, same VO byte for byte (verified, not asserted: all 18 mp3
# and all 18 json sidecars were hashed against 0819b's and all 36 match), the
# same sixteen other source files at the same sixteen hashes. One beat gains
# footage, one beat loses it:
#
#   beat 19  ep2-b19-dropcomp-0819    A SLATE BECOMES FOOTAGE. The fall exists.
#                                     8 of 8 pre-registered clauses plus B5b,
#                                     $0, no model loaded. Best-available on a
#                                     steward ruling, NOT a pick. Its third
#                                     done_when clause is missing and is named
#                                     verbatim in its row and on the page.
#   beat 16  ep2-b16-anim-0814        FOOTAGE BECOMES A SLATE. The founder ruled
#                                     this leaf not shippable on 2026-08-16 and
#                                     it has ridden FOUR cuts assembled after he
#                                     ruled. This assembly stops that. One line
#                                     reverses it; see `the_one_judgement_this_assembly_took`.
#
# WHY THE RUNTIME DID NOT MOVE, because a reader will reasonably expect it to.
# Both changed beats sit in VO-driven slots, and render_t3 fits a slot to the
# longer of the script length and the VO length. Beat 16's card runs 8.62s
# because its LINE runs 8.2s — exactly the span its clip occupied. Beat 19 is
# 120 frames at 24fps = 5.0000s against a 5.000s slot. So 0819c is 113.29s, the
# same 113.29s as 0819b, with one more beat of real footage in it and one fewer
# beat of rejected footage. Nothing was stretched, looped or reversed.
#
# NOTHING HERE IS PROMOTED, APPROVED OR CANON. Bench assembly (--out): no leaf,
# not in lineage.yaml, no plate_ack, no pick written by this file.

