  why_it_is_the_cheapest: >-
    ONE description would govern beats 03, 12, 13, 15, 16, 19, 20 and 21 — eight
    of twenty-one. Every one of the failures above is the plant being improvised
    per beat instead of described once. It is R4 (defining the plant is the
    author's), it needs no GPU, and both_legs_rejected_0816 already filed the
    question: "whether a canonical sapling description exists at all is the open
    question filed with this ruling; if it does not, defining the plant is the
    founder's (R4) and gets its own card."
  filed_not_fixed: >-
    Named here and on the page. This assembly does not write the card, does not
    define the plant and queues no render against it.

