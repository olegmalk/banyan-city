the_palindrome_audit:
  what_was_checked: >-
    EVERY CLIP IN THIS CUT AGAINST ITS OWN SLOT, which the brief for this
    assembly required and which no previous cut's manifest has recorded. The rule
    lives at pipeline/render_t3.py:616 — when a beat's slot outruns its clip by
    more than 0.05s, the tool plays the clip forward and then REVERSED, and loops
    that palindrome to fill the slot. It prints nothing when it does this. The
    held-still branch above it stretches instead of reversing, and it did not
    fire on any beat here.
  why_the_mechanism_exists_and_is_not_a_bug: >-
    Founder-verified in loop cycle 005: a plain loop restarts as a hard jump-cut
    mid-shot, and a palindrome makes every seam motion-continuous. It is the
    better of two bad options when the voice outruns the footage. Named here
    because "not a bug" is not the same as "invisible".
  it_fires_on_8_of_the_18_footage_beats: [1, 3, 4, 6, 10, 11, 17, 18]
  measured_margins_slot_minus_clip_seconds:
    1: +4.418
    3: +0.338
    4: +2.128
    6: +4.793
    10: +0.128
    11: +0.538
    17: +0.668
    18: +5.918
  the_two_where_it_is_actually_VISIBLE_and_both_were_opened_and_looked_at: >-
    BEAT 06 IS THE WORST AND IT READS AS A CONTINUITY ERROR. A 1.917s clip in a
    6.71s slot, so the material runs three and a half times. Frames pulled from
    this cut at 29.2s through 35.2s: the board is edge-on and low, he turns it up
    with its written face to the lens, he holds it and reads — and then it goes
    back DOWN, edge-on, and comes UP again. He turns the bark board over,
    un-turns it, and turns it over a second time. The beat's verdict praises that
    action as genuinely performed; the cut shows it performed, rewound and
    performed again.
    BEAT 01 IS SUBTLER AND STILL THERE. A 5.042s clip in a 9.46s slot. Its
    verdict passes G1 on "growth monotone over 85 frames, 0 shrinks" — true of
    the FILE. In the cut the second half runs backwards, so across 0.3s to 9.2s
    the fig goes green, ripens to purple, and un-ripens to green again. The PASS
    is about the source; this is about the cut, and the two are different claims.
  what_is_NOT_wrong_with_it: >-
    Beats 3, 4, 10, 17 have margins between 0.13s and 0.67s — a fraction of a
    second of reversal at the tail, below the threshold of anything a viewer
    would name. Beat 4's eyes never move anyway. Beat 18 is a fine tremble, and a
    tremble reversed is still a tremble. Beat 11's 0.54s is inside its own
    identity-collapse fault and is the smaller problem there.
  the_real_cause_and_it_is_not_the_tool: >-
    THE VOICE IS LONGER THAN THE FOOTAGE. Slots are voice-led by design
    (fit_duration, loop cycle 004 — playing full clips over short dialogue left
    multi-second dead-air tails and drew a founder wince). Every margin above is
    a beat where Chatterbox says more than 4-5s while LTX produced 4-5s of
    picture. The fix is longer footage or shorter lines, per beat, and it is not
    a render this assembly can queue or a constant it should change an hour
    before a screening.
  beat_19_is_the_one_place_this_mattered_tonight: >-
    Reversed, beat 19 shows a fig flying back UP onto a stem — the palindrome
    would have destroyed the only thing the clip is for. It is 120 frames / 24 =
    5.0000s against a 5.000s slot, margin 0.0000s, so the branch cannot be
    reached, and the frame count is a module constant in the tool with that
    reasoning written beside it. The earlier i2v take cleared the same branch on
    0.09s of luck. This is the clearest case in the episode for sizing footage to
    its slot on purpose.

