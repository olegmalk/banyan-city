  what_moved_since_0819b: >-
    THE UNSCORED MIDDLE WENT FROM EIGHT BEATS TO FOUR, and that is the largest
    honest change in this cut — larger than either clip swap. 0819b's own page
    said "eight of those thirteen — beats 3, 4, 5, 6, 10, 13, 16 and 21 — have
    no verdict block of any kind, and have ridden five consecutive cuts
    unchanged." The judging sweep answered all eight tonight. Seven of them now
    carry a written verdict against a bar quoted from the beat's own
    `done_when`; the eighth is beat 16, whose verdict is the reason it is a
    slate in this cut. Written PASSes went from four to six.
  what_the_sweep_actually_found: >-
    NOT REASSURANCE. Of the eight, ONE passed (beat 21, all four clauses, the
    tilt measured and monotone). One came close and missed on a measurement
    (beat 06, three of four, the board is the wrong size). FIVE FAILED on the
    clause that is the beat — beat 03's trunk does not exist until f015, beat
    04's eyes never move in the one beat where only the eyes carry it, beat 05
    fails four of seven, beat 10 shows the blank board to the camera instead of
    to the partner, beat 13 grows a mature forked tree where the founder ruled
    the sapling is tiny. And beat 16 was already ruled out. So the quiet middle
    was NOT quietly fine, and five appearances in a cut was not five passes.
    Every one of those five is still in this cut, because best-available with
    the fault named is what a bench cut is for — but nobody should now read
    their presence as anybody's approval.

the_receipts_and_why_five_beats_still_read_no_verdict_block:
  what_happened: >-
    THE FIRST DRAFT OF THIS FILE PUT THE SPEC PATH IN `verdict_at:` AND THE PROSE
    IN `verdict:`, AND pipeline/proof_receipts.py THEREFORE RESOLVED NOTHING —
    all 21 beats printed `no-verdict-block`. That is the wrong way round. The
    contract, documented in proof_receipts.spec_path, is that a picks row's
    `verdict:` field carries the `pipeline/jobs/*.yaml` citation and the tool
    reads the verdict text OUT OF THE SPEC ITSELF, discarding whatever prose the
    row wrapped it in — "because a paraphrase written by the lane that wanted the
    take in the cut is exactly the claim a reader has no way to check." Fixed:
    `verdict:` is now the citation and this lane's summary moved to
    `verdict_quoted:`, which nothing machine-readable consumes. Thirteen beats
    now resolve a verdict read from the spec.
  the_five_that_do_not_resolve_and_the_reason_for_each:
    2: no spec verdict block exists. Genuinely never judged.
    8: no spec verdict block exists. Genuinely never judged.
    12: >-
      its warrant is a RECORD (done-definitions beats.'12'), not a job spec, so
      there is no pipeline/jobs path to cite and the receipt correctly declines
      to invent one.
    14: >-
      the spec cited is real but carries no `verdict*:` key, so the tool reports
      no block rather than paraphrasing the FAIL from elsewhere. Left as the
      tool found it.
    19: >-
      ITS BAR IS REAL AND IS NOT IN pipeline/jobs. The eight pre-registered
      clauses live in farm-out/ep2-b19-dropcomp-0819/19-the-drop-dropcomp-0819.yaml
      (`bar_pre_registered_before_building`, `score`, `measured`), because the
      clip was built by a tool on the Mac rather than queued as a box job. So the
      receipt says `no-verdict-block` for the one beat in this cut with the
      cleanest bar in it. That is a gap in where receipts look, not a gap in the
      evidence, and it is named here rather than papered over by filing a
      decorative job spec.
  receipts_state: 18 frames written, sha recheck 18 of 18 match, 0 differs, 0 missing.

the_one_judgement_this_assembly_took:
  what: >-
    BEAT 16 IS A SLATE IN THIS CUT AND IT WAS FOOTAGE IN THE LAST FOUR. That is
    the only decision on this page that is not another lane's written verdict
    carried forward, and it is flagged this loudly so it can be reversed in one
    line.
  the_founder_ruling_verbatim: >-
    2026-08-16, R4, shown the two legs on /review/ep2-picks/sheets/b16-leg-b-0815.jpg:
    "the difference between leg b and a is just how this big leaf looks, both of
    them are wrong though and do not resemble the sapling." The record's
    consequence, in its own capitals at done-definitions.yaml
    beats.16.both_legs_rejected_0816: "IT IS NOT SHIPPABLE AND NEITHER LEG SHIPS."
  why_this_is_applying_his_ruling_and_not_making_one: >-
    The steward does not score taste and did not score this. The founder already
    scored it, in writing, three days ago. What had not happened was anybody
    acting on it: the file is LEG A (proved by its own provenance sidecar, which
    says `used as-is; leg A` in as many words), and it shipped in 0817, 0818,
    0819 and 0819b — four cuts assembled AFTER the ruling. The judging lane put
    the choice exactly here and declined to take it: "THE DECISION IS AN
    ASSEMBLY'S AND IT IS ONE LINE EITHER WAY: slate beat 16 and lose a picture
    that a viewer would otherwise accept, or keep it and record explicitly that
    the episode ships a leaf the author rejected." This assembly took the first,
    because showing him a fifth time an object he has already called wrong is
    not what a screening is for.
  what_it_costs: >-
    A picture, for 8.62s, replaced by a card carrying the beat's line. It costs
    NO runtime (the slot is VO-driven either way) and it costs no other beat.
  what_it_does_not_claim: >-
    Not that the shot is badly made. Beat 16's three `done_when` clauses are MET
    — close on one leaf, the scavenger blurred behind it, the leaf as subject —
    and the record has said "round_1_result: WORKS" since 2026-08-14. A
    definition that says "make the leaf the subject" is fully satisfied by a
    shot that makes the WRONG leaf the subject. That is why a taste ruling
    outranks a clean clause list here.
  two_faults_the_verdict_found_that_no_record_had: >-
    Worth knowing before overriding. (1) A DISSOLVE-THROUGH-WHITE at the head:
    f001-f002 the whole frame blows out toward white, he dissolves into it, and
    the leaf grows out of the blank — the identical defect that blocked beat 06
    through two rounds, five frames here instead of forty, which is presumably
    why five cuts passed over it. (2) SIXTY-FIVE PERCENT OF THE CLIP IS ONE
    PICTURE: exact_freeze_index reports terminal_freeze_index=34,
    terminal_freeze_len=63, frames 34-96 identical at ncc 1.0000, 72 of 96
    adjacent pairs identical. The spec asked for a slow rotation on the stem.
    There is no rotation.
  how_to_reverse_it_in_one_line: >-
    `cp review/ep2-demo-0819b/sources/16-why-b16-anim-0814.mp4* review/ep2-demo-0819c/sources/`
    then re-run the same render_t3 command in the footer. The clip was never
    deleted; it is still on disk in 0819b's sources at sha
    dcdfd26e483cb82c1f8ad92c3035da478a9bbe4a93cb907e24b6599f77192303.
  what_is_NOT_asserted_by_this: >-
    No beat-16 render is queued and none should be — both_legs_rejected_0816
    forbids it in capitals ("DO NOT RE-RENDER BEAT 16 OFF EITHER LEG'S WORDING.
    The plant description itself is what failed"). The real blocker is named
    below in `the_cheapest_unblocking_item`.

