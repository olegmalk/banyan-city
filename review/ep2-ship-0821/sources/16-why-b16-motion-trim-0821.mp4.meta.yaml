# --- the trim, and why it is a trim and not a re-render.
trim: |
  THREE FRAMES OFF THE HEAD, with ffmpeg, on the rendered mp4:
    ffmpeg -i <src> -vf "select='gte(n\,3)',setpts=N/FRAME_RATE/TB" ...
  `--frames` is a RENDER parameter, not a trim -- it would have produced a
  different clip, not this one shortened. 121 -> 118 frames, 5.042 -> 4.917 s.
why_three_frames: |
  The i2v re-reads the composited plant ONCE and then defends it. Leaf-pair
  span, measured per frame: f001 533 px, f002 533, f003 533, f004 638, and
  639 +/- 1 for every frame after. The pop is three frames wide. An earlier
  20-frame sample of the same clip reported it as "533 -> 639 by f021" and
  that was a coarse read of a fine event; the ladder entry was corrected.
  Trimming 3 frames removes it. Trimming 21 would have cost 0.875 s of his
  talking for nothing.
the_slot_arithmetic: |
  Beat 16's VO is 7.902 s, so the slot is voice-led and the clip undershoots it
  either way -- the trim does not change the beat's length by a single frame.
  render_t3.fit_duration PREDICTED 8.300 s (floor vdur+0.4 = 8.302, cap
  vdur+2.0 = 9.902) for both the 121-frame and the 118-frame clip; THE
  ASSEMBLER THEN MEASURED 8.62 s, and the measured number is the one that
  counts. Short footage is not looped: render_t3 plays it once and holds the
  last frame (tpad=stop_mode=clone). So the whole cost of the trim is 0.125 s
  more held frame -- 3.578 s of freeze becomes 3.703 s, 42% of the slot to 43%.
  Hold-fill covers it, which is what the trim was checked against before it
  was made.
