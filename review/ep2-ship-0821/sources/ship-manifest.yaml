what_changed_2026_08_21_the_age_b_wave:
  headline: "FIVE BEATS CHANGED FACE. Beats 02, 03, 04, 13 and 20 now carry the age-B expressive design;\
    \ beats 07 and 08 were tried and kept their old takes because both their seeds failed. Nothing else\
    \ in the cut moved — the other fourteen beats are the same files at the same shas, and render_t3 re-hashed\
    \ every one of them at assembly."
  why_it_happened_today: "On 2026-08-20 night the founder corrected his own 08-19 record: \"all of the\
    \ goblin clips today has had him as an adult. very bad character consistency\", and, shown beat 13's\
    \ best frame, \"this is one of the images where the goblin looks like an adult, which is wrong.\"\
    \ The word `adult` in canon was steward drift — he had pointed at a PICTURE (the B tile) and the steward\
    \ wrote down the SENTENCE beside it. pipeline/canon.yaml ep2-goblin-design-adult/correction_2026_08_20\
    \ strikes it and lists what is legibly in the tile instead. The age-B wave is the first set of clips\
    \ authored against that list."
  how_the_picks_were_made: "BY EYE, at a 12-frame contact strip per seed, against two questions: does\
    \ the face survive the slot render_t3.fit_duration will actually give this beat, and does the beat's\
    \ action read. No metric decided anything. Every clip was sha-verified against the box's own manifest\
    \ (28 of 28 files OK) before a frame was opened. Full ledger: review/motion-ageb-0821/JUDGING-0821.md."
  the_one_failure_mode: "THE FACE STOPS BEING DRAWN. Six of the fourteen clips lose their eyes, brow bar\
    \ and mouth line partway through, leaving a featureless green ovoid that keeps the head's silhouette\
    \ and colour. It never recovers and it always arrives in the second half. Beats 07 and 08 are kept\
    \ because of it (b08) or because the beat's action was absent (b07)."
  runtime: 115.61 s -> 115.88 s. Beat 20's slot grew 0.01 s and beat 13's 0.02 s on rounding; beat 02 is
    a 97-frame trim of a 121-frame clip and slots identically to the 97-frame take it replaces.
  the_cut_is_still_mixed_and_this_is_the_honest_number: "canon.yaml counts the goblin in TWELVE of the\
    \ twenty-one beats (2, 3, 4, 7, 8, 13, 14, 15, 16, 17, 19, 20). This wave covered seven of them and\
    \ five passed. So FIVE BEATS NOW SHARE ONE EXACT FACE, where before no two goblin beats matched, and\
    \ SEVEN STILL CARRY THE OLD ASSORTED ONES. More consistent, not consistent. Beats 07, 08, 14, 15, 16,\
    \ 17 and 19 are the remaining work and it is post-ship."
what_changed_from_ep2_demo_0820:
  two_beats: "BEAT 09 IS NO LONGER A SLATE, and BEAT 01 IS THE CHROMA COMPOSITE. Those are the only two\
    \ pictures that move. The other eighteen footage beats are the same file at the same sha as ep2-demo-0820\
    \ \u2014 verified, not asserted: every source mp4 was hashed against its row."
  beat_01_is_the_b01_lane_s_take_not_this_lane_s: "It landed at 19:0x on 08-20, INSIDE the upgrade window,\
    \ while this cut was being assembled \u2014 the lane repointed picks-0820.yaml at it and deleted the\
    \ take this cut had already copied. Taken on the ledger's own terms: 7 of 8 scored clauses pass, and\
    \ G5a \u2014 the fault beat 01 ships with either way \u2014 now fails on ONE band (grass floor 0.062\
    \ against a 0.20 bar) where the take it replaces fails the SAME clause on ALL THREE. Strictly better\
    \ on the named fault, $0, composited on a Mac with no sampler and no GPU."
  the_deletion_was_deliberate: "01-cold-open-COMP-chroma\u2026 sorts BEFORE 01-cold-open-LTX-fignonly\u2026\
    \ , so leaving both in the directory would have produced the right clip BY ACCIDENT \u2014 get_clip()\
    \ globs `NN-*.mp4` and takes the sorted first. The outgoing file was removed from this cut's sources\
    \ and from the index, so the swap is a swap and not a filename-ordering coin flip."
  one_card: "Beat 16's slate card now says what is actually true of beat 16 instead of \"[ footage pending\
    \ ]\". See `the_slate_card_is_retired` \u2014 the mechanism stays wired, this cut just has no slate\
    \ left to use it on."
  counts: 19 footage / 2 slates  ->  20 footage / 1 slate.
  runtime: 116.33 s, unchanged. Beat 09's slot was already 3.92 s of voice over a card; it is now 3.92
    s of picture under the same voice.
a_bug_this_assembly_found_and_fixed_because_it_was_in_the_cold_open:
  what_happened: THE FIRST ASSEMBLY WITH THE NEW BEAT 01 PLAYED THE COLD OPEN AT 0.53x SPEED, and render_t3
    printed "beat 01 held still 5.04s stretched to fill 9.47s" while doing it.
  the_cause: "render_t3.held_still() classified the clip by substring-matching `model: none` in its sidecar.\
    \ `model: none` means NO SAMPLER RAN \u2014 which is true of a composite and does not mean \"no video\"\
    . pipeline/fig_composite.py writes it honestly and produces 121 real frames at a real 24 fps. A held\
    \ still is a COMPUTED camera move with no true frame rate, which is why it is allowed to be stretched;\
    \ a composite is footage and must not be."
  the_fix: "A declared frame rate is the discriminator. hold_still writes `seconds:` and deliberately\
    \ no `fps:`; anything that states its own fps is footage and gets footage's treatment \u2014 play\
    \ once, hold the last frame. Committed to pipeline/render_t3.py with a test both ways (a hold_still-shaped\
    \ sidecar still reads held; a composite-shaped one no longer does)."
  IT_IS_NOT_ONLY_THIS_CUT: ep2-demo-0820 was re-assembled with the same clip before the fix existed, so
    the demo cut on disk has the stretched cold open too. Reported to the b01 lane rather than fixed inside
    their directory.
  the_gate_that_now_catches_it: "EVERY GATE PASSED THE HALF-SPEED CUT \u2014 the licence gate, the proof-receipt\
    \ sha recheck, qa_local's 83 routes and qa_episode's 15 checks. A clip at 0.53x hashes, serves, links\
    \ and measures exactly like one at full speed, and duration is the wrong instrument because a stretch\
    \ fills the SAME slot. What caught it was a person reading a log line. So render_t3 now RECORDS the\
    \ fill path per beat in the master's sidecar (`fill: slate|once|hold|stretch| pingpong`, with clip_s\
    \ and slot_s), and qa_episode asserts on it: a beat may only be stretched if its clip declares no\
    \ `fps:`. Proven to fail, not just to pass \u2014 poisoning beat 01's row to `stretch` makes qa_episode\
    \ exit 1 with \"beat 1 ... (5.04s stretched into 9.46s)\". qa_episode is 16 checks now."
  verified_after_the_fix: "Beat 01 plays its 5.04 s once and holds to 9.46 s. Measured on the SHIPPED\
    \ master: its last moving frame is at 3.79 s, inside its own clip \u2014 stretched, the motion would\
    \ have run past 7 s. Fill window 5.10-9.40 s: 0 moving pairs of 103, 42 bit-identical, max mean delta\
    \ 0.006. Looked at, not only measured \u2014 green nub at 0.2 s, still green at 2.5 s, full purple\
    \ fig at 4.9 s, held at 7.0 s. The master's own sidecar now grades all 21 beats: 14 once, 6 hold,\
    \ 1 slate, ZERO stretched."
ship_mode_rules_applied:
- BEST-AVAILABLE BEATS A SLATE. A beat with imperfect footage ships the footage and names the fault. Fourteen
  of the twenty footage beats carry a written FAIL or an unanswered clause and every one of them is in
  the table below with the fault quoted.
- "A TAKE WITHHELD ONLY ON AN UNANSWERED TASTE CARD ENTERS AS BEST-AVAILABLE, marked veto-able on watch.\
  \ TWO beats are in this class. Beat 09 \u2014 see `beat_09_ship_mode_entry`, still the one genuinely\
  \ contested decision in this cut. And BEAT 16, entered 2026-08-21 at 01:05 on footage that did not exist\
  \ when this file was first written; its row carries the full argument and its one-line veto."
- 'A TAKE WITHHELD ON A MECHANISM FAILURE STAYS OUT. Beats 01, 04, 08, 13 and 16 all had newer candidates
  land on 08-20 and every one of them was refused by its own verdict on a measured fault, not on a taste
  question. Nothing was promoted to fill a slot. STILL TRUE, AND BEAT 16 IS NO LONGER AN EXAMPLE: its
  08-20 refusal stands (the big-leaf composite failed FAIL-PASTE on measurement), and what entered on
  08-21 is a DIFFERENT artifact from a different route that passed its own bar 7/7.'
- A SLATE WITH NO LEGAL FOOTAGE SHIPS AS A DESIGNED CARD THAT SAYS WHAT THE BEAT IS. THIS RULE NO LONGER
  FIRES ANYWHERE IN THIS CUT. It applied to beat 16 and to nothing else, and it stopped applying at 01:05
  on 2026-08-21 when the restage produced legal footage. Kept because it was right while it held.
beat_09_ship_mode_entry:
  THE_CARD_THIS_ENTRY_WAITED_ON_IS_ANSWERED: '2026-08-20, founder, verbatim: "they should look like grown
    men. yes. dumb grown men." That is a PASS on the adult-guard read (and a yes to the plain green man,
    which is the other half of the same card). THIS BLOCK IS NO LONGER AN OVERRIDE. Everything below it
    is left standing unedited because the reasoning was written before the answer existed and the record
    should show what was overridden and why, not a tidied version where the question never happened. What
    changes is only this: beat 09 is an ORDINARY STEWARD PICK, veto-able in one line like every other
    pick in this cut. Recorded with its provenance on /review/ep2-guards-0818 and in review/inbox.yaml:
    the words were RELAYED by the orchestrating lane on 2026-08-21, not read out of a transcript held
    in this tree, and the beat-09 lane refused to write them into this manifest until they arrived verbatim
    with a date.'
  AND_THE_CLIP_ITSELF_HAS_BEEN_REPLACED: The take this block describes is no longer in the cut. It was
    swapped on 2026-08-21 for 09-the-pause-LTX-ep2-b09-r2s2-m1-0821.mp4, a different crop of the same
    plate whose hand survives the whole slot and whose glasses do not dissolve. See the beat-09 row in
    `beats:` for the take, the numbers, the four faults it ships with and the one-line reversal. The paragraphs
    below describe the OUTGOING clip and are kept as the record of how the beat got a picture at all.
  take: 09-the-pause-LTX-ep2-b09-cropmotion-0820.mp4
  sha256: 247ecf6ca592127642ecf1f37c28b54fea327b5e992b3264ad505169f7e7d5ea
  source: farm-out/ep2-b09-cropmotion-0820/ (byte-identical, sha verified against the box's own ep2-b09-cropmotion-0820.sha256
    before the copy)
  job: pipeline/jobs/ep2-b09-cropmotion-0820.yaml
  authority: A STEWARD SHIP-MODE ENTRY, NOT A TASTE VERDICT AND NOT A PICK. The founder has never seen
    this clip. R4 VETO-ABLE IN ONE LINE.
  IT_OVERRIDES_A_PRE_REGISTERED_is_show_content_false_AND_THAT_IS_SAID_FIRST: "The clip's own job spec\
    \ declares `is_show_content: false` and it declared it BEFORE the pixels existed. Verbatim: \"The\
    \ framing clause of beat 09's plate bar is met for the first time and TWO of its clauses are not.\
    \ The adult read is an open R4 card (/review/ep2-guards-0818) and a clip inherits its plate's cast\
    \ defects frame for frame; the crop cannot change how old he looks. This is an INIT MEASUREMENT and\
    \ must never reach a cut. The beat-09 slate stays a slate.\" That sentence is not being reinterpreted,\
    \ softened or scored away. It is being OVERRIDDEN, in the open, by a steward, under a founder ship\
    \ order that says best-available beats a slate \u2014 and the reason the override is defensible is\
    \ the reason the declaration itself gives."
  why_the_override_is_the_narrow_one_and_not_a_bar_relaxation: "Read the declaration's own `why`: the\
    \ two clauses it fails are the CAST clauses, and the reason it fails them is \"the adult read is an\
    \ open R4 card\". It is not withheld on a measurement it lost. It is withheld pending a founder word,\
    \ and the b09 lane says so itself in the header of the swap script it pre-wrote for this exact moment\
    \ (pipeline/decisions-pending/ep2-guards-0818/swap-b09-into-cut.sh): \"Why it needs a human word first:\
    \ ... the adolescent read was an open R4 card. That card IS this decision.\" The bar it was measured\
    \ against, it PASSED \u2014 four of four, including the clause its own spec named as most likely to\
    \ fail. Nothing here relaxes a bar to fit a clip; the bar is untouched and still reads 4/4, and the\
    \ scope declaration is what moved."
  the_precedent_this_stands_on: BEAT 19, already in this episode. Its record says "beat 19 stays a SLATE
    until the author says otherwise" and it has ridden three cuts as "BEST-AVAILABLE ON A STEWARD RULING,
    NOT A PICK". Same shape, same openness, and it survived two founder screenings. Beat 09 is that ruling
    applied a second time, not a new liberty.
  what_it_buys: "THE EPISODE'S PUNCHLINE GETS A FACE. Beat 09 is \"...We confiscate the goblin?\" \u2014\
    \ the joke the whole patrol sequence is built to land. It has played over a black card in every cut\
    \ this episode has ever had."
  what_it_costs_and_both_are_named:
    the_cast_question_is_now_on_screen_in_close_up: "He reads adolescent. A boy in round glasses, in close-up,\
      \ holding the episode's biggest laugh. This is the guards card's question rendered at full size,\
      \ and if the answer is \"recast\" this beat is the loudest place the recast will be needed. That\
      \ is an argument for showing it, not for hiding it \u2014 but it is a cost and it is his to price."
    the_hand_dissolves_and_it_is_inside_the_slot: 'From the spec: "a full hand across the cheek at f001,
      fingers by f004, two fingers under the nose at f006, gone by f008." The slot takes f001-f093 of
      a 121-frame clip, so the dissolve is ON SCREEN in the first third of a second. Verified on the assembled
      master, not assumed: the hand is present at 44.4 s and gone by 46.2 s. C4 passes as written and
      the spec states it "would not pass if the hand were excluded" (hand-free box mean 0.844 against
      a 1.0 bar).'
  veto_in_one_line: "\"beat 09: back to a slate\" \u2014 delete review/ep2-ship-0821/sources/09-the-pause-LTX-ep2-b09-cropmotion-0820.mp4\
    \ and its .meta.yaml, re-run the command in `assembled_by`. Nothing else moves; the VO already plays\
    \ over the card and always did."
  and_the_other_direction: If the guards card comes back "pass" or "stage", this entry stops being an
    override and becomes an ordinary pick, and pipeline/decisions-pending/ep2-guards-0818/swap-b09-into-cut.sh
    becomes a no-op for this cut because the swap it describes is already done here.
the_slate_card_is_retired:
  what: "THERE IS NO SLATE IN THIS CUT. sources/slates.yaml and render_t3.load_slate_notes stay in the\
    \ tree and stay wired \u2014 they cost nothing and the next cut with a slate will want them \u2014\
    \ but this cut has nothing to load. The card that read \"He asks the sapling why. His line plays;\
    \ the picture does not.\" is gone because the picture now exists."
  the_prediction_this_falsifies: '`the_cutoff` said, in this file, "No render in flight tonight can land
    a legal beat by 12:00." That was wrong. A render in flight tonight landed one at 01:05, eleven hours
    inside the window. The sentence is corrected in place rather than deleted, because a manifest that
    quietly drops its own failed predictions is worth less than one that keeps them.'
beats:
- beat: 1
  slug: COLD OPEN
  take: 01-cold-open-COMP-chroma-s20260840.mp4
  sha256: 12e256fd35f1b10119da67909bfa3fb0d15f1be44b1323c73f47e174af501e28
  why: "new \u2014 the b01 lane's take, landed inside the upgrade window and taken"
  entered: "Swapped into this cut on 2026-08-20 evening, hours after the first assembly, when the b01\
    \ lane repointed picks-0820.yaml at it. A STEWARD PICK \u2014 the founder has screened neither this\
    \ clip nor the one it replaces. R4 VETO-ABLE IN ONE LINE."
  verdict: pipeline/jobs/ep2-b01-figcomp-heldfield-0820.yaml verdict_chromaticity_rung_0820
  verdict_quoted: "BEST-AVAILABLE WITH ITS FAULT NAMED. 7 of 8 scored clauses pass. G5a FAILS on ONE band\
    \ \u2014 grass floor 0.062 against a 0.20 bar \u2014 inherited from the held plate, where the foreground\
    \ grass sweeps coherently rather than re-inking. The clip it replaces also scores 7 of 8 and fails\
    \ the SAME clause on ALL THREE bands."
  fault_shipping: "G5a, on one band. The grass floor still moves with the fig (0.062 against a 0.20 bar)\
    \ \u2014 so the cold open's field is not fully locked, and it is the first thing on screen. G3, G4b\
    \ and G5b are UNSCORED BY DECLARATION: no leaf counter, no grass line, and the camera probe refuses\
    \ its own reading."
  what_it_is: 'NOT A RENDER. A composite made on a Mac by pipeline/fig_composite.py --gain-mode chroma:
    THE FIG comes frame-for-frame from the crf-33 take this replaces, THE FIELD frame-for-frame from its
    crf-10 sibling, joined on fig_track.py''s own per-frame mask (dilated 0.45 of the fig''s radius, feathered
    by half that) with three per-channel ring gains. Same seed, same init, same prompts on both halves.
    $0, no sampler, no GPU.'
  why_it_is_better_than_what_it_replaces: "The whole quarrel on this beat was that no seed produced both\
    \ a growing fig and a held field \u2014 seven scored clips, none with both. This does not find that\
    \ clip; it BUILDS it out of the two halves that each had one, and the named fault shrinks from three\
    \ failing bands to one."
  the_gain_can_move_colour_and_that_was_pre_registered: The von Kries diagonal spreads 0.005 to 0.162
    over the clip and CAN shift hue and saturation. Its cost was registered in the job spec before the
    build existed (bar_chromaticity_rung_PRE_REGISTERED_0820), not scored afterwards.
  looked_at_not_only_measured: 'Frames at 0.2 / 2.5 / 4.9 / 7.0 s of the assembled master: green nub,
    still green, full purple fig, held. The arc completes inside the clip and the grass holds through
    it.'
  veto_in_one_line: "\"beat 01: back to the fignonly take\" \u2014 restore 01-cold-open-LTX-fignonly-s20260840.mp4\
    \ (sha 4ec39e0f\u2026) from farm-out/ep2-b01-fignonly-s20260840-0820/, DELETE the chroma file (it\
    \ sorts first and would win a glob), re-assemble."
