a_bug_this_assembly_found_and_fixed_because_it_was_in_the_cold_open:
  what_happened: >-
    THE FIRST ASSEMBLY WITH THE NEW BEAT 01 PLAYED THE COLD OPEN AT 0.53x
    SPEED, and render_t3 printed "beat 01 held still 5.04s stretched to fill
    9.47s" while doing it.
  the_cause: >-
    render_t3.held_still() classified the clip by substring-matching
    `model: none` in its sidecar. `model: none` means NO SAMPLER RAN — which is
    true of a composite and does not mean "no video". pipeline/fig_composite.py
    writes it honestly and produces 121 real frames at a real 24 fps. A held
    still is a COMPUTED camera move with no true frame rate, which is why it is
    allowed to be stretched; a composite is footage and must not be.
  the_fix: >-
    A declared frame rate is the discriminator. hold_still writes `seconds:`
    and deliberately no `fps:`; anything that states its own fps is footage and
    gets footage's treatment — play once, hold the last frame. Committed to
    pipeline/render_t3.py with a test both ways (a hold_still-shaped sidecar
    still reads held; a composite-shaped one no longer does).
  IT_IS_NOT_ONLY_THIS_CUT: >-
    ep2-demo-0820 was re-assembled with the same clip before the fix existed,
    so the demo cut on disk has the stretched cold open too. Reported to the
    b01 lane rather than fixed inside their directory.
  the_gate_that_now_catches_it: >-
    EVERY GATE PASSED THE HALF-SPEED CUT — the licence gate, the proof-receipt
    sha recheck, qa_local's 83 routes and qa_episode's 15 checks. A clip at
    0.53x hashes, serves, links and measures exactly like one at full speed, and
    duration is the wrong instrument because a stretch fills the SAME slot. What
    caught it was a person reading a log line. So render_t3 now RECORDS the fill
    path per beat in the master's sidecar (`fill: slate|once|hold|stretch|
    pingpong`, with clip_s and slot_s), and qa_episode asserts on it: a beat may
    only be stretched if its clip declares no `fps:`. Proven to fail, not just
    to pass — poisoning beat 01's row to `stretch` makes qa_episode exit 1 with
    "beat 1 ... (5.04s stretched into 9.46s)". qa_episode is 16 checks now.
  verified_after_the_fix: >-
    Beat 01 plays its 5.04 s once and holds to 9.46 s. Measured on the SHIPPED
    master: its last moving frame is at 3.79 s, inside its own clip — stretched,
    the motion would have run past 7 s. Fill window 5.10-9.40 s: 0 moving pairs
    of 103, 42 bit-identical, max mean delta 0.006. Looked at, not only measured
    — green nub at 0.2 s, still green at 2.5 s, full purple fig at 4.9 s, held
    at 7.0 s. The master's own sidecar now grades all 21 beats: 14 once, 6 hold,
    1 slate, ZERO stretched.

