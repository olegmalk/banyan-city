# 1:1 beside review/ep2-goblin-design-0819/adult-b19-0819.jpg. NOT from the 240px
# proof thumbnails, which is how the two beats below got missed the first time.
#
# THE HEADLINE IS A COUNTING ERROR:
# THE GOBLIN IS IN ELEVEN BEATS OF THIS CUT, NOT NINE.
#
# CREDIT WHERE IT IS DUE, AND A CORRECTION TO THIS BLOCK'S FIRST DRAFT, WHICH
# CLAIMED NOBODY HAD CAUGHT ANY OF THIS: the b02 plate lane found BEAT 02
# independently earlier on 08-20 and said so in as many words --
# `pipeline/derive_b02_adultplate_0820.py`, uncommitted in the working tree:
# "The 08-19 split page ... listed nine goblin beats ... Beat 02 is on neither
# list. It was missed." That lane got there first and this audit confirms it.
# What is new here is BEAT 15, which no lane and no sheet has ever named, and
# BEAT 07, which is filed on the RIGHT-hand side of the 08-19 split and does not
# belong there. The 08-19 split sheet
# (`the-split-0819c.jpg`, "nine frames from the cut") and every record built on
# it — including canon.yaml's own list of beats to re-render — enumerate 03, 04,
# 07, 08, 13, 14, 17, 19, 20 and omit BEAT 02 and BEAT 15. The sheet was built
# from the beats someone remembered as goblin beats rather than from the cut, so
# the two beats nobody thought of are the two the design ruling never reached.
# They are also, awkwardly, the best and the worst frames in the whole set.
goblin_design_audit_0820:
  method: >-
    f060 of each source mp4 at 704x1280, read at 1:1 against the B tile. Ten tile
    attributes (blank white slit eyes / no nose bridge / one lipless line / short
    low flange ears / dome with no neck / two-tone chartreuse-over-green /
    no age modelling / small folded stance / purple cowl / patchwork cloak).
    Nothing here is a taste verdict — it is a comparison against a picture the
    founder ruled, and every row says what is visibly different.
  counts:
    beats_in_cut: 21
    goblin_present: 11
    tile_faithful: 2
    near_tile_one_named_break: 1
    man_read: 5
    child_read: 2
    unjudgeable_face_not_visible: 1
    no_goblin: 10
  the_two_that_were_never_audited:
    beat_02: >-
      FOUND FIRST BY THE b02 PLATE LANE EARLIER ON 08-20, not by this audit --
      see the credit note above. THE WORST IDENTITY BREAK IN THE CUT AND IT IS
      NOT AN AGE PROBLEM. He is not
      green. The figure is bone-grey/white with a huge round cranium, low pointed
      ears, closed eyes, a chubby child body, grey shirt and shorts, barefoot. So
      beat 02 breaks the tile on SPECIES COLOUR and on BUILD at once, and it has
      never appeared on a design sheet, in the split, or in the re-render list.
      Its ship_status has read "UNJUDGED — no bar has ever been answered" since
      08-17 and that is exactly why: nobody looked.
    beat_15: >-
      THE SECOND-BEST TILE MATCH IN THE CUT, and it was not on the sheet either.
      Blank white eyes with no iris, no nose bridge, one lipless line, big
      chartreuse dome grading to deeper green, seated small and folded, BAREFOOT
      (which matches the steward lower-half pick). Its named break is COSTUME —
      a plaid blanket-cloak, no purple cowl — not anatomy. Whatever produced this
      frame is closer to the answer than anything in the re-render wave.
  beats:
    1:  {goblin: false, read: '-', note: fig and grass only}
    2:  {goblin: true,  read: CHILD (AND GREY), tile_breaks: 'not green at all; round child cranium and body; no cloak', in_08_19_split: false}
    3:  {goblin: true,  read: ADULT MAN, tile_breaks: 'human nose with nostrils; rounded human ear; nasolabial folds; flat olive not two-tone', in_08_19_split: true}
    4:  {goblin: true,  read: ADULT MAN, tile_breaks: 'iris and pupil in a human eye; full human nose; long swept-back elf spikes; brow furrows and cheekbones', in_08_19_split: true, note: 'the tightest crop in the cut and the worst offender - see the framing finding'}
    5:  {goblin: false, read: '-', note: two guards}
    6:  {goblin: false, read: '-', note: one guard with the board}
    7:  {goblin: true,  read: ADULT MAN, tile_breaks: 'WHITE HAIR ON A CHARACTER WHOSE CANON IS BALD; the guard round spectacles; human nose; adult male height beside the guard', in_08_19_split: true, note: 'listed as an ADULT-B beat on 08-19, i.e. as one of the four that were RIGHT. It is not. Bald is canon and this frame has hair.'}
    8:  {goblin: true,  read: CHILD, tile_breaks: 'small body, big head, closed sad eyes, buttoned coat; the pre-ruling round one', in_08_19_split: true}
    9:  {goblin: false, read: '-', note: guard close-up}
    10: {goblin: false, read: '-', note: two guards and the board}
    11: {goblin: false, read: '-', note: two guards walking away}
    12: {goblin: false, read: '-', note: sapling and cloud}
    13: {goblin: true,  read: ADULT MAN, tile_breaks: 'human eye and lid; human nose; small human ear; lined male face; normal head-to-shoulder ratio', in_08_19_split: true, note: 'THIS IS THE FRAME HE RULED ON: "this is one of the images where the goblin looks like an adult, which is wrong."'}
    14: {goblin: true,  read: NEAR TILE - ONE NAMED BREAK, tile_breaks: 'LONG TAPERING ELF SPIKES where the tile has short low flanges; red-and-white striped scarf, no purple cowl', in_08_19_split: true, note: 'eyes, dome, two-tone skin and folded stance all match the tile. The ears are the whole gap.'}
    15: {goblin: true,  read: TILE-FAITHFUL, tile_breaks: 'costume only - plaid blanket-cloak, no purple cowl', in_08_19_split: false}
    16: {goblin: false, read: '-', note: SLATE, no footage}
    17: {goblin: true,  read: UNJUDGEABLE - BACK VIEW, tile_breaks: 'face not visible; legs render blue-teal rather than green', in_08_19_split: true, note: 'barefoot, which matches the steward lower-half pick. Silhouette is tile-compatible; no face claim can be made from this frame either way.'}
    18: {goblin: false, read: '-', note: the fig alone}
    19: {goblin: true,  read: TILE-FAITHFUL - IT IS THE TILE, tile_breaks: none, in_08_19_split: true, note: '19-the-drop-dropcomp-0819.mp4 is a deterministic composite over b19-sapgloss-s20260819.png, which IS adult-b19-0819.jpg. This beat is not LIKE the tile, it is the tile with the fig moved.'}
    20: {goblin: true,  read: OLD MAN, tile_breaks: 'wrinkled forehead and jowls; heavy human nose; ear with no point at all; pupils', in_08_19_split: true, note: 'the 08-18 result "the adult goblin draws, the chibi child is gone" was recorded as a FIX. Measured against the tile it is a different failure, not a repair.'}
    21: {goblin: false, read: '-', note: one leaf against the sky}
  what_this_changes_in_the_re_render_wave: >-
    canon.yaml's 08-19 list said "beats 03, 04, 08, 13 and 20" need re-rendering.
    On this audit the wave is SEVEN beats, not five: add 02 (grey child, never
    audited) and 07 (white hair on a bald character, wrongly filed as one of the
    four that were right). Beats 15 and 19 come OUT of any wave — they are the
    reference. Beat 14 needs one attribute changed, the ears, not a re-render.
    Beat 17 needs nothing until a frame shows his face.
  a_live_collision_flagged_not_touched: >-
    SIX UNCOMMITTED b02 PLATE SPECS ON DISK ARE AUTHORED AGAINST RETIRED CANON.
    pipeline/jobs/ep2-b02-adultplate-s202608{20..25}-0820.yaml and their deriver
    were written earlier on 08-20, before the founder's night correction, and
    their reasoning is explicit: "the defect is not the adult -- it is the MIX."
    That premise is now retired, and their prompt.txt is the `lean wiry adult
    goblin man` string verbatim. Fired as written they would render the man-read
    six more times. They are NOT queued (box queue is empty, none in farm-out)
    and NOTHING HAS BEEN TOUCHED — they belong to a live lane and this lane does
    not edit another lane's uncommitted files. Flagged here and in the ladder so
    that lane re-reads before it enqueues.
  nothing_here_moves_a_frame_before_the_cutoff: >-
    This is an audit, not a swap. No beat below changes in the 2026-08-21 cut:
    every re-render it names is a post-ship patch, and the two beats it newly
    condemns (02, 07) have no candidate to swap to. It is filed now because the
    wave that follows the ship is authored off this table, and because two of
    eleven goblin beats were invisible to every previous record.

