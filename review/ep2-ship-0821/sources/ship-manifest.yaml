  supersedes_sha256: dfc6a44ab8729a9ef92643eee08bf85bbdc49e20c42647e770da209164ec6bdd
  entered: "STEWARD PICK, 2026-08-21, R4-VETO-ABLE IN ONE LINE. The founder has screened neither this\
    \ clip nor the one it replaces."
  verdict: pipeline/jobs/ep2-b02-tilemotion-s2-0821.yaml verdict_ageb_wave_0821
  verdict_quoted: "PASS ON THE WINDOW AND CUT-PREFERRED ... Face, slit eyes and open mouth are intact\
    \ to f101 (4.21 s); the sprint, the push off and the dive into the grass all complete inside that.\
    \ The egg arrives only at f106. Slot is 4.04 s, so there is 0.17 s of margin, and the take shipped\
