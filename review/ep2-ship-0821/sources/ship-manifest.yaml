    \ up onto a knee, turns \u2014 and its COSTUME MORPHS ON SCREEN, a dark cloak becoming a brown plaid blanket\
    \ between f065 and f076. A garment changing mid-shot at 3.0 s of a 5.04 s slot is a break the viewer\
    \ sees, and it outweighs the motion it comes with."
