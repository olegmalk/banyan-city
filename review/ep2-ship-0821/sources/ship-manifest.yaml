vo:
  takes_in_this_cut: 18
  absent_by_design: [2, 19, 21]
  absent_by_design_why: >-
    Those three carry no spoken line in
    genomes/sapling/nodes/002b-first-citizen/node.md. The VO column has no
    holes and nothing in this episode is waiting on voice synthesis.
  engine: chatterbox-0.5B on MPS, muxed in sync by render_t3 from the measured
    lines[].chunks in each manifest.
  identical_to_ep2_demo_0820: all 18 mp3 and all 18 json, byte for byte. No
    voice was synthesised for this cut.
  sync_measured_not_asserted: >-
    Envelope cross-correlation between the assembled master and each source
    take, 10 ms bins, on beats 1, 6, 9, 15 and 20: lags 0, 0, +10, 0, +10 ms
    (peak r 0.94 / 0.80 / 0.74 / 0.88 / 0.80). One frame is 41.7 ms, so every
    measured beat is inside a quarter-frame. Re-measured after the beat 01 swap
    and unchanged.

# ------------------------------------------------------------- the assembly --

the_hold_fill:
  fires_on_6_beats: [1, 4, 6, 11, 17, 18]
  not_7: >-
    picks-0820.yaml lists [1, 3, 4, 6, 11, 17, 18]. Beat 03 dropped off when
    revision b swapped in a clip that outruns its own slot floor; that manifest
    listed the pre-swap set and did not update it. Corrected here rather than
    repeated.
  what_it_does: >-
    The clip plays once forward and holds its final frame
    (tpad=stop_mode=clone). The palindrome survives only as opt-in
    `loop_fill: pingpong`, which nothing in this tree writes.
  frame_verified_tonight_on_the_assembled_master:
    method: frames at 24 fps across each fill window, cropped to rows 0-800
      (above the caption strip), adjacent pairs counted as moving at mean
      absolute luma delta > 0.30.
    beat_01: 103 pairs, 0 moving, 42 bit-identical, max delta 0.006 (re-measured
      after the beat 01 swap and the held_still fix)
    beat_06: 107 pairs, 0 moving, 59 bit-identical, max delta 0.012
    beat_18: >-
      139 pairs, 1 "moving", 4 bit-identical, max delta 0.604 at t=98.99 s.
      NAMED RATHER THAN ROUNDED AWAY: that pair has ZERO rows above 1.0 mean
      delta, so the change is spread evenly over the whole frame — an h264
      keyframe refresh, not content. A palindrome reads as 100+ moving pairs
      with localised motion; 0819c's beat 06 read 100 of 114.
    the_other_three: beats 4, 11 and 17 take the same code path and print the
      same line and were NOT independently frame-compared. Named, not implied.
  live_control: beat 09's clip (5.04 s) OUTRUNS its 3.92 s slot, so it is
    trimmed, not held — 36 of 91 pairs moving, 0 bit-identical, max delta
    10.32. The hold branch did not fire where it should not have.

cards:
  title: >-
    Composited over the first 2.8 s of live footage, not a black card:
    "SAPLING" / "002b — The First Citizen" / "a story that branches" /
    "Previously: He finishes the inventory of his new existence: dead engineer
    -> living tree, capabilities exactly two (sense, grow)."
  end: >-
    3.0 s. "banyan.city" / "branch this node · fork the city" / "every render
    is open data".
  naming: THE SHOW IS SAPLING; banyan.city IS THE PLATFORM. The title card
    carries the show, the end card carries the platform, and neither claims the
    other's name.

master:
  loudness: measured -16.2 LUFS, re-mastered -0.80 dB to -16.7 LUFS. -17 is
    unreachable without squashing the peaks further; render_t3 said so and
    stopped rather than squashing.
  container: h264 720x1280 24 fps, aac 44.1 kHz stereo, 12,793,567 bytes.

# ---------------------------------------------------------- what this is not --

what_this_assembly_did_not_do:
  - No render, no voice synthesis, no GPU, no network, no spend. $0.
  - No script text was touched.
  - >-
    No verdict was authored, edited or reinterpreted. Every verdict_quoted
    above is its lane's own words, carried verbatim.
  - >-
    Bench assembly via --out. NO LEAF, nothing in lineage.yaml, no plate_ack,
    not canon, not published. This is a candidate the founder screens, and the
    publish gate is his and is unchanged.
  - >-
    ONE thing was overridden and it is beat 09's is_show_content declaration.
    It is the only override in the cut and it has its own top-level block.
  - review/inbox.yaml was not touched.

assembled_by: >-
  pipeline/render_t3.py in bench mode on 2026-08-20 evening, invoked as:
  `python3 pipeline/render_t3.py sapling 002b --clips review/ep2-ship-0821/sources
  --out review/ep2-ship-0821/ep2-ship-0821.mp4`.
  THE DIRECTORY IS THE WHOLE TRICK: find_audio() and vo_manifest() resolve
  against --clips and NOWHERE ELSE, so all 18 NN-vo.mp3 and all 18 NN-vo.json
  were copied in before the run — a cut assembled without them is silent and
  says nothing about it. slates.yaml is resolved the same way.
  Output: 21 beats, 20 footage, 1 slate, 116.33 s, $0.00.

the_cutoff:
  when: 12:00, 2026-08-21.
  rule: >-
    Upgrades judged and swapped into this manifest by then enter the shipped
    cut. Later ones go to a post-ship patch list. Recorded for the peer lanes
    in pipeline/work-ladder-0819.md.
  what_is_actually_upgradeable_before_it: >-
    ONE THING, and it is not a render. The guards card
    (/review/ep2-guards-0818) is the only open item whose answer changes a
    picture inside the window: "recast" removes beat 09 and puts the slate
    back; "pass" or "stage" turns beat 09's override into an ordinary pick.
    Every other open card either has no pre-staged alternative (beat 04's
    action, beat 16's staging) or its alternatives have already been rendered
    and refused on mechanism (beats 01, 08, 13). No render in flight tonight
    can land a legal beat by 12:00. -- THAT LAST SENTENCE WAS WRONG AND IS LEFT
    STANDING SO THE CORRECTION IS LEGIBLE. The beat-16 restage lane landed one
    at 01:05, eleven hours inside the window: a composited plate
    (ep2-b16-sapcomp-r2-0820) and one i2v sample (ep2-b16-motion-0820), trimmed
    by 3 frames, entered under ship rule 2. Beat 16 was the last slate and this
    cut is now 21 footage / 0 slates.
