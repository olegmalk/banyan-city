  what_it_fixed: "THE WORST BREAK IN THE CUT, named as such by the 08-20 audit in canon.yaml: the outgoing\
    \ take's goblin is BONE GREY, NOT GREEN, with a round child cranium, and beat 02 was never on any\
    \ design sheet. This beat now carries the same face as beats 03, 04, 13 and 20."
  fault_shipping: "THE EARS ARE WRONG, and so is the collar. canon.yaml ep2-goblin-design-adult/correction_2026_08_20\
    \ reads the B tile as \"SHORT, BROAD, LOW-SET FLANGES ... NOT long tapering elf spikes\"; this clip\
    \ draws long tapering spikes, as every clip in the age-B wave does. C1's magenta collar is present.\
    \ The beat also remains SILENT BY DESIGN and still answers no bar about its staging \u2014 the verdict\
    \ above is about the window and the face, not about whether the sprint is the right sprint."
  the_trim_is_recorded_not_implied: "ffmpeg -frames:v 97 off the 121-frame source (sha 8e86a1f5\u2026),\
    \ libx264 crf 10, no re-sample. Sidecar 02-the-sprint-LTX-b02-ageb-s2-trim97-0821.mp4.meta.yaml carries\
    \ source_sha256, why_trimmed and an explicit `fps: 24` \u2014 the last of those is load-bearing: the\
    \ sidecar honestly says `model: none` (ffmpeg ran, no sampler did) and without a declared frame rate\
    \ render_t3.held_still() would classify it a computed camera move and be free to STRETCH it. That\
    \ is the bug that played beat 01 at 0.53x on 08-20."
  upgradeable_before_cutoff: "The wave's second seed is the pick; the first is the PARTIAL (egg from f055).\
    \ A third seed is not the named next rung \u2014 the ears are a plate/prompt fault and are post-ship."
