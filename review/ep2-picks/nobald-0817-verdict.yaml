    what_it_promotes: >-
      The count tag from "residual suspect" to "the named next lever". The
      prediction written into the spec before rendering was: if the point is still
      absent, the residual suspect IS the count tag. The point is still absent AND
      the goblin multiplied. Both point the same way.

  the_danbooru_count_is_still_1boy: >-
    Restated because it is the thing a later reader would most easily believe was
    fixed: NEITHER RUNG CHANGED THE COUNT TAG. Both derive and declare `1boy` on a
    two-figure beat, with 0 faults. The goblin got a GRAMMATICAL subject slot, never
    a count slot.

  what_the_next_lane_should_do_and_it_is_not_a_draft_edit: >-
    Both remaining faults -- no aimed point, and a multiplied goblin -- now sit
    behind the count tag, and the count tag cannot be fixed from wave-drafts.yaml.
    It needs a PER-VARIANT COUNT DECLARATION so a single draft on beat 07 can
    declare `2boys` without faulting the beat's one-figure siblings: that means
    `goblin_ipa_sample.py` calling `wg.apply_variant_declaration` (which already
    exists, and which the sampler simply does not call) and that mechanism being
    extended from `declares_no_count` to a declared count. It is a shared-sampler
