    deliberately by whoever owns that file rather than smuggled through a draft.

  no_pick_is_offered: >-
    No frame here meets its bar, so there is nothing to pick and none is named.
    No `plate_ack`, no `approved:`, no `provisional:`. Taste is the founder's and
    this is not a taste question -- it is three counts.
  rung: 'B -- rung A plus the grammar fix. TWO variables against the original, ONE against rung A. Read it against ep2-b07-nobald-0817 or not at all.'
  what_it_tests: >-
    NOT polish. Beat 07 scored 0 OF 12 on containing a point at all -- CONFISCATE
    is the beat and the gesture was absent -- because `compress()` splits on commas
    and `points` arrived as a list item whose nearest preceding noun was `white
    sash`. THE SASH WAS THE SUBJECT OF THE VERB. And there was no goblin NOUN
    anywhere in the prompt, so the species attributes had only the guard to bind to
    and green skin arrived as a green mitt. This rung is testing whether the beat`s
    own action is POSSIBLE. The verdict must answer that in those terms.
  what_it_does_not_do: >-
    IT DOES NOT CHANGE THE DANBOORU COUNT TAG. It still derives and declares `1boy`
    on a two-figure beat; the goblin gets a GRAMMATICAL subject slot, not a count
    slot. `_tag_from_clause` reads only the first sentence up to its first comma,
    check()`s count guard compares against the BEAT-WIDE `tag:`, and
    goblin_ipa_sample.py calls wg.check(BEAT, d, ...) directly and never calls
    apply_variant_declaration -- so there is no per-variant count override on the
    box path. `2boys` would require editing beat 7`s `tag:`, faulting every sibling
    draft. Do not read this rung as a corrected figure count.
  if_it_still_fails: >-
    If the point is still absent or the goblin is still a mitt, the residual
    suspect IS the count tag, and the fix then requires a per-variant count
    declaration in the sampler -- a shared-file change and another lane`s call.
  tokens: '65 of 77 positive, 58 of 77 negative, 0 faults, anchor present, 1boy derived == 1boy declared'
  trade: 'NONE. Spends 6 of rung A`s 15 tokens of headroom and still sits 12 under budget. Nothing cut, style tail intact.'

