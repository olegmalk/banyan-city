a_provenance_defect_found_while_verifying_and_NOT_fixed_here:
  what: >-
    Every sidecar these two beats write still records
    `goblin_definition_as_sent: "green skin, bald head — unchanged from the wave-1
    sample, on purpose..."` -- because goblin_ipa_sample.py writes its GOBLIN_DEF
    constant into that field unconditionally, whether or not the draft contained
    the `{{GOBLIN}}` slot it fills.
  why_it_matters: >-
    For these two beats the field is FALSE. `bald head` was not sent; the
    `prompt:` field in the same sidecar proves it. A future scorer trusting the
    provenance field over the prompt field would conclude the token was still
    being sent and would re-diagnose a fixed defect. §7.2 says provenance always,
    and this is provenance that lies.
  why_it_is_not_fixed_here: >-
    goblin_ipa_sample.py is a shared sampler on the do-not-touch list, and the
    field is correct for the eleven goblin beats that DO carry the slot. The fix
    is to write the field only when the slot was actually substituted -- a
    one-condition change that belongs to whoever owns the sampler.
  authoritative_field_meanwhile: 'the `prompt:` field, which is the string the model received.'
