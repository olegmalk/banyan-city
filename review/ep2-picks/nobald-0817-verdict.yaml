  rung: 'A -- `bald` removed and NOTHING else. The sash still governs `points` and the goblin still has no noun on this rung, deliberately left broken so a haired guard can only be attributed to the token.'

  # ---- THE HEADLINE, AND IT IS A NEGATIVE RESULT --------------------------
  term_4_he_is_not_bald:
    bar_as_written: 'HE IS NOT BALD -- a bald guard fails outright'
    score: 4 of 12 PASS / 8 of 12 FAIL
    verdict: >-
      REMOVING THE TOKEN DID NOT FIX BALDNESS ON BEAT 07. Said plainly rather than
