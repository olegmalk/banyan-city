    what: 'GOBLIN MULTIPLICATION. Three or more goblins appear in several frames (r0-s0, r0-s1, r0-s2, r0-s3, r1-s0, r1-s2), so term 1 -- EXACTLY TWO FIGURES -- fails widely on rung B where rung A did not have the problem in the same form.'
