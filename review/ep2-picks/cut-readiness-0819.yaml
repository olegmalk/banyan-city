# EPISODE 2 — ASSEMBLY READINESS LEDGER, 2026-08-19
#
# WHAT THIS FILE IS. One row per beat, 1 to 21: the best take that exists right
# now, the bytes of it, the verdict that licenses it into a cut, whether its VO
# take exists, and what it is blocked on if anything. It is the assembly's
# shopping list and, read top to bottom, the honest picture of how close
# episode 2 is to a full cut.
#
# WHY IT EXISTS AS A FILE AND NOT AS A PARAGRAPH IN A REPORT. Every previous
# assembly re-derived this from three places at once — the last cut's
# `picks-NNNN.yaml`, the `verdict:` blocks scattered across ~30 job specs, and
# the work ladder — and each re-derivation quietly re-read a different subset.
# The 0819 cut's own manifest says so in its text: "the scope actually checked
# is EVERY EP2 JOB SPEC THAT CHANGED IN GIT SINCE THE 2026-08-18 CUT ... which
# is eleven files and no more". That is the correct, honest thing to write and
# it is also the reason a standing ledger is worth more than the eleventh
# careful paragraph.
#
# HOW EVERY ROW IS DERIVED. `cites` on each row is not decoration — it is the
# whole warrant. Three source classes and nothing else:
#   * `cut:`     review/ep2-demo-0819/ep2-demo-0819.mp4.meta.yaml `ingredients:`
#                — the sha256 of each file AS MUXED into the live cut. Those
#                hashes are the assembly's own record, written by render_t3.py.
#   * `spec:`    a `verdict*:` block inside a pipeline/jobs/*.yaml, which is
#                where a bar pre-registered before the pixels existed gets its
#                answer. Quoted, never paraphrased into a stronger claim.
#   * `record:`  review/ep2-picks/done-definitions.yaml (the beat's `done_when`
#                and its recorded faults) and pipeline/work-ladder-0819.md.
# A row with no `spec:` cite is NOT a pass. It says `best-available` and the
# reason is written out.
#
# THE THREE VALUES `status` MAY TAKE, and they are not interchangeable:
#   PASS            a written verdict against a pre-registered bar says PASS for
#                   THIS EXACT FILE. Not "for this recipe", not "for a sibling
#                   seed" — this file.
#   best-available  footage that a verdict lets into a cut but which no verdict
#                   calls a pass: a carry-forward nobody has judged, or a judged
#                   FAIL that is still the best thing this beat owns. It is in
#                   the cut because a slate is worse, and the fault is named.
#   slate           nothing exists that a verdict lets into a cut. render_t3
#                   draws a title card and the VO plays over it.
#
# WHAT THIS FILE DOES NOT DO. It makes no pick, promotes nothing, writes no
# plate_ack and approves nothing. `upgrade_available:` rows name a swap and
# leave it named; the swap is made in an assembly manifest, by an assembly, and
# every one of them is veto-able in one line. Taste is R4 throughout: where a
# row says a beat is blocked on a taste call, that is the founder's and it is
# marked, not answered.

