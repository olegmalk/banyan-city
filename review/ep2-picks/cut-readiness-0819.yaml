  5, 6, 10, 13, 16, 21 — have no verdict block of any kind and have been carried
  forward through 0815, 0816, 0817, 0818 and 0819 unchanged. They are not
  suspected of being bad; they have simply never been judged, and five
  consecutive appearances in a cut is not five passes. That is the honest shape
  of episode 2 right now: the slates are loud and tracked, and the quiet middle
  is where the unknown actually lives. It is named here rather than fixed,
  because judging eight beats is its own unit of work with its own bar, and
  because inventing bars for footage that already exists is how a bar gets bent
  to fit the clip — done-definitions' own `definition_written` fields say
  repeatedly that a definition written retroactively "could not be bent to fit
  the clips that already exist", and that discipline is worth keeping.

