    clause that cannot be read. The composite loses one frame, f001, to the detector''s
    separability gate at 1.76 against a bar of 2.00 -- and the same frames pass that gate at
    libx264 crf 18 and 23 and miss it at crf 0 (lossless), 10 and 14. The verdict follows the
    encoder, backwards, because compression smooths the detector''s background annulus. A
    clause whose answer I can choose by picking a CRF is not a measurement, so G1 is VOID and
    scored neither way. That leaves one FAIL of seven scorable plus a VOID, against the in-cut
    take''s one FAIL of eight scored -- a tie on failures and a clause lost. G5a still fails on
    the grass band alone (0.062), inherited from the held plate.'
  what_would_change_this: 'An INSTRUMENT rung, $0, no GPU. fig_track''s background annulus runs
    1.35r to 2.10r and at the fig''s smallest radius it lands inside the compositor''s feather,
    where the two clips'' fields are blended and the ring MAD is inflated. Exclude the blend
    zone from the ring -- the compositor knows exactly where it is -- and f001 becomes readable
    in a direction no encoder can flip. If G1 then passes, this composite is proposed as a swap
    WITH pixels. Explicitly NOT the route: choosing an encode that clears the gate.'
  a_taste_question_parked_not_asked: 'farm-out/ep2-b01-figcomp-heldfield-0820/01-cold-open-COMP-stillplate-0820.mp4,
    sha 5f2f428c1b6b1ad367c22cd9e912178ed8e15854757ba5401c7a248f54e14920 -- the same fig on a
    frozen plate. No seam, every field clause satisfied BY CONSTRUCTION rather than measured,
    and no ambient motion at all: no grass sway, no drifting light shafts, no dust. Locked-off
    plate versus living field is R4 and it is deliberately not being asked yet; it should be
    asked once, with pixels, beside a heldfield build whose G1 can be scored. Built and sha''d
    so the ask costs nothing when it comes.'
  this_file_still_makes_no_taste_call: Unchanged. Nothing here is a verdict on a picture, and
    the founder has screened none of these clips.

