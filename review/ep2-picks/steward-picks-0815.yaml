      finding: >-
        The five picks were not lost through carelessness. THE OUTPUT FILENAMES
        DO NOT NAME THEIR OWN BEAT. Every task directory on the results branch
        for beats 02, 03, 04, 13, 14, 15, 16, 17, 19 and 20 contains its clip
        under the name `13-remake-LTX-0813.mp4`, and every beat 21 directory
        contains `21-the-answer-LTX-poolD-0812.mp4`. The output name was
        inherited from the job template and never re-derived per beat.
      corroborating: >-
        The same carry-over hits the other artifacts in each directory: all of
        them, including beat 21's, ship an init plate called
        `b13-init-704x1280.png` and a bench log called `bench-b13-remake.jsonl`.
        Beat 21's own directories carry a b13 init filename.
      why_this_caused_the_gap: >-
        Anyone recording a pick by filename would have written down
        `13-remake-LTX-0813.mp4` for five different beats, which is worse than
        writing nothing. Recording nothing was the correct instinct. The fix is
        that THE DIRECTORY, not the filename, is the identifier.
      the_record_is_recoverable_after_all: >-
        The .mp4.meta.yaml sidecar inside each directory carries the correct
        `shot_beat` and `task`. So beat identity survives in the sidecar even
        though it is destroyed in the filename. That is what makes the four
        recoveries below evidence rather than guesses.
      distinctness_proven: >-
        The mp4 git blob hashes differ across every directory, so these are
        genuinely different renders and not one file copied ten times. Within a
        beat, the A and B twins SHARE an identical init-plate blob and differ
        only in seed — which is exactly what an A/B seed pair should look like.

    frame_count_discriminator:
      finding: >-
        Beats 03, 04, 13 and 16 all ship on 4.042-second clips. At the frozen
        24fps that is 97 FRAMES. Beat 21 ships on 5.042 s = 121 frames.
      why_it_matters: >-
        done-definitions.yaml already records two facts that only make sense
        together with this one: "the dead-air finding came off a 97-frame clip
        and none of the five recorded picks is 97 frames", and the resurvey note
        that the recorded picks "are all 121 frames". The 97-frame clip that
        produced the dead-air finding was therefore one of the UNRECORDED
        beats — almost certainly one of these four. The dead-air finding and the
        record gap are the same set of clips seen from two directions.

