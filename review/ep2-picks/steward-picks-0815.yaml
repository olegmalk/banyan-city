    '15':
      status: ALL CANDIDATES FAIL — scored directly against the definition
      definition_used: >-
        "he LOOKS UP and the SAPLING IS IN THE SAME FRAME. Both in shot is the
        whole point of the beat — a close-up of him looking up at nothing fails it
        however well he acts."
      examined: 12 candidates — 4 ep2-b15-idfix, 4 ep2-b15-idfix-r2, 4 review/tonight (ep2-b15-goblin-simple).
      why_all_twelve_fail:
        idfix_and_idfix_r2_8_of_12: >-
          THERE IS NO SAPLING IN ANY OF THEM. They are outdoors in the field, which
          is right, but the greenery is DETACHED LEAVES FLOATING FREE at the frame
          edges — no stem, no root, nothing growing out of the ground. A floating
          leaf is not the sapling, and the beat's whole point is that the sapling
          shares the frame. He is also not looking up in any of the eight: s1 has
          his eyes shut, s2 is a full back view, s3 is a side profile looking level.
        tonight_4_of_12: >-
          These DO contain a real rooted plant with a visible stem, but they are
          INDOORS — pale vertical wall panels and a doorway, not a field. The
          founder has already ruled on exactly this failure, on beat 21: "none of
          them have a good background, doesnt look like the sapling is outside."
      closest_candidate: review/tonight/15-good-listener-wave1-s1.png
      why_it_is_closest_and_still_fails: >-
        Viewed full size, it is the ONLY one of the twelve that does the thing the
        beat asks: his head is tipped up and a rooted plant with a stem is in the
        same frame. It fails on two counts. The background reads as an interior
        wall, and the plant is a multi-leaf specimen with long pointed banana-like
        blades, not the canon two broad round cotyledons on a thin stem. Naming it
        rather than picking it, because a beat whose subject is a conversation with
        a sapling cannot ship on a plate where the sapling is a houseplant indoors.
      what_a_passing_plate_needs: >-
        Outdoors in the open field. The sapling ROOTED IN THE GROUND with a thin
        visible stem and its two oversized leaves — attached, not floating. The
        goblin standing or sitting beside it, small relative to nothing else in
        frame, with his head tipped UP toward the leaves. Both subjects entirely
        inside the frame. The failure across all twelve is one of two halves being
        present at a time: the idfix sets have the field but no sapling, the
        tonight set has a plant but no outdoors.

    '17':
      status: ALL CANDIDATES FAIL — scored directly against the definition
      definition_used: >-
        "stand, brush, turn — a departure. NOTE the turn takes his face away from
        the lens by design, so the staging law does not apply here: this is the one
        beat where turning away IS the action."
      examined: 8 candidates — 4 ep2-b17-idfix, 4 ep2-b17-idfix-r2.
      fault_1_the_stand_has_nowhere_to_start: >-
        HE IS ALREADY STANDING AT FRAME ONE IN ALL EIGHT. Upright, full height,
        weight on both feet. The beat's action is stand, brush, turn — and the
        first third of it cannot be animated from a plate where he has already
        stood up. This is the staging law applied to the plate rather than the
        camera: the plate has to hold the START of the action, and none of these do.
      fault_2_every_one_of_them_arms_him: >-
        All eight put an object in his hand that the beat never asks for — a
        spear or pole in s0, s3 and r2-s0, a shovel or ladle in s3, a cut sprout in
        s1, s2 and r2-s2, a rag or cloth in r2-s1 and r2-s3. Two problems. He
        cannot BRUSH HIMSELF OFF with his hands full, so the middle third of the
        action is blocked too. And under the new prop_identity_bar every one of
        those objects must then persist as the same object in the same hand for the
        whole clip, which is a continuity liability taken on for no story reason.
      combined: >-
        Between the two faults, all three verbs of "stand, brush, turn" are
        unsupported by every candidate. There is nothing to pick.
      what_a_passing_plate_needs: >-
        The goblin SEATED or folded low in the sapling's shade at frame one, HANDS
        EMPTY, outdoors in the field, framed with enough headroom above him that he
        stays in shot when he rises to full height. Note this is continuous with
        beat 13's end state — "he ends FOLDED SMALL in the sapling's shade, knees
        up" — so beat 17's opening plate should look like beat 13's closing frame,
        and building it that way buys continuity between two adjacent beats for
        free.

    '20':
      status: PICK MADE, WITH FAULTS NAMED
      definition_used: >-
        "BOTH HANDS to the fruit, then the look UP to a branch that is visibly
        BARE — the empty stem is the evidence and must be in frame."
      examined: 8 candidates — 4 ep2-b20-idfix, 4 ep2-b20-idfix-r2.
      pick: farm-out/ep2-b20-idfix/20-evidence-wave1-s3.png
      one_line_reason: >-
        It is the only candidate that satisfies the beat's primary clause and the
        secondary one at once — the fruit is cupped in BOTH hands at chest height
        in the "holding it like evidence" gesture, and a bare branch is in frame
        above him for him to look up to.
      runner_up: farm-out/ep2-b20-idfix-r2/20-evidence-wave1-s3.png — same both-hands gesture, but the fruit is held low at waist rather than up, so the lift into the look has further to travel.
      faults_named_and_not_hidden:
        - "THE BRANCH IS THE WRONG TREE. The bare branch in frame is a thick, dark, gnarled MATURE-TREE limb entering from the top corner. The beat needs the SAPLING's own thinnest branch, now empty, because the empty stem is what makes it evidence. A dead oak limb overhead is not the stem the fruit fell from, and mature tree / thick trunk are negated terms in our own prompts."
        - "THE FRUIT IS THE WRONG COLOUR. It reads dark red-brown, an apple or a plum. The record settled purple: 'colour is settled - purple reads as fruit where green never did.' Beat 18's whole shipping fault is that a cold reader called the fruit a plum; shipping beat 20 on a red fruit repeats that error two beats later and makes it look deliberate."
        - "HE IS NOT LOOKING UP. In this and every candidate the gaze is level, into the lens. The look UP is the second half of the definition and no plate stages it."
      why_a_pick_and_not_ALL_FAIL: >-
        Unlike beats 15, 17 and 19, beat 20's central physical requirement — the
        fruit in both hands — IS met, by four of the eight. The faults are colour
        and set-dressing, which are the kind a beat ships with named. That is the
        distinction shipping_rule draws, and it is why this one gets a pick and the
        others get a diagnosis.
      NOTE_this_is_a_pick_not_a_verdict: >-
        Which take ships is the steward's call and is made here. Whether a red
        fruit is acceptable when the record says purple is a taste question and
        goes to the founder.

    scoring_caveat_that_applies_to_all_of_them: >-
      Ten beats had no definition of done until 2026-08-15 — 02, 03, 04, 08, 13,
      14, 15, 17, 19 and 20 — and all ten were written retroactively while this
      scoring pass was in flight. Any verdict formed before its beat's definition
      landed was formed against nothing, and is being re-checked against the
      definition rather than kept.

  # =====================================================================
  # JOB 3 — THE TWO BLOCKED PLATES. The concrete next step for each.
  # =====================================================================
  job_3_next_steps:

    '08':
      title: INSIDE HIM
      definition_of_done: >-
        "the clipboard comes DOWN and the point goes to the BELLY, both legible;
        both guards and the scavenger in frame, since a point needs its target
        visible."
      the_next_step_is_NOT_a_plate_job: >-
        My first framing of this was wrong and is corrected here. I set out to
        write a beat 08 plate job with clipboard/waist/full-height wording, on the
        theory that the two-shot had only ever been asked of the animator and never
        baked into a plate. The scan does confirm no plate carries that wording.
        But wording is not the missing thing.
      THE_ACTUAL_BLOCKER: >-
        Beat 08 is blocked on the same missing capability as beat 07: A PLATE WITH
        TWO NAMED CHARACTERS AT A WORKABLE DISTANCE. That capability is a
        REFERENCE property, not a prompt property. The only thing that has ever
        put two figures in one frame is a reference set that itself contains two
        figures, and nothing on disk has a guard and a goblin together. So the
        two-figure reference has to be MADE.
      what_it_is_gated_on: >-
        Making that reference is gated on THE FOUNDER'S GOBLIN PICK. You cannot
        build a guard-plus-goblin reference until it is settled which goblin is
        the goblin. The 0812 IP-Adapter sidecars say so themselves in as many
        words: "it is NOT a canonical goblin and nobody has picked one" and
        "Choosing the goblin is R4's call and this run does not make it."
      the_second_gate_underneath_it: >-
        Beat 08 is a GUARD beat, so the guards ruling also applies — "lets do the
        guards on my taste", recorded 2026-08-14: "Do not cast them and do not
        animate guard beats off an unapproved cast. The sheet renders, goes on his
        board, and waits." Note what that permits: rendering a SHEET is explicitly
        allowed, casting and animating are not. Six guard jobs are already held out
        of the ready queue on it.
      the_second_gate_CORRECTION_0816: >-
        CORRECTION, 2026-08-16. The paragraph above is left standing unedited; its
        cast premise is out of date and was already out of date when it was written.
        THE GUARDS ARE CAST. The founder cast both men in his own words —
        2026-08-14T16:45:25Z, "1 for the guards. although it only shows one guard..
        front and back" (guard A, his #1, frozen); and 2026-08-15T08:39:13Z, "ill
        take the guard b you chose. on a sidenote, there is a clipboard floating
        behind him." (guard B = s2 of the derived round). Both were re-verified on
        2026-08-16 directly against the session transcript at those timestamps, not
        copied from a summary. The approval lives in review/inbox.yaml, in the
        `resolved:` entries on the cards guard-picker-0814.jpg ("ANSWERED IN BOTH
        HALVES") and guard-pair-0815.jpg ("ACCEPTED, WITH ONE FAULT NAMED... the
        veto window is closed") — that file is an AUTHORITATIVE SOURCE for founder
        decisions and must be searched before any lane reports something blocked on
        him. So the guards gate under beat 08 is DISCHARGED. Note what this does and
        does not change for beat 08: the FIRST gate above — the goblin pick — was
        also closed on 2026-08-15 ("ill take 1 for the goblin"), so the two-figure
        reference this beat actually needs may now be MADE. It still does not exist,
        and `THE_ACTUAL_BLOCKER` above is unaffected and remains correct: nothing on
        disk has a guard and a goblin together, and no staged plate of the approved
        pair exists either — both men are costume cards on a grey void. The
        approvals release the WORK of drawing those references and plates; they do
        not release a render. Do not fire motion off a costume card, and do not
        write a `plate_ack` waiver to get past the plate guard.
      status_CORRECTION_0816: >-
        `status:` below is superseded and left standing. Beat 08 is no longer BLOCKED
        ON A FOUNDER TASTE CALL — both calls it names are made. It is blocked on a
        MISSING ARTEFACT: the two-figure guard-plus-goblin reference, which is ours
        to build and is the next piece of work on this beat.
      concrete_next_step: >-
        Do not queue a beat 08 plate job. Put the goblin pick in front of the
        founder, because it is the gate under both this beat and the two-figure
        reference that beat 07 also needs. Once the goblin is picked, the job to
        write is a two-figure REFERENCE, not a beat 08 prompt — and the beat 08
        plate then conditions on it the way the cast references already do.
      why_this_ordering_matters: >-
        A beat 08 plate job written now would render a lone guard or a lone
        goblin however carefully the words are chosen, because the words are not
        what was missing. That is the same mistake the record already names once,
        in `action_vs_script_audit_0815`: staging effort spent on the wrong
        question, and "a well-executed wrong action is still the wrong action".
      status: BLOCKED ON A FOUNDER TASTE CALL (the goblin pick), correctly, and it is NOT idle GPU time.

    '18':
      title: THE DECISION
      is_it_already_shippable: >-
        NO — and this was worth checking first rather than proposing rounds.
        `shipping_rule` (R4, 2026-08-14) says one definition-of-done round plus at
        most TWO fixes, then it ships with its fault named, and beat 18 has
        `rounds_used: 3`, which on that rule alone would mean ship now. But
        `ship_ceiling` (R4, 2026-08-14) overrides it explicitly: "UNDERSTANDABLE
        and AN UPGRADE outrank the two-round floor. A beat that is merely
        unfinished ships; a beat that is CONFUSING gets its third round, because
        confusion is the failure the whole rewrite exists to fix." Beat 18 is
        recorded `understandable: CONFUSING`, and it is named in
        `ship_ceiling.earns_a_third_round`. Confusion is the one fault that is not
        allowed to ship, so beat 18 does not ship as-is.
      why_the_confusion_is_disqualifying_here_specifically: >-
        The beat's own reason is that the object IS the beat: "The beat is the fig
        that is about to be spent - if the object is not the fig, the beat is
        about nothing." A cold reader ranked the fruit as a PLUM, with fig fifth.
      the_defect_is_prompt_adherence_and_the_fix_is_DELETION_not_more_negation:
        symptom_1: >-
          A beat 18 render drew a long-haired woman while the prompt negated "no
          woman, no girl, no person, no face" five separate ways. Five negations
          did not remove her, which is the signal that negation is not the lever.
        symptom_2: >-
          The prompt injects a goblin definition into a beat that HAS NO GOBLIN IN
          IT — an extreme close-up of a single fruit. That injection is the most
          likely source of the humanoid: the prompt is being told to draw a person
          in a shot that contains no person.
        the_repo_has_already_proven_this_exact_fix: >-
          `eggplant_fix`, 2026-08-14: "the purple object is GONE from all five
          refires. Removing the blanket fig clause fixed it completely, which
          confirms the clause was the whole cause." Cost recorded: "12 wasted
          renders and about 70 minutes of card." An inherited blanket clause was
          the entire cause of an unwanted object, and DELETING it fixed it
          outright with no negations added. The goblin-def injection into beat 18
          is the same shape of bug, and the same fix applies.
        a_second_mechanism_worth_checking_before_any_render: >-
          Several sidecars in this repo carry "NEGWARN: negative prompt over
          CLIP's 77-token budget" with an explicit DROPPED list. If beat 18's five
          woman/girl/person/face negations overflow 77 tokens, they are being
          SILENTLY DROPPED before they ever reach the model — which would explain
          why five negations did nothing, and would mean the fix is to SHORTEN the
          negative so the negations survive, the exact opposite of adding more.
          This is free to check and must be checked before spending a round.
      the_shape_fix_is_a_reference_not_words: >-
        The record already reached this conclusion and it survives review.
        `beats.'18'.lever`: "a fig REFERENCE IMAGE conditioned like the cast
        references, not more words. Shape has resisted every wording lever I have;
        it is a composition property and composition comes from the reference."
        Colour is already solved — purple reads as fruit where green never did.
        Only silhouette is outstanding.
      concrete_next_step: >-
        ONE sample, not a batch, in this order: (1) delete the goblin-def
        injection from the beat 18 prompt and count the negative's tokens, cutting
        it under 77 so the surviving negations are the ones that matter — both are
        free and neither needs a round; (2) run the fig REFERENCE route that
        plate-drafts already has in flight, conditioning shape the way the cast
        references condition character. Under the one-sample rule that is ONE
        image reviewed before anything is scaled.
      what_is_the_founders_and_what_is_mine: >-
        Deleting a goblin definition from a beat with no goblin, and fitting the
        negative inside the token budget, are mechanical corrections and are mine.
        Whether the resulting silhouette reads as a fig is taste and is his.

    beat_19_is_the_third_blocked_plate_and_was_not_on_the_list: >-
      Recorded here because it emerged from the scoring and belongs with these
