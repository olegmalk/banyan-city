# VERDICT 1 — THE SIX 0815 MOTION TAKES. NEVER JUDGED UNTIL NOW.
# ══════════════════════════════════════════════════════════════════════════
verdict_0819_motion:
  scored_on: '2026-08-19'
  scorer: steward (Claude Opus 5), beat-15 lane — sighted, frames extracted and looked at
  takes: 6
  result: ALL SIX FAIL
  provenance_check: >-
    Every mp4 was pulled from the box with scp and its sha256 verified against the
    manifest the producing job wrote itself (ep2-b15-<task>-0815.sha256). All six
    match byte for byte. Frame counts and durations re-measured with ffprobe against
    the `--frames` argument in each spec: lookup/lookupB 49f/2.04s, twobeat/twobeatB
    97f/4.04s, long/longB 193f/8.04s. Nothing below is read off a ledger.
  what_the_six_are: >-
    THREE PROMPTS AT TWO SEEDS EACH, and — this is the whole story — ALL SIX SHARE
    ONE INIT IMAGE. Every one of the six specs crops the same file with the same
    asserted sha256:
      C:\banyan-farm\courier-box\farm-out\ep2-b15-plate-0814\15-good-listener-ipa-r0-w015-s0.png
      sha256 43648513f936a52f6b83f8c66b3f15b102f1c73c2a4fe2899c3e477e75618fb9
    (verified independently by this lane after pulling the plate: the bytes on the
    box hash to that string and the job's manifest agrees.)
    Seeds: 20260815 for lookup/long/twobeat, 20260902 for the B twins.
    Prompts: lookup "He opens his eyes and turns his head to look up at the small
    plant beside him."; long "He raises his head and his mouth moves as he speaks.";
    twobeat "He raises his head until he is looking straight ahead. Then his mouth
    opens and closes as he speaks."

  THE_INIT_DECIDES_THE_BEAT_AND_THE_INIT_FAILS_IT: >-
    The plate was looked at full size before any clip was. It shows a bald,
    round-headed CHILD-proportioned goblin STANDING, eyes closed, head down, in a
    green shirt, white cargo shorts and modern SNEAKERS — no patchwork cloak. To his
    right is a thin wiry multi-node stalk carrying small pointed paired leaves and
    topped by a WHITE-AND-BLACK SPHERE. That object is not the sapling. Canon is
    ~40 cm with two broad round leaves on a thin stem (THE-SAPLING.md §3.2;
    style.md row 002a/b/c); this is a weed with a ball on it.
    THEREFORE: no seed and no motion prompt reachable from this init can pass
    done_when, because i2v does not replace the subject it is conditioned on. Six
    takes were spent discovering this and the plate could have been looked at first.

  clause_by_clause:
    SAPLING_IN_THE_SAME_FRAME:
      lookup_s20260815: FAIL — the object stays in frame for the whole 49 frames, but it is the weed-with-a-sphere, not the sapling. Fails on identity, not on framing.
      lookupB_s20260902: FAIL — same object; and by the final frame HIS FACE DEFORMS, the head turning away as an eye smears across the cheek. Identity break on the character as well.
      long_s20260815: FAIL — same object, held in frame through a slow push-in.
      longB_s20260902: FAIL — same object, and the push-in has carried it to the frame edge by the last frame.
      twobeat_s20260815: >-
        FAIL, AND THIS IS THE ONE THAT FAILS THE CLAUSE ITSELF RATHER THAN ON PLANT
        IDENTITY. The push-in tightens continuously to a head-and-shoulders close-up.
        Frames checked at 40/56/72/88/96: the stem and its sphere are visible at 40,
        faint at the right edge at 56, and GONE FROM 72 ONWARD — the last third of the
        clip is his face alone with a few loose leaves drifting past. This is
        done_when's own named failure, arrived at literally: "a close-up of him
        looking up at nothing fails it however well he acts." And he does act — the
        head comes up and the mouth opens on the line. The acting is the best of the
        six and it is spent on a frame the plant has left.
      twobeatB_s20260902: >-
        FAIL on plant identity, PASS on framing — the only take of the six that both
        moves the head and keeps the plant in frame from frame 0 to frame 96. Checked
        at 40/56/72/88/96: stem and sphere present in all five, no push-in, full body
        held. If the init had carried the real sapling this take's framing would have
        been the answer.
    CLOSE_UP_OF_HIM_LOOKING_UP_AT_NOTHING:
      fires_on: twobeat_s20260815 (from frame 72)
      does_not_fire_on: the other five
    GAZE:
      scored: false
      why: see definition_judged_against.ONE_CLAUSE_OF_IT_IS_STALE_AND_IS_NOT_MINE_TO_EDIT
      recorded_not_scored: >-
        Because it will be asked: the head does come up in twobeat and twobeatB and
        does NOT in lookup, lookupB, long or longB. In lookup — the one take whose
        prompt literally says "look up at the small plant beside him" — the head never
        rises at all; it rotates so his face goes AWAY from both the camera and the
        plant. Recorded as a measurement of the engine, not as a score.
    ALSO_TRUE_OF_ALL_SIX_AND_INHERITED_FROM_THE_INIT:
      - he is STANDING. Beat 13, the frame immediately before, ends "his legs give out and he drops to sit in the grass at the base of the stem". A standing beat 15 does not cut to.
      - no patchwork cloak. Modern shirt, cargo shorts and sneakers.
      - a child read — round skull, small body — where canon is a lean wiry adult.

  best_of_the_six: 15-good-listener-LTX-twobeatB.mp4 (ep2-b15-twobeatB-0815, seed 20260902)
  why_it_is_best_and_still_fails: >-
    It is named rather than picked. It is the only one of the six that holds a full
    two-shot for its whole length while the head rises and the mouth moves — the
    framing behaviour the beat needs, demonstrated on this engine at this size. It
    fails because the thing sharing the frame with him is a weed with a ball on top
    and he is a standing child in sneakers. NOTHING ABOUT IT IS A SEED PROBLEM, so
    reseeding it is not the next step.

