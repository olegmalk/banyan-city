    "he LOOKS UP and the SAPLING IS IN THE SAME FRAME. Both in shot is the whole
    point of the beat — a close-up of him looking up at nothing fails it however
    well he acts."
  status_in_that_file_when_this_was_written: NO VERDICT YET

  ONE_CLAUSE_OF_IT_IS_STALE_AND_IS_NOT_MINE_TO_EDIT: >-
    "he LOOKS UP" IS SUPERSEDED AND done-definitions.yaml SAYS SO NOWHERE, because
    the file that discharges it is a different lane's. On 2026-08-17 the founder
    ruled "rewrite the beats to work at knee height. change the story" and beat 15
    was restaged: node.md:98 now reads "He tips his head down and sideways until
    his eyes are level with the two leaves, and talks to them from a hand's width
    away; both of them share the frame." genomes/sapling/nodes/002b-first-citizen/leaves/002b-t0-c.yaml
    (the 2026-08-17 revisions entry, `what_it_costs`) flagged the staleness in
    writing rather than editing the pick lane's file — "beats.15.done_when's 'he
    LOOKS UP' ... need re-transcribing to the level/downward look" — and that flag
    is still open two days later. THIS FILE DOES NOT EDIT IT EITHER. It records
    which clause every take is scored on and which is scored not at all:
      SCORED, and unchanged by the restage: "the SAPLING IS IN THE SAME FRAME",
        "both in shot is the whole point", "a close-up ... fails it". These are in
        the sentence the founder read and approved on 2026-08-03 and the restage
        did not touch them.
      NOT SCORED: the head direction. "he LOOKS UP" describes a staging canon has
        replaced, and the replacement is recorded `approval_status: NOT YET READ BY
        HIM`. Scoring a take against either version would be scoring it against a
        line nobody can currently certify. No take below passes or fails on gaze.

