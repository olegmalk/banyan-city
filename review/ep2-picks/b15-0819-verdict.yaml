  drawn: '2026-08-15', Apple MPS, animagine-xl-3.1, 832x1216, seed 20260734, $0
  state_before_today: >-
    every sidecar `scored: false`, `founder_verdict: null`, and no reference to any
    of the six anywhere in the repo except THE-SAPLING.md §6.1, which cites r6's
    sidecar as an instance of the `taller than he is` canon violation. Six plates
    were drawn, none was ever read.
  result: ALL SIX FAIL
  per_rung:
    r1: FAIL — a tight close-up of his head and shoulders in tall grass. No stem, no rooted plant, nothing in frame but him and grass blades. done_when's named failure, in a still.
    r2: FAIL — a SCALE DOUBLE. One huge seated cloaked figure fills the frame and a tiny goblin sits at its base. Two figures where the beat has one, and the plants are thin weedy stalks.
    r3: FAIL — seated goblin in a field, and the plant GROWS OUT OF HIS SHOULDER. Nothing rooted in the ground.
    r4: FAIL — closest on body and world: one seated cloaked goblin, a small leafy sprig to his left. Fails because the ground is a FLOATING DISC of grass in open sky, and the sprig is a many-leaved weed, not two leaves on a stem.
