# THE REAL BLOCKER
# ══════════════════════════════════════════════════════════════════════════
the_real_blocker:
  clause: THE SAPLING IS IN THE SAME FRAME — specifically the SAPLING half of it.
  statement: >-
    Beat 15 has now been judged on 24 artefacts: 12 wave stills (steward-picks-0815,
    ALL CANDIDATES FAIL), 6 mac plates (this file) and 6 LTX motion takes (this
    file). NOT ONE FAILS ON THE ACTING. Every single one fails because the thing
    sharing the frame with him is not the sapling: detached leaves floating with no
    stem (8), a houseplant indoors (4), a weed topped with a white sphere (the init
    under all 6 clips), a sprig growing out of his shoulder (2), a hill (1), nothing
    at all (1), a scale-double's weeds (1).
  therefore_not_a_motion_problem: >-
    A motion reseed cannot fix it — i2v does not replace the subject it is
    conditioned on, and six clips off one bad init is the proof. The beat is blocked
    on a PLATE, and it has been blocked on a plate since before the first clip was
    rendered.
  and_this_matches_a_finding_a_sibling_lane_reached_tonight: >-
    The beat-19 lane recorded in pipeline/plate_scratch.py on 2026-08-19, after three
    one-variable revisions: "THE PLANT IS NOT REACHABLE BY WORDS ON THIS CHECKPOINT
    and a fourth wording is the thing this repo has repeatedly been wrong to fire."
    Beat 15's evidence is the same failure on a different beat. The one difference
    that makes a fresh rung honest here rather than a seventh wording: beat 19's
    three rungs all asked the CURRENT canon and failed; beat 15's six rungs all asked
    the SUPERSEDED pre-restage canon (a plant taller than he is, seen from below) and
    have never once asked for the ~40 cm plant the story now has. That question is
    unfired, not closed.

