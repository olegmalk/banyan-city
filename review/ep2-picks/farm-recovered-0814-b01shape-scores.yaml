render_path_for_both: >-
  CUDA/bf16, LTX-2.3-Distilled-Diffusers, rtx5090 Laptop GPU, local-gpu, $0.00. Recorded
  with every colour claim below, because bf16/CUDA renders red where MPS renders purple off
