what_was_filed_off_this_verdict:
  job: pipeline/jobs/ep2-b07-point-motion-0819.yaml
  why_the_motion_branch_and_not_another_still: >-
    Because term 5 is the only clause left and a STILL cannot settle it any
    better than twelve stills already have. Rung B's own spec named the next
    lever for the still path -- a per-variant COUNT declaration in
    goblin_ipa_sample.py -- and that is a shared-sampler change, explicitly on
    this lane's do-not-touch list and another lane's call. What r1-s3 makes newly
    possible is the OTHER question, which no still can answer and which the
    engine-probe backlog has been carrying open since 2026-08-15: whether a
    pointing gesture binds to the GUARD once both figures are already fixed by an
    init. In text-to-image it did not -- a pointing arm attached to the goblin 3
    of 3. Nobody has ever asked it in image-to-video off a two-figure beat-07
    plate, because until this frame there was no such plate.
  one_sample_one_seed: 'ONE seed, ONE recipe, ONE plate. No sweep. Bar pre-registered in the spec BEFORE enqueue.'
