# BEAT 07 CONFISCATE -- FULL CLAUSE-BY-CLAUSE VERDICT on the two 0817 rungs.
# Filed 2026-08-19 by the beat-07 judging lane. SINGLE WRITER OF THIS FILE.
#
# ============================================================================
# WHY THIS FILE EXISTS WHEN A VERDICT ALREADY EXISTS -- READ THIS FIRST
# ============================================================================
# review/ep2-picks/nobald-0817-verdict.yaml ALREADY CARRIES SECTIONS FOR BOTH
# JOBS, filed 2026-08-17 by the lane that authored the fix. THAT VERDICT IS NOT
# RE-JUDGED, NOT OVERTURNED AND NOT EDITED. Nothing here touches that file,
# cast-0817-scores.yaml, review/inbox.yaml or review/ep2-demo-*.
#
# WHAT IT LEFT UNSCORED, WHICH IS WHY THERE WAS STILL WORK. Both specs
# pre-register a bar with EIGHT numbered terms and FOUR named fail modes. The
# 2026-08-17 verdict scores THREE of them -- `he is not bald` (term 2), the
# goblin-as-a-mitt question, and the point (term 5) -- plus goblin
# multiplication as an instance of term 1. Terms 3, 4, 6, 7 and 8 were never
# scored at all, and three of the four pre-registered fail modes were never
# recorded by name. The bar's own words are "each recorded by name whether or
# not it fires". This file completes that, and carries the already-scored terms
# forward rather than re-deciding them.
#
# ITS OWN CAVEAT IS THE OTHER REASON. That file opens by telling the reader it
# was written by the lane that authored the fix, and it says its per-frame
# baldness count is "a contact-sheet read at 340 px width ... a read and not an
# instrument". This lane opened all 24 PNGs at native 832x1216 and cropped the
# ambiguous heads to 2x. Two of its per-frame calls do not survive that, and
# they are recorded below as DISAGREEMENTS, not corrections -- see
# `disagreements_with_the_0817_verdict`. NEITHER CHANGES A PASS/FAIL OUTCOME.

method:
  frames_read: 24 of 24, every PNG of both jobs, opened individually at native 832x1216
  never_a_contact_sheet: >-
    No sheet, no thumbnail grid, no montage. Each frame was opened on its own.
    Five heads whose hair was genuinely ambiguous at full frame were then cropped
    and upscaled 2x with LANCZOS and re-opened: twofig r1-s3, twofig r2-s2,
    twofig r2-s3, nobald r2-s1, nobald r1-s1. Those five crops are what the
    baldness disagreements below rest on.
  provenance_verified_from_the_bytes: >-
    All 24 PNGs and all 24 sidecars scp'd from
    C:\banyan-farm\courier-box\farm-out\ and checked against each job's OWN
    .sha256 manifest written by the box: 48 of 48 OK, 0 mismatches. The prompt
    field of each sidecar was read directly and confirms `bald head` was NOT sent
    on either rung.
  the_provenance_field_that_lies: >-
    CONFIRMED INDEPENDENTLY, and it is the 0817 verdict's finding, not this
    lane's. Every sidecar still records `goblin_definition_as_sent: "green skin,
    bald head ..."` while its own `prompt:` field proves `bald head` was not
    sent. The authoritative field is `prompt:`. Not fixed here -- the sampler is
    another lane's file.
  what_was_NOT_done: >-
    No pick is offered, no plate is approved, no `plate_ack` is written, no
    taste-axis score is given. R4 is the founder's. This file scores a
    pre-registered bar and files one sample.

denominator:
  report_as: N of 12
  carried_forward_unchanged_from: frame_count_correction_0817 in both specs
  confirmed_by_the_bytes: >-
    12 PNG in each farm-out dir, r0/r1/r2 x s0..s3. No r3 file exists in either.
    Nothing is scored out of 16.

