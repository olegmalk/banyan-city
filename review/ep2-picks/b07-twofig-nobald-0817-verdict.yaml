# ############################################################################
disagreements_with_the_0817_verdict:
  status: RECORDED, NOT OVERTURNED. The 2026-08-17 sections stand exactly as written and this lane did not edit them.
  scope: >-
    Only the shared term -- `he is not bald` -- can be compared at all, since the
    0817 verdict scored no other term. Two frames per rung read differently at
    native resolution than they did on a 340 px contact sheet.
  rung_A_nobald:
    the_0817_read: 'bald 8 of 12; haired [r1-s2, r1-s3, r2-s2, r2-s3]'
    this_lanes_read: 'bald 6 of 12; not-bald [r1-s1, r1-s2, r1-s3, r2-s1, r2-s2, r2-s3]'
    r2-s1: 'The clearest of the four. A 2x crop of the head shows a full head of short BLACK hair with a defined hairline and separated strands. It is not a bald scalp. This lane reads it not-bald.'
    r1-s1: 'Genuinely marginal at any resolution: a very close dark crop with a visible hairline. This lane reads hair present but scores the frame FAIL on term 2 anyway, because "cropped hair" is more than a hairline.'
  rung_B_twofig:
    the_0817_read: 'bald 7 of 12; haired [r0-s0, r1-s0, r1-s3, r2-s1, r2-s3]'
    this_lanes_read: 'bald 7 of 12; not-bald [r0-s0, r1-s0, r1-s3, r2-s2, r2-s3]'
    r2-s2: 'A 2x crop shows a short DARK crop with a strong specular highlight on the crown. The highlight is what reads as scalp at thumbnail size. This lane reads it not-bald.'
    r2-s1: 'Not a disagreement about pixels but about WHICH FIGURE. The frame holds a bald foreground figure and a haired background one. This lane scores the acting figure, which is bald.'
  why_it_changes_nothing: >-
    Every frame in dispute fails the bar on a DIFFERENT term regardless of its
    hair: r2-s1 and r1-s1 on term 1, r2-s2 on term 1. No pass, no pick and no
    filed job turns on any of these four calls. Said explicitly so nobody
    relitigates a count that decides nothing.
  what_is_NOT_disputed: >-
    The 0817 verdict's two load-bearing findings are CONFIRMED here on the same
    numbers, read independently and at full resolution: the point is 0 of 12 on
    both rungs, and the goblin-noun fix works (absent-or-merged on rung A,
    distinct and pointed-eared on rung B). Its conclusion that the residual
    suspect is the COUNT TAG is corroborated by this file's term 1: rung B is
    2 of 12 and the eight failures are all overcounts.

