    both - guard B''s light sandy hair above guard A''s tan tunic and dark cropped trousers. Mechanism:
    this checkpoint does not bind an attribute to a named character (the bark board went to the goblin
    in 9 frames of 12; `pointing at another` in 3 of 3), so with fewer bodies than described sets, every
    loose attribute lands on whatever bodies exist. FALSIFIABLE PREDICTION, written and committed before
