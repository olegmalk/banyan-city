  next_step_costs_nothing: NOT a render question first. Check whether the chest marking is present in
    the guard PLATES themselves and simply invisible at plate scale, or whether the recipe is adding it
    - that is a look at the plates and at the prompt text, at $0. Only if the plates are clean is this
    a recipe fault.
  not_yet_checked: 'Beats 09 and 10 read for this specifically: beat 10''s blind read reports NO badge
