      Framing was SOLVED: deleting `horizon` from the negative dropped the render from a downward plan
      view to near eye level and finally produced the hedgerow and horizon band this beat''s plates never
      had. Cast is a seed question, not a wording one - `light sandy hair` binds at 4 of 4 seeds other
      than 20260817. See `guard_plates_redrawn_0817` at the top level of this file for the pictures, the
      per-condition scoring and what is still open.'
    plate_lane_0817_CORRECTION: 'RETRACTION OF THE ENTRY ABOVE, same day, by the same lane. `plate_lane_0817`
      says "Framing was SOLVED" by deleting `horizon` from the negative. IT WAS NOT. That was one picture at
      seed 20260817, and three fresh seeds of the byte-identical wording came back HIGH-ANGLE at 3 of 3 - one
