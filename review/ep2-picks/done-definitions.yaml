  the_sweep: Every farm-out/*/NN-*.yaml sidecar for beats 05, 06, 09, 10 and 11 was read and deduplicated
    by prompt text on 2026-08-16. 17 DISTINCT PROMPTS ACROSS 20 OUTPUT DIRS. This is a text sweep of
    what was ASKED FOR, needing no GPU and no judgement about what came back.
  count_naming_the_cast: 0 of 17. Tested for `dark cropped hair`, `dark hair`, `sandy`, `blond`, `tan
    tunic`, `cream`, `wrap skirt`, `glasses`, `wire-rim`. ZERO HITS. Every prompt describes an anonymous
    type - "two round guard men in plain brown tunics", "silly harmless bureaucrats with round soft bodies
    and bare heads" - and the wardrobe variants (grey robes, padded vests, tunic) swap the garment only,
