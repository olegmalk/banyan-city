eggplant_fix:
  date: '2026-08-14'
  result: the purple object is GONE from all five refires. Removing the blanket fig clause fixed it completely,
    which confirms the clause was the whole cause.
  cost: 12 wasted renders and about 70 minutes of card, all of it mine.
standard_0815:
  written: 2026-08-15, before any render in this stretch, at the lead's instruction
  a_beat_is_DONE_when:
  - a BLIND reader, given the frames with no context, names the action correctly without being led
  - the same character is recognisably present throughout - face, costume and proportions hold
  - the action is one the plate's camera can actually show (see staging_law)
  - every noun in the prompt exists in the plate
  - the FACE is the same face at the end as at the start - not merely the same costume
  - every object a character CARRIES OR WEARS in the init plate still exists in the rendered frames, as
    the SAME object, held by the SAME character (see prop_identity_bar)
  a_beat_is_NOT_done_because: 'a frame-difference number improved. The metric is a floor, never a verdict:
    it rises identically for a camera push-in, a lighting ramp and a character acting, and it has now
    told me the wrong thing in both directions in one night.'
  staging_law: 'CHECK THE ACTION AGAINST THE PLATE CAMERA BEFORE RENDERING. Beat 02 proved it: its plate
    is a high angle looking down, so any forward fold carries the face away from the lens from frame 1,
    and four arms of sampler tuning never recovered what one restaging did. Actions that raise the head
    or open the eyes keep the face in shot; actions that bend, crouch or turn away lose it.'
  scoring_method: 'Segmented inside the contiguous motion window with pair 0 dropped - frame 0 to 1 is
    a restyle flash, not motion. Judge smoothness ONLY from consecutive frames: an evenly-spread contact
    sheet puts sampled frames ~8 apart and makes a smooth move read as a cut, so no beat fails for "cutting"
    on a spread sheet alone.'
  rounds: three per beat maximum, then it ships with its fault named or it parks with the reason
  recipe_frozen: 704x1280, 97 frames, 24fps, two-stage, distilled sigmas, image-crf 33, guidance 2.0,
    original negative, sequential offload. A four-arm sweep found no arm improves subject motion; crf
    42 was a whole-frame regrade and guidance 1.0 breaks the action outright. Do not re-litigate.
  prompt_rules: The word "fig" summons a LEAF in this checkpoint and is banned from prompt text - the
    fruit is PURPLE FRUIT in prompts, while narrative and VO may still say fig.
  identity_drift_bar: 'Added 2026-08-15 after a blind read found it in BOTH beat 05 clips including the
    one whose action works: costumes hold while faces and hair do not. One guard''s "short, neat dark
    spikes" became "a large wind-blown spiky mane" reading as "a different, older character"; the other
    read "notably younger and rounder-faced" partway through. The reader''s phrase for it is "roughly
    the same costume, drifting face." No metric we own detects this and none is being built for it - it
    is a blind-read question, and it now goes into every read I commission. A beat whose ACTION lands
    but whose FACE drifts is NOT done: park it with that reason rather than passing it, because across
    21 beats an audience notices the continuity break even when the movement reads.'
  prop_identity_bar: 'Added 2026-08-15, after the one blind reader who returned compared three CLOSED
    picks against their own init plates and found a prop fault in every one. See blind_read_0815_b05_b06_b10.verdicts
    and reconciliation.named_faults_are_understated_and_are_extended_here, which already says in as many
    words that prop identity is not a clause here and that three of three picks fail it. That is a gap
    in the standard, not three coincidences, so the clause goes in. THE TEST, phrased so a blind reader
    with nothing but the plate and the frames can answer it: does every object a character CARRIES OR
    WEARS in the init plate still exist in the rendered frames, as the SAME object - same kind of thing,
    same shape, same orientation, same colour, roughly the same size - and held or worn by the SAME character?
    A clause nobody can check by looking is not worth adding, so that is the whole question; anything
    needing story context to answer is some other clause. Note it is a PLATE-to-FRAMES question, like
    identity_drift_bar and unlike scoring_method - a prop that is wrong identically in all ten frames
    still fails it. WHY IT MATTERS FOR A STORY, briefly - these beats turn on props. Beat 06 IS the clipboard;
    beat 20 is the goblin holding the fruit up like evidence. A prop that changes identity mid-shot is
    a continuity break in the very thing the beat is about, which costs more than the same break on scenery.
    THE THREE FINDINGS IT IS BUILT FROM. (05) The props SWAPPED HANDS - the reference has the boy holding
    the teal clipboard and the man carrying a grey-blue slab; in the frames the man holds BOTH and the
    boy''s hands are empty. (06) The prop is REPLACED ENTIRELY - a wide shallow dark-rimmed tray held
    horizontally, carrying loose white sheets and a pen, becomes a tall vertical brown board, densely
    scribbled, with a pale-blue clip tab. That is a different object, not a redraw of the same one. (10)
    BOTH separate objects are replaced by a single blank orange-tan board, held jointly. SCOPE, and this
    half is load-bearing: THIS CLAUSE GOVERNS WHAT WE CLOSE FROM HERE. It does NOT reopen beats already
    closed. RULE-closed-stays-closed-and-faults-get-named-0815 holds unchanged; beats 05, 06 and 10 stay
    SHIP WITH FAULT NAMED, with their prop faults already recorded as named faults in blind_read_0815_b05_b06_b10.verdicts.
    A shipped fault gets named, not re-litigated. Read this clause forward only. PROVENANCE, which is
    the argument for keeping the instrument: it was found by a BLIND reader comparing rendered frames
    against the init plate, with no filenames, no beat numbers and no story context. The SIGHTED read
    of the same three picks did not catch it, and no metric we own detects it either. Blind reads keep
    earning their cost; this clause is the second bar (after identity_drift_bar) that only a blind read
    produced.'
  seed_variance_rule: 'Beats 05a and 05b are seed twins - same plate, same prompt, same recipe - and one
    produced a complete readable walk-away while the other was a near-freeze with a slow zoom. So a SINGLE
    FAILED clip is weak evidence: do not declare a beat or a recipe dead on one. ONE SAMPLE BEFORE ANY
    BATCH is untouched, because that rule exists to stop SCALING on an unscreened result and this does
    not weaken it - the converse simply does not follow. Every DONE or PARKED line must say whether it
    was judged on one clip or two, and a beat that failed once on a recipe proven elsewhere gets a second
    seed before it parks. The exception is a failure a second seed cannot touch: if the plate has no subject
    in it, no seed adds one.'
trim_pass_0815:
  what: Trimmed the five recorded picks to their action. No re-render, no GPU, no verdict changed - an
    edit, per the lead. Outputs in review/ep2-picks/trimmed/, originals untouched on the results branch.
  totals: 25.21s across the five picks becomes 17.29s, 31% shorter.
  degraded_head_is_real_but_not_universal: 'Measured as per-frame Laplacian variance relative to each
    clip''s own median, which falls when edges smear and does not care how much the picture is moving.
    Three soft frames on beats 05, 06 and 10 (roughly 40-60% of steady-state sharpness, resolving by frame
    3), FIVE on beat 12 (down to 14%), and NONE on beat 11, which sits above its own median throughout.
    So it is not consistently two frames and it is not universal: three where it occurs, one clip at five,
    one clip at zero.'
  no_tail_degradation: Tail sharpness is 0.99-1.06 of median on all five. The tail problem is a held pose,
    not a degraded render.
  where_the_dead_air_actually_is: 'None of the five has a dead HEAD - every motion window opens at pair
    1. All the waste is in tails, and it is very unevenly distributed: 72 frames on beat 06 and 83 on
    beat 12 against zero on 05 and 11. So "a 97-frame clip is ~38 frames of standing still, ~23 of movement,
    ~35 of held pose" is the shape of the beat 02 staging clip, not of these picks.'
miss_analysis_b11_0815:
  date: '2026-08-15'
  question: Beat 11's round-3 verdict says "costume and cast hold the whole clip". The clip's near guard
    changes from a bald adult to a brown-haired figure between f16 and f21. What evidence was that verdict
    actually reached on, and could that evidence have shown the change?
  what_is_recoverable_and_what_is_not: The lane that wrote the verdict was `motion-wave`, woken at 03:25Z
    on 2026-08-14 for the final pre-wake scoring pass; it committed the verdict at 07:28 +0400 as 786f2522.
    Its own transcript is NOT retained - subagent lanes leave no jsonl in ~/.claude/projects, and the
    lead's transcript for that window contains only the wake message and the commit line. So the exact
    ffmpeg command that lane ran cannot be produced. Everything below is from artifacts that survive in
    the repo, and where it is inference it says so.
  the_sampling_the_lane_actually_used: That lane's own evidence sheets from the same night ARE committed,
    and they carry their frame numbers burnt into the image. review/ep2-picks/motion-0812/0813-b10-world.png
    is SIX frames labelled f0 f20 f40 f60 f80 f100. review/ep2-picks/motion-0812/0814-b09-facechange.png
    is FOUR frames labelled f0 f30 f70 f110. Both are 121-frame clips. So the house sampling that night
    was 4-6 frames out of 121 - ONE FRAME IN 20 TO 30, not one in seven. review/ep2-picks/bake_clip_sheet.py
