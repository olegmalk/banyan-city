    in the demo cut is knowingly broken.'
  attribute_merge_law_0816: 'WHEN THE COUNT FAILS, THE ATTRIBUTE SETS MERGE RATHER THAN ONE NAMED MAN''S
    SET WINNING - so on this beat a COUNT failure and an IDENTITY failure are the SAME failure, and fixing
    the count is a prerequisite for testing identity at all. Observed on the first beat-11 plate sample
    (farm-out/ep2-b11-mac-plate-0816/11-they-leave-mac-plate-r1s1.png, 2026-08-16): the prompt described
