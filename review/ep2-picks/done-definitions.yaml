  vacancy_pre_emption_is_now_a_default_0816: 'FIRST PRE-EMPTION OF THE VACANCY LAW RATHER THAN A POST-MORTEM
    ON IT, and it is to be applied to the remaining guard plates as a DEFAULT rather than rediscovered
    per plate. Beat 11 is the composition that invites the hole hardest - two figures walking into open
    field is by construction a large empty region - and `tall grass background` in the positive, plus
