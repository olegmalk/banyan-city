  did_the_sampling_straddle_the_break: 'YES, and by a wide margin. Rebuilt the 6-frame sheet on the beat
    11 pick: samples land on f0, f20, f40, f60, f80, f100. The identity change runs f16-f21. It therefore
    happens ENTIRELY between two adjacent samples, f0 and f20, and nothing about it appears in either.
    Worse than the straddle: f0 is the ONLY sampled frame in which a face is visible at all. From f20
    on the men are walking away and every remaining sample is the back of two heads, so the sheet could
    not have tested "same man" even in principle. Read against beat 11''s written definition - two guards
    walk away, backs turned, both present the whole clip, field present at frame one - that six-frame
    sheet PASSES every clause honestly. The verdict is what that evidence supports; the evidence was the
    wrong evidence.'
  the_second_and_larger_cause: 'The definition had no identity clause to fail. Beat 11''s `done_when`
    asks for count, staging, backs turned and a field at frame one, and says nothing about faces. `standard_0815.identity_drift_bar`
    was written on 2026-08-15, the DAY AFTER this verdict, and it says so itself: "Added 2026-08-15 after
    a blind read found it in BOTH beat 05 clips." A scorer working strictly to the written definition
    on 2026-08-14 had no clause under which to fail this clip, and scoring strictly to the written definition
    was the instruction. So the miss is not one lane being careless: the sheet could not show the fault
    and the checklist did not ask for it.'
  correction_to_the_hypothesis_i_was_given: The lead proposed roughly one frame in seven. It was one in
    twenty. That makes the mechanism stronger, not weaker, but the number in the record should be the
    measured one. The lead also proposed that the clip is not one shot; consecutive-frame reading says
    it is one continuous shot with a continuous identity collapse - see `beats.11.override_third_check_0815`.
  how_many_other_closed_verdicts_rest_on_this_evidence: ALL OF THEM. Every episode-2 verdict was reached
