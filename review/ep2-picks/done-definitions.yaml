  why_it_matters: 'A beat recorded as shipping with no recorded take is a hole in the record: nobody can
    say which clip it closed on, nobody can re-read it, and the trim pass could only cover the five picks
    that were named. Beat 11 is the demonstration of the cost - the only reason its verdict could be overturned
    at all is that its pick was named and its file could be fetched and hashed.'
  deliberately_not_filled: NOT guessing. Several of these beats have a dozen or more takes on the results
    branch and picking the plausible one would manufacture a record rather than recover one. Named here
    so it can be filled by whoever actually made the calls, or by re-picking on purpose.
blind_read_0815_b05_b06_b10:
  date: '2026-08-15'
  status: BLIND VERDICTS RECORDED. Nothing above is deleted or rewritten by this block. The sighted ruling
    it answers stays in the record beside it, and where the two disagree BOTH readings are written down
    below rather than one being resolved away by assertion.
  why_this_block_exists: 'Beats 05, 06 and 10 were re-read for identity drift after beat 11''s pick was
    ruled a broken take (`beats.11.override_third_check_0815`, `miss_analysis_b11_0815`, and the ranking
    in `resurvey_candidates_0815` which put exactly these three at highest risk). The lane running that
    re-read dispatched SIX blind readers and none returned inside two hours - scheduler saturation - so
    it ruled on its own SIGHTED read and said so explicitly, calling that "precisely the weaker instrument
    the identity bar was written to replace". Its ruling was: all three NAMED FAULT, no escalation. That
    ruling was provisional by its own terms. ONE blind reader has now returned, and its verdicts are recorded
    here verbatim because the provisional ruling asked for exactly this.'
  reader_conditions: Ten consecutive frames per set, scored against that clip's own init plate, grade-matched.
    The reader had no filenames, no hashes, no beat numbers, no story context and no statement that the
    three sets were related. The lane kept the mapping out of the reader's tree; it is recorded here so
    the verdicts can be attached to takes.
  mapping:
    N: beat 05, pick ep2-b05-standB-0814, frames f110-f119
    R: beat 06, pick ep2-b06-scene-0814r, frames f34-f43
    V: beat 10, pick ep2-b10-pairB-0814, frames f110-f119
  verdicts:
    '05':
      set: N
      pick: ep2-b05-standB-0814
      frames_read: f110-f119, ten consecutive
      score: 5/10
      ordinary_viewer_test: '"Yes-but."'
      headline_verbatim: '"Two figures in both, and you can tell they''re meant to be the same pair...
        but the older man has been visibly de-aged and softened into a different-looking person."'
      marked_morphology_not_pose: 'Reference adult: "mid-30s: heavy straight brow, hard square jaw, deep-set
        narrow eyes". The frames: "teenager or early-20s - rounder cheeks, soft short chin, thin arched
        brows, larger rounder eyes". The reader marked this MORPHOLOGY, not pose, and called it "the single
        biggest change in the set".'
      costume_faults_absent_from_the_reference:
      - an orange horizontal tab on the LEFT CHEST of BOTH figures, in every frame
      - two-tone trousers with a pale-teal panel
      prop_fault: THE PROPS SWAPPED HANDS. In the reference the boy holds the teal clipboard and the man
        carries a grey-blue slab. In the frames the man holds both and the boy's hands are empty.
      relation_to_the_recorded_shipping_fault: The record already says "the two guards read younger and
        softer-drawn than the guards in beats 06 and 11" (`beats.05.shipping_fault`). The blind read does
        not contradict that - it sharpens it from a drawing-style remark into a MORPHOLOGY finding on
        a specific figure, and adds a chest tab, a trouser panel and a prop reassignment that the existing
        fault line does not mention.
    '06':
      set: R
      pick: ep2-b06-scene-0814r
      frames_read: f34-f43, ten consecutive
      score: 6/10
      ordinary_viewer_test: '"Yes-but."'
      identity_fault: EYE COLOUR BLUE -> DARK BROWN, marked morphology by the reader and explicitly "not
        a lighting effect".
      costume_fault: a YELLOW-GOLD ROUND BADGE on the left chest in every frame, absent from the reference
      prop_fault: THE PROP IS REPLACED ENTIRELY. The reference is a wide shallow dark-rimmed tray held
        HORIZONTALLY carrying loose white sheets and a pen; the frames are a tall brown board held VERTICALLY,
        densely scribbled, with a pale-blue clip tab. Knee-height boots also appear that the reference
