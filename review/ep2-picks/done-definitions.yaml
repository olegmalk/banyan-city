      left standing unedited because the disagreement is the record. What survives, labelled as n=1: the one
      frame that had a horizon is the one frame in seven where `hedgerow behind` rendered at all, so a clause
      naming something "behind" needs a behind. `light sandy hair` does bind at 3 of 3 fresh seeds here, so the
      cast half is a seed question as stated - but no frame has BOTH the cast and the camera, so there is no
      candidate. BEAT 05 IS NOT SOLVED. Its best picture is 1 in 4 at this wording, and the next instrument is
      positive-side (`eye level` as a leading framing tag, where framing tags are known to bind) rather than
      another deletion from the negative. Not fired here.'
