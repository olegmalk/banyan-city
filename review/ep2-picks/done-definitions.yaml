action_vs_script_audit_0815:
  what: Checked the actions I authored for the scene-plate wave against the beat lines in node.md, which
    I should have done before authoring and did not.
  beat_06: 'MISMATCH. Script: "Guard 2 lowers the clipboard and points at the scavenger''s belly" for
    INSIDE HIM, and beat 06 THE CLIPBOARD requires the guard to turn the bark board over and read off
    it. I authored "one of them lifts his head from the board and looks out across the field." A look-up
    is not turning a board over and reading.'
  beat_07: 'MISMATCH. Script: Guard 1 POINTS at the scavenger, decisive. I authored "his head lifts and
    his eyes widen as he closes his hand around the sprout." There is no sprout-grab in this beat at all;
    the sprout came from my own earlier action dict, not from the script.'
  beat_09: 'MATCHES. Script: "Guard 1''s face works through it, slowly." I authored "his head lifts and
    his eyes widen", which is that thought crossing a face and is consistent with the recorded done_when:
    close on Guard 1''s face working through the thought.'
  why_it_happened: I wrote these actions to satisfy the staging law — keep the face toward a high-angle
    lens, so lift the head rather than fold — and never re-read what the beat was supposed to show. The
    staging law is a constraint on HOW to stage an action, not a licence to choose a different one.
  consequence: Beats 06 and 07 cannot be DONE on these takes however well they read, because a well-executed
    wrong action is still the wrong action. Beat 09 is judgeable on its merits.
definition_audit_0815:
  what: 'Audited all 21 script beats against done-definitions. TEN had no done_when: 08, 15, 17, 19 and
    20 had no entry at all, and 02, 03, 04, 13 and 14 had entries with no standard in them. All ten written
    from node.md and marked retroactive.'
  why_it_matters: Half the episode had nothing to check a take against, and three of those beats — 14,
    15 and 17 — have jobs on the card right now. Beat 07's wrong action survived precisely because its
    beat had no definition; this audit is that hole closed rather than that beat patched.
  two_conflicts_surfaced_not_solved: 'Beat 13: the script says the scavenger "slides down the trunk" and
    the founder has ruled the sapling is tiny, so the trunk does not exist. The end state (folded small
    in its shade) is what the beat needs; the route is an author call. Beat 19: the script has the fruit
    fall from the stem and bounce off his head, and every plate we own puts it already on the ground.
    Both are author decisions and neither is a prompt to fix.'
  one_exemption_recorded: Beat 17 GOODBYE ends with him turning to go, which takes the face away from
    the lens BY DESIGN. The staging law does not apply there — that beat's action IS the turn. My earlier
    b17 re-round removed the turn to satisfy the staging law, which was the same error as beats 06 and
    07 and is now recorded against the beat.
guard_plates_redrawn_0817: 'THE THREE REMAINING GUARD PLATES WERE DRAWN, 2026-08-17, on the idle Mac fleet
  at $0 - beats 05, 09 and 10, following the beat-11 plate that passed 7/7 and then settled its beat''s
  identity question in motion at 4 of 4 clips. Beat 08 was DELIBERATELY NOT DRAWN: it needs a two-figure
  guard+goblin reference that does not exist, and inventing the goblin''s half of it in a guard lane is
  exactly the improvisation `guard_plates_are_miscast_0816` is about. Sixteen renders, four machines, every
  prompt and every bar committed BEFORE its pixels, every picture opened and judged at 3x-8x rather than
  scored by a filename. NOTHING IS PROPOSED FOR A RENDER AND NO plate_ack WAS WRITTEN. Prompts and full
  per-condition scoring live in pipeline/plate_scratch.py DRAFTS[5], DRAFTS[9], DRAFTS[10] and REVS (5,2),
  (9,2), (10,2); pictures in farm-out/ep2-b05-mac-plate-0817/, ep2-b09-mac-plate-0817/, ep2-b10-mac-plate-0817/.

  WHAT LANDED. `wire-rim glasses` BINDS at 4 of 4 - the founder''s 2026-08-16 ruling that "the cast stands
  as drawn", glasses included, is in a picture for the first time, and `wire-rim` had appeared in zero prompts
  repo-wide. Beat 09''s recorded "another blank background" is cleared at 4 of 4. Beat 11''s hanging-strap
  defect DID NOT RECUR anywhere. Beat 05''s framing was solved by DELETING one word.

  THREE GENERAL RULES, EACH WITH ITS EVIDENCE, and each now in plate_scratch.py where a plate author meets
  it. (1) NAME WHAT EVERY HAND IN FRAME IS DOING, INCLUDING HANDS YOU DO NOT CARE ABOUT. An unspecified hand
  is an empty region and this checkpoint fills empty regions with nouns - the vacancy law applied to a body
  part - and the negative does not reach it. Evidence is a control nobody planned: beat 05 specified both
  men''s arms and all four hands came back EMPTY at 3 of 3 seeds; beat 10 specified only the near man''s and
  the far man''s unspecified pair came back holding a BAMBOO POLE at one seed and a DUPLICATE OF THE BOARD at
  another, with `weapon` in the negative. 2 of 3 against 0 of 3. It also explains beat 11''s strap
  retroactively: never a stubborn prop and never the sash, just an unspecified hand. (2) DO NOT FORBID
  `horizon` IN A SHOT THAT NEEDS ONE. Beat 05 rendered a downward plan view at 3 of 3 with no hedgerow and,
  at the highest, broke to THREE figures; deleting `horizon` from the negative alone dropped it to near eye
  level and produced the hedgerow that had been in the positive all along. A clause naming something
  "behind" is dead in a plan view, because a plan view has no behind. The trade is real and is not hidden:
  `sky` stayed forbidden and a pale sky band arrived anyway. (3) A FACE PLATE MUST NAME THE EYE STATE.
  `thoughtful` plus `mouth closed` gave three shut-eyed faces at three seeds; `eyes open` with `closed eyes`
  in the negative opened them on the first sample.

  ONE QUESTION THAT IS THE FOUNDER''S AND IS NOT ANSWERED HERE. In a TWO-GUARD plate, `glasses` attached to
  exactly one man''s clause lands on BOTH men at 5 of 5 legible renders - even at seeds where hair and
  garments separate cleanly, so it is not a general binding failure, it is eyewear specifically spreading.
  Guard A''s wire-rims therefore cannot be named in beats 05 or 10 without putting them on guard B too.
  Either they are left out of those two and carried by beat 09''s close-up, or guard B is drawn wearing them.
  THAT IS A CAST CALL (R4) AND WAS LEFT UNTOUCHED so it is decided against pictures that moved one variable.

  AND A METHOD WARNING WORTH MORE THAN ANY PLATE. Every fault first observed here was observed at seed
  20260817, and the two-figure identity failure that looked like a law about the checkpoint - "both men come
  back dark-haired, sandy hair binds on neither" - EVAPORATED at 4 of 4 fresh seeds. That is the SECOND time
  in two days this one seed manufactured a law (bf79e534 broke the first: four wordings, four turned heads,
  one seed). Fresh seeds before a wording ladder, always.'
figure_count_ruled_from_the_script_0817: 'BEATS 07 AND 08 NEED TWO FIGURES, NOT THREE. A filing lane
  found this contradiction and escalated it rather than deciding it, which was right: beat 07''s
  `done_when` wanted "the second guard and the field", beat 08''s wanted "both guards and the
  scavenger", and the two-figure plate that passed its own bar holds two figures with "Three or more
  figures fails" written into axis 1 of that bar. So both beats appeared to demand a three-figure
  plate that has never existed. RESOLVED AGAINST THE SCRIPT, WHICH IS THE AUTHORITY, AND NOT AGAINST
  EITHER `done_when`.

  THE RULE THE SCRIPT ACTUALLY FOLLOWS: A BEAT REQUIRES ITS ACTOR AND THE TARGET OF ITS ACTION.
  Nothing more. Beat 07 -- actor Guard 1, target the scavenger: two. Beat 08 -- actor Guard 2, target
  the scavenger''s belly: two.

  THE CONTROL THAT PROVES THE RULE WAS NOT FITTED TO THE ANSWER, and it is the reason this is a
  ruling rather than an opinion. BEAT 10 has an equally SINGULAR stage direction -- "Guard 2 flips
  the clipboard around: the back is blank" -- and its `done_when` demands "TWO guards in frame; the
  near one flips the bark board and holds its blank back TOWARD HIS PARTNER". Under the actor-plus-
  target rule that is CORRECT, because the target of beat 10''s gesture IS the partner: Guard 1 has
  just asked "...We confiscate the goblin?" in beat 09 and the blank back is the answer shown to him.
  Same rule, different count, and it lands exactly on the number beat 10''s definition already
  carries. A rule that reproduces an existing correct definition it was not built from is a rule; one
  that only ever produces the convenient answer is not.

  FOUR CORROBORATING LINES, ALL FROM FILES THAT PREDATE THIS RULING.
  1. THIS FILE ALREADY READ BEAT 07 AS TWO FIGURES. `corrections_to_the_brief.beat_07_is_not_goblin_free`:
     "07 CONFISCATE is ''Guard 1 points at the scavenger'' - the goblin is in frame and is the thing
     being pointed at." A guard and the goblin. No second guard anywhere in it.
  2. THE SCRIPT SAYS SO WHEN IT MEANS BOTH GUARDS, IN THE PLURAL, AND IT IS SINGULAR IN 07 AND 08.
     Beat 05: "Two PATROL GUARDS jog in and halt, scanning the field." Beat 11: "The guards walk away
     arguing, backs to camera." Both plural, and both `done_when`s are correctly plural. Beats 07 and
     08 name one guard each.
  3. BEAT 06 IS THE CLEANEST CONTROL IN THE FILE and it settles the grammar question. Its stage
     direction has the IDENTICAL SHAPE to beat 08''s -- "GUARD 2 turns over a clipboard made of bark
     and reads" against "Guard 2 lowers the clipboard and points at the scavenger''s belly" -- and its
     `done_when` asks for ONE guard, and the beat SHIPS off a ONE-GUARD scene plate
     (`beats.06.round_3_result`). Nobody ever thought beat 06 needed both guards. There is no reading
     of the script on which 06 takes one and 08 takes three.
  4. THE SCENE IS NOT A LOCKED THREE-FIGURE MASTER AND ALREADY PROVES IT. Beat 09, which sits BETWEEN
     these two, is "Guard 1''s face works through it, slowly" and its `done_when` is "close on Guard
     1''s face" -- ONE figure. The stretch alternates coverage. A three-figure requirement on 07 and
     08 would be inconsistent with the shot sitting between them.
  And beat 07 is a THREE-SECOND shot (0:34-0:37), the shortest in this stretch, against the cycle-007
  taste note in node.md: "a cut every 4.5s, one speaker each, and every beat''s camera is on the
  referent of its line."

  WHAT THIS REMOVES. The three-figure blocker on beats 07 and 08 is gone; it was never in the script.
  The count objection against `farm-out/ep2-b0708-twofig-mac-0815/08-inside-him-twofig-mac-r3-s0.png`
  is WITHDRAWN -- that plate holds THE RIGHT PAIR for beat 08 (an adult guard and the adult goblin,
  same depth plane, adjacent, "belly reachable by an extended arm", board face clean), and its own
  bar''s "Three or more figures fails" was never in tension with the script, only with a `done_when`.

  WHAT THIS DOES NOT CERTIFY, AND IT WILL BE OVER-READ IF THIS IS NOT SAID. NEITHER BEAT IS UNBLOCKED
  BY THIS RULING; ONLY THE COUNT IS SETTLED. (a) That plate''s guard is BALD, and
  `guard_plates_are_miscast_0816` establishes that NEITHER APPROVED GUARD IS BALD -- A has dark
  cropped hair and wire-rim glasses, B has light sandy hair. It is miscast at the first attribute a
  viewer reads off a human being, exactly like the seventeen prompts that finding was about. (b) Beat
  07''s guard is GUARD 1, who has no clipboard: a plate cast as the board-holding guard is the wrong
  man for it, so beat 07 wants its own two-figure plate. (c) `beats.07` is separately GATED by the
  character-first ruling (`corrections_to_the_brief`). SO THE REMAINING WORK ON BOTH BEATS IS A CAST
  PROBLEM ON A TWO-FIGURE COMPOSITION THAT ALREADY RENDERS -- not a three-figure composition that has
  never existed. That is a materially smaller and better-understood piece of work, and naming it
  correctly is the whole value of this entry.

  THE THREE QUEUED PROBES ARE UNAFFECTED. `ep2-b08-twofig-both`, `ep2-b08-twofig-armonly` and
  `ep2-b07-twofig-turn` ask whether a gesture binds to the GUARD once both figures are fixed by an
  init -- in text-to-image it did not, a pointing arm attaching to the goblin 3 of 3 and a board 9 of
  12 however worded. They are `is_show_content: false` ENGINE PROBES AND ARE NEVER TO BE CUT IN.
  Their question is orthogonal to this one and this ruling neither answers nor cancels it.

  SCOPE, stated because this is a definition edit and not a taste call. Which figures a beat''s own
  script requires in frame is a reading of the founder''s text, and it is corrected here against that
  text with the text quoted. It is NOT a taste-axis score, NOT a trunk/graft call and NOT a pick
  among takes (R4). If the founder reads beats 07 and 08 as three-figure shots his reading governs
  and this entry is superseded in turn -- but nothing in the script as written asks for it, and the
  two `done_when` clauses were authored retroactively by a steward on 2026-08-15, by their own
  admission, not by him.'
