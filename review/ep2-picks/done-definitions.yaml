    FROM THE PLATE - the near guard''s bald scalp fills in with dark hair CONTINUOUSLY across f16-f21".
    The plate asked for bald, the model grew dark hair, and dark hair is what guard A actually is: WE
    RECORDED THE RENDER DRIFTING TOWARD THE APPROVED CAST AS THE DEFECT. The take is still broken - a
