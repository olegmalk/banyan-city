coldread_period_caveat_0815:
  date: '2026-08-15'
  status: caveat on applying the tool, NOT a bug in the tool
  what: pipeline/coldread_frames.py parity-collapses its difference series with a sliding max of WIDTH
    2, which is what removes a period-2 stutter. The 121-frame picks stutter with PERIOD 3, so the collapse
    does not close their gaps and the longest-run window search terminates early. On beat 12 it reported
    the motion ending at pair 31 when the clip animates all the way to f120; trimming on that reading
    would have deleted three quarters of the content.
  why_it_is_not_a_bug: The width-2 collapse is calibrated to the 97-frame frozen recipe, where it is correct.
    The error is applying it across recipes without checking the period first.
  rule: 'Before trusting a window from this tool on any clip that is not the 97-frame recipe, measure
    the cadence period, and check the window against a distance-from-window-end curve before cutting anything
    on it. Measured periods on the 0813/0814 121-frame picks: b12 reads 9.59x, b05 3.78x, b10 3.58x.'
  already_recorded_at: trim_pass_0815.results.12.why_stopped and .generalises. Restated here as a standing
    caveat because the next lane to pick the tool up will look for it beside the trim results, not inside
    one beat's entry.
  period_correction_0815: 'MEASURED, and the caveat above overgeneralises. "The 121-frame picks stutter
    with PERIOD 3" is true of b12 and b06 but FALSE of b05 and b10. Method: drop pair 0 (restyle flash),
    then split the raw per-pair MAD series into P phases for P in 2,3,4,5 and take loud/quiet phase-mean
    ratio, plus autocorrelation of the mean-removed series. Results - b05: period 2 (phase means 2.83/10.87
    = 3.84x, autocorr peak at lag 2; period-3 split is flat at 1.10x). b10: period 2 (1.65/5.80 = 3.52x,
    autocorr peak at lag 2; period-3 split flat at 1.06x). b06: period 3 (phase means 0.82/5.04/0.58 =
    8.75x, autocorr peak at lag 6, a multiple of 3). So the figures already in the record - "b12 9.59x,
    b05 3.78x, b10 3.58x" - are coldread''s own period-2 cadence statistic, and for b05 and b10 that is
    the RIGHT statistic: they are exactly the period-2 case the width-2 collapse was built for, and their
    reported windows (b05 pairs 1-119, b10 pairs 1-93) are sound. b06 IS period 3, so its reported window
    1-42 had to be checked - and it survives the check: the distance-from-window-end curve drifts only
    3.6 MAD across the 78 frames after f43, i.e. its tail is genuinely dead, unlike b12 where the same
    check found 30 MAD and invalidated the window. Practical rule unchanged: measure the period per clip,
    never per recipe generation, and always verify with the distance curve.'
