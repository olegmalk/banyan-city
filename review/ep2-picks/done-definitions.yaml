        two reads flatly disagree.
    '10':
      set: V
      pick: ep2-b10-pairB-0814
      frames_read: f110-f119, ten consecutive
      score: 7/10 - LEAST CHANGED of the three
      ordinary_viewer_test: '"Yes, with a beat of hesitation on the younger one."'
      what_holds: The adult is "nearly a direct match" - jaw, brow and narrow eyes survive intact. Costume
        holds throughout, and there is NO badge and NO chest tab in this set.
      identity_fault: The younger figure "has aged up several years in the drawing" - narrower longer
        face, smaller more angular eyes, sharper chin. The reader marked this MORPHOLOGY, beyond what
        the head turn explains.
      prop_fault: Both reference props are replaced by a SINGLE BLANK ORANGE-TAN BOARD held jointly by
