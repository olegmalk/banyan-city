  reconciliation:
    escalation_ruling_stands: CONFIRMED, NOT OVERTURNED. None of the three is a beat-11 case. Beat 11
      scored 1/10 with a character plainly replaced mid-clip; these score 5, 6 and 7, and on the ordinary-viewer
      test the blind reader answered "yes-but", "yes-but" and "yes" - never "no". The sighted lane reached
      the right escalation call on the weaker instrument, and the blind read is what makes that call safe
      to keep. All three remain SHIP WITH FAULT NAMED. No beat moves to broken on this read.
    named_faults_are_understated_and_are_extended_here: 'The escalation call survives; the fault descriptions
      do not. The sighted ruling''s faults are thinner than what the blind reader found, and these additions
      are part of the shipping record for each beat: (05) the older figure is DE-AGED, marked morphology
      and the largest single change in the set, not merely "softer-drawn"; (06) EYE COLOUR flips blue
      to dark brown, marked morphology, plus a background figure the reader says is missing entirely;
      (10) the YOUNGER figure is AGED UP, marked morphology beyond the head turn; and on ALL THREE the
      props are reassigned or replaced - swapped hands on 05, a different object on 06, both props collapsed
      into one shared board on 10. Prop identity is not currently a clause in `standard_0815.a_beat_is_DONE_when`;
      on this evidence it drifts as reliably as faces do, and three of three picks fail it.'
    contradiction_on_beat_06: 'RECORDED AS A DISAGREEMENT, NOT RESOLVED. The sighted ruling stated that
      no figure loses its count on beat 06. The blind reader states the opposite about the reference side:
      "the reference has a SECOND, smaller figure standing in the right background, back turned, arms
      raised holding up a phone or tablet. That figure is absent from all ten frames." Both readings are
      on the record above and neither is being deleted. LIKELY EXPLANATION, offered as a hypothesis and
      not as a finding: these are different claims about different things - the sighted lane was reading
      count WITHIN the ten frames, where nothing appears or disappears, while the reader is comparing
      frames to the PLATE, so this would be the RENDER not matching its init plate rather than drift inside
      the clip. That is plausible and it is unverified. WHAT WOULD SETTLE IT: open ep2-b06-scene-0814r''s
      init plate and its frames f34-f43 and COUNT THE FIGURES in each - one look decides it, costs nothing,
      needs no render. Until someone does that, beat 06 carries an open question and not an answer.'
    sampling_caveat_do_not_read_as_a_defect: 'The reader found sets N and V "completely static" across
      their ten frames. Those sets were sampled at f110-f119, the TAIL of 121-frame clips, where stillness
      is expected and is what the trim pass already measured - `trim_pass_0815.results.05` and `.10` both
      record long decels into a dead tail. This is NOT evidence of a frozen clip and must not be logged
      as a new fault. It IS a caveat on the read itself: ten frames from the tail can test identity against
      the plate, which is what was asked, but they cannot test whether identity drifts DURING the action,
      which is how beat 11 failed at f16-f21. The one set sampled mid-clip, R at f34-f43, is the only
      one of the three whose read covers moving frames.'
  corroboration_shared_plate_n_and_v: 'WORTH THE RECORD: with no filenames, no hashes and no statement
    that the sets were related, the reader independently observed that "N and V share the identical reference
    image (same file, byte-for-byte size, visually identical)". That matches the md5 finding that beats
    05 and 10 were conditioned on the SAME init plate. Two consequences. First, it is a check on the read
    - a reader who spots a shared conditioning image unprompted is looking at the pixels, which is some
    evidence the rest of the report is too. Second, and this is the operational one: the "younger and
    softer" fault that beats 05 and 10 have both carried as an open cross-beat question (`beats.05.open_question`
    says "the same one as beat 10 ... ONE answer settles both beats") is now attributable to ONE PLATE.
    It is one fault, not two, and one plate fix addresses both beats.'
  what_this_does_not_cover: Five other blind readers never returned; this is ONE reader's verdicts, on
    three sets, ten frames each, two of the three sampled from the dead tail. It is enough to keep the
    no-escalation call and to extend the named faults. It is not a two-reader confirmation and is not
    recorded as one.
spurious_chest_marking_0815:
  date: '2026-08-15'
  status: SYSTEMATIC RENDER ARTIFACT - filed as one pattern, not three incidental faults
  finding: 'A CHEST MARKING THAT IS NOT IN THE PLATE NOW APPEARS IN THREE BEATS. Beat 05: an orange horizontal
    tab on the LEFT CHEST of BOTH figures in every frame read, absent from the reference. Beat 06: a yellow-gold
    round badge on the LEFT CHEST in every frame read, absent from the reference. Beat 11: the materialising
    yellow badge already on the record around f34. Same body location, same class of object, three different
    beats, all on the 0814 guard recipe.'
  why_it_is_filed_as_one_thing: Recorded separately these read as three cosmetic nits, each too small
    to hold a beat. Recorded together they are one behaviour of the recipe - it invents insignia on a
    tunic chest - and that is a single addressable cause. One fix would clear all three. Filing it as
    three incidental faults would guarantee nobody ever fixes any of them.
  it_also_moves_beat_11: Beat 11's badge was logged as an oddity of a clip that was already broken for
    a different reason. With 05 and 06 beside it, it is not an oddity of that clip - it is the same artifact
