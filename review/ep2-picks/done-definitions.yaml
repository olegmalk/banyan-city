  - Why guard beats have resisted every lever thrown at them. Identity-drift levers were being tuned
    on plates that never specified an identity to hold.
  second_instance_of_one_failure_mode: 'The reference sheets DID move off bald on 2026-08-12 - ep2-charref-guards-r4/-r5
    is where "short hair, visible face" first appears, and that is the lineage the approved guard A came
    out of. It was never propagated to a single staged beat plate. That is the same shape of defect as
    the one that opened this day: a decision made in one place and not carried to the records that act
    on it (see `guards_CORRECTION_0816.why_this_entry_exists`). Two instances in two days, one failure
    mode.'
  scope_of_the_remaining_work: 'FIVE staged plates must be drawn of the approved pair - beats 05, 09,
    10, 11 and 06 - plus beat 08, which is a different and harder problem: it needs a two-figure guard+goblin
    REFERENCE first, and nothing on disk has both. Beat 11 goes first: it is pure whole-body motion, which
