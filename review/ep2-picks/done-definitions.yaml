# TONIGHT'S TARGET, written BEFORE the rounds it governs (2026-08-14).
#
# The record this answers to: today produced roughly a hundred renders and ZERO finished beats.
# A loop aimed at "better" produces understanding. Tonight is aimed at DONE.
#
# DONE means: one clip I would put in the cut and defend. Not a pool, not an improvement.
# Five conditions, all of them, per beat:
#   1. ACTION      - the scripted action actually happens, in the clip, legibly.
#   2. CONTENTS    - everything the beat names is present AND recognisable to a stranger
#                    (the fig standard: a predicate list is not recognition).
#   3. SCENE       - the world is there from FRAME ONE. No arrival, no iris, no dissolve.
#   4. CONTINUITY  - character and costume hold for the whole clip; nobody is redrawn.
#   5. NO APOLOGY  - no artifact I would have to excuse when handing it over.
#
# STOPPING RULE: three rounds per beat tonight. A fourth is not allowed; park it instead,
# with the specific reason and the named next lever.
# NO NEW MECHANISMS after midnight. Proven levers only: dominant action clause, named contents
# with features, positions not relations, scene in the plate, cast wording, frame-one facts.

