  count_asking_for_bald: 14 of 17 contain `bald` or `bare heads`. The three that do not are all from
    2026-08-12 and all on beat 06 - ep2-b06-ipa-guardcast-0812 ("a round short-haired guard man"), ep2-b06-ipa-guardref-0812
    ("a round guard man in mismatched armor") and ep2-charref-guards-r4-0812/-r5 ("short hair, visible
    face").
  why_that_is_decisive: 'NEITHER APPROVED GUARD IS BALD. Guard A has dark cropped hair; guard B has light
    sandy hair. pipeline/wave-drafts.yaml says so in its own words while authoring the cast: "`no hair,
    no wig` -- that is what made the goblin bald and THE GUARDS NEED HAIR." So `bald` was never drift.
    IT WAS ASKED FOR, 14 times, and every staged guard picture in this repo differs from the approved
    cast in the first thing a viewer reads off a human being - and the one thing still legible when a
    man is facing away. This is a CONTRADICTION between our plates and our cast, not merely a gap in
