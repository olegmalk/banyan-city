    open_question_ANSWERED_0816: 'THIS IS THAT ANSWER, AND IT SETTLES MORE THAN TWO BEATS. `open_question`
      above is left standing unedited. The cross-beat inconsistency is not a taste call and never was
      a taste call: it is that NO GUARD PLATE WE OWN NAMES THE CAST, so each plate independently improvised
      a different man and the beats disagree with each other for the same reason each one disagrees with
      the approved sheet. Evidence, from a sweep on 2026-08-16 of every farm-out/*/NN-*.yaml sidecar for
      beats 05, 06, 09, 10 and 11 - 17 distinct prompts across 20 output dirs: 0 OF 17 name any approved-cast
      attribute (tested for `dark cropped hair`, `dark hair`, `sandy`, `blond`, `tan tunic`, `cream`, `wrap
      skirt`, `glasses`, `wire-rim`; zero hits), and 14 OF 17 ask for `bald` or `bare heads`. Beat 05''s
      own six prompts are all of the "two round guard men in plain brown tunics ... silly harmless bureaucrats
      with round soft bodies and bare heads" family. NEITHER APPROVED GUARD IS BALD - A has dark cropped
      hair, B has light sandy hair - and pipeline/wave-drafts.yaml says so in its own words while authoring
      the cast: "`no hair, no wig` -- that is what made the goblin bald and THE GUARDS NEED HAIR." So this
      settles beats 05, 06, 07, 09, 10 and 11 at once, and the answer is a plate answer, not a taste answer.
      See `guard_plates_are_miscast_0816` at the top level of this file.'
    shipping_fault: the two guards read younger and softer-drawn than the guards in beats 06 and 11
    understandable: UNFINISHED
    understandable_reason: the guards read young. A viewer still sees two guards arrive and scan a field
      - the beat happens.
