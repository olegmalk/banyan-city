action_vs_script_audit_0815:
  what: Checked the actions I authored for the scene-plate wave against the beat lines in node.md, which
    I should have done before authoring and did not.
  beat_06: 'MISMATCH. Script: "Guard 2 lowers the clipboard and points at the scavenger''s belly" for
    INSIDE HIM, and beat 06 THE CLIPBOARD requires the guard to turn the bark board over and read off
    it. I authored "one of them lifts his head from the board and looks out across the field." A look-up
    is not turning a board over and reading.'
  beat_07: 'MISMATCH. Script: Guard 1 POINTS at the scavenger, decisive. I authored "his head lifts and
    his eyes widen as he closes his hand around the sprout." There is no sprout-grab in this beat at all;
    the sprout came from my own earlier action dict, not from the script.'
  beat_09: 'MATCHES. Script: "Guard 1''s face works through it, slowly." I authored "his head lifts and
    his eyes widen", which is that thought crossing a face and is consistent with the recorded done_when:
    close on Guard 1''s face working through the thought.'
  why_it_happened: I wrote these actions to satisfy the staging law — keep the face toward a high-angle
    lens, so lift the head rather than fold — and never re-read what the beat was supposed to show. The
    staging law is a constraint on HOW to stage an action, not a licence to choose a different one.
  consequence: Beats 06 and 07 cannot be DONE on these takes however well they read, because a well-executed
    wrong action is still the wrong action. Beat 09 is judgeable on its merits.
