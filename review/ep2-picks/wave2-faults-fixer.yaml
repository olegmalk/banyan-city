  - name: stitched skull and stitched face
    count: 4/4
    detail: >-
      X-stitches and dashes across the crown in all four, plus a full baseball-seam
      suture down the side of the skull in s1, and X marks on the cheeks in 4/4.
      At close-up size he reads as a sewn doll rather than a goblin.
  lever: >-
    The PROVEN ban, propagated verbatim from the beat-02 r2 that just came back
    clean: `no scars, no stitched skin`. Nothing else changes -- the staging, the
