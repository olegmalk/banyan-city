# wave2-faults-fixer.yaml -- the FIXER lane's own verdicts on the 16
# identity-frozen rounds rendered 2026-08-12 (`farm-out/ep2-bNN-idfix/`).
#
# WHOSE EYE THIS IS. These are the STEWARD's readings, not the founder's. He has
# ruled on beats 02/03/04/05 only; everything here is judged against the three
# things he did fix -- the frozen goblin (green skin, BALD, patchwork cloak), the
# guards (plain brown tunics, round, bare heads, faces visible, NO armor -- he
# rejected armor outright), and each beat's own staging sentence as SENT (read
# from the render sidecar, not from the draft, so a stale draft cannot lie here).
# A taste verdict is R4 and stays his: `faulty` below means a stated predicate is
# measurably absent or a banned object is measurably present, never "I dislike it".
#
# One record per beat, appended and COMMITTED as each beat is read, so a lane
# death costs at most the beat in hand.

lane: fixer (third spawn, 2026-08-12)
source_rounds: farm-out/ep2-bNN-idfix/  (4 frames each, seeds s0..s3)

beats:

- beat: 2
  slug: the-sprint
  variant_rendered: authored_staged_med_occl_hide_r2
  positive_tokens: 72
  verdict: faulty
  identity: green skin 4/4, bald 4/4, patchwork cloak 4/4, one goblin 4/4, not pale 4/4
  faults:
  - name: stitched scalp and stitched face
    count: 4/4
    detail: >-
      Every frame sews the cloak's patchwork INTO THE CHARACTER. s0 carries a
      tan oval graft stitched across the crown, s1 a pale crown with X-stitches,
      s3 a vertical sutured seam down the middle of the skull; s0, s2 and s3 add
      red stitch scars on the cheeks. The bald head he ruled for is present, but
      it arrives as Frankenstein surgery. `patchwork` is a CLOAK word that has
      migrated to skin -- his beat-04 sentence for the same class of drift was
      "character consistency".
  - name: the sapling he cowers behind is absent
    count: 0/4
    detail: >-
      The sentence sent asks for a tiny sapling with "its thin stem in front of
      him" and "his face peeking around it". No frame puts a stem between the
      camera and the goblin: s0 and s2 replace the one sapling with a whole bed
      of generic seedlings, s1 parks a stem at the right frame edge well clear
      of him, s3 sits him in tall grass with a seedling low in the foreground.
      This is the known sapling-next-to-figure limit (commit bdcb1a2a read it as
      absent from all eight goblin frames) -- ONE r2, then it goes to the founder.
  lever: >-
    Two channels. (1) Unwanted object -> negative ban, worded so it cannot negate
    what the positive asserts: the positive says `patchwork cloak`, so the ban
    must name SKIN and HEAD, never the bare word `stitches` -- `no scars, no
    stitched skin, no sutures, no bandage` leaves the cloak's patchwork intact.
    (2) Missing object -> early affirmative, paid for out of mood words: `Medium
    shot, morning light` funds putting the sapling stem in the FIRST clause,
    ahead of the goblin, the placement `authored_b04_fieldban` proved for the
    same omission class.
  r2: authored_b02_idfix_r2  (spec ep2-b02-idfix-r2-0812, out-b02-idfix-r2)

- beat: 3
  slug: bad-cover
  variant_rendered: authored_b03_field_solo_r2
  positive_tokens: 72
  verdict: faulty
  identity: green skin 4/4 on the FACE, bald 4/4, patchwork cloak 4/4, one goblin 4/4
  faults:
  - name: the bald crown renders pale cream, not green
    count: 2/4 (s0, s3 -- s3 severe)
    detail: >-
      s3 draws the whole skull dome cream-white above a green face, with blank
      pupil-less white eyes; s0 puts a tan crown on a green face. This is HIS
      NAMED BEAT-03 FAULT -- "making the goblin compeltely white" -- returning in
      a localised form. READ THE NEGATIVE BEFORE BLAMING THE BAN: `pale skin` WAS
      SENT (sidecar negative, 76/77, only `tall tree` removed). The ban reached
      the model and did not bind, because the model keeps the FACE green and pales
      only the CRANIUM. A term that already failed is not worth sending harder;
      this needs an affirmative that names the scalp.
  - name: stitched scalp and stitched face
    count: 3/4 (s0, s1, s3)
    detail: >-
      The same fault beat 02 shows 4/4: a vertical sutured seam down the crown
      (s1, s3), a bordered tan graft (s0), red stitch-scars on the cheeks (s0).
      `patchwork` is a CLOAK word migrating to skin. Two beats now share this, so
      it is a recipe-level drift and not one beat's bad seed.
  - name: forest in an open-field beat
    count: 2/4 (s3 clear mature trunks, s0 blurred trees)
    detail: >-
      The positive says "an open grassy field"; s3 draws woodland with mature
      trunks. The anti-big-tree tier that would have caught this (`forest`,
      `thick trunk`, `bush`, `shrubbery`) is DROPPED from this beat's sent
      negative -- only `tall tree` is recorded as removed, but the sent list
      shows the whole tier is absent.
  - name: the sapling he crouches behind is absent
    count: 0/4
    detail: >-
      The sentence asks him to crouch "behind the pencil-thin stem of a tiny
      sapling that hides none of him". s1 and s2 have no sapling at all; s0 has
      him HOLDING a sprout in his fist instead of hiding behind it; s3 scatters
      seedlings nearby. Same sapling-next-to-figure limit as beat 02 -- ONE r2,
      then the founder.
  lever: >-
    (1) Pale crown -> AFFIRMATIVE, because the negative already failed: `his bare
    scalp green` goes in early, right after the identity clause. The def itself is
    FROZEN and is not touched. (2) Stitched skin -> the same skin-and-head ban
    beat 02 is testing tonight, `no scars, no stitched skin`, worded so it cannot
    negate the `patchwork cloak` the positive asserts. (3) Both are paid for out
    of the authored chain, not added on top of a full negative: `no indoors`
    retires and `no house` -- the term that carries his named fault -- stays.
    Multi-fault is defensible on THIS beat by his own precedent: each fault has a
    separately visible predicate, which is the argument `authored_b03_field_solo`
    already made for answering his three at once.
  r2: authored_b03_idfix_r2  (spec ep2-b03-idfix-r2-0812, out-b03-idfix-r2)
  note_for_b02: >-
    Beat 02's r2 was already queued when this pale-crown pattern became legible
    across two beats, and it bans the stitches WITHOUT the scalp affirmative. It
    is left alone rather than raced against the runner: it now reads as the clean
    test of whether the pale dome is a separate channel from the sutures.

# ── RESULT OF THE FIRST r2, READ OFF THE FRAMES ───────────────────────────────
# This closes the loop the prediction opened. It is the reason every goblin beat
# after this one gets the same two words.

- round: ep2-b02-idfix-r2-0812
  read_from: origin/farm-results-rtx5090 farm-out/ep2-b02-idfix-r2/ (4 frames)
  shipped_recipe_confirmed: positive 69/77, negative sent 77/77 with `scars` and `stitched skin` both present
  verdict: the ban WORKED, and it worked without collateral
  measured:
  - stitched scalp GONE 4/4 -- every crown is unbroken green; no graft, no suture line, no seam
  - the pale cream dome GONE 4/4 -- the crown is green, not tan. IT WENT WITH THE STITCHES, so the pale patch and the sutures were ONE fault (fabric on the skull), not two
  - patchwork cloak SURVIVED 4/4 -- s2 still shows stitched seams ON THE CLOAK. The wording discipline held: naming SKIN did not negate what the positive asserts
  - cheek stitch-scars reduced from 4/4 to about 2/4, and much fainter (s0 one line, s3 one mark)
  - the sapling READ as a distinct stem with leaves beside him in s1 and s2 (2/4, the predicted `>=2/4` -- HIT); s0 and s3 fall back to a seedling bed
  - hands at chest, nothing grabbed or uprooted 4/4 -- retiring the whole grab tier to pay for the new bans cost nothing, as predicted
  - green skin, bald, one goblin, bright daylight all 4/4
  consequence: >-
    `no scars, no stitched skin`, paid for out of the authored chain rather than
    added on top of a full negative, is now a PROVEN one-variable lever on this
    checkpoint and is propagated to the remaining goblin beats. The scalp
    AFFIRMATIVE that beat 03 is testing separately is NOT needed for this fault --
    the ban alone cleared the pale dome — so it is not stacked on top of it.
  sapling_note: >-
    2/4 is real improvement but not a fix. Beat 02 has now had its one r2 on the
    adjacency limit; the remaining shortfall goes to the founder rather than to a
    third round.

