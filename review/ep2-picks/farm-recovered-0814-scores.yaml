      Scene-carrying plate sheet for beat 11 "they-leave". Same harness, mechanism,
      reference and settings as b05 and b09: 4 IPA rounds x 4 seeds, Animagine-XL-3.1,
      832x1216, 40 steps, IPA Plus 0.6 on the first 15%. One prompt across all 16
