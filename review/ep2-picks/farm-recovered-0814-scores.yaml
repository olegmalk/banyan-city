    spec: pipeline/jobs/ep2-b11-scene-0814.yaml
    dated: 2026-08-14, stills-drafts lane
    render_path: CUDA/bf16, rtx5090, local-gpu, $0.00
    prompt_as_sent: >-
      "2boys, two adult guard men in brown tunics and sashes walk away from camera
      across green summer grass, a hedge and dark treeline behind, pale morning sky
      above, gesturing at each other, growing smaller."
    bar_scored_against: >-
      THE SET'S OWN SPEC: "the world present, the cast/plant on-canon", pass being "a
      usable frame-one for motion". The spec's `why` names the shot: "2 guards walking
      away, growing smaller." I read "usable frame-one for motion" as including that
