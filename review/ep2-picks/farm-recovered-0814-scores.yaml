      this_is_the_failure_the_spec_named: >-
        MOST DECISION-RELEVANT ITEM IN THIS SET. The spec wrote its own contingency:
        "The failure worth reporting is the world absent, which would mean the scene
        clause is still losing to the reference on this beat and it needs the bootstrap
        route rather than a re-run." 13 of 16 cells are world-absent. By the spec's own
        rule, beat 09 is a BOOTSTRAP-ROUTE beat, not a re-run beat. A second wave of the
        same job at the same settings is predicted to fail the same way.
      round_framing_is_deterministic: >-
        The rounds split cleanly by framing: r0 and r2 are full-body, r1 and r3 are
        busts. Every cell that carries any world at all is in r3. Framing is a property
        of the round, not the seed — the same structural finding b05 produced, with a
        different winning round (b05: r1; b09: r3). So there is no single "good round"
        to carry across beats; the round interacts with the beat's shot size.
      the_negative_prompt_lost: >-
        `white background`, `plain background` and `character sheet` are ALL in the
        negative prompt as sent, and 13 of 16 cells are character-sheet-style figures on
        exactly those backgrounds. This is a measured instance of a negative term
        failing to hold against the IP-Adapter reference, which is itself a
        plain-background wave-1 frame. The reference is the likely source: conditioning
        the structure-forming steps on a plain-background image installs the void before
        the text ever gets a vote.
      cast_reads_young: >-
        The faces across all 16 read adolescent rather than adult. b09's prompt says
        "a guard man" and does NOT carry the `adult` token that b05's and b11's prompts
