# Verdicts for the ELEVEN RECOVERED SETS — the 60 scene/wave PNGs plus clips that
# were rendered 2026-08-12/14, pushed to branch `farm-results-rtx5090`, and stranded
# there because nothing in the pipeline merges that branch back to main. Recovered in
# commits 9da6738f / 8d066666 and read for the first time here, 2026-08-17.
#
# WHY THIS FILE AND NOT cast-0817-scores.yaml: these are DIFFERENT, OLDER renders of
# several of the same beats. `review/ep2-picks/cast-0817-scores.yaml` holds today's
# `-cast-0817` rungs (scored `N of 12`) for beats 5, 9, 11 among others. Conflating the
# two records would corrupt both. Both that file and done-definitions.yaml were clean
# in this worktree when this lane started, but the recovered sets are a separate
# provenance line, so they get a separate file this lane owns.
#
# METHOD, held constant for every set below:
#   * Each set is scored against ITS OWN spec's `success:` clause, quoted verbatim per
#     set. Where a set predates a ruling that is now canon, that is recorded as
#     `canon_now` and NOT charged against the set's score. Bars are tightened forward
#     only.
#   * Distinct counts are sha256 of the PNG bytes, computed in this worktree, not
#     trusted from the file count. Today's cast-0817 batch was 16 files / 12 distinct
#     (r3 byte-identical to r0) from a stale sampler; that defect is ABSENT here.
#   * Counts are out of the distinct total.
#   * Picks-with-reasons are the steward's. Taste is R4/founder's alone. Nothing here
#     is promoted to a shipping plate.
#   * Render path is recorded with every colour claim: all of these are CUDA/bf16 on
#     the rtx5090, which renders red where MPS renders purple off an identical seed
#     (MAE 60-61). No colour verdict below is portable to the MPS path.

lane: farm-recovered-reader, 2026-08-17
source_branch: farm-results-rtx5090
recovery_commits: [9da6738f, 8d066666]
integrity: 155 tracked files, sha256-verified against each set's own manifest on both
  sides of the transfer (0 missing, 0 mismatched, 0 undeclared). Re-hashed here.

sets:

