    findings:
      round_is_the_variable_not_the_seed: >-
        The pass rate is almost entirely a property of the ROUND, not the seed. r1 is
        4 of 4. r0 is 2 of 4. r2 is 0 of 4. r3 is 1 of 4. Whatever changed between the
        IP-Adapter rounds moved framing wholesale, and r1's setting is the one that
        put the world in frame one on every seed it was given.
      r2_is_a_crop_scope_failure_not_a_world_failure: >-
        All four r2 cells fail the same way and it is not that the scene clause lost to
        the reference — grass is still there. The FRAMING collapsed to a head-and-
        shoulders two-shot. The spec anticipated "world absent, which would mean the
        scene clause is losing to the reference"; r2 is a different fault than the one
        the spec was watching for, so it does NOT trigger the bootstrap route the spec
        prescribes.
      cast_fix_was_already_in_this_prompt: >-
        DECISION-RELEVANT. This 08-14 prompt already carries the cast fix. Verbatim
        positive: "2boys, two adult guard men in brown tunics and sashes walk in green
        summer grass, a hedge and dark treeline behind, pale blue morning sky above,
        short brown hair, one holding a bark clipboard." No `bald`, no `round`, no
        `soft`, no `silly harmless bureaucrats`. `short brown hair` is asked for
        positively. So this set is NOT one of the 14-of-17 older plate prompts that
        asked for `bald`.
      one_bald_survived_anyway: >-
        1 of 16 cells (r3s0) still renders a bald guard off a prompt that never says
        `bald` and positively asks for `short brown hair`. This is consistent with the
        proven broadcast-class attribute law rather than contradicting it: the token is
        absent here, so the bald head is model prior leaking through, at a 1-in-16 rate
        once the token is gone versus the near-total rate seen when it is present.
        Counted, not re-diagnosed.
      sidecar_header_is_stale: >-
        Every sidecar in this set opens "ONE SAMPLE of a CONSISTENCY MECHANISM on beat
        04" and carries a `goblin_definition_as_sent: green skin, bald head` field.
