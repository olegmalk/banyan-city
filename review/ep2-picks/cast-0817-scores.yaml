# Scores for the seven cast-correction rungs ep2-b05..b11-cast-0817.
# Written 2026-08-17 by the scoring lane. NO RENDERING was done: every frame
# scored here already existed on the box when this lane opened.
#
# WHY THIS FILE AND NOT done-definitions.yaml: the brief said to record verdicts
# in a file this lane owns if done-definitions.yaml was mid-write by a peer. It
# was clean at open, but ~30 peer lanes are live this shift and one lane has
# already lost this exact verdict set three times today by batching. These
# verdicts are therefore written to a file with a single writer and committed one
# beat at a time. done-definitions.yaml was READ, not written: every beat's
# `done_when` below is quoted from it, not from the dispatch summary.

denominator:
  report_as: N of 12
  reason: >-
    refs-guards-twoinfield-nos2-0815 holds 3 DISTINCT images in 4 slots (s0 and
    s3 byte-identical), so cell r3 is a redraw of r0 and carries no independent
    evidence. Each beat writes 16 png of which 12 are distinct.
  verified_independently_by_this_lane: >-
    sha256 of all 112 png across the seven beats: every beat is exactly 12
    distinct hashes, and r3 == r0 at all four seeds on all seven beats, zero
    mismatches. The corrected denominator is confirmed, not taken on trust.
  not_a_loosening: >-
    12 was always the true count. Not one term of any bar is altered here; only
    the denominator, which was miscounted. Every r3 frame was skipped.
  duplication_is_not_a_fault_of_these_plates: >-
    The 4 wasted cells per beat came from a five-days-stale sampler on the box,
    fixed 2026-08-17 (`dedup_cells`). Pre-existing defect, not scored against
    these plates.

render_path_for_the_record:
  host: rtx5090 box
  precision_device: bf16 / CUDA
  model: animagine-xl-3.1
  colour_caveat: >-
    bf16/CUDA renders RED where MPS renders PURPLE off the identical seed (MAE
    60-61). Any colour reading below is a bf16/CUDA reading. The fruit is
    PURPLE, canon-wide and retroactive; no colour call here overrides that.

standing_limits_this_lane_respected:
  taste_is_not_mine: >-
    Picks with stated reasons are this lane's. Whether the LOOK is right is R4
    and the founder's alone. Founder cards are named, never pre-empted.
  no_diagnostic_rung_promoted: >-
    b05, b10 and b11 are marked in their own specs as diagnostic rungs no lane
    may promote to a shipping plate. None is promoted here regardless of score.

beats:

  '06':
    role: >-
      One guard (guard B), board INSIDE HIS OWN CLAUSE. The prop-ownership
      grammar the other rungs copy, and the only guard beat already shipping.
    done_when_quoted_from_done_definitions: >-
      the guard turns the bark board over and reads off it; board hand-sized and
      readable; field present at frame one; no white burst at the head of the clip.
    scored: 12 of 12 frames looked at (r0/r1/r2 x s0-s3), r3 skipped as a byte-copy of r0
    frames_clearing_EVERY_term: 0 of 12
    cast_holds: PARTLY -- the correction this batch exists for LANDED; other cast terms did not

    per_condition_rate:
      c1_exactly_one_adult_figure: >-
        6 of 12. Two figures at r0s2, r0s3, r1s0, r1s1, r1s2, r1s3 -- the whole
        r1 row plus half of r0. One figure at r0s0, r0s1 and all four of r2.
        The pre-registered fail mode "a second figure appearing" FIRES, 6 of 12.
      c1_adult_sub_reading: >-
        WEAK across the board. The man reads adolescent rather than adult in most
        cells -- soft face, slight build, and sneakers at r0s2 (green) and r0s3
        (orange). Not scored as an outright child, but the bar says "adult" and
        this is the honest reading.
      c2_light_sandy_hair_not_dark_not_bald: >-
        12 of 12. THIS IS THE FINDING. Every frame is light sandy/blond and NOT
        ONE is bald. The defect the whole batch was cut for -- 14 of 17 plate
        prompts asking `bald` when neither approved guard is bald -- is gone.
      c3_cream_short_sleeve_shirt: 10 of 12. r1s1 and r1s3 add long dark under-sleeves; r1s2 is a long robe.
      c4_white_sash_over_ONE_shoulder_not_waist: >-
        0 of 12, and this is the worst term. Where a shoulder band exists it is
        the WRONG COLOUR: dark brown at r0s0/r0s2/r0s3/r2s2, teal at r2s0, orange
        at r2s1, blue-striped at r0s1 and r1s2. Where it is absent the sash has
        gone to the WAIST: r1s0, r1s1, r1s3, r2s3.
      c5_broad_dark_brown_wrap_skirt: >-
        8 of 12. Brown and correct on all of r0 and all of r2. The r1 row renders
        the skirt CREAM/TAN rather than dark brown, 0 of 4.
      c6_board_in_BOTH_hands_reading_height_looking_down: >-
        9 of 12. r2s1 has the board OUT OF HIS HANDS entirely, lying in the grass
        behind him, hands clasped and empty. r2s2 has one hand only. r0s0 has a
        hand partly across the board's face.
      c7_hand_sized_flat_rectangular: >-
        6 of 12. r0s1, r0s2, r1s1, r2s0 and r2s1 render LUMBER -- long planks,
        one of them taller than the man. r0s0 also has an oversized plank standing
        in the foreground beside the held one.
      c8_surface_reads_as_ROUGH_BARK: >-
        0 of 12, unchanged from four earlier wordings. Every board reads as
        PLANED TIMBER -- sawn faces, straight cut edges, milled grain -- which the
        bar excludes by name, except r2s2 and r2s3 which read as PALE PAPER,
        which it also excludes by name.
      c9_grass_plus_hedgerow_plus_sky_all_real: >-
        8 of 12. The entire r2 row loses it -- those four are framed tight enough
        that there is no sky band at all. r0s3 has no clear sky either.
      c10_no_white_or_plain_bg_and_no_plan_view: >-
        No white or plain background anywhere, 12 of 12 on that half. The plan
        view is the problem: the r0 row is shot from a markedly HIGH DOWNWARD
        angle and r0s2/r0s3 are close to true top-down. 8 of 12.

    pre_registered_fail_modes:
      sash_migrating_to_the_waist: >-
        FIRED, 4 of 12 (r1s0, r1s1, r1s3, r2s3). The bar calls this the tell that
        the two men have merged, and it coincides with the r1 row also being the
        row that renders two figures -- consistent with a merge, not a coincidence.
      board_reading_as_paper: FIRED, 2 of 12 (r2s2, r2s3). Planed timber, also excluded, fired on 10 more.
      a_second_figure_appearing: FIRED, 6 of 12. The single largest defect on this beat.

    pick: >-
      r0s0, and it is a pick of the least-bad frame rather than a pass. Reasons:
      it is the only frame that holds ONE figure, sandy non-bald hair, a cream
      short-sleeve shirt, a dark-brown wrap skirt, a board in both hands at
      reading height with the eyes down, AND all three world bands at once. What
      it costs: the shoulder band is dark brown instead of white, the camera is
      high, and the board is planed timber rather than bark. Runner-up r2s0 has a
      cleaner read-down pose but loses the sky band and carries a plank.
    verdict: >-
      DOES NOT CLEAR ITS BAR -- 0 of 12 frames clear every term. But it is NOT a
      null result: the cast defect this rung was cut to fix is fixed 12 of 12
      (sandy, never bald), and the two remaining blockers are both OLD and both
      NAMED -- the bark-vs-timber prop wording (0 of 12, the failure that already
      cost four wordings and 23 inpaint samples and was only ever solved by
      COMPOSITING) and a white one-shoulder sash that has never bound (0 of 12).
    blocked_on: >-
      (a) the board: prompt wording is exhausted as an instrument here, the
      standing evidence says composite; (b) the white one-shoulder sash, which
      needs its own wording rung; (c) single-figure control -- the two-guard ref
      set is pulling a second man onto a one-guard beat.
    founder_cards_hit:
      - >-
        R4/taste: whether an adolescent-reading guard is acceptable at all is a
        taste call on the approved cast, not a scoring call. Named, not decided.
    not_shippable_reason: >-
      Its own shipping blocker (bark board) is untouched, so this does not
      replace the shipping pick ep2-b06-scene-0814r.

  '05':
    role: >-
      The only TWO-GUARD rung in the batch and the one beat that can show whether
      two DIFFERENT men can be specified at once at all. Eyewear deliberately
      omitted on both guards. Marked in its own spec as a DIAGNOSTIC RUNG no lane
      may promote to a shipping plate.
    done_when_quoted_from_done_definitions: >-
      two guards jog in together FROM FRAME ONE, stop, and scan; both adult men in
      tunic and sash; field present at frame one; neither redrawn mid-clip.
    scored: 12 of 12 frames looked at, r3 skipped as a byte-copy of r0
    frames_clearing_EVERY_term: 0 of 12
    cast_holds: >-
      ON THE TERM THAT MATTERED, YES -- and this is the most valuable single
      result in the batch. See c2.

    per_condition_rate:
      c1_exactly_two_whole_bodied_adults_neither_a_child: >-
        6 of 12. The entire r2 row fails outright -- those four are framed so tight
        that both figures are cropped to fragments (chest-up or less), so
        "whole-bodied" is lost 4 of 4. r1s1 additionally renders TWO EXTRA FIGURES
        standing in the midground, so that frame holds FOUR bodies, not two.
      c2_distinguishable_one_DARK_CROPPED_one_LIGHT_SANDY: >-
        7 of 12, AND THE MERGE DID NOT FIRE. This is the question the rung exists
        for and the answer is yes: r0s0, r0s1, r0s2, r0s3, r1s0, r1s3 and r2s2 all
        draw one genuinely dark-cropped man beside one genuinely light-sandy man.
        Two different men CAN be specified at once. Where the term fails it fails
        as BOTH LIGHT, at r2s0 and r2s1 only.
      c3_neither_man_is_bald: >-
        10 of 12. BALD CAME BACK at r1s1 and r1s2 -- both fully bare scalps on the
        dark-haired man's slot. On a rewritten plate that no longer asks for it,
        which makes it a residue of the reference set or the model's prior, not of
        the wording. Named, because `bald` is precisely the defect being corrected.
      c4_garments_correct_and_not_swapped_or_merged: >-
        0 of 12, the weakest term. Two distinct failures. MERGED, 9 of 12: both men
        come out in the same tan/cream tunic, so the "cream shirt + brown wrap
        skirt" half of the cast never appears at all. SWAPPED, at r1s0: both
        garments are present and correctly cut, but the WHITE WAIST SASH is on the
        SANDY man when it belongs to the DARK one, and the brown sash on the dark
        man when it belongs to the sandy one -- exactly inverted.
      c5_both_halted_facing_lens_four_hands_visible_and_EMPTY: >-
        3 of 12 (r1s0, r1s1, r1s3). The whole r0 row is MID-RUN -- legs off the
        ground, fists pumping -- so "standing/halted" is lost 4 of 4 there. Worth
        noting against the done_when, which asks the guards to "jog in together
        FROM FRAME ONE, stop, and scan": the r0 row is the jog, not the stop.
      c6_no_board_clipboard_slab_or_paper_anywhere: >-
        12 of 12, CLEAN. Nothing prop-like in any hand or on the ground in any
        frame. The negation held perfectly.
      c7_grass_plus_hedgerow_plus_sky_all_real_and_NOT_a_plan_view: >-
        4 of 12. Two separate causes. The r0 row carries all three bands but is
        shot from a markedly HIGH DOWNWARD angle against a bar that demands "eye
        level or near it", so the plan-view tendency is still there, 4 of 4. The r2
        row is at eye level but framed so tight and so shallow-focus that the
        hedgerow and sky bands are gone, 4 of 4. Only r1s0, r1s1, r1s2 and r1s3
        hold three real bands at eye level.
      c8_no_white_or_plain_background: 12 of 12, CLEAN. No white field or plain ground anywhere.

    pre_registered_fail_modes:
      two_men_rendering_as_ONE_man_twice: >-
        DID NOT FIRE where it could be tested. This is the headline. The merge this
        beat's prompts had never been able to test -- because they never asked for
        two different men -- was tested and did not happen: 7 of 12 draw two
        visibly different men. It fires only as "both light" at r2s0 and r2s1,
        2 of 12, in the row that is too tight to score anyway.
      an_object_appearing_in_an_unspecified_hand: DID NOT FIRE, 0 of 12. Every hand is empty.
      the_plan_view_returning: >-
        FIRED, 4 of 12, the whole r0 row -- high downward angle. `horizon` is
        negated nowhere and this is what that costs.
      eyewear_appearing_on_either_man_unprompted: >-
        DID NOT FIRE, 0 of 12. A clean negative and a real result to hand the
        binding lane: with eyewear named nowhere it appeared nowhere, on two faces,
        twelve frames. Eyewear does not arrive unbidden.
      unpre_registered_defect_found: >-
        FEMALE-READING SECOND FIGURE at r1s0, r1s2 and r2s1 -- feminine face, bob,
        and at r1s2 an off-shoulder garment. The bar says "two adult human figures"
        and "the two men", so this is inside the bar's terms and against them, but
        it was NOT pre-registered. Recorded here and TIGHTENED FORWARD ONLY: the
        next two-guard rung should carry an explicit male term. It is not scored
        retroactively against these frames.

    pick: >-
      r1s0, on reasons and with its cost stated. It is the only frame in the batch
      that simultaneously holds two whole-bodied figures, one dark-cropped beside
      one light-sandy, neither bald, both halted and facing the lens, four hands
      visible and empty, no board, and all three world bands at eye level with no
      plan view. What it costs: the white waist sash is on the wrong man (the exact
      inversion described in c4) and the sandy figure reads feminine. Runner-up
      r1s3 has cleaner figures and a correct eye level but merges both garments
      into the same tunic and has no white sash at all.
    verdict: >-
      DOES NOT CLEAR ITS BAR -- 0 of 12 clear every term -- BUT IT ANSWERS ITS
      QUESTION, WHICH IS WHAT IT WAS FOR. The blocking uncertainty is discharged:
      two different men can be specified at once (7 of 12), and eyewear does not
      appear unprompted (0 of 12). The eyewear-binding lane can now tell a leak
      from a general failure to separate two figures, which is what it was waiting
      on. What is still not solved is garment assignment, which failed 12 of 12 by
      merging and once by inverting.
    blocked_on: >-
      Garment assignment -- getting the cream-shirt/brown-skirt man to appear at
      all rather than a second tan tunic, and getting the white sash onto the right
      man. Secondarily the plan-view angle on r0 and the halted-not-running pose.
    diagnostic_only_NOT_PROMOTED: >-
      CAST HOLDS ON THE SEPARATION TERM, DIAGNOSTIC ONLY, EYEWEAR ABSENT BY
      DESIGN. Its own spec marks it unpromotable and this lane does not promote it.
      Eyewear absence here is not a defect: it was omitted deliberately because
      eyewear is broadcast-class and lands on BOTH faces when two are in frame.
    founder_cards_hit:
      - >-
        R4/taste: the second figure reading FEMALE on 3 of 12 touches who the
        approved cast IS, not whether a term was met. Founder's call, named only.
      - >-
        R4/taste: both guards render dark-skinned and adolescent. Not a bar term
        anywhere; flagged as taste, not scored.

  '07':
    role: >-
      Guard A + goblin. Wire-rims NAMED because this beat shows guard A's face;
      `clipboard` NEGATED because its actor is Guard 1 and the board is Guard 2's
      prop. TWO figures per the figure-count correction.
    done_when_quoted_from_done_definitions: >-
      Guard 1 POINTS at the scavenger, decisively, and the point is legible as a
      point; his face stays toward the lens; the second guard and the field are
      present; identity holds against the plate and the clipboard stays the same
      object in the same hands.
    done_when_clauses_superseded_and_read_as_such: >-
      Read from done-definitions.yaml, not from the dispatch summary. Two clauses
      there are SUPERSEDED by `figure_count_ruled_from_the_script_0817` and were
      NOT scored: "the second guard ... present" (the script asks for guard +
      goblin, not a second guard) and "the clipboard stays the same object in the
      same hands" (the clipboard is Guard 2's prop and has no subject in this shot).
    scored: 12 of 12 frames looked at, r3 skipped as a byte-copy of r0
    frames_clearing_EVERY_term: 0 of 12
    cast_holds: NO. 0 of 12. THE WORST RESULT IN THE BATCH, AND THE CAUSE IS IDENTIFIED.

    ROOT_CAUSE_FOUND_IN_THE_PROMPT_ITSELF:
      severity: >-
        This beat did not fail at the model, the sampler or the references. It
        failed because the plate still contains the exact defect the whole batch
        was cut to remove.
      prompt_as_actually_sent_verbatim: >-
        1boy, a guard man with dark cropped hair, wire-rim glasses, tan wrap tunic,
        white sash points one arm at green skin, bald head crouching low, other
        hand open, tall grass, treeline behind, pale sky above, cinematic lighting,
        masterpiece, best quality, very aesthetic
      defect_1_bald_head_still_present: >-
        `bald head` IS STILL IN THE PROMPT. The batch exists because 14 of 17 guard
        plate prompts asked for `bald` when neither approved guard is bald. The
        phrase is MEANT for the goblin, who is legitimately bare-scalped -- but the
        goblin has no subject slot to own it (see defect 2), so `bald` lands on the
        only subject the sentence declares: the guard. Result, 12 of 12 bald.
      defect_2_count_token_contradicts_the_figure_correction: >-
        The prompt declares `1boy`. This beat is TWO figures under the very
        correction that reopened it. The goblin was never given a subject token --
        he is a dangling attribute phrase, "at green skin, bald head crouching
        low", hanging off the guard's clause. So the goblin's ATTRIBUTES bound to
        the guard while the goblin himself got no body: green skin arrives as a
        green mitt on the guard's hand (r0s0) and as green-skinned BALD HUMANS
        (r1s3, r2s1, r2s2), and in 8 of 12 frames there is no goblin at all.
      defect_3_the_prop_ownership_GRAMMAR_was_not_applied_to_a_FIGURE: >-
        b06 established that a thing must sit INSIDE its owner's clause. b07 breaks
        it: the grammatical subject of "points one arm" is `white sash`. Compare
        b08, which obeys it -- `2boys ... the far one a goblin, green skin, bald
        head, patched cloak` -- where `bald` is scoped inside the goblin's own
        clause and cannot reach the guard.
      proof_it_is_the_wording_and_not_the_refs_or_the_model: >-
        b06 renders 12 of 12 haired and 0 of 12 bald off THE SAME reference set,
        the same sampler and the same model in the same batch. The refs are not
        pulling bald. The prompt is asking for it.
      cross_check_of_all_seven_prompts: >-
        `bald head` survives in exactly TWO of the seven: b07 and b08. In b08 it is
        correctly scoped inside the goblin's clause behind a `2boys` token. In b07
        it is unscoped behind a `1boy` token. That difference is the whole result.

    per_condition_rate:
      c1_exactly_two_whole_figures_one_guard_one_goblin_same_depth_plane: >-
        0 of 12 strictly. r0s0 and r0s1 hold ONE figure. r0s2, r0s3, r1s0, r1s1,
        r2s0, r2s3 hold TWO figures but BOTH ARE BALD HUMANS -- no goblin present.
        r1s3, r2s1, r2s2 hold two figures of which the second is green-skinned but
        bald, earless and cloakless, reading as a green human rather than a goblin.
        r1s2 renders a THIRD bald dome rising at bottom centre.
      c2_guard_has_DARK_CROPPED_hair_and_is_NOT_BALD: >-
        0 of 12. Every human figure in every frame is completely, glossily bald.
        Total failure of the single term this rung was reopened for.
      c3_WIRE_RIM_GLASSES_legible_as_round_wire_frames: >-
        12 of 12 PRESENT and correctly drawn as round wire frames -- the phrase
        binds reliably. But OWNERSHIP is wrong: they sit on the wrong figure at
        r1s0, r1s1, r1s2, r1s3 and r2s1, and on BOTH faces at r0s3 and r2s2.
      c4_tan_wrap_tunic_and_white_sash_on_him: >-
        2 of 12 (r0s0, r2s3). The white sash renders nearly everywhere; the TAN
        tunic does not. The garment comes out RED at r0s1, r0s2, r0s3, r2s0 and
        white/grey at the whole r1 row. COLOUR CAVEAT APPLIES: this is a bf16/CUDA
        render, which renders RED where MPS renders PURPLE off the identical seed
        (MAE 60-61), so the red readings are path-dependent and not a stable
        wardrobe finding.
      c5_one_arm_extended_and_legible_as_a_POINT_other_hand_visible_and_empty: >-
        0 of 12. Not one frame contains a point. Every hand is loose, open-palmed,
        clawed or fisted -- no extended index finger anywhere. Traceable to the
        prompt, where the verb "points" takes `white sash` as its subject.
      c6_NO_board_clipboard_slab_or_paper_anywhere: >-
        12 of 12, CLEAN -- the negation worked and this is the one term this beat
        wins outright. Noted honestly: a white sash tail at r2s0, r2s1 and r2s3
        reads paper-LIKE, but it is attached drapery, not a board or a sheet.
      c7_all_three_bands_real_no_white_or_plain_field_no_plan_view: >-
        7 of 12. No white or plain field anywhere. Losses split two ways: the r0 row
        carries the bands but from a HIGH DOWNWARD angle, and r2s1 has no sky at all.
      c8_neither_figure_infantile_and_no_blush: 12 of 12, CLEAN. Grim adult faces, no blush anywhere.

    pre_registered_fail_modes:
      eyewear_reaching_the_GOBLIN: >-
        FIRED, and it CONFIRMS THE BROADCAST-CLASS LAW rather than contradicting
        it. Wire-rims land on the green figure at r1s3, r2s1 and r2s2 and on BOTH
        faces at r0s3 and r2s2. Naming eyewear with two faces in frame puts it on
        both -- exactly why it was omitted from the two-guard rungs. This is a
        property of the term, not a defect of this plate.
      the_goblin_drawn_as_a_human_child: >-
        DID NOT FIRE as a child. It fired WORSE: the goblin is drawn as a bald adult
        HUMAN in 6 of 12 and is simply ABSENT in 8 of 12.
      a_third_figure_appearing: FIRED, 1 of 12 (r1s2, a third bald head at bottom centre).
      framing_and_light_regression: FIRED on the r0 row -- higher and flatter than this beat's older plates.

    pick: >-
      NONE, and no pick is warranted. A pick means choosing among takes that could
      serve; nothing here can. The guard is bald in every frame, which is the one
      defect the beat was reopened to remove, and there is no legible point in any
      frame, which is the beat's action. Picking a least-bad frame would launder a
      0 of 12 into an apparent result, which is precisely how 8/12 "passes" became
      0/12 usable here.
    verdict: >-
      FAILS ITS BAR OUTRIGHT, 0 of 12, AND IS THE MOST USEFUL FAILURE IN THE BATCH
      because the cause is a one-line wording defect that is now located and proved
      rather than suspected. Do not spend another rung on refs, sampler, weights or
      IP-Adapter for this beat.
    blocked_on: >-
      A plate rewrite, and only that: (a) drop `bald head` or move it inside a
      goblin clause that owns it; (b) change `1boy` to `2boys` to match the
      figure-count correction; (c) give the goblin a real subject token with
      pointed ears and a patched cloak; (d) restore the guard as the subject of
      "points" so the action has an actor. This lane did NOT make those edits: the
      seven specs are off limits for writes and re-rendering is not this lane's card.
    founder_cards_hit:
      - >-
        None that gate the fix. The wording defect is a mechanical correction, not
        a taste call, and the cast it must match is already frozen ("the cast stands
        as drawn", founder 2026-08-16).
    CORRECTION_AFTER_SCORING_b08: >-
      One claim in `defect_3` above is WRONG and is corrected here rather than
      edited away, because the disagreement is the evidence. It said b08 scopes
      `bald head` inside the goblin's own clause and so `bald` "cannot reach the
      guard". b08's pixels falsify that: b08 declares `2boys`, scopes `bald head`
      inside the goblin's clause, and its guard is STILL BALD 12 of 12. Clause
      scoping does NOT contain `bald`. See b08.BALD_IS_BROADCAST_CLASS for the
      corrected law. Everything else in the b07 entry stands -- the token is still
      the cause, and b07 additionally has the `1boy` count defect b08 does not.

  '08':
    role: >-
      Guard B + goblin, board staged in the NEAR owner's hands. Not listed in the
      dispatch brief's per-spec design notes, but it is the seventh rung and it is
      scored here. NOTE: a peer lane `b08-provenance` is live on this beat; this
      entry is a SCORE against the bar, written in this lane's own file, and does
      not touch that lane's provenance work.
    done_when_quoted_from_done_definitions: >-
      the clipboard comes DOWN and the point goes to the BELLY, both legible; both
      guards and the scavenger in frame, since a point needs its target visible.
    done_when_clause_superseded_and_read_as_such: >-
      "both guards and the scavenger in frame" is SUPERSEDED by
      `figure_count_ruled_from_the_script_0817`: the script asks for TWO figures
      (Guard 2 + the scavenger), not three. Scored as two.
    scored: 12 of 12 frames looked at, r3 skipped as a byte-copy of r0
    frames_clearing_EVERY_term: 0 of 12
    cast_holds: NO on the guard -- bald 12 of 12. But this beat produced the batch's most important LAW.

    BALD_IS_BROADCAST_CLASS:
      finding: >-
        `bald` behaves EXACTLY like eyewear: it is BROADCAST-CLASS. Its presence
        anywhere in the token stream puts it on every human head in frame,
        regardless of which clause owns it.
      the_four_way_evidence_within_one_batch: >-
        Same model, same sampler, same reference set, same day. b06 -- no `bald`
        token, `1boy` -- 0 of 12 bald. b05 -- no `bald` token, `2boys` -- 2 of 12
        bald. b07 -- `bald head` unscoped, `1boy` -- 12 of 12 bald. b08 -- `bald
        head` SCOPED INSIDE THE GOBLIN'S OWN CLAUSE behind `2boys` -- STILL 12 of
        12 bald on the guard. The token's presence predicts the outcome; its clause
        does not.
      why_it_matters: >-
        The prop-ownership grammar b06 established governs OBJECTS. It does not
        govern broadcast-class ATTRIBUTES of bodies. Eyewear was already known to
        broadcast (both faces, 5 of 5, versus one face 7 of 7). `bald` is the
        second member of that class, and it was hiding inside a legitimate goblin
        descriptor, since a goblin is properly bare-scalped.
      tightened_FORWARD_only: >-
        Any beat holding BOTH a human guard and the goblin cannot name the goblin's
        bare scalp in words at all. The goblin's baldness must come from a
        reference or be left unstated and inferred. This is stated forward for the
        next rung and is NOT applied retroactively to these scores.

    per_condition_rate:
      c1_exactly_TWO_whole_bodied_figures_one_guard_one_goblin: >-
        5 of 12 (r0s1, r0s2, r0s3, r1s1, r1s2). r1s0 and r1s3 each add a THIRD
        green creature in the background. The whole r2 row is framed as a tight
        two-shot with the guard cropped at the chest, so "whole-bodied" is lost
        4 of 4. r0s0 is ambiguous -- both heads read pale-human while a green hand
        appears, so neither figure is cleanly the goblin.
      c1_SECOND_GUARD_control_the_bars_single_most_likely_failure: >-
        DID NOT FIRE, 0 of 12. This is a genuine and useful negative. The bar
        predicted that a two-guard reference set on a one-guard beat would pull a
        third human body. It did not: the second body came out GREEN in 11 of 12.
        Using refs-guards-twoinfield-nos2-0815 on a guard+goblin beat does not
        manufacture an extra guard.
      c2_board_in_the_GUARDS_hands_and_ONLY_his: >-
        4 of 12, and WHERE they land is the finding -- all four are the r2 row,
        the only row that draws the guard NEAREST, in the foreground. In the r0 and
        r1 rows, where the two figures stand shoulder to shoulder at equal depth,
        ownership fails 8 of 12. This independently corroborates the adjacency law
        beat 10 was built to test: the prop goes to whoever is drawn nearest.
      c3_guard_has_light_sandy_hair_cream_shirt_white_sash_brown_skirt: >-
        0 of 12 on hair, because he has none. Garment half is decent -- cream/tan
        shirt and a white sash render in most frames -- but the term is compound
        and the hair clause fails every frame.
      c4_HE_IS_NOT_BALD: 0 of 12. FAILS OUTRIGHT, all twelve. See BALD_IS_BROADCAST_CLASS.
      c5_guard_reads_ADULT_not_a_child: 12 of 12, CLEAN. Adult proportions and adult faces throughout.
      c6_goblin_green_with_POINTED_EARS_and_patched_cloak_reading_adult: >-
        1 of 12 (r2s0). Green skin renders 11 of 12, but POINTED EARS appear only at
        r2s0 and r2s1 and a PATCHED CLOAK only at r2s0, r2s1 and r2s2. Everywhere
        else the goblin is a smooth green bald dome in the same robe as the guard --
        a green man, not a goblin. r2s1 has the ears and the cloak but is drawn
        CHILD-PROPORTIONED, so it fails the adult clause.
      c7_BELLY_VISIBLE_AND_UNOCCLUDED: >-
        3 of 12 (r2s0, r2s2, r2s3). The r0 and r1 rows robe the goblin to the neck,
        so the belly is not merely occluded, it is not drawn at all. This matters
        because the beat's `done_when` needs the belly legible as the point's target.
      c8_goblins_hands_are_EMPTY: >-
        2 of 12 (r2s0, r2s3). He holds the guard's board in 6 frames, a second board
        in 2, and at r2s2 a POTTED PLANT that nothing in the prompt asked for.
      c9_board_hand_sized_flat_rectangular_BARK_not_paper_no_hand_across_its_face: >-
        0 of 12 on material, the same result as b06. The r2 row renders an
        unmistakable WHITE PAPER SHEET ON A CLIPBOARD WITH A METAL CLIP -- the bar
        excludes "paper" and "chrome clip" by name, and both are present in the
        same object. The r0 and r1 rows render a dark slate or plastic clipboard.
        Nothing reads as bark anywhere. Shape and flatness are fine, 10 of 12.
      c10_grass_and_sky_above_both_real_no_white_or_plain_bg_no_plan_view: >-
        5 of 12. No white or plain background anywhere, 12 of 12 on that half. The
        r0 row is a HIGH DOWNWARD angle with only a thin sky band; the r2 row is too
        tight to carry a sky. The r1 row is the only one with a real sky above.

    pre_registered_fail_modes:
      a_second_guard_arriving_from_the_refs: DID NOT FIRE, 0 of 12. The bar's most-feared failure did not happen.
      the_board_on_the_goblin_or_in_both_pairs_of_hands: >-
        FIRED HARD, 8 of 12 -- consistent with the recorded 9-of-12 fault, so the
        near-owner staging did NOT prevent it except in the r2 row.
      the_guard_coming_back_bald: FIRED, 12 of 12. See BALD_IS_BROADCAST_CLASS.
      the_goblin_reading_as_a_human_child: >-
        DID NOT FIRE as a HUMAN child. It fired as a GOBLIN child at r2s1, and far
        more often as an adult green man with no goblin features at all.
      the_belly_occluded_by_the_board_expected_to_be_the_closest_call: >-
        DID NOT FIRE AS PREDICTED, and this is worth recording. The predicted
        geometric tension between board and belly never arose. The belly is lost to
        CLOTHING instead -- the goblin is robed to the neck in 9 of 12. The expected
        closest call was not close; a different one replaced it.
      eyewear_appearing_on_either_figure_unprompted: >-
        DID NOT FIRE, 0 of 12. Second clean confirmation, after b05, that eyewear
        never arrives unbidden. Per the spec this is a finding for the binding lane
        and NOT something this job may attempt to fix.

    pick: >-
      r2s0, as the most informative frame rather than a usable one. Reasons: it is
      the ONLY frame in twelve that is simultaneously a real goblin (pointed ears,
      patched cloak, green skin, adult proportions), with his BELLY VISIBLE and his
      hands off the board, and the board in the guard's hands and only his. That is
      four of the beat's hardest terms landing together once. What it costs: the
      guard is bald, the board is white paper under a metal clip rather than bark,
      the guard is cropped at the chest, and only one of his hands is on the board.
    verdict: >-
      FAILS ITS BAR, 0 of 12 clear every term, and cannot pass while `bald`
      broadcasts. Its value is diagnostic and high: it produced the broadcast-class
      law for `bald`, it cleared the two-guard-refs worry to zero, and it
      corroborated the adjacency law for prop ownership from a beat that was not
      built to test it.
    limits_from_the_spec_this_lane_respected:
      not_a_passing_beat: >-
        Per the spec's own `limits` (a): beat 08's action is a small in-hand prop
        manipulation plus a point, which measures 0 of 8 in-hand against 12 of 12
        whole-body. NO MOTION IS INFERRED HERE FROM ANY STILL.
      goblin_is_not_reference_conditioned: >-
        Per `limits` (b): --refs holds GUARDS, so the goblin's identity comes from
        the prompt slot alone. The weak goblin identity in c6 is therefore NOT
        evidence about the goblin references and must not be cited as such.
      sidecar_fields_are_the_samplers: >-
        Per `limits` (c): the sidecars' `cost_usd: 0.00`, `founder_verdict: null`,
        `scored: false` are the sampler's own writes, not this spec's claims, and
        `scored: false` in a sidecar does not contradict this file.
    blocked_on: >-
      (a) `bald` broadcasting off the goblin's descriptor -- the goblin's bare
      scalp must stop being named in words on any beat that also holds a human;
      (b) board material, the same bark-versus-paper wall as b06, 0 of 12;
      (c) goblin identity, which needs pointed ears and a patched cloak to survive
      past 1 of 12 -- and per the spec's limits that is a PROMPT-slot problem, not
      a reference problem.
    founder_cards_hit:
      - >-
        R4/taste: whether the goblin may read as a plain green man rather than a
        goblin is a design call on the creature, not a scoring call. Named only.

  '09':
    role: >-
      Guard A close-up ALONE. Wire-rims KEPT, because there is no second face for
      them to leak onto. Its variable against the earlier Mac plates is IP-Adapter
      REFERENCE CONDITIONING, aimed at hair colour and texture.
    done_when_quoted_from_done_definitions: >-
      close on Guard 1's face working through the thought, in daylight; face holds,
      no morphing; a real background behind him.
    scored: 12 of 12 frames looked at, r3 skipped as a byte-copy of r0
    frames_clearing_EVERY_term: 0 of 12
    cast_holds: PARTLY, and the rung returned a clean, decisive TRADE. See the_trade.

    how_condition_2_was_MEASURED_not_eyeballed: >-
      The bar demands the head measure at least 55% of frame height and says
      "measured, not eyeballed". Each 832x1216 frame was re-rendered locally with
      horizontal gridlines every 10% of frame height and the skull-top and chin
      read off against them. Per-frame head height, top of hair to chin:
      r0s0 ~28%, r0s1 ~27%, r0s2 ~26%, r0s3 ~30%, r1s0 ~25%, r1s1 ~25%,
      r1s2 ~29%, r1s3 ~28%, r2s0 ~33%, r2s1 ~34%, r2s2 ~35%, r2s3 ~34%.

    the_trade:
      summary: >-
        The rung asked whether IP-Adapter reference conditioning would move hair
        colour and texture. It did -- and it took the framing as payment, which the
        bar predicted in writing.
      condition_1_hair_MOVED: >-
        Near-black cropped hair arrives at 3 of 12 (r1s2, r1s3, r2s2), where the Mac
        rung lost this condition outright. Reference conditioning is the instrument
        that touches hair, as designed.
      condition_2_framing_REGRESSED: >-
        0 of 12, and WORSE than the rung it was meant to beat. Measured 25-35%
        against a 55% bar; the Mac rung it was correcting posted 48-53%. The r0 and
        r1 rows are chest-up or waist-up MEDIUM shots, not close-ups at all.
      this_is_the_rungs_ANSWER_not_a_mystery: >-
        Quoting the bar's own pre-registered fail mode: "the reference set pulling
        the FRAMING back to the two-in-field full body the refs depict, which would
        cost condition 2 while winning condition 1 -- if that happens it is the
        rung's answer, not a mystery." IT FIRED, EXACTLY AS WRITTEN. The refs depict
        two men at full length in a field, and they dragged a close-up out to a
        medium. Reference conditioning and tight framing are in direct conflict on
        this beat, and that is now measured rather than suspected.

    per_condition_rate:
      c1_hair_NEAR_BLACK_and_CROPPED_not_mid_brown_not_shaggy_not_blond_not_bald: >-
        3 of 12 (r1s2, r1s3, r2s2). Failure modes split: BLOND/SILVER at r0s0, r0s3,
        r2s1; MID-BROWN rather than near-black at r1s0, r1s1, r2s0, r2s3; and BALD
        at r0s1 and r0s2.
      c1_bald_sub_finding_that_QUANTIFIES_THE_MODEL_PRIOR: >-
        IMPORTANT AND USED AS A CONTROL. b09's prompt contains NO `bald` token at
        all, yet bald still appeared 2 of 12. b05, also with no `bald` token, also
        gave 2 of 12. b07 and b08, which DO carry the token, gave 12 of 12. So the
        model's unprompted baseline for a bare scalp on this beat family is about
        2 in 12, and the token is what drives it to 12 in 12. The token is the
        cause; the prior is a small constant.
      c2_head_at_least_55_percent_of_frame_height: >-
        0 of 12, measured. Best in the batch is r2s2 at ~35%, still twenty points
        under the bar. See how_condition_2_was_MEASURED_not_eyeballed.
      c3_WIRE_RIM_GLASSES_legible_as_round_wire_frames: >-
        12 of 12, PERFECT, and the Mac rung's win is HELD. Round wire frames,
        correctly drawn, no sunglasses, never absent. This also confirms the
        broadcast-class law from its clean side: with ONE face in frame the term
        binds every single time. The pre-registered worry "eyewear absent at any
        seed" did not fire once.
      c4_a_real_background_grass_and_hedgerow_with_actual_content_not_white_not_plain: >-
        12 of 12, PERFECT, and the Mac rung's other win is HELD. Deep tall grass in
        every frame, hedgerow or treeline in most, sky where the framing allows.
      c5_one_adult_man_only_no_second_figure_and_no_child: >-
        12 of 12 on COUNT -- one figure everywhere, no second body, no child. This
        is the cleanest count in the entire batch.
      c6_face_toward_lens_EYES_OPEN_mouth_closed_thoughtful_not_blank_or_comic: >-
        8 of 12. Eyes are closed, squeezed shut or fully downcast at r0s0, r0s2,
        r1s0 and r1s2. Mouth is closed and the register is thoughtful rather than
        comic everywhere -- that half of the term is clean 12 of 12.
      c7_the_face_reads_ADULT_not_young: >-
        5 of 12. The Mac rung's third named fault is NOT fixed. The r2 row in
        particular reads adolescent -- large eyes, soft jaw, small nose -- which is
        the same row that wins the framing and hair terms.
      c8_tan_tunic_collar_and_a_white_sash_over_the_shoulder: >-
        1 of 12. Two compounding misses: the TAN tunic renders CREAM or WHITE almost
        everywhere, and the shoulder sash renders DARK -- black, charcoal or deep
        green -- rather than white at r0s0, r0s1, r0s2, r0s3, r1s2, r1s3, r2s1,
        r2s2. Where a white band exists at r1s1 it has gone to the WAIST.
      c9_NO_hands_and_no_board_clipboard_or_paper_anywhere_in_frame: >-
        0 of 12, AND THIS IS THE DEFECT THAT KILLS EVERY FRAME ON ITS OWN. A HAND IS
        IN FRAME IN ALL TWELVE, and in eleven of them it is raised to the chin,
        cheek or spectacles. The board half of the term is clean -- no board,
        clipboard or paper anywhere, 12 of 12 -- so this is purely the hands.
      c10_daylight: 12 of 12, CLEAN. Bright, unambiguous daylight in every frame.

    pre_registered_fail_modes:
      the_costume_card_collapse_a_turnaround_sheet_or_plain_ground_character_card: >-
        DID NOT FIRE, 0 of 12. The defect this beat's previous box plate actually
        died of is gone. Every frame is a scene, not a character card.
      the_reference_set_pulling_the_FRAMING_back: FIRED, 12 of 12. The rung's answer. See the_trade.
      eyewear_absent_at_any_seed: DID NOT FIRE, 0 of 12. Present and correct in all twelve.
      unpre_registered_defect_TIGHTENED_FORWARD_ONLY: >-
        THE THOUGHTFUL-HAND TROPE. The word "thoughtful" reliably buys a hand at the
        chin, 11 of 12, which collides head-on with condition 9's "NO hands". The
        bar named the hands term and named the thoughtful term and did not notice
        they contradict each other. Said so here and TIGHTENED FORWARD for the next
        rung: either negate hands explicitly or drop "thoughtful" for a wording that
        does not summon the trope. NOT scored retroactively -- c9 is scored exactly
        as the bar wrote it, 0 of 12.

    pick: >-
      r2s2, on reasons. It is the only frame that clears the hair term AND posts the
      largest measured head height in the batch (~35%), while holding wire-rims, a
      real grass background, one adult figure, eyes open behind the lenses and
      daylight. In other words it is the single frame where both of the rung's two
      target conditions are as close together as they ever get. What it costs: the
      head is still twenty points under the 55% bar, a hand is at the face, the
      shoulder sash is dark instead of white, and the face reads young. Runner-up
      r1s3 has the cleanest near-black cropped hair and open eyes but a smaller head
      at ~28%.
    verdict: >-
      FAILS ITS BAR -- 0 of 12 clear every term, and condition 9 alone fails all
      twelve. But it is a SUCCESSFUL EXPERIMENT: it holds both conditions the Mac
      rung won (wire-rims 12 of 12, real background 12 of 12), it moves the hair
      condition the Mac path could not touch (3 of 12), and it establishes by
      measurement that reference conditioning buys hair by spending framing.
    blocked_on: >-
      (a) The framing-versus-refs conflict, now measured and needing a real decision
      rather than another rung: reference conditioning at this weight cannot coexist
      with a 55% head. Options are lower reference weight, a crop pass, or a
      close-up reference -- all bigger than a wording change.
      (b) Hands in frame, 12 of 12, which needs an explicit negation.
      (c) The white shoulder sash, which fails on b06 and b09 alike and is looking
      like a batch-wide wording problem rather than a per-beat one.
    founder_cards_hit:
      - >-
        R4/taste: the face reading ADOLESCENT on 7 of 12 is the Mac rung's third
        named fault and it is unfixed. Whether that is acceptable on the approved
        cast is the founder's call. Named, not decided.
      - >-
        R4/taste and a REAL DECISION, not a rung: done-definitions records that beat
        09 EARNS a third round on the understandable test because the face changes
        between the plate and the close-up. This lane's measurement says the third
        round cannot be another wording pass -- it needs the reference-weight or
        crop decision in (a) above, which is a recipe change and therefore wants ONE
        SAMPLE before any batch.

  '10':
    role: >-
      Guard B drawn NEAREST so the clipboard binds by ADJACENCY -- the prop law
      USED, not fought. Eyewear deliberately omitted on both guards. Marked in its
      own spec as a DIAGNOSTIC RUNG no lane may promote to a shipping plate.
    done_when_quoted_from_done_definitions: >-
      TWO guards in frame; the near one flips the bark board and holds its blank
      back TOWARD HIS PARTNER; board hand-sized; field present at frame one.
    scored: 12 of 12 frames looked at, r3 skipped as a byte-copy of r0
    frames_clearing_EVERY_term: 0 of 12
    cast_holds: MOSTLY YES on hair -- but the experiment this rung exists for FAILED.

    THE_EXPERIMENTS_OWN_TERM:
      condition_1_board_in_the_NEAR_MANS_hands_and_ONLY_his: >-
        1 of 12 strictly (r1s2), 2 of 12 if r2s0's single hand is allowed instead of
        both. The bar calls this "the pass/fail of the experiment". IT FAILED.
      the_answer_the_bar_pre_committed_to: >-
        Quoting the bar: "the board reaching the far man or both men anyway ... would
        mean adjacency is not the binding either and the remaining options are all
        bigger than a rung (identical dress, or a composite)." IT REACHED THEM
        ANYWAY, 10 of 12. ADJACENCY IS NOT THE BINDING. Drawing the owner nearest
        does not give him the prop. That conclusion is the rung's deliverable and it
        was pre-committed to in writing before the pixels existed.
      a_SECOND_board_appearing: >-
        6 of 12 (r0s0, r0s1, r0s2, r1s1, r2s1, r2s3). Scored honestly against the
        founder's exact named defect, which was "a SECOND board HANGING IN THE AIR
        with no hand on it": that precise variant did NOT fire here -- in every one
        of the six the duplicate is in the far man's hands. It is a duplication
        fault, not the floating-board fault.

    CROSS_BEAT_FINDING_THE_REAL_BINDING_MAY_BE_OCCUPIED_HANDS:
      the_contrast: >-
        b08 and b10 disagree, and the disagreement is informative. b08's r2 row
        staged the owner NEAREST and got sole ownership 4 of 4. b10 stages the owner
        nearest and gets it 1 of 12. The difference is not the staging -- it is WHO
        THE SECOND FIGURE IS. In b08 the far figure is a GREEN GOBLIN, visually
        unmistakable; the board never duplicates onto him. In b10 both figures are
        GUARDS in the same tan tunic; the board duplicates onto the twin 6 of 12.
      the_hypothesis_this_supports: >-
        Prop duplication tracks the VISUAL SIMILARITY of the two figures, not their
        depth order. A prop duplicates onto a body that looks like its owner.
      the_accidental_evidence_inside_b10_itself: >-
        The ONE frame that achieves sole ownership, r1s2, is also the one frame
        where the far man is made VISUALLY DIFFERENT (he renders bald) AND HIS HANDS
        ARE FULL -- he is holding a clump of grass. That is the single frame in
        twelve where the board stays put.
      why_this_is_a_LEAD_and_not_a_conclusion: >-
        done-definitions records that b10's earlier r2 tried exactly this lever and
        it never actually got tested: "The r2 attempt to occupy guard A's hands
        (`hands behind his back`) DID NOT RENDER AT ALL - his arms came back folded
        in front - so that instrument was never actually tested." Here the far man's
        hands got occupied BY ACCIDENT and ownership held. Occupying the far man's
        hands is therefore still an UNTESTED instrument with one accidental
        datapoint in its favour, and it is CHEAPER than either option the bar named
        as remaining (identical dress, or a composite). Offered as the next lever.

    per_condition_rate:
      c2_exactly_TWO_adult_whole_bodied_figures_neither_a_child: >-
        8 of 12. The r2 row crops both men to chest-up fragments, 0 of 4. Both men
        read adolescent rather than adult throughout, which is a taste flag below.
      c3_near_man_light_sandy_hair_cream_shirt_brown_wrap_skirt: >-
        6 of 12. The sandy hair is reliable, 12 of 12; the CREAM SHIRT is what
        fails, arriving as a tan tunic at r0s0/r0s1/r0s2/r1s0/r1s1 and orange at r1s3.
      c4_far_man_DARK_CROPPED_hair_and_a_tan_tunic_HIS_SASH_NOT_SCORED: >-
        7 of 12. Scored without the sash, exactly as the bar instructs. Failures:
        the far man renders BLOND at r0s1, r2s1, r2s3, BALD at r1s2, and his hair is
        not visible at all in the cropped r2s0.
      c5_NEITHER_MAN_IS_BALD: >-
        11 of 12. Bald appears once, on the far man at r1s2. b10's prompt carries NO
        `bald` token, and 1 of 12 sits right on the ~2-in-12 unprompted baseline
        established from b05 and b09. Consistent with the broadcast-class law: no
        token, no epidemic.
      c6_the_two_men_are_distinguishable_both_dark_or_both_sandy_is_a_FAIL: >-
        8 of 12. Fails as BOTH BLOND at r0s1, r2s1 and r2s3 -- the merge, and the
        same failure direction b05 showed. Where it passes it passes clearly.
      c7_board_hand_sized_flat_rectangular_and_BLANK_on_the_face_shown_no_hand_across_it: >-
        9 of 12. Flat and rectangular everywhere. Fails as NOT BLANK at r0s0, where
        the near board carries white markings across its face, and on a hand lying
        across the face at r1s0 and r2s2.
      c8_tall_grass_hedgerow_band_and_sky_ABOVE_it_all_three_real: >-
        7 of 12. The whole r2 row is framed too tight to carry a sky band, 0 of 4,
        and r0s1 has grass where its sky should be.
      c9_no_white_or_plain_background_and_not_a_downward_plan_view: >-
        6 of 12. No white or plain background anywhere, 12 of 12 on that half. The
        r0 row is shot from a HIGH DOWNWARD angle with grass filling the frame, and
        the r2 row tilts down too.
      c10_the_far_mans_hands_are_EMPTY_no_pole_no_duplicate_board_nothing: >-
        1 of 12 (r2s0). The worst term on the beat and the mechanical cause of the
        ownership failure: the far man's hands are on the near man's board in 8
        frames, on a duplicate board in 2, and full of grass at r1s2.
      board_material_scored_SEPARATELY_per_the_bar: >-
        0 of 12 read as bark. The r0 and r1 rows render dark green slate or planed
        brown timber; the whole r2 row renders WHITE PAPER. Same wall as b06 and b08.

    pre_registered_fail_modes:
      the_board_reaching_the_far_man_or_both_men_anyway: >-
        FIRED, 10 of 12. This is the rung's answer: adjacency is not the binding.
      a_SECOND_board_hanging_in_the_air_with_no_hand_on_it: >-
        DID NOT FIRE in its exact form, 0 of 12. A second board appears 6 of 12 but
        always held. The founder's specific named defect did not reproduce.
      the_board_reading_as_paper_rather_than_bark: FIRED, 12 of 12 (paper in the r2 row, slate or planed timber elsewhere).
      eyewear_appearing_on_either_man_unprompted: >-
        DID NOT FIRE, 0 of 12. Third clean confirmation in this batch, across two
        faces and twelve frames, that eyewear never arrives unbidden.

    pick: >-
      r1s2, picked for what it TEACHES rather than for what it shows, and it is not
      a usable frame. Reasons: it is the only frame in twelve where the board stays
      in one man's two hands with the other man not touching it, and it is
      simultaneously the only frame where the far man is both visually distinct and
      holding something else -- which is the lead described above. What it costs: the
      far man is BALD (the one bald frame on the beat), he is holding a clump of
      grass nothing asked for, and the board is planed timber rather than bark. As a
