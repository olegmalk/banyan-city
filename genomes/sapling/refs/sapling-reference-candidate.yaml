# A licence-clean sapling reference, FOUND but NOT YET USABLE — 2026-08-13.
#
# Recorded rather than staged, because the sourcing succeeded and the plumbing
# does not exist. Kept here so the next attempt starts from a verified asset
# instead of repeating the search.
#
# THE SEARCH, bounded per the founder ("just dont put too much time into it").
# Wikimedia Commons under a strict CC0/PD filter: three usable-licence hits and
# none of them a sapling — a top-down tray of brinjal seedlings (CC0, no single
# stem), a conifer seedling (PD, wrong silhouette), a mature apple tree (CC0).
# US-government PD (Forest Service, NPS) surfaced libraries but no matching
# frame. Openverse filtered to CC0 found this one.
found: Young baobab tree
author: StockyPics
