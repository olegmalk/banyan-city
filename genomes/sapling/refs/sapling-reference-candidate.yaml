licence_verified: >-
  Read on the Flickr photo page itself, not taken from the aggregator's
  metadata — Openverse said CC0 and the source page confirms it.
sha256_of_fetched_bytes: 8f0c60227c77bdbe27ef58acc3679ffdc64d767523679e2f77350cc50aaaa455
dimensions: 768x1024 (the _b rendition)
why_it_fits: >-
  One plant, not a patch. A thin bare woody stem visible down most of the
  frame, one clear side-branch fork — which is 003b's "one thin bare
  side-branch" — leaves gathered at the top, plain speckled wall behind it and
  nothing else in frame. It is the structural geometry four rounds of wording
  never produced.
why_it_is_imperfect: >-
  Leafier than 003b's two oversized leaves, and the leaves are narrow rather
  than broad. No soil at the base; the stem runs out of the bottom of frame.
  Usable as a STRUCTURE reference, not as a literal portrait of our sapling.
blocked_on: >-
  THE CONDITIONING PATH CANNOT TAKE IT. `goblin_ipa_beat.py --help` on the box
  reports exactly three options — --beat, --sampler-dir, and
  --character {goblin,guard}. There is no --refs, and --character is a closed
  enum of two values. A sapling is neither a goblin nor a guard, so there is no
  argument through which this reference reaches the sampler. Making one is a
  change to a script the ep2 lane is running jobs through tonight.
fallback_also_unavailable: >-
  Option (b), a different checkpoint, is not runnable on my own authority
  either. The only other stills weights named anywhere in this repo are
  stabilityai/sdxl-turbo and stable-diffusion-v1-5 — neither is an anime
  checkpoint, so both fail the look he set, and neither has had a licence read
  for this use. The instruction was to say so rather than add weights.
