# sound design — cycle 012 v7e (founder's v7d notes worked in).
#
# The fall is air-then-floor: a whoosh rises through the last second of the
# drift and the impact lands EXACTLY on the cut to his last sight (the take
# has no visible impact frame — the cut is the event). The wind bed is no
# longer everywhere: it belongs to the OUTDOOR world and enters with the sky
# under "Huh. Blue." (beat 5), darker and quieter than before ("a random
# weird wind sound" — gone indoors). Fan spin-down stays in his dying world
# (end of beat 4) and is finished before the sky.
#
# All cues synthesized (pipeline/sfx.py, fixed seeds). Beat-relative seconds;
# beat 4 is the 5.04s PIXVERSE fall + 6.0s terminal two-shot (cut at 5.04).

events:
  - {beat: 1, sfx: keyboard, start: 0.2, dur: 5.8, stop_at: 5.4, gain_db: -16}  # "very fast — then it stops"
  - {beat: 1, sfx: room_hum, start: 0.0, dur: full, gain_db: -26}
  - {beat: 2, sfx: room_hum, start: 0.0, dur: full, gain_db: -26}
  - {beat: 3, sfx: room_hum, start: 0.0, dur: full, gain_db: -26}
  - {beat: 4, sfx: room_hum, start: 0.0, dur: 4.0, gain_db: -26}   # the room dies with his breath
  - {beat: 4, sfx: fall_impact, start: 3.94, pre: 1.1, gain_db: -11}  # whoosh 3.94→5.04, HIT on the cut
  - {beat: 4, sfx: fan_spindown, start: 7.0, dur: 4.0, gain_db: -19}  # his machine winds down over his last sight
  - {beat: 9, sfx: terminal_keys, start: 0.4, dur: 3.2, gain_db: -24}  # "$ whoami" types itself
  - {beat: 10, sfx: footsteps_soil, start: 3.0, dur: 7.0, period: 1.9, gain_db: -23}  # 400m away, felt not heard
  - {beat: 15, sfx: footsteps_soil, start: 0.2, dur: 3.4, period: 1.1, grow: 1.2, gain_db: -14}  # closer, faster — the hook

# the wind belongs OUTSIDE: silent from the cold open until the sky appears
# under "Huh. Blue.", then it breathes in with the new world
bed_duck:
  from: {beat: 1, at: 0.0}
  to: {beat: 5, at: 0.4}
