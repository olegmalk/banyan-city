# `render_local.approved()` — the single §6 gate that render_t3,
# generate_shots, synth_vo, still_local, post_motion and run_remote all
# call — reads `sorted(leaves/*-t0-*.yaml)[-1]`, the LAST filename, as
# "the node's script". `001-t0-e-draft.yaml` sorts after
# `001-t0-d.yaml`, so while this file sat in `leaves/` it WAS the
# script as far as every one of those tools was concerned, and its
# `approved_by: none` refused all media for node 001 — not just this
# lane's, every lane's. It was there for about two minutes on
# 2026-08-11 and the refusal is what a correct fail-closed gate should
# do; the misfiling was the steward's. The glob is not recursive, so a
# subdirectory keeps the draft next to the leaves for a human to find
# while leaving `001-t0-d.yaml` as what it still is: the newest actual
# leaf and the approved script this cut was assembled from. That is
# not an evasion of the gate — the script did not change (see
# `what_changed_in_the_script` below), so `001-t0-d.yaml` genuinely
# governs. If a future draft DOES change the script, it must go back
# into `leaves/` and block exactly as this one did.
#
# Drafted 2026-08-11 by the steward from the founder's direction that
# day, verbatim: "also we should show that he became a sapling earlier
# in the video just to make it less confusing." It awaits his read.
# `001-t0-d.yaml` is untouched and remains the live script; nothing in
# the pipeline reads this file. It exists because the bench cut
# `review/tonight/EP1-PROVISIONAL-v36b-bench.mp4` now shows a picture
# the approved script does not describe, and that must be on paper
# before he watches it, not after.
# ===================================================================
