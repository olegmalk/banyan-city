where_the_reveal_was: >-
  MEASURED FROM THE CUT HE JUDGED, not from the script's intent. Through the
  first half of the episode the viewer is never shown what he has become. Beat
  06 (0:24) is open sky with no plant in it — by his own 2026-08-07 ruling, a
  first-person POV cannot contain its own body. Beat 07 (0:29) is a grass field
  and horizon. The first plant image of any kind is beat 09's leaf macro at
  0:48, which is also where the words say it outright:

      $ whoami
      sapling (ficus. probably.)

  The first EXTERIOR view — a small two-leaf sapling standing in ground, seen
  from outside — does not arrive until beat 11/12 at 1:03-1:12. So for the
  twenty-four seconds between the fall and `whoami` the audience hears a man
  narrating his own inventory with no picture of the thing doing the
  narrating. That is the confusion he named.

where_the_reveal_is_now: >-
  NOWHERE. It was at 0:22, in the tail of beat 05, in v36b and v36c. It is
  gone from `review/tonight/EP1-PROVISIONAL-v37-bench.mp4` (91.92s, 15 beats,
  0 slates), which is v36c with that one insert removed and nothing else
  changed. Beat 05 is again a single clip, `05-fan-spinning-down.mp4`, 2.58s
  inside its authored 4.00s slot. The episode's first exterior view of the
  sapling is once more beat 11/12 at 1:03-1:12, and the first plant image of
  any kind is beat 09's leaf macro at 0:48 — that is, the confusion he named
  on 2026-08-11 is BACK, and knowingly so, because the only fix available
  without a new render was the one he rejected.

why_the_reveal_is_absent_from_v37: >-
  His two rulings on 2026-08-11 point opposite ways and the second one is
  narrower, so it wins for now. He asked for the reveal earlier ("also we
  should show that he became a sapling earlier in the video just to make it
  less confusing"), and then, having seen the implementation, ruled "dont show
  beat 12's picture twice."

  The steward looked for another frame that could carry the reveal without
  repeating a picture and found none. Every sapling image in this node is
  already on screen in its own beat: 11-grow.png (beat 11, 1:03),
  12-undefined.png (beat 12, 1:09), 13-i-always-left.png (beat 13, 1:12),
  15-something-s-coming.png (beat 15, 1:34). The unchosen sibling takes —
  `takes/stills/12-undefined-{r2,fix}-s{0..3}.png`,
  `takes/stills/15-something-s-coming-{r3,fix}-s{0..3}.png` — are same-round,
  same-composition variants of exactly those two pictures, so cutting one in
  would read as the repeat he just rejected while ALSO putting an unapproved
  take on screen, which is his call and not the steward's (R4). Beat 15's
  frame was already ruled out on its own merits before he spoke: it is the
  closing image and it is dusk, so it spends the ending early and cuts badly
  into beat 06's morning sky.

  So v37 leaves the reveal out rather than guessing at a second insert. The
  honest gap is the smaller error, and it names the next render exactly.

what_would_close_it: >-
  A NEW PLATE — one picture of the sapling that belongs to beat 05, not
  borrowed from a later beat. Roughly: the two-leaf sapling in grass, morning
  light to match beat 06's sky, framed wider or from a different angle than
  beat 12's push-in so it cannot read as a repeat. That is a still render plus
  a held-still push-in, both $0 and local, and beat 05's unused 1.42s of slot
  is already there to hold it with no script change. It needs his go, because
  it is a new picture in the episode and the picture is a taste call.

  If instead he wants the reveal to HOLD rather than flash, beat 05's slot has
  to grow past 4.00s, and that IS a script change to `node.md` and to every
  beat timing after it. Not assumed here.

what_changed_in_the_script: >-
