where_the_reveal_was: >-
  MEASURED FROM THE CUT HE JUDGED, not from the script's intent. Through the
  first half of the episode the viewer is never shown what he has become. Beat
  06 (0:24) is open sky with no plant in it — by his own 2026-08-07 ruling, a
  first-person POV cannot contain its own body. Beat 07 (0:29) is a grass field
  and horizon. The first plant image of any kind is beat 09's leaf macro at
  0:48, which is also where the words say it outright:

      $ whoami
      sapling (ficus. probably.)

  The first EXTERIOR view — a small two-leaf sapling standing in ground, seen
  from outside — does not arrive until beat 11/12 at 1:03-1:12. So for the
  twenty-four seconds between the fall and `whoami` the audience hears a man
  narrating his own inventory with no picture of the thing doing the
  narrating. That is the confusion he named.

where_the_reveal_is_now: >-
  At 0:22, in the tail of beat 05 — the silent beat between the fall and the
  first sky POV. The dark apartment floor and the broken mug play as before,
  then the picture cuts, for 1.42s, to the sapling in grass. Beat 06's sky
  then reads as HIS view of it. The explicit `whoami` reveal at 0:48 is
  untouched and now lands as confirmation rather than as the first news.

what_changed_in_the_script: >-
  NOTHING. No beat was added, removed, renumbered or reordered, and no line of
  dialogue moved. This is the reason to prefer this reading of his instruction
  over a reorder: beat 05's authored slot is 0:20-0:24 (4.00s) and its footage
  is 2.583s, so 1.417s of the slot the author already wrote was playing as
  nothing at all. render_t3 sequences multiple `NN-*.mp4` per beat in stem
  order, so the insert fills room that already existed. The alternative —
  moving beat 09 (`whoami`) earlier — was rejected because beat 08 ends on
  "step two: what do we actually know?" and beat 09 is its answer; pulling 09
  in front of 08 breaks the one causal join in the middle of the episode.

what_the_insert_is: >-
  1.42s on screen, cut from `12-undefined.mp4` — beat 12's own held-still
  push-in over the current non-revoked beat-12 still. No model ran; nothing was
  generated, voiced or synthesised for this change. Full provenance in
  `review/provisional-v36b/clips/05-sapling-reveal.mp4.meta.yaml`.

the_cost_he_should_weigh: >-
  THE INSERT IS A PICTURE THE EPISODE SHOWS TWICE. It is beat 12's frame and
  beat 12 plays it again at 1:09. Beat 15's sapling was the other candidate
  and is worse for this: it is the closing image and it is dusk, so it would
  spend the ending early and cut badly into beat 06's morning sky. If he wants
  the reveal on a frame of its own, that is a new plate and a render — which
  is his call, not the steward's, and is not what this bench cut assumes.

  Second thing to look at: 1.42s is the whole of the unused slot, so the reveal
  is a flash. If he wants to hold on it, beat 05's slot has to grow, and that
  IS a script change to `node.md` and to the beat timings after it.
