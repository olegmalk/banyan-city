# IT LIVES IN `leaves/drafts/` AND NOT IN `leaves/` FOR A MECHANICAL
# REASON, recorded so nobody "tidies" it back up one level.
# `render_local.approved()` — the single §6 gate that render_t3,
# generate_shots, synth_vo, still_local, post_motion and run_remote all
# call — reads `sorted(leaves/*-t0-*.yaml)[-1]`, the LAST filename, as
# "the node's script". `001-t0-e-draft.yaml` sorts after
# `001-t0-d.yaml`, so while this file sat in `leaves/` it WAS the
# script as far as every one of those tools was concerned, and its
# `approved_by: none` refused all media for node 001 — not just this
# lane's, every lane's. It was there for about two minutes on
# 2026-08-11 and the refusal is what a correct fail-closed gate should
# do; the misfiling was the steward's. The glob is not recursive, so a
# subdirectory keeps the draft next to the leaves for a human to find
# while leaving `001-t0-d.yaml` as what it still is: the newest actual
# leaf and the approved script this cut was assembled from.
#
# STATUS CHANGED 2026-08-11, SECOND PASS. The founder read the cut this
# draft described (`EP1-PROVISIONAL-v36b`/`v36c`) and ruled, verbatim:
# "dont show beat 12's picture twice." The insert this draft was
# written to record has therefore been REMOVED. The current bench cut
# `review/tonight/EP1-PROVISIONAL-v37-bench.mp4` contains no reveal
# insert at all and shows nothing the approved script does not
# describe — so as of v37 this draft records an OPEN REQUEST, not a
# change to the picture. His original direction is NOT withdrawn and
# is still owed an answer; see `why_the_reveal_is_absent_from_v37`.
# ===================================================================
