  round 5, and the round is a DIAGNOSIS acted on rather than another wording edit. r3 was rejected (women, too many clouds/weird cloud formations) and r4 — built one change per named fault — was rejected harder: 'for the too blue image, its getting worse, many random girls and very strange cloud formations.' Girls went 2/4 to 3/4 on a round whose entire purpose was to remove them, so the mechanism was wrong, not the wording. THE MECHANISM, CHECKED OUTSIDE THIS REPO BEFORE A FRAME WAS DRAWN. animagine-xl-3.1's model card states it is 'optimized for Danbooru-style tags rather than natural language prompts' and gives the caption structure '1girl/1boy, character name, from what series, everything else in any order' — the presence of PEOPLE is declared by a POSITIVE tag at the front. `no humans` is that declaration for a picture with nobody in it, and the published landscape templates for this model family carry it in the positive next to `scenery`. sd_prompt._NEGATION (line 89) has been deleting that phrase from the positive and appending `humans` to the NEGATIVE on every round this beat has ever run, which asks the model to suppress the no-people concept. Danbooru's own tag page timed out from here twice and is not cited as if it had been read. WHAT ELSE IN THE r4 POSITIVE ASKED FOR A PERSON. `seen from ground level looking straight up` carries `looking up`, a Danbooru POSE tag, and `from below`, a character-relative camera tag — gaze vocabulary left over from the original 'he can see himself when he is looking at the sky' note, which the founder himself retired on 2026-08-07. The subject slot was also empty (`an empty expanse` names no object), and 002b b01 r6 — the 4/4 clean frame drawn on this same model, recipe and pass — differs precisely in having a seedling to draw. And `cirrus`, `cloudscape`, `scalloped clouds`, `cumulonimbus` are not Danbooru tags: six were negated and one asked for, out-of-vocabulary noise on the exact axis he called 'very strange'. ROUND 5 IS ONE TACTIC — say it in the model's own dialect and name nothing else. Native tags only; `no humans` FIRST as the card's structure requires, `scenery` beside it; plain `cloud` in place of four invented cloud words; and not one noun a body could attach to — no grass, no ground, no gaze, no camera angle. THE PERSON NOUNS ARE OUT OF THE NEGATIVE on purpose: they are the mechanism that has now failed twice here, and keeping them would leave the result unreadable. THE ONE DELIBERATE DEVIATION FROM THE MACHINE PATH is this script putting `no humans` back at the head of the positive and deleting `humans` from the negative after sd_prompt has run — printed, guarded, and recorded here because it is the experiment. sd_prompt.py is NOT modified by this round. WHAT DID NOT MOVE: no leaf in the image (his own 2026-08-07 composition note — a first-person POV cannot see its own body), so `leaf, plant, stem, foliage, tree` stay negated. `_SMALL` does not fire on this prompt, so no scale negatives attach and the `tall tree` removal is a no-op, not a skipped step. SEEDS ARE THIS BEAT'S OWN k=4..7, the same four r3 and r4 drew, so every column is a controlled triple.
