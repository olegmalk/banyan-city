frame_identified_by: >-
  THE STEWARD, VISUALLY — HE NAMED NO FILENAME, and this matters enough to say
  in the file rather than in a report. r8d-step3 produced exactly two frames and
  they are not close: s0 (this one) is a centred sunburst star with the cloud
  banked into the left and right edges and a large open blue field; s1 puts the
  sun off the TOP-RIGHT corner behind one broad diagonal ray with a continuous
  cumulus bank across the middle third. Both were opened. s0 was taken because
  it is the one that answers the fault he actually named — "too many clouds" —
  s1 carries visibly more cloud area than s0 and would not be a fix. One caveat
  recorded rather than smoothed over: the lane that identified it described the
  sunburst as "centre-left"; it reads as centre, a little left of the vertical
  midline. The elimination between two frames is unambiguous either way, but the
  identification is an inference from a description and not a filename he typed.
