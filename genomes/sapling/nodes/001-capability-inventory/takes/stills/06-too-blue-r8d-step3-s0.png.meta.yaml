what_this_round_changed: >-
  ONE VARIABLE against r8c-step2, which was the highest rung of the cloud ladder
  that had been SEEN to work: the word `sunny` added to the positive. The
  negative did not move at all and neither did model, size, steps, guidance or
  the two seeds. Cloud coverage comes down by describing an open bright sky.
why_there_was_an_r8d: >-
  r8c steps 3, 4 and 5 drew a metal porthole with a red-eyed head, a white
  rabbit-demon and a wolf head instead of sky — the "wolf" and "weird metal
  robot thing" in his verdict above. Diagnosed at commit 2acabe7: the negative
  was byte-identical between the frame that worked and the frame that drew a
  robot, and the whole delta was the word `cloud` leaving the POSITIVE, which
  emptied the subject slot on a Danbooru-captioned checkpoint. r8d restores
  `cloud` as the subject anchor and moves the dial with `sunny` instead. Trap 10
  in pipeline/render_b06r8.py now refuses any run whose positive names no
  subject.
prior_rejections_this_beat: >-
  r3 and r4 ("women, too many clouds/weird cloud formations", "its getting
  worse"); r5/r6/r7 compositions ("none of the beat 6 images will work ... its
  showing the ground as some flat place, or showing cities for some reason");
  r7b-s0 ("this one ... but actually, regenerate it. too many clouds. you almost
  got it"). Five rounds of refusals, all of them about what OCCUPIES the frame.
