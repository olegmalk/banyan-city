notes: >-
  36 beats / ~182s = a cut every 5.1s at 0.8 spoken lines per shot, replacing 4
  shots for the same material (one picture every 22 seconds). Nothing was
  added: the four scenes were cut into their own pictures and the long speeches
  split at the sentence. No beat carries more than ~6s of voice, so no clip has
  to loop or freeze to cover its line.
  RUNTIME IS THE AUTHOR'S CALL (R4): 006b-t0-a's header said 60-90s, but its
  text has always held ~3 minutes of speech — the header was a guess, not a
  measurement, and re-cutting revealed it rather than causing it. Getting to
  ~2:00 means cutting material, which is the founder's decision, not the
  steward's. Cheapest candidates if he wants them, in order: beats 13-14
  ("ledger versus production" / "a worse robe"), beat 21 (the seal), beat 11
  ("the sky, ma'am?"), beat 05 (the headcount).
  Two beats run 7s by design — 23 (the console line, the episode's central
  idea) and 36 (the closing hook). Both are far inside the 16.04s clip ceiling
  measured 2026-08-10.
  Beat time ranges are ESTIMATED from word counts, not measured: retime_beats.py
  needs voice takes and this node has none. They must be re-derived the first
  time it is voiced.
