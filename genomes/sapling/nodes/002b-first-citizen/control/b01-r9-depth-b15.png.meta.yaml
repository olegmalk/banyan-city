# ------------------------------------------------- stage 0 gates (plan §7)
# Measured with numpy/PIL, no model. Numbers, not adjectives.
gate_polarity:
  result: PASS
  evidence: >-
    near reads bright, as MiDaS inverse depth requires. Bottom 90-100% (near
    grass) mean 233.07; top 0-10% (sky, farthest) mean 4.52; delta +228.55 of
    255. Sprout band sits between at 113.82. Not inverted.
gate_sprout:
  result: PASS
  evidence: >-
    The sprout is present with both cotyledon leaves and an unbroken stem.
    Stem tracked as a bright depth ridge against the plate's dark stem line:
    median |dx| = 4 px, within +-8 px on 9 of 14 sampled rows; the 4 rows that
    diverge are below y=92% where the stem enters the near-field grass mass and
    a nearer blade legitimately wins the ridge. Stem FWHM in the map 9 px.
    Ridge detectable y=668..1069, i.e. 54.9%..87.9% of frame height. Sprout
    band sits +109.30 levels above the far sky, so it is a distinct depth
    region rather than smeared into the background.
  downsample_retention: >-
    The plan's §2 claim verified rather than assumed. Plate sprout-band
    (y 60-80%, x 40-70%) luminance std 26.340; after round-trip through
    short-side 518 it is 25.876 = 98.2% (plan said 98.7%); through short-side
    384, 97.1%; and through the estimator's ACTUAL 384x384 squash, 96.9%. The
    real path is the squash, which the plan did not measure — it retains more
    than the plan's 384 figure of 94.6%, so the conclusion holds with margin.
gate_shaft:
  result: PASS
  evidence: >-
    b15's shaft of light does not survive into the map. The plate's top-25%
    column-luminance profile peaks at x=333 at +39.2 levels above its band
    mean; at that same x the map is +0.30 levels above its band mean. The map's
    whole top-25% profile spans 0.06..9.39 of 255 — 3.7% of dynamic range —
    against the plate's 54.8..113.2, and its detrended wedge rms is 2.32
    against the plate's 18.10 (12.8%). Sky region (top 22%) mean 5.59, max 14,
    and 0.00% of its pixels exceed level 32. The sky is a smooth near-zero far
    field with no wedge in it, which is the whole point of the round.

