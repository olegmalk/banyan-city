note: >-
  Stage 0 of B01-R9-PLAN.md. The round's claim is that depth separates what
  strength could not: r8 proved the b15 init produces grounded whole-plant
  frames on 8 of 8 and that all 8 wear the plate's amber dusk, because an RGB
  init makes geometry and colour the same numbers. This map is the geometry
  with the colour thrown away. The honest risk the plan names is unchanged and
  is not a measurement question: the near-field blades are large and bright in
  this map, so the macro ARRANGEMENT is encoded in the geometry even though the
  macro LOOK is not — whether a sunrise wide shot built on it still reads
  "small" to the founder is R4 and the frame that asks him is the deliverable.
