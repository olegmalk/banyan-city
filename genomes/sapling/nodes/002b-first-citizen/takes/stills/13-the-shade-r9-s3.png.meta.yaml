lls two things, both the cheapest of their kind: the indefinite article (`A small goblin boy` becomes `Small goblin boy`) and `patch of` (`folds into a thin patch of shade` becomes `folds into thin shade`). That frees four for a three-token axis and lands at 76 with one token of headroom, anchor intact. The action, its quality and its subject all survive; what is lost is the countable-area framing of the shade, said plainly rather than smoothed over. Nothing else in sentence 1 was eligible: `small`, `green skin` and `plump` are axes his own sentence named, `solo` and `1boy` are tags measured to bind here, and the plant sentence and style anchor are r6's byte-for-byte. WHY THE PLURAL TAG AND NOT HIS OWN PHRASE, MEASURED IN THE CORPUS RATHER THAN PREFERRED — three candidates were checked against Danbooru before one was chosen and every answer came back against the intuitive reading. `tusk` singular is NOT a usable token: the corpus aliases it away, so it carries no learned signal of its own and does not even share subwords with the plural — asking for one tusk with `tusk` asks for nothing. `broken tusk` is 15 posts in roughly 12 million, which is unlearnable, and in a caption vocabulary `broken` neighbours the QUALITY-DEFECT words, so it risks reading as something wrong with the picture rather than with the tooth; it also fits at exactly 77 of 77, spending the last headroom on a phrase the model cannot use. `fangs` is a real heavy tag and was rejected on evidence: it DEEPENS the female skew this beat is fighting, so it would have made his complaint worse while looking like progress. `tusks` is the one that survives, AND THE CORPUS SAYS IT DOES MORE THAN DRAW A TOOTH — it is also a gender lever, which is the thing he actually complained about: `tusks` co-occurs male to female 1.92 to 1, and on posts also carrying `goblin` it takes the female skew from 3.14 down to 1.59, halving it. Record 39 established that "all the goblin images look like female demihumans" is the corpus sampled faithfully rather than a mis-render; this tag pulls the sample the other way. So the cheapest untried lever is not only the missing noun from his script, it is a second and independent pull on the axis r8 delivered least cleanly — male read unambiguously on s0 alone — and that is why the round is worth four seeds even if the tusks come out wrong. It is also r6's and r8's general finding holding a third time: on this checkpoint the tag name beats the mechanism, and WHICH tag is a corpus question answerable from outside this repo in minutes. `boy` stays in the clause and that is not cosmetic: _tag_from_clause tests _MALE before _OTHER, so `small goblin boy` still yields `1boy`, while dropping the word matches _OTHER and hands back `1other`, the indeterminate-humanoid tag that cost r3-r5 three rounds at 0/4. SHOTS.MD IS NOT TOUCHED — the axis is injected script-side and the fence is checked byte-for-byte against the r8 text before the injection runs, so a stale checkout cannot start rather than silently rendering the wrong round under this id, and the approved shot list keeps one authored version of this beat rather than nine. MEASURED ON THE BOX AND ONLY THERE, with the r8 fence as the control on the same tokenizer: this script refuses to run without a real CLIP tokenizer, because _token_estimate silently falls back to an approximation that over-counts this prompt by ~3 near the 77 boundary and read r8 on the Mac as 61 tokens with the anchor dropped — a false failure of r8's own hard gate. Same four seeds as r4-r8, a controlled column. STATED RISKS: the script says "one broken tusk" and this round asks for `tusks` — the plural is what the corpus can draw, so "one" and "broken" stay CHARACTER PROSE, and if he wants the break visible the lever is an inpaint or a close-up rather than a prompt token, filed so the next round does not rediscover it as a prompt problem; if r9 returns two symmetric intact tusks that is the trade, and it is still the first frame on this beat with a tusk in it. `tusks` also co-occurs with `orc`, a heavier, adult, muscular tag that may pull build away from `plump`, which r8 had at 3 of 4. And the round pays for its axis out of the shade clause, so a change in the composition has two possible causes and this record says so rather than crediting the tag. NOT A GATE ATTEMPT: record 32 ruled "P2 is not a valid gate until he defines the goblin, and no r8 may be scored against the old one", and that constraint has not been lifted, so this round is observation and exists to give him one more thing to define the goblin with. Ledger record written BEFORE the sheet. No pick, no wave fires off this beat, and nothing goes on his screen tonight. AND SAID FIRST BECAUSE IT IS WHAT A READER COULD BE MISLED ABOUT: r9 is NOT a clean single-variable round on the positive. It adds one axis and it sells four tokens of the shade clause to afford it, so the positive moves in two places; only the negative is byte-identical and only that is asserted. If the shade or the composition changes, the payment is as likely a cause as the axis.
