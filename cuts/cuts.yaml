      summary: >-
        Ninety seconds, every beat on a real picture. Fourteen of the fifteen are
        frames you chose. Seven of the fifteen barely move, so we started
        re-animating them overnight — and **the motion score came back HIGHEST on
        the beat where the plant falls over**, which is why no wave was chained
        behind it.
      where: "`review/provisional-v34/ep1-v34-PROVISIONAL.mp4` on this machine — the cut and the adjacency strip are both refused by the licence gate, and why is on the card"
      how: "watch it and say what is wrong, or answer beat 6 on item 10 and we rebuild"
      body: |-
        **2026-08-09:** *"no notes for v33, i'll wait for the version with all the
        fixed images."* **This is that version.**

        | | v33 | v34 |
        |---|---|---|
        | beats with a picture | 15 | 15 |
        | slates | 0 | 0 |
        | beats holding a frame you rejected | **4** | **1 — beat 6, since 2026-08-10** |
        | beats holding a frame you have never seen | 2 | **0** |
        | length | 89.9s | 89.9s |

        **THE FOUR STALE BEATS ARE RE-FILMED FROM YOUR OWN PICKS** — beat 3 on
        `b03-r4-s3`, beat 10 on `b10-r1-s3`, beat 14 on `b14-r4-s3`. Beat 14's
        file was compared byte for byte against the take you named before it was
        used, rather than waited for.

        **BEAT 6 HOLDS A FRAME YOU HAVE NOW REJECTED.** It is still `b06-r5-s2`,
        which was our guess and which you turned down on 2026-08-10 — *"none of
        the beat 6 images will work"*. Two samples to your direction are
        rendering; item 10 has them. This cut is rebuilt in about a minute once
        you name a frame, and nothing here is defended.

        **BEAT 3 IS THE OTHER THING TO WATCH FOR.** You have only ever seen it
        moving; in this cut it is a held still with the camera pushing in.

        ---

        **WE MEASURED THE CUT OVERNIGHT AND ONE NUMBER IS THE WHOLE FINDING:
        SEVEN OF FIFTEEN BEATS READ AS STILL FRAMES.** Beats **03, 04, 06, 07,
        08, 10 and 14**, at a median frame-to-frame change of 0.01–0.05 with
        57–88% of their frames identical to the one before. All seven are held
        stills with the 12% push-in, and at 3.4% per second that push is below
        what the encoder can even see — so the measurement is reading them
        honestly rather than failing.

        **The cut's median is 0.30. The version you rejected measured 0.13 and
        the one you picked measured 1.30**, so this sits nearer the rejected end.

        **Beat 13 is NOT one of the seven** even though it sits at 0.30: only 3%
        of its frames are frozen, so it is moving slowly and continuously rather
        than stuttering. Our own flag mislabels it and we are correcting that
        here rather than telling you eight beats are frozen when it is seven.

        **THE OTHER THING THE MEASUREMENT FOUND IS A HOLE IN THE SOUND — 5.5
        seconds with no voice, starting 12 seconds in.** It lands across beats 3
        and 4, which are also two of the seven still beats. Five and a half
        seconds of silence over a picture that is not moving is the same stretch
        failing twice, and it is the most likely place for you to stop the
        playback.

        **WHAT IS FINE, so you know where not to look.** Colour holds on every
        beat — chroma is flat or drifts slightly up across all fifteen, and there
        is no colour collapse anywhere. Loudness is -16.9 LUFS at -1.4 dBTP true
        peak, no digital silence, captions clear the chrome band, nothing is
        stretched. Thirteen automatic checks pass and the two warnings are the
        sound hole above and the known dark opening.

        **THE ADJACENCY STRIP IS BUILT AND THE GATE REFUSES IT — the strip is
        named at the bottom of this page as withheld rather than quietly left
        out.** It is the first frame of all fifteen beats in order, in one row, at
        `CONTACT-v34-adjacency.png` on this machine. **Why it cannot be shown, and
        it is a different reason from everything else on this page:** your
        2026-08-09 word put *animagine* candidate frames onto this page under
        narrowed terms, and **four of these fifteen beats — 01, 02, 11 and 13 —
        were drawn by Wan, which that word did not cover.** One strip contains
        both, so it publishes only if a decision you have not made is assumed.
        We are not assuming it.

        It is an eyeball aid and not a score; nothing in this repo computes an
        adjacency number, and we are not inventing one. **Two things stand out in
        it, so you get the finding even without the picture:** **05 to 06 is the
        hardest jump in the cut**
        (near-black interior straight into bright daylight, which is also the act
        break and may be exactly right), and beats 12-13-14 swing warm, cool,
        warm rather than progressing.

        **THE DECISION THIS PUTS IN FRONT OF YOU IS RE-ANIMATING THE HELD SHOTS.**
        Seven beats being stills with a slow push is a choice we made, not a
        fault that appeared; it is cheap to keep and not cheap to change. We are
        not proposing it until you have watched the cut and said whether it reads
        as still or as calm.

        ---

        **WE STARTED TESTING THAT RE-ANIMATION OVERNIGHT, AND TWO FINDINGS CHANGE
        HOW EVERY EARLIER MOTION RESULT SHOULD BE READ.** Nothing below is a
        proposal and none of it is in any cut. Beats 03, 04, 07, 08, 10 and 14
        have test clips as of 06:40 this morning and the lane is still running.

        **ONE — THE MOTION NUMBER WAS HIGHEST ON THE BEAT WHERE THE PLANT FALLS
        OVER.** Beat 14 was sampled first, because it was tied-worst in the cut
        at a median change of 0.01 with 88% of its frame pairs frozen, and its
        still is canon and uncomplicated. Its first attempt scored **6.87** —
        **five times the cut you picked and three times the busiest beat in the
        episode.** It scored that high because the sapling **bends steadily from
        frame 40 and is nearly horizontal by frame 64.** The plant is falling
        over, and the measurement calls that the liveliest thing in the film.
        **A frame-difference number cannot tell "alive" from "collapsing".** On
        the number alone, five more beats would have been chained behind it
        before a human looked at one.

        The cause was the wording: *"bending and springing back"* gave a
        65-frame model a direction and no mechanism to come back from it. The
        second attempt changed the words only, seed held — upright for all 65
        frames, no invented person or object, style and palette holding. **Its
        framing drifts up and crops the leaf tips**, recorded as an observation
        and left to you.

        **TWO — THE FRAMING LOCK WAS WRITTEN AS A NEGATION, AND NOTHING WAS
        READING IT.** Beat 03's prompt said *"framing locked, no zoom, no
        push-in, no camera rise"* and the camera panned **35% of the frame
        width** anyway. Two faults at once. This model runs with no separate
        pass over the negative prompt, so **a negative prompt changes no pixel at
        all on this path** — and these particular negations were sitting in the
        POSITIVE prompt, where *"no zoom"* contributes the word **`zoom`**. Saying
        the same constraints affirmatively — naming where each object **stays** —
        and changing nothing else moved every framing axis at once: the push-in
        gone, the vertical wander gone, an invented object gone, the pan cut
        **4.7x**, and the ambient motion survived rather than freezing. It is
        **still a reject** by the test written before the clip existed: a uniform
        7% slide remains and crops the monitor's bezel.

        **WHY THAT SECOND ONE MATTERS BEYOND BEAT 03.** Every framing constraint
        on the motion renders before it was written the same way, which means
        **those constraints were doing nothing** — the earlier results were not
        "the constraint was too weak", they were "there was no constraint". Any
        reading of them that assumed otherwise is withdrawn here rather than left
        standing.

        **One more, recorded because it cannot be attributed cleanly:** beat 04's
        invented wrist phone is gone, but three edits shipped in that one prompt,
        so we do not know which of them did it and the record says so.

        **YOU CANNOT WATCH ANY OF THESE HERE AND THAT IS THE GATE, NOT AN
