    - n: 18
      ask: "Define the goblin — green and tusks now hold."
      state: open
      chip: "DEFINE"
      minutes: 3
      summary: >-
        Two more rounds landed overnight: green 4 of 4, tusks 4 of 4, and nothing
        reads female any more. Nothing can be scored until you say what the
        goblin IS — and your words release fifteen waiting beats.
      where: "the round-9 sheet is first on this card, round 8 under it; tap either to open full size"
      how: "tags, labels or one sentence — e.g. `green skin, plump, tusks`, or just describe him"
      sheets_title: "Round 9 first, then the three rounds behind it"
      body: |-
        **YOUR LINE, 2026-08-09:** *"all the goblin images look like female
        demihumans, definitely need to regenerate."*

        **THAT COMPLAINT IS NOW FIXED AND THE BEAT IS STILL NOT DRAWN**, which is
        why this card asks for a definition and not a pick. Two rounds ran
        overnight — four seeds each, 37 GPU-seconds each, $0, nothing opened on
        your screen.

        | round | what it changed | what came back |
        |---|---|---|
        | r6 | words — `1boy, goblin, solo`, the fusion terms negated | goblin reads as a goblin in **1 of 4** |
        | r7 | machinery — the character region conditioned on r6's best goblin | **0 of 4.** Four identical white-haired elves |
        | r8 | words again — `green skin` and `plump` in, **`female goblin` and `elf` negated** | **green 4 of 4**; male on `s0` alone |
        | **r9** | one tag — **`tusks`**, bought for three tokens | **tusks 4 of 4**, the first in nine rounds — and **not-female 4 of 4** |

        **THREE THINGS ARE PROVEN AND YOUR DEFINITION CAN SPEND THEM.** Green, 4
        of 4 across both rounds. Tusks, 4 of 4 — the first tusk this beat has
        drawn in nine attempts. Not-female, 4 of 4, where round 8 read male on
        `s0` alone and logged `s2` as at risk. Not-an-elf holds as well, 4 of 4,
        and the ears are still pointed.

        **THE SECOND EFFECT WAS PREDICTED BEFORE A STEP WAS SPENT**, which is what
        makes it evidence rather than luck. `tusks` co-occurs male-to-female
        1.92:1, and on pictures that also carry `goblin` it takes the female skew
        from 3.14 down to 1.59 — it halves it. That was read out of Danbooru while
        the recipe was being written and put into the render script before the
        render ran. What you were seeing was the corpus sampled faithfully:
        **`female goblin` is 1,717 of the 4,257 pictures this model knows as
        `goblin`**, and that tag had never once been in the negative.

        **WHY THE WORDS WORKED WHERE THE MACHINERY DID NOT.** Round 7's technique
        did what it promised: four seeds returned **recognisably the same
        character**, which had never happened on this beat. What it could not
        carry was the green — in the picture it copied from, the head is bowed
        under a brightly lit white bob and the green skin is a small dark patch
        underneath, so it took the hair and the coat and left the one thing that
        mattered. Round 8 stopped copying a picture and named the attribute
        instead; round 9 named one more.

        **WHAT ROUND 9 COST, and it is not being smoothed over.** The seedling is
        **gone from all four** — the plant fails on every frame, the worst this
        beat has been since round 6 bought it. Two causes fit and the record picks
        neither: paying for `tusks` took `patch of` out of the shade clause, or
        the new tag pulled the whole draw towards a character portrait. Two other
        things stay wrong: the tusks are **two and whole** where your script says
        one broken, and it is night again in three of four on a prompt that says
        midday.

        **ONE BROKEN TUSK IS NOT A PROMPT LEVER, and that is measured now rather
        than assumed.** `tusk` singular is aliased away and carries no signal.
