  Recorded sound is CC0 and CC BY, one row each in the node's
  `audio-sources/SOURCES.md`. Cash cost of everything on this page: **$0**.
  Every file has a `.meta.yaml` beside it carrying the recipe, the seed and the
  SHA-256 of the exact bytes served, and every one passed the licence gate.

  **The one open licence question, stated rather than buried.** The drawn frames
  under every beat came from `cagliostrolab/animagine-xl-3.1`, whose CreativeML
  Open RAIL++-M licence attaches use restrictions that travel to the output —
  while this tree publishes CC BY 4.0, which offers reusers unrestricted use.
