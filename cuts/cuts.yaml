# The working cuts, and the copy the /review/ page renders around them.
#
# WHAT THIS DIRECTORY IS. Every other .mp4 in this repo is either a leaf (an
# episode the author passed) or untracked working media. These are neither:
# they are cuts he has NOT passed, committed on purpose so he can screen them
# from a phone. His decision, 2026-08-07, DECISIONS.md D17 — "'Don't produce
# media from scripts I haven't read' does not mean you cant put media we have
# already produced on the website."
#
# THE RULES THAT DID NOT MOVE. §6 still forbids making media from a script he
# has not read; nothing here was. Canon still needs his verdict; none of these
# is canon and none has a leaf. And every file listed below goes through
# build_site.publishable() before it is copied — a file that fails the licence
# gate is withheld and the page says so.
#
# Adding a cut: drop <name>.mp4 here with a stem-named <name>.meta.yaml beside
# it, then add a block below. Nothing else to edit. Same for a still under
# `sheets:` or a voice take under `audio:`.
#
# WHEN HE ANSWERS ONE, SAY SO HERE THE SAME DAY. A cut carries `status:` once it
# has a verdict, and the page prints it above the player before any other claim
# the card makes. On 2026-08-07 he refused v32 in the evening and this page went
# on telling him v32 was "the one to answer on" — the page's one job is to say
# what a thing IS, and for a few hours it said the opposite. A refused cut is
# never deleted: it is the record of what he refused.
#
# ---------------------------------------------------------------------------
# WRITE SHORT. HIS WORDS, 2026-08-09: "make banyan.city/review simplified,
# there's too much unnessecary yap."
#
# The rule that came out of it, and it is a rule about SENTENCES, not about
# facts. Nothing true was deleted to shorten this file: every quote of his,
# every recorded verdict, every address, confidence and measurement is still
# here. What went is our narration ABOUT the narration — the paragraphs that
# explained why an item was worded the way it was, the three separate places
# each item said "read this as here is what we heard", and the standing
# disclaimers that were repeated per item instead of said once.
#
#   - `ask:` is a headline, twelve words at the outside. It is not the place to
#     explain, hedge or date-stamp; `summary:` takes one sentence if the ask
#     genuinely needs one.
#   - `where:` and `how:` are load-bearing and stay on every open item. He is
#     fourteen, screening on a phone in five-minute passes: where the thing is
#     and how to answer it are the two facts a card exists to carry.
#   - The fold keeps the evidence. If a sentence is not a quote of his, a fact
#     about the work, or a number, it probably belongs nowhere.
#
# ---------------------------------------------------------------------------
# THE CANDIDATE FRAMES ARE ON THE PAGE NOW (2026-08-09), and this comment used
# to say the opposite in bold. His words: "put the images from my computer onto
# there please, not like theres any reason to hide it."
#
# What that decided and what it did NOT. It decided VISIBILITY: the sheets and
# the picked plates publish to /review, in `cuts/review-assets/`. It did not
# resolve D15 — animagine-xl-3.1's CreativeML Open RAIL++-M use restrictions
# still travel to the output, and this tree still publishes CC BY 4.0. So those
# images go out under a NARROWED offer, stated on the page and in every
# sidecar: they carry the OpenRAIL++ restrictions and are not CC BY 4.0.
# Nothing else on the site moves, and D16's LTX clips are still withheld —
# that sign-off is a separate open question and it is still his.
#
# WHAT IS COMMITTED IS A JPEG RENDITION, not the original PNG. The ten sheets
# and five plates are 54 MB as PNG and 9.8 MB as JPEG, and a repo is paid for
# in clone time. Each sidecar records the source path, the source SHA-256 and
# the encoding, so a rendition is checkable against the frame it came from.
# The candidate PNGs themselves stay gitignored (`takes/**/*.png`) — this is
# the published copy, not a promotion.
#
# ---------------------------------------------------------------------------
# `state:` drives the left bar and decides which half of the page an item lands
# in: `open` items are cards at the top, everything else folds into the record
# below. `settled` is something he already decided and we are only confirming we
# heard right; `gap` is an item whose evidence has not landed.
#
# `pending:` IS THE HONEST HALF. An item whose evidence has not arrived prints
# its `pending:` text and nothing else. It does not quietly disappear, because a
# checklist that hides its own gaps is how "seven new frames are ready" becomes
# a morning spent discovering there are none.
#
# PROVISIONAL MODE, from 2026-08-09 — "human feedback should never be a blocker,
# by design." Items 12 and up were BUILT while he slept, on picks the steward
# made in his place and logged in `taste/steward-model.ledger.yaml` before he saw
# anything. Three properties are load-bearing:
#   1. every such item states the provisional pick it stands on, by address;
#   2. every such item states the prediction and its confidence, so his verdict
#      scores the model rather than just settling the frame;
#   3. the sheets stay NEUTRAL — labels and seeds, no favourite marked. The pick
#      is disclosed in prose, never as a mark on a picture he is choosing from.
#      That is gate G3, and violating it voided the 2026-08-08 cold-open pick.
# Taste is still his (R4). A `PROVISIONAL` label is not a soft approval.

page:
  title: "Working cuts — episodes 1 and 2, unscreened"
  eyebrow: "UNLISTED · WORKING CUTS · PROVISIONAL · NOT THE EPISODE"
  # Rendered as the page's own explanation of itself, one fold down in the
  # record. Written for Roman; a stranger who guesses the URL should also be
  # told what he is looking at and what he is not.
  why: |-
    **Nothing here is the episode.** These are working cuts and candidate
    frames the author has not passed. The published episode is on the season
    page; if one of these ever replaces it, it will be because he said so, in a
    record you can read.

    It is unlisted rather than secret: nothing in the site's navigation points
    here, the page tells search engines not to index it, and the repo that
    makes it is public — as is the decision that put it here (D17).

    **Two files are still not on this page and both are licence refusals, not
    missing renders.** v33 holds two animagine-drawn frames (**D15**) and
    episode 2's first pass holds three LTX renders (**D16**); the build's own
    gate refuses both cuts, which is the gate working. The checklist names
    where they sit on the machine.

    **The candidate frames themselves ARE here**, on the founder's word of
    2026-08-09. They publish under an offer narrowed to the terms their model
    imposes — `animagine-xl-3.1`, CreativeML Open RAIL++-M, whose use
    restrictions travel — so they are **not** under this site's CC BY 4.0. The
    line under each gallery says so, and every image carries its record.

