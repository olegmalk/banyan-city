        the fourth is clean in every other way and is *the picture you withdrew,
        redrawn* — standing **36% of frame height against the revoked plate's
        32%**. Taller than the one you threw out. **Confidence 0.80.**

        **UPDATE 2026-08-10 — ROUND 7 RAN AND YOUR SHOT LIST'S OWN SENTENCE MADE
        IT WORSE.** One sample, four seeds, 37 GPU-seconds, $0. The single change
        was the fix already written into the shot list — `rising well above the
        grass` out, `no taller than the grass around it` in — on round 6's seeds
        with the negative held character for character. **It made the plant
        taller.** The only rooted, whole-plant frame measures a stem at **39% of
        frame height**, against the **32%** plate you revoked with *"its tooooo
        tall"*. Two of the four hang down from the top edge with no ground under
        them and the fourth runs off the top. All four rejected, confidence 0.88.

        **WHY IT BACKFIRED, and this is the part worth keeping.** The model cannot
        read the word *no*. This codebase lifts `no X` out of a prompt into the
        negative for exactly that reason, but the lifting only catches short
        phrases and this one was too long — so the sentence reached the model as
        written and it read **"taller than the grass around it"**. A measurement
        expressed as a negation cannot work in a positive prompt. **Round 8 is not
        going to be spent rewording it.**

        **One thing regressed and it is not being buried:** a child came back in
        one of the four, with `girl, boy, child, person` all verified present in
        the negative — the same string, to the byte, that returned zero people in
        round 6 on that same seed. So round 6's clean sweep was not a property of
        the negative after all. The reading that fits all three rounds is about
        the subject: when the plant fails to hold the frame, the model fills the
        composition with a figure. That is filed as a hypothesis, not a law.

        **If you agree, the next move is not another sheet.** Round 5's only lever
        was `thin` → `sturdy` and the drawing did not move, so adjectives are spent
        here. What changes is composition and negatives: camera **down and in** so
        a 40cm plant is not drawn as a tall weed to be visible at all — the two
        frames of this plant you have kept, `b15-r3-s1` and canon `12-undefined`,
        are both grass-height shots — plus the negative terms that actually bind
        (`1girl, 1boy, child, person`), because `no humans` is demonstrably not
        firing on this wave. **One sample before any set of four.**

        **UPDATE 2026-08-10 — ROUND 8 DID THAT, AND IT SETTLED HALF THE BEAT.**
        The height instruction left the prompt entirely and became the picture:
        your approved plate `b15-r3-s1` was fed in as a starting image at two
        strengths (0.35 and 0.55), four seeds each, with a text-only arm on the
        same four seeds as the control. **Twelve frames, one sheet, no favourite
        marked.**

        - **The half that is fixed:** a grounded, whole plant in **8 of 8** of
          the init frames, at roughly **30%** of frame height at strength 0.35
          and **25–34%** at 0.55 — under the 32% you revoked. Seven rounds of
          wording produced no such frame; the init produced eight.
        - **The half that is not:** all eight also wear the plate's **amber
          dusk, its light shaft and its macro bokeh**, where this beat asks for
          a peach-and-gold sunrise **wide shot**. Round 8's own text-only arm
          drew that sky correctly on **all four** seeds — so the prompt is fine
          and the starting image is overriding it.
        - The steward logged **reject-all at 0.72** with all twelve vetoed and
          no pick, written before you saw anything. That is a prediction, not a
          verdict.

        **THAT SPLIT IS THE WHOLE REASON ROUND 9 EXISTS.** With an ordinary
        starting image, geometry and colour are the same numbers and `strength`
        is one dial over both — you cannot buy the shape without buying the
        light. So round 9 converts your plate to a **depth map** first: one
        channel of geometry, colour thrown away before the first step, fed
        through a depth ControlNet. Everything else is round 8's, byte for byte.
        **Your approved frame is read for its hash and never handed to the
        pipeline**, and the map carries strictly less than the still it came
        from, so it can subtract from what you approved but cannot add anything
        you have not seen.

        **WHAT THE ONE FRAME DID.** Both of the two tests written down *before*
        it was drawn came back pass: the geometry stayed inside the height
        ceiling, and the sky measured with the correct sunrise rather than with
        the plate's amber dusk. **Two things it also showed, neither of them
        smoothed over:** the depth map carried the plate's **macro lens** along
        with its geometry, and **a light shaft the map does not contain came
        back anyway.** 40 steps, 15 seconds of GPU, $0.

        **AND ONE DEFECT IN THE TEST ITSELF, said plainly because it changes
        what the frame proves.** The negative prompt this round was supposed to
        send ran to **75 tokens against the model's 77-token ceiling**, and the
        builder silently dropped two of them to fit — `realistic skin texture`
        and `jpeg artifacts`. **75 written, 72 actually sent.** Those 72 are
        byte-identical to rounds 7 and 8, so this frame **is** comparable to
        round 8 on geometry; it is **not** the clean one-thing-at-a-time test
        the round's own plan specified. It is logged as `NEGWARN … DROPPED` in
        `review/b01-r9/b01r9.log` and recorded as a fault rather than tidied
        away.

        **WHY YOUR ONE WORD IS THE GATE.** `render_b01r9.py` refuses to draw
        more than one frame without an explicit unlock — one sample before any
        set, in code rather than in a note. The remaining twelve are about three
        minutes of GPU, so this is not an expensive answer; it is a *blocking*
        one. Nothing else on this beat — no r10, no motion test, no episode-2
        opening — can start behind it.

        **The Wan film of the withdrawn frame is below**, as the record of what you
        were asked and refused. **The LTX film of it exists and this page still may
        not show it** — LTX's licence keeps its output off anything we publish
        (**D16**, open, yours). It sits at `review/ep2-b01/ltx-b01-v2.mp4`.

        **One number, explicitly not an argument:** LTX drew those six seconds in
        **207 seconds against Wan's 539** — 2.6x faster at a third of peak memory.
        Over twenty-one beats that is real, and it still does not pick a look.
      sheets:
        - file: review-assets/B01-R9-d60-s0.jpg
          label: "the cold open, ROUND 9 — ONE frame, 002b-b01-r9-d60-s0"
          note: "your plate as geometry only. Both pre-written tests passed; the macro lens and a light shaft came through anyway. The other twelve are locked until you look."
        - file: review-assets/LABELED-b01-r8.jpg
          label: "the cold open, ROUND 8 — twelve frames, three arms of four seeds"
          note: "init at 0.35 and 0.55 plus a text-only control: grounded plant 8 of 8, and the plate's amber dusk on all eight. No pick; steward reject-all at 0.72."
        - file: review-assets/LABELED-b01-r7.jpg
          label: "the cold open, ROUND 7 — b01-r7-s0 to s3"
          note: "the clause meant to shrink it grew it: 39% of frame height against the 32% you revoked"
        - file: review-assets/LABELED-b01-r5.jpg
          label: "the cold open, round 5 — b01-r5-s0 to s3"
          note: "labels and seeds only, no favourite marked; all four provisionally rejected"
      clips:
        - file: checklist/002b-b01-5b.mp4
          label: "Wan 2.2 — 6.0s — OF THE WITHDRAWN FRAME"
          note: "the record of the question you refused, not a candidate; 539s to render"
      pending: >-
        **The Wan clip is withheld too** — a licence-gate refusal, not a missing
        render.
    - n: 13
      ask: "Episode 2, first pass — mostly a listen."
      state: open
      chip: "SCREEN"
      minutes: 4
      summary: >-
        Your whole 21-beat script end to end for the first time — three beats
        filmed, eighteen on slates.
      where: "`review/ep2-prov-0809/ep2-PROVISIONAL.mp4` — 119.2s · 720x1280 · $0"
      sheets_title: "The three plates that got filmed — beats 16, 18, 21"
      how: "does it run? is any beat too long or short? does the ending land?"
      body: |-
        **18 SLATES SOUNDS LIKE A FAILURE AND IS NOT THE POINT OF IT.** The 21-beat
        script you approved has **never been assembled before** — both episode-2
        cuts in the tree are the old five-beat version from before the rewrite.
        This is the first time your current script exists as something you can
        play: all eighteen approved voice takes, in order, in the voice you passed,
        with captions and the real beat lengths. **Listen before you look.**

        **The three filmed beats happen to be the ending** — luck, not design; they
        are the only three of twenty whose frames survived. They run 1:15 to the
        end, and their three plates are below.

        | beat | shot | frame | predicted | conf |
        |---|---|---|---|---|
        | **16 — WHY** | close on the leaf, goblin blurred behind | `002b-b16-r3-s2` | ratify | **0.40** |
        | **18 — THE DECISION** | macro, the fig, stem trembling | `002b-b18-r3-s0` | ratify | **0.45** |
        | **21 — THE ANSWER** | the leaf tilts, on purpose, and holds | `002b-b21-r3-s3` | ratify | **0.50** |

        **THE LEAST CONFIDENT PREDICTIONS ON THE PAGE**, with two reservations
        written down before you watched, so they count as misses and not hindsight
        if you name them:

        - **Beat 16** — the background is a plain grey-lilac, and **the goblin the
          prompt asked to have blurred behind the leaf is simply absent.** *"A
          blank dark background"* is a phrase you have used as a fault.
        - **Beat 18** — faint **white dashed sketch marks ring the fruit**, a
          flourish nothing else in this show has.

        **WHY THE OTHER 18 ARE SLATES — a decision, not a shortfall.** The overnight
        job was briefed to film all twenty. It filmed three and **refused
        eighteen**, because their candidates had already been rejected: human
        figures in beats the script writes empty, mostly, the same defect twenty
        times. Filming them would have cost two hours of GPU and dressed rejected
        frames up as progress. Two agents reached that separately and cross-checked
        each other's frames byte for byte.

        **WHAT YOUR ANSWER DOES.** If the three endings hold they are promoted and
        episode 2 has its closing run. Pacing notes on the other eighteen are free
        to act on — no frame is being defended there. The twenty rejected beats go
        back for a round 4 built on composition and negatives, not adjectives.

      sheets:
        - file: review-assets/PICK-002b-b16-r3-s2.jpg
          label: "beat 16 — 002b-b16-r3-s2 — PROVISIONAL"
          note: "confidence 0.40; the goblin the prompt asked for is absent"
        - file: review-assets/PICK-002b-b18-r3-s0.jpg
          label: "beat 18 — 002b-b18-r3-s0 — PROVISIONAL"
          note: "confidence 0.45; white dashed sketch marks ring the fruit"
        - file: review-assets/PICK-002b-b21-r3-s3.jpg
          label: "beat 21 — 002b-b21-r3-s3 — PROVISIONAL"
          note: "confidence 0.50; the tilt reads as a decision, not as wind"

    - n: 15
      ask: "Beat 15's motion line — ANSWERED. You approved the replacement."
      state: settled
      chip: "CONFIRM"
      body: |-
        **You said *"yeah looks like a good proposal"*, and it is in the script.**
        Episode 1 beat 15 now reads:

        > The sapling in the grass, dusk light. The far-off thump-thump is closer
        > now — each pulse felt through the ground, the leaves trembling with it.

        What it replaced, kept here because that is the whole point of the change:

        > Underground: the far-off thump-thump is closer now, the rings of light
        > through the soil brighter and faster

        That line described the frame you threw out — *"for beat 15, why is it
        showing the underground? i think it should show the sapling, no?"* The
        still was swapped for `b15-r3-s1` and promoted to canon; the motion line
        was not, and the beat's own negative already forbade `underground`. Your
        script and your rules were contradicting each other inside one render, and
        now they are not.

        **ONE HONEST FOOTNOTE.** The wording you approved in chat is not word for
        word what this card proposed. This card offered *"The thump-thump is closer
        now, felt through the ground — the grass shivers and the sapling's two
        leaves tremble with each pulse."* You were shown, and said yes to, the
        version above — it establishes the frame first. **The version you said yes
        to is the one that went in**, and both are recorded in the leaf
        (`leaves/001-t0-d.yaml`, `revisions`) so nobody re-litigates which was which.

        **A SECOND FILE SAID THE SAME WRONG THING AND IT HAS BEEN FIXED TOO.**
        Your line lives in the script, but no renderer reads the script first:
        every render path takes `motion.yaml` and only falls back to `node.md`
        when that file has nothing for the beat. `motion.yaml` had carried a
        beat-15 direction since 2026-08-06, written for the *soil-and-stones*
        macro that came between the cave and the grass — it moved soil grains,
        small stones and a raking light band the grass plate does not contain. So
        the fault you just closed in the script was still sitting one file down,
        and it was closed there as well the same day, in the same words as yours.
        **That was a steward fix, not a taste call**, which is why it happened
        without asking you.

        **WHAT IS LEFT IS A RENDER, NOT A DECISION.** Both files now describe your
        frame, and **the beat has not been filmed from them yet** — there is no
        beat-15 clip on the corrected direction. It comes back to you as a moving
        picture rather than as another question.

