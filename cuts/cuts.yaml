        pipeline is built on. If you meant instead that both clips should travel
        at the same speed *per second*, that is the ladder you already refused
        (*"zoom speed ladder is just overdoing it"*) and it would put the
        2.6-second beat back at 2%, invisible.

        The two extremes are below: at one number, the short beat travels five
