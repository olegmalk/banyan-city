  # which is not the order the cards are in — see the note beside QUEUE_LEDE in
  # build_site.py. Keep it to a sentence or two: he reads this page on a phone in
  # five-minute passes, and a lede he has to scroll is not a lede.
  lede: |-
    **The four cheapest wins, if you only have two minutes:** [18](#item-18)
    defines the goblin and releases fifteen waiting beats; [06](#item-06)
    releases twelve frames that are already drawn-and-locked; [21](#item-21) and
    [22](#item-22) are one word each. The argument behind every item is one fold
    down.
  intro: |-
    **Items 01 to 09 are a record, not a list of questions.** You answered every
    one of them on 2026-08-08; they are kept so you can catch us hearing
    something wrong. Item 06 is the one exception and it is on us.

    **Items 10 and up are 2026-08-09, and they are a different kind of item.**
    You said *"human feedback should never be a blocker, by design"* and *"taste
    has to be codified and iterated on."* So the steward read all 100 candidate
    frames overnight, wrote down what it predicted **you** would say about each
    one before you had seen any, and let the machines build on those guesses.
    Everything numbered 12 and up already exists and none of it is approved.

    **Nothing was published, posted, spent or made canon**, and the sheets carry
    labels and seeds only — no favourite is marked on any of them. Where the
    steward guessed, the guess is written out in words so overruling it costs
    you one. **A flip is expected and cheap**; the night it cost was a night
    nobody was awake for.

    **Overnight 2026-08-10, three things landed and each one is on its own card.**
    The goblin got two more rounds and is now waiting on a definition from you
    rather than a pick (**item 18**, and it is the answer that unblocks the most).
    Episode 1's v34 was measured end to end (**item 19**). The cold open's round 7
    came back worse than round 6 and the reason is written down (**item 06**).
    Two rounds ran, 37 GPU-seconds each, $0, and nothing was opened on your
    screen.
