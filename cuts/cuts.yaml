        - **Beat 14 — rejected, all four:** *"all too small, not good character
          consistency."*
        - **Beat 15 — rejected, all four:** *"bad character consistency."*
          **Finished:** it came back as the sample and you passed `b15-r3-s1`.

        Your original words on the six, kept because the redraws work from them:

        - **Beat 3** — *"looks more like a terminal in some.. lab. not realistic
