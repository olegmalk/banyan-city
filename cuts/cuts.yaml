# Side-by-side groups, newest question first. `left`/`right` are paths under
# cuts/; every one goes through the same publishable() gate as the whole cuts.
comparisons:
  - title: "The five held beats — the old push against the gentle one"
    left_label: "v31 — 18% push"
    right_label: "v32 — gentle"
    intro: |-
      This is the whole difference between v31 and v32, cut straight out of both
      episodes with the captions still on — same picture, same length on each side.
      **The only thing that changed is how far and how fast the camera creeps in.**
      The old move was one number for every beat, 18% of scale on a front-loaded
      curve with 10.1% of it in the first second, which made a 2.6-second beat drift
      five times faster than a 13-second one. The new one is a rate: 0.6% per second,
      floored at 2% so a short beat still moves and capped at 4% so a long one does
      not reframe an approved picture, at a constant speed rather than lunging and
      then parking.
    items:
      - beat: 4
        title: "“the fall” — 3.5s on screen"
        why_label: "Why it is held at all:"
        why: >-
          Nothing in the frame can animate without inventing a body in mid-air, so it has been a held still since the beginning. Only the camera move is in question.
        left: pairs/beat-04-zoom-18pct.mp4
        left_note: "18% of scale, front-loaded — 10.1%/s at the first frame"
        right: pairs/beat-04-zoom-gentle.mp4
        right_note: "2.1% of scale, constant 0.60%/s"
        verdict: >-
          Same picture, same length, same captions. The question is only whether the
          right-hand move is now too small to read as a camera at all.
      - beat: 5
        title: "“fan spinning down” — 2.58s on screen"
        why_label: "Why it is held at all:"
        why: >-
          The shortest held beat in the episode, and the one the old flat 18% treated worst — the same travel packed into 2.6 seconds is the fastest drift in the cut.
        left: pairs/beat-05-zoom-18pct.mp4
        left_note: "18% of scale, front-loaded — 10.1%/s at the first frame"
        right: pairs/beat-05-zoom-gentle.mp4
        right_note: "2.0% — the floor of scale, constant 0.77%/s"
        verdict: >-
          Same picture, same length, same captions. The question is only whether the
          right-hand move is now too small to read as a camera at all.
      - beat: 7
        title: "“zero (0) moving parts” — 6.64s on screen"
        why_label: "Why it is held at all:"
        why: >-
          Held on purpose: a still life with nothing in it that moves. Every model pointed at this kind of composition has added something rather than admit there was nothing to do.
        left: pairs/beat-07-zoom-18pct.mp4
        left_note: "18% of scale, front-loaded — 10.1%/s at the first frame"
        right: pairs/beat-07-zoom-gentle.mp4
        right_note: "4.0% — the cap of scale, constant 0.60%/s"
        verdict: >-
          Same picture, same length, same captions. The question is only whether the
          right-hand move is now too small to read as a camera at all.
      - beat: 10
        title: "“sense” — 10.52s on screen"
        why_label: "Why it is held at all:"
        why: >-
          Underground, roots and droplets. The animated version came back as abstract streaks with a large dark shape morphing between frames — the author's "big rock randomly morphing" — so the still is held instead.
        left: pairs/beat-10-zoom-18pct.mp4
        left_note: "18% of scale, front-loaded — 10.1%/s at the first frame"
        right: pairs/beat-10-zoom-gentle.mp4
        right_note: "4.0% — the cap of scale, constant 0.38%/s"
        verdict: >-
          Same picture, same length, same captions. The question is only whether the
          right-hand move is now too small to read as a camera at all.
      - beat: 14
        title: "“worth staying in” — 12.99s on screen"
        why_label: "Why it is held at all:"
        why: >-
          The longest slot in the episode at 13 seconds, and the beat where a fixed 18% of scale does the most damage: a whole eighth of the frame gone by the end of a line he approved as a composition.
        left: pairs/beat-14-zoom-18pct.mp4
        left_note: "18% of scale, front-loaded — 10.1%/s at the first frame"
        right: pairs/beat-14-zoom-gentle.mp4
        right_note: "4.0% — the cap of scale, constant 0.31%/s"
        verdict: >-
          Same picture, same length, same captions. The question is only whether the
          right-hand move is now too small to read as a camera at all.

  - title: "The four beats v30 and v31 disagree about"
    left_label: "held — in v30"
    right_label: "animated — in v31 and v32"
    intro: |-
      These four are the whole difference between the two cuts. **The motion number
      under each clip cannot compare a held beat against a moving one** — a held
      still is a computed push-in, so every pixel moves and it scores *higher* than
      real animation. The figure is only useful for judging one animated take
      against another. Held-versus-moving is an eye call, which is the reason this
      page exists at all.
    items:
      - beat: 3
        title: "“deploy succeeded” — held or moving, both on the right picture"
        why_label: "Why it was held:"
        why: >-
          The measurement that held it was taken on the magenta dashboard the author
          rejected, revoked on 2026-08-04 — and v30 was assembled one minute before
          that revocation, so v30 is still holding the rejected plate today. Neither
          clip below is that one. Both are the approved green frame, and the choice
          here is only whether it moves.
        left: pairs/beat-03-held-approved.mp4
        left_note: "held — the approved frame under the new gentle rule, 2.1% over 3.54s"
        right: pairs/beat-03-animated.mp4
        right_note: "animated — motion 0.20 · 50% frozen; screens surge and fall, scanlines roll"
        verdict: >-
          The animation is the weaker of the two and worth saying so: half its frames
          barely change, and 0.20 is below the line where a shot starts reading as a
          still anyway. A flat cel-shaded panel has almost nothing in it that can move.
          Nothing was invented, so it is not wrong — it may simply be a still with a
          flicker on it, in which case the held version on the left is the better shot.
        footnote:
          file: pairs/beat-03-held.mp4
          label: "What v30 actually ships for this beat (not a choice)"
          note: "the REJECTED magenta plate, held — kept visible because it is in the cut, not because it is an option"

      - beat: 12
        title: "“undefined”"
        why_label: "Why it was held:"
        why: >-
          It was never static. It was measured across a frame that is 95% rigid: the
          whole-frame score was 0.19 because a cracked plain fills most of the
          picture and cannot move, while the sprout, measured inside its own box,
          moves at 0.46 with 8% of frames frozen.
        left: pairs/beat-12-held.mp4
        left_note: "motion 0.79 · 2% frozen — slow push-in"
        right: pairs/beat-12-animated.mp4
        right_note: "whole frame 0.19 · 58% frozen · sprout itself 0.46 · 8% frozen"
        verdict: >-
          The clip in v31 is the one that already existed — the take the bad
          measurement threw away on 2026-08-03. A rewritten shot direction was
          rendered on 2026-08-07 and lost to it (0.27 against 0.46 in the same box),
          because it asked the stem to shudder “without moving anywhere”, and prose
          about stillness produces stillness.

      - beat: 13
        title: "“I always left”"
        why_label: "Why it was held:"
        why: >-
          Half the frame works and half of it cannot. The grass and the road move;
          the cloudbank does not, because clouds do not visibly travel in two and a
          half seconds. The dead half halved the average and the beat was held for it.
        left: pairs/beat-13-held.mp4
        left_note: "motion 2.90 · 2% frozen — slow push-in"
        right: pairs/beat-13-animated.mp4
        right_note: "whole frame 0.30 · 3% frozen · grass and road 0.50 · 0% · cloudbank 0.10 · 82%"
        verdict: >-
          The clearest improvement of the four, and it is only in the bottom half.
          Frozen frames across the whole picture fell from 53% to 3%. The sky did not
          budge. Whether that reads as a flaw or as a calm horizon over moving grass
          is a taste call, not a measurement.

      - beat: 15
        title: "“something's coming” — the closing hook"
        why_label: "Why it was held:"
        why: >-
          No reason to do with the shot. Nothing was wrong with its direction: the
          machine that renders was switched off, so no animation of it ever existed
          and a held still went in instead.
        left: pairs/beat-15-held.mp4
        left_note: "motion 1.67 · 2% frozen — slow push-in"
        right: pairs/beat-15-animated.mp4
        right_note: "motion 2.72 · 0% frozen — take 2: ground jumps, light slams"
        verdict: >-
          Two takes were rendered and the first is rejected. It scores 4.63, the
          highest number in the episode, because a bright red-orange cone stabs into
          frame twice — an object in no still and no script. The invented object is
          what produced the score. Take 2, same seed and recipe with a negative
          naming the cone, keeps the motion and loses the object.

# Printed under the players. The licence position is not a footnote here: these
# files publish, so the reader is owed the same accounting the rest of the site
# gives.
provenance: |-
  **What made these.** Ten beats are animated on
  `Wan-AI/Wan2.2-TI2V-5B-Diffusers` (Apache-2.0) on a local GPU; five are the
  author's approved stills held and pushed in by code, with no video model
  involved. Narration is Chatterbox 0.5B (MIT), run locally. Recorded sound is
  CC0 and CC BY, one row each in the node's `audio-sources/SOURCES.md`. Cash
  cost of both cuts: **$0**. Every file above has a `.meta.yaml` beside it in
  `cuts/` carrying the recipe, the seed and the SHA-256 of the exact bytes
  served here, and every one passed the same licence gate the rest of the site
  goes through before it was copied.

  **The one open licence question, stated rather than buried.** The drawn frames
  underneath every beat came from `cagliostrolab/animagine-xl-3.1`, whose
  CreativeML Open RAIL++-M licence attaches use restrictions that travel to the
  output — while this tree publishes under CC BY 4.0, which offers reusers
  unrestricted use. That conflict is open, recorded as **D15**, and it is the
  author's to settle. It is not new here: the episode already published on this
  site carries it too.
