prompt_note: >-
  The prompt string is byte-identical across every tile on this sheet, including
  the four wave-1 candidates that were drawn with no reference at all. Zero tokens
  added. The four different creatures in row 1 came out of the same words.
prompt: >-
  1boy, a small goblin boy, green skin, tusks, solo, his face filling the frame,
  holding his breath with cheeks puffed and huge eyes darting, enormous ears
  twitching. Slow push-in, close-up, soft morning light, cinematic lighting,
  detailed, newest, masterpiece, best quality, very aesthetic
negative_prompt: >-
  photorealistic, 3d render, abstract, text, watermark, signature, low quality,
  blurry, extra limbs, deformed, jpeg artifacts, realistic skin texture, girl,
  child, photorealism, text, female goblin, elf
goblin_definition_source: >-
  the founder, 2026-08-10, verbatim: "he is just a simple green goblin, nothing
  complex". Recorded in cuts/cuts.yaml item 18 (settled) and
  taste/steward-model.ledger.yaml record ep2-goblin-definition-0810.
goblin_definition_as_sent: >-
  green skin, tusks — the steward's translation of his sentence into slot tags,
  which he has NOT ratified. Held fixed across every tile on purpose, so the only
  thing varying down a column is the seed.
reference_note: >-
  Each column's reference is the wave-1 frame at the head of that column, and all
  four are used. None of them is a canonical goblin and nobody has picked one.
  Choosing the goblin is R4's call — this sheet exists to let him make it, and
  makes no part of it itself.
neutral: >-
  Addresses only. The A/B/C/D letters are ADDRESSING LABELS so he has something
  short to answer with — they are assigned in file order (s0, s1, s2, s3) and
  imply NO order, NO ranking and NO preference. No favourite is marked, no column
  is recommended, nothing is starred, and NO AGREEMENT SCORE OR ANY OTHER METRIC
  IS PRINTED ON THIS SHEET. The automatic identity metric is deliberately absent:
  on 2026-08-10 it could not tell one creature from four, because on this beat it
  is mostly scoring a background that never changes. His eyes are the instrument
  (gate G3).
source_frames: >-
  farm-out/ep2-goblin-wave1/, farm-out/ep2-b04-goblin-ipa-w015-seeds8/ and
  farm-out/ep2-b04-goblin-ipa/ on branch farm-results-rtx5090, each PNG with its
  render-time <stem>.yaml beside it. The c040 and c080 frames in the third
  directory are NOT on this sheet. Those PNGs stay on the results branch; this
  sheet is the published rendition.
provisional: >-
