# Provenance for one image on the /review gallery (STEWARDSHIP §7.2).
#
# WHAT THIS FILE IS SERVED UNDER. banyan.city publishes CC BY 4.0. These pictures
# were drawn by cagliostrolab/animagine-xl-3.1, whose CreativeML Open RAIL++-M
# licence attaches use restrictions that travel to the output — D15, still open.
# The offer is NARROWED for this file and said out loud on the page: it carries
# OpenRAIL++'s Attachment A use restrictions and is not CC BY 4.0.
#
# WHY THIS SHEET EXISTS. The earlier goblin sheets are laid out by MECHANISM —
# one arm per row, references mixed down a column. That layout cannot answer the
# only question the founder is actually asking, "is this your goblin?", because
# it never puts one creature in one place. This sheet is re-cut by CREATURE: four
# columns, one per wave-1 draw, each column showing that same creature held on
# eight further seeds. Nothing is re-rendered; it is the same PNGs, re-arranged
# so a column can be read down.

