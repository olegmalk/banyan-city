what: >-
  episode 2 beat 04 — the identity question, cut by creature instead of by
  mechanism: the four wave-1 draws are the four candidates, each one the head of
  its own column, and under each is that same creature used as the IP-Adapter
  reference and redrawn on eight further seeds. Read a column down and you can
  see whether that creature holds.
shows: >-
  36 tiles, 4 columns x 9 rows, one column per candidate creature.
  Row 1 (largest): wave1-s0, wave1-s1, wave1-s2, wave1-s3 — chipped goblin-A,
  goblin-B, goblin-C, goblin-D respectively, each with its real address.
  Rows 2-5: ipa-r{0,1,2,3}-w015-s{4,5,6,7} — column N is reference wave1-sN.
  Rows 6-9: ipa-r{0,1,2,3}-c060-s{0,1,2,3} — same four references at the
  stronger conditioning setting. Column alignment is the argument: column 1 is
  goblin-A throughout, column 2 goblin-B, and so on.
