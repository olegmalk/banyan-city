# served under. banyan.city publishes CC BY 4.0. These pictures were drawn by
# cagliostrolab/animagine-xl-3.1, whose CreativeML Open RAIL++-M licence attaches
# use restrictions that travel to the output — the open conflict recorded as D15.
# The founder authorised these frames onto the review page on 2026-08-09; he did
# not resolve the licence question. So the offer is NARROWED for this file and
# said out loud on the page: it carries OpenRAIL++'s Attachment A use
# restrictions and is not CC BY 4.0.
#
# THE COMPOSITING SCRIPT IS NOT IN THE TREE, and that is the defect commit
# f7de075 named ("the sheet builders that drew his review surfaces are not in the
# repo, and that is how the missing labels got in"). It is not fixed here — a
# sheet builder in pipeline/ is a design call this lane should not make alone —
# so the mitigation is that the EXACT command is recorded below and the four
# source frames are named with their SHA-256s. Anyone can reproduce this file
# byte-for-byte from the tree without the script.

