composited_by: >-
  ImageMagick 7.1.2-21, per tile:
  `magick <frame> -resize 420x614 -background '#111111' -gravity north
  -splice 0x38 -font '/System/Library/Fonts/Supplemental/Arial Bold.ttf'
  -pointsize 21 -fill '#ffbf3f' -gravity northwest -annotate +10+8 '<address>'
  -pointsize 15 -fill '#9a9a9a' -gravity northeast -annotate +10+11 'seed <seed>' t<i>.png`
  then `magick t0 t1 t2 t3 +append -background '#111111' strip.png` and a 34px
  north splice carrying the title line. No crop, no colour conversion. The JPEG
  rendition is `-strip -quality 90 -sampling-factor 1x1` off that PNG.
