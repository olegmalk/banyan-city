  labelling script, each tile carrying its address and its seed. The compositing
  and the labels are our code and carry no model. Addresses resolve through
  REVIEW-KEY-0808.md.
neutral: >-
  Labels and seeds only, in source order. No favourite is marked, nothing is
  ordered by preference and no tile is offered as a pick (gate G3). Taste ledger
  record 32 suspends the goblin predicate until the founder defines the goblin,
  so this round is explicitly not a gate attempt — the sheet exists to give him
  something to define it with.
not_scored_here: >-
