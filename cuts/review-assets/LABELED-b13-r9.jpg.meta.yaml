#
# WHAT THIS FILE IS SERVED UNDER, because it is not what the rest of the tree is
# served under. banyan.city publishes CC BY 4.0. This picture was drawn by
# cagliostrolab/animagine-xl-3.1, whose CreativeML Open RAIL++-M licence attaches
# use restrictions that travel to the output — the open conflict recorded as D15.
# The founder authorised these frames onto the review page on 2026-08-09; he did
# not resolve the licence question, and publishing them under a blanket CC BY
# offer would grant what we do not hold. So the offer is NARROWED for this file
# and said out loud on the page: it carries OpenRAIL++'s Attachment A use
# restrictions and is not CC BY 4.0. Everything else on the site is unaffected.
#
# The pixels here are a JPEG re-encode, not the original bytes. The source file
# and its SHA-256 are recorded below, so the rendition is checkable against the
# frame it came from.

