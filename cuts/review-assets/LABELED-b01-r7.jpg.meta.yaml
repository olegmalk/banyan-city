what: >-
  episode 2's cold open, round 7. The single variable was shots.md's own
  proposal — `rising well above the grass` out, `no taller than the grass around
  it` in — on round 6's seeds with the negative held character for character.
  The clause made the plant TALLER: s3, the only rooted whole-plant frame,
  measures a stem 39% of frame height against the 32% plate he revoked with
  "its tooooo tall". The mechanism is that CLIP does not encode negation and
  this clause is too long for `_NEGATION` to lift out of the positive, so the
  model was sent "taller than the grass around it".
sheet_note: >-
  A contact sheet: four candidate frames composited into one picture by our own
  labelling script, each tile carrying its address and its seed. The compositing
  and the labels are our code and carry no model. Addresses resolve through
  REVIEW-KEY-0808.md.
neutral: >-
