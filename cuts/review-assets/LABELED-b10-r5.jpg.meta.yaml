shows: b10-r5-s0..s3 against r4's same four seeds
what: >-
  episode 1 beat 10, SENSE, round 5 — THE PERSON-BINDING NEGATIVES. Defect 2's
  prescription (`1girl, 1boy, child, person, hand`) is added as fit_negative's
  EXPLICIT tier and `humans` is held. The falsifiable claim is mechanical, not
  a matter of taste: r4's human hand and forearm on s0 and its bare foot on s1
  should be GONE and no new person should appear. Counted at full resolution:
  people 2 of 4 -> 0 of 4.
declared_confound: >-
  This beat's negative was already over budget — r4 itself overran 77 CLIP
  tokens and shed two terms — so the five added terms had to be paid for, and
  `fit_negative` shed `blurry`, `low quality`, `deformed`, `extra limbs` and
  `signature` off the house tier to fit them. Every candidate set was priced
  on the box's real CLIP before a step was spent
  (pipeline/measure_b10_negsets.py) and there is no free version. IF THESE
  FRAMES READ SOFTER THAN r4'S, THE SHED QUALITY NEGATIVES ARE A CANDIDATE
  CAUSE, and the round said so in advance rather than after.
not_scored_here: >-
  The ledger record `ep1-b10-r5-provisional` carries pick_holds on b10-r5-s2
  at confidence 0.55, written before the founder saw anything. Beat 10 is
  ALREADY CANON on the founder's own `b10-r1-s3` and this round does not
  reopen it: the sheet is evidence about a mechanism, not a set to choose
  from.
neutral: >-
  Labels and seeds only, in source order. No favourite is marked and no tile
  is offered as a pick (gate G3).
sheet_note: >-
  A contact sheet: candidate frames composited into one picture by our own
  labelling script, each tile carrying its address and its seed. The
  compositing and the labels are our code and carry no model. Addresses
  resolve through REVIEW-KEY-0808.md.
