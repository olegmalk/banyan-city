what: >-
  episode 2 beat 01, cold open, round 8 — THE ARCHITECTURE ROUND: the height
  instruction leaves the prompt and becomes the init image. It settled half
  the beat and left the other half open. The init produced a grounded whole
  plant in 8 of 8 where seven rounds of wording produced none, and all eight
  also wear the plate's amber dusk, its light shaft and its macro bokeh where
  the beat asks for a peach-and-gold sunrise wide shot — while r8's own t2i
  arm drew that sky correctly on all four seeds. That split is what round 9
  exists to attack.
not_scored_here: >-
  The ledger record `ep2-b01-r8-sample` carries reject_all at confidence 0.72
  with all twelve vetoed and pick: null, written before the founder saw
  anything. That is a steward prediction, not a verdict; R4 is his.
neutral: >-
  Labels, arms and seeds only, in source order. No favourite is marked,
  nothing is ordered by preference and no tile is offered as a pick (gate G3).
sheet_note: >-
  A contact sheet: candidate frames composited into one picture by our own
  labelling script, each tile carrying its address and its seed. The
  compositing and the labels are our code and carry no model. Addresses
  resolve through REVIEW-KEY-0808.md.
