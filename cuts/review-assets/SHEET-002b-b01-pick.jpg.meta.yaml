# licence surface, not more.
#
# WHY THIS SHEET EXISTS. Beat 01 has two finished rounds on disk answering the same
# question — how does the founder's plate get into the frame — and they have only
# ever been shown apart: round 8's twelve img2img frames on their own sheet, round 9's
# twelve depth-ControlNet frames on theirs. Asking him to pick across two sheets is
# asking him to hold twelve frames in his head while looking at twelve others. All
# twenty-four are here, one grid, one scroll, so ONE address is a sufficient answer.
#
# TWO PIPELINES ON ONE SHEET, RECORDED SEPARATELY. Rows 1-3 are img2img with NO
# ControlNet; rows 4-6 are text2img under a depth ControlNet. Everything below that
# differs between them is written as two keys rather than one averaged one.

