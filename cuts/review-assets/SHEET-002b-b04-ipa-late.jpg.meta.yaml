  ordered by preference, and NO AGREEMENT SCORE IS PRINTED ON THIS SHEET. The
  automatic identity metric is deliberately absent: on 2026-08-10 it could not
  tell one creature from four, because on this beat it is mostly scoring a
  background that never changes. His eyes are the instrument (gate G3).
