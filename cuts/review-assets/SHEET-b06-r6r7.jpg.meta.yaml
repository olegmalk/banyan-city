controlled_pairs: >-
  All four arms run round 5's own four seeds in the same column order, which r3
  and r4 also drew. A column is one seed across all four rows, so arm against arm
  is a comparison of the prompt and not of the noise, and any row can be set
  beside the rejected rounds column for column.
what_changed_r6_to_r7: >-
  One thing. Round 6 arm A drew a large white animal as the subject of 2 of 4 with
  nothing in the prompt asking for one and nothing forbidding one — the same shape
  of fault as the cities, and at 59 of 77 tokens it was never a trim. Round 7 names
  the animal and vehicle classes in the negative (animal, animal focus, cat, dog,
  creature, vehicle, car) and changes nothing else. `no humans` stays at the head
  of the positive with no person noun in the negative, which is round 5's one
  confirmed win.
neutral: >-
  Labels and seeds only. No favourite is marked, nothing is ordered by
  preference, no metric is printed, and no tile says "closest to" anything
  (gate G3). Eight instruments were retired on 2026-08-10 for disagreeing with
  the pictures they scored; this sheet carries none of them.
