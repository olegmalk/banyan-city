# Provenance for one image on the /review gallery (STEWARDSHIP §7.2).
#
# WHAT THIS FILE IS SERVED UNDER, because it is not what the rest of the tree is
# served under. banyan.city publishes CC BY 4.0. These pictures were drawn by
# cagliostrolab/animagine-xl-3.1, whose CreativeML Open RAIL++-M licence attaches
# use restrictions that travel to the output — the open conflict recorded as D15.
# The founder authorised candidate frames onto the review page on 2026-08-09; he
# did not resolve the licence question, and publishing them under a blanket CC BY
# offer would grant what we do not hold. So the offer is NARROWED for this file
# and said out loud on the page: it carries OpenRAIL++'s Attachment A use
# restrictions and is not CC BY 4.0.
#
# WHERE THESE SIXTEEN FRAMES CAME BACK FROM. Both rounds were rendered on the
# rtx5090 and both were recorded in the commit log as LOST — r6 as "the lane that
# drew it ended without saving them" and "off the box before the only copy could
# go with it". The frames were never lost; they were never copied. They were
# still in C:\banyan-farm\b06-r6\out and \b06-r7\out on 2026-08-10 17:21Z and were
# pulled from there with their render-time sidecars intact. Those sidecars are the
# source of every number below — nothing here is reconstructed.

