model_licence: >-
  CreativeML Open RAIL++-M for the animagine beats (use restrictions travel;
  D15)
sheet: true
episode: 1
shows: the first frame of all fifteen v34 beats, in cut order, in one row
what: >-
  an adjacency strip for episode 1's provisional v34 cut: what the founder's
  eye meets as one shot becomes the next. It is an EYEBALL AID AND NOT A SCORE
  — nothing in this repo computes an adjacency number and none was invented
  for it.
not_scored_here: >-
  No verdict. Two things a reader may want to look at, offered as
  observations: 05 into 06 is the hardest jump in the cut (near-black interior
  straight into bright daylight, which is also the act break and may be
  exactly right), and beats 12-13-14 swing warm, cool, warm rather than
  progressing.
neutral: Frames in cut order, nothing marked, nothing ranked.
sheet_note: >-
  Composited by our own script from the first frame of each beat's clip. The
  compositing carries no model; the frames carry the licence of whatever drew
  them.
