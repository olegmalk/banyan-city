  b15-r3-s1 (APPROVED, canon since d4488de, sha256
  f60c1404f88d45720ca295dfc753e9eaabb815446710bcfffb3c7a07b7277f54) ->
  StableDiffusionXLInpaintPipeline with the plate as `image` and a
  steward-drawn ellipse as `mask_image`. The init's sha256 is asserted by
