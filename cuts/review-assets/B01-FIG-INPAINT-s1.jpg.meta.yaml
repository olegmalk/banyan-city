what: >-
  A small round green fruit painted into a single masked ellipse on the
  founder's approved beat-15 plate. It is NOT a beat-01 candidate frame and is
  not offered as one; it is stage one of a two-stage recipe, and it exists to
  answer one question — can this stack put a fruit on this plant at all, after
  0 of 24 prompted frames and 0 of 12 img2img frames could not.
