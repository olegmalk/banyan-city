the_plate_is_unchanged_and_that_is_measured: >-
  Mean absolute RGB difference against the approved plate OUTSIDE the mask is
  0.011 of a possible 765, maximum 20; every pixel that changed by more than 30
  lies inside the box (430, 814)-(496, 881), which is inside the mask ellipse
  (428, 812)-(496, 884). The founder's frame came back byte-for-byte everywhere
  the mask was not, which is the behaviour a 4-channel UNet's latent-blend
  branch is supposed to give and is checked rather than assumed.
mask_is_the_stewards: >-
  THE FOUNDER APPROVED A METHOD, NOT THIS GEOMETRY. Ellipse centred (462, 848),
  radii (34, 36) — 8.2% of frame width, 5.9% of frame height. He named no size,
  no position on the stem, no colour and no ripeness; the prompt's wording is
  his own approved shots.md line. The ellipse is the first thing his correction
  should move and it is one number.
defects_disclosed: >-
  THREE, AND NONE OF THEM ARE SMOOTHED OVER. (1) The fruit does not take the
  plate's light — it is a saturated green with a cream cap under a dusk amber
  key, and it reads as lit by a different source from everything around it.
  (2) It sits ON the stem rather than hanging from it: the stem enters at its
  top-left and leaves at its bottom-left, so it reads threaded rather than
  pendant, and "hanging from the stem" is the founder's own wording. (3) It
  reads closer to an unripe tomato or persimmon than to a fig, with a two-tone
  green/cream split and a faint dark rim at the mask edge. What it is NOT is
  absent, and that is the finding.
not_scored_here: >-
