# Transparency integrity (PRD §12): every push proves the tree is
# structurally honest — parents declared, R1/R5 sections present,
# leaf provenance complete, ledger well-formed.
name: lint-genome
on:
  # `farm-results-*` are courier branches, not code. farm_worker.py force-pushes
  # a heartbeat commit to its own branch every ~5 minutes for the whole length of
  # a task, and each one was firing a full lint+test run — ~288 runs a day that
  # say nothing about the tree, since the worker syncs its files FROM main and
  # main's own push already lints them. On 2026-08-06, with GitHub Actions in a
  # major outage, those heartbeats were most of the wall of failure mail.
  push:
    branches-ignore: ["farm-results-**"]
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow markdown
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python pipeline/lint_genome.py
      - run: python pipeline/test_pipeline.py
      - run: python pipeline/test_takes_backup.py
      # box_cache.py is the only tool in the repo whose normal, successful
      # outcome is deleting render media. Its guards are pure functions with no
      # box and no filesystem precisely so this can run here, on every push,
      # rather than only on the laptop that would be the one to lose the files.
      - run: python pipeline/test_box_cache.py
      # The founder's phone channel: the mirror's subpath rewrite, and the
      # answer poller's standing guarantee that it records without acting.
      - run: python pipeline/test_founder_channel.py
      # THE UNATTENDED RENDER PATH HAD A TEST SUITE AND NO CALLER. box_runner is
      # what keeps the card working when every session is dead, its 98 checks
      # cover the crash-safety and GPU-contention logic that decides whether a
      # second render lands on a busy card — and nothing ran them but a human
      # remembering to. A suite nobody runs is the same shape as the bugs it
      # tests for: it reports nothing, and nothing is read as fine. Pure stdlib
      # and no GPU, so it belongs here beside the others.
      - run: python pipeline/test_box_runner.py
      # Two jobs from one parent declared the same payload paths and the second
      # overwrote the first's prompt before either ran (2026-08-13). The guard
      # that refuses that is pure functions over a local index — no ssh, no box —
      # so the machine that would send the payloads is not the only thing that
      # ever checks it.
      - run: python pipeline/test_box_enqueue.py
      # The GPU idled four separate times on 2026-08-15 and three sessions died
      # on usage limits with work un-queued, so the queue is now topped up by a
      # scheduled task on the box instead of by whoever notices. What that task
      # must never do is the part worth testing: count a .HOLD file as depth,
      # refile a spec that already ran, fire a stale entry, waive a guard, or
      # quietly invent filler when the backlog is empty. Pure functions over a
      # temp directory — no ssh, no box.
      - run: python pipeline/test_box_autofill.py
      # The guards against a check that stays green while the thing it reads is
      # broken (2026-08-10's four silent failures). See the file's docstring.
      - run: python pipeline/test_silent_gates.py
      # The episode ETA's arithmetic, and the four things it must refuse to
      # claim — chiefly that a missing measurement is never published as a zero,
      # and that machine hours are never added to the author's decision time.
      - run: python pipeline/test_episode_eta.py
      # 40% of the IP-Adapter renders drawn to 2026-08-15 (112 of 280) were exact
      # byte-duplicates, because reference sets smaller than four were poured into
      # four fixed slots. The dedup that stops it and the sidecar header that used
      # to say "beat 04" over every beat are pure functions — no GPU, no box — so
      # the card that would waste the time is not the only thing that checks.
      - run: python pipeline/test_goblin_ipa.py
