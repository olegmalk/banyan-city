# Layer 1 resilience (PRD §7.1): auto-mirror the canonical layer to at
# least one independent host. Opt-in: set a MIRROR_GIT_URL repository
# secret containing a push-authenticated remote, e.g.
#   https://user:token@codeberg.org/user/repo.git
# Without the secret this workflow is a no-op.
name: mirror
on:
  # Not on the courier branches: `git push --mirror` below ships EVERY ref, so a
  # mirror run triggered by any ordinary push already carries farm-results-*.
  # Firing it again on each of farm_worker.py's 5-minute heartbeats re-mirrored
  # the same refs ~288 times a day, and failed loudly all through the 2026-08-06
  # Actions outage for a workflow that is a no-op until MIRROR_GIT_URL is set.
  push:
    branches-ignore: ["farm-results-**"]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      MIRROR_URL: ${{ secrets.MIRROR_GIT_URL }}
    steps:
      - name: Check mirror configured
        id: check
        run: |
          if [ -n "$MIRROR_URL" ]; then echo "configured=true" >> "$GITHUB_OUTPUT";
          else echo "MIRROR_GIT_URL secret not set — skipping (see workflow comments)"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'
        with:
          fetch-depth: 0
      - name: Push mirror
        if: steps.check.outputs.configured == 'true'
        run: git push --mirror "$MIRROR_URL"
