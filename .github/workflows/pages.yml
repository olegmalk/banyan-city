# Phase 1: the tree becomes visible. Builds _site/ from the genomes
# and deploys to GitHub Pages so a non-git citizen can read and react.
name: pages
on:
  push:
    branches: [main, master]   # prod only — WIP branches must not publish to the live mirror
  # status.html is a STATIC snapshot of what the render farm is doing, so with only
  # a push trigger it froze for five hours while the farm rendered all afternoon —
  # under a heading that claimed "right now" (founder, 2026-08-02: "not synced").
  # Every half hour keeps it roughly true without anyone pushing. Cheap: the build
  # is ~20s and the deploy is idempotent.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown
      - run: python pipeline/lint_genome.py
      - run: python pipeline/build_site.py
      # The mirror is served from a SUBPATH (…github.io/banyan-city/), and three
      # pages — /review, /trials, /lab — reference their media root-absolutely
      # because that is what banyan.city's cleanUrls geometry requires. On the
      # mirror those 202 URLs point outside the repo's subpath and 404: measured
      # 2026-08-10, the review page was current and byte-identical to a local
      # build while every one of its clips, posters and sheets was missing. This
      # re-bases them onto the mirror's root. Artifact-only — it runs after the
      # build and touches nothing Vercel ever sees. Idempotent, so a retried job
      # is harmless. The prefix is derived rather than hard-coded so it stays
      # correct through the account move in REPO-MOVE.md: GITHUB_REPOSITORY is
      # `owner/repo` and is set on every event, including the half-hourly
      # `schedule` run, whose payload carries no repository object at all.
      - run: python pipeline/pages_prefix.py "/${GITHUB_REPOSITORY##*/}"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
