- id: ep2-goblin-crossbeat-observed-0810
  date: 2026-08-10
  kind: observation
  subject: "node 002b — does the w015 recipe carry HIS goblin onto a beat that is framed nothing like beat 04? Three beats, by eye. The answer is ONE OF THREE."
  steward_provisional: true
  pick: null
  scores: {}
  address_key: >-
    Jobs `ep2-b02-goblin-ipa-crossbeat-1786369550`,
    `ep2-b15-goblin-ipa-crossbeat-1786369554` and
    `ep2-b20-goblin-ipa-crossbeat-1786369556`, all rc 0, outputs published to
    `farm-out/ep2-b{02,15,20}-goblin-ipa-crossbeat/` on the rtx5090 with .sha256
    manifests. Recipe byte-identical to the one that drew his pick: arm
    `window4`, 15% of 40 steps, scale 0.6, beat-04 references held fixed, only
    the BEAT changed. Read on the r1 rows — r1 is the reference his pick came
    from — sixteen frames pulled and compared against
    `04-the-footnote-ipa-r1-w015-s6.png`.
  what_was_pre_registered_and_when: >-
    The criterion, and it was written before any of these frames existed:
    `goblin_ipa_beat.py`'s own docstring, in the tree on the box, states the test
    as "Is it the same creature — same face, same build, same skin — or the
    beat-04 goblin only when the composition is beat 04's?" and states the
    instrument as "The DINOv2 identity metric is NOT run and no number here may
    answer the identity question... Where a number and the picture disagree, the
    picture wins." This observation answers the question it was set, with the
    instrument it was told to use. No prediction of the OUTCOME was written.
  the_method_and_it_was_eyes: >-
    NO METRIC WAS RUN AND NONE WOULD HAVE BEEN ADMISSIBLE. The identity metric is
    disqualified in this file twice over (724b616, 93356b1) for failing to tell
    one creature from four. The twelve r1 frames were composited beside his pick
    on one sheet and looked at.
  the_result_and_it_is_a_PARTIAL_FAILURE: >-
    ONE BEAT OF THREE HOLDS HIS CREATURE.

    BEAT 20 (`20-evidence`) HOLDS, and holds cleanly on all four seeds. Large
    round eyes with the same warm ORANGE-YELLOW irises, round green head, two
    small pale chin fangs, blush, hood and dark collar. Put s0-s3 beside his pick
    and it is recognisably the same creature four more times.

    BEAT 02 (`02-the-sprint`) FAILS, and fails in the exact way the original
    complaint described — it is FOUR DIFFERENT CREATURES within the one beat. s0
    is an angry face with tiny glowing eyes, pink pointed ears and large DOWNWARD
    vampire fangs. s1 is a rotund blob-bodied thing with round white eyes and
    orange ears. s2 is a small full-body quadrupedal lizard on the ground under a
    huge dark shape. s3 is a chubby grinning cub with pale blue eyes. Not one of
    the four is his goblin, and not one of the four is any of the other three.

    BEAT 15 (`15-good-listener`) ALSO FAILS, though less violently: the four are
    roughly consistent with each other but they are consistently NOT him. An
    elongated egg-shaped skull rather than his round one, and blank grey-white
    eyes — sleepy, lidded or fully shut — with no iris colour at all.

    THE CLEANEST SINGLE DISCRIMINATOR IS THE EYE. His pick and all four beat-20
    frames have warm orange-yellow irises. Every single frame on beats 02 and 15
    has grey or white eyes with no iris colour. That marker splits the set
    exactly along the beat boundary, with no exceptions in sixteen frames.
  the_mechanism_this_points_at: >-
    IT IS COMPOSITION, AND THE HARNESS PREDICTED THE SHAPE OF THIS BEFORE IT RAN.
    Its docstring warned that "'One creature across seeds' measured that way is
    partly a statement about a fixed composition", because every reference is a
    beat-04 face filling the frame. The three results line up with that reading
    and nothing else: beat 20 is a face-filling close-up like beat 04 and it
    holds; beat 15 is a medium shot talking upward and it drifts; beat 02 is a
    full-body sprint — the framing furthest from the reference — and it collapses
    completely, including into full-body quadrupeds.
    So the honest statement of the mechanism is: a beat-04 face reference carries
    the creature into beats FRAMED LIKE BEAT 04, and loses it as the framing
    diverges. That is a much narrower claim than "this gives you one goblin", and
    it is the claim the evidence actually supports.
  what_this_forbids: >-
    THE FOURTEEN-BEAT WAVE IS NOT FIRED ON THIS EVIDENCE. Two of the three tested
    beats come back as a creature he did not pick, and beat 02 comes back as four
    of them. Rendering fourteen beats to hand him the same "different creature
    every beat" problem he has complained about all week is the precise failure
    the ONE SAMPLE rule exists to prevent, and one look at three already-finished
    jobs was enough to catch it.
  a_separate_and_larger_finding_about_the_staged_specs: >-
    THE FOURTEEN STAGED SPECS DO NOT USE THIS MECHANISM AT ALL, AND WOULD NOT
    HAVE DRAWN HIS GOBLIN EVEN IF THE CROSSBEAT HAD PASSED. Read
    `pipeline/jobs/ep2-b02-goblin-wave1.yaml`: its one render step calls
    `render_wave_sample.py --goblin-def "green skin, tusks"`. No IP-Adapter, no
    reference image, no window, no scale. They are the TAGS-ONLY recipe, written
    at 12:37 today — the recipe whose four-different-creatures failure is the
    entire reason the IP-Adapter investigation happened. Firing them would have
    re-drawn the original defect on fourteen beats.
    Their own `gate:` key says so and blocks it: it names the beat-04 tags-only
    sample as the thing his verdict must release, and `box_enqueue.py`
    `gate_checks()` refuses any spec carrying that key. The gate is intact and
    was not cleared. What he ruled on tonight is a DIFFERENT recipe from the one
    those specs encode, so his verdict does not release them — it obsoletes them.
  what_this_does_not_claim: >-
    No arm is recommended, no frame is picked, ranked or promoted, no goblin is
    made canonical beyond the one HE named, and no taste call is made anywhere in
    this record. Beats 03, 05, 06, 07, 08, 09, 10, 11, 14, 17 and 19 were NOT
    tested and nothing here predicts them; three beats were measured and three
    beats are reported.
