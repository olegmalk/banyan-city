    canon, gets a canon filename, is published or is assembled, and R4 is
    untouched: the first inpainted frame is a sample for his eyes under the
    one-sample rule, exactly as a recipe change is.
  g1_and_the_plate: >-
    THE GATE BITES IMMEDIATELY AND IT IS REPORTED RATHER THAN ROUTED AROUND. G1
    requires a conditioned render to start from a founder-approved image, and
    NO BEAT-01 STILL HAS EVER BEEN APPROVED — the node's only canon file for that
    shot is stills/01-cold-open-REVOKED-too-tall.png, and it is revoked. Record
    ep2-b01-r8-sample already established the consequence: b15-r3-s1
    (genomes/sapling/nodes/001-capability-inventory/stills/15-something-s-coming.png)
    is the only approved sapling-in-grass frame in the tree and therefore the
    only legal init for this beat. The first inpaint is run on THAT plate, which
    is G1-clean by the same argument r8 passed on, and it is not a beat-01
    candidate frame — it is the first stage of a two-stage recipe (paint the
    fruit into the approved init, then run r8's existing img2img from it, which
    PRESERVES what the init holds even though it cannot add it). The approved
    plate itself is not modified; a new file is written beside it.
  method_and_sources: >-
    RESEARCHED OUTSIDE THIS REPO BEFORE ANYTHING WAS BUILT. animagine-xl-3.1 has
    no inpainting variant, so the route is StableDiffusionXLInpaintPipeline
    loaded with the BASE weights. diffusers 0.29.2's own source branches on
    unet.config.in_channels: at 9 it concatenates mask and masked-image latents,
    at 4 — which is what a normal SDXL checkpoint has — it falls back to
    per-step latent blending, `latents = (1 - init_mask) * init_latents_proper +
    init_mask * latents`. The HF docs name the trade-off in their own words: "the
    overall image quality may be lower, but it generally tends to preserve the
    mask area (that is why you can see the mask outline)". The countermeasure for
    a SMALL object in a LARGE frame is `padding_mask_crop`, present in 0.29.2's
    __call__ and verified on the box: it crops the masked region with padding,
    upscales it to the pipeline resolution, inpaints there, and pastes back —
    which is precisely the resolution problem the grass-height hypothesis
    describes. Mask edges are softened with mask_processor.blur.
    Sources: https://raw.githubusercontent.com/huggingface/diffusers/v0.29.2/src/diffusers/pipelines/stable_diffusion_xl/pipeline_stable_diffusion_xl_inpaint.py
    ; https://huggingface.co/docs/diffusers/v0.29.2/en/using-diffusers/inpaint
    ; https://huggingface.co/cagliostrolab/animagine-xl-3.1
    ; https://github.com/huggingface/diffusers/issues/6345
  licences: >-
