    Against his pick this is not close. His frame has warm ORANGE-YELLOW irises
    and a soft register; three of these four have GLOWING RED eyes and read as
    menacing. And the creature is not the subject of the shot in half of them —
    in s0 and s3 the goblin is a speck at the bottom of the frame while something
    enormous fills the rest.
  the_mechanism_and_this_is_what_the_sample_bought: >-
