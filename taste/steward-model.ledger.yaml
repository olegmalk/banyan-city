    (3) Beat 16's still redraw is unblocked (backlog i2v-prompt-plate-truth
    clause (h)).
  what_it_does_not_release: >-
    NOT THE WAVE. His definition is a RECIPE CHANGE, so exactly one beat renders
    and stops; his verdict on that one sample releases the other fourteen.
    `render_wave_goblin.py` refuses a whole-wave render and exits 8, and that
