    creature across seeds" because every reference was a beat-04 face at beat
    04's composition — identity and layout were confounded and could not be told
    apart. Beat 20 held because it is also a face-filling close-up, so copying
    the layout happened to also deliver the face. Beat 15 drifted because it is a
    medium shot. Beat 02 collapsed because it is a full-body sprint, and now
    collapses HARDER with a stronger, cleaner face reference — which is the
    signature of a layout transfer, not a character transfer. A better picture of
    the character made the wrong-composition problem worse, not better.
  the_lever_is_closed: >-
    DO NOT RE-RUN A REFERENCE SWAP AGAINST A DIFFERENTLY-FRAMED BEAT. Swapping to
    the best possible reference — the one the founder himself chose — is the
    strongest version of this lever available, and it made the worst beat worse.
    Another reference will not fix beat 02.
    WHAT IS NOT CLOSED, and neither is queued or recommended here: conditioning
    a beat on a reference that MATCHES ITS OWN FRAMING (which would need an
    approved full-body drawing of him, and none exists), or dropping the adapter
