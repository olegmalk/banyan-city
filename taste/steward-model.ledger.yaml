- id: ep2-walk-evaluation-0812-instrumentation-claim-RETRACTED
  kind: correction
  date: 2026-08-12
  corrects: ep2-walk-evaluation-0812, key `defect_found_in_the_pass`
  status: RETRACTED — the claim was WRONG and it was on his page for two hours.
  what_i_claimed: >-
    That the round axis was partly inert instrumentation: that ten of thirteen dirs
    produced byte-identical output "across different references", that every sidecar
    recorded the SAME four references at the same scale and window including the dirs
    named cropscope/charref/headref/crossbeat, and therefore that half the pass rendered
    duplicates and the prior lane's three-lever findings rested on sidecars that could
    not tell the three apart.
  what_is_actually_true: >-
    I audited the wrong key. I read `ip_adapter_reference`, which records a FILENAME, and
    the pass reuses s0..s3 as slot labels — so of course it looked constant. The key that
    records identity is `ip_adapter_reference_sha256`, and it exists in every sidecar. Re-run
    against it, the shas explain every duplicate I found with nothing left over: the
    frozen dirs carry TWO distinct shas duplicated into four slots (74e7ad ×2, 1dc3d7 ×2),
    which is exactly why r0==r1 and r2==r3 byte-for-byte — BY CONSTRUCTION, not by defect;
    b04-frozen and b14-headref carry ONE sha in all four slots, so four identical outputs
    are the expected result of a deliberately single-crop round; cropscope, charref and
    guardfair carry FOUR distinct shas and produced sixteen distinct frames. The
    correlation with my own distinct-output counts is perfect. There is no defect, no
    wasted GPU time, and the consistency lane's three-lever findings and the staging wall
    STAND.
  how_i_got_it_wrong: >-
    I found a real pattern — the duplicate counts are correct and worth noticing — and
    then reached for the most dramatic explanation available instead of the cheapest one.
    A grep that returns a constant is evidence the field is not the discriminator at
    least as much as it is evidence the runs were identical, and I never checked which.
    Declaring another lane's instrumentation broken is exactly the claim that should have
    cost me one more grep before I published it.
  the_habit: >-
    Same family as hash-before-scoring, one level up: read a sidecar's ACTUAL KEYS before
    declaring what it fails to record. `grep -o '^\s*\w*:' <sidecar> | sort -u` is three
    seconds and would have shown me `ip_adapter_reference_sha256` sitting right there.
  what_survives: >-
    Nothing else in that entry changes. The eye-scoring is untouched and remains
    operative: 9/10 beats hold identity, staging is lost in eight, beat 02 fails identity
    outright, beat 04 passes both.
  outcome: null

