- id: ep2-b04-goblin-ipa-window-predicted
  date: 2026-08-10
  kind: prediction
  subject: "node 002b beat 04 — ARM 3, the denoise-step WINDOW. Does an
    IP-Adapter that is switched off partway through the denoise keep arm 1's
    single creature while handing the skin and the tusks back to the prompt?"
  steward_provisional: true
  pick: null
  scores: {}
  sealed: >-
    WRITTEN WHILE THE FRAMES ARE STILL CLOSED. Job
    ep2-b04-goblin-ipa-window-1786360023 was queued and had begun rendering
    before this record was written; no output frame has been opened, and the
    identity-agreement file does not exist yet. That ordering is the point of
    the record.
  the_lever_and_why_this_one: >-
    Arms 1 and 2 moved STRENGTH and LOCATION. Both bought identity with colour
    or colour with identity. The third axis had not been touched: in all forty
    cells rendered so far the reference conditions all forty denoise steps.
    Strength is close to exhausted downward — scale 0.40 was the floor tried and
    green was ALREADY gone there at 0.02 while identity held, so a finer sweep
    below 0.4 hunts a band the existing data suggests is narrow or absent. Time
    is untried and the mechanism argument is clean: coarse structure — WHICH
    CREATURE THIS IS — is settled in the earliest high-noise steps, surface
    colour late. Adapter on early, off late, should buy the creature from the
    steps that decide it and leave the skin to a text prompt that was drawing
    green 4 of 4 before any reference existed.
    Not invented here: this is the start_at / end_at timestep window that
    ComfyUI_IPAdapter_plus exposes on every advanced node, documented for
    exactly this use. diffusers has no such parameter, so it is assembled from
    two documented pieces of the pinned 0.29.2 build — callback_on_step_end, and
    set_ip_adapter_scale writing .scale on the IPAdapterAttnProcessor instances,
    an attribute confirmed by inspection of THIS build to be read on every
    forward pass. Zero prompt tokens added, as with arms 1 and 2.
  cells: >-
    Reference s0, scale 0.6, adapter on for the first 15% / 25% / 40% / 60% of
    40 steps (6 / 10 / 16 / 24 steps), four seeds each, byte-identical prompt,
    negative, seeds, steps, guidance and size. The control is an ALREADY
    RENDERED row — arm 1 ipa-r0-c060, which is the same everything with the
    adapter on for all forty steps. One variable.
  why_one_reference_and_why_it_is_not_a_pick: >-
    s0 is the reference of an existing measured row, so every cell differs from
    rendered frames by one thing. Same shape as arm 1's own 0.4/0.8 sweep on s0.
    Nobody has chosen a canonical goblin and this arm does not choose one; if a
    window holds, the next round runs it across all four references, which is
    where a mechanism claim would have to survive.
  the_sharpest_falsifiable_call_is_the_tusks: >-
    Record ep2-b04-goblin-ipa-observed established something better than any
    hue statistic for this test: on arm 1, tusks stopped being a prompt-level
    attribute and became a property of the reference. s0 is the ONE baseline
    frame with no tusks — a closed frown — and every arm-1 row built on it is
    0 of 4 tusked at mouth-level zoom, while the tag alone gave the baseline
    3 of 4. So the tusks are a CLEAN READOUT of who owns the late denoise. If
    the window works, the short windows hand the late steps back to the prompt
    and TUSKS SHOULD RETURN toward the baseline's 3 of 4 while the creature
    stays one creature. If tusks stay 0 of 4 at 15% and 25%, the window did not
    hand anything back and the mechanism claim is dead regardless of what the
    hue number says.
  predictions:
    identity: >-
      Holds at 40% and 60%, degrades at 15%. I expect w060 and w040 to look like
      arm-1 r0-c060 by eye — one creature four times — and w015 to be visibly
      looser, closer to the baseline's four creatures than to arm 1. Stated
      concretely so it can be wrong: at 15% I expect at least two of the four
      seeds to read as different creatures.
    green: >-
