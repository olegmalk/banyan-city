  the_lever: >-
    EXACTLY ONE VARIABLE against the crossbeat run: the reference image. The
    crossbeat rows conditioned on the four tags-only baseline frames
    (`04-the-footnote-wave1-s0..s3`) — the four different creatures the WORDS
    drew, none of which he has ever approved. This run conditions on
