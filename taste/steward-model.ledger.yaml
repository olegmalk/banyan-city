- id: ep2-b01-figgrow-055-r3-0812
  kind: prediction
  written: 2026-08-12, before enqueue. One variable class — fruit shape.
  predicates: [the fruit reads as a fig and not an apple 1/1, the camera is still locked
    1/1, the fruit stays a single fruit in one place as it did in r2]
  basis: >-
    r2's own positive prompt asked for a sphere twice — "one small ROUND green fig" that
    "ROUNDS and settles heavier" — and its negative said nothing about fruit at all. A
    green sphere on a stem IS an apple; the model drew what the words said. So the fix is
    words, not weights: the silhouette a fig actually has (teardrop, heavy and wide low,
    tapering to a narrow neck at the stem) in the positive with "round" deleted from it,
    and apple/green apple/round fruit/spherical fruit/cherry/berry in the negative placed
    right after the camera block so truncation cannot reach them. Naming the defect in the
    negative at guidance 2.0 is the lever with two measured wins behind it now (the camera
    pan, and the camera lock holding in both b04 clips).
  falsifiable_by: >-
    Still an apple. That would mean the token "fig" carries a round prior this model will
    not give up to description, and the honest next move is a shape the init already has
    rather than a longer sentence.
  also_fixed_but_not_the_variable: >-
    The init is sha-asserted before the crop (r2 asserted nothing) and there is a PUBLISH
    STEP. r2 rendered and then stranded on the box for want of one, which is why he saw it
    late. Both are defect fixes, not recipe choices.
  consumer: his screening, and the cold open is the first six seconds of the episode.
  outcome: null

