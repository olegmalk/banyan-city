    cagliostrolab/animagine-xl-3.1, already local on the box and already declared
    in every beat-01 sidecar — CreativeML Open RAIL++-M, whose use restrictions
    travel to the output and are already tracked as D15. The one alternative that
    would have needed a download, diffusers/stable-diffusion-xl-1.0-inpainting-0.1
