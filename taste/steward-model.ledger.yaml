    different directory holding his pick under the four filenames the sampler
    hardcodes; `goblin_ipa_sample.py` was not edited.
  the_result_and_it_is_a_CLEAN_NEGATIVE: >-
    IT DID NOT RESCUE BEAT 02, AND IT DID NOT FAIL IN THE SAME DIRECTION EITHER —
    IT FAILED WORSE.

    The four frames: s0 is an enormous dark dome filling the frame with a tiny
    green figure standing on a hill far below it. s1 is a bloated dark-teal
    creature with GLOWING RED EYES and a gritted mouth, belly filling the lower
