    explains every result this wave has produced and it is now hard to avoid.

    His pick is a HEAD FILLING THE FRAME. Conditioned on it, beat 02 came back
    with a HEAD FILLING THE FRAME — a huge round dome — layered over a full-body
    sprint the beat's own prompt is still asking for. The two fight, and what
    comes out is a giant looming skull above a miniature landscape. The adapter
